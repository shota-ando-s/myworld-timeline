        url: https://ja.wikipedia.org/wiki/真珠湾攻撃

  - id: japan-surrender
    year: 1945
    title: ポツダム宣言受諾（敗戦）
    category: war
    tags: [日本, 第二次世界大戦]
    summary: 広島・長崎への原爆投下とソ連参戦を経て降伏し、占領下で戦後改革が始まった。
    detail: |
      日本がポツダム宣言を受け入れて降伏し、第二次世界大戦が終わった出来事。
      1945年8月14日に受諾が決定され、翌15日に玉音放送で国民に伝えられた。
      降伏文書の調印は9月2日である。

      宣言は7月に米英中の名で発せられたが、日本政府はただちには応じなかった。
      8月6日に広島、9日に長崎へ原子爆弾が投下される。
      8日にはソ連が中立条約を破って参戦し、満洲へ侵攻した。
      御前会議では意見が割れ、天皇の裁断によって受諾が決まる。

      終戦を阻もうとする一部の将校が宮城を占拠する事件も起きたが、失敗した。
      15日正午、天皇の肉声による放送が流れ、戦争の終結が国民に知らされる。
      各地の戦場では、その後も戦闘や混乱が続いた。

      日本人の死者は軍民合わせて300万人を超え、アジア各地ではそれをはるかに上回る犠牲が出ていた。
      都市は空襲で焼かれ、食糧も住居も不足する。
      海外には600万を超える軍人と民間人が残され、引き揚げは長期に及んだ。
      8月15日は終戦の日とされ、毎年追悼の式典が行われている。
      この日を境に、占領下での戦後改革が始まった。
      受諾の条件をめぐって、天皇の地位をどう扱うかが最後まで問題になった。
      終戦の日付は、降伏文書に調印した9月2日を採る国も多い。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/President_Truman_announces_Japan%27s_surrender.jpg/500px-President_Truman_announces_Japan%27s_surrender.jpg
      credit: Abbie Rowe, U.S. National Park Service / Public domain
      page: https://commons.wikimedia.org/wiki/File:President_Truman_announces_Japan%27s_surrender.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ポツダム宣言

  - id: japan-constitution
    year: 1946
    title: 日本国憲法の公布
    category: society
    tags: [日本, 戦後]
    summary: 主権在民・戦争放棄・基本的人権を柱とし、現在まで一度も改正されていない。
    detail: |
      1946年11月3日に公布され、翌年5月3日に施行された憲法。
      国民主権・戦争放棄・基本的人権の尊重を三つの柱とする。
      施行以来、一度も改正されていない。

      占領下で、政府は大日本帝国憲法の小幅な修正案をまとめた。
      これを不十分としたGHQが、みずから草案を作成して提示する。
      政府はこれをもとに案を作り、帝国議会の審議を経て可決された。
      形式は明治憲法の改正だが、内容は全く別の原理に立っている。

      天皇は、国政に関する権能を持たない国民統合の象徴とされた。
      第9条は戦争の放棄と戦力の不保持を定め、世界でも例の少ない条文になっている。
      基本的人権は侵すことのできない永久の権利とされ、法律によって制限できるとした明治憲法とは異なる。
      国会が国権の最高機関とされ、内閣は国会に責任を負う議院内閣制がとられた。

      制定の過程が占領下であったことから、押しつけだという議論が長く続いてきた。
      一方で、施行後の世論調査では一貫して高い支持が示されている。
      第9条と自衛隊の関係、緊急事態の規定など、改正をめぐる論点は現在も残る。
      戦後日本の社会と政治の枠組みは、この憲法の上に築かれた。
      公布の11月3日は文化の日、施行の5月3日は憲法記念日として祝日になっている。
      前文に示された平和と国際協調の理念は、外交の基本にも据えられてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Constitution_of_Japan_origin_signatures_20140506.jpg/500px-Constitution_of_Japan_origin_signatures_20140506.jpg
      credit: Ryo FUKAsawa / CC BY 2.0
      page: https://commons.wikimedia.org/wiki/File:Constitution_of_Japan_origin_signatures_20140506.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日本国憲法

  - id: san-francisco-treaty
    year: 1951
    title: サンフランシスコ講和条約
    category: politics
    tags: [日本, 戦後]
    summary: 独立を回復すると同時に、日米安保条約で西側陣営に位置づけられた。
    detail: |
      日本と連合国48か国が結んだ講和条約で、1951年9月に署名された。
      翌1952年4月に発効し、日本は独立を回復する。
      同じ日に日米安全保障条約が結ばれた。

      冷戦の進行により、アメリカは日本を早期に独立させて西側に組み込む方針をとった。
      条約は賠償を厳しく求めず、日本の再建に配慮した内容になっている。
      日本は台湾・南樺太・千島列島・朝鮮に対するすべての権利を放棄した。

      ソ連・ポーランド・チェコスロバキアは会議に出席したが署名しなかった。
      中国は、どちらの政府を招くかで対立が生じたため招かれていない。
      韓国とインドも参加せず、講和は一部の国との間にとどまる。
      このため国内では、すべての交戦国との全面講和を求める意見が強く主張された。

      同日に署名された日米安保条約により、独立後も米軍は日本に駐留を続けた。
      沖縄と小笠原はアメリカの施政下に置かれ、日本の主権は及ばない。
      独立の回復と、安全保障上の従属が同時に決まったことになる。
      この枠組みは現在まで日本の対外関係の基本であり続けている。
      ソ連との国交回復は1956年、中国とは1972年まで待つことになった。
      領土の帰属が明記されなかったことが、北方領土の問題の背景にもなっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/Yoshida_signs_San_Francisco_Peace_Treaty.jpg/500px-Yoshida_signs_San_Francisco_Peace_Treaty.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Yoshida_signs_San_Francisco_Peace_Treaty.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日本国との平和条約

  - id: tokyo-olympics-1964
    year: 1964
    title: 東京オリンピックと東海道新幹線
    category: society
    tags: [日本, 高度成長]
    summary: 戦後復興を世界に示す舞台。同じ年に開業した新幹線は高速鉄道の先駆けになった。
    detail: |
      アジアで初めて開かれたオリンピックと、東海道新幹線の開業が重なった年。
      新幹線は10月1日、五輪は10月10日に始まった。
      戦後復興の達成を世界に示す舞台になった。

      東京は1940年の五輪の開催権を得ながら、戦争のため返上していた。
      1964年の開催は、その雪辱という意味も持つ。
      首都高速道路、地下鉄、上下水道、ホテルが急ピッチで整備され、都市の姿が一変した。
      開会式は衛星中継で世界に送られ、カラーテレビの普及も進む。

      東海道新幹線は、東京と大阪を4時間で結んだ。
      専用の線路を高速で走る鉄道として、世界に先駆けた存在になる。
      当時、鉄道は自動車と航空機に押されて衰退すると考えられていた。
      その常識を覆し、各国の高速鉄道の手本になっている。

      二つの事業は、日本の技術と組織力を国内外に印象づけた。
      国民の側も、戦後の困難を抜け出したという実感を共有する。
      一方で、開発は東京への集中を進め、地方との格差も広がった。
      五輪の後には反動の不況が訪れ、経済は一時的に落ち込んでいる。
      聖火の最終走者は、広島に原爆が投下された日に生まれた青年だった。
      五輪に合わせて整備された施設の多くは、現在も使われ続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Tokyo_1964_Summer_Olympics_logo.svg/500px-Tokyo_1964_Summer_Olympics_logo.svg.png
      credit: Yusaku Kamekura / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tokyo_1964_Summer_Olympics_logo.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/1964年東京オリンピック

  - id: okinawa-return
    year: 1972
    title: 沖縄返還
    category: politics
    tags: [日本, 戦後]
    summary: 27年間の米国統治が終わったが、米軍基地の集中は今も続いている。
    detail: |
      アメリカの施政下にあった沖縄が日本に復帰した出来事で、1972年5月15日に実現した。
      27年間続いた米国による統治が終わる。
      返還交渉は佐藤栄作内閣が進めた。

      沖縄戦の後、沖縄はサンフランシスコ講和条約でも日本の施政権から外された。
      住民はパスポートなしに本土へ渡れず、通貨はドル、車は右側通行だった。
      米軍基地の建設のため土地が強制的に接収され、事故や犯罪も相次ぐ。
      祖国復帰運動が高まり、日米双方にとって無視できない問題になった。

      1969年の首脳会談で、核兵器を撤去し本土と同じ扱いにするという条件で合意した。
      返還にあたって日本は米国に多額の支払いを行っている。
      後年、原状回復の費用を日本が肩代わりする密約や、核の再持ち込みを認める了解があったことが明らかになった。

      復帰によって法制度と通貨は本土と同じになったが、基地は残った。
      国土面積の0.6パーセントの沖縄に、在日米軍の専用施設の7割が集中する状態が続いている。
      普天間飛行場の移設問題は、現在も解決していない。
      復帰の日は、沖縄では喜びと落胆が入り混じる日として記憶されてきた。
      返還に伴い、通貨はドルから円へ、車の通行は右側から左側へと切り替えられた。
      沖縄の経済は基地に依存する構造が残り、その転換が課題であり続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/84/Naha_Shuri_Castle51s3s4200.jpg/500px-Naha_Shuri_Castle51s3s4200.jpg
      credit: 663highland / CC BY 2.5
      page: https://commons.wikimedia.org/wiki/File:Naha_Shuri_Castle51s3s4200.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/沖縄返還

  - id: plaza-accord
    year: 1985
    title: プラザ合意
    category: economy
    tags: [日本, 世界経済]
    summary: 急激な円高が輸出産業を直撃し、金融緩和がバブルの引き金になった。
    detail: |
      先進5か国の財務相と中央銀行総裁が、ドル高の是正で合意した取り決め。
      1985年9月、ニューヨークのプラザホテルで発表された。
      急激な円高が日本の産業を直撃し、その後の金融緩和がバブルの引き金になる。

      当時のアメリカは、財政赤字と貿易赤字という二つの赤字を抱えていた。
      高金利によってドルが買われ、輸出産業が苦しんでいる。
      日本の対米貿易黒字は政治問題となり、自動車や半導体で摩擦が激化していた。
      協調介入によってドルを下げることが、参加国の利害の一致点になる。

      合意の効果はすぐに現れた。
      1ドル240円台だった為替は、1年後には150円台まで円高が進む。
      輸出企業の採算は悪化し、地方の工場は閉鎖や海外移転を迫られた。
      この円高不況に対応するため、日本銀行は公定歩合を引き下げて金融を緩和する。

      低金利で生まれた資金は、土地と株式に流れ込んだ。
      地価は数年で数倍になり、株価も急騰してバブル経済が生まれる。
      企業は海外の資産を買い、その動きが摩擦をさらに招いた。
      1990年代に入って政策が転換されると、資産価格は一気に崩れる。
      為替の調整が国内の経済政策を通じて別の問題を生んだ例として、繰り返し検証されてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Plaza_hotel.jpg/500px-Plaza_hotel.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Plaza_hotel.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/プラザ合意

  - id: bubble-burst
    year: 1991
    circa: true
    title: バブル経済の崩壊
    category: economy
    tags: [日本, 停滞]
    summary: 地価と株価の急落が金融機関を傷め、「失われた30年」と呼ばれる停滞に入った。
    detail: |
      1980年代後半に膨らんだ資産価格の高騰が終わり、急落に転じた出来事。
      株価は1989年末に頂点を打ち、地価は1991年ごろから下がり始めた。
      ここから失われた30年と呼ばれる長い停滞が始まる。

      プラザ合意後の金融緩和で生まれた資金が、土地と株に集中していた。
      土地の値段は下がらないという思い込みが広がり、企業も個人も借金で資産を買う。
      東京の地価でアメリカ全土が買えるといわれるほどの水準に達した。

      政府と日銀は、地価の高騰を抑えるために対策をとる。
      不動産向けの融資を制限する総量規制が導入され、公定歩合が段階的に引き上げられた。
      資産価格は反転して下落し、担保の価値が失われる。
      企業と銀行には返済されない融資が大量に残り、不良債権となった。

      処理は先送りされ、1997年からの金融危機で一気に表面化する。
      大手の銀行と証券会社が破綻し、公的資金が投入された。
      企業は設備と雇用を絞り、新卒の採用を抑えたため就職氷河期が生まれる。
      物価が下がり続けるデフレが続き、経済の成長率は長く低迷した。
      資産価格の高騰がどのように崩れるかという教訓は、各国の政策にも参照されている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/バブル景気

  - id: kobe-earthquake
    year: 1995
    title: 阪神・淡路大震災
    category: disaster
    tags: [日本, 災害]
    summary: 6400人以上が犠牲になり、災害ボランティアと耐震基準の見直しが進んだ。
    detail: |
      1995年1月17日の早朝に兵庫県南部で発生した地震による災害。
      死者は6434人にのぼり、戦後では当時最大の震災となった。
      都市の直下で起きた地震の恐ろしさを示した。

      マグニチュードは7.3で、震源が浅く、神戸と淡路島の直下だった。
      古い木造住宅が倒壊し、その下敷きになった圧死が犠牲の多くを占める。
      倒壊を免れた地域でも火災が広がり、水道が断たれて消火が難しかった。
      高速道路の高架が横倒しになり、安全と信じられていた構造物の脆さが明らかになる。

      初動の対応は遅れた。
      情報の集約と自衛隊の派遣要請に時間がかかり、危機管理の仕組みが問われる。
      一方で、全国から延べ100万人を超えるボランティアが集まった。
      この年は災害ボランティア元年と呼ばれ、後の特定非営利活動促進法につながる。

      建築基準法が改正され、耐震の基準と既存建物の診断が強化された。
      高速道路と鉄道の橋脚も補強が進められる。
      被災者生活再建支援法が作られ、個人の住宅再建への公的な支援も始まった。
      都市が集中して機能する社会の弱点を、この震災は具体的に示している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/%E9%98%AA%E7%A5%9E%E6%B7%A1%E8%B7%AF%E5%A4%A7%E9%9C%87%E7%81%BD%E9%AB%98%E6%9E%B6%E9%AB%98%E9%80%9F%E5%80%92%E5%A3%8A.jpg/500px-%E9%98%AA%E7%A5%9E%E6%B7%A1%E8%B7%AF%E5%A4%A7%E9%9C%87%E7%81%BD%E9%AB%98%E6%9E%B6%E9%AB%98%E9%80%9F%E5%80%92%E5%A3%8A.jpg
      credit: シンラ / CC0
      page: https://commons.wikimedia.org/wiki/File:%E9%98%AA%E7%A5%9E%E6%B7%A1%E8%B7%AF%E5%A4%A7%E9%9C%87%E7%81%BD%E9%AB%98%E6%9E%B6%E9%AB%98%E9%80%9F%E5%80%92%E5%A3%8A.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/阪神・淡路大震災

  - id: tohoku-earthquake
    year: 2011
    title: 東日本大震災
    category: disaster
    tags: [日本, 災害, 原発]
    summary: 津波と原発事故が重なり、エネルギー政策と防災の前提が問い直された。
    detail: |
      2011年3月11日に発生した東北地方太平洋沖地震と、それによる震災。
      マグニチュード9.0は日本の観測史上最大で、世界でも有数の規模だった。
      津波と原子力発電所の事故が重なった複合災害である。

      地震そのものよりも、津波の被害が圧倒的だった。
      高さ10メートルを超える波が三陸から関東までの沿岸を襲い、町ごと流された地域もある。
      死者と行方不明者は約2万2000人にのぼり、その9割以上が溺死とされる。
      避難のあり方や防潮堤の限界が、あらためて問われた。

      福島第一原子力発電所では、津波によって電源が失われた。
      炉心が冷却できなくなり、三つの原子炉で燃料が溶け落ちる事故となる。
      水素爆発で建屋が壊れ、放射性物質が広範囲に拡散した。
      十数万人が避難を強いられ、帰還できない地域が今も残る。

      事故を受けて全国の原子力発電所が停止し、エネルギー政策は根本から見直された。
      再生可能エネルギーの導入が進む一方、火力への依存と電力コストの問題が残る。
      防災では、想定を超える事態にどう備えるかという議論が深まった。
      復興は長期にわたり、人口の流出と地域の再生が課題であり続けている。
