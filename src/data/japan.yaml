  - id: michinaga
    year: 1016
    title: 藤原道長が摂政になる
    category: politics
    tags: [日本, 藤原氏]
    summary: 「この世をば我が世とぞ思ふ」と詠んだ摂関政治の絶頂期。
    detail: |
      藤原道長が摂政に就き、摂関政治が頂点に達した年。
      孫にあたる9歳の後一条天皇が即位し、外祖父として政務を執ることになった。
      道長はすでに20年にわたり実権を握っており、摂政就任はその地位を形の上でも確定させるものだった。
      翌年には子の頼通に摂政を譲り、一族による継承を確かなものにしている。

      権力の源は、娘を天皇に嫁がせて生まれた子を次の天皇に立てる仕組みにあった。
      道長は4人の娘を天皇や皇太子に入内させ、3代の天皇の外祖父となる。
      母方の祖父として幼い天皇に近侍し、人事と政務を左右した。
      1018年、三人目の娘が皇后になった祝いの宴で、この世を我が世と思う、満月に欠けたところもない、という歌を詠んだと伝えられる。
      この歌は同時代の公卿の日記に書き留められており、当時から権勢の象徴として知られていた。

      政治は、公卿が先例に照らして合議する形で運営された。
      律令の官職は残っていたが、実際に物事を動かすのは家柄と人脈である。
      地方は受領と呼ばれた国司に任され、彼らは任地で蓄えた富を都の有力者に贈って次の任官を得た。
      寄進された荘園が、摂関家の経済的な基盤を支えている。

      この絶頂は長くは続かなかった。
      子の頼通の代には娘に皇子が生まれず、外戚の関係が切れる。
      1068年に藤原氏を外戚としない後三条天皇が即位すると、荘園の整理が進められた。
      続く白河上皇の院政によって、摂関家の力はさらにそがれていく。
      日記や物語が多く残るため、この時代の宮廷生活は細部まで分かっている。
      道長の栄華は『栄花物語』や『大鏡』でも語り継がれた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/7/72/Fujiwara_no_Michinaga_2.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Fujiwara_no_Michinaga_2.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/藤原道長

  - id: genji-monogatari
    year: 1008
    circa: true
    title: 『源氏物語』が書かれる
    category: culture
    tags: [日本, 文学, 国風文化]
    summary: 宮廷の人間関係を描いた長編。かな文字が生んだ世界的にも早い時期の小説。
    detail: |
      紫式部が書いた全54帖の長編物語で、1008年ごろには読まれていたことが分かっている。
      主人公の光源氏とその子孫を軸に、70年余りにわたる宮廷の人間関係を描く。
      世界的にも早い時期の本格的な小説として知られる。

      作者の紫式部は中級貴族の家に生まれ、夫と死別したのちに藤原道長の娘である彰子に仕えた。
      漢籍の素養があり、宮仕えの経験がそのまま物語の背景になっている。
      『紫式部日記』に物語への言及があり、成立時期を知る手がかりとされてきた。

      内容は、恋愛と権力、栄華と無常が絡み合う。
      光源氏は帝の子でありながら臣下に降り、多くの女性と関わりながら政治的にも頂点に立つ。
      後半では出家や死が重く扱われ、最後の宇治十帖では次の世代の陰鬱な物語が語られる。
      登場人物の心理を細かく追う筆致が、この作品を単なる恋物語と分けている。

      かな文字で書かれたことが、この達成を可能にした。
      公の文章が漢文だった時代に、日本語の細やかな表現は女性の手による仮名文で育った。
      以後の和歌・連歌・能・浮世絵に題材を与え、日本文学の規範として読み継がれる。
      20世紀以降は多くの言語に訳され、古典文学として世界で読まれている。
      原本は残っておらず、鎌倉時代に藤原定家らが校訂した写本が本文の基礎になっている。
      物語のなかで引かれる和歌は800首近くにのぼる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/ba/Ch5_wakamurasaki.jpg/500px-Ch5_wakamurasaki.jpg
      credit: 土佐光起 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ch5_wakamurasaki.jpg
    links:
