  - id: masakado
    year: 935
    title: 平将門の乱
    category: war
    tags: [日本, 武士]
    summary: 関東で新皇を名乗った反乱。鎮圧を担った武士の力が中央に知られた。
    detail: |
      関東で平将門が起こした反乱で、935年の一族の私闘から始まった。
      939年には国府を襲って新皇を名乗り、朝廷に公然と反旗を翻す。
      ほぼ同じ時期に瀬戸内で藤原純友も乱を起こし、合わせて承平天慶の乱と呼ばれる。

      将門は桓武天皇の血を引く一族で、下総を拠点とする武士だった。
      所領と女性をめぐる一族内の争いが、次第に周辺の国府を巻き込む規模に広がる。
      国司と対立した在地の有力者が将門を頼ったことで、争いは国家への反抗に変わった。
      常陸・下野・上野の国府を落とし、関東八か国を支配下に置く。

      将門は新皇を称し、独自に国司を任命した。
      天皇を中心とする秩序の外で、武力によって支配を打ち立てようとした点が前例のない行動だった。
      しかし朝廷が追討を命じると、平貞盛と藤原秀郷の軍に攻められ、940年に戦死する。
      蜂起から2か月余りの短い天下だった。

      乱を鎮めたのは中央の軍ではなく、地方の武士たちだった。
      朝廷は自前の軍事力を失っており、武士に頼るほかないことが明らかになる。
      鎮圧に功のあった者は恩賞として地位を得て、武士の家が成長する足がかりを得た。
      将門は後に神として祀られ、関東の人々のあいだで長く語り継がれている。
      討たれた将門の首をめぐる伝説は各地に残り、東京の首塚は今も祀られている。
      朝廷が地方の武力を制御できないという構図は、この後も繰り返された。
