      page: https://commons.wikimedia.org/wiki/File:Emperor_Naruhito_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/令和

events:
  - id: na-no-kuni-gold-seal
    year: 57
    title: 奴国の王が後漢から金印を授かる
    category: politics
    tags: [日本, 外交]
    summary: 『後漢書』が伝える、日本列島の勢力が中国の王朝と結んだ最古級の記録。
    detail: |
      『後漢書』が伝える、倭の奴国の王が後漢の光武帝から印を授かった出来事。
      57年のことで、日本列島の勢力が中国の王朝と結んだ最も古い記録の一つである。
      奴国は、現在の福岡平野にあったと考えられている。

      当時の中国の王朝は、周辺の君長に印を与えて臣属の関係を示していた。
      印の材質と紐の色で相手の格が示され、金の印は高い扱いにあたる。
      使者を送って印を受け取ることは、地域の中で自らの地位を高める手段でもあった。

      1784年、博多湾の志賀島で農作業中に金印が見つかった。
      刻まれていたのは漢委奴国王の五文字である。
      発見の経緯が曖昧なため、江戸時代に作られた偽物ではないかという議論が長く続いた。
      現在では、同時代の中国の印との比較から本物とする見方が定着している。

      読み方には、漢の委の奴の国王とする説のほか、いくつかの解釈がある。
      この印は、当時の列島が百余りの小国に分かれ、中国と個別に通じていたことを示す。
      国宝に指定され、福岡市博物館が所蔵している。
      文字資料の乏しい時代を知る、数少ない実物の史料である。
      同じころ、107年には倭国王の帥升が後漢に使いを送ったとも記録されている。
      中国の史書は、当時の倭が百余国に分かれていたと伝えている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/King_of_Na_gold_seal.jpg/500px-King_of_Na_gold_seal.jpg
      credit: "Original uploader: User:金翅大鹏鸟 at zh.wikipedia / Public domain"
      page: https://commons.wikimedia.org/wiki/File:King_of_Na_gold_seal.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/漢委奴国王印

  - id: himiko-envoy
    year: 239
    title: 卑弥呼が魏に使いを送る
    category: politics
    tags: [日本, 邪馬台国]
    summary: 「親魏倭王」の称号と銅鏡を受けたと『魏志』倭人伝が記す。
    detail: |
      邪馬台国の卑弥呼が魏に使いを送り、親魏倭王の称号を得た出来事。
      239年のことで、『魏志』倭人伝が経緯を記している。
      列島の勢力が中国の王朝と結んだ関係が、具体的に分かる最初の例である。

      魏は当時、遼東を押さえて朝鮮半島北部に帯方郡を置いていた。
      卑弥呼は難升米らを送り、奴隷と布を献じたとされる。
      魏は倭を厚く遇し、金印と紫のひもに加え、銅鏡100枚を与えた。
      背景には、南の呉を牽制するため東方の勢力を味方につけたい事情があったと考えられている。

      この後も使者の往来が続いた。
      狗奴国との争いでは、魏から軍旗が与えられ、役人が派遣されている。
      外交の後ろ盾を得ることが、倭の中での卑弥呼の地位を支えていた。

      授かったとされる銅鏡が何であるかは、長く議論されてきた。
      各地の古墳から出る三角縁神獣鏡をあてる説が有力だったが、中国では出土していない。
      日本製の可能性も指摘され、決着はついていない。
      この記事は、3世紀の列島の政治と社会を知るほぼ唯一の同時代の記録として重い価値を持つ。
      使者が通った道筋の記述は、帯方郡から倭へ至る当時の交通を知る材料にもなる。
      倭が中国の冊封の枠組みに入ったことは、東アジアの秩序に組み込まれたことを意味した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/卑弥呼

  - id: wa-king-bu
    year: 478
    title: 倭王武が宋に上表文を送る
    category: politics
    tags: [日本, 外交]
    summary: 中国の王朝に列島支配の承認を求めた文書。ヤマト政権の広がりを示す。
    detail: |
      倭王武が中国の南朝宋に送った上表文。
      478年のことで、『宋書』倭国伝に全文が収められている。
      雄略天皇にあたるとされる王が、自らの支配の正当性を中国に認めさせようとした文書である。

      文面は、祖先が自ら甲冑を身につけて各地を平定したと述べる。
      東は毛人の55国、西は衆夷の66国、さらに海を渡って95国を従えたという。
      数字は誇張を含むとしても、列島の広い範囲と朝鮮半島南部への関与を主張していることが読み取れる。

      目的は、高句麗への対抗だった。
      百済を助けて北上する高句麗を抑えるため、宋から軍事的な称号を得ようとする。
      宋は安東大将軍・倭王の称号を与えたが、朝鮮半島の諸国に対する支配の承認は限定的だった。

      この上表を最後に、倭は約1世紀にわたり中国へ使いを送らなくなる。
      次に通交が再開されるのは、7世紀の遣隋使の時である。
      漢文で書かれたこの文書は、当時の倭が中国の外交の作法と文章を使いこなしていたことを示す。
      国内向けには大王として振る舞い、対外的には中国の秩序に入るという二重の立場が読み取れる。
      この文章は、日本人が書いたと分かる最古級の漢文としても扱われている。
      中国の王朝の権威を借りて隣国に優位を示すやり方は、東アジアの外交の定石だった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/武_(倭王)

  - id: buddhism-to-japan
    year: 538
    circa: true
    title: 仏教の公式伝来
    category: religion
    tags: [日本, 仏教]
    summary: 百済の聖明王から欽明天皇へ仏像と経典が贈られたと伝わる（552年説もある）。
    detail: |
      百済の聖明王から欽明天皇へ仏像と経典が贈られ、仏教が公式に伝わったとされる出来事。
      『日本書紀』は552年とするが、他の史料にもとづく538年説が有力とされる。
      民間にはそれ以前から渡来人を通じて伝わっていたと考えられている。

      百済は高句麗と新羅に押されており、倭の軍事的な支援を必要としていた。
      仏教の伝来は、そうした外交の一環として行われている。
      先進の文物を受け入れるかどうかは、当時の朝廷にとって国の方針に関わる問題だった。

      受け入れをめぐって、蘇我氏と物部氏が対立した。
      蘇我氏は外来の神を祀るべきだと主張し、物部氏は国つ神の怒りを招くと反対する。
      疫病が流行すると仏像は難波の堀江に捨てられ、寺は焼かれた。
      587年に蘇我馬子が物部守屋を滅ぼし、この争いは決着する。

      以後、仏教は国家の保護のもとで広がった。
      飛鳥寺や四天王寺が建てられ、寺院の建築・造仏・暦・医学といった技術が渡来人によって伝えられる。
      仏教は信仰であると同時に、大陸の文明を一式で受け取る回路でもあった。
      奈良時代の国分寺、平安の密教へと続く流れが、ここから始まる。
      伝来の年代が二つ伝わるのは、根拠とする史料が異なるためである。
      受容をめぐる争いは、宗教の問題であると同時に、政権内の主導権争いでもあった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Japanese_Buddhist_flag.svg/500px-Japanese_Buddhist_flag.svg.png
      credit: "原作: Javierfv1212 ベクタ: Mrmw / Public domain"
      page: https://commons.wikimedia.org/wiki/File:Japanese_Buddhist_flag.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日本の仏教

  - id: shotoku-regent
    year: 593
    title: 聖徳太子が摂政になる
    category: politics
    tags: [日本, 飛鳥]
    summary: 中国にならった国家づくりが始まり、仏教が国の支えとして位置づけられた。
    detail: |
      推古天皇が即位し、厩戸王が政治に参画したと『日本書紀』が記す年。
      中国にならった国家づくりが始まり、仏教が国の支えとして位置づけられていく。
      日本で最初の女性の天皇の即位でもある。

      前年、崇峻天皇が蘇我馬子の意を受けた者に殺されるという異例の事態が起きていた。
      馬子は姪にあたる炊屋姫を即位させ、推古天皇とする。
      厩戸王は皇太子として、馬子とともに政務にあたったと伝えられる。
      蘇我氏という有力豪族と、天皇家の後継者が協力する体制だった。

      この年、大阪に四天王寺の造営が始まったとされる。
      以後の20年ほどで、冠位十二階、十七条憲法、遣隋使の派遣、国史の編纂が次々に行われた。
      仏教の受容を国の方針として確定させ、寺院を建てることが権威を示す新しい形になる。

      摂政という語は後世の制度を遡って当てたもので、当時の役割の実態ははっきりしない。
      厩戸王の事績も、『日本書紀』の編纂時に整えられた面があると指摘されている。
      それでも、この前後から中国式の制度が導入され始めたことは考古資料からも裏づけられる。
      天皇を中心に官僚が支える国家という構想は、ここを起点に150年かけて形になっていった。
      推古天皇の即位は、日本で確実に確認できる最初の女性天皇の例でもある。
      以後、奈良時代までに8代6人の女性天皇が立った。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Sh%C5%8Dtoku_Taishi_Sh%C5%8Dmanky%C5%8D_K%C5%8Dsan.jpg/500px-Sh%C5%8Dtoku_Taishi_Sh%C5%8Dmanky%C5%8D_K%C5%8Dsan.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Sh%C5%8Dtoku_Taishi_Sh%C5%8Dmanky%C5%8D_K%C5%8Dsan.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/聖徳太子

  - id: seventeen-articles
    year: 604
    title: 十七条憲法
    category: society
    tags: [日本, 法]
    summary: 役人の心構えを説いた文。「和をもって貴しとなす」の一節で知られる。
    detail: |
      厩戸王が定めたと『日本書紀』が伝える、17か条からなる訓戒。
      604年の制定とされ、日本で最初の成文法として扱われてきた。
      和をもって貴しとなす、という第一条の言葉で広く知られる。

      内容は、刑罰を定める法律ではなく、役人の心構えを説くものである。
      争わず議論を尽くすこと、仏法僧の三宝を敬うこと、天皇の命令をつつしんで受けることが説かれる。
      賄賂を戒め、訴訟を公平に扱い、農繁期に民を使役しないことも定められた。
      儒教の政治思想と仏教の教えを、実務の指針として組み合わせている点が特徴である。

      前年に定められた冠位十二階と合わせて読むと、その狙いが見えてくる。
      家柄で地位が決まる豪族の連合から、能力と役割で動く官僚の組織へ移そうとするものだった。
      豪族に対して、私の利益ではなく公の務めとして政治に当たれと求めている。

      成立年代については、後世に書かれたという説も古くから出されてきた。
      用いられている語彙が7世紀後半以降のものだという指摘が、その根拠である。
      ただし、この時期に中国の政治思想が受け入れられていたこと自体は疑われていない。
      日本の政治文化で、合議と調和を重んじる態度の源としてしばしば引かれる文章になっている。
      現存するのは『日本書紀』に収められた形で、原本は伝わっていない。
      近代以降も、憲法という言葉の重みからしばしば政治的に引用されてきた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/十七条憲法

  - id: kenzuishi
    year: 607
    title: 遣隋使の派遣
    category: politics
    tags: [日本, 外交]
    summary: 「日出づる処の天子」の国書で、中国に対等を主張しようとした。
    detail: |
      推古朝の倭国が隋へ送った使節。
      600年から618年のあいだに数回派遣され、なかでも607年のものがよく知られる。
      制度と技術を学ぶと同時に、中国との関係を組み直す狙いがあった。

      607年の使者は小野妹子で、日の出る国の天子が日の没する国の天子へ書を送るという書き出しの国書を携えた。
      隋の煬帝はこれを無礼として不快を示したと『隋書』は記す。
      それまでの倭は、中国の皇帝から称号を受ける立場にあった。
      この国書は、臣属ではなく対等の関係を主張しようとしたものと読まれている。

      隋が使者を受け入れたのは、高句麗との対立を抱えていたためだと考えられている。
      翌年には裴世清が返礼の使者として来日し、倭の朝廷で歓待された。
      妹子は再び隋へ渡り、このとき高向玄理・僧旻・南淵請安らの留学生と学問僧が同行する。

      彼らは20年以上にわたって中国に留まり、隋から唐への交代も目にした。
      帰国後は、大化の改新をはじめとする国家づくりの中枢で知識を提供している。
      制度を輸入するには、それを理解した人材が必要だということを示す例になった。
      隋が滅びた後、この関係は遣唐使に引き継がれていく。
      国書の文言は、中国の皇帝を中心とする世界観にどう向き合うかという問題を最初に突きつけた。
      倭が自らを天子と称したことは、律令国家の自意識の出発点として読まれている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/遣隋使

  - id: isshi-incident
    year: 645
    title: 乙巳の変（大化の改新のはじまり）
    category: politics
    tags: [日本, 改革]
    summary: 蘇我氏を倒し、中国にならった中央集権国家づくりが始まった。
    detail: |
      中大兄皇子と中臣鎌足が、朝廷の儀式の場で蘇我入鹿を殺害した政変。
      645年に起き、蘇我氏の本宗家はこれによって滅んだ。
      その後に進められた一連の改革を、大化の改新と呼ぶ。

      蘇我氏は仏教の受容を主導して以来、天皇家と姻戚を重ねて権勢を握っていた。
      入鹿は聖徳太子の子である山背大兄王の一族を滅ぼし、専横が目立つようになる。
      中大兄皇子と中臣鎌足は、留学から帰った学者たちの知識も得ながら計画を練った。

      朝鮮半島の使者を迎える儀式の最中、宮中で入鹿は斬られた。
      父の蝦夷は翌日、邸宅に火を放って自害する。
      難を逃れた孝徳天皇が即位し、都は難波へ移された。
      中大兄皇子は皇太子として実権を握り、改革を主導する。

      翌年の改新の詔では、豪族の私有地と私有民を廃して公のものとし、戸籍と班田収授を整えるとされた。
      国・郡・里の区分を設け、租庸調による税制を敷く方針も示される。
      この詔の文面は後の律令の言葉で整えられており、当時どこまで実行されたかは議論がある。
      それでも、豪族の連合から中央集権の国家へ舵を切った転換点として位置づけられている。
      大化は日本で最初の元号とされ、以後の年の数え方の起点になった。
      中大兄皇子が即位するのは20年以上あとの天智天皇としてである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/Irukaansatsuzu.jpg/500px-Irukaansatsuzu.jpg
      credit: Gukei Sumiyoshi / Public domain
      page: https://commons.wikimedia.org/wiki/File:Irukaansatsuzu.jpg
    links:
