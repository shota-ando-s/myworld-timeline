lane: japan

periods:
  - id: jomon
    title: 縄文時代
    start: -3500
    startCirca: true
    end: -900
    endCirca: true
    category: society
    tags: [日本, 先史]
    summary: 狩猟採集を基盤に定住と土器づくりが続いた長い時代。
    detail: |
      実際の始まりは紀元前1万4000年頃までさかのぼるが、この年表の左端は紀元前3500年のため
      途中から描いている。世界四大文明が都市を築いていた頃、日本列島では大規模な農耕を伴わない
      定住生活が長く続いていた。

  - id: yayoi
    title: 弥生時代
    start: -900
    startCirca: true
    end: 250
    endCirca: true
    category: society
    tags: [日本, 稲作]
    summary: 大陸から水稲耕作と金属器が伝わり、むらがくにへとまとまっていった。

  - id: kofun
    title: 古墳時代
    start: 250
    startCirca: true
    end: 592
    category: politics
    tags: [日本, ヤマト政権]
    summary: 巨大古墳が各地に築かれ、ヤマト政権が列島の広い範囲をまとめた。

  - id: asuka
    title: 飛鳥時代
    start: 592
    end: 710
    category: politics
    tags: [日本]
    summary: 仏教と中国風の律令制度を取り入れ、天皇を中心とする国家の形が整えられた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/飛鳥時代

  - id: nara
    title: 奈良時代
    start: 710
    end: 794
    category: politics
    tags: [日本, 律令]
    summary: 平城京を都とし、律令国家と国家仏教が最も整った時期。

  - id: heian
    title: 平安時代
    start: 794
    end: 1185
    category: politics
    tags: [日本, 貴族]
    summary: 摂関政治から院政へ。国風文化が花開き、やがて武士が台頭する。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/平安時代

  - id: sekkan-politics
    title: 摂関政治
    start: 967
    end: 1068
    category: politics
    tags: [日本, 藤原氏]
    summary: 藤原氏が天皇の外戚として実権を握った約100年。貴族文化の最盛期にあたる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/摂関政治

  - id: insei
    title: 院政
    start: 1086
    end: 1185
    category: politics
    tags: [日本, 天皇]
    summary: 退位した上皇が実権を握る仕組み。摂関家の力を削ぐ一方、武士の登用を進めた。

  - id: kamakura
    title: 鎌倉時代
    start: 1185
    end: 1333
    category: politics
    tags: [日本, 武家]
    summary: 初の本格的な武家政権。元寇を退けたのち御家人の不満から倒れた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/鎌倉時代

  - id: nanbokucho
    title: 南北朝時代
    start: 1336
    end: 1392
    category: war
    tags: [日本, 内乱]
    summary: 二つの朝廷が並び立ち、全国の武士がどちらにつくかで争った56年。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/南北朝時代

  - id: muromachi
    title: 室町時代
    start: 1336
    end: 1573
    category: politics
    tags: [日本, 武家]
    summary: 足利将軍家の時代。日明貿易と禅の文化が栄えた一方、後半は幕府の統制が崩れた。

  - id: sengoku
    title: 戦国時代
    start: 1467
    end: 1590
    category: war
    tags: [日本, 内戦]
    summary: 応仁の乱から秀吉の全国統一まで、各地の大名が争った約120年。

  - id: azuchi-momoyama
    title: 安土桃山時代
    start: 1573
    end: 1603
    category: politics
    tags: [日本]
    summary: 信長・秀吉による統一事業と、豪壮な桃山文化の時代。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/安土桃山時代

  - id: edo
    title: 江戸時代
    start: 1603
    end: 1868
    category: politics
    tags: [日本, 幕藩体制]
    summary: 徳川幕府のもとで260年あまり大きな戦乱がなく、町人文化と国内経済が育った。
    detail: |
      参勤交代で大名の力を削ぎ、身分と土地を固定することで長い平和を実現した。
      その安定が都市と流通を育て、識字率や出版の水準は同時代の世界でも高い部類にあった。

  - id: meiji
    title: 明治時代
    start: 1868
    end: 1912
    category: politics
    tags: [日本, 近代化]
    summary: 近代国家への急速な組み替え。立憲制・産業化・対外戦争が一気に進んだ。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/明治

  - id: taisho
    title: 大正時代
    start: 1912
    end: 1926
    category: society
    tags: [日本, 民主化]
    summary: 政党政治と大衆文化が広がった「大正デモクラシー」の時代。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大正

  - id: showa
    title: 昭和時代
    start: 1926
    end: 1989
    category: politics
    tags: [日本]
    summary: 戦争と敗戦、占領、そして高度成長を一つの元号のうちに含む激動の63年。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/昭和

  - id: allied-occupation
    title: 連合国軍の占領
    start: 1945
    end: 1952
    category: politics
    tags: [日本, 戦後]
    summary: 憲法・農地・財閥・教育が短期間に作り替えられ、戦後日本の骨格ができた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/連合国軍占領下の日本

  - id: high-growth
    title: 高度経済成長
    start: 1955
    end: 1973
    category: economy
    tags: [日本, 戦後]
    summary: 年平均10%近い成長が続き、20年足らずで世界第2位の経済規模になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高度経済成長

  - id: heisei
    title: 平成時代
    start: 1989
    end: 2019
    category: politics
    tags: [日本]
    summary: バブル崩壊後の長い停滞と、震災・デジタル化に向き合った30年。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/平成

  - id: reiwa
    title: 令和時代
    start: 2019
    ongoing: true
    category: politics
    tags: [日本]
    summary: 人口減少と国際環境の変化のなかで始まった現在の元号。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/令和

events:
  - id: na-no-kuni-gold-seal
    year: 57
    title: 奴国の王が後漢から金印を授かる
    category: politics
    tags: [日本, 外交]
    summary: 『後漢書』が伝える、日本列島の勢力が中国の王朝と結んだ最古級の記録。

  - id: himiko-envoy
    year: 239
    title: 卑弥呼が魏に使いを送る
    category: politics
    tags: [日本, 邪馬台国]
    summary: 「親魏倭王」の称号と銅鏡を受けたと『魏志』倭人伝が記す。

  - id: wa-king-bu
    year: 478
    title: 倭王武が宋に上表文を送る
    category: politics
    tags: [日本, 外交]
    summary: 中国の王朝に列島支配の承認を求めた文書。ヤマト政権の広がりを示す。

  - id: buddhism-to-japan
    year: 538
    circa: true
    title: 仏教の公式伝来
    category: religion
    tags: [日本, 仏教]
    summary: 百済の聖明王から欽明天皇へ仏像と経典が贈られたと伝わる（552年説もある）。

  - id: shotoku-regent
    year: 593
    title: 聖徳太子が摂政になる
    category: politics
    tags: [日本, 飛鳥]
    summary: 中国にならった国家づくりが始まり、仏教が国の支えとして位置づけられた。

  - id: seventeen-articles
    year: 604
    title: 十七条憲法
    category: society
    tags: [日本, 法]
    summary: 役人の心構えを説いた文。「和をもって貴しとなす」の一節で知られる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/十七条憲法

  - id: kenzuishi
    year: 607
    title: 遣隋使の派遣
    category: politics
    tags: [日本, 外交]
    summary: 「日出づる処の天子」の国書で、中国に対等を主張しようとした。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/遣隋使

  - id: isshi-incident
    year: 645
    title: 乙巳の変（大化の改新のはじまり）
    category: politics
    tags: [日本, 改革]
    summary: 蘇我氏を倒し、中国にならった中央集権国家づくりが始まった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/乙巳の変

  - id: hakusukinoe
    year: 663
    title: 白村江の戦い
    category: war
    tags: [日本, 朝鮮, 唐]
    summary: 唐・新羅の連合軍に大敗。国防と国内統一を急ぐ動機になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/白村江の戦い
    related: [silla-unification]

  - id: jinshin-war
    year: 672
    title: 壬申の乱
    category: war
    tags: [日本, 内乱]
    summary: 皇位をめぐる内戦に勝った天武天皇のもとで、天皇の権威が大きく高まった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/壬申の乱

  - id: taiho-code
    year: 701
    title: 大宝律令
    category: society
    tags: [日本, 律令]
    summary: 唐にならった法典が整い、日本は律令国家として形を得た。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大宝律令

  - id: kojiki
    year: 712
    title: 『古事記』の成立
    category: culture
    tags: [日本, 書物]
    summary: 神話から歴代天皇までを一つの物語にまとめ、国の由来を語る書。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/古事記

  - id: nihon-shoki
    year: 720
    title: 『日本書紀』の成立
    category: culture
    tags: [日本, 書物]
    summary: 中国の史書にならった正史。対外的に国の歴史を示す目的があった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日本書紀

  - id: konden-law
    year: 743
    title: 墾田永年私財法
    category: society
    tags: [日本, 土地制度]
    summary: 開墾した土地の私有を認め、律令の土地制度が崩れて荘園が広がる起点になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/墾田永年私財法

  - id: great-buddha
    year: 752
    title: 東大寺大仏の開眼
    category: religion
    tags: [日本, 仏教]
    summary: 国家の総力を挙げた事業。仏教で国を守るという考えが極まった。

  - id: saicho-kukai
    year: 804
    title: 最澄と空海が唐へ渡る
    category: religion
    tags: [日本, 仏教]
    summary: 天台宗と真言宗が持ち帰られ、貴族から民衆まで届く日本仏教の土台になった。

  - id: kentoshi-end
    year: 894
    title: 遣唐使の停止
    category: politics
    tags: [日本, 外交]
    summary: 大陸からの直輸入が止まり、かな文字など日本独自の文化が育つ余地が生まれた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/遣唐使

  - id: masakado
    year: 935
    title: 平将門の乱
    category: war
    tags: [日本, 武士]
    summary: 関東で新皇を名乗った反乱。鎮圧を担った武士の力が中央に知られた。

  - id: michinaga
    year: 1016
    title: 藤原道長が摂政になる
    category: politics
    tags: [日本, 藤原氏]
    summary: 「この世をば我が世とぞ思ふ」と詠んだ摂関政治の絶頂期。

  - id: genji-monogatari
    year: 1008
    circa: true
    title: 『源氏物語』が書かれる
    category: culture
    tags: [日本, 文学, 国風文化]
    summary: 宮廷の人間関係を描いた長編。かな文字が生んだ世界的にも早い時期の小説。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/源氏物語

  - id: hogen-rebellion
    year: 1156
    title: 保元の乱
    category: war
    tags: [日本, 武士]
    summary: 貴族の争いが武士の力で決着し、武士が政治の主役になる流れが決定的になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/保元の乱

  - id: kiyomori-daijodaijin
    year: 1167
    title: 平清盛が太政大臣になる
    category: politics
    tags: [日本, 平氏]
    summary: 武士として初めて朝廷の頂点に立ち、日宋貿易で富を築いた。

  - id: dannoura
    year: 1185
    title: 壇ノ浦の戦い
    category: war
    tags: [日本, 源平]
    summary: 平氏が滅び、源頼朝による武家政権の成立へとつながった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/壇ノ浦の戦い

  - id: yoritomo-shogun
    year: 1192
    title: 源頼朝が征夷大将軍になる
    category: politics
    tags: [日本, 武家]
    summary: 武士による全国支配の枠組みが公式に認められた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/源頼朝

  - id: jokyu-war
    year: 1221
    title: 承久の乱
    category: war
    tags: [日本, 朝廷]
    summary: 上皇の倒幕計画を幕府が制し、武家が朝廷を上回る力を持つことが確定した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/承久の乱

  - id: goseibai-shikimoku
    year: 1232
    title: 御成敗式目
    category: society
    tags: [日本, 法]
    summary: 武士のための最初の体系的な法。以後の武家法の手本になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/御成敗式目

  - id: kamakura-buddhism
    year: 1224
    circa: true
    title: 鎌倉新仏教の広がり
    category: religion
    tags: [日本, 仏教]
    summary: 念仏や題目、坐禅など、庶民にも開かれた教えが相次いで現れた。

  - id: mongol-invasions-japan
    year: 1274
    title: 文永の役（元寇のはじまり）
    category: war
    tags: [日本, モンゴル]
    summary: 元と高麗の連合軍が九州北部に来襲。1281年の弘安の役でも撃退した。

  - id: kamakura-fall
    year: 1333
    title: 鎌倉幕府の滅亡
    category: politics
    tags: [日本, 武家]
    summary: 元寇の恩賞不足で御家人の不満が募り、150年続いた幕府が倒れた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/鎌倉幕府

  - id: takauji-shogun
    year: 1338
    title: 足利尊氏が征夷大将軍になる
    category: politics
    tags: [日本, 武家]
    summary: 京都に幕府を開き、朝廷と隣り合う形の武家政権が始まった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/足利尊氏

  - id: kango-trade
    year: 1404
    title: 勘合貿易のはじまり
    category: economy
    tags: [日本, 明, 交易]
    summary: 明の朝貢体制に入って銅銭と生糸を得た。幕府の重要な財源になった。

  - id: onin-war
    year: 1467
    title: 応仁の乱
    category: war
    tags: [日本, 内戦]
    summary: 京都を焼いた11年の内乱。幕府の権威が失われ戦国時代に入る。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/応仁の乱

  - id: teppo-tanegashima
    year: 1543
    title: 鉄砲伝来
    category: science
    tags: [日本, 技術, 南蛮]
    summary: 種子島に漂着したポルトガル人が火縄銃を伝え、戦い方と築城が変わった。

  - id: xavier-japan
    year: 1549
    title: ザビエルの来日
    category: religion
    tags: [日本, キリスト教]
    summary: キリスト教が伝わり、南蛮貿易とともに西日本の大名に影響を与えた。

  - id: muromachi-fall
    year: 1573
    title: 室町幕府の滅亡
    category: politics
    tags: [日本]
    summary: 織田信長が将軍を追放し、武力による全国統一の段階に入った。

  - id: nagashino
    year: 1575
    title: 長篠の戦い
    category: war
    tags: [日本, 鉄砲]
    summary: 鉄砲を組織的に使った戦い。戦術と城づくりが大きく変わった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/長篠の戦い

  - id: honnoji
    year: 1582
    title: 本能寺の変
    category: politics
    tags: [日本]
    summary: 統一目前の信長が倒れ、豊臣秀吉が後を継ぐ流れになった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/本能寺の変

  - id: katanagari
    year: 1588
    title: 刀狩令
    category: society
    tags: [日本, 身分]
    summary: 農民から武器を取り上げ、武士と農民を分ける身分制度を固めた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/刀狩

  - id: hideyoshi-unification
    year: 1590
    title: 豊臣秀吉の全国統一
    category: politics
    tags: [日本, 統一]
    summary: 100年以上続いた戦国の争乱が終わり、検地と身分制で全国が再編された。

  - id: sekigahara
    year: 1600
    title: 関ヶ原の戦い
    category: war
    tags: [日本]
    summary: 徳川家康が覇権を確立し、3年後の幕府開設につながった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/関ヶ原の戦い

  - id: shimabara-rebellion
    year: 1637
    title: 島原の乱
    category: war
    tags: [日本, キリスト教]
    summary: キリシタンと農民の蜂起。鎮圧後、禁教と貿易統制が決定的になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/島原の乱

  - id: sakoku
    year: 1639
    title: いわゆる鎖国の完成
    category: politics
    tags: [日本, 対外関係]
    summary: ポルトガル船の来航を禁止し、対外窓口を長崎・対馬・薩摩・松前に限った。

  - id: meireki-fire
    year: 1657
    title: 明暦の大火
    category: disaster
    tags: [日本, 江戸, 災害]
    summary: 江戸の大半を焼いた火災。以後の都市計画と防火体制を作り替えた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/明暦の大火

  - id: genroku-culture
    year: 1688
    circa: true
    title: 元禄文化
    category: culture
    tags: [日本, 町人文化]
    summary: 上方の町人が担い手になり、浮世草子・人形浄瑠璃・浮世絵が花開いた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/元禄文化

  - id: hoei-eruption
    year: 1707
    title: 宝永地震と富士山の噴火
    category: disaster
    tags: [日本, 災害]
    summary: 巨大地震の49日後に富士山が噴火し、関東一円に火山灰が降った。
