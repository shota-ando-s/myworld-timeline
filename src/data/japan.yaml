lane: japan

periods:
  - id: jomon
    title: 縄文時代
    start: -3500
    startCirca: true
    end: -900
    endCirca: true
    category: society
    tags: [日本, 先史]
    summary: 狩猟採集を基盤に定住と土器づくりが続いた長い時代。
    detail: |
      日本列島で1万年以上にわたって続いた、狩猟と採集を基盤とする時代。
      実際の始まりは紀元前1万4000年ごろまでさかのぼるが、この年表の左端が紀元前3500年のため途中から描いている。
      名は、縄を転がして文様をつけた土器に由来する。

      氷期が終わって温暖になり、列島には落葉広葉樹の森が広がった。
      ドングリやクリ、サケ、貝、シカやイノシシといった食料が安定して得られる環境である。
      人々は竪穴住居に住み、貝塚を残し、土器で煮炊きをした。
      農耕に頼らないまま定住が成り立った点が、世界史のなかでも珍しい。

      青森の三内丸山遺跡では、500年以上続いた大きな集落が確認されている。
      クリの林が人の手で管理され、遠くの産地の黒曜石やヒスイが持ち込まれていた。
      土偶や環状列石は、祭りや祈りの存在を示している。
      人口は最も多い時期で26万人ほどと推定される。

      紀元前1000年前後に気候が冷涼になり、食料の供給は不安定になった。
      そこへ大陸から水稲耕作が伝わり、生活の基盤が入れ替わっていく。
      縄文の人々が消えたわけではなく、渡来した人々と混じりながら次の時代へ続いた。
      大規模な戦争の跡がほとんど見られないことも、この時代の特徴として語られている。
      土器の使用開始は世界でも最も早い部類に入り、その年代は現在も更新されている。
      狩猟採集の社会が1万年続いたという事実は、農耕こそ進歩だという見方を問い直す材料にもなってきた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/縄文時代

  - id: yayoi
    title: 弥生時代
    start: -900
    startCirca: true
    end: 250
    endCirca: true
    category: society
    tags: [日本, 稲作]
    summary: 大陸から水稲耕作と金属器が伝わり、むらがくにへとまとまっていった。
    detail: |
      水稲耕作と金属器が大陸から伝わり、農耕社会へ移った時代。
      紀元前9世紀ごろから、前方後円墳が現れる3世紀半ばまでを指す。
      名は、最初に土器が見つかった東京の弥生町に由来する。

      稲作は朝鮮半島を経て北部九州に入り、数百年かけて東へ広がった。
      水田を作り、用水を引き、収穫を高床の倉に蓄える暮らしが定着する。
      土器は薄く実用的になり、青銅器と鉄器が同時に入ってきた。
      銅鐸や銅矛は祭りの道具として使われ、鉄は農具と武器に用いられる。

      蓄えられる作物ができたことで、社会は大きく変わった。
      余剰をめぐって争いが起き、濠や柵で囲まれた集落が各地に築かれる。
      吉野ヶ里のような環濠集落からは、矢を受けた人骨も見つかっている。
      有力な家が現れ、むらはくにへとまとまっていった。

      中国の史書は、この時期の列島を倭と呼んで記録している。
      57年には奴国の王が後漢から印を授かり、2世紀末には倭国が乱れたと伝える。
      3世紀には邪馬台国の卑弥呼が諸国に共立された。
      政治のまとまりが生まれ、次の古墳の時代へつながっていく。
      弥生人は渡来した人々と在来の人々が混じって形成されたと、人骨や遺伝子の研究が示している。
      稲作は北海道と南西諸島には広がらず、そこでは別の文化が続いた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/弥生時代

  - id: kofun
    title: 古墳時代
    start: 250
    startCirca: true
    end: 592
    category: politics
    tags: [日本, ヤマト政権]
    summary: 巨大古墳が各地に築かれ、ヤマト政権が列島の広い範囲をまとめた。
    detail: |
      巨大な墳墓が各地に築かれた時代で、3世紀半ばから6世紀末までを指す。
      代表的な形が、円と方形を組み合わせた前方後円墳である。
      この形が列島の広い範囲で共有されたことは、ヤマト政権の広がりを示すと考えられている。

      最大の大仙陵古墳は全長486メートルあり、体積では世界有数の墳墓になる。
      築造には膨大な人手と期間が必要で、動員できる力そのものが権威の証だった。
      墳丘には埴輪が並べられ、石室には鏡・玉・剣、のちには馬具や甲冑が納められる。
      副葬品の変化から、祭祀を担う王から軍事的な王へ性格が移ったと読まれてきた。

      ヤマト政権は、各地の豪族を氏と姓の秩序に組み込み、部民を通じて人と物を集めた。
      朝鮮半島の情勢に関わり、鉄資源と技術を求めて百済などと結ぶ。
      渡来人が須恵器・機織り・土木・文字をもたらし、政権の実務を支えた。

      5世紀には倭の五王が中国の南朝に使いを送り、称号を求めている。
      6世紀に入ると、群集墳が増えて有力者の層が広がり、巨大古墳の造営は減っていく。
      仏教が伝わると、権威を示す場は古墳から寺院へ移った。
      この時代に作られた支配の枠組みが、次の飛鳥時代の国家づくりの土台になる。
      前方後円墳は朝鮮半島南部にも数基見つかっており、その解釈は日韓の研究者のあいだで議論が続く。
      古墳の分布と大きさの序列から、当時の政治的な力関係が読み取られてきた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/古墳時代

  - id: asuka
    title: 飛鳥時代
    start: 592
    end: 710
    category: politics
    tags: [日本]
    summary: 仏教と中国風の律令制度を取り入れ、天皇を中心とする国家の形が整えられた。
    detail: |
      飛鳥に都が置かれた592年から、平城京に移る710年までの時代。
      中国にならった制度と仏教を取り入れ、天皇を中心とする国家の形が整えられた。
      狭くは、推古天皇の即位から大化の改新までを指すこともある。

      蘇我氏が物部氏を倒して政権の中心に立ち、推古天皇が即位して厩戸王が政治に参画した。
      冠位十二階で家柄によらない人材登用の道を開き、十七条憲法で役人の心得を示す。
      遣隋使を送って対等の立場を主張し、制度と文物を学ばせた。

      645年の乙巳の変で蘇我氏の本宗が倒れ、公地公民をめざす改革が始まる。
      663年の白村江の敗戦は、国防と国内統一を急ぐ動機になった。
      672年の壬申の乱に勝った天武天皇のもとで、天皇の権威は大きく高まる。
      天皇という称号や日本という国号が定まったのも、この時期と考えられている。

      701年の大宝律令によって、唐にならった法と官僚制が形を得た。
      飛鳥寺・法隆寺が建てられ、仏教美術と建築が花開く。
      藤原京という中国式の条坊の都も造営された。
      列島の政治が、東アジアの国際秩序のなかで作り替えられた時代である。
      この時代の宮は天皇の代ごとに移ることが多く、恒久的な都の観念はまだ薄かった。
      飛鳥の地には宮殿や寺院の跡が重なって残り、発掘によって国家形成の過程が確かめられている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/飛鳥時代

  - id: nara
    title: 奈良時代
    start: 710
    end: 794
    category: politics
    tags: [日本, 律令]
    summary: 平城京を都とし、律令国家と国家仏教が最も整った時期。
    detail: |
      平城京を都とした710年から、平安京へ移る794年までの時代。
      律令国家と国家仏教が最も整った時期にあたる。
      中国の長安を手本とした都に、10万人前後が暮らしたと推定される。

      律令の規定に沿って戸籍が作られ、口分田が配られ、租庸調が集められた。
      中央の官庁と地方の国府を、文書と駅の制度が結ぶ。
      和同開珎が鋳造され、貨幣の流通が試みられた。
      東北には城柵が築かれ、蝦夷と呼ばれた人々との戦いと交渉が続く。

      737年の天然痘の流行は、政権の中枢にいた藤原四兄弟を含む多数の命を奪った。
      聖武天皇は仏の力で国を安んじようと、国ごとに国分寺を建て、東大寺に大仏を造る。
      大仏の開眼供養にはインドや唐の僧も参列し、国際色の濃い儀式になった。
      遣唐使が持ち帰った文物は正倉院に伝えられ、シルクロードの東端の姿を今に残す。

      財政は大事業で逼迫し、743年の墾田永年私財法で開墾地の私有が認められた。
      公地公民の原則はここで崩れ始め、のちの荘園につながる。
      政界では藤原氏と皇族、僧の道鏡らが権力を争った。
      桓武天皇は寺院勢力の強い奈良を離れることを選び、都は北へ移る。
      『万葉集』が編まれ、天皇から庶民の歌までが同じ書物に収められた。
      都の造営と維持は地方からの税と労役に支えられ、逃亡する農民も多かった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/奈良時代

  - id: heian
    title: 平安時代
    start: 794
    end: 1185
    category: politics
    tags: [日本, 貴族]
    summary: 摂関政治から院政へ。国風文化が花開き、やがて武士が台頭する。
    detail: |
      794年の平安京への遷都から、1185年の鎌倉幕府の成立までの約390年。
      日本の歴史で最も長い時代区分の一つである。
      政治の形は、律令、摂関政治、院政へと移り、最後は武士が台頭した。
      都の名は現在の京都で、以後明治まで天皇の居所であり続ける。

      初期には桓武・嵯峨天皇のもとで律令の立て直しが図られた。
      しかし公地公民は崩れ、荘園が広がって国家の財政基盤は変質していく。
      10世紀には藤原氏が天皇の外戚として摂政・関白を独占し、摂関政治の時代に入った。
      1086年からは退位した上皇が政務を執る院政が始まり、摂関家の力は抑えられる。

      遣唐使が894年に止まると、大陸の様式を消化した国風文化が花開いた。
      かな文字が生まれ、『源氏物語』や『枕草子』が女性の手で書かれる。
      浄土信仰が広がり、平等院鳳凰堂のような阿弥陀堂が各地に建てられた。

      地方では、治安の悪化に対応して武装する者が現れ、武士が成長していく。
      平将門の乱や源平の抗争を経て、武力が政治を左右するようになった。
      1156年の保元の乱と1159年の平治の乱で武士の実力が示され、平清盛が政権を握る。
      1185年に平氏が滅び、源頼朝が鎌倉に武家政権を築いて、この時代は終わった。
      貴族の政治が長く続いた一方、地方では国司の苛政と武装が進んでいた。
      中央と地方の落差が、次の時代の担い手を生んだといえる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/平安時代

  - id: sekkan-politics
    title: 摂関政治
    start: 967
    end: 1068
    category: politics
    tags: [日本, 藤原氏]
    summary: 藤原氏が天皇の外戚として実権を握った約100年。貴族文化の最盛期にあたる。
    detail: |
      藤原氏の北家が天皇の外戚として摂政や関白を務め、政治を主導した体制。
      最も安定した時期は967年から1068年までのおよそ100年にあたる。
      摂政は幼い天皇に代わって政務を執り、関白は成人した天皇を補佐する役職である。

      藤原氏は、娘を天皇に嫁がせて生まれた子を次の天皇に立てるという方法で地位を固めた。
      母方の祖父として天皇に近く接し、人事と政務を左右する。
      866年に藤原良房が摂政、887年に基経が関白となり、969年の安和の変で他の有力氏族は排除された。
      以後、摂関の地位は藤原北家の一族が独占する。

      政治の実務は、公卿が集まって先例に照らし合わせて決める形で進んだ。
      律令の官職は残りながら、実態は家柄と人脈で動く世界になっている。
      地方は国司に任せきりとなり、受領と呼ばれた国司は任地で私腹を肥やした。

      経済を支えたのは、各地から寄進された荘園である。
      有力者の名義にすれば税を逃れられるため、土地が集まる仕組みができていた。
      道長・頼通の時代に全盛を迎えるが、外戚の関係を持たない後三条天皇が即位して転機が訪れる。
      荘園の整理が進められ、続く白河上皇の院政によって摂関家の力はそがれていった。
      この体制のもとで、儀式と先例に通じていることが政治の能力そのものになった。
      藤原氏の他の家系や源氏の貴族も、摂関家に従う形で官職を得ている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/摂関政治

  - id: insei
    title: 院政
    start: 1086
    end: 1185
    category: politics
    tags: [日本, 天皇]
    summary: 退位した上皇が実権を握る仕組み。摂関家の力を削ぐ一方、武士の登用を進めた。
    detail: |
      退位した天皇が上皇として政務を執る政治の形で、1086年の白河上皇に始まる。
      出家した場合は法皇と呼ばれた。
      天皇家の家長として実権を握る者を、治天の君という。
      摂関家が天皇の外戚として力を持つ構造を、内側から崩す仕組みだった。

      上皇には律令上の職責がないため、かえって自由に動けた。
      院庁という私的な機関が命令を出し、それが国政に通用する。
      人事や荘園の認可を上皇が握ったことで、貴族は院に接近するようになった。
      身辺を守る北面の武士が置かれ、平氏や源氏の武士が近くに仕える道が開かれる。

      経済の基盤は膨大な荘園だった。
      有力者は税を免れるために院へ土地を寄進し、その見返りに現地の管理権を確保する。
      八条院領や長講堂領と呼ばれる荘園群は、天皇家の財産として後世まで受け継がれた。
      一方で、国家が公領から税を取る仕組みはさらに細っていく。

      院政は、白河・鳥羽・後白河の三代でおよそ100年続いた。
      上皇と天皇、摂関家の内部対立が重なり、1156年の保元の乱では武士の力で決着がつけられる。
      武士を政治に引き入れたことが、やがて平氏政権と武家政権を生んだ。
      鎌倉幕府が成立した後も院政の形は残り、朝廷の側の意思決定の仕組みとして続いた。
      上皇が複数いる場合、誰が治天の君かをめぐって対立が起きることもあった。
      天皇の位を早く譲って院に入ることが、かえって権力への近道になっていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/%E7%99%BD%E6%B2%B3%E4%B8%8A%E7%9A%87%E3%81%AE%E5%BE%A1%E5%B9%B8.jpg/500px-%E7%99%BD%E6%B2%B3%E4%B8%8A%E7%9A%87%E3%81%AE%E5%BE%A1%E5%B9%B8.jpg
      credit: 高階隆兼（模写：板橋貫雄） / Public domain
      page: https://commons.wikimedia.org/wiki/File:%E7%99%BD%E6%B2%B3%E4%B8%8A%E7%9A%87%E3%81%AE%E5%BE%A1%E5%B9%B8.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/院政

  - id: kamakura
    title: 鎌倉時代
    start: 1185
    end: 1333
    category: politics
    tags: [日本, 武家]
    summary: 初の本格的な武家政権。元寇を退けたのち御家人の不満から倒れた。
    detail: |
      源頼朝が鎌倉に開いた武家政権のもとで営まれた時代で、1185年から1333年まで続いた。
      日本で最初の本格的な武家政権にあたる。
      朝廷は京都に存続し、二つの政権が並び立つ体制になった。

      幕府は、将軍と御家人が土地を仲立ちとして結ぶ関係で成り立っていた。
      将軍は所領を保証し、御家人は軍役と警護で応える。
      全国には守護と地頭が置かれ、治安と年貢の徴収を担った。
      頼朝の死後は北条氏が執権として実権を握り、1221年の承久の乱で朝廷を圧倒する。
      1232年には御成敗式目が定められ、武士の慣習にもとづく法が示された。

      13世紀後半には二度の元寇があり、御家人は多大な負担を強いられた。
      防衛戦であったため新たな土地は得られず、恩賞は不十分だった。
      分割相続の繰り返しで所領は細り、借金を抱える御家人が増える。
      幕府は徳政令で救おうとしたが、かえって信用を失った。

      文化の面では、力強い彫刻や写実的な絵巻が生まれ、禅宗が武士に受け入れられた。
      法然・親鸞・日蓮・道元らが、念仏や題目、坐禅によって救われる道を説く。
      1333年、後醍醐天皇の呼びかけに応じた足利尊氏や新田義貞によって幕府は滅ぼされた。
      武家が政権を担う形そのものは、以後600年以上続くことになる。
      幕府の所在地である鎌倉は、三方を山に囲まれ海に面した守りやすい土地だった。
      京都の朝廷と鎌倉の幕府という二つの中心が、この時代の政治を特徴づけている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/M%C5%8Dko_Sh%C5%ABrai_Ekotoba.jpg/500px-M%C5%8Dko_Sh%C5%ABrai_Ekotoba.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:M%C5%8Dko_Sh%C5%ABrai_Ekotoba.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/鎌倉時代

  - id: nanbokucho
    title: 南北朝時代
    start: 1336
    end: 1392
    category: war
    tags: [日本, 内乱]
    summary: 二つの朝廷が並び立ち、全国の武士がどちらにつくかで争った56年。
    detail: |
      京都の北朝と吉野の南朝という二つの朝廷が並び立った時代で、1336年から1392年まで続いた。
      足利尊氏が光明天皇を立て、後醍醐天皇が吉野へ逃れたことで始まる。
      全国の武士がどちらにつくかで争い、戦乱は各地に及んだ。

      南朝の正統性の根拠は、後醍醐天皇が三種の神器を持ち出したことだった。
      北朝は幕府の軍事力を背景に京を押さえ、実務の面では優位に立つ。
      南朝は楠木正行や北畠親房らが支えたが、勢力は次第に縮んでいった。

      長引いた理由の一つは、幕府の内紛である。
      1350年からの観応の擾乱で、尊氏と弟の直義が争い、一方が南朝と手を結ぶという事態が繰り返された。
      地方の武士も、所領争いの相手と反対の陣営につくことで争いを有利に運ぼうとする。
      南北の対立が、在地の争いを全国の構図に接続する枠組みとして使われた。

      戦費と兵の確保のため、幕府は守護に年貢の半分を軍の費用に充てる権限を与えた。
      守護は国内の武士を従えて力を強め、守護大名と呼ばれる存在になっていく。
      1392年、足利義満の仲介で南朝の後亀山天皇が神器を譲り、合一が実現した。
      交代で皇位を継ぐという約束は守られず、以後の天皇は北朝の系統が続いている。
      この時代の呼び名は、のちに正統をどちらに置くかという議論を呼んだ。
      南朝が正統とされたのは明治になってからである。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/南北朝時代

  - id: muromachi
    title: 室町時代
    start: 1336
    end: 1573
    category: politics
    tags: [日本, 武家]
    summary: 足利将軍家の時代。日明貿易と禅の文化が栄えた一方、後半は幕府の統制が崩れた。
    detail: |
      足利氏が京都に幕府を置いた時代で、1336年から1573年まで続いた。
      名は、3代将軍義満が造営した室町の邸宅に由来する。
      朝廷と隣り合わせで武家が政治を担う体制になった。

      前半は南北朝の内乱に費やされ、義満の代で合一が実現する。
      幕府は守護に大きな権限を与えて地方を治めさせたが、その守護が力を蓄えて自立していった。
      将軍の直轄軍は小さく、有力な守護の協力なしには政権が保てない構造である。
      義満は明と国交を結び、朝貢の形で貿易を行って幕府の財源とした。

      経済は大きく発展した。
      二毛作や水車が広まり、定期市が開かれ、座と呼ばれる同業組合が営業の権利を持つ。
      輸入された銅銭が流通し、借上や土倉といった金融業者が現れた。
      村では惣と呼ばれる自治組織が生まれ、年貢の減免を求めて土一揆を起こすようになる。

      1467年の応仁の乱で京は焼け、幕府の権威は失われた。
      以後は各地の大名が実力で領国を治める戦国の時代に入る。
      文化では、禅の影響を受けた北山文化と東山文化が生まれ、能・茶・生け花・水墨画・書院造が形を得た。
      現在の日本の生活様式の多くが、この時代に原型を持っている。
      幕府の財源は、直轄地の年貢よりも京の商工業への課税や貿易の利益に頼っていた。
      将軍と守護の力関係が、この時代の政治を動かす軸になっている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/室町時代

  - id: sengoku
    title: 戦国時代
    start: 1467
    end: 1590
    category: war
    tags: [日本, 内戦]
    summary: 応仁の乱から秀吉の全国統一まで、各地の大名が争った約120年。
    detail: |
      応仁の乱から豊臣秀吉の全国統一まで、各地の大名が争った約120年。
      幕府の統制が及ばなくなり、実力で領国を支配する者が現れた時代である。
      下の者が上の者を倒す下剋上が、各地で繰り返された。

      守護大名の多くは、家臣や国人に取って代わられた。
      北条早雲や斎藤道三のように、身分の低い出自から一国を握る者も現れる。
      大名たちは分国法を定めて家臣と領民を統制し、検地で土地と年貢を把握した。
      城のまわりに家臣と商人を集めた城下町が各地に生まれ、楽市によって商業が振興される。

      戦い方も変わった。
      騎馬武者の一騎討ちから、足軽を中心とする集団戦へ移る。
      1543年に鉄砲が伝わると、その生産と運用が勝敗を左右するようになった。
      城は山城から平城へ移り、石垣と堀を備えた防御に変わっていく。

      海外との関係も深まった。
      ポルトガル人との南蛮貿易で鉄砲と火薬の原料がもたらされ、キリスト教が広まる。
      石見銀山の銀が大量に輸出され、東アジアの交易を活気づけた。
      織田信長、豊臣秀吉、徳川家康という三人の手を経て、1590年に統一が実現する。
      戦乱の副産物として、技術・商業・都市が大きく発展した時代でもあった。
      終わりをどこに置くかは諸説あり、1573年の室町幕府滅亡や1615年の大坂の陣を採る見方もある。
      各地の大名が競った結果、鉱山開発や治水などの技術も大きく進んだ。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/戦国時代

  - id: azuchi-momoyama
    title: 安土桃山時代
    start: 1573
    end: 1603
    category: politics
    tags: [日本]
    summary: 信長・秀吉による統一事業と、豪壮な桃山文化の時代。
    detail: |
      織田信長と豊臣秀吉が中央の政権を握った時代で、1573年から1603年までを指す。
      名は、信長の安土城と、秀吉の伏見城があった桃山に由来する。
      戦国の争乱が終わり、近世の社会の枠組みが作られた時期にあたる。

      信長は室町幕府を終わらせ、寺社や座の特権を壊して統一を進めた。
      本能寺の変の後を継いだ秀吉は、1590年に全国を統一する。
      太閤検地で全国の土地の生産力を石高で把握し、刀狩で農民から武器を取り上げた。
      武士と農民を身分として分ける兵農分離が、ここで制度として固まる。

      二度にわたる朝鮮出兵は失敗に終わり、豊臣政権の力を消耗させた。
      秀吉の死後、1600年の関ヶ原の戦いで徳川家康が覇権を握る。
      1603年に江戸幕府が開かれ、この時代は終わった。

      文化は豪壮華麗で、統一の勢いをそのまま映している。
      天守を備えた城が各地に築かれ、狩野永徳らが金地に大きな障壁画を描いた。
      千利休が侘び茶を大成し、茶の湯は政治の場としても機能する。
      南蛮貿易を通じて西洋の技術と品物が入り、風俗にも影響を与えた。
      短い期間ながら、日本の社会と文化が大きく組み替えられた時代である。
      安土城は本能寺の変の直後に焼け、その姿は記録と図からしか分からない。
      身分と土地を固定する仕組みは、そのまま江戸時代へ引き継がれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/%E8%BF%91%E6%B1%9F%E5%9B%BD%E8%92%B2%E7%94%9F%E9%83%A1%E5%AE%89%E5%9C%9F%E5%9F%8E%E4%B9%8B.jpg/500px-%E8%BF%91%E6%B1%9F%E5%9B%BD%E8%92%B2%E7%94%9F%E9%83%A1%E5%AE%89%E5%9C%9F%E5%9F%8E%E4%B9%8B.jpg
      credit: Iwasaki Ōu 岩崎鴎雨 / Public domain
      page: https://commons.wikimedia.org/wiki/File:%E8%BF%91%E6%B1%9F%E5%9B%BD%E8%92%B2%E7%94%9F%E9%83%A1%E5%AE%89%E5%9C%9F%E5%9F%8E%E4%B9%8B.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/安土桃山時代

  - id: edo
    title: 江戸時代
    start: 1603
    end: 1868
    category: politics
    tags: [日本, 幕藩体制]
    summary: 徳川幕府のもとで260年あまり大きな戦乱がなく、町人文化と国内経済が育った。
    detail: |
      徳川幕府が政治を担った時代で、1603年から1868年まで続いた。
      260年余りにわたり、国内で大きな戦乱が起きなかった。
      政治の中心は江戸、経済の中心は大坂、朝廷は京都という三都の構造ができる。

      幕府は全国の四分の一ほどを直轄し、残りを大名に治めさせる幕藩体制をとった。
      武家諸法度で大名を統制し、参勤交代で江戸と領国を往復させて財力を削ぐ。
      身分は武士・百姓・町人に分けられ、移動と職業の変更は制限された。
      検地と村請制によって、年貢は村を単位として納められる。

      対外関係は、長崎・対馬・薩摩・松前の四つの窓口に限られた。
      キリスト教は禁じられ、寺請制度によって人々は寺に登録される。
      貿易は管理されたが、断絶したわけではなく、情報と物は入り続けた。

      平和が続いたことで、新田開発が進み、人口は3000万人規模に増えた。
      街道と航路が整備され、全国的な市場が成立する。
      寺子屋が普及して識字率は高く、出版と芝居が庶民の娯楽になった。
      元禄と化政の文化は、いずれも町人が担い手である。
      19世紀に入ると財政難と飢饉が重なり、外国船の接近が加わって体制は揺らいでいった。
      国内の移動や商取引は活発で、閉ざされた社会という印象は実態と合わない。
      藩ごとの財政と産業の競争が、地域ごとの特産品を育てた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/江戸時代

  - id: meiji
    title: 明治時代
    start: 1868
    end: 1912
    category: politics
    tags: [日本, 近代化]
    summary: 近代国家への急速な組み替え。立憲制・産業化・対外戦争が一気に進んだ。
    detail: |
      1868年から1912年まで続いた時代で、日本が近代国家へ急速に作り替えられた時期にあたる。
      一世一元の制が定められ、元号と天皇の在位が一致する最初の例になった。
      封建的な身分と領地の制度が解体され、中央集権の国家が築かれる。

      新政府はまず、藩を廃して県を置き、全国を直接統治する体制を作った。
      身分制度を廃して四民平等を掲げ、徴兵令と学制で国民を兵と生徒として把握する。
      地租改正で税を土地の価格にもとづく金納に改め、財政の基礎を固めた。
      殖産興業として官営の工場と鉱山を設け、鉄道と電信を敷いている。

      1870年代には、改革に不満を持つ士族の反乱が相次いだ。
      西南戦争の鎮圧後、反対運動は言論による自由民権運動へ移る。
      1889年に大日本帝国憲法が発布され、翌年に帝国議会が開かれた。
      アジアで最初の本格的な立憲制が成立したことになる。

      対外的には、不平等条約の改正が最大の課題だった。
      日清戦争と日露戦争に勝ち、台湾と南樺太を得て、韓国を併合する。
      1911年に関税自主権を回復し、列強と並ぶ地位を手にした。
      一方で、急激な近代化は農村の疲弊や公害、格差という問題も生んでいる。
      文明開化により、洋服・洋食・れんが造りの建物が都市に現れた。
      一方で地方の生活が変わるには、さらに長い時間がかかっている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/明治

  - id: taisho
    title: 大正時代
    start: 1912
    end: 1926
    category: society
    tags: [日本, 民主化]
    summary: 政党政治と大衆文化が広がった「大正デモクラシー」の時代。
    detail: |
      1912年から1926年まで続いた時代で、大正天皇の在位期間にあたる。
      政党政治と大衆文化が広がり、大正デモクラシーと呼ばれる。
      15年と短いが、社会の変化は大きかった。

      天皇が病弱で政務に関われなかったことが、結果として政治の重心を議会へ移した。
      1913年、藩閥の内閣が民衆の抗議で倒れる大正政変が起きる。
      吉野作造が民本主義を唱え、政治に民意を反映させるべきだという議論が広がった。
      1918年、米騒動を受けて原敬が本格的な政党内閣を組織する。

      第一次世界大戦には日英同盟を理由に参戦し、ヨーロッパへの輸出で好景気に沸いた。
      中国に二十一か条の要求を突きつけ、反発を招いている。
      戦後は反動不況に転じ、1923年の関東大震災が追い打ちをかけた。

      都市では、俸給生活者が増えて新しい生活様式が生まれた。
      ラジオ放送が始まり、新聞と雑誌が大量に売れ、映画やカフェが娯楽になる。
      女性の社会進出と労働運動、普通選挙を求める運動も高まった。
      1925年に25歳以上の男子による普通選挙が実現するが、同時に治安維持法が制定される。
      自由の拡大と統制の強化が同時に進んだことが、この時代の性格を表している。
      大正天皇の病により、1921年から皇太子が摂政を務めた。
      都市の中間層が育ったことが、この時代の文化と政治を支えている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大正

  - id: showa
    title: 昭和時代
    start: 1926
    end: 1989
    category: politics
    tags: [日本]
    summary: 戦争と敗戦、占領、そして高度成長を一つの元号のうちに含む激動の63年。
    detail: |
      1926年から1989年まで、64年近く続いた元号の時代。
      戦争と敗戦、占領、そして高度経済成長を一つの元号のうちに含む。
      日本の歴史でもっとも変化の激しい時代の一つである。

      前半は、恐慌と戦争が重なった。
      1930年前後の昭和恐慌で農村が困窮し、軍部の発言力が強まる。
      1931年の満洲事変から日中戦争、太平洋戦争へと戦線は広がり、1945年に敗戦を迎えた。
      空襲と原爆で都市は焼かれ、300万人を超える日本人が命を落としている。

      占領下で、憲法・農地・財閥・教育が短期間に作り替えられた。
      主権在民と戦争放棄を掲げる日本国憲法が施行され、女性の参政権も実現する。
      1951年の講和条約で独立を回復し、日米安保条約によって西側陣営に位置づけられた。

      1955年からの高度経済成長で、日本は20年足らずで世界第2位の経済規模になった。
      東京五輪と新幹線、家電の普及が生活を変え、都市への人口移動が進む。
      公害と過密という代償も生まれた。
      二度の石油危機を乗り越え、1980年代には経済大国として国際的な責任を問われるようになる。
      1989年1月の天皇の死去とともに、この時代は終わった。
      戦前と戦後で、同じ元号のもとに全く異なる国家があったことになる。
      人口は約6000万から1億2000万へと、この間に倍増している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/TaroTokyo20110213-TokyoTower-01min.jpg/500px-TaroTokyo20110213-TokyoTower-01min.jpg
      credit: 東京太郎 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:TaroTokyo20110213-TokyoTower-01min.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/昭和

  - id: allied-occupation
    title: 連合国軍の占領
    start: 1945
    end: 1952
    category: politics
    tags: [日本, 戦後]
    summary: 憲法・農地・財閥・教育が短期間に作り替えられ、戦後日本の骨格ができた。
    detail: |
      敗戦から1952年の独立回復まで、日本が連合国軍の占領下に置かれた7年間。
      実際にはアメリカが主導し、マッカーサーを最高司令官とする総司令部が統治した。
      日本政府を通じて指令を実行する間接統治の形がとられる。

      最初の課題は、軍国主義の解体と民主化だった。
      軍隊は解散され、戦争指導者は東京裁判で裁かれ、公職追放が行われる。
      財閥が解体され、労働組合法によって労働運動が認められた。
      農地改革では、不在地主の土地を政府が買い上げて小作人に売り渡し、自作農が大量に生まれる。

      1946年に公布された日本国憲法は、主権在民・戦争放棄・基本的人権を柱とした。
      女性参政権が実現し、家制度が廃止され、教育制度も六・三・三・四に改められる。
      短期間に社会の基本構造が作り替えられた。

      1948年以降、冷戦の進展によって占領の方針は変わった。
      経済の自立と安定が優先され、労働運動の抑制や公職追放の解除が進む。
      1950年の朝鮮戦争では日本が補給の拠点となり、特需が経済復興を後押しした。
      同じ年に警察予備隊が作られ、後の自衛隊につながる。
      1951年の講和条約で、翌年に占領は終わった。
      占領期の改革は、日本側の官僚や研究者の協力によって実行された面も大きい。
      沖縄と小笠原は、この後も長く米国の施政下に置かれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1b/Flag_of_Japan_%281870%E2%80%931999%29.svg/500px-Flag_of_Japan_%281870%E2%80%931999%29.svg.png
      credit: kahusi - (Talk) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Japan_(1870%E2%80%931999).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/連合国軍占領下の日本

  - id: high-growth
    title: 高度経済成長
    start: 1955
    end: 1973
    category: economy
    tags: [日本, 戦後]
    summary: 年平均10%近い成長が続き、20年足らずで世界第2位の経済規模になった。
    detail: |
      1955年から1973年まで、年平均10パーセント近い経済成長が続いた時期。
      この間に日本の経済規模は世界第2位になった。
      生活と社会の構造が、20年足らずで大きく変わっている。

      背景には複数の条件が重なっていた。
      朝鮮戦争の特需で設備投資が始まり、安価な石油と固定された為替相場が輸出を支える。
      農村から都市へ大量の若い労働力が移り、高い貯蓄率が設備投資の資金になった。
      技術は欧米から導入され、鉄鋼・造船・自動車・電機が急速に競争力をつける。

      1960年の所得倍増計画は、政治の対立から経済へ国民の関心を移した。
      家庭には洗濯機・冷蔵庫・テレビが入り、のちに自動車とクーラーが加わる。
      1964年の東京五輪と新幹線は、復興の達成を国内外に示す舞台になった。
      地方から都市への人口移動が続き、核家族と団地の生活が一般的になる。

      代償も大きかった。
      水俣病や四日市ぜんそくなどの公害が深刻化し、住民運動が広がる。
      1967年に公害対策基本法が作られ、1971年に環境庁が設置された。
      1973年の石油危機で物価が急騰し、翌年は戦後初のマイナス成長になる。
      ここで高度成長は終わり、安定成長の時代へ移った。
      農村から都市への集団就職は、中学卒業生を金の卵と呼んで迎え入れた。
      成長の前提だった安い石油と固定相場は、1970年代に両方とも失われる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高度経済成長

  - id: heisei
    title: 平成時代
    start: 1989
    end: 2019
    category: politics
    tags: [日本]
    summary: バブル崩壊後の長い停滞と、震災・デジタル化に向き合った30年。
    detail: |
      1989年から2019年まで続いた元号の時代。
      バブル崩壊後の長い経済の停滞と、大きな災害、そしてデジタル化に向き合った30年にあたる。
      戦争のない時代であり、人口が減少に転じた時代でもある。

      始まりは、資産価格の高騰が頂点に達した時期だった。
      1991年ごろから地価と株価が急落し、金融機関は大量の不良債権を抱える。
      1997年から98年にかけて大手の銀行と証券会社が破綻し、金融危機となった。
      企業は雇用と設備を絞り、非正規雇用が増えて所得の格差が広がる。

      政治も流動化した。
      1993年に自民党の単独政権が途切れ、連立政権が常態になる。
      2009年には民主党への政権交代が起きたが、3年余りで再び交代した。
      選挙制度の改革、省庁の再編、地方分権が進められている。

      1995年の阪神・淡路大震災と2011年の東日本大震災は、防災とエネルギー政策の前提を問い直させた。
      携帯電話とインターネットが普及し、生活と産業の仕組みが変わる。
      少子高齢化が進み、社会保障と労働力の確保が最大の課題になった。
      2019年、天皇の生前退位によって平成は終わる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/c/ca/Emperor_Akihito_198901.jpg
      credit: The Imperial Household Agency (noted here) / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Emperor_Akihito_198901.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/平成

  - id: reiwa
    title: 令和時代
    start: 2019
    ongoing: true
    category: politics
    tags: [日本]
    summary: 人口減少と国際環境の変化のなかで始まった現在の元号。
    detail: |
      2019年5月1日に始まった元号で、天皇の生前退位にともなって改元された。
      出典は日本の古典である『万葉集』で、中国の古典によらない最初の元号になる。
      人口減少と国際環境の変化のなかで始まった時代である。

      改元の翌年、新型コロナウイルスの感染が世界に広がった。
      緊急事態宣言が出され、学校の休校や外出の自粛が繰り返される。
      2020年に予定されていた東京五輪は1年延期され、ほとんどの会場が無観客で開催された。
      テレワークやオンライン授業が一気に広がり、働き方と暮らしが変わっている。

      経済では、円安と資源価格の上昇が重なって物価が上がった。
      長く続いたデフレの局面が変わり、賃金の引き上げが政策の焦点になる。
      少子化は加速し、出生数の減少は予測を上回る速さで進んでいる。

      国際環境も大きく動いた。
      ロシアによるウクライナ侵攻や米中の対立を受け、防衛費の増額と安全保障政策の見直しが進む。
      半導体やエネルギーの供給網をどう確保するかが、経済政策の中心に入った。
      人口減少を前提とした社会をどう設計するかが、この時代の大きな課題になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/Emperor_Naruhito_%28cropped%29.jpg/500px-Emperor_Naruhito_%28cropped%29.jpg
