  - id: goseibai-shikimoku
    year: 1232
    title: 御成敗式目
    category: society
    tags: [日本, 法]
    summary: 武士のための最初の体系的な法。以後の武家法の手本になった。
    detail: |
      北条泰時のもとで1232年に定められた、武家のための最初の体系的な法。
      全51か条からなり、貞永式目とも呼ばれる。
      源頼朝以来の先例と、武士社会の慣習である道理を基準とする。

      制定の直接の理由は、裁判の基準を示す必要だった。
      承久の乱の後、西国にも地頭が置かれ、所領をめぐる争いが急増していた。
      それまでは個別の判断に委ねられており、判決の食い違いが不満を生んでいる。
      泰時は、律令の知識がない武士にも分かる言葉で基準を書き記した。

      内容は具体的である。
      守護の任務を大番役の催促と謀反・殺害人の逮捕に限り、国司の権限を侵さないよう定めた。
      地頭が年貢を横領した場合の処分、20年間支配した土地の権利の確定、離婚した妻の所領の扱いなどが並ぶ。
      女性が所領を相続し、養子を取ることも認められていた。

      式目は、朝廷の法や荘園の本所の法を否定したわけではない。
      幕府の支配が及ぶ範囲での基準として作られ、三つの法体系が並存する形になった。
      それでも実務に即した明快さから広く使われ、室町の追加法や戦国大名の分国法の土台になる。
      江戸時代には寺子屋の教材にもなり、武家法の原点として長く読まれた。
      条文の数は、聖徳太子の十七条憲法の三倍にあたる51とされたとも言われる。
      必要に応じて追加の法が出され、式目の体系は時代とともに広がった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/御成敗式目

  - id: kamakura-buddhism
    year: 1224
    circa: true
    title: 鎌倉新仏教の広がり
    category: religion
    tags: [日本, 仏教]
    summary: 念仏や題目、坐禅など、庶民にも開かれた教えが相次いで現れた。
    detail: |
      平安末から鎌倉時代にかけて、庶民にも開かれた新しい仏教の流れが相次いで現れた。
      念仏、題目、坐禅といった、一つの行に絞る教えが特徴である。
      戦乱と飢饉、疫病が続き、末法の世という意識が広がったことが背景にあった。

      法然は、ひたすら阿弥陀仏の名を唱えれば救われると説いて浄土宗を開いた。
      弟子の親鸞は、悪人こそ救いの対象であるとして浄土真宗の教えを深め、僧でありながら妻帯した。
      一遍は踊念仏とともに各地を巡り、信心の有無を問わずに札を配る。
      日蓮は法華経だけを正しいとし、題目を唱えることを説いて、他宗と幕府を激しく批判した。

      禅は、中国から帰った栄西が臨済宗を、道元が曹洞宗を伝えた。
      坐禅によって自ら悟りを求める姿勢は、武士の気風に合って広く受け入れられる。
      幕府は禅僧を招いて寺を建て、宋の文化を取り入れる窓口にもした。

      一方、奈良や比叡山の旧来の仏教も、戒律の復興や社会事業によって改革を進めている。
      叡尊や忍性は、貧民や病者の救済に取り組んだ。
      新しい教えは当初は弾圧されることも多かったが、やがて各地に広がる。
      学問と儀礼が中心だった仏教が、誰にでも実践できる形に変わった点が、この時期の最大の変化である。
      開祖たちの多くは比叡山で学んだ経歴を持ち、そこから独自の道へ進んでいる。
      各宗派は現在も日本の仏教の主要な流れとして続いている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/鎌倉仏教

  - id: mongol-invasions-japan
    year: 1274
    title: 文永の役（元寇のはじまり）
    category: war
    tags: [日本, モンゴル]
    summary: 元と高麗の連合軍が九州北部に来襲。1281年の弘安の役でも撃退した。
    detail: |
      元と高麗の連合軍が九州北部に来襲した戦いで、文永の役と呼ばれる。
      1274年のことで、7年後の弘安の役と合わせて元寇という。
      日本が初めて経験した、大陸の国家による本格的な侵攻だった。

      クビライは1268年以来、服属を求める使者を繰り返し送っていた。
      幕府がこれを退けたため、高麗を動員して遠征が計画される。
      3万ほどの兵が900艘の船で対馬と壱岐を襲い、住民を殺害したのち博多湾に上陸した。

      元軍は密集した隊形で進み、短い弓と火薬を詰めたてつはうを用いた。
      一騎討ちを基本とする日本の武士は苦戦したが、地の利を生かして押し返している。
      元軍は一夜のうちに船へ引き上げ、そのまま帰還した。
      撤退の理由は暴風雨のためとされてきたが、季節と記録の検討から、補給の不足や指揮の不統一を重く見る説も有力である。

      幕府はこの後、博多湾に高さ2メートルほどの石築地を築き、九州の御家人に警固を課した。
      1281年の弘安の役では、東路軍と江南軍を合わせた14万の大軍が来襲する。
      しかし石築地に阻まれて上陸できず、2か月の停泊のあいだに暴風で船団は壊滅した。
      のちにこの風は神風と呼ばれ、近代には国家の守護という物語に取り込まれていく。
      元は三度目の遠征も計画したが、ベトナムでの戦いや内政の事情で実現しなかった。
      博多湾に築かれた石築地の跡は、いまも各所で確認できる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/M%C5%8Dko_Sh%C5%ABrai_Ekotoba.jpg/500px-M%C5%8Dko_Sh%C5%ABrai_Ekotoba.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:M%C5%8Dko_Sh%C5%ABrai_Ekotoba.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/元寇

  - id: kamakura-fall
    year: 1333
    title: 鎌倉幕府の滅亡
    category: politics
    tags: [日本, 武家]
    summary: 元寇の恩賞不足で御家人の不満が募り、150年続いた幕府が倒れた。
    detail: |
      150年続いた鎌倉幕府が倒れた年。
      後醍醐天皇の呼びかけに応じた武士が各地で挙兵し、短期間で決着した。
      北条氏の一族は鎌倉で自害し、東国の武家政権は終わる。

      背景には御家人の窮乏があった。
      元寇は防衛戦であったため新たな土地が得られず、動員の負担だけが残る。
      分割相続を重ねて所領は細り、借金を抱える者が増えていた。
      幕府は徳政令で債務を帳消しにしようとしたが、かえって金を借りられなくなり信用を失う。
      北条氏の一族が要職を独占する体制への反発も強まっていた。

      1331年に挙兵した後醍醐天皇は捕らえられて隠岐に流されたが、楠木正成が千早城で幕府の大軍を引きつけ続けた。
      1333年、天皇が隠岐を脱出すると各地で呼応が広がる。
      幕府が派遣した足利高氏が寝返って六波羅探題を攻め落とし、同じ時期に新田義貞が鎌倉へ攻め入った。
      執権の北条高時ら一族数百人は、東勝寺で自害する。

      幕府の滅亡後、後醍醐天皇は建武の新政を始めた。
      しかし武士の期待に応えられず、3年で足利尊氏が離反する。
      武家政権そのものが否定されたわけではなく、京都に新しい幕府が生まれた。
      御家人制という、土地を介した将軍と武士の関係が限界に達したことを示す出来事だった。
      北条氏の滅亡から建武の新政まで、政権の移行はわずか数か月の出来事だった。
      鎌倉はこの後も東国の拠点であり続けたが、政治の中心は京都へ戻る。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Sasa_Rindo.svg/500px-Sasa_Rindo.svg.png
      credit: 百楽兎 (Hundreds of rabbits) / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Sasa_Rindo.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/鎌倉幕府

  - id: takauji-shogun
    year: 1338
    title: 足利尊氏が征夷大将軍になる
    category: politics
    tags: [日本, 武家]
    summary: 京都に幕府を開き、朝廷と隣り合う形の武家政権が始まった。
    detail: |
      足利尊氏が征夷大将軍に任じられ、室町幕府が正式に始まった出来事。
      1338年のことで、任命したのは京都の北朝の光明天皇である。
      幕府が京都に置かれたことが、鎌倉幕府との大きな違いになった。

      尊氏はすでに1336年に京を制圧し、建武式目を示して政権の方針を明らかにしていた。
      そこでは、幕府をどこに置くかという問いが立てられ、人々が望むなら京でもよいとされている。
      実際には、南朝との戦いを指揮する必要から京にとどまることになった。

      京に幕府が置かれたことで、武家と公家の距離は近づいた。
      将軍は朝廷の高い官位を受け、儀礼にも参加する。
      3代義満の代には、武家の棟梁でありながら公家の頂点である太政大臣にも就いた。
      武家が朝廷の権威を取り込む形は、鎌倉幕府が距離を置いたのとは対照的である。

      一方で、東国の統治には鎌倉府が置かれ、将軍の一族が鎌倉公方として治めた。
      この二重構造は後に対立を生み、東国の争乱の原因になる。
      幕府の力は守護の協力に依存しており、将軍個人の器量に左右された。
      応仁の乱の後は名目だけの存在となり、1573年に信長によって終わりを迎える。
      建武式目は幕府の方針を示した文書で、法典そのものではない。
      京に幕府が置かれたことで、武家の文化と公家の文化が混ざり合っていった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Ashikaga_Takauji_J%C5%8Ddo-ji.jpg/500px-Ashikaga_Takauji_J%C5%8Ddo-ji.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ashikaga_Takauji_J%C5%8Ddo-ji.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/足利尊氏

  - id: kango-trade
    year: 1404
    title: 勘合貿易のはじまり
    category: economy
    tags: [日本, 明, 交易]
    summary: 明の朝貢体制に入って銅銭と生糸を得た。幕府の重要な財源になった。
    detail: |
      室町幕府が明と行った朝貢の形式による貿易で、1404年に始まった。
      倭寇や密貿易と区別するため、勘合という割符が用いられた。
      幕府にとって重要な財源になった。

      明は民間の海外渡航を禁じ、国と国の貿易だけを認めていた。
      そのため、足利義満は明の皇帝に臣下の礼をとり、日本国王として冊封を受ける形をとる。
      貢ぎ物を献上し、返礼として品を受け取るという体裁で取引が行われた。
      対等な関係ではないという批判は当時からあり、4代義持は一時これを中断している。

      日本からは刀剣・硫黄・銅・扇・漆器などが送られた。
      明からは大量の銅銭、生糸、絹織物、書籍、陶磁器が入る。
      輸入された銭は国内の貨幣として流通し、年貢を銭で納める動きを加速させた。
      1回の貿易で数倍の利益が出たとされ、幕府は船の派遣権を寺社や大名に与えて費用を集めている。

      幕府の力が衰えると、貿易の実権は細川氏と大内氏に移った。
      1523年には両者の使節が寧波で衝突する事件が起き、明との関係は悪化する。
      大内氏が滅びた後、1551年を最後に正式な貿易は途絶えた。
      その後は倭寇と密貿易、そしてポルトガル船を介した交易が、東シナ海の主役になっていく。
      勘合は本物の使節であることを示す割符で、明が交付して両者が突き合わせた。
      貿易で得た銅銭は、東日本にまで流通して経済のかたちを変えている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/Japan-Ming_Trade_Ship_Flag_1584.jpg/500px-Japan-Ming_Trade_Ship_Flag_1584.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Japan-Ming_Trade_Ship_Flag_1584.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日明貿易

  - id: onin-war
    year: 1467
    title: 応仁の乱
    category: war
    tags: [日本, 内戦]
    summary: 京都を焼いた11年の内乱。幕府の権威が失われ戦国時代に入る。
    detail: |
      1467年から1477年まで、京都を主な戦場として続いた内乱。
      細川勝元と山名宗全が東軍と西軍に分かれ、全国の守護が参加した。
      11年の戦いで京は焼け野原になり、幕府の権威は失われる。

      原因は一つではない。
      将軍足利義政の後継をめぐる対立に加え、畠山氏と斯波氏の家督争いが重なっていた。
      そこへ細川と山名という有力守護の主導権争いが絡み、双方が味方を集めて京に兵を集結させる。
      両軍を合わせて20万を超える兵が都に集まったとされる。

      戦闘は市街戦となり、寺社や邸宅が次々に焼かれた。
      足軽と呼ばれる雑兵が略奪と放火を行い、都市の破壊を大きくしている。
      応仁から文明へ改元しても戦いは続き、主戦場は地方へ移っていった。
      両軍の総大将が相次いで没すると、戦う理由も曖昧になり、1477年に諸軍が引き上げて終わる。

      勝敗ははっきりせず、得たものもなかった。
      守護が京に集まって幕府を支える体制は崩れ、彼らは領国へ戻って自らの支配を固める。
      留守を預けた家臣に国を奪われる例も相次いだ。
      公家や僧が地方へ疎開したことで、京の文化が各地へ広がるという副産物もあった。
      日本の歴史を前後に分ける画期として、この乱を重く見る立場は根強い。
      乱の間に多くの記録と文化財が失われ、京都の町は大きく姿を変えた。
      町衆が自衛のために組織を作り、のちの祇園祭の復興を担っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Shinnyod%C5%8D_engi%2C_vol.3_%28part%29.jpg/500px-Shinnyod%C5%8D_engi%2C_vol.3_%28part%29.jpg
      credit: 掃部助久国Kamonnosuke Hisakuni / Public domain
      page: https://commons.wikimedia.org/wiki/File:Shinnyod%C5%8D_engi,_vol.3_(part).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/応仁の乱

  - id: teppo-tanegashima
    year: 1543
    title: 鉄砲伝来
    category: science
    tags: [日本, 技術, 南蛮]
    summary: 種子島に漂着したポルトガル人が火縄銃を伝え、戦い方と築城が変わった。
    detail: |
      ポルトガル人を乗せた船が種子島に漂着し、火縄銃が伝わったとされる出来事。
      1543年のことで、島主の種子島時尭が2挺を買い取ったと伝えられる。
      戦い方と城の造りを大きく変えた技術の伝来である。

      持ち込まれたのは、火縄で点火する前装式の銃だった。
      島では刀鍛冶が分解して構造を調べ、ねじの製法に苦心しながら複製に成功する。
      技術はまもなく紀伊の根来、和泉の堺、近江の国友へ伝わり、量産が始まった。
      日本は数十年のうちに、世界有数の鉄砲保有国になったと推定されている。

      戦場での効果は大きかった。
      訓練に年月を要する弓と違い、短期間の習熟で威力を発揮できる。
      足軽に鉄砲を持たせることで、兵の数と組織が勝敗を決めるようになった。
      1575年の長篠の戦いは、その運用が広く知られる例になる。

      城も変わった。
      山の上の砦から、石垣と堀と土塁で銃撃に耐える平城へ移っていく。
      硝石は輸入に頼ったため、貿易を押さえることが軍事力に直結した。
      伝来の年代や経緯については、中国人商人の役割を重く見る説など異論もある。
      いずれにせよ、この技術が統一の過程を加速させたことは確かである。
      火縄銃は雨に弱く、装填にも時間がかかるため、弓との併用が続いた。
      銃を量産できたのは、刀鍛冶の技術と鉄の生産基盤があったからである。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/鉄砲伝来

  - id: xavier-japan
    year: 1549
    title: ザビエルの来日
    category: religion
    tags: [日本, キリスト教]
    summary: キリスト教が伝わり、南蛮貿易とともに西日本の大名に影響を与えた。
    detail: |
      イエズス会の宣教師フランシスコ・ザビエルが鹿児島に上陸し、日本での布教を始めた年。
      1549年のことで、日本にキリスト教が伝わった最初とされる。
      滞在は2年余りだったが、その影響は長く続いた。

      ザビエルはインドのゴアで日本人のヤジロウと出会い、日本の存在を知った。
      同行者とともに鹿児島に着き、薩摩の領主の許しを得て布教を始める。
      言葉と概念の翻訳に苦しみ、神をどう呼ぶかという問題に直面した。
      平戸・山口・豊後を巡り、京へ上って天皇に謁見しようとしたが果たせていない。

      山口では大名の保護を得て布教が進み、数百人が信徒になった。
      日本人の礼儀正しさと知識欲を高く評価する書簡を残している。
      中国での布教を志して日本を離れ、1552年に広東沖の島で病没した。

      その後、宣教師は各地に教会と学校を建て、信徒は数十万に達したとされる。
      九州の大名には受洗する者も現れ、1582年には少年使節がローマへ送られた。
      布教はポルトガルとの南蛮貿易と結びついており、大名が歓迎した理由の一つでもある。
      活版印刷、天文学、医学、絵画の技法も同時に伝えられた。
      秀吉と徳川幕府の禁教によって、この流れは17世紀に断たれる。
      宣教師の書簡は、当時の日本の社会を外から記録した貴重な資料になっている。
      日本語に訳しにくい概念をどう伝えるかという苦労も、そこに書き残された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/Franciscus_de_Xabier.jpg/500px-Franciscus_de_Xabier.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Franciscus_de_Xabier.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フランシスコ・ザビエル

  - id: muromachi-fall
    year: 1573
    title: 室町幕府の滅亡
    category: politics
    tags: [日本]
    summary: 織田信長が将軍を追放し、武力による全国統一の段階に入った。
    detail: |
      織田信長が将軍の足利義昭を京都から追放し、室町幕府が終わった年。
      1573年のことで、幕府の成立から数えて約240年が経っていた。
      武力による全国統一の段階に入る節目になる。

      義昭は、兄の将軍が殺された後に信長の支援で京へ戻り、将軍の座に就いた。
      当初は協力関係にあったが、信長が幕府の権限を制限すると対立が深まる。
      義昭は武田信玄・朝倉義景・浅井長政・本願寺らに働きかけ、信長包囲網を作った。

      1573年、義昭は京の南で挙兵したが、信長の軍にすぐ制圧される。
      信長は義昭を殺さず、京から追放するにとどめた。
      同じ年、武田信玄が病没し、浅井氏と朝倉氏も滅ぼされている。
      包囲網が崩れたことで、信長の優位は動かないものになった。

      義昭はその後も西国で将軍を称し続け、正式に辞したのは1588年である。
      そのため、幕府の終わりをどの時点に置くかには議論がある。
      ただし1573年以降、幕府が政治的な機能を果たすことはなかった。
      将軍の権威を利用する段階が終わり、実力だけで天下を取る段階に入ったことを示す出来事である。
      追放された義昭は毛利氏を頼り、なお将軍として各地に書状を送り続けた。
      幕府という制度は残ったが、その権威を支える実力はすでに失われていた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/62/Ashikaga_mon.svg/500px-Ashikaga_mon.svg.png
      credit: Ash Crow / CC BY 2.5
      page: https://commons.wikimedia.org/wiki/File:Ashikaga_mon.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/室町幕府

  - id: nagashino
    year: 1575
    title: 長篠の戦い
    category: war
    tags: [日本, 鉄砲]
    summary: 鉄砲を組織的に使った戦い。戦術と城づくりが大きく変わった。
    detail: |
      織田信長と徳川家康の連合軍が、武田勝頼の軍を破った戦い。
      1575年、三河の長篠城をめぐって行われた。
      鉄砲が組織的に使われた戦いとして知られる。

      武田軍は長篠城を包囲し、織田・徳川の連合軍がその救援に向かった。
      兵力は連合軍が3万8000、武田軍が1万5000ほどと伝えられる。
      連合軍は野戦でありながら、馬防柵と土塁を設けて陣地を築いた。
      そこに鉄砲隊を配置し、突撃してくる武田の騎馬武者を迎え撃つ。

      『信長公記』などの記述から、三千挺の鉄砲が用意されたとされてきた。
      数や運用の方法については史料の異同があり、三段撃ちという戦法も後世の脚色とみる説が有力である。
      それでも、大量の鉄砲を柵と組み合わせて用いた点が勝敗を分けたことは確かだろう。
      武田軍は重臣の多くを失い、勢力は急速に衰えた。

      この戦いの後、鉄砲を数百挺単位で揃えることが大名の条件になった。
      火薬の原料である硝石は輸入に頼るため、貿易と財力が軍事力に直結する。
      個人の武勇より、金と組織が勝敗を決める時代が明確になった。
      武田氏は7年後に滅び、信長の統一事業は大きく前進する。
      鉄砲の数をめぐる記述は史料によって異なり、研究は今も続いている。
      武田の騎馬隊という像も、後世の物語によって強調された面がある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/Battle-of-Nagashino-Map-Folding-Screen-1575.png/500px-Battle-of-Nagashino-Map-Folding-Screen-1575.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Battle-of-Nagashino-Map-Folding-Screen-1575.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/長篠の戦い

  - id: honnoji
    year: 1582
    title: 本能寺の変
    category: politics
    tags: [日本]
    summary: 統一目前の信長が倒れ、豊臣秀吉が後を継ぐ流れになった。
    detail: |
      織田信長が家臣の明智光秀に襲われ、京都の本能寺で自害した事件。
      1582年6月のことで、統一を目前にしていた。
      日本史でもっともよく知られた謀反の一つである。

      信長は中国地方で毛利氏と戦う羽柴秀吉を助けるため、光秀に出陣を命じていた。
      自身はわずかな供回りで本能寺に宿泊していた。
      光秀は軍を京へ向け、夜明け前に寺を包囲する。
      信長は弓と槍で応戦したのち、火を放って自害したと伝えられる。
      嫡男の信忠も、近くの二条御所で討たれた。

      光秀が謀反に及んだ理由は、今も定まっていない。
      信長からの叱責や所領をめぐる恨み、朝廷や他の勢力の関与など、数多くの説が提出されてきた。
      確かな史料が乏しく、推測の域を出ないものが多い。

      備中にいた秀吉は、報せを受けると毛利氏と和睦し、数日で京へ戻った。
      山崎の戦いで光秀を破り、光秀は逃走の途中で落命する。
      謀反から13日という短さで、光秀の天下は終わった。
      信長の後継者の地位は秀吉が握り、統一事業は引き継がれる。
      一人の死が政権の行方を一夜で変えた例として、後世に繰り返し語られてきた。
      信長の遺体は火災のなかで見つからず、そのことが多くの伝説を生んだ。
      光秀が味方を集められなかったことが、短期間での敗北につながっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e3/Honnoj.jpg/500px-Honnoj.jpg
      credit: 楊斎延一 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Honnoj.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/本能寺の変

  - id: katanagari
    year: 1588
    title: 刀狩令
    category: society
    tags: [日本, 身分]
    summary: 農民から武器を取り上げ、武士と農民を分ける身分制度を固めた。
    detail: |
      豊臣秀吉が農民から武器を取り上げた政策で、1588年に命じられた。
      刀・脇差・弓・槍・鉄砲などを差し出させ、所持を禁じたものである。
      武士と農民を分ける身分制度を固める柱になった。

      中世の村では、農民も武器を持ち、自衛や一揆のために使っていた。
      戦国の大名は彼らを足軽として動員し、身分の境目は流動的だった。
      秀吉は、農民が武器を持つことが一揆と年貢の滞りにつながると考える。

      命令書では、集めた武器を方広寺の大仏の釘や鎹にすると説明された。
      差し出せば来世まで救われるという理屈が添えられている。
      実際には、抵抗を和らげるための名目だったとみられる。
      同じころ出された身分統制令では、武士・町人・農民が身分を移ることも禁じられた。

      この政策で、武力の行使は武士だけの特権になった。
      農民は年貢を納めることに専念する存在として位置づけられる。
      兵農分離と呼ばれるこの区分は、そのまま江戸時代の社会の土台になった。
      ただし実際には、猟や害獣駆除のための鉄砲は村に残り、完全な武装解除ではなかった。
      身分を固定することで社会を安定させるという発想は、以後260年続く。
      全国から集められた武器の量は膨大で、実際に大仏の材料に使われた分は一部だった。
      村の自衛の手段が失われたことは、領主の支配を強める効果も持った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/刀狩

  - id: hideyoshi-unification
    year: 1590
    title: 豊臣秀吉の全国統一
    category: politics
    tags: [日本, 統一]
    summary: 100年以上続いた戦国の争乱が終わり、検地と身分制で全国が再編された。
    detail: |
      豊臣秀吉が小田原の北条氏を降し、全国統一を完成させた年。
      応仁の乱から数えて120年余り続いた戦国の争乱が終わった。
      東北の大名も相次いで服属し、日本全土が一つの政権のもとに入る。

      北条氏は関東一円を支配し、堅固な小田原城に拠っていた。
      秀吉は20万を超える大軍で包囲し、周辺の支城を落としながら圧力をかける。
      石垣山に一夜にして城が現れたように見せた逸話が伝えられる。
      3か月の籠城の末に北条氏は降伏し、当主は切腹した。
      遅れて参陣した伊達政宗も許され、奥州の仕置が行われる。

      統一後、秀吉は全国で検地を進めた。
      同じ物差しと升を用いて田畑を測り、収穫量を石高で表す。
      大名は石高に応じて軍役を負い、農民は耕作の権利と年貢の義務を結びつけられた。
      刀狩と身分統制令によって、武士と農民の区別も固定される。

      大名の配置も組み替えられ、領地の移動が繰り返された。
      土地は主君から与えられるものだという原則が、ここで徹底される。
      統一によって国内の戦争は終わったが、その軍事力は朝鮮へ向けられた。
      二度の出兵の失敗が政権の寿命を縮め、10年後に徳川の世へ移ることになる。
      検地によって、荘園以来の複雑な土地の権利関係が一つに整理された。
      年貢を納める者と土地の結びつきが、はっきりと定められている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Goshichi_no_kiri.svg/500px-Goshichi_no_kiri.svg.png
      credit: "file created on Adobe Illustrator and Photoshop by: Zagyoso / Public domain"
      page: https://commons.wikimedia.org/wiki/File:Goshichi_no_kiri.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/豊臣政権

  - id: sekigahara
    year: 1600
    title: 関ヶ原の戦い
    category: war
    tags: [日本]
    summary: 徳川家康が覇権を確立し、3年後の幕府開設につながった。
    detail: |
      徳川家康の東軍と石田三成らの西軍が、美濃の関ヶ原で戦った合戦。
      1600年に行われ、天下分け目の戦いと呼ばれる。
      家康の勝利により、3年後の江戸幕府の開設につながった。

      秀吉の死後、豊臣政権は家康を中心とする勢力と、それを警戒する勢力に割れていた。
      家康が会津の上杉氏を討つため東へ向かった隙に、石田三成が西で挙兵する。
      両軍とも全国の大名を巻き込み、各地で戦闘が起きた。

      本戦は、東軍が7万余、西軍が8万余という規模で始まった。
      地形では西軍が有利だったが、内部の結束が弱かった。
      小早川秀秋が戦の途中で東軍に寝返り、それをきっかけに西軍は崩れる。
      戦闘は半日で決着した。

      戦後、西軍についた大名は改易や減封となり、その所領が東軍の大名に配分された。
      外様の大名は遠隔地に置かれ、譜代は要所に配置される。
      豊臣家は摂津・河内・和泉の一大名の地位に落とされた。
      家康は1603年に征夷大将軍となり、1615年の大坂の陣で豊臣氏を滅ぼす。
      この一日の勝敗が、その後260年の体制を決めることになった。
      東西の大名が二手に分かれて戦ったため、この一戦は全国的な内戦でもあった。
      関ヶ原に集まった兵の配置は、いまも軍事史の研究対象になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/Sekigaharascreen.jpg/500px-Sekigaharascreen.jpg
      credit: User LordAmeth on en.wikipediaCollection of The Town of Sekigahara Archive of History and Cultural Anthropology / Public domain
      page: https://commons.wikimedia.org/wiki/File:Sekigaharascreen.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/関ヶ原の戦い

  - id: shimabara-rebellion
    year: 1637
    title: 島原の乱
    category: war
    tags: [日本, キリスト教]
    summary: キリシタンと農民の蜂起。鎮圧後、禁教と貿易統制が決定的になった。
    detail: |
      島原と天草の百姓が起こした大規模な一揆で、1637年から翌年まで続いた。
      参加者の多くがキリシタンで、天草四郎が首領に立てられた。
      鎮圧の後、禁教と貿易統制が決定的になる。

      島原の松倉氏と天草の寺沢氏は、実際の生産力を大きく超える年貢を課していた。
      飢饉が重なり、納められない者への拷問が横行する。
      かつてキリシタン大名が治めた土地で、禁教による弾圧も加わっていた。
      生活苦と信仰の弾圧が結びつき、蜂起は瞬く間に広がる。

      一揆勢は3万を超え、廃城となっていた原城に籠もった。
      幕府は当初の攻撃に失敗し、総大将が戦死する。
      最終的に12万を超える兵で包囲し、兵糧攻めに切り替えた。
      オランダ船に海上から砲撃させてもいる。
      1638年、飢えた籠城側は総攻撃を受け、老若男女を問わずほぼ全員が殺された。

      この反乱は、幕府にキリスト教への強い警戒を植えつけた。
      翌1639年にポルトガル船の来航が禁じられ、対外関係は限定される。
      絵踏が強化され、宗門改によって信仰が管理された。
      一方で、大名の苛政が一揆を招くという教訓から、領主の統治にも目が向けられるようになる。
      以後200年以上、これほどの規模の内乱は起きなかった。
      幕府軍の指揮をめぐる混乱は、長い平和のなかで軍の経験が失われていたことも示した。
      乱の後、島原には各地から移住者が入り、村は作り直された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/Remains_of_Hara_castle.jpg/500px-Remains_of_Hara_castle.jpg
      credit: Image taken by Chris 73 in December 2004 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Remains_of_Hara_castle.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/島原の乱

  - id: sakoku
    year: 1639
    title: いわゆる鎖国の完成
    category: politics
    tags: [日本, 対外関係]
    summary: ポルトガル船の来航を禁止し、対外窓口を長崎・対馬・薩摩・松前に限った。
    detail: |
      幕府がポルトガル船の来航を禁じ、対外関係を限られた窓口に絞り込んだ出来事。
      1639年のことで、一連の政策の完成とされる。
      鎖国という言葉は後世のもので、当時は用いられていない。

      禁教政策は1610年代から段階的に強まっていた。
      日本人の海外渡航と帰国を禁じ、スペイン船の来航も止めている。
      島原の乱でキリシタンの結束を目の当たりにしたことが、最後の決断を後押しした。
      1641年には平戸のオランダ商館が長崎の出島へ移され、監視のもとに置かれる。

      完全に閉ざされたわけではない。
      長崎ではオランダと中国、対馬を通じて朝鮮、薩摩を通じて琉球、松前を通じてアイヌと交易が続いた。
      これらは四つの口と呼ばれ、それぞれ性格の異なる関係を持っていた。
      オランダ商館長が提出する風説書によって、海外の情勢も幕府に届いている。

      狙いは、貿易の利益と海外の情報を幕府が独占し、大名が外国と結ぶことを防ぐことだった。
      キリスト教という、幕府の秩序と競合する権威を排除する意味もある。
      結果として、国内の平和は長く保たれ、独自の文化が熟していった。
      一方で、19世紀に西洋が軍事力を携えて現れたとき、対応は後手に回ることになる。
      鎖国という語は、19世紀にオランダ語の書物を訳した際に作られたものである。
      近年の研究は、四つの口を通じた交流を重視して、閉ざされた国という見方を見直している。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/鎖国

  - id: meireki-fire
    year: 1657
    title: 明暦の大火
    category: disaster
    tags: [日本, 江戸, 災害]
    summary: 江戸の大半を焼いた火災。以後の都市計画と防火体制を作り替えた。
    detail: |
      江戸の大半を焼き尽くした大火で、1657年の1月に発生した。
      死者は3万から10万と推定され、日本の火災史上で最大級の被害になった。
      振袖火事の名でも知られる。

      乾燥した冬の強風のなか、本郷の寺から出た火が三日にわたって燃え広がった。
      武家屋敷、寺社、町屋が次々に焼け、江戸城の天守も焼失する。
      市街の6割が失われたとされ、逃げ場を失った人々が堀や川で多数溺死した。

      幕府の対応は早かった。
      粥の施行を行い、被災した大名や旗本に資金を貸し付けている。
      焼け跡の再建では、都市の構造そのものを作り替えた。
      火除地と広小路を設け、防火のための空き地を市中に配置する。
      大名屋敷や寺社を郊外へ移し、隅田川に両国橋を架けて避難路を確保した。

      江戸城の天守は、再建の資金を市街の復興に回す判断から、ついに建て直されなかった。
      平和な時代に軍事的な象徴は不要だという考えも背景にあったとされる。
      町火消の制度が整えられるのは、この後の享保期である。
      火事と喧嘩は江戸の華という言葉が生まれるほど、火災は都市生活の一部になった。
      災害が都市計画を前進させた例として、しばしば取り上げられる。
      焼失した天守の石垣は、いまも江戸城跡に残されている。
      大火のたびに材木と職人の需要が生まれ、江戸の経済を回す一因にもなった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/Meireki_fire.JPG/500px-Meireki_fire.JPG
      credit: 田代幸春 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Meireki_fire.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/明暦の大火

  - id: genroku-culture
    year: 1688
    circa: true
    title: 元禄文化
    category: culture
    tags: [日本, 町人文化]
    summary: 上方の町人が担い手になり、浮世草子・人形浄瑠璃・浮世絵が花開いた。
    detail: |
      17世紀後半から18世紀の初めにかけて、上方を中心に栄えた文化。
      元禄の年号にちなんで呼ばれる。
      担い手が公家や武士ではなく、都市の町人だった点に特徴がある。

      長い平和のなかで商業が発展し、大坂と京都に富裕な商人が育っていた。
      彼らは自らの生活と関心に合った文芸と芸能を求める。
      出版と印刷の広がりが、それを可能にした。

      井原西鶴は浮世草子で、金と色をめぐる町人の生き方を写実的に描いた。
      近松門左衛門は人形浄瑠璃の脚本で、義理と人情の板挟みに苦しむ人々を舞台に乗せる。
      松尾芭蕉は俳諧を、滑稽な遊びから自然と人生を見つめる芸術に高めた。
      菱川師宣が浮世絵の版画を広め、尾形光琳は大胆な意匠の絵画と工芸を生み出している。

      学問も発展した。
      関孝和は独自の数学を築き、当時の世界でも高い水準に達する。
      本草学や農書が実用の知識を整理し、貝原益軒の著作が広く読まれた。
      武士の文化とは別の価値観が、都市の生活のなかから生まれたことがこの時代の意味である。
      後の化政文化では、その中心が江戸へ移っていく。
      浮世絵や版本は安価に出回り、庶民が絵と物語を日常的に楽しむようになった。
      この時期に確立した歌舞伎と浄瑠璃の演目は、現在も上演され続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/KORIN-Irises-L.jpg/500px-KORIN-Irises-L.jpg
      credit: Ogata Korin, died 1716 / Public domain
      page: https://commons.wikimedia.org/wiki/File:KORIN-Irises-L.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/元禄文化

  - id: hoei-eruption
    year: 1707
    title: 宝永地震と富士山の噴火
    category: disaster
    tags: [日本, 災害]
    summary: 巨大地震の49日後に富士山が噴火し、関東一円に火山灰が降った。
    detail: |
      南海トラフのほぼ全域が動いた巨大地震と、その49日後に起きた富士山の噴火。
      地震は1707年10月、噴火は同年12月のことである。
      日本の記録に残る災害のなかでも、最大級の連鎖になった。

      宝永地震の規模はマグニチュード8.6程度と推定され、東海から四国までが激しく揺れた。
      津波が太平洋沿岸を襲い、高知や紀伊では大きな被害が出る。
      死者は2万人前後とされるが、記録には幅がある。

      12月16日、富士山の南東斜面が噴火した。
      溶岩は流れず、大量の火山灰と軽石が噴き上げられている。
      江戸にも数センチの灰が降り、昼でも暗くなったと記録された。
      周辺の村々は田畑を灰に埋められ、その後の酒匂川の氾濫にも苦しむ。

      幕府は全国に復興のための税を課し、被災地の救済にあてた。
      ただし集めた資金の一部は幕府の財政に回されたとされる。
      富士山はこの噴火を最後に、現在まで大きな噴火を起こしていない。
      巨大地震と火山活動の関連は、現在も研究の対象であり続けている。
      同じ規模の災害が起きたときに何が起こるかを考える材料として、しばしば参照される。
      噴火でできた宝永火口は、いまも富士山の南東斜面に大きく口を開けている。
      降灰による農業の被害は、回復までに数十年を要した地域もあった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/Japan_location_map_with_side_map_of_the_Ryukyu_Islands.svg/500px-Japan_location_map_with_side_map_of_the_Ryukyu_Islands.svg.png
      credit: Maximilian Dörrbecker (Chumwa) / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Japan_location_map_with_side_map_of_the_Ryukyu_Islands.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/宝永地震

  - id: kyoho-reform
    year: 1716
    title: 享保の改革
    category: economy
    tags: [日本, 幕政改革]
    summary: 徳川吉宗が財政再建と新田開発を進め、洋書の輸入制限も緩めた。
    detail: |
      徳川吉宗が1716年から進めた幕政の改革で、江戸の三大改革の最初にあたる。
      財政の再建を主な目的とし、同時に司法と行政の仕組みも整えられた。
      名は開始時の年号に由来する。

      財政面では、支出を抑え、収入を増やす両方が進められた。
      倹約令を出して奢侈を戒め、大名から米を上納させる代わりに江戸滞在の期間を短縮する。
      新田開発を各地で進め、商人の資金による大規模な干拓も行われた。
      年貢を毎年の作柄で決める方式から、一定期間は同じ率とする定免法へ改め、収入を見通しやすくしている。

      制度の整備も進んだ。
      役職に就くあいだだけ禄を補う足高の制により、有能な人材を家格に関わらず登用できるようになる。
      目安箱を設けて庶民の意見を直接受け付け、そこから医療施設や消防の制度が生まれた。
      公事方御定書によって、刑罰と裁判の基準が明文化される。

      実学の奨励も特徴である。
      キリスト教に関わらない漢訳洋書の輸入が認められ、天文・暦・医学の研究が進んだ。
      改革によって財政は一時的に好転したが、年貢の増徴は農村を圧迫する。
      米の増産が米価の下落を招くという難問には、最後まで有効な手が打てなかった。
      以後の寛政・天保の改革は、いずれもこの改革を手本としている。
      この改革で作られた制度の多くは、幕末まで基本の形として使われた。
      商品経済の発展そのものには手を付けず、農業を基盤とする方針を貫いている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/享保の改革

  - id: tenmei-famine
    year: 1782
    title: 天明の飢饉
    category: disaster
    tags: [日本, 飢饉]
    summary: 冷害と浅間山の噴火が重なり、東北を中心に多数の餓死者を出した。
    detail: |
      1782年から数年にわたって続いた、近世日本で最大規模の飢饉。
      冷害による凶作に、浅間山の噴火が追い打ちをかけた。
      東北地方を中心に、多数の餓死者を出している。

      数年前からアイスランドのラキ火山などが噴火しており、世界的に気温が下がっていた。
      日本では長雨と低温が続き、東北の稲は実らない。
      1783年には浅間山が大噴火し、火砕流と泥流で周辺の村が埋まった。
      火山灰は広い範囲の田畑に降り積もり、日照も遮られる。

      飢えは東北で最も深刻だった。
      弘前藩では人口の大幅な減少が記録され、餓死者は全国で数十万に達したとされる。
      人が人を食べたという記録も残されている。
      一方で、備蓄と救済に成功した藩もあり、対応の差が明暗を分けた。

      米の値段は高騰し、都市では買い占めへの怒りから打ちこわしが起きた。
      1787年には江戸と大坂で大規模な暴動となり、幕府の威信は大きく傷つく。
      田沼意次の失脚と、松平定信による寛政の改革は、この危機を受けたものだった。
      定信は各地に米の備蓄を命じ、飢饉への備えを制度化している。
      気候の変動が政治を動かした例として、しばしば取り上げられる。
      浅間山の噴火では、鎌原村が土石流に埋まり、多数の犠牲者が出た。
      この飢饉の記憶は、各地の記録や供養塔として今も残されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/62/Great_Tenmei_Famine_Map_Artwork.png/500px-Great_Tenmei_Famine_Map_Artwork.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Great_Tenmei_Famine_Map_Artwork.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/天明の大飢饉

  - id: foreign-ship-order
    year: 1825
    title: 異国船打払令
    category: politics
    tags: [日本, 対外関係]
    summary: 接近する外国船を追い払う方針。アヘン戦争の報を受けて後に緩められた。
    detail: |
      接近する外国船を一律に撃退するよう命じた幕府の法令で、1825年に出された。
      無二念打払令とも呼ばれる。
      開国を迫る圧力が高まるなかでの強硬策だった。

      19世紀に入ると、ロシア・イギリス・アメリカの船が日本近海に現れるようになった。
      捕鯨船が水と食料を求めて接近し、上陸して略奪する事件も起きている。
      1808年にはイギリス軍艦が長崎に侵入したフェートン号事件があり、幕府に衝撃を与えた。

      法令は、国籍を問わず外国船を見つけ次第に砲撃し、上陸した者は捕らえるか討ち取るよう命じた。
      ためらうことなく打ち払えという表現が、その性格を示している。
      1837年、漂流民を送り届けようとしたアメリカ船のモリソン号がこの法令によって砲撃された。
      事情を知った渡辺崋山と高野長英が幕府の対応を批判し、処罰される蛮社の獄が起きる。

      1840年に始まるアヘン戦争で清がイギリスに敗れると、幕府は方針を改めた。
      1842年、薪と水を与えて穏便に帰らせる天保の薪水給与令に転換する。
      強硬策では西洋の軍事力に対抗できないという認識が広がった。
      それでも開国の準備は進まず、11年後のペリー来航で判断を迫られることになる。
      この法令は、日本が置かれた国際環境を正確に把握できていなかったことも示している。
      海防の必要は認識されており、各地で砲台の築造や洋式兵学の研究が始まった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/異国船打払令

  - id: perry-arrival
    year: 1853
    title: ペリー来航
    category: politics
    tags: [日本, 開国]
    summary: アメリカの艦隊が浦賀に現れ、翌年の開国と幕府の動揺につながった。
    detail: |
      アメリカ東インド艦隊のペリーが軍艦4隻を率いて浦賀沖に現れた出来事。
      1853年のことで、黒船来航と呼ばれる。
      翌年の開国と、幕府の動揺のきっかけになった。

      アメリカは、太平洋での捕鯨と中国との貿易のために、日本を補給地として必要としていた。
      ペリーは大統領の国書を携え、武力を示しながら受け取りを迫る。
      蒸気で動く軍艦は帆を使わずに湾内を進み、その威容は江戸の人々を驚かせた。
      幕府は国書を受け取り、回答は翌年とすることで一度退去させる。

      この間、幕府は異例の対応をとった。
      朝廷に報告し、諸大名にも意見を求めたのである。
      幕府だけで外交を決められないことを自ら示したことになり、政治の主導権は揺らぎ始めた。
      攘夷論と開国論が公然と論じられるようになる。

      1854年、ペリーは再び来航し、日米和親条約が結ばれた。
      下田と箱館が開かれ、燃料と食料の供給、漂流民の保護、領事の駐在が認められる。
      同様の条約がイギリス・ロシア・オランダとも結ばれ、200年余りの対外方針は転換した。
      4年後の通商条約へ進む流れと、尊王攘夷運動の高まりは、ここから始まっている。
      太平の眠りを覚ます、と詠んだ狂歌は、当時の衝撃をよく伝えている。
      幕府は品川沖に台場を築いて防備を固めたが、実戦に使われることはなかった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/UB_Maastricht_-_Heine_1856_-_Perry_Commissionarissen.jpg/500px-UB_Maastricht_-_Heine_1856_-_Perry_Commissionarissen.jpg
      credit: ウィルヘルム・ハイネ / Public domain
      page: https://commons.wikimedia.org/wiki/File:UB_Maastricht_-_Heine_1856_-_Perry_Commissionarissen.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/黒船来航

  - id: harris-treaty
    year: 1858
    title: 日米修好通商条約
    category: economy
    tags: [日本, 不平等条約]
    summary: 関税自主権がなく領事裁判権を認めた条約。その改正が明治外交の課題になる。
    detail: |
      アメリカ総領事ハリスとのあいだで結ばれた通商条約で、1858年に調印された。
      関税を自主的に決める権利がなく、領事裁判権を認める不平等な内容だった。
      その改正が、以後半世紀にわたる日本外交の課題になる。

      ハリスは、アヘン戦争後の清の状況を引き合いに、自主的に開国するほうが有利だと説いた。
      大老の井伊直弼は、朝廷の許可を得られないまま調印に踏み切る。
      神奈川・長崎・新潟・兵庫の開港と、江戸・大坂の開市が定められた。
      同じ内容の条約がオランダ・ロシア・イギリス・フランスとも結ばれ、安政の五カ国条約と呼ばれる。

      不平等の中身は二つある。
      一つは、外国人の犯罪を領事が自国の法で裁く領事裁判権。
      もう一つは、関税率を相手国との協定で定めるため、日本が自由に決められないことである。
      また、内外の金銀の交換比率の違いから大量の金が流出し、物価が急騰した。

      勅許を得ない調印は、尊王攘夷派の激しい反発を呼んだ。
      井伊直弼は反対派を弾圧する安政の大獄を行い、1860年に桜田門外で暗殺される。
      条約の改正は明治政府に引き継がれ、領事裁判権の撤廃は1894年、関税自主権の回復は1911年まで待つことになった。
      不平等条約という経験は、近代日本の対外意識を長く規定している。
      開港によって生糸と茶の輸出が急増し、国内の物価と産業の構造が変わった。
      条約改正は、明治政府にとって国の体面に関わる最大の課題であり続けた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Treaty_of_Amity_and_Commerce_between_Japan_and_the_United_States_29_July_1858.jpg/500px-Treaty_of_Amity_and_Commerce_between_Japan_and_the_United_States_29_July_1858.jpg
      credit: World Imaging / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Treaty_of_Amity_and_Commerce_between_Japan_and_the_United_States_29_July_1858.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日米修好通商条約

  - id: taisei-hokan
    year: 1867
    title: 大政奉還
    category: politics
    tags: [日本]
    summary: 将軍が政権を朝廷に返し、260年続いた幕府が幕を閉じた。
    detail: |
      徳川慶喜が政権を朝廷に返すと申し出た出来事で、1867年11月に京都の二条城で行われた。
      翌日に朝廷が受け入れ、260年余り続いた幕府は制度としての役目を終える。
      武家が政治を担う体制は、ここで700年ぶりに幕を閉じた。

      第二次長州征討の失敗により、幕府の軍事的な威信は失われていた。
      薩摩と長州は同盟を結び、武力による倒幕の準備を進めている。
      土佐藩は内戦を避けるため、将軍が自ら政権を返上する案を建白した。
      慶喜はこれを受け入れ、朝廷に上奏する。

      狙いは、徳川家の温存にあったとされる。
      政権を返しても、朝廷には全国を統治する実務の能力がない。
      諸藩による合議の政治になれば、最大の領地を持つ徳川家が中心に座る見込みがあった。

      しかし薩長はこれを許さなかった。
      1か月後、王政復古の大号令によって幕府も摂政関白も廃止され、新しい政府が発足する。
      同じ日の会議で、慶喜に官職の辞退と領地の返上を求める決定が下された。
      反発した旧幕府側との衝突が翌年の鳥羽伏見の戦いとなり、戊辰戦争が始まる。
      平和的な政権移譲として始まった過程は、結局は内戦を経て決着することになった。
      二条城の大広間で行われたこの場面は、近代日本の出発点としてよく描かれる。
      政権の返上と、実際の権力の移動は別の過程だったことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/Nijo_Castle.jpg/500px-Nijo_Castle.jpg
