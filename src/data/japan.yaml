        url: https://ja.wikipedia.org/wiki/乙巳の変

  - id: hakusukinoe
    year: 663
    title: 白村江の戦い
    category: war
    tags: [日本, 朝鮮, 唐]
    summary: 唐・新羅の連合軍に大敗。国防と国内統一を急ぐ動機になった。
    detail: |
      倭と百済の遺民の連合軍が、唐と新羅の連合軍に大敗した戦い。
      663年、朝鮮半島西岸の白村江で行われた。
      日本が古代に経験した最大の対外的な敗北である。

      660年に百済が唐と新羅に滅ぼされると、その遺臣は復興のため倭に援軍を求めた。
      倭は、百済に人質として滞在していた王子の豊璋を送り返し、大軍を渡海させる。
      長年の友好国を失うことは、鉄資源と大陸との窓口を失うことを意味していた。

      663年の戦闘で、倭の水軍は唐の艦隊に4度戦って敗れた。
      400艘の船が焼かれたと中国の史書は記す。
      百済の復興はここで絶え、多くの遺民が倭へ亡命した。

      敗戦を受けて、国内の防衛体制が急いで整えられた。
      北九州には水城と呼ばれる土塁が築かれ、瀬戸内から畿内にかけて朝鮮式の山城が並ぶ。
      防人と烽の制度が敷かれ、都も内陸の近江へ移された。
      戸籍の作成が進められたのも、兵と税を把握する必要からである。
      外圧が国内の統一と制度整備を加速させるという構図が、はっきり現れた出来事だった。
      亡命した百済の人々は技術と学識を持ち込み、律令国家の建設に加わった。
      唐と正面から戦った経験は、その後の対外政策を慎重なものにしている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1b/Map_of_the_Battle_of_Baekgang.png/500px-Map_of_the_Battle_of_Baekgang.png
      credit: Stillskywkpd / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Map_of_the_Battle_of_Baekgang.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/白村江の戦い
    related: [silla-unification]

  - id: jinshin-war
    year: 672
    title: 壬申の乱
    category: war
    tags: [日本, 内乱]
    summary: 皇位をめぐる内戦に勝った天武天皇のもとで、天皇の権威が大きく高まった。
    detail: |
      天智天皇の死後、皇位をめぐって起きた古代最大の内乱。
      672年、天智天皇の子である大友皇子と、弟の大海人皇子が争った。
      勝った大海人皇子が天武天皇として即位する。

      天智天皇は、弟ではなく子に位を継がせようとしていた。
      大海人皇子は身の危険を避けて出家し、吉野に隠退する。
      天智の死後、近江の朝廷が兵を集めていると知ると、吉野を脱して東国へ向かった。

      美濃と尾張の兵を集め、不破の関を押さえて東国からの補給路を確保する。
      近江と大和の二方面で戦い、1か月ほどで近江の朝廷軍を破った。
      大友皇子は自害し、朝廷を支えていた有力豪族は一掃される。

      勝利した天武天皇は、飛鳥に戻って即位した。
      大臣を置かず、皇族を中心に政治を運営する体制を敷く。
      敵対した豪族の力が削がれたことで、天皇への権力集中は一気に進んだ。
      天皇という称号や、国史の編纂、律令の作成が本格化するのもこの後である。
      皇位継承の争いが結果として国家の形を固めたという点で、日本古代史の分岐点にあたる。
      この内乱以降、200年近くにわたって国内で大規模な戦乱は起きなかった。
      大友皇子は明治になってから弘文天皇として歴代に加えられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f3/Fuwanoseki2.JPG/500px-Fuwanoseki2.JPG
      credit: Guretaro / Public domain
      page: https://commons.wikimedia.org/wiki/File:Fuwanoseki2.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/壬申の乱

  - id: taiho-code
    year: 701
    title: 大宝律令
    category: society
    tags: [日本, 律令]
    summary: 唐にならった法典が整い、日本は律令国家として形を得た。
    detail: |
      唐の律令にならって編まれた、日本で最初の本格的な法典。
      701年に完成し、律6巻と令11巻からなる。
      刑部親王と藤原不比等らが編纂にあたった。

      律は刑罰を、令は行政の組織と運用を定める。
      中央には神祇官と太政官の二官、その下に八つの省が置かれた。
      地方は国・郡・里に区分され、中央から国司が派遣される。
      戸籍と計帳を作り、6年ごとに口分田を配る班田収授が定められた。

      税は、穀物を納める租、布などを納める調、労役とその代納である庸からなる。
      兵役も課され、成年男子の負担は重かった。
      官僚は位階に応じて職と給与を得る仕組みで、蔭位の制により上級貴族の子は優遇される。
      唐の制度を写しながら、氏族の秩序を残す部分が組み込まれていた。

      この法典によって、日本は律令国家としての形を得た。
      718年には改訂された養老律令が編まれ、こちらが長く用いられる。
      律令の規定は平安時代に入ると実態と合わなくなり、荘園の広がりとともに機能を失っていった。
      それでも官職の名や身分の枠組みは形式として残り、明治になるまで参照され続ける。
      律の本文はほとんど失われ、令の内容は後世の注釈書から復元されている。
      東アジアで唐の律令を全面的に取り入れた国家として、日本は朝鮮やベトナムと並ぶ例になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大宝律令

  - id: kojiki
    year: 712
    title: 『古事記』の成立
    category: culture
    tags: [日本, 書物]
    summary: 神話から歴代天皇までを一つの物語にまとめ、国の由来を語る書。
    detail: |
      現存する日本最古の書物で、712年に成立したとされる。
      太安万侶が編纂し、元明天皇に献上された。
      天地の始まりから推古天皇の時代までを、三巻にまとめている。

      序文によれば、天武天皇が諸家に伝わる記録の誤りを正そうとしたことが発端とされる。
      稗田阿礼が記憶していた内容を、太安万侶が文字に起こしたと記される。
      漢字の音と訓を混ぜて日本語の語りを写す独特の文体が用いられた。

      上巻は神話で、国生み、天照大神と須佐之男命、出雲の国譲り、天孫降臨が語られる。
      中巻と下巻は神武天皇以降の伝承で、ヤマトタケルや仁徳天皇の話が続く。
      歌謡が多く収められ、物語としての性格が強い。

      『日本書紀』が対外的な正史として漢文で書かれたのに対し、こちらは国内向けの性格が強い。
      天皇の支配の由来を神話によって語り、豪族の系譜をその物語のなかに位置づけている。
      長く注目されなかったが、江戸時代に本居宣長が『古事記伝』を著して評価を確立した。
      国学と近代の神話研究、さらには現代の創作まで、日本の物語の源泉であり続けている。
      稗田阿礼が男性か女性かも含め、その人物像はよく分かっていない。
      近代には国家神話の典拠とされ、読み方そのものが政治と結びついた時期もある。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/0/05/Kojiki_Shinpukuji.jpg
      credit: Ken'yu (賢瑜) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Kojiki_Shinpukuji.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/古事記

  - id: nihon-shoki
    year: 720
    title: 『日本書紀』の成立
    category: culture
    tags: [日本, 書物]
    summary: 中国の史書にならった正史。対外的に国の歴史を示す目的があった。
    detail: |
      720年に完成した、日本で最初の勅撰の正史。
      舎人親王らが編纂し、神代から持統天皇の時代までを扱う。
      六つの正史の第一にあたり、全30巻からなる。

      中国の史書にならい、漢文で年代を追って記す編年体をとった。
      朝廷の記録に加え、百済の史書や寺院の縁起、氏族の伝承が引かれている。
      異なる伝えを一書として併記する箇所が多く、編纂の過程がうかがえる。

      目的の一つは、対外的に国の歴史を示すことだった。
      唐を中心とする東アジアの秩序のなかで、日本が古くから続く国であることを主張する。
      天皇の支配の正統性を神話にさかのぼって根拠づける構成もそのためである。

      記述の年代には、干支を用いた繰り上げなどの操作があると指摘されてきた。
      特に初期の天皇の在位年数は現実離れしており、そのまま史実として扱うことはできない。
      一方で、6世紀以降の記事は他の史料や考古資料と合う部分が多い。
      古代史の研究は、この書物をどう読み解くかという作業と切り離せないものになっている。
      以後、平安時代にかけて六つの正史が編まれ、国家が歴史を記す伝統が続いた。
      朝鮮半島の古代史についても、失われた百済の史料を引く貴重な記述を含んでいる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/Nihonshoki_tanaka_version.jpg/500px-Nihonshoki_tanaka_version.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Nihonshoki_tanaka_version.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日本書紀

  - id: konden-law
    year: 743
    title: 墾田永年私財法
    category: society
    tags: [日本, 土地制度]
    summary: 開墾した土地の私有を認め、律令の土地制度が崩れて荘園が広がる起点になった。
    detail: |
      自分で開墾した田の私有を永久に認めた法令で、743年に出された。
      律令が定めた公地公民の原則を、事実上その内側から崩すことになる。
      荘園が広がっていく起点として扱われる。

      背景には、口分田の不足と農民の逃亡があった。
      人口が増える一方で配る田が足りず、重い税を逃れて戸籍から姿を消す者が絶えない。
      朝廷は723年に三世一身法を出し、新たに水路を開いた者には三代の私有を認めていた。
      しかし期限が来れば国に返すため、開墾の意欲は続かなかった。

      新しい法令では、開墾地の保有に期限を設けず、子孫に伝えることを認めた。
      身分に応じて面積の上限が定められ、国司への届け出も必要とされている。
      狙いは耕地を増やして税収を確保することであり、私有を広げること自体が目的ではなかった。

      しかし実際に開墾を進められたのは、労働力と資金を持つ貴族と大寺院である。
      彼らは周辺の農民を使って大規模な土地を囲い込み、初期荘園と呼ばれる私領を各地に築いた。
      国家が土地を配って税を取るという律令の仕組みは、ここから徐々に実態を失っていく。
      平安時代には不輸・不入の特権を得た荘園が広がり、公領との二重構造が定着した。
      土地の私有が拡大する流れは、やがて武士の成長の土台にもなる。
      この法令は口分田の制度を廃したわけではなく、両者はしばらく並行して存在した。
      土地を誰が持つのかという問いは、以後の日本史を貫く論点になっていく。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/墾田永年私財法

  - id: great-buddha
    year: 752
    title: 東大寺大仏の開眼
    category: religion
    tags: [日本, 仏教]
    summary: 国家の総力を挙げた事業。仏教で国を守るという考えが極まった。
    detail: |
      東大寺の盧舎那仏が完成し、開眼の供養が行われた出来事。
      752年のことで、聖武天皇の発願から7年が経っていた。
      国家の総力を挙げた事業であり、仏教で国を守るという考えが極まった場面である。

      像の高さはおよそ15メートル、使われた銅は500トン近いとされる。
      鋳造は何段にも分けて行われ、表面には水銀を用いた金めっきが施された。
      民間で信望を集めていた行基が勧進に加わり、各地から寄進と労働力が集められている。
      動員されたのはのべ260万人に及ぶと伝えられる。
      事業の費用と労役は、地方の農民に重くのしかかった。

      開眼供養には、聖武太上天皇と孝謙天皇、そして1万人を超える僧が参列した。
      筆を執って仏の目を描き入れたのは、インド出身の僧である菩提僊那だった。
      唐やベトナム、朝鮮半島の僧も加わり、国際色の濃い儀式になっている。
      儀式に用いられた品々は正倉院に納められ、今に伝わる。

      大仏は、1180年と1567年の兵火で二度焼け落ち、そのつど再建された。
      現在の像は江戸時代の再建で、当初のまま残るのは台座の一部などに限られる。
      国家が仏教に託した安泰は実現せず、政変と飢饉は続いた。
      それでも、この事業が東アジアの技術と信仰を集めた到達点であることは変わらない。
      大仏の造立に協力した行基は、当初は民衆を惑わす者として取り締まられていた。
      国家が民間の宗教者の力を借りるほど、事業の規模は大きかった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7a/Daibutsu_of_Todaiji_4.jpg/500px-Daibutsu_of_Todaiji_4.jpg
      credit: Mafue / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Daibutsu_of_Todaiji_4.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/東大寺盧舎那仏像

  - id: saicho-kukai
    year: 804
    title: 最澄と空海が唐へ渡る
    category: religion
    tags: [日本, 仏教]
    summary: 天台宗と真言宗が持ち帰られ、貴族から民衆まで届く日本仏教の土台になった。
    detail: |
      最澄と空海が遣唐使の船で唐へ渡った年。
      二人はそれぞれ新しい教えを持ち帰り、日本仏教の骨格を作り替えた。
      奈良の諸宗が都の寺院に根を張っていた状況を変える契機になる。

      最澄はすでに比叡山に寺を構え、天皇の信任を得た僧だった。
      短期の留学として渡り、天台山で教えを受けて1年足らずで帰国する。
      天台宗を開き、すべての人が仏になれるという立場から、奈良の教学と激しく論争した。
      比叡山に独自の僧を育てる制度を認めさせ、延暦寺は後に法然・親鸞・道元・日蓮を輩出する母体になる。

      空海は無名の私度僧に近い立場で、20年の留学生として渡った。
      長安で密教の第一人者である恵果に学び、その後継者として認められる。
      わずか2年で帰国し、持ち帰った経典と法具で真言宗を開いた。
      高野山に金剛峯寺を、京には東寺を与えられ、密教は国家の祈祷と結びついていく。

      密教は、加持祈祷によって現世の願いに応えるという点で、貴族に強く支持された。
      最澄の天台も密教を取り込み、両者は日本仏教の主流になる。
      空海は書や土木にも通じ、庶民のための学校を開いたと伝えられる。
      中国から教えを受け取る段階が終わり、日本で教えを育てる段階に入った転機でもあった。
      二人は帰国後しばらく親交があったが、経典の借用などをめぐって疎遠になったと伝えられる。
      山に寺を開くという形は、平地の官寺が中心だった奈良仏教との違いをよく表している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/%E6%9C%80%E6%BE%84%E5%83%8F_%E4%B8%80%E4%B9%97%E5%AF%BA%E8%94%B5_%E5%B9%B3%E5%AE%89%E6%99%82%E4%BB%A3.jpg/500px-%E6%9C%80%E6%BE%84%E5%83%8F_%E4%B8%80%E4%B9%97%E5%AF%BA%E8%94%B5_%E5%B9%B3%E5%AE%89%E6%99%82%E4%BB%A3.jpg
      credit: 作者不明 / Public domain
