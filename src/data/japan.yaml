        url: https://ja.wikipedia.org/wiki/廃藩置県

  - id: gakusei-railway
    year: 1872
    title: 学制の公布と鉄道の開業
    category: society
    tags: [日本, 近代化]
    summary: 国民皆学と鉄道が同じ年に始まり、人と知識の流れが一変した。
    detail: |
      国民皆学を掲げた学制の公布と、新橋・横浜間の鉄道開業が同じ1872年に行われた。
      人と知識の流れを一変させる二つの出来事が重なった年である。
      いずれも、近代国家をつくるための基盤の整備だった。

      学制は、フランスの制度を参考に全国を学区に分け、小学校を設ける計画だった。
      身分や性別に関わらず、すべての子どもが学ぶべきだという理念が掲げられる。
      教育費は住民の負担とされ、当初は就学率が上がらず、学校の打ちこわしも起きた。
      制度は何度も改められ、明治の末には就学率が9割を超える。

      鉄道は、新橋と横浜のあいだ29キロで開業した。
      イギリスの技術者の指導と資金で建設され、所要時間は53分だった。
      人々は蒸気機関車を見物に集まり、文明開化の象徴として受け止められる。
      以後、東海道線が全通し、私鉄も加わって全国に路線が広がった。

      二つの事業は、地域ごとに閉じていた社会を全国的な空間に変えた。
      教育は共通の言葉と知識を、鉄道は人と物の高速な移動をもたらす。
      国民という意識が生まれるうえで、この二つが果たした役割は大きい。
      同じ年には太陽暦の採用も決まり、時間の数え方まで改められている。
      鉄道の開業式には明治天皇も出席し、国家の事業であることが示された。
      学制の理念は、その後の教育令や学校令に引き継がれて形を変えていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Go-shichi_no_kiri_crest_2.svg/500px-Go-shichi_no_kiri_crest_2.svg.png
      credit: Sakurambo / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Go-shichi_no_kiri_crest_2.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/学制

  - id: meiji-constitution
    year: 1889
    title: 大日本帝国憲法の発布
    category: society
    tags: [日本, 立憲]
    summary: アジアで最初の本格的な近代憲法。翌年、帝国議会が開かれた。
    detail: |
      1889年2月11日に発布され、翌年に施行された日本で最初の近代憲法。
      アジアで最初の本格的な立憲制の成立として、各国の注目を集めた。
      天皇が定めて国民に与えるという欽定憲法の形をとっている。

      背景には、自由民権運動の高まりと条約改正の必要があった。
      国会の開設を求める声に対し、政府は1881年に10年後の開設を約束する。
      伊藤博文らがヨーロッパで調査を行い、君主権の強いドイツの制度を参考にした。

      内容では、統治権は天皇にあるとされた。
      軍の統帥、宣戦と講和、条約の締結、緊急の勅令など、広い大権が規定される。
      帝国議会は衆議院と貴族院の二院制で、予算と法律の審議に関与した。
      国民は臣民と呼ばれ、言論や信教の自由は法律の範囲内で認められる。
      内閣は天皇に対して責任を負い、議会に対しては負わないとされた。

      1890年の第1回総選挙の有権者は、高額納税者の男子に限られ、人口の1パーセント程度だった。
      それでも議会は予算の審議を通じて政府に影響を及ぼし、やがて政党内閣が生まれる。
      一方で、軍の統帥が内閣から独立していたことは、昭和期に政治が軍を抑えられない原因になった。
      この憲法は1947年まで効力を持ち、日本国憲法へ改正という形で引き継がれる。
      発布の日付は、神武天皇の即位の日とされた紀元節に合わせられている。
      憲法の条文の解釈をめぐる議論は、その後の政治を大きく左右した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Meiji-Constitution-Empire-of-Japan.png/500px-Meiji-Constitution-Empire-of-Japan.png
      credit: Kantei / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Meiji-Constitution-Empire-of-Japan.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大日本帝国憲法

  - id: russo-japanese-war
    year: 1904
    title: 日露戦争
    category: war
    tags: [日本, ロシア]
    summary: 大国ロシアに勝ち、アジアの民族運動を刺激する一方、大陸進出を加速させた。
    detail: |
      日本とロシアが朝鮮と満洲の権益をめぐって戦った戦争で、1904年から翌年まで続いた。
      近代の非西洋国家が、ヨーロッパの大国に勝った最初の例として世界に衝撃を与えた。
      しかし日本の国力は限界に達していた。

      三国干渉で遼東半島を手放した後、ロシアは旅順を租借し、満洲に兵を置いた。
      日本は1902年にイギリスと同盟を結び、交渉が決裂すると開戦に踏み切る。
      旅順の攻防では多数の死傷者を出し、203高地の争奪戦は激戦として知られる。
      1905年の奉天会戦で辛うじて勝利し、日本海海戦ではバルチック艦隊をほぼ全滅させた。

      日本は兵力も資金も尽きかけていた。
      ロシアも国内で革命の動きが起き、戦争の継続が難しくなる。
      アメリカの仲介でポーツマス条約が結ばれ、韓国における優越権、旅順と大連の租借権、南樺太が日本に認められた。
      賠償金は得られず、不満を抱いた民衆が日比谷で暴動を起こしている。

      この勝利は、アジアやアフリカの民族運動を勇気づけた。
      一方で日本は、韓国の保護国化と併合、満洲への進出を進めていく。
      南満洲鉄道の経営は、後の大陸政策の拠点になった。
      軍の発言力が高まり、その後の政治に長く影響を残した戦争でもある。
      戦費の多くは外債でまかなわれ、返済は長く国家財政の負担になった。
      従軍した兵士の手記や与謝野晶子の詩は、戦争への複雑な感情を伝えている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/RUSSOJAPANESEWARIMAGE.jpg/500px-RUSSOJAPANESEWARIMAGE.jpg
      credit: Original uploader and author was Dustandshadow at en.wikipedia / Public domain
      page: https://commons.wikimedia.org/wiki/File:RUSSOJAPANESEWARIMAGE.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日露戦争

  - id: great-kanto-earthquake
    year: 1923
    title: 関東大震災
    category: disaster
    tags: [日本, 災害]
    summary: 首都圏が壊滅し、10万人以上が犠牲に。混乱のなかで朝鮮人虐殺も起きた。
    detail: |
      1923年9月1日に発生した地震と、それによる大規模な災害。
      マグニチュードは7.9と推定され、死者と行方不明は10万5千人に及んだ。
      首都圏が壊滅的な被害を受けた。

      発生は昼食の時間帯で、各所で火災が起きた。
      強風にあおられて火は広がり、東京と横浜の市街の大半を焼く。
      避難した人々が密集した被服廠跡では、火災旋風によって3万人以上が亡くなった。
      犠牲者の9割近くが焼死とされ、災害の性格を示している。

      混乱のなかで、朝鮮人が井戸に毒を入れたといった流言が広まった。
      自警団や軍、警察によって多数の朝鮮人と中国人が殺害される。
      社会主義者や労働運動の活動家が官憲に殺される事件も起きた。
      戒厳令が敷かれ、情報が統制されたことが流言の拡大を招いた面もある。

      復興は、後藤新平を中心とする帝都復興院が担った。
      幹線道路と公園、橋梁が整備され、区画整理が進められている。
      耐震設計の研究が本格化し、建築基準の考え方も変わった。
      9月1日は防災の日と定められ、現在も訓練が行われている。
      経済への打撃は大きく、震災手形の処理が金融恐慌につながっていった。
      虐殺の事実は政府の調査や司法記録にも残され、現在も検証が続いている。
      震災を機に、東京の都市機能を分散させる構想も繰り返し論じられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/Kanto-daishinsai.jpg/500px-Kanto-daishinsai.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Kanto-daishinsai.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/関東大震災

  - id: universal-suffrage-1925
    year: 1925
    title: 普通選挙法
    category: society
    tags: [日本, 民主化]
    summary: 25歳以上の男子に選挙権が広がる一方、同時に治安維持法が作られた。
    detail: |
      25歳以上のすべての男子に選挙権を認めた法律で、1925年に制定された。
      納税額による制限が撤廃され、有権者は一挙に4倍に増えた。
      同時に治安維持法が作られたことが、この年の特徴である。

      普通選挙を求める運動は、大正期を通じて高まっていた。
      労働者と農民の組織が育ち、デモクラシーを求める世論が広がる。
      加藤高明の護憲三派内閣が、この要求を受けて法案を成立させた。
      有権者は約1240万人となり、人口の2割に達する。

      一方、同じ議会で治安維持法が可決された。
      国体の変革や私有財産制度の否認を目的とする結社を禁じる内容である。
      選挙権の拡大によって社会主義勢力が議席を得ることへの警戒が背景にあった。
      この法律はのちに改正されて最高刑が死刑となり、思想の取り締まりに広く使われる。

      女性の参政権は認められなかった。
      実現するのは、敗戦後の1945年の改正を待つことになる。
      1928年の最初の普通選挙では、無産政党から8人が当選した。
      その直後に大規模な検挙が行われ、運動は抑え込まれていく。
      自由の拡大と統制の強化が同時に進んだ点が、この時期を象徴している。
      有権者の急増によって、政党は組織的な選挙運動を迫られるようになった。
      治安維持法は1945年に廃止されるまで、思想と言論を広く取り締まった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Go-shichi_no_kiri_crest_2.svg/500px-Go-shichi_no_kiri_crest_2.svg.png
      credit: Sakurambo / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Go-shichi_no_kiri_crest_2.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/普通選挙法

  - id: manchurian-incident
    year: 1931
    title: 満洲事変
    category: war
    tags: [日本, 中国]
    summary: 軍の独断で始まった占領が国際的な孤立を招き、以後の戦争への道を開いた。
    detail: |
      関東軍が南満洲鉄道の線路を爆破し、それを口実に満洲全土を占領した事件。
      1931年9月18日の柳条湖での爆破から始まった。
      以後15年にわたる戦争への出発点になる。

      関東軍は、満洲を日本の勢力下に置くことが国防と経済に不可欠だと考えていた。
      中国では国民政府による統一が進み、権益が脅かされるという危機感もあった。
      爆破は関東軍自身が仕組んだものだったが、中国軍の仕業として軍事行動を開始する。
      政府は不拡大の方針を示したが、現地の軍は無視して占領を広げた。

      翌1932年、清の最後の皇帝であった溥儀を執政に立てて満洲国が建てられた。
      実権は関東軍が握り、日本人の官僚が行政を動かす。
      国内では、行き詰まった経済の打開策として占領を支持する世論が強かった。
      同じ年、首相が海軍の青年将校に暗殺され、政党内閣は終わる。

      中国の提訴を受けた国際連盟はリットン調査団を派遣した。
      報告書は日本の行動を自衛とは認めず、満洲国の承認も否定する。
      1933年、日本は国際連盟を脱退し、国際的な孤立の道に入った。
      現地の軍が独断で始めた行動を政府が追認するという構図は、その後も繰り返される。
      満洲国には多くの日本人が移民として送られ、敗戦時に悲惨な逃避行を強いられた。
      事件の首謀者が処罰されなかったことが、軍の独走を助長した。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/c/cb/Mukden_1931_japan_shenyang.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Mukden_1931_japan_shenyang.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/満洲事変

  - id: pearl-harbor
    year: 1941
    title: 真珠湾攻撃と太平洋戦争の開戦
    category: war
    tags: [日本, アメリカ]
    summary: 対米英開戦。日中戦争が世界大戦と一つにつながった。
    detail: |
      日本海軍がハワイの真珠湾にあるアメリカ太平洋艦隊を攻撃し、太平洋戦争が始まった出来事。
      日本時間の1941年12月8日未明で、ほぼ同時にマレー半島への上陸も行われた。
      日中戦争が、世界大戦と一つにつながった。

      日米交渉は、中国からの撤兵をめぐって行き詰まっていた。
      アメリカは対日石油輸出を禁止し、日本は資源の確保を南方に求める。
      海軍は、南方作戦の側面を脅かす米艦隊を初撃で無力化する作戦を立てた。

      6隻の空母から350機以上が発進し、戦艦8隻を撃沈または大破させた。
      対する日本側の損害は軽微だったが、空母は港におらず、燃料施設も攻撃されなかった。
      宣戦布告の通告が攻撃開始に間に合わず、不意打ちと受け止められる。
      これがアメリカ国内の世論を一つにまとめ、参戦への強い意志を生んだ。

      日本は半年ほどで東南アジアの広い地域を占領した。
      しかし1942年のミッドウェー海戦で空母4隻を失い、以後は守勢に回る。
      国力の差は圧倒的で、戦争は消耗戦になった。
      アメリカ、イギリス、中国、ソ連を相手にする戦争を選んだ判断は、以後も検証され続けている。
      攻撃の成功は、戦艦中心から航空機中心へという海戦の転換も示していた。
      開戦を決めた過程では、誰も止められないまま結論だけが進んだと指摘される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c4/Pearl_Harbor-_Nakajima_B5N2_over_Hickam-_80G178985.jpg/500px-Pearl_Harbor-_Nakajima_B5N2_over_Hickam-_80G178985.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Pearl_Harbor-_Nakajima_B5N2_over_Hickam-_80G178985.jpg
    links:
