  - id: meiji-restoration
    year: 1868
    title: 明治維新
    category: society
    tags: [日本, 近代化]
    summary: 幕府が倒れ、天皇を中心とする新政府が近代化に舵を切った。
    detail: |
      幕府が倒れ、天皇を中心とする新政府が成立して近代化が始まった一連の変革。
      1868年を中心に、その前後数年の動きを含めて呼ばれる。
      封建的な体制から中央集権の国家へ移る出発点になった。

      前年の大政奉還に続き、王政復古の大号令で新政府が発足した。
      旧幕府側との衝突は鳥羽伏見の戦いから始まり、函館まで1年半続く戊辰戦争となる。
      新政府は五箇条の御誓文で方針を示し、広く会議を開いて公論に決すると掲げた。
      江戸は東京と改められ、天皇が移って新しい都になる。

      改革は矢継ぎ早に進められた。
      1869年の版籍奉還で大名が土地と人民を返し、1871年の廃藩置県で藩そのものがなくなる。
      身分制度は廃され、職業と居住、結婚の自由が認められた。
      徴兵令によって武士だけが戦う時代は終わり、学制によって国民皆学が掲げられる。

      改革を担ったのは、下級武士の出身者が多かった。
      岩倉使節団は欧米を視察し、制度と技術を学んで帰国する。
      一方で特権を失った士族は各地で反乱を起こし、1877年の西南戦争で最後の抵抗が鎮まった。
      短期間で社会の仕組みを作り替えた例として、世界史でもしばしば取り上げられる。
      維新という言葉には、古いものを新しくするという意味が込められている。
      王政復古を掲げながら、実際には前例のない国家を作った点に特徴がある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/53/Emperor_Arriving_in_Tokyo_by_Kobori_Tomoto_%28Meiji_Memorial_Picture_Gallery%29.jpg/500px-Emperor_Arriving_in_Tokyo_by_Kobori_Tomoto_%28Meiji_Memorial_Picture_Gallery%29.jpg
