        url: https://ja.wikipedia.org/wiki/源氏物語

  - id: hogen-rebellion
    year: 1156
    title: 保元の乱
    category: war
    tags: [日本, 武士]
    summary: 貴族の争いが武士の力で決着し、武士が政治の主役になる流れが決定的になった。
    detail: |
      皇位の継承と摂関家の内紛が重なって、朝廷が二つに割れて武力衝突した政変。
      1156年、後白河天皇の側と崇徳上皇の側が京で戦った。
      貴族どうしの争いが武士の力で決着したことで、武士の地位は決定的に変わる。

      鳥羽法皇が没した直後、抑えられていた対立が噴き出した。
      崇徳上皇は自らの子への継承を望んだが、鳥羽法皇は後白河天皇を選んでいた。
      摂関家でも、関白の藤原忠通とその弟の頼長が対立していた。
      双方が武士を集め、天皇方には平清盛と源義朝が、上皇方には源為義と平忠正がついた。
      源氏も平氏も一族が敵味方に分かれている。

      戦いは、夜討ちを仕掛けた天皇方の勝利で短時間に終わった。
      崇徳上皇は讃岐に流され、その地で没する。
      藤原頼長は矢傷がもとで死んだ。
      敗れた武士は処刑され、源義朝は父の為義を自ら斬る役目を負わされている。

      この乱は、武士がいなければ朝廷内の争いすら決着しないことを示した。
      恩賞をめぐる不満から、3年後には平治の乱が起き、平清盛が源義朝を倒す。
      以後、平氏が中央政界の頂点に立つ道が開かれた。
      後世、この乱をもって武者の世が始まったと評する文章も書かれている。
      崇徳上皇は配流先で没し、その怨霊は長く恐れられた。
      敗者を処刑する慣行がこの乱で復活し、以後の争いは苛烈になっていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/H%C5%8Dgen_no_ran.jpg/500px-H%C5%8Dgen_no_ran.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:H%C5%8Dgen_no_ran.jpg
    links:
