  - id: dannoura
    year: 1185
    title: 壇ノ浦の戦い
    category: war
    tags: [日本, 源平]
    summary: 平氏が滅び、源頼朝による武家政権の成立へとつながった。
    detail: |
      源平の争乱の最後の戦いで、1185年に長門の壇ノ浦で行われた。
      源義経が率いる水軍が平氏の船団を破り、平氏は滅亡した。
      瀬戸内海の西の端、関門海峡での戦闘である。

      一ノ谷と屋島で敗れた平氏は、瀬戸内を西へ追われていた。
      幼い安徳天皇と三種の神器を擁していたことが、最後まで交渉の材料になる。
      戦いは潮の流れが変わったことで形勢が逆転したと語られてきたが、実際の潮流については異説も多い。
      義経が船の漕ぎ手を射させたという伝えもある。

      敗色が濃くなると、平氏の人々は次々に海へ身を投げた。
      二位尼は8歳の安徳天皇を抱いて入水し、天皇は歴代で唯一、戦いのなかで命を落とした。
      三種の神器のうち剣はこのとき失われ、後に代用の品が用いられている。
      生き残った平宗盛は捕らえられ、鎌倉へ送られた後に処刑された。

      この戦いで、5年に及んだ内乱は終わった。
      頼朝は義経の追討を名目に守護と地頭を置き、全国的な支配の枠組みを手にする。
      平氏の滅亡と幼帝の死は、『平家物語』によって無常を語る物語となり、琵琶法師の語りで広まった。
      武家の政権が京ではなく東国に置かれるという、その後の日本の形がここで定まっている。
      安徳天皇をめぐる伝説は西日本の各地に残り、平家の落人の話も各地で語られる。
      義経はこの後、頼朝と対立して追われ、奥州で命を落とした。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/10/AntokuTennou_Engi.7%268_Dannoura_Kassen.jpg/500px-AntokuTennou_Engi.7%268_Dannoura_Kassen.jpg
      credit: 伝土佐光信 / Public domain
      page: https://commons.wikimedia.org/wiki/File:AntokuTennou_Engi.7%268_Dannoura_Kassen.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/壇ノ浦の戦い

  - id: yoritomo-shogun
    year: 1192
    title: 源頼朝が征夷大将軍になる
    category: politics
    tags: [日本, 武家]
    summary: 武士による全国支配の枠組みが公式に認められた。
    detail: |
      源頼朝が朝廷から征夷大将軍に任じられた出来事で、1192年のことである。
      武士による全国支配の枠組みが、公式の地位として認められた。
      征夷大将軍はもともと東北へ派遣される臨時の軍の長を指す官職だった。

      頼朝はすでに1185年の時点で、守護と地頭を置く権限を得ていた。
      全国の軍事と警察、年貢の徴収に関わる権限を握っており、実態としての政権はできあがっている。
      それでも将軍の地位を求めたのは、御家人を率いる立場を公のものとするためだった。
      後白河法皇が生前はこれを認めず、その死の直後に任命が実現している。

      将軍の地位は、御家人との関係を支える要になった。
      土地を保証する主人としての権威が、朝廷の公認によって補強される。
      以後、武家の政権の長は将軍を名乗ることが通例となり、室町・江戸へ受け継がれた。
      幕府という呼び名も、将軍の陣営を意味する語に由来する。

      頼朝自身は2年で将軍を辞している。
      幕府の成立年としては、この1192年のほか、守護地頭を置いた1185年を採る見方が有力になった。
      実質的な政権の成立と、形式的な承認のどちらを重くみるかの違いである。
      武士が土地の支配を通じて国を治める体制は、ここから明治維新まで続いた。
      鎌倉に武家の都が築かれ、京都とは別の政治の中心が生まれた。
      将軍という地位の意味は、この任命によって大きく変わっている。
    image:
