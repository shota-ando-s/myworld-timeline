  - id: haihan-chiken
    year: 1871
    title: 廃藩置県
    category: society
    tags: [日本, 中央集権]
    summary: 藩を廃して県を置き、封建的な地方支配を一挙に解体した。
    detail: |
      藩を廃止して県を置き、地方の統治を中央に一元化した改革。
      1871年8月に断行され、封建的な地方支配が一挙に解体された。
      明治維新のなかでも、最も大きな制度の転換とされる。

      1869年の版籍奉還で、大名は土地と人民を朝廷に返していた。
      しかし旧大名はそのまま知藩事として領地を治めており、実態は大きく変わっていない。
      藩ごとに軍と財政があり、負債も抱えたままで、統一した政策が実行できなかった。

      政府は薩摩・長州・土佐から兵を集めて御親兵を編成し、武力を背景に発表に踏み切った。
      知藩事は職を解かれて東京へ移住を命じられ、藩の軍は解散される。
      藩の負債は政府が引き受け、旧大名には華族として家禄が与えられた。
      3府302県が置かれ、その年のうちに3府72県へ統合されている。

      大きな抵抗が起きなかったことは、当時の人々にも意外だった。
      多くの藩が財政破綻に近く、負債を引き受けてもらえることが受け入れの理由になったとみられる。
      これによって全国から税と兵を集められるようになり、近代国家の基盤ができた。
      県令は中央から派遣され、現在の都道府県制度の原型がここに生まれている。
      県庁の置かれた都市が地域の中心となり、その後の発展を大きく左右した。
      旧藩の意識は長く残り、現在の県民性の語られ方にも影響している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Modern_Japan_prefectures_map_in_1872.jpg/500px-Modern_Japan_prefectures_map_in_1872.jpg
      credit: 吉田東伍 他 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Modern_Japan_prefectures_map_in_1872.jpg
    links:
