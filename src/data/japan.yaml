  - id: jokyu-war
    year: 1221
    title: 承久の乱
    category: war
    tags: [日本, 朝廷]
    summary: 上皇の倒幕計画を幕府が制し、武家が朝廷を上回る力を持つことが確定した。
    detail: |
      後鳥羽上皇が鎌倉幕府の打倒を図って挙兵し、わずか1か月で敗れた戦い。
      1221年に起き、朝廷と幕府の力関係を決定づけた。
      上皇が武家に敗れるという、それまで考えられなかった結果になった。

      源氏の将軍が3代で絶え、幕府では北条氏が執権として実権を握っていた。
      後鳥羽上皇は、この機に朝廷の権威を回復できると判断する。
      1221年、執権の北条義時を討てという命令を諸国へ発した。
      幕府側では動揺が走ったが、北条政子が頼朝の恩を説いて御家人をまとめたと伝えられる。

      幕府は19万と号する大軍を三方から京へ向かわせた。
      上皇方に集まった兵は少なく、宇治川の防衛線が破られると京はすぐに占領される。
      後鳥羽上皇は隠岐に流され、二人の上皇も配流された。
      天皇は廃され、幕府が新たな天皇を立てている。

      戦後、上皇方についた貴族と武士の所領3000余りが没収され、御家人に与えられた。
      これにより、それまで手薄だった西国にも幕府の支配が及ぶ。
      京には六波羅探題が置かれ、朝廷の監視と西国の統治にあたった。
      皇位の継承にも幕府が関与するようになり、武家が朝廷を上回る力を持つことが確定する。
      11年後の御成敗式目は、この新しい力関係を前提として作られた。
      隠岐に流された後鳥羽上皇は、和歌の編纂に力を注いで生涯を終えた。
      朝廷が武力で幕府に挑んだのは、これが最後の本格的な例になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Setagawa%EF%BC%88Yodogawa%EF%BC%89_Karahashi.jpg/500px-Setagawa%EF%BC%88Yodogawa%EF%BC%89_Karahashi.jpg
