  - id: kiyomori-daijodaijin
    year: 1167
    title: 平清盛が太政大臣になる
    category: politics
    tags: [日本, 平氏]
    summary: 武士として初めて朝廷の頂点に立ち、日宋貿易で富を築いた。
    detail: |
      平清盛が太政大臣に任じられた出来事で、1167年のことである。
      武士の家の出身者が朝廷の最高位に就いた最初の例になった。
      在職はわずか3か月で、地位そのものより就いたという事実に意味があった。

      清盛は保元・平治の乱を通じて京の軍事力を掌握していた。
      後白河上皇の信任を得て昇進を重ね、一族も次々に高位に就く。
      平氏の知行国は30余りに達し、全国の荘園を押さえた。
      一門でなければ人ではない、という言葉が『平家物語』に記されるほどの勢いだった。

      富の源泉は瀬戸内の海と宋との交易である。
      大輪田泊を改修し、音戸の瀬戸を開いて航路を整えた。
      輸入された宋銭は国内に広く流通し、貨幣で物を売買する習慣が根づいていく。
      貿易の利益を政治の資金に変えた点が、それまでの貴族と異なっていた。

      権力の集中は、旧来の貴族と寺社の反発を招いた。
      1177年の鹿ケ谷の陰謀を機に反対派を粛清し、1179年には後白河法皇を幽閉する。
      翌年に以仁王が挙兵を呼びかけると、各地の源氏が一斉に立った。
      清盛の死後、平氏は都を追われ、1185年に壇ノ浦で滅びる。
      武士が中央で政権を担えることを示した実績は、鎌倉幕府へ引き継がれた。
      太政大臣は常に置かれる職ではなく、名誉としての性格が強い地位だった。
      武士が官位の階段を上りきったこと自体が、身分の壁が動いた証になる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Taira_no_Kiyomori%2CTenshiSekkanMiei.jpg/500px-Taira_no_Kiyomori%2CTenshiSekkanMiei.jpg
      credit: 藤原豪信 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Taira_no_Kiyomori,TenshiSekkanMiei.jpg
    links:
