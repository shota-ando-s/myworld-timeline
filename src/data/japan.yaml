  - id: kentoshi-end
    year: 894
    title: 遣唐使の停止
    category: politics
    tags: [日本, 外交]
    summary: 大陸からの直輸入が止まり、かな文字など日本独自の文化が育つ余地が生まれた。
    detail: |
      菅原道真の建議によって、遣唐使の派遣が取りやめになった出来事。
      894年に道真が大使に任じられたが、自ら中止を申し出た。
      200年以上続いた公式の使節は、ここで事実上終わる。

      理由は二つ挙げられている。
      一つは、唐が黄巣の乱を経て衰え、学ぶべきものが減ったこと。
      もう一つは、航海の危険が大きく、犠牲に見合わないことである。
      実際、遣唐使船は難破や漂流を繰り返し、往復できた者は限られていた。

      公式の使節は止まったが、人と物の往来が絶えたわけではない。
      唐や、その後の宋の商船が博多に来航し、書物・陶磁器・薬が輸入され続けた。
      僧が商船に便乗して渡ることも多く、情報は入り続けている。
      国家が費用を負担して使節を送る形が終わった、というのが実態に近い。

      この頃から、大陸の様式を消化した独自の文化が育っていく。
      かな文字が整い、和歌が公の場に戻り、物語や日記の文学が書かれた。
      建築や絵画も日本の風土に合った形に変わり、国風文化と呼ばれる。
      外から学ぶ時期と、内で作り変える時期の切り替わりを示す出来事として扱われている。
      道真はその後、藤原氏との対立から大宰府へ左遷され、没後に天神として祀られた。
      使節の停止を日本の孤立の始まりとみるのは、現在では単純にすぎるとされている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c7/Japanese_embassy_to_the_Tang_court.jpg/500px-Japanese_embassy_to_the_Tang_court.jpg
      credit: PHGCOM, anonymous Japanese painter 8-9th century / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Japanese_embassy_to_the_Tang_court.jpg
    links:
