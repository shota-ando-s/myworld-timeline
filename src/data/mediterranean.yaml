lane: mediterranean

periods:
  - id: minoan
    title: ミノア文明
    start: -2000
    startCirca: true
    end: -1400
    endCirca: true
    category: culture
    tags: [ギリシア, クレタ]
    summary: クレタ島の宮殿文明。城壁を持たない海の交易文明だった。
    detail: |
      クレタ島で栄えた青銅器時代の文明で、紀元前2000年ごろから1400年ごろまで続いた。
      伝説の王ミノスにちなんで名づけられた。
      ヨーロッパで最初の高度な文明とされる。

      特徴は、宮殿を中心とする社会である。
      クノッソスをはじめ、島内のいくつかの場所に大規模な建物群が築かれた。
      倉庫・工房・祭祀の場を含み、行政の中心として機能していたとみられる。
      城壁を持たないことが、この文明の性格をよく表している。
      島という地の利と海軍力によって、外敵の侵入を想定しなくてよかったと考えられてきた。
      交易はエジプト、シリア、エーゲ海各地に及び、陶器と金属器が行き交う。

      壁画には、海の生き物、花、行列、そして牛を飛び越える若者たちが描かれた。
      戦いの場面がほとんど見られないことも、他の同時代の文明と異なる点である。
      宗教では女神の像が多く、自然と豊穣への信仰がうかがえる。
      使われた線文字Aは、いまも解読されていない。
      後にミケーネ人が用いた線文字Bはギリシア語を記したものと判明したが、その前段階の言語は不明のままである。

      紀元前1600年ごろ、テラ島の大噴火が島に打撃を与えた。
      1400年ごろには宮殿が破壊され、ギリシア本土のミケーネ人の支配下に入る。
      宮殿と海の交易で成り立つ社会の姿は、ヨーロッパの歴史の出発点として語られてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Map_Minoan_Crete-en.svg/500px-Map_Minoan_Crete-en.svg.png
      credit: User:Bibi Saint-Pol / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Map_Minoan_Crete-en.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ミノア文明

  - id: mycenaean
    title: ミケーネ文明
    start: -1600
    startCirca: true
    end: -1200
    endCirca: true
    category: politics
    tags: [ギリシア]
    summary: ギリシア本土の戦士王たちの文明。前1200年頃に一斉に崩壊した。
    detail: |
      ギリシア本土のペロポネソス半島を中心に栄えた青銅器文明で、紀元前1600年ごろから1200年ごろまで続いた。
      中心地の一つであるミケーネの名で呼ばれる。
      クレタのミノア文明とは対照的に、戦士的な性格が強い。

      各地に城塞が築かれた。
      巨人が積んだと伝えられるほど巨大な石を組んだ城壁が、丘の上の王宮を囲む。
      王墓からは金の仮面、武具、象嵌の短剣が出土しており、軍事的な支配層の存在を示している。
      使われた線文字Bは、20世紀に解読されてギリシア語を記したものと判明した。
      粘土板の内容は、羊の頭数や配給の記録といった行政の文書である。
      中央の宮殿が物資と人を管理する仕組みだったことが分かる。

      交易と略奪の両面で、東地中海に進出した。
      クレタを支配下に置き、エジプトやヒッタイトの記録にも関係が残る。
      トロイア戦争の伝承は、この時代の記憶を反映しているとも言われてきた。

      紀元前1200年ごろ、各地の宮殿が相次いで焼かれ、文明は崩壊した。
      原因は、外部からの侵入、内部の反乱、干ばつ、交易網の断絶など諸説ある。
      文字も失われ、以後400年は記録のない時代になる。
      それでも、神々の名や地名は後のギリシアに引き継がれた。
      ホメロスの叙事詩が語る英雄たちの世界は、この失われた文明の記憶である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9d/Mycenae_lion_gate_dsc06382.jpg/500px-Mycenae_lion_gate_dsc06382.jpg
      credit: David Monniaux / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Mycenae_lion_gate_dsc06382.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ミケーネ文明

  - id: greek-dark-ages
    title: ギリシアの暗黒時代
    start: -1200
    startCirca: true
    end: -800
    endCirca: true
    category: society
    tags: [ギリシア]
    summary: 文字も宮殿も失われた400年。この沈黙のあとにポリスが現れる。
    detail: |
      ミケーネ文明の崩壊から、ポリスが現れるまでの約400年を指す時代区分。
      紀元前1200年ごろから800年ごろまでにあたる。
      文字が失われ、記録が残らないことから暗黒時代と呼ばれてきた。

      宮殿を中心とする社会は消え、線文字Bも使われなくなった。
      人口は大きく減り、集落は小さく散在するようになる。
      壮大な建築は行われず、副葬品も質素になった。
      一方で、この時期に重要な変化も起きている。
      鉄の利用が広がり、青銅より安価で入手しやすい金属が農具と武器に使われるようになった。
      各地の共同体は、小規模ながら自立した生活を営む。

      人の移動も活発だった。
      ギリシア人がエーゲ海の島々や小アジアの沿岸へ渡り、各地に定住する。
      ドーリア人の南下という伝承も、この時期の移動を反映しているとみられる。

      紀元前8世紀に入ると、状況が変わる。
      人口が回復し、フェニキア人からアルファベットが伝えられて文字が復活した。
      ホメロスの叙事詩が文字に記され、オリンピアの祭典が始まる。
      各地に都市国家が成立し、地中海各地への植民も進んだ。
      沈黙の400年を挟んで、まったく異なる社会が現れたことになる。
      宮殿と官僚が支配する体制ではなく、市民が集まって決める共同体が生まれた点が、その後のヨーロッパ史を方向づけた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/暗黒時代_(古代ギリシア)

  - id: greek-poleis
    title: 古代ギリシアのポリス時代
    start: -800
    end: -338
    category: politics
    tags: [ギリシア, 都市国家]
    summary: アテネ・スパルタなど小さな都市国家が競い合い、民主政と哲学が生まれた。
    detail: |
      ギリシア各地に都市国家が並び立った時代で、紀元前8世紀から4世紀半ばまで続いた。
      ポリスとは市民の共同体を指し、数百から数万の市民からなる小さな国家である。
      民主政と哲学が生まれた時代でもある。

      ポリスは、丘の上の城塞と広場、そして周囲の農地から成っていた。
      市民は武具を自弁して重装歩兵として戦い、政治にも参加する。
      国家に属するのではなく、市民が国家そのものだという意識が強かった。
      数百のポリスがそれぞれ独自の法と暦と神を持った。
      アテネは市民全体の集会で物事を決める民主政へ進み、スパルタは市民を兵士として育てる独特の体制を作る。
      互いに争いながら、オリンピアの祭典や神託を通じて同じギリシア人という意識を共有した。

      人口の増加に対して、地中海と黒海の沿岸へ植民が行われた。
      マルセイユ、ナポリ、ビザンティオンなど、多くの都市がこのときに生まれている。
      交易と貨幣が広がり、各地の情報が集まった。

      ペルシアの侵攻を退けた後、アテネとスパルタの争いが27年の戦争になる。
      消耗したポリスは、北方のマケドニアに屈した。
      紀元前338年のカイロネイアの戦いで自立の時代は終わる。
      しかしここで生まれた民主政、哲学、演劇、歴史叙述は、その後の西洋の基礎になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/Acropolis_Athens_in_2004.jpg/500px-Acropolis_Athens_in_2004.jpg
      credit: Harrieta171 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Acropolis_Athens_in_2004.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/古代ギリシア

  - id: etruscan
    title: エトルリア
    start: -750
    startCirca: true
    end: -264
    category: culture
    tags: [イタリア]
    summary: ローマ以前のイタリアを支配した都市連合。建築と占いの技術をローマに残した。
    detail: |
      ローマ以前のイタリア半島中部で栄えた都市国家の連合で、紀元前8世紀から1世紀ごろまで続いた。
      12の主要都市が宗教的な同盟を結び、統一国家は作らなかった。
      初期のローマに大きな影響を与えている。

      起源については古くから議論がある。
      東方から渡来したという説と、現地で発展したという説があり、近年の遺伝学の研究は後者を支持する傾向にある。
      言語はインド・ヨーロッパ語族に属さず、文章は読めても意味の分からない部分が多い。
      繁栄の基盤は鉱物資源だった。
      鉄と銅を産し、加工した製品をギリシアやカルタゴと交易する。
      墓には輸入されたギリシアの壺が大量に納められていた。

      墓室の壁画は、この文明を知る主要な手がかりである。
      宴会、踊り、競技、狩りの場面が明るい色で描かれ、生活の豊かさを伝える。
      女性が宴席に同席している様子は、ギリシア人には奇異に映ったと記録されている。
      ローマは初期にエトルリア人の王に支配された時期があった。
      アーチの技法、都市の区画、剣闘士の見世物、鳥や内臓によって吉凶を占う習慣は、ここから受け継がれている。

      紀元前5世紀以降、ローマとギリシア人都市に押されて衰えた。
      紀元前3世紀までに各都市はローマに併合され、言語も消えていく。
      ローマ文明の土台の一部が、この失われた文化から来ていることは確かである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Etruscan_civilization_map.png/500px-Etruscan_civilization_map.png
      credit: NormanEinstein / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Etruscan_civilization_map.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エトルリア

  - id: hellenistic
    title: ヘレニズム時代
    start: -323
    end: -30
    category: culture
    tags: [ギリシア, オリエント]
    summary: アレクサンドロスの遺産を継ぐ王国群。ギリシア文化が西アジアと融合した。
    detail: |
      アレクサンドロスの死から、プトレマイオス朝の滅亡までの約300年。
      紀元前323年から30年までを指す。
      ギリシア文化が西アジアとエジプトに広がり、現地の文化と混じり合った時代である。

      帝国は部下たちの争いによって分裂した。
      エジプトのプトレマイオス朝、西アジアのセレウコス朝、マケドニアのアンティゴノス朝が主要な王国になる。
      いずれもギリシア人が支配層を占め、ギリシア語が行政と学問の言語として用いられた。
      各地に建設された都市が、文化の拠点になった。
      アレクサンドリアには大図書館とムセイオンが置かれ、各地から学者が集まる。
      エウクレイデスが幾何学を体系化し、アルキメデスが物理学の基礎を築き、エラトステネスが地球の大きさを測った。
      天文学ではアリスタルコスが太陽中心の説を唱えている。

      思想では、ポリスの枠を超えた個人の生き方が問われた。
      ストア派は理性に従って生きることを、エピクロス派は心の平静を説く。
      世界市民という考え方も現れた。
      美術では、感情や動きを写実的に表す作風が生まれる。
      ラオコーン像やサモトラケのニケがその代表である。
      仏教美術のガンダーラ様式にも、この影響が及んだ。

      諸王国は次々にローマに併合された。
      紀元前30年のプトレマイオス朝の滅亡で、この時代は終わる。
      しかしギリシア語と学問は、ローマ帝国のなかで生き続けた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヘレニズム

  - id: roman-republic
    title: ローマ共和政
    start: -509
    end: -27
    category: politics
    tags: [ローマ]
    summary: 元老院と市民による統治で地中海を制覇し、その拡大が内部から共和政を壊した。
    detail: |
      王政の打倒から帝政の開始までの、およそ480年にわたるローマの政治体制。
      紀元前509年から27年までとされる。
      イタリア中部の一都市から、地中海全域を支配する国家へ成長した。

      統治は複数の機関の均衡で成り立っていた。
      任期1年で二人の執政官が行政と軍を担い、元老院が経験者として政策を指導する。
      市民の集会が法と戦争を承認し、平民を守る護民官が置かれた。
      特定の個人に権力が集まらない仕組みが、共和政の要である。

      初期には、貴族と平民の身分闘争が続いた。
      平民は兵役を拒む形で要求を通し、十二表法の制定や執政官への就任を実現していく。
      対外的には、イタリア半島を統一した後、カルタゴと三度戦って地中海西部を制する。
      続いてギリシアと西アジアへ進出し、属州が各地に置かれた。

      拡大がかえって体制を壊した。
      長期の従軍で農民が没落し、大土地所有と奴隷制が広がる。
      無産市民を兵に取る改革によって、軍は将軍個人に忠誠を誓うようになった。
      グラックス兄弟の改革は挫折し、内戦が繰り返される。
      カエサルの独裁と暗殺を経て、養子のオクタウィアヌスが全権を握った。
      紀元前27年、共和政の形を残したまま事実上の帝政が始まる。
      権力を分散させる制度と、その限界の両方が、後世の政治思想に大きな影響を与えた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Roman_Republic%2C_BC28.png/500px-Roman_Republic%2C_BC28.png
      credit: Kaiser&Augstus&Imperator / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Roman_Republic,_BC28.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/共和政ローマ

  - id: roman-empire
    title: ローマ帝国
    start: -27
    end: 476
    category: politics
    tags: [ローマ]
    summary: 地中海世界を一つにまとめた帝国。法・道路・都市の遺産は今も残る。
    detail: |
      共和政に代わってローマを統治した体制で、紀元前27年から西方では476年まで続いた。
      地中海の全域を一つの国家にまとめた。
      法・道路・都市の遺産は、現在のヨーロッパに直接つながっている。

      領域は最大時に、ブリタニアからメソポタミア、ライン川からサハラの北縁までに及んだ。
      人口は5000万から6000万と推定される。
      各地は属州として総督が治め、都市には自治が認められた。

      統治を支えたのは、軍団と道路と法である。
      30ほどの軍団が国境に配置され、8万キロに及ぶ舗装道路が帝国を結んだ。
      ローマ法は、市民だけでなく異なる民族にも適用できる体系として整えられる。
      212年には、領内のほぼすべての自由民に市民権が与えられた。

      最初の200年は比較的平穏で、交易と都市が栄えた。
      3世紀には、皇帝が次々に交代する混乱と外部からの侵入、疫病と経済の混乱が重なる。
      ディオクレティアヌスとコンスタンティヌスが体制を立て直し、後者はキリスト教を公認して都をコンスタンティノープルへ移した。
      395年に東西に分割され、西方はゲルマン諸族の移動のなかで476年に滅びる。
      東方はビザンツ帝国として1453年まで続いた。
      ラテン語から各国語が生まれ、法体系と行政の語彙は今日まで受け継がれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5b/Roman_Empire%2C_Peak_period%281c~2c%29.png/500px-Roman_Empire%2C_Peak_period%281c~2c%29.png
      credit: Kaiser&Augstus&Imperator / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Roman_Empire,_Peak_period(1c~2c).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ローマ帝国

  - id: pax-romana
    title: パクス・ロマーナ
    start: -27
    end: 180
    category: society
    tags: [ローマ, 平和]
    summary: 地中海全域が一つの法と通貨で結ばれた約200年。交易と都市が栄えた。
    detail: |
      ローマ帝国のもとで地中海世界が比較的平穏だった時期で、紀元前27年から180年ごろまで。
      ローマによる平和を意味する言葉である。
      実際には各地で戦争や反乱もあったが、内乱が収まり交易が栄えた。

      アウグストゥスが内戦を終わらせたことが出発点になる。
      以後、ネロの死後の混乱や属州の反乱はあったものの、帝国全体を揺るがす戦争は起きなかった。
      五賢帝と呼ばれる皇帝が続いた2世紀が、その頂点である。
      平和がもたらしたのは、人と物の移動の自由だった。
      舗装道路が帝国を結び、地中海からは海賊がほぼ一掃される。
      同じ通貨と、共通の法と、ラテン語とギリシア語という二つの共通語が通用した。

      交易の範囲は帝国の外にも広がった。
      インドから胡椒と宝石が運ばれ、中国の絹が地中海に届く。
      一つの船荷が数年分の収入に相当するほどの取引も行われた。
      各地に都市が作られ、水道・浴場・円形劇場・広場が整えられる。
      地方の有力者はローマ市民権を得て帝国の一員になり、属州出身の皇帝も現れた。

      同じ条件が、疫病の流行も容易にした。
      2世紀後半の大流行は、帝国の人口を大きく減らしたとされる。
      180年のマルクス・アウレリウスの死をもって、この時代は終わったとされる。
      以後、帝国は外圧と内乱に直面していく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Statue_of_the_goddess_Pax_%28Pavlovsk_Garden%2C_St_Petersburg%2C_Russia%29.jpg/500px-Statue_of_the_goddess_Pax_%28Pavlovsk_Garden%2C_St_Petersburg%2C_Russia%29.jpg
      credit: Miha Ulanov / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Statue_of_the_goddess_Pax_(Pavlovsk_Garden,_St_Petersburg,_Russia).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/パクス・ロマーナ

  - id: crisis-third-century
    title: 三世紀の危機（軍人皇帝時代）
    start: 235
    end: 284
    category: war
    tags: [ローマ, 混乱]
    summary: 50年で20人以上の皇帝が立ち、疫病と侵入で帝国が分解しかけた。
    detail: |
      ローマ帝国が内外の危機に同時に見舞われた時期で、235年から284年までの約50年。
      軍が皇帝を擁立しては倒すことを繰り返したため、軍人皇帝時代とも呼ばれる。
      帝国が分解しかけた期間である。

      50年のあいだに、20人を超える皇帝が立った。
      在位の平均は数年に満たず、多くが部下や兵士に殺されている。
      正統性の基準が失われ、力のある将軍が次々に名乗りを上げた。
      外からの圧力も強まった。
      東では新たに興ったササン朝ペルシアが攻め込み、260年には皇帝が捕虜になる。
      北ではゲルマン諸族がライン・ドナウの国境を越え、イタリアやギリシアまで侵入した。

      経済も崩れた。
      戦費のために銀貨の品位が下げられ続け、物価が急騰する。
      交易は途絶え、都市は城壁を築いて守りに入った。
      疫病の流行も重なり、人口は減少する。

      帝国は一時、三つに分裂した。
      西ではガリア帝国が、東ではパルミラが自立して独自の支配を行う。
      両者を再統合したのはアウレリアヌス帝だった。
      284年に即位したディオクレティアヌスが、統治の仕組みを作り直して危機は収まる。
      しかしその代償として、皇帝は軍の力を背景とする専制君主となり、税と統制は強化された。
      元首政の時代は、ここで実質的に終わっている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/3世紀の危機

  - id: byzantine
    title: ビザンツ帝国（東ローマ）
    start: 395
    end: 1453
    category: politics
    tags: [ローマ, ギリシア正教]
    summary: 西ローマ滅亡後も1000年続き、ギリシア・ローマの遺産を中世へ受け渡した。
    detail: |
      ローマ帝国の東半分が独自に存続した国家で、395年から1453年まで続いた。
      自らはローマ帝国と称し、住民はローマ人を名乗り続けた。
      ビザンツという呼び名は後世の学術用語である。

      都はコンスタンティノープルで、ギリシア語が公用語になった。
      宗教はギリシア正教で、皇帝が教会の頭を兼ねる体制をとる。
      ローマの法と行政、ギリシアの言語と文化、キリスト教の信仰という三つの要素から成り立っていた。
      6世紀のユスティニアヌス1世は、地中海の再統一を試みてイタリアと北アフリカを回復する。
      しかし疫病と戦費で消耗し、領土は長続きしなかった。
      7世紀にはイスラム勢力にシリアとエジプトを奪われ、領域は小アジアとバルカンに縮む。

      それでも帝国は再生を繰り返した。
      軍管区の制度で農民を兵として組織し、防衛を立て直す。
      10世紀のバシレイオス2世の時代には、バルカンの大半を回復した。

      1204年、第4回十字軍に都を占領されて一時は解体される。
      回復後も勢力は戻らず、オスマン帝国に圧迫されていった。
      1453年、都が陥落して滅亡する。
      ギリシア・ローマの古典を写本として保存し、正教とスラヴ文字を東欧へ伝えた。
      滅亡時に西欧へ逃れた学者が、ルネサンスの一因にもなっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/Justinian555AD.png/500px-Justinian555AD.png
      credit: Tataryn / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Justinian555AD.png
    links:
