        url: https://ja.wikipedia.org/wiki/カルタゴ

  - id: spartacus
    year: -73
    title: スパルタクスの反乱
    category: society
    tags: [ローマ, 奴隷]
    summary: 剣闘士が率いた大規模な奴隷反乱。ローマ社会の土台を可視化した。
    detail: |
      剣闘士スパルタクスが率いた奴隷の反乱で、紀元前73年に始まった。
      2年にわたりローマ軍を何度も破り、南イタリア一帯を巻き込む規模になった。
      ローマ社会が奴隷に支えられていたことを可視化した事件である。

      スパルタクスはトラキア出身で、剣闘士の養成所にいた。
      70人余りの仲間と調理場の道具を手に脱走し、ヴェスヴィオ山に立てこもる。
      周辺の農場から逃れた奴隷が加わり、勢力は数万に膨れ上がった。
      当初、ローマは反乱を軽く見ていた。
      派遣された部隊は次々に破られ、執政官の率いる正規軍も敗北する。
      反乱軍は北イタリアまで進み、アルプスを越えて故郷へ帰る道もあった。
      しかし引き返して南下しており、その理由は今も議論されている。

      シチリアへ渡る計画は海賊に裏切られて失敗した。
      紀元前71年、クラッススの軍に包囲されて反乱軍は壊滅する。
      スパルタクスは戦死したとされ、遺体は確認されなかった。
      捕らえられた6000人が、ローマへ至る街道沿いで十字架にかけられた。

      この反乱は、奴隷制の廃止をめざしたものではない。
      自由を求める個々の脱走が集まった運動だった。
      それでも近代以降、圧政への抵抗の象徴として繰り返し取り上げられている。
      大農場での奴隷労働という、ローマの経済の実態を示す事件でもあった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Tod_des_Spartacus_by_Hermann_Vogel.jpg/500px-Tod_des_Spartacus_by_Hermann_Vogel.jpg
      credit: ヘルマン・フォーゲル / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tod_des_Spartacus_by_Hermann_Vogel.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第三次奴隷戦争

  - id: caesar-assassination
    year: -44
    title: カエサル暗殺
    category: politics
    tags: [ローマ]
    summary: 共和政の終わりを象徴する事件。17年後に帝政が始まる。
    detail: |
      カエサルが元老院の議場で刺殺された事件で、紀元前44年3月15日のこと。
      共和政の終わりを象徴する出来事として語り継がれてきた。
      17年後に帝政が始まる。

      内戦に勝ったカエサルは、終身の独裁官に就いていた。
      元老院の定員を増やし、属州出身者も加え、貨幣に自らの肖像を刻む。
      王冠を差し出される場面が演出され、それを断って見せたという話も伝わる。
      共和政の伝統を重んじる人々には、王政への復帰と映った。

      首謀者はブルトゥスとカッシウスで、60人ほどが加わったとされる。
      カエサルは護衛を退けており、身を守る者はいなかった。
      議場で取り囲まれ、20か所以上を刺されて倒れる。
      暗殺者たちは、共和政の回復を市民が歓迎すると考えていた。
      しかし民衆はカエサルを支持しており、葬儀での演説をきっかけに暴動が起きる。
      暗殺者はローマを去らざるをえなかった。

      その後の展開は、彼らの意図と正反対になった。
      アントニウスとオクタウィアヌスが手を結んで暗殺者を討ち、やがて両者が争う。
      紀元前31年のアクティウムの海戦でオクタウィアヌスが勝ち、帝政が始まった。
      独裁を倒せば自由が戻るという想定が外れた例として、この事件は繰り返し参照される。
      シェイクスピアの戯曲をはじめ、文学と政治の議論の題材であり続けてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Julius_Caesar_Coustou_Louvre_MR1798.jpg/500px-Julius_Caesar_Coustou_Louvre_MR1798.jpg
      credit: ニコラ・クストゥー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Julius_Caesar_Coustou_Louvre_MR1798.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ガイウス・ユリウス・カエサル

  - id: actium
    year: -31
    title: アクティウムの海戦
    category: war
    tags: [ローマ, エジプト]
    summary: オクタウィアヌスが勝ち、翌年プトレマイオス朝が滅んでヘレニズムが終わった。
    detail: |
      オクタウィアヌスの艦隊が、アントニウスとクレオパトラの連合艦隊を破った海戦。
      紀元前31年9月、ギリシア西岸のアクティウム沖で行われた。
      翌年にプトレマイオス朝が滅び、ヘレニズム時代が終わる。

      カエサルの死後、ローマの世界は東西に分かれていた。
      西はオクタウィアヌスが、東はアントニウスが握り、アントニウスはエジプトの女王クレオパトラと結ぶ。
      オクタウィアヌスは、アントニウスが東方の女王に操られていると宣伝し、世論を味方につけた。
      海戦では、アントニウス側の大型船に対し、オクタウィアヌス側は小回りの利く船を用いた。
      将軍アグリッパの指揮が優れていたとされる。
      戦いの最中にクレオパトラの艦隊が離脱し、アントニウスもこれに続いた。
      残された艦隊と陸軍は降伏する。

      翌年、二人はアレクサンドリアで自ら命を絶った。
      クレオパトラの死によって、アレクサンドロスの後継国家はすべて消える。
      エジプトはローマの属州ではなく、皇帝の私領として扱われた。

      オクタウィアヌスはローマ世界の唯一の支配者となる。
      紀元前27年、元老院からアウグストゥスの称号を受け、事実上の帝政が始まった。
      長い内戦が終わり、200年に及ぶ平和の時代へ移る。
      この海戦は、地中海世界が一人の支配者のもとに入った分岐点である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/95/Castro_Battle_of_Actium.jpg/500px-Castro_Battle_of_Actium.jpg
      credit: Laureys a Castro / Public domain
      page: https://commons.wikimedia.org/wiki/File:Castro_Battle_of_Actium.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アクティウムの海戦

  - id: augustus-principate
    year: -27
    title: アウグストゥスの元首政
    category: politics
    tags: [ローマ, 帝政]
    summary: 共和政の看板を残したまま一人が実権を握る仕組みで、200年の平和が始まった。
    detail: |
      オクタウィアヌスが元老院から権限を委ねられ、事実上の帝政が始まった出来事。
      紀元前27年のことで、アウグストゥスの称号もこのとき贈られた。
      共和政の形式を保ったまま一人が統治する体制である。

      100年近く続いた内乱に、人々は疲れ切っていた。
      一方で、王政への嫌悪は根強く残っている。
      カエサルは王になろうとして殺された。
      その教訓を踏まえ、オクタウィアヌスは権力を独占しない形を選んだ。

      彼はまず、すべての権限を返上すると宣言した。
      元老院はこれを受けて、辺境の属州の統治と軍の指揮権を改めて委ねる。
      軍団が置かれているのはそれらの属州であり、事実上の軍事力は彼の手に残った。
      さらに、護民官の権限を身につけて法案の提出と拒否を可能にし、最高神祇官として宗教も統括する。
      執政官や元老院はそのまま存続し、選挙も行われた。
      彼の呼び名は第一の市民を意味するプリンケプスで、この体制は元首政と呼ばれる。

      形式と実質の乖離は意図的なものだった。
      共和政が続いていると人々が感じられることが、安定の条件である。
      この仕組みは200年以上機能し、その間に地中海世界は平和と繁栄を享受した。
      権力をどう見せるかという問題への、古代で最も成功した解答の一つである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Statue-Augustus.jpg/500px-Statue-Augustus.jpg
      credit: Till Niermann / Public domain
      page: https://commons.wikimedia.org/wiki/File:Statue-Augustus.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アウグストゥス

  - id: jesus-crucifixion
    year: 30
    circa: true
    title: イエスの処刑
    category: religion
    tags: [キリスト教, ローマ]
    summary: ローマ属州での一処刑が、やがて世界最大の宗教の出発点になった。
    detail: |
      ローマの属州ユダヤで、ナザレのイエスが十字架にかけられた出来事。
      30年ごろとされる。
      一地方での処刑が、やがて世界最大の宗教の出発点になった。

      イエスはガリラヤで宣教を始め、神の国が近いと説いた。
      貧しい者や病む者に寄り添い、律法の形式より愛を重んじる教えは、多くの支持を集める。
      同時に、神殿を中心とする宗教指導者との対立も深まった。
      エルサレムの神殿で商人の台をひっくり返したとされる行動が、決定的な衝突になる。
      祭司長らは彼を捕らえ、ローマ総督ピラトに引き渡した。
      罪状はユダヤ人の王を称したことで、反逆罪にあたる。
      十字架刑は、ローマが反逆者に用いた見せしめの処刑だった。

      処刑そのものは、当時の記録にほとんど残っていない。
      属州では日常的に行われていたことである。
      変化は、その後に起きた。
      弟子たちが復活を証言し、その信仰を宣べ伝え始める。
      パウロがユダヤ人以外にも布教し、律法の遵守を条件としなかったことで、教えは地中海世界へ広がった。

      迫害を受けながら信徒は増え、4世紀にローマ帝国が公認して国教となる。
      十字架は処刑の道具から救済の象徴に変わった。
      一人の処刑をめぐる解釈が、その後2000年の歴史を動かしている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a7/JesusYeshua2.svg/500px-JesusYeshua2.svg.png
      credit: Stevert / Public domain
      page: https://commons.wikimedia.org/wiki/File:JesusYeshua2.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ナザレのイエス

  - id: great-fire-rome
    year: 64
    title: ローマの大火とキリスト教徒の迫害
    category: disaster
    tags: [ローマ, キリスト教]
    summary: 責任を負わされた信徒への迫害が、殉教という記憶を宗教に刻んだ。
    detail: |
      ローマ市で発生した大火と、その責任を負わされたキリスト教徒への迫害。
      64年7月のことである。
      殉教という記憶が、この宗教に深く刻まれる契機になった。

      火は競技場の近くの商店から出たとされる。
      木造の建物が密集する市街を6日間にわたって焼き、鎮火後に再び燃え広がった。
      14の地区のうち3区が全焼し、7区が大きな被害を受ける。
      ネロは避難所を用意し、食糧の価格を下げるなどの対策を取った。
      しかし焼けた土地に広大な宮殿を建て始めたことで、放火の疑いが広がる。
      火事の最中に竪琴を弾いて歌ったという話も流布した。
      実際には郊外におり、報せを受けて戻ったとされる。

      疑いをそらすため、ネロはキリスト教徒を犯人として告発した。
      タキトゥスによれば、信徒は捕らえられ、猛獣に襲わせる、十字架にかける、夜の灯りとして焼くといった方法で処刑された。
      組織的な迫害としては最初の例である。

      見せ物としての残虐さは、かえって同情を呼んだとも記されている。
      ペテロとパウロがこの時期に殉教したという伝承があり、後にその地にサン・ピエトロ大聖堂が建てられた。
      迫害は断続的に3世紀まで続いた。
      信仰のために死んだ者を記憶する文化が、この宗教の結束を強めることになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/Robert%2C_Hubert_-_Incendie_%C3%A0_Rome_-.jpg/500px-Robert%2C_Hubert_-_Incendie_%C3%A0_Rome_-.jpg
      credit: ユベール・ロベール / Public domain
      page: https://commons.wikimedia.org/wiki/File:Robert,_Hubert_-_Incendie_%C3%A0_Rome_-.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ローマ大火

  - id: vesuvius
    year: 79
    title: ヴェスヴィオ山の噴火
    category: disaster
    tags: [ローマ, 災害]
    summary: ポンペイなどが火山灰に埋もれ、結果としてローマ人の日常が保存された。
    detail: |
      ナポリ近郊のヴェスヴィオ山が噴火し、ポンペイなどの都市が埋没した出来事。
      79年8月ごろとされる。
      火山灰に覆われたことで、結果としてローマ人の日常が保存された。

      噴火は二段階で進んだ。
      まず軽石と灰が高く噴き上がり、風下のポンペイに数メートル積もる。
      屋根が重みで崩れ、多くの住民が逃げ遅れた。
      翌朝、高温の火砕流が山腹を流れ下った。
      海側のヘルクラネウムはこの流れに埋まり、残っていた人々は一瞬で死亡する。
      周辺の複数の町が同時に消えた。

      この様子を記録した人物がいる。
      海を挟んだ対岸にいた小プリニウスが、友人への手紙に噴煙の形と経過を詳しく書き残した。
      現在、この型の噴火はプリニー式と呼ばれる。
      叔父の大プリニウスは救助に向かい、現地で死亡した。

      18世紀に発掘が始まると、埋もれた都市がほぼそのままの姿で現れた。
      パン屋のかまど、落書き、選挙の広告、居酒屋の値段表、家の壁画が残っている。
      遺体が腐った後の空洞に石膏を流し込むことで、亡くなった瞬間の姿も復元された。
      宮殿や神殿ではなく、普通の人々の生活を知る史料としてこれに並ぶものはない。
      災害が記録を破壊するのではなく保存したという、稀な例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f5/Aerial_image_of_Pompeii_and_Mount_Vesuvius_%28view_from_the_southeast%29.jpg/500px-Aerial_image_of_Pompeii_and_Mount_Vesuvius_%28view_from_the_southeast%29.jpg
      credit: Carsten Steger / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Aerial_image_of_Pompeii_and_Mount_Vesuvius_(view_from_the_southeast).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ポンペイ

  - id: trajan-peak
    year: 117
    title: ローマ帝国の最大版図
    category: politics
    tags: [ローマ]
    summary: トラヤヌス帝のもとで領土が最大に。以後は守りに転じる。
    detail: |
      ローマ帝国の領土が最大に達した年で、117年のこと。
      トラヤヌス帝のパルティア遠征によって、支配はペルシア湾に届いた。
      これ以後、帝国は守りに転じる。

      版図は、西はイベリア半島とブリタニアから、東はメソポタミア、北はライン・ドナウ川、南はサハラの北縁までに及んだ。
      面積はおよそ500万平方キロ、人口は5000万を超えると推定される。
      地中海は完全に内海となり、ローマ人はこれを我らの海と呼んだ。
      拡大の最後の段階は、ダキアとパルティアへの遠征だった。
      ダキアからは金が、東方からは交易路の支配が期待されている。

      しかし新しい属州の維持は困難だった。
      遠征中にメソポタミアとユダヤで反乱が起き、鎮圧に兵を割かれる。
      補給線は伸びきり、国境の防衛費は増す一方だった。
      トラヤヌスの死後、ハドリアヌスは東方の新属州を放棄した。
      以後の皇帝は、征服よりも国境の固定と防衛を重視する。
      長城と柵と要塞線が、帝国の輪郭を線として定めていった。

      拡大が止まったことは、経済にも影響した。
      戦利品と奴隷の流入が減り、財政は属州の税に依存するようになる。
      3世紀には、外圧と内部の混乱が同時に押し寄せた。
      最大の版図に達した年は、同時に転換点でもあった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5b/Roman_Empire%2C_Peak_period%281c~2c%29.png/500px-Roman_Empire%2C_Peak_period%281c~2c%29.png
      credit: Kaiser&Augstus&Imperator / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Roman_Empire,_Peak_period(1c~2c).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ローマ帝国

  - id: antonine-constitution
    year: 212
    title: アントニヌス勅令
    category: society
    tags: [ローマ, 市民権]
    summary: 帝国内の全自由民にローマ市民権を与え、「ローマ人」の意味が変わった。
    detail: |
      ローマ皇帝カラカラが、帝国内のほぼすべての自由民にローマ市民権を与えた勅令。
      212年に発布された。
      ローマ人という言葉の意味が、この時点で決定的に変わる。

      それまで市民権は特権だった。
      軍務や公職への貢献、あるいは都市ごとの授与によって少しずつ広がってきたものである。
      市民権を持つ者は、税や裁判で有利な扱いを受け、ローマの法の保護を受けられた。
      勅令により、属州の住民も一挙に市民になった。
      対象は帝国内の自由民で、奴隷は含まれない。
      同時代の歴史家は、市民だけに課される相続税などの税収を増やす狙いがあったと記している。
      宗教的な統合を意図したという解釈もある。

      影響は大きかった。
      法の適用が帝国全体で統一され、ローマ法が各地の慣習法に代わっていく。
      多くの人がカラカラの家名を名乗るようになり、名前の記録からこの勅令の普及が確認できる。

      一方で、市民権の価値そのものは下がった。
      誰もが市民である以上、それは特権ではなくなる。
      以後の社会では、市民かどうかではなく、上層か下層かという区分が実質的な意味を持つようになった。
      民族や出自ではなく、法によって帰属が定まるという発想は、この帝国の特徴である。
      その到達点がこの勅令であり、同時に帝国が変質していく時期の始まりでもあった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アントニヌス勅令

  - id: constantinople-founded
    year: 330
    title: コンスタンティノープルへの遷都
    category: politics
    tags: [ローマ, ビザンツ]
    summary: 帝国の重心が東へ移り、1000年続く新しい都が生まれた。
    detail: |
      コンスタンティヌス帝が、ボスポラス海峡に面した都市を新しい都と定めた出来事。
      330年に献堂の式典が行われた。
      帝国の重心が東へ移り、1000年続く都が生まれる。

      選ばれたのは、ギリシア人の古い植民市ビザンティウムだった。
      ヨーロッパとアジアの接点にあり、黒海と地中海を結ぶ海峡を押さえる。
      三方を海に囲まれ、陸側だけを守ればよいという防衛上の利点もあった。
      帝国の富と人口は、すでに東方に偏っていた。
      エジプトとシリアの穀物と交易が経済を支え、ドナウとペルシアの両方面に近い位置から軍を動かせる。
      ローマは象徴的な都であり続けたが、皇帝はすでに各地を転々としていた。

      新しい都には、広場・宮殿・競技場・元老院が整えられた。
      各地から美術品が運び込まれ、穀物の無償配給も行われる。
      異教の神殿は建てられず、キリスト教の教会が中心に置かれた。

      城壁は5世紀に大きく拡張され、三重の構造になる。
      この城壁のおかげで、都は数々の包囲に耐えた。
      アラブ軍もブルガリア軍も落とせず、陥落は1204年の十字軍と1453年のオスマン軍の二度だけである。
      西ローマが滅びた後も、ここを都とする帝国は1000年続いた。
      ギリシア・ローマの古典が写本として保存されたのも、この都市においてである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Bizansist_touchup.jpg/500px-Bizansist_touchup.jpg
      credit: http://en.wikipedia.org/wiki/User:DeliDumrul / Public domain
      page: https://commons.wikimedia.org/wiki/File:Bizansist_touchup.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/コンスタンティノープル

  - id: edict-of-milan
    year: 313
    title: ミラノ勅令
    category: religion
    tags: [ローマ, キリスト教]
    summary: キリスト教が公認され、迫害される宗教から帝国の宗教へ向かう。
    detail: |
      ローマ帝国でキリスト教が公認され、信教の自由が認められた方針。
      313年、コンスタンティヌスと東方の共同統治者が合意した内容として知られる。
      迫害される宗教から帝国の宗教へ向かう転換点になった。

      直前まで、キリスト教徒は大規模な迫害を受けていた。
      ディオクレティアヌスの時代に教会は破壊され、聖職者は投獄され、聖書は焼かれている。
      それでも信徒は減らず、帝国の東部では人口の相当部分を占めていた。

      合意の内容は、すべての者が望む宗教を信じてよいというものである。
      キリスト教だけでなく、あらゆる信仰が対象とされた。
      没収された教会の建物と財産は返還されることになる。
      正式には勅令という形式ではなく、地方長官へ送られた書簡として伝わっている。
      そのため、名称と内容をめぐる議論もある。

      この後、キリスト教は急速に優位に立った。
      皇帝が教会に土地と免税の特権を与え、聖職者は社会的な地位を得る。
      皇帝が公会議を招集し、教義の統一にも関与するようになった。
      392年には他の宗教の祭祀が禁じられ、キリスト教は事実上の国教になる。
      寛容の宣言から70年余りで、立場は完全に入れ替わった。
      ヨーロッパが一つの信仰のもとにまとまる道筋は、この時点で決まっている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ミラノ勅令

  - id: christianity-state-religion
    year: 392
    title: キリスト教の国教化
    category: religion
    tags: [ローマ, キリスト教]
    summary: 他の宗教が禁じられ、ヨーロッパが一つの信仰でまとまる道が決まった。
    detail: |
      ローマ帝国でキリスト教以外の宗教の祭祀が禁じられ、事実上の国教となった出来事。
      392年、テオドシウス1世の勅令による。
      ヨーロッパが一つの信仰でまとまる道が、ここで決まった。

      313年の公認から80年足らずの変化である。
      その間に、皇帝の保護のもとで教会は急速に力を得ていた。
      380年の勅令では、すでにニケーア派の信仰が正統と定められていた。
      それに従わない者は異端とされ、公的な地位から排除される。
      392年の勅令は、異教の犠牲や礼拝を私的な場でも禁じた。
      違反は反逆に準じる罪とされる。

      これにより、神殿は閉鎖されるか教会に転用された。
      オリンピアの競技祭も、異教の祭りとして翌年に終わる。
      アレクサンドリアのセラピス神殿など、破壊された例も多い。
      宗教が国家の制度になったことで、教会の組織は帝国の行政区分に対応して整えられた。
      司教は地域の実務にも関与し、ローマが滅びた後も社会の秩序を担う。

      一方で、信仰の統一は異端をめぐる争いを激しくした。
      教義の相違が政治的な対立と重なり、東方の各地で分裂が生じる。
      多神教の伝統を持つ帝国が、唯一の宗教を掲げる国家へ変わったことの影響は、その後のヨーロッパ史を貫いている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/f/f7/Bust_of_Theodosius_I.jpg
      credit: www.livius.org / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Bust_of_Theodosius_I.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/テオドシウス1世

  - id: rome-division
    year: 395
    title: ローマ帝国の東西分裂
    category: politics
    tags: [ローマ]
    summary: テオドシウス帝の死後、帝国は二度と一つに戻らなかった。
    detail: |
      テオドシウス1世の死に際して、ローマ帝国が東西に分けて二人の子に委ねられた出来事。
      395年のことである。
      以後、帝国が一人の皇帝のもとに戻ることはなかった。

      分割統治そのものは新しくない。
      ディオクレティアヌス以来、広い領域を守るために複数の皇帝が分担することは行われていた。
      テオドシウスも生前、二人の子をそれぞれ東西の正帝としている。
      違いは、その後の展開にある。
      東はアルカディウス、西はホノリウスが継いだが、いずれも若く、実権は側近の将軍が握った。
      両宮廷は協力するどころか、互いの弱みを利用し合う関係になる。

      東西の条件には大きな差があった。
      東は人口が多く、エジプトとシリアの富があり、都は堅固な城壁に守られている。
      西は長いライン・ドナウの国境を抱え、財政基盤は弱かった。
      ゲルマン諸族の移動が本格化すると、西はこれを支えきれなくなる。
      410年にローマが略奪され、各地に王国が成立していった。
      東はしばしばゲルマン勢力を西へ向かわせることで、自らの安全を確保している。

      476年に西の皇帝が廃位され、西ローマは終わった。
      東はさらに1000年続く。
      ヨーロッパが西のラテン世界と東のギリシア世界に分かれる長い経過は、この分割から始まっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/Justinian555AD.png/500px-Justinian555AD.png
      credit: Tataryn / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Justinian555AD.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/東ローマ帝国

  - id: west-rome-fall
    year: 476
    title: 西ローマ帝国の滅亡
    category: politics
    tags: [ローマ]
    summary: ゲルマン人傭兵隊長が皇帝を廃位。ヨーロッパの中世が始まる。
    detail: |
      西ローマ帝国の最後の皇帝が廃位された出来事で、476年のこと。
      ゲルマン人の傭兵隊長オドアケルが実行した。
      慣例的に、ヨーロッパの古代の終わりとされる。

      5世紀の西ローマは、すでに実質を失っていた。
      各地にゲルマン諸族の王国が成立し、皇帝が支配するのはイタリアの一部にすぎない。
      軍の主力は傭兵で、実権は彼らを率いる将軍が握っていた。
      皇帝は20年ほどのあいだに10人近く交代している。
      最後の皇帝は、皮肉にも建国者と同じ名を持つ少年だった。
      傭兵たちがイタリアの土地の分配を求めて拒まれると、オドアケルが蜂起して皇帝を廃位する。
      少年は殺されず、年金を与えられて隠退した。

      オドアケルは新たな皇帝を立てず、帝位の記章を東の皇帝へ送った。
      自らはイタリア王としてその承認を得る。
      形式上は帝国が一人の皇帝のもとに戻ったことになるが、実際には西方の統治は失われた。
      同時代の人々は、この年を時代の区切りとは考えていない。
      生活も行政もしばらくは続き、ローマの制度は各王国に引き継がれた。

      それでも、地中海を一つにまとめる政治の枠組みは消えた。
      西欧では、教会と各地の王国が新しい秩序を作っていく。
      中世と呼ばれる時代が、ここから始まる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Western_Roman_Empire%2C_AD395.png/500px-Western_Roman_Empire%2C_AD395.png
      credit: Kaiser&Augstus&Imperator / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Western_Roman_Empire,_AD395.png
    links:
