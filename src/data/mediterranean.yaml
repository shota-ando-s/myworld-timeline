        url: https://ja.wikipedia.org/wiki/カイロネイアの戦い

  - id: alexander-campaign
    year: -334
    title: アレクサンドロスの東方遠征
    category: war
    tags: [マケドニア, ペルシア]
    summary: 10年でインダスまで達し、ギリシア文化が西アジアへ広がる道を開いた。
    detail: |
      アレクサンドロス大王が始めた東方への遠征で、紀元前334年に開始された。
      10年でインダス川に達し、アケメネス朝ペルシアを滅ぼした。
      ギリシア文化が西アジアへ広がる道を開いた。

      兵力は歩兵3万余、騎兵5000ほどだった。
      名目は、ペルシアがかつてギリシアを侵略したことへの報復である。
      最初の戦いはグラニコス川で、小アジアの制圧につながった。
      紀元前333年のイッソスの戦いではダレイオス3世の軍を破り、王の家族を捕らえる。
      その後、南下してフェニキアの諸都市とエジプトを押さえた。
      7か月に及ぶティルスの包囲は、この遠征でも屈指の攻城戦である。

      紀元前331年のガウガメラの会戦で、兵数に勝るペルシアの主力を撃破した。
      バビロン、スサ、ペルセポリスが次々に開かれ、莫大な財宝が手に入る。
      ダレイオス3世は逃走の途中で臣下に殺された。
      遠征はさらに中央アジアへ進み、ソグディアナの山岳地帯で苦戦する。
      インドではヒュダスペス川で象を擁する王と戦い、これを破った。
      しかし兵が進軍を拒み、紀元前325年に帰路につく。

      通った各地には70を超える都市が建設されたとされる。
      ギリシア語が共通語として広がり、東西の技術と信仰が混ざり合った。
      遠征そのものより、その後に生まれた文化の混合が歴史を動かすことになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/Istanbul_-_Museo_archeol._-_Alessandro_Magno_%28firmata_Menas%29_-_sec._III_a.C._-_da_Magnesia_-_Foto_G._Dall%27Orto_28-5-2006_b-n.jpg/500px-Istanbul_-_Museo_archeol._-_Alessandro_Magno_%28firmata_Menas%29_-_sec._III_a.C._-_da_Magnesia_-_Foto_G._Dall%27Orto_28-5-2006_b-n.jpg
