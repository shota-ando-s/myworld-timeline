  - id: solon-reform
    year: -594
    title: ソロンの改革
    category: society
    tags: [アテネ, 法]
    summary: 借金による奴隷化を禁じ、市民の権利を財産で区分した。民主政への第一歩。
    detail: |
      アテネの政治家ソロンが行った一連の改革で、紀元前594年のこと。
      借金による市民の奴隷化を禁じ、権利を家柄ではなく財産で区分した。
      民主政への第一歩とされる。

      当時のアテネは深刻な危機にあった。
      貧しい農民は借金の担保に自分の身を差し出しており、返済できなければ奴隷として売られる。
      土地は少数の貴族に集中し、内乱の危険が高まっていた。
      ソロンは調停者として全権を委ねられた。
      まず既存の負債を帳消しにし、身体を担保とする借財を禁じる。
      奴隷として売られた市民を買い戻して解放した。

      次に、市民を年間の収穫量に応じて四つの等級に分けた。
      上位の等級ほど高い公職に就けるが、最下層の市民も民会と裁判に参加できる。
      血筋ではなく財産が基準になったことで、新しく富を得た者にも道が開かれた。
      裁判では、市民が陪審員として判決に加わる制度が整えられる。
      不正を受けた者に代わって、誰でも訴えを起こせるようにもした。

      改革は双方から不満を持たれた。
      貴族は特権を削られたと考え、貧民は土地の再分配がなかったと不満を抱く。
      ソロンは10年間の外遊に出たと伝えられる。
      その後まもなく僭主政が現れるが、市民の身分保障という原則は残った。
      クレイステネスの改革を経て、アテネは民主政へ進んでいく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/NAMA_Head_of_a_Kouros.JPG/500px-NAMA_Head_of_a_Kouros.JPG
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:NAMA_Head_of_a_Kouros.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ソロン

  - id: cleisthenes
    year: -508
    title: クレイステネスの改革
    category: society
    tags: [アテネ, 民主政]
    summary: 血縁でなく地域で市民を編成し、アテネ民主政の骨格ができた。
    detail: |
      アテネの政治家クレイステネスが行った改革で、紀元前508年のこと。
      市民を血縁ではなく居住する地域によって編成し直した。
      アテネ民主政の骨格がここで作られる。

      僭主の追放後、アテネでは主導権をめぐる争いが続いていた。
      クレイステネスは民衆の支持を味方につけて改革を進める。
      最大の変更は、部族の再編である。
      それまで市民は四つの血縁的な部族に属し、名門の貴族が支配していた。
      これを廃し、アッティカ全域を多数の区に分け、海岸・内陸・都市の三地域から区を組み合わせて十の部族を作る。
      出身地の異なる者が同じ部族に属することで、旧来の派閥は解体された。

      各部族から50人ずつを抽選で選び、500人の評議会が組織された。
      評議会は民会の議題を準備し、日常の行政を担う。
      抽選による選出は、家柄や富によらず市民が公務に関わることを意味した。
      将来の僭主を防ぐため、陶片追放の制度も設けられたとされる。
      市民が危険とみなす人物の名を陶片に書き、一定数に達すれば10年間国外へ退去させる仕組みである。

      この改革によって、アテネは市民全体が政治に参加する体制へ大きく進んだ。
      参政権は成年男子市民に限られ、女性・在留外国人・奴隷は除かれている。
      それでも、市民が自ら統治するという理念はここで制度になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Cleisthenes.jpg/500px-Cleisthenes.jpg
