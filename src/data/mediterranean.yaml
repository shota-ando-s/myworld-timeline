        url: https://ja.wikipedia.org/wiki/アレクサンドロス3世
    related: [hellenistic]

  - id: euclid-elements
    year: -300
    circa: true
    title: エウクレイデス『原論』
    category: science
    tags: [数学, アレクサンドリア]
    summary: 定義と証明で組み立てる方法を確立し、2000年以上教科書であり続けた。
    detail: |
      アレクサンドリアの数学者エウクレイデスがまとめた数学書で、紀元前300年ごろの成立。
      全13巻からなり、幾何学と数論を体系的に扱う。
      定義と証明によって理論を組み立てる方法を確立した。

      内容の多くは、それ以前の数学者たちの成果である。
      この書の独創は、それらを一つの論理体系として並べ直したところにある。
      出発点は、点や線といった定義と、五つの公準、そして共通の概念である。
      そこから一つずつ命題を証明し、証明済みの命題を使って次を証明していく。
      任意の点から任意の点へ直線が引けるといった、疑いようのない前提だけを認める姿勢が徹底されている。

      扱う内容は幅広い。
      三角形と円の性質、比例の理論、素数が無限に存在することの証明、無理数の扱い、立体の体積などが含まれる。
      五番目の公準は、平行線に関するものである。
      他に比べて自明でないと感じられ、2000年にわたり証明の試みが続いた。
      19世紀に、この公準を変えても矛盾のない幾何学が作れることが示され、非ユークリッド幾何学が生まれる。

      『原論』は、聖書に次いで多く印刷された書物ともいわれる。
      近代まで学校の教科書として使われ続けた。
      ニュートンやスピノザは、自らの著作をこの形式にならって書いている。
      公理から出発して論を積み上げるという方法そのものが、この書の最大の遺産である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Woman_teaching_geometry.jpg/500px-Woman_teaching_geometry.jpg
      credit: Attributed to Meliacin Master / Public domain
      page: https://commons.wikimedia.org/wiki/File:Woman_teaching_geometry.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ユークリッド原論

  - id: punic-war-1
    year: -264
    title: 第一次ポエニ戦争
    category: war
    tags: [ローマ, カルタゴ]
    summary: カルタゴとの120年に及ぶ抗争の始まり。勝利でローマは海の帝国になった。
    detail: |
      ローマとカルタゴが戦った三度の戦争の最初で、紀元前264年に始まった。
      23年続き、ローマの勝利で終わる。
      この勝利によってローマは海の帝国になった。

      カルタゴは北アフリカのフェニキア系の都市国家で、地中海西部の交易を握っていた。
      ローマはイタリア半島を統一したばかりで、海軍を持たない陸の国家である。
      両者はシチリア島をめぐって衝突した。
      ローマは、座礁したカルタゴの軍船を手本に艦隊を建造したと伝えられる。
      海戦の経験の差を埋めるため、相手の船に橋を渡して乗り移り、白兵戦に持ち込む装置を考案した。
      これによって海戦を陸戦に変え、勝利を重ねる。

      戦いは長期化し、双方とも艦隊を何度も失った。
      ローマは嵐で数百隻を沈められながら、市民から資金を集めて再建する。
      紀元前241年、最後の海戦に敗れたカルタゴが講和を受け入れた。
      シチリアはローマ最初の属州となり、続いてサルデーニャとコルシカも奪われる。
      多額の賠償金が課され、カルタゴは財政難から傭兵の反乱にも苦しんだ。

      カルタゴはイベリア半島に新たな拠点を築いて力を回復する。
      その指揮官の子が、20年後に第二次ポエニ戦争を起こすハンニバルである。
      地中海の覇権をめぐる争いは、ここから100年以上続いた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ac/First_Punic_War_264_BC_v3.png/500px-First_Punic_War_264_BC_v3.png
      credit: Harrias / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:First_Punic_War_264_BC_v3.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第一次ポエニ戦争

  - id: hannibal-alps
    year: -218
    title: ハンニバルのアルプス越え
    category: war
    tags: [カルタゴ, ローマ]
    summary: 象を連れて山を越えイタリアを16年荒らした。ローマは存亡の危機に立った。
    detail: |
      ハンニバルがイベリア半島から軍を率いてアルプス山脈を越え、イタリアへ侵入した出来事。
      紀元前218年のことで、第二次ポエニ戦争の始まりにあたる。
      ローマを存亡の危機に立たせた。

      海はローマ海軍が押さえていた。
      そのため陸路をとり、ピレネー山脈を越え、南フランスを横断してローヌ川を渡る。
      象を筏に乗せて渡河させたと伝えられる。
      アルプス越えには15日ほどを要した。
      季節は秋で、雪と氷、現地の部族の襲撃、崖崩れに苦しめられる。
      出発時に約4万だった兵は、イタリア側に下りたときに2万余りまで減っていたとされる。
      象も多くが死んだ。

      それでも、この機動は完全な奇襲になった。
      ローマは敵がイベリアかアフリカから来ると考えており、北からの侵入を想定していない。
      北イタリアのガリア人が味方につき、軍は補充された。
      以後16年にわたり、ハンニバルはイタリア半島で戦い続ける。
      カンナエでは8万ともいわれるローマ軍を一日で壊滅させた。
      ローマは兵力の大半を失いながら降伏せず、消耗戦に持ち込む。

      この遠征は、地形と常識の裏をかく作戦の代表例として語り継がれた。
      近代の軍人も繰り返しこの行軍を研究している。
      一方で、戦術の勝利が必ずしも戦争の勝利にならないことを示す例でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Hannibal_route_of_invasion-en.svg/500px-Hannibal_route_of_invasion-en.svg.png
      credit: Pinpin / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Hannibal_route_of_invasion-en.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ハンニバルのアルプス越え

  - id: carthage-destroyed
    year: -146
    title: カルタゴの滅亡とギリシアの属州化
    category: war
    tags: [ローマ, 地中海]
    summary: 同じ年に東西の対抗勢力が消え、地中海がローマの内海になった。
    detail: |
      ローマがカルタゴを滅ぼし、同じ年にギリシアのコリントスも破壊した出来事。
      紀元前146年のことである。
      東西の対抗勢力が同時に消え、地中海はローマの内海になった。

      第二次ポエニ戦争に敗れたカルタゴは、軍備を制限され賠償を課されていた。
      それでも交易によって経済を回復させ、賠償を早期に完済する。
      ローマの元老院では、この回復を脅威とみる声が強まった。
      演説のたびにカルタゴは滅ぼされるべきだと述べた政治家の逸話が知られる。
      隣国との紛争を口実に、ローマは最後通牒を突きつけた。
      武装の放棄を要求し、それに従ったカルタゴに対して都市を内陸へ移すよう命じる。
      受け入れがたい要求に、市民は籠城を選んだ。

      3年の包囲の末、市街戦を経て都市は陥落した。
      住民は殺されるか奴隷として売られ、建物は徹底的に破壊される。
      土地に塩をまいたという話は後世の創作とされる。
      同じ年、ギリシアではアカイア同盟がローマに敗れ、コリントスが破壊された。
      ギリシアは属州として組み込まれる。

      二つの出来事によって、地中海世界にローマに対抗できる勢力はなくなった。
      一方、征服がもたらした富と奴隷はローマ社会を変質させる。
      貧富の差が広がり、共和政は内側から揺らいでいった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/CarthageMap.png/500px-CarthageMap.png
