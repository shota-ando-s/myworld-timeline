        url: https://ja.wikipedia.org/wiki/西ローマ帝国

  - id: justinian-code
    year: 529
    title: ユスティニアヌス法典
    category: society
    tags: [ビザンツ, 法]
    summary: ローマ法を集大成し、のちのヨーロッパ各国の法の源になった。
    detail: |
      ユスティニアヌス1世が編纂させたローマ法の集大成で、529年から作業が始まった。
      勅法彙纂・学説彙纂・法学提要と、その後の新勅法からなる。
      後世にローマ法大全と呼ばれ、ヨーロッパ各国の法の源になった。

      当時、ローマ法は膨大な量に膨れ上がっていた。
      歴代皇帝の勅法と、法学者たちの学説が千年分積み重なり、互いに矛盾する条文も多い。
      法律家でさえ全体を把握できない状態だった。

      編纂は法学者トリボニアヌスを中心に進められた。
      まず皇帝の勅法を整理して勅法彙纂をまとめる。
      次に、古典期の法学者の著作から重要な箇所を抜き出して学説彙纂を編んだ。
      300万行に及ぶ原典を15万行に圧縮したとされる。
      初学者向けの教科書として法学提要も作られた。

      矛盾する箇所は皇帝の権限で修正され、採用されなかった原典は効力を失った。
      そのため、古典期の法学書の多くはこの編纂を通じてのみ伝わっている。
      東方ではギリシア語訳が使われ続けた。
      西欧では長く忘れられていたが、11世紀にイタリアで写本が再発見される。
      ボローニャに法学の学校が生まれ、そこからヨーロッパ中に研究が広がった。
      契約、所有、相続、不法行為といった概念は、ここから各国の民法に受け継がれている。
      大陸法の伝統は、この法典を共通の源としている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ローマ法大全

  - id: hagia-sophia
    year: 537
    title: ハギア・ソフィアの完成
    category: culture
    tags: [ビザンツ, 建築]
    summary: 巨大な円蓋で空間を包む技術。1000年間、世界最大の教会だった。
    detail: |
      コンスタンティノープルに建てられた大聖堂で、537年に完成した。
      巨大な円蓋で内部空間を覆う建築として知られる。
      およそ1000年にわたり、世界最大の教会堂であり続けた。

      前身の聖堂は暴動で焼失していた。
      ユスティニアヌス1世は再建にあたり、前例のない規模の建築を命じる。
      設計を担ったのは、数学と物理に通じた二人の学者だった。
      最大の特徴は、直径31メートルの円蓋である。
      四隅の柱から三角形の面をせり出させて円蓋を支える構造をとり、正方形の空間の上に円を載せた。
      円蓋の基部には40の窓が並び、光が差し込んで蓋が浮いているように見える。

      工事はわずか5年10か月で完了した。
      大理石は帝国各地から集められ、金のモザイクが内部を覆う。
      完成のとき、皇帝がソロモンを超えたと述べたという逸話が伝わる。
      地震で円蓋が崩れ、6世紀のうちに形を変えて再建された。
      以後も補強を重ねながら建ち続けている。

      1453年の征服後はモスクに改められ、ミナレットが加えられた。
      トルコ共和国のもとで1934年に博物館となり、2020年に再びモスクとして使われている。
      ビザンツ建築の到達点であり、後のイスラム建築の円蓋にも影響を与えた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/Hagia_Sophia_Mars_2013.jpg/500px-Hagia_Sophia_Mars_2013.jpg
      credit: Arild Vågen / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Hagia_Sophia_Mars_2013.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アヤソフィア

  - id: plague-of-justinian
    year: 541
    title: ユスティニアヌスの疫病
    category: disaster
    tags: [ビザンツ, 疫病]
    summary: 地中海の人口を大きく減らし、ローマ世界の再統一の望みを絶った。
    detail: |
      541年にエジプトで始まり、地中海世界に広がった疫病の大流行。
      記録に残る最初のペストの世界的流行とされる。
      ローマ世界の再統一という構想を、事実上終わらせた。

      最初の流行は、エジプトの港から穀物の船に乗って各地へ運ばれた。
      542年にコンスタンティノープルに達し、都では一日に数千人が死んだと記録されている。
      埋葬が追いつかず、城壁の塔に遺体を積み上げたと伝えられる。
      皇帝自身も感染したが回復した。

      病原はペスト菌で、近年の遺伝学的な分析によって確認されている。
      ネズミとノミが媒介し、交易路に沿って広がった。
      流行は一度で終わらず、200年にわたり十数回の波が繰り返された。
      地中海世界の人口は、推定で三分の一から半分が失われたとされる。

      影響は広範に及んだ。
      税収が激減し、兵を集められなくなったことで、ユスティニアヌスの西方回復は維持できなくなる。
      イタリアはまもなくランゴバルド人に奪われた。
      労働力の不足で農地が放棄され、都市は縮小する。
      同じころペルシアも打撃を受けており、7世紀にイスラム勢力が急速に拡大できた背景の一つとされる。
      感染症が政治の地図を書き換えた、歴史上最も明確な例の一つである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5b/Chevalier_Roze_%C3%A0_la_Tourette_-_1720.PNG/500px-Chevalier_Roze_%C3%A0_la_Tourette_-_1720.PNG
      credit: ミシェル・セール / Public domain
      page: https://commons.wikimedia.org/wiki/File:Chevalier_Roze_%C3%A0_la_Tourette_-_1720.PNG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ペストの歴史

  - id: iconoclasm
    year: 726
    title: 聖像禁止令
    category: religion
    tags: [ビザンツ, 教会]
    summary: 聖画像をめぐる100年の対立。東西の教会が離れていく一因になった。
    detail: |
      東ローマ帝国で聖画像の崇敬が禁じられ、破壊が行われた運動。
      726年ごろに始まり、100年以上にわたって断続的に続いた。
      東西の教会が離れていく一因になった。

      聖像は、キリストや聖人を描いた板絵で、東方の信仰生活の中心にあった。
      人々はその前で祈り、口づけし、病の治癒を願う。
      これを偶像崇拝だとする批判が、帝国内に以前から存在していた。
      レオン3世が禁止を打ち出すと、教会と修道院は激しく抵抗した。
      聖像を守ろうとした者が処刑され、修道院は財産を没収される。
      多くの美術品が失われた。

      背景には、神学上の論点があった。
      神が人となったのだから、その姿を描くことは受肉の肯定だという擁護論と、描けば物質を拝むことになるという批判が対立する。
      ダマスコのヨアンネスら、イスラムの支配下にいた神学者が擁護の議論を展開した。
      787年の公会議で崇敬が一度認められ、9世紀に再び禁止された後、843年に最終的に復活する。
      この決着は、正教会では正統の勝利として毎年記念されている。

      西方の教会は一貫して聖像を擁護した。
      教皇は皇帝を非難し、保護者をフランク王国に求めるようになる。
      聖像をめぐる対立は、政治的な離反と結びついて東西の分離を進めた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ce/UtrechtIconoclasm.jpg/500px-UtrechtIconoclasm.jpg
      credit: Arktos / CC BY-SA 2.5
      page: https://commons.wikimedia.org/wiki/File:UtrechtIconoclasm.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イコノクラスム

  - id: great-schism
    year: 1054
    title: 東西教会の分裂
    category: religion
    tags: [キリスト教]
    summary: カトリックと正教が互いを破門。ヨーロッパの東西の溝が決定的になった。
    detail: |
      ローマを中心とする西方の教会と、コンスタンティノープルを中心とする東方の教会が分裂した出来事。
      1054年、双方の代表が互いを破門した。
      カトリックと正教という二つの流れが、ここで確定する。

      対立は長い時間をかけて積み重なっていた。
      言語がラテン語とギリシア語に分かれ、典礼の作法も異なっていく。
      聖像をめぐる争い、教皇がフランク王国と結んだこと、南イタリアの管轄をめぐる争いが重なった。

      教義上の最大の論点は、聖霊が父からのみ出るのか、子からも出るのかという問題である。
      西方が信条に子からもという語句を加えたことに、東方は公会議の決定を一方的に変えたと反発した。
      決定的な要因は、教皇の地位をめぐる理解の違いである。
      西方は教皇を全教会の首位と位置づけ、東方は五つの総主教座の筆頭にすぎないとみた。

      1054年、教皇の使節が都を訪れて交渉したが決裂する。
      使節はハギア・ソフィアの祭壇に破門状を置き、総主教も同じく使節を破門した。
      当時はこれを最終的な分裂とは考えていない。
      決定的になったのは、1204年の第4回十字軍である。
      同じキリスト教の都が略奪されたことで、和解の道はほぼ閉ざされた。
      1965年に相互の破門は撤回されたが、統合には至っていない。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/東西教会の分裂

  - id: fourth-crusade
    year: 1204
    title: 第4回十字軍のコンスタンティノープル占領
    category: war
    tags: [十字軍, ビザンツ]
    summary: 同じキリスト教の都を略奪し、ビザンツは回復できないまま衰えた。
    detail: |
      第4回十字軍がコンスタンティノープルを攻略し、略奪した出来事。
      1204年のことである。
      同じキリスト教の都を襲った遠征として、長く記憶されることになった。

      本来の目的はエジプトの攻略だった。
      しかし集まった兵は予定より少なく、ヴェネツィアに発注した船の代金を払えない。
      負債の代わりに、ヴェネツィアの意向で同じキリスト教の都市を攻めることになった。
      さらに、ビザンツの帝位を追われた皇子が援助を求めてきた。
      復位させれば多額の報酬と軍事的支援が得られるという条件である。
      十字軍は進路を変え、コンスタンティノープルへ向かった。

      復位は実現したが、新皇帝は約束した金額を払えなかった。
      都では反発から政変が起き、十字軍は都市そのものを攻略する。
      三日にわたる略奪で、聖堂の宝物と古代からの美術品が奪われた。
      ヴェネツィアのサン・マルコ寺院の馬の像は、このとき持ち去られたものである。

      十字軍はラテン帝国を建て、57年にわたり支配した。
      ビザンツは亡命政権から都を回復するが、力は戻らない。
      この出来事によって、東西の教会の和解は事実上不可能になった。
      弱体化した帝国はオスマンの進出を防げず、1453年の滅亡へつながる。
      宗教的な名目の遠征が、利害によって全く別の結果を生んだ例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/ConquestOfConstantinopleByTheCrusadersIn1204.jpg/500px-ConquestOfConstantinopleByTheCrusadersIn1204.jpg
      credit: ロイゼ・リデ / Public domain
      page: https://commons.wikimedia.org/wiki/File:ConquestOfConstantinopleByTheCrusadersIn1204.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第4回十字軍

  - id: medici-bank
    year: 1397
    title: メディチ銀行の設立
    category: economy
    tags: [フィレンツェ, 金融]
    summary: 為替と複式簿記で欧州に支店網を築き、その富が芸術家を育てた。
    detail: |
      フィレンツェのメディチ家が設立した銀行で、1397年に開業した。
      ヨーロッパ各地に支店を置き、当時最大級の金融機関になる。
      その富が、ルネサンスの芸術を支えた。

      創業者のジョヴァンニは、一族の別の銀行で経験を積んだ後に独立した。
      ローマ、ヴェネツィア、ジュネーヴ、ブリュージュ、ロンドンなどに支店を広げる。
      中心となる業務は、為替手形の取引である。
      現金を運ばずに遠隔地へ送金でき、両替の差額から利益を得られる。
      利子を取ることが教会に禁じられていたため、為替の形をとることで実質的な貸付を行った。

      最大の顧客は教皇庁だった。
      各地から集まる献金の送金を扱い、その資金を運用することで大きな利益を上げる。
      経営の方法にも特徴がある。
      各支店を別の会社として組織し、支店長に出資させて利益を分ける仕組みをとった。
      一つの支店が失敗しても本体が連鎖的に倒れない構造である。
      複式簿記を用いて、各支店の収支を把握した。

      蓄えられた富は、政治と文化に投じられた。
      コジモとロレンツォは公職に就かないまま市政を動かし、建築家や画家を援助する。
      15世紀後半には経営が傾き、1494年に一族の追放とともに銀行も閉じられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Coat_of_arms_of_Cosimo_il_Vecchio.svg/500px-Coat_of_arms_of_Cosimo_il_Vecchio.svg.png
      credit: 作者不明 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Coat_of_arms_of_Cosimo_il_Vecchio.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/メディチ家

  - id: medici-florence
    year: 1434
    title: メディチ家のフィレンツェ支配
    category: politics
    tags: [フィレンツェ, ルネサンス]
    summary: 商人が都市の実権を握り、芸術と学問の保護者になった。
    detail: |
      メディチ家がフィレンツェの実権を握った出来事で、1434年のこと。
      前年に追放されていたコジモが呼び戻され、以後一族が都市を主導する。
      商人が都市の支配者になった例である。

      フィレンツェは共和政の都市国家で、くじ引きと短い任期によって公職が回る仕組みを持っていた。
      特定の個人や家系に権力が集まらないよう設計されている。
      メディチ家は、この制度を壊さずに内側から掌握した。
      候補者の名簿を作る段階に影響を及ぼし、支持者が選ばれるようにする。
      反対派には重税を課し、経済的に追い詰めた。

      富の源は銀行業である。
      教皇庁の資金を扱い、ヨーロッパ各地に支店を持つ。
      その資金力が、政治的な影響力の裏づけになった。
      支配は世襲的に受け継がれた。
      コジモから孫のロレンツォまで、いずれも公的な肩書きを持たないまま都市を動かす。
      1494年に一度追放され、その後復帰して公爵として正式な君主になった。

      この時期のフィレンツェは、芸術と学問の中心になる。
      一族は画家や彫刻家に仕事を与え、古典の研究を支えた。
      共和政の外見と個人の支配という二重構造は、当時のイタリア諸都市に共通する現象でもあった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Coat_of_arms_of_Cosimo_il_Vecchio.svg/500px-Coat_of_arms_of_Cosimo_il_Vecchio.svg.png
      credit: 作者不明 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Coat_of_arms_of_Cosimo_il_Vecchio.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/メディチ家

  - id: fall-of-constantinople
    year: 1453
    title: コンスタンティノープル陥落
    category: war
    tags: [オスマン, ビザンツ]
    summary: オスマン帝国が1000年の都を攻略し、ビザンツ帝国が滅んだ。
    detail: |
      オスマン帝国がビザンツ帝国の都を攻略した出来事で、1453年5月のこと。
      1000年以上続いた帝国が滅び、中世の終わりを示す事件とされる。

      攻める側は、21歳のメフメト2世が率いる10万前後の軍だった。
      守る側は、外国人の傭兵を含めて7000人ほどにすぎない。
      決め手になったのは大砲である。
      ハンガリー出身の技術者が作った巨大な砲が、難攻不落と言われた三重の城壁を崩していった。
      石を積み上げた城壁は、火砲の時代に対応できない。
      中世の築城術が終わったことを、この包囲は示している。

      海側では、金角湾の入口を鎖で封鎖されていた。
      メフメトは船を陸に上げ、丘を越えて湾内へ運び込むという手段でこれを突破した。
      7週間の包囲の末、5月29日に城壁が破られた。
      最後の皇帝は戦死し、市内では三日間の略奪が行われる。
      ハギア・ソフィアはモスクに改められた。

      メフメトは都をイスタンブルと呼び、帝国の首都とした。
      各地から住民を移して都市を再建し、正教会の総主教を任命して信徒の自治を認めている。
      逃れた学者が写本を携えてイタリアへ渡り、ルネサンスの古典研究を後押ししたとも言われる。
      東地中海の交易路が変わったことは、大西洋への航路の探索を促す一因にもなった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Constantinople_1453.jpg/500px-Constantinople_1453.jpg
      credit: Jean Le Tavernier / Public domain
      page: https://commons.wikimedia.org/wiki/File:Constantinople_1453.jpg
    links:
