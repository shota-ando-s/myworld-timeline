        url: https://ja.wikipedia.org/wiki/東ローマ帝国

  - id: papal-states
    title: 教皇領
    start: 756
    end: 1870
    category: religion
    tags: [イタリア, 教皇]
    summary: 教皇が世俗の君主でもあった1100年。宗教と政治の絡み合いの舞台になった。
    detail: |
      ローマ教皇が世俗の君主として支配した領域で、756年から1870年まで続いた。
      イタリア中部を中心に、時代によって範囲は変わる。
      宗教と政治の絡み合いの舞台になった。

      成立の契機は、フランク王ピピンの寄進である。
      ランゴバルド人から奪った土地を教皇に譲り、教皇が世俗の統治者となった。
      この寄進は、教皇がピピンの王位を承認したことへの見返りでもある。
      正当化のために、コンスタンティヌス帝が教皇に西方の統治権を与えたとする文書が用いられた。
      15世紀に偽作であることが証明されるが、それまで数百年にわたり根拠とされている。

      教皇領の存在は、教皇の立場を二重にした。
      普遍的な教会の長であると同時に、領土を守り税を集める君主でもある。
      近隣の諸国との争い、傭兵の雇用、縁故による人事が、宗教的な権威を傷つけた。
      宗教改革の批判の一因でもある。

      19世紀、イタリア統一運動のなかで教皇領は縮小していった。
      1870年、イタリア王国軍がローマに入って領土は消滅する。
      教皇は自らをヴァチカンの囚人と称し、以後60年間イタリア政府と対立した。
      1929年の協定でヴァチカン市国が成立し、最小限の主権が回復される。
      領土を持つことが権威を支えるのか損なうのかという問いが、この1100年に凝縮されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/Flag_of_the_Papal_States_%28pre_1808%29.svg/500px-Flag_of_the_Papal_States_%28pre_1808%29.svg.png
      credit: User:Dinozzo2005 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_Papal_States_(pre_1808).svg
    links:
