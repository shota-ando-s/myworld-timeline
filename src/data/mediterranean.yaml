    tags: [地中海, 海の民]
    summary: 東地中海の王国が数十年で次々に倒れ、交易網ごと失われた。

  - id: homer-epics
    year: -750
    circa: true
    title: ホメロスの叙事詩
    category: culture
    tags: [ギリシア, 文学]
