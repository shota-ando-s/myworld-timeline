lane: mediterranean

periods:
  - id: minoan
    title: ミノア文明
    start: -2000
    startCirca: true
    end: -1400
    endCirca: true
    category: culture
    tags: [ギリシア, クレタ]
    summary: クレタ島の宮殿文明。城壁を持たない海の交易文明だった。

  - id: mycenaean
    title: ミケーネ文明
    start: -1600
    startCirca: true
    end: -1200
    endCirca: true
    category: politics
    tags: [ギリシア]
    summary: ギリシア本土の戦士王たちの文明。前1200年頃に一斉に崩壊した。

  - id: greek-dark-ages
    title: ギリシアの暗黒時代
    start: -1200
    startCirca: true
    end: -800
    endCirca: true
    category: society
    tags: [ギリシア]
    summary: 文字も宮殿も失われた400年。この沈黙のあとにポリスが現れる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/暗黒時代_(古代ギリシア)

  - id: greek-poleis
    title: 古代ギリシアのポリス時代
    start: -800
    end: -338
    category: politics
    tags: [ギリシア, 都市国家]
    summary: アテネ・スパルタなど小さな都市国家が競い合い、民主政と哲学が生まれた。

  - id: etruscan
    title: エトルリア
    start: -750
    startCirca: true
    end: -264
    category: culture
    tags: [イタリア]
    summary: ローマ以前のイタリアを支配した都市連合。建築と占いの技術をローマに残した。

  - id: hellenistic
    title: ヘレニズム時代
    start: -323
    end: -30
    category: culture
    tags: [ギリシア, オリエント]
    summary: アレクサンドロスの遺産を継ぐ王国群。ギリシア文化が西アジアと融合した。

  - id: roman-republic
    title: ローマ共和政
    start: -509
    end: -27
    category: politics
    tags: [ローマ]
    summary: 元老院と市民による統治で地中海を制覇し、その拡大が内部から共和政を壊した。

  - id: roman-empire
    title: ローマ帝国
    start: -27
    end: 476
    category: politics
    tags: [ローマ]
    summary: 地中海世界を一つにまとめた帝国。法・道路・都市の遺産は今も残る。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ローマ帝国

  - id: pax-romana
    title: パクス・ロマーナ
    start: -27
    end: 180
    category: society
    tags: [ローマ, 平和]
    summary: 地中海全域が一つの法と通貨で結ばれた約200年。交易と都市が栄えた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/パクス・ロマーナ

  - id: crisis-third-century
    title: 三世紀の危機（軍人皇帝時代）
    start: 235
    end: 284
    category: war
    tags: [ローマ, 混乱]
    summary: 50年で20人以上の皇帝が立ち、疫病と侵入で帝国が分解しかけた。

  - id: byzantine
    title: ビザンツ帝国（東ローマ）
    start: 395
    end: 1453
    category: politics
    tags: [ローマ, ギリシア正教]
    summary: 西ローマ滅亡後も1000年続き、ギリシア・ローマの遺産を中世へ受け渡した。

  - id: papal-states
    title: 教皇領
    start: 756
    end: 1870
    category: religion
    tags: [イタリア, 教皇]
    summary: 教皇が世俗の君主でもあった1100年。宗教と政治の絡み合いの舞台になった。

  - id: venice-republic
    title: ヴェネツィア共和国
    start: 697
    end: 1797
    category: economy
    tags: [イタリア, 交易]
    summary: 東地中海の交易を握った海洋国家。1100年続いた商人の共和政。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴェネツィア共和国

  - id: italian-renaissance
    title: イタリア・ルネサンス
    start: 1300
    startCirca: true
    end: 1550
    category: culture
    tags: [イタリア, 文化]
    summary: フィレンツェなど商業都市の富を背景に、古典の復興と人間中心の文化が花開いた。
    detail: |
      毛織物と銀行で得た富が芸術家を雇い、都市が競って自らを飾った。
      古代の彫刻や文献を「手本」として学び直したことが、
      人間と自然を観察する態度につながっていく。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ルネサンス

  - id: italian-wars
    title: イタリア戦争
    start: 1494
    end: 1559
    category: war
    tags: [イタリア, フランス, スペイン]
    summary: 半島が大国の戦場になり、ルネサンスの担い手だった都市国家が力を失った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イタリア戦争

events:
