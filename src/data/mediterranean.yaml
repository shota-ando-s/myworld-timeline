  - id: marathon
    year: -490
    title: マラトンの戦い
    category: war
    tags: [ギリシア, ペルシア戦争]
    summary: アテネ軍がペルシアの遠征軍を撃退し、ポリスの自信を決定づけた。
    detail: |
      アテネとプラタイアの連合軍が、ペルシアの遠征軍を撃退した戦い。
      紀元前490年、アッティカ東部のマラトンの平野で行われた。
      ポリスの自信を決定づけた勝利である。

      ペルシアは、イオニアのギリシア人都市の反乱をアテネが支援したことへの報復として遠征軍を送った。
      上陸したのは2万前後と推定され、アテネ側は1万ほどだった。
      スパルタは祭礼を理由に援軍を遅らせている。
      アテネの重装歩兵は、中央を薄く両翼を厚くして布陣した。
      中央が押し込まれるあいだに両翼が敵を包み込み、挟撃する形になる。
      密集した隊形と重装備が、軽装のペルシア兵に対して有効だった。

      ヘロドトスによれば、ペルシア側の戦死者は6400人、アテネ側は192人だったという。
      数字の正確さはともかく、勝敗は明確だった。
      勝利の報を伝えるため一人の兵士が走り、伝え終えて息絶えたという逸話が後に伝えられた。
      近代のマラソン競技は、この物語にちなんで作られている。

      この勝利は、市民が自ら武装して国を守るという体制の有効性を示した。
      アテネの重装歩兵層の発言力が高まり、民主政はさらに進む。
      10年後、ペルシアはより大規模な遠征を行うが、サラミスとプラタイアで再び退けられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/They_crashed_into_Persian_army_with_tremendous_force.jpg/500px-They_crashed_into_Persian_army_with_tremendous_force.jpg
      credit: ウォルター・クレイン / Public domain
      page: https://commons.wikimedia.org/wiki/File:They_crashed_into_Persian_army_with_tremendous_force.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マラトンの戦い

  - id: salamis
    year: -480
    title: サラミスの海戦
    category: war
    tags: [ギリシア, ペルシア戦争]
    summary: 三段櫂船の漕ぎ手となった無産市民が発言力を得て、民主政が深まった。
    detail: |
      ギリシアの連合艦隊がペルシアの艦隊を破った海戦で、紀元前480年に行われた。
      アテネ近くのサラミス島との狭い海峡が戦場になった。
      ペルシア戦争の帰趨を決めた戦いである。

      ペルシア王クセルクセスの大軍は、テルモピュライの防衛線を破ってアテネを占領していた。
      市民は島へ避難し、残るのは艦隊だけという状況だった。
      アテネの指導者テミストクレスは、数年前から銀山の収入で軍船を建造していた。
      彼は、狭い海峡に敵を誘い込めば数の優位を無効にできると説く。
      偽の情報を送ってペルシア艦隊を海峡へ誘い込んだと伝えられる。

      狭い水域では、数に勝るペルシア艦隊は隊形を保てなかった。
      身軽なギリシアの三段櫂船が体当たりを繰り返し、敵艦を次々に沈める。
      クセルクセスは丘の上からこの敗北を見届け、本国へ引き上げた。
      翌年、残された陸軍もプラタイアで敗れる。

      この勝利は、政治にも大きな影響を与えた。
      三段櫂船の漕ぎ手は、武具を買えない無産の市民が担っていた。
      国を守ったのは彼らだという意識が、民主政をさらに深める根拠になる。
      アテネは海軍力を背景にデロス同盟を率い、エーゲ海の主導権を握った。
      その力が、後にスパルタとの対立を招くことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/Battle_of_salamis.png/500px-Battle_of_salamis.png
      credit: The Department of History, United States Military Academy / Public domain
      page: https://commons.wikimedia.org/wiki/File:Battle_of_salamis.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/サラミスの海戦

  - id: parthenon
    year: -447
    title: パルテノン神殿の造営
    category: culture
    tags: [アテネ, 建築]
    summary: ペリクレス時代のアテネの繁栄と自負を形にした建築。
    detail: |
      アテネのアクロポリスに建てられた、守護女神アテナを祀る神殿。
      造営は紀元前447年に始まり、15年ほどで完成した。
      ペリクレス時代の繁栄と自負を形にした建築である。

      ペルシア戦争で破壊された神殿の跡地に建てられた。
      費用はデロス同盟の資金から出されており、同盟国からは流用だという批判もあった。
      設計はイクティノスとカリクラテス、彫刻はフェイディアスが監督した。
      柱は正面に8本、側面に17本並び、白い大理石が用いられている。

      細部には巧みな工夫がある。
      床はわずかに中央が高く、柱は中ほどがふくらみ、四隅の柱は内側に傾いている。
      まっすぐに見せるために、あえて直線を避けた設計である。
      内部には、金と象牙で作られた高さ12メートルの女神像が置かれた。
      外側の帯状の浮彫には、女神に捧げる市民の行列が表されている。
      神ではなく市民の姿を神殿に刻んだ点が、この建築の性格を示す。

      その後、キリスト教の聖堂、モスクと転用され、17世紀には火薬庫として使われて爆発で大破した。
      19世紀に彫刻の多くがイギリスへ持ち去られ、その返還は今も外交上の問題になっている。
      古典建築の規範として、その形は世界中の公共建築に受け継がれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/The_Parthenon_in_Athens.jpg/500px-The_Parthenon_in_Athens.jpg
      credit: Steve Swayne / CC BY 2.0
      page: https://commons.wikimedia.org/wiki/File:The_Parthenon_in_Athens.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/パルテノン神殿

  - id: peloponnesian-war
    year: -431
    title: ペロポネソス戦争がはじまる
    category: war
    tags: [ギリシア]
    summary: アテネとスパルタの27年戦争。ギリシア世界全体が疲弊した。
    detail: |
      アテネが率いるデロス同盟と、スパルタの側に立つペロポネソス同盟とのあいだの戦争。
      紀元前431年に始まり、27年間続いた。
      ギリシア世界の全体が疲弊する結果になった。

      原因は、アテネの勢力拡大に対するスパルタの警戒である。
      アテネは海軍と同盟国の資金で力を増し、内陸の諸都市にも影響を広げていた。
      歴史家トゥキュディデスは、避けがたい恐怖が戦争を招いたと記している。
      戦い方は対照的だった。
      スパルタは陸軍で優り、アテネの農地を荒らす。
      アテネは城壁に籠もって海から食糧を運び、海軍で敵の沿岸を襲った。
      籠城によって人が密集した結果、疫病が流行してペリクレスを含む多数が死ぬ。

      一度は和平が結ばれたが、アテネがシチリア遠征に踏み切って崩れた。
      大規模な艦隊と兵が失われ、国力は大きく傾く。
      スパルタはペルシアの資金援助を得て艦隊を整え、アテネの補給路を断った。
      紀元前404年、アテネは降伏する。
      城壁は壊され、海軍は解体され、民主政も一時停止された。

      勝ったスパルタも覇権を長く保てず、続く戦乱でギリシア全体が消耗する。
      結果として、北方のマケドニアの台頭を許すことになった。
      トゥキュディデスの記録は、権力と戦争の本質を論じた古典として読み継がれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/Pelop_krieg1.png/500px-Pelop_krieg1.png
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Pelop_krieg1.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ペロポネソス戦争

  - id: socrates-death
    year: -399
    title: ソクラテスの処刑
    category: religion
    tags: [ギリシア, 哲学]
    summary: 民主政アテネが哲学者を死刑にした事件。西洋哲学の原点の一つ。
    detail: |
      アテネの哲学者ソクラテスが、市民の裁判によって死刑に処された出来事。
      紀元前399年のことである。
      民主政が哲学者を裁いた事件として、西洋思想の原点の一つになった。

      罪状は、国家の認める神々を敬わず新しい神霊を持ち込んだこと、そして若者を堕落させたことだった。
      背景には、ペロポネソス戦争に敗れた直後のアテネの不安定な状況がある。
      彼の弟子から、民主政を倒した側の人物が出ていたことも影響したとみられる。

      ソクラテスは、自分が知らないということを知っている点で他より賢いと語った。
      街頭で人々に問いを重ね、自分が確かだと思っていることの根拠を崩していく。
      この対話は多くの有力者に恥をかかせ、反感を買った。
      裁判では500人の陪審員の投票で有罪となり、死刑が決まる。
      弁明では、罰金や国外退去ではなく、自分は公共の恩人として扱われるべきだと述べたと伝えられる。

      弟子たちは脱獄を勧めたが、彼は断った。
      法に従って生きてきた以上、自分に不利な判決だけを拒むのは筋が通らないという理由である。
      毒杯をあおいで死んだ。
      この出来事は、プラトンの著作を通じて後世に伝えられた。
      多数決が正しいとは限らないこと、良心と法が衝突しうることが、以後の政治哲学の基本問題になる。
      プラトンが民主政に批判的になった理由も、この経験にある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bc/Socrate_du_Louvre.jpg/500px-Socrate_du_Louvre.jpg
      credit: Copy of Lysippos (?) / CC BY-SA 2.5
      page: https://commons.wikimedia.org/wiki/File:Socrate_du_Louvre.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ソクラテス

  - id: plato-academy
    year: -387
    circa: true
    title: プラトンのアカデメイア
    category: religion
    tags: [ギリシア, 哲学]
    summary: 900年続いた学園。理念と現実を分けて考える伝統がここから広がった。
    detail: |
      プラトンがアテネ郊外に開いた学園で、紀元前387年ごろに始まった。
      閉鎖されるまで900年以上続いたとされる。
      理念と現実を分けて考える伝統が、ここから広がった。

      プラトンは、師のソクラテスが処刑されたことに強い衝撃を受けた。
      政治から距離を置き、正しい統治とは何かを根本から考える道を選ぶ。
      各地を旅した後、英雄アカデモスの聖域に近い場所に土地を得て学園を開いた。
      教えられたのは、哲学だけではない。
      数学、幾何学、天文学が重視され、入口には幾何学を知らぬ者は入るなと掲げられていたと伝えられる。
      抽象的な思考の訓練が、真理を捉えるために必要だと考えられていた。

      プラトンの中心的な考えは、イデア論である。
      目に見える個々の事物は不完全な写しにすぎず、その背後に完全な原型があるとした。
      国家論では、哲学を修めた者が統治すべきだと説く。
      学園には各地から人が集まった。
      17歳で入門したアリストテレスは20年在籍し、後に独自の学園を開いている。

      学園は529年、キリスト教を奉じるローマ皇帝によって閉鎖された。
      学者の一部はペルシアへ逃れたと伝えられる。
      アカデミーという語は、この学園の名に由来して学術機関を指すようになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/61/AtheneOudheid.JPG/500px-AtheneOudheid.JPG
      credit: Napoleon Vier / Public domain
      page: https://commons.wikimedia.org/wiki/File:AtheneOudheid.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アカデメイア

  - id: chaeronea
    year: -338
    title: カイロネイアの戦い
    category: war
    tags: [ギリシア, マケドニア]
    summary: マケドニアがギリシアを制し、ポリスの自立の時代が終わった。
    detail: |
      マケドニア王フィリッポス2世が、アテネとテーバイの連合軍を破った戦い。
      紀元前338年、中部ギリシアのカイロネイアで行われた。
      ポリスが自立していた時代は、この敗北で終わる。

      マケドニアはギリシア北方の王国で、長く辺境とみなされていた。
      フィリッポス2世は長槍を持つ密集隊形と騎兵を組み合わせた軍を作り上げ、周辺を次々に従える。
      金鉱の収入で常備軍を維持し、外交でギリシアの諸都市を分断した。

      アテネでは、デモステネスがこの脅威を訴えて同盟を組織する。
      アテネとテーバイが手を結び、決戦に臨んだ。
      戦いでは、18歳の王子アレクサンドロスが騎兵を率いてテーバイの精鋭部隊を撃破したと伝えられる。
      連合軍は崩れ、ギリシアの自立した軍事力は失われた。

      戦後、フィリッポスはコリントスに諸都市を集めて同盟を結成した。
      各都市の自治は残されたが、外交と軍事はマケドニアが握る。
      ペルシアへの遠征が共通の目標として掲げられた。
      スパルタだけは参加を拒んだが、もはや大勢に影響しない。
      2年後にフィリッポスは暗殺され、アレクサンドロスが遠征を引き継ぐ。
      都市国家が自らの力で運命を決める時代が終わり、大国の下で生きる時代が始まった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/Battle_of_Chaeronea%2C_338_BC.png/500px-Battle_of_Chaeronea%2C_338_BC.png
      credit: United States Military Academy / Public domain
      page: https://commons.wikimedia.org/wiki/File:Battle_of_Chaeronea,_338_BC.png
    links:
