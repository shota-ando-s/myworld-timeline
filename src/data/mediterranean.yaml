    tags: [ローマ]
    summary: ロムルスによる建国譚。ローマ人が自らの起源として語り継いだ年。

  - id: first-olympiad
    year: -776
    title: 第1回オリンピア競技祭
    category: culture
    tags: [ギリシア]
    summary: 古代ギリシア人が共通の暦の起点とした祭典。

  - id: solon-reform
