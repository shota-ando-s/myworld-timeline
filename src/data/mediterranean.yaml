  - id: venice-republic
    title: ヴェネツィア共和国
    start: 697
    end: 1797
    category: economy
    tags: [イタリア, 交易]
    summary: 東地中海の交易を握った海洋国家。1100年続いた商人の共和政。
    detail: |
      アドリア海の潟に築かれた都市国家で、697年から1797年まで1100年続いた。
      東地中海の交易を握り、商人が統治する共和政を維持した。
      最も長く続いた共和国の一つである。

      起源は、ゲルマン諸族の侵入を逃れた人々が潟の島々に住み着いたことにある。
      農地がないため、最初から塩と魚と交易で生きる都市だった。
      東ローマ帝国の宗主権のもとで自治を強め、やがて事実上独立する。
      統治は、終身の元首と複数の評議会が担った。
      元首の権限は厳しく制限され、有力商人の家系から選ばれた評議員が実権を握る。
      個人の独裁を防ぐ仕組みが何重にも作られており、同時期のイタリア諸都市と対照的だった。

      国家の中心は造船所である。
      国営の造船所では、規格化された部品を用いて船を大量に建造した。
      流れ作業に近い方式で、一日に一隻を仕上げたと伝えられる。
      第4回十字軍を主導し、1204年にコンスタンティノープルを占領して東地中海の拠点を得た。
      香辛料と絹の取引で巨富を蓄え、複式簿記や海上保険といった商業の技術も発達する。

      15世紀以降、オスマン帝国の進出と大西洋航路の開拓で地位は低下した。
      1797年、ナポレオンの侵攻によって共和国は終わる。
      商業と制度の設計で近代を先取りした国家だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Variant_flag_of_the_Serene_Republic_of_Venice.svg/500px-Variant_flag_of_the_Serene_Republic_of_Venice.svg.png
      credit: Samhanin / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Variant_flag_of_the_Serene_Republic_of_Venice.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴェネツィア共和国

  - id: italian-renaissance
    title: イタリア・ルネサンス
    start: 1300
    startCirca: true
    end: 1550
    category: culture
    tags: [イタリア, 文化]
    summary: フィレンツェなど商業都市の富を背景に、古典の復興と人間中心の文化が花開いた。
    detail: |
      14世紀から16世紀にかけてイタリアで展開した文化運動。
      古代ギリシア・ローマの文化を手本として学び直し、人間と自然への関心を深めた。
      フィレンツェをはじめとする商業都市の富がこれを支えた。

      背景には、都市の繁栄がある。
      毛織物と銀行業で巨富を得た市民が、教会や宮廷に代わって芸術の注文主になった。
      都市どうしが競って建築や彫刻を発注し、自らを飾る。
      学問では、古典の写本を探し出して原典を読む運動が起きた。
      ギリシア語の学習が広がり、ビザンツから逃れた学者がそれを助ける。
      人間の能力と尊厳を重んじる考え方が育ち、人文主義と呼ばれた。

      美術では、遠近法と解剖の知識が導入された。
      ブルネレスキが線遠近法を確立し、マサッチョが絵画に応用する。
      レオナルド、ミケランジェロ、ラファエロが相次いで活動したのは15世紀末から16世紀初めである。
      政治と思想の面でも変化があった。
      マキャヴェリは政治を道徳から切り離して観察し、近代の政治学の出発点を作る。
      印刷術の普及が、こうした知識の広がりを加速させた。

      16世紀には、イタリア戦争によって都市国家が力を失った。
      文化の中心はアルプスの北へ移り、各地で独自の展開を見せる。
      古典を手本としながら、結果として新しい世界観が生まれた運動だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/%22The_School_of_Athens%22_by_Raffaello_Sanzio_da_Urbino.jpg/500px-%22The_School_of_Athens%22_by_Raffaello_Sanzio_da_Urbino.jpg
      credit: ラファエロ・サンティ / Public domain
      page: https://commons.wikimedia.org/wiki/File:%22The_School_of_Athens%22_by_Raffaello_Sanzio_da_Urbino.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ルネサンス

  - id: italian-wars
    title: イタリア戦争
    start: 1494
    end: 1559
    category: war
    tags: [イタリア, フランス, スペイン]
    summary: 半島が大国の戦場になり、ルネサンスの担い手だった都市国家が力を失った。
    detail: |
      フランスとハプスブルク家がイタリアを戦場として争った戦争で、1494年から1559年まで続いた。
      半島の都市国家は大国の抗争に巻き込まれ、自立を失っていく。

      発端は、フランス王シャルル8世のナポリ王位の主張である。
      大軍を率いてイタリアに侵入し、ほとんど抵抗を受けずに南下した。
      イタリアの都市国家が傭兵に依存し、自前の軍を持たなかったことが露呈する。
      以後、フランスとスペイン、神聖ローマ帝国が半島各地で戦った。
      都市国家は一方に味方しては裏切られ、戦場として荒廃していく。
      1527年にはローマが皇帝軍に占領され、激しい略奪を受けた。
      この出来事は、ルネサンスの終わりを象徴する事件とされる。

      戦術も大きく変わった。
      大砲と鉄砲が主力となり、騎士の突撃は通用しなくなる。
      城は分厚く低い稜堡を備えた形に改められた。
      1559年の条約で、スペインがミラノとナポリを支配することが確定した。
      イタリアは以後300年にわたり、外国の支配下に置かれる。

      この経験から、マキャヴェリは自前の軍と強い君主の必要を説いた。
      諸国が常設の外交使節を置くようになったのも、この時期である。
      近代の国際政治の実務は、この長い戦争のなかで形を得た。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Italian_War_Battle.jpg/500px-Italian_War_Battle.jpg
      credit: Waylon1104 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Italian_War_Battle.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イタリア戦争

events:
  - id: bronze-age-collapse
    year: -1177
    circa: true
    title: 青銅器時代の崩壊
    category: disaster
    tags: [地中海, 海の民]
    summary: 東地中海の王国が数十年で次々に倒れ、交易網ごと失われた。
    detail: |
      東地中海の諸王国が、数十年のうちに相次いで崩壊した出来事。
      紀元前1200年前後に起き、象徴的な年として1177年が挙げられることがある。
      交易網ごと失われた、古代でも例のない規模の崩壊である。

      それまでの東地中海には、緊密な国際関係があった。
      エジプト、ヒッタイト、ミケーネ、キプロス、シリアの諸都市が、書簡を交わし、贈り物を送り合い、交易で結ばれていた。
      青銅器の材料である錫は遠方から運ばれ、一つの供給網に依存している。
      紀元前13世紀末から、この体制が崩れ始めた。
      ヒッタイトの都は焼かれ、ミケーネの宮殿は破壊され、シリアの港湾都市ウガリットは消滅する。
      エジプトは持ちこたえたが、以後の勢力は大きく後退した。

      原因は一つに特定できない。
      エジプトの記録が海の民と呼ぶ集団の襲来、長期の干ばつ、地震の連続、内部の反乱、交易網の断絶などが挙げられる。
      近年は、複数の要因が連鎖して体制全体が耐えられなくなったという見方が有力である。

      崩壊の後、識字と大規模な建築は数世紀にわたって失われた。
      一方で、青銅の供給が絶たれたことが鉄器の普及を促した面もある。
      入り組んだ相互依存の網が、部分的な打撃から全体の崩壊に至る例として、現代でもしばしば引き合いに出される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/Bronze-age-collapse.svg/500px-Bronze-age-collapse.svg.png
      credit: Lommes / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Bronze-age-collapse.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/前1200年のカタストロフ

  - id: homer-epics
    year: -750
    circa: true
    title: ホメロスの叙事詩
    category: culture
    tags: [ギリシア, 文学]
    summary: 『イリアス』『オデュッセイア』がギリシア人共通の教養と英雄像を与えた。
    detail: |
      『イリアス』と『オデュッセイア』が成立したとされる時期。
      紀元前8世紀後半に、口承で伝えられた物語が文字に記されたと考えられている。
      ギリシア人共通の教養と英雄像を与えた作品である。

      『イリアス』はトロイア戦争の一場面を描く。
      英雄アキレウスの怒りから始まり、戦いの末に敵の王が息子の遺体を引き取りに来る場面で終わる。
      栄誉と死、人間の限界が主題になっている。
      『オデュッセイア』は、戦後に帰路をさまよう英雄の10年を語る。
      怪物や魔女との遭遇、帰郷してからの復讐が描かれ、冒険譚の原型になった。

      作者とされるホメロスの実在は明らかでない。
      複数の吟遊詩人が数世紀にわたって形を整えたという見方が有力である。
      決まった言い回しを繰り返す文体は、口承で長大な物語を伝えるための技法だった。
      この二つの作品は、ギリシア人の教育の中心に置かれた。
      子どもは暗誦して学び、演説や議論でも引用される。
      神々の性格や英雄の振る舞いは、共通の価値観の基準になった。

      トロイアは長く伝説上の都市と考えられていた。
      19世紀に現在のトルコ西部で遺跡が発掘され、複数の層が確認される。
      物語が青銅器時代の記憶を含むことが裏づけられた。
      西洋文学の出発点として、今日まで読み継がれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bc/Homeros_Glyptothek_Munich_273.jpg/500px-Homeros_Glyptothek_Munich_273.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Homeros_Glyptothek_Munich_273.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ホメーロス

  - id: rome-founded
    year: -753
    circa: true
    title: ローマ建国の伝説
    category: politics
    tags: [ローマ]
    summary: ロムルスによる建国譚。ローマ人が自らの起源として語り継いだ年。
    detail: |
      ローマ人が自らの起源として語り継いだ建国の年で、紀元前753年とされる。
      双子の兄弟ロムルスとレムスの伝説に結びつけられている。
      ローマ人はこの年を起点として年を数えた。

      伝説では、軍神マルスの子である双子が川に捨てられ、狼に育てられたとされる。
      成人した二人は町を建てる場所と名をめぐって争い、ロムルスが兄弟を殺して王になった。
      人口を増やすため、近隣のサビニ人の女性を略奪したという話も伝わる。
      この物語は、後のローマ人が自らの性格を説明するために語ったものである。
      兵士の血を引き、荒々しい出発から世界を支配するに至ったという自己像が込められている。

      考古学の調査では、その時期にパラティーノの丘に小さな集落があったことが確認されている。
      ただし一つの都市として形が整うのは、それより後だと考えられる。
      ティベリス川の渡河点にあたり、塩の道が通る位置が、発展の条件になった。

      建国から紀元前509年までは、七人の王が治めた王政期とされる。
      後半の王はエトルリア系で、神殿や下水道の建設が進められた。
      最後の王が追放され、共和政が始まったと伝えられる。
      伝説と史実の境目は曖昧だが、この物語がローマ人の自己認識を形づくったことは確かである。
      建国の年から数える紀年法は、西洋で長く用いられた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ローマ建国紀元

  - id: first-olympiad
    year: -776
    title: 第1回オリンピア競技祭
    category: culture
    tags: [ギリシア]
    summary: 古代ギリシア人が共通の暦の起点とした祭典。
    detail: |
      ギリシアのオリンピアで行われた競技祭の、記録上最初の開催。
      紀元前776年とされ、以後4年ごとに1000年以上続いた。
      ギリシア人が共通の暦の起点として用いた年でもある。

      祭典は主神ゼウスに捧げられるもので、聖域に各地から人が集まった。
      最初は短距離の競走だけだったが、やがて長距離走、レスリング、ボクシング、戦車競走、五種競技が加わる。
      参加できるのはギリシア人の自由市民の男性に限られた。
      開催の期間中は、参加者が安全に往復できるよう休戦が定められた。
      争いの絶えないポリスの世界で、この取り決めはおおむね守られている。
      勝者には賞金ではなくオリーブの冠が与えられ、故郷では英雄として迎えられた。

      祭典は、ギリシア人が同じ言語と神々を持つ一つの集団だという意識を支えた。
      参加資格が言語による線引きだったことも、その意識を強めている。
      4年ごとの周期はオリンピアードと呼ばれ、年代を数える基準として用いられた。
      歴史家はこの起点からの経過年数で出来事を記している。

      祭典はローマ時代まで続いたが、392年にキリスト教を国教としたローマ皇帝が異教の祭りを禁じて終わった。
      1896年、近代オリンピックとして復活する。
      古代の理念が19世紀の国際主義と結びつき、現在の大会に受け継がれている。
