        url: https://ja.wikipedia.org/wiki/コンスタンティノープルの陥落

  - id: last-supper
    year: 1498
    title: ダ・ヴィンチ「最後の晩餐」
    category: culture
    tags: [ルネサンス, 絵画]
    summary: 遠近法と人物の心理描写を結びつけ、絵画の可能性を広げた。
    detail: |
      レオナルド・ダ・ヴィンチがミラノの修道院の食堂に描いた壁画で、1498年ごろに完成した。
      イエスが弟子の一人の裏切りを告げた瞬間を描いている。
      遠近法と人物の心理描写を結びつけた作品である。

      主題自体は、修道院の食堂の壁に描かれる定番だった。
      それまでの作品は、弟子たちが静かに並ぶ構図が多い。
      レオナルドは、あなたがたのうち一人が私を裏切るとイエスが告げた直後を選んだ。
      弟子たちは驚き、否定し、隣の者に問いかけ、それぞれ異なる反応を見せる。
      人物を三人ずつ四つの群に分け、動きと感情の連なりとして配置した。

      遠近法の消失点は、イエスの顔に置かれている。
      食堂の実際の空間と絵のなかの部屋がつながって見えるよう設計された。
      技法には問題があった。
      レオナルドは細部を練り直せるよう、乾いた壁に油彩と卵テンペラで描く方法を試している。
      このため完成後まもなく絵具が剥落し始めた。
      幾度も修復が重ねられ、当初の色はほとんど残っていない。

      それでも構図と人物の表現は後世の画家に大きな影響を与えた。
      第二次世界大戦の空襲で建物の大半が崩れたが、この壁だけが残っている。
      絵画が瞬間の心理を描けることを示した作品として、美術史の転換点に置かれる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Leonardo_da_Vinci_%281452-1519%29_-_The_Last_Supper_%281495-1498%29.jpg/500px-Leonardo_da_Vinci_%281452-1519%29_-_The_Last_Supper_%281495-1498%29.jpg
      credit: レオナルド・ダ・ヴィンチ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Leonardo_da_Vinci_(1452-1519)_-_The_Last_Supper_(1495-1498).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/最後の晩餐_(レオナルド・ダ・ヴィンチ)

  - id: sistine-chapel
    year: 1512
    title: ミケランジェロのシスティーナ礼拝堂天井画
    category: culture
    tags: [ルネサンス, 絵画]
    summary: 4年をかけた一人仕事。人体の表現がここで一つの頂点に達した。
    detail: |
      ミケランジェロがヴァチカンの礼拝堂の天井に描いた壁画で、1512年に完成した。
      4年をかけ、ほぼ一人で仕上げている。
      人体の表現が一つの頂点に達した作品とされる。

      依頼したのは教皇ユリウス2世である。
      ミケランジェロは自らを彫刻家と考えており、この仕事を望まなかった。
      最初の計画は12使徒を描くものだったが、自ら提案して旧約聖書の物語に変更している。
      天井は約500平方メートルある。
      足場の上で見上げる姿勢を続け、絵具が顔に落ちる過酷な作業だった。
      その苦労を詩に書き残している。

      中央には創世記の九つの場面が並ぶ。
      天地の創造からノアの物語までが順に描かれ、最もよく知られるのは神がアダムに手を伸ばす場面である。
      周囲には預言者と巫女、キリストの先祖たちが配置された。
      人物はいずれも筋肉の量感が強調され、彫刻のような立体感を持つ。
      短縮法を用いて、下から見上げたときに自然に見えるよう計算されている。

      20年以上のちには、同じ礼拝堂の祭壇壁に最後の審判を描いた。
      1980年代からの修復で煤が除かれ、鮮やかな色彩が現れて評価が改まった。
      ルネサンスの人体表現の到達点として、今も多くの人が訪れている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/d/d8/Hands_of_God_and_Adam.jpg
      credit: ミケランジェロ・ブオナローティ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Hands_of_God_and_Adam.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/システィーナ礼拝堂天井画

  - id: the-prince
    year: 1513
    title: マキャヴェリ『君主論』
    category: religion
    tags: [イタリア, 政治思想]
    summary: 政治を道徳から切り離して観察し、近代の政治学の出発点になった。
    detail: |
      マキャヴェリが1513年に書いた政治論で、刊行は死後の1532年である。
      君主が権力を得て保つための方法を、道徳から切り離して論じた。
      近代の政治学の出発点とされる。

      著者はフィレンツェ共和国の書記官として外交と軍事に携わった。
      メディチ家の復帰によって職を失い、拷問と追放を経て郊外に隠棲する。
      この書は、復職を願って新しい支配者に献じられたものだった。
      中心にあるのは、現実をそのまま見るという姿勢である。
      人はこうあるべきだという議論ではなく、実際にどう振る舞うかから出発する。
      人間は恩知らずで移り気であり、それを前提に統治を設計すべきだと説く。

      有名な主張が並ぶ。
      愛されるより恐れられるほうが安全である。
      必要であれば約束を破ってよい。
      君主は獅子の力と狐の狡知の両方を備えねばならない。

      傭兵への批判も繰り返される。
      自国の市民による軍を持たない国家は、他人の力に運命を委ねることになる。
      イタリアが外国に蹂躙された経験が、この主張の背景にある。
      出版後、教会は禁書とした。
      マキャヴェリズムという語は、目的のために手段を選ばない態度を指すようになる。
      一方で、政治を独自の領域として分析した点は、その後の思想に決定的な影響を与えた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Nicolo_Machiavelli%2C_Il_Principe%2C_1550%2C_title_page.jpg/500px-Nicolo_Machiavelli%2C_Il_Principe%2C_1550%2C_title_page.jpg
      credit: ニッコロ・マキャヴェッリ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Nicolo_Machiavelli,_Il_Principe,_1550,_title_page.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/君主論

  - id: lepanto
    year: 1571
    title: レパントの海戦
    category: war
    tags: [オスマン, スペイン]
    summary: 地中海でのオスマンの拡大を止めたが、勢力は東地中海に残り続けた。
    detail: |
      キリスト教国の連合艦隊がオスマン帝国の艦隊を破った海戦で、1571年10月に行われた。
      ギリシア西岸のコリント湾の入口が戦場になった。
      地中海でのオスマンの拡大を止めた戦いとされる。

      きっかけは、オスマンがヴェネツィア領のキプロスを攻撃したことである。
      教皇の呼びかけで、スペイン、ヴェネツィア、教皇領などが神聖同盟を結んだ。
      指揮をとったのは、スペイン王の異母弟ドン・フアンである。
      双方ともガレー船を主力とし、合わせて400隻以上、兵員は十数万が参加した。
      櫂で進む船による、史上最大級の海戦である。
      連合側は、大砲を多く積んだ大型船を前面に配置した。

      戦闘は数時間で決した。
      オスマン艦隊はほぼ壊滅し、多数の船が沈むか捕獲される。
      漕ぎ手として使われていたキリスト教徒の奴隷が多数解放された。
      従軍していたセルバンテスは、この戦いで左手の自由を失っている。
      ヨーロッパでは大きな勝利として祝われた。
      無敵とされてきたオスマン海軍が敗れたことの心理的な効果は大きい。

      ただし戦略的な影響は限られた。
      オスマンは翌年までに艦隊を再建し、キプロスもそのまま失われる。
      地中海の勢力図が大きく変わるのは、もっと後のことである。
      それでも、拡大が止まる兆しを示した出来事だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e0/Battle_of_Lepanto_1571.jpg/500px-Battle_of_Lepanto_1571.jpg
      credit: Unidentified painter / Public domain
      page: https://commons.wikimedia.org/wiki/File:Battle_of_Lepanto_1571.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/レパントの海戦

  - id: march-on-rome
    year: 1922
    title: ムッソリーニのローマ進軍
    category: politics
    tags: [イタリア, ファシズム]
    summary: 世界初のファシスト政権が成立し、ヨーロッパの他国にも手本を与えた。
    detail: |
      ファシスト党の民兵がローマへ向けて行進し、ムッソリーニが政権を得た出来事。
      1922年10月のことである。
      世界で最初のファシスト政権が成立した。

      背景には、戦後のイタリアの混乱がある。
      戦勝国でありながら期待した領土を得られず、不満が広がっていた。
      工場占拠や農地の争議が続き、中産階級と地主は社会主義革命を恐れる。
      議会は多党に分かれ、安定した政権を作れなかった。
      ファシスト党は、黒シャツ隊による暴力で社会主義勢力を攻撃した。
      地方では実力で行政を握る例も出ている。

      10月、数万の民兵が各地からローマをめざして行進を始めた。
      政府は戒厳令を準備したが、国王は署名を拒む。
      内戦を避けるため、あるいは軍の支持に確信が持てなかったためとされる。
      ムッソリーニは首相に任命され、列車でローマ入りした。

      行進そのものは軍事的な脅しであり、クーデタと呼ぶには武力の行使が乏しい。
      合法的な任命という形をとったことが、その後の統治を容易にした。
      この成功は、各国の権威主義的な運動に手本を与えた。
      議会制が機能不全に陥ったとき、秩序を約束する運動が合法の手続きを通じて権力を得るという経路である。
      10年後のドイツでも、似た筋道が繰り返された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/March_on_Rome_1922_-_Alle_porte_di_Roma.png/500px-March_on_Rome_1922_-_Alle_porte_di_Roma.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:March_on_Rome_1922_-_Alle_porte_di_Roma.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ローマ進軍

  - id: lateran-treaty
    year: 1929
    title: ラテラノ条約
    category: religion
    tags: [イタリア, バチカン]
    summary: 教皇領の消滅から59年、バチカン市国として教皇の主権が復活した。
    detail: |
      イタリア政府と教皇庁が結んだ条約で、1929年のこと。
      教皇領の消滅から59年を経て、バチカン市国として教皇の主権が回復した。

      1870年にローマが併合されて以来、教皇はヴァチカンに閉じこもっていた。
      歴代の教皇はイタリア国家を承認せず、カトリック教徒に選挙への参加を控えるよう求める。
      この対立は、イタリアの政治にとって長い懸案だった。
      ムッソリーニは、国内の支持を広げるために解決を図った。
      教会側も、世俗化が進むなかで国家との関係を整理する必要を感じていた。

      条約は三つの部分からなる。
      第一に、バチカンの区域を独立国家として承認すること。
      第二に、失われた領土の補償として現金と国債を支払うこと。
      第三に、カトリックをイタリアの国教と定め、学校での宗教教育や教会の婚姻を認める協約である。
      これによってバチカン市国が成立した。
      面積0.44平方キロの、世界で最も小さな独立国である。

      教皇庁はこの条約でファシスト政権を承認した形になった。
      ムッソリーニは国際的な威信を得る。
      宗教教育や青年団体をめぐっては、その後も摩擦が続いた。
      1984年の改定で国教の規定は廃止されたが、バチカンの主権はそのまま維持されている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/3/30/Firma_dei_Patti_Lateranensi.jpg
      credit: オリジナルのアップロード者はイタリア語版ウィキペディアのArcheologoさん / Public domain
      page: https://commons.wikimedia.org/wiki/File:Firma_dei_Patti_Lateranensi.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ラテラノ条約
