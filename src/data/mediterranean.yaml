      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マラトンの戦い

  - id: salamis
    year: -480
    title: サラミスの海戦
    category: war
    tags: [ギリシア, ペルシア戦争]
    summary: 三段櫂船の漕ぎ手となった無産市民が発言力を得て、民主政が深まった。
