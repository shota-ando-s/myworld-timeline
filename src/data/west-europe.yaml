        url: https://ja.wikipedia.org/wiki/活版印刷

  - id: reconquista-end
    year: 1492
    title: レコンキスタの完成
    category: war
    tags: [スペイン, イスラム]
    summary: グラナダ陥落でイベリア半島のイスラム政権が終わり、同じ年に大西洋へ乗り出した。
    detail: |
      イベリア半島に残った最後のイスラム政権グラナダが陥落した出来事で、1492年1月のこと。
      8世紀に始まるキリスト教勢力による再征服が、ここで完了した。
      同じ年に、スペインは大西洋へ乗り出す。

      711年、イスラム勢力が半島の大半を征服した。
      北部に残ったキリスト教の小国が少しずつ南下し、数世紀をかけて領域を広げる。
      13世紀にはイスラム側の領域はグラナダ周辺だけになり、貢納を納めることで存続していた。
      カスティーリャとアラゴンの統合により、最後の攻勢が可能になる。
      10年にわたる戦いの末、グラナダは開城した。
      住民の信仰と財産を保障する条件だったが、数年で反故にされ、改宗か退去かを迫られる。

      同じ年の3月、ユダヤ教徒にも同じ選択が突きつけられた。
      十数万が国を去り、オスマン帝国や北アフリカへ移る。
      8月、コロンブスの船団がパロスを出港した。
      征服が終わったことで、軍事の担い手と資金が外へ向かう余地が生まれる。

      数世紀にわたる戦いの経験は、海外での征服の手法にも引き継がれた。
      土地を分け与える方式や、改宗を通じた統治がその例である。
      多宗教が共存していた半島が、単一の信仰の国家に変わった年でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/47/SantiagoMatamoros.jpg/500px-SantiagoMatamoros.jpg
      credit: Photograph by Error / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:SantiagoMatamoros.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/レコンキスタ

  - id: ninety-five-theses
    year: 1517
    title: ルターの九十五か条の論題
    category: religion
    tags: [宗教改革]
    summary: 免罪符批判から宗教改革が始まり、西欧キリスト教世界が二つに割れた。
    detail: |
      マルティン・ルターが贖宥状を批判した文書で、1517年10月31日に発表されたとされる。
      ヴィッテンベルクの教会の扉に貼り出したという逸話が知られる。
      ここから宗教改革が始まった。

      贖宥状は、罪の償いを軽減するとされる証書である。
      サン・ピエトロ大聖堂の建設費を集めるため、ドイツで大規模に販売されていた。
      献金すれば煉獄の魂が救われるといった説明も行われている。
      ルターは大学の神学教授だった。
      論題はラテン語で書かれた学問的な討論の提起であり、教会そのものを否定する内容ではない。
      悔い改めがなければ免償に意味はないこと、教皇に煉獄の魂を解放する権限があるのかという疑問が並ぶ。

      予想外に大きな反響を呼んだ。
      印刷されてドイツ語に訳され、数週間のうちに各地へ広まる。
      教会への不満と、ローマへ金が流れることへの反発が背景にあった。
      論争が進むうちに、ルターの主張は先鋭化した。
      聖書のみを権威とし、信仰によってのみ義とされると説く。
      1521年に破門され、帝国議会でも撤回を拒んだ。

      匿名の保護のもと、新約聖書をドイツ語に訳した。
      この訳は近代ドイツ語の基礎にもなる。
      一つの学問的な論題が、西方教会の分裂の起点になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Luther95theses.jpg/500px-Luther95theses.jpg
      credit: フェルディナンド・パウウェルス / Public domain
      page: https://commons.wikimedia.org/wiki/File:Luther95theses.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/95か条の論題
    related: [reformation]

  - id: copernicus
    year: 1543
    title: コペルニクスの地動説
    category: science
    tags: [天文学]
    summary: 地球が宇宙の中心ではないという見方が、世界像の作り替えを始めた。
    detail: |
      ポーランドの聖職者コペルニクスが、地球が太陽の周りを回るという説を公にした出来事。
      主著が刊行されたのは1543年、彼の死の直前である。
      世界像の作り替えが、ここから始まった。

      当時の常識は、地球が宇宙の中心にあるという天動説だった。
      天体の複雑な動きを説明するため、周転円を重ねる精緻な体系が作られている。
      コペルニクスは、太陽を中心に置けば説明が簡潔になることに気づいた。
      惑星が時おり逆行して見える現象も、地球自身が動いていると考えれば自然に説明できる。

      それでも、彼の体系は完全ではなかった。
      軌道を円と仮定していたため、周転円は残る。
      観測の精度も従来と大差なかった。

      公表をためらった理由は、教会の反発だけではない。
      地球が動くなら、なぜ物は飛ばされないのかといった物理的な疑問に答えられなかったためでもある。
      序文には、これは計算の便宜であって実在を主張するものではないという断りが添えられた。
      出版を担当した神学者が加えたもので、本人の意図ではない。
      半世紀後、ケプラーが楕円軌道を、ガリレオが望遠鏡の観測を加えて体系は完成する。
      地球が宇宙の中心ではないという見方は、人間の位置づけそのものを問い直すことになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/Nikolaus_Kopernikus_MOT.jpg/500px-Nikolaus_Kopernikus_MOT.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Nikolaus_Kopernikus_MOT.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ニコラウス・コペルニクス

  - id: st-bartholomew
    year: 1572
    title: サン・バルテルミの虐殺
    category: religion
    tags: [フランス, 宗教戦争]
    summary: カトリックによるプロテスタント殺害事件。宗教対立の残酷さを象徴する。
    detail: |
      フランスでカトリック側がプロテスタントを大量に殺害した事件で、1572年8月に起きた。
      聖バルテルミの祝日の前夜にパリで始まった。
      宗教対立の残酷さを象徴する出来事として記憶されている。

      フランスでは、ユグノーと呼ばれるカルヴァン派と、カトリックとの内戦が続いていた。
      和解の象徴として、王の妹とユグノーの指導者アンリの結婚式がパリで行われる。
      各地からユグノーの貴族が都に集まっていた。
      式の数日後、ユグノーの実力者コリニーが狙撃されて負傷する。
      報復を恐れた宮廷は、先手を打って指導者たちを排除する決定を下した。
      母后カトリーヌの関与が指摘されるが、経緯には不明な点が多い。

      8月24日の未明、王の命令でユグノーの指導者が次々に殺された。
      殺戮は市民を巻き込んで拡大し、パリだけで数千人が犠牲になる。
      各地の都市にも広がり、全体で1万人を超えたとされる。
      王の妹と結婚したばかりのアンリは、改宗して命を保った。

      この事件で和解の望みは絶たれ、内戦はさらに激化する。
      後にアンリが国王アンリ4世となり、1598年のナントの勅令で信仰の自由を認めて戦争を終わらせた。
      宗教の相違が国家の統合とどう両立するかという問題を、最も凄惨な形で示した事件である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Francois_Dubois_001.jpg/500px-Francois_Dubois_001.jpg
      credit: フランソワ・デュボア / Public domain
      page: https://commons.wikimedia.org/wiki/File:Francois_Dubois_001.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/サン・バルテルミの虐殺

  - id: spanish-armada
    year: 1588
    title: アルマダの海戦
    category: war
    tags: [イギリス, スペイン]
    summary: スペイン無敵艦隊の敗北。制海権が南から北西ヨーロッパへ移り始めた。
    detail: |
      スペインの大艦隊がイングランドへ向かい、敗退した海戦で、1588年のこと。
      無敵艦隊と呼ばれたこの艦隊の失敗は、海の勢力図が変わる兆しになった。

      スペイン王フェリペ2世には複数の動機があった。
      イングランドがネーデルラントの反乱を支援していること。
      私掠船がスペインの船と植民地を襲っていること。
      カトリックのスコットランド女王メアリが処刑されたことである。

      計画は、艦隊がネーデルラントの陸軍を乗せて海峡を渡るというものだった。
      130隻の艦隊が出航し、イングランド艦隊と海峡で戦う。
      イングランド側は、小型で機動力に優る船と長射程の砲を用いた。
      接舷して乗り込むスペインの戦法に対し、距離を取って砲撃する戦い方である。
      カレー沖では火船を放って艦隊の隊形を崩した。

      陸軍との合流に失敗した艦隊は、北海を回って帰還を試みる。
      スコットランドとアイルランドの沿岸で暴風に遭い、多くの船を失った。
      帰り着いたのは半数ほどである。
      スペインの海軍力は数年で回復し、この敗北が即座に覇権を奪ったわけではない。
      それでも、イングランドとオランダが海洋に進出する道が開かれた。
      大西洋の時代の主役が、南欧から北西ヨーロッパへ移り始める。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Loutherbourg-Spanish_Armada.jpg/500px-Loutherbourg-Spanish_Armada.jpg
      credit: フィリップ・ジェイムズ・ド・ラウザーバーグ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Loutherbourg-Spanish_Armada.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アルマダの海戦

  - id: edict-of-nantes
    year: 1598
    title: ナントの勅令
    category: religion
    tags: [フランス, 寛容]
    summary: 信仰の自由を認めてフランスの宗教戦争を終わらせた（1685年に廃止）。
    detail: |
      フランス王アンリ4世が発した勅令で、1598年のこと。
      プロテスタントに信仰の自由と一定の権利を認め、36年に及ぶ宗教戦争を終わらせた。

      フランスでは1562年からユグノー戦争が続いていた。
      サン・バルテルミの虐殺をはじめ、各地で殺戮と破壊が繰り返される。
      王位を継いだアンリ4世は、もともとユグノーの指導者だった。
      カトリックが多数を占めるパリに入るため、自らカトリックに改宗する。
      パリは一度のミサに値するという言葉が伝えられている。

      勅令の内容は、信仰の自由を個人に認めるというものである。
      プロテスタントは指定された場所で礼拝でき、公職に就く権利と裁判での対等な扱いを保障された。
      さらに、安全の保障としていくつかの城塞都市の保持も認められる。
      これは近代的な信教の自由ではなく、国家の統一を優先した現実的な妥協だった。
      国王の権威のもとで、二つの宗派が並存する仕組みである。
      戦争が終わり、フランスは復興に向かった。

      しかし1685年、ルイ14世がこの勅令を廃止する。
      数十万のプロテスタントが国外へ逃れ、その多くは技術者や商人だった。
      受け入れたオランダやプロイセンが利益を得る一方、フランスは人材を失っている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ナントの勅令

  - id: galileo-trial
    year: 1633
    title: ガリレオの裁判
    category: science
    tags: [天文学, 教会]
    summary: 科学の主張と教会の権威が正面から衝突した事件として記憶されている。
    detail: |
      ガリレオ・ガリレイが異端審問にかけられ、地動説の放棄を強いられた事件で、1633年のこと。
      科学の主張と教会の権威が正面から衝突した出来事として記憶されている。

      ガリレオは望遠鏡による観測で、木星の衛星、月の凹凸、金星の満ち欠けを確認した。
      いずれも、地球が宇宙の中心ではないという見方を支持する。
      1616年、教会は地動説を聖書に反するとし、ガリレオに説を主張しないよう警告した。
      仮説として論じることは許されたとされる。

      1632年、彼は二つの世界体系についての対話を刊行した。
      三人の人物が天動説と地動説を論じる形式で、実質的に地動説を擁護している。
      天動説を述べる人物の名は愚か者を意味し、そこに教皇の主張が置かれていた。
      翌年、ローマに召喚されて審問を受ける。
      有罪となり、自説の放棄を公に誓わされ、残りの生涯を自宅軟禁で過ごした。
      それでも地球は動くと呟いたという逸話は、後世の創作とされる。

      軟禁中に、運動と力についての著作をまとめている。
      これは後のニュートンの力学につながった。
      1992年、ローマ教皇庁は裁判の誤りを公式に認めた。
      観測と権威のどちらを基準とするかという問題を、最も鮮明に示した事件である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c7/Justus_Sustermans_-_Portrait_of_Galileo_Galilei_%28Uffizi%29.jpg/500px-Justus_Sustermans_-_Portrait_of_Galileo_Galilei_%28Uffizi%29.jpg
      credit: ユストゥス・サステルマンス / Public domain
      page: https://commons.wikimedia.org/wiki/File:Justus_Sustermans_-_Portrait_of_Galileo_Galilei_(Uffizi).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ガリレオ・ガリレイ

  - id: peace-of-westphalia
    year: 1648
    title: ウェストファリア条約
    category: politics
    tags: [国際関係]
    summary: 三十年戦争を終わらせ、主権国家が並び立つ国際秩序の原型を作った。
    detail: |
      三十年戦争を終わらせた一連の条約で、1648年に結ばれた。
      ドイツ北西部の二つの都市で、数年にわたる交渉が行われた。
      主権国家が並び立つ国際秩序の原型が、ここで作られる。

      交渉には、皇帝、フランス、スウェーデン、ドイツの諸領邦、オランダなど多数が参加した。
      カトリック側とプロテスタント側が別の都市で交渉し、使者が往復する形をとっている。
      内容は多岐にわたる。
      ドイツの各領邦には、外交と同盟の権利を含むほぼ完全な主権が認められた。
      宗派の選択も領主に委ねられ、カルヴァン派が新たに公認される。
      オランダとスイスの独立が正式に承認された。
      フランスはアルザスの権利を得て、スウェーデンは北ドイツに拠点を得る。

      神聖ローマ帝国は、名目だけの枠組みになった。
      300以上の領邦がそれぞれの利害で動くようになる。
      重要なのは、交渉の前提が変わったことである。
      宗教的な正しさではなく、各国の利害と力の均衡によって秩序を作るという考え方が採られた。
      対等な主権国家が条約を結び合うという国際関係の枠組みが、ここから始まる。

      国際法の父と呼ばれるグロティウスの議論も、この時期に影響を与えた。
      現在の国際秩序の原理は、この条約を起点として語られることが多い。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/Westfaelischer_Friede_in_Muenster_%28Gerard_Terborch_1648%29.jpg/500px-Westfaelischer_Friede_in_Muenster_%28Gerard_Terborch_1648%29.jpg
      credit: ヘラルト・テル・ボルフ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Westfaelischer_Friede_in_Muenster_(Gerard_Terborch_1648).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴェストファーレン条約

  - id: versailles-palace
    year: 1682
    title: ルイ14世がヴェルサイユに移る
    category: politics
    tags: [フランス, 絶対王政]
    summary: 貴族を宮廷に集めて力を削ぐ絶対王政の完成形。各国の宮廷が手本にした。
    detail: |
      ルイ14世が宮廷をヴェルサイユへ移した出来事で、1682年のこと。
      パリ郊外の狩猟用の館を大規模に改築した宮殿である。
      絶対王政の完成形として、各国の宮廷が手本にした。

      建設は20年以上にわたった。
      数万人が動員され、湿地を埋め、水を引く大工事が行われる。
      鏡の間、広大な庭園、噴水が整えられた。
      目的は華美だけではない。
      王は主要な貴族を宮廷に住まわせ、領地から引き離した。
      数千人が宮殿とその周辺で暮らし、王の日常に立ち会う権利を競い合う。
      起床に立ち会う、燭台を持つといった役目が名誉とされた。

      儀礼に費やされる時間と費用は膨大で、貴族は経済的にも王に依存するようになる。
      反乱の拠点となりうる地方の勢力が、こうして無力化された。
      宮殿は権力の演出装置でもあった。
      太陽をかたどった意匠が各所に置かれ、王を宇宙の中心になぞらえる。
      外国の使節はこの空間で威圧された。

      ヨーロッパ各地の君主が、この形式を模倣した宮殿を建てている。
      一方、王が民衆から隔離される構造も生まれた。
      100年後、革命の群衆がこの宮殿へ押し寄せ、王家をパリへ連れ戻すことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5f/Louis_XIV_of_France.jpg/500px-Louis_XIV_of_France.jpg
      credit: イアサント・リゴー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Louis_XIV_of_France.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ルイ14世_(フランス王)

  - id: glorious-revolution
    year: 1688
    title: 名誉革命（イギリス）
    category: politics
    tags: [イギリス, 立憲]
    summary: 流血なく王を替え、議会が王権に優越する仕組みを確立した。
    detail: |
      イングランドで国王ジェームズ2世が退位し、新しい王が迎えられた政変で、1688年から翌年にかけて起きた。
      大きな流血を伴わなかったため、名誉革命と呼ばれる。
      議会が王権に優越する仕組みが、ここで確立した。

      ジェームズ2世はカトリックで、議会を無視して自らの信仰の支持者を要職に就けた。
      当初は、プロテスタントの娘が継ぐと考えられていたため容認されていた。
      しかし王に男子が生まれ、カトリックの王朝が続く見通しになる。
      議会の指導者たちは、王の娘メアリとその夫であるオランダ総督ウィレムに招請の書簡を送った。
      ウィレムは軍を率いて上陸し、ジェームズの側から兵と将が離反する。
      王はフランスへ逃亡した。

      議会は王位が空位になったとみなし、二人を共同の君主として即位させる。
      その条件として権利章典が定められた。
      内容は、議会の同意なく法を停止したり課税したりしないこと、議会での言論の自由、平時の常備軍の禁止などである。
      王は議会の定めた枠のなかでのみ統治することになった。

      これによって立憲君主制の原型が生まれる。
      一方、アイルランドとスコットランドでは戦闘が続き、無血という呼び名は当てはまらない。
      ロックの統治論は、この革命を正当化する議論として読まれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/William_of_Orange_III_and_his_Dutch_army_land_in_Brixham%2C_1688.jpg/500px-William_of_Orange_III_and_his_Dutch_army_land_in_Brixham%2C_1688.jpg
      credit: Johan Herman Isings / Public domain
