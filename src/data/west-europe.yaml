  - id: newton-principia
    year: 1687
    title: ニュートン『プリンキピア』
    category: science
    tags: [物理学]
    summary: 天も地も同じ法則で動くと示し、科学革命の到達点になった。
    detail: |
      アイザック・ニュートンが1687年に刊行した著作で、自然哲学の数学的諸原理という題を持つ。
      運動の法則と万有引力によって、天体と地上の現象を一つの体系で説明した。
      科学革命の到達点とされる。

      内容は三巻からなる。
      第一巻で運動の三法則を示し、第二巻で抵抗のある媒質中の運動を論じ、第三巻で太陽系の運動を扱う。
      核心は、天も地も同じ法則で動くという主張である。
      リンゴが落ちることと月が地球を回ることが、同じ引力によって説明される。
      それまで、天上界と地上界は別の原理に従うと考えられていた。

      ケプラーが観測から導いた惑星の運動の法則も、万有引力から数学的に導かれる。
      潮の満ち引き、彗星の軌道、地球の形までが同じ枠組みで扱われた。
      記述は幾何学を用いており、当時でも読み解くのは難しかった。
      執筆は天文学者ハレーの勧めと資金の提供によって実現している。

      この著作によって、自然は数式で書かれた法則に従うという見方が定着した。
      啓蒙思想は、この成功を社会にも適用しようとする。
      200年以上にわたり、物理学の基礎であり続けた。
      20世紀の相対性理論と量子論が扱う極端な条件を除けば、今も有効な記述である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/6/60/Newton-Principia-Mathematica_1-500x700.jpg
      credit: アイザック・ニュートン / Public domain
      page: https://commons.wikimedia.org/wiki/File:Newton-Principia-Mathematica_1-500x700.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/自然哲学の数学的諸原理

  - id: encyclopedie
    year: 1751
    title: 『百科全書』の刊行開始
    category: religion
    tags: [フランス, 啓蒙]
    summary: 知識を体系化して公開する試み。啓蒙思想を広く伝える器になった。
    detail: |
      ディドロとダランベールを中心に編纂された百科事典で、1751年に刊行が始まった。
      本文17巻と図版11巻からなり、完結まで20年以上を要した。
      啓蒙思想を広く伝える器になった。

      当初は英語の事典の翻訳として企画されたが、まったく新しい編纂へ発展した。
      執筆には、ヴォルテール、モンテスキュー、ルソーら150人以上が関わっている。
      特徴は、知識を人間の能力によって分類したことである。
      神学から演繹するのではなく、記憶・理性・想像力という人間の側の働きに沿って体系化した。

      もう一つの特徴は、技術への関心である。
      織物、製鉄、印刷、ガラス製造などの工程が、詳細な図版とともに解説された。
      職人の技術を言葉と図で記録する試みは、それまでほとんどなかった。

      政治と宗教への批判は、直接には書けない。
      無害な項目のなかに批判を潜ませ、相互参照によって読者を導く手法がとられた。
      刊行は二度にわたって禁じられ、関係者は投獄や亡命を経験している。
      それでも予約購読者は数千人に達し、各国語に訳されて広まった。
      知識は特権ではなく公共のものであり、理性によって世界は改善できる。
      その確信が、この事業の根底にある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2b/Encyclopedie_de_D%27Alembert_et_Diderot_-_Premiere_Page_-_ENC_1-NA5.jpg/500px-Encyclopedie_de_D%27Alembert_et_Diderot_-_Premiere_Page_-_ENC_1-NA5.jpg
      credit: Long List of Contributors to the Encyclopédie / Public domain
      page: https://commons.wikimedia.org/wiki/File:Encyclopedie_de_D%27Alembert_et_Diderot_-_Premiere_Page_-_ENC_1-NA5.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/百科全書

  - id: watt-steam-engine
    year: 1769
    title: ワットの蒸気機関
    category: science
    tags: [イギリス, 技術]
    summary: 燃料効率を大きく高め、工場と鉄道と船を動かす動力になった。
    detail: |
      ジェームズ・ワットが改良した蒸気機関の特許取得で、1769年のこと。
      燃料の効率を大きく高め、産業の動力を変えた。

      それ以前にも蒸気機関は存在した。
      炭鉱の排水に使われていたニューコメンの機関は、蒸気を送り込んだ同じ筒を冷やして真空を作る仕組みである。
      加熱と冷却を繰り返すため、燃料の大半が無駄になっていた。
      ワットは、蒸気を別の容器で冷却する分離凝縮器を考案した。
      筒を高温に保ったまま運転でき、燃料の消費は数分の一になる。

      さらに改良が重ねられた。
      往復の運動を回転に変える機構が加えられ、ポンプ以外の用途に使えるようになる。
      回転速度を自動で保つ調速機も取り付けられた。
      実業家ボールトンと組んだことが普及を決めた。
      機関は販売ではなく、節約できた燃料費の一部を支払う方式で提供される。
      紡績工場、製鉄所、炭鉱、製粉所に導入された。

      工場は水力に依存しなくなり、都市に集まるようになる。
      後に蒸気機関車と蒸気船を生み、輸送も変えた。
      仕事率の単位ワットは、この人物の名に由来する。
      動力を人力や自然の力に頼らないという段階が、ここから始まった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/蒸気機関

  - id: french-revolution
    year: 1789
    title: フランス革命
    category: society
    tags: [フランス, 革命]
    summary: 身分制社会を打ち倒し、人権と国民主権の理念を世界に広げた。
    detail: |
      1789年にフランスで始まった革命で、身分制の社会を倒した。
      人権と国民主権の理念を世界に広げることになる。

      財政の危機が発端である。
      戦費と宮廷の支出で国庫は破綻し、課税のために三部会が175年ぶりに招集された。
      議決の方法をめぐって対立し、第三身分が国民議会を名乗る。
      7月14日、パリの民衆がバスティーユ牢獄を襲撃した。
      地方では農民の蜂起が広がり、議会は封建的な特権の廃止を決議する。
      8月には人権宣言が採択され、人は生まれながらに自由で平等であると宣言された。

      革命は急進化していく。
      国王一家の逃亡未遂で信頼は失われ、1792年に王政が廃止された。
      翌年、ルイ16世は処刑される。
      対外戦争と内乱のなか、ロベスピエールらの恐怖政治が敷かれ、多数が処刑された。

      1794年に恐怖政治が終わり、1799年にナポレオンが政権を握る。
      理想は何度も裏切られた。
      それでも、人は生まれながらに権利を持つという前提と、主権は国民にあるという考え方は残った。
      身分制と領主の特権は戻らず、各国の革命と改革の手本になる。
      近代の政治の語彙の多くが、この10年のうちに生まれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Sans-culotte.jpg/500px-Sans-culotte.jpg
      credit: ルイ＝レオポルド・ボワイー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Sans-culotte.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フランス革命

  - id: napoleon-emperor
    year: 1804
    title: ナポレオンの皇帝即位とナポレオン法典
    category: society
    tags: [フランス, 法]
    summary: 法の下の平等と所有権を定めた法典は、ヨーロッパ各国の民法の手本になった。
    detail: |
      ナポレオンが皇帝に即位し、同じ年に民法典が公布された出来事で、1804年のこと。
      革命の理念を制度として定着させる形になった。

      即位は国民投票で承認された。
      戴冠式では教皇を招きながら、自ら冠を手に取って戴いたと伝えられる。
      権威の源が教会ではなく国民の意思にあることを示す所作と解釈されてきた。
      同じ年に公布された民法典は、全2000条を超える。
      審議には本人も出席し、条文の文言に関与した。

      内容の柱は三つある。
      身分によらず法の前で平等であること。
      私有財産の権利が保障されること。
      契約の自由が認められることである。
      封建的な特権と領主の権利は完全に否定された。

      一方で、家族については父と夫の権限が強く定められた。
      妻の法的な能力は制限され、この点は後に批判される。
      法典は占領地や影響下の国々へも持ち込まれた。
      ドイツ、イタリア、オランダ、スペイン、さらに中南米や日本の民法にも影響を与えている。
      ナポレオンは晩年、自分の栄光は40の戦勝ではなく民法典にあると語ったと伝えられる。
      軍事的な支配は崩れたが、この法典は現在まで効力を持ち続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Fran%C3%A7ois_G%C3%A9rard_-_Napoleon_I_001.JPG/500px-Fran%C3%A7ois_G%C3%A9rard_-_Napoleon_I_001.JPG
      credit: Workshop of フランソワ・ジェラール / Public domain
      page: https://commons.wikimedia.org/wiki/File:Fran%C3%A7ois_G%C3%A9rard_-_Napoleon_I_001.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ナポレオン・ボナパルト

  - id: waterloo
    year: 1815
    title: ワーテルローの戦いとウィーン体制
    category: politics
    tags: [ヨーロッパ, 国際関係]
    summary: ナポレオンが退場し、革命前への復帰をめざす保守的な国際秩序が敷かれた。
    detail: |
      ナポレオンが最終的に敗れた戦いと、それに続く国際秩序の成立で、1815年のこと。
      革命前への復帰をめざす保守的な体制が敷かれた。

      ナポレオンは流刑先のエルバ島を脱出し、パリに戻って皇帝に復位していた。
      各国はただちに同盟を結び、軍を差し向ける。
      6月18日、ベルギーのワーテルローでイギリス・オランダ連合軍と対峙した。
      前日の雨で地面がぬかるみ、砲兵の展開が遅れる。
      午後遅くまで防御を破れず、そこへプロイセン軍が到着して戦況が決した。
      ナポレオンは再び退位し、大西洋のセントヘレナ島へ送られる。

      並行して、ウィーンで各国の会議が開かれていた。
      メッテルニヒが主導し、正統主義と勢力均衡を原則とする戦後秩序が定められる。
      革命前の王朝が各地で復活し、ポーランドやイタリアの独立の願いは退けられた。
      この体制はウィーン体制と呼ばれる。
      大国が協議して秩序を保つ仕組みが作られ、自由主義や民族主義の運動は抑圧された。

      クリミア戦争まで、大国どうしの大規模な戦争は起きていない。
      一方で、抑え込まれた要求は1848年の革命として噴き出す。
      秩序の安定と、変化の要求をどう扱うかという問題が残された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Battle_of_Waterloo_1815.PNG/500px-Battle_of_Waterloo_1815.PNG
      credit: ウィリアム・サドラー (画家) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Battle_of_Waterloo_1815.PNG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ワーテルローの戦い

  - id: stephenson-railway
    year: 1825
    title: 世界初の営業鉄道
    category: science
    tags: [イギリス, 鉄道]
    summary: 人と物が動く速さと量が桁違いになり、産業革命が社会全体に及んだ。
    detail: |
      世界で最初の営業鉄道が開業した出来事で、1825年のこと。
      イングランド北東部のストックトンとダーリントンを結んだ。
      蒸気機関車が公共の路線で旅客と貨物を運んだ最初の例である。

      設計と機関車の製造を担ったのはジョージ・スティーヴンソンである。
      炭鉱で働きながら機関車を改良してきた技術者だった。
      路線は当初、炭鉱から港へ石炭を運ぶために計画された。
      馬が引く軌道として認可されたが、蒸気機関車の使用が加えられる。
      開業の日には、機関車が数百人を乗せた客車を引いて走った。

      1830年には、リヴァプールとマンチェスターを結ぶ路線が開業する。
      都市間を旅客と貨物の両方で結ぶ本格的な鉄道であり、ここから鉄道の建設が一気に広がった。
      影響は広い。
      人と物が動く速さと量が桁違いになり、遠方の市場が現実的なものになる。
      生鮮品や郵便が速く届き、地域ごとに異なっていた時刻が統一された。
      鉄とセメントと石炭の需要が生まれ、大量の資金を集める株式会社の仕組みも発達する。

      数十年のうちに、ヨーロッパ、アメリカ、インド、日本へ鉄道は広がった。
      産業革命が工場のなかだけでなく、社会全体に及ぶ段階が、ここから始まる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d0/StocktonDarlingtonOpening.jpg/500px-StocktonDarlingtonOpening.jpg
      credit: John Dobbin / Public domain
      page: https://commons.wikimedia.org/wiki/File:StocktonDarlingtonOpening.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ストックトン・アンド・ダーリントン鉄道

  - id: revolutions-1848
    year: 1848
    title: 1848年革命と『共産党宣言』
    category: society
    tags: [ヨーロッパ, 革命]
    summary: 各地で自由と統一を求める蜂起が連鎖し、労働者が政治の主体として現れた。
    detail: |
      ヨーロッパ各地で自由と統一を求める蜂起が連鎖した年で、諸国民の春とも呼ばれる。
      同じ年に『共産党宣言』が刊行された。
      労働者が政治の主体として現れる。

      発端はパリである。
      選挙権の拡大を求める集会が禁じられたことから暴動が起き、国王が亡命して共和政が成立した。
      報せは各地へ広がった。
      ウィーンではメッテルニヒが亡命し、ベルリンでも国王が譲歩を約束する。
      イタリアとハンガリーでは独立と統一を求める運動が起き、各地で憲法が発布された。
      背景には複数の要因がある。
      凶作と食糧価格の高騰、工業化による労働者の窮乏、そして自由主義と民族主義の広がりである。

      しかし運動は続かなかった。
      自由主義の中産層と労働者の要求は異なり、パリでは6月に両者が衝突する。
      民族ごとの要求も互いに対立した。
      軍を握る旧体制は、分裂した運動を各個に鎮圧していく。
      翌年までにほとんどの成果は取り消された。

      同じ2月、マルクスとエンゲルスが『共産党宣言』を発表した。
      歴史を階級闘争として捉え、万国の労働者の団結を呼びかける。
      当時の影響は小さかったが、以後の社会主義運動の基本文献になった。
      革命は失敗したが、農奴制の廃止など一部の改革は残る。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7a/Europe_1848_map_en.png/500px-Europe_1848_map_en.png
      credit: Alexander Altenhof / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Europe_1848_map_en.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/1848年革命

  - id: great-exhibition
    year: 1851
    title: ロンドン万国博覧会
    category: economy
    tags: [イギリス, 産業]
    summary: 工業化の成果を世界に見せる場。以後の万博と国際競争の型を作った。
    detail: |
      ロンドンで開かれた世界初の国際博覧会で、1851年のこと。
      各国の工業製品と原料が一堂に展示された。
      以後の万国博覧会と、国際的な産業競争の型を作る。

      主導したのはヴィクトリア女王の夫アルバートである。
      国内の産業展示を国際的な規模へ広げる構想だった。
      会場は、鉄とガラスで組み立てられた巨大な建物だった。
      水晶宮と呼ばれ、規格化された部材を短期間で組み上げる工法がとられている。
      建物自体が、工業生産の可能性を示す展示物でもあった。

      展示は10万点を超えた。
      蒸気機関、紡織機、印刷機、農機具といった機械に加え、各国の工芸品や植民地の産物も並ぶ。
      イギリスの工業力を世界に示す場になった。
      入場者は600万人に達した。
      鉄道の割引運賃が設定され、地方から団体で訪れる人も多い。
      労働者向けの安い入場日が設けられ、幅広い層が見学した。
      収益は博物館の設立に充てられ、現在の科学博物館などの母体になる。

      以後、パリ、ウィーン、フィラデルフィアと各国が博覧会を開いた。
      国家が自らの進歩を展示する場であり、同時に工業製品の見本市でもある。
      万博という形式は、20世紀を通じて国際的な威信を競う舞台であり続けた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ロンドン万国博覧会

  - id: darwin-origin
    year: 1859
    title: ダーウィン『種の起源』
    category: science
    tags: [生物学]
    summary: 種は変化するという説明が、人間の位置づけそのものを揺さぶった。
    detail: |
      チャールズ・ダーウィンが1859年に刊行した著作で、生物が共通の祖先から変化してきたことを論じた。
      自然選択という仕組みを提示している。
      人間の位置づけそのものを揺さぶった。

      ダーウィンは若いころ、測量船ビーグル号で5年の航海を行った。
      ガラパゴス諸島で、島ごとに異なる姿の生物を観察したことが着想につながる。
      帰国後20年以上、証拠を集めて構想を練った。
      公表をためらっていたが、同じ結論に達した若い研究者からの手紙を受けて刊行を決める。

      主張は二つに整理できる。
      一つは、すべての生物が共通の祖先から枝分かれしてきたということ。
      もう一つは、その変化を生む仕組みとしての自然選択である。
      生まれる個体には変異があり、環境に適したものがより多く子孫を残すことで、集団の性質が変わっていく。

      遺伝の仕組みはまだ分かっていなかった。
      20世紀にメンデルの法則と結びついて、理論は完成する。
      人間についてはこの本ではほとんど触れていないが、含意は明らかだった。
      人も他の生物と同じ過程の産物であるという見方は、宗教的な世界観と衝突する。
      社会に当てはめる議論も生まれ、優生学や植民地支配の正当化に悪用された。
      生物学の基礎理論として、現在も検証と発展が続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Origin_of_Species_title_page.jpg/500px-Origin_of_Species_title_page.jpg
      credit: John Murray, Publisher / Public domain
      page: https://commons.wikimedia.org/wiki/File:Origin_of_Species_title_page.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/種の起源

  - id: italian-unification
    year: 1861
    title: イタリア王国の成立
    category: politics
    tags: [イタリア, 国民国家]
    summary: 1000年以上分裂していた半島が一つの国になった。
    detail: |
      イタリア王国が成立した出来事で、1861年のこと。
      1000年以上分裂していた半島が、一つの国家になった。

      統一運動は19世紀を通じて続いていた。
      マッツィーニが共和国を掲げて蜂起を試み、いずれも失敗する。
      実現したのは、サルデーニャ王国を中心とする現実的な路線だった。

      首相カヴールは、外交で大国を動かした。
      クリミア戦争に参戦して発言力を得、ナポレオン3世と密約を結ぶ。
      1859年のオーストリアとの戦争でロンバルディアを獲得し、中部イタリアの諸国も住民投票を経て併合された。
      南ではガリバルディが千人隊を率いてシチリアに上陸し、ナポリまで制圧する。
      共和主義者でありながら、征服地をサルデーニャ王に引き渡した。

      1861年3月、ヴィットーリオ・エマヌエーレ2世がイタリア王として宣言される。
      この時点でヴェネツィアとローマはまだ含まれていない。
      ヴェネツィアは1866年、ローマは1870年に併合された。
      統一後の課題は大きい。
      北の制度が南にそのまま適用され、経済の格差と対立が残る。
      イタリアを作った、次はイタリア人を作らねばならない、という言葉が当時の状況を表している。
      教皇との断絶も、1929年まで続いた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/78/Flag_of_Italy_%281861%E2%80%931946%29.svg/500px-Flag_of_Italy_%281861%E2%80%931946%29.svg.png
      credit: F l a n k e r / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Italy_(1861%E2%80%931946).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イタリア王国

  - id: german-unification
    year: 1871
    title: ドイツ帝国の成立
    category: politics
    tags: [ドイツ, 国民国家]
    summary: ビスマルクの主導で統一され、ヨーロッパの勢力均衡が一変した。
    detail: |
      ドイツ帝国が成立した出来事で、1871年1月のこと。
      宣言の場は、普仏戦争で占領したヴェルサイユ宮殿の鏡の間だった。
      ヨーロッパの勢力均衡が、これによって一変する。

      統一の方法をめぐっては二つの構想があった。
      オーストリアを含む大ドイツと、プロイセンを中心としてオーストリアを除く小ドイツである。
      1848年の革命では実現せず、ビスマルクが後者を武力と外交で実現した。
      普墺戦争でオーストリアを排除し、北ドイツ連邦を作る。
      南ドイツの諸邦は、フランスとの戦争を通じて参加した。
      外敵を作ることで、内部の統合を進める手法である。

      帝国はプロイセン国王を皇帝に戴く連邦の形をとった。
      25の領邦が残り、プロイセンが圧倒的な比重を占める。
      帝国議会は普通選挙で選ばれたが、宰相は皇帝に対してのみ責任を負った。
      成立後、ドイツは急速に工業化した。
      鉄鋼と化学と電機で世界の先頭に立ち、20世紀初頭にはイギリスの工業生産を上回る。

      中央に強大な国家が生まれたことで、ヨーロッパの均衡は変わった。
      フランスは失った領土の回復を望み、周囲は台頭するドイツを警戒する。
      この緊張が、40年余り後の大戦の背景になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Flag_of_Germany_%281867%E2%80%931918%29.svg/500px-Flag_of_Germany_%281867%E2%80%931918%29.svg.png
      credit: "原作: Adolf Soetbeer, Otto von Bismarck ベクタ: B1mbo, Madden / Public domain"
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Germany_(1867%E2%80%931918).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ドイツ帝国

  - id: berlin-conference-eu
    year: 1884
    title: ベルリン会議でアフリカ分割を協議
    category: politics
    tags: [帝国主義]
    summary: 列強が現地の意思と無関係に境界を決め、20世紀の紛争の種をまいた。
    detail: |
      ヨーロッパ列強がアフリカの分割について協議した会議で、1884年から翌年にかけてベルリンで開かれた。
      ビスマルクが主催し、14か国が参加した。
      現地の意思と無関係に境界が決められていく。

      背景には、アフリカ内陸部への進出競争がある。
      探検によって地理が明らかになり、ゴム、象牙、鉱物の資源が注目された。
      ベルギー国王が私的にコンゴ盆地の支配を進めたことが、各国の警戒を呼ぶ。
      会議で決められた主要な原則は、実効支配である。
      沿岸を占領するだけでは領有は認められず、実際に統治していることを他国に通告する必要があるとされた。
      この規則が、内陸部への進出を加速させる。

      コンゴ川とニジェール川の自由航行、奴隷貿易の禁止も確認された。
      コンゴ自由国はベルギー国王の私領として承認される。
      この地では後に、ゴムの採取をめぐる過酷な収奪と大量の死者が問題になった。
      アフリカ人の代表は、一人も参加していない。

      会議の後、20年ほどでアフリカのほぼ全域が分割された。
      境界は緯線と経線や川で引かれ、民族や言語の分布は考慮されない。
      独立後の国境がその線をほぼ引き継いだため、20世紀の紛争の背景になっている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/5/5c/Afrikakonferenz.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Afrikakonferenz.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ベルリン会議_(アフリカ分割)
    related: [berlin-conference]

  - id: sarajevo
    year: 1914
    title: サラエボ事件
    category: war
    tags: [第一次世界大戦]
    summary: 一発の銃弾が同盟網を連鎖させ、1か月で大戦に発展した。
    detail: |
      オーストリアの皇位継承者夫妻が暗殺された事件で、1914年6月28日にサラエボで起きた。
      1か月後に第一次世界大戦が始まる。

      ボスニアは1908年にオーストリアに併合されていた。
      セルビア人の多い地域であり、セルビア王国との統合を求める運動があった。
      訪問中のフランツ・フェルディナント大公の車列に、まず爆弾が投げられて失敗する。
      その後、経路を変えた車が道を間違えて停止したところに、青年プリンツィプが居合わせた。
      至近距離から撃たれ、大公と妻は死亡する。

      オーストリアは、背後にセルビア政府の関与があるとみた。
      強硬な最後通牒を突きつけ、ほぼ全面的な受諾があったにもかかわらず宣戦する。
      ここから同盟の連鎖が動いた。
      ロシアがセルビアを支援して動員を始め、ドイツがロシアとフランスに宣戦する。
      ドイツ軍が中立国ベルギーに侵入すると、イギリスが参戦した。

      一発の銃弾が世界戦争を招いたと語られる。
      しかし実際には、軍備競争、同盟網、植民地をめぐる対立、民族主義がすでに危険な水準に達していた。
      事件はその引き金を引いたにすぎない。
      危機がどのように制御不能になるかという事例として、今も研究されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/DC-1914-27-d-Sarajevo-cropped.jpg/500px-DC-1914-27-d-Sarajevo-cropped.jpg
      credit: アキーレ・ベルトラーメ / Public domain
      page: https://commons.wikimedia.org/wiki/File:DC-1914-27-d-Sarajevo-cropped.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/サラエボ事件
    related: [ww1]

  - id: spanish-flu
    year: 1918
    title: スペイン風邪の大流行
    category: disaster
    tags: [疫病, 世界]
    summary: 戦争の死者を上回る数千万人が亡くなり、人の移動が疫病を広げることを示した。
    detail: |
      1918年から翌年にかけて世界に広がったインフルエンザの大流行。
      死者は数千万人に達し、第一次世界大戦の戦死者を上回った。
      人の移動が疫病を広げることを、はっきりと示した出来事である。

      名称は誤解を招く。
      発生地はスペインではなく、アメリカやフランスなど複数の説がある。
      参戦国が報道を統制していたなか、中立国スペインでは被害が自由に報じられたため、この名がついた。
      最初の波は比較的軽かったが、同じ年の秋の第二波は致死率が高かった。
      通常の流行と異なり、若く健康な成人に死者が多い。
      免疫の過剰な反応が原因の一つと考えられている。

      戦争が流行を助けた。
      兵員が密集して移動し、塹壕と収容所で感染が広がる。
      検疫は戦時の必要の前に後回しにされた。
      世界の人口の三分の一が感染したと推定される。
      死者の数には幅があり、2000万から1億まで見積もりが分かれる。
      植民地では特に被害が大きかった。

      当時はウイルスが分離されておらず、原因も分かっていない。
      マスクと集会の禁止といった手段しかなかった。
      公衆衛生の体制が各国で整えられる契機になり、21世紀の感染症対策でも繰り返し参照されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Emergency_hospital_during_Influenza_epidemic%2C_Camp_Funston%2C_Kansas_-_NCP_1603.jpg/500px-Emergency_hospital_during_Influenza_epidemic%2C_Camp_Funston%2C_Kansas_-_NCP_1603.jpg
      credit: Otis Historical Archives, National Museum of Health and Medicine / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emergency_hospital_during_Influenza_epidemic,_Camp_Funston,_Kansas_-_NCP_1603.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スペインかぜ

  - id: treaty-of-versailles
    year: 1919
    title: ヴェルサイユ条約
    category: politics
    tags: [第一次世界大戦, 戦後処理]
    summary: ドイツへの過酷な賠償が不満を残し、次の戦争の火種になったとされる。
    detail: |
      第一次世界大戦の講和条約で、1919年6月に調印された。
      ドイツに厳しい条件を課したことが、後の不満と次の戦争の火種になったとされる。

      交渉はパリで行われ、アメリカ、イギリス、フランス、イタリアが主導した。
      ドイツは交渉に参加できず、示された条件を受け入れるほかなかった。
      内容は重い。
      戦争の責任をドイツに負わせる条項が置かれ、それを根拠に賠償が課された。
      金額は後に決定され、当時の国民所得の数年分に相当する。
      アルザス・ロレーヌはフランスに返され、東部の領土はポーランドに渡り、すべての植民地を失う。
      陸軍は10万人に制限され、徴兵と空軍の保有が禁じられた。

      アメリカのウィルソンは、14か条にもとづく公正な講和と国際連盟の設立を掲げていた。
      フランスは安全保障を、イギリスは勢力の均衡を優先し、妥協の産物となる。
      アメリカ自身は議会の反対で条約を批准せず、連盟にも加わらなかった。

      ドイツ国内では、この条約は命令による平和と呼ばれ、強い反発を残した。
      背後から刺されたという物語が広まり、ナチスの主張の土台になる。
      過酷すぎたという評価と、実際には履行が緩和されたという指摘の双方がある。
      戦後処理の難しさを示す事例として、繰り返し検討されてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/Treaty_of_Versailles%2C_English_version.jpg/500px-Treaty_of_Versailles%2C_English_version.jpg
      credit: David Lloyd George, Woodrow Wilson and Georges Clemenceau / Public domain
      page: https://commons.wikimedia.org/wiki/File:Treaty_of_Versailles,_English_version.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴェルサイユ条約

  - id: great-depression-eu
    year: 1929
    title: 世界恐慌がヨーロッパに波及
    category: economy
    tags: [経済危機]
    summary: 失業と困窮が各国の民主政治を揺さぶり、極端な政治勢力を押し上げた。
    detail: |
      アメリカで始まった恐慌がヨーロッパに波及した出来事で、1929年以降のこと。
      失業と困窮が各国の民主政治を揺さぶり、極端な政治勢力を押し上げた。

      ヨーロッパ経済は、アメリカからの短期資金に依存していた。
      ドイツはアメリカから借り入れて賠償を支払い、その金が英仏の戦債の返済に回る循環である。
      株価の暴落でアメリカの資金が引き揚げられると、この循環は断たれた。
      1931年、オーストリアの大銀行が破綻し、金融不安が各国に広がる。
      ドイツの失業者は600万に達し、労働人口の三分の一に近づいた。

      各国は自国を守ろうとした。
      関税を引き上げ、通貨を切り下げ、植民地との間で閉じた経済圏を作る。
      世界の貿易は数年で三分の一に縮小し、恐慌をさらに深めた。

      政治への影響は決定的である。
      ドイツでは、議会が多数を作れず大統領の緊急令で統治する状態が続いた。
      失業と将来の不安のなかで、ナチ党と共産党が議席を伸ばす。
      1933年にヒトラーが首相になる背景には、この経済の崩壊があった。
      イギリスとフランスも政治の不安定に直面した。
      民主主義が経済の危機に耐えられるかという問いが、この時期に突きつけられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/54/Lange-MigrantMother02.jpg/500px-Lange-MigrantMother02.jpg
      credit: ドロシア・ラング / Public domain
      page: https://commons.wikimedia.org/wiki/File:Lange-MigrantMother02.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/世界恐慌
    related: [great-depression]

  - id: munich-agreement
    year: 1938
    title: ミュンヘン会談
    category: politics
    tags: [ドイツ, 外交]
    summary: 譲歩で戦争を避けようとして失敗した例として、以後の外交で繰り返し参照される。
    detail: |
      チェコスロヴァキアのズデーテン地方の帰属をめぐる国際会議で、1938年9月に開かれた。
      イギリス、フランス、ドイツ、イタリアが参加し、当事国は招かれなかった。
      譲歩によって戦争を避けようとして失敗した例として引かれる。

      ドイツは、ドイツ系住民が多いズデーテン地方の割譲を要求していた。
      拒めば武力を用いると威嚇し、ヨーロッパは戦争の瀬戸際に立つ。
      イギリス首相チェンバレンは、三度ドイツを訪れて交渉した。
      第一次世界大戦の記憶が生々しく、再び大戦を起こすことは避けたいという世論も強い。
      ドイツの要求はこれが最後だという約束を得て、割譲が決まった。

      チェコスロヴァキアは協議に加われないまま、国境の要塞地帯を失った。
      チェンバレンは帰国して、我々の時代の平和を持ち帰ったと述べる。
      半年後、ドイツは約束を破ってチェコスロヴァキアの残りを解体した。
      宥和政策の限界が明らかになる。
      翌年のポーランド侵攻で、大戦が始まった。

      この経験から、侵略者への譲歩は要求を増やすだけだという教訓が引かれるようになる。
      冷戦期以降、外交上の妥協を批判する際にミュンヘンの名が繰り返し持ち出された。
      一方で、当時の軍事的な準備不足を考えれば時間稼ぎの意味があったという評価もある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Munich_Agreement_Bundesarchiv_Bild_183-R69173.jpg/500px-Munich_Agreement_Bundesarchiv_Bild_183-R69173.jpg
      credit: 作者不明 / CC BY-SA 3.0 de
      page: https://commons.wikimedia.org/wiki/File:Munich_Agreement_Bundesarchiv_Bild_183-R69173.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ミュンヘン会談

  - id: holocaust
    year: 1941
    title: ホロコースト
    category: society
    tags: [ドイツ, 人権]
    summary: 約600万人のユダヤ人が組織的に殺害され、人権という概念の重みが変わった。
    detail: |
      ナチス・ドイツとその協力者が行ったユダヤ人の組織的な虐殺で、1941年から本格化した。
      約600万人が殺害された。
      人権という概念の重みが、この経験によって変わる。

      迫害は段階を追って進んだ。
      1935年の法で市民権と職業を奪い、暴力と略奪が加えられる。
      多くが国外への脱出を試みたが、受け入れ国は限られていた。
      戦争が始まると、占領地のユダヤ人はゲットーに隔離された。
      1941年のソ連侵攻の後、移動する部隊による銃殺が大規模に行われる。

      同じ年から翌年にかけて、絶滅収容所が設けられた。
      ヨーロッパ各地から貨車で移送され、選別された人々がガス室で殺される。
      アウシュヴィッツでは100万人以上が命を落とした。
      鉄道、名簿、企業、官僚機構が動員され、国家の行政として遂行された点がこの虐殺の特徴である。
      ロマ、障害者、政治犯、同性愛者、ソ連の捕虜も標的になった。
      各地に、危険を冒して人を匿った人々もいた。

      戦後のニュルンベルク裁判で、人道に対する罪という概念が用いられる。
      1948年の世界人権宣言とジェノサイド条約は、この経験を踏まえて作られた。
      何が起きたかを記録し、繰り返さないことが、戦後の国際秩序の前提になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/WW2-Holocaust-Europe.png/500px-WW2-Holocaust-Europe.png
      credit: User:Dna-Dennis / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:WW2-Holocaust-Europe.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ホロコースト

  - id: d-day
    year: 1944
    title: ノルマンディー上陸作戦
    category: war
    tags: [第二次世界大戦]
    summary: 西部戦線が開かれ、11か月後のドイツ降伏につながった。
    detail: |
      連合国軍が北フランスのノルマンディー海岸に上陸した作戦で、1944年6月6日のこと。
      西部戦線が開かれ、11か月後のドイツ降伏につながった。

      準備には2年近くを要した。
      港湾を持たない海岸に大軍を送るため、人工の港と海底のパイプラインが用意される。
      偽の部隊と無線の通信でカレー方面への上陸を装い、ドイツ軍の主力をそこに引きつけた。
      6月6日、5つの海岸に約15万の兵が上陸した。
      空挺部隊が夜間に降下し、橋と道路を確保する。
      7000隻近い艦船と1万を超える航空機が投入された。

      海岸のうち一つでは、断崖の防御陣地からの射撃で大きな損害が出た。
      それでも同日中に橋頭堡が築かれ、以後の増援が続く。
      8月にはパリが解放された。

      東ではソ連軍が大規模な攻勢をかけ、ドイツは二つの戦線で戦うことになる。
      この作戦の成功は、物量と計画と欺瞞の組み合わせによるものだった。
      天候の判断も重要で、一日の延期の後に短い晴れ間を突いて実行されている。
      上陸の日は、史上最大の上陸作戦として記憶されてきた。
      西ヨーロッパの解放がアメリカとイギリスの軍によって進んだことは、戦後の勢力圏の形にも影響している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/1944_NormandyLST.jpg/500px-1944_NormandyLST.jpg
      credit: Chief Photographer's Mate (CPHOM) Robert F. Sargent, U.S. Coast Guard / Public domain
      page: https://commons.wikimedia.org/wiki/File:1944_NormandyLST.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ノルマンディー上陸作戦

  - id: marshall-plan
    year: 1948
    title: マーシャル・プラン
    category: economy
    tags: [アメリカ, 戦後復興]
    summary: 米国の大規模援助が西欧の復興を支え、同時に東西の分断を固定した。
    detail: |
      アメリカが西ヨーロッパの復興のために行った大規模な援助計画で、1948年から始まった。
      4年間で130億ドルが供与された。
      西欧の復興を支えると同時に、東西の分断を固定する結果にもなる。

      戦後のヨーロッパは荒廃していた。
      都市と工場が破壊され、食糧も燃料も不足する。
      1946年から翌年の厳冬が、危機をさらに深めた。
      国務長官マーシャルは、経済の混乱が政治の不安定を招き、共産主義の拡大につながると考えた。
      復興を支援することが、アメリカ自身の安全と市場の確保にもつながる。

      援助は、受け入れ国が共同で計画を立てることを条件とした。
      16か国が参加し、配分を協議する機関が作られる。
      この経験が、後のヨーロッパ統合の下地になった。
      ソ連と東欧諸国にも参加の機会は開かれていたが、辞退した。
      経済の情報を開示することが体制の統制と相容れないためである。
      ソ連は対抗して東欧の経済協力機構を作り、分断は深まった。

      援助の多くは食糧、燃料、機械の購入に充てられた。
      西欧の生産は数年で戦前の水準を超える。
      経済的な支援が政治的な同盟を支えるという手法は、以後の外交でも繰り返された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/US-MarshallPlanAid-Logo.svg/500px-US-MarshallPlanAid-Logo.svg.png
      credit: U.S. Government / Public domain
      page: https://commons.wikimedia.org/wiki/File:US-MarshallPlanAid-Logo.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マーシャル・プラン

  - id: berlin-wall-built
    year: 1961
    title: ベルリンの壁の建設
    category: politics
    tags: [冷戦, ドイツ]
    summary: 分断が目に見える形になり、以後28年間ドイツ人を隔てた。
    detail: |
      東ドイツが西ベルリンを囲む壁を築いた出来事で、1961年8月のこと。
      分断が目に見える形になり、以後28年間ドイツ人を隔てた。

      東ドイツからは、人口の流出が続いていた。
      建国以来250万人以上が西側へ移り、その多くが若く技能を持つ人々だった。
      唯一の抜け道が、四か国の管理下にあった西ベルリンである。

      8月13日の未明、境界に鉄条網が張られた。
      数日のうちにコンクリートの壁に置き換えられ、総延長は150キロ近くになる。
      前日まで自由に往来していた市民は、突然引き裂かれた。
      壁は二重に作られ、あいだには監視塔、照明、地雷が配置された。
      越境を試みた者には射撃が命じられ、確認されているだけで100人以上が死亡している。

      西側は抗議したが、実力で撤去することはなかった。
      壁は人の流出を止め、東ドイツの経済を安定させる効果を持つ。
      ケネディは1963年にベルリンを訪れ、自らをベルリン市民だと述べる演説を行った。
      1989年11月、東ドイツの政策の混乱のなかで国境の通行が認められ、市民が壁に押し寄せる。
      壁は市民の手で壊され、翌年にドイツは統一された。
      冷戦の構図を最も具体的に示した構造物である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/West-Berlin_in_Germany.svg/500px-West-Berlin_in_Germany.svg.png
      credit: TUBS / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:West-Berlin_in_Germany.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ベルリンの壁

  - id: eu-founded
    year: 1993
    title: ヨーロッパ連合（EU）発足
    category: politics
    tags: [ヨーロッパ, 統合]
    summary: 二度の大戦への反省から始まった統合が、通貨と市民権を共有する段階に進んだ。
    detail: |
      ヨーロッパ連合が発足した出来事で、1993年のこと。
      マーストリヒト条約の発効による。
      二度の大戦への反省から始まった統合が、通貨と市民権を共有する段階に進んだ。

      出発点は1952年の石炭鉄鋼共同体である。
      戦争に不可欠な資源を共同で管理すれば、加盟国どうしの戦争は事実上不可能になるという構想だった。
      1958年に経済共同体が作られ、関税の撤廃と共通市場が進む。
      マーストリヒト条約は、この経済の統合を政治へ広げた。
      共通の外交と安全保障、司法と内務の協力が柱に加わる。
      EU市民権が設けられ、加盟国の国民はどこでも居住し、地方選挙で投票できるようになった。

      最大の事業は通貨統合である。
      財政赤字と債務の基準を満たした国が参加し、単一通貨を導入することが定められた。
      その後、加盟国は東欧へ広がり、27か国以上になる。
      人と物と資本とサービスの移動は原則として自由になった。

      一方で、課題も明らかになる。
      財政は各国に残したまま金融を統合したことが、債務危機で弱点として現れた。
      加盟国の主権と、ブリュッセルの決定との関係も繰り返し論争になる。
      イギリスの離脱は、統合が一方向には進まないことを示した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b7/Flag_of_Europe.svg/500px-Flag_of_Europe.svg.png
      credit: User:Verdy p, User:-xfi-, User:Paddu, User:Nightstallion, User:Funakoshi, User:Jeltz, User:Dbenbenn, User:Zscout370 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Europe.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/欧州連合

  - id: euro-introduced
    year: 2002
    title: ユーロの流通開始
    category: economy
    tags: [ヨーロッパ, 通貨]
    summary: 国家の象徴だった通貨を手放す実験。統合の深さと限界を同時に示した。
    detail: |
      単一通貨ユーロの紙幣と硬貨の流通が始まった出来事で、2002年1月のこと。
      12か国で各国通貨が置き換えられた。
      国家の象徴だった通貨を手放す実験である。

      決済上のユーロは1999年に導入されており、為替相場は固定されていた。
      3年の移行期間を経て、現金が入れ替わる。
      数か月のうちに、マルク、フラン、リラなどが姿を消した。
      利点は明確である。
      両替の費用がなくなり、価格の比較が容易になる。
      為替の変動という取引の不確実さも消えた。

      一方で、各国は金融政策の手段を失った。
      金利と通貨の発行は欧州中央銀行が一元的に決める。
      景気が国ごとに異なっても、自国の事情に合わせて金利を下げたり通貨を切り下げたりできない。
      この弱点は2010年前後の債務危機で表面化した。
      ギリシャをはじめとする南欧の国が財政難に陥り、通貨の切り下げという調整手段を持たないまま緊縮を強いられる。
      財政は各国に残したまま通貨だけを統合したことの限界が問われた。

      その後、銀行の監督を共通化し、危機に備える基金も作られた。
      現在20か国以上が使用し、ドルに次ぐ国際通貨になっている。
      統合の深さと限界を、同時に示す制度である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Euro_Series_Banknotes_%282019%29.jpg/500px-Euro_Series_Banknotes_%282019%29.jpg
      credit: PawełMM / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Euro_Series_Banknotes_(2019).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ユーロ

  - id: brexit
    year: 2020
    title: イギリスのEU離脱
    category: politics
    tags: [ヨーロッパ, 統合]
    summary: 統合が一方向には進まないことを示し、各国の主権論議に火をつけた。
    detail: |
      イギリスがEUから離脱した出来事で、2020年1月に正式に実現した。
      2016年の国民投票から3年半を要している。
      統合が一方向には進まないことを示した。

      国民投票では、離脱が52パーセント、残留が48パーセントだった。
      争点は、移民の受け入れ、EUへの拠出金、規制の決定権である。
      主権を取り戻すという訴えが、離脱派の中心的な主張だった。
      イギリスはもともと統合に距離を置いていた。
      ユーロに参加せず、国境検査を廃止する枠組みにも加わっていない。

      交渉は難航した。
      離脱の条件をめぐって議会が紛糾し、首相が二度交代する。
      最大の難問は、北アイルランドとアイルランドの国境をどう扱うかだった。
      物理的な検問を復活させれば和平の枠組みに触れるため、特別な取り決めが必要になる。

      2020年末に移行期間が終わり、通商協定が発効した。
      関税は回避されたが、通関の手続きと規制の相違が貿易の負担になる。
      人の移動の自由も失われ、労働力の不足が各分野で表面化した。
      スコットランドでは残留の票が多く、独立の議論が再燃している。
      離脱の経済的な影響の評価は分かれ、政治的な論争も続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/May_at_the_EP_%2846972553232%29.jpg/500px-May_at_the_EP_%2846972553232%29.jpg
      credit: European Parliament from EU / CC BY 2.0
      page: https://commons.wikimedia.org/wiki/File:May_at_the_EP_(46972553232).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イギリスの欧州連合離脱
