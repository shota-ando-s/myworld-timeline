lane: west-europe

periods:
  - id: frankish-kingdom
    title: フランク王国
    start: 481
    end: 843
    category: politics
    tags: [ヨーロッパ, ゲルマン]
    summary: 西ヨーロッパを統合した最初のゲルマン国家。分裂して独仏伊の原型になった。
    detail: |
      ゲルマン系のフランク人が建てた王国で、481年から843年まで続いた。
      西ヨーロッパの大半を一つにまとめた最初の国家である。
      分裂の結果が、フランス・ドイツ・イタリアの原型になった。

      クローヴィスがメロヴィング朝を開き、ガリアの各地を統一した。
      彼がカトリックに改宗したことで、ローマ系の住民と教会の支持を得る。
      ゲルマンの王とローマ教会が結びつく形が、ここで始まった。
      やがて王家は力を失い、宮宰と呼ばれる官職の家系が実権を握る。
      カール・マルテルは732年にイスラム軍を撃退し、その子ピピンが教皇の承認を得て王位に就いた。
      カロリング朝の始まりである。

      カール大帝の代に領土は最大になった。
      イタリア、ドイツ、スペイン北部まで広がり、800年にはローマ教皇から皇帝の冠を受ける。
      西ヨーロッパが独自の帝国を持ったことになる。
      統治は、各地に伯を置いて監察使が巡回する仕組みだった。
      修道院で古典の写本が作られ、ラテン語の学校が整えられる。

      息子と孫の代で分割相続が繰り返され、843年のヴェルダン条約で三つに分かれた。
      東はドイツ、西はフランス、中部はイタリアとロタリンギアにつながる。
      ローマ・キリスト教・ゲルマンの三つが混ざる西ヨーロッパ世界は、この王国を通じて形になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2a/Carolingian_Empire%2C_AD810.png/500px-Carolingian_Empire%2C_AD810.png
      credit: Kaiser&Augstus&Imperator / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Carolingian_Empire,_AD810.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フランク王国

  - id: carolingian-renaissance
    title: カロリング・ルネサンス
    start: 780
    startCirca: true
    end: 900
    endCirca: true
    category: culture
    tags: [フランク, 学問]
    summary: 修道院で古典写本が写され、ラテン語と学校の伝統が中世に引き継がれた。
    detail: |
      8世紀後半から9世紀にかけて、フランク王国で行われた学問と文化の再興。
      カール大帝が主導し、修道院と宮廷を拠点として進められた。
      古典とラテン語の伝統が、この事業を通じて中世に引き継がれる。

      背景には、聖職者の水準の低下があった。
      ラテン語を正しく読めない司祭が多く、聖書や典礼の文言も地域ごとに乱れている。
      信仰を正しく伝えるには、まず言葉と写本を整える必要があった。
      カールはイングランドからアルクィンを招き、宮廷学校を組織させた。
      各地の司教座と修道院に学校を置くよう命じ、聖職者と貴族の子弟を教育する。
      自由七科と呼ばれる基礎科目の教育課程が整えられた。

      写本の制作が大規模に行われた。
      古代の著作も、聖書と並んで書き写される。
      現在残るラテン語の古典の多くは、この時期の写本を通じて伝わったものである。
      書体も改良された。
      読みやすく速く書けるカロリング小文字体が広まり、後の印刷の活字の手本になる。
      単語の間隔や句読点の使い方も、この時期に整えられた。

      帝国が分裂した後も、修道院の学校は残り続けた。
      11世紀以降の大学の成立は、この基盤の上にある。
      古代の知識が失われずに中世へ渡った経路として、決定的な役割を果たした。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カロリング朝ルネサンス

  - id: holy-roman-empire
    title: 神聖ローマ帝国
    start: 962
    end: 1806
    category: politics
    tags: [ドイツ, ヨーロッパ]
    summary: ドイツを中心とする緩やかな連合体。名目上のローマ帝国の後継を844年間名乗った。
    detail: |
      962年から1806年まで続いた、ドイツを中心とするヨーロッパの政体。
      古代ローマ帝国の後継を名乗り、皇帝は教皇から戴冠を受けた。
      実態は諸侯の緩やかな連合であり、844年にわたって存続した。

      オットー1世の戴冠を起点とする。
      皇帝はドイツ王を兼ね、イタリアにも権利を主張した。
      初期には、司教を統治に用いる仕組みで強い王権を保つ。
      11世紀の叙任権闘争で、皇帝は教皇と衝突した。
      カノッサの出来事に象徴されるように、宗教的権威と世俗の権力の関係が問われる。
      争いのあいだに諸侯の自立が進み、皇帝の実権は削られていった。

      13世紀以降、皇帝は選挙で選ばれることが定着する。
      1356年の金印勅書で、七人の選帝侯が皇帝を選ぶ仕組みが明文化された。
      15世紀からはハプスブルク家がほぼ独占する。
      宗教改革によって、領邦ごとに宗派が分かれた。
      三十年戦争の講和で、各領邦はほぼ主権国家として扱われるようになる。
      300を超える領邦が並ぶ状態は、神聖でもローマでも帝国でもないと評された。

      1806年、ナポレオンの圧力を受けて最後の皇帝が退位し、帝国は解散した。
      ドイツが統一国家になるのは、その65年後である。
      ヨーロッパの中央に緩やかな枠組みが長く存在したことは、その後の歴史に大きく影響した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Banner_of_the_Holy_Roman_Emperor_with_haloes_%281430-1806%29.svg/500px-Banner_of_the_Holy_Roman_Emperor_with_haloes_%281430-1806%29.svg.png
      credit: David Liuzzo, eagle by N3MO / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Banner_of_the_Holy_Roman_Emperor_with_haloes_(1430-1806).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/神聖ローマ帝国

  - id: crusades
    title: 十字軍
    start: 1096
    end: 1291
    category: religion
    tags: [ヨーロッパ, 中東]
    summary: 聖地回復を掲げた遠征。結果として東方の物と知識がヨーロッパに流れ込んだ。
    detail: |
      聖地の回復を掲げて西欧のキリスト教国が行った遠征で、1096年から1291年まで続いた。
      主要なものだけで7回を数える。
      結果として、東方の物と知識がヨーロッパへ流れ込んだ。

      第1回は、教皇の呼びかけに応じた諸侯が組織した。
      1099年にエルサレムを占領し、シリアからパレスチナに十字軍国家を建てる。
      しかし支配は不安定で、1187年にサラディンに奪回された。

      以後の遠征は、当初の目的から次第に離れていく。
      第4回はコンスタンティノープルを占領して略奪し、同じキリスト教の帝国を傷つけた。
      南フランスの異端やバルト海沿岸の異教徒に対しても、十字軍の名で遠征が行われている。
      少年十字軍と呼ばれる悲劇的な出来事も伝えられる。
      1291年、最後の拠点アッコンが陥落して十字軍国家は消えた。

      軍事的には失敗に終わったが、影響は広い。
      地中海の交易が活発になり、ヴェネツィアとジェノヴァが富を築いた。
      砂糖・香辛料・綿布が西欧に入り、生活が変わる。
      イスラム世界に保存されていたギリシアの学問が、翻訳を通じて伝わった。
      一方で、ユダヤ人への迫害が各地で起き、東西の教会の溝も決定的になった。
      宗教の名による暴力の記憶は、現在の政治の言葉にも影を落としている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/SiegeofAntioch.jpeg/500px-SiegeofAntioch.jpeg
      credit: ジャン・コロンブ / Public domain
      page: https://commons.wikimedia.org/wiki/File:SiegeofAntioch.jpeg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/十字軍

  - id: capetian-france
    title: カペー朝フランス
    start: 987
    end: 1328
    category: politics
    tags: [フランス]
    summary: パリ周辺の小領主から始まり、340年かけて王権を全土に広げた。
    detail: |
      987年から1328年まで続いたフランスの王朝。
      パリ周辺のわずかな直轄領から始まり、340年をかけて王権を全土に広げた。
      中世のフランス国家が形になる過程そのものである。

      初代のユーグ・カペーが諸侯に選ばれて即位した。
      当時の王の実力は、有力な諸侯と変わらないか、それ以下だった。
      直轄領はパリとオルレアン周辺に限られている。
      王朝が続いた理由の一つは、後継者に恵まれたことである。
      300年以上にわたり男子の相続が途切れず、生前に息子を共同の王として戴冠させる慣行も定着させた。
      選挙による王位が、事実上の世襲に変わっていく。

      12世紀以降、王権は実力を伴い始めた。
      フィリップ2世はイングランド王から大陸の領地の大半を奪い、直轄領を大きく広げる。
      ルイ9世は公正な裁判で権威を高め、聖王と呼ばれた。
      フィリップ4世は教皇を屈服させ、三部会を開いて課税の同意を得る。

      統治では、王が任命する役人を各地に派遣し、司法と徴税を握った。
      諸侯の領地も、相続や婚姻、没収によって少しずつ王の手に移っていく。
      1328年に直系が絶え、ヴァロワ家が継いだ。
      この継承をめぐる争いが百年戦争につながる。
      弱小の王家が制度を積み上げて強国になった典型例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Arms_of_the_Kingdom_of_France_%28Ancien%29.svg/500px-Arms_of_the_Kingdom_of_France_%28Ancien%29.svg.png
      credit: Sodacan / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Arms_of_the_Kingdom_of_France_(Ancien).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カペー朝

  - id: hundred-years-war
    title: 百年戦争
    start: 1337
    end: 1453
    category: war
    tags: [イギリス, フランス]
    summary: 英仏の王位と領土をめぐる断続的な戦争。両国の国民意識を育てた。
    detail: |
      イングランドとフランスが王位と領土をめぐって断続的に戦った戦争で、1337年から1453年まで続いた。
      116年に及ぶが、実際の戦闘は断続的である。
      両国の国民意識が、この戦争を通じて育った。

      原因は複合的である。
      イングランド王がフランス国内に領地を持ち、フランス王の家臣でもあるという関係が根底にあった。
      そこへフランス王位の継承問題と、毛織物産業で結びつくフランドルの帰属が重なる。

      前半はイングランドが優勢だった。
      クレシー、ポワティエ、アジャンクールで長弓隊が勝利を重ねる。
      重装騎兵の突撃が歩兵の射撃に破られ、戦い方が変わった。
      1348年からの黒死病が、双方の人口と経済を直撃した。
      戦争は休戦と再開を繰り返し、傭兵が各地を荒らす。

      1429年、ジャンヌ・ダルクの登場が転機になった。
      オルレアンの包囲を解き、王太子をランスで戴冠させる。
      フランス側の士気が回復し、以後は反攻に転じた。
      大砲の使用が城攻めを変え、常備軍も整えられる。
      1453年、ボルドーの陥落で戦争は終わった。
      イングランドは大陸の領土をカレーだけ残して失い、以後は島国として海へ向かう。
      両国とも、王を中心とする国家の枠組みを強めることになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1d/Hundred_years_war_collage.jpg/500px-Hundred_years_war_collage.jpg
      credit: Blaue Max / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Hundred_years_war_collage.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/百年戦争

  - id: age-of-discovery
    title: 大航海時代
    start: 1415
    end: 1600
    endCirca: true
    category: economy
    tags: [ポルトガル, スペイン, 航海]
    summary: ヨーロッパが海路で世界とつながり、富と病と支配が同時に広がった。
    detail: |
      ヨーロッパ人が海路で世界各地に到達した時代で、15世紀初めから17世紀半ばまでを指す。
      ポルトガルとスペインが先行し、後にオランダ、イギリス、フランスが続いた。
      富と病と支配が、同時に世界へ広がることになる。

      動機は複数あった。
      アジアの香辛料を、イスラム商人とヴェネツィアを介さずに直接手に入れること。
      キリスト教を広めること。
      そして金と銀を得ることである。

      技術の条件も整っていた。
      羅針盤、緯度を測る器具、逆風でも進める帆装、頑丈な外洋船が使えるようになる。
      ポルトガルはアフリカ西岸を南下し、1498年にインド航路を開いた。
      スペインは西回りを試み、1492年にアメリカ大陸に到達する。
      1522年にはマゼランの一行が世界周航を果たした。

      結果は世界を変えた。
      大陸間で作物と家畜が交換され、ジャガイモとトウモロコシがヨーロッパの人口を支える。
      一方、天然痘などの病原がアメリカの先住民を激減させた。
      銀がアメリカからヨーロッパを経て中国へ流れ、世界規模の経済が生まれる。
      同時に、植民地支配と大西洋の奴隷貿易が始まった。
      数百年にわたる不均衡な関係の起点でもある。
      地球が一つのつながりとして意識され始めた時代だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/Explos.png/500px-Explos.png
      credit: Continentalis / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Explos.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大航海時代

  - id: reformation
    title: 宗教改革
    start: 1517
    end: 1648
    category: religion
    tags: [ヨーロッパ, キリスト教]
    summary: 西方キリスト教世界が分裂し、100年以上の宗教戦争を経て共存の原則に至った。
    detail: |
      西方キリスト教世界が分裂した宗教運動で、1517年から1648年までを一つの時代として括る。
      ルターの批判から始まり、100年以上の宗教戦争を経て共存の原則に至った。

      発端は贖宥状への批判である。
      ルターは、人は信仰によってのみ救われると説き、聖書だけを権威として認めた。
      教皇や司祭を介さず、各人が神と向き合うという主張である。
      印刷術によって、その論はドイツ中に広まった。
      運動は各地で異なる形をとった。
      スイスではツヴィングリとカルヴァンが改革を進める。
      カルヴァンの予定説は、勤勉な職業生活を肯定し、商工業者に受け入れられた。
      イングランドでは、王の離婚問題から国教会が生まれる。

      諸侯は、教会領の没収と自立の機会としてこれを支持した。
      宗教の選択が政治の問題になり、ドイツでは領邦ごとに宗派が決まる。
      カトリック側も立て直しを進めた。
      トリエント公会議で教義を明確にし、イエズス会が教育と海外宣教を担う。

      対立は戦争になった。
      フランスのユグノー戦争、オランダの独立戦争、そして三十年戦争が続く。
      1648年のウェストファリア条約で、各国が宗派を選ぶ原則が確認された。
      信仰の統一を前提としない国家の並立が、ここから始まる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/95Thesen.jpg/500px-95Thesen.jpg
      credit: "Wittenberg: Melchior Lotter d.J., 1522 / Public domain"
      page: https://commons.wikimedia.org/wiki/File:95Thesen.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/宗教改革

  - id: thirty-years-war
    title: 三十年戦争
    start: 1618
    end: 1648
    category: war
    tags: [ドイツ, 宗教]
    summary: ドイツを荒廃させた最後の大宗教戦争。主権国家体制はこの戦後に生まれた。
    detail: |
      ドイツを主な戦場として1618年から1648年まで続いた戦争。
      ヨーロッパ最後の大規模な宗教戦争とされる。
      主権国家からなる国際秩序は、この戦後に生まれた。

      発端はボヘミアである。
      カトリックの皇帝が新教徒の権利を制限し、プロテスタントの貴族が皇帝の使者を窓から投げ落とした。
      反乱は鎮圧されたが、戦火はドイツ全体に広がる。
      宗教の対立として始まったが、次第に勢力争いの性格を強めた。
      デンマークとスウェーデンが新教側で介入し、カトリック国であるフランスも、ハプスブルク家を弱めるために新教側を支援する。
      傭兵隊長が軍を率い、略奪によって兵を養った。

      ドイツの被害は甚大だった。
      地域によっては人口が半分以下に減り、農村は荒廃する。
      疫病と飢饉が戦闘以上の死者を出した。

      1648年のウェストファリア条約で終結した。
      各領邦にほぼ主権が認められ、宗派の選択も領主に委ねられる。
      カルヴァン派も公認された。
      オランダとスイスの独立が正式に認められている。
      この条約によって、宗教ではなく国家の利害が国際関係の基準になった。
      対等な主権国家が交渉と条約で関係を作るという枠組みが、ここから始まる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Schlacht_am_Wei%C3%9Fen_Berg_C-K_063.jpg/500px-Schlacht_am_Wei%C3%9Fen_Berg_C-K_063.jpg
      credit: ピーテル・スネイエルス / Public domain
      page: https://commons.wikimedia.org/wiki/File:Schlacht_am_Wei%C3%9Fen_Berg_C-K_063.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/三十年戦争

  - id: enlightenment
    title: 啓蒙思想
    start: 1680
    startCirca: true
    end: 1789
    category: religion
    tags: [ヨーロッパ, 思想]
    summary: 理性と経験で社会を問い直す思想。アメリカ独立とフランス革命の下地になった。
    detail: |
      理性と経験によって社会と人間を問い直した思想の運動で、17世紀末から18世紀末まで続いた。
      イギリスに始まり、フランスで最も盛んになった。
      アメリカ独立とフランス革命の下地になる。

      背景には科学革命がある。
      ニュートンが自然を法則で説明したように、社会も理性で理解し改善できるという確信が生まれた。
      主要な論者はそれぞれ異なる主張を展開した。
      ロックは、統治は人民の同意にもとづき、権利が侵されれば抵抗できると説く。
      モンテスキューは権力を三つに分けて互いに抑制させる仕組みを論じた。
      ヴォルテールは教会の不寛容を批判し、言論の自由を擁護する。
      ルソーは、社会契約によって一般意志に従う共同体を構想した。

      これらの議論は、サロンやカフェ、書簡を通じて広がった。
      『百科全書』が知識を体系的にまとめ、検閲をかいくぐって流通する。
      宗教については、教会の権威を批判しつつ、神の存在自体は認める立場が多かった。

      影響は具体的である。
      アメリカ独立宣言と合衆国憲法には、ロックとモンテスキューの議論が直接反映されている。
      フランスの人権宣言も同じ系譜にある。
      啓蒙専制君主と呼ばれる支配者たちも、改革の言葉としてこの思想を用いた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/啓蒙思想

  - id: industrial-revolution
    title: 産業革命
    start: 1760
    startCirca: true
    end: 1840
    category: economy
    tags: [イギリス, 技術]
    summary: 石炭と蒸気機関による機械生産が始まり、人類の暮らしの前提が変わった。
    detail: |
      石炭と機械による生産が始まった変革で、18世紀半ばのイギリスから広がった。
      人類の暮らしの前提が、ここで大きく変わる。

      始まりは綿工業である。
      紡績と織布の機械が相次いで発明され、生産量が飛躍的に伸びた。
      水車の力に代わって蒸気機関が使われるようになり、工場は川から離れた場所にも建てられる。
      鉄の生産では、コークスを用いる製法が確立した。
      安価な鉄が機械、橋、レールに使われる。
      蒸気機関車と鉄道が人と物の移動を変え、蒸気船が海を結んだ。

      イギリスが先行した理由は複数ある。
      石炭と鉄鉱石が近くにあり、植民地という市場と原料の供給地を持ち、農業の改良で労働力が都市へ移動できた。
      特許の制度と資本を集める仕組みも整っていた。
      社会は大きく変わった。
      人口が都市に集中し、時計に合わせて働く生活が生まれる。
      長時間労働、児童労働、劣悪な住環境が問題になり、労働組合と社会主義という新しい問いが現れた。

      生産量だけでなく、時間の使い方も住む場所も働き方も変わっている。
      一人あたりの生産が持続的に伸びるという、それまでの人類が経験しなかった状態が始まった。
      環境への負荷も、この時期から蓄積されていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d0/StocktonDarlingtonOpening.jpg/500px-StocktonDarlingtonOpening.jpg
      credit: John Dobbin / Public domain
      page: https://commons.wikimedia.org/wiki/File:StocktonDarlingtonOpening.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/産業革命

  - id: napoleonic-wars
    title: ナポレオン戦争
    start: 1803
    end: 1815
    category: war
    tags: [フランス, ヨーロッパ]
    summary: 革命の理念と支配が武力で各地に運ばれ、国民国家の意識を各国に植えつけた。
    detail: |
      ナポレオンが指揮したフランスと、各国の同盟とのあいだの戦争で、1803年から1815年まで続いた。
      革命の理念と支配が武力で各地へ運ばれた。
      国民国家の意識が、この経験を通じて各国に植えつけられる。

      フランス側の強みは、徴兵による大規模な軍だった。
      国民が兵となることで、傭兵に頼る他国を人数で圧倒する。
      軍団ごとに独立して行動し、決戦で合流する運用も機動力を生んだ。
      アウステルリッツ、イエナ、ワグラムと勝利を重ね、フランスの支配はヨーロッパの大半に及ぶ。
      神聖ローマ帝国は1806年に解体された。
      イギリスに対しては海戦で敗れ、大陸封鎖によって経済的に圧迫する方針をとる。

      この封鎖が各国の反発を招いた。
      スペインでは住民の抵抗が長期のゲリラ戦になる。
      1812年のロシア遠征では、60万の大軍が冬と補給の途絶で壊滅した。
      各国は国民を動員する形で反撃した。
      プロイセンは徴兵と改革で軍を立て直し、解放戦争と呼ぶ戦いを展開する。
      1815年のワーテルローで決着がついた。

      戦争は各地に改革を残した。
      農奴制の廃止、法典の導入、身分制の解体が進む。
      同時に、支配への抵抗のなかで民族という意識が育ち、19世紀の統一運動につながった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/ba/La_bataille_d%27Austerlitz._2_decembre_1805_%28Fran%C3%A7ois_G%C3%A9rard%29.jpg/500px-La_bataille_d%27Austerlitz._2_decembre_1805_%28Fran%C3%A7ois_G%C3%A9rard%29.jpg
      credit: フランソワ・ジェラール / Public domain
      page: https://commons.wikimedia.org/wiki/File:La_bataille_d%27Austerlitz._2_decembre_1805_(Fran%C3%A7ois_G%C3%A9rard).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ナポレオン戦争

  - id: british-empire-peak
    title: 大英帝国の最盛期
    start: 1815
    end: 1914
    category: politics
    tags: [イギリス, 帝国主義]
    summary: 海軍と資本で世界の4分の1を支配し、自由貿易の秩序を主導した。
    detail: |
      イギリスが世界の広い範囲を支配した時期で、1815年から1914年までにあたる。
      海軍と資本によって世界の四分の一を支配し、自由貿易の秩序を主導した。

      ナポレオン戦争の勝利が起点である。
      海上に対抗できる勢力はなくなり、世界の海路を押さえた。
      産業革命によって、工業製品を輸出し原料を輸入する体制が整う。
      世界の工場と呼ばれ、19世紀半ばには世界の工業生産の相当部分を占めた。
      自由貿易を掲げ、関税を引き下げて市場を広げる。

      領域は広大である。
      インドは会社の支配から直轄統治へ移り、女王が皇帝を兼ねた。
      カナダ、オーストラリア、ニュージーランドは自治領となり、アフリカでは縦断政策を進める。
      植民地の統治は、直接支配と現地の支配者を通じた間接支配を使い分けた。

      金融でも中心だった。
      ロンドンが世界の資金を集め、ポンドが基軸の通貨として機能する。
      海底電信網が情報を運び、蒸気船が定期的に大陸を結んだ。
      一方で、支配される側には重い負担が課された。
      インドの飢饉、アイルランドの大飢饉、アヘン戦争はその例である。
      19世紀末にはドイツとアメリカの工業が追いつき、優位は揺らいでいった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Flag_of_the_United_Kingdom_%283-5%29.svg/500px-Flag_of_the_United_Kingdom_%283-5%29.svg.png
      credit: "原作: Acts of Union 1800 ベクタ: Yaddah / Public domain"
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_United_Kingdom_(3-5).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イギリス帝国

  - id: ww1
    title: 第一次世界大戦
    start: 1914
    end: 1918
    category: war
    tags: [世界大戦]
    summary: 総力戦となり、ヨーロッパの帝国と旧秩序が崩れ落ちた。
    detail: |
      1914年から1918年まで続いた世界規模の戦争で、当時は大戦争と呼ばれた。
      総力戦となり、ヨーロッパの帝国と旧秩序が崩れ落ちる。

      発端はサラエボでのオーストリア皇位継承者の暗殺である。
      同盟の連鎖によって、1か月余りで主要国が参戦した。
      開戦時、各国は短期決戦を想定していた。
      しかし西部戦線は数か月で膠着し、塹壕が北海からスイスまで伸びる。
      機関銃と鉄条網と大砲の前で、歩兵の突撃は膨大な死者を出すだけになった。

      新しい兵器が次々に投入された。
      毒ガス、戦車、飛行機、潜水艦が戦場に現れる。
      国家は総力を戦争に動員した。
      工場は軍需品を作り、男性に代わって女性が働き手となり、食糧は配給制になる。
      植民地からも兵と物資が送られた。

      1917年、ロシアで革命が起きて戦線を離脱し、アメリカが参戦する。
      1918年11月、ドイツで革命が起きて休戦が成立した。
      死者は軍人だけで約1000万、民間人を含めるとさらに多い。
      ドイツ、オーストリア、オスマン、ロシアの四つの帝国が消滅した。
      ヨーロッパの優位が揺らぎ、アメリカと日本の地位が上がる。
      過酷な講和条件は、次の戦争の火種を残した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/WWImontage.jpg/500px-WWImontage.jpg
      credit: User:Hohum / Public domain
      page: https://commons.wikimedia.org/wiki/File:WWImontage.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第一次世界大戦

  - id: nazi-germany
    title: ナチス・ドイツ
    start: 1933
    end: 1945
    category: politics
    tags: [ドイツ, 全体主義]
    summary: 合法的に成立した独裁が戦争とホロコーストに至り、12年で崩壊した。
    detail: |
      国民社会主義ドイツ労働者党が支配した時期のドイツで、1933年から1945年まで続いた。
      合法的に成立した政権が独裁に移り、戦争とホロコーストに至る。
      12年で崩壊した。

      ヒトラーは選挙で第一党となった党の指導者として首相に任命された。
      国会議事堂の放火事件を口実に基本的人権を停止し、全権委任法で立法権を政府に移す。
      政党と労働組合は解散され、一党支配が完成した。
      宣伝と恐怖の両方が用いられた。
      ラジオと映画と集会で国民を動員し、秘密警察と強制収容所が反対者を排除する。
      ユダヤ人は法によって公職と市民権を奪われ、暴力の対象になった。

      経済では、公共事業と再軍備で失業を解消した。
      この成果が、体制への支持を広げる。
      対外的には、ヴェルサイユ条約を次々に破った。
      再軍備、ラインラント進駐、オーストリア併合、チェコスロヴァキアの解体と進み、1939年にポーランドへ侵攻して大戦が始まる。

      占領地では、計画的な虐殺が行われた。
      ユダヤ人、ロマ、障害者、政治犯が対象となり、約600万のユダヤ人が殺害される。
      1945年、ベルリン陥落とともに体制は消えた。
      民主的な手続きから独裁が生まれうることの警告として、繰り返し検証されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Flag_of_Germany_%281935%E2%80%931945%29.svg/500px-Flag_of_Germany_%281935%E2%80%931945%29.svg.png
      credit: German government / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Germany_(1935%E2%80%931945).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ナチス・ドイツ

  - id: ww2
    title: 第二次世界大戦
    start: 1939
    end: 1945
    category: war
    tags: [世界大戦]
    summary: 史上最大の戦争。戦後は米ソ二極と脱植民地化の時代になる。
    detail: |
      1939年から1945年まで続いた史上最大の戦争。
      ヨーロッパとアジア太平洋の二つの主要な戦場があり、世界の大半の国が関わった。
      戦後は米ソの二極と脱植民地化の時代になる。

      ヨーロッパでは、ドイツのポーランド侵攻で始まった。
      機甲部隊と航空機を組み合わせた進撃で、フランスは6週間で降伏する。
      イギリスは航空戦で持ちこたえた。
      1941年、ドイツはソ連へ侵攻し、戦線は東へ広がる。

      アジアでは、日中戦争が1937年から続いていた。
      1941年の真珠湾攻撃で、日本とアメリカが交戦状態に入る。
      転換点は1942年から43年にかけてである。
      スターリングラードでドイツ軍が包囲され、ミッドウェーで日本の空母が失われた。
      連合国の工業生産が圧倒的な差を生んでいく。

      1944年のノルマンディー上陸で西部戦線が開かれ、1945年5月にドイツが降伏した。
      8月、原子爆弾の投下とソ連の参戦を経て日本も降伏する。
      死者は軍民合わせて5000万から8000万と推定される。
      市民が意図的に攻撃の対象となり、ホロコーストという組織的な虐殺が行われた。
      戦後、国際連合が作られ、植民地が次々に独立する。
      核兵器の登場は、戦争の意味そのものを変えた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/e/ee/WW2_collage.jpg
      credit: несколько авторов; подробнее в описании исходных файлов. Обработал Полиционер. / Public domain
      page: https://commons.wikimedia.org/wiki/File:WW2_collage.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第二次世界大戦

  - id: cold-war
    title: 冷戦
    start: 1947
    end: 1991
    category: politics
    tags: [ヨーロッパ, 米ソ]
    summary: 直接戦火を交えないまま世界を二分した対立。ヨーロッパはその最前線だった。
    detail: |
      アメリカとソ連を中心とする東西の対立で、1947年ごろから1991年まで続いた。
      両国が直接戦火を交えなかったため冷戦と呼ばれる。
      ヨーロッパはその最前線だった。

      第二次世界大戦の終結とともに、協力の理由は失われた。
      東欧にソ連型の政権が次々に成立し、西側は封じ込めの方針をとる。
      1947年のトルーマン・ドクトリンとマーシャル・プランが、その出発点になった。
      ドイツは分断された。
      1948年のベルリン封鎖に対して西側は空輸で対抗し、翌年に二つのドイツが成立する。
      軍事同盟としてNATOとワルシャワ条約機構が向かい合った。

      核兵器の存在が、直接の戦争を抑えた。
      互いに報復の能力を持つため、全面戦争は双方の破滅を意味する。
      代わりに、朝鮮、ベトナム、アフガニスタン、中南米で代理の戦争が戦われた。
      1962年のキューバ危機は、最も核戦争に近づいた局面である。
      競争は宇宙開発、スポーツ、文化にも及んだ。

      1980年代、ソ連の経済が行き詰まり、ゴルバチョフが改革に着手する。
      1989年に東欧の体制が次々に崩れ、ベルリンの壁が開かれた。
      1991年のソ連解体で、対立の構図は消える。
      世界を二つに分けた40年余りの枠組みが、ここで終わった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Montage_of_Cold_War_pictures.png/500px-Montage_of_Cold_War_pictures.png
      credit: 麩 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Montage_of_Cold_War_pictures.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/冷戦

events:
  - id: charlemagne-coronation
    year: 800
    title: カール大帝の戴冠
    category: politics
    tags: [フランク, 教皇]
    summary: ローマ教皇が皇帝の冠を授け、西ヨーロッパが独自の「帝国」を持った。
    detail: |
      ローマ教皇レオ3世が、カール大帝に皇帝の冠を授けた出来事。
      800年のクリスマスに、サン・ピエトロ大聖堂で行われた。
      西ヨーロッパが独自の帝国を持ったことを意味する。

      直前の事情がある。
      教皇は反対派に襲われてローマを追われ、カールの保護を求めていた。
      カールがローマへ赴き、教皇の無実を確認した直後の出来事である。
      伝記によれば、祈っていたカールの頭に教皇が冠を載せ、集まった人々が皇帝として歓呼した。
      カール自身は、事前に知らされていれば教会に入らなかったと述べたと記されている。
      この記述をどう読むかは、長く議論されてきた。

      意味は大きかった。
      西方では、ローマ帝国の皇帝位は東のコンスタンティノープルにあると考えられていた。
      当時の東は女性のエイレーネーが帝位にあり、西側はこれを空位とみなす口実を得る。
      東ローマは強く反発し、承認までに10年余りを要した。

      もう一つの含意は、皇帝の冠を教皇が授けるという形式である。
      世俗の最高権力が、宗教的権威によって正当化される構図が生まれた。
      この関係は後に叙任権闘争として衝突を招く。
      神聖ローマ帝国は、この戴冠を自らの起点と位置づけた。
      ヨーロッパの帝国と教会の関係は、この日から1000年にわたって続く枠組みになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/D%C3%BCrer_karl_der_grosse.jpg/500px-D%C3%BCrer_karl_der_grosse.jpg
      credit: アルブレヒト・デューラー / Public domain
      page: https://commons.wikimedia.org/wiki/File:D%C3%BCrer_karl_der_grosse.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カール大帝

  - id: treaty-of-verdun
    year: 843
    title: ヴェルダン条約
    category: politics
    tags: [フランク]
    summary: フランク王国が三分割され、のちのフランス・ドイツ・イタリアの輪郭ができた。
    detail: |
      フランク王国が三つに分割された条約で、843年に結ばれた。
      カール大帝の三人の孫が領土を分け合った。
      フランス・ドイツ・イタリアの輪郭が、ここで生まれる。

      フランク人の慣習では、王国は息子たちに分割して相続された。
      カール大帝の子ルートヴィヒ1世は一人だったため統一が保たれたが、その死後に争いが起きる。
      長男に対し、弟たちが連合して戦った。
      3年の内戦の後、協定が結ばれた。
      東側はルートヴィヒが得て、後の東フランク王国、すなわちドイツになる。
      西側はシャルルが得て、西フランク王国、つまりフランスになる。
      中部はロタールが受け取り、イタリア北部からライン川沿いに北海まで伸びる細長い領域となった。

      中部王国には、皇帝の称号とアーヘンとローマという二つの都が含まれた。
      名目上の威信は高いが、領域は南北に長く、言語も地形もまとまりを欠いていた。
      この中部地域は、その後の争いの舞台になる。
      アルザス・ロレーヌをはじめ、独仏が繰り返し争った地域はここに含まれる。
      20世紀の二つの大戦まで、この分割の影響は続いた。

      言語の面でも、東はゲルマン系、西はロマンス系という区分が確認される。
      条約の前年に交わされた誓約の文書は、それぞれの俗語で書かれた最古級の記録である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Vertrag_von_Verdun_en.svg/500px-Vertrag_von_Verdun_en.svg.png
      credit: User:Furfur, modified by User:Martinvl / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Vertrag_von_Verdun_en.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴェルダン条約

  - id: viking-raids
    year: 793
    title: ヴァイキングの活動が始まる
    category: war
    tags: [北欧, 交易]
    summary: 略奪と交易と植民を同時に行い、ヨーロッパの海と川の世界を塗り替えた。
    detail: |
      北欧のノルマン人による略奪と交易、植民の活動が本格化した出来事。
      793年のイングランド北東部の修道院襲撃が、その始まりとされる。
      以後250年にわたり、ヨーロッパの海と川の世界を塗り替えた。

      彼らは優れた船を持っていた。
      喫水が浅く、外洋も川もさかのぼれる構造で、帆と櫂の両方を使う。
      この機動力によって、内陸の修道院や都市を突然襲うことができた。
      活動は略奪だけではない。
      西へ向かった者はアイスランドとグリーンランドに入植し、北米にも一時的な拠点を築いた。
      東へ向かった者はロシアの河川を下り、ノヴゴロドとキエフの成立に関わる。
      ビザンツ帝国では皇帝の親衛隊として仕えた。

      各地に定住して国家を作った例も多い。
      イングランドではデーンロウと呼ばれる地域を支配し、一時は王位も得る。
      フランスではノルマンディー公領が認められ、その子孫がイングランドを征服した。
      シチリアにもノルマン人の王国が生まれている。

      移動の原因には、人口の増加、土地の不足、王権の強化から逃れる動きなどが挙げられる。
      交易の面では、銀と毛皮と奴隷が北と南を結んだ。
      11世紀にキリスト教が受け入れられ、各地に王国が成立すると活動は収まった。
      海を通じてヨーロッパを結び直した勢力として、その影響は広い。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Svolder%2C_by_Otto_Sinding.jpg/500px-Svolder%2C_by_Otto_Sinding.jpg
      credit: オットー・シンディング / Public domain
      page: https://commons.wikimedia.org/wiki/File:Svolder,_by_Otto_Sinding.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴァイキング

  - id: norman-conquest
    year: 1066
    title: ノルマン・コンクェスト
    category: war
    tags: [イギリス]
    summary: ノルマンディー公がイングランドを征服し、英語と王権の性格が変わった。
    detail: |
      ノルマンディー公ギヨームがイングランドを征服した出来事で、1066年のこと。
      ヘイスティングズの戦いが決着をつけた。
      イングランドの王権と言語の性格が、これによって変わる。

      王エドワードが後継者を明示せずに没し、三人が王位を主張した。
      イングランドの有力者ハロルドが即位するが、ノルウェー王とノルマンディー公も名乗りを上げる。
      ハロルドはまず北部でノルウェー軍を破った。
      その直後、南部に上陸した報せを受けて300キロを急行する。
      10月14日のヘイスティングズの戦いで、疲弊した軍は敗れ、ハロルドは戦死した。

      征服者は、イングランド全土を自らの所有と宣言した。
      土地は家臣に封として与えられ、旧来の貴族層はほぼ入れ替わる。
      各地に城が築かれ、軍事的な支配が固定された。

      影響は言語に強く残った。
      宮廷と裁判ではフランス語が、教会ではラテン語が使われ、英語は庶民の言葉になる。
      数百年のうちに英語は大量のフランス語の語彙を取り込み、語彙の豊かな言語になった。
      家畜の名は英語、その肉の名はフランス語由来という対応は、この時期の社会構造を反映している。
      王がフランスに領地を持つ状態も生まれた。
      イングランド王とフランス王の関係は複雑になり、その延長に百年戦争がある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bc/Bayeux_Tapestry_scene51_Battle_of_Hastings_Norman_knights_and_archers.jpg/500px-Bayeux_Tapestry_scene51_Battle_of_Hastings_Norman_knights_and_archers.jpg
      credit: Myrabella / Public domain
      page: https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_scene51_Battle_of_Hastings_Norman_knights_and_archers.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ノルマン・コンクエスト

  - id: council-of-clermont
    year: 1095
    title: クレルモン教会会議（十字軍の提唱）
    category: religion
    tags: [十字軍, 教皇]
    summary: 聖地回復の呼びかけから、約200年続く東方への軍事遠征が始まった。
    detail: |
      教皇ウルバヌス2世が十字軍を呼びかけた教会会議で、1095年11月に開かれた。
      南フランスのクレルモンで行われた。
      この演説から、約200年続く東方への軍事遠征が始まる。

      直接の契機は、東ローマ皇帝からの援軍要請だった。
      セルジューク朝に小アジアを奪われた帝国が、西欧に傭兵の派遣を求めている。
      教皇は野外で説教を行った。
      東方の同胞が苦しんでいること、聖地への巡礼が妨げられていることを訴える。
      参加する者には罪の償いが免除されると告げた。
      聴衆は、神がそれを望んでいるという叫びで応じたと記録されている。

      演説の正確な内容は分かっていない。
      複数の年代記が異なる記述を残しており、いずれも後から書かれたものである。
      反響は予想を超えた。
      諸侯と騎士だけでなく、農民や貧民も加わる。
      土地を持たない次男以下の騎士にとって、東方は所領を得る機会でもあった。

      西欧の側の事情も大きい。
      領主どうしの私闘が絶えず、教会はその暴力を外へ向けようとしていた。
      教皇が諸侯を動かすことで、その権威を示す機会にもなる。
      翌年から遠征が始まり、1099年にエルサレムが占領された。
      宗教的な呼びかけが大規模な人の移動を生んだ、中世で最大の出来事である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/CouncilofClermont.jpg/500px-CouncilofClermont.jpg
      credit: ジャン・コロンブ / Public domain
      page: https://commons.wikimedia.org/wiki/File:CouncilofClermont.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クレルモン教会会議
    related: [crusades]

  - id: canossa
    year: 1077
    title: カノッサの屈辱
    category: religion
    tags: [教皇, 皇帝]
    summary: 皇帝が教皇に謝罪した事件。聖職者の任命権をめぐる争いの象徴になった。
    detail: |
      神聖ローマ皇帝ハインリヒ4世が、北イタリアのカノッサ城で教皇に赦しを乞うた出来事。
      1077年のことである。
      聖職者の任命権をめぐる争いの象徴として語られてきた。

      争点は、司教や修道院長を誰が任命するかだった。
      皇帝は彼らを統治の要として用いており、任命権は手放せない。
      一方、教皇グレゴリウス7世は、世俗の権力による任命を無効と宣言した。
      ハインリヒは教皇の廃位を宣言し、教皇は皇帝を破門して応じた。
      破門された君主には、臣下が忠誠を守る義務がなくなる。
      ドイツの諸侯はこれを好機として離反し、一定期間内に破門が解かれなければ王を認めないと決議した。

      追い詰められた皇帝は、冬のアルプスを越えて教皇の滞在するカノッサへ向かう。
      城の門の前で三日間、雪のなかで悔悛の姿を示したと伝えられる。
      教皇は司祭として赦しを与えざるをえなかった。

      この出来事は教皇権の頂点として語られる。
      しかし実際には、皇帝が破門を解かせて諸侯の口実を奪った政治的な勝利でもあった。
      数年後、ハインリヒは軍を率いてローマを占領し、教皇は亡命先で没する。
      叙任権の争いは1122年の妥協で決着した。
      宗教的権威と世俗の権力が別の領域を持つという考え方は、この対立を通じて定着していく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/Schwoiser_Heinrich_vor_Canossa.jpg/500px-Schwoiser_Heinrich_vor_Canossa.jpg
      credit: Eduard Schwoiser (1826 — 1902) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Schwoiser_Heinrich_vor_Canossa.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カノッサの屈辱

  - id: university-bologna
    year: 1088
    circa: true
    title: ボローニャ大学の成立
    category: science
    tags: [大学, 学問]
    summary: 学生と教師の組合から生まれ、ヨーロッパの大学制度の出発点になった。
    detail: |
      イタリアのボローニャに生まれた、ヨーロッパ最古とされる大学。
      1088年を創立の年とするのが通例である。
      学生と教師の組合から生まれ、大学という制度の出発点になった。

      きっかけは、ローマ法の再発見だった。
      ユスティニアヌスの法典の写本が見つかり、これを研究する教師のもとに各地から学生が集まる。
      商業の発展とともに、契約や所有を扱う法の知識が実務で必要とされていた。
      他国から来た学生は、市内で法的な保護を持たない。
      そこで学生たちが同郷の組合を作り、家賃や物価を交渉し、教師の給与や講義の質についても取り決めた。
      大学を意味するウニウェルシタスは、もともとこうした組合を指す語である。

      ボローニャでは学生の組合が主導権を握っていた。
      教師が遅刻したり内容が不十分だったりすると罰金が科されたという記録も残る。
      パリでは逆に教師の組合が中心となり、二つの型が生まれた。

      皇帝と教皇は、大学に特権を与えて保護した。
      学位が各地で通用するようになり、卒業生は教会と国家の実務を担う。
      以後、パリ、オックスフォード、サラマンカと各地に大学が生まれた。
      講義、学位、学部という枠組みは、現在の大学にそのまま受け継がれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d0/Seal_of_the_University_of_Bologna.svg/500px-Seal_of_the_University_of_Bologna.svg.png
      credit: Vectorized by User:Nandhp / Public domain
      page: https://commons.wikimedia.org/wiki/File:Seal_of_the_University_of_Bologna.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ボローニャ大学

  - id: magna-carta
    year: 1215
    title: マグナ・カルタ
    category: society
    tags: [イギリス, 法]
    summary: 王も法に従うという原則を文書にした、立憲政治の出発点。
    detail: |
      イングランド王ジョンが諸侯の要求に応じて認めた文書で、1215年のこと。
      大憲章と訳される。
      王も法に従うという原則を記した、立憲政治の出発点とされる。

      直接の原因は、失政と重税である。
      大陸の領地を失い、その回復のために繰り返し課税し、封建的な義務を厳しく取り立てた。
      諸侯は武装してロンドンを占拠し、王に文書の承認を迫る。
      内容は63か条にわたる。
      多くは封建的な慣行の確認で、当時の諸侯の具体的な不満に対応するものだった。
      相続料の上限、未亡人の権利、森林の規制などが並ぶ。

      そのなかに、後に重要とされる条文が含まれていた。
      一般の評議会の同意なく課税しないこと。
      自由人は同輩の合法的な裁判によらなければ逮捕も財産の没収もされないこと。
      この二つが、代表なくして課税なし、そして適正な手続きという原則の源になる。

      王はまもなく教皇に訴えて無効を宣言させ、内戦が起きた。
      しかし王の死後、幼い後継者のもとで再発布され、繰り返し確認される。
      本来は貴族の特権を守る文書だった。
      17世紀の議会と王の争いのなかで、自由の根拠として読み直される。
      アメリカの権利章典や近代の憲法に、その影響は受け継がれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ee/Magna_Carta_%28British_Library_Cotton_MS_Augustus_II.106%29.jpg/500px-Magna_Carta_%28British_Library_Cotton_MS_Augustus_II.106%29.jpg
      credit: Original authors were the barons and King John of England. Uploaded by Earthsound. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Magna_Carta_(British_Library_Cotton_MS_Augustus_II.106).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マグナ・カルタ

  - id: black-death
    year: 1348
    title: 黒死病の大流行
    category: disaster
    tags: [疫病, ヨーロッパ]
    summary: 数年で人口の3分の1が失われ、荘園制と教会の権威が大きく揺らいだ。
    detail: |
      ヨーロッパを襲ったペストの大流行で、1348年前後に最も激しかった。
      数年のあいだに人口の三分の一が失われたと推定される。
      荘園制と教会の権威が、これによって大きく揺らいだ。

      病は中央アジアから交易路を通じて西へ広がった。
      黒海の港からジェノヴァの船で地中海に入り、数年で西欧の全域に達する。
      ネズミとノミが媒介する腺ペストが中心とされる。
      当時の医学は無力だった。
      瀉血や香草の燻煙が行われ、都市は門を閉ざす。
      ユダヤ人が井戸に毒を入れたという流言が広まり、各地で虐殺が起きた。

      社会への影響は大きい。
      働き手が激減したことで農民の立場が強まり、賃金が上がって農奴制が緩んだ。
      領主が賃金を法で抑えようとすると、各地で農民の反乱が起きる。
      土地は余り、囲い込みや牧羊への転換が進んだ。

      祈っても救われなかった経験は、教会への信頼を損なった。
      聖職者も多数が死に、急ごしらえの補充で質が下がる。
      死を主題とする絵画や、鞭打ち苦行のような極端な運動も現れた。
      流行はその後も数十年おきに繰り返された。
      人口が回復するのは16世紀である。
      中世の社会構造が崩れる転換点として、この疫病は位置づけられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/1346-1353_spread_of_the_Black_Death_in_Europe_map.svg/500px-1346-1353_spread_of_the_Black_Death_in_Europe_map.svg.png
      credit: Flappiefh / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:1346-1353_spread_of_the_Black_Death_in_Europe_map.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/黒死病

  - id: joan-of-arc
    year: 1429
    title: ジャンヌ・ダルクのオルレアン解放
    category: war
    tags: [フランス, 百年戦争]
    summary: 劣勢のフランスを立て直し、王国としてのまとまりを取り戻す転機になった。
    detail: |
      ジャンヌ・ダルクがオルレアンの包囲を解いた出来事で、1429年5月のこと。
      百年戦争の転換点とされる。
      劣勢だったフランスが、王国としてのまとまりを取り戻す契機になった。

      当時のフランスは危機にあった。
      国王は精神を病み、王妃と諸侯が争い、ブルゴーニュ派はイングランドと結んでいる。
      パリはイングランドの支配下にあり、王太子シャルルは戴冠もできずにいた。
      オルレアンはロワール川を守る最後の要で、ここが落ちれば南フランスも危うい。

      ジャンヌは王太子のもとを訪れ、神の使命を告げて軍に加わることを求めた。
      審査の末に許され、旗を掲げて前線に立つ。
      到着後、彼女は積極的な攻勢を主張した。
      守りに徹していた指揮官たちを動かし、包囲の拠点を次々に攻める。
      9日でイングランド軍は撤退した。

      勝因は軍事的な才能というより、士気の回復にあったとされる。
      神が味方しているという確信が、兵と市民を動かした。
      この勝利の後、ロワール流域の城が次々に奪回される。
      7月にはランスで王太子が戴冠し、シャルル7世となった。
      正統な王が生まれたことで、各地の勢力が王のもとへ集まり始める。
      フランスという単位への帰属意識が、この過程で育っていった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Lenepveu%2C_Jeanne_d%27Arc_au_si%C3%A8ge_d%27Orl%C3%A9ans.jpg/500px-Lenepveu%2C_Jeanne_d%27Arc_au_si%C3%A8ge_d%27Orl%C3%A9ans.jpg
      credit: ジュール＝ウジェーヌ・ルヌヴー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Lenepveu,_Jeanne_d%27Arc_au_si%C3%A8ge_d%27Orl%C3%A9ans.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/オルレアン包囲戦

  - id: gutenberg-press
    year: 1450
    circa: true
    title: グーテンベルクの活版印刷
    category: science
    tags: [技術, 出版]
    summary: 本の複製費用が激減し、知識の広がる速さが一変した。
    detail: |
      ヨハネス・グーテンベルクが活版印刷の技術を実用化した出来事で、1450年ごろのこと。
      本の複製にかかる費用と時間が激減した。
      知識が広がる速さが、これによって一変する。

      中心にあるのは、金属の活字を組み合わせて版を作る方法である。
      同じ形の活字を大量に鋳造する技術、インクを紙に均等に移す油性インク、圧力をかける印刷機が組み合わされた。
      活字自体は中国や朝鮮で先に作られていたが、漢字の数が多く、鋳造と組版の効率が異なる。
      表音文字と機械的な圧搾の組み合わせが、この技術を実用にした。

      最初の大きな仕事は、聖書の印刷である。
      180部ほどが作られ、そのうち数十部が現存する。
      効果は急速だった。
      写本では一冊の複製に数か月を要したものが、短期間で数百部作れる。
      書物の値段は大幅に下がり、50年のうちにヨーロッパの印刷所は1000か所を超えた。

      影響は多方面に及ぶ。
      ルターの論題は数週間でドイツ中に広まり、宗教改革を可能にした。
      科学の論文が正確な図版とともに共有され、同じ本文を各地の学者が参照できるようになる。
      各国語で書かれた書物が国民的な言語を育てた。
      グーテンベルク自身は訴訟に敗れて設備を失い、大きな富を得ていない。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1b/Die_Buchdruckerei_by_Daniel_Chodowiecki_%28150289207%29.jpg/500px-Die_Buchdruckerei_by_Daniel_Chodowiecki_%28150289207%29.jpg
      credit: ダニエル・ホドヴィエツキ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Die_Buchdruckerei_by_Daniel_Chodowiecki_(150289207).jpg
    links:
