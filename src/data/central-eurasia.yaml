  - id: plague-spreads-west
    year: 1346
    title: ペストの西方への拡散
    category: disaster
    tags: [疫病, 交易路]
    summary: 交易路を通って黒海からヨーロッパへ広がり、翌年から大流行になった。
    detail: |
      ペストの第二の大流行は、中央アジアの草原地帯が起点とみられている。
      近年、キルギスのイシク・クル湖畔にある14世紀半ばの墓地の遺骨からペスト菌が検出され、1338年から1339年の流行が裏づけられた。
      そこから病は交易路を伝って東西へ広がった。
      東では元の華北に達し、西へはキャラバンと船に乗って黒海沿岸へ向かう。
      モンゴルの平和がもたらした活発な往来が、そのまま感染の経路になった。
      1346年、クリミア半島のカッファを包囲していたジョチ・ウルスの軍の陣中で流行が起きる。
      攻めきれなくなった軍が、死者を投石機で城内へ投げ込んだという話が、当時のジェノヴァ人ガブリエーレ・デ・ムッシの記述として伝わる。
      この逸話の真偽は議論があるが、包囲が解けたあとカッファから逃れたジェノヴァの商船が病を運んだことは確かである。
      1347年秋、船はコンスタンティノープル、メッシーナ、ジェノヴァ、マルセイユへ次々に到着した。
      港に着いた船では乗員の多くがすでに死んでいたと記録されている。
      上陸を拒まれても、船に潜むネズミとノミが病を岸へ運んだ。
      1348年にはイタリア半島とフランス、イベリア半島、イングランドへ、1349年には中欧と北欧へ広がる。
      三、四年でヨーロッパの人口の三分の一前後が失われたとされる。
      医学は無力で、原因はミアズマ（悪い空気）や星の配置に求められた。
      ユダヤ人が井戸に毒を入れたという噂が広まり、各地で虐殺が起きている。
      この人口減少は、労働力の不足から農奴制の緩みや賃金の上昇を招き、ヨーロッパ社会の仕組みを長期的に変えていった。
      検疫を意味する quarantine の語も、上陸前に四十日待たせたこの時代の措置に由来する。
      近年のゲノム解析によって、この流行の病原体が現在のペスト菌と同系統であることが確認され、発生地を中央アジアに絞る手がかりも得られている。
