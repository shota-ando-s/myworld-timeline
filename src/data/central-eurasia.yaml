  - id: belt-and-road
    year: 2013
    title: 一帯一路構想
    category: economy
    tags: [中国, 中央アジア]
    summary: 内陸の交通路を再び主役にしようとする試み。シルクロードの現代版を掲げる。
    detail: |
      2013年、中国の習近平国家主席がカザフスタンとインドネシアでの演説で、陸の「シルクロード経済ベルト」と海の「21世紀海上シルクロード」を提唱した。
      これが一帯一路と呼ばれる構想の出発点である。
      内容は、鉄道・道路・港湾・パイプライン・通信網への投資を通じて、中国とアジア・ヨーロッパ・アフリカを結ぶというものだった。
      対象国は140を超える。
      背景には複数の事情がある。
      国内の鉄鋼・セメント・建設業の過剰な生産力のはけ口、内陸部の開発、エネルギー輸送路をマラッカ海峡だけに頼らない分散、そして人民元の国際化である。
      資金は中国の政策金融機関やシルクロード基金、アジアインフラ投資銀行（AIIB）から供給された。
      中国企業が受注し、中国の労働者が施工する形が多い。
      中央アジアはこの構想の中心にあたる。
      中国からカザフスタンを通ってヨーロッパへ向かう貨物列車が定期運行され、トルクメニスタンからの天然ガスパイプラインも敷かれた。
      海路より速く空路より安い輸送手段として、一定の需要をつかんでいる。
      一方で批判も強い。
      スリランカのハンバントタ港が債務と引き換えに99年の運営権を中国企業へ渡した例は「債務の罠」として繰り返し取り上げられた。
      事業の採算性、環境評価、透明性を欠く契約も問題視されている。
      中国側はこれを反論し、相手国の要請に基づく協力だと説明してきた。
      実際、債務の多くは他の債権者や国際機関から生じているという指摘もある。
      2020年代に入り、新規の融資額は縮小し、大型の土木事業から、より小規模で環境や技術に重きを置く案件へ重心が移りつつある。
      内陸の交通路を再び主役にしようという試みが、千年ぶりに国家の戦略として掲げられたことは確かである。
      日本や欧米も、これに対抗する形でインフラ支援の枠組みを打ち出した。
      21世紀の大陸の交通路をめぐる競争は、まだ始まったばかりである。
