    related: [black-death]

  - id: timur-enthroned
    year: 1370
    title: ティムールの即位
    category: politics
    tags: [中央アジア]
    summary: 破壊と建設を同時に行い、サマルカンドを世界有数の都市に育てた。
    detail: |
      14世紀半ばのマー・ワラー・アンナフルは、チャガタイ・ウルスの分裂によって統一を失い、トルコ・モンゴル系の有力者が入り乱れて争う状態にあった。
      東のモグーリスタンからの介入も繰り返されている。
      ティムールはバルラス部の小領主の出身で、はじめモグーリスタンのハンに仕え、次いで義兄弟であるカザガン家のフサインと結んだ。
      両者は協力と対立を繰り返しながら勢力を広げていく。
      1370年、ティムールはバルフを攻めてフサインを倒し、単独の支配者となった。
      同年、バルフで催された集会で諸部族の支持を取りつけ、君主の座に就く。
      ここで問題になったのが正統性だった。
      草原の世界では、君主＝ハンを名乗れるのはチンギス・ハンの血を引く者に限られる。
      バルラス部出身のティムールにその資格はなかった。
      そこで彼は「大アミール（アミーレ・カビール）」を称し、チャガタイ家の男子を名目上のハンとして立てた。
      さらにチンギスの子孫の娘を妃に迎え、「キュレゲン（駙馬、ハンの婿）」の称号を用いる。
      血が足りない分を、形式で埋めたのである。
      同時に、イスラムの守護者という立場も前面に出した。
      異教徒やシーア派への遠征を聖戦として説明し、スーフィーの長老たちの支持を得ている。
      モンゴルの伝統とイスラムの権威、二つの正統性を使い分ける統治だった。
      この即位から没するまでの三十五年間、ティムールはほとんど戦場にいた。
      中央アジアからアナトリア、北インドまでを覆う版図は、一代で築かれることになる。
      チンギス裔でない者が広域を支配するという前例は、以後の中央アジアの政治のあり方にも影響を残した。
      1370年という年は、モンゴル帝国の秩序が中央アジアで終わり、トルコ・イスラム的な国家に置き換わる区切りとして扱われる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/43/Tamerlan.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tamerlan.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール

  - id: ankara-battle
    year: 1402
    title: アンカラの戦い
    category: war
    tags: [ティムール, オスマン]
    summary: ティムールがオスマン皇帝を捕らえ、オスマンは一時崩壊状態になった。
    detail: |
      14世紀末、東からティムールが、西からオスマン帝国のバヤズィト1世が、それぞれアナトリアへ勢力を広げて接した。
      両者は書簡を交わしたが、互いに相手を格下と見なす文面が事態を悪化させたと伝えられる。
      直接のきっかけは、ティムールに追われた東アナトリアの君侯がバヤズィトのもとへ逃げ込み、逆にオスマンに領地を奪われた君侯がティムールに保護を求めたことだった。
      双方が相手の敵をかくまう形になる。
      1402年7月、両軍はアンカラ近郊のチュブクの平原で対峙した。
      ティムール軍はインド遠征で得た象部隊を含み、兵力でも上回っていたとされる。
      ティムールは事前に水場を押さえ、オスマン軍を炎天下で渇かせた。
      さらに、アナトリアの旧君侯の家臣たちに呼びかけて寝返らせる工作を進めていた。
      戦闘が始まると、オスマン軍に加わっていたアナトリア諸侯の兵が次々に離反する。
      セルビア人部隊とイェニチェリは踏みとどまったが大勢は決し、バヤズィトは捕らえられた。
      スルタンは丁重に扱われたとも、鉄の檻に入れられて連れ回されたとも伝えられる。
      後者は後世の脚色とみられるが、ヨーロッパでは広く信じられ、戯曲や絵画の題材になった。
      彼は翌1403年に捕囚のまま没する。
      オスマン帝国は君主を失い、四人の王子が争う「空位時代」に入った。
      十一年にわたる内戦で国家は事実上解体し、バルカンの征服も止まる。
      この結果、風前の灯だったコンスタンティノープルは半世紀の猶予を得た。
      ビザンツ帝国の滅亡が1453年まで延びたのは、この戦いによるところが大きい。
      ティムール自身はアナトリアに留まらず、旧君侯たちに領地を返して引き上げた。
      彼の関心は最初から西方の征服ではなく、東の明にあった。
      捕らえられたバヤズィトの運命は、マーロウやヘンデルの作品をはじめ、ヨーロッパの舞台芸術で繰り返し取り上げられた。
