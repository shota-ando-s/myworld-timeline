  - id: turkic-islam
    year: 960
    circa: true
    title: トルコ系遊牧民のイスラム受容
    category: religion
    tags: [イスラム, トルコ系]
    summary: 草原とイスラム世界が結びつき、以後の西アジア支配層はトルコ系になる。
    detail: |
      10世紀、中央アジアの宗教地図が大きく塗り替わった。
      カラハン朝の君主サトゥク・ブグラ・ハンの改宗を先駆けに、草原とオアシスの境目にいたテュルク系の集団が次々とイスラムを受け入れていく。
      960年ごろには二十万帳が集団で改宗したと伝えられる。
      背景には、サーマーン朝を通じた交流の蓄積があった。
      ブハラやサマルカンドの商人と神秘主義の説教者が草原へ入り、逆にテュルク系の若者は軍人奴隷（マムルーク）として南のイスラム諸王朝へ売られていた。
      日々の接触の厚みが、改宗を受け入れやすくしていた。
      この変化がもたらした影響は大きい。
      それまで、イスラム世界にとって北方の遊牧民は略奪者であり、信仰の外にいる者だった。
      改宗後は、同じ信仰を持つ勇猛な戦士として迎えられ、軍の中枢に入っていく。
      11世紀には、セルジューク朝がバグダードに入ってカリフからスルタンの称号を得る。
      以後、アラブでもペルシアでもないテュルク系の集団が、イスラム世界の政治と軍事を担う時代が続いた。
      マムルーク朝もオスマン帝国も、この流れの上にある。
      東側でも同じことが起きた。
      カラハン朝がタリム盆地へ広がり、仏教国だったホータンを1006年ごろに征服する。
      中央アジアの仏教は後退し、この地はイスラム圏へ組み込まれていった。
      遊牧民の軍事力とイスラムの制度・文化が結びついたこの世紀は、ユーラシアの中央部の性格を決めた転換点として扱われる。
      改宗の担い手として大きかったのが、スーフィーと呼ばれる神秘主義者たちだった。
      教義よりも修行と体験を重んじる彼らのあり方は、シャーマニズムの伝統を持つ遊牧社会に受け入れられやすかったとされる。
      中央アジアで活動したヤサヴィーの教団は、トルコ語で詩を詠んで教えを説き、草原へイスラムを広げた。
      ティムールが彼の廟を建てたことでも知られる。
      この改宗によって、中央アジアはイスラム世界の東の端ではなく、その中心のひとつになった。
      ブハラ、サマルカンド、ウルゲンチから多くの学者が出ている。
