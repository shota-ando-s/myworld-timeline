lane: central-eurasia

periods:
  - id: scythians
    title: スキタイ
    start: -700
    startCirca: true
    end: -300
    endCirca: true
    category: war
    tags: [遊牧, 黒海]
    summary: 騎馬と黄金細工で知られる最初期の遊牧国家。ギリシア人が詳しく記録した。
    detail: |
      黒海北岸の草原で、前7世紀ごろから勢力を持った騎馬遊牧の集団。
      馬具と黄金の獣文様の装飾を大量に残し、ヘロドトスが『歴史』に生活と葬制を書きとめた。
      ダレイオス1世の遠征を、退きながら消耗させて退けたことでも知られる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スキタイ

  - id: xiongnu
    title: 匈奴
    start: -209
    end: 155
    endCirca: true
    category: politics
    tags: [遊牧, モンゴル高原]
    summary: 漢と対峙した最初の遊牧帝国。草原の国家のひな型になった。
    detail: |
      モンゴル高原を本拠に、単于を頂点とする連合として漢と向き合った。
      前2世紀には月氏を西へ追い、白登山で漢の高祖を囲んで和親と歳幣を認めさせている。
      武帝の反攻で後退し、1世紀には南北に分裂して南匈奴は漢に服属した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/匈奴

  - id: silk-road
    title: シルクロード交易
    start: -130
    end: 1450
    endCirca: true
    category: economy
    tags: [交易, ユーラシア]
    summary: 絹・馬・紙・宗教・病が同じ道を通った。東西を結ぶ1500年の動脈。
    detail: |
      一人の商人が端から端まで運んだのではなく、オアシス都市をつなぐリレーで物が動いた。
      仏教・マニ教・ネストリウス派・イスラムも同じ道を東へ進み、14世紀のペストもこの経路をたどったとされる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シルクロード

  - id: rouran
    title: 柔然
    start: 402
    end: 555
    category: politics
    tags: [遊牧, モンゴル高原]
    summary: 北魏と対立した草原の帝国。「可汗」の称号を初めて用いたとされる。
    detail: |
      北魏と争いながらモンゴル高原を支配し、君主が「可汗」を名乗った最初の遊牧国家とされる。
      北魏は何度も大軍を出し、長城を修築して備えた。
      552年、隷属させていた突厥の反乱に敗れて滅んだ。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/柔然

  - id: gokturk
    title: 突厥
    start: 552
    end: 744
    category: politics
    tags: [遊牧, トルコ系]
    summary: モンゴル高原から中央アジアまで支配し、独自の文字を残した。
    detail: |
      552年に柔然を倒したブミンが可汗を称し、東は満洲、西はカスピ海に及ぶ版図を築いた。
      583年に東西へ分かれ、東突厥は630年に唐へ服属。
      682年に再興したが744年にウイグルに倒された。
      オルホン碑文に古代テュルク文字の記録を残している。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/突厥

  - id: khazar
    title: ハザール
    start: 650
    end: 969
    category: economy
    tags: [遊牧, 交易]
    summary: ビザンツとイスラムの間で交易を握り、支配層がユダヤ教を受け入れた珍しい国。
    detail: |
      ヴォルガ川下流を本拠に、カスピ海と黒海を結ぶ交易路を押さえた。
      北上するアラブ軍をコーカサスで食い止め、ビザンツと手を結んだ。
      8〜9世紀に支配層がユダヤ教を受け入れ、965年にキエフ公スヴャトスラフに敗れて衰えた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ハザール

  - id: uyghur-khaganate
    title: ウイグル可汗国
    start: 744
    end: 840
    category: politics
    tags: [遊牧, トルコ系]
    summary: 唐と結んで安史の乱の鎮圧を助け、交易で栄えた。
    detail: |
      744年に東突厥を倒してモンゴル高原を継ぎ、安史の乱では唐へ援軍を送って長安の奪回を助けた。
      見返りに絹と馬を交換する交易で利を得て、ソグド商人を介してマニ教を受け入れた。
      840年、北のキルギスの攻撃で崩れた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/回鶻

  - id: mongol-empire
    title: モンゴル帝国
    start: 1206
    end: 1368
    category: war
    tags: [モンゴル, 遊牧]
    summary: 史上最大の陸上帝国。ユーラシアが一つの交通圏になった。
    detail: |
      駅伝制で情報と人が速く動き、商人と技術者が保護された。
      一方で抵抗した都市には徹底した破壊を加え、灌漑を失った地域は回復しなかった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モンゴル帝国

  - id: chagatai
    title: チャガタイ・ハン国
    start: 1227
    end: 1370
    category: politics
    tags: [モンゴル, 中央アジア]
    summary: 中央アジアを受け継いだモンゴルの一国。やがてトルコ化・イスラム化した。
    detail: |
      チンギスの次男チャガタイの一族が中央アジアを受け継いだ国。
      14世紀に東西へ割れ、西はトルコ語化とイスラム化が進んでティムールを生み、東のモグーリスタンは遊牧の暮らしを保った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チャガタイ・ウルス

  - id: golden-horde
    title: キプチャク・ハン国
    start: 1242
    end: 1502
    category: politics
    tags: [モンゴル, ロシア]
    summary: 南ロシアの草原を支配し、ルーシ諸公を240年従属させた。
    detail: |
      バトゥが築いた国で、ヴォルガ下流のサライを都に南ロシアの草原を支配した。
      ルーシ諸公は貢納と即位の承認を受けに赴く立場に置かれる。
      14世紀にイスラムを国教とし、ティムールの攻撃と内紛で分裂していった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジョチ・ウルス

  - id: timurid
    title: ティムール朝
    start: 1370
    end: 1507
    category: politics
    tags: [中央アジア]
    summary: サマルカンドを都にモンゴルの再興を掲げ、学芸を保護した。
    detail: |
      ティムールが築いた国で、サマルカンドとヘラートを中心にペルシア語の文芸とミニアチュールが栄えた。
      チンギス裔でないティムールは「大アミール」を称し、ハンを立てて統治の正統性を繕った。
      ウズベクのシャイバーニー朝に追われて滅びる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール朝

  - id: dzungar-khanate
    title: ジュンガル
    start: 1634
    end: 1757
    category: war
    tags: [遊牧, 清]
    summary: 最後の遊牧帝国。清とロシアに挟まれて滅び、草原の時代が終わった。
    detail: |
      オイラト系の部族連合が天山北麓に築いた国で、チベット仏教を奉じ、ロシアから火器を入れて清と争った。
      人口と物資を登録して税と兵を集める仕組みを持ち、遊牧国家としては例外的に中央集権が進んでいた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジュンガル

  - id: russian-central-asia
    title: ロシアの中央アジア征服
    start: 1865
    end: 1895
    category: war
    tags: [ロシア, 中央アジア]
    summary: 30年でオアシス都市が次々に併合され、草原がロシア帝国の一部になった。
    detail: |
      タシケント占領を足がかりに、ロシアはブハラ・ヒヴァを保護国とし、コーカンドを併合してトルキスタン総督府を置いた。
      鉄道が敷かれ、本国の紡績業のための綿花が大規模に作られるようになる。
      イギリス領インドとの間の緩衝地帯をめぐる駆け引きも続いた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/トルキスタン総督府

  - id: soviet-central-asia
    title: ソ連下の中央アジア
    start: 1924
    end: 1991
    category: politics
    tags: [ソ連, 中央アジア]
    summary: 民族ごとに共和国の線が引かれ、綿花の単作とアラル海の縮小が進んだ。
    detail: |
      民族ごとに区切られた共和国が置かれ、アラビア文字はラテン文字を経てキリル文字に改められた。
      遊牧民は定住させられ、農地は灌漑して綿花に充てられる。
      この単作と取水が、のちのアラル海の縮小を招いた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ソビエト連邦

events:
  - id: yuezhi-defeat
    year: -176
    circa: true
    title: 匈奴が月氏を破る
    category: war
    tags: [遊牧, 中央アジア]
    summary: 追われた月氏が西へ移動し、のちにクシャーナ朝を生む連鎖が始まった。
    detail: |
      冒頓単于と次の老上単于の攻撃で、月氏は本拠の河西回廊を追われて西のアム川方面へ移った。
      その地でバクトリアを従えた一派から、のちにクシャーナ朝が興る。
      漢はこの月氏と結ぼうとして張騫を送り、西域への道が開けた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/匈奴

  - id: huns-westward
    year: 375
    title: フン族の西進とゲルマン民族大移動
    category: war
    tags: [遊牧, ヨーロッパ]
    summary: 草原の一押しがヨーロッパ全体を動かし、西ローマ滅亡の連鎖につながった。
    detail: |
      フン族がドン川を越えて東ゴートを破り、押された西ゴートがローマ領内への移住を願い出た。
      以後ゲルマン諸族が次々と国境を越え、属州の支配が崩れていく。
      この連鎖が最終的に西ローマ帝国の解体につながった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ゲルマン人
    related: [west-rome-fall]

  - id: attila
    year: 451
    title: アッティラのガリア遠征
    category: war
    tags: [フン族, ヨーロッパ]
    summary: 「神の鞭」と恐れられた王の進撃がカタラウヌムで止まった。
    detail: |
      アッティラの軍がライン川を越えてガリアに入り、オルレアンを包囲した。
      西ローマのアエティウスは西ゴート王テオドリックと組んで迎え撃ち、カタラウヌムの野の激戦で進撃を止めた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カタラウヌムの戦い

  - id: gokturk-submits
    year: 630
    title: 東突厥が唐に服属
    category: war
    tags: [突厥, 唐]
    summary: 唐の皇帝が遊牧世界の盟主「天可汗」を兼ねる体制が生まれた。
    detail: |
      内紛と寒波で弱った東突厥を唐が攻め、頡利可汗を捕らえた。
      唐の太宗は草原の諸部族から「天可汗」と呼ばれ、中華の皇帝が遊牧世界の盟主を兼ねる形ができた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/東突厥

  - id: talas
    year: 751
    title: タラス河畔の戦い
    category: war
    tags: [イスラム, 唐, 技術伝播]
    summary: 唐がアッバース朝に敗れ、この時に製紙法が西へ伝わったとされる。
    detail: |
      中央アジアの支配をめぐり、唐の高仙芝の軍とアッバース朝の軍がタラス川のほとりで衝突した。
      味方のカルルクが寝返って唐軍は大敗し、西方への進出はここで止まる。
      捕虜の職人から製紙法がサマルカンドへ伝わったと伝えられる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/タラス河畔の戦い

  - id: uyghur-collapse
    year: 840
    title: キルギスによるウイグル可汗国の崩壊
    category: war
    tags: [遊牧]
    summary: ウイグル人が西へ移り、今の新疆のトルコ系社会の原型になった。
    detail: |
      飢饉と内紛で弱ったところへ北のキルギスが攻め込み、可汗が殺されて国は崩れた。
      逃れたウイグル人は天山東部や河西のオアシスへ移り、農耕と都市の生活に移っていく。
      これが今の新疆のテュルク系社会の元になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/回鶻

  - id: turkic-islam
    year: 960
    circa: true
    title: トルコ系遊牧民のイスラム受容
    category: religion
    tags: [イスラム, トルコ系]
    summary: 草原とイスラム世界が結びつき、以後の西アジア支配層はトルコ系になる。
    detail: |
      カラハン朝の改宗を境に、草原のテュルク系集団が次々とイスラムを受け入れた。
      彼らははじめ傭兵や軍人奴隷としてイスラム世界に入り、やがてセルジューク朝・マムルーク朝・オスマン帝国と、支配する側へ回っていく。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カラハン朝

  - id: chinggis-khan
    year: 1206
    title: チンギス・ハンの即位
    category: politics
    tags: [モンゴル]
    summary: 分裂していた草原の諸部族を統合し、世界征服の出発点となった。
    detail: |
      オノン川の源でクリルタイが開かれ、テムジンがチンギス・カンの称号を受けた。
      長く争ってきたタタル・ケレイト・ナイマンなどが一つの軍事組織に組み替えられ、遠くへ出せる軍が生まれた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チンギス・カン

  - id: mongol-central-asia
    year: 1219
    title: モンゴルの中央アジア遠征
    category: war
    tags: [モンゴル]
    summary: ホラズムを壊滅させ、西方への道を開いた。
    detail: |
      送った通商使節が殺されたことを口実にホラズム・シャー朝へ侵攻し、ブハラ・サマルカンド・ウルゲンチを次々に落とした。
      抵抗した都市は徹底して破壊され、灌漑施設の荒廃は長く尾を引いた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モンゴル帝国

  - id: chinggis-death
    year: 1227
    title: チンギス・ハンの死と帝国の分割
    category: politics
    tags: [モンゴル]
    summary: 息子たちに領地が分けられ、ユーラシアに四つのモンゴル国家が並んだ。
    detail: |
      西夏遠征の途上で没し、遺言に従って息子たちの系統に領地が分けられた。
      中央はトルイ家、中央アジアはチャガタイ家、西方はジョチ家が受け継ぎ、クリルタイの推戴でオゴデイが第2代カアンに就いた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モンゴル帝国

  - id: legnica
    year: 1241
    title: ワールシュタットの戦い
    category: war
    tags: [モンゴル, ヨーロッパ]
    summary: モンゴル軍がポーランド・ドイツ連合軍を破り、西欧に衝撃を与えた。
    detail: |
      バトゥの西征軍の一隊がポーランドに入り、レグニツァ近郊でシロンスク公ヘンリク2世の率いる諸侯軍を破った。
      軽騎兵の機動と偽りの退却に西欧の重装騎兵は対応できず、ヨーロッパは初めてモンゴルの戦い方を知った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ワールシュタットの戦い

  - id: pax-mongolica
    year: 1260
    circa: true
    title: モンゴルの平和
    category: economy
    tags: [モンゴル, 交易]
    summary: 一つの権力の下で東西の往来が安全になり、人と技術と情報が大量に動いた。
    detail: |
      駅伝（ジャムチ）と通行証によって、ユーラシアを横断する旅が現実的なものになった。
      商人・宣教師・技術者が行き交い、火薬や印刷、イスラムの天文学が東西へ移る。
      同じ道を病もたどり、14世紀のペスト流行につながったとみられる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/パクス・モンゴリカ

  - id: marco-polo
    year: 1271
    title: マルコ・ポーロの東方旅行
    category: economy
    tags: [交易, ヨーロッパ]
    summary: 『東方見聞録』がヨーロッパにアジアへの憧れを植えつけた。
    detail: |
      ヴェネツィアの商人一家が陸路で大都に至り、クビライに仕えたと伝えられる。
      帰国後、ジェノヴァの獄中で語った話が『東方見聞録』にまとめられ、黄金の国ジパングなどの記述がヨーロッパの東方への関心をかき立てた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マルコ・ポーロ

  - id: plague-spreads-west
    year: 1346
    title: ペストの西方への拡散
    category: disaster
    tags: [疫病, 交易路]
    summary: 交易路を通って黒海からヨーロッパへ広がり、翌年から大流行になった。
    detail: |
      中央アジアから交易路を伝って黒海沿岸に達し、クリミアのカッファを囲んだジョチ・ウルス軍の陣中で広がった。
      逃れた商船がコンスタンティノープルとシチリアへ運び、翌1347年から地中海沿岸で大流行が始まった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ペストの歴史
    related: [black-death]

  - id: timur-enthroned
    year: 1370
    title: ティムールの即位
    category: politics
    tags: [中央アジア]
    summary: 破壊と建設を同時に行い、サマルカンドを世界有数の都市に育てた。
    detail: |
      中央アジアの内紛を勝ち抜いたティムールが、バルフで君主の座に就いた。
      チンギス裔でないため「ハン」ではなく「アミール」を名乗り、チャガタイ家の血を引く者を傀儡のハンに立てて正統性を補った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール

  - id: ankara-battle
    year: 1402
    title: アンカラの戦い
    category: war
    tags: [ティムール, オスマン]
    summary: ティムールがオスマン皇帝を捕らえ、オスマンは一時崩壊状態になった。
    detail: |
      小アジアに攻め込んだティムール軍が、バヤズィト1世のオスマン軍を破ってスルタンを捕虜にした。
      オスマン帝国は君主を失って息子たちの争いに陥り、十数年のあいだ事実上解体する。
      コンスタンティノープルの命はこれで半世紀延びた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アンカラの戦い

  - id: ulugh-beg
    year: 1420
    title: ウルグ・ベクの天文台
    category: science
    tags: [中央アジア, 天文学]
    summary: 肉眼観測で当時世界最高精度の星表を作り、ヨーロッパにも影響した。
    detail: |
      ティムールの孫ウルグ・ベクがサマルカンドに築いた天文台。
      半径40メートルを超える巨大な六分儀で観測を重ね、1年の長さを現在の値と数秒しか違わない精度で求めた。
      ここで作られた星表は17世紀にヨーロッパでも刊行された。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウルグ・ベク天文台

  - id: timur-death
    year: 1405
    title: ティムールの死
    category: politics
    tags: [中央アジア, 明]
    summary: 明への遠征の途上で没し、中央アジアの統一は続かなかった。
    detail: |
      明への遠征に出た直後、シル川沿いのオトラルで病死した。
      遠征はただちに中止され、広げた版図は息子と孫の争いで割れていく。
      一代の武力で結ばれていた帝国のもろさがはっきり出た。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール

  - id: uzbek-shaybanid
    year: 1500
    circa: true
    title: ウズベクの中央アジア支配
    category: politics
    tags: [中央アジア]
    summary: ティムール朝が倒れ、オアシス都市がハン国に分かれていく。
    detail: |
      ウズベクの諸部族が南下してティムール朝の版図を受け継ぎ、ブハラ・ヒヴァ・のちにコーカンドと、オアシスごとのハン国に分かれていった。
      遊牧の支配層と定住の農民・商人が組み合わさる体制が、ロシアの征服まで続く。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウズベク人

  - id: kazan-conquest
    year: 1552
    title: ロシアのカザン征服
    category: war
    tags: [ロシア, 遊牧]
    summary: 定住国家が火器で草原を押し返し始めた転換点。
    detail: |
      イヴァン4世が大砲と工兵を投入してカザンを落とし、ヴォルガ川中流のタタール政権を併合した。
      4年後にはアストラハンも取り、ロシアはヴォルガ全流域とカスピ海への道を得る。
      以後の東方進出の起点になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カザン・ハン国

  - id: steppe-decline
    year: 1600
    circa: true
    title: 草原の交易路の後退
    category: economy
    tags: [交易, 航海]
    summary: 海路が主役になり、1500年続いた内陸の交易が相対的に沈んでいった。
    detail: |
      喜望峰まわりの航路が定着し、大量の物資が船で運ばれるようになると、ラクダの隊商に頼る内陸路は割に合わなくなっていった。
      オアシス都市の収入は細り、草原の政権は火器を持つ清とロシアに挟まれていく。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シルクロード

  - id: dzungar-fall
    year: 1757
    title: ジュンガルの滅亡
    category: war
    tags: [清, 遊牧]
    summary: 最後の遊牧帝国が清に滅ぼされ、草原の時代が終わった。
    detail: |
      内紛に乗じた乾隆帝の遠征で政権は崩れ、天然痘の流行も重なって住民の多くが失われた。
      空いた土地には各地から人が移され、この地は「新疆」と呼ばれるようになる。
      草原から中華を脅かす勢力は、これを最後に現れなかった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジュンガル

  - id: tashkent-taken
    year: 1865
    title: ロシアのタシケント占領
    category: war
    tags: [ロシア, 中央アジア]
    summary: 英露が中央アジアで勢力を競う「グレート・ゲーム」が本格化した。
    detail: |
      チェルニャーエフの部隊が中央アジア最大の都市タシケントを攻め落とし、ロシアの南下が本格化した。
      イギリスはインドへの脅威と受け止め、以後アフガニスタンを挟んだ両国の駆け引きが半世紀続く。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/タシュケント

  - id: anglo-russian-entente
    year: 1907
    title: 英露協商
    category: politics
    tags: [中央アジア, 外交]
    summary: 中央アジアでの争いに区切りをつけ、両国はドイツに向き合うことになった。
    detail: |
      イラン・アフガニスタン・チベットでの勢力範囲を取り決め、中央アジアをめぐる英露の対立に区切りをつけた。
      これで英仏協商・露仏同盟とあわせて三国協商が成立し、両国は台頭するドイツに向き合うことになる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/英露協商

  - id: central-asia-republics
    year: 1924
    title: 中央アジアの民族別共和国化
    category: politics
    tags: [ソ連, 民族]
    summary: ソ連が引いた民族の線引きが、現在の5か国の国境になっている。
    detail: |
      それまで「トルキスタン」と一括りにされていた地域に、言語と民族を基準としてウズベク・トルクメン・タジクなどの共和国が線引きされた。
      実際には入り組んでいた住民分布を直線で割ったため、この線が独立後の国境問題として残っている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/中央アジア

  - id: aral-sea
    year: 1960
    circa: true
    title: アラル海の縮小が始まる
    category: disaster
    tags: [中央アジア, 環境]
    summary: 綿花のための灌漑で湖の大半が消え、20世紀最大級の環境破壊とされる。
    detail: |
      アム川とシル川から綿花畑へ大量に取水した結果、流れ込む水が減り、湖面が急速に後退しはじめた。
      数十年で面積の9割近くが失われ、漁港は砂漠の中に取り残された。
      干上がった湖底からの塩と農薬の粉塵が周辺の健康被害を生んでいる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アラル海

  - id: central-asia-independence
    year: 1991
    title: 中央アジア5か国の独立
    category: politics
    tags: [中央アジア, 現代]
    summary: ソ連解体で、望まないまま独立した国家が並ぶことになった。
    detail: |
      1991年末のソ連解体にともない、カザフ・ウズベク・キルギス・トルクメン・タジクの5共和国が独立した。
      多くは独立運動の末ではなく連邦の消滅によるもので、共産党の指導者がそのまま大統領になった。
      タジキスタンは直後に内戦に陥る。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/中央アジア

  - id: belt-and-road
    year: 2013
    title: 一帯一路構想
    category: economy
    tags: [中国, 中央アジア]
    summary: 内陸の交通路を再び主役にしようとする試み。シルクロードの現代版を掲げる。
    detail: |
      中国が陸の「一帯」と海の「一路」を掲げ、鉄道・港湾・パイプラインへの融資と建設を進めた。
      内陸の交通路を再び主要な回廊にしようとする試みだが、相手国の債務負担をめぐる批判も受けている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/一帯一路
