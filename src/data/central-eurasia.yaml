  - id: chinggis-death
    year: 1227
    title: チンギス・ハンの死と帝国の分割
    category: politics
    tags: [モンゴル]
    summary: 息子たちに領地が分けられ、ユーラシアに四つのモンゴル国家が並んだ。
    detail: |
      1227年、チンギス・ハンは反抗した西夏を攻めている最中に陣中で没した。
      落馬が原因とも熱病ともいわれ、はっきりしない。
      遺体は北へ運ばれ、葬列を見た者は殺されたという話が残るほど埋葬地は秘された。
      今日まで墓は見つかっていない。

      死に先立って、領地の分け方はおおむね定まっていた。
      モンゴルの慣習では末子が父の本拠を継ぐため、末子トルイがモンゴル高原の本領と軍の大半を受け継ぐ。
      長男ジョチの家には最も西のキプチャク草原が、次男チャガタイには中央アジアが、三男オゴデイにはジュンガル方面が与えられた。
      ジョチ自身は父より先に没していたため、実際に受け取ったのは子のバトゥである。

      カアン（大ハン）の位は、遺言に従って1229年のクリルタイでオゴデイに継がれた。
      これは分割ではなく、帝国全体の上に立つ地位として残されている。
      各ウルスは独立した国ではなく、大きな一つの家産を分け持つという建前だった。

      しかし実際には、距離と利害が家ごとの分立を進めた。
      第4代モンケの死後に起きたクビライとアリクブケの争いは公然たる内戦になり、帝国は元・キプチャク・チャガタイ・イルハンの四つに事実上分かれる。
      それでも共通の出自という意識は残り、ユーラシアを横断する駅伝と通商はしばらく機能し続けた。
      チンギスの子孫であることは、以後数百年にわたり草原世界で君主たりうる資格そのものになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Standards_of_Genghis_Khan.png/500px-Standards_of_Genghis_Khan.png
      credit: Sci Show With Moh / CC0
      page: https://commons.wikimedia.org/wiki/File:Standards_of_Genghis_Khan.png
    links:
