  - id: mongol-empire
    title: モンゴル帝国
    start: 1206
    end: 1368
    category: war
    tags: [モンゴル, 遊牧]
    summary: 史上最大の陸上帝国。ユーラシアが一つの交通圏になった。
    detail: |
      1206年にチンギス・ハンが草原の諸部族を統合して以来、一世紀足らずでユーラシアの大半を覆った史上最大級の陸上帝国。
      東は朝鮮半島から西はハンガリーとメソポタミアまで、面積では現在のアフリカ大陸に匹敵する。
      強さの中核は軍の編成にあった。
      部族を解体して千戸・百戸に組み替え、忠誠を血筋ではなく君主個人に向けさせる。
      指揮官は功績で選ばれ、出自を問われなかった。
      戦い方も徹底していた。
      偵察を重ね、複数の軍が離れた経路から同時に迫り、偽りの退却で敵をおびき出す。
      攻城には中国やイスラム世界の技術者を取り込み、投石機や火器を使った。
      拡大は三代にわたる。
      オゴデイが金を滅ぼして華北を得、バトゥがルーシと東欧へ、フレグが西アジアへ進んでバグダードのアッバース朝を倒した。
      クビライは南宋を滅ぼして中国全土を支配下に置く。
      統治では、駅伝制によって大陸を結び、商人を保護し、宗教には概して寛容だった。
      征服地の官僚や技術者を出自にかかわらず用いたため、中国の暦学者がイランで働き、イスラムの天文学が中国に入るといったことが起きる。
      一方で、抵抗した都市への処置は苛烈をきわめた。
      中央アジアやイランでは灌漑施設ごと破壊され、回復に数世紀を要した地域もある。
      モンケの死後、後継争いから帝国は元・キプチャク・チャガタイ・イルハンの四つに事実上分裂した。
      共通の出自の意識は残り、駅伝と交易はしばらく機能し続ける。
      14世紀半ば、ペストの流行と各地の反乱によって支配は崩れていった。
      だが、この時期に生まれたユーラシア規模の交流の記憶は、その後の世界の見方を変えている。
      帝国の評価は長く「野蛮な破壊者」に傾いていたが、20世紀後半から、ユーラシアを一つの交流圏にした統合者としての側面が論じられるようになった。
      東西の知識が実際に行き来した最初の時代であり、世界史をひとつながりのものとして描く試みは、多くの場合ここを起点にしている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Standards_of_Genghis_Khan.png/500px-Standards_of_Genghis_Khan.png
      credit: Sci Show With Moh / CC0
      page: https://commons.wikimedia.org/wiki/File:Standards_of_Genghis_Khan.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モンゴル帝国

  - id: chagatai
    title: チャガタイ・ハン国
    start: 1227
    end: 1370
    category: politics
    tags: [モンゴル, 中央アジア]
    summary: 中央アジアを受け継いだモンゴルの一国。やがてトルコ化・イスラム化した。
    detail: |
      チンギス・ハンの次男チャガタイが受け継いだ領地を起こりとし、天山山脈の南北とマー・ワラー・アンナフルを版図とした遊牧国家。
      チャガタイは父の定めたヤサの厳格な守り手として知られ、弟オゴデイの即位を支えて帝国の秩序を保つ役割を担った。
      この国の歴史は、遊牧の暮らしを守るか、豊かな定住地の文化に入っていくかという緊張の連続だった。
      マー・ワラー・アンナフルにはブハラ・サマルカンドといった古い都市とイスラムの学問があり、支配層の一部はそこへ引き寄せられていく。
      14世紀前半のタルマシリンはイスラムに改宗して定住寄りの政策を取ったが、遊牧の伝統を守ろうとする東方の諸部族に反発され、殺された。
      この対立が決定的となり、1340年代に国は東西へ分裂する。
      西のマー・ワラー・アンナフルでは、モンゴル系の王族が実権を失い、トルコ語を話すイスラム教徒の有力者が争う状態になった。
      そこから台頭したのがティムールである。
      彼はチンギス裔でないためハンを名乗れず、傀儡のハンを立てて「大アミール」として振る舞った。
      東のモグーリスタンでは遊牧の生活が保たれ、のちにイスラム化しながらも17世紀まで王統が続く。
      カシュガルなどを拠点とした東チャガタイ家の末裔は、ジュンガルと清の進出まで残った。
      チャガタイ・ウルスの名は、中央アジアで用いられた文語「チャガタイ語」として残っている。
      これはウズベク語やウイグル語の直接の祖にあたり、バーブルの回想録もこの言葉で書かれた。
      この国は、モンゴル系の支配層が定住社会のなかで少数者となり、やがて言語も宗教も現地のものに移っていく過程を典型的に示している。
      同じことは西のイルハン朝やジョチ・ウルスでも起きた。
      征服した側が征服された側の文化に取り込まれる現象は、モンゴル帝国の各地で共通して見られる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/27/Flag_of_the_Chagatay_Khanate_in_the_Catalan_Atlas_%28published_in1375%29.png/500px-Flag_of_the_Chagatay_Khanate_in_the_Catalan_Atlas_%28published_in1375%29.png
