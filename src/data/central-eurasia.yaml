  - id: talas
    year: 751
    title: タラス河畔の戦い
    category: war
    tags: [イスラム, 唐, 技術伝播]
    summary: 唐がアッバース朝に敗れ、この時に製紙法が西へ伝わったとされる。
    detail: |
      751年、中央アジアのタラス川のほとりで唐とアッバース朝が戦った合戦。
      当時の唐は西域を都護府のもとに置き、パミールを越えて中央アジアにまで影響を広げていた。
      西からは、ウマイヤ朝を倒したばかりのアッバース朝が同じ地域へ進出している。
      両者の勢力圏はソグド地方で接し、衝突は時間の問題だった。

      きっかけは、唐の安西節度使・高仙芝が石国（タシュケント）の王を謀殺して財貨を奪ったことである。
      逃れた王子がアッバース朝に救援を求め、両軍が対峙した。
      数日の対陣ののち、唐側についていたカルルクが寝返って背後を突く。
      唐軍は大敗し、高仙芝はわずかな兵とともに逃れた。

      唐はこの4年後に安史の乱を迎え、西域から兵を引くことになる。
      中央アジアの主導権は決定的にイスラム勢力へ移り、以後この地域はイスラム化とトルコ語化の道をたどった。
      ただし、唐の後退は安史の乱による面が大きく、この戦いだけを転機とするのは単純化だという見方もある。

      もう一つ語り継がれているのが、製紙法の西への伝播である。
      捕虜となった唐の職人からサマルカンドに技術が伝わり、やがてバグダードを経てヨーロッパへ広がったとされる。
      捕虜のひとり杜環はアッバース朝領内を十年余り旅して帰国し、中国人による最初期のイスラム世界の記録を残した。
      戦場となったタラスの正確な位置は、現在も特定されていない。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/China_map_2.jpg/500px-China_map_2.jpg
      credit: "Original: 俊武 Later versions: Garam / CC BY-SA 3.0"
      page: https://commons.wikimedia.org/wiki/File:China_map_2.jpg
    links:
