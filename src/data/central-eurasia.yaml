  - id: ulugh-beg
    year: 1420
    title: ウルグ・ベクの天文台
    category: science
    tags: [中央アジア, 天文学]
    summary: 肉眼観測で当時世界最高精度の星表を作り、ヨーロッパにも影響した。
    detail: |
      ティムールの孫ウルグ・ベクは、父シャー・ルフのもとでサマルカンドの統治を任されていた。
      学問、とりわけ天文学に強い関心を持ち、1420年ごろからこの都に天文台の建設を進める。
      三階建ての円筒形の建物に、半径40メートルを超える巨大な六分儀が据えられた。
      地下まで掘り下げた溝に弧を設け、太陽や星が子午線を通る高さを測る仕組みである。
      大きな器械ほど目盛りを細かく刻めるという、望遠鏡以前の天文学の原則に忠実な設計だった。
      ここには当代一流の学者が集められた。
      カーシーやカーズィーザーデといった数学者・天文学者が加わり、ウルグ・ベク自身も観測に参加している。
      三十年近い観測の成果が『ジージ・スルターニー（ウルグ・ベク天文表）』にまとめられた。
      1018個の恒星の位置を記した星表は、プトレマイオス以来の値を大きく改め、肉眼観測としては到達しうる限界に近い精度を持つ。
      一年の長さは365日6時間10分8秒と求められ、現在の値との差はわずか25秒ほどだった。
      三角関数の表も、小数点以下十桁を超える精度で作られている。
      1449年にウルグ・ベクが殺されると、天文台は放棄され、やがて破壊されて土に埋もれた。
      場所すら忘れられてしまう。
      1908年、ロシアの考古学者ヴャトキンが記録を手がかりに発掘し、地下に残る六分儀の弧が姿を現した。
      現在は遺構の上に博物館が建てられている。
      星表そのものは写本として伝わり、17世紀にはオックスフォードで刊行された。
      ヨーロッパの天文学者もこの数値を参照しており、イスラム圏の科学が西欧へ流れ込んだ経路のひとつになっている。
      観測に用いられた器械はすべて肉眼で読むもので、望遠鏡が使われるのは二百年後のことである。
      道具の大きさで精度を稼ぐという発想の、最後の到達点だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/Ulugh_Beg_Observatory%281%29_2023.jpg/500px-Ulugh_Beg_Observatory%281%29_2023.jpg
      credit: ほっきー / CC0
      page: https://commons.wikimedia.org/wiki/File:Ulugh_Beg_Observatory(1)_2023.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウルグ・ベク天文台

  - id: timur-death
    year: 1405
    title: ティムールの死
    category: politics
    tags: [中央アジア, 明]
    summary: 明への遠征の途上で没し、中央アジアの統一は続かなかった。
    detail: |
      1404年末、ティムールはサマルカンドで大規模な祝宴と閲兵を行い、明への遠征を宣言した。
      元を倒して中国を支配した明に対し、モンゴルの後継者として討伐を掲げたのである。
      カスティーリャの使節クラヴィホがこのときの宮廷の様子を記録している。
      遠征の規模は二十万ともいわれ、道中の各地に食料と馬を備えさせる準備が進められた。
      厳冬の最中に出発したのは、砂漠を凍った地面の上で越えるためだったとみられる。
      1405年2月、軍がシル川沿いのオトラルに達したところでティムールは発病し、まもなく没した。
      六十八歳。
      遠征はただちに中止され、軍は引き返した。
      遺体はサマルカンドへ運ばれ、孫ムハンマド・スルタンのために建てられていたグーリ・アミール廟に葬られた。
      この廟は青いドームで知られ、今もサマルカンドの象徴になっている。
      死の直後から後継争いが始まった。
      指名されていた孫ピール・ムハンマドは支持を集められず、各地の総督となっていた子や孫が互いに争う。
      最終的に四男シャー・ルフがヘラートを本拠に全体をまとめたが、西方のイラク・アゼルバイジャンは失われ、版図は大きく縮んだ。
      一代の武力と個人の威名で結ばれた帝国のもろさがはっきり出た形である。
      もっとも、縮んだ後のティムール朝は文化の面で花開いた。
      シャー・ルフとその子ウルグ・ベクの時代に、天文学・細密画・建築が高い水準に達する。
      1941年、ソ連の学者ゲラシモフがこの廟を発掘して遺骨を調べ、足と腕の負傷を確認した。
      頭蓋骨から復元された顔は、今日よく知られる肖像の元になっている。
      発掘の直後に独ソ戦が始まったことから、墓を暴いた祟りだという話も語られた。
      彼の死は、ヨーロッパやオスマン帝国にとっては安堵でもあった。
      明の永楽帝も国境の備えを固めていたが、遠征が中止されたため衝突は起きていない。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/43/Tamerlan.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tamerlan.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール

  - id: uzbek-shaybanid
    year: 1500
    circa: true
    title: ウズベクの中央アジア支配
    category: politics
    tags: [中央アジア]
    summary: ティムール朝が倒れ、オアシス都市がハン国に分かれていく。
    detail: |
      15世紀後半から16世紀初めにかけて、キプチャク草原のウズベク集団が南下し、ティムール朝の版図を受け継いだ。
      指導したのはジョチ裔のシャイバーニー・ハンである。
      この移動によって、マー・ワラー・アンナフルの支配層はモンゴル系のティムール家から、トルコ語を話すウズベクの諸部族へ入れ替わった。
      都市の住民や農民は大きく変わらず、支配の上層だけが交代した形である。
      ウズベクの国家は、一人の君主が集権的に治めるものではなかった。
      王族が土地を分け持ち、有力者の合議で事を決める。
      そのため分裂しやすく、16世紀を通じてブハラを中心とする勢力とヒヴァ（ホラズム）の勢力が並び立った。
      18世紀にはフェルガナ盆地にコーカンド・ハン国が興り、いわゆる三ハン国の時代になる。
      三者は互いに争い、統一されることはなかった。
      経済では、オアシスの農業と隊商交易が支えだった。
      ただし海路の発展でユーラシアの交易の主役が船に移ると、内陸の富は細っていく。
      宗教面ではスンナ派の学問とスーフィズムが深く根づき、ブハラは「高貴なブハラ」と呼ばれる学問の都であり続けた。
      西のサファヴィー朝がシーア派を国教としたため、両者の対立は宗派の色を帯びる。
      この対立と内紛のため、中央アジアは近世の軍事技術の革新から取り残された。
      火器の導入も遅れ、周囲の帝国との差が開いていく。
      19世紀後半、三ハン国はロシア帝国に次々と併合された。
      ブハラとヒヴァは保護国として形式的に残り、1920年にソヴィエト政権によって廃される。
      ウズベク人という民族名と分布は、この16世紀の移動に由来している。
      三ハン国は互いに争いながらも、それぞれ独自の宮廷文化を育てた。
      ヒヴァでは年代記の編纂が盛んで、コーカンドは詩人を多く輩出している。
      この時代に整えられた都市の景観は、今日ヒヴァやブハラの旧市街として世界遺産に登録されている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウズベク人

  - id: kazan-conquest
    year: 1552
    title: ロシアのカザン征服
    category: war
    tags: [ロシア, 遊牧]
    summary: 定住国家が火器で草原を押し返し始めた転換点。
    detail: |
      カザン・ハン国は、ジョチ・ウルスが分裂してできた国のひとつで、ヴォルガ川中流を押さえていた。
      毛皮と隊商の交易で栄え、モスクワとは同盟と敵対を繰り返す関係にあった。
      モスクワにとって、この国は東へ広がるうえでの栓だった。
      カザンを通らなければヴォルガの下流にも、その先のカスピ海にも出られない。
      国境の村はたびたび襲われ、捕らえた住民を奴隷として売る商いも続いていた。
      1547年に戴冠したイヴァン4世は、二度の失敗の後、周到に準備を重ねた。
      カザンの上流に木造の要塞スヴィヤジスクを組み立てて運び、短期間で築いて前進基地とする。
      1552年夏、十五万ともいわれる軍と大量の火砲を集めて包囲した。
      西欧から招いた技師が城壁の下に坑道を掘って火薬を仕掛け、爆破によって城壁を崩す。
      10月、市街戦の末にカザンは陥落した。
      住民の多くが殺され、モスクとともに都市は破壊された。
      後にこの勝利を記念してモスクワの赤の広場に建てられたのが、聖ワシリイ大聖堂である。
      四年後にはアストラハンも併合され、ロシアはヴォルガ川の全流域とカスピ海への出口を得た。
      多民族・多宗教の住民を抱える帝国への転換点でもある。
      軍事史の面では、火器と工兵を備えた定住国家が、機動力に頼る草原の政権を正面から屈服させた早い例にあたる。
      数百年続いた騎馬民族の優位が、技術によって覆り始めた。
      この後、ロシアの東進は加速する。
      1580年代にはイェルマークがシビル・ハン国を攻め、一世紀足らずで太平洋岸にまで達した。
      併合後、カザンにはロシア人が入植し、モスクの再建は長く禁じられた。
      タタール人が市内に大きなモスクを再び持てたのは、エカチェリーナ2世の時代である。
      一方で、ヴォルガ流域の多民族状況はそのまま残った。
      ロシアが正教のスラヴ人だけの国ではなく、多様な民族と宗教を抱える帝国になった起点が、この征服にある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/Kazan_Khanate_map_Tatar.svg/500px-Kazan_Khanate_map_Tatar.svg.png
      credit: User:Untifler / Public domain
