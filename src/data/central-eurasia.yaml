lane: central-eurasia

periods:
  - id: scythians
    title: スキタイ
    start: -700
    startCirca: true
    end: -300
    endCirca: true
    category: war
    tags: [遊牧, 黒海]
    summary: 騎馬と黄金細工で知られる最初期の遊牧国家。ギリシア人が詳しく記録した。

  - id: xiongnu
    title: 匈奴
    start: -209
    end: 155
    endCirca: true
    category: politics
    tags: [遊牧, モンゴル高原]
    summary: 漢と対峙した最初の遊牧帝国。草原の国家のひな型になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/匈奴

  - id: silk-road
    title: シルクロード交易
    start: -130
    end: 1450
    endCirca: true
    category: economy
    tags: [交易, ユーラシア]
    summary: 絹・馬・紙・宗教・病が同じ道を通った。東西を結ぶ1500年の動脈。
    detail: |
      一人の商人が端から端まで運んだのではなく、オアシス都市をつなぐリレーで物が動いた。
      仏教・マニ教・ネストリウス派・イスラムも同じ道を東へ進み、
      14世紀のペストもこの経路をたどったとされる。

  - id: rouran
    title: 柔然
    start: 402
    end: 555
    category: politics
    tags: [遊牧, モンゴル高原]
    summary: 北魏と対立した草原の帝国。「可汗」の称号を初めて用いたとされる。

  - id: gokturk
    title: 突厥
    start: 552
    end: 744
    category: politics
    tags: [遊牧, トルコ系]
    summary: モンゴル高原から中央アジアまで支配し、独自の文字を残した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/突厥

  - id: khazar
    title: ハザール
    start: 650
    end: 969
    category: economy
    tags: [遊牧, 交易]
    summary: ビザンツとイスラムの間で交易を握り、支配層がユダヤ教を受け入れた珍しい国。

  - id: uyghur-khaganate
    title: ウイグル可汗国
    start: 744
    end: 840
    category: politics
    tags: [遊牧, トルコ系]
    summary: 唐と結んで安史の乱の鎮圧を助け、交易で栄えた。

  - id: mongol-empire
    title: モンゴル帝国
    start: 1206
    end: 1368
    category: war
    tags: [モンゴル, 遊牧]
    summary: 史上最大の陸上帝国。ユーラシアが一つの交通圏になった。
    detail: |
      駅伝制で情報と人が速く動き、商人と技術者が保護された。
      一方で抵抗した都市には徹底した破壊を加え、灌漑を失った地域は回復しなかった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モンゴル帝国

  - id: chagatai
    title: チャガタイ・ハン国
    start: 1227
    end: 1370
    category: politics
    tags: [モンゴル, 中央アジア]
    summary: 中央アジアを受け継いだモンゴルの一国。やがてトルコ化・イスラム化した。

  - id: golden-horde
    title: キプチャク・ハン国
    start: 1242
    end: 1502
    category: politics
    tags: [モンゴル, ロシア]
    summary: 南ロシアの草原を支配し、ルーシ諸公を240年従属させた。

  - id: timurid
    title: ティムール朝
    start: 1370
    end: 1507
    category: politics
    tags: [中央アジア]
    summary: サマルカンドを都にモンゴルの再興を掲げ、学芸を保護した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール朝

  - id: dzungar-khanate
    title: ジュンガル
    start: 1634
    end: 1757
    category: war
    tags: [遊牧, 清]
    summary: 最後の遊牧帝国。清とロシアに挟まれて滅び、草原の時代が終わった。

  - id: russian-central-asia
    title: ロシアの中央アジア征服
    start: 1865
    end: 1895
    category: war
    tags: [ロシア, 中央アジア]
    summary: 30年でオアシス都市が次々に併合され、草原がロシア帝国の一部になった。

  - id: soviet-central-asia
    title: ソ連下の中央アジア
    start: 1924
    end: 1991
    category: politics
    tags: [ソ連, 中央アジア]
    summary: 民族ごとに共和国の線が引かれ、綿花の単作とアラル海の縮小が進んだ。

events:
  - id: yuezhi-defeat
    year: -176
    circa: true
    title: 匈奴が月氏を破る
    category: war
    tags: [遊牧, 中央アジア]
    summary: 追われた月氏が西へ移動し、のちにクシャーナ朝を生む連鎖が始まった。

  - id: huns-westward
    year: 375
    title: フン族の西進とゲルマン民族大移動
    category: war
    tags: [遊牧, ヨーロッパ]
    summary: 草原の一押しがヨーロッパ全体を動かし、西ローマ滅亡の連鎖につながった。
    related: [west-rome-fall]

  - id: attila
    year: 451
    title: アッティラのガリア遠征
    category: war
    tags: [フン族, ヨーロッパ]
    summary: 「神の鞭」と恐れられた王の進撃がカタラウヌムで止まった。

  - id: gokturk-submits
    year: 630
    title: 東突厥が唐に服属
    category: war
    tags: [突厥, 唐]
    summary: 唐の皇帝が遊牧世界の盟主「天可汗」を兼ねる体制が生まれた。

  - id: talas
    year: 751
    title: タラス河畔の戦い
    category: war
    tags: [イスラム, 唐, 技術伝播]
    summary: 唐がアッバース朝に敗れ、この時に製紙法が西へ伝わったとされる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/タラス河畔の戦い

  - id: uyghur-collapse
    year: 840
    title: キルギスによるウイグル可汗国の崩壊
    category: war
    tags: [遊牧]
    summary: ウイグル人が西へ移り、今の新疆のトルコ系社会の原型になった。

  - id: turkic-islam
    year: 960
    circa: true
    title: トルコ系遊牧民のイスラム受容
    category: religion
    tags: [イスラム, トルコ系]
    summary: 草原とイスラム世界が結びつき、以後の西アジア支配層はトルコ系になる。

  - id: chinggis-khan
    year: 1206
    title: チンギス・ハンの即位
    category: politics
    tags: [モンゴル]
    summary: 分裂していた草原の諸部族を統合し、世界征服の出発点となった。

  - id: mongol-central-asia
    year: 1219
    title: モンゴルの中央アジア遠征
    category: war
    tags: [モンゴル]
    summary: ホラズムを壊滅させ、西方への道を開いた。

  - id: chinggis-death
    year: 1227
    title: チンギス・ハンの死と帝国の分割
    category: politics
    tags: [モンゴル]
    summary: 息子たちに領地が分けられ、ユーラシアに四つのモンゴル国家が並んだ。

  - id: legnica
    year: 1241
    title: ワールシュタットの戦い
    category: war
    tags: [モンゴル, ヨーロッパ]
    summary: モンゴル軍がポーランド・ドイツ連合軍を破り、西欧に衝撃を与えた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ワールシュタットの戦い

  - id: pax-mongolica
    year: 1260
    circa: true
    title: モンゴルの平和
    category: economy
    tags: [モンゴル, 交易]
    summary: 一つの権力の下で東西の往来が安全になり、人と技術と情報が大量に動いた。

  - id: marco-polo
    year: 1271
    title: マルコ・ポーロの東方旅行
    category: economy
    tags: [交易, ヨーロッパ]
    summary: 『東方見聞録』がヨーロッパにアジアへの憧れを植えつけた。

  - id: plague-spreads-west
    year: 1346
    title: ペストの西方への拡散
    category: disaster
    tags: [疫病, 交易路]
    summary: 交易路を通って黒海からヨーロッパへ広がり、翌年から大流行になった。
    related: [black-death]

  - id: timur-enthroned
    year: 1370
    title: ティムールの即位
    category: politics
    tags: [中央アジア]
    summary: 破壊と建設を同時に行い、サマルカンドを世界有数の都市に育てた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール

  - id: ankara-battle
    year: 1402
    title: アンカラの戦い
    category: war
    tags: [ティムール, オスマン]
    summary: ティムールがオスマン皇帝を捕らえ、オスマンは一時崩壊状態になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アンカラの戦い

  - id: ulugh-beg
    year: 1420
    title: ウルグ・ベクの天文台
    category: science
    tags: [中央アジア, 天文学]
    summary: 肉眼観測で当時世界最高精度の星表を作り、ヨーロッパにも影響した。

  - id: timur-death
    year: 1405
    title: ティムールの死
    category: politics
    tags: [中央アジア, 明]
    summary: 明への遠征の途上で没し、中央アジアの統一は続かなかった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール

  - id: uzbek-shaybanid
    year: 1500
    circa: true
    title: ウズベクの中央アジア支配
    category: politics
    tags: [中央アジア]
    summary: ティムール朝が倒れ、オアシス都市がハン国に分かれていく。

  - id: kazan-conquest
    year: 1552
    title: ロシアのカザン征服
    category: war
    tags: [ロシア, 遊牧]
    summary: 定住国家が火器で草原を押し返し始めた転換点。

  - id: steppe-decline
    year: 1600
    circa: true
    title: 草原の交易路の後退
    category: economy
    tags: [交易, 航海]
    summary: 海路が主役になり、1500年続いた内陸の交易が相対的に沈んでいった。

  - id: dzungar-fall
    year: 1757
    title: ジュンガルの滅亡
    category: war
    tags: [清, 遊牧]
    summary: 最後の遊牧帝国が清に滅ぼされ、草原の時代が終わった。

  - id: tashkent-taken
    year: 1865
    title: ロシアのタシケント占領
    category: war
    tags: [ロシア, 中央アジア]
    summary: 英露が中央アジアで勢力を競う「グレート・ゲーム」が本格化した。

  - id: anglo-russian-entente
    year: 1907
    title: 英露協商
    category: politics
    tags: [中央アジア, 外交]
    summary: 中央アジアでの争いに区切りをつけ、両国はドイツに向き合うことになった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/英露協商

  - id: central-asia-republics
    year: 1924
    title: 中央アジアの民族別共和国化
    category: politics
    tags: [ソ連, 民族]
    summary: ソ連が引いた民族の線引きが、現在の5か国の国境になっている。

  - id: aral-sea
    year: 1960
    circa: true
    title: アラル海の縮小が始まる
    category: disaster
    tags: [中央アジア, 環境]
    summary: 綿花のための灌漑で湖の大半が消え、20世紀最大級の環境破壊とされる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アラル海

  - id: central-asia-independence
    year: 1991
    title: 中央アジア5か国の独立
    category: politics
    tags: [中央アジア, 現代]
    summary: ソ連解体で、望まないまま独立した国家が並ぶことになった。

  - id: belt-and-road
    year: 2013
    title: 一帯一路構想
    category: economy
    tags: [中国, 中央アジア]
    summary: 内陸の交通路を再び主役にしようとする試み。シルクロードの現代版を掲げる。
