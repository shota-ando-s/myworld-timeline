  - id: gokturk-submits
    year: 630
    title: 東突厥が唐に服属
    category: war
    tags: [突厥, 唐]
    summary: 唐の皇帝が遊牧世界の盟主「天可汗」を兼ねる体制が生まれた。
    detail: |
      630年、唐が東突厥を攻めて頡利可汗を捕らえ、第一可汗国が倒れた出来事。
      隋末の混乱期、東突厥は中国の群雄に支援を与えて影響力を保ち、唐の高祖も当初は贈り物をして背後を固めていた。
      626年には頡利可汗が長安の北の渭水まで迫り、即位直後の太宗が財物を贈って退かせている。

      流れを変えたのは自然と内紛だった。
      627年から続いた大雪で家畜が大量に死に、支配下の薛延陀や回紇（ウイグル）が離反する。
      太宗はこの機をとらえ、李靖に大軍を率いさせて急襲させた。
      頡利可汗は捕らえられて長安へ送られる。

      唐は降った遊牧民を北辺に住まわせ、その首長をそのまま都督として支配させる羈縻政策を取った。
      諸部族は太宗に「天可汗」の称号を奉り、中華の皇帝が同時に草原の盟主を兼ねる体制が生まれる。
      この二重の立場が、唐の西域経営を支える土台になった。

      服属は永続しなかった。
      682年に突厥は独立を回復し、唐は再び北方の強大な相手と向き合うことになる。
      それでも、遊牧の君主号と中華の帝号をひとりが兼ねるという発想はここで生まれた。
      のちの遼・元・清といった征服王朝の統治のかたちを、先取りするものだったといえる。
