  - id: steppe-decline
    year: 1600
    circa: true
    title: 草原の交易路の後退
    category: economy
    tags: [交易, 航海]
    summary: 海路が主役になり、1500年続いた内陸の交易が相対的に沈んでいった。
    detail: |
      16世紀以降、ユーラシアの交易は大きく重心を移した。
      喜望峰をまわる航路が定着し、続いてアメリカ大陸との航路も開かれると、大量の物資を安く運ぶ手段は船になる。
      内陸の隊商路はこれに太刀打ちできなかった。
      ラクダの背に載せられる量は限られ、道中では関税と護衛の費用がかさむ。
      高価で軽い品に絞れば成り立つが、規模では海に及ばない。
      同じころ、陸の側でも条件が悪化した。
      ティムール朝の分裂後、中央アジアは三つのハン国に割れて互いに争い、通行の安全が保てなくなる。
      サファヴィー朝とウズベクの宗派対立も往来を妨げた。
      中国の側も変わった。
      明は海禁を敷きながらも、実際には南の港を通じた交易が拡大し、銀の流入は海路から来るようになる。
      内陸の関所を通る商いの比重は下がった。
      さらに、火器の普及が軍事の均衡を崩した。
      騎射の機動力は、大砲と要塞、そして補給を支える官僚機構を持つ定住国家の前で決定的な優位を失っていく。
      ロシアと清が草原を東西から挟み込んでいった。
      オアシス都市の収入は細り、サマルカンドやブハラの学問も往時の活気を失った。
      中央アジアは世界の交差点から、大国に囲まれた内陸の周縁へと位置を変える。
      もっとも、内陸の交易が絶えたわけではない。
      茶・馬・綿布の取引は続き、19世紀にもキャラバンは動いていた。
      相対的な地位が下がったということである。
      20世紀にはこの地が石油と天然ガスの産地として再び注目され、21世紀には鉄道とパイプラインによる大陸横断の物流が構想されている。
      一帯一路はその現代版といえる。
      この変化は、中央アジアが「遅れた」のではなく、世界の物流の構造そのものが変わったために相対的な位置が下がった、と理解される。
      同時期に、アメリカ大陸の銀が太平洋と大西洋の両方から中国へ流れ込み、世界の経済の結び目は海沿いの港へ移っていった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/SeidenstrasseGMT.JPG/500px-SeidenstrasseGMT.JPG
      credit: Kelvin Case / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:SeidenstrasseGMT.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シルクロード

  - id: dzungar-fall
    year: 1757
    title: ジュンガルの滅亡
    category: war
    tags: [清, 遊牧]
    summary: 最後の遊牧帝国が清に滅ぼされ、草原の時代が終わった。
    detail: |
      1745年にガルダンツェリンが没すると、ジュンガルは激しい後継争いに陥った。
      有力者アムルサナーが権力闘争に敗れて清に投降し、乾隆帝に遠征を促したことが引き金になる。
      1755年、清は大軍を派遣してイリ地方を制圧した。
      ジュンガルの君主ダワチは捕らえられ、あっけなく崩れる。
      ところが、期待した地位を得られなかったアムルサナーが翌年反旗を翻した。
      乾隆帝はこれを裏切りと受け止め、ジュンガルそのものを根絶やしにする方針へ転じる。
      1757年までの掃討は苛烈だった。
      清の記録は、逃亡した者・殺された者・病で死んだ者を合わせて、ジュンガルの人口がほとんど失われたと伝える。
      当時流行していた天然痘が被害を拡大させた。
      研究者はこの一連の措置を、近代以前における民族の意図的な絶滅の例として論じている。
      数十万といわれた人口の大半が消え、部族そのものが歴史から退場した。
      空いた土地には、内地からの漢人、東トルキスタンのウイグル人（タランチ）、満洲の兵、回民などが移された。
      屯田が開かれ、駐屯地が置かれる。
      乾隆帝はこの地を「新疆」、すなわち新たに得た領域と名づけた。
      清の版図はここで最大となり、中央アジアとの境界もほぼ定まる。
      この結果、内陸アジアから中華世界を脅かす遊牧勢力は姿を消した。
      二千年にわたって続いた、草原と農耕地帯のせめぎ合いという歴史の構図そのものが終わったのである。
      同じころ西からはロシアが南下しており、両帝国が草原を分け合う形になった。
      今日の中央アジアの国境線の原型は、この時期に引かれている。
      この遠征の費用は清の財政を大きく圧迫し、乾隆帝の「十全武功」と呼ばれる一連の外征の中でも最大級のものだった。
      新疆の統治は、内地とは別の軍政（イリ将軍）に委ねられた。
      行政の一体化は19世紀末の省設置を待つことになる。
