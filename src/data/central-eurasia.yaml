  - id: xiongnu
    title: 匈奴
    start: -209
    end: 155
    endCirca: true
    category: politics
    tags: [遊牧, モンゴル高原]
    summary: 漢と対峙した最初の遊牧帝国。草原の国家のひな型になった。
    detail: |
      モンゴル高原を本拠に、単于を頂点として左賢王・右賢王が東西を分け持つ形でまとまった遊牧勢力。
      中国の史料に現れるのは戦国時代末で、趙・燕・秦はそれぞれ長城を築いて備えた。
      生業は遊牧だが、中国から絹や穀物を得る交易と略奪、西域のオアシス都市からの徴税も大きな収入源だった。
      前209年に冒頓単于が立つと、東胡を倒し月氏を西へ追って草原を統一する。
      前200年には白登山で漢の高祖を包囲し、以後およそ60年、漢が絹・酒・米を毎年贈り皇女を嫁がせる和親の関係が続いた。
      流れが変わるのは武帝の時代で、衛青・霍去病の遠征がゴビ以南から匈奴を追い、漢は河西回廊に四郡を置いて西域への道を確保する。
      匈奴は西域諸国への影響力を失い、天候不順と家畜の被害、単于位をめぐる内紛が重なって、前1世紀半ばには五人の単于が並び立つ分裂に陥った。
      前51年、呼韓邪単于が漢に臣従して後ろ盾を得ると、対立する郅支単于は西へ逃れて前36年に討たれる。
      1世紀には南北に分かれ、南匈奴は漢の北辺に住んで後の五胡十六国の担い手になり（劉淵の漢＝前趙はその流れ）、北匈奴は後漢と鮮卑に追われて西へ去った。
      モンゴルのノイン・ウラ古墳群からは中国の絹やギリシア風の織物が出土しており、彼らが東西の物の流れの結び目にいたことを示している。
      西へ去った集団と4世紀のフン族を結びつける説は古くからあるが、決め手はない。
      匈奴の言語系統ははっきりしない。
      テュルク系、モンゴル系、イェニセイ系などの説があり、残された固有名詞の漢字音からの推定にとどまる。
      社会は遊牧を基本としつつ、農耕を営む集落や手工業の工房も抱えていた。
      発掘からは鉄器の生産や城郭状の遺構も見つかっており、単純な移動生活という像は改められつつある。
      中国の王朝にとって、匈奴との関係は和親・交易・戦争を組み合わせる長い実験だった。
      ここで作られた対処の型は、以後の鮮卑・突厥・契丹・モンゴルへの対応にも繰り返される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/XiongnuMap.png/500px-XiongnuMap.png
      credit: Gabagool / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:XiongnuMap.png
    links:
