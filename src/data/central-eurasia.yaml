  - id: silk-road
    title: シルクロード交易
    start: -130
    end: 1450
    endCirca: true
    category: economy
    tags: [交易, ユーラシア]
    summary: 絹・馬・紙・宗教・病が同じ道を通った。東西を結ぶ1500年の動脈。
    detail: |
      中国と地中海世界を結んだ内陸の交易路の総称。
      ひと続きの街道ではなく、オアシスをつなぐ複数の経路の束であり、隊商は区間ごとに荷を受け渡していった。
      端から端まで運ぶ商人はほとんどいない。
      名称は19世紀のドイツの地理学者リヒトホーフェンによるもので、当時の人々がそう呼んでいたわけではない。
      本格化したのは前2世紀、漢の武帝が張騫を西域へ送り、河西回廊に郡を置いて安全を確保してからである。
      中国の絹が西へ流れ、ローマでは元老院が奢侈として規制を議論するほど珍重された。
      運ばれたのは絹だけではない。
      西からはガラス器、宝石、馬、香料、綿が入り、東からは紙、陶磁器、茶が出た。
      物より大きかったのは技術と宗教の伝播で、仏教が中央アジアを経て中国・朝鮮・日本へ伝わったのもこの道である。
      マニ教、ネストリウス派キリスト教、ゾロアスター教も同じ経路で東へ入った。
      唐の長安には各宗教の寺院が並び、国際都市の様相を呈している。
      交易の担い手として際立っていたのがソグド人で、サマルカンドを本拠に東はモンゴル高原から中国内地まで植民集落を置いた。
      彼らの言葉と文字は、草原世界の共通語としても使われている。
      路線の安全は、通り道を押さえる勢力の強弱に左右された。
      漢・唐・モンゴル帝国のような広域政権が現れると往来は活発になり、分裂期には細る。
      13世紀のモンゴルの平和は最後の最盛期だった。
      16世紀以降、大量の物資を安く運べる海路が主役になり、内陸路の比重は下がっていく。
      20世紀後半に考古学と観光の対象として再び注目され、21世紀には鉄道とパイプラインの形で現代の回廊が構想されている。
      この交易路がもたらした最大のものは、物ではなく人と考え方の往来だったという見方は広く共有されている。
      砂に埋もれた敦煌の文書やニヤ遺跡の木簡は、複数の言語と宗教が同じ場所で使われていたことを具体的に示している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/SeidenstrasseGMT.JPG/500px-SeidenstrasseGMT.JPG
      credit: Kelvin Case / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:SeidenstrasseGMT.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シルクロード

  - id: rouran
    title: 柔然
    start: 402
    end: 555
    category: politics
    tags: [遊牧, モンゴル高原]
    summary: 北魏と対立した草原の帝国。「可汗」の称号を初めて用いたとされる。
    detail: |
      5世紀初めにモンゴル高原で勢力を伸ばした遊牧国家。
      中国の史書では蠕蠕・芮芮・茹茹などさまざまに書かれ、北魏は虫を思わせる蔑称を当てた。
      モンゴル系とみられるが確定していない。
      402年に社崙が諸部をまとめ、「可汗」の称号を用いた。
      この称号はのちに突厥・ウイグル・モンゴルへ受け継がれ、草原の君主号として定着していく。
      南には鮮卑拓跋部の北魏があり、両者は百年以上にわたって争った。
      北魏の太武帝はたびたび自ら大軍を率いて北へ出、長城を修築して六鎮と呼ばれる防衛拠点を置いている。
      この六鎮に置かれた兵の不満が、のちに北魏を崩す六鎮の乱につながった。
      柔然の側も南朝の宋や西域諸国と結んで北魏を挟もうとし、高原の政治は南北朝の外交に組み込まれていく。
      この柔然に鍛鉄を貢納して隷属していたのが、アルタイ山麓のテュルク系集団・突厥である。
      552年、突厥の土門（ブミン）が婚姻の申し出を侮辱されたことをきっかけに反旗を翻し、柔然を破って可汗を称した。
      柔然の可汗は北斉へ逃れたが受け入れられず、6世紀半ばに滅びる。
      西へ逃れた残党が、同じころヨーロッパに現れてビザンツやフランクを脅かしたアヴァール人にあたるとする説がある。
      有力な見方だが、確定はしていない。
      柔然の社会は、遊牧民の部族連合に中国から逃れた人々や捕虜が加わった混成だった。
      可汗は中国風の年号を用い、南朝に使節を送って絹と称号を得ている。
      草原の君主が中華の外交秩序を利用した早い例である。
      北魏との戦いは高原の政治を大きく変えた。
      北魏が北辺に置いた六鎮は、対柔然の備えとして重視されたが、のちに中央から軽んじられて反乱を起こし、北魏そのものを滅ぼす原因になる。
      柔然が最後に頼ったのが突厥への婚姻の申し出だった。
      これを拒んで侮辱したことが反乱を招いたと伝えられ、草原の力関係が一夜にして入れ替わった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Rouran500.png/500px-Rouran500.png
      credit: Gabagool / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:Rouran500.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/柔然

  - id: gokturk
    title: 突厥
    start: 552
    end: 744
    category: politics
    tags: [遊牧, トルコ系]
    summary: モンゴル高原から中央アジアまで支配し、独自の文字を残した。
    detail: |
      アルタイ山麓で鍛鉄に従事し柔然に隷属していたテュルク系の集団が、552年に土門（ブミン）のもとで反旗を翻し、柔然を破って可汗国を建てた。
      「トュルク」を音写した突厥の名がそのまま今日のトルコにつながる。
      ブミンの弟・室点蜜（イステミ）が西方を担当し、ソグド商人と結んでエフタルをササン朝と挟撃して滅ぼす。
      版図は東の満洲から西のカスピ海沿岸まで達し、草原に初めて東西を貫く国家が現れた。
      経済の柱は中国との絹馬交易と、ソグド人を介した中継貿易だった。
      ササン朝が絹の流通を押さえようとすると、突厥はビザンツ帝国に使節を送って同盟を模索している。
      草原の国家がユーラシアの東西を結ぶ外交の担い手になった例として知られる。
      583年、隋の離間策と一族の内紛で東西に分裂した。
      東突厥は630年に唐に敗れて服属し、唐の太宗は草原の諸部から「天可汗」と呼ばれる。
      西突厥も657年に唐に破れた。
      682年、東突厥はクトゥルクのもとで独立を回復するが（第二可汗国）、内紛とウイグルらの離反が重なり744年に滅びる。
      この第二可汗国がモンゴル高原に残したオルホン碑文は、テュルク系の言語で書かれた最古級の記録である。
      ビルゲ・カガンや弟キュル・テギンの事績とともに、中国の絹と甘い言葉に引き寄せられて草原を離れれば民は滅びる、という趣旨の警告が刻まれている。
      支配層は遊牧の生活を守ることを、みずからの言葉ではっきり言語化していた。
      突厥の名は中国側の表記で、自称はテュルクだった。
      この語は現在のトルコ、トルクメニスタンをはじめ、テュルク系諸民族の総称として生き続けている。
      社会は十進法の軍事編成と、部族連合の緩やかな結合の組み合わせだった。
      可汗の一族が東西に分かれて統治する仕組みは強みでもあり、分裂の種でもある。
      8世紀初めの碑文には、唐に服属した五十年の屈辱と、国を取り戻した経緯が一人称で語られている。
      敗北と再興を自分たちの言葉で記録した点で、遊牧国家の史料としては例外的である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Map_of_the_First_Turkic_Khaganate.png/500px-Map_of_the_First_Turkic_Khaganate.png
      credit: Ktrinko User:Greenvert / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Map_of_the_First_Turkic_Khaganate.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/突厥

  - id: khazar
    title: ハザール
    start: 650
    end: 969
    category: economy
    tags: [遊牧, 交易]
    summary: ビザンツとイスラムの間で交易を握り、支配層がユダヤ教を受け入れた珍しい国。
    detail: |
      7世紀、西突厥の崩壊した後のカスピ海北岸からコーカサス、黒海沿岸にかけて勢力を伸ばしたテュルク系の国家。
      ヴォルガ川下流のイティルを都とし、南のデルベントを押さえて、北方の森林地帯と南のイスラム世界を結ぶ交易路の関所として栄えた。
      毛皮・蜜蝋・奴隷が北から流れ、銀貨と工芸品が南から入る。
      軍事的にも大きな役割を果たした。
      7世紀末から8世紀にかけて北上するウマイヤ朝の軍とコーカサスで長く戦い、アラブ勢力がヨーロッパ東部へ進むのを食い止めている。
      ビザンツ帝国とは同盟関係にあり、皇帝がハザールの王女を妃に迎えたこともあった。
      この国がとくに知られるのは、8世紀から9世紀にかけて支配層がユダヤ教を受け入れたことによる。
      キリスト教のビザンツとイスラムのカリフ国に挟まれ、どちらにも従属しない第三の道を選んだためと説明されることが多い。
      改宗が支配層に限られたのか広く及んだのかは、史料が乏しく議論が続いている。
      965年ごろ、キエフ公スヴャトスラフの遠征でイティルを含む拠点が破壊され、国は急速に衰えた。
      以後この草原はペチェネグ、次いでポロヴェツ（キプチャク）が占め、やがてモンゴルの西征を迎える。
      ハザールの記憶は、10世紀のスペインのユダヤ人高官とハザール王のあいだで交わされたとされる往復書簡などに断片的に残った。
      ハザールの都イティルは、川を挟んで王の区画と商人の区画に分かれ、ムスリム・ユダヤ教徒・キリスト教徒・多神教徒それぞれに裁判官が置かれていたと、アラブの地理書は伝える。
      支配のかたちも独特だった。
      名目上の君主カガンは神聖な存在として隔離され、実際の政治と軍事は副王ベクが担ったとされる。
      消滅後もその記憶は長く残り、ユダヤ教への改宗という事実は、後世さまざまな議論を呼んだ。
      東欧のユダヤ人の起源をハザールに求める説も唱えられたが、遺伝学的な研究では支持されていない。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Chasaren.jpg/500px-Chasaren.jpg
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Chasaren.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ハザール

  - id: uyghur-khaganate
    title: ウイグル可汗国
    start: 744
    end: 840
    category: politics
    tags: [遊牧, トルコ系]
    summary: 唐と結んで安史の乱の鎮圧を助け、交易で栄えた。
    detail: |
      鉄勒（トクズ・オグズ）系の回紇部を中心とする集団が、744年に突厥第二可汗国を倒してモンゴル高原を継いだ。
      オルホン川のほとりにカラ・バルガスンの都を築き、遊牧しながら城郭都市を持つ体制を取った。
      決定的だったのは唐との関係である。
      755年に安史の乱が起きると、唐の求めに応じて援軍を送り、長安と洛陽の奪回を助けた。
      見返りに唐は絹馬交易を認め、ウイグルは馬一頭に対して絹四十匹という有利な条件で毎年大量の絹を手に入れる。
      この絹は西方へ転売され、国の富を支えた。
      交易を担ったのはソグド商人で、彼らを通じて8世紀後半にマニ教が受け入れられた。
      遊牧国家が外来の宗教を国の宗教として採用した早い例であり、文字もソグド文字を元にしたウイグル文字が作られる。
      この文字はのちにモンゴル文字、さらに満洲文字へと受け継がれていった。
      840年、飢饉と内紛で弱ったところへ北のキルギスが攻め込み、可汗が殺されて国は崩れる。
      逃れた人々は天山東部や河西のオアシスへ移り、農耕と都市の生活に移っていった。
      西ウイグル王国や甘州ウイグルがそれで、今日の新疆のテュルク系社会の原型になる。
      支配層はソグド人を通じて西方の文物に親しみ、都には壁を巡らせた宮殿区とマニ教の寺院が置かれた。
      発掘されたカラ・バルガスンの碑文は、テュルク語・ソグド語・漢文の三つで刻まれている。
      唐との交易は有利だったが、絹の代価をめぐる摩擦も絶えなかった。
      長安に滞在したウイグル商人の横暴が記録に残り、安史の乱の鎮圧で入城した軍による略奪も反感を招いている。
      840年の崩壊後に移住した人々は、仏教とマニ教、のちにイスラムを受け入れながらオアシスの社会を作った。
      遊牧国家としてのウイグルは百年で終わったが、その名は今日まで民族の名として続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/%E5%9B%9E%E9%B6%BB%E5%8F%AF%E6%B1%97%E5%9B%BD%E3%81%AE%E7%89%88%E5%9B%B3.png/500px-%E5%9B%9E%E9%B6%BB%E5%8F%AF%E6%B1%97%E5%9B%BD%E3%81%AE%E7%89%88%E5%9B%B3.png
