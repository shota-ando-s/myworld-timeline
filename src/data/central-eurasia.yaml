  - id: mongol-central-asia
    year: 1219
    title: モンゴルの中央アジア遠征
    category: war
    tags: [モンゴル]
    summary: ホラズムを壊滅させ、西方への道を開いた。
    detail: |
      1218年、チンギス・ハンはホラズム・シャー朝へ四百人以上の隊商を送り、通商を申し入れた。
      ところが国境の町オトラルの太守が彼らを間諜として処刑し、財貨を奪う。
      送られた使節も殺されるか辱められて帰された。
      翌1219年、報復としてモンゴル軍が動き出す。
      兵力は十万から二十万と伝えられ、チンギス自身と四人の息子が別々の方向から進んだ。
      ホラズムのムハンマドは野戦を避けて各都市に兵を分けて守らせたが、これが致命的になる。
      オトラルは五か月の抵抗の末に落ち、太守は処刑された。
      1220年、ブハラが降伏し、モスクで説教壇に立ったチンギスが自らを神の罰だと名乗ったという有名な場面が伝えられる。
      サマルカンドも数日で落ちた。
      抵抗した都市への処置は苛烈だった。
      ウルゲンチでは住民が虐殺され、灌漑のための堤が切られて町は水没したという。
      ニシャプールやメルヴといったホラーサーンの大都市も破壊され、数十万の死者が記録されている。
      数字には誇張もあるが、灌漑施設の荒廃が長く尾を引いたことは各地の調査で裏づけられている。
      ムハンマドはカスピ海の島まで逃れて病死し、子のジャラールッディーンはインダス川で敗れた。
      追撃に出たジェベとスブタイの部隊はコーカサスを越え、1223年にカルカ河畔でルーシ諸公軍を破って帰還する。
      この遠征でモンゴルは中央アジアとイランへの道を開き、同時にヨーロッパへの偵察を済ませた。
      十数年後のバトゥの西征は、このとき得た情報の上に立っている。
      破壊の規模については議論がある。
      同時代のイスラムの歴史家が記した数字は誇張を含むとされる一方、考古学の調査では実際に多くの都市が縮小し、灌漑網が放棄された跡が確認されている。
      この遠征でホラズム・シャー朝という大国が消え、イスラム世界の東半分は政治的な空白に陥った。
      数十年後のフレグによるバグダード攻略へ、直線的につながっていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Standards_of_Genghis_Khan.png/500px-Standards_of_Genghis_Khan.png
      credit: Sci Show With Moh / CC0
      page: https://commons.wikimedia.org/wiki/File:Standards_of_Genghis_Khan.png
