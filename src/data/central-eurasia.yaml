      url: https://upload.wikimedia.org/wikipedia/commons/5/54/Marco_Polo_portrait.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Marco_Polo_portrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マルコ・ポーロ

  - id: plague-spreads-west
    year: 1346
    title: ペストの西方への拡散
    category: disaster
    tags: [疫病, 交易路]
    summary: 交易路を通って黒海からヨーロッパへ広がり、翌年から大流行になった。
    detail: |
      14世紀のペスト大流行が、中央アジアから地中海世界へ運ばれた過程。
      近年、キルギスのイシク・クル湖畔にある墓地の遺骨からペスト菌が検出され、1338年から1339年の流行が裏づけられた。

      そこから病は交易路を伝って東西へ広がった。
      東では元の華北に達し、西へはキャラバンと船に乗って黒海沿岸へ向かう。
      モンゴルの平和がもたらした活発な往来が、そのまま感染の経路になった。

      1346年、クリミア半島のカッファを包囲していたジョチ・ウルスの軍の陣中で流行が起きる。
      攻めきれなくなった軍が、死者を投石機で城内へ投げ込んだという話が当時の記述として伝わる。
      真偽には議論があるが、包囲が解けたあとカッファから逃れたジェノヴァの商船が病を運んだことは確かである。
      1347年秋、船はコンスタンティノープル、メッシーナ、ジェノヴァ、マルセイユへ次々に到着した。

      1348年にはイタリア半島とフランス、イベリア半島、イングランドへ、1349年には中欧と北欧へ広がる。
      三、四年でヨーロッパの人口の三分の一前後が失われたとされる。
      医学は無力で、原因はミアズマ（悪い空気）や星の配置に求められ、ユダヤ人が井戸に毒を入れたという噂から各地で虐殺も起きた。
      この人口減少は労働力の不足を通じて農奴制の緩みや賃金の上昇を招き、ヨーロッパ社会の仕組みを長期的に変えていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5b/Chevalier_Roze_%C3%A0_la_Tourette_-_1720.PNG/500px-Chevalier_Roze_%C3%A0_la_Tourette_-_1720.PNG
      credit: ミシェル・セール / Public domain
      page: https://commons.wikimedia.org/wiki/File:Chevalier_Roze_%C3%A0_la_Tourette_-_1720.PNG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ペストの歴史
    related: [black-death]

  - id: timur-enthroned
    year: 1370
    title: ティムールの即位
    category: politics
    tags: [中央アジア]
    summary: 破壊と建設を同時に行い、サマルカンドを世界有数の都市に育てた。
    detail: |
      1370年、ティムールがバルフで君主の座に就き、中央アジアに新しい政権が生まれた出来事。

      14世紀半ばのマー・ワラー・アンナフルは、チャガタイ・ウルスの分裂によって統一を失い、トルコ・モンゴル系の有力者が入り乱れて争う状態にあった。
      東のモグーリスタンからの介入も繰り返されている。
      ティムールははじめモグーリスタンのハンに仕え、次いで義兄弟であるフサインと結び、協力と対立を繰り返しながら勢力を広げた。
      1370年にバルフを攻めてフサインを倒し、単独の支配者となる。

      ここで問題になったのが正統性だった。
      草原の世界では、ハンを名乗れるのはチンギス・ハンの血を引く者に限られる。
      バルラス部出身のティムールにその資格はなく、そこで「大アミール」を称し、チャガタイ家の男子を名目上のハンとして立てた。
      さらにチンギスの子孫の娘を妃に迎え、「キュレゲン（ハンの婿）」の称号を用いている。

      同時に、イスラムの守護者という立場も前面に出した。
      異教徒やシーア派への遠征を聖戦として説明し、スーフィーの長老たちの支持を得る。
      モンゴルの伝統とイスラムの権威、二つの正統性を使い分ける統治だった。
      1370年という年は、モンゴル帝国の秩序が中央アジアで終わり、トルコ・イスラム的な国家に置き換わる区切りとして扱われる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/43/Tamerlan.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tamerlan.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール

  - id: ankara-battle
    year: 1402
    title: アンカラの戦い
    category: war
    tags: [ティムール, オスマン]
    summary: ティムールがオスマン皇帝を捕らえ、オスマンは一時崩壊状態になった。
    detail: |
      1402年、アンカラ近郊でティムール軍がオスマン帝国軍を破った戦い。
      14世紀末、東からティムールが、西からオスマンのバヤズィト1世がそれぞれアナトリアへ勢力を広げて接していた。
      両者は書簡を交わしたが、互いに相手を格下と見なす文面が事態を悪化させたと伝えられる。

      直接のきっかけは、ティムールに追われた東アナトリアの君侯がバヤズィトのもとへ逃げ込み、逆にオスマンに領地を奪われた君侯がティムールに保護を求めたことだった。
      双方が相手の敵をかくまう形になる。

      7月、両軍はアンカラ近郊のチュブクの平原で対峙した。
      ティムールは事前に水場を押さえてオスマン軍を炎天下で渇かせ、さらにアナトリアの旧君侯の家臣たちに呼びかけて寝返らせる工作を進めていた。
      戦闘が始まると彼らが次々に離反し、イェニチェリは踏みとどまったものの大勢は決し、バヤズィトは捕らえられる。

      オスマン帝国は君主を失い、四人の王子が争う「空位時代」に入った。
      十一年にわたる内戦で国家は事実上解体し、バルカンの征服も止まる。
      この結果、風前の灯だったコンスタンティノープルは半世紀の猶予を得た。
      ビザンツ帝国の滅亡が1453年まで延びたのは、この戦いによるところが大きい。
      ティムール自身はアナトリアに留まらず、旧君侯に領地を返して引き上げている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/Timur_Review_His_Troops_Before_the_Battle_of_Ankara%2C_Zafarnama_1436.jpg/500px-Timur_Review_His_Troops_Before_the_Battle_of_Ankara%2C_Zafarnama_1436.jpg
      credit: 1436 painting / Public domain
      page: https://commons.wikimedia.org/wiki/File:Timur_Review_His_Troops_Before_the_Battle_of_Ankara,_Zafarnama_1436.jpg
