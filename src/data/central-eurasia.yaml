  - id: ulugh-beg
    year: 1420
    title: ウルグ・ベクの天文台
    category: science
    tags: [中央アジア, 天文学]
    summary: 肉眼観測で当時世界最高精度の星表を作り、ヨーロッパにも影響した。
    detail: |
      1420年代にティムールの孫ウルグ・ベクがサマルカンドに築いた天文台。
      彼は父シャー・ルフのもとでこの都の統治を任されており、学問、とりわけ天文学に強い関心を持っていた。

      三階建ての円筒形の建物に、半径40メートルを超える巨大な六分儀が据えられた。
      地下まで掘り下げた溝に弧を設け、太陽や星が子午線を通る高さを測る仕組みである。
      大きな器械ほど目盛りを細かく刻めるという、望遠鏡以前の天文学の原則に忠実な設計だった。
      ここにはカーシーやカーズィーザーデといった当代一流の学者が集められ、ウルグ・ベク自身も観測に参加している。

      三十年近い観測の成果が『ウルグ・ベク天文表』にまとめられた。
      1018個の恒星の位置を記した星表は、プトレマイオス以来の値を大きく改めるものである。
      一年の長さは365日6時間10分8秒と求められ、現在の値との差はわずか25秒ほどだった。

      1449年にウルグ・ベクが殺されると天文台は放棄され、やがて破壊されて土に埋もれ、場所すら忘れられた。
      1908年、ロシアの考古学者ヴャトキンが記録を手がかりに発掘し、地下に残る六分儀の弧が姿を現す。
      星表そのものは写本として伝わり、17世紀にはオックスフォードで刊行された。
      イスラム圏の科学が西欧へ流れ込んだ経路のひとつになっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/Ulugh_Beg_Observatory%281%29_2023.jpg/500px-Ulugh_Beg_Observatory%281%29_2023.jpg
      credit: ほっきー / CC0
      page: https://commons.wikimedia.org/wiki/File:Ulugh_Beg_Observatory(1)_2023.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウルグ・ベク天文台

  - id: timur-death
    year: 1405
    title: ティムールの死
    category: politics
    tags: [中央アジア, 明]
    summary: 明への遠征の途上で没し、中央アジアの統一は続かなかった。
    detail: |
      1405年2月、明への遠征に出たティムールがシル川沿いのオトラルで病没した出来事。
      1941年、ソ連の学者ゲラシモフがグーリ・アミール廟を発掘して遺骨を調べ、足と腕の負傷を確認した。
      頭蓋骨から復元された顔は、今日よく知られる肖像の元になっている。
      発掘の直後に独ソ戦が始まったことから、墓を暴いた祟りだという話も語られた。

      前年末、彼はサマルカンドで大規模な祝宴と閲兵を行い、明への遠征を宣言していた。
      元を倒して中国を支配した明に対し、モンゴルの後継者として討伐を掲げたのである。
      遠征の規模は二十万ともいわれ、道中の各地に食料と馬を備えさせる準備が進められた。
      厳冬の最中に出発したのは、砂漠を凍った地面の上で越えるためだったとみられる。

      軍がオトラルに達したところで彼は発病し、まもなく没した。
      享年六十八。
      遠征はただちに中止され、軍は引き返す。
      遺体はサマルカンドへ運ばれ、青いドームで知られるグーリ・アミール廟に葬られた。

      死の直後から後継争いが始まった。
      指名されていた孫は支持を集められず、各地の総督となっていた子や孫が互いに争う。
      最終的に四男シャー・ルフがヘラートを本拠に全体をまとめたが、西方のイラク・アゼルバイジャンは失われ、版図は大きく縮んだ。
      一代の武力と個人の威名で結ばれた帝国のもろさがはっきり出た形である。
      もっとも、縮んだ後のティムール朝は天文学・細密画・建築の面で花開いた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/43/Tamerlan.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tamerlan.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール

  - id: uzbek-shaybanid
    year: 1500
    circa: true
    title: ウズベクの中央アジア支配
    category: politics
    tags: [中央アジア]
    summary: ティムール朝が倒れ、オアシス都市がハン国に分かれていく。
    detail: |
      15世紀後半から16世紀初めにかけて、キプチャク草原のウズベク集団が南下してティムール朝の版図を受け継いだ動き。
      指導したのはジョチ裔のシャイバーニー・ハンである。

      この移動によって、マー・ワラー・アンナフルの支配層はモンゴル系のティムール家から、トルコ語を話すウズベクの諸部族へ入れ替わった。
      都市の住民や農民は大きく変わらず、支配の上層だけが交代した形である。

      ウズベクの国家は、一人の君主が集権的に治めるものではなかった。
      王族が土地を分け持ち、有力者の合議で事を決めるため分裂しやすく、16世紀を通じてブハラを中心とする勢力とヒヴァ（ホラズム）の勢力が並び立つ。
      18世紀にはフェルガナ盆地にコーカンド・ハン国が興り、いわゆる三ハン国の時代になった。

      経済はオアシスの農業と隊商交易が支えだったが、海路の発展で内陸の富は細っていく。
      西のサファヴィー朝がシーア派を国教としたため対立は宗派の色を帯び、争いと内紛のなかで軍事技術の革新からも取り残された。
      19世紀後半、三ハン国はロシア帝国に次々と併合される。
      この時代に整えられた都市の景観は、今日ヒヴァやブハラの旧市街として世界遺産に登録されている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウズベク人

  - id: kazan-conquest
    year: 1552
    title: ロシアのカザン征服
    category: war
    tags: [ロシア, 遊牧]
    summary: 定住国家が火器で草原を押し返し始めた転換点。
    detail: |
      1552年、モスクワのイヴァン4世がカザン・ハン国を滅ぼした出来事。
      カザンはジョチ・ウルスが分裂してできた国のひとつで、ヴォルガ川中流を押さえ、毛皮と隊商の交易で栄えていた。

      モスクワにとって、この国は東へ広がるうえでの栓だった。
      カザンを通らなければヴォルガの下流にも、その先のカスピ海にも出られない。
      国境の村はたびたび襲われ、捕らえた住民を奴隷として売る商いも続いていた。

      イヴァン4世は二度の失敗の後、周到に準備を重ねた。
      カザンの上流に木造の要塞スヴィヤジスクを組み立てて運び、短期間で築いて前進基地とする。
      1552年夏、十五万ともいわれる軍と大量の火砲を集めて包囲した。
      西欧から招いた技師が城壁の下に坑道を掘って火薬を仕掛け、爆破によって城壁を崩し、10月に市街戦の末カザンは陥落する。

      四年後にはアストラハンも併合され、ロシアはヴォルガ川の全流域とカスピ海への出口を得た。
      多民族・多宗教の住民を抱える帝国への転換点でもある。
      軍事史の面では、火器と工兵を備えた定住国家が機動力に頼る草原の政権を正面から屈服させた早い例にあたる。
      この勝利を記念して建てられたのが、モスクワ赤の広場の聖ワシリイ大聖堂である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/Kazan_Khanate_map_Tatar.svg/500px-Kazan_Khanate_map_Tatar.svg.png
      credit: User:Untifler / Public domain
      page: https://commons.wikimedia.org/wiki/File:Kazan_Khanate_map_Tatar.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カザン・ハン国

  - id: steppe-decline
    year: 1600
    circa: true
    title: 草原の交易路の後退
    category: economy
    tags: [交易, 航海]
    summary: 海路が主役になり、1500年続いた内陸の交易が相対的に沈んでいった。
    detail: |
      16世紀以降、ユーラシアの交易の重心が内陸から海へ移り、シルクロードが相対的に沈んでいった過程。
      喜望峰をまわる航路が定着し、続いてアメリカ大陸との航路も開かれると、大量の物資を安く運ぶ手段は船になった。
      同時期に、アメリカ大陸の銀が太平洋と大西洋の両方から中国へ流れ込み、世界の経済の結び目は海沿いの港へ移っていった。
      もっとも内陸の交易が絶えたわけではなく、茶・馬・綿布の取引は19世紀まで続いている。

      内陸の隊商路はこれに太刀打ちできない。
      ラクダの背に載せられる量は限られ、道中では関税と護衛の費用がかさむ。
      高価で軽い品に絞れば成り立つが、規模では海に及ばなかった。

      陸の側でも条件が悪化した。
      ティムール朝の分裂後、中央アジアは三つのハン国に割れて互いに争い、通行の安全が保てなくなる。
      サファヴィー朝とウズベクの宗派対立も往来を妨げた。
      中国でも銀の流入が海路から来るようになり、内陸の関所を通る商いの比重は下がっていく。

      さらに、火器の普及が軍事の均衡を崩した。
      騎射の機動力は、大砲と要塞、補給を支える官僚機構を持つ定住国家の前で優位を失い、ロシアと清が草原を東西から挟み込んでいく。
      オアシス都市の収入は細り、中央アジアは世界の交差点から内陸の周縁へと位置を変えた。
      これは地域が「遅れた」のではなく、世界の物流の構造そのものが変わった結果である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/SeidenstrasseGMT.JPG/500px-SeidenstrasseGMT.JPG
      credit: Kelvin Case / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:SeidenstrasseGMT.JPG
    links:
