        url: https://ja.wikipedia.org/wiki/タラス河畔の戦い

  - id: uyghur-collapse
    year: 840
    title: キルギスによるウイグル可汗国の崩壊
    category: war
    tags: [遊牧]
    summary: ウイグル人が西へ移り、今の新疆のトルコ系社会の原型になった。
    detail: |
      840年、ウイグル可汗国が北のキルギスの攻撃を受けて崩壊した出来事。
      直接の引き金はキルギスの侵攻だが、その前に国は弱りきっていた。
      数年続いた寒波と疫病で家畜が大量に死に、可汗位をめぐる内紛が続く。
      離反した将軍がキルギスを手引きしたと伝えられる。

      都のカラ・バルガスンは焼かれ、可汗は殺された。
      モンゴル高原の支配はキルギスに移るが、彼らはこの草原を長く保つ意思を持たず、やがて北へ引き上げる。
      高原はしばらく統一勢力を欠く状態が続き、次にここをまとめるのは10世紀の契丹、さらに13世紀のモンゴルである。

      歴史的に大きかったのは、敗れたウイグルの人々が西と南へ移動したことだった。
      一部は天山東部のトルファンやベシュバリクに入って西ウイグル王国を建て、一部は河西回廊に移って甘州ウイグルとなる。
      彼らは遊牧を離れ、オアシスの農耕と交易に生きるようになった。

      この移住によって、それまでインド・ヨーロッパ語系の住民が多かったタリム盆地一帯が、しだいにテュルク語を話す社会へ変わっていく。
      今日「ウイグル」と呼ばれる人々と新疆のテュルク系社会は、この崩壊と移動を出発点としている。
      また、南へ迫ったウイグルの圧力は、唐の武宗による仏教弾圧（会昌の廃仏）の背景にもなった。
      ウイグルが信じたマニ教の寺院が没収され、外来宗教全体への統制が強まったのである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/%E5%9B%9E%E9%B6%BB%E5%8F%AF%E6%B1%97%E5%9B%BD%E3%81%AE%E7%89%88%E5%9B%B3.png/500px-%E5%9B%9E%E9%B6%BB%E5%8F%AF%E6%B1%97%E5%9B%BD%E3%81%AE%E7%89%88%E5%9B%B3.png
