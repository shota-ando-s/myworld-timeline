        url: https://ja.wikipedia.org/wiki/シルクロード

  - id: dzungar-fall
    year: 1757
    title: ジュンガルの滅亡
    category: war
    tags: [清, 遊牧]
    summary: 最後の遊牧帝国が清に滅ぼされ、草原の時代が終わった。
    detail: |
      1755年から1757年にかけて、清の乾隆帝がジュンガルを滅ぼした一連の遠征。
      1745年にガルダンツェリンが没すると国は激しい後継争いに陥り、有力者アムルサナーが敗れて清に投降し、遠征を促したことが引き金になった。

      1755年、清は大軍を派遣してイリ地方を制圧する。
      ジュンガルの君主ダワチは捕らえられ、あっけなく崩れた。
      ところが、期待した地位を得られなかったアムルサナーが翌年反旗を翻す。
      乾隆帝はこれを裏切りと受け止め、ジュンガルそのものを根絶やしにする方針へ転じた。

      1757年までの掃討は苛烈だった。
      清の記録は、逃亡した者・殺された者・病で死んだ者を合わせて人口がほとんど失われたと伝える。
      当時流行していた天然痘が被害を拡大させた。
      研究者はこの措置を、近代以前における民族の意図的な絶滅の例として論じている。

      空いた土地には、内地からの漢人、東トルキスタンのウイグル人、満洲の兵などが移された。
      乾隆帝はこの地を「新疆」、すなわち新たに得た領域と名づける。
      清の版図はここで最大となり、内陸アジアから中華世界を脅かす遊牧勢力は姿を消した。
      二千年にわたって続いた、草原と農耕地帯のせめぎ合いという歴史の構図そのものが終わったのである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/%E3%82%B8%E3%83%A5%E3%83%B3%E3%82%AC%E3%83%AB%E5%B8%9D%E5%9B%BD.png/500px-%E3%82%B8%E3%83%A5%E3%83%B3%E3%82%AC%E3%83%AB%E5%B8%9D%E5%9B%BD.png
