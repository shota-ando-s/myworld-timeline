lane: central-eurasia

periods:
  - id: scythians
    title: スキタイ
    start: -700
    startCirca: true
    end: -300
    endCirca: true
    category: war
    tags: [遊牧, 黒海]
    summary: 騎馬と黄金細工で知られる最初期の遊牧国家。ギリシア人が詳しく記録した。
    detail: |
      黒海の北からカザフ草原にかけての草原地帯で、前7世紀ごろから目立つ存在になった騎馬遊牧の集団。
      イラン系の言葉を話したとみられ、統一した国家というより、王族スキタイと呼ばれる集団を中心にゆるくまとまった連合だった。
      ヘロドトスは彼らを王族・遊牧・農耕などに分けて記しており、草原の真ん中で家畜を追う集団と、ギリシア植民市に穀物を売る定住寄りの集団が同じ名で括られていたらしい。
      前7世紀には先住のキンメリア人を追って南下し、コーカサスを越えてメディアやアッシリアを脅かした。
      オリエントの史料に現れるこの時期の「アシュグザイ」が彼らにあたるとされる。
      強さの中心は馬上から射る合成弓だった。
      短く反り返った弓を鞍上で扱う技術と、機動力を生かして退きながら射る戦法は、のちの匈奴・突厥・モンゴルまで草原の軍隊の基本であり続ける。
      前513年ごろダレイオス1世が大軍で遠征したときも、彼らは決戦を避けて後退し、井戸を埋めながら敵を消耗させて追い返した。
      遺物でよく知られるのが、鹿や豹、グリフィンをかたどった黄金の装飾。
      クルガンと呼ばれる墳丘墓から、武具・馬具・殉葬された馬とともに大量に出土する。
      この動物文様はアルタイのパジリク古墳群などを経て東へ伝わり、中国北方の青銅器にも影響を与えた。
      前3世紀以降、同じイラン系のサルマタイに押されて衰え、クリミアに残った勢力も3世紀までに姿を消す。
      スキタイの名は、ギリシア人が黒海北岸で接した人々に与えた呼称であり、彼ら自身の自称ではない。
      同じ文化を持つ集団はカザフ草原からアルタイ、さらにモンゴル西部まで広がり、まとめてスキト・シベリア文化圏と呼ばれる。
      アルタイのパジリク古墳では、永久凍土のおかげで織物・馬具・人体の刺青まで残っていた。
      中国の絹やペルシアの絨毯も副葬されており、草原が早くから東西を結んでいたことを示す。
      遊牧民は文字を持たなかったため、その姿はもっぱら周囲の定住社会の記録と、墓から出る品によって知られる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/%E3%82%B9%E3%82%AD%E3%82%BF%E3%82%A4%E3%81%A8%E3%81%9D%E3%81%AE%E5%91%A8%E8%BE%BA%E5%9B%BD.png/500px-%E3%82%B9%E3%82%AD%E3%82%BF%E3%82%A4%E3%81%A8%E3%81%9D%E3%81%AE%E5%91%A8%E8%BE%BA%E5%9B%BD.png
      credit: トムル / CC BY-SA 4.0
