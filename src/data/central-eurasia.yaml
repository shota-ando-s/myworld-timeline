        url: https://ja.wikipedia.org/wiki/チャガタイ・ウルス

  - id: golden-horde
    title: キプチャク・ハン国
    start: 1242
    end: 1502
    category: politics
    tags: [モンゴル, ロシア]
    summary: 南ロシアの草原を支配し、ルーシ諸公を240年従属させた。
    detail: |
      バトゥが西方遠征ののちヴォルガ下流に築いた国。
      モンゴル語ではジョチ・ウルス、すなわちチンギスの長男ジョチの一族の領分という。
      「金帳汗国」の呼び名は、君主の黄金の天幕に由来する後世の名称である。

      版図はドナウ川の河口からカザフ草原まで広がったが、支配の中心は都サライと交易路にあった。
      住民の多くはテュルク系のキプチャクで、征服者であるモンゴル人はやがてその言葉と暮らしに溶け込んでいく。
      ルーシ諸公国は直接統治されず、貢納の義務と、公位を承認する免状を受け取りに都へ赴く義務を課された。
      徴税を請け負ったモスクワ公は、その立場を利用して力を蓄えていく。

      バトゥの弟ベルケの代にイスラムを受け入れ、エジプトのマムルーク朝と結んで同じモンゴルのイルハン朝と争った。
      14世紀前半のウズベク・ハンの時代に国教化が進み、サライは国際的な商業都市として最盛期を迎える。

      衰退は14世紀後半に始まった。
      黒死病で人口が失われ、ハン位をめぐる争いが続き、1380年にはクリコヴォでモスクワ大公に敗れる。
      決定的だったのはティムールの攻撃で、1395年の遠征でサライが破壊され、交易路も南へ移った。
      15世紀にはカザン、クリミア、アストラハンなどのハン国に分かれ、1480年のウグラ川の対峙でモスクワは貢納をやめる。
      ロシアの国家形成には、徴税や駅伝の仕組みなどモンゴル由来のものが数多く残った。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Flag_of_the_Golden_Horde_in_the_Catalan_Atlas_%28published_in1375%29.png/500px-Flag_of_the_Golden_Horde_in_the_Catalan_Atlas_%28published_in1375%29.png
