events:
  - id: yuezhi-defeat
    year: -176
    circa: true
    title: 匈奴が月氏を破る
    category: war
    tags: [遊牧, 中央アジア]
    summary: 追われた月氏が西へ移動し、のちにクシャーナ朝を生む連鎖が始まった。
    detail: |
      月氏はもともと敦煌から祁連山にかけての河西回廊を本拠とし、玉の交易で栄えて匈奴に対して優位に立っていた。
      冒頓単于は若いころ、この月氏に人質として送られている。
      インド・ヨーロッパ語族のトカラ人にあたるとする説が有力だが、決着はついていない。
      立場が逆転したのは冒頓が草原を統一してからで、前176年ごろの攻撃で月氏は大きく破れた。
      続く老上単于の代には王が殺され、その頭蓋骨が杯にされたと伝えられる。
      本拠を失った主力は西へ移り、イリ地方で烏孫に押されてさらに南下、アム川の北に落ち着いて大月氏と呼ばれた。
      そこでギリシア系のバクトリア（大夏）を従え、五つの翕侯に分かれて支配する。
      1世紀にそのひとつクシャーナ翕侯が他を統合し、クシャーナ朝が興った。
      2世紀のカニシカ王のもとで北インドまで版図を広げ、ガンダーラ美術と大乗仏教が東へ流れ出す拠点になる。
      祁連山に残った集団は小月氏と呼ばれた。
      この動きは東にも跳ね返った。
      匈奴を挟み撃ちにしようと考えた漢の武帝は、大月氏と同盟を結ぶため張騫を送り出す。
      張騫は往路で匈奴に捕らえられて十年抑留され、ようやくたどり着いた大月氏はすでに豊かな土地に落ち着いていて復讐に関心を示さなかった。
      同盟は実らなかったが、十三年ぶりに持ち帰られた西域の詳細な情報が漢の西方進出を促し、のちにシルクロードと呼ばれる交易路が開けていく。
      月氏の移動は、ユーラシアの人の動きが連鎖する様子をよく示している。
      匈奴が月氏を押し、月氏が烏孫と争い、さらに南のバクトリアを倒す。
      玉突きのように民族が入れ替わった。
      この連鎖の西の端で、ギリシア人がインド北西部に築いた勢力は消えたが、その文化は残った。
      クシャーナ朝のもとで、ギリシア彫刻の技法と仏教が結びついてガンダーラ美術が生まれる。
      仏像が人のかたちで作られるようになったのはこの地である。
      中国の史料に見える「大月氏」の記述は、中央アジア史を再構成するうえで今も重要な手がかりになっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/XiongnuMap.png/500px-XiongnuMap.png
      credit: Gabagool / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:XiongnuMap.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/匈奴

  - id: huns-westward
    year: 375
    title: フン族の西進とゲルマン民族大移動
    category: war
    tags: [遊牧, ヨーロッパ]
    summary: 草原の一押しがヨーロッパ全体を動かし、西ローマ滅亡の連鎖につながった。
    detail: |
      4世紀後半、東からフン族が黒海北岸に現れた。
      まずヴォルガとドンの間にいたアラン人を破り、次いでドニエプル川方面の東ゴート王国を打ち砕く。
      375年ごろのこの衝撃が、ヨーロッパの民族移動の引き金になった。
      彼らの出自は明らかでなく、中央アジアから移動した遊牧民とされるが、匈奴との関係は証明されていない。
      押し出された西ゴートはドナウ川の南への避難をローマ皇帝ウァレンスに願い出て認められた。
      ところが受け入れ側の役人が食料を不当な値で売りつけ、飢えた彼らは蜂起する。
      378年のハドリアノポリスの戦いで皇帝自身が戦死し、東方の野戦軍は壊滅した。
      帝国が国境の内側で異民族の軍に敗れたこの事件は、軍事的な威信を決定的に傷つけている。
      以後、堰を切ったように移動が続いた。
      406年の大晦日にはヴァンダル・スエビ・アラン人が凍ったライン川を渡ってガリアへ入り、さらにヒスパニアへ抜ける。
      410年には西ゴートのアラリックがローマ市を略奪し、永遠の都が八百年ぶりに敵の手に落ちたことがローマ世界に衝撃を与えた。
      429年にはヴァンダルが北アフリカへ渡り、帝国は穀倉地帯と税収を失う。
      フン族自身はパンノニアを拠点にアッティラのもとで最大化し、453年の彼の死とともに崩れた。
      だが動き出したゲルマン諸族はもう止まらず、各地に王国を築いていく。
      476年の西ローマ皇帝の廃位は、この長い過程の最後の一幕にすぎない。
      民族移動の原因をフン族の一撃だけに求める見方は、近年では修正されている。
      ローマ側の国境防衛の弱まり、気候の変動、ゲルマン社会の内部の変化など、複数の要因が重なったと考えられている。
      また、移動した集団は整然とした「民族」ではなく、戦士を核に様々な出自の人々が集まった流動的な集団だった。
      ゴートやヴァンダルといった名も、移動の過程で形を変えている。
      それでも375年が画期とされるのは、この年を境にローマ帝国が国境の外の勢力を制御できなくなったからである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e0/Europa_Germanen_50_n_Chr.svg/500px-Europa_Germanen_50_n_Chr.svg.png
      credit: Karl Udo Gerth / Public domain
      page: https://commons.wikimedia.org/wiki/File:Europa_Germanen_50_n_Chr.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ゲルマン人
    related: [west-rome-fall]

  - id: attila
    year: 451
    title: アッティラのガリア遠征
    category: war
    tags: [フン族, ヨーロッパ]
    summary: 「神の鞭」と恐れられた王の進撃がカタラウヌムで止まった。
    detail: |
      451年、アッティラの率いる軍がライン川を渡ってガリアに入った。
      フン族に加えて東ゴート・ゲピドなど従属する諸族を含む混成の大軍で、メスをはじめ各地を焼きながら進み、ロワール川のオルレアンを包囲する。
      ガリアのローマ支配そのものが危うくなった。
      迎え撃ったのは西ローマの将軍アエティウス。
      若いころフン族のもとで人質として暮らし、その戦い方も内情も知る人物だった。
      彼は長年争ってきた西ゴート王テオドリック1世を説き伏せて同盟を組み、ブルグンド人やフランク人、アラン人も加えた連合軍を編成する。
      オルレアンの包囲は連合軍の接近で解かれた。
      両軍はシャンパーニュ地方のカタラウヌムの野（現在のシャロン近郊とされる）で激突した。
      高地の奪い合いから始まった戦闘は日没まで続き、西ゴート王テオドリックは落馬して踏み殺される。
      フン軍は陣に退いて荷車で囲いを作り、翌日アッティラは撤退を選んだ。
      決着がついた戦いではなかったが、フン族のガリア侵入はここで止まる。
      アエティウスは撤退するフン軍を追撃せず、新たに王となった西ゴートのトリスムンドを本国へ帰らせた。
      フン族を完全に潰せば西ゴートが強くなりすぎるという計算だったとみられ、この判断は後世さまざまに評価されている。
      彼自身は454年、猜疑にかられた皇帝ウァレンティニアヌス3世に自ら剣で殺された。
      西ローマは最後の有能な将軍を失い、以後の崩壊は加速する。
      この戦いは、ローマとゲルマンの連合が非ヨーロッパ的な侵入者を食い止めた一戦として、近代のヨーロッパで象徴的に語られてきた。
      19世紀の歴史画や、20世紀の戦時宣伝にも繰り返し使われている。
      実際には、双方ともゲルマン諸族を多数抱えた混成軍であり、文明と野蛮の対決という構図は後付けである。
      正確な戦場の位置も特定されていない。
      シャロン＝アン＝シャンパーニュ近郊とする説が有力だが、確証はなく、候補地はいくつもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/Attila_in_Gaul_451CE.svg/500px-Attila_in_Gaul_451CE.svg.png
      credit: 投稿者自身による著作物 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Attila_in_Gaul_451CE.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カタラウヌムの戦い

  - id: gokturk-submits
    year: 630
    title: 東突厥が唐に服属
    category: war
    tags: [突厥, 唐]
    summary: 唐の皇帝が遊牧世界の盟主「天可汗」を兼ねる体制が生まれた。
    detail: |
      隋末の混乱期、東突厥は中国の群雄に支援を与えて影響力を保ち、唐の高祖・李淵もはじめは突厥に贈り物をして背後を固めていた。
      626年、玄武門の変で即位したばかりの太宗のもとへ頡利可汗が大軍で迫り、長安の北の渭水まで来たときには、太宗が単身で川を挟んで談判し、財物を贈って退かせている（渭水の盟）。
      流れが変わったのは自然と内紛だった。
      627年から続いた大雪で家畜が大量に死に、支配下の薛延陀・回紇（ウイグル）が離反する。
      太宗はこの機をとらえて630年、李靖に大軍を率いさせて急襲させた。
      頡利可汗は捕らえられて長安へ送られ、東突厥第一可汗国は倒れる。
      唐は降った遊牧民を北辺に住まわせ、その首長をそのまま都督として支配させる羈縻政策を取った。
      諸部族は太宗に「天可汗」の称号を奉り、中華の皇帝が同時に草原の盟主を兼ねる体制が生まれる。
      この二重の立場は、のちの唐の西域経営を支える土台になった。
      ただし服属は永続しなかった。
      682年に突厥は独立を回復し、唐は再び北方の強大な相手と向き合うことになる。
      それでも、遊牧の君主号と中華の帝号をひとりが兼ねるという発想はここで生まれ、のちの遼・元・清のような征服王朝の統治の形を先取りするものになった。
      羈縻政策のもとで、突厥の遺民は長城の内外に置かれ、その首長が唐の官職を帯びた。
      彼らの子弟は長安で宿衛に就き、唐の軍人として各地で戦っている。
      安史の乱で活躍した将軍にも、こうした出自の者が多い。
      一方で、唐に移り住んだ集団と草原に残った集団の間には溝が生まれた。
      682年の独立はその不満が表面化したもので、オルホン碑文には、唐に仕えた五十年を「貴族の子は奴隷となり、娘は婢となった」と嘆く一節がある。
      服属と独立の間を揺れ動くこの関係は、以後の中華王朝と北方勢力のあいだで繰り返されていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Eastern_Gokturk.png/500px-Eastern_Gokturk.png
      credit: Gabagool / Public domain
      page: https://commons.wikimedia.org/wiki/File:Eastern_Gokturk.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/東突厥

  - id: talas
    year: 751
    title: タラス河畔の戦い
    category: war
    tags: [イスラム, 唐, 技術伝播]
    summary: 唐がアッバース朝に敗れ、この時に製紙法が西へ伝わったとされる。
    detail: |
      8世紀半ば、唐は西域を都護府のもとに置き、パミールを越えて中央アジアの諸国にまで影響を広げていた。
      同じころ西からは、ウマイヤ朝を倒したばかりのアッバース朝がマー・ワラー・アンナフル（中央アジアの河間地方）へ進出している。
      両者の勢力圏はソグド地方で接した。
      きっかけは唐の安西節度使・高仙芝の強引な振る舞いだった。
      彼は石国（タシュケント）の王を謀って殺し、財貨を奪う。
      逃れた王子がアッバース朝に救援を求め、751年、両軍はタラス川のほとりで衝突した。
      数日の対陣ののち、唐側に加わっていたカルルクが寝返って背後を突き、唐軍は大敗する。
      高仙芝はわずかな兵とともに逃れた。
      唐はこの四年後に安史の乱を迎えて西域から兵を引き、中央アジアの主導権は決定的にイスラム勢力へ移る。
      以後この地はイスラム化とトルコ語化の道をたどった。
      この戦いは、捕虜になった唐の職人から製紙法が西へ伝わったきっかけとしても語られる。
      サマルカンドに製紙工房ができ、やがてバグダード、さらに北アフリカを経てヨーロッパへ広がった、という筋書きである。
      ただし製紙技術の西伝はもっと段階的だったとする見方もあり、この戦いを唯一の起点とするのは単純化だとされる。
      戦場となったタラスは現在のキルギスとカザフスタンの国境付近にあたり、正確な位置は特定されていない。
      動員された兵力も史料によって差が大きく、唐側三万、アッバース側十数万とも伝えられるが確かめようがない。
      この戦いを中央アジアの帰趨を決した決戦と見る評価は、近代以降に強まったものである。
      実際には、四年後の安史の乱による唐の後退のほうが決定的だったという見方も有力だ。
      捕虜となった唐の兵士のひとり杜環は、アッバース朝領内を十年余り旅して帰国し、その見聞を『経行記』に残した。
      断片しか伝わらないが、中国人が記した最初期のイスラム世界の記録である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/China_map_2.jpg/500px-China_map_2.jpg
      credit: "Original: 俊武 Later versions: Garam / CC BY-SA 3.0"
      page: https://commons.wikimedia.org/wiki/File:China_map_2.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/タラス河畔の戦い

  - id: uyghur-collapse
    year: 840
    title: キルギスによるウイグル可汗国の崩壊
    category: war
    tags: [遊牧]
    summary: ウイグル人が西へ移り、今の新疆のトルコ系社会の原型になった。
    detail: |
      840年、ウイグル可汗国は北のイェニセイ川上流にいたキルギスの攻撃を受けて崩壊した。
      直接の引き金はキルギスの騎兵十万といわれる侵攻だが、その前に国は弱りきっていた。
      数年続いた寒波と疫病で家畜が大量に死に、可汗の位をめぐる内紛が続いて、離反した将軍がキルギスを手引きしたと伝えられる。
      都のカラ・バルガスンは焼かれ、可汗は殺された。
      モンゴル高原の支配はキルギスに移るが、彼らはこの草原を長く保つ意思を持たず、やがて北へ引き上げる。
      高原はしばらく統一勢力を欠く状態が続き、次にここをまとめるのは十世紀の契丹、さらに十三世紀のモンゴルである。
      歴史的に大きかったのは、敗れたウイグルの人々が西と南へ移動したことだった。
      一部は天山東部のトルファン・ベシュバリクに入って西ウイグル王国を建て、一部は河西回廊に移って甘州ウイグルとなる。
      彼らは遊牧を離れてオアシスの農耕と交易に生きるようになった。
      この移住によって、それまでインド・ヨーロッパ語系の住民が多かったタリム盆地一帯が、しだいにテュルク語を話す社会へ変わっていく。
      今日「ウイグル」と呼ばれる人々と新疆のテュルク系社会は、この840年の崩壊と移動を出発点にしている。
      キルギスは高原を長く保たず、10世紀にはイェニセイ川方面へ戻った。
      以後モンゴル高原は小さな部族が割拠する状態が続き、統一勢力が現れるまで三百年以上かかる。
      南へ移った一部は唐の北辺に迫り、840年代の武宗による仏教弾圧（会昌の廃仏）の背景にもなった。
      ウイグルが信じたマニ教の寺院が没収され、外来宗教全体への統制が強まったのである。
      この崩壊は、草原の国家が天候と内紛にいかに弱いかを示す例としてしばしば引かれる。
      家畜を失えば軍も国も維持できない。
      この移動はテュルク系の人々が中央アジアの定住地帯へ本格的に入る契機でもあり、トルキスタン、すなわち「テュルクの地」という呼称が定着していく。
