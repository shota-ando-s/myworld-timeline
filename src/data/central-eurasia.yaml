    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/回鶻

  - id: turkic-islam
    year: 960
    circa: true
    title: トルコ系遊牧民のイスラム受容
    category: religion
    tags: [イスラム, トルコ系]
    summary: 草原とイスラム世界が結びつき、以後の西アジア支配層はトルコ系になる。
    detail: |
      10世紀、中央アジアの宗教地図が大きく塗り替わった。
      カラハン朝の君主サトゥク・ブグラ・ハンの改宗を先駆けに、草原とオアシスの境目にいたテュルク系の集団が次々とイスラムを受け入れていく。
      960年ごろには二十万帳が集団で改宗したと伝えられる。

      背景には、サーマーン朝を通じた交流の蓄積があった。
      ブハラやサマルカンドの商人と神秘主義の説教者が草原へ入り、逆にテュルク系の若者は軍人奴隷（マムルーク）として南のイスラム諸王朝へ売られていた。
      日々の接触の厚みが、改宗を受け入れやすくしている。
      教義よりも修行と体験を重んじるスーフィーのあり方は、シャーマニズムの伝統を持つ社会になじみやすかったともいわれる。

      この変化の影響は大きい。
      それまで、イスラム世界にとって北方の遊牧民は略奪者であり信仰の外にいる者だった。
      改宗後は、同じ信仰を持つ勇猛な戦士として迎えられ、軍の中枢に入っていく。
      11世紀にはセルジューク朝がバグダードに入り、カリフからスルタンの称号を得た。

      以後、アラブでもペルシアでもないテュルク系の集団が、イスラム世界の政治と軍事を担う時代が続く。
      マムルーク朝もオスマン帝国も、この流れの上にある。
      東側でも、カラハン朝がタリム盆地へ広がって仏教国ホータンを1006年ごろに征服した。
      中央アジアの仏教は後退し、この地はイスラム圏へ組み込まれていった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/KaraKhanidAD1000.png/500px-KaraKhanidAD1000.png
      credit: Gabagool / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:KaraKhanidAD1000.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カラハン朝

  - id: chinggis-khan
    year: 1206
    title: チンギス・ハンの即位
    category: politics
    tags: [モンゴル]
    summary: 分裂していた草原の諸部族を統合し、世界征服の出発点となった。
    detail: |
      1206年、オノン川の源でクリルタイ（部族長の集会）が開かれ、テムジンがチンギス・カンの称号を受けた。
      称号の意味は「大海のように強大な君主」とも「光の王」とも説かれ、定説はない。

      そこに至るまでに二十年以上の戦いがあった。
      父イェスゲイを毒殺されて一族から離れた少年が、ケレイトのトオリル・ハンに庇護を求め、盟友ジャムカと結び、やがて彼らとも戦って退けた。
      1202年にタタル、1203年にケレイト、1204年にナイマンを破り、高原に対抗できる勢力はいなくなる。

      この集会で行われた組織の作り替えが、以後の歴史を決めた。
      それまで人々は氏族や部族に属していたが、これを解いて千戸・百戸・十戸に編成し直し、九十五の千戸長を自分の判断で任じたのである。
      功績で選ばれた者が指揮官になり、忠誠は血筋ではなく君主個人へ向かうようになった。
      同時に、各千戸長の子弟から選ばれた一万人の親衛隊ケシクが置かれ、幹部の育成と各部隊の統制を兼ねる。

      軍と行政が同じ単位で動く、この単純で強い仕組みによって、遠くへ長く軍を出せるようになった。
      1206年の時点で動員可能な兵は十万程度だったが、その軍が二十年のうちに中国北部から中央アジアまで届く。
      草原の統一はそれまでも幾度か起きていたが、違ったのは、統一が一代で終わらない構造を伴っていたことだった。
      この過程を記した『元朝秘史』は、13世紀半ば成立の現存最古のモンゴル語文献である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/YuanEmperorAlbumGenghisPortrait.jpg/500px-YuanEmperorAlbumGenghisPortrait.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:YuanEmperorAlbumGenghisPortrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チンギス・カン

  - id: mongol-central-asia
    year: 1219
    title: モンゴルの中央アジア遠征
    category: war
    tags: [モンゴル]
    summary: ホラズムを壊滅させ、西方への道を開いた。
    detail: |
      1219年から始まった、モンゴル軍によるホラズム・シャー朝への侵攻。
      前年、チンギス・ハンが送った四百人以上の隊商を、国境の町オトラルの太守が間諜として処刑し、財貨を奪ったことが発端となった。
      派遣された使節も殺されるか辱められて帰される。

      報復として動いた軍は十万から二十万と伝えられ、チンギス自身と四人の息子が別々の方向から進んだ。
      ホラズムのムハンマドは野戦を避けて各都市に兵を分けて守らせたが、これが致命的になる。
      オトラルは五か月の抵抗の末に落ち、1220年にはブハラ、続いてサマルカンドも陥落した。

      抵抗した都市への処置は苛烈だった。
      ウルゲンチでは住民が虐殺され、ニシャプールやメルヴといったホラーサーンの大都市も破壊される。
      同時代の史料が記す数十万という死者の数字には誇張もあるが、灌漑施設の荒廃が長く尾を引いたことは各地の調査で裏づけられている。

      ムハンマドはカスピ海の島まで逃れて病死し、子のジャラールッディーンはインダス川で敗れた。
      追撃に出たジェベとスブタイの部隊はコーカサスを越え、1223年にカルカ河畔でルーシ諸公軍を破って帰還する。
      この遠征でモンゴルは中央アジアとイランへの道を開き、同時にヨーロッパへの偵察を済ませた。
      十数年後のバトゥの西征は、このとき得た情報の上に立っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Standards_of_Genghis_Khan.png/500px-Standards_of_Genghis_Khan.png
      credit: Sci Show With Moh / CC0
      page: https://commons.wikimedia.org/wiki/File:Standards_of_Genghis_Khan.png
    links:
