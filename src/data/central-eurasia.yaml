  - id: timurid
    title: ティムール朝
    start: 1370
    end: 1507
    category: politics
    tags: [中央アジア]
    summary: サマルカンドを都にモンゴルの再興を掲げ、学芸を保護した。
    detail: |
      ティムールが一代で築いた版図を、その子孫が受け継いだ王朝。
      中心はマー・ワラー・アンナフルとホラーサーンで、都はサマルカンド、のちにヘラートへ移った。
      ティムール自身はチンギスの血を引かないため、ハンを名乗らず「大アミール」を称し、チャガタイ家の人物を傀儡のハンに立てて正統性を補った。
      モンゴルの後継を名乗りながら、実態はトルコ・イスラム的な国家だった。
      1405年にティムールが没すると、広げた領土は息子と孫の争いで縮む。
      四男シャー・ルフがヘラートを本拠に全体をまとめ直し、1447年まで比較的安定した時代を築いた。
      この王朝が歴史に残したのは、征服よりも文化である。
      ペルシア語の詩とチャガタイ・トルコ語の文学、細密画（ミニアチュール）、建築が高い水準に達した。
      ヘラートの画家ビフザードの作品は、のちのサファヴィー朝やムガル帝国の絵画の手本になる。
      サマルカンドにはレギスタン広場やビービー・ハーヌム・モスク、ティムールの廟グーリ・アミールが建てられた。
      青いタイルで覆われた建築は、中央アジアのイスラム建築の頂点とされる。
      シャー・ルフの子ウルグ・ベクは天文台を築いて精密な星表を作り、君主が学者でもあるという稀な例を残した。
      1449年のウルグ・ベク殺害以後は内紛が続き、勢力は衰えていく。
      1500年前後、北から南下したウズベクのシャイバーニー・ハンにサマルカンド、次いでヘラートを奪われ、王朝は終わった。
      ただし血筋は絶えなかった。
      追われた王族バーブルはカーブルへ逃れ、1526年に北インドへ入ってムガル帝国を開く。
      ムガルとはペルシア語でモンゴルを指す語で、ティムール朝の直系がインドで三百年続くことになった。
      ティムール朝の文化は、イランからインド、オスマン帝国にまで影響を及ぼした。
      ムガル建築のタージ・マハルにも、その系譜をたどることができる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/04/Timurid_Empire_Map.png/500px-Timurid_Empire_Map.png
      credit: Timur073767 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Timurid_Empire_Map.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール朝

  - id: dzungar-khanate
    title: ジュンガル
    start: 1634
    end: 1757
    category: war
    tags: [遊牧, 清]
    summary: 最後の遊牧帝国。清とロシアに挟まれて滅び、草原の時代が終わった。
    detail: |
      17世紀、天山山脈の北の草原でオイラト系の諸部族をまとめて興った遊牧国家。
      ジュンガルとはモンゴル語で「左翼」を意味する。
      中心となったのはチョロース部で、チンギス裔ではなかった。
      最盛期の版図は、東は現在のモンゴル西部、西はカザフ草原、南はタリム盆地に及んだ。
      オアシス都市を支配して農耕と交易から税を取り、遊牧と定住を組み合わせた経済を築いている。
      特徴的なのは、遊牧国家としては例外的に中央集権が進んでいたことだった。
      人口と家畜を登録して税と兵を徴し、ロシアから技術者を招いて火器を製造した。
      スウェーデン人の捕虜が大砲の鋳造を指導した記録も残る。
      宗教はチベット仏教ゲルク派を奉じ、ダライ・ラマの権威を後ろ盾にした。
      1717年にはチベットへ侵攻してラサを占領している。
      これが清の介入を招き、チベットが清の影響下に入るきっかけになった。
      清とは、モンゴル高原の支配とチベットへの影響力をめぐって三代にわたり争う。
      ガルダン、ツェワンラブタン、ガルダンツェリンと有能な君主が続き、康熙帝・雍正帝の遠征をしのいだ。
      ロシアとは交易相手であり、同時に国境で衝突する相手でもあった。
      二つの帝国に挟まれながら、それを利用して独立を保つ外交を続けている。
      1745年にガルダンツェリンが没すると後継争いが激化し、有力者の一人が清に支援を求めた。
      これが致命傷になる。
      1755年から1757年にかけての乾隆帝の遠征で国は滅び、天然痘の流行も重なって人口の大半が失われた。
      内陸アジアで定住国家に対抗しうる最後の遊牧勢力が、ここで姿を消す。
      ジュンガルの滅亡は、ユーラシアの歴史における一つの区切りとされる。
      これ以後、草原の遊牧勢力が定住の帝国を軍事的に脅かすことはなくなった。
      火器と補給、そして官僚機構を備えた国家が、機動力だけに頼る勢力を最終的に上回ったのである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/%E3%82%B8%E3%83%A5%E3%83%B3%E3%82%AC%E3%83%AB%E5%B8%9D%E5%9B%BD.png/500px-%E3%82%B8%E3%83%A5%E3%83%B3%E3%82%AC%E3%83%AB%E5%B8%9D%E5%9B%BD.png
      credit: トムル / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:%E3%82%B8%E3%83%A5%E3%83%B3%E3%82%AC%E3%83%AB%E5%B8%9D%E5%9B%BD.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジュンガル

  - id: russian-central-asia
    title: ロシアの中央アジア征服
    start: 1865
    end: 1895
    category: war
    tags: [ロシア, 中央アジア]
    summary: 30年でオアシス都市が次々に併合され、草原がロシア帝国の一部になった。
    detail: |
      19世紀半ばまで、中央アジアはブハラ・ヒヴァ・コーカンドの三つのハン国に分かれていた。
      互いに争い、火器の近代化も遅れていた。
      ロシアの南下には複数の動機があった。
      国境の安定、隊商路と奴隷にされた自国民の保護、紡績業のための綿花の確保、そしてイギリス領インドを牽制する戦略である。
      クリミア戦争で西方に敗れた後、東方へ目が向いたという事情もあった。
      1865年、チェルニャーエフ将軍が命令を待たずにタシケントを攻略した。
      現地の司令官が独断で進み、事後に承認されるという形は、この征服全体に共通している。
      1868年にはブハラ・ハン国を破って保護国とし、サマルカンドを直接統治下に置いた。
      1873年にヒヴァも保護国となり、1876年にはコーカンド・ハン国が廃されて併合される。
      征服された地域にはトルキスタン総督府が置かれ、タシケントが行政の中心になった。
      軍政が敷かれ、ロシア人の移住も進む。
      経済は大きく作り替えられた。
      鉄道が敷かれ、灌漑が拡張されて、輸出用の綿花畑が広がる。
      食料は本国からの輸入に頼るようになり、地域は原料供給地として組み込まれた。
      遊牧民の土地は入植者に割り当てられ、伝統的な移動の経路が断たれていく。
      1916年には徴用令をきっかけに大規模な蜂起が起き、厳しく鎮圧された。
      同じ時期、南のアフガニスタンを挟んでイギリスとの緊張が続いた。
      両国の駆け引きは「グレート・ゲーム」と呼ばれ、1907年の英露協商でひとまず決着する。
      この征服で引かれた行政区分が、ソ連時代の共和国の線引きを経て、現在の五か国の国境の下敷きになっている。
      征服の過程で、ロシアは現地のイスラム法廷や慣習をある程度そのまま残した。
      統治の手間を省く選択だったが、結果として社会の構造は温存される。
      この姿勢は、ソヴィエト政権が1920年代から社会の作り替えに乗り出したときの激しい摩擦と対照をなしている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f3/Flag_of_Russia.svg/500px-Flag_of_Russia.svg.png
