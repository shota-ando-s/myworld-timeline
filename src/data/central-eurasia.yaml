        url: https://ja.wikipedia.org/wiki/モンゴル帝国

  - id: legnica
    year: 1241
    title: ワールシュタットの戦い
    category: war
    tags: [モンゴル, ヨーロッパ]
    summary: モンゴル軍がポーランド・ドイツ連合軍を破り、西欧に衝撃を与えた。
    detail: |
      1241年春、バトゥの西方遠征軍は本隊をハンガリーへ向け、右翼の別働隊をポーランドへ送った。
      指揮はチンギスの孫バイダルとオルダで、目的はハンガリーへ援軍が出るのを防ぐことだったとみられる。
      モンゴル軍はサンドミェシュ、クラクフを焼き、シロンスク（シレジア）へ進む。
      迎え撃ったのは、この地方を治めるヘンリク2世が集めたポーランド諸侯の軍で、ドイツ人騎士やテンプル騎士団の一隊も加わっていた。
      4月9日、レグニツァ近郊の平原で両軍は衝突した。
      当初、騎士たちの突撃はモンゴル軍を押したが、それは偽りの退却だった。
      深追いした騎兵は側面と背後から矢を浴び、煙幕で本隊との連絡を断たれて包囲される。
      ヘンリク2世は戦死し、その首は槍に掲げられた。
      討たれた者の耳を切り取って数えたところ九袋に達したという話が伝わる。
      数字の信頼性は低いが、諸侯軍が壊滅したことは確かである。
      二日後、南ではモヒの戦いでハンガリー王ベーラ4世の軍も同様に破られた。
      西欧の重装騎兵は、機動と弓、そして命令に従って退いて見せる戦術にまったく対応できなかったのである。
      それでもモンゴル軍はポーランドに留まらず、南下してハンガリーの本隊と合流した。
      もともと占領ではなく側面の安全確保が目的だったからで、それを知らない西欧の人々は、次はいつ来るのかと怯え続けた。
      この報せはローマ教皇と神聖ローマ皇帝にも届き、十字軍の呼びかけがなされたが実らない。
      翌年オゴデイの死によってモンゴル軍が引き返したことで、西欧は結果的に救われた。
      ドイツ語の「ワールシュタット」は戦場を意味する言葉に由来し、日本の高校世界史では長くこの名で教えられてきた。
      この敗北のあと、ポーランドとハンガリーでは石造の城塞の建設が進み、モンゴルの再来に備える体制が整えられた。
      1285年の再度の侵攻は撃退されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Bitwa_pod_Legnic%C4%85.jpg/500px-Bitwa_pod_Legnic%C4%85.jpg
      credit: マテウス・メーリアン / Public domain
      page: https://commons.wikimedia.org/wiki/File:Bitwa_pod_Legnic%C4%85.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ワールシュタットの戦い

  - id: pax-mongolica
    year: 1260
    circa: true
    title: モンゴルの平和
    category: economy
    tags: [モンゴル, 交易]
    summary: 一つの権力の下で東西の往来が安全になり、人と技術と情報が大量に動いた。
    detail: |
      13世紀半ばから14世紀半ばにかけて、ユーラシアの大部分が一つの支配のもとに入ったことで、人と物と情報の行き来が急に楽になった。
      この時期を指して「モンゴルの平和」と呼ぶ。
      支えたのは制度である。
      一定の距離ごとに駅（ジャム）を置き、馬と食料を備えさせる駅伝制が大陸を網の目に結んだ。
      パイザと呼ばれる通行証を持つ者は、どの領域でも馬と宿を要求できた。
      モンゴルは商人を保護し、関税を軽くした。
      オルトクと呼ばれる商人組合に資金を出して交易を営ませる仕組みもあり、支配層自身が通商の利害関係者だった。
      略奪が主な収入だった草原の国家としては大きな転換である。
      この道を通って多くのものが動いた。
      火薬と火器、印刷、羅針盤といった中国の技術が西へ向かい、イスラムの天文学・医学・数学が東へ入る。
      イルハン朝のラシード・アッディーンは、中国からヨーロッパまでを視野に入れた『集史』を編んだ。
      人も動いた。
      マルコ・ポーロ、モンテ・コルヴィノ、イブン・バットゥータ、ルブルックといった旅行者や宣教師の記録が残り、初めてユーラシアの東西が互いを具体的に知るようになる。
      宗教には概して寛容で、各地で仏教・イスラム・キリスト教・道教が共存した。
      支配層自身もチベット仏教やイスラムを受け入れていく。
      ただし平和と呼ぶのは一面的でもある。
      この状態は大量の殺戮と都市の破壊の上に成り立っており、征服された側の記憶はまったく違う。
      そして同じ道を病も通った。
      14世紀半ば、中央アジアから黒海沿岸へ、さらに地中海世界へ運ばれたペストが、ユーラシア規模の流行になる。
      交流の代償は大きかった。
      この時期に東西を行き来した知識は、ヨーロッパの大航海時代の準備にもなった。
      アジアの富の具体的な情報が、海路を探す動機を与えたのである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/34/Mongol_Empireaccuratefinal.png/500px-Mongol_Empireaccuratefinal.png
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Mongol_Empireaccuratefinal.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/パクス・モンゴリカ

  - id: marco-polo
    year: 1271
    title: マルコ・ポーロの東方旅行
    category: economy
    tags: [交易, ヨーロッパ]
    summary: 『東方見聞録』がヨーロッパにアジアへの憧れを植えつけた。
    detail: |
      ヴェネツィアの商人の家に生まれた。
      父ニッコロと叔父マッフェオはすでに一度東方へ旅してクビライに謁見しており、1271年、17歳前後のマルコを連れて再び出発する。
      一行は地中海からアッコに上陸し、イラン高原、パミール、タリム盆地の南縁を通って、1275年ごろ上都でクビライに会った。
      以後17年にわたり元に滞在したと『東方見聞録』は語る。
      本のなかでマルコは、クビライに重用されて各地へ派遣され、揚州の統治に関わったとも述べている。
      この官職の記述は中国側の史料に裏づけがなく、誇張か誤解とみる研究者が多い。
      1290年ごろ、イルハン朝へ嫁ぐ王女の護送に加わって海路で帰国の途につき、スマトラ、インドを経て1295年にヴェネツィアへ戻った。
      帰国後、ジェノヴァとの戦いで捕虜となり、獄中で同室のピサの作家ルスティケロに旅の話を語った。
      これが『世界の記述』、日本では『東方見聞録』の名で知られる書物になる。
      内容は、元の駅伝制度、紙幣、石炭の利用、大都の繁栄、そして日本を指す「ジパング」の黄金伝説に及ぶ。
      ヨーロッパの人々が初めて手にした、具体的で体系的な東アジアの情報だった。
      同時代には作り話とみなされ、臨終の際に「見たことの半分も語っていない」と言ったという逸話も残る。
      万里の長城や纏足への言及がないことから、中国に行っていないとする説も唱えられてきた。
      それでも、この本がヨーロッパの東方への関心をかき立てた事実は変わらない。
      コロンブスは自分の写本に多くの書き込みを残しており、大航海時代の動機の一部をここに負っている。
      『東方見聞録』は写本のたびに加筆や省略がなされ、内容の異なる版が百四十以上伝わっている。
      原型がどれかという問題自体が、研究の対象になってきた。
      近年は、彼が中国に行かなかったとする説に対して、当時の元の制度や物価についての記述の正確さから反論がなされている。
