  - id: belt-and-road
    year: 2013
    title: 一帯一路構想
    category: economy
    tags: [中国, 中央アジア]
    summary: 内陸の交通路を再び主役にしようとする試み。シルクロードの現代版を掲げる。
    detail: |
      2013年に中国が提唱した、ユーラシアを結ぶ広域のインフラ構想。
      習近平国家主席がカザフスタンとインドネシアでの演説で、陸の「シルクロード経済ベルト」と海の「21世紀海上シルクロード」を掲げたのが出発点である。
      鉄道・道路・港湾・パイプライン・通信網への投資を通じて、中国とアジア・ヨーロッパ・アフリカを結ぶという内容で、対象国は140を超える。

      背景には複数の事情があった。
      国内の鉄鋼・セメント・建設業の過剰な生産力のはけ口、内陸部の開発、エネルギー輸送路をマラッカ海峡だけに頼らない分散、そして人民元の国際化である。
      資金は中国の政策金融機関やアジアインフラ投資銀行から供給され、中国企業が受注する形が多い。

      中央アジアはこの構想の中心にあたる。
      中国からカザフスタンを通ってヨーロッパへ向かう貨物列車が定期運行され、トルクメニスタンからの天然ガスパイプラインも敷かれた。
      海路より速く空路より安い輸送手段として、一定の需要をつかんでいる。

      一方で批判も強い。
      スリランカのハンバントタ港が債務と引き換えに99年の運営権を中国企業へ渡した例は「債務の罠」として取り上げられた。
      事業の採算性や透明性を欠く契約も問題視されている。
      2020年代に入り新規の融資額は縮小し、より小規模で環境や技術に重きを置く案件へ重心が移りつつある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Belt_and_Road_Initiative_participant_map.svg/500px-Belt_and_Road_Initiative_participant_map.svg.png
      credit: Owennson / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Belt_and_Road_Initiative_participant_map.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/一帯一路
