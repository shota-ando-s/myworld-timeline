        url: https://ja.wikipedia.org/wiki/ジュンガル

  - id: tashkent-taken
    year: 1865
    title: ロシアのタシケント占領
    category: war
    tags: [ロシア, 中央アジア]
    summary: 英露が中央アジアで勢力を競う「グレート・ゲーム」が本格化した。
    detail: |
      タシケントはシルダリヤ川流域最大の都市で、人口は十万を超え、中央アジアの隊商交易の要にあった。
      当時はコーカンド・ハン国の支配下にあったが、ブハラも領有をうかがっていた。
      ロシアはカザフ草原を押さえたあと、南の三ハン国へ迫っていた。
      クリミア戦争で西方の南下を阻まれた後、東方への進出が国の戦略として重みを増していた。
      1865年、現地司令官のチェルニャーエフ将軍が、政府の慎重な指示を待たずに攻撃を決行する。
      兵力はわずか二千ほどで、守備側とは大きな差があった。
      夜陰に乗じて城壁に取りつき、門を破って市内に突入する。
      三日間の市街戦の末に都市は降伏した。
      ロシア側の戦死者は二十数名と記録されている。
      チェルニャーエフは、本国の叱責を予想しながらも既成事実を作った。
      結果として勝利は歓迎され、彼は「タシケントのライオン」と呼ばれる。
      中央アジア征服は、こうした現地司令官の独断の積み重ねで進んだ。
      タシケントは1867年に設置されたトルキスタン総督府の中心となり、ロシア人街が旧市街の隣に建設された。
      鉄道が延び、綿花の集散地として発展する。
      イギリスはこの南下をインドへの脅威と受け止めた。
      以後、アフガニスタンを緩衝地帯として両国が牽制し合う「グレート・ゲーム」が本格化する。
      1907年の英露協商で対立はひとまず収まるが、それまでの四十年、中央アジアは二つの帝国の駆け引きの舞台であり続けた。
      タシケントは現在もウズベキスタンの首都で、中央アジア最大級の都市である。
      チェルニャーエフは占領後、住民の税を一年免除し、モスクを保護するなど懐柔にも努めた。
      ただし本国の方針とのずれから翌年には更迭されている。
      中央アジアの征服は、こうした現地司令官の独断と、それを追認する本国という形で十数年のうちに完了した。
      距離と通信の遅さが、現場の裁量を大きくしたのである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/Tashkent_skyline_2019.jpg/500px-Tashkent_skyline_2019.jpg
      credit: Guidecity / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Tashkent_skyline_2019.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/タシュケント

  - id: anglo-russian-entente
    year: 1907
    title: 英露協商
    category: politics
    tags: [中央アジア, 外交]
    summary: 中央アジアでの争いに区切りをつけ、両国はドイツに向き合うことになった。
    detail: |
      19世紀を通じて、イギリスとロシアは中央アジアで長く対峙していた。
      ロシアが三ハン国を併合して南下し、イギリスはインド防衛のためアフガニスタンに二度出兵する。
      両者の駆け引きは「グレート・ゲーム」と呼ばれた。
      20世紀に入ると事情が変わる。
      ロシアは日露戦争で敗れ、第一次ロシア革命で国内が動揺して、アジアでの拡張を続ける力を失った。
      イギリスの側も、ドイツの建艦競争とバグダード鉄道の計画に強い警戒を抱くようになる。
      遠い中央アジアの争いより、ヨーロッパでの均衡のほうが切実になった。
      1907年8月、サンクトペテルブルクで協約が結ばれた。
      イランを北のロシア勢力圏、南東のイギリス勢力圏、中間の中立地帯に三分する。
      アフガニスタンについては、ロシアが利害関係を持たないと認め、イギリスの影響下に置くことを承認した。
      チベットでは双方が内政に干渉せず、清の宗主権を認めることで合意する。
      当事国であるイラン、アフガニスタン、チベットの意向は問われなかった。
      列強が他国の領域を机上で分ける、当時の典型的な取り決めである。
      この協約によって、すでに成立していた英仏協商と露仏同盟が結び合わさり、三国協商が形をなした。
      ドイツ・オーストリア・イタリアの三国同盟と向き合う構図が固まる。
      つまり、中央アジアでの決着がそのままヨーロッパの二極化を完成させた。
      第一次世界大戦の同盟関係は、この時点でほぼ定まったといえる。
      イランでは、折しも立憲革命の最中に自国が分割されたことへの反発が強く、以後の反英・反露感情の源になった。
      この協約は日本にも関わりがある。
      日露戦争後の日露協約、日英同盟とあわせて、極東から中東までの勢力圏がひとつながりに整理された。
      ロシアの関心が東アジアからバルカンへ移ったことは、その後のヨーロッパの緊張を高める一因にもなった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/英露協商

  - id: central-asia-republics
    year: 1924
    title: 中央アジアの民族別共和国化
    category: politics
    tags: [ソ連, 民族]
    summary: ソ連が引いた民族の線引きが、現在の5か国の国境になっている。
    detail: |
      ロシア帝国は中央アジアをトルキスタン総督府として一括して統治し、住民は民族より宗教と地域で自らを捉えていた。
      ムスリムであること、都市の住民か遊牧民か、という区分のほうが実感に近い。
      革命後、ソヴィエト政権は民族自決の原則を掲げた。
      ただしそこには、汎トルコ主義や汎イスラム主義のような広域の連帯が育つのを防ぎ、統治しやすい単位に分ける意図もあったとされる。
      1924年から1936年にかけて、言語学者と民族学者が動員され、話し言葉の違いをもとに境界が引かれた。
      ウズベク、トルクメン、タジク、キルギス、カザフの各共和国が順に成立する。
      問題は、実際の分布が複雑だったことである。
      オアシス都市には多様な住民が混住し、遊牧と定住が重なり合っていた。
      言語の境目と生活の境目も一致しない。
      結果として、タジク語話者の多いサマルカンドとブハラはウズベク共和国に入り、フェルガナ盆地は三国が入り組んで分けられた。
      飛び地がいくつも生まれている。
      さらに、民族としてのまとまりを補強するため、それぞれに標準語・国民文学・歴史叙述が整えられた。
      ティムールはウズベクの英雄とされ、遊牧の英雄譚はカザフの物語として位置づけられる。
      民族の境界が政治的に作られた面が強いことは、研究者の間でよく指摘される。
      もっとも、線が引かれてから百年が経ち、その枠組みはすでに人々の自己認識に根づいた。
      1991年の独立で、この行政上の線がそのまま国境になった。
      水利権や飛び地をめぐる緊張は今も残り、フェルガナ盆地では衝突も起きている。
      人為的に引かれた線が、そのまま国家の輪郭になった例として繰り返し参照される。
      水の配分は今も最大の懸案である。
      上流のキルギスとタジキスタンが水力発電に使い、下流のウズベキスタンとトルクメニスタンが灌漑に必要とするため、利害が正面からぶつかる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/Central_Asia_%28orthographic_projection%29.svg/500px-Central_Asia_%28orthographic_projection%29.svg.png
      credit: Serg!o / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Central_Asia_(orthographic_projection).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/中央アジア

  - id: aral-sea
    year: 1960
    circa: true
    title: アラル海の縮小が始まる
    category: disaster
    tags: [中央アジア, 環境]
    summary: 綿花のための灌漑で湖の大半が消え、20世紀最大級の環境破壊とされる。
    detail: |
      アラル海はかつて世界第4位の面積を持つ内陸湖で、アム川とシルダリヤ川の水が注ぎ込んでいた。
      周囲では漁業が盛んで、年間四万トン以上の漁獲があり、ムイナクやアラリスクといった港町が栄えていた。
      1960年前後から、ソ連が中央アジアを綿花の一大産地にする計画を進めた。
      両河川から大規模に取水する灌漑水路が掘られ、その一つカラクーム運河は全長千キロを超える。
      水路の多くは素掘りで、運ぶ途中に大量の水が地中へ失われた。
      湖に届く水は急激に減り、1960年代から湖面が下がり始める。
      事態は予想されていた。
      当局は、綿花の利益のほうが大きいとして湖の縮小を織り込んでいたとされる。
      1987年には湖が南北に分断され、2000年代には南側がさらに東西に割れた。
      2014年には東側がほぼ完全に干上がる。
      面積は最盛期の一割程度にまで縮んだ。
      塩分濃度が海水の数倍に上がったため魚は死に絶え、漁業は消滅した。
      港町は岸から数十キロ離れた砂漠の中に取り残され、船が砂の上に横たわる光景が知られている。
      干上がった湖底からは、塩と、綿花栽培で使われた農薬・肥料を含む粉塵が風に舞う。
      周辺地域では呼吸器疾患、腎疾患、乳幼児死亡率の上昇が報告された。
      湖が調節していた気候も変わり、夏はより暑く冬はより寒くなった。
      1990年代以降、カザフスタンが北側の小アラル海に堤防を築いて水位を回復させ、漁業が部分的に戻った。
      一方、南側の大部分は回復の見通しが立っていない。
      20世紀最大級の環境破壊として、開発の帰結を語るときに繰り返し引かれる事例である。
      北側の小アラル海では、2005年に完成したコクアラル堤防によって水位が数メートル回復し、漁獲も戻りつつある。
      局所的ながら、回復が不可能ではないことを示した例として注目された。
      一方、ウズベキスタン側の南アラル海では植林による粉塵の抑制が試みられているが、湖そのものの回復は目指されていない。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/AralSea1989_2014.jpg/500px-AralSea1989_2014.jpg
      credit: NASA. Collage by Producercunningham. / Public domain
      page: https://commons.wikimedia.org/wiki/File:AralSea1989_2014.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アラル海

  - id: central-asia-independence
    year: 1991
    title: 中央アジア5か国の独立
    category: politics
    tags: [中央アジア, 現代]
    summary: ソ連解体で、望まないまま独立した国家が並ぶことになった。
    detail: |
      1991年8月のソ連でのクーデタ未遂は、中央アジアの指導者にとって不意打ちだった。
      彼らの多くは連邦の維持を望んでおり、3月の国民投票でも存続への支持が高かった。
      中央アジアの五共和国は、独立運動の高まりによってではなく、連邦そのものが解けたことで独立した。
      8月末から12月にかけて、ウズベキスタン、キルギス、タジキスタン、トルクメニスタン、カザフスタンが順に独立を宣言する。
      カザフスタンは12月16日で、ソ連構成国の最後だった。
      12月8日にロシア・ウクライナ・ベラルーシの三首脳が連邦の消滅を宣言した際、中央アジアは相談を受けていない。
      抗議を経て、独立国家共同体（CIS）に対等な創設国として加わった。
      新しい国の指導者は、ほとんどが共産党の第一書記そのままだった。
      ナザルバエフ、カリモフ、ニヤゾフ、アカエフ、ナビエフが大統領となる。
      体制の看板は変わっても、統治の仕組みと人は連続していた。
      経済の打撃は大きかった。
      綿花や原料を供給し、食料や工業製品を受け取る分業に組み込まれていたため、連邦の解体で取引の網が切れた。
      タジキスタンでは地域と党派の対立が内戦に発展し、1997年までに数万人が死亡、多数が難民となった。
      カザフスタンは領内に配備されていた核兵器を放棄し、セミパラチンスク核実験場を閉鎖した。
      旧ソ連の核をめぐる不安を和らげる決断として国際的に評価される。
      以後、五か国はロシア、中国、トルコ、欧米のあいだで距離を測りながら歩んできた。
      資源を持つ国と持たない国の差も開いている。
      ソ連が1924年に引いた行政の線が、そのまま国際的な国境になった。
      独立から三十年以上が過ぎ、ソ連を知らない世代が人口の多数を占めるようになった。
      ロシア語の地位は下がり、トルコ・中国・欧米との関係が相対的に重みを増している。
