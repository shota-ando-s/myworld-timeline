  - id: soviet-central-asia
    title: ソ連下の中央アジア
    start: 1924
    end: 1991
    category: politics
    tags: [ソ連, 中央アジア]
    summary: 民族ごとに共和国の線が引かれ、綿花の単作とアラル海の縮小が進んだ。
    detail: |
      1917年の革命後、中央アジアでは民族自決を掲げる運動と赤軍の進出が衝突した。
      バスマチと呼ばれる武装抵抗は1920年代を通じて続き、鎮圧には十年近くを要している。
      1924年、ソ連は「民族的境界画定」を行った。
      それまでトルキスタンと一括りにされていた地域を、言語と民族を基準にウズベク、トルクメン、のちにタジク、キルギス、カザフの各共和国に区切る。
      実際の住民分布は入り組んでおり、サマルカンドやブハラのようにタジク語話者の多い都市がウズベク側に入るなど、線引きには無理があった。
      これが独立後の国境紛争や飛び地の原因になっている。
      文字も変えられた。
      アラビア文字からラテン文字へ、1940年前後にはキリル文字へ移された。
      二度の変更で過去の文献が読めなくなり、知識の継承が断たれる。
      遊牧民は強制的に定住させられた。
      カザフ草原では1930年代前半の集団化と家畜の没収によって大飢饉が起き、人口の三分の一近くが失われたとされる。
      農業は綿花の単作に組み替えられた。
      アム川とシルダリヤ川から大量に取水する灌漑網が広げられ、食料は他の共和国から運ばれるようになる。
      この取水がアラル海の縮小を招いた。
      1960年ごろから湖面が後退し、半世紀で面積の大半が失われる。
      旧湖底の塩と農薬の粉塵による健康被害も深刻になった。
      一方で、識字率の向上、工業化、医療の普及といった変化も同時に進んでいる。
      評価は今も割れている。
      1991年のソ連解体で五か国が独立したが、経済構造も国境も官僚機構も、この時代に作られたものをほぼそのまま引き継いだ。
      第二次世界大戦中には、朝鮮系、チェチェン系、クリミア・タタール系などの人々が強制的に移住させられ、中央アジアの民族構成はさらに複雑になった。
      工業では、疎開してきた工場と軍需産業が置かれ、カザフスタンにはバイコヌール宇宙基地とセミパラチンスク核実験場が作られる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Flag_of_the_Soviet_Union.svg/500px-Flag_of_the_Soviet_Union.svg.png
      credit: СССР / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_Soviet_Union.svg
