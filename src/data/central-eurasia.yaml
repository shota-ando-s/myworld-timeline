  - id: timurid
    title: ティムール朝
    start: 1370
    end: 1507
    category: politics
    tags: [中央アジア]
    summary: サマルカンドを都にモンゴルの再興を掲げ、学芸を保護した。
    detail: |
      ティムールが一代で築いた版図を、その子孫が受け継いだ王朝（1370〜1507）。
      中心はマー・ワラー・アンナフルとホラーサーンで、都はサマルカンド、のちにヘラートへ移った。
      ティムール自身はチンギスの血を引かないため、ハンを名乗らず「大アミール」を称し、チャガタイ家の人物を傀儡のハンに立てて正統性を補っている。

      1405年にティムールが没すると、広げた領土は息子と孫の争いで縮んだ。
      四男シャー・ルフがヘラートを本拠に全体をまとめ直し、1447年まで比較的安定した時代を築く。

      この王朝が歴史に残したのは、征服よりも文化である。
      ペルシア語の詩とチャガタイ・トルコ語の文学、細密画（ミニアチュール）、建築が高い水準に達した。
      サマルカンドにはレギスタン広場やビービー・ハーヌム・モスク、ティムールの廟グーリ・アミールが建てられ、青いタイルに覆われた建築は中央アジアのイスラム建築の頂点とされる。
      シャー・ルフの子ウルグ・ベクは天文台を築き、当時最高精度の星表を作った。

      1449年のウルグ・ベク殺害以後は内紛が続き、1500年前後に北から南下したウズベクのシャイバーニー・ハンに滅ぼされる。
      ただし血筋は絶えなかった。
      追われた王族バーブルはカーブルへ逃れ、1526年に北インドへ入ってムガル帝国を開く。
      ムガルとはペルシア語でモンゴルを指す語で、ティムール朝の直系がインドで三百年続くことになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/04/Timurid_Empire_Map.png/500px-Timurid_Empire_Map.png
      credit: Timur073767 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Timurid_Empire_Map.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール朝

  - id: dzungar-khanate
    title: ジュンガル
    start: 1634
    end: 1757
    category: war
    tags: [遊牧, 清]
    summary: 最後の遊牧帝国。清とロシアに挟まれて滅び、草原の時代が終わった。
    detail: |
      17世紀から18世紀にかけて、天山山脈の北の草原でオイラト系の諸部族がまとめた遊牧国家。
      ジュンガルとはモンゴル語で「左翼」を意味する。
      中心となったのはチョロース部で、チンギス裔ではなかった。
      最盛期の版図は、東は現在のモンゴル西部、西はカザフ草原、南はタリム盆地に及ぶ。

      特徴的なのは、遊牧国家としては例外的に中央集権が進んでいたことだった。
      人口と家畜を登録して税と兵を徴し、オアシス都市を支配して農耕と交易からも収入を得る。
      ロシアから技術者を招いて火器を製造し、スウェーデン人の捕虜が大砲の鋳造を指導した記録も残る。

      宗教はチベット仏教ゲルク派を奉じ、ダライ・ラマの権威を後ろ盾にした。
      1717年にはチベットへ侵攻してラサを占領している。
      これが清の介入を招き、チベットが清の影響下に入るきっかけになった。
      清とは、モンゴル高原の支配とチベットへの影響力をめぐって三代にわたり争い、ガルダン、ツェワンラブタン、ガルダンツェリンと有能な君主が続いて康熙帝・雍正帝の遠征をしのぐ。

      1745年にガルダンツェリンが没すると後継争いが激化し、有力者の一人が清に支援を求めた。
      これが致命傷になる。
      1755年から1757年にかけての乾隆帝の遠征で国は滅び、天然痘の流行も重なって人口の大半が失われた。
      内陸アジアで定住国家に対抗しうる最後の遊牧勢力が、ここで姿を消す。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/%E3%82%B8%E3%83%A5%E3%83%B3%E3%82%AC%E3%83%AB%E5%B8%9D%E5%9B%BD.png/500px-%E3%82%B8%E3%83%A5%E3%83%B3%E3%82%AC%E3%83%AB%E5%B8%9D%E5%9B%BD.png
      credit: トムル / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:%E3%82%B8%E3%83%A5%E3%83%B3%E3%82%AC%E3%83%AB%E5%B8%9D%E5%9B%BD.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジュンガル

  - id: russian-central-asia
    title: ロシアの中央アジア征服
    start: 1865
    end: 1895
    category: war
    tags: [ロシア, 中央アジア]
    summary: 30年でオアシス都市が次々に併合され、草原がロシア帝国の一部になった。
    detail: |
      1865年から1895年にかけて、ロシア帝国が中央アジアの三ハン国を併合していった過程。
      19世紀半ばまで、この地域はブハラ・ヒヴァ・コーカンドに分かれ、互いに争い、火器の近代化も遅れていた。

      ロシアの南下には複数の動機があった。
      国境の安定、隊商路と奴隷にされた自国民の保護、紡績業のための綿花の確保、そしてイギリス領インドを牽制する戦略である。
      クリミア戦争で西方に敗れた後、東方へ目が向いたという事情もあった。

      1865年、チェルニャーエフ将軍が命令を待たずにタシケントを攻略する。
      現地の司令官が独断で進み、事後に承認されるという形は、この征服全体に共通している。
      1868年にはブハラ・ハン国を破って保護国とし、1873年にヒヴァも保護国となり、1876年にはコーカンド・ハン国が廃されて併合された。

      征服された地域にはトルキスタン総督府が置かれ、タシケントが行政の中心になる。
      鉄道が敷かれ、灌漑が拡張されて輸出用の綿花畑が広がり、地域は原料供給地として組み込まれた。
      遊牧民の土地は入植者に割り当てられ、1916年には徴用令をきっかけに大規模な蜂起が起きて厳しく鎮圧される。
      この征服で引かれた行政区分が、ソ連時代の共和国の線引きを経て、現在の五か国の国境の下敷きになっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f3/Flag_of_Russia.svg/500px-Flag_of_Russia.svg.png
      credit: Peter the Great / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Russia.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/トルキスタン総督府

  - id: soviet-central-asia
    title: ソ連下の中央アジア
    start: 1924
    end: 1991
    category: politics
    tags: [ソ連, 中央アジア]
    summary: 民族ごとに共和国の線が引かれ、綿花の単作とアラル海の縮小が進んだ。
    detail: |
      1924年から1991年まで、中央アジアがソ連の構成共和国として置かれた時代。
      革命後、この地域では民族自決を掲げる運動と赤軍の進出が衝突し、バスマチと呼ばれる武装抵抗が1920年代を通じて続いた。

      1924年、ソ連は「民族的境界画定」を行う。
      それまでトルキスタンと一括りにされていた地域を、言語と民族を基準にウズベク、トルクメン、のちにタジク、キルギス、カザフの各共和国に区切った。
      実際の住民分布は入り組んでおり、線引きには無理があった。
      文字もアラビア文字からラテン文字へ、1940年前後にはキリル文字へ移され、二度の変更で過去の文献が読めなくなる。

      遊牧民は強制的に定住させられた。
      カザフ草原では1930年代前半の集団化と家畜の没収によって大飢饉が起き、人口の三分の一近くが失われたとされる。
      農業は綿花の単作に組み替えられ、アム川とシルダリヤ川から大量に取水する灌漑網が広げられた。
      この取水が、1960年ごろから始まるアラル海の縮小を招く。

      一方で、識字率の向上、工業化、医療の普及といった変化も同時に進んだ。
      第二次世界大戦中には他民族の強制移住先ともなり、バイコヌール宇宙基地やセミパラチンスク核実験場も置かれる。
      1991年の解体で五か国が独立したが、経済構造も国境も官僚機構も、この時代のものをほぼそのまま引き継いだ。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Flag_of_the_Soviet_Union.svg/500px-Flag_of_the_Soviet_Union.svg.png
      credit: СССР / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_Soviet_Union.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ソビエト連邦

events:
  - id: yuezhi-defeat
    year: -176
    circa: true
    title: 匈奴が月氏を破る
    category: war
    tags: [遊牧, 中央アジア]
    summary: 追われた月氏が西へ移動し、のちにクシャーナ朝を生む連鎖が始まった。
    detail: |
      月氏は敦煌から祁連山にかけての河西回廊を本拠とし、玉の交易で栄えて匈奴より優位に立っていた。
      若き日の冒頓単于は、人質としてこの月氏に送られている。
      月氏の移動は、ユーラシアの人の動きが連鎖する様子をよく示している。
      匈奴が月氏を押し、月氏が烏孫と争い、さらに南のバクトリアを倒した。
      その西の端では、ギリシア彫刻の技法と仏教が結びついてガンダーラ美術が生まれ、仏像が人のかたちで作られるようになる。

      立場が逆転したのは冒頓が草原を統一してからで、前176年ごろの攻撃で月氏は大きく敗れた。
      続く老上単于の代には王が殺され、本拠を失う。

      主力は西へ移動し、イリ地方で烏孫に押されてさらに南下して、アム川の北に落ち着いた（大月氏）。
      そこでギリシア系のバクトリアを従え、1世紀にはその一派からクシャーナ朝が興る。
      2世紀のカニシカ王の時代には北インドまで版図を広げ、ガンダーラ美術と大乗仏教が東へ流れ出す拠点となった。

      この動きは東にも跳ね返った。
      匈奴を挟み撃ちにしようと考えた漢の武帝が、大月氏との同盟を求めて張騫を派遣する。
      同盟は実らなかったが、持ち帰られた西域の情報が漢の西方進出を促し、のちにシルクロードと呼ばれる交易路が開けていった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/XiongnuMap.png/500px-XiongnuMap.png
      credit: Gabagool / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:XiongnuMap.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/匈奴

  - id: huns-westward
    year: 375
    title: フン族の西進とゲルマン民族大移動
    category: war
    tags: [遊牧, ヨーロッパ]
    summary: 草原の一押しがヨーロッパ全体を動かし、西ローマ滅亡の連鎖につながった。
    detail: |
      4世紀後半、東からフン族が黒海北岸に現れ、アラン人を、次いで東ゴートを破った。
      375年ごろのこの衝撃が、ヨーロッパの民族移動の引き金になる。
      フン族の出自は明らかでなく、匈奴との関係も証明されていない。
      民族移動の原因をフン族の一撃だけに求める見方は、近年では修正されている。
      ローマ側の国境防衛の弱まり、気候の変動、ゲルマン社会の内部の変化など、複数の要因が重なったと考えられている。
      それでも375年が画期とされるのは、この年を境に帝国が国境の外の勢力を制御できなくなったからである。

      押し出された西ゴートはドナウ川の南への避難を願い出て認められたが、受け入れ側の不正と飢えに耐えかねて蜂起した。
      378年のハドリアノポリスの戦いでは皇帝ウァレンスが戦死し、東方の野戦軍が壊滅する。
      帝国が国境の内側で敗れたこの事件は、ローマの軍事的威信を決定的に傷つけた。

      以後、移動が続く。
      406年にはヴァンダル・スエビ・アラン人がライン川を渡ってガリアへ入り、410年には西ゴートがローマ市を略奪した。
      429年にはヴァンダルが北アフリカへ渡り、帝国は穀倉地帯を失う。

      フン族自身はパンノニアを拠点にアッティラのもとで最大となり、453年の彼の死とともに崩れた。
      だが動き出したゲルマン諸族は止まらず、各地に王国を築いていく。
      476年の西ローマ皇帝の廃位は、この長い過程の最後の一幕にあたる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e0/Europa_Germanen_50_n_Chr.svg/500px-Europa_Germanen_50_n_Chr.svg.png
      credit: Karl Udo Gerth / Public domain
      page: https://commons.wikimedia.org/wiki/File:Europa_Germanen_50_n_Chr.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ゲルマン人
    related: [west-rome-fall]

  - id: attila
    year: 451
    title: アッティラのガリア遠征
    category: war
    tags: [フン族, ヨーロッパ]
    summary: 「神の鞭」と恐れられた王の進撃がカタラウヌムで止まった。
    detail: |
      451年、アッティラの軍がライン川を渡ってガリアに入った戦役。
      フン族に加えて従属するゲルマン諸族を含む混成の大軍で、各地を焼きながら進んだ。
      ロワール川のオルレアンが包囲され、ガリアのローマ支配そのものが危うくなる。

      迎え撃ったのは西ローマの将軍アエティウスだった。
      若いころフン族のもとで人質として暮らし、その戦い方を知る人物である。
      彼は長年争ってきた西ゴート王テオドリック1世を説き伏せて同盟を組み、ブルグンド人やフランク人も加えた連合軍を編成した。
      オルレアンの包囲は、連合軍の接近によって解かれる。

      両軍はシャンパーニュ地方のカタラウヌムの野で激突した。
      戦闘は日没まで続き、西ゴート王テオドリックは戦死する。
      フン軍は陣に退き、翌日アッティラは撤退を選んだ。
      決着のついた戦いではなかったが、ガリアへの侵入はここで止まる。

      アエティウスは撤退するフン軍を追撃しなかった。
      フン族を完全に潰せば西ゴートが強くなりすぎるという計算だったとみられる。
      彼自身は454年、猜疑にかられた皇帝ウァレンティニアヌス3世に殺され、西ローマは最後の有能な将軍を失った。
      この戦いは長く「ヨーロッパを守った一戦」として語られてきたが、双方ともゲルマン諸族を多数抱えた混成軍であり、文明と野蛮の対決という図式は後世のものである。
