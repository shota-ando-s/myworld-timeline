periods:
  - id: scythians
    title: スキタイ
    start: -700
    startCirca: true
    end: -300
    endCirca: true
    category: war
    tags: [遊牧, 黒海]
    summary: 騎馬と黄金細工で知られる最初期の遊牧国家。ギリシア人が詳しく記録した。
    detail: |
      紀元前7世紀ごろから、黒海北岸からカザフ草原にかけての地域で活動したイラン系の騎馬遊牧民。
      統一国家ではなく、王族スキタイと呼ばれる集団を中心とするゆるやかな連合だった。
      ヘロドトスは『歴史』で彼らの風習を詳しく書き残しており、遊牧民についての最初期のまとまった記録になっている。
      遊牧民は文字を持たなかったため、その姿はもっぱら周囲の定住社会の記録と、墓から出る品によって知られる。
      アルタイのパジリク古墳では永久凍土のおかげで織物や馬具まで残り、中国の絹も副葬されていた。

      強さの中心は、馬上から射る合成弓にあった。
      鞍と馬具を工夫して騎射の機動力を高め、退きながら射る戦法を用いる。
      この戦い方は、のちの匈奴・突厥・モンゴルまで草原の軍隊の基本であり続けた。

      前7世紀には南下してメディアやアッシリアを脅かし、オリエントの政治にも関わった。
      前513年ごろにはダレイオス1世の遠征を受けるが、決戦を避けて後退し、井戸を埋めながら敵を消耗させて追い返している。

      遺物では、鹿や豹をかたどった黄金の装飾がよく知られる。
      クルガンと呼ばれる墳丘墓から、武具・馬具・殉葬された馬とともに出土する。
      この動物文様は東へも伝わり、中国北方の青銅器に影響を与えた。
      前3世紀以降、同じイラン系のサルマタイに押されて衰える。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/%E3%82%B9%E3%82%AD%E3%82%BF%E3%82%A4%E3%81%A8%E3%81%9D%E3%81%AE%E5%91%A8%E8%BE%BA%E5%9B%BD.png/500px-%E3%82%B9%E3%82%AD%E3%82%BF%E3%82%A4%E3%81%A8%E3%81%9D%E3%81%AE%E5%91%A8%E8%BE%BA%E5%9B%BD.png
      credit: トムル / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:%E3%82%B9%E3%82%AD%E3%82%BF%E3%82%A4%E3%81%A8%E3%81%9D%E3%81%AE%E5%91%A8%E8%BE%BA%E5%9B%BD.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スキタイ

  - id: xiongnu
    title: 匈奴
    start: -209
    end: 155
    endCirca: true
    category: politics
    tags: [遊牧, モンゴル高原]
    summary: 漢と対峙した最初の遊牧帝国。草原の国家のひな型になった。
    detail: |
      紀元前3世紀から後1世紀にかけて、モンゴル高原を本拠に勢力をふるった遊牧国家。
      君主は単于と呼ばれ、その下で左賢王と右賢王が東西を分けて治めた。
      遊牧のほか、中国から絹や穀物を得る交易と略奪、西域のオアシス都市からの徴税が国を支えた。
      匈奴の言語系統ははっきりせず、テュルク系・モンゴル系などの説がある。
      中国の王朝にとって匈奴との関係は、和親・交易・戦争を組み合わせる長い実験であり、ここで作られた対処の型は以後の突厥・契丹・モンゴルへの対応にも繰り返された。

      前209年に即位した冒頓単于が草原を統一し、東胡を倒し月氏を西へ追った。
      前200年には白登山で漢の高祖を包囲する。
      以後およそ60年、漢が毎年絹や穀物を贈り皇女を嫁がせる和親の関係が続いた。

      前2世紀後半、武帝が衛青・霍去病を派遣して反攻に転じる。
      漢は河西回廊に郡を置いて西域への道を開き、匈奴は交易路への影響力を失った。
      内紛も重なり、前1世紀半ばには五人の単于が並び立つ分裂に陥る。
      前51年、呼韓邪単于が漢に臣従して後ろ盾を得た。

      1世紀には南北に分かれ、南匈奴は中国北辺に住んで後の五胡十六国の担い手となり、北匈奴は西へ去った。
      単于を頂点とする統治と十進法の軍事編成は、のちの突厥やモンゴルにも受け継がれ、草原国家の原型になっている。
      西へ去った集団と4世紀のフン族を結びつける説があるが、決め手はない。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/XiongnuMap.png/500px-XiongnuMap.png
      credit: Gabagool / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:XiongnuMap.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/匈奴

  - id: silk-road
    title: シルクロード交易
    start: -130
    end: 1450
    endCirca: true
    category: economy
    tags: [交易, ユーラシア]
    summary: 絹・馬・紙・宗教・病が同じ道を通った。東西を結ぶ1500年の動脈。
    detail: |
      中国と地中海世界を結んだ内陸の交易路の総称。
      ひと続きの街道ではなく、オアシスをつなぐ複数の経路の束であり、隊商は区間ごとに荷を受け渡した。
      名称は19世紀のドイツの地理学者リヒトホーフェンによるもので、当時そう呼ばれていたわけではない。
      20世紀後半には考古学と観光の対象として再び注目され、21世紀には鉄道とパイプラインの形で現代の回廊が構想されている。
      砂に埋もれた敦煌の文書は、複数の言語と宗教が同じ場所で使われていたことを具体的に示している。

      本格化したのは前2世紀、漢の武帝が張騫を西域へ送り、河西回廊に郡を置いて安全を確保してからである。
      中国の絹が西へ流れ、ローマでは奢侈として規制が議論されるほど珍重された。
      西からはガラス器・宝石・馬・香料が入り、東からは紙・陶磁器・茶が出ていった。

      物より大きかったのは、技術と宗教の伝播である。
      仏教が中央アジアを経て中国・朝鮮・日本へ伝わったのもこの道であり、マニ教やネストリウス派キリスト教も同じ経路で東へ入った。
      交易の担い手としてはソグド人が際立ち、東はモンゴル高原から中国内地まで植民集落を置いている。

      路線の安全は、通り道を押さえる勢力の強弱に左右された。
      漢・唐・モンゴル帝国のような広域政権の下では往来が活発になり、分裂期には細る。
      16世紀以降、大量の物資を安く運べる海路が主役になると、内陸路の比重は下がっていった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/SeidenstrasseGMT.JPG/500px-SeidenstrasseGMT.JPG
      credit: Kelvin Case / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:SeidenstrasseGMT.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シルクロード

  - id: rouran
    title: 柔然
    start: 402
    end: 555
    category: politics
    tags: [遊牧, モンゴル高原]
    summary: 北魏と対立した草原の帝国。「可汗」の称号を初めて用いたとされる。
    detail: |
      5世紀初めから6世紀半ばにかけてモンゴル高原を支配した遊牧国家。
      402年に社崙が諸部をまとめ、「可汗」の称号を用いた。
      この称号はのちに突厥・ウイグル・モンゴルへ受け継がれ、草原の君主号として定着する。
      中国の史書では蠕蠕・芮芮・茹茹などと書かれ、北魏は虫を思わせる蔑称を当てた。

      南には鮮卑拓跋部の北魏があり、両者は百年以上にわたって争った。
      北魏の太武帝はみずから大軍を率いてたびたび北へ出、長城を修築して六鎮と呼ばれる防衛拠点を置いている。
      柔然の側も南朝の宋や西域諸国と結んで北魏を挟もうとした。
      草原の政治が、中国の南北朝の外交に組み込まれていったのである。

      この柔然に鍛鉄を貢納して隷属していたのが、アルタイ山麓のテュルク系集団・突厥だった。
      552年、突厥の土門（ブミン）が婚姻の申し出を侮辱されたことをきっかけに反旗を翻す。
      柔然は敗れ、可汗は北斉へ逃れたが受け入れられなかった。
      国は6世紀半ばに滅びる。

      北魏が対柔然のために置いた六鎮は、のちに中央から軽んじられて反乱を起こし、北魏そのものを倒す原因になった。
      草原の勢力との緊張が、中国側の王朝の運命まで左右した例である。
      西へ逃れた残党が、同じころヨーロッパに現れたアヴァール人にあたるとする説もある。
      有力な見方だが、確定はしていない。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Rouran500.png/500px-Rouran500.png
      credit: Gabagool / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:Rouran500.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/柔然

  - id: gokturk
    title: 突厥
    start: 552
    end: 744
    category: politics
    tags: [遊牧, トルコ系]
    summary: モンゴル高原から中央アジアまで支配し、独自の文字を残した。
    detail: |
      6世紀から8世紀にかけて中央ユーラシアに広がったテュルク系の遊牧国家。
      アルタイ山麓で鍛鉄に従事し柔然に隷属していた集団が、552年に土門（ブミン）のもとで反旗を翻して建てた。
      弟の室点蜜（イステミ）が西方を担当し、エフタルをササン朝と挟撃して滅ぼす。
      版図は東の満洲から西のカスピ海沿岸まで達し、草原に初めて東西を貫く国家が現れた。

      経済の柱は、中国との絹馬交易とソグド人を介した中継貿易だった。
      ササン朝が絹の流通を押さえようとすると、突厥はビザンツ帝国へ使節を送って同盟を模索している。
      草原の国家がユーラシアの東西を結ぶ外交の担い手になった例として知られる。

      583年、隋の離間策と一族の内紛で東西に分裂した。
      東突厥は630年に唐に敗れて服属し、唐の太宗は草原の諸部から「天可汗」と呼ばれる。
      西突厥も657年に唐に破れた。
      682年に東突厥は独立を回復するが（第二可汗国）、744年にウイグルに倒される。

      この第二可汗国がモンゴル高原に残したオルホン碑文は、テュルク系の言語で書かれた最古級の記録である。
      ビルゲ・カガンらの事績とともに、中国の絹と甘い言葉に引き寄せられて草原を離れれば民は滅びる、という趣旨の警告が刻まれている。
      遊牧民が自分たちの立場を自らの言葉で記録した、数少ない史料として重んじられる。
      突厥の自称テュルクは、現在のトルコやトルクメニスタンの名にそのまま続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Map_of_the_First_Turkic_Khaganate.png/500px-Map_of_the_First_Turkic_Khaganate.png
      credit: Ktrinko User:Greenvert / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Map_of_the_First_Turkic_Khaganate.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/突厥

  - id: khazar
    title: ハザール
    start: 650
    end: 969
    category: economy
    tags: [遊牧, 交易]
    summary: ビザンツとイスラムの間で交易を握り、支配層がユダヤ教を受け入れた珍しい国。
    detail: |
      7世紀から10世紀にかけて、カスピ海北岸からコーカサス、黒海沿岸に栄えたテュルク系の国家。
      西突厥の崩壊後にその一部が自立して成立したとされる。
      ヴォルガ川下流のイティルを都とし、南のデルベントを押さえた。
      北方の森林地帯と南のイスラム世界を結ぶ交易路の関所として、毛皮・蜜蝋・奴隷と銀貨・工芸品の流れから利を得ている。

      軍事的にも大きな役割を果たした。
      7世紀末から8世紀にかけて北上するウマイヤ朝の軍とコーカサスで長く戦い、アラブ勢力がヨーロッパ東部へ進むのを食い止めている。
      ビザンツ帝国とは同盟関係にあり、皇帝がハザールの王女を妃に迎えたこともあった。

      とくに知られるのは、8世紀から9世紀にかけて支配層がユダヤ教を受け入れたことである。
      キリスト教のビザンツとイスラムのカリフ国に挟まれ、どちらにも従属しない第三の道を選んだためと説明されることが多い。
      改宗が支配層に限られたのか広く及んだのかは、史料が乏しく議論が続いている。

      965年ごろ、キエフ公スヴャトスラフの遠征で拠点が破壊され、国は急速に衰えた。
      以後この草原はペチェネグ、次いでポロヴェツが占め、やがてモンゴルの西征を迎える。
      東欧のユダヤ人の起源をハザールに求める説も唱えられたが、遺伝学的な研究では支持されていない。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Chasaren.jpg/500px-Chasaren.jpg
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Chasaren.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ハザール

  - id: uyghur-khaganate
    title: ウイグル可汗国
    start: 744
    end: 840
    category: politics
    tags: [遊牧, トルコ系]
    summary: 唐と結んで安史の乱の鎮圧を助け、交易で栄えた。
    detail: |
      744年に突厥第二可汗国を倒してモンゴル高原を継いだ、テュルク系の遊牧国家。
      鉄勒（トクズ・オグズ）系の回紇部を中心とする。
      オルホン川のほとりにカラ・バルガスンの都を築き、遊牧しながら城郭都市を持つ体制を取った。

      決定的だったのは唐との関係である。
      755年に安史の乱が起きると、唐の求めに応じて援軍を送り、長安と洛陽の奪回を助けた。
      見返りに唐は絹馬交易を認め、ウイグルは馬一頭につき絹四十匹という有利な条件で毎年大量の絹を得る。
      この絹は西方へ転売され、国の富を支えた。

      交易を担ったのはソグド商人で、彼らを通じて8世紀後半にマニ教が受け入れられた。
      遊牧国家が外来の宗教を国の宗教として採用した早い例である。
      文字もソグド文字を元にしたウイグル文字が作られ、のちにモンゴル文字、さらに満洲文字へ受け継がれていった。

      840年、飢饉と内紛で弱ったところへ北のキルギスが攻め込み、可汗が殺されて国は崩れる。
      逃れた人々は天山東部や河西のオアシスへ移り、農耕と都市の生活に移っていった。
      西ウイグル王国や甘州ウイグルがそれにあたる。
      今日の新疆のテュルク系社会は、この移住を出発点としている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/%E5%9B%9E%E9%B6%BB%E5%8F%AF%E6%B1%97%E5%9B%BD%E3%81%AE%E7%89%88%E5%9B%B3.png/500px-%E5%9B%9E%E9%B6%BB%E5%8F%AF%E6%B1%97%E5%9B%BD%E3%81%AE%E7%89%88%E5%9B%B3.png
      credit: トムル / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:%E5%9B%9E%E9%B6%BB%E5%8F%AF%E6%B1%97%E5%9B%BD%E3%81%AE%E7%89%88%E5%9B%B3.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/回鶻

  - id: mongol-empire
    title: モンゴル帝国
    start: 1206
    end: 1368
    category: war
    tags: [モンゴル, 遊牧]
    summary: 史上最大の陸上帝国。ユーラシアが一つの交通圏になった。
    detail: |
      13世紀にユーラシアの大半を覆った、史上最大級の陸上帝国。
      1206年にチンギス・ハンが草原の諸部族を統合して以来、一世紀足らずで東は朝鮮半島から西はハンガリーとメソポタミアまで広がった。

      強さの中核は軍の編成にあった。
      部族を解体して千戸・百戸に組み替え、忠誠を血筋ではなく君主個人へ向けさせる。
      指揮官は功績で選ばれ、出自を問われなかった。
      戦い方でも、複数の軍が離れた経路から同時に迫り、偽りの退却で敵をおびき出す戦術を用い、攻城には征服地の技術者を取り込んだ。

      拡大は三代にわたる。
      オゴデイが金を滅ぼして華北を得、バトゥがルーシと東欧へ、フレグが西アジアへ進んでアッバース朝を倒した。
      クビライは南宋を滅ぼして中国全土を支配下に置く。
      一方、抵抗した都市への処置は苛烈で、中央アジアやイランでは灌漑施設ごと破壊され、回復に数世紀を要した地域もある。

      統治では駅伝制で大陸を結び、商人を保護し、宗教には概して寛容だった。
      出自を問わず官僚や技術者を用いたため、イスラムの天文学が中国に入り、中国の技術が西へ向かうといったことが起きる。
      モンケの死後、後継争いから帝国は元・キプチャク・チャガタイ・イルハンの四つに事実上分裂した。
      14世紀半ば、ペストの流行と各地の反乱によって支配は崩れていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Standards_of_Genghis_Khan.png/500px-Standards_of_Genghis_Khan.png
      credit: Sci Show With Moh / CC0
      page: https://commons.wikimedia.org/wiki/File:Standards_of_Genghis_Khan.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モンゴル帝国

  - id: chagatai
    title: チャガタイ・ハン国
    start: 1227
    end: 1370
    category: politics
    tags: [モンゴル, 中央アジア]
    summary: 中央アジアを受け継いだモンゴルの一国。やがてトルコ化・イスラム化した。
    detail: |
      チンギス・ハンの次男チャガタイが受け継いだ領地を起こりとする遊牧国家。
      天山山脈の南北とマー・ワラー・アンナフルを版図とした。
      チャガタイは父の定めたヤサの厳格な守り手として知られ、弟オゴデイの即位を支えて帝国の秩序を保つ役割を担っている。

      この国の歴史は、遊牧の暮らしを守るか、豊かな定住地の文化に入っていくかという緊張の連続だった。
      マー・ワラー・アンナフルにはブハラ・サマルカンドといった古い都市とイスラムの学問があり、支配層の一部はそこへ引き寄せられていく。
      14世紀前半のタルマシリンはイスラムに改宗して定住寄りの政策を取ったが、遊牧の伝統を守ろうとする東方の諸部族に反発されて殺された。

      この対立が決定的となり、1340年代に国は東西へ分裂する。
      西のマー・ワラー・アンナフルではモンゴル系の王族が実権を失い、トルコ語を話すイスラム教徒の有力者が争う状態になった。
      そこから台頭したのがティムールである。
      東のモグーリスタンでは遊牧の生活が保たれ、イスラム化しながらも17世紀まで王統が続いた。

      この国は、征服した側が征服された側の文化に取り込まれていく過程を典型的に示している。
      同じことは西のイルハン朝やジョチ・ウルスでも起きた。
      チャガタイ・ウルスの名は、中央アジアで用いられた文語「チャガタイ語」として残っている。
      ウズベク語やウイグル語の直接の祖にあたり、バーブルの回想録もこの言葉で書かれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/27/Flag_of_the_Chagatay_Khanate_in_the_Catalan_Atlas_%28published_in1375%29.png/500px-Flag_of_the_Chagatay_Khanate_in_the_Catalan_Atlas_%28published_in1375%29.png
      credit: पाटलिपुत्र / CC BY-SA 4.0
