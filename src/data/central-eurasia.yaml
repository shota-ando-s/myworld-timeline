  - id: tashkent-taken
    year: 1865
    title: ロシアのタシケント占領
    category: war
    tags: [ロシア, 中央アジア]
    summary: 英露が中央アジアで勢力を競う「グレート・ゲーム」が本格化した。
    detail: |
      1865年、ロシア軍が中央アジア最大の都市タシケントを攻略した出来事。
      タシケントはシルダリヤ川流域最大の都市で人口は十万を超え、隊商交易の要にあった。
      当時はコーカンド・ハン国の支配下にある。

      ロシアはカザフ草原を押さえたあと、南の三ハン国へ迫っていた。
      クリミア戦争で西方への南下を阻まれた後、東方への進出が国の戦略として重みを増していたのである。

      攻撃を決行したのは現地司令官のチェルニャーエフ将軍で、政府の慎重な指示を待たなかった。
      兵力はわずか二千ほどで、守備側とは大きな差がある。
      夜陰に乗じて城壁に取りつき、門を破って市内に突入し、三日間の市街戦の末に都市は降伏した。
      本国は当初この独断を叱責したが、結果として勝利は歓迎される。

      タシケントは1867年に設置されたトルキスタン総督府の中心となり、ロシア人街が旧市街の隣に建設された。
      イギリスはこの南下をインドへの脅威と受け止め、以後アフガニスタンを緩衝地帯として両国が牽制し合う「グレート・ゲーム」が本格化する。
      1907年の英露協商で対立はひとまず収まるが、それまでの四十年、中央アジアは二つの帝国の駆け引きの舞台であり続けた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/Tashkent_skyline_2019.jpg/500px-Tashkent_skyline_2019.jpg
      credit: Guidecity / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Tashkent_skyline_2019.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/タシュケント

  - id: anglo-russian-entente
    year: 1907
    title: 英露協商
    category: politics
    tags: [中央アジア, 外交]
    summary: 中央アジアでの争いに区切りをつけ、両国はドイツに向き合うことになった。
    detail: |
      1907年、イギリスとロシアがイラン・アフガニスタン・チベットでの勢力範囲を取り決めた協約。
      19世紀を通じて両国は中央アジアで対峙してきた。
      ロシアが三ハン国を併合して南下し、イギリスはインド防衛のためアフガニスタンに二度出兵している。
      この駆け引きは「グレート・ゲーム」と呼ばれた。

      20世紀に入ると事情が変わる。
      ロシアは日露戦争で敗れ、第一次ロシア革命で国内が動揺して、アジアでの拡張を続ける力を失った。
      イギリスの側も、ドイツの建艦競争とバグダード鉄道の計画に強い警戒を抱くようになる。
      遠い中央アジアの争いより、ヨーロッパでの均衡のほうが切実になった。

      協約では、イランを北のロシア勢力圏、南東のイギリス勢力圏、中間の中立地帯に三分した。
      アフガニスタンについてはロシアが利害関係を持たないと認め、チベットでは双方が内政に干渉しないことで合意する。
      当事国の意向は問われていない。

      この協約によって、すでに成立していた英仏協商と露仏同盟が結び合わさり、三国協商が形をなした。
      ドイツ・オーストリア・イタリアの三国同盟と向き合う構図が固まる。
      中央アジアでの決着が、そのままヨーロッパの二極化を完成させたのである。
      第一次世界大戦の同盟関係は、この時点でほぼ定まったといえる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/英露協商

  - id: central-asia-republics
    year: 1924
    title: 中央アジアの民族別共和国化
    category: politics
    tags: [ソ連, 民族]
    summary: ソ連が引いた民族の線引きが、現在の5か国の国境になっている。
    detail: |
      1924年からソ連が中央アジアに民族ごとの共和国を設けた「民族的境界画定」。
      ロシア帝国はこの地域をトルキスタン総督府として一括して統治し、住民は民族より宗教と地域で自らを捉えていた。
      ムスリムであること、都市の住民か遊牧民か、という区分のほうが実感に近い。

      革命後、ソヴィエト政権は民族自決の原則を掲げた。
      ただしそこには、汎トルコ主義や汎イスラム主義のような広域の連帯が育つのを防ぎ、統治しやすい単位に分ける意図もあったとされる。
      言語学者と民族学者が動員され、話し言葉の違いをもとに境界が引かれた。
      ウズベク、トルクメン、タジク、キルギス、カザフの各共和国が順に成立する。

      問題は、実際の分布が複雑だったことである。
      オアシス都市には多様な住民が混住し、言語の境目と生活の境目も一致しない。
      結果として、タジク語話者の多いサマルカンドとブハラはウズベク共和国に入り、フェルガナ盆地は三国が入り組んで分けられ、飛び地がいくつも生まれた。
      さらに、まとまりを補強するため、それぞれに標準語・国民文学・歴史叙述が整えられている。

      1991年の独立で、この行政上の線がそのまま国境になった。
      水利権や飛び地をめぐる緊張は今も残り、フェルガナ盆地では衝突も起きている。
      人為的に引かれた線がそのまま国家の輪郭になった例として、繰り返し参照される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/Central_Asia_%28orthographic_projection%29.svg/500px-Central_Asia_%28orthographic_projection%29.svg.png
      credit: Serg!o / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Central_Asia_(orthographic_projection).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/中央アジア

  - id: aral-sea
    year: 1960
    circa: true
    title: アラル海の縮小が始まる
    category: disaster
    tags: [中央アジア, 環境]
    summary: 綿花のための灌漑で湖の大半が消え、20世紀最大級の環境破壊とされる。
    detail: |
      1960年ごろから急速に進んだ、アラル海の縮小。
      かつては世界第4位の面積を持つ内陸湖で、アム川とシルダリヤ川の水が注ぎ込み、年間四万トン以上の漁獲があった。

      原因は灌漑である。
      ソ連が中央アジアを綿花の一大産地にする計画を進め、両河川から大規模に取水する水路を掘った。
      その一つカラクーム運河は全長千キロを超える。
      水路の多くは素掘りで、運ぶ途中に大量の水が地中へ失われ、湖に届く水は急激に減った。

      1987年には湖が南北に分断され、2000年代には南側がさらに東西に割れ、2014年には東側がほぼ完全に干上がる。
      面積は最盛期の一割程度にまで縮んだ。
      塩分濃度が海水の数倍に上がったため魚は死に絶え、漁業は消滅する。
      港町は岸から数十キロ離れた砂漠の中に取り残され、船が砂の上に横たわる光景が知られるようになった。

      干上がった湖底からは、塩と農薬を含む粉塵が風に舞う。
      周辺地域では呼吸器疾患や乳幼児死亡率の上昇が報告され、湖が調節していた気候も変わった。
      1990年代以降、カザフスタンが北側に堤防を築いて水位を回復させ、漁業が部分的に戻っている。
      一方、南側の大部分は回復の見通しが立っておらず、20世紀最大級の環境破壊として語られ続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/AralSea1989_2014.jpg/500px-AralSea1989_2014.jpg
      credit: NASA. Collage by Producercunningham. / Public domain
      page: https://commons.wikimedia.org/wiki/File:AralSea1989_2014.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アラル海

  - id: central-asia-independence
    year: 1991
    title: 中央アジア5か国の独立
    category: politics
    tags: [中央アジア, 現代]
    summary: ソ連解体で、望まないまま独立した国家が並ぶことになった。
    detail: |
      1991年、ソ連の解体にともなってカザフ・ウズベク・キルギス・トルクメン・タジクの五共和国が独立した出来事。

      8月のクーデタ未遂は、中央アジアの指導者にとって不意打ちだった。
      彼らの多くは連邦の維持を望んでおり、3月の国民投票でも存続への支持が高かった。
      つまり五か国は、独立運動の高まりによってではなく、連邦そのものが解けたことで独立したのである。
      カザフスタンの独立宣言は12月16日で、ソ連構成国の最後だった。

      新しい国の指導者は、ほとんどが共産党の第一書記そのままだった。
      ナザルバエフ、カリモフ、ニヤゾフらが大統領となり、体制の看板は変わっても統治の仕組みと人は連続している。
      経済の打撃は大きかった。
      原料を供給し食料や工業製品を受け取る分業に組み込まれていたため、連邦の解体で取引の網が切れたのである。

      タジキスタンでは地域と党派の対立が内戦に発展し、1997年までに数万人が死亡した。
      カザフスタンは領内の核兵器を放棄し、セミパラチンスク核実験場を閉鎖する。
      以後、五か国はロシア、中国、トルコ、欧米のあいだで距離を測りながら歩んできた。
      ソ連が1924年に引いた行政の線が、そのまま国際的な国境になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/Central_Asia_%28orthographic_projection%29.svg/500px-Central_Asia_%28orthographic_projection%29.svg.png
