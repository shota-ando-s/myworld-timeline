  - id: legnica
    year: 1241
    title: ワールシュタットの戦い
    category: war
    tags: [モンゴル, ヨーロッパ]
    summary: モンゴル軍がポーランド・ドイツ連合軍を破り、西欧に衝撃を与えた。
    detail: |
      1241年、バトゥの西方遠征軍の別働隊がポーランドに入り、レグニツァ近郊で諸侯軍を破った戦い。
      ドイツ語の「ワールシュタット」は戦場を意味する言葉に由来する。
      目的は占領ではなく、本隊が向かうハンガリーへ援軍が出るのを防ぐことだったとみられる。

      モンゴル軍はサンドミェシュ、クラクフを焼いてシロンスク（シレジア）へ進んだ。
      迎え撃ったのは、この地方を治めるヘンリク2世が集めたポーランド諸侯の軍で、ドイツ人騎士やテンプル騎士団の一隊も加わっていた。

      4月9日の戦闘では、当初、騎士たちの突撃がモンゴル軍を押した。
      しかしそれは偽りの退却で、深追いした騎兵は側面と背後から矢を浴び、煙幕で本隊との連絡を断たれて包囲される。
      ヘンリク2世は戦死した。
      二日後、南ではモヒの戦いでハンガリー王ベーラ4世の軍も同様に破られている。

      西欧の重装騎兵は、機動と弓、そして命令に従って退いて見せる戦術にまったく対応できなかった。
      この報せはローマ教皇と神聖ローマ皇帝にも届き、十字軍の呼びかけがなされたが実らない。
      翌年オゴデイの死によってモンゴル軍が引き返したことで、西欧は結果的に救われた。
      この敗北の後、ポーランドとハンガリーでは石造の城塞の建設が進み、1285年の再度の侵攻は撃退されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Bitwa_pod_Legnic%C4%85.jpg/500px-Bitwa_pod_Legnic%C4%85.jpg
      credit: マテウス・メーリアン / Public domain
      page: https://commons.wikimedia.org/wiki/File:Bitwa_pod_Legnic%C4%85.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ワールシュタットの戦い

  - id: pax-mongolica
    year: 1260
    circa: true
    title: モンゴルの平和
    category: economy
    tags: [モンゴル, 交易]
    summary: 一つの権力の下で東西の往来が安全になり、人と技術と情報が大量に動いた。
    detail: |
      13世紀半ばから14世紀半ばにかけて、ユーラシアの大部分が一つの支配のもとに入り、人と物と情報の行き来が容易になった時期を指す言葉。

      支えたのは制度だった。
      一定の距離ごとに駅（ジャム）を置き、馬と食料を備えさせる駅伝制が大陸を網の目に結ぶ。
      パイザと呼ばれる通行証を持つ者は、どの領域でも馬と宿を要求できた。
      モンゴルは商人を保護して関税を軽くし、支配層自身が資金を出して交易を営ませる仕組みも作っている。

      この道を通って多くのものが動いた。
      火薬と火器、印刷、羅針盤といった中国の技術が西へ向かい、イスラムの天文学・医学・数学が東へ入る。
      イルハン朝のラシード・アッディーンは、中国からヨーロッパまでを視野に入れた『集史』を編んだ。
      人も動き、マルコ・ポーロ、イブン・バットゥータ、ルブルックらの記録によって、ユーラシアの東西が初めて互いを具体的に知るようになる。

      ただし平和と呼ぶのは一面的でもある。
      この状態は大量の殺戮と都市の破壊の上に成り立っており、征服された側の記憶はまったく違う。
      そして同じ道を病も通った。
      14世紀半ば、中央アジアから黒海沿岸へ、さらに地中海世界へ運ばれたペストがユーラシア規模の流行になる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/34/Mongol_Empireaccuratefinal.png/500px-Mongol_Empireaccuratefinal.png
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Mongol_Empireaccuratefinal.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/パクス・モンゴリカ

  - id: marco-polo
    year: 1271
    title: マルコ・ポーロの東方旅行
    category: economy
    tags: [交易, ヨーロッパ]
    summary: 『東方見聞録』がヨーロッパにアジアへの憧れを植えつけた。
    detail: |
      ヴェネツィアの商人マルコ・ポーロが、1271年から24年にわたって東方を旅したとされる出来事。
      父ニッコロと叔父マッフェオはすでに一度東方へ旅してクビライに謁見しており、17歳前後のマルコを連れて再び出発した。

      一行は地中海からアッコに上陸し、イラン高原、パミール、タリム盆地の南縁を通って、1275年ごろ上都でクビライに会ったという。
      以後17年にわたり元に滞在し、各地へ派遣されて統治にも関わったと本は語るが、この官職の記述は中国側の史料に裏づけがない。
      1290年ごろ、イルハン朝へ嫁ぐ王女の護送に加わって海路で帰国の途につき、1295年にヴェネツィアへ戻った。

      帰国後、ジェノヴァとの戦いで捕虜となり、獄中で同室の作家ルスティケロに旅の話を語る。
      これが『世界の記述』、日本では『東方見聞録』の名で知られる書物になった。
      内容は、元の駅伝制度、紙幣、石炭の利用、大都の繁栄、そして日本を指す「ジパング」の黄金伝説に及ぶ。
      ヨーロッパの人々が初めて手にした、具体的で体系的な東アジアの情報だった。

      同時代には作り話とみなされ、万里の長城や纏足への言及がないことから中国へ行っていないとする説も唱えられてきた。
      近年は、当時の元の制度や物価についての記述の正確さから反論がなされている。
      いずれにせよ、この本がヨーロッパの東方への関心をかき立てた事実は変わらない。
      コロンブスは自分の写本に多くの書き込みを残しており、大航海時代の動機の一部をここに負っている。
