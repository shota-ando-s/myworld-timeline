      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/Timur_Review_His_Troops_Before_the_Battle_of_Ankara%2C_Zafarnama_1436.jpg/500px-Timur_Review_His_Troops_Before_the_Battle_of_Ankara%2C_Zafarnama_1436.jpg
