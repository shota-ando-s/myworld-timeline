  - id: golden-horde
    title: キプチャク・ハン国
    start: 1242
    end: 1502
    category: politics
    tags: [モンゴル, ロシア]
    summary: 南ロシアの草原を支配し、ルーシ諸公を240年従属させた。
    detail: |
      バトゥが西方遠征ののちヴォルガ下流に築いた国で、モンゴル語ではジョチ・ウルス、すなわちチンギスの長男ジョチの一族の領分という。
      「金帳汗国」の呼び名は、君主の黄金の天幕に由来する後世の名称である。
      版図はドナウ川の河口からカザフ草原まで広がったが、支配の中心は都サライと、そこから延びる交易路にあった。
      住民の多くはテュルク系のキプチャクで、征服者であるモンゴル人はやがてその言葉と暮らしに溶け込んでいく。
      ルーシ諸公国は直接統治されず、貢納の義務と、公位を承認する免状（ヤルルイク）を受け取りに都へ赴く義務を課された。
      徴税を請け負ったモスクワ公は、その立場を利用して力を蓄えていく。
      ロシア史ではこの二百四十年を「タタールのくびき」と呼ぶ。
      バトゥの弟ベルケの代にイスラムを受け入れ、エジプトのマムルーク朝と結んで、同じモンゴルのイルハン朝と争った。
      宗教と利害が血縁より優先された早い例である。
      14世紀前半のウズベク・ハンの時代に国教化が進み、サライは国際的な商業都市として最盛期を迎えた。
      衰退は14世紀後半に始まる。
      黒死病で人口が失われ、ハン位をめぐる争いが続いた。
      1380年にはクリコヴォでモスクワ大公ドミトリーに敗れ、無敵という印象が崩れる。
      決定的だったのはティムールの攻撃だった。
      1395年の遠征でサライをはじめとする都市が破壊され、交易路も南へ移って、国の経済的な基盤が失われる。
      15世紀にはカザン、クリミア、アストラハン、シビルなどのハン国に分かれた。
      1480年のウグラ川の対峙でモスクワは貢納をやめ、従属関係は終わる。
      後継の諸ハン国はロシアに次々と併合されたが、クリミア・ハン国だけはオスマン帝国の保護下で1783年まで存続した。
      ロシアの国家形成に与えた影響は大きく、徴税や駅伝の仕組み、外交の作法にモンゴル由来のものが数多く残った。
