  - id: east-timor-independence
    year: 2002
    title: 東ティモールの独立
    category: politics
    tags: [東南アジア]
    summary: 24年の占領と国連統治を経て、21世紀最初の独立国になった。
    detail: |
      東ティモールは、2002年5月20日に正式に独立し、21世紀最初の独立国となった。
      この島の東半分は長くポルトガルの植民地で、本国の革命を受けて1975年に独立を宣言した。
      しかしその直後、インドネシア軍が侵攻して併合する。

      二十四年に及んだ占領の間、抵抗運動は山岳地帯で続いた。
      軍事作戦と飢餓によって、十数万人が死亡したと推定されている。
      国連は併合を承認しなかったが、冷戦下で西側諸国はインドネシアを支持し、事態は長く放置された。

      転機は1998年のスハルト政権の崩壊である。
      後継のハビビ政権が住民投票を認め、1999年8月に実施された投票では、八割近くが独立を選んだ。
      結果が発表されると併合を支持する民兵が暴力に走り、多くの住民が殺され、インフラが焼き払われた。
      国際部隊が投入されて秩序が回復される。

      その後、国連の暫定統治のもとで行政と司法が一から作られ、2002年の独立に至った。
      独立後もクーデター未遂や騒乱が起き、国づくりは平坦ではなかった。
      海底のガス田の収入が財政を支えているが、産業の多様化が課題として残っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/Sitz_des_Administrators_in_Oecusse.jpg/500px-Sitz_des_Administrators_in_Oecusse.jpg
      credit: Regio Da Cruz Salu / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Sitz_des_Administrators_in_Oecusse.jpg
    links:
