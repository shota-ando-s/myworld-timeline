  - id: chakri
    title: チャクリー朝（タイ）
    start: 1782
    ongoing: true
    category: politics
    tags: [タイ]
    summary: 英仏の緩衝地帯という位置を利用し、東南アジアで唯一植民地化を免れた。
    detail: |
      チャクリー朝は、1782年にラーマ1世が開き、現在まで続いているタイの王朝である。
      都はチャオプラヤー川の東岸に新しく築かれ、バンコクと呼ばれるようになった。
      王宮とエメラルド寺院を中心とする都市の設計は、失われたアユタヤを意識したものだった。

      19世紀の半ば、イギリスとフランスが周辺を次々に植民地にしていく中で、この王朝は独立を保った。
      ラーマ4世は不平等な条約を受け入れて開国し、ラーマ5世は奴隷制を廃止し、行政・軍・教育を西洋式に改めた。
      周辺の領土をいくらか割譲する代わりに、国の中心部を守るという選択である。

      英仏の勢力圏の間に挟まれた緩衝地帯という位置も、独立の維持に働いた。
      こうしてタイは、東南アジアで唯一、植民地にならなかった国になった。

      1932年の立憲革命で絶対王政は終わり、王は憲法の下の存在となった。
      第二次世界大戦後、ラーマ9世（プミポン）の七十年に及ぶ在位の間に、王室は国民統合の象徴としての地位を固める。
      2016年にラーマ10世が即位し、王朝は二百四十年を超えて続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ac/%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%9A%E0%B8%A3%E0%B8%A1%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%8A%E0%B8%A7%E0%B8%B1%E0%B8%87%E0%B9%83%E0%B8%99%E0%B8%A2%E0%B8%B2%E0%B8%A1%E0%B8%84%E0%B9%88%E0%B8%B3%E0%B8%84%E0%B8%B7%E0%B8%99.jpg/500px-%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%9A%E0%B8%A3%E0%B8%A1%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%8A%E0%B8%A7%E0%B8%B1%E0%B8%87%E0%B9%83%E0%B8%99%E0%B8%A2%E0%B8%B2%E0%B8%A1%E0%B8%84%E0%B9%88%E0%B8%B3%E0%B8%84%E0%B8%B7%E0%B8%99.jpg
