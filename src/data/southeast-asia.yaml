  - id: malacca-sultanate
    title: マラッカ王国
    start: 1400
    end: 1511
    category: economy
    tags: [マレーシア, イスラム]
    summary: 海峡を押さえた港市国家。ここを起点にイスラムが群島へ広がった。
    detail: |
      マラッカ王国は、15世紀にマレー半島の西岸に栄えた港市国家である。
      建国者はパレンバンから逃れてきた王族パラメスワラとされ、1400年前後にこの地に拠点を構えた。
      マラッカ海峡の最も狭い部分に面し、季節風が変わるのを待つ船の停泊地として理想的な位置にあった。

      成長を後押ししたのが、明の鄭和の艦隊である。
      何度も寄港して明の保護を受けたことで、周辺のシャム勢力の圧迫をかわすことができた。
      王は明へ朝貢して正統性を得る一方、イスラムを受け入れてスルタンを名乗り、ムスリム商人を引き寄せた。

      港の運営はよく整えられていた。
      言語圏ごとに港務長官を置いて商人の世話をさせ、倉庫と度量衡を管理し、紛争は成文化された法で裁いた。
      インド、アラビア、中国、群島各地の船がここで荷を交換し、東西交易の結節点になった。

      この港を起点に、イスラムはジャワやスマトラ、フィリピン南部まで広がっていった。
      1511年、ポルトガルのアルブケルケが艦隊で攻め落とし、王国は滅びる。
      ヨーロッパ勢力が東南アジアの要衝を直接押さえた最初の例であり、この地域の近代史の起点とされる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/Malacca_Sultanate_en.svg/500px-Malacca_Sultanate_en.svg.png
      credit: Gunawan Kartapranata / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Malacca_Sultanate_en.svg
