  - id: japanese-occupation-sea
    title: 日本軍の占領
    start: 1942
    end: 1945
    category: war
    tags: [東南アジア, 第二次世界大戦]
    summary: 欧米の支配が3年で崩れたことが、戦後の独立運動を大きく後押しした。
    detail: |
      1942年から1945年まで、東南アジアのほぼ全域が日本軍の占領下に置かれた。
      開戦から半年ほどの間に、イギリス領のマレー半島とビルマ、オランダ領東インド、アメリカ領フィリピンが次々に陥落した。
      数百年続いた欧米の支配が短期間で崩れたことは、現地の人々に強い印象を残した。

      日本は「大東亜共栄圏」を掲げ、欧米からの解放を唱えた。
      ビルマとフィリピンには形式的な独立を認め、インドネシアでは民族運動の指導者を登用して軍事訓練を施した。
      こうして組織された部隊と人材が、戦後の独立戦争で中核になる。

      一方で、占領の実態は苛烈だった。
      物資と労働力の徴発が行われ、鉄道建設などに動員された労務者が多数死亡している。
      ビルマとベトナムでは食料の供出と輸送の途絶が重なって大規模な飢饉が起き、ベトナムでは数十万から百万を超える餓死者が出たとされる。

      1945年8月の日本の降伏は、権力の空白を生んだ。
      インドネシアとベトナムはその数日のうちに独立を宣言し、戻ってきた旧宗主国と戦うことになる。
      三年半の占領は、結果として東南アジアの脱植民地化を大きく早めた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Greater_Asian_Co-prosperity_sphere_%28orthographic_projection%29.svg/500px-Greater_Asian_Co-prosperity_sphere_%28orthographic_projection%29.svg.png
