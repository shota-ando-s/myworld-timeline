lane: southeast-asia

periods:
  - id: funan
    title: 扶南
    start: 100
    startCirca: true
    end: 550
    endCirca: true
    category: economy
    tags: [東南アジア, 交易]
    summary: メコン下流の港市国家。インドと中国を結ぶ海の道の要だった。
    detail: |
      扶南は、メコン川の下流域からチャオプラヤー川のデルタにかけて栄えた、東南アジアで最も早い時期の国家のひとつである。
      中国の史書に「扶南」の名で現れ、1世紀ごろに成立して7世紀まで続いたとされる。
      王都はメコン下流の内陸に置かれ、外港のオケオが海の玄関口として機能した。

      この国の富は、農業よりも中継交易から来ていた。
      インドから東アジアへ向かう船は、マレー半島の付け根で荷を陸揚げして反対側へ運び、そこから再び船に積み替えた。
      扶南はその積み替え地点を押さえ、通る船から利を得た。

      オケオの遺跡からは、ローマの金貨やインドの装身具、中国の鏡が出ている。
      地中海から東アジアまでが一本の交易路でつながっていたことを、この小さな港町の出土品が物語る。
      王たちはインド由来の称号を名乗り、ヒンドゥーの神々を祀り、のちには仏教も受け入れた。

      6世紀に入ると内陸のクメール勢力に押され、扶南は衰えて姿を消した。
      しかし港市が交易で富み、インドの宗教と王権の観念を取り入れて国の形を整えるという型は、この地域でくり返された。
      シュリーヴィジャヤもマラッカも、扶南が最初に示した道をたどっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a0/Map_indianized_kingdoms_indochina.jpg/500px-Map_indianized_kingdoms_indochina.jpg
      credit: Emmanuel de Chambost (France) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Map_indianized_kingdoms_indochina.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/扶南国

  - id: champa
    title: チャンパー
    start: 192
    end: 1832
    category: politics
    tags: [ベトナム, 交易]
    summary: 中部ベトナムのヒンドゥー系国家。1600年続き、ベトナムの南進で消えた。
    detail: |
      チャンパーは、現在のベトナム中部の海岸沿いに、2世紀末から19世紀まで続いた国である。
      住んでいたのはオーストロネシア語族のチャム人で、北のベトナム人とは言葉も文化も異なっていた。
      単一の中央集権国家というより、いくつかの港を中心とする小国の連合という性格が強かった。

      細長い海岸平野には大きな穀倉地帯がなく、チャンパーは海に生きた。
      中国とインドを結ぶ航路の途中に位置し、寄港する船に水と食料を売り、沈香や象牙などの山の産物を積み出した。
      時には海賊としてもふるまい、周辺の海域では恐れられる存在だった。

      王たちはヒンドゥー教を奉じ、シヴァを祀る塔をレンガで建てた。
      ミーソンの聖域に残る遺構群は、この文化の高さを今に伝えている。
      西のクメール王朝とは長く争い、1177年には水路からアンコールを襲って一時占領したこともある。

      しかし北から南下してくるベトナム人の圧力には抗しきれなかった。
      1471年に都のヴィジャヤが黎朝の大軍に落とされ、国土の大半を失う。
      残った南部の小さな領域も19世紀初めに阮朝へ併合され、1832年に完全に消滅した。
      チャム人は今もベトナムとカンボジアに少数民族として暮らしている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/8/8c/ChampaMap.png
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:ChampaMap.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チャンパ王国

  - id: srivijaya
    title: シュリーヴィジャヤ
    start: 670
    startCirca: true
    end: 1025
    category: economy
    tags: [東南アジア, 海上交易]
    summary: スマトラを拠点にマラッカ海峡を押さえた海の王国。仏教の学びの中心でもあった。
    detail: |
      シュリーヴィジャヤは、スマトラ島南東部のパレンバンを拠点に、7世紀後半から栄えた海の王国である。
      マラッカ海峡とスンダ海峡という二つの関門を押さえ、インド洋と南シナ海を結ぶ航路の通行を管理した。
      領土を広く支配するというより、海峡を通る船から利を得る型の国家だった。

      力の源は、港と海軍と交易である。
      通る船を自国の港へ呼び込み、そこで積み替えと売買をさせ、従わない船には武力で臨んだ。
      周辺の港市には服属を誓わせ、王の霊力を説く碑文を各地に立てて結びつきを保った。

      同時に、大乗仏教の学問の中心でもあった。
      671年にインドへ向かう途中でこの地に滞在した唐の僧・義浄は、千人を超える僧が学んでいると書き残している。
      インドのナーランダー僧院へ行く前に、ここでサンスクリットを学ぶことが勧められていた。

      1025年、南インドのチョーラ朝の艦隊が突然来襲し、王都をはじめ各地の港が襲われた。
      この打撃からシュリーヴィジャヤは立ち直れず、支配下の港市が次々に自立していく。
      14世紀には名前だけの存在となり、やがて消えた。
      海峡を押さえた者が群島の富を握るという構図は、マラッカ、そしてオランダへと受け継がれる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Srivijaya_Empire.svg/500px-Srivijaya_Empire.svg.png
      credit: Gunawan Kartapranata / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Srivijaya_Empire.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シュリーヴィジャヤ王国

  - id: angkor
    title: アンコール朝（クメール）
    start: 802
    end: 1431
    category: politics
    tags: [カンボジア]
    summary: 巨大な灌漑網と石造寺院を築いた王朝。アンコール・ワットで知られる。
    detail: |
      クメール王朝は、802年から15世紀まで、現在のカンボジアを中心に広がった国である。
      首都アンコールは最盛期に数十万の人口を抱え、当時の世界でも有数の規模の都市だったと見られている。
      領域はタイやラオス、ベトナム南部にまで及び、東南アジア大陸部の大半を覆った。

      この王朝を支えたのは、水を管理する技術だった。
      雨季に降る大量の雨を巨大な貯水池に溜め、乾季に水路で田へ送ることで、年に複数回の収穫を可能にした。
      西バライと呼ばれる貯水池は東西8キロにおよび、今も水をたたえている。

      歴代の王は、自らの力を石の建築として残した。
      スーリヤヴァルマン2世のアンコール・ワット、ジャヤーヴァルマン7世のアンコール・トムとバイヨンが代表である。
      信仰の中心はヒンドゥー教から大乗仏教へ移り、のちに上座部仏教が民衆に広がった。

      14世紀以降、水利施設の維持が難しくなったこと、西のアユタヤの台頭、交易路の変化などが重なって国は衰えた。
      1431年にアユタヤ軍の攻撃を受け、王都は南へ移される。
      密林に残された石造建築は19世紀に西洋へ紹介され、今はカンボジアの国旗にも描かれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Flag_of_Cambodia_%28pre-1863%29.svg/500px-Flag_of_Cambodia_%28pre-1863%29.svg.png
      credit: Blackcat / CC0
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Cambodia_(pre-1863).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クメール王朝

  - id: pagan
    title: パガン朝
    start: 1044
    end: 1297
    category: religion
    tags: [ミャンマー, 仏教]
    summary: ビルマ最初の統一王朝。平原に数千の仏塔を建て、上座部仏教を根づかせた。
    detail: |
      パガン朝は、11世紀から13世紀末まで、現在のミャンマーを統一した最初の王朝である。
      イラワジ川中流の乾燥した平野に都を置き、アノーラター王の時代に南のモン人の地まで支配を広げた。
      ビルマ族が主導する国家がこの地域に生まれたのは、これが最初だった。

      この王朝を特徴づけるのは、仏塔の建設である。
      王も貴族も富裕な民も、功徳を積むために寺と塔を寄進し続けた。
      二百数十年の間に平野には一万を超える建物が立ち、今も三千近い遺構が残っている。

      宗教的には、モン人を通じて伝わった上座部仏教が国の柱になった。
      それまでの土着の精霊信仰や密教的な教団は退けられ、スリランカとの交流を通じて戒律が整えられた。
      この選択が、ビルマを含む東南アジア大陸部の宗教地図を決めることになる。

      寺院への寄進が重なると、免税の土地が増えて王室の収入が細っていった。
      13世紀後半にはモンゴルの侵攻を受け、1287年に都が放棄される。
      国は小勢力に分裂し、ビルマが再び統一されるまで二百年以上かかった。
      現在バガンの遺跡群は世界遺産に登録されている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/e/e3/Pagan-kingdom.jpg
      credit: GE Harvey / GFDL
      page: https://commons.wikimedia.org/wiki/File:Pagan-kingdom.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/パガン王朝

  - id: ly-dynasty
    title: 李朝（大越）
    start: 1009
    end: 1225
    category: politics
    tags: [ベトナム]
    summary: 中国の支配を脱したベトナムが、独立国家としての体制を固めた王朝。
    detail: |
      李朝は、1009年から1225年まで続いた、ベトナム最初の長期安定王朝である。
      938年の白藤江の戦いで中国の支配を脱したあと、短命の王朝が続いていたが、李公蘊の即位で状況が変わった。
      彼は都をタンロン（現在のハノイ）に移し、以後千年にわたるこの都市の歴史が始まった。

      李朝は、中国から学んだ制度でベトナムの国家の形を整えた。
      1070年に文廟を建てて孔子を祀り、1075年には科挙を実施して官僚を選び始めた。
      仏教が国家の保護を受ける一方で、行政は儒教的な枠組みで動くという、その後も続く組み合わせがここで定まった。

      対外的には二方面で戦った。
      南のチャンパーへ遠征して領土を広げ、北では1075年から宋と大規模な戦争を行っている。
      将軍の李常傑は宋領へ先制攻撃をかけたのち防衛戦で持ちこたえ、独立を認めさせた。

      王朝の後半は幼少の王が続き、外戚の陳氏が実権を握った。
      1225年、幼い女帝の李昭皇が夫に位を譲る形で、政権は陳朝へ移る。
      二百年余りの間に固められた制度と都は、そのまま次の王朝に引き継がれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fb/Map_of_the_L%C3%BD_dynasty.png/500px-Map_of_the_L%C3%BD_dynasty.png
      credit: TRMC / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Map_of_the_L%C3%BD_dynasty.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/李朝_(ベトナム)

  - id: tran-dynasty
    title: 陳朝
    start: 1225
    end: 1400
    category: war
    tags: [ベトナム, モンゴル]
    summary: モンゴルの三度の侵攻を退け、ベトナムの独立意識を決定づけた。
    detail: |
      陳朝は、1225年から1400年まで続いたベトナムの王朝である。
      李朝の外戚だった陳氏が、幼い女帝から位を譲り受ける形で政権を握った。
      王が早めに退位して上皇となり、後継者を後見しながら実権を保つという独特の仕組みを採り、後継争いを抑えた。

      この王朝を有名にしたのは、モンゴルとの戦いである。
      1258年、1285年、1287年から88年の三度にわたって元の大軍が攻め込んだが、いずれも撃退した。
      正面からの決戦を避けて都を明け渡し、敵が補給に苦しむのを待って反撃するという戦い方が功を奏した。

      三度目の侵攻では、将軍の陳興道が白藤江の川底に杭を打ち込み、潮の引いた時に元の艦隊を座礁させて壊滅させた。
      この勝利は、ベトナム人が自らを中国とは違う独立した存在として意識する上で、決定的な出来事になった。

      文化の面では、漢字をもとにしたチュノムによる文学が生まれ、自国の歴史を記す書物も編まれた。
      14世紀後半に王権が弱まると外戚の胡季犛が台頭し、1400年に王朝は倒される。
      その混乱に乗じて明が侵攻し、ベトナムは二十年間の支配を受けることになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/04/Map_of_the_Tr%E1%BA%A7n_dynasty_%281225-1400%29.png/500px-Map_of_the_Tr%E1%BA%A7n_dynasty_%281225-1400%29.png
      credit: TRMC / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Map_of_the_Tr%E1%BA%A7n_dynasty_(1225-1400).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/陳朝

  - id: sukhothai
    title: スコータイ朝
    start: 1238
    end: 1438
    category: culture
    tags: [タイ]
    summary: タイ人最初の王国。タイ文字が作られ、上座部仏教が国の柱になった。
    detail: |
      スコータイ朝は、13世紀半ばに現在のタイ北部に成立した王朝で、タイ族最初の本格的な国家とされる。
      それまでこの地域はクメール王朝の支配下にあったが、その力が衰えた隙に地方の首長たちが自立した。
      実際の勢力範囲はそれほど広くなく、周辺の首長を緩やかに従える連合に近い性格だった。

      三代目のラームカムヘーン王の時代が最盛期とされる。
      碑文によれば、王は宮殿の前に鈴を吊るし、訴えのある者は誰でもそれを鳴らして直接訴え出られたという。
      「水に魚あり、田に米あり」という一節は、豊かで自由な国の理想像として今日まで引かれている。

      この時代に、クメール文字をもとにタイ文字が作られたと伝えられる。
      また、スリランカから上座部仏教の一派を招き、これを国の宗教とした。
      優美な姿勢の遊行仏像に代表される仏教美術は、タイ独自の様式として高く評価されている。

      ラームカムヘーンの死後は急速に衰え、南のアユタヤに押されていった。
      1438年に完全に併合され、独立した王国としての歴史を終える。
      タイでは、この王朝が国民国家の原点として語られ、遺跡群は世界遺産になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/Southeast_Asian_history_-_13th_century.png/500px-Southeast_Asian_history_-_13th_century.png
      credit: Nicolas Eynaud / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Southeast_Asian_history_-_13th_century.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スコータイ王朝

  - id: majapahit
    title: マジャパヒト王国
    start: 1293
    end: 1527
    category: politics
    tags: [インドネシア, ジャワ]
    summary: ジャワを中心に群島世界へ影響を広げた、ヒンドゥー系最後の大国。
    detail: |
      マジャパヒト王国は、13世紀末に東ジャワで興り、群島世界に広く影響を及ぼした国である。
      成立の経緯が変わっていて、元のクビライが派遣した遠征軍を利用して敵対勢力を倒し、そのあと元軍を追い払って建国された。
      インドネシアの歴史では、ヒンドゥー・仏教系の最後の大国と位置づけられる。

      最盛期は14世紀半ばのハヤム・ウルク王と宰相ガジャ・マダの時代である。
      宮廷詩によれば、その影響力はスマトラ、ボルネオ、マレー半島、そして東の島々にまで及んだとされる。
      ただし、直接支配していたのはジャワの一部で、他は交易と婚姻を通じた緩やかな結びつきだった。

      富の源は、ジャワの稲作と、香辛料の中継交易である。
      東のマルク諸島でとれる丁子や肉豆蔲を集め、西の商人へ売り渡す位置を占めていた。
      宮廷では古ジャワ語の文学が栄え、『ナーガラクルターガマ』のような作品が残された。

      ハヤム・ウルクの死後は王位争いが続き、各地の港市が離れていった。
      代わって勢いを得たのがイスラムを受け入れた沿岸の諸勢力で、16世紀初めに王国は滅びる。
      ヒンドゥーの伝統はバリ島に逃れ、そこで今も生き続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/Majapahit_fictitious_flag.svg/500px-Majapahit_fictitious_flag.svg.png
      credit: Inayubhagya / Public domain
      page: https://commons.wikimedia.org/wiki/File:Majapahit_fictitious_flag.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マジャパヒト王国

  - id: ayutthaya
    title: アユタヤ朝
    start: 1351
    end: 1767
    category: economy
    tags: [タイ, 交易]
    summary: 400年続いた国際交易都市。日本人町も置かれ、朱印船が行き交った。
    detail: |
      アユタヤ朝は、1351年から1767年まで四百年余り続いた、タイの王朝である。
      チャオプラヤー川の中州に築かれた都は、三方を川に囲まれた天然の要害であり、同時に海へ通じる船が上れる港でもあった。
      この地の利が、王朝の長い繁栄を支えた。

      国の性格は交易国家である。
      中国、日本、インド、ペルシア、そして17世紀にはオランダやフランスの商人が集まり、都には各国の居留地が置かれた。
      日本人町には山田長政のような人物が現れ、王室の傭兵として仕えている。
      米や鹿皮、蘇木といった産物が輸出され、王室が交易を独占して利益を得た。

      制度の面では、クメールから受け継いだ神王の観念と、サクディナーと呼ばれる身分秩序が国の骨格になった。
      人はみな位階に応じた数値を与えられ、土地と労役の義務がそれに従って定まった。
      この仕組みは19世紀まで残る。

      17世紀末に対外関係が閉じられ、18世紀には王位争いが続いた。
      1767年、ビルマのコンバウン朝の軍が都を攻め落とし、徹底的に破壊する。
      王朝はここで滅びたが、直後にタークシンが国を立て直し、現在のバンコク王朝へつながっていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Flag_of_Thailand_%28Ayutthaya_period%29.svg/500px-Flag_of_Thailand_%28Ayutthaya_period%29.svg.png
