  - id: spanish-philippines
    title: スペイン領フィリピン
    start: 1565
    end: 1898
    category: religion
    tags: [フィリピン, 植民地]
    summary: 333年の統治でアジア唯一のカトリック国になった。
    detail: |
      スペインによるフィリピン統治は、1565年から1898年まで三百三十年余り続いた。
      始まりはミゲル・ロペス・デ・レガスピの遠征で、セブ島に拠点を置き、1571年にマニラを占領して都とした。
      島々の名は、当時の国王フェリペ2世にちなむ。

      統治の最大の柱は、カトリックへの改宗だった。
      各地に修道会が入り、住民を教会のある集落へ集めて住まわせ、洗礼と教育を通じて信仰を根づかせた。
      多くの村では、総督府の役人より修道士のほうが実質的な権力を持っていた。
      南部のミンダナオではムスリムの抵抗が最後まで続き、この地域は完全には征服されなかった。

      経済の面では、マニラを中継地とするガレオン貿易が中心で、フィリピン自体の開発は後回しにされた。
      19世紀に入ってようやく砂糖やマニラ麻の輸出が伸び、そこから現地の富裕層が育っていく。

      スペイン語教育を受けた知識人からホセ・リサールらが現れ、改革を求める運動が起こった。
      1896年の革命と、1898年の米西戦争によってスペインの統治は終わる。
      しかし独立は認められず、支配はアメリカへ移った。
      今日フィリピンがアジアで数少ないカトリック国であるのは、この三世紀の遺産である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/Flag_of_Spain_%281785%E2%80%931873%2C_1875%E2%80%931931%29.svg/500px-Flag_of_Spain_%281785%E2%80%931873%2C_1875%E2%80%931931%29.svg.png
