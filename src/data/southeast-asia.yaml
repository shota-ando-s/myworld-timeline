  - id: nguyen-dynasty
    title: 阮朝
    start: 1802
    end: 1945
    category: politics
    tags: [ベトナム]
    summary: ベトナム最後の王朝。半ばからフランスの保護下に置かれた。
    detail: |
      阮朝は、1802年から1945年まで続いたベトナム最後の王朝である。
      長く南部を治めていた阮氏の一族から出た阮福暎が、西山朝を倒して全土を統一し、開いた。
      国号を「越南」と定め、都は中部のフエに置かれた。

      初期の皇帝たちは、清の制度を手本に中央集権を進めた。
      法典を整え、科挙で官僚を選び、儒教を国の教えとした。
      カンボジアやラオスへも影響力を伸ばし、版図は歴代で最も広くなった。
      一方でキリスト教を厳しく禁じ、宣教師と信徒への弾圧をくり返した。

      この弾圧を口実に、1858年からフランスが軍事介入を始める。
      南部のコーチシナがまず直轄植民地となり、1883年から84年の条約で中部と北部も保護国とされた。
      以後の皇帝は儀礼上の存在にすぎず、実権はフランス総督が握った。

      抵抗を試みた皇帝は廃位され、流刑に処せられている。
      1945年、日本の敗戦の直後に起きた八月革命で、バオダイ帝が退位して王朝は終わった。
      フエの王宮と陵墓群は戦争で大きな損害を受けたが、修復されて世界遺産になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/34/Long_tinh_flag.svg/500px-Long_tinh_flag.svg.png
      credit: Smurrayinchester / Public domain
      page: https://commons.wikimedia.org/wiki/File:Long_tinh_flag.svg
    links:
