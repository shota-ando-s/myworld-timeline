  - id: vietnam-war
    title: ベトナム戦争
    start: 1955
    end: 1975
    category: war
    tags: [ベトナム, 冷戦]
    summary: 南北の内戦に米国が大規模介入し、冷戦期最大級の戦争になった。
    detail: |
      ベトナム戦争は、南北に分断されたベトナムをめぐって二十年にわたって続いた戦争である。
      1954年のジュネーヴ協定で予定された統一選挙が実施されず、北にホー・チ・ミンの政権、南にアメリカが支える政権が並び立ったことが出発点になった。
      南では反政府勢力が武装闘争を始め、北がこれを支援した。

      アメリカは、一国が共産化すれば周辺も倒れるという考えから介入を深めた。
      1964年のトンキン湾事件を機に本格的な軍事行動に踏み切り、北爆を開始する。
      派兵は最大で五十万人を超え、枯葉剤の散布や大規模な爆撃が行われた。

      1968年のテト攻勢は軍事的には解放戦線側の損害が大きかったが、アメリカ国内で厭戦の世論を決定的にした。
      戦場の映像が茶の間に届いたことが、この戦争の性格を変えている。
      1973年のパリ協定で米軍は撤退し、1975年4月にサイゴンが陥落して南の政権は崩れた。

      翌年、南北は統一されてベトナム社会主義共和国になった。
      死者はベトナム側だけで数百万に達し、国土には不発弾と枯葉剤の影響が長く残った。
      アメリカにとっては初めての実質的な敗戦であり、以後の外交と軍事に深い影を落としている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/f/f6/VietnamMural-v2.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:VietnamMural-v2.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ベトナム戦争

  - id: khmer-rouge
    title: クメール・ルージュの支配
    start: 1975
    end: 1979
    category: society
    tags: [カンボジア]
    summary: 都市を解体し貨幣と学校を廃した4年で、人口の4分の1が失われたとされる。
    detail: |
      クメール・ルージュの支配は、1975年から1979年まで、カンボジアで四年足らず続いた統治である。
      国名は民主カンプチアと改められ、ポル・ポトを指導者とする共産主義組織が全権を握った。
      目指したのは、農業を基礎とする完全に平等な社会を、一挙に作り出すことだった。

      政権を取った直後から、極端な政策が実行された。
      首都プノンペンをはじめとする都市の住民は、わずかな猶予で全員が農村へ追い立てられた。
      貨幣と市場は廃止され、学校と病院と寺院は閉じられ、郵便も廃された。
      人々は集団農場に配属され、家族は引き離されて共同生活と長時間の労働を強いられた。

      知識人とされた者は標的になった。
      教師、医師、僧侶、外国語を話す者、眼鏡をかけているというだけの者までが「敵」とみなされ、処刑された。
      飢えと病気、過労、そして虐殺によって、四年間で百五十万から二百万人が死亡したと推定される。
      当時の人口の二割から四分の一にあたる。

      1978年末、国境紛争を理由にベトナム軍が侵攻し、翌年1月に政権は倒れた。
      しかし冷戦の構図の中で、この政権は国際社会の一部から国連の議席を認められ続けた。
      指導者の裁判が始まったのは、三十年後のことである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Flag_of_Democratic_Kampuchea.svg/500px-Flag_of_Democratic_Kampuchea.svg.png
      credit: This (SVG on base of source) was created by me. See File History, below, for details. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Democratic_Kampuchea.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/民主カンプチア

events:
  - id: indianization
    year: 100
    circa: true
    title: インド文化の伝播
    category: religion
    tags: [東南アジア, 交易]
    summary: 交易とともにヒンドゥー教・仏教・サンスクリットが伝わり、王権の形を与えた。
    detail: |
      1世紀ごろから、インドの文化が海を越えて東南アジアへ広がりはじめた。
      運んだのは征服軍ではなく、季節風に乗って往復した商人と、それに同行した僧や祭司たちだった。
      植民地化ではなく、現地の支配者が自ら進んで取り入れたところに、この伝播の特徴がある。

      入ってきたのは、ヒンドゥー教と仏教、サンスクリット語、インド系の文字、そして法や暦の知識である。
      とりわけ大きかったのは王権の観念で、王を神と重ね合わせる考え方が各地の首長に受け入れられた。
      村の長にすぎなかった者が、シヴァやヴィシュヌと結びつくことで、他とは違う存在として君臨できるようになった。

      現地の側は、必要なものを選んで取り入れた。
      インドのカースト制度はほとんど根づかず、女性の地位も土着の慣習が残った。
      文字は各地の言語に合わせて作り変えられ、クメール文字やタイ文字、ジャワ文字へと枝分かれしていった。

      この流れは千年以上続き、扶南からアンコール、シュリーヴィジャヤ、マジャパヒトまでの国々の骨格になった。
      今日でもタイの王室儀礼にはバラモンが関わり、バリ島にはヒンドゥーの祭礼が生きている。
      東南アジアを「インド化された世界」と呼ぶ言い方は、この長い受容を指している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7f/North_Gateway_-_Rear_Side_-_Stupa_1_-_Sanchi_Hill_2013-02-21_4480-4481.JPG/500px-North_Gateway_-_Rear_Side_-_Stupa_1_-_Sanchi_Hill_2013-02-21_4480-4481.JPG
      credit: Biswarup Ganguly / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:North_Gateway_-_Rear_Side_-_Stupa_1_-_Sanchi_Hill_2013-02-21_4480-4481.JPG
    links:
