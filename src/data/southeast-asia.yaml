  - id: indian-ocean-tsunami
    year: 2004
    title: スマトラ島沖地震と津波
    category: disaster
    tags: [インドネシア, 災害]
    summary: 22万人以上が犠牲になり、インド洋に津波警報網が作られた。
    detail: |
      2004年12月26日、スマトラ島沖で発生した巨大地震が、インド洋全域に津波をもたらした。
      地震の規模はモーメントマグニチュード9.1前後で、観測史上でも有数の大きさだった。
      海底のプレート境界が千キロ以上にわたって一気にずれ動き、大量の海水を持ち上げた。

      津波は数時間のうちにインド洋を横断した。
      震源に近いインドネシアのアチェ州では、高さ三十メートルに達する波が町を飲み込み、最も多くの犠牲者を出した。
      タイのプーケット、スリランカ、インド南部、そして七時間後にはアフリカのソマリア沿岸にも到達している。

      死者と行方不明者は、十四か国で二十二万人を超えた。
      観光地が被災したため、各国からの旅行者も多数が犠牲になり、世界的な関心を集めた。
      国際的な支援は過去に例のない規模となり、数十億ドルが集まっている。

      この災害で明らかになったのが、インド洋に津波の警報網が無かったという事実である。
      太平洋には既に整備されていた仕組みが、この海域では存在しなかった。
      事後に観測網と通報体制が作られ、各国で避難訓練も行われるようになった。
      アチェでは、この被害を契機に長年続いた分離独立紛争の和平が成立している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/US_Navy_050102-N-9593M-040_A_village_near_the_coast_of_Sumatra_lays_in_ruin_after_the_Tsunami_that_struck_South_East_Asia.jpg/500px-US_Navy_050102-N-9593M-040_A_village_near_the_coast_of_Sumatra_lays_in_ruin_after_the_Tsunami_that_struck_South_East_Asia.jpg
      credit: U.S. Navy photo by Photographer's Mate 2nd Class Philip A. McDaniel / Public domain
      page: https://commons.wikimedia.org/wiki/File:US_Navy_050102-N-9593M-040_A_village_near_the_coast_of_Sumatra_lays_in_ruin_after_the_Tsunami_that_struck_South_East_Asia.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スマトラ島沖地震_(2004年)
