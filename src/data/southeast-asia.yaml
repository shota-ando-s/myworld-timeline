  - id: dutch-east-indies
    title: オランダ領東インド
    start: 1800
    end: 1949
    category: politics
    tags: [インドネシア, 植民地]
    summary: 強制栽培制度で本国を潤し、群島が一つの「インドネシア」にまとめられた。
    detail: |
      オランダ領東インドは、現在のインドネシアにあたる地域を覆ったオランダの植民地である。
      1799年に東インド会社が解散したあと、その権益を政府が引き継ぐ形で成立した。
      当初の支配は島の一部にとどまり、群島全域に及ぶのは20世紀初めのことである。

      1830年から始まった強制栽培制度が、この植民地の性格を決めた。
      農民は耕地の一部でコーヒー、砂糖、藍などを作って政府に納めることを義務づけられた。
      これによってオランダ本国の財政は潤ったが、ジャワでは食料生産が圧迫され、各地で飢饉が起きている。

      19世紀末に批判が高まると、教育や灌漑に投資する「倫理政策」へ方針が変わった。
      しかし、その教育を受けた若い世代から民族意識が育ち、独立運動の担い手が現れる。
      支配のために作られた統一的な行政と、共通語となったマレー語が、皮肉にも一つの国という意識を準備した。

      1942年に日本軍が進駐して支配は中断し、1945年の敗戦直後にスカルノが独立を宣言した。
      オランダは軍を送って抵抗したが、国際的な圧力もあり、1949年に主権を移譲する。
      三百五十年の関わりは、こうして終わった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Flag_of_the_Netherlands.svg/500px-Flag_of_the_Netherlands.svg.png
      credit: Zscout370 / Public domain
