        url: https://ja.wikipedia.org/wiki/サイゴン陥落

  - id: doi-moi
    year: 1986
    title: ドイモイ（刷新）
    category: economy
    tags: [ベトナム, 改革]
    summary: 社会主義の枠組みを残したまま市場経済を導入し、高成長に転じた。
    detail: |
      ドイモイは、1986年のベトナム共産党大会で打ち出された経済改革の方針である。
      言葉の意味は「刷新」で、社会主義の政治体制を保ったまま、市場の仕組みを取り入れるものだった。
      中国の改革開放から八年遅れて、同じ方向へ舵を切ったことになる。

      背景には深刻な経済の行き詰まりがあった。
      統一後に南部へ社会主義の計画経済を広げた結果、生産は落ち込み、米の輸出国だったはずの国が食料不足に陥った。
      カンボジア侵攻による国際的な孤立と、ソ連の援助の縮小も重なり、年率で数百パーセントの物価上昇が起きていた。

      改革の中身は具体的である。
      農業では集団農場を解体し、農家が土地を長期に借りて余剰を自由に売れるようにした。
      価格統制を外し、民間企業を認め、外国資本の投資を受け入れる法律を整えた。

      効果はすぐに現れた。
      数年で米の輸出国に戻り、以後三十年以上にわたって高い成長を続けている。
      衣料や電子機器の生産拠点として世界の供給網に組み込まれ、貧困率も大きく下がった。
      政治の一党支配は変わらないまま経済だけを開くという形は、中国と並ぶ一つの型になっている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ドイモイ

  - id: asian-crisis-origin
    year: 1997
    title: タイ発のアジア通貨危機
    category: economy
    tags: [タイ, 経済危機]
    summary: バーツの暴落が周辺国に連鎖し、急成長のもろさを露わにした。
    detail: |
      アジア通貨危機は、1997年7月にタイの通貨バーツが暴落したことから始まった、連鎖的な経済危機である。
      タイはドルに連動させる固定相場を維持していたが、経常赤字が膨らむ中で通貨が割高だと見られ、投機的な売りを浴びた。
      外貨準備を使い果たした政府は、7月2日に変動相場制へ移行し、バーツは急落した。

      危機はすぐに周辺へ広がった。
      インドネシア、韓国、マレーシア、フィリピンの通貨と株価が次々に崩れ、短期の外国資金が一斉に引き揚げた。
      外貨で借りて自国通貨で稼いでいた企業と銀行は、返済額が膨れ上がって行き詰まった。

      IMFはタイ、インドネシア、韓国に巨額の融資を行ったが、財政緊縮と高金利を条件としたため、不況をかえって深めたという批判が強い。
      マレーシアはこれを拒み、資本移動を規制する独自の道をとった。

      影響は経済にとどまらなかった。
      インドネシアでは物価の急騰と暴動が起き、三十二年続いたスハルト政権が倒れた。
      タイでも政権が交代している。
      各国はこの経験から外貨準備を厚く積むようになり、地域内で通貨を融通し合う仕組みも作られた。
      急成長の裏にあった資本の脆さを、この危機が明らかにした。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Asian_Financial_Crisis_EN_vector.svg/500px-Asian_Financial_Crisis_EN_vector.svg.png
      credit: User:Weaveravel / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Asian_Financial_Crisis_EN_vector.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アジア通貨危機
