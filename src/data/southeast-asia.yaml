        url: https://ja.wikipedia.org/wiki/オランダ領東インド

  - id: french-indochina
    title: フランス領インドシナ
    start: 1887
    end: 1954
    category: politics
    tags: [ベトナム, 植民地]
    summary: ベトナム・カンボジア・ラオスがフランスの統治下に置かれた時期。
    detail: |
      フランス領インドシナは、現在のベトナム、カンボジア、ラオスを一つにまとめたフランスの植民地である。
      1887年にベトナムの三地域とカンボジアを合わせて発足し、1893年にラオスが加わった。
      総督がハノイに置かれ、地域ごとに直轄地と保護国という異なる形が併存した。

      経済の目的ははっきりしていた。
      メコン・デルタの米、北部の石炭、そして高原地帯のゴムを本国へ供給することである。
      農園や鉱山では過酷な労働が強いられ、人頭税や塩・酒・阿片の専売が住民に重くのしかかった。

      一方で、道路と鉄道、港が整備され、ハノイやサイゴンには西洋風の街並みが作られた。
      フランス語による教育を受けた層からは、やがて独立運動の指導者が現れる。
      ベトナム語をローマ字で書くクオック・グーが普及したのも、この時期である。

      1940年に日本軍が進駐し、フランスの権威は大きく傷ついた。
      1945年の独立宣言後、フランスは支配の回復を図って第一次インドシナ戦争となる。
      1954年のディエンビエンフーの敗北とジュネーヴ協定によって、植民地は解体された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Flag_of_France.svg/500px-Flag_of_France.svg.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_France.svg
