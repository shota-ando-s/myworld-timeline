  - id: konbaung
    title: コンバウン朝
    start: 1752
    end: 1885
    category: politics
    tags: [ミャンマー]
    summary: ビルマ最後の王朝。三度の英緬戦争に敗れて滅びた。
    detail: |
      コンバウン朝は、1752年から1885年まで続いた、ビルマ最後の王朝である。
      先行するタウングー朝が滅びて国が分裂した直後、村長だったアラウンパヤーが挙兵して再統一を果たした。
      都はアヴァ、アマラプラ、そして最後はマンダレーへと移された。

      建国から半世紀ほどは、周辺への拡張が続いた。
      アユタヤを1767年に攻め落とし、西はアラカン、北はマニプールまで版図を広げた。
      清の乾隆帝が送った四度の遠征軍をすべて退けたことも、この王朝の軍事力を示している。

      西へ広がった結果、インドを押さえるイギリスと国境で接することになった。
      1824年の第一次英緬戦争で沿岸部を失い、1852年の第二次戦争で下ビルマ全域を取られる。
      王たちは制度の近代化を試みたが、財政も軍も立て直すには至らなかった。

      1885年の第三次戦争はわずか二週間で終わり、王ティーボーはインドへ流された。
      ビルマは英領インドの一州として組み込まれ、王制は消滅する。
      独立の回復は、1948年まで待たなければならなかった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/National_flag_of_Third_Burmese_Empire_%28Konbaung_Dynasty%29.svg/500px-National_flag_of_Third_Burmese_Empire_%28Konbaung_Dynasty%29.svg.png
      credit: Albert Poliakoff / Public domain
      page: https://commons.wikimedia.org/wiki/File:National_flag_of_Third_Burmese_Empire_(Konbaung_Dynasty).svg
    links:
      - label: Wikipedia
