  - id: le-dynasty
    title: 黎朝
    start: 1428
    end: 1789
    category: politics
    tags: [ベトナム]
    summary: 明の支配を退けて成立。南進を進め、現在のベトナムの形に近づけた。
    detail: |
      黎朝は、1428年から1789年まで続いた、ベトナム史上最も長い王朝である。
      明の支配を武力で退けた黎利が開き、その後の混乱期を挟みながら三百六十年にわたって名目上の王統を保った。
      後半は実権を失い、北の鄭氏と南の阮氏が実際の統治を分け合った。

      前半の最盛期が、五代目の黎聖宗の治世である。
      中国の明にならった六部の制度と科挙を整え、全国を十三の道に分けて統治した。
      『洪徳法典』と呼ばれる法典は、女性の財産権を認めるなど、中国の法をそのまま写したものではない部分も含む。

      対外的には南へ向かった。
      1471年にチャンパーの都を落として中部を併合し、その後も開拓民を送り込んで領土を広げ続けた。
      この南進は数百年かけてメコン・デルタにまで達し、現在のベトナムの細長い国土を形づくった。

      16世紀に莫氏の簒奪で一度途絶え、復活後は有力な二つの一族に実権を奪われる。
      18世紀後半、西山党の反乱によって北も南も倒され、1789年に王朝は終わった。
      その後を継いだのが、南の阮氏の血を引く阮朝である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Map_of_Later_L%C3%AA_dynasty_during_the_reign_of_L%C3%AA_Th%C3%A1nh_T%C3%B4ng_%281460-1497%29.png/500px-Map_of_Later_L%C3%AA_dynasty_during_the_reign_of_L%C3%AA_Th%C3%A1nh_T%C3%B4ng_%281460-1497%29.png
