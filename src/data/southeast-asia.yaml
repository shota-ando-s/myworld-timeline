      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Artillery_in_Dien_Bien_Phu.jpg/500px-Artillery_in_Dien_Bien_Phu.jpg
      credit: Vietnam / Public domain
      page: https://commons.wikimedia.org/wiki/File:Artillery_in_Dien_Bien_Phu.jpg
    links:
