  - id: bandung-conference
    year: 1955
    title: バンドン会議
    category: politics
    tags: [インドネシア, 第三世界]
    summary: アジア・アフリカ29か国が集まり、米ソのどちらにもつかない立場を打ち出した。
    detail: |
      バンドン会議は、1955年4月にインドネシアの都市バンドンで開かれた、アジア・アフリカ二十九か国の首脳会議である。
      参加国の人口を合わせると、当時の世界の半分を超えた。
      植民地から独立して間もない国々が、旧宗主国を抜きにして一堂に会したのは、これが初めてだった。

      呼びかけたのはインドネシアのスカルノ、インドのネルー、中国の周恩来らである。
      議題は、植民地主義の否定、人種差別の撤廃、そして冷戦の対立に巻き込まれない立場の確認だった。
      最終日に採択された平和十原則には、主権の尊重、内政不干渉、紛争の平和的解決が盛り込まれている。

      参加国の立場は一様ではなかった。
      西側と同盟を結ぶ国もあれば、社会主義に近い国もあり、議論は紛糾した場面もある。
      中国の周恩来が対立を和らげる役を演じ、共通点を探る方向でまとめた。

      この会議から、米ソのどちらの陣営にも属さない非同盟運動が育っていく。
      1961年のベオグラード会議で組織として形を得た。
      実際の政治的な結束力には限界があったが、「第三世界」という言葉と立場を世界に認めさせた点で、戦後史の転換点とされる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/Gedung.Merdeka.jpg/500px-Gedung.Merdeka.jpg
      credit: Ron4 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Gedung.Merdeka.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アジア・アフリカ会議

  - id: asean
    year: 1967
    title: ASEAN（東南アジア諸国連合）結成
    category: politics
    tags: [現代, 地域統合]
    summary: 冷戦下で地域の安定と協力をめざす枠組みが作られた。
    detail: |
      ASEAN（東南アジア諸国連合）は、1967年にバンコクで五か国によって結成された地域機構である。
      最初の加盟国はインドネシア、マレーシア、フィリピン、シンガポール、タイだった。
      ベトナム戦争が激化する中で、共産主義の波及を防ぎ、域内の紛争を抑えることが当面の目的だった。

      運営の特徴は、拘束力の強い制度を作らないことにある。
      全会一致を原則とし、内政に干渉せず、対立は非公式の対話で処理する。
      この穏やかなやり方は「ASEANウェイ」と呼ばれ、決定の遅さを批判される一方、加盟国をつなぎ留める役目も果たしてきた。

      冷戦が終わると、性格が変わっていく。
      1984年のブルネイに続き、1995年にベトナム、1997年にラオスとミャンマー、1999年にカンボジアが加わり、十か国となった。
      かつて敵対していた国々が同じ枠組みに入ったことになる。

      近年は経済統合が軸になり、2015年にはASEAN経済共同体が発足した。
      域内人口は六億を超え、一つの市場として扱われるようになっている。
      一方、南シナ海の問題やミャンマー情勢では足並みが揃わず、その調整能力が問われ続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5e/Association_of_Southeast_Asian_Nations_%28orthographic_projection%29.svg/500px-Association_of_Southeast_Asian_Nations_%28orthographic_projection%29.svg.png
      credit: Addicted04 / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:Association_of_Southeast_Asian_Nations_(orthographic_projection).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/東南アジア諸国連合

  - id: singapore-independence
    year: 1965
    title: シンガポールの独立
    category: economy
    tags: [シンガポール]
    summary: 資源のない小国が貿易と金融で先進国になる道を示した。
    detail: |
      シンガポールが独立国になったのは1965年8月で、自ら望んだ結果ではなかった。
      1963年にマレーシア連邦の一員となったものの、わずか二年で連邦議会の議決によって分離を求められたのである。
      リー・クアンユー首相は記者会見で涙を見せながら、この日を告げた。

      分離の背景には民族をめぐる対立があった。
      中国系が多数を占めるこの島は、マレー人の優位を前提とする連邦の枠組みと折り合わなかった。
      独立時の状況は苛酷で、天然資源は無く、水すらマレーシアからの供給に頼り、失業率も高かった。

      政府が採った道は、国内市場ではなく世界を相手にすることだった。
      多国籍企業を誘致して工業団地に集め、港湾を拡張し、英語による教育で人材を育てた。
      公営住宅で全国民に持ち家を行き渡らせ、民族ごとの居住地の偏りも意図的に解消した。

      数十年で、この都市国家は製造業から金融・物流・先端産業へと軸足を移した。
      一人当たりの所得は世界でも上位に並び、港とハブ空港はアジアの結節点になっている。
      資源を持たない小国が貿易と制度設計で豊かになれることを示した例として、しばしば参照される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Flag_of_Singapore.svg/500px-Flag_of_Singapore.svg.png
      credit: "原作: Government of Singapore ベクタ: Zscout370 / Public domain"
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Singapore.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シンガポール

  - id: fall-of-saigon
    year: 1975
    title: サイゴン陥落
    category: war
    tags: [ベトナム, 冷戦]
    summary: 米国が初めて明確に敗れた戦争。難民の大量流出も始まった。
    detail: |
      1975年4月30日、北ベトナム軍の戦車が南ベトナムの大統領官邸の門を破り、サイゴンが陥落した。
      二十年続いた戦争は、この日をもって終わった。
      二年前のパリ協定でアメリカ軍が撤退したあと、南の政権は自力で持ちこたえられなかった。

      北側の攻勢は、その年の三月に中部高原から始まった。
      一つの拠点が崩れると防衛線は次々に瓦解し、当初は数年かかると見られていた進撃が、わずか二か月足らずで首都に到達した。
      避難する住民と敗走する兵が道路を埋め、混乱が混乱を呼んだ。

      最後の日、アメリカ大使館の屋上からヘリコプターによる脱出が行われた。
      数千人が運び出されたが、残された協力者も多く、その光景は敗北の象徴として世界に流された。
      翌1976年、南北は統一されてベトナム社会主義共和国となり、この都市はホーチミン市と改称される。

      戦後、旧南政権の関係者は再教育収容所へ送られ、経済も統制下で停滞した。
      百万人を超える人々が小船で国外へ逃れ、ボートピープルと呼ばれる難民問題が生じた。
      アメリカにとっては、明確な敗北として長く記憶される出来事になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/HCMCampaign.svg/500px-HCMCampaign.svg.png
      credit: User:Ctmt / Public domain
      page: https://commons.wikimedia.org/wiki/File:HCMCampaign.svg
    links:
