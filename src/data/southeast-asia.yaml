  - id: philippine-revolution
    year: 1896
    title: フィリピン革命
    category: society
    tags: [フィリピン, 独立]
    summary: アジア初の近代的な独立革命。米西戦争で今度は米国の統治下に入った。
    detail: |
      フィリピン革命は、1896年にスペインの支配に対して起こされた武装蜂起である。
      アジアで最初の、近代的な民族主義に基づく独立革命とされる。
      中心になったのは、アンドレス・ボニファシオが組織した秘密結社カティプーナンだった。

      背景には、スペイン語教育を受けた現地生まれの知識層の不満がある。
      彼らは改革を穏健に求めていたが、その象徴だったホセ・リサールが1896年末に処刑されたことで、運動は武力闘争へ傾いた。
      蜂起は各地に広がり、やがてエミリオ・アギナルドが指導権を握る。

      1898年に米西戦争が起きると、アギナルドはアメリカの支援を得て帰国し、同年6月に独立を宣言した。
      しかしパリ講和条約で、スペインはフィリピンをアメリカへ譲渡してしまう。
      独立は承認されず、翌1899年から米比戦争が始まった。

      三年以上続いた戦いで、フィリピン側には多数の死者が出た。
      結局この島々はアメリカの統治下に入り、独立が実現するのは1946年である。
      それでも、植民地支配に対して民族の名で立ち上がった最初の例として、アジアの各地に影響を与えた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フィリピン革命

  - id: indochina-communist-party
    year: 1930
    title: インドシナ共産党の結成
    category: politics
    tags: [ベトナム, 独立運動]
    summary: ホー・チ・ミンが独立と社会主義を結びつけ、以後の運動の軸になった。
    detail: |
      インドシナ共産党は、1930年にホー・チ・ミンの仲介によって結成された政党である。
      それまでベトナムには複数の共産主義組織が分立しており、それを香港での会議で一つにまとめたものだった。
      当初はベトナム共産党と名乗ったが、同年のうちにインドシナ全体を対象とする名に改めている。

      この党の特徴は、民族の独立と社会革命を一つの目標として結びつけた点にある。
      植民地支配からの解放を前面に掲げたことで、共産主義に馴染みのない農民や知識層からも支持を集めた。
      結成直後の1930年から31年にかけて、中部で農民が地方政権を打ち立てる蜂起が起きている。

      フランス当局の弾圧は厳しく、指導者の多くが投獄されるか処刑された。
      それでも地下で組織は保たれ、第二次世界大戦中の1941年にはベトミン（ベトナム独立同盟）を組織する。
      日本の敗戦直後に権力の空白を突いて蜂起し、独立宣言へつなげた。

      この党は、第一次インドシナ戦争、そしてベトナム戦争を通じて運動の中心であり続けた。
      1951年にベトナム労働党、1976年にベトナム共産党と名を変え、現在まで一党支配を続けている。
      カンボジアとラオスの共産主義運動も、もとをたどればここから分かれたものである。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/インドシナ共産党

  - id: indonesia-independence
    year: 1945
    title: インドネシアとベトナムの独立宣言
    category: politics
    tags: [東南アジア, 独立]
    summary: 日本の降伏直後に相次いで宣言され、旧宗主国との独立戦争に入った。
    detail: |
      1945年8月、日本の降伏の直後に、インドネシアとベトナムが相次いで独立を宣言した。
      どちらも旧宗主国が戻る前の権力の空白を突いた行動で、数日から数週間の差で歴史が動いた。
      植民地支配の終わりを、当事者が自ら宣言した点に意味がある。

      インドネシアでは、8月17日にスカルノとハッタが短い宣言文を読み上げた。
      若い活動家たちが二人を連れ出して決断を迫ったという経緯があり、世代の焦りが背中を押した形である。
      オランダはこれを認めず、軍を送って独立戦争になった。

      ベトナムでは、ベトミンが八月革命で各地の行政を掌握し、9月2日にホー・チ・ミンがハノイで宣言を行った。
      阮朝のバオダイ帝が退位し、千年続いた王制が終わっている。
      こちらもフランスが戻り、第一次インドシナ戦争へ突入した。

      インドネシアは国際世論とアメリカの圧力を背景に、1949年に主権を獲得した。
      ベトナムは1954年に北半分の独立を得たが、統一までさらに二十年を要する。
      宣言から実際の独立までに長い戦争が挟まったことが、この地域の戦後を規定した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/Flag_of_Indonesia.svg/500px-Flag_of_Indonesia.svg.png
      credit: Jayakatwang / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Indonesia.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/インドネシア

  - id: dien-bien-phu
    year: 1954
    title: ディエンビエンフーの戦い
    category: war
    tags: [ベトナム, フランス]
    summary: アジアの軍がヨーロッパの正規軍を正面から破り、植民地支配の終わりを告げた。
    detail: |
      ディエンビエンフーの戦いは、1954年にベトナム北西部の盆地で行われた、第一次インドシナ戦争の決戦である。
      フランス軍はここに要塞化した陣地を築き、ベトミンの主力を誘い出して叩くことを狙った。
      周囲を山に囲まれた谷という地形も、補給を空輸に頼ることも、当初は問題視されていなかった。

      ベトミンの司令官ヴォー・グエン・ザップは、正面からの突撃をやめ、時間をかけた包囲に切り替えた。
      重砲を分解して人力で山中を運び上げ、稜線に掘った陣地から谷底の飛行場を狙えるようにした。
      数万の民衆が自転車で食料と弾薬を運び、補給線を支えた。

      1954年3月に攻撃が始まると、飛行場はすぐに使用不能になり、フランス軍は空中投下だけに頼る状況に陥った。
      塹壕を掘り進めて陣地を一つずつ削る戦いが五十六日続き、5月7日に司令部が陥落した。
      一万人を超えるフランス側の兵が捕虜になっている。

      この敗北の翌日、ジュネーヴで和平交渉が始まった。
      協定によってフランスはインドシナから撤退し、ベトナムは北緯17度線で暫定的に分割される。
      アジアの軍がヨーロッパの正規軍を正面から破ったという事実は、世界中の植民地に影響を与えた。
