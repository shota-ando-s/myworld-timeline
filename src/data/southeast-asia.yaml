  - id: manila-galleon
    year: 1565
    title: マニラ・ガレオン貿易の開始
    category: economy
    tags: [フィリピン, 銀]
    summary: アメリカ大陸の銀とアジアの絹が太平洋で直接結ばれ、世界経済が一巡した。
    detail: |
      マニラ・ガレオン貿易は、1565年に始まり、二百五十年にわたって太平洋を往復した定期航路である。
      メキシコのアカプルコとフィリピンのマニラを、年に一、二回の大型帆船が結んだ。
      スペインの王室が独占し、船の数も積荷の量も厳しく制限されていた。

      運ばれたものは単純である。
      東へ向かう船には、中国の絹と陶磁器、インドの綿布や香辛料が積まれた。
      西から戻る船には、メキシコやペルーの鉱山で掘られた銀が積まれた。
      マニラは自ら産物を出すというより、中国商人が持ち込む品と新大陸の銀を交換する場だった。

      この航路の開設によって、世界の三つの大陸が一本の線でつながった。
      新大陸の銀は太平洋を渡って中国へ流れ込み、明や清の経済を支える通貨になった。
      ヨーロッパ経由で東へ流れた銀と合わせると、その量は世界の産出の相当部分に達する。

      航海は過酷で、往路は四か月、復路は半年近くかかり、多くの船と船員が失われた。
      メキシコ独立戦争の混乱の中、1815年に最後の船が出て航路は閉じられる。
      世界経済が地球を一周する形で結ばれた最初の仕組みとして、経済史で重く扱われている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マニラ・ガレオン
    related: [potosi]

  - id: voc-founded
    year: 1602
    title: オランダ東インド会社の設立
    category: economy
    tags: [オランダ, 会社]
    summary: 株式と軍事力を備えた巨大商社が、群島世界の支配へ乗り出した。
    detail: |
      オランダ東インド会社は、1602年にアジア交易のために設立された組織である。
      それまで別々に船を出していた複数の会社が統合され、議会から独占権を与えられた。
      世界で最初に株式を広く一般から募り、持ち分を売買できるようにした会社としても知られる。

      特徴は、単なる商社ではなかったことである。
      会社は条約を結ぶ権利、要塞を築く権利、軍隊を持ち戦争を行う権利を国家から委ねられていた。
      遠く離れたアジアでの判断を現地に任せるための仕組みだったが、結果として国家に近い存在になった。

      1619年にジャワ島のバタヴィアを拠点と定め、香辛料の産地を直接押さえにかかった。
      マルク諸島では丁子と肉豆蔲の栽培地を限定し、それ以外の木を焼き払い、抵抗する住民を排除した。
      価格を維持するために生産そのものを支配するという方法は、後の植民地経営の原型になる。

      18世紀に入ると、戦費と汚職、そして交易品の変化によって経営が傾いた。
      1799年に解散し、その権益と負債はオランダ政府が引き継ぐ。
      こうして会社の支配地は、そのままオランダ領東インドという植民地に変わった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5e/VOC.svg/500px-VOC.svg.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:VOC.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/オランダ東インド会社

  - id: ayutthaya-falls
    year: 1767
    title: アユタヤの陥落
    category: war
    tags: [タイ, ビルマ]
    summary: ビルマ軍に都を焼かれたが、15年後にはバンコクで王朝が再建された。
    detail: |
      1767年4月、四百年続いたアユタヤの都が、ビルマのコンバウン朝の軍によって陥落した。
      包囲は一年以上に及び、城内は飢えと疫病に苦しんだ末に破られた。
      それまでにも二度ビルマに攻め落とされたことはあったが、この時の破壊は徹底していた。

      ビルマ軍は宮殿と寺院に火を放ち、仏像の金を剥ぎ取り、王族と数万の住民を連れ去った。
      王朝の記録と文書の多くが失われ、そのためアユタヤ時代の歴史には不明な部分が残る。
      王は逃亡の途中で没したとされる。

      しかし、ビルマは占領を続けられなかった。
      清の軍が北から侵攻してきたため、主力を引き揚げざるを得なくなったのである。
      この空白に乗じて、脱出していた将軍タークシンが兵を集め、同じ年のうちに都を奪回した。

      新しい都はアユタヤではなく、下流のトンブリー、そして対岸のバンコクへ移された。
      破壊された都は放棄されたまま残り、現在は遺跡公園として世界遺産に登録されている。
      タイの歴史では、国が一度失われ、すぐに立ち直った出来事として語られる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Flag_of_Thailand_%28Ayutthaya_period%29.svg/500px-Flag_of_Thailand_%28Ayutthaya_period%29.svg.png
      credit: Xiengyod / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Thailand_(Ayutthaya_period).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アユタヤ王朝

  - id: anglo-burmese-war
    year: 1824
    title: 第一次英緬戦争
    category: war
    tags: [ミャンマー, イギリス]
    summary: 三度の戦争でビルマは滅び、インド帝国の一部に組み込まれた。
    detail: |
      第一次英緬戦争は、1824年から1826年にかけて、イギリスとビルマのコンバウン朝が戦った戦争である。
      ビルマが西へ勢力を広げてアラカンとアッサムを押さえ、英領インドの国境と接したことが発端になった。
      国境地帯での住民の逃亡と追撃をめぐる衝突が、全面戦争へ発展した。

      イギリスは陸路ではなく海から攻め、まず南部のラングーンを占領した。
      一方、熱帯の気候と疫病による損害は甚大で、戦死者の大半は戦闘ではなく病によるものだった。
      二年に及ぶ戦いはイギリス側にとっても非常に高くつき、当時の植民地戦争としては最大級の戦費を要した。

      1826年のヤンダボー条約で、ビルマはアラカンとテナセリムを割譲し、多額の賠償金を課された。
      財政は大きく傾き、王朝の威信も損なわれた。

      その後も衝突は続き、1852年の第二次戦争で下ビルマ全域を失う。
      1885年の第三次戦争でマンダレーが落ち、王は追放されて王朝は滅びた。
      ビルマ全土が英領インドの一部に組み込まれ、独立の回復は1948年までかかることになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Battle_of_rangoon.jpg/500px-Battle_of_rangoon.jpg
      credit: J. Moore / Public domain
      page: https://commons.wikimedia.org/wiki/File:Battle_of_rangoon.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第一次英緬戦争

  - id: cultivation-system
    year: 1830
    title: ジャワの強制栽培制度
    category: economy
    tags: [インドネシア, 植民地]
    summary: 農民に輸出作物を作らせて本国財政を潤し、現地には飢饉をもたらした。
    detail: |
      強制栽培制度は、1830年からオランダがジャワ島で実施した農業政策である。
      オランダ語では「耕作制度」と呼ばれ、村ごとに割り当てた耕地で輸出用の作物を作らせ、政府が定めた価格で買い上げた。
      本国が財政難に陥っていたこと、ジャワ戦争で膨大な戦費を使ったことが導入の背景にある。

      対象となったのはコーヒー、砂糖、藍などで、農民は耕地の五分の一を当てることとされた。
      しかし実際には、より広い土地と多くの労力が取られ、労役も課された。
      買い上げ価格は市場価格をはるかに下回り、差額はそのままオランダの国庫に入った。

      この収入は本国の歳入の三割に達した時期もあり、鉄道建設や国債の償還に充てられた。
      オランダの近代化がジャワの農民の労働によって支えられたと言われるのは、このためである。
      一方ジャワでは米の作付けが圧迫され、1840年代には各地で飢饉が起きて多数の死者が出た。

      実態が本国に伝わると批判が高まり、小説『マックス・ハーフェラール』が世論を動かした。
      制度は1870年から段階的に縮小され、20世紀初めまでに姿を消す。
      インドネシアでは、植民地支配の収奪を象徴する出来事として記憶されている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/強制栽培制度

  - id: saigon-captured
    year: 1859
    title: フランスのサイゴン占領
    category: war
    tags: [ベトナム, フランス]
    summary: インドシナ植民地化の第一歩になった。
    detail: |
      1859年2月、フランスとスペインの連合艦隊がサイゴンを占領した。
      フランスにとっては、阮朝によるカトリック宣教師の処刑を口実とする軍事行動であり、同時に中国市場へ至る拠点を得るための一歩でもあった。
      前年にはダナンを攻撃していたが、疫病に苦しんで撤退し、標的を南へ変えていた。

      占領後も戦いは続いた。
      フランス軍は本国が清との戦争に兵を割いたため一時手薄になり、ベトナム側の包囲を受けている。
      1861年に増援が到着すると攻勢に転じ、周辺の省を次々に制圧した。

      1862年のサイゴン条約で、阮朝は南部の三省と島嶼をフランスに割譲し、賠償金とキリスト教布教の自由を認めた。
      1867年には残る三省も奪われ、南部全体がコーチシナという直轄植民地になる。
      メコン・デルタの米は、以後フランスの手で大量に輸出されるようになった。

      ここを足がかりに、フランスは中部と北部、さらにカンボジアとラオスへ支配を広げていく。
      1887年にはフランス領インドシナが成立した。
      サイゴンはその中心都市として整備され、現在のホーチミン市の骨格はこの時期に作られている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/DJI_0550-HDR-Pano.jpg/500px-DJI_0550-HDR-Pano.jpg
      credit: Lê Minh Phát / CC BY 2.0
      page: https://commons.wikimedia.org/wiki/File:DJI_0550-HDR-Pano.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ホーチミン市

  - id: vietnam-protectorate
    year: 1883
    title: ベトナムの保護国化
    category: politics
    tags: [ベトナム, フランス]
    summary: 阮朝は名目だけ残り、清との宗属関係も清仏戦争で断たれた。
    detail: |
      1883年から翌年にかけて結ばれた条約によって、ベトナムの中部と北部はフランスの保護国となった。
      南部のコーチシナはすでに直轄植民地になっており、これで国全体がフランスの支配下に入ったことになる。
      阮朝の皇帝は位を保ったが、実際の統治権は失われた。

      きっかけは、紅河の航行権をめぐる衝突である。
      フランスはハノイを占領し、1883年に皇帝が没して宮廷が混乱している隙に軍を送り、条約の調印を迫った。
      翌年のパトノートル条約で、外交権はすべてフランスが握ることになる。

      この時、清はベトナムを長年の朝貢国とみなして介入し、清仏戦争が起きた。
      1885年の天津条約で清は宗主権を放棄し、東アジアの伝統的な宗属関係のひとつがここで断たれた。

      宮廷内では抗戦派が皇帝を擁して蜂起し、各地で「勤王運動」と呼ばれる抵抗が続いた。
      しかし組織的な力には及ばず、十年ほどで鎮圧される。
      1887年にはカンボジアと合わせてフランス領インドシナが編成され、七十年に及ぶ植民地時代が本格的に始まった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Flag_of_France.svg/500px-Flag_of_France.svg.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_France.svg
    links:
