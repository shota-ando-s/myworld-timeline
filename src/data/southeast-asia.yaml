        url: https://ja.wikipedia.org/wiki/インドの歴史

  - id: jayavarman-2
    year: 802
    title: ジャヤヴァルマン2世の即位
    category: politics
    tags: [カンボジア]
    summary: 神なる王として即位し、アンコール朝の600年が始まった。
    detail: |
      802年、ジャヤーヴァルマン2世がクーレン山で即位の儀式を行った。
      この年が、アンコール王朝の始まりとして数えられている。
      儀式の内容は後代の碑文が伝えるもので、同時代の記録ではないという点は注意がいる。

      宣言の中身は二つあった。
      ひとつは、ジャワの勢力への従属を断ち切って独立するということ。
      もうひとつは、自らを「転輪聖王」と称し、諸王の上に立つ唯一の支配者だと定めることである。

      この時に始まったとされるのが、デーヴァラージャの祭祀である。
      王の霊力をシヴァ神と結びつけ、その象徴となるリンガを山上の祠に祀った。
      以後の王たちは、即位のたびに自分の寺院と神像を造り、その正統性を石に刻んだ。

      分立していた小さな政体が一つの王権のもとにまとまったことで、大規模な水利事業と建築が可能になった。
      アンコール・ワットもバイヨンも、この時に作られた枠組みの上に立っている。
      カンボジアの歴史では、この年が国の起点として語られることが多い。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Flag_of_Cambodia_%28pre-1863%29.svg/500px-Flag_of_Cambodia_%28pre-1863%29.svg.png
      credit: Blackcat / CC0
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Cambodia_(pre-1863).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クメール王朝

  - id: borobudur
    year: 800
    circa: true
    title: ボロブドゥールの造営
    category: culture
    tags: [インドネシア, 仏教]
    summary: 立体の曼荼羅と呼ばれる巨大仏教遺跡。ジャワの富と技術を示す。
    detail: |
      ボロブドゥールは、ジャワ島中部の盆地に建てられた、世界最大級の仏教遺跡である。
      8世紀後半から9世紀初めにかけて、この地を支配したシャイレンドラ朝のもとで造営された。
      内部に部屋を持たず、石を積み上げた丘そのものが建築になっている点が、寺院というより巨大な塔に近い。

      構造は、方形の基壇を何層も重ね、その上に円形の壇を三段置き、頂上に大きな釈迦塔を載せる形をとる。
      回廊の壁には二千面を超えるレリーフが刻まれ、釈迦の生涯や仏典の物語が順に並ぶ。
      下から回廊を一段ずつ巡りながら上っていくと、欲望の世界から悟りの世界へ進む道筋をたどることになる。

      使われた石は百万個を超えるとされ、接着材を使わずに組み合わせて積まれている。
      これだけのものを築けたのは、ジャワの稲作が生む余剰と、それを動員できる王の力があったからである。

      10世紀ごろに王権の中心が東ジャワへ移ると、この遺跡は打ち捨てられ、火山灰と密林に埋もれた。
      19世紀初めに再発見され、20世紀の大規模な修復を経て世界遺産となった。
      今はインドネシア最大の観光地のひとつであり、仏教徒にとっては巡礼の場でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Borobudur_Temple.jpg/500px-Borobudur_Temple.jpg
      credit: 22Kartika / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Borobudur_Temple.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ボロブドゥール遺跡

  - id: angkor-wat
    year: 1113
    circa: true
    title: アンコール・ワットの造営開始
    category: culture
    tags: [カンボジア, 建築]
    summary: ヒンドゥーの宇宙観を石で表した巨大寺院。のちに仏教寺院となった。
    detail: |
      アンコール・ワットは、12世紀前半にスーリヤヴァルマン2世が建てた、世界最大級の宗教建築である。
      東西1.5キロ、南北1.3キロの環濠に囲まれ、その内側に参道と回廊、五つの塔が並ぶ。
      造営には数十年を要し、王の存命中には完成しなかった。

      設計の全体がヒンドゥーの宇宙観を写している。
      中央にそびえる高さ65メートルの塔は神々の住む須弥山であり、周囲の壁は世界を囲む山脈、環濠は大海を表す。
      参道を進んで塔に近づく体験そのものが、宇宙の中心へ向かう巡礼になるよう組み立てられている。

      回廊の壁面には800メートルにわたってレリーフが刻まれている。
      インドの叙事詩の場面、乳海攪拌の神話、そして王自身の行軍の様子までが描かれ、当時の服装や武具を知る資料にもなっている。

      クメール王朝の信仰が仏教へ移ると、この寺院も仏像が置かれる場に変わった。
      都が放棄されたあとも僧が住み続けたため、他の遺跡のように密林に飲まれることはなかった。
      19世紀に西洋へ紹介されて広く知られるようになり、今はカンボジアの国旗に描かれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/41/Angkor_Wat.jpg/500px-Angkor_Wat.jpg
      credit: Bjørn Christian Tørrissen / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Angkor_Wat.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アンコール・ワット

  - id: bach-dang-1288
    year: 1288
    title: 白藤江の戦い
    category: war
    tags: [ベトナム, モンゴル]
    summary: 川底に杭を仕込む戦術で元の艦隊を破り、三度目の侵攻を退けた。
    detail: |
      1288年の白藤江の戦いは、ベトナムがモンゴル帝国の三度目の侵攻を退けた決戦である。
      元は前年から大軍を送り込んでいたが、陳朝は都を捨てて退き、敵を疲弊させる作戦をとっていた。
      補給に行き詰まった元軍は、艦隊で海へ撤退しようとした。

      将軍の陳興道は、その退路となる白藤江に仕掛けを用意した。
      先を鉄で覆った杭を大量に川底へ打ち込み、満潮時には水面下に隠れるようにしたのである。
      同じ川で938年に呉権が南漢の艦隊を破った戦術を、三百五十年後に再現したものだった。

      潮が満ちている間に小舟で挑発して元の艦隊を川の上流へ誘い込み、引き潮に転じたところで反撃に出た。
      水位が下がると杭が船底を貫き、身動きの取れなくなった元船は次々に焼かれ、あるいは沈んだ。
      指揮官のオマルは捕えられ、艦隊は壊滅した。

      この敗北で、元はベトナム征服を断念した。
      三度の侵攻をすべて退けた事実は、ベトナム人にとって独立を守り抜いた象徴になっている。
      陳興道は民族的な英雄として祀られ、その名は今も各地の通りや広場に残る。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/白藤江の戦い

  - id: islam-spreads-sea
    year: 1400
    circa: true
    title: イスラムの群島への広がり
    category: religion
    tags: [インドネシア, 交易]
    summary: 征服ではなく商人と神秘主義者を通じて広がり、今日の世界最大のムスリム人口につながった。
    detail: |
      東南アジアの島々にイスラムが広まったのは、13世紀末から16世紀にかけてのことである。
      最初に受け入れたのはスマトラ北端の港で、そこから沿岸の町を伝って群島全体へ及んだ。
      中東やインドの支配者による征服ではなく、海の道を通じた平和な伝播だった点が大きな特徴である。

      担い手は、インド西岸やアラビアから来た商人たちだった。
      彼らは港町に住みつき、現地の有力者の娘と結婚し、その一族を通じて信仰を伝えた。
      港の支配者にとっても、広大なムスリム商業圏に加わることは利益になり、改宗は商売の条件を有利にした。

      もうひとつの担い手が、スーフィズムと呼ばれる神秘主義の教団である。
      彼らは瞑想や修行を重んじ、土着の精霊信仰やヒンドゥー的な観念と折り合う形で教えを説いた。
      そのため改宗は断絶ではなく、既存の信仰の上に重ねる形で進んだ。

      マラッカがイスラムを受け入れたことが決定的で、この港を通じてジャワ、ボルネオ、フィリピン南部へ信仰が広がった。
      ジャワ島ではヒンドゥー系のマジャパヒトが倒れ、沿岸のイスラム諸国が取って代わる。
      今日インドネシアは世界最大のムスリム人口を抱える国であり、その起点がこの時期にある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/Malacca_Sultanate_en.svg/500px-Malacca_Sultanate_en.svg.png
      credit: Gunawan Kartapranata / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Malacca_Sultanate_en.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マラッカ王国

  - id: malacca-portugal
    year: 1511
    title: ポルトガルのマラッカ占領
    category: war
    tags: [大航海時代, 交易]
    summary: 香辛料交易の要衝が奪われ、ヨーロッパのアジア進出が本格化した。
    detail: |
      1511年、ポルトガルのアフォンソ・デ・アルブケルケが艦隊を率いてマラッカを攻め落とした。
      インドのゴアを拠点にしたポルトガルが、香辛料の産地へ至る航路の要をそのまま押さえにきたのである。
      兵力は千数百人にすぎなかったが、大砲を積んだ船と規律ある部隊が、数の上で勝るマラッカ軍を破った。

      攻略には一か月ほどかかった。
      王家と対立していた現地の商人たちが協力したことも、ポルトガル側に有利に働いた。
      スルタンは逃れて南へ移り、のちにジョホール王国として再興するが、港そのものは戻らなかった。

      ポルトガルは港に要塞を築き、香辛料交易を独占しようとした。
      しかし、ムスリム商人たちはマラッカを避けてスマトラのアチェやジャワのバンテンなど別の港へ移り、交易路は分散していった。
      結果として、ポルトガルは要衝を得たものの、交易全体を支配することはできなかった。

      それでも、この事件の意味は大きい。
      ヨーロッパの国が東南アジアの中核的な港を武力で奪い、そこに居座った最初の例だからである。
      こののちオランダ、イギリスが続き、群島世界は四百年にわたる植民地支配の時代へ入っていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/Malaysia_-_Location_Map_%282013%29_-_MYS_-_UNOCHA.svg/500px-Malaysia_-_Location_Map_%282013%29_-_MYS_-_UNOCHA.svg.png
      credit: UN Office for the Coordination of Humanitarian Affairs (OCHA) / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:Malaysia_-_Location_Map_(2013)_-_MYS_-_UNOCHA.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マラッカ

  - id: magellan-philippines
    year: 1521
    title: マゼラン艦隊のフィリピン到達
    category: economy
    tags: [フィリピン, 航海]
    summary: 世界一周の途上で到達。以後スペインが太平洋を越えて支配に乗り出す。
    detail: |
      1521年3月、マゼランの艦隊が太平洋を横断してフィリピンの島々に到達した。
      スペインを出て一年半、南米南端の海峡を抜けて三か月以上を海上で過ごした末のことだった。
      ヨーロッパ人が西回りでアジアに達したのは、これが最初である。

      セブ島では王が洗礼を受け、多くの住民がこれに続いた。
      マゼランは同盟の証として、近くのマクタン島で従わない首長ラプ＝ラプを討とうとする。
      しかし1521年4月、浅瀬で待ち構えた現地の戦士たちに囲まれて戦死した。

      残った船は航海を続け、モルッカ諸島で香辛料を積み、インド洋と喜望峰を回ってスペインへ帰った。
      出発時に五隻二百数十人だった艦隊のうち、戻ったのは一隻と十八人である。
      地球が球であり、西へ進み続ければ元の場所に戻ることが、実地で証明された。

      マゼランの死そのものより、その後の影響が大きい。
      スペインはこの到達を根拠にフィリピンの領有を主張し、1565年から本格的な支配に乗り出す。
      太平洋を越える航路が開かれたことで、アメリカ大陸の銀とアジアの物産が直接結ばれる時代が始まった。
