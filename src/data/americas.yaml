lane: americas

periods:
  - id: olmec
    title: オルメカ文明
    start: -1200
    startCirca: true
    end: -400
    endCirca: true
    category: culture
    tags: [メソアメリカ]
    summary: 巨石人頭像で知られる、メソアメリカ最初の高度な文化。
    detail: |
      メキシコ湾岸に栄えた文化で、紀元前1200年ごろから400年ごろまで続いた。
      アメリカ大陸で最も早く現れた高度な文明であり、後のメソアメリカ文明の母体とされる。
      巨石人頭像で知られる。

      中心地はサン・ロレンソとラ・ベンタで、いずれも湿潤な低地にある。
      神殿の基壇と広場を備えた儀礼の中心地が築かれた。
      最も有名な遺物が巨石人頭像である。
      高さ3メートルに達するものもあり、重さは20トンを超える。
      玄武岩は数十キロ離れた山から運ばれており、車輪も大型の家畜も使わずに運搬された。
      顔立ちはそれぞれ異なり、実在の支配者を表したとみられる。

      ヒスイの加工にも優れ、人と動物を組み合わせた像が多数作られた。
      ジャガーの特徴を持つ人物の表現は、後のメソアメリカの神々の図像につながる。
      この文化が生み出した要素は広く受け継がれた。
      球を使う儀礼的な競技、暦の体系、数の記法、神殿を中心とする都市の配置がそれにあたる。
      文字の最初期の例も、この地域から見つかっている。

      紀元前400年ごろ、中心地は放棄された。
      理由は分かっていないが、河川の流路の変化や内部の対立が挙げられる。
      その要素はマヤやテオティワカンへ引き継がれ、母なる文化と呼ばれてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/CabezaColosal1_MuseoXalapa_v1.1.jpg/500px-CabezaColosal1_MuseoXalapa_v1.1.jpg
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:CabezaColosal1_MuseoXalapa_v1.1.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/オルメカ

  - id: chavin
    title: チャビン文化
    start: -900
    startCirca: true
    end: -200
    endCirca: true
    category: religion
    tags: [アンデス]
    summary: アンデス各地を結んだ最初の宗教的中心。神殿に人々が巡礼した。
    detail: |
      アンデス地方に広がった宗教的な文化で、紀元前900年ごろから200年ごろまで続いた。
      中心はペルー中部の山間にあるチャビン・デ・ワンタルの神殿である。
      アンデス各地を初めて一つに結んだ宗教の中心だった。

      神殿は石を組んだ複雑な構造を持つ。
      内部には迷路のような通路と部屋があり、中心に高さ4メートルを超える石柱が立つ。
      人と猫科の動物、蛇、猛禽を組み合わせた像が彫られている。
      通路には水を流す水路が巡らされていた。
      轟音が響く空間で、香や幻覚をもたらす植物を用いた儀礼が行われたとみられる。
      参拝者に強い体験を与える仕掛けである。

      各地から人が訪れた形跡がある。
      海岸部の貝、アマゾンの動物、遠方の土器がここに集まっていた。
      逆に、チャビンの図像は広い範囲の土器や織物に現れる。

      軍事的な征服ではなく、宗教の権威によって影響を広げたと考えられている。
      技術の面でも進んだ。
      金の加工、合金、織物の技法が発達し、後のアンデス文明に受け継がれる。
      紀元前200年ごろに影響力を失った。
      それでも、広い範囲が共通の信仰と様式を共有した最初の例として、アンデス史の出発点に置かれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cf/Chavin_de_Huantar_El_Castillo_06122009.jpg/500px-Chavin_de_Huantar_El_Castillo_06122009.jpg
      credit: Dtarazona / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Chavin_de_Huantar_El_Castillo_06122009.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チャビン・デ・ワンタル

  - id: nazca
    title: ナスカ文化
    start: -100
    startCirca: true
    end: 800
    endCirca: true
    category: culture
    tags: [アンデス, 地上絵]
    summary: 乾燥した大地に巨大な地上絵を残した。用途は今も議論が続く。
    detail: |
      ペルー南部の海岸地帯に栄えた文化で、紀元前100年ごろから800年ごろまで続いた。
      乾燥した大地に描かれた巨大な地上絵で知られる。
      その用途は今も議論が続いている。

      地上絵は、表面の酸化した小石を取り除き、下の明るい地面を露出させることで描かれた。
      雨がほとんど降らず、風も弱い環境のため、2000年にわたって残っている。
      描かれているのは、ハチドリ、クモ、サル、シャチといった動植物と、直線や幾何学的な図形である。
      大きいものは数百メートルに及ぶ。
      全体は上空からでなければ把握できない。

      用途については複数の説がある。
      天体の運行と関係づける説、水源を示す説、歩いて巡る儀礼の道とする説、雨乞いの祈りとする説などが唱えられてきた。
      水が極めて乏しい土地であり、水に関わる信仰と結びつけて考えるのが有力である。

      地上絵以外にも、この文化は高度な技術を残した。
      多彩色の土器は、焼成前に複数の色を用いる精緻なものである。
      地下水路を掘って水を引く施設も作られ、一部は現在も使われている。
      8世紀ごろ、長期の干ばつと森林の伐採による環境の悪化で衰えたとみられる。
      巨大な図像が何のために作られたかは、決着していない。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ナスカ文化

  - id: teotihuacan
    title: テオティワカン
    start: 100
    startCirca: true
    end: 550
    endCirca: true
    category: society
    tags: [メソアメリカ, 都市]
    summary: 人口10万を超えたとされる計画都市。誰が築いたかは今も謎が多い。
    detail: |
      メキシコ中央高原に築かれた古代都市で、1世紀ごろから6世紀半ばまで栄えた。
      最盛期の人口は10万を超えたとされ、当時の世界でも有数の規模である。
      誰が築いたかは今も分かっていない。

      都市は計画的に配置された。
      死者の大通りと呼ばれる幅広い道が南北に貫き、太陽のピラミッドと月のピラミッドが立つ。
      格子状の区画に居住区が並び、集合住宅のような建物に職人や商人が住んだ。
      太陽のピラミッドは底辺が200メートルを超える。
      地下には自然の洞窟があり、そこが宗教的な意味を持っていたとみられる。

      黒曜石の産地を押さえ、加工した道具を広い範囲へ供給した。
      その製品と土器は、数百キロ離れたマヤの都市でも見つかる。
      マヤの碑文には、この都市から来た人物が王朝を樹立したという記述もある。
      支配者の個人を描いた記念碑や王墓が見つかっていない点が特異である。
      王ではなく、集団や複数の家系による統治だった可能性が指摘されている。
      使われた言語も特定されていない。

      6世紀半ば、中心部が焼かれて放棄された。
      内部の反乱か、外部からの攻撃か、干ばつによる崩壊かは定まっていない。
      数百年後、アステカの人々がこの廃墟を神々が生まれた場所と呼んだ。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/View_from_Pyramide_de_la_luna.jpg/500px-View_from_Pyramide_de_la_luna.jpg
      credit: Jackhynes / Public domain
      page: https://commons.wikimedia.org/wiki/File:View_from_Pyramide_de_la_luna.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/テオティワカン

  - id: moche
    title: モチェ文化
    start: 100
    startCirca: true
    end: 700
    endCirca: true
    category: culture
    tags: [アンデス, 土器]
    summary: 精巧な人物土器と金細工を残した北ペルーの社会。
    detail: |
      ペルー北部の海岸地帯に栄えた文化で、1世紀ごろから8世紀ごろまで続いた。
      精巧な人物土器と金細工を残している。
      インカに先立つアンデスの高度な社会の一つである。

      統一国家ではなく、複数の谷にまたがる政治体の集まりだったとみられる。
      各地に日干し煉瓦の巨大な神殿が築かれた。
      太陽の神殿と月の神殿と呼ばれる建造物は、数千万個の煉瓦を積み上げたものである。
      乾燥した土地を灌漑によって耕地に変えた。
      運河が谷を結び、トウモロコシと豆と綿が栽培される。
      海からは魚と海鳥の糞を得た。

      土器には、人物の顔や、病気、動物、儀礼の場面が写実的に表されている。
      個人の特徴まで再現された肖像土器は、古代アメリカで他に例がない。
      金と銅の合金の加工も高度だった。
      表面だけを金に見せる処理など、後のヨーロッパにも知られていなかった技法が用いられている。

      1987年、シパンで盗掘を免れた王墓が発見された。
      黄金の装身具と、殉葬された人々が見つかり、土器に描かれた儀礼の場面が実際に行われていたことが確認される。
      6世紀ごろの気候の変動が、この文化に打撃を与えたとみられる。
      洪水と干ばつが交互に襲い、灌漑の体系が破壊された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Moche_jt01.jpg/500px-Moche_jt01.jpg
      credit: Joel Takv / CC BY-SA 2.5
      page: https://commons.wikimedia.org/wiki/File:Moche_jt01.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モチェ文化

  - id: maya-classic
    title: マヤ文明古典期
    start: 250
    end: 900
    category: culture
    tags: [メソアメリカ, 文字]
    summary: 独自の文字と精密な暦を持つ都市国家群が熱帯雨林に栄えた。
    detail: |
      中央アメリカの熱帯雨林に都市国家が栄えた時期で、250年から900年まで続いた。
      独自の文字と精密な暦を持っていた。
      統一帝国ではなく、競い合う都市国家の集まりだった点がギリシアに似ている。

      ティカル、カラクムル、パレンケ、コパンといった都市が、それぞれ王を戴いていた。
      石碑に王の事績と日付を刻み、戦争と同盟を繰り返す。
      文字は表音と表意を組み合わせた体系で、アメリカ大陸で唯一、言語を完全に書き表せるものだった。
      20世紀後半に解読が進み、王の名前と即位、戦争の記録が読めるようになっている。

      暦も精緻である。
      260日と365日の二つの周期を組み合わせ、さらに起点からの日数を数える長期暦を用いた。
      ゼロの概念を含む記数法を持ち、金星の運行や日食を高い精度で計算している。

      農業は焼畑と段々畑、湿地の改造によって行われた。
      貯水池を整え、乾季に備えている。
      9世紀、南部の都市が次々に放棄された。
      長期の干ばつ、人口の増加による環境の負荷、都市間の戦争の激化が重なったとみられる。
      北部のチチェン・イツァなどはその後も続き、スペイン人の到来時にも都市が残っていた。
      マヤの人々自体は消えておらず、現在も数百万が同系統の言語を話している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/Tikal.jpg/500px-Tikal.jpg
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Tikal.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マヤ文明

  - id: tiwanaku
    title: ティワナク
    start: 500
    startCirca: true
    end: 1000
    endCirca: true
    category: politics
    tags: [アンデス]
    summary: チチカカ湖畔の高地国家。精密な石組みの建築で知られる。
    detail: |
      チチカカ湖の南岸に築かれた高地の都市と国家で、5世紀ごろから11世紀ごろまで続いた。
      標高3800メートルを超える環境にある。
      精密な石組みの建築で知られる。

      寒冷で酸素の薄い高原で、独特の農法が用いられた。
      畝と水路を交互に作る耕地は、水が日中の熱を蓄えて夜の冷え込みから作物を守る。
      ジャガイモとキヌアが主要な作物で、湖の魚とリャマの肉が加わった。
      中心部には、石を積んだ基壇と半地下の広場、精密に加工した門が並ぶ。
      太陽の門と呼ばれる一枚岩の門には、杖を持つ神の像が彫られている。
      石材は数十キロ離れた採石場から運ばれ、金属の留め具で接合された箇所もある。

      影響は広い範囲に及んだ。
      ボリビア、ペルー南部、チリ北部で同じ様式の土器と織物が見つかる。
      軍事的な征服よりも、宗教と交易の結びつきによる影響だったとみられる。
      リャマの隊商が高地と海岸と谷を結んだ。

      11世紀ごろ、長期の干ばつによって農業の基盤が失われ、都市は放棄された。
      後のインカは、この遺跡を世界の創造が始まった場所として尊んだ。
      石組みの技術も、インカの建築に受け継がれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/Tiwanaku_-_Versunkener_Hof.jpg/500px-Tiwanaku_-_Versunkener_Hof.jpg
      credit: Dr. Eugen Lehle / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Tiwanaku_-_Versunkener_Hof.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティワナク

  - id: mississippian
    title: ミシシッピ文化
    start: 800
    startCirca: true
    end: 1600
    endCirca: true
    category: society
    tags: [北アメリカ, 都市]
    summary: 巨大な土のピラミッドを築いた北米の農耕社会。カホキアは1万人規模だった。
    detail: |
      北米の大河の流域に広がった農耕社会で、800年ごろから16世紀まで続いた。
      巨大な土の塚を築いたことから、マウンド文化とも呼ばれる。
      最大の都市カホキアは1万人以上を擁した。

      トウモロコシの栽培が基盤である。
      中米から伝わった作物が北の気候に適応し、余剰の生産が可能になったことで、定住と階層化が進んだ。
      集落の中心には、平らな頂を持つ土の塚が築かれた。
      上には神殿や首長の住居が置かれる。
      最大のものはカホキアの僧院塚で、底面はギザの大ピラミッドに匹敵する広さがある。

      カホキアは現在のセントルイス近郊にあり、最盛期の人口は1万から2万と推定される。
      当時の北米で最大の都市であり、同時代のロンドンに匹敵する規模だった。
      木の柱を円形に並べた天体観測の施設も作られている。
      交易網は広い。
      五大湖の銅、メキシコ湾の貝、ロッキー山脈の黒曜石がここに集まった。
      14世紀以降、カホキアは放棄された。
      資源の枯渇、洪水、気候の変動、政治的な対立が理由として挙げられる。

      16世紀にスペイン人が内陸を探検したとき、まだ各地に首長制の社会があった。
      その後、持ち込まれた疫病によって人口は激減する。
      北米の先住民が大規模な都市を築いていた事実は、長く軽視されてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9d/Mississippian_culture_mound_components_HRoe_2011.jpg/500px-Mississippian_culture_mound_components_HRoe_2011.jpg
      credit: Herb Roe / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Mississippian_culture_mound_components_HRoe_2011.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ミシシッピ文化

  - id: toltec
    title: トルテカ
    start: 900
    startCirca: true
    end: 1168
    category: politics
    tags: [メソアメリカ]
    summary: アステカが理想の先祖として仰いだ王国。軍事と工芸で知られた。
    detail: |
      メキシコ中央高原に栄えた国家で、10世紀から12世紀にかけて存在した。
      中心地はトゥーラである。
      アステカが理想の先祖として仰いだ王国だった。

      テオティワカンの崩壊後の空白を埋める形で台頭した。
      軍事的な性格が強く、都市には武装した戦士の像が並ぶ。
      羽毛の蛇の神をめぐる信仰が広まり、ユカタン半島のチチェン・イツァにも同じ様式の建築が見られる。
      両者の関係については、征服、移住、交易など複数の説がある。

      工芸と建築に優れていたと伝えられる。
      アステカの言葉では、職人や芸術家を意味する語がこの王国の名に由来する。
      伝承では、ケツァルコアトルという名の王が登場する。
      人身供犠を否定した賢明な支配者で、対立する神の策略によって都を追われ、東の海へ去ったとされる。
      いつか戻ると語られたこの物語が、後にスペイン人の到来と重ねて解釈された。

      12世紀にトゥーラは放棄された。
      干ばつと内紛、北方からの集団の流入が理由とされる。
      アステカの支配者は、この王家の血を引くことを正統性の根拠にした。
      実際の歴史と、後から作られた物語を区別することが難しい王国でもある。
      考古学の資料と伝承のあいだには、少なからぬ隔たりがある。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/トルテカ文明

  - id: aztec
    title: アステカ王国
    start: 1428
    end: 1521
    category: politics
    tags: [メソアメリカ]
    summary: 湖上の都テノチティトランを中心に、貢納で周辺を支配した。
    detail: |
      メキシコ中央高原に栄えた国家で、1428年から1521年まで続いた。
      湖上の都テノチティトランを中心に、三都市の同盟が周辺を支配した。
      貢納によって成り立つ支配の体系である。

      統治の方法は、領土を直接治めるものではなかった。
      征服した都市の支配者をそのまま残し、定期的な貢納を義務づける。
      綿布、トウモロコシ、カカオ、羽毛、黒曜石、そして儀礼に用いる捕虜が納められた。
      貢納の内訳を記した絵文書が残っている。
      宗教では、太陽を動かし続けるために人身供犠が必要だという観念が中心にあった。
      捕虜を得ること自体が戦争の目的になり、それを前提とした儀礼的な戦いも行われる。

      都市は高度に発達していた。
      人工の農地チナンパが食糧を支え、運河と堤防が整えられる。
      市場には毎日数万人が集まり、貨幣の代わりにカカオ豆が使われた。
      学校があり、庶民の子も一定の教育を受けている。

      絵文書による記録、精密な暦、詩と修辞の伝統も発達した。
      1519年にスペイン人が到来すると、貢納を課されていた周辺の集団が協力した。
      2年後に都は陥落する。
      天然痘の流行が、その過程で決定的な打撃を与えた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d2/Aztec_Empire.png/500px-Aztec_Empire.png
      credit: Aldan-2 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Aztec_Empire.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アステカ

  - id: inca
    title: インカ帝国
    start: 1438
    end: 1533
    category: politics
    tags: [アンデス]
    summary: 文字を持たずに、道路網とキープ（結縄）で巨大な山岳帝国を運営した。
    detail: |
      南米のアンデス山脈に築かれた帝国で、1438年から1533年まで続いた。
      現在のエクアドルからチリにかけて、南北4000キロに及ぶ領域を支配した。
      文字を持たないまま、巨大な国家を運営した点に特徴がある。

      中心はクスコで、支配者はインカと呼ばれた。
      太陽の子孫とされ、宗教的な権威を持つ。
      統治の要は道路である。
      総延長4万キロに及ぶ道が山岳地帯を貫き、吊り橋が谷を渡した。
      一定の間隔で宿駅が置かれ、走者が情報を中継する。
      首都から遠隔地へ数日で伝令が届いた。

      記録には、キープと呼ばれる結縄が用いられた。
      紐の色と結び目の位置で数量を表し、人口、貢納、倉庫の在庫を記録する。
      専門の官が読み取りを担当した。
      労働力の徴発によって国家が動いた。
      住民は一定期間、道路の建設、耕作、織物の生産などに従事する義務を負う。
      各地に倉庫が設けられ、凶作に備えた備蓄が行われた。

      段々畑と灌漑によって、急斜面でも農業が可能になる。
      ジャガイモとトウモロコシが主食だった。
      1532年、スペイン人の到来と内戦、疫病が重なって崩壊する。
      石を精密に組む建築の技術は、いまも遺跡に残っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c4/Tawantinsuyu_%28orthographic_projection%29.svg/500px-Tawantinsuyu_%28orthographic_projection%29.svg.png
      credit: L'Américain / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Tawantinsuyu_(orthographic_projection).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/インカ帝国

  - id: spanish-america
    title: スペイン領アメリカ
    start: 1521
    end: 1825
    category: politics
    tags: [植民地, スペイン]
    summary: 銀の大量産出が世界経済を動かし、先住民社会は大きく変わった。
    detail: |
      スペインがアメリカ大陸に築いた植民地で、16世紀初めから19世紀前半まで続いた。
      メキシコから南米南端まで、広大な地域を支配した。
      銀の大量産出が世界経済を動かす。

      統治は副王領として組織された。
      ヌエバ・エスパーニャとペルーの二つの副王領が置かれ、後に増やされる。
      本国から派遣された官僚が行政を担い、通商院が貿易を統制した。
      経済の中心は銀である。
      メキシコとポトシの鉱山から産出した銀が、艦隊によってヨーロッパへ運ばれた。
      その一部はマニラを経て中国へ流れ、世界規模の銀の循環が生まれる。

      労働力は先住民に依存した。
      委託という名目で労働を徴発する制度が設けられ、鉱山と農園で酷使される。
      疫病による人口の激減もあり、アフリカからの奴隷が加えられた。
      社会は出自によって細かく区分された。
      本国生まれ、植民地生まれの白人、混血、先住民、黒人という序列が作られる。
      要職は本国生まれが占め、この差別が独立運動の一因になった。

      カトリックの布教が並行して進み、教会が教育と福祉を担う。
      スペイン語とカトリックが広く定着した。
      19世紀初め、本国がナポレオンに占領されたことを機に独立戦争が始まる。
      20年ほどで大陸の大半が独立した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f5/Flag_of_Cross_of_Burgundy.svg/500px-Flag_of_Cross_of_Burgundy.svg.png
      credit: Ningyou. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Cross_of_Burgundy.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スペイン帝国

  - id: portuguese-brazil
    title: ポルトガル領ブラジル
    start: 1500
    end: 1822
    category: economy
    tags: [ブラジル, 植民地]
    summary: 砂糖と金の生産に大量の奴隷が投入され、アメリカ最大の奴隷社会になった。
    detail: |
      ポルトガルが南米東岸を支配した時期で、1500年から1822年まで続いた。
      砂糖と金の生産に大量の奴隷が投入され、アメリカ大陸で最大の奴隷社会になった。

      当初、ポルトガルはこの地に関心が薄かった。
      染料になる木を採取する程度で、本格的な植民は数十年後に始まる。
      転機は砂糖である。
      北東部の海岸で大規模な農園が開かれ、ヨーロッパ向けの砂糖を生産した。
      労働力として先住民が使われたが、疫病と逃亡で確保できず、アフリカからの奴隷輸入に切り替わる。

      18世紀には内陸で金とダイヤモンドが見つかった。
      南東部へ人口が移動し、リオデジャネイロが首都になる。
      ここでも労働力は奴隷だった。
      大西洋奴隷貿易で運ばれた人のうち、4割前後がブラジルへ送られたとされる。
      総数は400万人を超える。
      社会は人種の混合が進み、独自の文化が生まれた。
      音楽、宗教、料理にアフリカ由来の要素が色濃く残る。

      1808年、ナポレオンの侵攻を逃れてポルトガル王室がリオへ移った。
      植民地が帝国の首都になるという異例の事態である。
      王室の帰国後、残された王子が1822年に独立を宣言した。
      流血の少ない独立だったが、奴隷制は1888年まで続く。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ブラジルの歴史

  - id: thirteen-colonies
    title: イギリス領13植民地
    start: 1607
    end: 1776
    category: politics
    tags: [北アメリカ, イギリス]
    summary: 自治の経験を積んだ植民地が、課税をめぐる対立から独立へ向かった。
    detail: |
      イギリスが北米の大西洋岸に築いた13の植民地で、1607年から1776年まで存在した。
      性格の異なる植民地が並び、それぞれ議会を持っていた。
      自治の経験を積んだことが、独立への土台になる。

      北部のニューイングランドは、信仰の自由を求めた人々が作った。
      小規模な農業と漁業、造船、交易で成り立つ。
      中部は穀物の生産地で、多様な宗派と民族が共存した。
      南部は、タバコと米の大農園が中心で、奴隷労働に依存する。
      いずれの植民地にも、住民が選ぶ議会があった。
      総督は本国から派遣されるが、予算は議会が握る。
      この経験が、統治には代表の同意が必要だという意識を育てた。

      本国は、重商主義の枠組みで貿易を統制した。
      しかし距離があり、取り締まりは緩やかである。
      この放任の状態が長く続いた。
      七年戦争の後、状況が変わる。
      戦費の負担を求めて印紙税などが課されると、代表を持たないまま課税されることへの反発が強まった。

      各植民地は連絡を取り合い、大陸会議を開く。
      1775年に武力衝突が起き、翌年に独立が宣言された。
      互いに異なる13の社会が一つの国家を作る過程は、その後も連邦の性格をめぐる論争として続く。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/Red_ensign_of_Great_Britain_%281707%E2%80%931800%2C_square_canton%29.svg/500px-Red_ensign_of_Great_Britain_%281707%E2%80%931800%2C_square_canton%29.svg.png
      credit: AnonMoos, based on image by Zscout370, AnonMoos / Public domain
      page: https://commons.wikimedia.org/wiki/File:Red_ensign_of_Great_Britain_(1707%E2%80%931800,_square_canton).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/13植民地

  - id: united-states
    title: アメリカ合衆国
    start: 1776
    ongoing: true
    category: politics
    tags: [アメリカ]
    summary: 独立宣言から始まり、20世紀には世界最大の経済・軍事大国となった。
    detail: |
      1776年の独立宣言から現在まで続く連邦共和国。
      13の植民地から始まり、大陸を横断する領域に拡大した。
      20世紀には世界最大の経済と軍事力を持つ国家になる。

      建国の枠組みは、1787年の憲法によって定められた。
      立法、行政、司法を分け、互いに抑制させる。
      連邦と州が権限を分け合う構造も特徴である。
      19世紀は拡大の時代だった。
      ルイジアナの買収、メキシコとの戦争、先住民の強制移住によって領域が広がる。
      同時に、奴隷制をめぐる南北の対立が深まり、1861年から4年の内戦になった。

      工業化が進み、20世紀初頭には世界最大の工業国になる。
      二つの大戦を経て、その地位は決定的になった。
      戦後は冷戦の一方の中心として、世界の秩序を主導する。
      国内では、公民権運動が人種による差別の法的な撤廃を実現した。
      移民の受け入れによって人口は増え続け、社会の構成も変化している。

      冷戦の終結後は唯一の超大国とされたが、対テロ戦争と金融危機を経てその位置は揺らいだ。
      近年は国内の政治的な分断が深まっている。
      移民によって作られた共和国が、理念と現実の落差をどう扱ってきたかという歴史でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Flag_of_the_United_States_%28DDD-F-416E_specifications%29.svg/500px-Flag_of_the_United_States_%28DDD-F-416E_specifications%29.svg.png
      credit: Vector file created by Dbenbenn, Zscout370, Jacobolus, Indolences, and Technion. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_United_States_(DDD-F-416E_specifications).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アメリカ合衆国

  - id: latin-american-independence
    title: ラテンアメリカ独立戦争
    start: 1808
    end: 1826
    category: war
    tags: [ラテンアメリカ, 独立]
    summary: ナポレオンの本国侵攻を機に、20年ほどで大陸の大半が独立した。
    detail: |
      ラテンアメリカの諸国がスペインから独立した一連の戦争で、1808年から1826年まで続いた。
      20年ほどで大陸の大半が独立する。

      直接の契機は、ナポレオンによる本国の占領である。
      正統な国王が退位させられたことで、植民地は誰に従うべきかという問題に直面した。
      各地に自治の評議会が作られ、それが独立運動へ発展する。
      背景には長年の不満があった。
      植民地生まれの白人は、本国生まれに要職を独占され、貿易も統制されている。
      アメリカ独立とフランス革命の理念も伝わっていた。

      北部では、シモン・ボリバルが率いる軍がベネズエラからコロンビア、エクアドルへ進んだ。
      南部では、サン・マルティンがアンデスを越えてチリとペルーを解放する。
      両者が1822年に会談し、その後ボリバルが最後の戦いを引き受けた。
      1824年のアヤクーチョの戦いで、スペインの主力は敗れる。
      メキシコは1821年、ブラジルは1822年に独立した。

      独立後、統一の構想は実現しなかった。
      地域ごとの利害と地理の障壁によって、多数の国家に分かれる。
      社会の構造は変わらず、大土地所有と身分による格差が残った。
      軍人が政治を左右する傾向も、この時期に定着する。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イスパノアメリカ独立戦争

  - id: civil-rights-movement
    title: 公民権運動
    start: 1954
    end: 1968
    category: society
    tags: [アメリカ, 人権]
    summary: 法的な人種隔離を撤廃させ、世界の人権運動の手本になった。
    detail: |
      アメリカで人種による差別の撤廃を求めた運動で、1950年代から1960年代に展開した。
      法的な人種隔離を撤廃させ、世界の人権運動の手本になった。

      南部の州では、南北戦争の後に分離を定める法が作られていた。
      学校、バス、飲食店、水飲み場が人種によって分けられ、投票も識字試験や人頭税で事実上妨げられる。
      1954年、最高裁が公立学校の人種隔離を違憲とする判決を下した。
      翌年、モンゴメリーでローザ・パークスがバスの座席を譲ることを拒み、逮捕される。
      これを機に1年にわたるバスの乗車拒否運動が組織され、キング牧師が指導者として現れた。

      運動は非暴力を原則とした。
      座り込み、自由乗車運動、行進によって、暴力的な対応を引き出し、それを報道させる。
      テレビの映像が全国の世論を動かした。
      1963年のワシントン大行進には25万人が集まる。
      1964年に公民権法、1965年に投票権法が成立した。
      公共施設と雇用における差別が禁じられ、投票の障壁が取り除かれる。

      1968年、キング牧師が暗殺された。
      法的な平等は実現したが、経済的な格差と住宅の分離は残る。
      非暴力による社会の変革の手法は、各国の運動に影響を与えた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/3/35/AfricanAmericans1.png
      credit: 英語版ウィキペディアのDavid Kernowさん / Public domain
      page: https://commons.wikimedia.org/wiki/File:AfricanAmericans1.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アフリカ系アメリカ人公民権運動

events:
  - id: maya-collapse
    year: 900
    circa: true
    title: マヤ古典期の崩壊
    category: disaster
    tags: [メソアメリカ]
    summary: 南部の都市が次々に放棄された。干ばつと戦争と環境負荷が重なったとみられる。
    detail: |
      マヤ文明の南部低地で、都市が次々に放棄された現象で、9世紀を中心に起きた。
      王朝の碑文が途絶え、人口は大きく減少する。
      複数の要因が重なったと考えられている。

      8世紀の終わりから、石碑に日付を刻む慣行が各都市で止まっていく。
      最後の長期暦の日付は10世紀初めのものである。
      宮殿と神殿の建設も中断し、人々は都市を去った。
      要因の一つが干ばつである。
      湖の堆積物や鍾乳石の分析から、この時期に長期にわたる乾燥が繰り返されたことが分かっている。
      貯水池に頼る都市にとって、致命的な打撃になった。

      環境への負荷も指摘される。
      人口の増加に対応するため森林が伐採され、土壌の流出と地力の低下が進んだ。
      石灰を焼いて漆喰を作る作業にも大量の木が使われる。
      都市間の戦争も激化していた。
      碑文には、王の捕縛と都市の破壊の記録が増えている。
      崩壊は一様ではない。
      都市によって時期が異なり、北部のチチェン・イツァなどはその後も栄えた。

      マヤの人々が消滅したわけではない。
      村落での生活は続き、現在も数百万が同じ系統の言語を話している。
      環境の変化と社会の対応をめぐる事例として、現代の議論でもしばしば参照される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/Tikal.jpg/500px-Tikal.jpg
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Tikal.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マヤ文明

  - id: norse-vinland
    year: 1000
    circa: true
    title: ヴァイキングの北米到達
    category: economy
    tags: [北アメリカ, 北欧]
    summary: コロンブスより500年早く到達したが、定住は続かず記憶も途切れた。
    detail: |
      北欧のヴァイキングが北アメリカ大陸に到達した出来事で、1000年ごろのこと。
      コロンブスより500年早い。
      しかし定住は続かず、その記憶も途切れた。

      グリーンランドに入植していたノルド人が、さらに西の陸地を目撃した。
      レイフ・エリクソンが航海して上陸し、ブドウが採れることからヴィンランドと名づけたと伝えられる。
      1960年代、カナダのニューファンドランド島北端で遺跡が発見された。
      ランス・オー・メドーと呼ばれるこの場所には、北欧様式の建物の跡と、鉄を鍛えた痕跡が残っている。
      年代測定は1000年前後を示し、サガの記述が裏づけられた。

      滞在は数年から十数年と推定される。
      定住が続かなかった理由として、先住民との衝突、本国からの距離、人手の不足が挙げられる。
      サガには、現地の人々との交易と争いの記述がある。

      この到達は、ヨーロッパの他の地域にはほとんど伝わらなかった。
      北欧の物語として語り継がれたが、歴史の流れを変えることはない。
      コロンブスの航海が決定的な意味を持ったのは、その後に継続的な往来と植民が続いたからである。
      最初に到達したことと、世界を変えることは別だという例になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Vinland_Map_HiRes.jpg/500px-Vinland_Map_HiRes.jpg
      credit: Yale University Press / Public domain
      page: https://commons.wikimedia.org/wiki/File:Vinland_Map_HiRes.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴィンランド

  - id: tenochtitlan-founded
    year: 1325
    title: テノチティトランの建設
    category: society
    tags: [メソアメリカ, 都市]
    summary: 湖の上に築かれた都市。人工島の農地で20万人以上を養ったとされる。
    detail: |
      アステカの人々がメキシコ盆地の湖に都市を築いた出来事で、1325年とされる。
      湖の島に造られた都市は、最盛期に20万人以上を養った。

      伝承では、部族の神が告げた予言に従って場所を選んだとされる。
      サボテンの上に鷲が止まる場所に都を築けという内容である。
      現在のメキシコの国旗には、この図像が描かれている。
      実際には、周辺の有力な都市に従属する立場から始まった。
      湖の中の島は、他に土地がなかったために選ばれた場所とみられる。

      不利な条件を、技術で補った。
      湖の浅い場所に杭を打ち、泥と植物を積み上げて人工の農地を作る。
      チナンパと呼ばれるこの農地は、水が常に供給されるため年に何度も収穫できた。

      堤防を築いて塩水と淡水を分け、水道橋で真水を引き込む。
      三本の土手道が本土と都市を結び、運河が市内を走った。
      15世紀に周辺の二都市と同盟を結び、支配する側に回る。
      貢納が各地から集まり、市場には広い範囲の物産が並んだ。
      1519年に到来したスペイン人は、その規模と清潔さに驚いたと記録している。
      2年後、この都市は破壊され、その上にメキシコシティが建設された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Mitos_y_Fantasias_de_los_aztecas_foto_7.png/500px-Mitos_y_Fantasias_de_los_aztecas_foto_7.png
