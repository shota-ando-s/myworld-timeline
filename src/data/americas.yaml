  - id: columbus
    year: 1492
    title: コロンブスがカリブ海に到達
    category: economy
    tags: [大航海時代]
    summary: 二つの大陸が結びつき、作物・病原菌・人の大規模な交換が始まった。
    detail: |
      コロンブスの船団がカリブ海の島に到達した出来事で、1492年10月のこと。
      ヨーロッパとアメリカ大陸が継続的に結びつく起点になった。
      作物と病原菌と人の大規模な交換が、ここから始まる。

      コロンブスは、西へ向かえばアジアに着くと考えていた。
      地球の大きさを実際より小さく見積もっていたことが、その確信を支えている。
      スペインの王室の支援を得て、3隻で出航した。
      2か月余りの航海の末、現在のバハマの島に上陸する。
      彼は生涯、そこをアジアの一部だと考え続けた。
      4度の航海でカリブ海の島々と中米の沿岸を訪れ、植民地の統治も行う。
      先住民を労働に使い、貢納を課した政策は当時から批判され、一度は本国へ送還されている。

      影響は世界規模である。
      ジャガイモ、トウモロコシ、トマト、トウガラシがユーラシアへ渡り、人口を押し上げた。
      小麦、馬、牛がアメリカへ渡る。

      同時に、天然痘、麻疹、インフルエンザが持ち込まれた。
      免疫のない先住民の人口は、地域によって九割が失われたとされる。
      労働力の不足を埋めるため、アフリカからの奴隷貿易が始まった。
      世界史が一つにつながった転換点として扱われる一方、何が失われたかについての評価も定まっていない。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/コロンブス

  - id: tordesillas
    year: 1494
    title: トルデシリャス条約
    category: politics
    tags: [スペイン, ポルトガル]
    summary: 地球を2国で分ける線を引いた。ブラジルがポルトガル語圏になった理由でもある。
    detail: |
      スペインとポルトガルが、新たに到達する土地の分割を定めた条約で、1494年のこと。
      大西洋上に南北の線を引き、東をポルトガル、西をスペインの領域とした。
      地球を二国で分ける取り決めである。

      背景には、コロンブスの航海がある。
      ポルトガルはすでにアフリカ航路を開拓しており、スペインの進出に危機感を抱いた。
      教皇が境界を示したが、ポルトガルが不服として直接交渉が行われる。
      線は、カーボベルデ諸島の西370レグアに定められた。
      当時の測量では正確な経度を測れず、位置は曖昧なままだった。

      この線によって、南米大陸の東端がポルトガルの側に入る。
      1500年にカブラルがブラジルに到達すると、この条約を根拠に領有が主張された。
      ブラジルだけがポルトガル語圏になっている理由である。
      アジア側の境界は定められておらず、後に香料諸島をめぐる争いが起きた。

      他のヨーロッパ諸国は、この条約を認めなかった。
      フランス王は、アダムの遺言のどこに自分を除外する条項があるのかと述べたと伝えられる。
      イギリスとオランダも独自に進出する。
      二つの国が世界を分けるという発想自体が、以後の植民地主義の前提を示している。
      条約は形式上、18世紀まで有効とされた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Folio06r.jpg/500px-Folio06r.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Folio06r.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/トルデシリャス条約

  - id: brazil-landfall
    year: 1500
    title: ポルトガル人のブラジル到達
    category: economy
    tags: [ブラジル]
    summary: 染料になる木から国名が付き、やがて砂糖と奴隷の一大拠点になった。
    detail: |
      ポルトガルの船団が南米東岸に到達した出来事で、1500年のこと。
      指揮したのはカブラルである。
      やがて砂糖と奴隷の一大拠点になる土地との接触が始まった。

      船団はインドへ向かう途中だった。
      アフリカ西岸で風を捉えるため大きく西へ迂回した結果、陸地に達したとされる。
      偶然か、あるいは事前の情報にもとづく行動かは議論がある。
      上陸した一行は、この地を島と考えて十字架を立て、領有を宣言した。
      トルデシリャス条約の線の内側にあたるため、ポルトガルの領域とされる。

      同行した書記が国王に宛てた書簡が残っている。
      先住民の外見、生活、道具について詳しく記され、大陸の住民を記録した最初の文書の一つになった。
      船団は数日で出発し、インドへ向かった。
      その後、この地からは染料になる木が運ばれた。
      赤い色を出すその木の名が、国名の由来である。

      本格的な植民は1530年代から始まる。
      海岸が区画に分けられて有力者に与えられ、砂糖の農園が開かれた。
      先住民は疫病と強制労働で激減し、アフリカからの奴隷が導入される。
      一隻の迂回から始まった接触が、400万人を超える人々が海を渡らされる歴史につながった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f6/Pedro_%C3%81lvares_Cabral.jpg/500px-Pedro_%C3%81lvares_Cabral.jpg
      credit: Aurélio de Figueiredo / Public domain
      page: https://commons.wikimedia.org/wiki/File:Pedro_%C3%81lvares_Cabral.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ペドロ・アルヴァレス・カブラル

  - id: tenochtitlan-fall
    year: 1521
    title: コルテスがテノチティトランを攻略
    category: war
    tags: [スペイン, アステカ]
    summary: 数百人の兵と現地の反アステカ勢力、そして疫病が帝国を倒した。
    detail: |
      スペイン人と現地の同盟軍がアステカの都を陥落させた出来事で、1521年8月のこと。
      3か月に及ぶ包囲の末である。
      これによってアステカは滅びた。

      前年、スペイン人は都から追われていた。
      多数の死者を出して撤退し、トラスカラで態勢を立て直す。
      再攻略の準備は周到だった。
      湖上で戦うための小型の船を分解して運び、現地で組み立てる。
      三本の土手道を断ち、真水を引く水道橋を破壊した。
      周辺の都市を次々に味方につけ、数万の兵を得ている。

      同じ時期、天然痘が都で猛威をふるった。
      人口の相当部分が失われ、経験ある指揮官も死亡する。
      包囲は3か月続いた。
      守る側は飢えと渇きに苦しみながら抵抗し、市街戦は建物を一つずつ壊しながら進む。
      最後の支配者クアウテモクが捕らえられて終わった。

      都は徹底的に破壊された。
      神殿の石材を使って教会が建てられ、その上にメキシコシティが築かれる。
      勝因は、火器や馬だけではない。
      貢納を課されていた周辺の集団の離反と、疫病による弱体化が決定的だった。
      少数のヨーロッパ人が帝国を倒したという物語は、その構造を見落としている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Retrato_de_Hern%C3%A1n_Cort%C3%A9s.jpg/500px-Retrato_de_Hern%C3%A1n_Cort%C3%A9s.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Retrato_de_Hern%C3%A1n_Cort%C3%A9s.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エルナン・コルテス

  - id: inca-fall
    year: 1533
    title: ピサロがインカ帝国を滅ぼす
    category: war
    tags: [スペイン, アンデス]
    summary: 内戦直後の帝国を少数のスペイン人が制圧し、銀山開発が始まった。
    detail: |
      スペインの遠征隊がインカ帝国を制圧した出来事で、1533年のこと。
      前年に皇帝が捕らえられ、この年にクスコが占領された。
      銀山の開発がここから始まる。

      インカは、征服の直前まで内戦を戦っていた。
      原因は、天然痘によって皇帝と後継者が同時に失われたことである。
      病はスペイン人が到達する前に、パナマから南下していた。
      1532年、カハマルカでの奇襲によって皇帝アタワルパが捕らえられる。
      身代金として集められた金は溶かされ、本国へ送られた。
      翌年、皇帝は処刑される。

      ピサロは傀儡の皇帝を立ててクスコへ入った。
      各地の集団のうち、インカの支配に不満を持つものは協力している。
      抵抗は続いた。
      傀儡として立てられた人物が離反し、山中のビルカバンバに拠点を作って1572年まで戦う。

      征服後、ポトシとポサの銀山が開発された。
      先住民が交代で鉱山労働に徴発され、水銀を用いる精錬で多数が死亡する。
      産出した銀は世界経済を動かした。
      インカの行政の仕組みの一部は、植民地の支配に流用された。
      道路と倉庫と労働の徴発が、そのまま別の目的に使われる。
      高度な国家の組織が、征服者に利用された例でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/Portrait_of_Francisco_Pizarro.jpg/500px-Portrait_of_Francisco_Pizarro.jpg
      credit: Amable-Paul Coutan / Public domain
      page: https://commons.wikimedia.org/wiki/File:Portrait_of_Francisco_Pizarro.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フランシスコ・ピサロ

  - id: smallpox-americas
    year: 1520
    circa: true
    title: 天然痘の大流行
    category: disaster
    tags: [疫病, 先住民]
    summary: 免疫のない先住民社会で人口の大半が失われ、征服が容易になった。
    detail: |
      ヨーロッパから持ち込まれた天然痘がアメリカ大陸で大流行した出来事で、1520年ごろに始まった。
      免疫のない社会で人口の大半が失われた。
      征服が容易になった最大の要因である。

      ユーラシアでは、家畜との長い接触のなかで多くの感染症が定着していた。
      人々は幼少期の感染を経て一定の免疫を持つ。
      アメリカ大陸には、家畜化された大型動物がほとんどいなかった。
      そのため、天然痘、麻疹、インフルエンザ、チフスのいずれも未経験である。

      1520年、コルテスの軍に加わっていた人物からアステカの都に天然痘が広がった。
      数か月で人口の三分の一が死亡したとされる。
      指導者と経験ある戦士が失われ、統治も防衛も崩れた。
      同じことがインカでも起きた。
      征服者が到達する前に、パナマ経由で病が南下している。
      皇帝と後継者が病死し、それが内戦の引き金になった。

      大陸全体の人口は、100年のうちに九割近くが失われたとする推計もある。
      正確な数字は分からないが、人類史で最大級の人口の減少であることは確かである。
      農地が放棄されて森が戻り、大気中の二酸化炭素が減って気温が下がったという研究もある。
      疫病が歴史を動かした、最も規模の大きな事例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Fold_out_colour_plate_showing_vaccination_scars_Wellcome_L0041064.jpg/500px-Fold_out_colour_plate_showing_vaccination_scars_Wellcome_L0041064.jpg
      credit: 作者不明 / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Fold_out_colour_plate_showing_vaccination_scars_Wellcome_L0041064.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/天然痘

  - id: potosi
    year: 1545
    title: ポトシ銀山の発見
    category: economy
    tags: [銀, 世界経済]
    summary: 流れ出した銀はヨーロッパ経由で明にまで達し、世界の物価を動かした。
    detail: |
      現在のボリビアで巨大な銀鉱脈が見つかった出来事で、1545年のこと。
      標高4000メートルを超える山に、世界最大級の銀山が開かれた。
      ここから流れ出した銀が、世界の物価を動かす。

      発見の直後から採掘が始まり、山の麓に都市が形成された。
      17世紀初めの人口は15万を超え、当時のロンドンやパリに匹敵する。
      産出量は膨大だった。
      植民地時代を通じて、中央アンデスの銀の大半がこの山から出たとされる。

      労働は先住民の徴発によってまかなわれた。
      インカ時代の労働義務の仕組みが流用され、広い範囲の村から交代で動員される。
      坑内の事故、水銀を用いる精錬、高地の寒さで多数が死亡した。
      アフリカからの奴隷も投入されている。
      銀はリマからパナマを経てスペインへ運ばれた。
      一部はアカプルコからマニラへ渡り、中国の絹と陶磁器の代価として流れる。
      明と清の経済は、この銀に支えられた。

      ヨーロッパでは通貨の量が増え、長期の物価上昇が起きる。
      価格革命と呼ばれる現象である。
      日本語のポトシという語は、豊かさの代名詞としてスペイン語に残った。
      その富が、どのような労働の上に成り立っていたかも同時に記憶されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/Cerro_ricco.jpg/500px-Cerro_ricco.jpg
      credit: オランダ語版ウィキペディアのMhwaterさん / Public domain
      page: https://commons.wikimedia.org/wiki/File:Cerro_ricco.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/セロ・リコ

  - id: jamestown
    year: 1607
    title: ジェームズタウンの建設
    category: society
    tags: [北アメリカ, イギリス]
    summary: イギリス人の最初の恒久的植民地。タバコ栽培が経済の柱になった。
    detail: |
      イギリスが北米に建設した最初の恒久的な植民地で、1607年のこと。
      現在のヴァージニア州にあたる。
      タバコの栽培が経済の柱になった。

      入植は、国王の特許を得た会社の事業として始まった。
      金の発見と、アジアへの航路の探索が当初の目的である。
      最初の数年は壊滅的だった。
      湿地に近い立地で水質が悪く、マラリアと赤痢が広がる。
      食糧の生産を軽視したため飢えが襲い、最初の冬に多くが死亡した。
      1609年からの冬は飢餓の時期と呼ばれ、人口が一割にまで減っている。

      存続を可能にしたのがタバコである。
      西インド諸島の品種を導入して栽培に成功し、ヨーロッパで高値で売れた。
      以後、入植者は土地を求めて内陸へ広がる。
      1619年、二つの出来事が起きた。
      植民地議会が開かれ、住民の代表が立法に参加する仕組みが北米で初めて生まれる。
      同じ年、アフリカ人が連れてこられ、後の奴隷制につながった。

      労働力は当初、年季奉公の白人が中心だった。
      17世紀後半から奴隷への依存が強まる。
      先住民との関係は、交易から衝突へ移った。
      土地の拡大が争いを生み、その構図は以後の北米で繰り返される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/69/Location_of_jamestown_virginia.jpg/500px-Location_of_jamestown_virginia.jpg
      credit: Aude / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Location_of_jamestown_virginia.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジェームズタウン_(バージニア州)

  - id: first-africans-virginia
    year: 1619
    title: 最初のアフリカ人がヴァージニアに連れてこられる
    category: society
    tags: [北アメリカ, 奴隷制]
    summary: 北米の奴隷制の起点とされ、その影響は今日まで続いている。
    detail: |
      アフリカ人がヴァージニアに連れて来られた出来事で、1619年のこと。
      イギリス領の北米で記録に残る最初の例である。
      アメリカの奴隷制の起点とされてきた。

      記録によれば、20人余りがオランダの船によってジェームズタウンに運ばれ、食糧と交換された。
      彼らはポルトガルの奴隷船から奪われた人々だったとみられる。
      この時点での法的な地位は曖昧である。
      当時のヴァージニアには奴隷制を定めた法がなく、年季奉公の労働者として扱われた者もいた。
      実際、後に自由を得て土地を所有した人物の記録も残っている。

      制度として固まるのは数十年後である。
      1660年代以降、母親の身分が子に継承されること、キリスト教への改宗が自由をもたらさないことが法で定められた。
      人種によって身分が世襲される仕組みが、ここで作られる。

      背景には、タバコと米の農園で労働力が必要とされたことがある。
      年季奉公の白人は期間が終われば自由になり、土地を求めて不満を抱いた。
      終身かつ世襲の労働力への転換が進む。
      以後、北米には数十万のアフリカ人が運ばれた。
      1619年という年は、現在も奴隷制の起点として繰り返し参照されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/US_Slave_Free_1789-1861.gif/500px-US_Slave_Free_1789-1861.gif
