        url: https://ja.wikipedia.org/wiki/ニューディール政策

  - id: trinity-test
    year: 1945
    title: 人類初の核実験
    category: science
    tags: [アメリカ, 核]
    summary: 3週間後に広島・長崎で使用され、戦争と国際政治の前提が変わった。
    detail: |
      人類最初の核実験で、1945年7月16日にニューメキシコの砂漠で行われた。
      3週間後、広島と長崎で実際に使用される。
      戦争と国際政治の前提が、ここで変わった。

      開発は、マンハッタン計画と呼ばれる国家事業として進められた。
      数十億ドルと13万人が投入され、ドイツが先に完成させることへの懸念が動機だった。
      実験されたのは、プルトニウムを爆縮によって圧縮する方式である。
      構造が複雑なため、実際に爆発するかどうかを確かめる必要があった。

      午前5時半、爆発が起きた。
      威力はTNT火薬に換算して約20キロトン、閃光は数百キロ先からも見えた。
      砂が熱で溶けてガラス状の物質に変わっている。
      開発を主導したオッペンハイマーは、その光景に接してヒンドゥー教の聖典の一節を思い起こしたと後に語った。
      私は死神となり、世界の破壊者となった、という句である。
      実験の成功は、ポツダム会談に臨むトルーマンに伝えられた。

      8月6日に広島、9日に長崎で使用され、十数万人が即死する。
      1949年にソ連が実験に成功し、核の均衡による対立の時代が始まった。
      人類が自らを滅ぼしうる手段を持ったという認識が、以後の国際政治の前提になる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Trinity_explosion_%28color%29.jpg/500px-Trinity_explosion_%28color%29.jpg
      credit: Photo courtesy of National Nuclear Security Administration / Nevada Site Office / Public domain
      page: https://commons.wikimedia.org/wiki/File:Trinity_explosion_(color).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/トリニティ実験
    related: [japan-surrender]

  - id: bretton-woods
    year: 1944
    title: ブレトン・ウッズ体制
    category: economy
    tags: [アメリカ, 国際通貨]
    summary: ドルを基軸とする戦後の国際経済の枠組みが作られた。
    detail: |
      戦後の国際経済の枠組みを決めた会議と協定で、1944年にアメリカの保養地で開かれた。
      44か国が参加した。
      ドルを基軸とする体制が作られる。

      背景には、戦間期の反省がある。
      各国が通貨を切り下げ、関税を上げて自国を守ろうとした結果、貿易が縮小して恐慌が深まった。
      その繰り返しを防ぐことが目的である。
      合意の柱は、為替相場の安定である。
      ドルを金に対して固定し、各国の通貨をドルに対して固定する。
      金と交換できるのはドルだけという仕組みになった。

      国際通貨基金が設けられ、国際収支の危機に陥った国に融資を行う。
      国際復興開発銀行は、戦後の復興と開発に資金を提供した。
      貿易については、後にガットとして関税を引き下げる交渉の場が作られる。
      イギリスの代表ケインズは、特定の国の通貨に依存しない新しい国際通貨を提案した。
      しかし、圧倒的な経済力を持つアメリカの案が採られる。
      この体制は、戦後の高い成長を支えた。

      1971年、アメリカが金との交換を停止して崩れる。
      以後は変動相場制へ移行した。
      それでも、ドルが基軸通貨であり続ける構造と、二つの国際機関は現在まで残っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Mount_Washington_Hotel_2003.JPG/500px-Mount_Washington_Hotel_2003.JPG
      credit: Sven Klippel / CC BY-SA 2.5
      page: https://commons.wikimedia.org/wiki/File:Mount_Washington_Hotel_2003.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ブレトン・ウッズ協定

  - id: brown-v-board
    year: 1954
    title: ブラウン判決
    category: society
    tags: [アメリカ, 人権]
    summary: 公立学校の人種隔離を違憲とし、公民権運動の法的な突破口になった。
    detail: |
      アメリカ最高裁が公立学校の人種隔離を違憲とした判決で、1954年のこと。
      公民権運動の法的な突破口になった。

      1896年の判決以来、分離していても平等であれば合憲という原則が認められていた。
      実際には、黒人の学校は予算も設備も著しく劣っている。
      全米黒人地位向上協会は、この原則そのものを覆す訴訟を計画的に進めた。
      弁護士のサーグッド・マーシャルが主導し、後に自ら最高裁の判事になる。
      訴訟は複数の州の事例をまとめたものである。
      原告の一人ブラウンの娘は、近くに白人の学校がありながら遠くの学校へ通わされていた。

      判決は、分離された教育は本質的に不平等であると述べた。
      教育の機会を人種で分けることは、子どもに劣等感を植えつけ、取り返しのつかない影響を与えると判断する。
      心理学の研究も根拠として引かれた。
      9人の判事の全員一致だった。

      しかし実施は進まなかった。
      南部の州は抵抗し、学校を閉鎖する例もある。
      アーカンソーでは、登校する生徒を守るために連邦軍が派遣された。
      実質的な統合には10年以上を要する。
      それでも、法の下の平等が司法によって示されたことが、その後の運動を支えた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ブラウン対教育委員会裁判

  - id: cuban-missile-crisis
    year: 1962
    title: キューバ危機
    category: war
    tags: [冷戦, 核]
    summary: 核戦争に最も近づいた13日間。以後、米ソは危機管理の仕組みを整えた。
    detail: |
      ソ連がキューバに核ミサイルを配備したことをめぐる米ソの対立で、1962年10月の13日間に起きた。
      核戦争に最も近づいた局面とされる。

      背景には、アメリカがトルコに配備していたミサイルと、キューバへの侵攻の試みがある。
      ソ連は、対抗と同盟国の防衛を名目に配備を進めた。
      偵察機の写真で建設が確認され、アメリカ側は対応を協議した。
      軍は空爆と侵攻を主張する。
      ケネディは海上封鎖を選び、これ以上の搬入を阻むことで時間を作った。

      世界は数日間、核戦争の可能性に直面する。
      ソ連の船が封鎖線に近づき、潜水艦への爆雷投下も行われた。
      ある潜水艦では核魚雷の使用が検討され、一人の士官の反対で回避されている。
      決着は交渉によるものだった。
      ソ連がミサイルを撤去し、アメリカはキューバに侵攻しないと約束する。
      トルコのミサイルの撤去も、公表しない形で合意された。

      この経験から、両国は危機の管理の仕組みを整えた。
      首脳が直接連絡できる回線が設けられ、翌年には部分的核実験禁止条約が結ばれる。
      偶発的な要素がいかに大きいかも明らかになった。
      意図しない衝突が全面戦争に至る経路が、具体的に示された出来事である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/P-2H_Neptune_over_Soviet_ship_Oct_1962.jpg/500px-P-2H_Neptune_over_Soviet_ship_Oct_1962.jpg
      credit: USN / Public domain
      page: https://commons.wikimedia.org/wiki/File:P-2H_Neptune_over_Soviet_ship_Oct_1962.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/キューバ危機

  - id: march-on-washington
    year: 1963
    title: ワシントン大行進
    category: society
    tags: [アメリカ, 人権]
    summary: キング牧師の「私には夢がある」の演説が、公民権法の成立を後押しした。
    detail: |
      公民権を求める大規模な行進で、1963年8月にワシントンで行われた。
      25万人が集まり、その多くが黒人だった。
      キング牧師の演説が、公民権法の成立を後押しする。

      正式には、仕事と自由のための行進という名称である。
      人種差別の撤廃だけでなく、雇用と賃金の平等も要求に含まれていた。
      複数の団体が共同で準備した。
      暴力が起きれば運動全体が損なわれるため、規律が徹底される。

      リンカン記念堂の前で、複数の演説と歌が続いた。
      最後に登壇したキング牧師は、原稿を読み進めた後、歌手の声に促されて即興の部分に入る。
      私には夢がある、という言葉が繰り返された。
      かつて奴隷であった者の子孫と、奴隷を所有していた者の子孫が、同じ食卓に着く日を夢見ると述べる。
      子どもたちが肌の色ではなく人格の中身によって評価される国を、と語った。

      演説は全国に中継された。
      翌年、公民権法が成立する。
      この行進は、非暴力の大衆行動が世論と立法を動かした例として記憶されている。
      一方で、当時は運動の内部にも慎重論があり、政府も警戒していた。
      後から称賛された出来事が、当時は危険視されていたことも忘れられやすい。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/March_on_Washington_edit.jpg/500px-March_on_Washington_edit.jpg
      credit: Warren K. Leffler / Public domain
      page: https://commons.wikimedia.org/wiki/File:March_on_Washington_edit.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ワシントン大行進

  - id: apollo-11
    year: 1969
    title: アポロ11号の月面着陸
    category: science
    tags: [宇宙, 冷戦]
    summary: 米ソの競争のなかで、人類が初めて地球以外の天体に立った。
    detail: |
      アメリカの宇宙船が月面に着陸した出来事で、1969年7月のこと。
      人類が初めて地球以外の天体に立った。
      米ソの宇宙開発競争のなかで実現した。

      競争は1957年のソ連の人工衛星から始まった。
      最初の有人飛行もソ連に先を越される。
      ケネディは1961年、1960年代のうちに人を月へ送り、無事に帰還させると宣言した。
      計画には10年で250億ドル、40万人が関わった。
      1969年7月16日に打ち上げられ、4日後に着陸船が月面へ降りる。
      自動操縦の予定地が岩場だったため、船長が手動に切り替えて着陸した。
      燃料の残りは数十秒分だったとされる。

      アームストロングが月面に降り立ち、一人の人間にとっては小さな一歩だが、人類にとっては大きな飛躍だと述べた。
      2時間半の船外活動で、岩石の採取と実験装置の設置が行われた。
      世界で6億人がテレビで見守ったとされる。
      以後、6回の着陸が行われ、1972年で計画は終わった。

      膨大な費用への批判もある。
      一方、集積回路と材料と通信の技術が急速に進み、地球を宇宙から撮影した写真が環境への意識を変えた。
      国家の威信をかけた競争が、科学の成果を生んだ例でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/Aldrin_Apollo_11_original.jpg/500px-Aldrin_Apollo_11_original.jpg
      credit: Neil Armstrong / Public domain
      page: https://commons.wikimedia.org/wiki/File:Aldrin_Apollo_11_original.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アポロ11号

  - id: chile-coup
    year: 1973
    title: チリのクーデタ
    category: politics
    tags: [ラテンアメリカ, 冷戦]
    summary: 選挙で選ばれた社会主義政権が軍に倒され、冷戦の代理対立が中南米に及んだ。
    detail: |
      チリで軍がクーデタを起こし、選挙で選ばれた社会主義政権を倒した出来事で、1973年9月11日のこと。
      冷戦の対立が中南米に及んだ典型的な事例である。

      アジェンデ大統領は、1970年の選挙で政権に就いた。
      武力ではなく選挙によって社会主義をめざすという路線である。
      銅山の国有化、農地改革、賃金の引き上げが進められた。
      当初は経済が拡大したが、やがてインフレと物不足が深刻になる。
      所有者への補償をめぐる対立、アメリカによる経済的な圧力、国際的な信用の低下が重なった。
      トラック運転手のストライキが物流を止める。

      アメリカは、政権の成立当初から転覆を図っていた。
      資金の提供、報道への工作、軍への働きかけが行われたことが、後の文書で確認されている。
      9月11日、軍が主要な施設を制圧した。
      大統領府は空爆され、アジェンデは最後の放送を行った後に死亡する。

      その後、17年にわたる軍政が続いた。
      数千人が殺害され、多数が国外へ逃れる。
      民主的な手続きで成立した政権が武力で倒されたことは、各国の左派に強い衝撃を与えた。
      同時に、経済の混乱と国際的な圧力のなかで政権を維持することの難しさも示している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/Golpe_de_Estado_1973.jpg/500px-Golpe_de_Estado_1973.jpg
      credit: Biblioteca del Congreso Nacional de Chile / CC BY 3.0 cl
      page: https://commons.wikimedia.org/wiki/File:Golpe_de_Estado_1973.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チリ・クーデター

  - id: nafta
    year: 1994
    title: NAFTA（北米自由貿易協定）
    category: economy
    tags: [北アメリカ, 貿易]
    summary: 国境を越えた生産網が広がり、雇用の移動をめぐる論争も生んだ。
    detail: |
      アメリカ、カナダ、メキシコが結んだ自由貿易の協定で、1994年に発効した。
      三国のあいだの関税をほぼ撤廃する内容である。
      国境を越えた生産網が広がり、雇用の移動をめぐる論争も生んだ。

      交渉は1980年代末から始まった。
      メキシコは、対外債務の危機の後に市場の開放へ方針を転換している。
      発効により、関税は段階的に撤廃された。
      投資の保護と知的財産の規定も含まれ、企業が国を訴えられる仕組みも設けられる。

      影響は大きい。
      三国間の貿易額は数倍になった。
      メキシコ北部には、部品を輸入して組み立てる工場が集積する。
      自動車産業では、部品が国境を何度も往復する生産の体制ができた。

      批判も強い。
      アメリカでは製造業の雇用が失われたとされ、賛否が続いた。
      メキシコの農民は、補助金を受けたアメリカ産のトウモロコシに対抗できず、農村から人が流出する。
      これが移民の増加の一因にもなった。
      発効の当日、メキシコ南部で先住民の武装組織が蜂起している。
      2020年、内容を改定した新しい協定に置き換えられた。
      自由貿易が誰に利益をもたらし、誰に負担を負わせるかという議論の、代表的な事例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/NAFTA_logo.svg/500px-NAFTA_logo.svg.png
      credit: Nicoguaro / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:NAFTA_logo.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/北米自由貿易協定

  - id: september-11
    year: 2001
    title: 9.11同時多発テロ
    category: war
    tags: [アメリカ, テロ]
    summary: 以後20年の対テロ戦争が始まり、世界中で安全と自由の均衡が問い直された。
    detail: |
      アメリカで起きた同時多発テロで、2001年9月11日のこと。
      約3000人が死亡した。
      以後20年にわたる対テロ戦争が始まり、安全と自由の均衡が世界中で問い直される。

      4機の旅客機が乗っ取られた。
      2機がニューヨークの世界貿易センターの二つの塔に突入し、いずれも崩落する。
      1機は国防総省に突入した。
      残る1機は乗客が抵抗し、ペンシルベニアの野に墜落している。

      実行したのはアルカイダで、19人の実行犯の多くはサウジアラビア出身だった。
      組織は、アメリカ軍が聖地のある国に駐留していることなどを攻撃の理由に挙げている。
      アメリカはアフガニスタンを攻撃し、首謀者を匿うタリバン政権を倒した。
      2003年にはイラクへ侵攻する。

      国内では、愛国者法によって監視と捜査の権限が拡大した。
      空港の検査が厳しくなり、移民の審査も強化される。
      捕虜の扱いや拷問に近い尋問が問題になった。
      イスラム教徒への偏見と差別も広がる。
      事件は世界中で生中継された。
      国家ではない組織が超大国の中枢を攻撃できることが示され、安全保障の考え方が変わった。
      20年後、アフガニスタンからの撤退とともに一つの時代が終わる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/65/September_11_Photo_Montage.jpg/500px-September_11_Photo_Montage.jpg
      credit: UpstateNYer / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:September_11_Photo_Montage.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アメリカ同時多発テロ事件

  - id: lehman-shock
    year: 2008
    title: 世界金融危機
    category: economy
    tags: [アメリカ, 経済危機]
    summary: 住宅バブルの崩壊が世界に波及し、金融規制と格差の議論を呼んだ。
    detail: |
      アメリカの住宅バブルの崩壊から始まった世界規模の金融危機で、2008年に本格化した。
      大手の投資銀行の破綻が転換点になる。
      金融規制と格差をめぐる議論を呼んだ。

      2000年代前半、低金利と住宅価格の上昇を背景に、返済能力の低い層への融資が拡大した。
      この債権は証券化され、複雑な金融商品に組み込まれて世界中に売られる。
      格付け機関は高い評価を与えていた。
      2006年から住宅価格が下落に転じると、延滞が急増した。
      関連する証券の価値が崩れ、保有する金融機関に巨額の損失が生じる。

      2008年9月、大手投資銀行のリーマン・ブラザーズが破綻した。
      救済されなかったことで、どの金融機関も信用できないという状態になる。
      短期の資金市場が凍りつき、危機は世界に波及した。
      各国は銀行に公的資金を注入し、中央銀行は大量の資金を供給する。
      財政出動も行われた。
      世界の貿易と生産は急落し、失業が広がる。

      救済された金融機関の幹部が高額の報酬を受けていたことが、強い反発を招いた。
      格差への不満は、各国の政治を長く揺さぶることになる。
      金融規制の強化が進められたが、その後の緩和をめぐる議論も続いている。
