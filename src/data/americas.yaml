        url: https://ja.wikipedia.org/wiki/カリフォルニア・ゴールドラッシュ

  - id: us-civil-war
    year: 1861
    title: 南北戦争
    category: war
    tags: [アメリカ, 奴隷制]
    summary: 4年の内戦の末に奴隷制が廃止され、連邦の統一が守られた。
    detail: |
      アメリカで南部の州が連邦を離脱して起きた内戦で、1861年から1865年まで続いた。
      奴隷制の廃止と連邦の維持が結果として実現する。
      死者は60万を超え、アメリカ史上最大の犠牲になった。

      対立の核心は奴隷制である。
      新たに加わる州で奴隷制を認めるかどうかをめぐり、数十年にわたり妥協が繰り返されてきた。
      奴隷制の拡大に反対するリンカンの当選が、離脱の引き金になる。
      11州が離脱して南部連合を結成し、1861年に砦への砲撃で戦端が開かれた。

      北部は人口で4倍、工業生産では10倍以上の力を持っていた。
      鉄道と造船の能力も圧倒的である。
      一方、南部は防衛戦であり、優れた指揮官を擁していた。

      初期は南部が善戦したが、消耗戦になると差が現れる。
      海上を封鎖され、綿花の輸出が止まった。
      1863年のゲティスバーグとヴィックスバーグで戦局が転換する。
      北軍は南部の生産基盤を破壊しながら進み、1865年に降伏を受け入れた。
      戦後、憲法の修正によって奴隷制が廃止され、黒人に市民権と選挙権が与えられた。
      しかし南部では差別的な法が作られ、実質的な平等は1960年代まで待つことになる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/c/c7/CivilWarUSAColl.png
      credit: Excel23 / CC0
      page: https://commons.wikimedia.org/wiki/File:CivilWarUSAColl.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/南北戦争

  - id: emancipation-proclamation
    year: 1863
    title: 奴隷解放宣言
    category: society
    tags: [アメリカ, 人権]
    summary: 戦争の目的を「連邦の維持」から「奴隷制の廃止」へ広げた。
    detail: |
      リンカン大統領が反乱状態にある州の奴隷の解放を宣言した文書で、1863年1月に発効した。
      戦争の目的を、連邦の維持から奴隷制の廃止へ広げた。

      前年の夏には草案が用意されていた。
      戦況が悪いなかで出せば敗北を取り繕う措置と受け取られるため、勝利を待って発表された。
      法的には、大統領の戦時の権限にもとづく軍事的な措置である。
      対象は反乱している州に限られ、連邦に留まっている奴隷州は除外された。
      直接に解放できる地域には政府の力が及ばないという矛盾を含んでいる。

      それでも影響は大きかった。
      北軍が進むたびに、その地域の奴隷が法的に自由になる。
      逃れてきた人々が軍に加わり、20万人近い黒人が北軍で戦った。

      国際的な意味も大きい。
      イギリスとフランスは南部を支援する可能性を持っていたが、奴隷制の廃止が戦争の目的になったことで、介入は政治的に難しくなった。
      完全な廃止は、1865年の憲法修正第13条によって実現する。
      宣言は、理想からではなく戦争を勝ち抜くための判断として出された面が強い。
      それでも、この文書が戦争の性格を変えたことは確かである。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/奴隷解放宣言

  - id: transcontinental-railroad
    year: 1869
    title: 大陸横断鉄道の完成
    category: economy
    tags: [アメリカ, 鉄道]
    summary: 東西が1週間で結ばれ、国内市場と西部開拓が一気に進んだ。
    detail: |
      アメリカ大陸を横断する鉄道が完成した出来事で、1869年のこと。
      ユタ州で東西からの線路が接続された。
      東西が1週間で結ばれ、国内市場と西部の開拓が一気に進む。

      建設は二つの会社が担った。
      東からは中西部から西へ、西からはサクラメントから東へ進む。
      政府は土地と補助金を与え、敷設した距離に応じて支払う方式をとった。
      シエラネバダ山脈の工事が最大の難所である。
      花崗岩の山にトンネルを掘り、雪崩と戦いながら進んだ。
      この区間を担ったのは、大半が中国からの移民労働者である。
      1万人以上が働き、危険な発破の作業も担った。
      東側ではアイルランド系の移民と除隊した兵士が中心になる。

      1869年5月、金の犬釘が打ち込まれて接続が祝われた。
      影響は大きい。
      馬車で数か月かかった横断が1週間になり、運賃も大幅に下がった。
      穀物と牛が東へ運ばれ、工業製品が西へ流れる。

      一方、平原の先住民にとっては破滅的だった。
      鉄道の建設に伴ってバイソンが大量に殺され、生活の基盤が失われる。
      土地は分割されて入植者に売られた。
      国家を一つの経済圏にまとめた事業であると同時に、先住民の社会を終わらせた事業でもある。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大陸横断鉄道

  - id: wounded-knee
    year: 1890
    title: ウンデッド・ニーの虐殺
    category: society
    tags: [先住民, アメリカ]
    summary: 先住民の組織的抵抗が終わった出来事として記憶されている。
    detail: |
      サウスダコタで陸軍が先住民の集団を殺害した出来事で、1890年12月のこと。
      女性と子どもを含む200人以上が死亡した。
      先住民の組織的な抵抗が終わった出来事として記憶されている。

      背景に、ゴースト・ダンスと呼ばれる宗教運動がある。
      踊りを続ければ祖先が戻り、バイソンが復活し、白人が去るという教えである。
      土地とバイソンを失った人々のあいだに広がった。
      政府はこれを反乱の前兆とみなし、軍を派遣した。
      指導者シッティング・ブルは逮捕の際に射殺される。

      別の集団が保留地へ向かう途中、軍に包囲された。
      武器の引き渡しの最中に銃が暴発し、四方から機関砲による射撃が始まる。
      逃げる人々も追われて殺された。
      積雪のなか、遺体は集団の墓に埋められる。
      軍はこれを戦闘として扱い、20人に名誉勲章を授与した。
      この授与の取り消しを求める運動が、現在も続いている。

      この後、先住民による組織的な武力抵抗は行われていない。
      土地は分割され、子どもは寄宿学校に入れられて言語と文化を奪われた。
      1973年、同じ場所を先住民の活動家が占拠し、条約の履行を求めた。
      歴史の記憶が、現在の運動と結びついた場所である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Wounded_Knee_mapa_positive.jpg/500px-Wounded_Knee_mapa_positive.jpg
      credit: "derivative work: Tadam (talk) Wounded_Knee_mapa.jpg: / Public domain"
      page: https://commons.wikimedia.org/wiki/File:Wounded_Knee_mapa_positive.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウンデット・ニーの虐殺

  - id: spanish-american-war
    year: 1898
    title: 米西戦争
    category: war
    tags: [アメリカ, 帝国主義]
    summary: フィリピンとプエルトリコを得て、アメリカが海外帝国に踏み出した。
    detail: |
      アメリカとスペインが戦った戦争で、1898年のこと。
      数か月で終わり、アメリカはフィリピン、プエルトリコ、グアムを得た。
      海外に領土を持つ帝国へ踏み出すことになる。

      きっかけはキューバである。
      スペインからの独立運動が続き、その鎮圧の過酷さがアメリカで報じられていた。
      新聞が競って扇情的な記事を書き、世論を煽る。
      ハバナ港でアメリカの軍艦が爆沈すると、スペインの仕業とされて開戦した。
      実際の原因は内部の事故だった可能性が高い。
      戦闘は短期間で決した。
      マニラ湾とサンティアゴでスペイン艦隊が壊滅し、地上戦でも優位に立つ。

      講和条約で、スペインはキューバの独立を認め、フィリピン、プエルトリコ、グアムをアメリカに譲った。
      フィリピンは2000万ドルで購入する形をとる。
      フィリピンでは、独立を期待していた勢力が反発した。
      続いて起きた戦争は数年に及び、数十万の死者を出す。
      キューバは独立したが、アメリカが内政に介入する権利を憲法に書き込ませた。

      この戦争によって、アメリカは太平洋とカリブ海に拠点を持つ国家になった。
      自らも植民地を持つという事実は、建国の理念との関係で国内でも論争になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/84/Collage_infobox_for_Spanish-American_War.jpg/500px-Collage_infobox_for_Spanish-American_War.jpg
      credit: Barbudo Barbudo and TEP / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Collage_infobox_for_Spanish-American_War.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/米西戦争

  - id: wright-brothers
    year: 1903
    title: ライト兄弟の初飛行
    category: science
    tags: [アメリカ, 技術]
    summary: 12秒の飛行から始まり、半世紀で旅客機と空の戦争の時代になった。
    detail: |
      ライト兄弟が動力飛行機による有人飛行に成功した出来事で、1903年12月のこと。
      最初の飛行は12秒、距離は36メートルだった。
      半世紀のうちに、旅客機と空の戦争の時代が訪れる。

      兄弟は自転車の製造と修理を営んでいた。
      正規の工学の教育は受けていない。
      他の挑戦者が動力の強さを追求したのに対し、彼らは操縦の問題に注目した。
      翼をねじることで機体の傾きを制御する方式を考案し、グライダーで繰り返し試験する。
      風洞を自作し、200種類以上の翼の形を比較した。

      エンジンは軽量のものを自ら作り、プロペラも独自に設計した。
      1903年12月17日、ノースカロライナの砂丘で4回の飛行を行った。
      最も長いもので59秒、260メートルを飛ぶ。
      当初、この成功はほとんど報じられなかった。
      数年にわたって改良を続け、1908年にヨーロッパで公開飛行を行って世界を驚かせる。

      発展は速かった。
      第一次世界大戦では偵察と戦闘に使われ、1920年代には定期航路が開かれる。
      初飛行から66年後には、人が月に降り立った。
      特許をめぐる訴訟に多くの時間を費やしたことは、技術の発展の妨げになったとも指摘されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Wilbur_Wright.jpg/500px-Wilbur_Wright.jpg
      credit: Orville Wright and Wilbur Wright (credited as photographers) [1], [2] / Public domain
      page: https://commons.wikimedia.org/wiki/File:Wilbur_Wright.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ライト兄弟

  - id: model-t
    year: 1908
    title: T型フォードの発売
    category: economy
    tags: [アメリカ, 大量生産]
    summary: 流れ作業による大量生産が、自動車を一般の人が買えるものに変えた。
    detail: |
      フォード社が大衆向けの自動車を発売した出来事で、1908年のこと。
      流れ作業による大量生産で価格を下げ、自動車を一般の人が買えるものに変えた。

      それまでの自動車は、熟練した職人が一台ずつ組み立てる高価な品だった。
      フォードは、部品を規格化して交換可能にし、作業を細かく分けた。
      1913年、組み立ての工程にベルトコンベアを導入する。
      労働者は移動してくる車体に対して同じ作業を繰り返す。
      組み立ての時間は12時間から2時間以下に短縮された。

      価格は850ドルから260ドル台まで下がった。
      1500万台以上が生産され、アメリカの自動車の過半を占めた時期もある。
      単調な作業に労働者が耐えられず、離職率が高かった。
      これに対し、日給を業界の倍にあたる5ドルに引き上げる。
      労働者自身が自社の車を買えるようにするという発想でもあった。

      社会への影響は大きい。
      農村と都市の距離が縮まり、郊外が生まれ、道路が整備される。
      石油の需要が急増した。
      同じ方式は他の産業にも広がり、大量生産と大量消費の時代が始まる。
      一方で、労働を細分化して人を機械の一部にするという批判も、この時期から現れた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Ford_T_Jon_Sullivan.jpg/500px-Ford_T_Jon_Sullivan.jpg
      credit: 作者不明 / ライセンス不明
      page: https://commons.wikimedia.org/wiki/File:Ford_T_Jon_Sullivan.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フォード・モデルT

  - id: panama-canal
    year: 1914
    title: パナマ運河の開通
    category: economy
    tags: [中米, 交通]
    summary: 太平洋と大西洋が直結し、アメリカの世界戦略の要になった。
    detail: |
      太平洋と大西洋を結ぶ運河が開通した出来事で、1914年のこと。
      全長80キロで、中米の地峡を横断する。
      アメリカの世界戦略の要になった。

      最初に着手したのはフランスである。
      スエズ運河を実現した人物が主導したが、熱帯の環境で2万人以上が黄熱病とマラリアで死亡し、計画は破綻した。
      アメリカが事業を引き継ぐ。
      コロンビアが条約を拒むと、パナマの独立運動を支援し、独立の承認と引き換えに運河地帯の権利を得た。
      最大の課題は病気だった。
      蚊が媒介することが解明され、徹底した駆除と衛生の管理が行われる。
      これによって死亡率は大きく下がった。

      技術的には、海面の高さで掘るのではなく、閘門で船を持ち上げる方式が選ばれた。
      人工湖を作り、三段階の水門で高低差を越える。
      1914年に開通し、南米の南端を回る航路が不要になった。
      ニューヨークとサンフランシスコの距離は1万キロ以上短縮される。

      運河地帯はアメリカが管理し、事実上の領土として扱われた。
      パナマ側の返還要求が高まり、1977年の条約を経て1999年に完全に返還される。
      現在も世界の海運の要であり、大型船に対応する拡張工事も行われた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/Panama_Canal_Map_EN.png/500px-Panama_Canal_Map_EN.png
      credit: Thoroe / CC BY-SA 2.0
      page: https://commons.wikimedia.org/wiki/File:Panama_Canal_Map_EN.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/パナマ運河

  - id: great-depression
    year: 1929
    title: 世界恐慌
    category: economy
    tags: [アメリカ, 経済危機]
    summary: ニューヨーク株式市場の暴落が世界中に波及し、各国の政治を変えた。
    detail: |
      ニューヨークの株式市場の暴落から始まった世界規模の経済危機で、1929年に発生した。
      各国の政治を大きく変えることになる。

      1920年代のアメリカは好景気にあった。
      自動車と家電が普及し、株式への投資が広がる。
      借金で株を買う取引が過熱していた。
      1929年10月、株価が暴落した。
      資産を失った人々の消費が落ち込み、企業の生産が縮む。
      銀行の取り付けが相次ぎ、数千行が破綻した。
      失業率は25パーセントに達する。

      各国は自国を守ろうとした。
      関税を引き上げ、通貨を切り下げ、閉じた経済圏を作る。
      世界の貿易は数年で三分の一に縮み、危機はさらに深まった。
      アメリカではニューディールと呼ばれる政策がとられた。
      公共事業で雇用を作り、銀行と証券を規制し、社会保障の制度を設ける。
      政府が経済に積極的に関与するという考え方が定着した。

      ドイツでは失業と不安が極端な政治勢力を押し上げ、ナチスの政権獲得につながる。
      日本では大陸への進出が選択された。
      経済の危機が民主主義を揺るがすことを示した出来事として、現在も繰り返し参照されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/54/Lange-MigrantMother02.jpg/500px-Lange-MigrantMother02.jpg
      credit: ドロシア・ラング / Public domain
      page: https://commons.wikimedia.org/wiki/File:Lange-MigrantMother02.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/世界恐慌

  - id: new-deal
    year: 1933
    title: ニューディール政策
    category: economy
    tags: [アメリカ, 政府]
    summary: 政府が雇用と福祉に積極的に関与する形を作り、各国の政策の手本になった。
    detail: |
      フランクリン・ローズヴェルトが恐慌に対して行った一連の政策で、1933年から始まった。
      政府が雇用と福祉に積極的に関与する形を作り、各国の政策の手本になった。

      就任時、アメリカの失業者は1300万を超えていた。
      銀行の取り付けが続き、経済は麻痺している。
      最初の措置は銀行の一時休業だった。
      検査を経て健全な銀行だけを再開させ、預金保険を設けて信用を回復する。
      雇用の創出には公共事業が用いられた。
      若者を森林と土木の作業に動員し、ダム、道路、学校、橋が建設される。
      テネシー川流域の開発は、ダムと発電所によって地域全体を変えた。
      芸術家や作家も雇われ、壁画や記録の作成に従事している。

      農業では、生産を減らす代わりに補償を支払う方式がとられた。
      価格の下落を止めるためだが、食糧を処分する一方で飢えがあるという矛盾も批判された。
      1935年の社会保障法は、老齢年金と失業保険を導入した。
      労働組合の結成と団体交渉の権利も法で保障される。

      最高裁は当初、一部の法を違憲とした。
      大統領は裁判官の増員を試みて反発を受ける。
      失業が解消するのは戦時の需要による。
      それでも、政府が経済に責任を負うという考え方はこの時期に定着した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f3/New_Deal_collage.jpg/500px-New_Deal_collage.jpg
      credit: 英語版ウィキペディアのLordHarrisさん / Public domain
      page: https://commons.wikimedia.org/wiki/File:New_Deal_collage.jpg
    links:
