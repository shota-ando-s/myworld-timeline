        url: https://ja.wikipedia.org/wiki/メイフラワー号

  - id: pueblo-revolt
    year: 1680
    title: プエブロの反乱
    category: society
    tags: [先住民, スペイン]
    summary: 先住民がスペイン人を12年間追い出した、北米で最も成功した抵抗の一つ。
    detail: |
      現在のニューメキシコで、先住民がスペイン人を追い出した反乱で、1680年のこと。
      12年にわたって支配を排除した。
      北米で最も成功した先住民の抵抗の一つである。

      この地域には、日干し煉瓦の集落に住むプエブロの人々が暮らしていた。
      スペインは17世紀初めに支配を確立し、労働と貢納を課す。
      最大の摩擦は宗教だった。
      伝統的な儀礼は悪魔の業として禁じられ、祭具は焼かれ、地下の儀礼の場が破壊される。
      指導者が公開で鞭打たれ、処刑されることもあった。
      さらに干ばつと飢饉、遊牧民の襲撃が重なる。

      ポペと呼ばれる宗教指導者が、離れた集落を結ぶ計画を立てた。
      各集落に結び目のある縄を送り、決起の日を示すという方法が伝えられている。
      言語の異なる数十の集落が、同時に蜂起した。
      400人余りのスペイン人が殺され、生き残りは南へ逃れる。
      教会は破壊され、洗礼の記録も焼かれた。

      12年後、スペインは再征服に成功する。
      しかし統治の方針は変わった。
      強制労働は緩和され、伝統的な儀礼も黙認されるようになる。
      現在も、この地域の人々は独自の言語と儀礼を保っている。
      抵抗が、支配の内容を変えた例である。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/プエブロの反乱

  - id: us-independence
    year: 1776
    title: アメリカ独立宣言
    category: politics
    tags: [アメリカ, 革命]
    summary: 人は平等に造られたと宣言し、以後の革命と憲法に影響を与えた。
    detail: |
      13植民地がイギリスからの独立を宣言した出来事で、1776年7月4日のこと。
      大陸会議で採択された。
      人は平等に造られたという一節が、以後の革命と憲法に影響を与えた。

      前年から武力衝突が始まっていた。
      当初は権利の回復を求める立場だったが、和解の道が閉ざされるなかで独立論が広がる。
      トマス・ペインの小冊子が、王政そのものを批判して世論を動かした。
      宣言の起草は主にジェファソンが担った。
      前半で、すべての人は平等に造られ、生命、自由、幸福の追求という奪われない権利を与えられていると述べる。
      政府はこれを守るために作られ、その正当性は被治者の同意に由来するとされた。
      後半は、国王の圧政を具体的に列挙する。

      理念は啓蒙思想、特にロックの議論に由来する。
      矛盾も含んでいた。
      起草者自身が奴隷を所有し、宣言の平等は女性にも黒人にも先住民にも適用されない。
      奴隷貿易を非難する一節は、審議の過程で削られた。

      それでも、この文言は後の運動に繰り返し用いられる。
      奴隷制廃止、女性参政権、公民権運動が、いずれもこの一節を根拠に掲げた。
      現実を追いかけさせる言葉として機能してきた文書である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/United_States_Declaration_of_Independence.jpg/500px-United_States_Declaration_of_Independence.jpg
      credit: "original: w:Second Continental Congress; reproduction: William Stone / Public domain"
      page: https://commons.wikimedia.org/wiki/File:United_States_Declaration_of_Independence.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アメリカ独立宣言

  - id: us-constitution
    year: 1787
    title: アメリカ合衆国憲法
    category: society
    tags: [アメリカ, 立憲]
    summary: 三権分立と連邦制を定めた成文憲法。各国の憲法の手本になった。
    detail: |
      アメリカ合衆国の憲法で、1787年に起草され、翌々年に発効した。
      三権分立と連邦制を定めた成文憲法である。
      各国の憲法の手本になった。

      独立後の最初の体制では、中央政府に課税と通商の権限がなかった。
      財政は行き詰まり、各州が独自の通貨と関税を用いる状態になる。
      農民の反乱が起きたことで、より強い連邦政府の必要が認識された。
      フィラデルフィアに各州の代表が集まり、4か月にわたって議論した。

      中心にあるのは権力の抑制である。
      立法、行政、司法を分け、互いに牽制させる。
      議会は二院に分かれ、上院は各州が平等に2名、下院は人口に比例する。
      大きな州と小さな州の対立を、この妥協で収めた。

      奴隷制については、奴隷を人口の五分の三として数える取り決めが置かれた。
      南部の州を参加させるための妥協であり、対立を先送りした結果、内戦につながる。
      批准をめぐる論争のなかで、権利の保障が不十分だという批判が出た。
      これを受けて、言論、信教、集会の自由などを定める修正条項が加えられる。
      条文は短く、修正の手続きも厳格である。
      230年以上にわたり、27回の修正だけで運用されてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/United_States_Constitution.jpg/500px-United_States_Constitution.jpg
      credit: Constitutional Convention / Public domain
      page: https://commons.wikimedia.org/wiki/File:United_States_Constitution.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アメリカ合衆国憲法

  - id: haitian-revolution
    year: 1791
    title: ハイチ革命
    category: society
    tags: [カリブ, 奴隷制]
    summary: 奴隷が自力で独立を勝ち取った史上唯一の例。各国に衝撃を与えた。
    detail: |
      フランス領サン=ドマングで奴隷が蜂起し、独立を勝ち取った革命で、1791年に始まった。
      1804年にハイチとして独立する。
      奴隷が自力で国家を建てた史上唯一の例である。

      この植民地は、当時世界最大の砂糖とコーヒーの産地だった。
      人口の九割が奴隷で、過酷な労働のため平均寿命は極端に短い。
      フランス革命の人権宣言が伝わると、自由人の有色層が権利を求めて動いた。
      1791年、北部で奴隷の大規模な蜂起が起きる。
      指導者として現れたのがトゥサン・ルヴェルチュールである。
      自身も元奴隷で、軍事と外交の才によって勢力をまとめた。
      フランス、スペイン、イギリスの思惑のあいだで立場を変えながら、実質的な支配を確立する。
      1801年には自治の憲法を定めた。

      ナポレオンは奴隷制の復活をめざして大軍を送る。
      トゥサンは捕らえられてフランスで獄死した。
      しかし抵抗は続き、黄熱病がフランス軍を壊滅させる。
      1804年、独立が宣言された。

      各国は承認を拒み、フランスは賠償金を要求した。
      その支払いが、独立後の経済を長く圧迫する。
      奴隷制を持つ周辺の国々からも孤立させられた。
      植民地の側から人権の理念を実行した革命として、その位置づけは特別である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fe/Battle_for_Palm_Tree_Hill.jpg/500px-Battle_for_Palm_Tree_Hill.jpg
      credit: ヤヌアリ・スホドルスキ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Battle_for_Palm_Tree_Hill.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ハイチ革命

  - id: louisiana-purchase
    year: 1803
    title: ルイジアナ買収
    category: politics
    tags: [アメリカ, 領土]
    summary: 国土が一夜で倍になり、西部への拡大が国の性格を決めていく。
    detail: |
      アメリカがフランスから広大な領域を購入した出来事で、1803年のこと。
      面積は210万平方キロを超え、国土が一気に倍になった。
      西部への拡大が国の性格を決めていく。

      この地域は、スペインからフランスへ返還されたばかりだった。
      ナポレオンは、北米に帝国を再建する構想を持っていた。
      計画を断念させたのがハイチである。
      奴隷の革命を鎮圧するために送った大軍が、戦闘と黄熱病で壊滅した。
      北米の拠点を維持する意味が薄れ、イギリスとの戦争の資金も必要になる。

      アメリカ側は当初、ミシシッピ川の河口のニューオーリンズの購入だけを交渉していた。
      フランスが領域全体の売却を提案し、交渉は一気にまとまる。
      1エーカーあたり数セントという価格だった。
      ジェファソンは、憲法に領土を購入する明文の規定がないことを気にした。
      それでも機会を逃さず、上院が条約を承認する。
      この取得によって、現在の15州にあたる地域がアメリカの領域になった。
      ミシシッピ川の航行と、西部への道が確保される。

      一方、その土地には多数の先住民が暮らしていた。
      彼らの意思は問われず、以後の強制移住と戦争につながる。
      奴隷制を新しい州へ広げるかという問題も、ここから深刻になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/National-atlas-1970-1810-loupurchase-1.png/500px-National-atlas-1970-1810-loupurchase-1.png
      credit: Original uploader was Sf46 at en.wikipedia / Public domain
      page: https://commons.wikimedia.org/wiki/File:National-atlas-1970-1810-loupurchase-1.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ルイジアナ買収

  - id: mexico-independence
    year: 1810
    title: メキシコ独立運動のはじまり
    category: politics
    tags: [メキシコ, 独立]
    summary: 司祭イダルゴの呼びかけから始まり、11年後に独立を達成した。
    detail: |
      メキシコで独立運動が始まった出来事で、1810年9月のこと。
      司祭イダルゴが村の教会で蜂起を呼びかけた。
      11年後に独立が達成される。

      背景には、本国がナポレオンに占領されたことがある。
      誰に従うべきかという問題が生じ、植民地生まれの白人が自治を求め始めた。
      イダルゴは小さな村の司祭で、先住民の窮状を身近に見ていた。
      計画が露見したため、予定を早めて鐘を鳴らし、人々に決起を呼びかける。
      この叫びは、現在も独立記念日に大統領が再現する儀式になっている。

      運動には数万の農民と先住民が加わった。
      略奪と殺戮を伴ったため、独立を望んでいた白人層はむしろ王党派に回る。
      イダルゴは翌年に捕らえられて処刑された。
      後を継いだモレロスは、奴隷制の廃止と身分の撤廃を掲げ、綱領を作成する。
      彼も1815年に処刑された。

      独立が実現したのは、意外な経路からである。
      本国で自由主義的な憲法が復活すると、植民地の保守層が特権を守るために独立を選んだ。
      王党派の将校イトゥルビデが独立派と手を結び、1821年に独立が宣言される。
      社会の構造はほとんど変わらなかった。
      大土地所有と身分による格差が残り、その矛盾が100年後の革命につながる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/Batalla_del_Monte_de_las_Cruces-30_oct_1810-M%C3%A9xico.jpg/500px-Batalla_del_Monte_de_las_Cruces-30_oct_1810-M%C3%A9xico.jpg
      credit: Gengiskanhg / Public domain
      page: https://commons.wikimedia.org/wiki/File:Batalla_del_Monte_de_las_Cruces-30_oct_1810-M%C3%A9xico.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/メキシコ独立革命

  - id: monroe-doctrine
    year: 1823
    title: モンロー宣言
    category: politics
    tags: [アメリカ, 外交]
    summary: 欧州の干渉を拒む一方、のちに中南米への影響力を正当化する根拠にもなった。
    detail: |
      アメリカ大統領モンローが議会への教書で示した外交の方針で、1823年のこと。
      ヨーロッパとアメリカ大陸の相互不干渉を掲げた。
      後に中南米への影響力を正当化する根拠にもなる。

      当時、ラテンアメリカの諸国が次々に独立していた。
      ヨーロッパの保守的な同盟が、スペインの植民地の回復を支援するのではないかという懸念がある。
      ロシアが北米の太平洋岸へ南下する動きも見られた。
      教書の内容は三点である。
      アメリカ大陸は今後ヨーロッパの植民の対象とならないこと。
      ヨーロッパの政治体制をアメリカ大陸へ広げる試みは容認しないこと。
      アメリカもヨーロッパの問題に干渉しないことである。

      当時のアメリカには、これを実行する海軍力がなかった。
      実際に新たな植民を防いだのは、同じ立場をとるイギリスの海軍である。
      19世紀後半以降、この宣言は別の使い方をされた。
      1904年、セオドア・ローズヴェルトは、この地域で秩序が乱れた場合にアメリカが介入すると宣言する。
      ヨーロッパの干渉を防ぐという論理が、自国の介入の根拠に転じた。

      以後、カリブ海と中米への軍事介入が繰り返された。
      宣言は、アメリカの外交の原則として20世紀を通じて引かれ続ける。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/James_Monroe_White_House_portrait_1819.jpg/500px-James_Monroe_White_House_portrait_1819.jpg
      credit: サミュエル・モールス / Public domain
      page: https://commons.wikimedia.org/wiki/File:James_Monroe_White_House_portrait_1819.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モンロー主義

  - id: indian-removal
    year: 1830
    title: インディアン強制移住法
    category: society
    tags: [先住民, アメリカ]
    summary: 「涙の道」と呼ばれる強制移動で多数が命を落とした。
    detail: |
      アメリカ政府が先住民を西へ強制移住させる法を定めた出来事で、1830年のこと。
      ミシシッピ川以東の部族が対象になった。
      涙の道と呼ばれる移動で多数が命を落とす。

      背景は、綿花の栽培に適した土地への需要である。
      南部の州は、部族の土地を州の管轄下に置こうとした。
      対象となった五つの部族は、いずれも農耕を営み、文字や憲法を持つものもあった。
      同化すれば認められるという政策に従ってきた人々である。
      チェロキーは法廷で争い、連邦最高裁は部族の自治を認める判決を下した。
      しかしジャクソン大統領はこれを執行せず、移住は進められる。

      1838年、軍が動員された。
      1万6000人のチェロキーが集められ、冬に1000キロを超える距離を歩かされる。
      寒さ、飢え、病によって四分の一が死亡したとされる。
      他の部族も同様の移動を強いられた。

      移住先のオクラホマも、後に白人の入植が進んで削られていく。
      法の手続きを踏み、条約を結んだうえで行われた移住であることが、この出来事の特徴である。
      署名した代表が部族を代表していない場合も多かった。
      国家の拡大が、先住民の土地の取り上げによって進んだことを示す典型的な例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Andrew_jackson_head.jpg/500px-Andrew_jackson_head.jpg
      credit: ラルフ・エリエザー・ホワイトサイド / Public domain
      page: https://commons.wikimedia.org/wiki/File:Andrew_jackson_head.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/インディアン移住法

  - id: gold-rush
    year: 1848
    title: カリフォルニアのゴールドラッシュ
    category: economy
    tags: [アメリカ, 移民]
    summary: 世界中から30万人が押し寄せ、太平洋岸の開発と中国系移民の流入が始まった。
    detail: |
      カリフォルニアで金が発見され、各地から人が殺到した出来事で、1848年から数年続いた。
      30万人が押し寄せたとされる。
      太平洋岸の開発と、中国系移民の流入が始まった。

      発見は、製材所の水路の工事中だった。
      知らせは翌年にかけて世界中に広がる。
      押し寄せたのは、アメリカ東部だけではない。
      中南米、ヨーロッパ、オーストラリア、そして中国からも人が渡った。
      陸路で大陸を横断する者、南米の南端を回る者、パナマ地峡を越える者がいた。

      実際に富を得たのはごく一部である。
      多くは資金を使い果たした。
      確実に儲けたのは、道具や食糧を売る商人だった。
      作業着として丈夫なズボンを売った商人が、後のジーンズの会社になる。
      サンフランシスコは数年で人口が数百倍になった。
      1850年、カリフォルニアは州に昇格する。

      影響は多岐にわたる。
      奴隷制を認めるかどうかが政治の焦点になり、南北の対立を深めた。
      先住民は土地を追われ、暴力と病気で人口が激減する。
      中国からの移民は労働力として歓迎された後、排斥の対象になった。
      水を使う採掘で環境も大きく損なわれた。
      短期の熱狂が地域の姿を恒久的に変えた例である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/0/04/1850_Woman_and_Men_in_California_Gold_Rush.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:1850_Woman_and_Men_in_California_Gold_Rush.jpg
    links:
