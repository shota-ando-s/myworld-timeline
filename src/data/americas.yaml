  - id: mayflower
    year: 1620
    title: メイフラワー号の到着
    category: religion
    tags: [北アメリカ, 移民]
    summary: 信仰の自由を求めた入植者の自治の誓約が、建国神話の一部になった。
    detail: |
      イギリスの入植者を乗せた船が北米に到着した出来事で、1620年のこと。
      現在のマサチューセッツに上陸した。
      上陸前に交わされた自治の誓約が、建国の物語の一部になっている。

      乗船者の一部は、国教会から分離した信仰の集団だった。
      オランダへ亡命していたが、子どもが現地の文化に馴染むことを恐れ、新大陸への移住を選ぶ。
      残りは、経済的な機会を求める人々である。
      航海は66日に及んだ。
      目的地はヴァージニアだったが、暴風で北へ流される。

      予定外の場所に着いたため、会社の特許状の効力が及ばない。
      上陸前に、男性の乗客が文書に署名した。
      公正で平等な法を作り、それに従うことを互いに誓う内容である。
      最初の冬に、半数が死亡した。
      生き延びたのは、先住民の助けによるところが大きい。
      トウモロコシの栽培を教わり、交易と和平の協定も結ばれた。
      翌年の収穫を祝った宴が、感謝祭の起源とされる。

      和平は数十年続いたが、入植地の拡大とともに崩れ、戦争になった。
      この誓約は、統治が人々の合意にもとづくという考え方を示す文書として引かれてきた。
      建国の神話として語られる一方、先住民の側から見た歴史の見直しも進んでいる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7a/Mayflower_in_Plymouth_Harbor%2C_by_William_Halsall.jpg/500px-Mayflower_in_Plymouth_Harbor%2C_by_William_Halsall.jpg
      credit: ウィリアム・ハルソール / Public domain
      page: https://commons.wikimedia.org/wiki/File:Mayflower_in_Plymouth_Harbor,_by_William_Halsall.jpg
    links:
