        url: https://ja.wikipedia.org/wiki/ソビエト連邦の崩壊

  - id: eu-eastern-enlargement
    year: 2004
    title: EUの東方拡大
    category: politics
    tags: [東欧, ヨーロッパ]
    summary: 旧東側の8か国が加盟し、ヨーロッパの東西の境が引き直された。
    detail: |
      EUに中東欧の国々が加盟した出来事で、2004年のこと。
      一度に10か国が加わり、そのうち8か国が旧東側である。
      ヨーロッパの東西の境が引き直された。

      冷戦の終結後、これらの国は体制の転換を進めていた。
      市場経済への移行、民主的な制度の確立、法の整備が課題である。
      EUは加盟の条件を定めた。
      民主主義と法の支配、市場経済の機能、EUの法体系の受け入れである。
      各国は数万ページに及ぶ規則を国内法に取り込む作業を行った。

      2004年5月、ポーランド、チェコ、ハンガリー、スロヴァキア、スロヴェニア、バルト三国、そしてキプロスとマルタが加盟する。
      2007年にはルーマニアとブルガリアが続いた。
      加盟国は25から27に増え、人口は1億以上増加する。
      効果は大きい。
      投資が流入し、経済は成長した。
      人の移動の自由によって、西欧で働く人が増える。
      一方、送り出す側では人材の流出が問題になった。

      多くの国はNATOにも加盟し、安全保障の枠組みも変わる。
      ロシアはこれを自国の安全への脅威とみなしてきた。
      近年、一部の加盟国で司法の独立をめぐる対立も起きている。
      統合の拡大が何をもたらしたかは、なお検証の途上にある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/EU_map_brown.svg/500px-EU_map_brown.svg.png
      credit: Ssolbergj / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:EU_map_brown.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/欧州連合加盟国

  - id: ukraine-invasion
    year: 2022
    title: ロシアのウクライナ侵攻
    category: war
    tags: [ロシア, ウクライナ]
    summary: 冷戦後のヨーロッパの秩序が崩れ、各国が安全保障を根本から見直した。
    detail: |
      ロシアがウクライナに全面的な侵攻を開始した出来事で、2022年2月24日のこと。
      冷戦後のヨーロッパの秩序が崩れ、各国が安全保障を根本から見直した。

      前史がある。
      2014年、ウクライナで親ロシアの大統領が失脚すると、ロシアはクリミアを併合した。
      東部でも親ロシアの武装勢力が支配地域を作り、戦闘が続く。
      2021年から、国境に軍が集結した。
      ロシアはNATOの不拡大を要求し、交渉は決裂する。
      2月24日、複数の方面から侵攻が始まった。
      首都の早期の制圧が意図されたが、抵抗と補給の失敗によって頓挫する。

      ウクライナは各国から武器と資金の支援を受けた。
      当初は防御的な装備に限られていたが、次第に長射程の兵器も供与される。
      ロシアには広範な制裁が課された。
      資産の凍結、技術の輸出の禁止、エネルギーの輸入の削減である。

      影響は世界に及んだ。
      穀物と肥料と天然ガスの価格が高騰し、食糧の安全保障が問題になる。
      フィンランドとスウェーデンがNATOに加盟し、ドイツは防衛政策を転換した。
      占領地では民間人への攻撃と連行が報告されている。
      数百万が国外へ避難した。
      戦争は長期化し、終結の見通しは立っていない。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/2022_Russian_invasion_of_Ukraine.svg/500px-2022_Russian_invasion_of_Ukraine.svg.png
      credit: Viewsridge / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:2022_Russian_invasion_of_Ukraine.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ロシアのウクライナ侵攻
