        url: https://ja.wikipedia.org/wiki/農奴解放令

  - id: war-and-peace
    year: 1869
    title: トルストイ『戦争と平和』
    category: culture
    tags: [ロシア, 文学]
    summary: 19世紀ロシア文学の頂点。歴史を動かすのは誰かという問いを小説で扱った。
    detail: |
      トルストイが著した長編小説で、1869年に完結した。
      ナポレオン戦争の時期のロシア社会を描く。
      19世紀ロシア文学の頂点とされる。

      5年以上をかけて執筆された。
      登場人物は500人を超え、実在の人物も多数含まれる。
      物語は、複数の貴族の家族の生活を軸に進む。
      舞踏会、狩り、結婚、農村の経営といった日常と、戦場の場面が交互に描かれた。
      特徴の一つは、戦争の描き方である。
      英雄的な行為ではなく、混乱と偶然と恐怖が前面に出る。
      指揮官の命令は前線に届かず、戦況は誰にも把握できない。

      もう一つの特徴は、歴史をどう捉えるかという問いである。
      作中で、歴史を動かすのは偉大な個人ではないと繰り返し論じられる。
      無数の人々の意思の総和が結果を生むのであり、ナポレオンも歴史の流れに乗っていただけだという主張である。
      小説の終わりには、この歴史論が長く展開される。

      作者自身は、これを小説と呼ぶことを拒んだ。
      既存の形式に当てはまらないと考えたためである。
      農民の生活への関心は、後の作者の思想の転回にもつながる。
      膨大な資料の調査にもとづいており、歴史の叙述としても読まれてきた。
      各国語に訳され、繰り返し映像化されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Tolstoy_-_War_and_Peace_-_first_edition%2C_1869.jpg/500px-Tolstoy_-_War_and_Peace_-_first_edition%2C_1869.jpg
      credit: レフ・トルストイ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tolstoy_-_War_and_Peace_-_first_edition,_1869.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/戦争と平和

  - id: alexander2-assassinated
    year: 1881
    title: アレクサンドル2世の暗殺
    category: politics
    tags: [ロシア]
    summary: 改革を進めた皇帝が革命家に殺され、以後は反動政治に傾いた。
    detail: |
      ロシア皇帝アレクサンドル2世が爆弾によって殺害された出来事で、1881年3月のこと。
      改革を進めた皇帝が革命家に殺された。
      以後、政治は反動へ傾く。

      農奴解放をはじめとする改革は、不徹底とみなされていた。
      土地の問題は解決せず、政治的な自由も認められない。
      1870年代、知識人が農村へ入って啓蒙する運動が起きた。
      しかし農民の支持は得られず、多くが逮捕される。
      この挫折の後、一部が暴力による変革へ傾いた。

      人民の意志と名乗る組織が、皇帝の暗殺を決定する。
      列車の爆破、宮殿の食堂への爆弾など、複数回の試みが失敗した。
      1881年3月1日、馬車の列に爆弾が投げられた。
      皇帝は無事だったが、負傷者を気遣って車を降りる。
      そこへ第二の爆弾が投げられ、致命傷を負った。

      同じ日、地方の代表を立法に関与させる案を承認していた。
      憲法へ向かう第一歩になりえたが、実現しない。
      後継者は改革を中止し、専制の強化と統制を進めた。
      暗殺は体制を変えず、むしろ抑圧を強める結果になる。
      一方、暴力による変革という手法は、後の革命運動に受け継がれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/Zar_Alexander_II_%28cropped%29_%28cropped%29.jpg/500px-Zar_Alexander_II_%28cropped%29_%28cropped%29.jpg
      credit: Attributed to ウィリアム・ダウニー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Zar_Alexander_II_(cropped)_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アレクサンドル2世_(ロシア皇帝)

  - id: trans-siberian
    year: 1891
    title: シベリア鉄道の着工
    category: economy
    tags: [ロシア, 鉄道]
    summary: 9000キロを結ぶ大動脈。極東進出を可能にし、日露戦争の背景にもなった。
    detail: |
      モスクワと極東を結ぶ鉄道の建設が始まった出来事で、1891年のこと。
      全長は9000キロを超える。
      極東への進出を可能にし、日露戦争の背景にもなった。

      構想は19世紀半ばからあった。
      広大なシベリアは、夏は泥、冬は雪に閉ざされ、移動に数か月を要する。
      建設は東西の両端から同時に進められた。
      凍土、河川、山地が障害になり、多数の橋とトンネルが必要になる。
      労働には、囚人と兵士、中国からの出稼ぎ労働者が動員された。

      1904年、バイカル湖の周囲を除いて開通する。
      それまでは湖を船で渡り、冬は氷の上に線路を敷いていた。
      目的は複数ある。
      資源の開発と移民の促進、そして軍事的な輸送である。
      極東への進出が現実的になり、満洲を横断する短絡線も敷設された。
      この進出が日本との対立を生み、日露戦争につながる。
      戦争の時点では複線化が終わっておらず、輸送力が不足したことが敗因の一つになった。

      移住も進んだ。
      数百万の農民がシベリアへ移り、農地が開かれる。
      現在も運行されており、全線の乗車には一週間ほどかかる。
      国土を物理的に結びつけた事業である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/VL_85-022_container_train.jpg/500px-VL_85-022_container_train.jpg
      credit: Sorovas / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:VL_85-022_container_train.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シベリア鉄道

  - id: bloody-sunday
    year: 1905
    title: 血の日曜日事件と第一次ロシア革命
    category: society
    tags: [ロシア, 革命]
    summary: 皇帝への請願行進への発砲が、体制への信頼を崩した。
    detail: |
      ロシアで労働者の請願行進に軍が発砲した事件と、それに続く革命で、1905年のこと。
      皇帝への信頼が崩れ、体制の動揺が始まった。

      1月9日、司祭ガポンが率いる行進が宮殿へ向かった。
      参加者は数万人で、皇帝の肖像とイコンを掲げ、家族連れも多い。
      請願の内容は穏健だった。
      8時間労働、賃金の引き上げ、そして議会の開設である。
      皇帝は民の苦しみを知らないだけだという前提に立っていた。

      軍が発砲した。
      死者は公式には130人とされるが、実際には数百に及ぶとみられる。
      皇帝はこの日、首都にいなかった。
      影響は決定的だった。
      慈悲深い父としての皇帝という観念が崩れる。
      ストライキが全国に広がり、農村では地主の屋敷が襲われた。
      戦艦ポチョムキンの反乱も起きる。

      各地に労働者の評議会が作られた。
      これが後の革命の組織の原型になる。
      10月、皇帝は詔書を出して議会の開設と市民的自由を約束した。
      革命は収まるが、議会の権限は限られ、たびたび解散される。
      土地の問題も未解決のまま残った。
      1905年の経験は、12年後の革命の予行として位置づけられている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/血の日曜日事件

  - id: russian-revolution
    year: 1917
    title: ロシア革命
    category: society
    tags: [ロシア, 革命]
    summary: 帝政が倒れ、世界で初めて社会主義を掲げる政権が生まれた。
    detail: |
      ロシアで帝政が倒れ、社会主義を掲げる政権が生まれた出来事で、1917年のこと。
      2月と10月の二つの段階からなる。

      第一次世界大戦で、ロシアは甚大な損害を受けていた。
      食糧と燃料が不足し、都市の生活は行き詰まる。
      2月、首都でパンを求める行進が起きた。
      女性労働者の日のデモが発端である。
      軍が鎮圧を拒んで同調し、数日で体制は崩れた。
      皇帝は退位し、300年の王朝が終わる。

      臨時政府が成立したが、労働者と兵士の評議会も並立した。
      二重権力と呼ばれる状態である。
      臨時政府が戦争の継続を選んだことが、支持を失わせた。
      亡命から戻ったレーニンは、すべての権力をソヴィエトへと訴える。
      10月、ボリシェヴィキが武装蜂起によって政権を奪った。
      直ちに土地の私有の廃止と、大戦からの離脱を宣言する。
      翌年、ドイツと講和し、広大な領土を失う条件を受け入れた。

      労働者の国家という実験は、各国の政治に影響を与え続けた。
      資本主義の側にも、社会保障を急がせる圧力になる。
      一方、内戦と統制のなかで、党が国家を支配する体制が固まった。
      その構造は70年続くことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Batum_demonstration_1917_%282%29.jpg/500px-Batum_demonstration_1917_%282%29.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Batum_demonstration_1917_(2).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ロシア革命

  - id: holodomor
    year: 1932
    title: ホロドモール（ウクライナ飢饉）
    category: disaster
    tags: [ソ連, 飢饉]
    summary: 強制的な穀物徴発で数百万人が餓死。ウクライナは今も虐殺と位置づけている。
    detail: |
      ウクライナを中心に起きた大飢饉で、1932年から翌年にかけて最も深刻だった。
      数百万が餓死したとされる。
      ウクライナは現在、これを民族に対する虐殺と位置づけている。

      原因は、農業の強制的な集団化と穀物の徴発である。
      農民は土地と家畜を共同の農場に供出させられ、抵抗した者は富農として流刑にされた。
      工業化の資金を得るため、穀物の輸出が続けられた。
      計画の達成のため、種もみまで取り立てられる。

      1932年、収穫が落ち込むなかでも徴発の目標は引き下げられなかった。
      達成できない村は、食料品の供給を止める罰を受ける。
      農民の移動も禁じられた。
      食を求めて都市へ出ることができず、村に閉じ込められたまま餓死した。
      死者の推計は300万から500万に及ぶ。
      カザフスタンやロシア南部でも同時に飢饉が起きている。
      当時、ソ連政府は飢饉の存在を否定し、外国への報道も統制された。

      意図をめぐる議論がある。
      ウクライナの民族を標的にしたとする立場と、体制全体の政策の結果とする立場が対立する。
      30を超える国がこれを虐殺として認定した。
      記憶の扱いは、現在の政治とも深く結びついている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/Famine_Kharkov_1933.jpg/500px-Famine_Kharkov_1933.jpg
      credit: アレキサンダー・ウィーナーベルガー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Famine_Kharkov_1933.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ホロドモール

  - id: great-purge
    year: 1937
    title: 大粛清
    category: society
    tags: [ソ連, 独裁]
    summary: 党幹部から軍人、一般市民まで大量に処刑・収容され、社会が恐怖で縛られた。
    detail: |
      ソ連で大規模な弾圧が行われた時期で、1937年から翌年に頂点に達した。
      党の幹部から軍人、一般市民までが逮捕され、処刑または収容所へ送られた。

      始まりは1934年の党幹部の暗殺事件である。
      これを口実に、陰謀の摘発が進められた。
      1936年から、公開の裁判が行われた。
      革命の指導者たちが、外国の諜報機関と通じていたと自ら認める。
      拷問と家族への脅迫による自白であることが、後に明らかになった。

      軍への打撃も大きい。
      元帥の大半と、将官の多数が処刑される。
      独ソ戦の初期の敗北の一因とされる。
      地方には逮捕と処刑の人数の割当が下された。
      目標を超えて実績を上げようとする競争が起き、密告が奨励される。
      隣人や同僚を告発することで身を守ろうとする行動が広がった。

      逮捕された者の家族も、反逆者の親族として扱われる。
      処刑された人数は少なくとも68万とされ、収容所へ送られた者はそれをはるかに上回る。
      社会は恐怖によって縛られた。
      意見を述べること自体が危険であり、記録も残らない。
      1956年、フルシチョフが党の大会でこれを批判した。
      犠牲者の名誉回復が始まるが、全容の解明は現在も続いている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/9/9c/Stalin_Image.jpg
      credit: Self / Public domain
      page: https://commons.wikimedia.org/wiki/File:Stalin_Image.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大粛清

  - id: operation-barbarossa
    year: 1941
    title: 独ソ戦の開始
    category: war
    tags: [ソ連, ドイツ]
    summary: 第二次世界大戦最大の戦場となり、ソ連だけで2700万人が犠牲になった。
    detail: |
      ドイツがソ連へ侵攻した出来事で、1941年6月22日のこと。
      第二次世界大戦の最大の戦場が開かれた。
      ソ連だけで2700万人が犠牲になる。

      両国は1939年に不可侵条約を結び、ポーランドを分割していた。
      しかしヒトラーは当初から東方の征服を構想しており、条約は時間稼ぎである。
      300万を超える兵が三方面から進撃した。
      史上最大規模の侵攻である。
      ソ連側は奇襲を受けた。
      警告は届いていたが、スターリンは挑発とみなして信じない。
      初期の数か月で、数百万が捕虜になった。

      この戦争は、通常の戦争とは性格が異なる。
      人種の理論にもとづく絶滅の戦争として構想された。
      政治委員の即時射殺が命じられ、捕虜は意図的に餓死させられる。
      占領地ではユダヤ人の大量殺害が行われた。

      モスクワの手前で進撃は止まった。
      泥と冬、そして極東から移された部隊の反撃による。
      レニングラードは900日にわたり包囲され、100万を超える市民が餓死した。
      1942年から翌年のスターリングラードで戦局が転換する。
      以後、ソ連軍は押し返し、1945年にベルリンへ到達した。
      犠牲の規模は、他のどの戦線とも比較にならない。
    image:
