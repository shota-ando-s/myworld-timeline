  - id: stalingrad
    year: 1942
    title: スターリングラード攻防戦
    category: war
    tags: [ソ連, ドイツ]
    summary: ドイツ軍の敗北で東部戦線の流れが変わり、大戦全体の転換点になった。
    detail: |
      ヴォルガ河畔の都市をめぐる戦いで、1942年から翌年まで続いた。
      ドイツ軍の敗北によって東部戦線の流れが変わる。
      大戦全体の転換点とされる。

      ドイツは南方の油田を目標としており、その側面を守るためにこの都市を攻略しようとした。
      指導者の名を冠した都市であることも、双方にとって象徴的な意味を持つ。
      夏から秋にかけて、市街は空爆と砲撃で瓦礫になった。
      戦闘は建物ごと、部屋ごとに行われる。
      一つの工場や駅をめぐって何度も攻守が入れ替わった。
      ネズミの戦争と呼ばれる。

      ソ連軍は、ヴォルガ川の対岸から補給を続けながら市街の一部を保ち続けた。
      11月、ソ連軍が両翼から反攻に出た。
      側面を守っていた枢軸国の部隊が突破され、市内のドイツ第6軍が包囲される。

      撤退の許可は出されなかった。
      空からの補給も足りず、30万近い軍が飢えと寒さのなかで消耗する。
      1943年2月、司令官が降伏した。
      捕虜になった9万人のうち、戦後に帰国できたのは数千人である。
      この敗北の後、ドイツは東部で守勢に回った。
      中立国の態度も変わり、戦争の帰趨が見え始める。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/%D0%A4%D0%BE%D0%BD%D1%82%D0%B0%D0%BD_%C2%AB%D0%94%D0%B5%D1%82%D1%81%D0%BA%D0%B8%D0%B9_%D1%85%D0%BE%D1%80%D0%BE%D0%B2%D0%BE%D0%B4%C2%BB.jpg/500px-%D0%A4%D0%BE%D0%BD%D1%82%D0%B0%D0%BD_%C2%AB%D0%94%D0%B5%D1%82%D1%81%D0%BA%D0%B8%D0%B9_%D1%85%D0%BE%D1%80%D0%BE%D0%B2%D0%BE%D0%B4%C2%BB.jpg
