lane: east-europe

periods:
  - id: kievan-rus
    title: キエフ・ルーシ
    start: 882
    end: 1240
    category: politics
    tags: [ロシア, ウクライナ]
    summary: 東スラヴ最初の国家。ビザンツからキリスト教と文字を受け取った。
    detail: |
      東スラヴ最初の国家で、9世紀末から13世紀半ばまで続いた。
      キエフを中心とし、ビザンツからキリスト教と文字を受け取った。

      ドニエプル川の水系を押さえ、北欧とビザンツを結ぶ交易路を基盤とした。
      毛皮、蜜、蝋、奴隷が南へ運ばれ、絹、香料、貨幣が北へ流れる。
      君主は大公と呼ばれ、諸都市に一族を配置して統治した。
      都市には集会があり、重要な決定に関与する。

      988年、ウラジーミル1世がビザンツの正教を受け入れた。
      キリル文字が伝えられ、教会スラヴ語で典礼と文献が記される。
      石造の聖堂が建てられ、イコンの様式も受け継がれた。
      ヤロスラフの時代に最盛期を迎える。
      最初の法典が編まれ、娘たちが各国の王家に嫁いだ。

      問題は継承の方式にあった。
      領土が一族の共有とされ、兄弟や子に分けて与えられる。
      都市ごとに公が立ち、争いが絶えなかった。
      12世紀には事実上分裂し、北東のウラジーミルへ重心が移る。
      1240年、モンゴル軍によってキエフは破壊された。
      国家は消滅し、以後の歴史はモスクワ、リトアニア、ポーランドの枠組みへ分かれていく。
      この国家の継承をめぐる議論は、現在の政治にも影を落としている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f1/Location_of_Kyivan_Rus.png/500px-Location_of_Kyivan_Rus.png
      credit: Vitaliyf261 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Location_of_Kyivan_Rus.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/キエフ・ルーシ

  - id: novgorod
    title: ノヴゴロド共和国
    start: 1136
    end: 1478
    category: economy
    tags: [ロシア, 交易]
    summary: 市民集会が公を選んだ商業都市。北方交易でハンザ同盟と結んだ。
    detail: |
      ルーシ北部の商業都市が築いた国家で、1136年から1478年まで続いた。
      市民の集会が公を選び、招き、追放した。
      北方の交易でハンザ同盟と結ばれた。

      1136年、市民が公を追放したことが自立の起点とされる。
      以後、公は軍の指揮者として招かれる存在になり、行政と司法は市民の側が握った。
      意思決定は、ヴェーチェと呼ばれる集会で行われた。
      鐘を鳴らして市民を集め、叫び声の大きさで可否を決めたと伝えられる。
      市長と大司教も選挙で選ばれる。
      ただし実際には、有力な商人と地主の一族が主導していた。

      経済の基盤は毛皮である。
      北方の広大な地域から毛皮、蜜、蝋が集められ、バルト海を通じて西欧へ運ばれた。
      ハンザ同盟の商館が置かれ、西欧との交易が日常的に行われる。
      モンゴルの侵攻を直接には受けなかった。
      沼沢地に守られたためとされる。
      代わりに貢納を納め、西からのドイツ騎士団とスウェーデンの進出はアレクサンドル・ネフスキーが撃退した。

      白樺の樹皮に書かれた文書が大量に出土している。
      売買、借金、手紙、学習の練習まであり、識字が広く普及していたことを示す。
      1478年、モスクワに併合された。
      集会の鐘は外されてモスクワへ運ばれる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/63/Novgorod1400.png/500px-Novgorod1400.png
      credit: Gabagool / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:Novgorod1400.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ノヴゴロド公国

  - id: mongol-yoke
    title: タタールのくびき
    start: 1240
    end: 1480
    category: politics
    tags: [ロシア, モンゴル]
    summary: ルーシ諸公がキプチャク・ハン国に従属した240年。西欧との距離が開いた。
    detail: |
      ルーシ諸公国がモンゴル系のキプチャク・ハン国に従属した時期で、1240年から1480年まで続いた。
      240年に及ぶこの状態は、くびきと呼ばれる。
      西欧との距離が開くことになった。

      1237年からの侵攻で、諸都市は次々に破壊された。
      1240年にキエフが陥落し、抵抗は組織的には終わる。
      支配の形は、直接の統治ではない。
      諸公は自らの領地に留まり、ハンから承認の証を受けて統治した。
      貢納を納め、軍の要請に応じる義務を負う。

      この仕組みが、公どうしの競争を生んだ。
      ハンの信任を得た者が他を制する構造であり、モスクワの公はこれを巧みに利用する。
      貢納の取りまとめを任され、その過程で財と権威を蓄えた。
      正教会は免税の特権を得て、支配下でも影響力を保つ。

      影響については議論がある。
      西欧のルネサンスと大学の発展から切り離されたこと、専制的な統治の様式が定着したことが指摘される。
      一方、行政と徴税の仕組み、駅伝の制度が受け継がれた面もある。
      14世紀からハン国が分裂して弱まり、1380年にモスクワが戦いで勝利した。
      1480年、貢納の拒否によって従属は終わる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Greater_Coat_of_Arms_of_the_Russian_Empire.svg/500px-Greater_Coat_of_Arms_of_the_Russian_Empire.svg.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Greater_Coat_of_Arms_of_the_Russian_Empire.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/タタールのくびき

  - id: grand-duchy-moscow
    title: モスクワ大公国
    start: 1283
    end: 1547
    category: politics
    tags: [ロシア]
    summary: 徴税の代行役から始まり、諸公国をまとめ上げてロシアの中核になった。
    detail: |
      モスクワを中心とする国家で、13世紀末から1547年まで続いた。
      徴税の代行から始まり、諸公国をまとめてロシアの中核になった。

      当初は小さな公国にすぎない。
      森に囲まれた位置は、草原からの襲撃を受けにくいという利点があった。
      台頭の鍵は、ハン国との関係である。
      14世紀、モスクワの公はハンの信任を得て、諸公からの貢納の取りまとめを任された。
      その過程で財を蓄え、周辺の領地を買い取り、婚姻によって影響を広げる。

      正教会の府主教座がモスクワへ移されたことも、権威を高めた。
      1380年、クリコヴォでモンゴル軍を破る。
      支配は続いたが、モスクワが諸公の先頭に立つことが示された。
      イヴァン3世の代に決定的な変化が起きた。
      ノヴゴロドを併合し、1480年に貢納を拒んで従属を終わらせる。
      ビザンツ最後の皇帝の姪と結婚し、双頭の鷲を紋章に採用した。
      統治では、土地を軍役と引き換えに与える制度が整えられる。

      1547年、イヴァン4世がツァーリの称号を用いて戴冠した。
      以後はロシア・ツァーリ国と呼ばれる。
      辺境の小国が200年余りで東欧の大国になった過程である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/f/f2/Seal_of_Ivan_3_%28obverse%29.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Seal_of_Ivan_3_(obverse).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モスクワ大公国

  - id: polish-lithuanian
    title: ポーランド・リトアニア
    start: 1385
    end: 1795
    category: politics
    tags: [ポーランド, 東欧]
    summary: 一時は東欧最大の国家。貴族の自由が強すぎて統治が行き詰まり、分割で消えた。
    detail: |
      ポーランド王国とリトアニア大公国が結んだ連合国家で、1385年の合同から1795年まで続いた。
      一時は東欧最大の領域を持った。
      貴族の自由が極端に強まり、統治が行き詰まって分割で消える。

      始まりは婚姻による合同である。
      リトアニア大公がポーランドの女王と結婚し、カトリックに改宗して王位に就いた。
      1569年の合同によって、一つの国家として統合される。
      領域は、バルト海から黒海に迫る広さに達した。
      ポーランド人、リトアニア人、ルーシ人、ドイツ人、ユダヤ人、タタール人が暮らす多民族の国家である。
      宗教的にも寛容で、各地で迫害を受けた人々を受け入れた。

      政治の特徴は貴族の権力にある。
      国王は選挙で選ばれ、権限は制限された。
      議会では、一人の議員の反対で議決を無効にできる制度が用いられる。
      これが後に濫用され、立法が機能しなくなった。

      17世紀、スウェーデン、ロシア、オスマンとの戦争で国土が荒廃する。
      1683年にはウィーンを救援したが、国力は回復しない。
      18世紀後半、改革が試みられた。
      1791年には近代的な憲法が制定される。
      しかし周辺の三国による分割が進み、1795年に国家は消滅した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0c/Chor%C4%85giew_kr%C3%B3lewska_kr%C3%B3la_Zygmunta_III_Wazy.svg/500px-Chor%C4%85giew_kr%C3%B3lewska_kr%C3%B3la_Zygmunta_III_Wazy.svg.png
      credit: "Olek Remesz (wiki-pl: Orem, commons: Orem) / CC BY-SA 2.5"
      page: https://commons.wikimedia.org/wiki/File:Chor%C4%85giew_kr%C3%B3lewska_kr%C3%B3la_Zygmunta_III_Wazy.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ポーランド・リトアニア共和国

  - id: tsardom-russia
    title: ロシア・ツァーリ国
    start: 1547
    end: 1721
    category: politics
    tags: [ロシア]
    summary: イヴァン4世がツァーリを称し、シベリアへ拡大していった。
    detail: |
      イヴァン4世がツァーリを称してから、ピョートル1世が帝国を宣言するまでの時期で、1547年から1721年まで。
      シベリアへの拡大が進んだ。

      ツァーリは皇帝を意味し、ビザンツとモンゴルの双方の君主の称号に由来する。
      イヴァン4世は、カザンとアストラハンのハン国を併合した。
      ヴォルガ川の全域が支配下に入り、東への道が開かれる。

      1581年から、コサックの部隊がシベリアへ進んだ。
      毛皮を求める東進は速く、60年ほどで太平洋岸に到達する。
      要塞が河川に沿って築かれ、先住民から毛皮の貢納が取り立てられた。
      国内では、農民の移動の自由が段階的に奪われた。
      17世紀半ばの法典によって、農奴制が法的に確立する。

      1598年に王朝が断絶すると、動乱時代に入った。
      飢饉、偽の皇帝の出現、ポーランドとスウェーデンの介入が重なり、国家は崩壊寸前になる。
      1613年、ロマノフ家の若者が推されて新王朝が始まった。
      17世紀半ば、ウクライナのコサックが保護を求めてロシアに帰属する。
      ポーランドとの戦争を経て、左岸ウクライナを獲得した。
      教会の改革では、儀礼の修正に反対する古儀式派が分離する。
      この分裂は現在まで続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/Flag_of_Russia_%281668%E2%80%931693%29.svg/500px-Flag_of_Russia_%281668%E2%80%931693%29.svg.png
      credit: Milop (talk) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Russia_(1668%E2%80%931693).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ロシア・ツァーリ国

  - id: time-of-troubles
    title: 動乱時代
    start: 1598
    end: 1613
    category: war
    tags: [ロシア, 混乱]
    summary: 王朝断絶と飢饉と外国の介入が重なり、国家が崩壊寸前まで行った15年。
    detail: |
      ロシアで王朝の断絶、飢饉、外国の介入が重なった時期で、1598年から1613年まで続いた。
      国家が崩壊寸前まで行った15年である。

      イヴァン4世の子が跡継ぎなく没し、リューリク朝は断絶した。
      義兄のボリス・ゴドゥノフが選ばれて君主になる。
      1601年からの3年間、気候の異変によって大飢饉が起きた。
      作物が実らず、数十万が餓死したとされる。
      火山の噴火による寒冷化が原因という説がある。

      混乱のなか、イヴァン4世の末子を名乗る人物が現れた。
      その子は幼くして死亡していたが、生きていたと主張する。
      ポーランドの支援を受けて進軍し、ゴドゥノフの急死後にモスクワへ入って即位した。
      1年足らずで殺害される。
      以後、複数の僭称者が現れた。
      各地で反乱が起き、農民と奴隷の蜂起も広がる。
      ポーランドが軍を進めてモスクワを占領し、その王子を君主に立てようとした。
      スウェーデンも北方を占領する。

      1611年から、地方の都市が義勇軍を組織した。
      商人ミーニンと公ポジャルスキーが率いる軍が、1612年にモスクワを解放する。
      翌年、全国の身分の代表が集まり、16歳のミハイル・ロマノフを選出した。
      王朝は1917年まで続く。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/Tushino.jpg/500px-Tushino.jpg
      credit: セルゲイ・イワノフ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tushino.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/動乱時代

  - id: great-northern-war
    title: 大北方戦争
    start: 1700
    end: 1721
    category: war
    tags: [ロシア, スウェーデン]
    summary: バルト海の覇権を奪い、ロシアがヨーロッパの大国として認められた戦争。
    detail: |
      ロシアとスウェーデンが戦った戦争で、1700年から1721年まで21年続いた。
      バルト海の覇権が移り、ロシアが大国として認められた。

      当時、スウェーデンはバルト海を囲む領域を支配する強国だった。
      ロシア、デンマーク、ポーランドが同盟を結び、若い国王カール12世の即位を機に開戦する。
      緒戦でスウェーデンが圧倒した。
      ナルヴァの戦いでは、数で大きく劣りながらロシア軍を撃破する。
      ピョートルは軍の再建に取り組んだ。
      教会の鐘を溶かして大砲を作り、徴兵を制度化し、西欧式の訓練を導入する。

      カール12世はポーランドを制圧した後、ロシアへ深く侵攻した。
      ロシアは退却しながら焦土戦術をとり、補給を断つ。
      1709年のポルタヴァの戦いで、スウェーデン軍は壊滅した。
      国王はオスマン帝国へ逃れる。

      以後、戦局は逆転した。
      ロシアはバルト海沿岸を確保し、艦隊を建造して海戦でも勝利する。
      1721年の条約で、スウェーデンはバルト海東岸の領土を割譲した。
      スウェーデンの大国の時代は終わり、ロシアが取って代わる。
      同じ年、ピョートルは皇帝の称号を受けた。
      ロシア帝国の始まりである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Great_Northern_War.jpg/500px-Great_Northern_War.jpg
      credit: Otto August Mankell (1838–1885); Johan Henrik Schildt (1678–1732); Pierre-Denis Martin (1663–1742); Magnus Rommel (1676–1735); Maurice Baquoi (1680–1747) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Great_Northern_War.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大北方戦争

  - id: russian-empire
    title: ロシア帝国
    start: 1721
    end: 1917
    category: politics
    tags: [ロシア]
    summary: ピョートル1世の西欧化以降、ヨーロッパの大国として振る舞った。
    detail: |
      ピョートル1世の宣言から革命までのロシアの国家で、1721年から1917年まで続いた。
      ヨーロッパの大国として振る舞い、領域を大きく広げた。

      帝国の宣言は、大北方戦争の勝利を受けてのものである。
      18世紀、エカチェリーナ2世の時代に版図は大きく伸びた。
      オスマン帝国との戦争で黒海沿岸とクリミアを得て、ポーランドの分割に加わる。
      東ではアラスカにまで進出した。

      19世紀、ナポレオンの侵攻を退けたことでヨーロッパの秩序の主役になる。
      一方、国内では農奴制が続き、工業化は遅れた。
      クリミア戦争の敗北が転機になった。
      後進性が明らかになり、1861年に農奴が解放される。
      司法、軍、地方自治の改革も進められた。

      しかし政治の自由は認められず、テロと弾圧が繰り返される。
      1905年の革命で議会が設けられたが、権限は限られた。
      領内には100を超える民族が暮らし、ロシア化の政策が反発を招いた。
      1904年の日露戦争の敗北、第一次世界大戦での損害と物資の不足が、体制を限界まで追い込む。
      1917年、革命によって皇帝は退位し、帝国は終わった。
      翌年、一家は処刑される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f3/Flag_of_Russia.svg/500px-Flag_of_Russia.svg.png
      credit: Peter the Great / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Russia.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ロシア帝国

  - id: russian-civil-war
    title: ロシア内戦
    start: 1917
    end: 1922
    category: war
    tags: [ロシア, 革命]
    summary: 赤軍と白軍の戦いに各国が干渉。飢餓と合わせて数百万人が亡くなった。
    detail: |
      ロシア革命の後に起きた内戦で、1917年から1922年まで続いた。
      赤軍と白軍が戦い、各国が干渉した。
      戦闘と飢餓で数百万が死亡する。

      ボリシェヴィキが権力を握ると、これに反対する勢力が各地で蜂起した。
      旧軍の将校、コサック、社会主義の他党派、民族主義の勢力が加わる。
      白軍と総称されるが、統一した指導部は持たなかった。
      イギリス、フランス、アメリカ、日本などが干渉軍を送った。
      対独戦線の維持と、革命の波及の阻止が目的である。
      日本はシベリアへ7万を超える兵を派遣した。
      赤軍はトロツキーの指導で編成された。
      旧軍の将校を政治委員の監視のもとで登用し、規律を徹底する。

      経済では戦時共産主義がとられた。
      農民から穀物が強制的に徴発され、商業が禁じられる。
      生産は激減し、都市では飢餓が広がった。

      両陣営がテロを行い、多数の市民が犠牲になる。
      1920年までに白軍は敗れ、干渉軍も撤退した。
      1921年、水兵の反乱を機に経済政策が転換される。
      一定の商業を認める新経済政策が導入された。
      1922年、ソヴィエト連邦が成立する。
      内戦の経験が、党と軍の体制を強く規定することになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3b/CWRArticleImage.jpg/500px-CWRArticleImage.jpg
      credit: User:Yanachka / Public domain
      page: https://commons.wikimedia.org/wiki/File:CWRArticleImage.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ロシア内戦

  - id: soviet-union
    title: ソヴィエト連邦
    start: 1922
    end: 1991
    category: politics
    tags: [ロシア, 社会主義]
    summary: 世界初の社会主義国家。冷戦期は米国と並ぶ超大国だった。
    detail: |
      1922年から1991年まで存在した社会主義の連邦国家。
      15の共和国からなり、面積は世界最大だった。
      冷戦期はアメリカと並ぶ超大国である。

      革命と内戦を経て成立した。
      形式は共和国の連邦だが、実際には共産党が一元的に指導する体制である。
      1920年代末から、計画経済が本格化した。
      5年ごとの計画によって重工業に資源が集中され、農業は集団化される。
      短期間で工業国に転換したが、飢饉と粛清によって膨大な犠牲が出た。

      第二次世界大戦では、独ソ戦が最大の戦場になった。
      ソ連の死者は2700万に及ぶ。
      勝利の後、東欧に影響圏を築いた。
      冷戦では、核と宇宙の開発で米国と競う。
      最初の人工衛星と有人宇宙飛行を実現した。

      1960年代以降、経済は停滞する。
      消費財は不足し、技術の革新も遅れた。
      計画経済の非効率と、軍事への過剰な支出が原因とされる。
      1985年、ゴルバチョフが改革に着手した。
      情報公開と経済の立て直しを進めるが、統制の緩みが各地の独立の動きを加速させる。
      1991年、クーデタの失敗の後に連邦は解体された。
      15の独立国家が生まれる。
      70年続いた実験は、そこで終わった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Flag_of_the_Soviet_Union.svg/500px-Flag_of_the_Soviet_Union.svg.png
      credit: СССР / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_Soviet_Union.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ソビエト連邦

  - id: eastern-bloc
    title: 東側陣営
    start: 1945
    end: 1991
    category: politics
    tags: [冷戦, 東欧]
    summary: 東欧諸国がソ連型の体制に組み込まれ、西側と断絶した46年。
    detail: |
      ソ連の影響下に置かれた東欧諸国の総称で、1945年から1991年まで続いた。
      ソ連型の体制に組み込まれ、西側と断絶した46年である。

      第二次世界大戦の末期、赤軍が東欧を解放した。
      その駐留を背景に、各国で共産党が実権を握っていく。
      連立から始まり、他党派を排除して一党支配へ移る過程がとられた。
      1949年に経済相互援助会議、1955年にワルシャワ条約機構が作られる。
      経済と軍事の両面で統合された。
      体制はソ連を手本とした。
      計画経済、農業の集団化、重工業の優先、秘密警察による統制である。

      抵抗は繰り返し起きた。
      1953年の東ベルリン、1956年のハンガリー、1968年のチェコスロヴァキア、1980年のポーランドである。
      いずれも軍事介入か戒厳令によって抑えられた。
      ソ連は、社会主義共同体の利益のために介入する権利があると主張した。
      1980年代、経済の停滞が深刻になる。
      西側との生活水準の差は広がり、対外債務も膨らんだ。

      1989年、ゴルバチョフが介入しない方針を明確にすると、各国の体制は次々に崩れた。
      数か月のうちに、ほとんどが流血なく交代する。
      1991年、軍事機構とソ連自体が解体された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1b/Warsaw_Pact_Logo.svg/500px-Warsaw_Pact_Logo.svg.png
      credit: Fenn-O-maniC / Public domain
      page: https://commons.wikimedia.org/wiki/File:Warsaw_Pact_Logo.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/東側諸国

  - id: russian-federation
    title: ロシア連邦
    start: 1991
    ongoing: true
    category: politics
    tags: [ロシア, 現代]
    summary: ソ連の後継国家。市場化の混乱を経て資源輸出と強権の国になった。
    detail: |
      ソ連の解体によって成立した国家で、1991年から現在まで続いている。
      市場化の混乱を経て、資源の輸出と強権の国になった。

      ソ連の国際的な地位を引き継ぎ、安全保障理事会の常任理事国と核兵器を保有する。
      1990年代は困難の時期だった。
      価格の自由化と国営企業の民営化が急速に進められ、物価が急騰する。
      国有財産は一部の人物に集中し、新興の財閥が生まれた。
      生産は半減し、平均寿命が低下する。
      1998年には債務の不履行に陥った。

      民族の問題も抱えた。
      チェチェンでの独立の動きに対して二度の戦争が行われる。
      2000年代、状況が変わった。
      石油と天然ガスの価格の上昇によって財政が好転し、生活も改善する。
      同時に、中央への権限の集中が進んだ。
      知事の公選が廃止され、報道機関が国家の影響下に置かれる。

      対外的には、旧ソ連の地域を自国の影響圏とみなす姿勢を強めた。
      2008年のジョージア、2014年のクリミアの併合、2022年のウクライナ侵攻が続く。
      国際的な制裁を受け、経済は中国とインドへの資源の輸出に依存を深めている。
      人口の減少と技術者の流出が、長期の課題になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f3/Flag_of_Russia.svg/500px-Flag_of_Russia.svg.png
      credit: Peter the Great / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Russia.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ロシア

events:
  - id: rurik
    year: 862
    circa: true
    title: リューリクの来住
    category: politics
    tags: [ロシア, ヴァイキング]
    summary: 北欧系の一族がスラヴの地に招かれたと年代記が伝える、ルーシの起点。
    detail: |
      北欧系の一族がスラヴの地に招かれたと年代記が伝える出来事で、862年ごろとされる。
      ルーシの起点として語られてきた。

      12世紀の年代記によれば、諸族は海の向こうのヴァリャーグに貢納していたが、これを追い出した。
      しかし自ら秩序を保てず、争いが続いたため、改めて統治を求める使者を送ったという。
      招かれたリューリクは、二人の兄弟とともに来住した。
      兄弟は数年で没し、彼が単独で支配する。

      ヴァリャーグは、東へ進出した北欧の人々を指す語である。
      彼らはドニエプルとヴォルガの水系を下り、ビザンツとイスラム世界の市場へ毛皮、蜜、奴隷を運んだ。
      交易路の拠点に定住し、在地の社会と混ざり合う。
      この記述の解釈は、18世紀以来の論争になってきた。
      外来の集団が国家を作ったとする立場と、在地の発展を重視する立場が対立する。
      政治的な含意を伴い、現在も議論が続く。

      考古学の資料は、両方の要素を示している。
      北欧様式の墓と品が出土する一方、在地の集落と交易の拠点も発達していた。
      数十年後、一族はキエフを拠点とする国家を築く。
      ロシア、ウクライナ、ベラルーシの歴史の起点として語られる出来事である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/b/b1/Rurik_titularnik.jpg
      credit: collective / Public domain
      page: https://commons.wikimedia.org/wiki/File:Rurik_titularnik.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/リューリク

  - id: rus-christianization
    year: 988
    title: ウラディミル1世のキリスト教受容
    category: religion
    tags: [ロシア, 正教]
    summary: ビザンツ流の正教を国の宗教とし、東スラヴ文化の方向が決まった。
    detail: |
      キエフ大公ウラジーミル1世がビザンツの正教を国の宗教とした出来事で、988年ごろのこと。
      東スラヴの文化の方向が、ここで決まった。

      当時のルーシは多神教の社会だった。
      一方、周囲にはビザンツ、イスラム世界、西方のキリスト教圏があり、いずれと結ぶかは政治の問題でもある。
      年代記は、各宗教の使者を招いて比較した逸話を伝える。
      イスラムは酒を禁じるため退けられ、ユダヤ教は国を失っていることを理由に、西方の教会は典礼の美しさに欠けるとされた。

      実際の決定は、ビザンツとの関係によるとみられる。
      皇帝の反乱の鎮圧を助ける代わりに、その妹を妃として迎える取り決めが結ばれた。
      皇女がキリスト教徒でない者に嫁ぐことはありえないため、洗礼が条件になる。
      受洗の後、都の多神教の像は破壊され、住民はドニエプル川で集団の洗礼を受けた。

      影響は広い。
      教会スラヴ語とキリル文字が導入され、書物と文献の伝統が始まる。
      建築、絵画、音楽の様式がビザンツから受け継がれた。
      法と婚姻の規範も教会を通じて整えられる。
      この選択によって、ルーシは正教の文化圏に属することになった。
      後の西欧との距離も、ここに一つの起点を持つ。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Ukraine-Ivano-Frankivsk-Cathedral_of_Holy_Resurrection-5.jpg/500px-Ukraine-Ivano-Frankivsk-Cathedral_of_Holy_Resurrection-5.jpg
      credit: Alex Zelenko / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Ukraine-Ivano-Frankivsk-Cathedral_of_Holy_Resurrection-5.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウラジーミル1世

  - id: moscow-first-mention
    year: 1147
    title: モスクワが記録に現れる
    category: society
    tags: [ロシア, 都市]
    summary: 森の中の小さな拠点が、300年後には全ルーシの中心になる。
    detail: |
      モスクワの名が記録に現れた出来事で、1147年のこと。
      年代記には、ある公が同盟者を招いて宴を開いた場所として記されている。

      当時のモスクワは、森と川に囲まれた小さな拠点にすぎない。
      キエフからもウラジーミルからも離れた、辺境の地である。
      位置には利点があった。
      複数の河川の水系が近接し、交易路が交わる。
      森と湿地に囲まれ、草原の遊牧民の騎兵が直接に到達しにくい。

      13世紀のモンゴルの侵攻では、ここも焼かれた。
      しかし復興は早く、避難してきた人々が集まる。
      14世紀、モスクワの公はハン国の信任を得て、諸公からの貢納の取りまとめを任された。
      その過程で財を蓄え、周辺の領地を買い取っていく。
      正教会の府主教座が移されたことも、地位を高めた。

      1380年にはモンゴル軍を破り、1480年には貢納を拒んで事実上の独立を果たす。
      1547年、イヴァン4世がツァーリを称した。
      小さな拠点が、300年余りで東スラヴの中心になったことになる。
      最初の記録に現れた年は、現在のモスクワの建都の年とされ、記念の行事が行われている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/MSK_Collage_2015.png/500px-MSK_Collage_2015.png
      credit: AlexTref871 Valeriy1960, DmitriyGuryanov, Aleks G, ProtoplasmaKid, Sergey Korovkin 84, Alvesgaspar / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:MSK_Collage_2015.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モスクワ

  - id: kiev-sack
    year: 1240
    title: モンゴル軍がキエフを攻略
    category: war
    tags: [ロシア, モンゴル]
    summary: ルーシ諸公国が壊滅し、政治の中心が北東のモスクワへ移っていく。
    detail: |
      モンゴル軍がキエフを攻略した出来事で、1240年12月のこと。
      ルーシ諸公国の抵抗は、これによって組織的には終わった。
      政治の中心が北東へ移っていく。

      遠征はバトゥが率いた。
      1237年から冬季に進軍し、凍結した川を道として利用する。
      リャザン、ウラジーミル、モスクワなどが次々に落とされた。
      ルーシの諸公は連携できなかった。
      互いに争っていたため、個別に破られる。

      1240年、キエフが包囲された。
      投石機による攻撃で城壁が崩され、市内での戦闘の末に陥落する。
      住民は虐殺され、聖堂は略奪された。
      避難した人々が集まっていた教会は、その重みで崩れたと伝えられる。

      数年後に通過した教皇の使節は、野には頭蓋骨と骨が散乱し、残る家はわずかだったと記している。
      この後、諸公はハンに服属して統治を認められる形になった。
      キエフの地位は失われ、政治の重心は北東のウラジーミル、次いでモスクワへ移る。
      南西部はやがてリトアニアとポーランドの支配下に入った。
      東スラヴの世界が複数の政治的な枠組みに分かれる起点であり、その後の歴史の分岐を生んだ出来事である。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モンゴルのルーシ侵攻

  - id: battle-on-ice
    year: 1242
    title: 氷上の戦い
    category: war
    tags: [ロシア, ドイツ騎士団]
    summary: 西からのカトリック勢力を退け、ロシアは正教圏として歩むことになった。
    detail: |
      ノヴゴロドの軍がドイツ騎士団を破った戦いで、1242年4月のこと。
      凍結したペイプシ湖の上で行われた。
      西からのカトリック勢力の東進が止まった。

      当時、ルーシは東からモンゴルの侵攻を受けていた。
      その弱体に乗じ、西からはスウェーデンとドイツ騎士団が進出する。
      異教徒と分離した教会への十字軍という名目があった。
      アレクサンドルは、前年にスウェーデン軍をネヴァ川で破っていた。
      騎士団はプスコフを占領し、ノヴゴロドへ迫る。
      アレクサンドルは都市を奪回し、湖上で決戦に臨んだ。

      騎士団は重装の騎士を楔の形に並べて突撃した。
      ノヴゴロド側は中央を薄くして受け止め、両翼から包囲する。
      氷の上で重い装備の騎士は動きが鈍り、隊形を崩された。

      氷が割れて騎士が沈んだという描写は、後世の脚色を含む。
      規模は数千の兵によるものとみられ、年代記の数字には誇張がある。
      それでも、この敗北によって騎士団は東進を断念した。
      ルーシは正教圏として歩むことになる。
      1938年、この戦いを描いた映画が作られた。
      第二次世界大戦の時期に国民的な象徴として用いられ、現在もその像が受け継がれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/Lake_Peipus%2C_LandSat-8%2C_2016-10-20.jpg/500px-Lake_Peipus%2C_LandSat-8%2C_2016-10-20.jpg
      credit: NASA / Public domain
      page: https://commons.wikimedia.org/wiki/File:Lake_Peipus,_LandSat-8,_2016-10-20.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ペイプシ湖

  - id: kulikovo
    year: 1380
    title: クリコヴォの戦い
    category: war
    tags: [ロシア, モンゴル]
    summary: ルーシ連合が初めてモンゴル軍を破り、独立への自信を得た。
    detail: |
      ルーシの連合軍がモンゴル軍を破った戦いで、1380年のこと。
      ドン川の上流の草原で行われた。
      独立への自信を得た出来事とされる。

      14世紀、キプチャク・ハン国は内紛によって弱まっていた。
      実権を握ったママイは、貢納の増額を要求する。
      モスクワ大公ドミートリーはこれを拒んだ。
      諸公国から兵が集められた。
      それまで互いに争っていた勢力が、共通の敵に対して連合した意義は大きい。
      戦いの前、大公は修道院を訪ねて祝福を受けたと伝えられる。
      宗教的な意味づけが与えられ、信仰を守る戦いとして語られた。

      戦闘では、森に伏せた部隊が側面を突いて勝敗を決した。
      大公自身も兵の装備で前線に立ったとされる。
      勝利の代償は大きく、兵の多くが失われた。
      2年後、新たなハンがモスクワを襲って焼き、貢納は再開される。
      従属が終わるのは100年後である。

      それでも、この戦いの記憶は残った。
      モンゴルの軍は破れないという前提が崩れ、モスクワが諸公の先頭に立つ立場を確立する。
      大公はドン川にちなむ名で呼ばれるようになった。
      ロシアの歴史のなかで、国民的な記憶として語られ続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/25/Dmitry_Donskoy_in_the_Battle_of_Kulikovo.jpg/500px-Dmitry_Donskoy_in_the_Battle_of_Kulikovo.jpg
      credit: アドルフ・イヴォン / Public domain
      page: https://commons.wikimedia.org/wiki/File:Dmitry_Donskoy_in_the_Battle_of_Kulikovo.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クリコヴォの戦い

  - id: third-rome
    year: 1472
    title: 「第三のローマ」の自覚
    category: religion
    tags: [ロシア, 正教]
    summary: ビザンツ皇女と結婚したイヴァン3世が、正教世界の後継者を名乗った。
    detail: |
      モスクワが正教世界の後継者を自任する観念が生まれた時期で、1472年前後を起点とする。
      イヴァン3世がビザンツ最後の皇帝の姪と結婚したことがその契機である。

      1453年、コンスタンティノープルがオスマン帝国に陥落した。
      正教を奉じる帝国は消滅し、大部分の正教徒がイスラムの支配下に入る。
      独立した正教の君主は、モスクワの大公だけになった。

      1472年の結婚は、教皇の仲介によるものだった。
      東西教会の合同を期待した提案だが、モスクワ側はこれを受け入れない。
      代わりに、ビザンツの後継という立場が主張された。
      双頭の鷲が紋章に採用され、宮廷の儀礼が整えられる。

      16世紀初め、修道士フィロフェイが大公に宛てた書簡でこの観念を定式化した。
      二つのローマは倒れ、第三のローマが立っている、第四のローマはない、という内容である。
      古代ローマとコンスタンティノープルが信仰を失って滅んだのに対し、モスクワが正統を保つという論理である。
      当初は宗教的な文脈の主張だった。
      やがて国家の使命として解釈され、帝国の拡大を正当化する言葉にもなる。
      19世紀の汎スラヴ主義や、現在の政治の言説にも、この観念は繰り返し現れている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Capitoline_she-wolf_Musei_Capitolini_MC1181.jpg/500px-Capitoline_she-wolf_Musei_Capitolini_MC1181.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Capitoline_she-wolf_Musei_Capitolini_MC1181.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第三のローマ

  - id: great-stand-ugra
    year: 1480
    title: ウグラ川の対峙
    category: politics
    tags: [ロシア]
    summary: モスクワ大公がハンへの貢納を拒み、事実上の独立を果たした。
    detail: |
      モスクワ大公国がキプチャク・ハン国への貢納を拒み、両軍が対峙した出来事で、1480年のこと。
      ウグラ川を挟んで数週間にらみ合い、大きな戦闘のないまま終わった。
      240年の従属が実質的に終わる。

      イヴァン3世は、すでに数年前から貢納を止めていた。
      ハンのアフマドはこれを認めず、リトアニアと結んで討伐の軍を起こす。
      両軍はウグラ川の両岸に布陣した。
      渡河を試みる攻撃は火器によって撃退される。
      モスクワ側は火砲と鉄砲を備えており、これが優位に働いた。

      期待していたリトアニアの援軍は来なかった。
      背後で別の勢力の動きがあり、そちらへ対応する必要が生じたためである。
      季節が進み、川が凍り始めた。
      両軍とも退却し、戦闘は起きないまま終わる。

      モスクワ側の記録は、これを解放として描いた。
      実際には、ハン国はすでに分裂して弱体化しており、従属は形骸化していた。
      象徴的な意味が大きい出来事である。
      翌年、アフマドは別の勢力に殺され、大オルダは崩壊した。
      これ以後、モスクワは主権国家として振る舞う。
      貢納を受け取る側と納める側が逆転し、やがてカザンとアストラハンのハン国を併合していくことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/Facial_Chronicle_-_b.16%2C_p._462_-_Great_standing_on_the_Ugra.jpg/500px-Facial_Chronicle_-_b.16%2C_p._462_-_Great_standing_on_the_Ugra.jpg
