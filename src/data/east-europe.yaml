  - id: sputnik
    year: 1957
    title: スプートニク1号
    category: science
    tags: [ソ連, 宇宙]
    summary: 人類初の人工衛星。米国に衝撃を与え、宇宙開発競争と科学教育改革を招いた。
    detail: |
      ソ連が打ち上げた世界初の人工衛星で、1957年10月のこと。
      直径58センチの金属の球である。
      アメリカに衝撃を与え、宇宙開発の競争を始めた。

      弾道ミサイルの開発から派生した計画である。
      大陸間を飛ぶロケットが実現すれば、衛星の打ち上げも可能になる。
      衛星は96分で地球を一周し、電波の信号を発し続けた。
      この信号は、世界中のアマチュア無線家が受信できる。
      夜空を横切る光を見た人も多い。

      アメリカの反応は大きかった。
      技術で優位に立っているという前提が崩れる。
      同じロケットで核弾頭を運べることも意味した。
      翌年、アメリカは航空宇宙局を設立し、科学と数学の教育を強化する法を作る。
      教育制度の見直しが全国で進められた。

      1か月後、ソ連は犬を乗せた衛星を打ち上げた。
      生物が宇宙の環境に耐えられることが確かめられる。
      1961年には有人飛行が実現し、アメリカは月への着陸を目標に掲げた。
      競争は軍事と威信をめぐるものだったが、成果は広く残った。
      通信衛星、気象観測、測位の技術は、現在の生活の基盤になっている。
      小さな球体の信号が、その出発点にある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/be/Sputnik_asm.jpg/500px-Sputnik_asm.jpg
      credit: NSSDC, NASA[1] / Public domain
      page: https://commons.wikimedia.org/wiki/File:Sputnik_asm.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スプートニク1号

  - id: gagarin
    year: 1961
    title: ガガーリンの有人宇宙飛行
    category: science
    tags: [ソ連, 宇宙]
    summary: 人類が初めて地球を外から見た。「地球は青かった」の言葉が残る。
    detail: |
      ソ連の宇宙飛行士ガガーリンが人類初の有人宇宙飛行を行った出来事で、1961年4月のこと。
      108分で地球を一周した。
      人類が初めて地球を外から見た瞬間である。

      集団農場で育ち、工員を経て空軍のパイロットになった。
      20人の候補から選ばれる。
      宇宙船ヴォストーク1号は、自動で制御された。
      飛行士が操作する場面はほとんどない。
      無重力の影響が未知であり、意識を保てるか分からなかったためである。

      高度327キロに達し、地球を一周した後に再突入する。
      座席ごと射出され、パラシュートで着地した。
      地球は青かったという言葉が伝えられている。
      実際の発言は、空は暗く地球は青みがかって美しい、という趣旨だった。
      帰還後、国民的な英雄になった。
      各国を訪問し、宇宙開発の象徴として迎えられる。
      アメリカは1か月後に弾道飛行を成功させ、その直後に月への着陸を目標として宣言した。

      ガガーリン自身は、その後の飛行を許されなかった。
      失うには貴重すぎる存在とされたためである。
      1968年、訓練機の事故で34歳で死亡した。
      飛行の日は、現在も国際的に記念されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/Yuri_Gagarin_with_awards.jpg/500px-Yuri_Gagarin_with_awards.jpg
      credit: Александр Моклецов / СовИнформБюро / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Yuri_Gagarin_with_awards.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ユーリイ・ガガーリン

  - id: prague-spring
    year: 1968
    title: プラハの春
    category: society
    tags: [チェコ, 冷戦]
    summary: 「人間の顔をした社会主義」の試みがソ連軍に潰され、東側の限界が露わになった。
    detail: |
      チェコスロヴァキアで進められた改革と、それを潰したソ連軍の介入で、1968年のこと。
      人間の顔をした社会主義という言葉が掲げられた。
      東側の体制の限界が露わになる。

      1月、改革派のドゥプチェクが党の第一書記になった。
      経済の停滞と統制への不満が背景にある。
      改革は速く進んだ。
      検閲が事実上廃止され、報道と議論が自由になる。
      企業の自主性が拡大され、連邦制への移行も検討された。
      複数政党制への道も議論される。

      社会主義の枠内での改革という立場は保たれていた。
      ワルシャワ条約機構からの離脱も否定している。
      しかしソ連は、体制の動揺が周辺へ波及することを恐れた。
      交渉が繰り返されたが、改革は止まらない。
      8月20日の夜、ワルシャワ条約機構の5か国の軍が侵攻した。
      50万の兵と戦車が投入される。
      市民は非暴力の抵抗を行った。
      道路標識を外し、戦車を取り囲んで兵士に語りかける。
      武力での反撃は行われなかった。

      指導部はモスクワへ連行され、改革の撤回を承認させられる。
      翌年、抗議して焼身自殺した学生が出た。
      ソ連は、社会主義共同体の利益のために介入する権利を主張した。
      各国の共産党のなかでも、批判が広がる契機になる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/10_Soviet_Invasion_of_Czechoslovakia_-_Flickr_-_The_Central_Intelligence_Agency.jpg/500px-10_Soviet_Invasion_of_Czechoslovakia_-_Flickr_-_The_Central_Intelligence_Agency.jpg
      credit: The Central Intelligence Agency / Public domain
      page: https://commons.wikimedia.org/wiki/File:10_Soviet_Invasion_of_Czechoslovakia_-_Flickr_-_The_Central_Intelligence_Agency.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/プラハの春

  - id: chernobyl
    year: 1986
    title: チェルノブイリ原発事故
    category: disaster
    tags: [ソ連, 原発]
    summary: 情報隠蔽への不信が体制への信頼を損ない、ソ連崩壊を早めたとも言われる。
    detail: |
      ウクライナの原子力発電所で起きた事故で、1986年4月のこと。
      原子炉が爆発し、大量の放射性物質が放出された。
      情報の隠蔽への不信が、体制への信頼を損なう。

      事故は、非常時の電源の試験の最中に起きた。
      出力が不安定になり、安全の装置が切られていたことも重なって暴走する。
      炉心が爆発し、黒鉛が数日にわたって燃え続けた。
      放射性物質は北欧と西欧まで運ばれた。
      異常はスウェーデンの発電所で先に検知され、そこから公になる。

      ソ連政府の発表は遅れた。
      近隣の都市の住民の避難は、36時間後である。
      その間、住民は通常の生活を続けていた。
      数日後にはキエフでメーデーの行進が行われている。
      消火と処理には、数十万人が動員された。
      初期の作業員の多くが急性の障害で死亡する。
      石棺と呼ばれる構造物で覆う作業が行われた。

      30キロ圏が立入禁止となり、現在も維持されている。
      影響の評価には幅がある。
      直接の死者は数十人だが、甲状腺がんの増加は明確に確認された。
      ゴルバチョフは後に、この事故がソ連の崩壊の本当の原因だったと述べている。
      隠蔽の体質が露わになり、情報公開の必要が決定的になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/IAEA_02790015_%285613115146%29.jpg/500px-IAEA_02790015_%285613115146%29.jpg
      credit: IAEA Imagebank / CC BY-SA 2.0
      page: https://commons.wikimedia.org/wiki/File:IAEA_02790015_(5613115146).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チェルノブイリ原子力発電所事故

  - id: fall-of-berlin-wall
    year: 1989
    title: ベルリンの壁崩壊と東欧革命
    category: politics
    tags: [冷戦, 東欧]
    summary: 東欧各国の体制が相次いで倒れ、冷戦の終わりが決定的になった。
    detail: |
      ベルリンの壁が開かれ、東欧の体制が相次いで倒れた出来事で、1989年のこと。
      冷戦の終わりが決定的になる。

      この年、東欧各国で変化が進んでいた。
      ポーランドでは選挙によって非共産党の政権が生まれ、ハンガリーはオーストリアとの国境を開く。
      東ドイツの市民が、ハンガリー経由で西側へ脱出し始めた。
      国内でも、抗議の集会が毎週行われるようになる。
      ライプツィヒでは数十万が参加した。
      武力での鎮圧は行われない。
      ソ連が介入しない方針を明確にしていたことが大きい。

      11月9日、旅行の規制の緩和が発表された。
      記者会見で、いつから有効かを問われた当局者が、直ちに、と答える。
      準備のない発言だったが、放送を見た市民が検問所へ押し寄せた。
      警備兵は命令を受けておらず、やがてゲートを開く。
      人々が壁の上に登り、自ら壁を壊し始めた。

      翌月、チェコスロヴァキアでは流血なく政権が交代する。
      ルーマニアでは独裁者が処刑された。
      東ドイツは翌年に西ドイツへ編入される。
      偶発的な発表が、28年続いた分断を一夜で終わらせた。
      体制が支持を失ったとき、その崩壊は急速に進むことを示す例でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/West_and_East_Germans_at_the_Brandenburg_Gate_in_1989.jpg/500px-West_and_East_Germans_at_the_Brandenburg_Gate_in_1989.jpg
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:West_and_East_Germans_at_the_Brandenburg_Gate_in_1989.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ベルリンの壁崩壊

  - id: ussr-dissolution
    year: 1991
    title: ソ連解体
    category: politics
    tags: [ロシア, 冷戦]
    summary: 15の共和国に分かれ、米ソ二極の時代が終わった。
    detail: |
      ソヴィエト連邦が解体した出来事で、1991年12月のこと。
      15の共和国に分かれ、米ソ二極の時代が終わった。

      背景には、改革が制御を離れたことがある。
      情報公開によって体制への批判が公然と語られ、経済は物不足に陥っていた。
      バルト三国が独立を宣言し、各共和国が主権を主張し始める。
      1991年3月の国民投票では連邦の維持が支持されたが、新しい条約の交渉が続いた。
      8月、保守派が非常事態を宣言してクーデタを起こす。
      ゴルバチョフは別荘に軟禁された。
      しかし軍は分裂し、モスクワでは市民が抵抗する。
      エリツィンが戦車の上から呼びかけ、3日で失敗した。

      これによって共産党の権威は失われた。
      党の活動は停止され、各共和国が次々に独立を宣言する。
      12月8日、ロシア、ウクライナ、ベラルーシの指導者が森の別荘で会談した。
      連邦の消滅と独立国家共同体の創設に合意する。

      12月25日、ゴルバチョフが辞任した。
      クレムリンの赤旗が降ろされ、ロシアの三色旗が掲げられる。
      69年続いた国家が、大きな流血なく解体した。
      一方、各地で民族の紛争が起き、経済の混乱も長く続くことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d0/USSR_Republics_Numbered_Alphabetically.png/500px-USSR_Republics_Numbered_Alphabetically.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:USSR_Republics_Numbered_Alphabetically.png
    links:
