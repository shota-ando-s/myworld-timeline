  - id: yermak-siberia
    year: 1581
    title: イェルマークのシベリア遠征
    category: economy
    tags: [ロシア, 毛皮]
    summary: 毛皮を求める東進が始まり、60年ほどで太平洋岸に到達する。
    detail: |
      コサックの首領イェルマークがシベリアへ遠征した出来事で、1581年に始まった。
      ロシアの東方への拡大の起点である。
      60年ほどで太平洋岸に到達することになる。

      遠征を支援したのは、ウラル地方で製塩と交易を営むストロガノフ家である。
      領地を襲うシビル・ハン国への対抗として、コサックの一団を雇った。
      800人ほどの部隊が川を遡り、シビル・ハン国の都を攻略した。
      火器の優位が、勝敗を分けたとされる。
      イェルマークは獲得した領地をツァーリに献上し、許しと支援を得る。
      しかし数年後、奇襲を受けて川で戦死した。

      遠征そのものは小規模だが、その後の展開が大きい。
      毛皮を求める進出が続き、河川に沿って要塞が築かれる。
      シベリアは川が網の目のように連なり、冬は凍って道になる。
      少数の人員でも遠くまで進めた。

      先住民からは毛皮の貢納が取り立てられた。
      黒テンの毛皮は、国家の重要な収入源になる。
      1639年にはオホーツク海に達し、17世紀半ばには中国との国境で清と接触した。
      半世紀余りで北アジア全域が版図に入ったことになる。
      人口の希薄な地域を、毛皮の利益が牽引した拡大である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Russia_1533-1896.gif/500px-Russia_1533-1896.gif
      credit: Marxist Internet Archive / CC BY-SA 2.0
      page: https://commons.wikimedia.org/wiki/File:Russia_1533-1896.gif
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ロシアのシベリア征服

  - id: romanov-founded
    year: 1613
    title: ロマノフ朝の成立
    category: politics
    tags: [ロシア]
    summary: 動乱を収めた新王朝が、1917年まで300年続く。
    detail: |
      ロマノフ朝が成立した出来事で、1613年のこと。
      動乱時代を収め、1917年まで300年続く王朝が始まった。

      1612年、義勇軍がモスクワを解放し、ポーランドの守備隊を追い出した。
      次の課題は、君主を誰にするかである。
      全国の身分の代表が集まる会議が開かれた。
      貴族、聖職者、都市の代表、さらに農民の代表も加わったとされる。

      候補は複数あった。
      ポーランドやスウェーデンの王子を迎える案もあったが、外国人と異教の君主は退けられる。
      選ばれたのは16歳のミハイル・ロマノフである。
      理由の一つは、イヴァン4世の最初の妃の一族であり、旧王朝とのつながりがあったこと。
      もう一つは、動乱の時期に特定の党派と深く結びついていなかったことである。

      使者が彼のいる修道院を訪ねた。
      母は当初、強く固辞したと伝えられる。
      即位の後、国家の再建が進められた。
      外国との講和、武装集団の鎮圧、財政の立て直しが課題になる。
      王朝は、ピョートル1世の帝国の宣言、エカチェリーナ2世の拡大、19世紀の改革と反動を経て、1917年の革命で終わる。
      最後の皇帝の一家は翌年に処刑された。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ロマノフ朝

  - id: pereyaslav
    year: 1654
    title: ウクライナのロシア帰属
    category: politics
    tags: [ロシア, ウクライナ]
    summary: コサックがポーランドから離れてロシアに保護を求めた協定。解釈は今も争われる。
    detail: |
      ウクライナのコサックがロシアに保護を求めた協定で、1654年のこと。
      ペレヤスラウで会議が開かれた。
      その解釈は現在も争われている。

      ウクライナの地は、当時ポーランド・リトアニア共和国の領域にあった。
      コサックは軍事的な共同体を形成し、特権と正教の信仰をめぐって支配層と対立する。
      1648年、フメリニツキーが蜂起した。
      農民と都市民も加わり、大規模な戦争になる。
      クリミア・タタールと同盟したが、裏切られて苦境に陥った。

      単独でポーランドに対抗できないと判断し、ロシアに保護を求める。
      1654年の会議で、ツァーリへの忠誠が誓われた。
      問題は、その内容の理解である。
      ロシア側は、ウクライナがツァーリの臣下として併合されたと解釈した。
      コサック側は、自治を保ったままの保護の関係だと考えていた。
      文書の原本が失われていることも、論争を複雑にしている。

      以後、ロシアとポーランドの戦争になり、ウクライナはドニエプル川を境に分割された。
      コサックの自治は段階的に削られ、18世紀に廃止される。
      この協定をどう位置づけるかは、ロシアとウクライナの歴史認識の対立の中心にある。
      現在の紛争においても、繰り返し参照されてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/Flag_of_the_Cossack_Hetmanate.svg/500px-Flag_of_the_Cossack_Hetmanate.svg.png
      credit: Alex Tora or Alex K in Ukranian and Japanese wiki / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_Cossack_Hetmanate.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヘーチマン国家

  - id: saint-petersburg
    year: 1703
    title: サンクトペテルブルク建設
    category: society
    tags: [ロシア, 西欧化]
    summary: ピョートル1世が「ヨーロッパへの窓」として新首都を造った。
    detail: |
      ピョートル1世が新しい都を建設した出来事で、1703年のこと。
      ネヴァ川の河口の湿地に築かれ、ヨーロッパへの窓と呼ばれた。

      場所は、大北方戦争の最中に奪ったばかりのスウェーデン領である。
      要塞の建設から始まり、やがて都市として拡張された。
      条件は劣悪だった。
      湿地と沼で、洪水が繰り返し起きる。
      石を敷くため全国から資材が集められ、他の場所での石造の建築が一時禁じられた。

      労働には農民が徴発された。
      数万人が動員され、病と事故で多数が死亡する。
      骨の上に築かれた都市と呼ばれてきた。
      1712年、首都がモスクワから移された。
      貴族は移住を命じられ、石造の家を建てることを義務づけられる。

      都市の設計には、イタリアとフランスの建築家が招かれた。
      運河と直線の街路が配置され、ヨーロッパの都市の様式がとられる。
      アムステルダムを手本としたとされる。
      以後200年、ここが帝国の首都であり続けた。
      宮廷、官庁、科学アカデミー、劇場が集まり、文化の中心になる。
      1917年の革命はこの都市で起き、首都はモスクワへ戻された。
      名は数度変わり、現在は当初の名に戻っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/St._Petersburg_Montage_2016.png/500px-St._Petersburg_Montage_2016.png
      credit: AlexTref871, Florstein / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:St._Petersburg_Montage_2016.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/サンクトペテルブルク

  - id: poltava
    year: 1709
    title: ポルタヴァの戦い
    category: war
    tags: [ロシア, スウェーデン]
    summary: スウェーデンの北方支配が終わり、ロシアが取って代わった。
    detail: |
      ロシア軍がスウェーデン軍を破った戦いで、1709年のこと。
      現在のウクライナのポルタヴァで行われた。
      スウェーデンの北方支配が終わり、ロシアが取って代わる。

      カール12世は、ポーランドを制圧した後にロシアへ侵攻した。
      モスクワを目指したが、補給の困難から南のウクライナへ転じる。
      ロシアは決戦を避け、退却しながら作物と家畜を焼く焦土戦術をとった。
      厳しい冬が追い打ちをかけ、スウェーデン軍は大きく消耗する。
      補給の部隊も途中で撃破された。
      ウクライナではコサックの一部が呼応したが、期待した規模には届かない。

      1709年6月、ポルタヴァの要塞を包囲するスウェーデン軍に対し、ロシア軍が会戦を挑んだ。
      兵力はロシアが倍以上であり、砲の数も圧倒的である。
      カール12世は負傷して直接の指揮がとれなかった。
      戦闘は数時間で決した。
      スウェーデン軍は壊滅し、大半が戦死か捕虜になる。
      国王はオスマン帝国へ逃れた。

      この敗北によって、スウェーデンの大国の地位は失われた。
      ロシアはバルト海沿岸を確保し、ヨーロッパの列強として扱われるようになる。
      勢力の交代を決めた一戦として位置づけられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Marten%27s_Poltava.jpg/500px-Marten%27s_Poltava.jpg
      credit: Pierre-Denis Martin / Public domain
      page: https://commons.wikimedia.org/wiki/File:Marten%27s_Poltava.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ポルタヴァの戦い

  - id: partitions-of-poland
    year: 1772
    title: ポーランド分割
    category: politics
    tags: [ポーランド, 東欧]
    summary: 3度の分割で国家が地図から消え、123年後まで戻らなかった。
    detail: |
      ポーランド・リトアニア共和国が周辺の三国によって分割された出来事で、1772年に始まった。
      三度の分割を経て、1795年に国家は地図から消える。
      独立の回復は123年後である。

      背景には、共和国の統治の行き詰まりがある。
      国王は選挙で選ばれ、権限が弱い。
      議会では一人の反対で議決が無効になる制度が濫用され、立法が機能しなくなっていた。
      隣国はこの仕組みを利用し、買収によって決定を妨げる。

      1772年、ロシア、プロイセン、オーストリアが第一次の分割を行った。
      領土の三分の一近くが奪われる。
      危機を受けて、改革が試みられた。
      1791年、ヨーロッパで最初の成文憲法の一つが制定される。
      国王の権限を強め、議決の仕組みを改め、都市民の権利を認める内容だった。

      しかしロシアは、この改革を自国への脅威とみなした。
      翌年に軍を進め、1793年に第二次の分割が行われる。
      コシチュシュコが率いる蜂起も鎮圧された。
      1795年、第三次の分割によって国家は消滅する。
      以後、ポーランド人は各地で蜂起を繰り返した。
      独立の回復は、第一次世界大戦の後である。
      国家が消えても民族が存続しうることを示した例でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/Poland-00808_-_Castle_Square_%2831215382745%29.jpg/500px-Poland-00808_-_Castle_Square_%2831215382745%29.jpg
      credit: Dennis G. Jarvis / CC BY-SA 2.0
      page: https://commons.wikimedia.org/wiki/File:Poland-00808_-_Castle_Square_(31215382745).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ポーランド分割

  - id: napoleon-russia
    year: 1812
    title: ナポレオンのロシア遠征
    category: war
    tags: [ロシア, フランス]
    summary: 冬とロシアの焦土作戦に敗れ、ナポレオン没落の決定打となった。
    detail: |
      ナポレオンがロシアへ侵攻した遠征で、1812年のこと。
      60万を超える大軍が動員された。
      冬と焦土戦術によって壊滅し、没落の決定打になる。

      原因は大陸封鎖である。
      イギリスとの交易を断つ体制はロシアの経済を圧迫し、事実上放棄された。
      これを許せば体制全体が崩れると判断した。
      6月、大軍が国境を越えた。
      諸国の部隊を含む多国籍の軍である。

      ロシア軍は決戦を避けて後退した。
      作物と家畜を焼き、井戸を埋めながら退く。
      フランス軍は補給を現地の調達に頼っており、これが大きな打撃になった。
      9月、ボロジノで大規模な会戦が行われる。
      双方に甚大な損害が出たが、決着はつかない。
      モスクワに入城したが、住民はすでに退去し、まもなく市内で火災が起きた。
      市街の大半が焼け、冬営は不可能になる。

      講和の申し出は無視された。
      10月、撤退が始まる。
      来た道を戻ることになり、そこには食糧がない。
      寒波、飢え、コサックの襲撃によって軍は崩壊した。
      国境に戻った兵は数万にすぎない。
      この失敗を機に各国が反攻に転じ、2年後にナポレオンは退位する。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/French_invasion_of_Russia_collage.jpg/500px-French_invasion_of_Russia_collage.jpg
      credit: Blaue Max / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:French_invasion_of_Russia_collage.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/1812年ロシア戦役

  - id: decembrist
    year: 1825
    title: デカブリストの乱
    category: society
    tags: [ロシア, 改革]
    summary: 西欧を見た将校たちの蜂起。以後のロシア革命運動の原点とされる。
    detail: |
      ロシアで将校たちが起こした蜂起で、1825年12月のこと。
      月の名からデカブリストと呼ばれる。
      以後のロシアの革命運動の原点とされる。

      中心にいたのは、ナポレオン戦争でヨーロッパへ進軍した貴族の将校たちである。
      フランスとドイツで、憲法と市民社会を目の当たりにした。
      帰国後、農奴制と専制が続く自国との差に直面する。
      秘密の結社が作られ、憲法の制定、農奴の解放、専制の廃止が議論された。
      立憲君主制を求める穏健な立場と、共和制をめざす急進的な立場がある。

      1825年11月、皇帝が急死した。
      継承をめぐって混乱が生じ、二人の皇子のどちらが即位するか定まらない。
      この空白を突いて、12月14日に蜂起が決行された。
      3000人ほどの兵が広場に集まり、宣誓を拒んだ。
      しかし指導者が現れず、交渉も進まない。
      夕刻、砲撃によって鎮圧された。

      5人が処刑され、100人以上がシベリアへ流刑になる。
      妻たちが自ら流刑地へ同行したことは、後世に語り継がれた。
      運動は失敗したが、その理念は受け継がれた。
      以後のロシアでは、知識人が社会の変革を担うという伝統が形成される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/Kolman_decembrists.jpg/500px-Kolman_decembrists.jpg
      credit: Karl Kollmann / Public domain
      page: https://commons.wikimedia.org/wiki/File:Kolman_decembrists.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/デカブリストの乱

  - id: crimean-war
    year: 1853
    title: クリミア戦争
    category: war
    tags: [ロシア, ヨーロッパ]
    summary: 敗北で後進性が露わになり、農奴解放など大改革の引き金になった。
    detail: |
      ロシアとオスマン帝国、それを支援する英仏などが戦った戦争で、1853年から1856年まで続いた。
      主戦場はクリミア半島である。
      ロシアの敗北が、大改革の引き金になった。

      発端は、オスマン領内の聖地の管理権をめぐる争いである。
      ロシアは正教徒の保護を名目に介入し、オスマンに宣戦した。
      背景には、弱体化したオスマン帝国の領土をめぐる大国の思惑がある。
      ロシアが黒海から地中海へ出ることを、イギリスとフランスが警戒した。

      連合軍はクリミア半島に上陸し、セヴァストポリの要塞を包囲した。
      攻防は1年近く続く。
      この戦争では、新しい要素が現れた。
      電信によって本国と前線が結ばれ、従軍記者の報道が世論を動かす。
      ライフル銃と蒸気船が戦い方を変えた。

      野戦病院の状況が報じられ、ナイチンゲールの活動が知られるようになる。
      衛生の改善によって死亡率が大きく下がり、看護が専門職として確立した。
      1855年にセヴァストポリが陥落し、翌年に講和が結ばれる。
      ロシアは黒海の中立化を受け入れた。
      敗因は、鉄道と工業の遅れである。
      この認識が、農奴解放をはじめとする一連の改革につながった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e7/Crimean_War_1854-56_Q71084.jpg/500px-Crimean_War_1854-56_Q71084.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Crimean_War_1854-56_Q71084.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クリミア戦争

  - id: serf-emancipation
    year: 1861
    title: 農奴解放令
    category: society
    tags: [ロシア, 改革]
    summary: 2000万人以上の農奴が法的に解放されたが、土地問題は残った。
    detail: |
      ロシアで農奴制が廃止された勅令で、1861年のこと。
      2000万人以上が法的な自由を得た。
      しかし土地の問題は残された。

      クリミア戦争の敗北が直接の契機である。
      農奴制のもとでは、近代的な軍も工業も育たないことが明らかになった。
      農民の反乱も各地で増えている。
      アレクサンドル2世は、下から解放が起きるより上から行うほうがよいと述べたと伝えられる。
      勅令によって、農民は人格的な自由を得た。
      売買や移転の対象ではなくなり、結婚や訴訟も自分の意思で行える。

      一方、土地は無償では与えられなかった。
      地主に補償が支払われ、農民はその代金を49年かけて国に返済する義務を負う。
      配分された土地は従来の耕作地より狭い場合が多く、良い土地は地主に残された。
      さらに、土地は個人ではなく村の共同体に与えられた。
      共同体が納税と徴兵に連帯して責任を負い、移動には許可が必要になる。
      実質的な束縛は続いた。
      農民の不満は解消されず、各地で騒擾が起きる。

      それでも、身分としての農奴が消えたことの意味は大きい。
      労働力が都市へ移り、工業化の条件が整った。
      未解決の土地問題は、1917年の革命の主要な要因になる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Reading_of_the_Manifest_%28Liberation_of_peasants%29_-_Kustodiev%2C_1907.jpg/500px-Reading_of_the_Manifest_%28Liberation_of_peasants%29_-_Kustodiev%2C_1907.jpg
      credit: ボリス・クストーディエフ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Reading_of_the_Manifest_(Liberation_of_peasants)_-_Kustodiev,_1907.jpg
    links:
