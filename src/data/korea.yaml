lane: korea

periods:
  - id: gojoseon
    title: 古朝鮮
    start: -700
    startCirca: true
    end: -108
    category: politics
    tags: [朝鮮, 古代]
    summary: 半島北部にあったとされる最初の国家。前108年に漢に滅ぼされた。
    detail: |
      朝鮮半島の北部から満洲南部にかけて存在したとされる最初の国家。
      紀元前7世紀ごろから紀元前108年までとされるが、年代には幅がある。
      前漢の武帝に滅ぼされた。

      建国の伝承では、天の神の子と熊から変じた女性のあいだに檀君が生まれ、国を開いたとされる。
      この神話は13世紀の文献に記され、後の民族意識の基礎になった。
      実態については、考古学の資料から推測される。
      青銅の短剣と独特の形の土器が分布する地域が、その範囲と重なると考えられている。
      農耕と青銅の生産を基盤とする社会が、次第に政治的なまとまりを持ったとみられる。

      中国の文献に現れるのは紀元前4世紀ごろからである。
      燕と接し、王を称して対抗したと記される。
      紀元前2世紀、燕から亡命した衛満が王位を奪った。
      衛氏朝鮮と呼ばれるこの政権は、鉄器を用いて周辺を従え、漢と南方の勢力との交易の中継を押さえる。

      この中継の独占が、漢との対立を招いた。
      紀元前109年から武帝が遠征を行い、1年の攻防の末に都が陥落する。
      跡地には四つの郡が置かれた。
      以後400年にわたって中国の直轄地が半島の北部に存在することになる。
      韓国と北朝鮮の双方で、この国は自国の歴史の出発点として位置づけられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/Han_Dynasty.jpg/500px-Han_Dynasty.jpg
      credit: Georgezhao / Public domain
      page: https://commons.wikimedia.org/wiki/File:Han_Dynasty.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/古朝鮮

  - id: han-commanderies
    title: 漢の四郡
    start: -108
    end: 313
    category: politics
    tags: [朝鮮, 中国]
    summary: 楽浪郡を中心とする中国の直轄地。大陸の文物が半島に流れ込む窓口になった。
    detail: |
      前漢が朝鮮半島の北部に置いた四つの郡で、紀元前108年から設置された。
      中心の楽浪郡は313年まで続く。
      大陸の文物が半島へ流れ込む窓口になった。

      武帝が衛氏朝鮮を滅ぼした後、その領域に楽浪、真番、臨屯、玄菟の四郡が置かれた。
      うち三つは数十年で廃されるか統合され、楽浪郡が中心として残る。
      郡の役所は、現在の平壌の近くにあった。
      発掘によって、中国式の墓と、漆器、銅鏡、貨幣が大量に見つかっている。
      中国本土と同じ様式の生活が営まれていたことが分かる。

      役割は行政だけではない。
      半島南部の諸集団や、海を越えた倭との交易の窓口でもあった。
      倭の奴国が後漢から金印を受けた記録も、この郡を経由した通交による。
      漢字、鉄器、絹、儒学の知識が、ここから周辺へ広がった。
      後漢が衰えると、遼東の公孫氏が支配し、南部に帯方郡が新設される。
      その後は魏、晋の支配下に入った。

      313年、北から勢力を伸ばした高句麗によって楽浪郡は滅ぼされる。
      400年続いた中国の直轄支配が終わり、半島は三国が争う時代に入った。
      中国の制度と文化が半島に定着する期間として、この400年の意味は大きい。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/Four_Commanderies_of_Han%2C_with_Japanese_Names.png/500px-Four_Commanderies_of_Han%2C_with_Japanese_Names.png
      credit: Stillskywkpd / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Four_Commanderies_of_Han,_with_Japanese_Names.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/漢四郡

  - id: korea-three-kingdoms
    title: 三国時代（高句麗・百済・新羅）
    start: -57
    startCirca: true
    end: 668
    category: politics
    tags: [朝鮮]
    summary: 三つの王国が競い合い、中国・日本の双方と深く関わった。
    detail: |
      朝鮮半島と満洲南部に高句麗、百済、新羅が並び立った時代。
      紀元前後から668年まで続いたとされる。
      三国が競い合い、中国と日本の双方と深く関わった。

      高句麗は北部と満洲を拠点とし、中国の王朝と直接に対峙した。
      騎馬の軍を持ち、山城を連ねて防衛する。
      隋と唐の大軍を数度にわたって退けた。
      百済は南西部にあり、海上の交流に長けていた。
      中国の南朝と通交し、倭とも密接な関係を持つ。
      仏教と漢字、技術者を日本へ送り、飛鳥の文化に大きな影響を与えた。

      新羅は南東部にあり、当初は最も後れていた。
      6世紀に漢江の流域を奪って勢いを得る。
      骨品制と呼ばれる厳格な身分制度と、花郎という青年の組織が特徴である。
      三国はいずれも仏教を受け入れ、律令に近い制度を整えた。
      古墳と壁画、金冠と装身具が各地に残る。

      7世紀、新羅が唐と結んで百済と高句麗を滅ぼした。
      その後、唐の勢力も半島から追い出し、統一が実現する。
      高句麗の故地の帰属をめぐっては、現在も中国と韓国のあいだで歴史認識の議論が続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5e/Three_Kingdoms_of_Korea_Map_ja.png/500px-Three_Kingdoms_of_Korea_Map_ja.png
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Three_Kingdoms_of_Korea_Map_ja.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/三国時代_(朝鮮半島)

  - id: balhae
    title: 渤海
    start: 698
    end: 926
    category: politics
    tags: [朝鮮, 満洲]
    summary: 高句麗の後継を名乗り、唐や日本と使節を交わした「海東の盛国」。
    detail: |
      高句麗の遺民と靺鞨の人々が満洲に建てた国家で、698年から926年まで続いた。
      唐や日本と使節を交わし、海東の盛国と称された。

      高句麗の滅亡後、その遺民は各地に分散させられていた。
      唐が内乱で混乱した隙に、大祚栄が集団を率いて自立する。
      領域は、現在の中国東北部からロシアの沿海地方、朝鮮半島北部に及んだ。
      唐からは当初警戒されたが、やがて冊封を受けて関係を正常化する。
      五つの都と多数の州を置き、唐の制度にならった行政を整えた。
      都の上京龍泉府は、長安を手本とする条坊の都市である。

      日本とも34回にわたって使節を交わした。
      当初は唐と新羅に対抗する外交の目的があり、後には交易が中心になる。
      テンの毛皮や人参が運ばれ、日本からは絹が送られた。
      文化では、仏教が栄え、漢詩が作られた。

      926年、契丹の遼に滅ぼされた。
      都は破壊され、住民の多くが移住させられる。
      遺民の一部は高麗へ逃れた。
      この国家をどの民族の歴史に位置づけるかをめぐって、中国、韓国、ロシアの研究者のあいだで議論が続いている。
      史料が乏しいことも、その原因の一つである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/Balhae-Territory_in_830_jp.png/500px-Balhae-Territory_in_830_jp.png
      credit: Original uploader was Historiographer / Public domain
      page: https://commons.wikimedia.org/wiki/File:Balhae-Territory_in_830_jp.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/渤海_(国)

  - id: unified-silla
    title: 統一新羅
    start: 668
    end: 935
    category: politics
    tags: [朝鮮]
    summary: 唐と結んで半島を統一。仏教文化が栄えた。
    detail: |
      新羅が朝鮮半島の大半を統一して統治した時期で、668年から935年まで続いた。
      仏教の文化が栄えた時代である。

      唐と結んで百済と高句麗を滅ぼし、その後に唐の勢力も追い出して統一を実現した。
      ただし高句麗の故地の大半は失われ、北部には渤海が成立する。
      統治では、唐の制度が取り入れられた。
      全国を九つの州に分け、旧三国の地域を均等に扱う形をとる。
      地方の有力者の子弟を都に住まわせ、統制の手段とした。

      身分制度は厳格である。
      骨品制と呼ばれ、生まれによって就ける官職と、家の規模や服装まで定められていた。
      これが有能な人材の登用を妨げ、後の衰退の一因になる。
      仏教は国家の保護を受けて栄えた。
      慶州には多数の寺院が建てられ、仏国寺と石窟庵が造営される。
      石窟の本尊は、東アジアの彫刻の傑作とされる。
      唐との交流も盛んで、多数の留学生と留学僧が渡った。

      8世紀後半から、王位をめぐる争いが続く。
      地方では豪族が自立し、農民の反乱も相次いだ。
      10世紀に後百済と後高句麗が建てられ、再び三つに分かれる。
      935年、王が高麗に国を譲って終わった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/History_of_Korea_576_ja.png/500px-History_of_Korea_576_ja.png
      credit: 英語版ウィキペディアのHistoriographerさん / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:History_of_Korea_576_ja.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/新羅

  - id: goryeo
    title: 高麗
    start: 918
    end: 1392
    category: politics
    tags: [朝鮮]
    summary: Korea の語源となった王朝。高麗青磁と大蔵経の木版で知られる。
    detail: |
      朝鮮半島を統治した王朝で、918年から1392年まで続いた。
      コリアという英語の呼称は、この王朝の名に由来する。
      高麗青磁と大蔵経の木版で知られる。

      新羅の末期の分裂を収め、王建が建国した。
      高句麗の後継を名乗り、その名を国号とする。
      統治では、科挙を導入して官僚を登用した。
      仏教を国家の宗教とし、僧に高い地位を与える。
      首都の開京には、多数の寺院が建てられた。

      北方の勢力との関係は緊張の連続である。
      契丹の遼、女真の金と対峙し、そのつど朝貢の形で和平を保った。
      12世紀後半、武人が政権を奪って独裁を敷く。
      武臣政権は100年続いた。
      13世紀、モンゴルの侵攻を受けた。
      首都を江華島へ移して30年抵抗したが、最終的に服属する。
      以後100年にわたり、元の影響下に置かれた。
      王は元の皇女を妃とし、内政にも干渉を受ける。

      抵抗の祈りとして彫られた大蔵経の版木は、8万枚を超えて現存する。
      青磁の技法も、この時代に世界的な水準に達した。
      元が衰えると自立を回復するが、倭寇と紅巾賊の侵入で疲弊する。
      1392年、武将の李成桂が王位を奪って朝鮮王朝が始まった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/54/Royal_flag_of_Goryeo_%28Bong-gi%29.svg/500px-Royal_flag_of_Goryeo_%28Bong-gi%29.svg.png
      credit: Samhanin / Public domain
      page: https://commons.wikimedia.org/wiki/File:Royal_flag_of_Goryeo_(Bong-gi).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高麗

  - id: goryeo-military-rule
    title: 武臣政権
    start: 1170
    end: 1270
    category: war
    tags: [朝鮮, 武人]
    summary: 武官が実権を握った100年。モンゴルへの長い抵抗もこの政権が指導した。
    detail: |
      高麗で武官が政権を握った時期で、1170年から1270年まで100年続いた。
      モンゴルへの長い抵抗も、この政権が指導した。

      高麗では、文官が武官より上位に置かれていた。
      武官は昇進に限界があり、宴席で侮辱されることもある。
      待遇への不満が積み重なっていた。
      1170年、王の行幸に従った武官が蜂起し、文官を多数殺害した。
      王は廃され、弟が立てられる。
      以後、実権を握る人物が次々に入れ替わった。
      部下に殺されては新たな実力者が立つことが繰り返される。

      安定したのは、1196年に崔忠献が権力を握ってからである。
      崔氏は4代60年にわたり実権を保った。
      王は存続するが、名目的な存在になる。
      独自の政庁と私兵を持ち、人事と徴税を掌握した。

      農民と奴婢の反乱が各地で起きたのも、この時期である。
      1231年からモンゴルの侵攻が始まると、政権は都を江華島へ移した。
      騎馬の軍が渡海を苦手とすることを利用した判断である。
      本土は繰り返し荒らされたが、30年にわたって抵抗が続いた。
      1258年に崔氏が倒れ、1270年に王政が復古して講和する。
      一部の軍は三別抄として抵抗を続け、3年後に鎮圧された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Gyeongbokgung-GeunJeongJeon.jpg/500px-Gyeongbokgung-GeunJeongJeon.jpg
      credit: 英語版ウィキペディアのBlmtduddlさん / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Gyeongbokgung-GeunJeongJeon.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/武臣政権

  - id: joseon
    title: 朝鮮王朝（李氏朝鮮）
    start: 1392
    end: 1897
    category: politics
    tags: [朝鮮, 儒教]
    summary: 500年続いた儒教国家。ハングルの制定と両班による統治が特徴。
    detail: |
      朝鮮半島を統治した王朝で、1392年から1897年まで500年続いた。
      儒教を国家の原理とし、両班と呼ばれる支配層が官職を占めた。
      ハングルの制定でも知られる。

      高麗の武将だった李成桂が建てた。
      明に事大の礼をとり、その冊封を受けて正統性を得る。
      朱子学が国家の原理とされた。
      仏教は抑制され、寺院の土地が没収される。
      身分と儀礼の秩序が細かく定められ、家族と社会の規範になった。

      官僚は科挙によって選ばれた。
      受験の資格は事実上、両班の家に限られる。
      合格者を出し続けることが家の地位を保つ条件であり、学問への投資が集中した。
      第4代の世宗の時代に、訓民正音が作られた。
      農業書と医学書が編まれ、天文の観測機器も開発される。
      16世紀末、豊臣秀吉の侵攻を受けて国土が荒廃した。
      17世紀には清に服属する。

      以後、対外的には閉ざされた姿勢をとり、隠者の王国と呼ばれた。
      国内では、朱子学の解釈をめぐる党争が続く。
      18世紀には実学が現れ、実務と技術を重んじる議論が起きた。
      19世紀、列強の圧力のなかで開国を迫られる。
      1897年に大韓帝国と改称し、1910年に日本に併合された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Flag_of_the_king_of_Joseon.svg/500px-Flag_of_the_king_of_Joseon.svg.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_king_of_Joseon.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/李氏朝鮮

  - id: korean-empire
    title: 大韓帝国
    start: 1897
    end: 1910
    category: politics
    tags: [朝鮮, 近代化]
    summary: 清との従属関係を断ち皇帝を称したが、日露の争いのなかで独立を保てなかった。
    detail: |
      朝鮮が国号を改めて皇帝を称した国家で、1897年から1910年まで続いた。
      清との従属関係を断ち、独立国であることを示す措置だった。
      しかし独立は保たれなかった。

      日清戦争の結果、清の宗主権は否定された。
      一方で、日本とロシアの勢力争いの舞台になる。
      王妃が日本の関係者に殺害された後、国王はロシア公使館に1年滞在した。
      帰還の翌年、皇帝を称して大韓帝国を宣言する。
      中国の皇帝と対等の地位を示すことで、自立を主張した。

      近代化の事業も進められた。
      電気と電車がソウルに導入され、鉄道が敷かれ、学校と病院が設けられる。
      土地の調査と度量衡の統一も試みられた。
      財政は乏しく、事業の多くは外国の借款に依存する。
      日露戦争の後、情勢は決定的になった。
      1905年、日本が保護条約を強いて外交権を奪う。
      皇帝は署名を拒んだが、大臣の同意によって成立したとされた。

      1907年、ハーグの会議に密使を送って無効を訴えたが、参加を認められない。
      皇帝は退位させられ、軍も解散させられた。
      各地で義兵が蜂起して抵抗する。
      1910年、併合によって国家は消滅した。
      13年の帝国は、自立の試みが間に合わなかった時期として記憶されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/Flag_of_Korea_%281899%29.svg/500px-Flag_of_Korea_%281899%29.svg.png
      credit: Lumia1234 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Korea_(1899).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大韓帝国

  - id: japanese-rule-korea
    title: 日本統治期
    start: 1910
    end: 1945
    category: politics
    tags: [朝鮮, 植民地]
    summary: 韓国併合から敗戦まで、朝鮮半島は日本の統治下に置かれた。
    detail: |
      日本が朝鮮半島を統治した時期で、1910年から1945年まで35年続いた。

      統治の機関として朝鮮総督府が置かれた。
      総督は天皇に直属し、立法、行政、司法の権限を併せ持つ。
      初期は武断統治と呼ばれる。
      憲兵が警察を兼ね、集会と出版は禁じられ、教員も制服を着て帯刀した。
      土地の調査事業が行われ、申告の手続きを知らない農民が土地を失う例が生じる。

      1919年の三・一独立運動を受けて、方針が改められた。
      文化政治と呼ばれ、新聞の発行と一部の団体の活動が認められる。
      ただし検閲と監視は続いた。
      経済では、米の増産と日本への移出が進められた。
      道路、鉄道、港湾、工場が建設される一方、土地を失った農民が日本や満洲へ移った。

      1930年代後半、戦時体制が強められた。
      日本語の使用の強制、神社への参拝、姓名を日本式に改める措置がとられる。
      徴用と徴兵が行われ、慰安所への動員も実施された。
      1945年の日本の敗戦によって統治は終わる。
      この時期の評価は、日韓のあいだで大きく異なる。
      個々の事実の認定と、その意味づけをめぐる議論が現在も続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1b/Flag_of_Japan_%281870%E2%80%931999%29.svg/500px-Flag_of_Japan_%281870%E2%80%931999%29.svg.png
      credit: kahusi - (Talk) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Japan_(1870%E2%80%931999).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日本統治時代の朝鮮

  - id: korea-division
    title: 南北分断
    start: 1945
    ongoing: true
    category: politics
    tags: [朝鮮, 冷戦]
    summary: 38度線での分割占領から始まり、80年たっても解消していない。
    detail: |
      朝鮮半島が南北に分かれた状態で、1945年から現在まで続いている。
      38度線での分割占領から始まり、80年を経ても解消していない。

      1945年8月、日本の降伏が近づくなか、アメリカが北緯38度線を境とする分割占領を提案した。
      ソ連が同意し、北をソ連が、南をアメリカが占領する。
      この線は、二人の若い将校が30分ほどで地図の上に引いたとされる。
      朝鮮の人々の意思は問われていない。
      統一の政府を作る交渉は行き詰まった。
      1948年、南に大韓民国、北に朝鮮民主主義人民共和国が成立する。
      1950年から3年の戦争を経て、境界は休戦ラインとして固定された。

      以後、双方は異なる体制で発展した。
      南は軍事政権を経て民主化し、経済大国になる。
      北は一族の支配が三代続き、核開発を進めた。
      離散した家族は1000万人に及ぶとされる。
      再会の事業は断続的に行われてきたが、対象は限られる。

      南北の対話と緊張は繰り返されてきた。
      2000年と2018年には首脳会談が行われたが、関係の改善は続かなかった。
      冷戦の構図が世界で消えた後も、この分断だけが残り続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Korean_war_1950-1953.gif/500px-Korean_war_1950-1953.gif
      credit: Leomonaci98 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Korean_war_1950-1953.gif
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/38度線

  - id: south-korea
    title: 大韓民国
    start: 1948
    ongoing: true
    category: politics
    tags: [韓国]
    summary: 独裁と経済成長を経て、1987年以降は民主主義を定着させた。
    detail: |
      朝鮮半島の南部に成立した国家で、1948年から現在まで続いている。
      独裁と経済成長を経て、1987年以降は民主主義を定着させた。

      建国後、まもなく朝鮮戦争で国土が荒廃した。
      1950年代は援助に依存する最貧国の一つである。
      1961年の軍事クーデタで朴正煕が実権を握った。
      輸出主導の工業化が国家の主導で進められ、年10パーセント近い成長が続く。
      漢江の奇跡と呼ばれた。
      一方、政治的な自由は厳しく制限された。

      1979年の朴正煕の暗殺の後も軍政が続き、1980年には光州で市民の抗議が武力で鎮圧される。
      1987年、大規模な民主化運動によって大統領の直接選挙が実現した。
      以後、選挙による政権交代が定着する。
      退任後の大統領が訴追される例が続くことも、この国の政治の特徴である。

      1997年の通貨危機で経済は打撃を受けたが、構造改革を経て回復した。
      半導体、自動車、造船、通信で世界的な地位を占める。
      文化では、映像と音楽が世界に広がった。
      課題も多い。
      出生率は世界で最も低く、高齢化と地域の格差、若年層の雇用が問題になっている。
      北朝鮮との関係も未解決のままである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/Flag_of_South_Korea.svg/500px-Flag_of_South_Korea.svg.png
      credit: "原作: Government of the Republic of Korea ベクタ: Great Brightstar and others / Public domain"
      page: https://commons.wikimedia.org/wiki/File:Flag_of_South_Korea.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大韓民国

  - id: north-korea
    title: 朝鮮民主主義人民共和国
    start: 1948
    ongoing: true
    category: politics
    tags: [北朝鮮]
    summary: 一族による支配が三代続き、核開発で国際社会と対峙している。
    detail: |
      朝鮮半島の北部に成立した国家で、1948年から現在まで続いている。
      一族による支配が三代続き、核開発によって国際社会と対峙している。

      金日成が初代の指導者となり、ソ連の支援のもとで体制が築かれた。
      土地改革と産業の国有化が実行される。
      1950年に戦争を起こし、3年の戦闘の末に休戦した。
      戦後、主体思想が国家の原理とされた。
      自力で道を切り開くという理念であり、ソ連と中国のいずれにも従属しない立場を示すものでもある。
      指導者への個人崇拝が制度として組み込まれた。

      1970年代までは、南より経済が優位にあった時期もある。
      しかし計画経済の非効率と、ソ連の崩壊による支援の喪失で行き詰まった。
      1990年代半ばの飢饉では、数十万から百万が死亡したとされる。
      権力は金正日、金正恩へと世襲された。
      社会主義の国家で三代にわたる世襲が行われた例は他にない。

      核開発は1990年代から国際的な問題になった。
      六者協議と米朝の首脳会談が行われたが、合意は持続していない。
      制裁のもとで核と弾道ミサイルの開発が続く。
      情報の統制が厳しく、実態の把握は難しい。
      脱北者の証言と衛星の画像が、主要な情報源になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Flag_of_North_Korea.svg/500px-Flag_of_North_Korea.svg.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_North_Korea.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/朝鮮民主主義人民共和国

events:
  - id: lelang-falls
    year: 313
    title: 高句麗が楽浪郡を滅ぼす
    category: war
    tags: [朝鮮, 中国]
    summary: 400年続いた中国の直轄支配が終わり、半島は三国の争いの時代に入る。
    detail: |
      高句麗が楽浪郡を滅ぼした出来事で、313年のこと。
      400年続いた中国の直轄支配が半島から消えた。
      以後、三国が争う時代が本格化する。

      楽浪郡は、紀元前108年に前漢が設置した行政の拠点である。
      中国の制度と文化が半島に流れ込む窓口として機能してきた。
      中国側の事情が変化した。
      後漢の滅亡後、三国の争いを経て晋が成立するが、まもなく八王の乱と北方民族の侵入で華北が混乱する。
      遠方の郡を支える余力は失われた。

      高句麗は、それ以前から郡に対して圧力をかけていた。
      313年、ついに楽浪郡を攻め落とし、翌年には帯方郡も奪う。
      これによって、半島に中国の直接の支配は存在しなくなった。
      高句麗は南下を進め、百済と新羅との抗争が本格化する。

      郡に住んでいた中国系の住民の一部は、高句麗や百済に取り込まれた。
      技術と文書行政の知識が、そのまま各国に引き継がれたとみられる。
      日本との関係にも影響がある。
      倭が中国の王朝と通交する経路が変わり、以後は南朝と直接に交渉するようになった。
      東アジアの国際関係が、中国の直轄地を介さない形へ移る転換点である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/84/History_of_Korea_%28Goguryeo%29_476_jp.png/500px-History_of_Korea_%28Goguryeo%29_476_jp.png
      credit: User:Historiographer, User:KEIM, User:KEIMS / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:History_of_Korea_(Goguryeo)_476_jp.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高句麗

  - id: buddhism-goguryeo
    year: 372
    title: 高句麗に仏教が伝わる
    category: religion
    tags: [朝鮮, 仏教]
    summary: 前秦から伝来し、のちに百済経由で日本へも伝わる流れの起点となった。
    detail: |
      高句麗に仏教が公式に伝えられた出来事で、372年のこと。
      中国の前秦から僧と経典が送られた。
      朝鮮半島への仏教の伝来の始まりである。

      当時の高句麗は、南の百済と争いながら北方の情勢にも対応していた。
      前秦とは友好の関係にあり、その一環として仏教がもたらされる。
      王は寺を建て、僧を住まわせた。
      受け入れは上からの政策として進められる。
      仏教が王権にとって有用だった理由がある。
      部族ごとの伝統的な信仰を越えて、国全体で共有できる教えを提供すること。
      王を仏法の保護者として位置づけ、権威を高めることである。
      国を守る宗教という性格が、東アジアの仏教の特徴になった。

      百済へは384年、東晋から伝えられた。
      新羅への伝来はさらに遅れ、貴族の反対にあって公認は527年になる。
      殉教の伝承が残されている。
      百済は、538年ごろに仏像と経典を倭へ贈った。
      日本への仏教の伝来である。

      この流れによって、中国で漢訳された経典が朝鮮半島を経て日本へ達する経路ができた。
      寺院の建築、造仏、暦、医薬の技術も同時に伝わっている。
      東アジアが共通の宗教と文字を持つ文化圏になる出発点である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/84/History_of_Korea_%28Goguryeo%29_476_jp.png/500px-History_of_Korea_%28Goguryeo%29_476_jp.png
      credit: User:Historiographer, User:KEIM, User:KEIMS / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:History_of_Korea_(Goguryeo)_476_jp.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高句麗

  - id: pyongyang-capital
    year: 427
    title: 高句麗の平壌遷都
    category: politics
    tags: [朝鮮]
    summary: 南進策に転じ、百済・新羅との三国の争いが本格化した。
    detail: |
      高句麗が都を平壌へ移した出来事で、427年のこと。
      長寿王の決定である。
      南進の方針が明確になり、三国の争いが本格化した。

      それまでの都は、鴨緑江の中流にある山がちな地域にあった。
      防衛には適しているが、耕地が限られ、人口を支える力に乏しい。
      平壌は大同江に面し、広い平野を持つ。
      かつて楽浪郡の中心があった場所であり、中国由来の文物と技術が蓄積されていた。
      海に近く、中国との通交にも便利である。

      遷都の後、高句麗は南への圧力を強めた。
      475年には百済の都を落とし、王を戦死させる。
      百済は南へ退き、新羅と同盟を結んで対抗した。
      領域は漢江の流域に及び、半島の三分の二ほどを支配する。
      この遷都は、高句麗の性格の変化も示している。
      満洲の騎馬の国家から、半島の農耕地帯を基盤とする国家へ重心が移った。

      一方、北方の防衛が手薄になったという指摘もある。
      隋と唐の遠征に対しては持ちこたえたが、最終的には新羅と唐の挟撃によって滅ぶ。
      平壌はその後も半島北部の中心であり続け、現在は北朝鮮の首都になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/84/History_of_Korea_%28Goguryeo%29_476_jp.png/500px-History_of_Korea_%28Goguryeo%29_476_jp.png
      credit: User:Historiographer, User:KEIM, User:KEIMS / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:History_of_Korea_(Goguryeo)_476_jp.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高句麗

  - id: salsu-battle
    year: 612
    title: 薩水大捷（隋の遠征を撃退）
    category: war
    tags: [朝鮮, 隋]
    summary: 100万と称された隋の大軍を退け、隋の滅亡を早めた。
    detail: |
      高句麗が隋の遠征軍を撃退した戦いで、612年のこと。
      薩水での大勝として記録される。
      この敗北が隋の滅亡を早めた。

      隋の煬帝は、113万と号する大軍を動員した。
      実際の数字には誇張があるが、当時としては空前の規模である。
      補給を担う人員を含めると、さらに多い。
      高句麗は、遼東の山城で防戦した。
      城は堅固で、正面から落とすことができない。
      隋は、30万余りの別働隊を編成して平壌へ直行させた。
      兵は100日分の食糧を自ら背負わされ、重さに耐えかねて多くが道に捨てたと記録されている。

      高句麗の将軍乙支文徳は、降伏の意思を装って敵を引き込んだ。
      退きながら攻撃し、補給を断ち、消耗させる。
      敵が飢えと疲労で限界に達したところで、退却する隊列を薩水で襲った。

      生きて戻ったのは数千人だったと伝えられる。
      煬帝はその後も二度遠征を試みたが、いずれも失敗した。
      度重なる動員と失敗が国内の反乱を招き、隋は618年に滅ぶ。
      小国が大国の侵攻を退けた例として、朝鮮半島では現在も繰り返し語られる。
      次の唐も数度の遠征を行うが、高句麗を単独では落とせなかった。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/b/b9/The_invasion_of_Goguryeo.png
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:The_invasion_of_Goguryeo.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/隋の高句麗遠征

  - id: baekje-falls
    year: 660
    title: 百済の滅亡
    category: war
    tags: [朝鮮, 唐]
    summary: 唐・新羅の連合軍に敗れ、復興を助けた日本も白村江で敗れた。
    detail: |
      百済が唐と新羅の連合軍に滅ぼされた出来事で、660年のこと。
      700年近く続いた王国が終わった。
      復興を助けた倭も、3年後に白村江で敗れる。

      7世紀、新羅は唐と同盟を結んだ。
      高句麗を倒すには、まず南の百済を排除する必要があると判断される。
      660年、唐の水軍13万が黄海を渡り、新羅の5万が陸から進んだ。
      百済の将軍階伯は5000の兵で迎え撃ち、黄山原で戦って全滅する。

      都の泗沘は包囲され、王は降伏した。
      王族と数万の人々が唐へ連行される。
      宮女が岩から身を投げたという伝承が残り、その場所は落花岩と呼ばれる。
      各地で復興の運動が起きた。
      王族の一人が倭に滞在しており、その帰国と援軍が求められる。
      倭は大軍を派遣した。

      663年、白村江で唐の水軍と戦い、大敗する。
      400艘が焼かれたと記録された。
      復興の望みは絶たれる。
      多くの百済人が倭へ亡命した。
      技術者、学者、官僚として受け入れられ、律令国家の建設に関わる。
      日本にとっても大きな転機だった。
      国防のために山城が築かれ、都が内陸へ移される。
      東アジアの国際関係が、この戦争で大きく組み替えられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/History_of_Korea_576_ja.png/500px-History_of_Korea_576_ja.png
      credit: 英語版ウィキペディアのHistoriographerさん / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:History_of_Korea_576_ja.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/百済
    related: [hakusukinoe]

  - id: silla-unification
    year: 668
    title: 新羅が半島を統一
    category: politics
    tags: [朝鮮]
    summary: 唐と連合して百済・高句麗を滅ぼし、その後は唐の勢力も追い出した。
    detail: |
      新羅が朝鮮半島を統一した出来事で、668年の高句麗の滅亡による。
      唐と連合して百済と高句麗を倒し、その後に唐の勢力も追い出した。

      660年に百済が滅び、663年に倭の援軍も白村江で敗れる。
      残る高句麗は、隋と唐の遠征を退けてきた強国だった。
      しかし内部で権力争いが起きていた。
      有力者の死後、その子らが対立し、一部が唐に降る。
      668年、唐と新羅の連合軍が平壌を包囲して陥落させた。

      統一の後、唐は半島全体を自らの支配下に置こうとした。
      旧百済と旧高句麗の地に都護府を設け、新羅の領域にも行政の機関を置く。
      新羅はこれに抵抗した。
      旧百済の勢力を取り込み、高句麗の遺民の蜂起を支援して唐軍と戦う。
      7年の戦いの末、676年に唐は半島から兵を引いた。

      ただし、北の領域は確保できなかった。
      高句麗の故地の大半は失われ、後に渤海が成立する。
      外国の力を借りて統一し、その外国を排除するという経路をたどった。
      この評価は現在も分かれており、民族の統一とみるか、領土の縮小とみるかで議論がある。
      いずれにせよ、半島に一つの国家が生まれた最初の例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/History_of_Korea_576_ja.png/500px-History_of_Korea_576_ja.png
      credit: 英語版ウィキペディアのHistoriographerさん / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:History_of_Korea_576_ja.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/新羅

  - id: bulguksa
    year: 751
    circa: true
    title: 仏国寺と石窟庵の造営
    category: culture
    tags: [朝鮮, 仏教, 建築]
    summary: 統一新羅の仏教文化の到達点。石窟の仏像は東アジア彫刻の傑作とされる。
    detail: |
      統一新羅の都の近くに造営された寺院と石窟で、751年ごろに着工した。
      仏国寺と石窟庵である。
      新羅の仏教文化の到達点とされる。

      事業を主導したのは宰相の金大城で、王の支援を受けて進められた。
      前世の父母のために石窟を、現世の父母のために寺院を建てたという伝承がある。
      仏国寺は、山の斜面に石積みの基壇を築き、その上に伽藍を配する。
      石の階段と橋は、俗界から仏の世界へ至る道を表す。
      境内に立つ二つの石塔は、様式が対照的で、朝鮮の石塔の代表とされる。

      石窟庵は、山の上に人工の石室を組み上げたものである。
      中国やインドの石窟が岩を掘り抜くのに対し、切り出した花崗岩を積んで円形の空間を作った。
      中央に本尊の坐像が安置され、周囲の壁に菩薩と弟子の像が浮彫で表される。
      本尊の顔は、東アジアの彫刻の傑作と評される。

      入口は東を向いており、日の出の光が本尊に差し込む設計になっている。
      湿度を調節する仕組みも備えられていた。
      20世紀の修復では、この換気の構造が損なわれて結露の問題が生じた。
      現在は保護のためガラスで隔てられている。
      両者とも世界遺産に登録されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/%EA%B2%BD%EC%A3%BC_%EB%B6%88%EA%B5%AD%EC%82%AC.jpg/500px-%EA%B2%BD%EC%A3%BC_%EB%B6%88%EA%B5%AD%EC%82%AC.jpg
