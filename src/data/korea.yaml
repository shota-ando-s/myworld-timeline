        url: https://ja.wikipedia.org/wiki/高麗

  - id: goryeo-exam
    year: 958
    title: 科挙の導入
    category: society
    tags: [朝鮮, 官僚制]
    summary: 中国にならった試験制度が、以後1000年の支配層の形を決めた。
    detail: |
      高麗が科挙を導入した出来事で、958年のこと。
      試験によって官僚を選ぶ中国の制度が、朝鮮半島に取り入れられた。
      以後1000年にわたり、支配層のあり方を決めることになる。

      建国の過程で、王は各地の豪族の協力を得ていた。
      その結果、豪族が官職と私兵を握り、王権を制約している。
      光宗は、中国から亡命してきた人物の建議を受けて科挙を実施した。
      儒学の経典と詩文、そして実務の能力が試される。

      狙いは、家柄によらない人材を登用し、王に直属する官僚の層を作ることにあった。
      豪族の世襲的な地位を相対化する効果もある。
      ただし、受験の資格には制約があった。
      事実上、一定の身分の家の出身者に限られ、庶民が官職に就く道は狭い。
      武官のための試験は長く実施されなかった。

      それでも、儒学を学ぶことが立身の条件になるという構造が定着する。
      朝鮮王朝でも科挙は継続され、両班と呼ばれる支配層を再生産する仕組みになった。
      合格者を出すことが一族の地位を保つ条件であり、教育への投資が集中する。
      1894年に廃止されるまで、900年以上続いた。
      学問と試験によって地位が決まるという価値観は、現在の社会にも影響を残している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/Civilserviceexam1.jpg/500px-Civilserviceexam1.jpg
      credit: 仇英 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Civilserviceexam1.jpg
    links:
