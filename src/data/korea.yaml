        url: https://ja.wikipedia.org/wiki/科挙

  - id: khitan-invasion
    year: 1010
    title: 契丹の侵入
    category: war
    tags: [朝鮮, 遼]
    summary: 三度の侵攻を退け、宋・遼と並ぶ独自の地位を保った。
    detail: |
      契丹の遼が高麗に侵攻した戦争で、993年から1019年にかけて三度行われた。
      いずれも撃退され、高麗は宋と遼のあいだで独自の地位を保った。

      遼は、宋との対立のなかで背後の高麗を警戒していた。
      第一次の侵攻では、大軍が国境を越えた。
      高麗の徐熙は、戦わずに敵の将と交渉する。
      高句麗の後継を名乗る以上、その故地は高麗に属するべきだと論じ、宋との断交を条件に領土の割譲を認めさせた。
      外交だけで領域を広げた稀な例である。

      第二次は1010年で、高麗の内紛を口実に40万が侵攻した。
      都の開京が占領され、王は南へ避難する。
      しかし補給が続かず、遼軍は撤退した。
      第三次は1018年である。
      姜邯賛が指揮し、川をせき止めて渡河する敵を襲う戦法をとった。
      退却する軍を亀州で迎え撃ち、10万のうち生還したのは数千だったと記録される。

      この勝利の後、両国は和平を結んだ。
      高麗は遼の年号を用いるが、内政の自立は保たれる。
      北の国境には長城が築かれた。
      大国のあいだで軍事と外交を組み合わせて自立を保った例として、朝鮮の歴史で重視されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/54/Royal_flag_of_Goryeo_%28Bong-gi%29.svg/500px-Royal_flag_of_Goryeo_%28Bong-gi%29.svg.png
      credit: Samhanin / Public domain
      page: https://commons.wikimedia.org/wiki/File:Royal_flag_of_Goryeo_(Bong-gi).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高麗

  - id: samguk-sagi
    year: 1145
    title: 『三国史記』の編纂
    category: culture
    tags: [朝鮮, 歴史]
    summary: 現存する朝鮮最古の歴史書。三国時代の記録の土台になっている。
    detail: |
      高麗の官僚金富軾が編纂した歴史書で、1145年に完成した。
      三国時代から統一新羅の末期までを扱う。
      朝鮮半島に現存する最古の歴史書である。

      王の命によって編纂された。
      当時、三国時代の記録が散逸しつつあり、それを整理する必要があった。
      形式は、中国の正史にならった紀伝体である。
      王の年代記、人物の伝記、制度や地理の記述からなる。
      全50巻で、漢文で書かれた。

      編纂の姿勢は儒教的である。
      合理的に説明できない伝承は退けられ、新羅を正統とする立場がとられた。
      編者が新羅系の家柄であったことが影響しているとされる。
      後世、この点は批判の対象になった。
      13世紀の『三国遺事』は、檀君の神話や仏教の説話を含めて編まれており、対照的である。

      それでも、この書物の価値は大きい。
      高句麗、百済、新羅の三国について、体系的に記された最古の資料である。
      依拠した古い記録の多くは失われており、そこからの引用によってのみ内容が知られる部分もある。
      中国と日本の史料と照合することで、古代東アジアの関係を再構成する作業が行われてきた。
      記述の信頼性をめぐる検討は、現在も続いている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/三国史記

  - id: mongol-invasion-goryeo
    year: 1231
    title: モンゴルの高麗侵攻
    category: war
    tags: [朝鮮, モンゴル]
    summary: 30年に及ぶ抵抗の末に服属し、元の日本遠征にも動員された。
    detail: |
      モンゴルが高麗に侵攻した戦争で、1231年から数十年にわたり繰り返された。
      30年の抵抗の末に服属し、その後は元の日本遠征にも動員される。

      発端は、高麗を訪れたモンゴルの使者が帰路に殺害された事件である。
      これを口実として侵攻が始まった。
      武臣政権は、都を江華島へ移して抵抗を選んだ。
      騎馬を主力とするモンゴル軍が渡海を苦手とすることを見込んだ判断である。
      島は本土から目と鼻の先だが、潮流が速く上陸は容易でない。

      一方、本土は無防備に近い状態になった。
      6回に及ぶ侵攻で各地が荒らされ、多数が殺され連行される。
      慶州の寺院と九層の木塔が焼かれ、最初に彫られた大蔵経の版木も失われた。
      民衆は山城や島に逃れて抵抗した。
      僧や奴婢の部隊がモンゴルの将を討った例も記録されている。

      1258年、崔氏の政権が内部から倒れ、和平の交渉が進んだ。
      1270年、王が本土へ戻って服属する。
      一部の軍は三別抄として抵抗を続け、珍島と済州島へ移りながら3年戦った。
      以後、高麗は元の影響下に置かれる。
      二度の日本遠征では、船の建造と兵の提供を強いられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/1235_mongol_invasion_of_korea.png/500px-1235_mongol_invasion_of_korea.png
      credit: Qiushufang / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:1235_mongol_invasion_of_korea.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モンゴルの高麗侵攻

  - id: tripitaka-koreana
    year: 1251
    title: 高麗版大蔵経の完成
    category: religion
    tags: [朝鮮, 仏教, 印刷]
    summary: 8万枚を超える版木を16年かけて彫った。国を守る祈りの事業だった。
    detail: |
      高麗が彫らせた仏教の経典の版木で、1251年に完成した。
      8万枚を超える版木からなる。
      国を守る祈りの事業として、16年をかけて行われた。

      最初の版木は11世紀に契丹の侵攻を受けて彫られた。
      しかし1232年、モンゴルの侵攻で焼失する。
      再び彫ることが決められた。
      モンゴルの軍が各地を荒らすなか、江華島で事業が進められる。
      仏の力によって国難を退けるという祈りである。

      版木は桜や樺の木を海水に浸し、蒸して乾燥させてから彫られた。
      反りと虫害を防ぐ処理である。
      5200万字を超える文字が刻まれ、誤字はほとんど見つかっていない。
      筆跡が均一で、一人が書いたようにも見える。
      実際には多数の書写者が関わったとされる。

      完成後、海印寺に移された。
      保管庫は、湿度と通風を考慮した構造になっている。
      床には炭と塩と石灰が敷かれ、窓の大きさが上下で異なる。
      750年以上、版木はほとんど損なわれずに残った。
      現存する漢訳の大蔵経として最も完全なものの一つであり、日本の校訂版の底本にも用いられた。
      版木と保管庫の双方が世界遺産に登録されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Korea-Haeinsa-Tripitaka_Koreana-01.jpg/500px-Korea-Haeinsa-Tripitaka_Koreana-01.jpg
      credit: Lauren Heckler (the Flickr ID is malpuella) at Flicker / CC BY 2.0
      page: https://commons.wikimedia.org/wiki/File:Korea-Haeinsa-Tripitaka_Koreana-01.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高麗八万大蔵経

  - id: jikji
    year: 1377
    title: 『直指』が金属活字で刷られる
    category: science
    tags: [朝鮮, 印刷]
    summary: 現存する世界最古の金属活字本。グーテンベルクより70年以上早い。
    detail: |
      高麗で金属の活字によって刷られた仏教の書物で、1377年のこと。
      現存する世界最古の金属活字本である。
      グーテンベルクの聖書より70年以上早い。

      正式には、禅の教えの要点を抄録した書物である。
      高僧が歴代の祖師の言葉を集めたもので、上下二巻からなる。
      刷られたのは、清州の郊外の寺院である。
      朝鮮半島では、13世紀にはすでに金属活字が使われていたと記録されている。
      木版に比べて、少部数を多種類作るのに適していた。
      漢字は字種が多いため、版木を彫るより活字を組む方が効率がよい場合がある。

      一方で、この技術がヨーロッパのような社会の変化を生まなかった。
      理由として、漢字の字種の多さ、需要の限定、国家による印刷の管理が挙げられる。
      グーテンベルクの場合、表音文字と印刷機と油性インクの組み合わせが大量生産を可能にした。

      下巻の一冊が、フランス国立図書館に所蔵されている。
      19世紀に外交官が収集し、その後に寄贈されたものである。
      返還を求める声が韓国から出されている。
      2001年、世界の記憶に登録された。
      印刷の歴史を語る際に、必ず言及される資料になっている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/直指心体要節

  - id: yi-seonggye
    year: 1392
    title: 李成桂が朝鮮王朝を開く
    category: politics
    tags: [朝鮮]
    summary: 高麗の武将が王朝を交代させ、儒教を国の背骨に据えた。
    detail: |
      李成桂が高麗を倒して朝鮮王朝を開いた出来事で、1392年のこと。
      武将による王朝の交代であり、儒教が国の背骨に据えられた。

      当時の高麗は、北から紅巾賊、南から倭寇の侵入を受けて疲弊していた。
      国内では権門が土地を集積し、国家の財政は破綻に近い。
      1388年、明が高麗の北部に行政機関を置こうとした。
      朝廷は遼東への出兵を決め、李成桂に命じる。
      彼は四つの理由を挙げて反対したが受け入れられず、出陣する。

      威化島で軍を返し、都を制圧した。
      反対する将軍と王を排除し、実権を握る。
      その後の4年で、土地制度の改革を進めた。
      権門の大土地を没収し、官僚への給与の原資として再配分する。
      儒学を学んだ新しい官僚層が、この改革を支えた。

      1392年、最後の王から譲位を受ける形で即位する。
      高麗の王族は各地で殺された。
      国号は明の承認を求め、朝鮮と定められた。
      都は漢陽へ移される。
      新王朝は、仏教を抑えて朱子学を国家の原理とした。
      寺院の土地と奴婢が没収され、僧の地位は下げられる。
      500年にわたる儒教国家の枠組みが、この交代によって決まった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/King_Taejo_Yi_01.jpg/500px-King_Taejo_Yi_01.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:King_Taejo_Yi_01.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/李成桂

  - id: hangul
    year: 1446
    title: 訓民正音（ハングル）の公布
    category: culture
    tags: [朝鮮, 文字]
    summary: 世宗が民衆にも書ける文字を作らせ、独自の表記体系が生まれた。
    detail: |
      朝鮮王朝の世宗が制定した文字体系で、1446年に公布された。
      正式には訓民正音といい、民を教える正しい音という意味である。
      計画的に作られた文字として、世界でも珍しい。

      それまで、朝鮮語を書くには漢字を用いるほかなかった。
      語順も文法も異なるため、正確に書き表すのは難しい。
      習得には長い年月を要し、事実上は支配層のものだった。

      新しい文字は、発音の仕組みを分析して作られている。
      子音の字形は、発音するときの舌や唇の形をかたどった。
      母音は、天と地と人を表す三つの要素を組み合わせて構成される。
      字母は28あり、それを音節ごとに組み合わせて書く。
      賢い者は朝のうちに、愚かな者でも十日で学べると、解説書に記された。

      公布の当初、学者からは強い反対があった。
      漢字を捨てることは中華の文明から離れることだという批判である。
      以後も公文書は漢文で書かれ、この文字は女性や庶民の使う文字とみなされた。
      19世紀末から地位が変わる。
      民族の文字として再評価され、新聞や教科書に用いられるようになった。
      現在は韓国と北朝鮮の公式の文字である。
      公布の日は記念日とされている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/c/c7/Hunmin_jeong-eum.jpg
      credit: Sejong the Great / Public domain
      page: https://commons.wikimedia.org/wiki/File:Hunmin_jeong-eum.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/訓民正音

  - id: imjin-war
    year: 1592
    title: 文禄の役（壬辰倭乱）
    category: war
    tags: [朝鮮, 日本]
    summary: 豊臣秀吉の侵攻に明の援軍と李舜臣の水軍が抗し、半島は荒廃した。
    detail: |
      豊臣秀吉が朝鮮に侵攻した戦争で、1592年に始まり1598年まで続いた。
      朝鮮では壬辰倭乱と呼ばれる。
      明の援軍と李舜臣の水軍が抗し、半島は荒廃した。

      秀吉は、明の征服を掲げて朝鮮に道を開くよう求めた。
      拒否されると、16万の兵を渡海させる。
      緒戦は日本側が圧倒した。
      鉄砲を備えた軍が北上し、20日で漢城、2か月で平壌を占領する。
      国王は北の国境まで避難した。

      情勢を変えたのは三つの要素である。
      第一に、李舜臣の水軍が制海権を握り、海上の補給を断った。
      第二に、各地で義兵が蜂起し、後方を脅かした。
      第三に、明が大軍を送って平壌を奪回した。
      戦線は膠着し、講和の交渉が始まる。
      双方の使者が本国に偽りの内容を伝えたため、条件が食い違って決裂した。
      1597年に再び侵攻が行われたが、進撃は限られた。
      翌年、秀吉の死によって撤退する。

      朝鮮の被害は甚大だった。
      耕地と人口が大きく減り、文化財が焼かれ、多数の陶工が連行される。
      明も戦費で財政を傷め、その衰退の一因になった。
      日本では豊臣政権が弱まり、関ヶ原へつながる。
      東アジアの三国すべてに影響を残した戦争である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Siege-of-Busanjin-1592.jpg/500px-Siege-of-Busanjin-1592.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Siege-of-Busanjin-1592.jpg
    links:
