      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アジア通貨危機

  - id: inter-korean-summit
    year: 2000
    title: 初の南北首脳会談
    category: politics
    tags: [朝鮮]
    summary: 分断後初めて南北の指導者が会ったが、和解は定着しなかった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/南北首脳会談

  - id: hallyu
    year: 1997
    circa: true
    title: 韓流の広がり
    category: culture
    tags: [韓国, 大衆文化]
    summary: ドラマと音楽がアジアから世界へ広がり、文化が有力な輸出品になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/韓流
