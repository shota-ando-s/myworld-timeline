  - id: qing-submission
    year: 1637
    title: 清への服属
    category: war
    tags: [朝鮮, 清]
    summary: 明への義理と現実の力の間で引き裂かれ、以後は清に朝貢した。
    detail: |
      朝鮮が清に服属した出来事で、1637年のこと。
      二度の侵攻の末、国王が自ら出て降伏の礼をとった。
      以後、清に朝貢する関係が続く。

      1623年の政変で成立した政権は、明への義理を掲げて後金と対立した。
      1627年、後金が侵攻した。
      短期間の戦闘の後、兄弟の関係を結ぶ条件で和平が成立する。
      1636年、後金は国号を清と改め、皇帝を称した。
      朝鮮に臣従を求めたが、朝廷はこれを拒む。
      中華の正統は明にあるという立場である。

      同じ年の冬、清の大軍が侵攻した。
      王は江華島へ避難しようとしたが間に合わず、南漢山城に籠もる。
      45日の籠城の末、江華島が陥落して王族が捕らえられたことで降伏を決めた。
      1637年1月、王は城を出て、皇帝の前で三跪九叩頭の礼を行った。
      世子を含む王族が人質として連行される。
      以後、朝鮮は清の暦を用い、朝貢を行った。

      国内では、屈辱の記憶が強く残る。
      明への義理を果たせなかったという意識から、自らこそが中華の正統を継ぐという主張が生まれた。
      北への復讐を掲げる議論も長く続く。
      現実の力関係と理念の対立が、最も鮮明に現れた出来事である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/Flag_of_China_%281889%E2%80%931912%29.svg/500px-Flag_of_China_%281889%E2%80%931912%29.svg.png
      credit: "原作: zh:清朝政府 ベクタ: Sodacan / Public domain"
