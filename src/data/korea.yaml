  - id: silhak
    year: 1700
    circa: true
    title: 実学の広がり
    category: religion
    tags: [朝鮮, 思想]
    summary: 観念的な朱子学を批判し、農業・商業・技術を重んじる学問が現れた。
    detail: |
      朝鮮王朝で実用を重んじる学問が広がった動きで、17世紀から18世紀にかけて展開した。
      観念的になった朱子学を批判し、農業、商業、技術を論じた。

      背景には、二つの戦争による荒廃がある。
      日本と清の侵攻で国土と経済が傷つき、現実の問題に答えられない学問への不満が広がった。
      党争の激化も、学問が実務から離れていることの表れとみられる。
      議論は大きく二つの流れに分かれる。
      一つは土地の制度に注目し、農民に土地を分配することで社会を立て直すべきだと説いた。
      もう一つは、清から技術と商業の仕組みを学ぶべきだと主張する。
      北学派と呼ばれ、貨幣の流通、道路と車の整備、対外交易の拡大を論じた。

      清を通じて西洋の知識も入った。
      天文、地理、数学の書物が読まれ、世界地図が伝えられる。
      カトリックの教えに触れる者も現れた。

      代表的な学者が丁若鏞である。
      流配の地で500巻を超える著作を著し、行政、法、農業、医学を論じた。
      水原の城の築造では、滑車を用いた装置を設計している。
      これらの議論の多くは、政策として実現しなかった。
      それでも、近代の改革の思想的な源として再評価されている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/実学

  - id: korea-catholicism
    year: 1784
    title: カトリックの受容
    category: religion
    tags: [朝鮮, キリスト教]
    summary: 宣教師なしに書物から信仰が広まった珍しい例。のちに厳しい弾圧を受けた。
    detail: |
      朝鮮でカトリックの信仰が受け入れられた出来事で、1784年を起点とする。
      宣教師の布教によらず、書物から信仰が広まった珍しい例である。

      17世紀以来、清を訪れた使節が西洋の書物を持ち帰っていた。
      天文と数学の書に加え、キリスト教の教義を漢文で説いた書物も含まれる。
      実学の学者たちが、これを学問の対象として研究した。
      やがて、信仰として受け入れる者が現れる。
      1784年、北京を訪れた青年が洗礼を受けて帰国した。
      彼が仲間に洗礼を授け、共同体が作られる。
      聖職者が一人もいないまま信徒の組織が生まれたことになる。

      広がりの背景には、身分を問わない平等の教えがある。
      厳格な身分制度のもとで、中人や庶民、女性に受け入れられた。
      しかし、祖先の祭祀を偶像崇拝として禁じたことが、決定的な対立を生む。
      儒教を国家の原理とする体制のなかで、これは秩序への挑戦とみなされた。

      1801年から大規模な弾圧が始まる。
      数千人が処刑され、以後も迫害が繰り返された。
      19世紀後半に信教の自由が認められると、信徒は再び増えた。
      現在の韓国では、カトリックとプロテスタントを合わせて人口の三割近くがキリスト教徒である。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/韓国のキリスト教

  - id: ganghwa-treaty
    year: 1876
    title: 日朝修好条規
    category: politics
    tags: [朝鮮, 日本]
    summary: 日本が結ばせた不平等条約。朝鮮をめぐる日清の対立が表面化した。
    detail: |
      日本と朝鮮が結んだ条約で、1876年のこと。
      江華島事件を機に、日本が軍艦を背景に締結を迫った。
      朝鮮にとって最初の近代的な条約であり、不平等な内容だった。

      前年、日本の軍艦が朝鮮の沿岸で測量を行い、砲撃を受ける事件が起きた。
      日本はこれを口実に、開国を要求する。
      条約の第一条は、朝鮮が自主の国であることを明記している。
      一見すると朝鮮の独立を認める内容だが、清との宗属の関係を否定する意図があった。

      内容は、釜山を含む三つの港の開港、日本人の居留と交易の許可、領事裁判権、関税の免除である。
      日本が欧米から押しつけられたのと同じ形式の不平等条約を、今度は自らが結ばせたことになる。
      朝鮮側では、開国をめぐって激しい対立が起きた。
      衛正斥邪を掲げる儒学者は、締結に強く反対する。
      以後、アメリカ、イギリス、ロシアとも同様の条約が結ばれた。

      この条約によって、朝鮮をめぐる日清の対立が表面化する。
      開化派と守旧派の争い、農民の蜂起、日清戦争、日露戦争へと連なる過程の起点になった。
      東アジアの伝統的な国際秩序が崩れ、条約にもとづく関係へ移る節目でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Nittyousyukoujouki_kanren_MAP.JPG/500px-Nittyousyukoujouki_kanren_MAP.JPG
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Nittyousyukoujouki_kanren_MAP.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日朝修好条規

  - id: donghak-rebellion
    year: 1894
    title: 甲午農民戦争（東学党の乱）
    category: society
    tags: [朝鮮, 反乱]
    summary: 農民の蜂起が日清両軍の出兵を招き、日清戦争の引き金になった。
    detail: |
      朝鮮で起きた大規模な農民の蜂起で、1894年のこと。
      東学の信者が指導したため、東学党の乱とも呼ばれる。
      日清両軍の出兵を招き、日清戦争の引き金になった。

      東学は、19世紀半ばに創始された宗教である。
      西学すなわちキリスト教に対抗する名であり、儒教、仏教、民間信仰の要素を合わせ、人はみな天を内に持つと説いた。
      蜂起の直接の原因は、地方官の苛政である。
      不当な税の取り立てに抗議した農民が武装し、全羅道で官軍を破った。
      要求は、腐敗した官吏の処罰、身分制の撤廃、負債の帳消し、そして外国勢力の排除である。

      朝廷は自力で鎮圧できず、清に援軍を求めた。
      清が出兵すると、日本も条約を根拠に出兵する。
      農民軍は、外国軍の介入を避けるため政府と和約を結び、いったん解散した。
      地方には自治の機関が設けられる。
      しかし両国の軍は撤退せず、日清戦争が始まった。

      同年の秋、農民軍は日本軍の排除を掲げて再び蜂起する。
      近代的な装備の日本軍に敗れ、指導者は処刑された。
      身分制の廃止など、要求の一部はその後の改革に取り入れられた。
      民衆の運動が国際的な戦争の引き金になった例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Sabal_Tongmun.jpg/500px-Sabal_Tongmun.jpg
      credit: "Twenty rebel leaders of Jeongeub, Gobu, and Taein Life time: All hanged in March 1895. / Public domain"
      page: https://commons.wikimedia.org/wiki/File:Sabal_Tongmun.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/甲午農民戦争
    related: [first-sino-japanese-war]

  - id: korea-annexation
    year: 1910
    title: 韓国併合
    category: politics
    tags: [朝鮮, 日本]
    summary: 大韓帝国が消滅し、35年間の植民地統治が始まった。
    detail: |
      日本が大韓帝国を併合した出来事で、1910年8月のこと。
      国家が消滅し、35年の植民地統治が始まった。

      過程は段階的だった。
      1905年の保護条約で外交権が奪われ、統監府が置かれる。
      1907年には皇帝が退位させられ、内政の権限も移り、軍が解散させられた。
      1909年には司法と警察の権限も失われる。

      各地で義兵が蜂起して抵抗した。
      数年にわたり戦闘が続き、鎮圧の過程で多数が死亡する。
      1909年、初代統監の伊藤博文がハルビンで安重根に射殺された。
      これが併合を後押ししたとされる。
      1910年8月22日、条約が調印された。
      公表は一週間後である。
      韓国の皇帝が統治権を日本の天皇に譲るという形式がとられた。

      条約の効力をめぐっては、現在も見解が分かれる。
      韓国側は、強制によるもので当初から無効だと主張する。
      日本側は、当時の国際法上は有効に成立したとする立場をとってきた。
      1965年の日韓基本条約では、もはや無効であると両論を含む表現で合意された。
      朝鮮総督府が置かれ、武力を背景とする統治が始まる。
      国を失った経験は、その後の民族意識の形成に決定的な影響を与えた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/韓国併合

  - id: march-first-movement
    year: 1919
    title: 三・一独立運動
    category: society
    tags: [朝鮮, 独立]
    summary: 全土に広がった非暴力の独立宣言。中国の五・四運動にも影響した。
    detail: |
      朝鮮全土に広がった独立運動で、1919年3月1日に始まった。
      非暴力の独立宣言から、数か月にわたる大衆運動に発展する。
      中国の五四運動にも影響を与えた。

      背景には複数の要因がある。
      武断統治への不満、第一次世界大戦後の民族自決の理念、そして日本に留学していた学生の宣言である。
      前皇帝の高宗が1月に急死し、毒殺の噂が広まったことも人々を動かした。
      3月1日、33人の宗教指導者が独立宣言に署名した。
      同じ日、ソウルの公園で宣言が読み上げられ、群衆が独立万歳を叫ぶ。

      運動は数日で全土に広がった。
      延べ200万人が参加したとされる。
      暴力に訴えないことが原則とされた。
      日本側は軍と警察で鎮圧した。
      数千人が死亡し、数万人が逮捕される。
      提岩里では、教会に村人を閉じ込めて放火する事件が起きた。

      この運動を受けて、統治の方針は文化政治へ転換される。
      上海では大韓民国臨時政府が樹立された。
      中国では2か月後に五四運動が起き、インドの運動にも伝えられた。
      韓国では3月1日が祝日とされ、現在の憲法の前文にもこの運動の精神が記されている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/6/6f/March_1st_movement.jpg
      credit: ja:User:Cinnamon (his own work) / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:March_1st_movement.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/三・一運動
    related: [may-fourth]

  - id: korea-liberation
    year: 1945
    title: 解放と南北の分割占領
    category: politics
    tags: [朝鮮, 冷戦]
    summary: 独立の喜びのすぐあとに、38度線で米ソに分けられた。
    detail: |
      日本の敗戦によって朝鮮が解放され、同時に南北が分割占領された出来事で、1945年のこと。
      独立の喜びのすぐあとに、38度線で分けられることになった。

      8月15日、日本の降伏が放送された。
      各地で人々が街に出て、独立を祝う。
      国内では、すでに自治の準備が進められていた。
      建国準備委員会が組織され、全国に支部が作られる。
      9月には人民共和国の樹立が宣言された。

      一方、連合国の側では分割が決まっていた。
      ソ連軍が北から進撃するなか、アメリカが38度線を境とする分割占領を提案し、ソ連が同意する。
      アメリカ軍が南に到着したのは9月である。
      自治の組織を承認せず、軍政を敷いた。
      総督府の職員を当面留任させたことも反発を招く。

      北ではソ連の支援のもとで人民委員会が組織され、土地改革が実行された。
      米ソの協議で信託統治が提案されると、これに反対する運動が広がる。
      賛否をめぐって左右の対立が激化した。
      統一政府を作る交渉は決裂し、1948年に二つの国家が成立する。
      35年の支配から解放された年が、同時に分断の始まりの年になった。
      当事者の意思が働かないまま、外部の合意で境界が引かれた例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Gyeongbokgung-GeunJeongJeon.jpg/500px-Gyeongbokgung-GeunJeongJeon.jpg
      credit: 英語版ウィキペディアのBlmtduddlさん / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Gyeongbokgung-GeunJeongJeon.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/連合軍軍政期_(朝鮮史)

  - id: two-koreas
    year: 1948
    title: 南北に二つの政府が立つ
    category: politics
    tags: [朝鮮]
    summary: 統一政府の望みが絶たれ、2年後の戦争に向かった。
    detail: |
      朝鮮半島に二つの政府が成立した出来事で、1948年のこと。
      統一政府の望みが絶たれ、2年後の戦争に向かうことになる。

      米ソの協議は決裂していた。
      信託統治の提案をめぐって国内の左右が激しく対立し、統一政府の枠組みは作れない。
      1947年、アメリカは問題を国連へ付託した。
      国連は全朝鮮での総選挙を決議するが、北側は監視団の入境を拒む。

      1948年5月、南だけで選挙が行われた。
      金九をはじめ、単独選挙に反対して参加しない勢力もあった。
      8月15日、大韓民国が成立する。
      北では、9月9日に朝鮮民主主義人民共和国が成立した。
      双方とも、自らが半島全体の唯一の正統な政府だと主張した。
      憲法にもその立場が書き込まれる。

      1948年、済州島では単独選挙への反対から蜂起が起き、鎮圧の過程で数万人が死亡した。
      米ソの軍はいったん撤退する。
      2年後、北の侵攻によって戦争が始まった。
      休戦後も、二つの国家が並び立つ状態は変わらない。
      外部の対立の構図が、一つの民族の国家を二つに分けた。
      冷戦が終わった後もこの分断だけが残ったことが、その根の深さを示している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Gyeongbokgung-GeunJeongJeon.jpg/500px-Gyeongbokgung-GeunJeongJeon.jpg
      credit: 英語版ウィキペディアのBlmtduddlさん / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Gyeongbokgung-GeunJeongJeon.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/連合軍軍政期_(朝鮮史)

  - id: korean-war
    year: 1950
    title: 朝鮮戦争
    category: war
    tags: [朝鮮, 冷戦]
    summary: 南北の戦争に米中が介入。1953年の休戦で分断が固定された。
    detail: |
      朝鮮半島で行われた戦争で、1950年6月に始まり1953年7月の休戦まで続いた。
      南北の戦争に米中が介入し、国際的な戦争になった。
      休戦によって分断が固定される。

      北朝鮮軍が38度線を越えて南下し、3日でソウルを占領した。
      短期間で半島の大半を制圧し、南は釜山周辺に追い詰められる。
      国連の安全保障理事会は、ソ連が欠席するなかで軍の派遣を決議した。
      アメリカを中心とする国連軍が編成される。
      9月、仁川への上陸作戦によって戦況が逆転した。
      国連軍は北上し、中国の国境に迫る。
      10月、中国が義勇軍の名で参戦した。
      数十万の兵が投入され、戦線は再び南へ押し戻される。

      以後、38度線の付近で膠着した。
      2年にわたり、わずかな土地をめぐる消耗戦が続く。
      1953年、板門店で休戦協定が結ばれた。
      韓国は調印していない。

      死者は軍民合わせて数百万に上る。
      国土は破壊され、1000万人が離散家族になった。
      平和条約は締結されておらず、法的には現在も休戦の状態である。
      日本は特需によって経済を回復させ、冷戦の構図は東アジアで固定された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Korean_War_Montage_2.png/500px-Korean_War_Montage_2.png
      credit: All photographs are works of the United States federal government. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Korean_War_Montage_2.png
    links:
