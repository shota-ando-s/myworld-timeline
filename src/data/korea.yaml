  - id: goryeo-founded
    year: 918
    title: 高麗の建国
    category: politics
    tags: [朝鮮]
    summary: 後三国の争いを収め、仏教を国の支えとする王朝が始まった。
    detail: |
      王建が高麗を建国した出来事で、918年のこと。
      後三国の争いが収まり、仏教を国の支えとする王朝が始まった。

      新羅は9世紀から急速に衰えていた。
      王位をめぐる争いが続き、地方では豪族が自立する。
      重税に耐えかねた農民の反乱も相次いだ。
      各地の勢力のうち、甄萱が後百済を、弓裔が後高句麗を建てる。
      新羅と合わせて後三国と呼ばれる状態になった。

      王建は後高句麗の武将として頭角を現した。
      弓裔が自らを弥勒と称して暴政を行うと、家臣に擁立されて王位を奪う。
      国号を高麗と改め、都を自らの本拠である開城へ移した。
      統一には18年を要した。
      武力による征服と、婚姻や厚遇による懐柔を組み合わせる。
      935年に新羅が自ら国を譲り、翌年に後百済が滅んで統一が完成した。

      新王朝は、旧三国の人々を等しく扱う方針をとった。
      渤海の遺民も受け入れている。
      仏教は国家の宗教として保護された。
      国家的な法会が定期的に行われ、寺院が広大な土地を持つ。
      開城は交易の港に近く、商業が発達した。
      アラビアの商人も訪れ、その記録からコリアの名が西方へ伝わったとされる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/54/Royal_flag_of_Goryeo_%28Bong-gi%29.svg/500px-Royal_flag_of_Goryeo_%28Bong-gi%29.svg.png
      credit: Samhanin / Public domain
      page: https://commons.wikimedia.org/wiki/File:Royal_flag_of_Goryeo_(Bong-gi).svg
    links:
