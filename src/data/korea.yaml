        url: https://ja.wikipedia.org/wiki/朝鮮戦争

  - id: april-revolution
    year: 1960
    title: 四月革命
    category: society
    tags: [韓国, 民主化]
    summary: 学生の抗議が大統領を辞任に追い込み、民主化運動の原点になった。
    detail: |
      韓国で学生の抗議が大統領を辞任に追い込んだ出来事で、1960年4月のこと。
      民主化運動の原点とされる。

      同年3月の選挙で、大規模な不正が行われた。
      投票箱のすり替え、代理投票、開票の操作が公然と行われる。
      抗議のデモが各地で起きた。
      馬山では、参加していた高校生が行方不明になる。
      4月、その遺体が催涙弾を顔に受けた状態で港に浮かんでいるのが見つかった。

      報道によって怒りが全国に広がる。
      4月19日、ソウルで数万の学生と市民が大統領官邸へ向かった。
      警察が発砲し、100人以上が死亡する。
      非常戒厳令が出されたが、軍は発砲を拒んだ。
      25日には大学教授団がデモを行い、大統領の退陣を求める。
      翌26日、李承晩は辞任を表明した。
      ハワイへ亡命する。

      民主的な選挙によって新しい政権が成立した。
      議院内閣制へ移行し、言論の自由が回復する。
      しかし政権は安定せず、1年後に軍事クーデタによって倒された。
      市民の力によって政権を倒した経験は、その後の運動に受け継がれる。
      1987年の民主化も、この記憶の延長にある。
      4月19日は現在、記念日になっている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/8/8a/4.19_%ED%98%81%EB%AA%85.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:4.19_%ED%98%81%EB%AA%85.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/四月革命_(韓国)

  - id: korea-japan-treaty
    year: 1965
    title: 日韓基本条約
    category: politics
    tags: [韓国, 日本]
    summary: 国交が結ばれ経済協力が始まったが、歴史認識の対立は残った。
    detail: |
      日本と韓国が国交を樹立した条約で、1965年のこと。
      14年に及ぶ交渉の末に成立した。
      経済協力が始まったが、歴史認識の対立は残った。

      交渉は1951年に始まった。
      植民地支配の性格をめぐる認識の隔たりから、繰り返し中断する。
      最大の争点は、過去の条約の効力である。
      韓国側は、1910年の併合は当初から無効だと主張した。
      日本側は、当時は有効に成立したとする立場をとる。

      合意の文言は、もはや無効であるという表現になった。
      双方が自らの解釈を維持できる曖昧な言い方である。
      請求権については、経済協力の名目で処理された。
      無償3億ドル、有償2億ドル、民間の借款3億ドルが供与される。
      完全かつ最終的に解決されたと文書に記された。

      この資金は、製鉄所や高速道路の建設に充てられ、韓国の経済成長を支えた。
      韓国国内では、屈辱的な条約だとして大規模な反対運動が起きた。
      戒厳令が敷かれるなかで批准される。
      個人の請求権が消滅したかどうかをめぐる解釈の相違は、現在も続いている。
      国交の樹立という成果と、未解決のまま残された論点が、同じ条約のなかに並んでいる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/f/f5/A_copy_of_Treaty_on_Basic_Relations_between_Japan_and_the_Republic_of_Korea.jpg
      credit: Motoko C. K. / CC0
      page: https://commons.wikimedia.org/wiki/File:A_copy_of_Treaty_on_Basic_Relations_between_Japan_and_the_Republic_of_Korea.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日本国と大韓民国との間の基本関係に関する条約

  - id: gwangju-uprising
    year: 1980
    title: 光州事件
    category: society
    tags: [韓国, 民主化]
    summary: 軍による市民の弾圧。その記憶が1987年の民主化を後押しした。
    detail: |
      韓国の光州で市民の抗議が軍によって鎮圧された事件で、1980年5月のこと。
      多数の死者を出した。
      その記憶が1987年の民主化を後押しする。

      朴正煕の暗殺の後、民主化への期待が高まっていた。
      しかし全斗煥ら軍の一部が実権を握り、5月17日に非常戒厳令を全土へ拡大する。
      政治家が逮捕され、大学は閉鎖された。
      翌日、光州の学生が抗議のデモを行った。
      投入された空挺部隊が、棍棒と銃剣で激しく制圧する。
      その暴力が市民の怒りを呼び、抗議は市全体に広がった。

      市民は警察署と予備軍の倉庫から武器を取り、市民軍を組織する。
      21日、軍はいったん市外へ撤退した。
      以後の数日、市民による自治が行われた。
      炊き出しと献血が組織され、略奪はほとんど起きなかったと記録されている。

      27日未明、軍が市内へ突入し、道庁に立てこもった市民軍を制圧した。
      死者は公式には200人前後とされるが、実際にはそれを上回るとみられる。
      当時、報道は統制され、暴徒による騒乱として伝えられた。
      真相が公に認められたのは、民主化の後である。
      現在、この事件は民主化運動として国家に公認されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Gwangju5.18FriedhofFotos.JPG/500px-Gwangju5.18FriedhofFotos.JPG
      credit: Schlarpi / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Gwangju5.18FriedhofFotos.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/光州事件

  - id: korea-democratization
    year: 1987
    title: 六月民主抗争と民主化宣言
    category: society
    tags: [韓国, 民主化]
    summary: 大統領の直接選挙が実現し、開発独裁から民主体制へ移った。
    detail: |
      韓国で大統領の直接選挙が実現した出来事で、1987年のこと。
      6月の大規模な抗議を受けて、政権が要求を受け入れた。
      開発独裁から民主体制へ移る転換点である。

      1月、取り調べを受けていた大学生が死亡した。
      当局は病死と発表したが、拷問による窒息死であることが明らかになる。
      4月、大統領が憲法の改正を行わないと表明した。
      直接選挙の要求を拒む内容であり、反発が一気に高まる。

      6月9日、デモに参加していた学生が催涙弾を頭に受けて重体になった。
      翌日から抗議は全国に広がる。
      学生だけでなく、会社員や商店主が加わったことが、それまでとの違いだった。
      政府は軍の投入を検討したが、実行しなかった。
      翌年のソウル五輪を控え、国際的な批判を避ける必要があったとされる。

      6月29日、与党の大統領候補が直接選挙の受け入れを発表した。
      憲法が改正され、5年任期で再選のない大統領制が定められる。
      12月の選挙では、野党の候補が分裂したため与党の候補が当選した。
      それでも、以後の政権交代は選挙によって行われている。
      市民の運動が制度を変えた事例として、現在も振り返られている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/%EA%B3%A0_%EC%9D%B4%ED%95%9C%EC%97%B4_%EC%B6%94%EB%AA%A8_%EA%B5%B0%EC%A4%91.jpg/500px-%EA%B3%A0_%EC%9D%B4%ED%95%9C%EC%97%B4_%EC%B6%94%EB%AA%A8_%EA%B5%B0%EC%A4%91.jpg
      credit: 서울특별시청 / KOGL Type 1
      page: https://commons.wikimedia.org/wiki/File:%EA%B3%A0_%EC%9D%B4%ED%95%9C%EC%97%B4_%EC%B6%94%EB%AA%A8_%EA%B5%B0%EC%A4%91.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/6月民主抗争

  - id: seoul-olympics
    year: 1988
    title: ソウルオリンピック
    category: society
    tags: [韓国]
    summary: 経済成長と民主化を世界に示し、東側諸国との国交樹立も進んだ。
    detail: |
      韓国のソウルで開かれた夏季五輪で、1988年のこと。
      経済成長と民主化を世界に示す舞台になった。
      東側諸国との国交の樹立も進んだ。

      開催の決定は1981年である。
      当時の韓国は軍政下にあり、経済も成長の途上だった。
      準備の過程で、五輪は政治に影響を与えた。
      1987年の民主化運動に際して、政権が軍を投入しなかった理由の一つは、大会を控えて国際的な批判を避ける必要があったとされる。

      大会には159の国と地域が参加した。
      前の二大会は東西の陣営がそれぞれ不参加を決めており、双方が揃うのは12年ぶりである。
      ソ連と東欧、中国が参加し、冷戦の終わりを象徴する大会になった。
      この機会に、東側諸国との交流が始まる。
      ハンガリーをはじめ、社会主義国との国交の樹立が続いた。

      韓国にとっては、経済成長を示す舞台でもある。
      開催のために道路、地下鉄、競技場が整備された。
      一方、市街の整備の過程で貧困層の住居が強制的に撤去され、数十万人が立ち退きを強いられた。
      陸上の短距離では、優勝者が薬物検査で失格になる出来事も起きた。
      国家の威信を示す場としての五輪の性格が、複数の面で現れた大会である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Fireworks_at_the_closing_ceremonies_of_the_1988_Summer_Games.JPEG/500px-Fireworks_at_the_closing_ceremonies_of_the_1988_Summer_Games.JPEG
      credit: Steve McGill / Public domain
      page: https://commons.wikimedia.org/wiki/File:Fireworks_at_the_closing_ceremonies_of_the_1988_Summer_Games.JPEG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/1988年ソウルオリンピック

  - id: asian-financial-crisis-kr
    year: 1997
    title: アジア通貨危機とIMF管理
    category: economy
    tags: [韓国, 経済危機]
    summary: 財閥中心の経済が揺らぎ、構造改革と格差の拡大につながった。
    detail: |
      アジア通貨危機によって韓国が経済危機に陥った出来事で、1997年のこと。
      IMFの管理下で構造改革が進められた。
      財閥中心の経済が揺らぎ、格差の拡大につながる。

      危機はタイの通貨の急落から始まり、インドネシア、マレーシアへ波及した。
      韓国では、大企業の連鎖的な破綻が引き金になる。
      背景には構造的な問題があった。
      財閥は借入に依存して事業を多角化し、負債の比率が極端に高い。
      金融機関の審査は甘く、政府との関係で融資が決まる面があった。
      短期の外貨の借入に依存していたことも弱点になる。

      外国の資金が一斉に引き揚げられ、外貨準備が底をついた。
      12月、IMFに支援を要請する。
      支援の条件は厳しかった。
      高金利、財政の緊縮、金融機関の整理、労働市場の柔軟化が求められる。

      多数の企業と銀行が倒産し、失業率は数倍になった。
      国民が金の装身具を供出する運動も起きる。
      改革の結果、企業の財務は健全になり、経済は2年ほどで回復した。
      一方、整理解雇が合法化され、非正規の雇用が急増する。
      終身雇用に近い慣行が崩れ、所得の格差が広がった。
      危機の記憶は、その後の社会の不安の底流になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Asian_Financial_Crisis_EN_vector.svg/500px-Asian_Financial_Crisis_EN_vector.svg.png
      credit: User:Weaveravel / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Asian_Financial_Crisis_EN_vector.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アジア通貨危機

  - id: inter-korean-summit
    year: 2000
    title: 初の南北首脳会談
    category: politics
    tags: [朝鮮]
    summary: 分断後初めて南北の指導者が会ったが、和解は定着しなかった。
    detail: |
      韓国と北朝鮮の指導者が初めて会談した出来事で、2000年6月のこと。
      平壌で行われた。
      分断から55年を経て実現したが、和解は定着しなかった。

      韓国の金大中大統領は、圧力ではなく交流によって変化を促す太陽政策を掲げていた。
      北朝鮮も、飢饉と経済の困難のなかで外部からの支援を必要としている。
      金大中が空港に到着し、金正日が直接出迎えた。
      共同宣言が発表される。
      統一の問題を自主的に解決すること、離散家族の再会を進めること、経済と文化の交流を拡大することが合意された。
      統一の方式についても、双方の案に共通点があると確認されている。

      具体的な成果もあった。
      離散家族の再会が実施され、開城に工業団地が作られる。
      金剛山への観光が始まり、鉄道の連結工事も進められた。
      同じ年、金大中はノーベル平和賞を受ける。

      しかし関係は続かなかった。
      核開発の問題が表面化し、支援と対話は中断する。
      会談の前に韓国側から巨額の送金が行われていたことも判明し、批判を招いた。
      2007年と2018年にも首脳会談が行われたが、いずれも成果は持続していない。
      対話の可能性と限界の双方を示す出来事である。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/南北首脳会談

  - id: hallyu
    year: 1997
    circa: true
    title: 韓流の広がり
    category: culture
    tags: [韓国, 大衆文化]
    summary: ドラマと音楽がアジアから世界へ広がり、文化が有力な輸出品になった。
    detail: |
      韓国の大衆文化が国外へ広がった現象で、1990年代の後半から始まった。
      ドラマと音楽がアジアから世界へ広がり、文化が有力な輸出品になった。

      きっかけは、中国と台湾で韓国のドラマと音楽が人気を得たことである。
      現地の報道が韓流という語を使い始めた。
      背景には、国内の条件がある。
      1987年以降、検閲が緩和されて表現の幅が広がった。
      1997年の通貨危機の後、政府は文化産業を輸出の柱の一つと位置づけ、支援を行う。

      2000年代、ドラマが日本と東南アジアで広く受け入れられた。
      家族の関係や感情を丁寧に描く作風が、共感を呼ぶ。
      音楽では、練習生を長期間育成し、歌と踊りと語学を訓練する方式がとられた。
      複数の国の出身者を含むグループも作られ、初めから国外の市場を想定している。

      動画の配信が広がると、地域の壁がさらに低くなった。
      2012年の一曲が世界的に流行し、2020年前後には映画と配信のドラマが国際的な賞を受ける。
      影響は経済にも及ぶ。
      化粧品、食品、観光の需要が伸び、言語の学習者も増えた。
      国家の支援と民間の競争が組み合わさった産業政策の例としても論じられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/President_Joe_Biden_and_BTS_in_the_Oval_Office_of_the_White_House%2C_May_31%2C_2022.jpg/500px-President_Joe_Biden_and_BTS_in_the_Oval_Office_of_the_White_House%2C_May_31%2C_2022.jpg
      credit: The White House / Public domain
      page: https://commons.wikimedia.org/wiki/File:President_Joe_Biden_and_BTS_in_the_Oval_Office_of_the_White_House,_May_31,_2022.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/韓流
