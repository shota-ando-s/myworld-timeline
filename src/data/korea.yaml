lane: korea

periods:
  - id: gojoseon
    title: 古朝鮮
    start: -700
    startCirca: true
    end: -108
    category: politics
    tags: [朝鮮, 古代]
    summary: 半島北部にあったとされる最初の国家。前108年に漢に滅ぼされた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/古朝鮮

  - id: han-commanderies
    title: 漢の四郡
    start: -108
    end: 313
    category: politics
    tags: [朝鮮, 中国]
    summary: 楽浪郡を中心とする中国の直轄地。大陸の文物が半島に流れ込む窓口になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/漢四郡

  - id: korea-three-kingdoms
    title: 三国時代（高句麗・百済・新羅）
    start: -57
    startCirca: true
    end: 668
    category: politics
    tags: [朝鮮]
    summary: 三つの王国が競い合い、中国・日本の双方と深く関わった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/三国時代_(朝鮮半島)

  - id: balhae
    title: 渤海
    start: 698
    end: 926
    category: politics
    tags: [朝鮮, 満洲]
    summary: 高句麗の後継を名乗り、唐や日本と使節を交わした「海東の盛国」。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/渤海_(国)

  - id: unified-silla
    title: 統一新羅
    start: 668
    end: 935
    category: politics
    tags: [朝鮮]
    summary: 唐と結んで半島を統一。仏教文化が栄えた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/新羅

  - id: goryeo
    title: 高麗
    start: 918
    end: 1392
    category: politics
    tags: [朝鮮]
    summary: Korea の語源となった王朝。高麗青磁と大蔵経の木版で知られる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高麗

  - id: goryeo-military-rule
    title: 武臣政権
    start: 1170
    end: 1270
    category: war
    tags: [朝鮮, 武人]
    summary: 武官が実権を握った100年。モンゴルへの長い抵抗もこの政権が指導した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/武臣政権

  - id: joseon
    title: 朝鮮王朝（李氏朝鮮）
    start: 1392
    end: 1897
    category: politics
    tags: [朝鮮, 儒教]
    summary: 500年続いた儒教国家。ハングルの制定と両班による統治が特徴。
    detail: |
      朱子学を国の原理として徹底し、科挙で選ばれた両班が官職と土地を握った。
      身分と儀礼の秩序が細かく定められ、その影響は現代の社会慣習にも残るとされる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/李氏朝鮮

  - id: korean-empire
    title: 大韓帝国
    start: 1897
    end: 1910
    category: politics
    tags: [朝鮮, 近代化]
    summary: 清との従属関係を断ち皇帝を称したが、日露の争いのなかで独立を保てなかった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大韓帝国

  - id: japanese-rule-korea
    title: 日本統治期
    start: 1910
    end: 1945
    category: politics
    tags: [朝鮮, 植民地]
    summary: 韓国併合から敗戦まで、朝鮮半島は日本の統治下に置かれた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日本統治時代の朝鮮

  - id: korea-division
    title: 南北分断
    start: 1945
    ongoing: true
    category: politics
    tags: [朝鮮, 冷戦]
    summary: 38度線での分割占領から始まり、80年たっても解消していない。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/38度線

  - id: south-korea
    title: 大韓民国
    start: 1948
    ongoing: true
    category: politics
    tags: [韓国]
    summary: 独裁と経済成長を経て、1987年以降は民主主義を定着させた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大韓民国

  - id: north-korea
    title: 朝鮮民主主義人民共和国
    start: 1948
    ongoing: true
    category: politics
    tags: [北朝鮮]
    summary: 一族による支配が三代続き、核開発で国際社会と対峙している。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/朝鮮民主主義人民共和国

events:
  - id: lelang-falls
    year: 313
    title: 高句麗が楽浪郡を滅ぼす
    category: war
    tags: [朝鮮, 中国]
    summary: 400年続いた中国の直轄支配が終わり、半島は三国の争いの時代に入る。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高句麗

  - id: buddhism-goguryeo
    year: 372
    title: 高句麗に仏教が伝わる
    category: religion
    tags: [朝鮮, 仏教]
    summary: 前秦から伝来し、のちに百済経由で日本へも伝わる流れの起点となった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高句麗

  - id: pyongyang-capital
    year: 427
    title: 高句麗の平壌遷都
    category: politics
    tags: [朝鮮]
    summary: 南進策に転じ、百済・新羅との三国の争いが本格化した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高句麗

  - id: salsu-battle
    year: 612
    title: 薩水大捷（隋の遠征を撃退）
    category: war
    tags: [朝鮮, 隋]
    summary: 100万と称された隋の大軍を退け、隋の滅亡を早めた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/隋の高句麗遠征

  - id: baekje-falls
    year: 660
    title: 百済の滅亡
    category: war
    tags: [朝鮮, 唐]
    summary: 唐・新羅の連合軍に敗れ、復興を助けた日本も白村江で敗れた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/百済
    related: [hakusukinoe]

  - id: silla-unification
    year: 668
    title: 新羅が半島を統一
    category: politics
    tags: [朝鮮]
    summary: 唐と連合して百済・高句麗を滅ぼし、その後は唐の勢力も追い出した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/新羅

  - id: bulguksa
    year: 751
    circa: true
    title: 仏国寺と石窟庵の造営
    category: culture
    tags: [朝鮮, 仏教, 建築]
    summary: 統一新羅の仏教文化の到達点。石窟の仏像は東アジア彫刻の傑作とされる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/仏国寺

  - id: goryeo-founded
    year: 918
    title: 高麗の建国
    category: politics
    tags: [朝鮮]
    summary: 後三国の争いを収め、仏教を国の支えとする王朝が始まった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高麗

  - id: goryeo-exam
    year: 958
    title: 科挙の導入
    category: society
    tags: [朝鮮, 官僚制]
    summary: 中国にならった試験制度が、以後1000年の支配層の形を決めた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/科挙

  - id: khitan-invasion
    year: 1010
    title: 契丹の侵入
    category: war
    tags: [朝鮮, 遼]
    summary: 三度の侵攻を退け、宋・遼と並ぶ独自の地位を保った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高麗

  - id: samguk-sagi
    year: 1145
    title: 『三国史記』の編纂
    category: culture
    tags: [朝鮮, 歴史]
    summary: 現存する朝鮮最古の歴史書。三国時代の記録の土台になっている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/三国史記

  - id: mongol-invasion-goryeo
    year: 1231
    title: モンゴルの高麗侵攻
    category: war
    tags: [朝鮮, モンゴル]
    summary: 30年に及ぶ抵抗の末に服属し、元の日本遠征にも動員された。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モンゴルの高麗侵攻

  - id: tripitaka-koreana
    year: 1251
    title: 高麗版大蔵経の完成
    category: religion
    tags: [朝鮮, 仏教, 印刷]
    summary: 8万枚を超える版木を16年かけて彫った。国を守る祈りの事業だった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高麗八万大蔵経

  - id: jikji
    year: 1377
    title: 『直指』が金属活字で刷られる
    category: science
    tags: [朝鮮, 印刷]
    summary: 現存する世界最古の金属活字本。グーテンベルクより70年以上早い。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/直指心体要節

  - id: yi-seonggye
    year: 1392
    title: 李成桂が朝鮮王朝を開く
    category: politics
    tags: [朝鮮]
    summary: 高麗の武将が王朝を交代させ、儒教を国の背骨に据えた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/李成桂

  - id: hangul
    year: 1446
    title: 訓民正音（ハングル）の公布
    category: culture
    tags: [朝鮮, 文字]
    summary: 世宗が民衆にも書ける文字を作らせ、独自の表記体系が生まれた。
    detail: |
      発音のしくみを分析して字形に反映させた、世界でも珍しい計画的な文字。
      当初は両班に軽んじられたが、20世紀に国民の文字として復権した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/訓民正音

  - id: imjin-war
    year: 1592
    title: 文禄の役（壬辰倭乱）
    category: war
    tags: [朝鮮, 日本]
    summary: 豊臣秀吉の侵攻に明の援軍と李舜臣の水軍が抗し、半島は荒廃した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/文禄・慶長の役

  - id: qing-submission
    year: 1637
    title: 清への服属
    category: war
    tags: [朝鮮, 清]
    summary: 明への義理と現実の力の間で引き裂かれ、以後は清に朝貢した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/清

  - id: silhak
    year: 1700
    circa: true
    title: 実学の広がり
    category: religion
    tags: [朝鮮, 思想]
    summary: 観念的な朱子学を批判し、農業・商業・技術を重んじる学問が現れた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/実学

  - id: korea-catholicism
    year: 1784
    title: カトリックの受容
    category: religion
    tags: [朝鮮, キリスト教]
    summary: 宣教師なしに書物から信仰が広まった珍しい例。のちに厳しい弾圧を受けた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/韓国のキリスト教

  - id: ganghwa-treaty
    year: 1876
    title: 日朝修好条規
    category: politics
    tags: [朝鮮, 日本]
    summary: 日本が結ばせた不平等条約。朝鮮をめぐる日清の対立が表面化した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日朝修好条規

  - id: donghak-rebellion
    year: 1894
    title: 甲午農民戦争（東学党の乱）
    category: society
    tags: [朝鮮, 反乱]
    summary: 農民の蜂起が日清両軍の出兵を招き、日清戦争の引き金になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/甲午農民戦争
    related: [first-sino-japanese-war]

  - id: korea-annexation
    year: 1910
    title: 韓国併合
    category: politics
    tags: [朝鮮, 日本]
    summary: 大韓帝国が消滅し、35年間の植民地統治が始まった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/韓国併合

  - id: march-first-movement
    year: 1919
    title: 三・一独立運動
    category: society
    tags: [朝鮮, 独立]
    summary: 全土に広がった非暴力の独立宣言。中国の五・四運動にも影響した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/三・一運動
    related: [may-fourth]

  - id: korea-liberation
    year: 1945
    title: 解放と南北の分割占領
    category: politics
    tags: [朝鮮, 冷戦]
    summary: 独立の喜びのすぐあとに、38度線で米ソに分けられた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/連合軍軍政期_(朝鮮史)

  - id: two-koreas
    year: 1948
    title: 南北に二つの政府が立つ
    category: politics
    tags: [朝鮮]
    summary: 統一政府の望みが絶たれ、2年後の戦争に向かった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/連合軍軍政期_(朝鮮史)

  - id: korean-war
    year: 1950
    title: 朝鮮戦争
    category: war
    tags: [朝鮮, 冷戦]
    summary: 南北の戦争に米中が介入。1953年の休戦で分断が固定された。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/朝鮮戦争

  - id: april-revolution
    year: 1960
    title: 四月革命
    category: society
    tags: [韓国, 民主化]
    summary: 学生の抗議が大統領を辞任に追い込み、民主化運動の原点になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/四月革命_(韓国)

  - id: korea-japan-treaty
    year: 1965
    title: 日韓基本条約
    category: politics
    tags: [韓国, 日本]
    summary: 国交が結ばれ経済協力が始まったが、歴史認識の対立は残った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日本国と大韓民国との間の基本関係に関する条約

  - id: gwangju-uprising
    year: 1980
    title: 光州事件
    category: society
    tags: [韓国, 民主化]
    summary: 軍による市民の弾圧。その記憶が1987年の民主化を後押しした。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/光州事件

  - id: korea-democratization
    year: 1987
    title: 六月民主抗争と民主化宣言
    category: society
    tags: [韓国, 民主化]
    summary: 大統領の直接選挙が実現し、開発独裁から民主体制へ移った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/6月民主抗争

  - id: seoul-olympics
    year: 1988
    title: ソウルオリンピック
    category: society
    tags: [韓国]
    summary: 経済成長と民主化を世界に示し、東側諸国との国交樹立も進んだ。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/1988年ソウルオリンピック

  - id: asian-financial-crisis-kr
    year: 1997
    title: アジア通貨危機とIMF管理
