        url: https://ja.wikipedia.org/wiki/ゴール朝

  - id: vasco-da-gama
    year: 1498
    title: ヴァスコ・ダ・ガマのカリカット到達
    category: economy
    tags: [大航海時代, 交易]
    summary: 喜望峰を回る航路が開かれ、ヨーロッパがインド洋交易に直接参入した。
    detail: |
      ポルトガルの航海者ヴァスコ・ダ・ガマがインドのカリカットに到達した出来事で、1498年のこと。
      喜望峰を回る航路が開かれ、ヨーロッパがインド洋の交易に直接参入した。

      出発は前年で、4隻の船団だった。
      大西洋を大きく西へ迂回して風を捉え、喜望峰を回る。
      アフリカ東岸の港で水先案内人を雇い、季節風を利用してインド洋を横断した。
      カリカットは、すでに大規模な交易港である。
      アラブ、ペルシア、中国、東南アジアの商人が集まり、香辛料の取引が行われていた。

      持参した贈り物は、現地の水準からすれば貧弱だった。
      布と砂糖と油であり、王の宮廷では嘲笑されたと記録されている。
      それでも胡椒と香辛料を積んで帰国し、航海の費用の数十倍の利益を上げた。
      この成功を受けて、ポルトガルは武力を伴う進出を進めた。
      艦隊を送って港を砲撃し、要塞を築いて通行証の制度を敷く。
      従来の交易に暴力が持ち込まれた。
      ヴェネツィアとエジプトを経由する従来の経路は打撃を受ける。

      インド洋の交易は、この航海以前から広く発達していた。
      変わったのは、ヨーロッパの国家が艦隊によってその一部を支配しようとしたことである。
      植民地化の長い過程が、ここから始まる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/Ignoto_portoghese%2C_ritratto_di_un_cavaliere_dell%27ordine_di_cristo%2C_1525-50_ca._02.jpg/500px-Ignoto_portoghese%2C_ritratto_di_un_cavaliere_dell%27ordine_di_cristo%2C_1525-50_ca._02.jpg
