      page: https://commons.wikimedia.org/wiki/File:Ignoto_portoghese,_ritratto_di_un_cavaliere_dell%27ordine_di_cristo,_1525-50_ca._02.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴァスコ・ダ・ガマ

  - id: panipat-1
    year: 1526
    title: 第一次パーニーパットの戦い
    category: war
    tags: [インド, ムガル]
    summary: バーブルが火器を用いて勝利し、ムガル帝国が始まった。
    detail: |
      バーブルがデリーのスルタンの軍を破った戦いで、1526年4月のこと。
      デリーの北方のパーニーパットで行われた。
      ムガル帝国が始まる。

      バーブルの兵は1万数千、対するローディー朝の軍は10万と象1000頭を擁していたとされる。
      数字には誇張が含まれるが、大きな差があったことは確かである。
      勝因は戦術にある。
      バーブルは荷車を鎖でつないで陣地を作り、そのあいだに大砲と鉄砲を配置した。
      両翼には機動的な騎兵を置き、敵を包み込む隊形をとる。
      これは中央アジアとオスマン帝国で用いられていた戦法である。

      正面から突撃したインド側の軍は、火器の射撃で混乱した。
      象が音に驚いて向きを変え、自軍を踏み荒らす。
      両翼から騎兵が回り込み、包囲された軍は崩れた。
      スルタンは戦死する。

      バーブルはデリーとアグラに入り、莫大な財宝を得た。
      この戦いは、火器が南アジアの戦争のあり方を変えた画期とされる。
      数と象に頼る軍が、組織的な砲撃と機動の前に敗れた。
      同じ場所では、1556年と1761年にも大きな戦いが行われている。
      北からインドへ入る経路の要にあたるためである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/37/The_battle_of_Panipat_and_the_death_of_Sultan_Ibr%C4%81h%C4%ABm%2C_the_last_of_the_L%C5%8Dd%C4%AB_Sultans_of_Delhi.jpg/500px-The_battle_of_Panipat_and_the_death_of_Sultan_Ibr%C4%81h%C4%ABm%2C_the_last_of_the_L%C5%8Dd%C4%AB_Sultans_of_Delhi.jpg
      credit: Ẓahīr ud-Dīn Muḥammad Bābur (1483-1530) It contains 30 mostly full-page miniatures in fine Mughal style by at least two different artists. / Public domain
      page: https://commons.wikimedia.org/wiki/File:The_battle_of_Panipat_and_the_death_of_Sultan_Ibr%C4%81h%C4%ABm,_the_last_of_the_L%C5%8Dd%C4%AB_Sultans_of_Delhi.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第一次パーニーパットの戦い

  - id: akbar-throne
    year: 1556
    title: アクバルの即位
    category: politics
    tags: [ムガル, 宗教共存]
    summary: 非イスラム教徒への人頭税を廃止し、宗教を越えた統治を試みた。
    detail: |
      アクバルがムガル帝国の君主として即位した出来事で、1556年のこと。
      13歳での即位である。
      非イスラム教徒への人頭税の廃止など、宗教を越えた統治が始まる。

      父の急死を受けて、遠征の途上で即位した。
      同じ年、デリーをめぐる戦いが行われ、辛うじて勝利する。
      当初は後見役が実権を握っていた。
      18歳でこれを退け、自ら統治を始める。
      方針は、征服した勢力を排除せず体制に取り込むことだった。
      ラージプートの諸侯と婚姻を結び、その当主を将軍や地方長官に任じる。
      改宗を求めず、宗教の実践も自由にした。

      1563年に巡礼税を、翌年に人頭税を廃止した。
      非ムスリムが人口の大半を占める社会で、支配の正統性を宗教以外の基準に置く試みである。
      行政では、土地の測量と収穫の算定にもとづく税制を整えた。
      官僚は数値で位置づけられ、その位階に応じて給与と軍役が決まる。

      宮廷には各宗教の代表が集められ、議論が行われた。
      翻訳の部局が置かれ、サンスクリットの叙事詩がペルシア語に訳される。
      この統治の形が、帝国を150年にわたって支えた。
      後にその原則が覆されたとき、帝国は急速に揺らぐことになる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/d/d1/Akbar1.jpg
      credit: user:Muntasir du / Public domain
      page: https://commons.wikimedia.org/wiki/File:Akbar1.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アクバル

  - id: sikh-founding
    year: 1499
    circa: true
    title: シク教の成立
    category: religion
    tags: [インド]
    summary: ヒンドゥーとイスラムの両方を批判的に受け止め、唯一神と平等を説いた。
    detail: |
      グル・ナーナクが教えを説き始め、シク教が成立した出来事で、15世紀末のこと。
      ヒンドゥー教とイスラムの双方を批判的に受け止め、唯一神と平等を説いた。

      ナーナクはパンジャーブのヒンドゥーの家に生まれ、イスラムの環境にも親しんでいた。
      30歳ごろに深い体験を得て、ヒンドゥーもムスリムもないと語ったと伝えられる。
      教えの中心は、形のない唯一の神である。
      神は特定の宗教に属さず、誰もが直接に向き合える。
      偶像の崇拝、カースト、儀礼の形式主義、苦行が否定された。

      実践として三つが説かれる。
      神の名を思うこと、正直に働いて生計を立てること、得たものを分かち合うことである。
      出家ではなく、日常の生活のなかで実践することが重んじられた。
      平等の理念を形にしたのが共同の食事である。
      カーストと身分と性別を問わず、同じ場所に座って同じ食事をとる。
      この慣行は現在も世界中の寺院で続いている。

      ナーナクの後、9人の指導者が継承した。
      第5代が聖典を編纂し、第10代が信徒の集団を組織する。
      以後は聖典そのものが指導者とされた。
      ムガル帝国との対立のなかで、共同体は武装した性格も帯びていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Hamandir_Sahib_%28Golden_Temple%29.jpg/500px-Hamandir_Sahib_%28Golden_Temple%29.jpg
