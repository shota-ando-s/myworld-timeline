  - id: tarain-battle
    year: 1192
    title: 第二次タラーインの戦い
    category: war
    tags: [イスラム, インド]
    summary: 北インドにイスラム政権が定着する決定打になった。
    detail: |
      ゴール朝の軍が北インドの連合軍を破った戦いで、1192年のこと。
      デリーの北方のタラーインで行われた。
      北インドにイスラム政権が定着する決定打になった。

      前年、同じ場所での戦いではゴール朝が敗れていた。
      ムハンマド・ゴーリーは負傷して退却し、勝ったプリトビーラージ3世は追撃しなかった。
      翌年、ゴーリーは1万を超える騎兵を率いて戻る。
      中央アジア出身の兵を主力とする軍だった。

      戦法が勝敗を分けた。
      軽装の騎兵が矢を射かけては退き、正面からの決戦を避ける。
      インド側の重装の騎兵と象は、追っては逃げられることを繰り返して消耗した。
      疲れ切ったところへ精鋭の突撃が行われ、陣は崩れる。

      プリトビーラージは捕らえられて処刑された。
      この後、デリーとその周辺は急速に制圧された。
      1206年、ゴーリーの将軍だった奴隷出身のアイバクがデリーで自立し、スルタンを名乗る。
      デリー・スルタン朝の始まりである。
      北インドの諸王国は、互いに争っていて連携できなかった。
      その弱点が、この一戦で決定的な結果を生む。
      以後600年以上、北インドの政治はイスラム系の王朝によって担われることになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Ghurid_dynasty_%28greatest_extent%29.svg/500px-Ghurid_dynasty_%28greatest_extent%29.svg.png
