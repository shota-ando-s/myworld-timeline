  - id: bangladesh-independence
    year: 1971
    title: バングラデシュの独立
    category: politics
    tags: [南アジア]
    summary: 宗教だけでは国はまとまらないことを示し、パキスタンが東西に割れた。
    detail: |
      東パキスタンがバングラデシュとして独立した出来事で、1971年のこと。
      宗教だけでは国家はまとまらないことを示した。

      パキスタンは、1947年の分離独立でムスリムの国家として成立した。
      しかし東西は1600キロ離れ、言語も文化も異なる。
      人口は東のほうが多いが、政治と軍と経済は西が握っていた。
      最初の対立は言語である。
      東ではベンガル語が話されていたが、ウルドゥー語だけを国語とする方針が示された。
      抗議運動で死者が出て、その日は現在も記念されている。

      1970年の選挙で、東を基盤とする政党が全体の過半数を得た。
      西の側は政権の移譲を拒み、翌年3月に軍が東で弾圧を開始する。
      知識人と学生が標的となり、大規模な虐殺が行われた。
      死者は数十万から300万まで推計に幅がある。

      1000万人がインドへ避難した。
      インドは当初支援にとどまったが、12月に参戦する。
      戦争は2週間で決着し、パキスタン軍は降伏した。
      バングラデシュが成立する。
      宗教を共有していても、言語と地域の差が国家を分けた事例である。
      独立後の国は、災害と貧困に直面しながら、近年は繊維産業を軸に成長を続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/BangladeshLiberationWarMontage.jpg/500px-BangladeshLiberationWarMontage.jpg
      credit: ExcelD24 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:BangladeshLiberationWarMontage.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/バングラデシュ独立戦争

  - id: india-liberalization
    year: 1991
    title: インドの経済自由化
    category: economy
    tags: [インド, 経済]
    summary: 統制経済を転換し、ITサービスを軸に高成長の時代に入った。
    detail: |
      インドが統制的な経済政策を転換した出来事で、1991年のこと。
      外貨の危機をきっかけに、規制の緩和と市場の開放が進められた。
      ITサービスを軸とする高成長の時代に入る。

      独立以来、インドは国家主導の計画経済をとってきた。
      生産には許可が必要で、輸入は厳しく制限され、外国資本の参入も限られる。
      許認可の制度は複雑で、汚職の温床にもなっていた。
      1991年、湾岸戦争による石油価格の上昇と送金の減少で、外貨準備が数週間分にまで減った。
      金を担保に借り入れるほどの事態である。

      財務相マンモハン・シンのもとで、改革が実行された。
      産業の許可制をほぼ廃止し、関税を大幅に引き下げ、外国からの直接投資を認める。
      通貨は切り下げられた。
      効果は数年で現れた。
      成長率は上がり、中間層が拡大する。

      特に伸びたのが情報技術のサービスである。
      英語を話す技術者が多く、時差を利用して欧米の業務を請け負える。
      バンガロールをはじめとする都市が拠点になった。
      一方、農業と製造業の雇用は伸び悩み、格差は広がった。
      改革の恩恵が一部に偏るという課題は、その後も残っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/41/Flag_of_India.svg/500px-Flag_of_India.svg.png
      credit: インド政府 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_India.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/インド
