        url: https://ja.wikipedia.org/wiki/プラッシーの戦い

  - id: bengal-famine-1770
    year: 1770
    title: ベンガル大飢饉
    category: disaster
    tags: [インド, 飢饉]
    summary: 数百万人が餓死。会社の徴税優先が被害を拡大したと批判された。
    detail: |
      ベンガル地方で起きた大飢饉で、1770年に最も深刻になった。
      数百万人が餓死したとされる。
      東インド会社の徴税優先が被害を拡大したと批判された。

      きっかけは、前年の凶作である。
      雨季の降雨が不足し、収穫が大きく落ち込んだ。
      会社は、1765年にベンガルの徴税権を得ていた。
      収入を最大化することが優先され、飢饉の年にも税率は引き下げられなかった。
      記録によれば、徴収額はむしろ増えている。

      穀物の取引にも問題があった。
      会社の職員が私的に米を買い占め、価格が高騰する。
      救済の措置はほとんどとられなかった。
      人口の三分の一が失われたとする推計がある。
      耕作する者を失った土地が放棄され、その後の生産も長く回復しなかった。
      この惨事は、イギリス本国でも報じられた。
      会社の統治への批判が高まり、議会が監督を強める法を作る契機になる。

      以後もインドでは飢饉が繰り返された。
      鉄道で穀物を運ぶ手段がありながら、市場に任せる方針がとられたことが批判される。
      自然の不作が、統治の判断によって大量の死に変わりうることを示した事例として、現在も議論されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/Flag_of_the_British_East_India_Company_%281801%29.svg/500px-Flag_of_the_British_East_India_Company_%281801%29.svg.png
      credit: コンピュータが読み取れる情報は提供されていませんが、Yaddahだと推定されます（著作権の主張に基づく） / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_British_East_India_Company_(1801).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イギリス東インド会社

  - id: indian-rebellion
    year: 1857
    title: インド大反乱
    category: society
    tags: [インド, 抵抗]
    summary: 傭兵の蜂起が広域の反乱に発展し、ムガル帝国と東インド会社が終わった。
    detail: |
      インドで起きた大規模な反乱で、1857年に始まった。
      東インド会社の傭兵の蜂起から広域の反乱に発展する。
      ムガル帝国と東インド会社が、ともにこれによって終わった。

      直接の引き金は、新しい銃の薬包だった。
      口で噛み切る必要があり、その油脂に牛と豚の脂が使われているという噂が広まる。
      ヒンドゥーとムスリムの双方の信仰に触れる問題である。
      背景はより広い。
      藩王国の併合、土地の権利の変更、伝統的な特権の廃止、キリスト教の布教への警戒が重なっていた。

      5月、デリー近郊で兵が蜂起し、デリーを占領した。
      名目上の存在だったムガル皇帝を擁立する。
      北インドの広い範囲で、王侯、地主、農民が加わった。
      イギリスは、シク教徒やグルカ兵を用いて鎮圧した。
      双方で虐殺が行われ、報復は苛烈をきわめる。

      1858年に鎮圧され、皇帝は流刑となってムガル帝国は消滅した。
      東インド会社も統治から外され、イギリス政府の直接統治に移る。
      以後の統治では、軍の構成が変えられ、宗教への干渉が避けられた。
      この反乱は、イギリス側では反乱、インド側では第一次独立戦争と呼ばれる。
      呼び方そのものが、歴史の見方の違いを表している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Indian_Rebellion_of_1857.jpg/500px-Indian_Rebellion_of_1857.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Indian_Rebellion_of_1857.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/インド大反乱

  - id: indian-national-congress
    year: 1885
    title: インド国民会議の結成
    category: politics
    tags: [インド, 独立運動]
    summary: 当初は穏健な請願団体。やがて独立運動の中心組織になる。
    detail: |
      インド国民会議が結成された出来事で、1885年のこと。
      当初は穏健な請願を行う団体だった。
      やがて独立運動の中心組織になる。

      設立には、イギリス人の元官僚が関わっている。
      不満を穏健な形で表現する場を作ることが、統治の安定に資するという考えがあった。
      最初の大会に集まったのは70人余りで、弁護士、ジャーナリスト、教員といった英語教育を受けた層である。
      要求も穏健だった。
      行政への参加の拡大、高級官僚の試験をインドでも実施すること、軍事費の削減などである。
      独立は掲げられていない。

      変化の契機は、1905年のベンガル分割令である。
      宗教によって住民を分ける措置に対し、大規模な反対運動が起きた。
      イギリス製品の不買と国産品の奨励、民族教育が掲げられる。

      第一次世界大戦の後、ガンディーが指導的な立場に立った。
      知識人の団体から、農民と労働者を含む大衆の運動へ変わる。
      一方、ムスリムの利害を代表する組織も別に作られ、両者の距離は次第に開いた。
      これが後の分離独立につながる。
      独立後、この組織は政党として長く政権を担った。
      設立から140年近くを経て、現在も主要政党の一つである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/Indian_National_Congress_hand_logo.svg/500px-Indian_National_Congress_hand_logo.svg.png
      credit: Original design of flag & emblem by Indian National Congress.Vectorized version by Swapnil1101. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Indian_National_Congress_hand_logo.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/インド国民会議

  - id: bengal-partition
    year: 1905
    title: ベンガル分割令
    category: politics
    tags: [インド, イギリス]
    summary: 宗教で住民を分ける統治が、大規模な反英運動を呼び起こした。
    detail: |
      イギリス領インドの総督がベンガル州を二つに分けた措置で、1905年のこと。
      宗教によって住民を分ける統治が、大規模な反英運動を呼び起こした。

      ベンガルは人口7800万を抱える巨大な州で、行政の効率が悪いというのが表向きの理由である。
      実際には政治的な意図があった。
      分割の線は、ムスリムが多数の東部とヒンドゥーが多数の西部を分けるように引かれる。
      当時、この州は民族運動の中心地だった。
      住民を宗教で分けることで、運動の力をそぐ狙いがある。

      反発は激しかった。
      分割に反対する集会が各地で開かれ、イギリス製品の不買が広がる。
      国産品を使う運動が起き、民族資本の企業が生まれた。
      独自の学校を作る動きも進む。

      国民会議は、自治を求める立場を明確にした。
      穏健な請願から、実力行使を含む運動へ移る転機である。
      一方、ムスリムの一部は分割を歓迎した。
      東部での地位の向上が期待されたためである。
      この時期に、ムスリムの利害を代表する組織が設立された。
      1911年、イギリスは分割を撤回した。
      同時に、首都をカルカッタからデリーへ移している。
      宗教による区分を統治に持ち込んだことの影響は、その後も残った。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Bengal_gazetteer_1907-9.jpg/500px-Bengal_gazetteer_1907-9.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Bengal_gazetteer_1907-9.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ベンガル分割令

  - id: gandhi-returns
    year: 1915
    title: ガンディーの帰国
    category: society
    tags: [インド, 非暴力]
    summary: 南アフリカで培った非暴力抵抗を持ち帰り、独立運動を大衆のものにした。
    detail: |
      ガンディーが南アフリカからインドへ戻った出来事で、1915年のこと。
      20年にわたる海外での経験と、そこで練り上げた非暴力抵抗の手法を持ち帰った。
      独立運動が大衆のものになる契機である。

      南アフリカへは、弁護士として訴訟の仕事で渡った。
      最初の年、一等車の切符を持ちながら列車から降ろされた経験が転機になったとされる。
      以後、インド系住民の権利のために運動を続けた。

      そこで用いたのが、非暴力による不服従である。
      不当な法に従わず、逮捕を受け入れ、暴力には応じない。
      相手の良心と世論に働きかける方法である。
      帰国後、まず1年をかけてインド各地を三等車で回った。
      農村の実情を自分の目で確かめることを、活動の前提とする。

      最初に関わったのは、藍の栽培を強制されていた農民の争議である。
      次いで綿工場の労働者と、税の減免を求める農民の運動を支援した。
      いずれも地域の具体的な問題であり、そこで手法の有効性を示す。
      それまでの運動は、英語を話す知識人が中心だった。
      ガンディーは農民と労働者を運動に引き入れ、規模を一変させる。
      服装も変えた。
      手織りの布を身につけ、農民と同じ姿で行動した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7a/Mahatma-Gandhi%2C_studio%2C_1931.jpg/500px-Mahatma-Gandhi%2C_studio%2C_1931.jpg
      credit: Elliott & Fry / Public domain
      page: https://commons.wikimedia.org/wiki/File:Mahatma-Gandhi,_studio,_1931.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マハトマ・ガンディー

  - id: amritsar-massacre
    year: 1919
    title: アムリットサル虐殺
    category: society
    tags: [インド, イギリス]
    summary: 非武装の群衆への発砲が、イギリス統治への信頼を決定的に失わせた。
    detail: |
      イギリス軍がインドの非武装の群衆に発砲した事件で、1919年4月のこと。
      パンジャーブのアムリットサルで起きた。
      イギリス統治への信頼が決定的に失われる。

      背景には、戦後の統制法への反発がある。
      第一次世界大戦への協力の見返りとして自治が期待されていたが、逆に令状なしの逮捕を認める法が定められた。
      抗議運動が各地で起き、パンジャーブでは指導者が逮捕される。
      4月13日、広場に数千人が集まった。
      抗議集会に加え、祭りのために訪れた人々も混じっている。
      集会の禁止令は、十分に伝えられていなかった。

      ダイヤー准将は、兵を率いて唯一の狭い出入口を塞ぎ、警告なしに発砲を命じた。
      射撃は10分続き、弾薬がほぼ尽きるまで行われる。
      公式の発表では379人が死亡したが、実際にはその数倍とみられる。
      逃げ場のない広場で、井戸に飛び込んで死亡した者も多い。

      ダイヤーは、見せしめの効果を意図したと後の調査で証言した。
      本国では非難と擁護に分かれ、一部からは英雄として資金が集められる。
      この事件によって、穏健な協力の路線は支持を失った。
      ガンディーは非協力運動を開始する。
      統治の正当性そのものが問われる転換点になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Massacre_memorial_in_Amritsar.jpg/500px-Massacre_memorial_in_Amritsar.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Massacre_memorial_in_Amritsar.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アムリットサル事件

  - id: salt-march
    year: 1930
    title: 塩の行進
    category: society
    tags: [インド, 非暴力]
    summary: 塩の専売に抗う380キロの行進。非暴力不服従が世界に知られた。
    detail: |
      ガンディーが塩の専売に抗って行った行進で、1930年3月から4月にかけて行われた。
      24日間で380キロを歩いた。
      非暴力不服従が世界に知られる契機になる。

      塩は、イギリス領インドで専売とされていた。
      海水から自分で作ることも禁じられ、購入には税が課される。
      貧しい者ほど負担の比率が高い。

      ガンディーは、この税を抵抗の対象に選んだ。
      誰もが必要とし、誰にでも意味が分かる品だからである。
      78人の同行者とともに出発し、村々を通りながら人数を増やした。
      各地で演説を行い、行進の様子は新聞と映像で世界に伝えられる。
      4月6日、海岸に着いたガンディーは一握りの泥と塩をすくい上げた。
      法を破るこの行為が、全国での不服従の合図になる。

      各地で塩が作られ、政府の建物の前で座り込みが行われた。
      逮捕者は6万人を超える。
      製塩所への行進では、参加者が抵抗せずに殴打を受け続けた。
      その様子を報じた記事が、国際的な世論を動かす。
      ガンディー自身も逮捕された。
      翌年、総督との会談が行われ、対等の立場での交渉が実現する。
      小さな象徴を選んで巨大な運動に変えた例として、後の運動でも参照されてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/Marche_sel.jpg/500px-Marche_sel.jpg
      credit: Yann (talk) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Marche_sel.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/塩の行進

  - id: india-independence
    year: 1947
    title: インド・パキスタン分離独立
    category: politics
    tags: [インド, 独立]
    summary: 非暴力の運動が実を結ぶ一方、宗教による分割で大規模な混乱が起きた。
    detail: |
      インドとパキスタンがイギリスから独立した出来事で、1947年8月のこと。
      非暴力の運動が実を結ぶ一方、宗教による分割が大規模な混乱を招いた。

      第二次世界大戦でイギリスは疲弊し、統治を続ける余力を失っていた。
      一方、ムスリム連盟は別の国家を要求し、国民会議は統一インドを主張して交渉は行き詰まる。
      各地で宗教間の暴力が激化した。
      イギリスは撤退の期日を前倒しし、分割の線を引くことを決めた。
      境界の画定は、インドを訪れたことのない法律家に委ねられ、わずか5週間で行われる。
      線が公表されたのは、独立の2日後だった。

      結果は悲惨だった。
      自分の村がどちらの国になるかを知らないまま、人々は移動を始める。
      1000万人以上が国境を越え、列車や隊列が襲撃された。
      死者は数十万から100万と推定される。

      パンジャーブとベンガルが分割され、パキスタンは東西に離れた二つの地域からなる国家になった。
      藩王国は、いずれかへの帰属を選ぶこととされた。
      カシミールの帰属をめぐる対立はこのときに生まれ、三度の戦争を経て今も解決していない。
      独立の達成と、分割の惨禍が同じ日付に重なっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3b/Partition_of_India_1947_en.svg/500px-Partition_of_India_1947_en.svg.png
      credit: 投稿者自身による著作物 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Partition_of_India_1947_en.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/インド・パキスタン分離独立

  - id: gandhi-assassinated
    year: 1948
    title: ガンディーの暗殺
    category: society
    tags: [インド]
    summary: 宗教の融和を説き続けた人物が、同じヒンドゥー教徒に殺された。
    detail: |
      ガンディーが暗殺された出来事で、1948年1月のこと。
      分離独立の直後、宗教の融和を説き続けた人物が、同じヒンドゥー教徒に射殺された。

      独立の前後、各地で宗教間の暴力が続いていた。
      ガンディーは祝典に加わらず、暴動の起きた地域を歩いて回る。
      カルカッタでは、断食によって暴力を止めさせた。
      デリーでも、ムスリムへの襲撃が続いていた。
      彼は再び断食に入り、双方の指導者が融和を誓うまで続ける。
      パキスタンへ引き渡されるはずだった資金の支払いを、インド政府に履行させようとしたことも、強い反発を招いた。
      ヒンドゥーの民族主義者からは、ムスリムに譲歩しすぎる人物とみなされる。

      1月30日、夕方の祈りの集会へ向かう途中で至近距離から撃たれた。
      犯人は民族主義の団体に属する人物である。
      78歳だった。
      ネルーは放送で、我々の生活から光が消えたと語った。

      暗殺は、独立の達成が対立の解消を意味しないことを示した。
      分割と暴力の記憶は、その後の両国の関係に長く影を落とす。
      非暴力を説き続けた人物が暴力で殺されたという事実は、その思想の評価にも重い問いを残している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7a/Mahatma-Gandhi%2C_studio%2C_1931.jpg/500px-Mahatma-Gandhi%2C_studio%2C_1931.jpg
      credit: Elliott & Fry / Public domain
      page: https://commons.wikimedia.org/wiki/File:Mahatma-Gandhi,_studio,_1931.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マハトマ・ガンディー

  - id: india-constitution
    year: 1950
    title: インド憲法の施行
    category: society
    tags: [インド, 民主主義]
    summary: 不可触民差別を禁じ、普通選挙を導入。世界最大の民主主義が始まった。
    detail: |
      インド憲法が施行された出来事で、1950年1月26日のこと。
      起草には3年近くを要した。
      世界最大の民主主義が、ここから始まる。

      条文の数は400近く、成文憲法としては世界最長である。
      各国の憲法を研究し、有用な規定を取り入れた結果でもある。
      中心にあるのは、平等と基本的な権利である。
      不可触民制を明文で廃止し、それにもとづく差別を禁じた。
      公職と教育における割当の制度を設け、歴史的に排除されてきた集団の参加を保障する。

      普通選挙が導入された。
      識字率が二割に満たない状況で、すべての成人に選挙権が与えられる。
      当時、これほどの規模で無条件の普通選挙を行った国はない。
      世俗主義が原則とされ、国家が特定の宗教を優遇しないことが定められた。
      連邦制がとられ、州に一定の権限が与えられる。

      起草の中心にいたのはアンベードカルである。
      被差別カーストの出身であり、その経験が条文に反映された。
      施行の日は共和国記念日として祝われる。
      以後100回を超える改正が行われており、変化に対応しながら運用されてきた。
      社会の不平等を法によって是正しようとする姿勢が、この憲法の特徴である。
