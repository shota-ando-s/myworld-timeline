lane: south-asia

periods:
  - id: indus
    title: インダス文明
    start: -2600
    startCirca: true
    end: -1900
    endCirca: true
    category: society
    tags: [インド, 都市]
    summary: モヘンジョダロなど計画都市の文明。文字は今も解読されていない。
    detail: |
      インダス川の流域に栄えた文明で、紀元前2600年ごろから1900年ごろまで続いた。
      モヘンジョダロとハラッパーが代表的な都市である。
      文字は今も解読されていない。

      範囲はメソポタミアやエジプトより広く、100万平方キロに及ぶ。
      1000を超える遺跡が確認されている。
      都市は計画的に作られた。
      道路は碁盤の目に走り、規格化された焼きれんがが用いられる。
      各戸に井戸と浴室があり、汚水は蓋のある下水道へ流された。
      同時代の他の文明にない水準の衛生設備である。

      度量衡も統一されていた。
      遠く離れた都市で同じ規格の重りが使われている。
      特異なのは、王の墓や巨大な神殿が見つかっていないことである。
      強大な支配者の存在を示す痕跡が乏しく、武器も少ない。
      同時代のメソポタミアやエジプトとは性格が異なる社会だったとみられる。
      印章に刻まれた文字は数百種類が確認されているが、文の長さが短く、対訳もないため解読されていない。

      衰退の原因は、河川の流路の変化、長期の乾燥、交易の途絶などが挙げられる。
      単一の破局ではなく、長い時間をかけて都市が放棄されたと考えられている。
      住民が消えたわけではなく、後の社会に受け継がれた要素も多い。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/Indus_Valley_Civilization%2C_Mature_Phase_%282600-1900_BCE%29.png/500px-Indus_Valley_Civilization%2C_Mature_Phase_%282600-1900_BCE%29.png
      credit: Avantiputra7 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Indus_Valley_Civilization,_Mature_Phase_(2600-1900_BCE).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/インダス文明

  - id: vedic
    title: ヴェーダ時代
    start: -1500
    startCirca: true
    end: -500
    endCirca: true
    category: religion
    tags: [インド, バラモン教]
    summary: アーリヤ人の進入とヴェーダの成立。カースト的な身分の原型ができた。
    detail: |
      アーリヤ系の人々がインド北西部に入り、ヴェーダが編まれた時代で、紀元前1500年ごろから500年ごろまで。
      後のヒンドゥー教とカースト的な身分の原型が、この時期に形づくられた。

      ヴェーダは、讃歌、祭詞、呪文などを集めた文献群である。
      最も古いリグ・ヴェーダは、自然の神々への讃歌からなる。
      長く文字に記されず、正確な発音で暗誦して伝えられた。

      初期の社会は、牛を財産とする牧畜と移動が中心だった。
      祭式の中心には火があり、神々に供物を捧げることで恵みを得ると考えられる。
      東へ移動してガンジス川の流域に入ると、鉄器を用いた農耕が広がった。
      定住が進み、都市と国家が生まれる。

      身分の区分も整えられた。
      祭式を担うバラモン、戦士、生産者、そして隷属する層という四つの区分が説かれる。
      生まれによって役割が決まる仕組みが、これを基礎に形成されていった。
      後期には、祭式の形式主義への批判から内面の思索が生まれた。
      ウパニシャッドの哲学であり、輪廻と解脱という枠組みが整う。
      この時期に成立した言語と儀礼と身分の観念が、以後3000年の南アジアの社会を規定することになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/71/1500-1200_BCE_Rigveda%2C_manuscript_page_sample_i%2C_Mandala_1%2C_Hymn_1_%28Sukta_1%29%2C_Adhyaya_1%2C_lines_1.1.1_to_1.1.9%2C_Sanskrit%2C_Devanagari.jpg/500px-1500-1200_BCE_Rigveda%2C_manuscript_page_sample_i%2C_Mandala_1%2C_Hymn_1_%28Sukta_1%29%2C_Adhyaya_1%2C_lines_1.1.1_to_1.1.9%2C_Sanskrit%2C_Devanagari.jpg
      credit: Ms Sarah Welch / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:1500-1200_BCE_Rigveda,_manuscript_page_sample_i,_Mandala_1,_Hymn_1_(Sukta_1),_Adhyaya_1,_lines_1.1.1_to_1.1.9,_Sanskrit,_Devanagari.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴェーダ

  - id: mahajanapada
    title: 十六大国の時代
    start: -600
    startCirca: true
    end: -345
    category: politics
    tags: [インド]
    summary: ガンジス流域に都市国家が並び立った時代。仏教とジャイナ教はここで生まれた。
    detail: |
      ガンジス川の流域に有力な国が並び立った時代で、紀元前6世紀から4世紀にかけて続いた。
      仏教とジャイナ教は、この環境から生まれている。

      十六大国という呼び名は、仏典が列挙する国の数に由来する。
      共和制に近い形をとる国と、王が支配する国が混在していた。
      変化の背景には鉄器の普及がある。
      森を開いて水田を作れるようになり、収穫が増えた。
      余剰が都市を養い、商人と職人が現れる。
      貨幣が使われ始め、交易路が各地を結んだ。

      都市の成長は、従来の秩序を揺るがした。
      祭式を独占するバラモンの権威に対し、商人や武士の層が疑問を持つ。
      儀礼や供犠ではなく、個人の生き方によって苦しみから解放されうるという考え方が広がった。
      この土壌から、ブッダとマハーヴィーラが現れる。
      いずれも武士の家の出身で、祭式の伝統の外から教えを説いた。
      出家した者の共同体が作られ、商人が経済的な支援を行う。

      国どうしの争いのなかで、マガダ国が優位に立った。
      鉄の産地と肥沃な土地を押さえ、次第に周囲を併合していく。
      この国を基盤として、後のマウリヤ朝が生まれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Mahajanapadas_%28c._500_BCE%29.png/500px-Mahajanapadas_%28c._500_BCE%29.png
      credit: Avantiputra7 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Mahajanapadas_(c._500_BCE).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/十六大国

  - id: maurya
    title: マウリヤ朝
    start: -322
    end: -185
    category: politics
    tags: [インド]
    summary: インド初の統一王朝。アショーカ王の治世に仏教が各地へ広がった。
    detail: |
      インドで最初の広域の統一王朝で、紀元前322年ごろから185年ごろまで続いた。
      都はパータリプトラである。
      アショーカ王の治世に仏教が各地へ広がった。

      チャンドラグプタが、アレクサンドロス撤退後の混乱を突いて建てた。
      マガダ国の王朝を倒し、北インドを統一する。
      セレウコス朝と戦って講和し、アフガニスタン方面の領土を得た。
      統治は中央集権的である。
      広大な官僚組織が置かれ、税の徴収、灌漑、道路の管理を担った。
      スパイの組織が各地の情報を集めたと記録されている。
      宰相カウティリヤに帰せられる統治の書は、権力の維持を冷徹に論じたものである。

      第3代のアショーカ王の時代に領域は最大になった。
      カリンガ征服の惨禍を悔いて仏教に帰依し、以後は武力による拡大をやめる。
      各地に石柱と磨崖の碑文を刻ませ、生き物を害さないこと、他の宗派を尊重することを説いた。
      使節がスリランカ、西アジア、ギリシアへ送られ、仏教が国外へ広がる契機になる。

      アショーカの死後、王朝は急速に衰えた。
      広い領域を支える財政が続かなかったとみられる。
      紀元前185年、将軍によって王が殺されて終わる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Maurya_empire_in_265_BCE.jpg/500px-Maurya_empire_in_265_BCE.jpg
      credit: Vastu (talk). Original uploader was Vastu at en.wikipedia / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Maurya_empire_in_265_BCE.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マウリヤ朝

  - id: satavahana
    title: サータヴァーハナ朝
    start: -100
    startCirca: true
    end: 220
    endCirca: true
    category: economy
    tags: [インド, 交易]
    summary: デカン高原を拠点にローマとの海上交易で栄えた王朝。
    detail: |
      デカン高原を中心に栄えた王朝で、紀元前後から3世紀ごろまで続いた。
      ローマとの海上交易で富を築いた。
      南インドで最初の大きな国家の一つである。

      北インドの王朝が交代を繰り返すあいだ、南では独自の政治体が育った。
      サータヴァーハナ朝は、東西の海岸を結ぶ内陸の高原を押さえ、交易路を支配する。
      最大の特徴が、ローマとの交易である。
      季節風を利用した直航路が開かれ、エジプトの港から船が渡った。

      輸出されたのは、胡椒、綿布、宝石、象牙、真珠である。
      見返りにワイン、ガラス器、そして大量の金貨が流入した。
      ローマでは、東方への贅沢品の支払いで金が流出していることが問題として論じられている。
      実際、南インドの各地でローマの貨幣が大量に出土する。

      王朝はバラモンの伝統を重んじる一方、仏教も保護した。
      岩を掘り抜いた僧院が各地に作られ、商人がその寄進者として名を刻んでいる。
      交易の富が宗教施設を支える構造である。
      碑文には、王の母の名を冠した呼称が現れる。
      女性の地位が比較的高かったことを示すとされる。
      3世紀に分裂し、各地の王朝に取って代わられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/be/Map_of_the_Satavahanas.png/500px-Map_of_the_Satavahanas.png
      credit: "Map created from DEMIS Mapserver, which are public domain. Koba-chan. Reference: [1] / CC BY-SA 3.0"
      page: https://commons.wikimedia.org/wiki/File:Map_of_the_Satavahanas.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/サータヴァーハナ朝

  - id: kushan
    title: クシャーナ朝
    start: 30
    startCirca: true
    end: 375
    endCirca: true
    category: economy
    tags: [インド, 交易]
    summary: 東西交易の要を押さえ、ギリシア風の仏像（ガンダーラ美術）を生んだ。
    detail: |
      中央アジアから北インドにかけて栄えたイラン系の王朝で、1世紀から3世紀ごろまで続いた。
      東西交易の要を押さえ、ギリシア風の仏像を生んだ。

      起源は、中国の記録に現れる月氏の一部である。
      匈奴に追われて西へ移動し、バクトリアに定着した。
      その一つの集団が他をまとめ、王朝を築く。
      領域は、現在のウズベキスタンからアフガニスタン、パキスタン、北インドに及んだ。
      ローマ、パルティア、漢という三つの大国のあいだに位置する。

      シルクロードの要衝を押さえたことが、繁栄の基盤である。
      中国の絹が西へ、ローマの金がインドへ流れ、その中継の利益を得た。
      貨幣にはギリシア文字が用いられ、多様な神々が刻まれている。
      宗教には寛容だった。
      ギリシアの神、イランの神、インドの神が同じ王朝の貨幣に現れる。
      カニシカ王の時代に仏教が厚く保護された。
      経典の編纂が行われ、大乗の教えが形を整えていく。

      ガンダーラでは、ギリシア彫刻の技法で仏の姿が刻まれた。
      それまで仏は足跡や法輪で表されており、人の姿で表現されるのはこの時期からである。
      この様式が中央アジアを経て中国、朝鮮、日本へ伝わった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Kushanmap.jpg/500px-Kushanmap.jpg
      credit: PHGCOM / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Kushanmap.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クシャーナ朝

  - id: gupta
    title: グプタ朝
    start: 320
    end: 550
    category: culture
    tags: [インド, ヒンドゥー教]
    summary: ヒンドゥー文化の古典期。ゼロを含む十進法の記数法が整えられた。
    detail: |
      北インドを支配した王朝で、320年から550年ごろまで続いた。
      都はパータリプトラである。
      ヒンドゥー文化の古典期とされ、数学と文学で大きな成果を残した。

      マウリヤ朝の崩壊後、北インドは分裂していた。
      グプタ家がガンジス流域から勢力を広げ、婚姻と征服によって統一する。
      統治はマウリヤ朝ほど中央集権的ではない。
      服属した王を残し、貢納と臣従を求める緩やかな体制だった。

      最大の遺産は学問である。
      ゼロを記号として扱い、位取りによる十進法の記数法が整えられた。
      この体系がアラビアを経てヨーロッパへ伝わり、現在の数字になる。
      アーリヤバタは、地球が自転していることを述べ、円周率の近似値を示した。

      文学では、サンスクリットの戯曲と詩が洗練された。
      カーリダーサの作品は古典として読み継がれている。
      宗教では、ヴィシュヌとシヴァへの信仰が広がり、現在のヒンドゥー教の形が整った。
      仏教も保護され、ナーランダーの僧院が創設される。
      美術では、アジャンターの石窟壁画が描かれた。
      5世紀後半、中央アジアから侵入したエフタルの圧力で衰える。
      分裂の後、北インドが再び広く統一されるのは数世紀後である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/GuptaEmpire300-550.png/500px-GuptaEmpire300-550.png
      credit: Gabagool / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:GuptaEmpire300-550.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/グプタ朝

  - id: harsha
    title: ヴァルダナ朝
    start: 606
    end: 647
    category: politics
    tags: [インド]
    summary: 北インドを一時的に統一。玄奘が訪れて記録を残した。
    detail: |
      北インドを一時的に統一した王朝で、606年から647年まで続いた。
      ハルシャ王の一代で成立し、その死とともに消える。
      玄奘が訪れて記録を残したことで知られる。

      グプタ朝の崩壊後、北インドは多数の勢力に分かれていた。
      ハルシャは兄の暗殺を受けて16歳で即位し、征服を進めて北インドの大半をまとめる。
      統治は中央集権的ではなかった。
      服属した王を残し、自ら各地を巡って直接に監督する方式をとる。
      定まった都を持たず、宮廷ごと移動した。

      南方への遠征は失敗に終わる。
      デカン高原の王朝に阻まれ、それ以上の拡大は止まった。
      仏教とヒンドゥー教の双方を保護した。
      5年ごとに大規模な施しの会を開き、蓄えた財をすべて分け与えたと伝えられる。
      自ら戯曲を書いたともされる。

      玄奘はこの王朝に滞在し、厚遇を受けた。
      その記録は、7世紀のインドの社会と宗教を知る主要な史料になっている。
      647年、後継者を残さずに没した。
      王朝はただちに分裂し、北インドは再び多数の勢力に分かれる。
      次に広い統一が実現するのは、数百年後のイスラム政権による。
      個人の力量に依存した国家の限界を示す例でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/Map_of_the_Pushyabhutis.png/500px-Map_of_the_Pushyabhutis.png
      credit: "Map created from DEMIS Mapserver, which are public domain. Koba-chan. Reference: [1] / CC BY-SA 3.0"
      page: https://commons.wikimedia.org/wiki/File:Map_of_the_Pushyabhutis.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴァルダナ朝

  - id: chola
    title: チョーラ朝
    start: 850
    end: 1279
    category: economy
    tags: [インド, 海上交易]
    summary: 南インドから海を越えてスリランカや東南アジアにまで遠征した海洋王朝。
    detail: |
      南インドのタミル地方に栄えた王朝で、9世紀から13世紀まで続いた。
      海を越えてスリランカと東南アジアに遠征した海洋王朝である。

      古代から続く家系が、9世紀に勢力を回復して王朝を築いた。
      特徴は海軍力である。
      当時のインドの王朝としては例外的に、大規模な艦隊を持っていた。
      スリランカを征服し、モルディブを支配下に置く。
      1025年には、マラッカ海峡を押さえるシュリーヴィジャヤへ遠征した。
      交易路の確保が目的である。

      中国の宋にも使節を送り、直接の交易関係を結んだ。
      統治では、地方の自治が発達していた。
      村の集会が運営を担い、くじによって役員を選ぶ仕組みが碑文に記されている。
      灌漑の管理、寺院の運営、紛争の処理が村の単位で行われた。

      寺院は宗教だけでなく経済の中心でもある。
      土地を保有し、金融を営み、職人を雇った。
      建築では、タンジャーヴールの巨大な石造寺院が残る。
      頂部の石は数十トンあり、傾斜路を使って運び上げられたとされる。
      青銅の鋳造も高い水準にあった。
      踊るシヴァの像は、インド美術の代表として知られる。
      13世紀に周辺の勢力に押されて衰えた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Chola_map.png/500px-Chola_map.png
      credit: User Venu62 on en.wikipedia / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Chola_map.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チョーラ朝

  - id: delhi-sultanate
    title: デリー・スルタン朝
    start: 1206
    end: 1526
    category: politics
    tags: [インド, イスラム]
    summary: 北インドにイスラム政権が定着した約320年。
    detail: |
      デリーを中心に北インドを支配したイスラム政権の総称で、1206年から1526年まで続いた。
      五つの王朝が交代した320年である。

      始まりは、ゴール朝の将軍だった奴隷出身のアイバクが自立したことによる。
      最初の王朝が奴隷王朝と呼ばれるのはこのためである。
      以後、ハルジー、トゥグルク、サイイド、ローディーと続いた。
      支配層は中央アジアとアフガニスタン出身のムスリムで、人口の大半はヒンドゥー教徒である。
      統治では、人頭税を課して信仰を認める方式がとられた。
      13世紀、モンゴルの侵入が繰り返された。
      これを撃退できたことが、インドがモンゴルの支配を免れた理由である。

      ハルジー朝の時代に版図は最大になり、南インドにも遠征した。
      価格の統制と徴税の強化によって大軍が維持される。
      トゥグルク朝のもとで、都の移転と銅貨の発行という試みが失敗し、統治は揺らいだ。
      14世紀末のティムールの侵攻で、デリーは壊滅的な打撃を受ける。

      文化の面では、ペルシア語が宮廷の言語となり、建築ではドームとアーチの技法が持ち込まれた。
      ヒンドゥーの様式と混ざり合い、独自の建築が生まれる。
      後のウルドゥー語も、この接触から育った。
      1526年、ムガルの侵攻によって終わる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/2/29/Delhi_Sultanate_map.png
      credit: Netzach / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Delhi_Sultanate_map.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/デリー・スルターン朝

  - id: vijayanagara
    title: ヴィジャヤナガル王国
    start: 1336
    end: 1646
    category: politics
    tags: [インド, ヒンドゥー教]
    summary: 南インドで300年続いたヒンドゥー王国。イスラム勢力の南下を長く食い止めた。
    detail: |
      南インドに栄えたヒンドゥー王国で、1336年から17世紀半ばまで続いた。
      イスラム勢力の南下を長く食い止めた。
      都の名は勝利の都市を意味する。

      デリー・スルタン朝の南進に対抗する形で建国された。
      創始者は、一度イスラムに改宗した後にヒンドゥーに戻ったとも伝えられる。
      領域は南インドの大半に及んだ。
      北のイスラム諸王国と常に戦いながら、300年にわたって存続する。
      経済は交易に支えられた。
      香辛料、綿布、宝石が輸出され、アラビアから馬が輸入される。
      騎馬の確保が軍事力に直結するため、その取引が重要だった。

      都は巨大だった。
      15世紀に訪れたヨーロッパとペルシアの旅行者は、人口が数十万に及び、市場が活気に満ちていると記録している。
      岩山と川に囲まれた地形を生かし、何重もの城壁で守られた。
      灌漑の施設が整備され、水路が都市に水を供給する。
      寺院と宮殿が数多く建てられ、独自の建築様式が生まれた。

      1565年、北のイスラム諸王国が連合して戦い、王国軍は大敗する。
      都は数か月にわたって破壊された。
      王朝は南へ移って存続したが、往時の力は戻らない。
      遺跡は現在、世界遺産になっている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/d/d9/Flag_of_Vijayanagara_Empire.png
      credit: Raydong24 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Vijayanagara_Empire.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴィジャヤナガル王国

  - id: mughal
    title: ムガル帝国
    start: 1526
    end: 1858
    category: politics
    tags: [インド, イスラム]
    summary: ヒンドゥーとイスラムが混ざり合う文化を育てた大帝国。
    detail: |
      南アジアを支配したイスラム系の帝国で、1526年から1858年まで続いた。
      最盛期には亜大陸のほぼ全域に及んだ。
      ヒンドゥーとイスラムが混ざり合う文化を育てた。

      創始者バーブルは、ティムールとチンギス・ハンの血を引くと称した。
      中央アジアから追われてアフガニスタンに拠り、火器を用いてデリーの政権を倒す。
      第3代アクバルの代に体制が固まった。
      ヒンドゥーの有力者を高位に登用し、婚姻関係を結び、非ムスリムへの人頭税を廃する。
      官僚を階層で位置づける制度と、土地の測量にもとづく税制が整えられた。

      経済は豊かだった。
      綿布と藍と硝石が輸出され、世界の銀が流入する。
      18世紀初頭まで、世界の工業生産の四分の一を占めたという推計もある。
      文化では、ペルシアとインドの様式が融合した。
      細密画、建築、音楽、庭園が発達し、タージ・マハルが建てられる。
      ウルドゥー語も、この接触から育った。

      アウラングゼーブの代に版図は最大になるが、人頭税の復活と南方への長期の遠征が財政と統合を傷つけた。
      18世紀、地方の勢力が自立して帝国は名目だけになる。
      イギリス東インド会社が実権を握り、1858年に皇帝が廃されて終わった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/23/Mughal_Empire_%28orthographic_projection%29.svg/500px-Mughal_Empire_%28orthographic_projection%29.svg.png
      credit: KarnRedsun / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Mughal_Empire_(orthographic_projection).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ムガル帝国

  - id: maratha
    title: マラーター王国
    start: 1674
    end: 1818
    category: war
    tags: [インド]
    summary: ムガルに抗したヒンドゥー勢力。一時は北インドまで支配を広げた。
    detail: |
      デカン高原を拠点としたヒンドゥーの勢力で、1674年から1818年まで続いた。
      ムガル帝国に抗い、一時は北インドまで支配を広げた。

      シヴァージーが即位して王国を宣言したことに始まる。
      山岳の地形を生かした機動戦で、ムガルの大軍に対抗した。
      アウラングゼーブは25年にわたって遠征を続けたが、屈服させられなかった。
      拠点を落としても、別の場所から攻撃が繰り返される。
      この消耗が、ムガル帝国の財政と統治を大きく傷つけた。

      18世紀に入ると、宰相にあたるペーシュワーの家系が実権を握る。
      王は名目的な存在になった。
      勢力は急速に拡大し、北インドの広い範囲から貢納を取り立てる。
      デリーの皇帝を事実上の保護下に置いた時期もある。
      連合体としての性格が強く、有力な家がそれぞれの領域を支配した。

      1761年、第三次パーニーパットの戦いでアフガニスタンの軍に大敗する。
      数万が戦死し、北進の勢いは止まった。
      その後も勢力を保ったが、内部の対立が続く。
      イギリスとの三度の戦争を経て、1818年に解体された。
      ムガルに代わって亜大陸を統一する可能性を持った最後のインド系の勢力である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/India1760_1905.jpg/500px-India1760_1905.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:India1760_1905.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マラーター王国

  - id: company-rule
    title: 東インド会社の支配
    start: 1757
    end: 1858
    category: economy
    tags: [インド, イギリス]
    summary: 一民間会社が軍と徴税権を持ち、インド亜大陸の大半を統治した100年。
    detail: |
      イギリス東インド会社がインドの大半を統治した時期で、1757年から1858年まで続いた。
      民間の会社が軍と徴税権を持ち、亜大陸を支配した100年である。

      始まりは、プラッシーの戦いによってベンガルの実権を得たことにある。
      1765年には、ムガル皇帝から正式に徴税権を認められた。
      収入はインドで集め、それを使ってインド人の兵を雇い、さらに領域を広げるという構造が作られる。
      セポイと呼ばれる現地の兵が軍の大半を占めた。
      支配は段階的に広がった。
      マイソール、マラーター、シク王国との戦争に勝ち、また藩王国を従属させることで版図を拡大する。
      継承者のいない藩王国を併合する原則も適用された。

      経済への影響は大きい。
      土地に対する税が固定され、支払えない農民が土地を失った。
      インドの綿織物には高い関税が課され、逆にイギリス製の機械織りの布が流入する。
      手織りの産業は衰退した。
      藍やアヘンなど、輸出用の作物の栽培が強制された地域もある。

      1857年の大反乱を受けて、翌年に会社は統治から外される。
      以後はイギリス政府の直接統治になった。
      企業が国家の機能を担うことの帰結を示す、歴史上最大の事例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/Flag_of_the_British_East_India_Company_%281801%29.svg/500px-Flag_of_the_British_East_India_Company_%281801%29.svg.png
      credit: コンピュータが読み取れる情報は提供されていませんが、Yaddahだと推定されます（著作権の主張に基づく） / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_British_East_India_Company_(1801).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イギリス東インド会社

  - id: british-raj
    title: イギリス領インド帝国
    start: 1858
    end: 1947
    category: politics
    tags: [インド, 植民地]
    summary: 東インド会社に代わり英国政府が直接統治した90年。
    detail: |
      イギリス政府がインドを直接統治した時期で、1858年から1947年まで続いた。
      東インド会社に代わる体制である。

      大反乱の後、統治の主体が会社から政府に移された。
      インド担当の大臣が本国に置かれ、現地には総督が派遣される。
      1877年、ヴィクトリア女王がインド皇帝を名乗った。
      領域の三分の二が直接統治され、残りは藩王国として間接的に支配された。
      500以上の藩王国が内政の自治を認められ、外交と軍事はイギリスが握る。
      統治は少数のイギリス人官僚と、多数のインド人の職員によって担われた。
      軍でもインド人の兵が大半を占め、その構成は宗教と地域で分けられる。

      インフラは整備された。
      鉄道は世界有数の規模に達し、電信、港湾、灌漑が作られる。
      ただし鉄道は原料の輸出と軍の移動を優先して敷かれた。

      経済では、インドが原料を供給し、工業製品を買う関係が固定される。
      飢饉が繰り返し起き、市場に任せる方針が被害を拡大した。
      一方、英語による教育を受けた層が育った。
      彼らが後の独立運動の担い手になる。
      二つの大戦でインドは多数の兵と物資を供出した。
      その見返りとして自治を求める声が高まり、1947年の独立に至る。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/be/British_Raj_Red_Ensign.svg/500px-British_Raj_Red_Ensign.svg.png
      credit: Barryob / Public domain
      page: https://commons.wikimedia.org/wiki/File:British_Raj_Red_Ensign.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イギリス領インド帝国

  - id: republic-of-india
    title: インド共和国
    start: 1950
    ongoing: true
    category: politics
    tags: [インド, 現代]
    summary: 多言語・多宗教のまま民主主義を続ける、人口世界最大の国家。
    detail: |
      1950年の憲法施行から現在まで続く共和国。
      多言語と多宗教のまま民主主義を続けている。
      人口は世界最大である。

      独立時、この国が統一を保てるかは疑問視されていた。
      20を超える主要な言語、複数の宗教、500以上の藩王国を抱えている。
      選ばれたのは、連邦制と世俗主義と普通選挙の組み合わせである。
      識字率が低い状態で全成人に選挙権を与えたことは、当時としては例のない試みだった。
      経済は、当初は国家主導の計画経済をとった。
      成長は緩やかで、1991年の危機を機に自由化へ転換する。
      以後、情報技術のサービスを軸に高い成長が続いた。

      社会の課題は大きい。
      カーストによる差別、宗教間の対立、地域の格差、貧困が残る。
      1975年から2年間は非常事態宣言によって民主的な手続きが停止された。
      しかし選挙によって政権が交代する仕組みは、その後も機能している。

      対外的には、非同盟から独自の立場へ移った。
      核実験を行い、中国とパキスタンとの緊張を抱えながら、主要国としての地位を確立している。
      言語も宗教も統一しないまま民主主義を続けるという選択は、他に例が少ない。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/41/Flag_of_India.svg/500px-Flag_of_India.svg.png
      credit: インド政府 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_India.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/インド

events:
  - id: buddha-birth
    year: -563
    circa: true
    title: ブッダの生誕
    category: religion
    tags: [仏教, インド]
    summary: 生没年には諸説ある。苦をどう終わらせるかという問いが東アジア全体に広がった。
    detail: |
      仏教の開祖ゴータマ・シッダールタが生まれたとされる出来事。
      年代には諸説があり、紀元前563年ごろとする説と、100年ほど後とする説がある。
      苦をどう終わらせるかという問いが、やがて東アジア全体に広がった。

      現在のネパール南部のルンビニで、シャーキヤ族の有力者の家に生まれたと伝えられる。
      伝承によれば、城の外で老い、病、死、そして修行者の姿を見たことが転機になった。
      29歳で家を出て、苦行と瞑想を6年続ける。
      極端な苦行では答えが得られないと悟り、菩提樹の下で瞑想して悟りに至ったとされる。

      説かれたのは、四つの真理である。
      人生には苦があること、苦には原因があること、苦は滅しうること、そのための道があることである。
      実践としては、極端を避ける中道と、八つの正しい実践が示された。

      固定した自己は存在せず、すべては条件によって生じるという見方も、この教えの核心にある。
      当時の社会では、生まれによって役割が決まるとされていた。
      この教えは出自を問わず誰にでも開かれており、商人や職人の支持を集める。
      出家者の共同体が組織され、教えは口承で伝えられた。
      後にスリランカ、東南アジア、中央アジア、中国、朝鮮、日本へ広がる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Buddha_in_Sarnath_Museum_%28Dhammajak_Mutra%29.jpg/500px-Buddha_in_Sarnath_Museum_%28Dhammajak_Mutra%29.jpg
      credit: พระมหาเทวประภาส วชิรญาณเมธี (ผู้ถ่าย-ปล่อยสัญญาอนุญาตภาพให้นำไปใช้ได้เพื่อการศึกษาโดยอยู่ภา่ยใต้ cc-by-sa-3.0) ผู้สร้างสรรค์ผลงาน/ส่งข้อมูลเก็บในคลังข้อมูลเสรีวิกิมีเดียคอมมอนส์ - เทวประภาส มากคล้าย / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Buddha_in_Sarnath_Museum_(Dhammajak_Mutra).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/釈迦

  - id: buddha-death
    year: -483
    circa: true
    title: ブッダの死と教えの集成
    category: religion
    tags: [仏教]
    summary: 弟子たちが記憶を持ち寄って教えをまとめ、経典の伝統が始まった。諸説あり。
    detail: |
      ブッダが没し、弟子たちが教えをまとめた出来事。
      紀元前483年ごろとされるが、年代には諸説がある。
      経典の伝統は、この集成から始まった。

      伝承によれば、80歳で旅の途上に病を得て亡くなった。
      最後の言葉は、すべては移ろうものであり、怠ることなく努めよという内容だったと伝えられる。
      死の直後、弟子たちが集まって教えを確認する会議を開いた。
      結集と呼ばれるこの会合では、記憶力に優れた弟子が教えを唱え、戒律に詳しい弟子が規則を唱える。
      参加者がそれを承認する形で、内容が確定された。

      文字には記されず、暗誦によって伝えられる。
      決まった語句の繰り返しが多いのは、記憶と検証のための形式である。
      文字に書かれるのは、数百年後のスリランカにおいてとされる。

      以後も、教団の分裂のたびに集成が行われた。
      解釈の違いから部派が分かれ、それぞれが独自の経典を伝える。
      数世紀後には、大乗と呼ばれる新しい経典群が現れた。
      開祖の言葉をどう保つかという問題は、あらゆる宗教が直面する。
      この場合、共同で暗誦して確認するという方法が採られ、それが後の長大な経典の体系につながった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/結集

  - id: mahavira
    year: -527
    circa: true
    title: ジャイナ教の成立
    category: religion
    tags: [インド, 不殺生]
    summary: 徹底した不殺生を説く教え。のちのガンディーの思想にもつながる。
    detail: |
      ジャイナ教を確立した人物マハーヴィーラが没し、教団が確立した時期。
      紀元前527年ごろとされるが、年代には諸説ある。
      徹底した不殺生を説く教えである。

      マハーヴィーラは、ブッダとほぼ同時代の人物とされる。
      武士の家に生まれ、30歳で出家して12年の苦行を行った。
      衣服を捨てて修行したと伝えられる。
      ジャイナ教は、これ以前からの伝統を受け継ぎ、彼が体系化したものである。
      中心にあるのは、行為によって生じる微細な物質が魂を縛るという考え方である。
      それを取り除き、断ち切ることで解脱に至る。

      実践の柱が不殺生である。
      あらゆる生き物に魂があるとし、意図しない殺生も避けようとする。
      僧は口を布で覆い、道を掃きながら歩く。
      農業は土中の生物を殺すため避けられ、信徒の多くが商業に従事した。

      他の柱として、嘘をつかないこと、盗まないこと、所有しないこと、禁欲が挙げられる。
      真理は多面的であり、一つの立場からは全体を捉えられないという考え方も特徴である。
      信徒の数は多くないが、インド社会での影響は大きい。
      ガンディーの非暴力の思想も、この伝統から強い影響を受けている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジャイナ教

  - id: upanishads
    year: -600
    circa: true
    title: ウパニシャッド哲学
    category: religion
    tags: [インド, 思想]
    summary: 宇宙と自己は本来一つだという思索。輪廻と解脱の枠組みがここで整う。
    detail: |
      ヴェーダの末尾に位置づけられる思索的な文献群で、紀元前6世紀ごろから編まれた。
      奥義書と訳される。
      宇宙の根源と自己が本来は一つだと説き、輪廻と解脱の枠組みを整えた。

      それまでのヴェーダの宗教は、祭式によって神々から恵みを得ることを中心としていた。
      ウパニシャッドは、その形式そのものを問い直す。
      中心にあるのは二つの概念である。
      宇宙の根本原理であるブラフマンと、個人の本質であるアートマンである。
      この二つが本来は同一であると知ることが、真の認識だとされた。

      あわせて、行為とその結果の観念が説かれる。
      行いは必ず報いを生み、それによって生まれ変わりが繰り返される。
      この循環そのものを苦とみなし、そこから抜け出すことが目標になった。

      解脱に至る道として、知識と瞑想が重んじられる。
      供犠を積むことより、内面の認識が問題になった。
      これらの観念は、後のヒンドゥー教の基礎になった。
      仏教とジャイナ教も、輪廻からの解放という枠組みを共有しながら、異なる答えを出している。
      19世紀以降、ヨーロッパの哲学者にも影響を与えた。
      南アジアの思想の骨格が、この文献群で定まっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Guru_and_DiscipleI.jpg/500px-Guru_and_DiscipleI.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Guru_and_DiscipleI.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウパニシャッド

  - id: alexander-indus
    year: -326
    title: アレクサンドロスのインダス到達
    category: war
    tags: [マケドニア, インド]
    summary: 兵の疲弊で引き返したが、この遠征が統一王朝マウリヤの成立を促した。
    detail: |
      アレクサンドロス大王の軍がインダス川の流域に達した出来事で、紀元前326年のこと。
      兵の疲弊によって引き返したが、この遠征が統一王朝の成立を促した。

      軍はアフガニスタンを越えてインダス川を渡り、パンジャーブへ入った。
      ヒュダスペス河畔で、象を擁するポロス王の軍と戦う。
      雨季の増水した川を渡り、象に驚いた馬を抑えながらの激戦になった。
      勝利の後、アレクサンドロスは捕らえた王に王としての扱いを求められ、それに応じて領地を安堵したと伝えられる。

      さらに東へ進もうとしたが、兵が拒んだ。
      8年に及ぶ遠征で疲れ果て、ガンジス川の向こうにさらに強大な国があると聞いて士気を失う。
      軍は川を下り、一部は海路で、一部は砂漠を通って西へ戻った。

      インドに残した支配は長く続かなかった。
      数年のうちに総督は排除される。
      この混乱を突いて台頭したのがチャンドラグプタである。
      マウリヤ朝を建て、後にセレウコス朝と講和して西方の領土を得た。
      文化の面では、ギリシア人の入植地が残り、後のガンダーラ美術につながる。
      遠征そのものは短期間だったが、インドとヘレニズム世界が直接に接触する経路を開いた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/10/Le_Brun%2C_Alexander_and_Porus.jpg/500px-Le_Brun%2C_Alexander_and_Porus.jpg
      credit: シャルル・ル・ブラン / Public domain
      page: https://commons.wikimedia.org/wiki/File:Le_Brun,_Alexander_and_Porus.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヒュダスペス河畔の戦い

  - id: ashoka
    year: -268
    circa: true
    title: アショーカ王の即位
    category: politics
    tags: [インド, 仏教]
    summary: 戦争の惨禍を悔いて仏教に帰依し、石柱に統治の理念を刻ませた。
    detail: |
      アショーカがマウリヤ朝の王に即位した出来事で、紀元前268年ごろのこと。
      後に戦争の惨禍を悔いて仏教に帰依し、統治の理念を石柱に刻ませる。

      即位の前後には、兄弟との激しい争いがあったと伝えられる。
      仏教の伝承では、残虐な王として描かれる時期がある。
      即位から8年後、東海岸のカリンガを征服した。
      激しい抵抗を受け、十数万が死亡し、15万が連行されたと自らの碑文が記す。

      この惨禍への後悔が、方針の転換につながった。
      以後、武力による征服を行わないと宣言し、法による統治を掲げる。
      具体的な施策が碑文に残されている。
      人と動物の治療のための施設を設け、街道に木を植えて井戸を掘り、動物の犠牲を制限した。
      役人には民の状況を直接見て回ることを求め、自らも巡幸する。

      他の宗派への態度も明確である。
      自分の宗派を称賛して他を貶めてはならないと刻まれている。
      仏教の使節が各地へ送られ、スリランカへは王子と王女が渡ったと伝えられる。
      強大な権力を持つ王が、征服そのものを否定する原則を掲げた例は古代でも稀である。
      その碑文が現存することで、統治の理念を本人の言葉で読むことができる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/Indian_relief_from_Amaravati%2C_Guntur._Preserved_in_Guimet_Museum.jpg/500px-Indian_relief_from_Amaravati%2C_Guntur._Preserved_in_Guimet_Museum.jpg
      credit: コンピュータが読み取れる情報は提供されていませんが、World Imagingだと推定されます（著作権の主張に基づく） / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Indian_relief_from_Amaravati,_Guntur._Preserved_in_Guimet_Museum.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アショーカ

  - id: kalinga-war
    year: -261
    title: カリンガ戦争
    category: war
    tags: [インド, 仏教]
    summary: 十数万の死者を出した勝利のあと、アショーカは武力による拡大をやめた。
    detail: |
      マウリヤ朝のアショーカ王が東海岸のカリンガを征服した戦争で、紀元前261年ごろのこと。
      十数万の死者を出した勝利の後、王は武力による拡大をやめた。

      カリンガは、現在のオディシャにあたる地域の独立した国だった。
      海上交易の要地であり、東南アジアへの航路も押さえている。
      マウリヤ朝の版図のなかで、征服されずに残っていた。
      戦いは激烈だった。
      王自身の碑文によれば、15万人が連行され、10万人が殺され、さらに多くがその後に死亡したという。

      注目すべきは、この記述が勝者自身の言葉であることである。
      通常、碑文は勝利を誇るために刻まれる。
      この場合は、その惨禍への後悔が記された。

      王は、罪のない人々が親しい者を失い、苦しんだことを深く悔いると述べている。
      以後は武力ではなく法によって人々を導くと宣言した。
      この転換によって、マウリヤ朝の拡大は止まる。
      代わりに、道路と施設の整備、他宗派への寛容、生き物への配慮といった政策が掲げられた。
      征服の直後に方針を根本から変えた支配者の例は、古代では極めて珍しい。
      この出来事が、アショーカという王の記憶を特別なものにしている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5b/Kalinga_battlefield_daya_river_dhauli_hills.jpg/500px-Kalinga_battlefield_daya_river_dhauli_hills.jpg
      credit: Cheeni / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Kalinga_battlefield_daya_river_dhauli_hills.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カリンガ戦争

  - id: gandhara-art
    year: 150
    circa: true
    title: ガンダーラ美術
    category: culture
    tags: [仏教, ギリシア]
    summary: ギリシア彫刻の技法で仏の姿が作られ、仏像という表現が生まれた。
    detail: |
      現在のパキスタン北西部で栄えた仏教美術で、2世紀ごろに最盛期を迎えた。
      ギリシア彫刻の技法によって仏の姿が表現された。
      仏像という表現が、ここで生まれる。

      それ以前、仏は人の姿で表されなかった。
      菩提樹、法輪、足跡、空の座によって、その存在が示される。
      悟りを開いた者を形にすることへのためらいがあったとみられる。
      この地域には、アレクサンドロスの遠征以来ギリシア系の住民が暮らしていた。
      クシャーナ朝のもとで、東西の様式が交わる。

      作られた仏像は、波打つ髪、写実的な衣の襞、均整のとれた身体を持つ。
      ギリシアの神像の表現が、仏の像に用いられた。
      同時に、額の白毫、頭頂の隆起、長い耳たぶといった特徴も加えられる。
      同じころ、マトゥラーでも独自の様式の仏像が作られた。
      両者の先後関係については議論がある。

      ガンダーラの様式は、中央アジアの交易路を通って東へ伝わった。
      敦煌、雲崗、龍門の石窟に、その影響が見える。
      日本の飛鳥の仏像にも、その系譜がつながっている。
      異なる文明の技法が出会って、新しい表現が生まれた例である。
      仏教が広い地域に受け入れられるうえで、目に見える形を得たことの意味は大きい。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/Gandhara_Buddha_%28tnm%29.jpeg/500px-Gandhara_Buddha_%28tnm%29.jpeg
      credit: World Imaging / Public domain
      page: https://commons.wikimedia.org/wiki/File:Gandhara_Buddha_(tnm).jpeg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ガンダーラ美術

  - id: mahabharata
    year: -300
    circa: true
    title: 二大叙事詩の成立
    category: culture
    tags: [インド, 文学]
    summary: 『マハーバーラタ』と『ラーマーヤナ』が、南アジア全域の物語の共通言語になった。
    detail: |
      南アジアの二大叙事詩である『マハーバーラタ』と『ラーマーヤナ』が形を整えた時期。
      紀元前4世紀ごろから数百年かけて成立したとされる。
      全域の物語の共通言語になった。

      『マハーバーラタ』は、世界最長の叙事詩である。
      10万詩節を超え、ホメロスの二作を合わせた長さの数倍にあたる。
      一族の内部で起きた王位をめぐる争いと、18日間の大戦が骨格になっている。
      物語の途中に、膨大な挿話と教訓が織り込まれた。
      なかでも『バガヴァッド・ギーター』は、戦場で戦うことをためらう王子に神が語りかける部分である。
      自分の務めを結果に執着せずに果たせという教えが説かれ、独立した聖典として扱われてきた。

      『ラーマーヤナ』は、王子ラーマが誘拐された妃を取り戻す物語である。
      理想的な王、妻、弟、忠実な従者という人物の型が示された。
      どちらも、口承で語られながら長い時間をかけて増補された。
      特定の作者に帰せられるが、実際には集合的な作品である。

      影響は南アジアにとどまらない。
      東南アジアでは王権の物語として受容され、舞踊や影絵芝居の題材になった。
      登場人物の名や場面は、現在も日常の比喩として使われている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Kurukshetra.jpg/500px-Kurukshetra.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Kurukshetra.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マハーバーラタ

  - id: indian-numerals
    year: 500
    circa: true
    title: ゼロを含む記数法
    category: science
    tags: [数学, インド]
    summary: 位取りとゼロの組み合わせがアラビア経由でヨーロッパに伝わり、計算を一変させた。
    detail: |
      インドで位取りとゼロを組み合わせた記数法が確立した出来事で、5世紀ごろとされる。
      この体系がアラビアを経てヨーロッパへ伝わり、計算のあり方を一変させた。

      位取りの考え方そのものは、メソポタミアにもあった。
      しかし空位を示す記号がなく、文脈で判断する必要がある。
      インドでは、何もないことを表す記号が数として扱われた。
      空を意味する語がその名になり、アラビア語に訳されて、やがてゼロという語になる。
      0から9までの10個の記号と、位置によって値が決まる仕組みが組み合わされた。
      これによって、どれほど大きな数も簡潔に書ける。
      加減乗除の筆算が可能になったことが最大の利点である。

      ブラフマグプタは7世紀に、ゼロを含む計算の規則を定めた。
      負の数の扱いも論じられている。
      この記法は交易を通じて西アジアへ伝わった。
      フワーリズミーが著作で紹介し、ヨーロッパではアラビア数字と呼ばれるようになる。

      13世紀のフィボナッチが商業の実務に有用だと説いたが、普及には時間がかかった。
      ローマ数字から置き換わるのは数世紀後である。
      現代のあらゆる計算の基礎にある表記が、この地で生まれた。
      数学における最も影響の大きな発明の一つとされる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Akko_Khan_al-Umdan_clock.jpg/500px-Akko_Khan_al-Umdan_clock.jpg
      credit: דוד שי / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Akko_Khan_al-Umdan_clock.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/インド数字

  - id: nalanda
    year: 427
    circa: true
    title: ナーランダー僧院の創設
    category: science
    tags: [仏教, 学問]
    summary: 各地から学僧が集まった一大学問所。玄奘も学んだ。
    detail: |
      インド東部に設けられた仏教の学問所で、5世紀に創設された。
      各地から学僧が集まり、玄奘も学んでいる。
      世界で最も早い時期の大規模な高等教育機関の一つとされる。

      グプタ朝の王の寄進によって建てられ、歴代の王朝が支援した。
      周辺の村の収入が運営に充てられる。
      最盛期には、学僧が数千人、教師が数百人在籍したとされる。
      寄宿する施設があり、講堂と図書館が並んだ。

      学ばれたのは仏教の教義だけではない。
      論理学、文法学、医学、数学、天文学も教えられた。
      他の宗派の教義も学ばれ、論争のために必要とされる。
      入学は容易ではなかった。
      門で行われる問答に答えられなければ入れず、多くが門前で退けられたと記録されている。
      7世紀に玄奘が訪れ、数年にわたって学んだ。
      彼の記録が、この僧院の様子を伝える主要な史料である。
      義浄も同様の記録を残した。

      12世紀末、トルコ系の軍の侵攻によって破壊された。
      図書館は数か月にわたって燃え続けたと伝えられる。
      この前後に、インドにおける仏教はほぼ途絶える。
      2016年、遺跡が世界遺産に登録された。
      近隣には、その名を継ぐ大学が再建されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/Nalanda_University_India_ruins.jpg/500px-Nalanda_University_India_ruins.jpg
      credit: 作者不明 / CC BY 2.0
      page: https://commons.wikimedia.org/wiki/File:Nalanda_University_India_ruins.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ナーランダ僧院

  - id: sind-conquest
    year: 712
    title: ウマイヤ朝のシンド征服
    category: war
    tags: [イスラム, インド]
    summary: イスラム勢力が初めてインドに拠点を得た。
    detail: |
      ウマイヤ朝の軍がインダス川下流のシンドを征服した出来事で、712年のこと。
      イスラム勢力が初めてインドに恒久的な拠点を得た。

      きっかけは、海賊に襲われた船の乗員の解放をめぐる交渉の決裂とされる。
      イラクの総督が甥のムハンマド・ビン・カーシムに軍を委ね、海路と陸路から侵攻した。
      17歳ほどの若い指揮官だったと伝えられる。
      投石機を用いた攻城戦で都市を落とし、王を破ってシンドとパンジャーブ南部を支配下に置いた。

      統治では、現地の住民の扱いが問題になった。
      イスラム法では、ユダヤ教徒とキリスト教徒は人頭税を払えば信仰を保てるとされる。
      ヒンドゥー教徒と仏教徒はその範疇に含まれていなかった。
      実務上の判断として、同様に人頭税を課して信仰と寺院を認める方式がとられる。
      この前例が、その後のインドにおけるイスラム政権の統治の基礎になった。

      征服は局地的なもので、内陸へは広がらなかった。
      本格的な進出は、300年後のガズナ朝を待つことになる。
      それでも、この征服によってアラビア海の交易にイスラム商人が深く関わるようになった。
      南アジアとイスラム世界の長い関係の起点である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/PK_Karachi_asv2020-02_img22_Chundrigar_Road.jpg/500px-PK_Karachi_asv2020-02_img22_Chundrigar_Road.jpg
      credit: A.Savin / FAL
      page: https://commons.wikimedia.org/wiki/File:PK_Karachi_asv2020-02_img22_Chundrigar_Road.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シンド州

  - id: ghazni-raids
    year: 1001
    title: ガズナ朝のインド侵入
    category: war
    tags: [イスラム, インド]
    summary: 17回に及ぶ略奪遠征で北インドの富が流出し、政治地図が塗り替わった。
    detail: |
      ガズナ朝のマフムードによる北インドへの侵入が本格化した出来事で、1001年のこと。
      以後30年で17回に及ぶ遠征が行われた。
      北インドの富が流出し、政治地図が塗り替わる。

      最初の遠征でパンジャーブの王を破り、以後ほぼ毎年のように軍を進めた。
      目的は明確に略奪である。
      寺院には、信徒の寄進によって金銀と宝石が蓄えられていた。
      軍はこれを奪い、乾季のうちに本拠へ戻る。

      北インドの諸王国は、互いに争っていて連携できなかった。
      個別に破られ、防衛の体制を作れない。
      1025年のソムナートへの攻撃では、膨大な財宝が奪われ、多数が殺された。
      この出来事は象徴的な記憶として残り、近代の政治でも繰り返し引かれている。
      奪われた富は、ガズニーの建設と学問の保護に使われた。

      この遠征そのものは支配の確立をめざしていない。
      しかし北インドの軍事的な弱さが露わになり、次の侵入を招いた。
      12世紀末、ゴール朝が同じ経路から侵攻し、今度はデリーに政権を打ち立てる。
      以後600年にわたって、北インドはイスラム系の王朝に統治されることになった。
      一連の略奪が、その前段になっている。
