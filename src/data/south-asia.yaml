        url: https://ja.wikipedia.org/wiki/イギリス東インド会社

  - id: taj-mahal
    year: 1632
    title: タージ・マハルの造営
    category: culture
    tags: [ムガル, 建築]
    summary: ペルシアとインドの様式が融合した廟。帝国の富と技術の頂点を示す。
    detail: |
      ムガル皇帝シャー・ジャハーンが妃の廟として造営した建築で、1632年に着工した。
      完成まで20年余りを要している。
      ペルシアとインドの様式が融合した、帝国の富と技術の頂点である。

      妃ムムターズ・マハルは、14人目の子の出産で亡くなった。
      皇帝は喪に服し、その墓として比類のない建物を作らせる。
      設計は、左右対称を徹底したものである。
      中央にドームを載せた本体を置き、四隅に尖塔を配する。
      尖塔はわずかに外へ傾いており、地震で倒れても本体を傷つけないようにされている。

      材料は白大理石で、300キロ以上離れた産地から運ばれた。
      表面には、花の文様が貴石の象嵌で表されている。
      トルコ石、ラピスラズリ、翡翠が各地から集められた。

      前面には水路と庭園が配され、建物が水面に映る。
      楽園を表す構成とされる。
      職人は2万人が関わり、ペルシア、オスマン、中央アジアから集められた。
      黒い大理石で自らの廟を対岸に建てる計画があったという伝説は、根拠が乏しい。
      現在は世界遺産であり、年間数百万人が訪れる。
      大気汚染による変色が問題になり、保護の措置がとられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Taj_Mahal%2C_Agra%2C_India_edit3.jpg/500px-Taj_Mahal%2C_Agra%2C_India_edit3.jpg
      credit: "Taj_Mahal,_Agra,_India_edit2.jpg: Yann; edited by King of Hearts derivative work: Jbarta (talk) / CC BY-SA 3.0"
      page: https://commons.wikimedia.org/wiki/File:Taj_Mahal,_Agra,_India_edit3.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/タージ・マハル

  - id: aurangzeb
    year: 1658
    title: アウラングゼーブの即位
    category: religion
    tags: [ムガル]
    summary: 厳格なイスラム政策で人頭税を復活させ、各地の反発が帝国を揺るがせた。
    detail: |
      アウラングゼーブがムガル帝国の君主として即位した出来事で、1658年のこと。
      厳格なイスラム政策への転換が起き、各地の反発が帝国を揺るがせる。

      父シャー・ジャハーンが病に倒れると、四人の子が争った。
      長兄は諸宗教に寛容で学問を好む人物だったが、戦いに敗れて処刑される。
      父は城塞に幽閉された。
      即位後、統治の原則が変えられた。
      宮廷から音楽と舞踊が退けられ、宗教的な規範を監督する官が置かれる。

      1679年、非ムスリムへの人頭税が復活した。
      アクバルが廃止して以来の措置であり、ヒンドゥーの有力者の離反を招く。
      新しい寺院の建設が禁じられ、一部が破壊された。
      シク教の指導者が処刑され、その共同体は武装した集団として組織される。
      ラージプートの一部も反旗を翻した。

      デカン高原では、マラーターとの戦いが25年続いた。
      拠点を落としてもゲリラ戦が続き、決着しない。
      即位の判断が帝国の性格を変えたという見方がある一方、財政と軍事の構造的な問題を重く見る研究もある。
      いずれにせよ、この治世を境に帝国は統合を失った。
      死後50年で、実質的な支配はデリー周辺だけになる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/3/30/Aurangazeb.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Aurangazeb.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アウラングゼーブ

  - id: plassey
    year: 1757
    title: プラッシーの戦い
    category: war
    tags: [インド, イギリス]
    summary: 東インド会社がベンガルの実権を握り、インド植民地化の起点となった。
    detail: |
      イギリス東インド会社の軍がベンガル太守の軍を破った戦いで、1757年のこと。
      会社がベンガルの実権を握り、インドの植民地化の起点になった。

      前年、太守が会社の要塞を攻撃し、捕虜が狭い牢で多数死亡する事件が起きていた。
      これが直接の口実になる。
      会社側の兵は3000程度、太守の軍は5万を超えていた。
      勝敗を分けたのは戦闘ではなく、事前の工作である。
      クライヴは、太守に不満を持つ将軍ミール・ジャアファルと密約を結んだ。
      勝利の後に太守の地位を与えるという条件である。
      有力な商人と銀行家も、これに加わった。

      戦闘が始まると、その将軍の部隊は動かなかった。
      雨で太守側の火薬が濡れたことも影響する。
      太守は逃亡し、後に殺された。

      新しい太守が立てられ、会社は莫大な報酬と土地を得た。
      クライヴ自身も巨額の財を手にする。
      1765年には、ムガル皇帝から徴税権を認められた。
      ベンガルの豊かな税収が会社の手に入り、それによってさらに兵を雇えるようになる。
      一つの会社が地域の政治を左右できることが示された。
      以後100年で、亜大陸の大半がその支配下に入る。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c4/Lord_Clive_meeting_with_Mir_Jafar_after_the_Battle_of_Plassey.jpg/500px-Lord_Clive_meeting_with_Mir_Jafar_after_the_Battle_of_Plassey.jpg
      credit: フランシス・ヘイマン / Public domain
      page: https://commons.wikimedia.org/wiki/File:Lord_Clive_meeting_with_Mir_Jafar_after_the_Battle_of_Plassey.jpg
    links:
