      page: https://commons.wikimedia.org/wiki/File:Hamandir_Sahib_(Golden_Temple).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シク教

  - id: east-india-company-founded
    year: 1600
    title: イギリス東インド会社の設立
    category: economy
    tags: [イギリス, 交易]
    summary: 貿易会社として始まり、150年後には領土を支配する権力になった。
    detail: |
      イギリスで東インド会社が設立された出来事で、1600年のこと。
      エリザベス1世が特許状を与えた。
      貿易の会社として始まり、150年後には領土を支配する権力になる。

      目的は、アジアの香辛料の取引に参入することだった。
      すでにポルトガルとオランダが進出しており、後発である。
      株式を募って資金を集め、航海ごとに損益を清算する方式から始まった。
      後に継続的な会社の形に移行する。

      香辛料の産地では、オランダの勢力に押されて撤退した。
      代わりにインドへ向かい、ムガル帝国の許可を得て商館を設ける。
      綿布、藍、硝石、絹が主要な取引の品になった。
      インドの綿織物はヨーロッパで大流行し、社会の風俗を変えるほどの影響を与える。
      会社は独自の軍を持ち、要塞を築いた。
      18世紀、ムガル帝国が弱まって各地の勢力が争うと、その一方に加担して影響力を広げる。

      1757年のプラッシーの戦いの後、ベンガルの徴税権を得た。
      商業の組織が、領土と税と軍を持つ統治の主体になる。
      その後、イギリス政府の監督が強まり、1858年に解散した。
      一つの民間の会社が亜大陸の大半を支配した例として、現在も企業と国家の関係をめぐる議論で引かれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/Flag_of_the_British_East_India_Company_%281801%29.svg/500px-Flag_of_the_British_East_India_Company_%281801%29.svg.png
      credit: コンピュータが読み取れる情報は提供されていませんが、Yaddahだと推定されます（著作権の主張に基づく） / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_British_East_India_Company_(1801).svg
    links:
