lane: africa

periods:
  - id: egypt-early-dynastic
    title: エジプト初期王朝時代
    start: -3100
    end: -2686
    category: politics
    tags: [エジプト]
    summary: 上下エジプトが統一され、王を頂点とする国家と象形文字が整った。
    detail: |
      上下エジプトが統一されてから古王国が始まるまでの時代で、紀元前3100年ごろから2686年ごろまで。
      第1王朝と第2王朝がこれにあたる。
      王を頂点とする国家と、象形文字による記録の仕組みがここで整った。

      ナイル川の定期的な増水が、この文明の基盤である。
      毎年の氾濫が肥沃な土を運び、引いた後の土地に種をまく農業が成り立った。
      増水の時期を知るために暦と天体の観測が発達し、氾濫後の区画の測量から幾何学が育つ。
      統一の伝承は、上エジプトの王が下エジプトを征服したと伝える。
      ナルメルの名が刻まれた化粧板には、二つの地域の王冠をかぶる王の姿が描かれている。
      実際には数世代をかけた過程だったとみられる。

      都はメンフィスに置かれた。
      王は神の化身とされ、その権威は宗教によって支えられる。
      穀物の徴収と労働力の動員を担う官僚と書記の組織が作られた。
      象形文字はこの時期に体系を整える。
      記録は主に王の事績と行政のためのもので、石やパピルスに書かれた。

      王墓は日干し煉瓦の長方形の建物から始まり、やがて階段状の構造へ発展した。
      それが次の時代のピラミッドにつながる。
      3000年続くエジプトの王朝の型が、この数百年で形づくられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Abu_Simbel_Temple_May_30_2007.jpg/500px-Abu_Simbel_Temple_May_30_2007.jpg
      credit: 英語版ウィキペディアのThan217さん / Public domain
      page: https://commons.wikimedia.org/wiki/File:Abu_Simbel_Temple_May_30_2007.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エジプト初期王朝時代

  - id: egypt-old-kingdom
    title: エジプト古王国
    start: -2686
    end: -2181
    category: politics
    tags: [エジプト, ピラミッド]
    summary: ピラミッド建設の時代。強大な王権と官僚制がナイルの恵みを組織した。
    detail: |
      エジプトの第3王朝から第6王朝までの時代で、紀元前2686年ごろから2181年ごろまで。
      ピラミッドが築かれた時代である。
      強大な王権と官僚制が、ナイルの恵みを組織した。

      王は神そのものとされた。
      死後は天へ昇り神々に加わると考えられ、その永遠の住まいとして巨大な墓が築かれる。
      階段ピラミッドから始まり、第4王朝のギザで真正のピラミッドが完成した。
      建設は国家の総力を挙げた事業である。
      石を切り出し、運び、積み上げる作業に数万人が関わった。
      奴隷ではなく、氾濫期に農作業のできない農民が動員されたとみられる。
      宿舎とパン工房の跡が見つかっており、報酬として食料が支給されていた。

      行政の組織も整えられた。
      宰相を頂点に、穀物の管理、土木、司法を担う役人が置かれる。
      書記は文字と計算を学び、社会的に高い地位を得た。
      王の権威は、宗教的な儀礼と建設事業によって可視化された。

      末期には、地方の長官が力を持ち、王権は弱まっていく。
      長期の干ばつによってナイルの増水が不足したことも指摘される。
      中央の統制が失われ、各地の勢力が並び立つ第1中間期へ移った。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Abu_Simbel_Temple_May_30_2007.jpg/500px-Abu_Simbel_Temple_May_30_2007.jpg
      credit: 英語版ウィキペディアのThan217さん / Public domain
      page: https://commons.wikimedia.org/wiki/File:Abu_Simbel_Temple_May_30_2007.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エジプト古王国

  - id: egypt-middle-kingdom
    title: エジプト中王国
    start: -2055
    end: -1650
    category: politics
    tags: [エジプト]
    summary: 混乱期を経て再統一された時代。文学と工芸の古典期とされる。
    detail: |
      第1中間期の分裂を経て再統一されたエジプトの時代で、紀元前2055年ごろから1650年ごろまで。
      第11王朝と第12王朝がこれにあたる。
      文学と工芸の古典期とされる。

      古王国の崩壊後、各地の州の長官が自立して争っていた。
      テーベの勢力がこれを制し、国を再びまとめる。
      この時代の王は、神としてよりも民を導く牧者として自らを示した。
      王の像には、疲れや思慮を感じさせる表情が刻まれる。
      古王国の理想化された顔とは対照的である。

      国家事業の中心は、灌漑と開墾に移った。
      ファイユーム地方の湖を管理して農地を広げ、生産を増やす。
      ピラミッドも造られたが、規模は小さく日干し煉瓦が多く使われた。
      対外的には、南のヌビアに要塞を築いて金と交易路を押さえた。
      シリアやクレタとの交易も活発である。

      文学では、この時代の言葉が後の規範になった。
      『シヌへの物語』や教訓文学が書かれ、書記の教育で写され続ける。
      宗教では、オシリス信仰が広まり、死後の審判と再生が王以外にも開かれた。
      末期には王権が弱まり、東方から来たヒクソスがデルタ地帯を支配する。
      再統一は、次の新王国を待つことになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Abu_Simbel_Temple_May_30_2007.jpg/500px-Abu_Simbel_Temple_May_30_2007.jpg
      credit: 英語版ウィキペディアのThan217さん / Public domain
      page: https://commons.wikimedia.org/wiki/File:Abu_Simbel_Temple_May_30_2007.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エジプト中王国

  - id: egypt-new-kingdom
    title: エジプト新王国
    start: -1550
    end: -1069
    category: politics
    tags: [エジプト]
    summary: 対外遠征でシリアまで勢力を広げた帝国期。ツタンカーメンやラメセス2世の時代。
    detail: |
      エジプトの第18王朝から第20王朝までの時代で、紀元前1550年ごろから1069年ごろまで。
      対外遠征によってシリアまで勢力を広げた帝国の時期である。
      ツタンカーメンやラメセス2世が属する。

      始まりは、異民族ヒクソスの追放である。
      テーベの勢力がこれを成し遂げ、その過程で馬と戦車、合成弓といった軍事技術を取り込んだ。
      以後、エジプトは常備の軍を持ち、外へ出ていく国になる。
      トトメス3世は十数回の遠征を行い、ユーフラテス川に達した。
      服属した地域の王子を人質としてエジプトで教育し、帰国後に支配させる方式がとられる。
      南はヌビアを併合し、金の産出が国力を支えた。

      王は死後、ピラミッドではなく王家の谷の岩窟墓に葬られた。
      墓を隠すことで盗掘を防ぐ意図があったが、ほとんどが荒らされている。
      アメン神の神官団が巨大な力を持ち、王権と緊張関係に入った。
      アクエンアテンの宗教改革は、その反動とも解釈される。

      ラメセス2世の時代にヒッタイトと講和し、平和が保たれた。
      末期には海の民の侵入と経済の混乱が重なり、王権は衰える。
      以後のエジプトは、外来の勢力に支配される時代へ移っていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Abu_Simbel_Temple_May_30_2007.jpg/500px-Abu_Simbel_Temple_May_30_2007.jpg
      credit: 英語版ウィキペディアのThan217さん / Public domain
      page: https://commons.wikimedia.org/wiki/File:Abu_Simbel_Temple_May_30_2007.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エジプト新王国

  - id: bantu-expansion
    title: バントゥー系の拡散
    start: -1000
    startCirca: true
    end: 1000
    endCirca: true
    category: society
    tags: [アフリカ, 移動]
    summary: 農耕と製鉄を携えた人々が中部・南部アフリカに広がり、言語地図を作り替えた。
    detail: |
      農耕と製鉄の技術を持つバントゥー系の人々が、中部と南部のアフリカへ広がった長期の移動。
      紀元前1000年ごろから後1000年ごろまで続いた。
      アフリカの言語地図を作り替えた出来事である。

      起点は、現在のカメルーンとナイジェリアの国境付近とされる。
      人口の増加と、森林を開いて畑にする農法が、移動を押し出したと考えられている。
      人々はヤムイモやバナナを栽培し、家畜を飼い、鉄の道具を使った。
      鉄の斧は森を開き、鉄の鍬は硬い土を耕す。
      狩猟採集を営んでいた先住の集団は、吸収されるか周縁へ移った。

      移動は二つの大きな流れに分かれたとされる。
      一つは熱帯雨林を通って中央アフリカへ、もう一つは大湖地方を経て東と南へ向かう。
      数千キロを、数十世代かけて進んだ。

      現在、アフリカの中部から南部にかけての500近い言語がバントゥー語群に属する。
      スワヒリ語、ズールー語、ショナ語などが含まれ、話者は数億に及ぶ。
      語彙と文法の比較から、移動の経路が復元されてきた。
      考古学と遺伝学の研究も、この過程を裏づけている。
      一つの言語集団がこれほど広い範囲に及んだ例は、世界的にも少ない。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Niger-Congo_map.png/500px-Niger-Congo_map.png
      credit: Ulamm / Public domain
      page: https://commons.wikimedia.org/wiki/File:Niger-Congo_map.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/バントゥー系民族

  - id: kush
    title: クシュ王国（ヌビア）
    start: -1070
    end: 350
    category: politics
    tags: [スーダン, アフリカ]
    summary: 一時はエジプトを支配した黒人王朝。のちメロエで製鉄と独自文字を発達させた。
    detail: |
      ナイル川上流のヌビア地方に栄えた王国で、紀元前1070年ごろから後350年ごろまで続いた。
      一時はエジプト全土を支配した。
      後にメロエへ都を移し、製鉄と独自の文字を発達させる。

      この地域はエジプトにとって金と象牙と黒檀の供給地であり、長く支配を受けていた。
      新王国が衰えると自立し、独自の王国を築く。
      紀元前8世紀、クシュの王ピイが北へ進んでエジプトを征服した。
      第25王朝と呼ばれるこの王朝は、エジプトの伝統を尊重し、神殿を修復してピラミッドの造営も復活させる。
      しかしアッシリアの侵攻によってエジプトから撤退した。
      以後、都を南のメロエへ移す。

      メロエ時代には、独自の性格が強まった。
      鉄の生産が盛んになり、精錬の跡が大量に残っている。
      エジプトの象形文字をもとにした独自の文字が作られ、いまも完全には解読されていない。
      王の埋葬には小型で傾斜の急なピラミッドが用いられ、200基以上が現存する。
      女性の統治者が繰り返し現れたことも特徴である。

      交易はエジプト、ローマ、インド洋方面にまで及んだ。
      4世紀にエチオピアのアクスム王国の攻撃を受けて衰える。
      アフリカ内陸に育った独自の文明として、近年再評価が進んでいる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/1/14/Africa_in_400_BC.jpg
      credit: Kubek15 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Africa_in_400_BC.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クシュ

  - id: ptolemaic-egypt
    title: プトレマイオス朝
    start: -305
    end: -30
    category: culture
    tags: [エジプト, ヘレニズム]
    summary: ギリシア系の王朝がエジプトを治め、アレクサンドリアが学問の都になった。
    detail: |
      アレクサンドロスの部将プトレマイオスが開いた王朝で、紀元前305年から30年まで続いた。
      ギリシア系の支配層がエジプトを治めた。
      アレクサンドリアが学問の都になる。

      支配の構造は二重だった。
      王と官僚と軍はギリシア人とマケドニア人が占め、ギリシア語が行政の言語になる。
      一方、王はエジプトの神殿で伝統的な儀礼を行い、ファラオとして振る舞った。
      神殿には従来の様式で浮彫が刻まれ、王の名は象形文字でも記される。
      経済は国家の統制が強い。
      穀物、油、パピルスは専売とされ、大量の小麦が地中海各地へ輸出された。
      エジプトは長く地中海の穀倉として機能する。

      アレクサンドリアには、図書館と研究施設が置かれた。
      各地から学者が集められ、幾何学、天文学、医学、文献学が発達する。
      エウクレイデス、エラトステネス、アルキメデスがこの都市と関わった。
      王家では、姉弟や兄妹の結婚が繰り返された。
      内紛と暗殺が頻発し、王朝は次第に弱体化する。

      紀元前2世紀以降、ローマの影響下に入った。
      最後の君主クレオパトラ7世がローマの内戦に関わり、敗れて王朝は終わる。
      エジプトはローマの属州ではなく、皇帝の私領として扱われた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Ptolemaic_Kingdom_III-II_century_BC_-_en.svg/500px-Ptolemaic_Kingdom_III-II_century_BC_-_en.svg.png
      credit: "Ptolemaic Kingdom III-II century BC - ru.svg: Kaidor (トーク · 投稿記録) derivative work: rowanwindwhistler (トーク) derivative work: Amphipolis / CC BY-SA 4.0"
      page: https://commons.wikimedia.org/wiki/File:Ptolemaic_Kingdom_III-II_century_BC_-_en.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/プトレマイオス朝

  - id: aksum
    title: アクスム王国
    start: 100
    startCirca: true
    end: 940
    endCirca: true
    category: economy
    tags: [エチオピア, 交易]
    summary: 紅海交易で栄え、4世紀にキリスト教を受け入れた。
    detail: |
      現在のエチオピア北部とエリトリアに栄えた王国で、1世紀ごろから10世紀ごろまで続いた。
      紅海の交易で富を築き、4世紀にキリスト教を受け入れた。

      高原に位置し、紅海沿岸の港アドゥリスを通じて交易に参加した。
      象牙、金、香料、犀の角、奴隷を輸出し、ローマ、インド、アラビアの品を輸入する。
      3世紀の記録は、ペルシア、ローマ、中国と並ぶ世界の四大国の一つとしてこの王国を挙げている。

      独自の文字と貨幣を持っていた。
      ゲエズ語を記す文字は、現在のエチオピアの文字につながる。
      金・銀・銅の貨幣を発行した数少ないアフリカの国家でもある。
      王の墓には、一枚岩を削り出した巨大な石柱が建てられた。
      高さ20メートルを超えるものもあり、建物の窓を模した彫刻が施されている。

      4世紀、エザナ王のもとでキリスト教が受け入れられた。
      ローマ帝国での公認とほぼ同時期であり、以後の信仰は独自の教会として続く。
      6世紀には紅海を渡ってイエメンへ遠征し、影響力を広げた。
      7世紀以降、イスラム勢力が紅海の交易を握ると、王国は内陸へ後退する。
      交易の利益を失って衰えたが、その伝統はエチオピアの王朝と教会に受け継がれた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/5/54/LocationAksumiteEmpire.png
      credit: 作者不明 / CC BY-SA 2.5
      page: https://commons.wikimedia.org/wiki/File:LocationAksumiteEmpire.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アクスム王国

  - id: ghana-empire
    title: ガーナ王国
    start: 300
    startCirca: true
    end: 1240
    category: economy
    tags: [西アフリカ, 金]
    summary: サハラ縦断交易の金と塩を押さえた最初の西アフリカ帝国。
    detail: |
      西アフリカのサヘル地帯に栄えた王国で、8世紀ごろから13世紀まで続いた。
      サハラ縦断交易の金と塩を押さえた最初の大きな国家である。
      現在のガーナ共和国とは位置が異なる。

      領域は、現在のマリ南西部からモーリタニア南部にあたる。
      南の森林地帯で産出する金と、サハラの岩塩鉱で採れる塩が、この地で交換された。
      塩は熱帯では貴重で、金と同じ重さで取引されたとも伝えられる。
      王はこの交易に課税した。
      出入りする金と塩に税をかけ、金塊はすべて王のものとする規定もあったとされる。

      繁栄の様子は、イスラムの地理学者の記録に残る。
      首都は二つの区域に分かれ、一方に王宮と伝統的な信仰の場が、もう一方にイスラム商人の居住区とモスクがあった。
      王は伝統の宗教を保ちながら、ムスリムの商人と官僚を用いている。

      軍は弓兵と騎兵からなり、鉄の武器を備えていた。
      11世紀以降、北からのベルベル系の勢力の圧力、交易路の変化、干ばつによって衰える。
      13世紀にマリ帝国に吸収された。
      独立の際に現在のガーナがこの名を選んだのは、アフリカに古い国家の伝統があったことを示すためである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/Ghana_reich_karte.png/500px-Ghana_reich_karte.png
      credit: Luxo / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Ghana_reich_karte.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ガーナ王国

  - id: fatimid
    title: ファーティマ朝
    start: 909
    end: 1171
    category: religion
    tags: [エジプト, シーア派]
    summary: シーア派のカリフを名乗りカイロを築いた。イスラム世界は一つではなくなった。
    detail: |
      シーア派の一派イスマーイール派が建てた王朝で、909年から1171年まで続いた。
      北アフリカに興り、969年にエジプトを征服してカイロを都とした。
      イスラム世界に複数のカリフが並び立つ状態を作る。

      支配者は、預言者の娘ファーティマの子孫を自称した。
      それを根拠にカリフを名乗り、バグダードのアッバース朝と正面から対抗する。
      イスラム世界に、三つのカリフが並ぶ時期が生まれた。
      新都カイロが建設され、アズハル学院が設けられた。
      イスマーイール派の教義を教える施設として始まり、のちにスンナ派の最高学府になる。
      現在まで続く世界最古級の大学の一つである。

      経済では、紅海とインド洋の交易を重視した。
      ペルシア湾経由の航路に代わり、紅海経由で香辛料が運ばれるようになる。
      イタリアの商業都市とも取引し、地中海の交易が活発になった。
      宗教には寛容な面もあった。
      住民の多数はスンナ派のままで、キリスト教徒とユダヤ教徒も行政に登用される。

      11世紀以降、軍の各集団の争いと飢饉で弱体化した。
      十字軍の侵攻に対応できず、サラディンによって1171年に廃される。
      エジプトはスンナ派に戻り、アッバース朝のカリフの名が再び唱えられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/21/Rectangular_green_flag.svg/500px-Rectangular_green_flag.svg.png
      credit: Jeff Dahl / Public domain
      page: https://commons.wikimedia.org/wiki/File:Rectangular_green_flag.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ファーティマ朝

  - id: kanem-bornu
    title: カネム・ボルヌ
    start: 700
    startCirca: true
    end: 1900
    category: politics
    tags: [西アフリカ, イスラム]
    summary: チャド湖周辺で1000年以上続いた国家。サハラ交易とイスラムを結んだ。
    detail: |
      チャド湖の周辺に存在した国家で、8世紀ごろから20世紀初めまで1000年以上続いた。
      前半をカネム、後半をボルヌと呼ぶ。
      サハラ縦断の交易とイスラムを結びつけた。

      遊牧民が湖の東側に築いた王国から始まる。
      11世紀に王家がイスラムを受け入れ、交易と外交の幅が広がった。
      メッカへの巡礼を行い、カイロに留学のための施設も設けている。
      経済の柱はサハラ縦断の交易である。
      北からは塩、馬、織物、武器が、南からは奴隷、象牙、皮革が運ばれた。
      馬を輸入して騎兵を編成し、それが軍事力の中心になる。

      14世紀、内紛と外部の圧力によって王家は湖の西側へ移った。
      新たな拠点ボルヌで国を建て直し、16世紀に最盛期を迎える。
      オスマン帝国から火器を入手し、軍を近代化した。
      統治では、イスラム法と在来の慣習が併用された。
      王は神聖な存在として扱われ、人前に姿を見せない慣行もあった。

      19世紀にはイスラム改革運動の攻撃を受け、さらにスーダン方面からの侵入で打撃を受ける。
      1900年前後にフランス、イギリス、ドイツによって分割された。
      王家の系譜は、ナイジェリア北東部の伝統的な首長として現在も残っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/Kanem_flag_from_dulcerta_1339-pt.svg/500px-Kanem_flag_from_dulcerta_1339-pt.svg.png
      credit: 4shizzal (トーク · 投稿記録) / CC0
      page: https://commons.wikimedia.org/wiki/File:Kanem_flag_from_dulcerta_1339-pt.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カネム・ボルヌ帝国

  - id: great-zimbabwe
    title: 大ジンバブエ
    start: 1100
    startCirca: true
    end: 1450
    endCirca: true
    category: economy
    tags: [アフリカ南部, 石造建築]
    summary: 金と象牙の交易で栄え、モルタルを使わない石積みの都市を残した。
    detail: |
      アフリカ南部の高原に築かれた石造の都市で、11世紀から15世紀にかけて栄えた。
      金と象牙の交易で富を築いた王国の中心である。
      モルタルを使わない石積みの遺跡が残る。

      遺跡は、丘の上の囲い、谷の集落、そして大囲壁からなる。
      大囲壁は高さ10メートル、厚さ5メートルに達し、外壁の全長は250メートルを超える。
      切り出した石を積み上げただけで、接着剤は使われていない。

      建設したのはショナ語を話す人々である。
      牧畜と農耕を基盤とし、内陸の金を東海岸の港へ運ぶ交易を握った。
      遺跡からは、中国の陶磁器、ペルシアのガラス、インドのビーズが出土している。
      インド洋の交易網に組み込まれていたことが分かる。

      最盛期の人口は1万から2万と推定される。
      石の鳥の彫刻が複数見つかっており、王権の象徴だったとみられる。
      15世紀に放棄された。
      周辺の環境の劣化、交易路の移動、塩と牧草の不足などが理由として挙げられる。
      19世紀にヨーロッパ人がこの遺跡を知ったとき、アフリカ人が造ったはずはないという主張が長く繰り返された。
      考古学の調査によって現地の人々の手によるものと確認され、独立後の国名もこの遺跡から取られている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/Great-Zimbabwe-2.jpg/500px-Great-Zimbabwe-2.jpg
      credit: Image taken by Jan Derk in 1997 in Zimbabwe. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Great-Zimbabwe-2.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/グレート・ジンバブエ遺跡

  - id: ayyubid
    title: アイユーブ朝
    start: 1171
    end: 1250
    category: war
    tags: [エジプト, 十字軍]
    summary: サラディンが十字軍と戦い、エジプトとシリアを一つに束ねた。
    detail: |
      サラディンが創始した王朝で、1171年から1250年まで続いた。
      エジプトとシリアを一つに束ね、十字軍と戦った。
      クルド系の出身の一族である。

      サラディンはファーティマ朝の宰相として実権を握り、シーア派のカリフ制を廃してスンナ派に戻した。
      名目上はバグダードのカリフの下に入る。
      その後シリアへ勢力を広げ、ダマスカスとアレッポを支配下に置いた。
      エジプトの富とシリアの兵を一つにまとめたことが、十字軍国家を圧倒する力になる。

      1187年のヒッティーンの戦いでエルサレム王国の主力を破り、エルサレムを回復した。
      第3回十字軍とは決着がつかず、巡礼を認める協定で和平を結んでいる。
      統治では、イクターと呼ばれる制度が用いられた。
      軍人に土地の徴税権を与え、その収入で兵を養わせる仕組みである。
      マドラサを各地に建て、スンナ派の教育を広めた。

      サラディンの死後、領土は一族に分割された。
      互いに争うことも多く、十字軍との関係も戦争と交渉が入り混じる。
      フリードリヒ2世との交渉でエルサレムを一時譲ったのもこの王朝である。
      1250年、軍の中核だったマムルークが政権を奪い、王朝は終わった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Flag_of_Ayyubid_Dynasty.svg/500px-Flag_of_Ayyubid_Dynasty.svg.png
      credit: Ch1902 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Ayyubid_Dynasty.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アイユーブ朝

  - id: benin-kingdom
    title: ベニン王国
    start: 1180
    end: 1897
    category: culture
    tags: [西アフリカ, 青銅]
    summary: 高度な青銅彫刻で知られる王国。イギリスの遠征で滅び、美術品は各地に散った。
    detail: |
      西アフリカのニジェール川下流域に存在した王国で、12世紀ごろから1897年まで続いた。
      現在のナイジェリア南部にあたり、現在のベナン共和国とは別である。
      精巧な青銅の彫刻で知られる。

      王はオバと呼ばれ、宗教的な権威を兼ねた。
      首都ベニンシティは城壁と堀に囲まれ、幅の広い直線の街路が整えられていた。
      15世紀に訪れたポルトガル人は、その規模と秩序を本国の都市と比べて高く評価している。
      交易では、ヨーロッパ人に胡椒、象牙、織物を売った。
      見返りに銅と真鍮が持ち込まれ、それが彫刻の材料になる。
      奴隷の取引にも関わったが、王は一時これを制限している。

      青銅の作品は、失われた蝋を用いる精密な鋳造法で作られた。
      王宮の柱を飾る浮彫の板には、王と廷臣、ポルトガル人の姿が記録されている。
      文字を持たない社会で、歴史を記録する役割も果たした。

      1897年、イギリスの使節団が襲撃された事件を口実に、遠征隊が王都を占領した。
      王は流刑となり、王宮は焼かれる。
      数千点の美術品が持ち去られ、ヨーロッパとアメリカの博物館に散った。
      これらの返還を求める運動が近年強まり、一部の作品はすでに返されている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/4c/EdoScale.jpeg
      credit: Commons and Rollebon / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:EdoScale.jpeg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ベニン王国

  - id: mali-empire
    title: マリ帝国
    start: 1235
    end: 1670
    category: economy
    tags: [西アフリカ, 金]
    summary: サハラ縦断交易の金と塩で栄え、トンブクトゥが学問の都となった。
    detail: |
      西アフリカのサヘル地帯に栄えた帝国で、13世紀から17世紀まで続いた。
      金と塩のサハラ縦断交易で富を築いた。
      トンブクトゥが学問の都になる。

      ガーナ王国の衰退後、スンジャタが周辺の勢力を破って建国した。
      最盛期には、大西洋岸からニジェール川の湾曲部までを支配する。
      経済の基盤は金である。
      当時、地中海世界に流通する金の相当部分がこの地域から来ていたとされる。
      塩、銅、織物、馬が北から運ばれ、金、象牙、奴隷が北へ送られた。

      マンサ・ムーサの巡礼は、その富を世界に知らせた。
      1324年、数千の随行者と大量の金を携えてカイロを通過し、贈り物と支出で現地の金の相場が下落したと伝えられる。
      この旅の後、ヨーロッパの地図にこの王の名と姿が描かれた。

      トンブクトゥとジェンネには、モスクと学院が建てられた。
      各地から学者が集まり、法学、天文学、医学の写本が作られる。
      これらの写本は現在も保存され、アフリカに文字による学問の伝統があったことを示している。
      15世紀以降、内紛と周辺勢力の台頭で領域は縮んだ。
      東のソンガイ帝国に主導権を奪われ、17世紀に消滅する。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/61/The_Mali_Empire.jpg/500px-The_Mali_Empire.jpg
      credit: Gabriel Moss / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:The_Mali_Empire.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マリ帝国

  - id: mamluk
    title: マムルーク朝
    start: 1250
    end: 1517
    category: politics
    tags: [エジプト, 軍事]
    summary: 奴隷出身の軍人が国を治めた260年。モンゴルの西進を食い止めた。
    detail: |
      奴隷身分の軍人が統治した王朝で、1250年から1517年までエジプトとシリアを支配した。
      マムルークとは、買われて軍事訓練を受けた兵士を指す。
      モンゴルの西進を食い止めた。

      アイユーブ朝が軍の中核としていたマムルークが、主君の死後に政権を奪った。
      支配層は世襲ではない。
      草原地帯から少年を買い、訓練して軍人に育てる仕組みが繰り返される。
      スルタンの位も、実力者が前任者を倒して就くことが多かった。
      1260年、アイン・ジャールートの戦いでモンゴル軍を破った。
      この勝利によって、イスラム世界の防衛者という地位を得る。
      バイバルスは十字軍国家を次々に攻略し、1291年に最後の拠点を落とした。

      バグダードの陥落後、アッバース家の一人をカイロに迎えてカリフとして擁立した。
      これによって宗教的な正統性を確保する。
      経済は、インド洋から紅海を経る香辛料の交易に依存した。
      莫大な通行税が国庫を潤し、カイロは壮麗な建築で飾られる。

      14世紀の黒死病と、ポルトガルによる喜望峰経由の航路の開拓が打撃になった。
      火器の導入も遅れる。
      1517年、オスマン帝国に敗れて王朝は終わった。
      それでもマムルークは地方の支配層として19世紀まで残り続ける。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Mameluke_Flag.svg/500px-Mameluke_Flag.svg.png
      credit: "原作: Producer ベクタ: Ryucloud / Public domain"
      page: https://commons.wikimedia.org/wiki/File:Mameluke_Flag.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マムルーク朝

  - id: solomonic-ethiopia
    title: ソロモン朝エチオピア
    start: 1270
    end: 1974
    category: religion
    tags: [エチオピア, キリスト教]
    summary: 700年続いたキリスト教王朝。20世紀まで独立を保った数少ないアフリカの国。
    detail: |
      エチオピア高原に存在した王朝で、1270年から1974年まで続いた。
      王家はソロモンとシバの女王の子孫を称した。
      キリスト教を保ち、20世紀まで独立を維持した数少ないアフリカの国である。

      先行する王朝を倒した支配者が、自らを古い王家の血を引く者と位置づけて正統性を主張した。
      その由来を記した書物が、王権の根拠として編まれている。
      王は決まった都を持たず、宮廷ごと移動する時期が長かった。
      各地を巡ることで、広い高原の支配を保つ方法である。

      周囲がイスラム化するなかで、キリスト教の信仰を保ち続けた。
      16世紀には隣接するイスラム勢力の侵攻を受け、ポルトガルの援軍を得て撃退している。
      岩を掘り抜いた教会群や独自の典礼が、この伝統を今に伝える。

      19世紀後半、ヨーロッパの進出が本格化した。
      1896年のアドワの戦いでイタリア軍を破り、独立を守る。
      アフリカの国が植民地化を武力で退けた例として、各地の運動を勇気づけた。
      1936年から5年間イタリアに占領されたが、その後復帰する。
      1974年、飢饉と社会の矛盾を背景とする革命で皇帝が退位し、700年続いた王朝は終わった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Flag_of_Ethiopia_%281897%E2%80%931974%29.svg/500px-Flag_of_Ethiopia_%281897%E2%80%931974%29.svg.png
      credit: Oren neu dag / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Ethiopia_(1897%E2%80%931974).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エチオピア帝国

  - id: kongo-kingdom
    title: コンゴ王国
    start: 1390
    end: 1914
    category: politics
    tags: [中部アフリカ]
    summary: ポルトガルと対等な外交を始めたが、奴隷貿易に巻き込まれて衰えた。
    detail: |
      中部アフリカの大西洋岸に存在した王国で、14世紀末から20世紀初めまで続いた。
      現在のアンゴラとコンゴ民主共和国にまたがる。
      ポルトガルと対等な外交を始めたが、奴隷貿易に巻き込まれて衰えた。

      王はマニ・コンゴと呼ばれ、複数の州を任命した知事に治めさせた。
      貝殻を貨幣として用い、織物と銅と鉄の交易が行われている。
      1483年にポルトガル船が到来すると、王国は積極的に関係を結んだ。
      国王自らがキリスト教を受け入れ、洗礼名を名乗る。
      使節と留学生がリスボンへ送られ、ローマ教皇のもとへも人が派遣された。
      王国はポルトガル語で書簡を交わし、対等な国家として振る舞う。

      しかし関係は急速に変質した。
      砂糖農園の労働力として、大量の人間が求められるようになる。
      王アフォンソ1世は、国が荒廃しているとして奴隷の取引を制限するよう訴える書簡をポルトガル王に送った。
      その要求は事実上無視される。

      内陸から人を捕らえる戦争が続き、社会は不安定になった。
      1665年、ポルトガルとの戦いに敗れて王が戦死し、王国は分裂する。
      以後は名目的な存在となり、1914年にポルトガルによって完全に廃された。
      外来の勢力との接触が、対等な外交から従属へ変わる過程を示す例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/Flag_of_the_Kingdom_of_Kongo_according_to_Giovanni_Cavazzi_da_Montecuccolo.svg/500px-Flag_of_the_Kingdom_of_Kongo_according_to_Giovanni_Cavazzi_da_Montecuccolo.svg.png
      credit: Oren neu dag / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_Kingdom_of_Kongo_according_to_Giovanni_Cavazzi_da_Montecuccolo.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/コンゴ王国

  - id: songhai
    title: ソンガイ帝国
    start: 1464
    end: 1591
    category: politics
    tags: [西アフリカ]
    summary: マリに代わり西アフリカ最大の版図を築いたイスラム国家。
    detail: |
      ニジェール川の湾曲部を中心に栄えた帝国で、15世紀後半から1591年まで続いた。
      マリ帝国に代わり、西アフリカで最大の版図を築いた。
      イスラムを国家の基盤とした。

      都はガオで、古くから交易の拠点だった。
      マリの支配を脱して自立し、ソンニ・アリのもとで急速に拡大する。
      トンブクトゥとジェンネを征服し、ニジェール川の流域を押さえた。
      川を使う水軍と騎兵の組み合わせが、その軍事力の特徴である。
      アスキア・ムハンマドの代に制度が整えられた。
      領域を州に分けて知事を置き、税と軍役の仕組みを作る。
      度量衡を統一し、交易の安全を確保した。
      イスラム法にもとづく統治を進め、学者を厚く遇している。

      トンブクトゥには、学院と写本の工房が集まった。
      各地から学生が集まり、法学、天文学、医学が教えられる。
      書物が金よりも高く取引されたという記録もある。
      経済は、金、塩、奴隷の交易に支えられた。

      1591年、モロッコのスルタンが火器を備えた遠征軍を送る。
      数で勝るソンガイ軍は、鉄砲の前に敗れた。
      帝国は分裂し、サハラ縦断交易の中心も失われる。
      西アフリカの大帝国の時代は、ここで終わった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/Songhai_Empire_%28orthographic_projection%29.svg/500px-Songhai_Empire_%28orthographic_projection%29.svg.png
      credit: KarnRedsun / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Songhai_Empire_(orthographic_projection).svg
    links:
