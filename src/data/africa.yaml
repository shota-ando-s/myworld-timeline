  - id: atlantic-slave-trade
    title: 大西洋奴隷貿易
    start: 1526
    end: 1867
    category: economy
    tags: [アフリカ, 植民地]
    summary: 1200万人以上が大西洋を渡らされた。アフリカの人口構造と社会を長期に傷つけた。
    detail: |
      アフリカの人々が大西洋を越えてアメリカ大陸へ運ばれた取引で、16世紀から19世紀まで続いた。
      1200万人以上が船に乗せられ、200万人近くが航海中に死亡したと推定される。
      アフリカの人口構造と社会を長期にわたって傷つけた。

      背景は、アメリカ大陸での労働力の需要である。
      先住民が疫病で激減し、砂糖、綿花、タバコ、コーヒーの農園を動かす人手が求められた。
      三角貿易と呼ばれる構造が作られる。
      ヨーロッパから織物と銃と酒がアフリカへ運ばれ、そこで人と交換された。
      人はアメリカへ運ばれ、生産された砂糖や綿がヨーロッパへ戻る。

      中間航路と呼ばれる大西洋の横断は過酷だった。
      船倉に横たわることしかできない状態で数週間から数か月を過ごし、病と栄養不足で多くが死んだ。
      アフリカ側では、銃と引き換えに人を売る構図が内陸の戦争を煽った。
      捕虜が商品になることで、襲撃が経済活動になる。
      働き盛りの世代が奪われた地域では、農業も手工業も衰えた。

      19世紀にイギリスをはじめ各国が禁止し、海軍による取り締まりが行われる。
      それでも密貿易は続き、完全に終わるのは1860年代である。
      その影響は、現在のアフリカとアメリカ大陸の社会に残り続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Triangular_trade.svg/500px-Triangular_trade.svg.png
      credit: "Triangular_trade.png: Sémhur World_map_-_low_resolution.svg: Al MacDonald [1]/ twitter account @F1LT3R derivative work: Jon C (talk) / CC BY-SA 3.0"
      page: https://commons.wikimedia.org/wiki/File:Triangular_trade.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大西洋奴隷貿易

  - id: ashanti
    title: アシャンティ王国
    start: 1701
    end: 1902
    category: politics
    tags: [西アフリカ, 金]
    summary: 金と交易で栄え、イギリスと四度戦った西アフリカの強国。
    detail: |
      現在のガーナ内陸部にあった王国で、17世紀末から20世紀初めまで続いた。
      金と交易で栄え、イギリスと四度にわたって戦った西アフリカの強国である。

      複数の小さな首長国が、共通の敵に対抗するために連合したことから始まる。
      黄金の床几が天から降ったという伝承が、統合の象徴になった。
      これは王個人のものではなく、国民全体の魂が宿るとされる。
      領域内には豊かな金鉱があり、コーラの実も産出した。
      北のサハラ交易と南の海岸の交易の両方に関与し、ヨーロッパ商人とも取引する。

      統治の仕組みは整っていた。
      中央から地方へ道路が整備され、使者の制度が置かれる。
      徴税と司法の官職があり、重要な決定は評議会で議論された。
      王は絶対の権力者ではなく、失政があれば退位させられる。

      19世紀、イギリスとの衝突が繰り返された。
      1874年には首都が占領され、賠償を課される。
      1900年、イギリスの総督が黄金の床几に座ろうとしたことが反乱を招いた。
      王国の魂を侮辱する行為とみなされたためである。
      1902年に併合され、王は流刑となった。
      王位は後に復活し、現在も伝統的な権威として存続している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/Flag_of_Ashanti.svg/500px-Flag_of_Ashanti.svg.png
      credit: Himasaram / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Ashanti.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アシャンティ王国

  - id: scramble-for-africa
    title: アフリカ分割
    start: 1881
    end: 1914
    category: politics
    tags: [アフリカ, 帝国主義]
    summary: 30年ほどでほぼ全土が欧州の植民地になり、現在の国境線が引かれた。
    detail: |
      ヨーロッパ列強がアフリカ大陸を分割し、植民地とした過程で、1880年代から1914年まで続いた。
      30年ほどで、ほぼ全土が支配下に入る。
      現在の国境線の多くがこのときに引かれた。

      19世紀半ばまで、ヨーロッパの支配は沿岸の拠点に限られていた。
      内陸は地理が知られておらず、マラリアが進出を阻んでいる。
      条件が変わった。
      キニーネがマラリアの予防に有効と分かり、蒸気船が河をさかのぼり、連発銃が戦力の差を決定的にした。
      探検によって内陸の地理も明らかになる。

      動機は複合的である。
      原料の供給地と市場の確保、国家の威信、キリスト教の布教が挙げられる。
      一国が進出すれば他国も追随するという競争の構造も働いた。
      1884年のベルリン会議で、実効支配の原則が定められた。
      沿岸を押さえるだけでなく、内陸を実際に統治することが領有の条件になる。
      これが内陸への進出を加速させた。

      1914年の時点で、独立を保っていたのはエチオピアとリベリアだけである。
      境界は緯線や経線、川によって引かれ、民族や言語の分布は考慮されなかった。
      独立後の国家がこの線を引き継いだため、現在まで紛争の要因になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Colonial_Africa_1913_map.svg/500px-Colonial_Africa_1913_map.svg.png
      credit: Eric Gaba (Sting - fr:Sting) / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Colonial_Africa_1913_map.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アフリカ分割

  - id: apartheid
    title: アパルトヘイト
    start: 1948
    end: 1994
    category: society
    tags: [南アフリカ, 人種隔離]
    summary: 法で人種を分けた体制。国際的な制裁と国内の抵抗で46年後に終わった。
    detail: |
      南アフリカで法によって人種を分離した体制で、1948年から1994年まで続いた。
      分離を意味する言葉である。
      国際的な制裁と国内の抵抗によって、46年後に終わった。

      人種による差別は以前から存在していたが、1948年に政権を得た国民党がこれを法体系として整備した。
      住民は人種によって登録され、居住地、職業、教育、結婚が区分される。
      異人種間の結婚は禁じられ、都市の居住区は分離された。
      黒人はホームランドと呼ばれる地域の住民とされ、本国では外国人のように扱われる。
      国土の13パーセントの土地に、人口の大半が割り当てられた。
      移動には通行証が必要で、違反は逮捕の対象になる。

      抵抗は続いた。
      アフリカ民族会議が運動を組織し、1960年のシャープビルでは抗議の群衆に警察が発砲して69人が死亡する。
      組織は非合法化され、ネルソン・マンデラは27年間投獄された。
      1976年のソウェトでは、学生の抗議に対する発砲が全国的な蜂起を招く。

      国際的には、経済制裁とスポーツからの排除が進んだ。
      国内の不安定と経済の停滞が重なり、体制は維持できなくなる。
      1990年にマンデラが釈放され、1994年に全人種が参加する選挙が行われた。
      マンデラが大統領となり、この体制は終わる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/DurbanSign1989.jpg/500px-DurbanSign1989.jpg
      credit: Guinnog / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:DurbanSign1989.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アパルトヘイト

events:
  - id: egypt-unified
    year: -3100
    circa: true
    title: 上下エジプトの統一
    category: politics
    tags: [エジプト]
    summary: ナイル沿いに統一国家が生まれ、3000年続く王朝の伝統が始まった。
    detail: |
      上エジプトと下エジプトが一つの王のもとにまとまった出来事で、紀元前3100年ごろとされる。
      ナイル沿いに統一国家が生まれ、3000年続く王朝の伝統が始まった。

      上エジプトはナイル川の上流にあたる細長い谷、下エジプトは河口のデルタ地帯を指す。
      風土も生業も異なり、それぞれ別の王冠と守護神を持っていた。
      伝承では、上エジプトの王メネスが下エジプトを征服したと伝えられる。
      ナルメルの名を刻んだ化粧板には、敵を打ち据える王と、二つの王冠をかぶる姿が刻まれている。
      メネスとナルメルが同一人物かどうかは、今も議論がある。

      実際の統一は、一度の征服ではなく数世代にわたる過程だったと考えられている。
      南の勢力が交易と軍事で北へ影響を広げ、最終的に一つの王権に収れんした。
      統一の後、王は二つの国の王という称号を用いた。
      上下の王冠を組み合わせた冠が作られ、統一そのものが王権の正統性の根拠になる。
      都は両地域の境目にあたるメンフィスに置かれた。

      同じ時期に、象形文字と暦、行政の組織が整えられた。
      後に王国が分裂しても、再び統一することが王の使命とされ続ける。
      国家がまとまっていることを当然の姿と考える意識が、この時点で生まれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Abu_Simbel_Temple_May_30_2007.jpg/500px-Abu_Simbel_Temple_May_30_2007.jpg
      credit: 英語版ウィキペディアのThan217さん / Public domain
      page: https://commons.wikimedia.org/wiki/File:Abu_Simbel_Temple_May_30_2007.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エジプト第1王朝

  - id: great-pyramid
    year: -2560
    circa: true
    title: ギザの大ピラミッド完成
    category: culture
    tags: [エジプト, 建築]
    summary: 高さ約147メートル。3800年間、人類が作った最も高い建造物だった。
    detail: |
      ギザに築かれたクフ王のピラミッドが完成した出来事で、紀元前2560年ごろとされる。
      高さは約147メートルで、3800年以上にわたり人類が作った最も高い建造物だった。

      使われた石は230万個を超え、平均すると2トン以上ある。
      内部には花崗岩の部屋と通路があり、上流から船で運ばれた石材が使われた。
      建設の方法は、いまも完全には解明されていない。
      直線の傾斜路を用いる説、らせん状に巻く説、内部に通路を作る説などが提出されている。
      近年見つかった記録文書には、石灰岩を船で運んだ作業隊の日誌が含まれており、実務の一端が分かってきた。

      労働力については、奴隷が酷使されたという古代ギリシアの記述が長く信じられてきた。
      発掘によって、労働者の集落とパン工房、骨折の治療を受けた人骨が見つかり、報酬と医療が与えられていたことが分かっている。
      測量の精度は際立っている。
      底面の各辺の長さの差はわずかで、方位のずれも極小である。
      外側を覆っていた化粧石は、中世に建材として持ち去られた。

      古代の世界の七不思議のうち、現存する唯一の建造物である。
      国家が資源と人を組織する力そのものを示す記念物として、4500年後の現在も立っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Great_Pyramid_Giza_%282%29.jpg/500px-Great_Pyramid_Giza_%282%29.jpg
      credit: Radosław Botev / CC BY 3.0 pl
      page: https://commons.wikimedia.org/wiki/File:Great_Pyramid_Giza_(2).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ギザの大ピラミッド

  - id: akhenaten
    year: -1350
    circa: true
    title: アクエンアテンの宗教改革
    category: religion
    tags: [エジプト, 一神教]
    summary: 太陽神アテンのみを崇めさせた試み。一代で廃され、記録も削られた。
    detail: |
      エジプトの王アクエンアテンが行った宗教改革で、紀元前14世紀半ばのこと。
      太陽の光を神格化したアテンのみを崇めさせた。
      一代で廃され、記録も削られる。

      エジプトは多数の神々を祀る社会だった。
      なかでもテーベのアメン神の神官団は広大な土地と富を持ち、王権に匹敵する力を蓄えている。
      王はアテンを唯一の神とし、他の神の信仰を禁じた。
      神殿は閉じられ、供物は打ち切られ、記念物からは他の神の名が削られる。
      王とその家族だけがアテンと直接つながる存在とされ、人々は王を通じて神に近づくとされた。

      新しい都が建設され、そこにアテンの神殿が置かれた。
      屋根のない構造で、太陽の光が直接差し込む。
      讃歌には、太陽がすべての地と生き物に等しく恵みを与えるという内容が歌われる。
      旧約聖書の詩篇との類似が指摘されてきた。

      しかし民衆のあいだに定着した形跡は乏しい。
      住居の跡からは、従来の守り神の像が見つかっている。
      王の死後、次代のツタンカーメンの時代に旧来の信仰が復活した。
      新都は放棄され、王の名は歴代の記録から削除される。
      国家が信仰を一度に作り替えようとして失敗した例として、繰り返し参照されてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/GD-EG-Caire-Mus%C3%A9e061.JPG/500px-GD-EG-Caire-Mus%C3%A9e061.JPG
      credit: 作者不明 / CC BY-SA 2.5
      page: https://commons.wikimedia.org/wiki/File:GD-EG-Caire-Mus%C3%A9e061.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アクエンアテン

  - id: assyria-conquers-egypt
    year: -671
    title: アッシリアのエジプト征服
    category: war
    tags: [エジプト, アッシリア]
    summary: 3000年の独立が破られ、以後エジプトは外来勢力の支配を繰り返す。
    detail: |
      新アッシリア帝国がエジプトを征服した出来事で、紀元前671年のこと。
      3000年近く保たれてきた独立が破られた。
      以後のエジプトは、外来の勢力に支配されることを繰り返す。

      当時のエジプトは、南から来たクシュの王朝が統治していた。
      エジプトはパレスチナの小国を支援してアッシリアに対抗しており、両者の衝突は避けられなくなっていた。
      アッシリア王エサルハドンはシナイ半島を越えて侵攻し、メンフィスを陥落させた。
      王タハルカは南へ逃れ、その家族は捕虜として連行される。
      アッシリアは現地の有力者を総督に任じて支配した。

      しかし反乱が続き、次の王アッシュールバニパルが再度の遠征を行う。
      紀元前663年、南の中心都市テーベが徹底的に略奪された。
      この出来事は旧約聖書にも記されている。
      アッシリアの支配は20年ほどで終わり、現地の有力者が自立して第26王朝を開いた。

      その後、エジプトはペルシア、ギリシア、ローマ、アラブ、オスマンの支配を次々に受ける。
      自前の王朝による統治が長期にわたって回復することはなかった。
      古代世界で最も長く続いた独立国家が終わった節目として、この征服は位置づけられる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/Map_of_Assyria.png/500px-Map_of_Assyria.png
      credit: Ningyou / Public domain
      page: https://commons.wikimedia.org/wiki/File:Map_of_Assyria.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アッシリア

  - id: alexander-egypt
    year: -332
    title: アレクサンドロスのエジプト征服
    category: war
    tags: [エジプト, ヘレニズム]
    summary: アレクサンドリアが建設され、地中海世界の学問の中心になっていく。
    detail: |
      アレクサンドロス大王がエジプトを征服した出来事で、紀元前332年のこと。
      ほとんど戦わずに支配が移った。
      建設されたアレクサンドリアは、地中海世界の学問の中心になっていく。

      当時のエジプトはペルシアの支配下にあった。
      重税と宗教への干渉に不満が強く、住民は新しい支配者を解放者として迎えたとされる。
      ペルシアの総督は抵抗せずに明け渡した。
      アレクサンドロスは現地の宗教を尊重した。
      神殿に犠牲を捧げ、ファラオとして認められる形をとる。
      砂漠の奥のシワのオアシスにある神託所を訪ね、神の子と告げられたと伝えられる。
      この経験が、後の彼の自己認識に影響したとされる。

      地中海沿岸に、自らの名を冠した都市の建設を命じた。
      港に適した立地が選ばれ、碁盤の目の街路が計画される。
      彼自身はまもなく東へ去り、二度と戻らなかった。
      死後、部将のプトレマイオスがエジプトを得て王朝を開く。
      遺体はアレクサンドリアへ運ばれ、その墓が都市の権威の源になった。

      この都市は、王宮と図書館と学術機関を備えた学問の中心に育つ。
      ギリシア語が行政と学問の言語となり、エジプトの伝統と混ざり合った。
      3000年続いたエジプトの文明が、ギリシア世界と本格的に接続した出来事である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/All_Gizah_Pyramids.jpg/500px-All_Gizah_Pyramids.jpg
      credit: Ricardo Liberato / CC BY-SA 2.0
      page: https://commons.wikimedia.org/wiki/File:All_Gizah_Pyramids.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エジプト末期王朝

  - id: library-of-alexandria
    year: -280
    circa: true
    title: アレクサンドリア図書館
    category: science
    tags: [エジプト, 学問]
    summary: 世界中の書物を集めようとした施設。地球の大きさもここで計算された。
    detail: |
      プトレマイオス朝がアレクサンドリアに設けた図書館で、紀元前3世紀の初めに整備された。
      世界中の書物を集めることを目標とした施設である。
      地球の大きさも、ここで計算された。

      王宮に隣接するムセイオンという研究機関の一部だった。
      学者は生活を保障され、研究に専念できる。
      蔵書は数十万巻に達したと伝えられるが、数字には幅がある。
      収集の方法は徹底していた。
      港に入る船の書物をすべて書き写し、写しを返して原本を図書館に納めたという逸話が残る。
      各地から写本を買い集め、翻訳も行われた。

      成果は多い。
      エラトステネスは、離れた二地点での太陽の角度の差から地球の周囲の長さを計算し、現在の値に近い数字を得た。
      エウクレイデスが幾何学を体系化し、天文学では太陽中心の説も唱えられる。
      ホメロスの写本を校合して本文を定める作業も行われ、文献学が生まれた。

      失われた経緯ははっきりしない。
      カエサルの戦闘での延焼、ローマ時代の混乱、キリスト教化後の衰退など、複数の要因が段階的に働いたとみられる。
      一度の破壊ではなく、支援が途絶えて徐々に失われたとする見方が有力である。
      知識を一か所に集めるという構想の、最初の大規模な実践だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Ancientlibraryalex.jpg/500px-Ancientlibraryalex.jpg
      credit: O. Von Corven / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ancientlibraryalex.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アレクサンドリア図書館

  - id: cleopatra-death
    year: -30
    title: クレオパトラの死
    category: politics
    tags: [エジプト, ローマ]
    summary: プトレマイオス朝が滅び、エジプトはローマの穀倉になった。
    detail: |
      クレオパトラ7世の死によってプトレマイオス朝が滅び、エジプトがローマの支配下に入った出来事。
      紀元前30年のことである。
      アレクサンドロスの後継国家は、これですべて消えた。

      前年のアクティウムの海戦で、アントニウスとクレオパトラの連合艦隊は敗れていた。
      オクタウィアヌスの軍がエジプトに迫り、アレクサンドリアは抵抗できない状態になる。
      アントニウスは、クレオパトラが死んだという誤報を受けて自害した。
      クレオパトラも捕らえられ、ローマの凱旋式で引き回されることを拒んで自ら命を絶つ。
      毒蛇を使ったという伝えは有名だが、毒物を用いたとする説もある。
      カエサルとのあいだの子は殺され、王朝の継承者は絶たれた。

      エジプトは属州ではなく、皇帝個人の支配地として扱われた。
      元老院議員は許可なく立ち入ることができない。
      穀物の供給を握る土地であり、その支配が政治的な脅威になることを避けるためである。

      以後、エジプトはローマの穀倉として機能した。
      毎年大量の小麦がローマへ運ばれ、市民への配給を支える。
      3000年続いた王朝の伝統は、ここで形式的にも終わった。
      地中海世界全体が一つの支配のもとに入る、その最後の一片でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/Kleopatra-VII.-Altes-Museum-Berlin1.jpg/500px-Kleopatra-VII.-Altes-Museum-Berlin1.jpg
      credit: Louis le Grand / Public domain
      page: https://commons.wikimedia.org/wiki/File:Kleopatra-VII.-Altes-Museum-Berlin1.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クレオパトラ7世

  - id: aksum-christianity
    year: 325
    circa: true
    title: アクスムのキリスト教受容
    category: religion
    tags: [エチオピア, キリスト教]
    summary: ローマ帝国とほぼ同時期に国教化し、独自の教会が今日まで続いている。
    detail: |
      アクスム王国がキリスト教を国家の宗教として受け入れた出来事で、4世紀前半のこと。
      ローマ帝国の公認とほぼ同じ時期にあたる。
      独自の教会が、そこから今日まで続いている。

      伝承によれば、紅海で難破した二人のシリア人の少年が宮廷に仕えたことが始まりである。
      そのうちフルメンティウスが王子の教育にあたり、信仰を伝えた。
      王エザナが受け入れると、フルメンティウスはアレクサンドリアへ赴いて司教に叙階される。
      この経緯から、エチオピアの教会の長はエジプトのコプト教会から派遣される慣行が生まれ、20世紀半ばまで続いた。

      受容は、紅海交易を通じてローマ世界と結びついていた背景と切り離せない。
      貨幣の意匠が三日月と円盤から十字へ変わったことが、その時期を示す。
      その後、5世紀末に修道士が到来して民衆への布教が進んだ。
      聖書はゲエズ語に訳され、独自の典礼と聖歌が育つ。

      7世紀以降、周囲がイスラム化するなかでも信仰は保たれた。
      山に囲まれた地形と、独自の教会組織がそれを可能にする。
      岩を掘り抜いて作られたラリベラの教会群は、その伝統の代表である。
      旧約の戒律に近い慣行を残し、契約の箱を保管していると主張するなど、独特の性格を持つ。
      アフリカ土着のキリスト教の最も古い例である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/5/54/LocationAksumiteEmpire.png
      credit: 作者不明 / CC BY-SA 2.5
      page: https://commons.wikimedia.org/wiki/File:LocationAksumiteEmpire.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アクスム王国

  - id: islam-conquers-egypt
    year: 641
    title: イスラム軍のエジプト征服
    category: war
    tags: [エジプト, イスラム]
    summary: 北アフリカがイスラム世界に入り、言語も信仰も大きく変わっていく。
    detail: |
      イスラム軍がエジプトを征服した出来事で、641年に決着した。
      指揮したのはアムル・イブン・アル・アースである。
      北アフリカがイスラム世界に入る出発点になった。

      エジプトはビザンツ帝国の属州だった。
      しかし、キリスト教の教義をめぐる対立から、現地のコプト教会は中央の教会と分かれており、重い税と宗教的な圧迫に不満を抱いていた。
      4000程度の兵で始まった遠征は、増援を得ながらデルタ地帯を制圧していく。
      640年にヘリオポリスで勝ち、翌年にバビロン要塞とアレクサンドリアが降伏した。

      征服後の統治は、改宗を強制しないものだった。
      キリスト教徒は人頭税を納めることで信仰と教会の運営を保障される。
      コプト教会の総主教は復権し、一時は以前より自由になったという評価もある。
      軍営として建設されたフスタートが行政の中心になり、後のカイロにつながる。

      変化は長い時間をかけて進んだ。
      アラビア語が行政の言語になり、数世紀のうちに日常語としても広がる。
      イスラムへの改宗も徐々に進み、多数派が入れ替わった。
      エジプトの豊かな穀物と税収は、以後のイスラム諸王朝の重要な基盤になる。
      地中海の南岸が、地中海世界から切り離されていく起点でもあった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アムル・イブン・アル＝アース

  - id: cairo-founded
    year: 969
    title: カイロの建設
    category: society
    tags: [エジプト, 都市]
    summary: ファーティマ朝の新都。アズハル学院はいまも続く世界最古級の大学の一つ。
    detail: |
      ファーティマ朝がエジプトを征服し、新しい都を建設した出来事で、969年のこと。
      勝利者を意味する名が与えられ、これがカイロになった。
      アズハル学院は、いまも続く世界最古級の大学の一つである。

      建設の場所は、旧来の軍営都市フスタートの北に選ばれた。
      最初は城壁に囲まれた王宮の区画で、カリフと軍と官僚のための空間だった。
      2年後、アズハルのモスクが完成する。
      当初はシーア派の教義を教える施設だったが、後にスンナ派の学問の中心になった。
      法学、神学、アラビア語の教育が千年以上続いている。

      都市はやがて城壁の外へ広がり、旧市街と一体になった。
      12世紀にサラディンが城塞を築き、防備を固める。
      バグダードがモンゴルに破壊された後、カイロはイスラム世界の最大の都市になった。
      マムルーク朝の時代には人口50万を超え、インド洋の香辛料交易の結節点として栄える。
      多数のモスク、学院、隊商宿が建てられ、その一部は現在も残る。

      中世の旅行家イブン・バットゥータは、この都市の規模と活気を詳しく書き残した。
      一つの王朝が対抗のために築いた都が、その王朝の滅亡後もイスラム世界の中心であり続けた例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Cairo_Skyline_%282020%29.jpg/500px-Cairo_Skyline_%282020%29.jpg
      credit: Faris El-Gwely / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Cairo_Skyline_(2020).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カイロ

  - id: mansa-musa-hajj
    year: 1324
    title: マンサ・ムーサのメッカ巡礼
    category: economy
    tags: [西アフリカ, 金]
    summary: 惜しみなく配った金でカイロの金相場が下落したと伝わるほどの富を示した。
    detail: |
      マリ帝国の王マンサ・ムーサが行ったメッカ巡礼で、1324年のこと。
      配った金でカイロの相場が下落したと伝えられる。
      西アフリカの富がイスラム世界とヨーロッパに知られる契機になった。

      巡礼は、イスラム教徒に課された務めの一つである。
      それを国家の威信を示す機会として、大規模に行った。
      記録によれば、随行者は数千から1万を超え、多数のらくだが金を積んでいた。
      道中で貧者に施し、モスクを建て、必要なものを金で購う。

      カイロでは3か月滞在した。
      支配者への贈り物と市中での散財によって、大量の金が流入する。
      その結果、金の価値が下がり、相場が回復するまでに10年以上かかったという記述が残る。
      帰路には資金が尽き、カイロの商人から高利で借り入れたとも伝えられる。

      この旅の影響は長く続いた。
      連れ帰った学者と建築家によって、トンブクトゥとガオにモスクと学院が建てられる。
      イスラム世界との学問の往来が定着した。
      ヨーロッパでも、アフリカ内陸に莫大な金を持つ王がいるという認識が広がる。
      1375年の地図に王の姿が描かれ、後の探検と進出の動機の一つにもなった。
      一度の旅が、外の世界の地理の認識を変えた例である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/c/c1/Mansa_Musa.jpg
      credit: Reproduction of the Catalan Atlas of the 20th century that can not be considered facsimile of the original. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Mansa_Musa.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マンサ・ムーサ

  - id: ibn-battuta-africa
    year: 1352
    title: イブン・バットゥータの西アフリカ訪問
    category: economy
    tags: [交易, 旅行記]
    summary: 30年の旅の記録が、サハラ以南の社会を外の世界に伝えた。
    detail: |
      モロッコ出身の旅行家イブン・バットゥータが西アフリカを訪れた出来事で、1352年のこと。
      30年に及ぶ旅の最後の行程にあたる。
      その記録が、サハラ以南の社会を外の世界に伝えた。

      彼は1325年にメッカ巡礼に出発し、そのままアフリカ東岸、インド、中央アジア、中国まで足を延ばしている。
      総距離は12万キロに達したとされる。
      西アフリカへの旅では、隊商に加わってサハラを縦断した。
      岩塩の産地タガザを通り、2か月かけてニジェール川流域のマリ帝国へ入る。

      記録には具体的な観察が並ぶ。
      治安がよく、旅人が安全に移動できること。
      礼拝が守られ、子どもに聖典を暗記させていること。
      王への拝謁の作法、女性が男性と自由に交わる慣習、食事の内容などである。

      彼はイスラム法学者として、現地の慣行を批判することもあった。
      一方で、その公正さと秩序を高く評価している。
      帰国後、旅の記録は文人によって書き取られた。
      当時のイスラム世界の広がりを一人の視点でたどれる、稀有な史料である。
      西アフリカについては、外部の人間が直接見て記した最も詳しい14世紀の記述になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Har%C3%AEr%C3%AE_Schefer_-_BNF_Ar5847_f.51.jpg/500px-Har%C3%AEr%C3%AE_Schefer_-_BNF_Ar5847_f.51.jpg
      credit: ヤフヤー・ブン・マフムード・ワースィティー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Har%C3%AEr%C3%AE_Schefer_-_BNF_Ar5847_f.51.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イブン・バットゥータ

  - id: ceuta-captured
    year: 1415
    title: ポルトガルのセウタ占領
    category: war
    tags: [ポルトガル, 大航海時代]
    summary: ヨーロッパのアフリカ進出の出発点。金と奴隷を求めて海岸線を南下していく。
    detail: |
      ポルトガルが北アフリカのセウタを占領した出来事で、1415年のこと。
      ヨーロッパによる海外進出の出発点とされる。
      以後、金と奴隷を求めて海岸線を南下していく。

      セウタはジブラルタル海峡に面した港で、サハラ縦断交易の北の出口にあたる。
      内陸から運ばれた金と奴隷が、ここで地中海世界へ流れていた。
      ポルトガル王家は、レコンキスタの延長として遠征を行った。
      若い王子たちに軍功の機会を与える意図もあったとされる。
      奇襲によって、一日で都市を制圧した。

      しかし期待した富は得られなかった。
      交易の隊商は別の港へ経路を変え、セウタは孤立した要塞として維持費だけがかかる。
      この経験から、交易路の源へ直接向かうという発想が生まれた。
      遠征に加わったエンリケ王子は、アフリカ西岸の探検を組織的に進める。

      航海は少しずつ南へ延びた。
      マデイラとアゾレスが植民され、1444年には西アフリカから人が運ばれて奴隷として売られる。
      金の産地に近づき、要塞と商館が築かれた。
      1488年に喜望峰、1498年にインド航路に到達する。
      一つの港の占領から始まった動きが、数十年でヨーロッパと世界の関係を変えることになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Flag_of_Portugal_%281830%E2%80%931910%29.svg/500px-Flag_of_Portugal_%281830%E2%80%931910%29.svg.png
      credit: Tonyjeff, based on ancient national symbol. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Portugal_(1830%E2%80%931910).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ポルトガル海上帝国

  - id: cape-of-good-hope
    year: 1488
    title: 喜望峰への到達
    category: economy
    tags: [ポルトガル, 航海]
    summary: アフリカ南端を回る航路が見つかり、10年後にインドへつながった。
    detail: |
      ポルトガルの航海者バルトロメウ・ディアスがアフリカ南端を回った出来事で、1488年のこと。
      インド洋への航路が開けることが確認された。
      10年後のインド到達につながる。

      ポルトガルは、半世紀にわたってアフリカ西岸を南下してきた。
      目的は、金の産地に直接近づくことと、アジアへの航路を見つけることである。
      ディアスの船団は嵐に遭い、陸地を見失ったまま南へ流された。
      東へ向きを変えても陸に当たらないことから、すでに大陸の南端を回ったと気づく。

      北上して現在の南アフリカの東岸に達し、海岸線が北東へ伸びていることを確認した。
      インド洋に通じる航路の存在が、これで裏づけられる。
      乗組員の反対で引き返す際、この岬を嵐の岬と名づけた。
      帰国後、国王がインドへの希望を託して喜望峰と改めたと伝えられる。

      10年後、ヴァスコ・ダ・ガマがこの航路を通ってインドのカリカットに到達した。
      香辛料をイスラム商人とヴェネツィアを介さずに得る道が開かれる。
      結果として、地中海を経る従来の交易路は衰えた。
      喜望峰は、以後400年にわたってヨーロッパとアジアを結ぶ主要な航路上の要地であり続ける。
      スエズ運河の開通まで、その地位は変わらなかった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2b/Cape_of_Good_Hope.jpg/500px-Cape_of_Good_Hope.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Cape_of_Good_Hope.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/喜望峰

  - id: songhai-falls
    year: 1591
    title: ソンガイ帝国の滅亡
    category: war
    tags: [西アフリカ, モロッコ]
    summary: 火器を持つモロッコ軍に敗れ、サハラ交易の中心が失われた。
    detail: |
      モロッコ軍の侵攻によってソンガイ帝国が崩壊した出来事で、1591年のこと。
      火器を備えた数千の軍が、数万の帝国軍を破った。
      サハラ縦断交易の中心が失われる。

      モロッコのスルタンは、岩塩鉱と金の産地を直接手に入れることを狙った。
      財政の逼迫も背景にある。
      遠征軍は4000程度で、多くはスペインから来た改宗兵や傭兵だった。
      装備は鉄砲と大砲である。
      砂漠を数か月かけて越え、多数の脱落者を出しながらニジェール川に到達した。

      トンディビの戦いで両軍が激突する。
      ソンガイ側は騎兵と歩兵で数万を数えたが、火器の一斉射撃に隊形を崩された。
      牛の群れを敵陣に突進させる戦法も、銃声に驚いた牛が自陣へ引き返して裏目に出たと伝えられる。
      帝国は崩壊し、ガオとトンブクトゥは占領された。
      学者たちは投獄され、一部はモロッコへ連行される。

      しかしモロッコも広大な地域を統治できなかった。
      駐屯した兵は現地化し、各地に小さな勢力が並び立つ状態になる。
      交易路の安全は失われ、サハラ縦断の商業は衰えた。
      この時期、ヨーロッパ船が西アフリカの海岸で交易を始めていた。
      内陸から海岸へ、経済の重心が移っていく転換点でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/Songhai_Empire_%28orthographic_projection%29.svg/500px-Songhai_Empire_%28orthographic_projection%29.svg.png
      credit: KarnRedsun / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Songhai_Empire_(orthographic_projection).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ソンガイ帝国

  - id: cape-colony
    year: 1652
    title: ケープ植民地の建設
    category: politics
    tags: [南アフリカ, オランダ]
    summary: 補給地として始まった入植が、のちの人種隔離社会の起点になった。
    detail: |
      オランダ東インド会社が南アフリカの南端に補給地を設けた出来事で、1652年のこと。
      アジアへ向かう船に水と食料を供給することが目的だった。
      これが、後の人種隔離社会の起点になる。

      最初の入植は、数十人の職員と農園から始まった。
      新鮮な野菜と肉を供給するため、会社の職員が独立して農業を営むことが認められる。
      彼らはブールと呼ばれた。
      労働力として、インドネシアやマダガスカルから奴隷が連れて来られた。
      現地の遊牧民からは家畜と土地が奪われ、抵抗は武力で抑えられる。
      持ち込まれた天然痘が、その人口を大きく減らした。

      入植者は内陸へ広がっていった。
      フランスから逃れたプロテスタントやドイツ人も加わり、独自の言語が形成される。
      これがアフリカーンス語になった。

      ナポレオン戦争の過程で、イギリスがこの植民地を獲得した。
      奴隷制の廃止と行政の変更に反発した入植者は、内陸へ大移動して独自の共和国を建てる。
      その後、ダイヤモンドと金が発見され、地域の重要性は一変した。
      土地と労働力をめぐる関係は、20世紀の人種隔離政策へつながる。
      一つの補給地として始まった入植が、300年後の社会構造を決めることになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ac/Flag_of_the_Cape_Colony_%281876%E2%80%931910%29.svg/500px-Flag_of_the_Cape_Colony_%281876%E2%80%931910%29.svg.png
      credit: Sodacan / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_Cape_Colony_(1876%E2%80%931910).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ケープ植民地

  - id: napoleon-egypt
    year: 1798
    title: ナポレオンのエジプト遠征
    category: war
    tags: [エジプト, フランス]
    summary: 学者を同行させた遠征でロゼッタ・ストーンが見つかり、古代エジプト学が生まれた。
    detail: |
      ナポレオンが率いるフランス軍がエジプトへ遠征した出来事で、1798年のこと。
      学者を同行させたことでロゼッタ・ストーンが見つかり、古代エジプト学が生まれた。

      目的は、イギリスとインドを結ぶ経路を脅かすことだった。
      地中海を渡って上陸し、ピラミッドの戦いでマムルークの軍を破る。
      カイロを占領したが、ネルソン率いるイギリス艦隊にアブキール湾で艦隊を撃滅され、海路を断たれた。
      シリアへ進んだ遠征も失敗し、ナポレオンは軍を残して単身フランスへ戻る。
      残された軍は1801年に降伏した。
      軍事的には失敗である。

      一方、同行した167人の学者の成果は大きかった。
      遺跡、動植物、地理、住民の生活を調査し、その記録は20巻を超える大著としてまとめられる。
      エジプトの古代遺跡がヨーロッパに詳しく紹介され、流行を生んだ。
      最大の発見がロゼッタ・ストーンである。
      同じ内容が三つの文字で刻まれており、ギリシア語を手がかりに象形文字の解読が進んだ。
      1822年、シャンポリオンが解読に成功する。

      エジプト側にも影響があった。
      混乱のなかで台頭したムハンマド・アリーが、近代化を進めることになる。
      この遠征は、中東と西洋の近代的な接触の出発点としても位置づけられる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/Baron_Antoine-Jean_Gros-Battle_Pyramids_1810.jpg/500px-Baron_Antoine-Jean_Gros-Battle_Pyramids_1810.jpg
      credit: アントワーヌ＝ジャン・グロ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Baron_Antoine-Jean_Gros-Battle_Pyramids_1810.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エジプト・シリア戦役

  - id: liberia-founded
    year: 1822
    title: リベリアの建設
    category: society
    tags: [西アフリカ, 奴隷制]
    summary: 解放奴隷の移住地として作られ、1847年にアフリカ初の共和国として独立した。
    detail: |
      アメリカで解放された黒人の移住地として西アフリカに建設された植民地で、1822年に始まった。
      1847年にアフリカで最初の共和国として独立する。

      設立を進めたのはアメリカ植民協会である。
      動機は一様ではなかった。
      奴隷制への反対から自由な社会を作ろうとする立場と、解放された黒人が国内に増えることを避けたいという立場が混在していた。

      最初の移住者は数十人で、熱病と現地の集団との衝突により多くが死亡した。
      以後数十年で、1万数千人が渡っている。
      首都モンロビアの名は、当時のアメリカ大統領にちなむ。
      1847年、独立が宣言された。
      憲法はアメリカのものを手本とし、英語が公用語になる。

      問題は、移住者と現地の住民の関係だった。
      移住者は人口の数パーセントにすぎなかったが、政治と経済を独占する。
      現地の人々には長く参政権が与えられなかった。
      20世紀にはゴムの生産で外国企業が進出し、経済は依存的な構造になる。
      1980年のクーデタで移住者系の支配が終わり、その後は内戦が続いた。
      奴隷制からの解放が、別の支配関係を生むという困難を示した例である。
      国名は自由に由来している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/Flag_of_Liberia.svg/500px-Flag_of_Liberia.svg.png
      credit: Government of Liberia / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Liberia.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/リベリア

  - id: algeria-invasion
    year: 1830
    title: フランスのアルジェリア侵攻
    category: war
    tags: [北アフリカ, フランス]
    summary: 130年に及ぶ支配の始まり。入植者社会が生まれ、独立戦争は苛烈になった。
    detail: |
      フランスがアルジェリアへ侵攻した出来事で、1830年のこと。
      130年にわたる支配の始まりになった。
      入植者の社会が生まれ、独立戦争は苛烈なものになる。

      口実は、フランスの領事が現地の支配者に扇子で打たれたという外交上の事件だった。
      実際には、国内の不満をそらす意図と、地中海の権益への関心があったとされる。
      上陸から3週間でアルジェは陥落した。
      しかし内陸の抵抗は長く続く。
      アブドゥルカーディルが各地の部族をまとめて17年間戦い、フランス軍は焦土作戦で対抗した。

      征服後、アルジェリアは植民地ではなくフランスの一部として扱われた。
      三つの県が置かれ、本国と同じ行政の枠組みが適用される。
      フランス、スペイン、イタリアからの入植者が土地を取得し、100万人規模の社会が形成された。
      現地の人々の大半は、フランス国籍を得られないまま二級の扱いを受ける。
      土地は没収され、伝統的な共同体は解体された。

      1954年から独立戦争が始まる。
      入植者の存在が、フランス側の譲歩を難しくした。
      8年の戦争で数十万が死亡し、拷問と虐殺が双方で行われる。
      1962年に独立が実現し、入植者のほとんどがフランスへ去った。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/Flag_of_Algeria_under_France_%281875%29.svg/500px-Flag_of_Algeria_under_France_%281875%29.svg.png
      credit: Kaiser Torikka / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Algeria_under_France_(1875).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フランス領アルジェリア

  - id: suez-canal
    year: 1869
    title: スエズ運河の開通
    category: economy
    tags: [エジプト, 交通]
    summary: ヨーロッパとアジアの距離が一気に縮み、エジプトは列強の争点になった。
    detail: |
      地中海と紅海を結ぶ運河が開通した出来事で、1869年のこと。
      全長は160キロを超える。
      ヨーロッパとアジアの距離が一気に縮まり、エジプトは列強の争点になった。

      計画はフランスの外交官レセップスが進めた。
      エジプトの総督から開削の権利を得て、会社を設立する。
      工事は10年に及び、当初は強制的に動員された農民が土を掘った。
      批判を受けて機械化が進められる。
      死者は数千から数万とされ、正確な数は分からない。

      開通により、ロンドンとボンベイの航路は40パーセント短縮された。
      帆船に比べて燃料の補給が必要な蒸気船に有利で、海運の構造も変わる。
      エジプトは建設費と関連事業の借款で財政が破綻した。
      1875年、総督は保有していた会社の株式をイギリスに売却する。
      最大の利用者だったイギリスが、運河の実質的な支配者になった。

      1882年、財政を口実にイギリスがエジプトを軍事占領する。
      以後70年にわたり、事実上の保護国とされた。
      運河は二度の大戦で戦略上の要地となり、1956年の国有化は大きな国際危機を招く。
      現在も世界の海上輸送の重要な経路であり、一隻の座礁が世界の物流を滞らせるほどの位置を占めている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/Canal_de_Suez.jpg/500px-Canal_de_Suez.jpg
      credit: 作者不明 / CC BY 2.5
      page: https://commons.wikimedia.org/wiki/File:Canal_de_Suez.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スエズ運河

  - id: zulu-war
    year: 1879
    title: ズールー戦争
    category: war
    tags: [南アフリカ, イギリス]
    summary: 緒戦でイギリス軍を破ったが、近代兵器の前に王国は解体された。
    detail: |
      イギリスとズールー王国が戦った戦争で、1879年のこと。
      緒戦でイギリス軍が大敗し、その後の反攻で王国は解体された。

      南アフリカの植民地を統合しようとするイギリスにとって、独立した軍事国家であるズールー王国は障害だった。
      受け入れがたい要求を突きつけ、拒否を口実に侵攻する。
      開戦直後のイサンドルワナの戦いで、イギリス軍は壊滅した。
      1300人以上が戦死し、近代的な装備を持つヨーロッパの軍が現地の軍に敗れた例として衝撃を与える。
      ズールー側は、短い槍と包囲の戦術で数の優位を生かした。

      同じ日、ロルクズ・ドリフトの拠点では100人余りが数千の攻撃を防いだ。
      この防戦は英雄的な物語として本国で宣伝され、敗北の衝撃を和らげる役割を果たす。
      イギリスは大軍を送り込み、ウルンディの戦いで王国軍を破った。
      国王は捕らえられ、領域は分割されて統治される。
      ズールー側の死者は1万に及ぶとされる。

      結果として、南アフリカにおける独立した軍事勢力は消えた。
      その土地は後に白人の支配下に組み込まれる。
      近代兵器と現地の軍の衝突がどのような結果を生むかを示した戦争として、しばしば取り上げられてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/D%C3%A9fense_de_Rorke%27s_Drift.jpg/500px-D%C3%A9fense_de_Rorke%27s_Drift.jpg
      credit: アルフォンス・ド・ヌヴィル / Public domain
      page: https://commons.wikimedia.org/wiki/File:D%C3%A9fense_de_Rorke%27s_Drift.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ズールー戦争

  - id: berlin-conference
    year: 1884
    title: ベルリン会議（アフリカ分割）
    category: politics
    tags: [アフリカ, 帝国主義]
    summary: ヨーロッパ列強が地図の上で境界を引き、現在の国境線の多くが決まった。
    detail: |
      アフリカの分割について列強が協議した会議で、1884年から翌年にかけてベルリンで開かれた。
      14か国が参加し、アフリカ側の代表はいない。
      地図の上で境界を引く手法が、ここで公認された。

      きっかけは、コンゴ盆地をめぐる争いだった。
      ベルギー国王が私的な会社を通じて支配を進め、ポルトガルとフランスがこれに異議を唱える。
      ビスマルクが調停の場を設けた。
      会議で定められた主要な原則は実効支配である。
      領有を主張するには、実際にその地を統治し、他国に通告しなければならない。
      この規則が、沿岸から内陸への競争を一気に加速させた。

      コンゴ川とニジェール川の自由航行、奴隷貿易の禁止も確認された。
      文明化の使命という言葉が用いられ、支配を正当化する論理として機能する。
      コンゴ盆地はベルギー国王の私領として承認された。
      ここではゴムの採取をめぐる過酷な収奪が行われ、後に国際的な非難を浴びる。

      会議そのものが大陸を分割したわけではない。
      しかし競争の規則を定めたことで、その後20年でほぼ全土が分割された。
      住民の意思が問われることは一度もなかった。
      現在のアフリカの国境の多くは、この時期に机上で引かれた線である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/5/5c/Afrikakonferenz.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Afrikakonferenz.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ベルリン会議_(アフリカ分割)

  - id: adwa
    year: 1896
    title: アドワの戦い
    category: war
    tags: [エチオピア, イタリア]
    summary: アフリカの国がヨーロッパの侵略軍を正面から破った稀な勝利。独立を守った。
    detail: |
      エチオピア軍がイタリア軍を破った戦いで、1896年3月のこと。
      アフリカの国がヨーロッパの侵略軍を正面から撃退した稀な例である。
      これによって独立が守られた。

      イタリアは、条約の解釈を根拠にエチオピアを保護国と主張していた。
      メネリク2世がこれを否定すると、軍を進めて征服を図る。
      エチオピア側は10万を超える兵を集めた。
      各地の諸侯が皇帝のもとに結集したことが、この規模を可能にする。
      近代的な小銃と大砲をヨーロッパから輸入しており、装備の差も小さかった。

      イタリア軍は2万に満たず、地形の把握も不十分だった。
      本国からの圧力で急いで攻撃を仕掛け、四つの縦隊が連携を失う。
      各個に包囲されて壊滅し、数千が戦死、多数が捕虜になった。
      敗報はイタリアで政権の崩壊を招いた。
      講和条約で、エチオピアの完全な独立が承認される。

      この勝利は世界に伝わった。
      アフリカ系の人々や、植民地支配下の各地で希望として語られる。
      エチオピアが独立を保つ国として特別な位置を占めるのは、この戦いの結果である。
      40年後、イタリアは毒ガスまで用いて再び侵攻し、一時占領した。
      それでも3月1日は現在も国民の祝日として記念されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2d/Menelik_-_Adoua-2_%28cropped%29.jpg/500px-Menelik_-_Adoua-2_%28cropped%29.jpg
      credit: "Menelik_-_Adoua.jpg: Le Petit Journal - F. Méaulle, scan by Vob08 derivative work: Zheim (talk) / Public domain"
      page: https://commons.wikimedia.org/wiki/File:Menelik_-_Adoua-2_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アドワの戦い

  - id: boer-war
    year: 1899
    title: 南アフリカ戦争
    category: war
    tags: [南アフリカ, イギリス]
    summary: 金とダイヤをめぐる戦争。強制収容所が用いられ、帝国主義の評判を傷つけた。
    detail: |
      イギリスとボーア人の共和国が戦った戦争で、1899年から1902年まで続いた。
      南アフリカの金とダイヤモンドをめぐる争いである。
      強制収容所が用いられ、帝国主義への批判を招いた。

      ボーア人は、オランダ系の入植者の子孫である。
      イギリスの支配を逃れて内陸へ移動し、トランスヴァールとオレンジ自由国を建てていた。
      その地で世界最大級の金鉱が見つかる。
      多数の外国人が流入し、その権利をめぐって対立が深まった。

      開戦当初、ボーア側が優勢だった。
      地形に通じ、馬と銃を扱う技能に長けた農民の部隊が、正規軍を包囲する。
      イギリスは45万の兵を投入して主要都市を占領した。
      しかしボーア側はゲリラ戦に転じ、鉄道と補給を襲い続ける。

      イギリスは焦土作戦で対抗した。
      農場を焼き、家畜を殺し、女性と子どもを収容所に集める。
      衛生と食糧が劣悪で、2万を超える人が病死した。
      アフリカ系の人々も別の収容所に入れられ、多数が死亡している。
      この実態が本国で報じられ、戦争への批判が高まった。
      1902年に講和が成立し、両共和国はイギリス領になる。
      1910年、南アフリカ連邦が成立するが、人種による差別の構造はそのまま残された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fe/South_Africa_late19thC_map.png/500px-South_Africa_late19thC_map.png
      credit: Self / CC BY-SA 2.5
      page: https://commons.wikimedia.org/wiki/File:South_Africa_late19thC_map.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ボーア戦争

  - id: italy-invades-ethiopia
    year: 1935
    title: イタリアのエチオピア侵攻
    category: war
    tags: [エチオピア, ファシズム]
    summary: 国際連盟が止められなかったことが、その無力さを世界に示した。
    detail: |
      イタリアがエチオピアに侵攻した出来事で、1935年のこと。
      国際連盟がこれを止められなかったことが、その無力さを世界に示した。

      ムッソリーニは、40年前のアドワでの敗北の雪辱と、帝国の建設を掲げた。
      国境の小競り合いを口実に、大軍を投入する。
      戦力の差は大きかった。
      航空機による爆撃、戦車、そして国際条約で禁じられていた毒ガスが用いられる。
      市街と病院も攻撃され、赤十字の施設も例外ではなかった。

      エチオピアは国際連盟に提訴した。
      連盟はイタリアを侵略国と認定し、経済制裁を決議する。
      しかし石油は対象から外され、スエズ運河の通航も止められなかった。
      イギリスとフランスは、イタリアをドイツから引き離すことを優先していた。

      1936年、首都が占領され、皇帝は亡命する。
      ジュネーヴの連盟の総会で行った演説は、集団安全保障が働かなければ同じ運命が他国を待つと警告するものだった。
      この出来事は、国際連盟の権威を決定的に損なった。
      侵略に有効な対応ができないことが明らかになり、その後のドイツと日本の行動を抑える力も失われる。
      イタリアの支配は5年で終わった。
      第二次世界大戦中にイギリス軍と現地の抵抗勢力によって解放される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/Soldatietiopia.jpg/500px-Soldatietiopia.jpg
      credit: Vestri Family, photographers in Montevarchi for 3 generations / Public domain
      page: https://commons.wikimedia.org/wiki/File:Soldatietiopia.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第二次エチオピア戦争

  - id: egypt-revolution-1952
    year: 1952
    title: エジプト革命
    category: politics
    tags: [エジプト, 独立]
    summary: 王政が倒れナセルが台頭。アラブ民族主義の中心になった。
    detail: |
      エジプトで軍の将校団が王政を倒した出来事で、1952年のこと。
      自由将校団によるクーデタであり、流血はほとんどなかった。
      ナセルが台頭し、アラブ民族主義の中心になっていく。

      背景には複数の不満がある。
      1948年の戦争でイスラエルに敗れたこと、イギリス軍が駐留を続けていること、王室と大地主に富が集中していることである。
      7月23日、将校団が主要な施設を制圧した。
      国王ファルークは退位して国外へ去り、翌年に共和制が宣言される。

      最初の大統領は名目的な存在で、実権はナセルらが握った。
      数年のうちにナセルが指導者の地位を固める。
      改革の柱は土地であった。
      個人の所有できる面積に上限を設け、超える分を小作人に分配する。
      大地主の政治的な力が失われた。

      外国資本の企業は国有化され、教育と医療が拡充される。
      1954年にはイギリス軍の撤退が合意された。
      1956年のスエズ運河の国有化とそれに続く危機で、ナセルはアラブ世界の英雄になる。
      この革命は、各国の軍人が主導する政権の先例になった。
      シリア、イラク、リビアなどで似た経路の政変が続く。
      軍が近代化の担い手になるという図式が、中東と北アフリカに広がった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エジプト革命

  - id: suez-crisis
    year: 1956
    title: スエズ危機
    category: politics
    tags: [エジプト, 冷戦]
    summary: 運河の国有化に英仏イスラエルが軍事介入したが米ソの圧力で撤退。帝国の時代の終わりを示した。
    detail: |
      エジプトによるスエズ運河の国有化に、イギリス、フランス、イスラエルが軍事介入した出来事で、1956年のこと。
      米ソの圧力で撤退を強いられ、帝国の時代の終わりを示した。

      ナセルは、アスワン・ハイ・ダムへの資金援助が撤回されたことへの対抗として、運河会社の国有化を宣言した。
      運河の通航料を建設の資金に充てるという主張である。
      イギリスとフランスは、重要な航路と自国の利権を失うことを恐れた。
      イスラエルと秘密裏に計画を立て、イスラエルが先に侵攻し、両国が調停者として介入するという筋書きを作る。

      軍事作戦は進んだが、国際的な反発は大きかった。
      アメリカは、事前に知らされていなかったことに憤り、ポンドの売りを黙認して経済的な圧力をかける。
      ソ連は核兵器の使用を示唆して威嚇した。
      国連の総会が撤退を求め、三国は目的を達しないまま引き上げる。
      国連の緊急軍が初めて派遣された。

      結果として、ナセルの威信は高まった。
      イギリスとフランスが独自に大国として振る舞える時代が終わったことが、明確になる。
      イギリスの首相は辞任し、フランスはヨーロッパ統合と核開発へ傾いた。
      中東での影響力は、以後アメリカとソ連が握ることになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d0/Port_Said_from_air.jpg/500px-Port_Said_from_air.jpg
      credit: Fleet Air Arm official photographer / Public domain
      page: https://commons.wikimedia.org/wiki/File:Port_Said_from_air.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第二次中東戦争

  - id: ghana-independence
    year: 1957
    title: ガーナの独立
    category: politics
    tags: [西アフリカ, 独立]
    summary: サハラ以南で最初の独立。各地の独立運動を勇気づけた。
    detail: |
      ガーナがイギリスから独立した出来事で、1957年のこと。
      サハラ以南のアフリカで最初の独立である。
      各地の運動を勇気づけた。

      この地域は、金とカカオの産地としてゴールドコーストと呼ばれていた。
      第二次世界大戦後、従軍して帰った兵士や都市の労働者のあいだで、政治参加を求める声が高まる。
      ンクルマが率いる政党は、ストライキとボイコットによる非暴力の行動を組織した。
      植民地政府は彼を投獄したが、憲法の改正で行われた選挙で政党が圧勝する。
      釈放されて自治政府の首班となり、段階的に権限が移された。

      1957年3月6日、独立が宣言された。
      国名は、かつて西アフリカに栄えた古代の王国に由来する。
      植民地時代の呼称を捨て、アフリカの歴史とつながる名を選んだことに意味がある。

      独立式典には各地の運動家が集まった。
      武力ではなく政治的な組織と交渉で独立を実現した例として、注目される。
      この後、独立の動きは急速に広がった。
      1960年には17か国が独立し、アフリカの年と呼ばれる。
      一方、ガーナ自身は経済の困難と政治の不安定に直面した。
      独立の達成と、その後の国づくりの難しさが、早い段階で現れた国でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Flag_of_Ghana.svg/500px-Flag_of_Ghana.svg.png
      credit: Theodosia Okoh / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Ghana.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ガーナ

  - id: year-of-africa
    year: 1960
    title: アフリカの年
    category: politics
    tags: [アフリカ, 独立]
    summary: 1年で17か国が独立し、脱植民地化が一気に進んだ。
    detail: |
      1960年にアフリカで17の国が独立した出来事で、アフリカの年と呼ばれる。
      脱植民地化が一気に進んだ。

      背景には複数の要因がある。
      第二次世界大戦で宗主国が疲弊したこと。
      国連憲章が民族自決を掲げたこと。
      米ソがともに植民地支配に批判的だったこと。
      そしてアジア諸国の独立と、ガーナの成功が刺激になったことである。

      1960年に独立した国のうち、13はフランスの旧植民地だった。
      ド・ゴールは、植民地を維持する費用と国際的な批判を考慮し、共同体の枠内での独立を認める方針をとる。
      アルジェリアでの戦争が泥沼化していたことも、判断に影響した。
      ナイジェリア、ソマリア、コンゴも同じ年に独立している。

      新しい国家は、植民地時代の国境をそのまま受け継いだ。
      民族や言語の分布と一致しない線であり、内部の統合が課題になる。
      行政と教育を担う人材も不足していた。
      コンゴでは独立の直後に混乱が起き、内戦と外国の介入を招く。
      国連の加盟国は一気に増え、その構成が変わった。
      南北の格差や資源の主権をめぐる議論が、国際政治の主要な論点になる。
      地図上の帝国が、数年のうちに消えた転換点だった。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/d/dc/Kwame_Nkrumah_%28JFKWHP-AR6409-A%29.jpg
      credit: Abbie Rowe / Public domain
      page: https://commons.wikimedia.org/wiki/File:Kwame_Nkrumah_(JFKWHP-AR6409-A).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アフリカの年

  - id: oau-founded
    year: 1963
    title: アフリカ統一機構の結成
    category: politics
    tags: [アフリカ, 地域統合]
    summary: 植民地時代の国境を認めたうえで連帯をめざす選択をした。
    detail: |
      アフリカ統一機構が結成された出来事で、1963年にアディスアベバで発足した。
      独立した32か国が参加している。
      植民地時代の国境を認めたうえで、連帯をめざす選択をした。

      構想には二つの立場があった。
      ンクルマらは、政治的な統合による合衆国の形成を主張する。
      一方、多くの新興国は主権を手放すことに慎重で、緩やかな協力を望んだ。
      後者が採られる。

      憲章の柱は、国家の主権の尊重、内政への不干渉、そして国境の現状維持である。
      植民地時代に引かれた線は民族の分布と一致しないが、これを引き直せば大陸中で紛争が起きる。
      そのため、あえて現状を認める決定がなされた。
      残る植民地の解放と、南アフリカの人種隔離政策への反対が、共通の目標になる。
      解放運動への支援も行われた。

      一方、内政不干渉の原則は弱点にもなった。
      独裁や大量の人権侵害が起きても、機構として介入できない。
      独裁者たちのクラブという批判を受けることになる。
      2002年、アフリカ連合に発展的に改組された。
      重大な事態には介入できる仕組みが加えられ、経済統合も目標に掲げられている。
      大陸規模の協力の枠組みとして、その出発点がこの機構だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Flag_of_the_African_Union.svg/500px-Flag_of_the_African_Union.svg.png
      credit: アフリカ連合 - アフリカ諸国の大陸連合 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_African_Union.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アフリカ連合

  - id: biafra-war
    year: 1967
    title: ビアフラ戦争
    category: war
    tags: [ナイジェリア, 内戦]
    summary: 人工的な国境が抱える矛盾が噴き出し、飢餓の映像が世界を動かした。
    detail: |
      ナイジェリアで起きた内戦で、1967年から1970年まで続いた。
      東部州が分離独立を宣言し、政府軍との戦いになった。
      飢餓の映像が世界を動かし、国際的な人道支援のあり方を変えた。

      ナイジェリアは、イギリスが異なる民族の地域を一つにまとめて作った国である。
      北のハウサ・フラニ、西のヨルバ、東のイボが主要な集団で、宗教も社会の構造も異なる。
      独立後、権力をめぐる対立が深まった。
      1966年のクーデタと反クーデタの後、北部で数万のイボ系住民が殺害される。
      身の危険を感じた人々が東部へ逃れ、翌年に分離独立が宣言された。
      東部には油田があり、政府にとって手放せない地域だった。

      政府軍は封鎖を行い、食糧と医薬品の流入を断った。
      包囲されたビアフラでは深刻な飢餓が起き、栄養失調の子どもの姿が世界中に報じられる。
      餓死者は100万を超えるとされる。
      この報道が、国際的な援助の運動を生んだ。
      国境なき医師団は、この経験に加わった医師たちによって設立される。

      1970年、ビアフラは降伏した。
      政府は報復を避ける方針をとったが、対立の記憶は残る。
      植民地時代の国境が抱える矛盾が、最も悲惨な形で噴き出した事例である。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ビアフラ戦争

  - id: ethiopian-famine
    year: 1984
    title: エチオピア飢饉
    category: disaster
    tags: [エチオピア, 飢饉]
    summary: 干ばつと内戦が重なり100万人規模が犠牲に。国際的な支援運動の転機になった。
    detail: |
      エチオピアで起きた大規模な飢饉で、1984年前後に最も深刻だった。
      死者は100万人規模と推定される。
      国際的な支援運動の転機になった。

      直接の原因は、数年続いた干ばつである。
      しかし被害を大きくしたのは、政治と戦争だった。
      当時の軍事政権は、北部のティグレとエリトリアで反政府勢力と戦っていた。
      食糧の輸送は遮断され、援助物資が反乱地域に届かないよう妨げられる。
      農業政策も生産を圧迫し、農民から穀物を強制的に買い上げていた。
      政府は飢饉の存在を隠し、同じ時期に革命10周年の式典に巨費を投じている。

      1984年、イギリスの放送局が現地の映像を報じた。
      痩せ細った人々が集まる避難所の姿が世界中に流れ、強い反響を呼ぶ。
      ミュージシャンによる募金の曲が作られ、翌年にはロンドンとフィラデルフィアで同時開催の大規模な公演が行われた。
      数億ドルが集まり、市民が直接参加する支援の形が広がる。

      一方、援助が政府の統制下で配られ、強制的な住民の移住に利用された面も指摘された。
      人道支援が政治から切り離せないという問題が、この経験を通じて認識される。
      飢饉が自然現象だけで起きるのではないという理解も広まった。

  - id: rwandan-genocide
    year: 1994
    title: ルワンダ虐殺
    category: society
    tags: [アフリカ, 人権]
    summary: 100日で80万人前後が殺され、国際社会の不作為が厳しく問われた。
    detail: |
      ルワンダで起きた大量虐殺で、1994年4月から約100日間続いた。
      ツチ系の住民と穏健なフツ系の人々が標的になり、80万人前後が殺害された。
      国際社会の不作為が厳しく問われた出来事である。

      民族の区分は、植民地時代に固定された面が大きい。
      ベルギーは身分証明書に民族を記載させ、少数のツチを行政に登用して統治した。
      この構造が独立後の対立の素地になる。
      1990年から内戦が続き、和平合意が結ばれていた。
      一方で、過激派はラジオを通じてツチを敵として描く宣伝を続け、民兵を組織し、大量の刀を輸入していた。

      4月6日、大統領の乗る航空機が撃墜された。
      その直後から、名簿にもとづく組織的な殺害が始まる。
      軍と民兵が主導し、隣人や同僚が加害者になる場合も多かった。
      教会や学校に避難した人々も、まとめて殺された。

      国連の平和維持部隊は現地にいたが、権限がなく、兵員も削減された。
      各国は介入をためらい、虐殺という言葉を使うことすら避けている。
      7月、ツチ系の武装組織が全土を制圧して終結した。
      その後、村ごとの裁判を含む処罰と和解の試みが行われている。
      国際社会が何をしなかったかを問う事例として、以後の議論の基準になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/Nyamata_Memorial_Site_13.jpg/500px-Nyamata_Memorial_Site_13.jpg
      credit: Fanny Schertzer / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Nyamata_Memorial_Site_13.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ルワンダ虐殺

  - id: end-of-apartheid
    year: 1994
    title: 南アフリカでアパルトヘイト撤廃
    category: society
    tags: [アフリカ, 人権]
    summary: 全人種参加の選挙でマンデラが大統領に選ばれ、人種隔離体制が終わった。
    detail: |
      南アフリカで人種隔離体制が終わり、全人種が参加する選挙が行われた出来事で、1994年のこと。
      マンデラが大統領に選ばれた。
      46年続いた法による分離が廃止される。

      体制が行き詰まった理由は複数ある。
      国内では抗議とストライキが恒常化し、治安の維持に巨額の費用がかかっていた。
      国際的には経済制裁とスポーツからの排除が続き、投資も引き揚げられる。
      冷戦の終結で、共産主義への防波堤という口実も失われた。

      1990年、デクラーク大統領がマンデラを釈放し、組織の非合法化を解いた。
      翌年から関連する法が次々に廃止される。
      移行の交渉は難航した。
      各地で暴力が続き、白人の右派も黒人勢力の一部も合意に反対する。
      4年にわたる協議の末、暫定憲法がまとまった。

      1994年4月、初めて全人種が参加する選挙が行われる。
      投票所には長い行列ができ、数時間待って投票する人々の姿が報じられた。
      アフリカ民族会議が過半数を得て、マンデラが大統領に就任する。
      新しい憲法は、世界でも先進的な人権の規定を持つ。
      虹の国という言葉で、多様性を前提とする国家が掲げられた。
      一方、経済的な格差は制度の撤廃だけでは解消されず、現在まで課題として残っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/DurbanSign1989.jpg/500px-DurbanSign1989.jpg
      credit: Guinnog / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:DurbanSign1989.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アパルトヘイト

  - id: south-sudan
    year: 2011
    title: 南スーダンの独立
    category: politics
    tags: [アフリカ, 現代]
    summary: 半世紀の内戦を経て分離独立したが、まもなく内戦に陥った。
    detail: |
      スーダンの南部が分離独立した出来事で、2011年7月のこと。
      半世紀に及ぶ内戦の末の分離である。
      世界で最も新しい国の一つになった。

      スーダンは、北部のアラブ系ムスリムと、南部のアフリカ系でキリスト教や伝統宗教を信仰する人々を、一つの国としてまとめた形で独立した。
      南部は、独立前から北部主導の統治に反発していた。
      二度の内戦が戦われ、合わせて200万人以上が死亡する。
      イスラム法の全土への適用と、南部で見つかった石油の配分が、対立を深めた。

      2005年、包括的な和平合意が成立した。
      6年の暫定期間の後、南部の帰属を住民投票で決めることが定められる。
      2011年1月の投票では、98パーセントを超える票が分離を支持した。
      7月9日に独立が宣言され、国連にも加盟する。
      しかし独立は安定をもたらさなかった。
      石油は南部にあるが、輸出のパイプラインは北を通る。
      国境と収入の配分をめぐる対立が続いた。

      2013年、大統領と副大統領の対立が民族間の戦闘に発展する。
      数十万が死亡し、数百万が避難民になった。
      和平合意と再発を繰り返している。
      分離が紛争の解決にならない場合があることを示す、近年の代表的な事例である。
