  - id: marcus-aurelius
    title: マルクス・アウレリウス
    start: 161
    end: 180
    category: religion
    tags: [ローマ, 哲学]
    summary: 『自省録』を戦陣で書いた哲人皇帝で、その死が五賢帝時代の終わりになった。
    detail: |
      ローマ帝国の第16代皇帝で、在位は161年から180年まで。
      五賢帝の最後にあたる。
      ストア派の哲学者として『自省録』を残した。

      養子として帝位を継ぎ、当初は義兄弟と共同で統治した。
      穏やかで学問を好む性格だったが、治世は困難の連続になる。
      東方ではパルティアとの戦争が起き、帰還した兵が疫病を持ち帰った。
      この流行は十数年続き、帝国の人口を大きく減らしたとされる。
      北方ではゲルマン諸族がドナウ川を越えて侵入し、イタリア北部まで達した。
      皇帝は生涯の多くを戦場で過ごすことになる。

      財政が逼迫すると、自らの宝物を競売にかけて戦費に充てた。
      増税を避けようとした姿勢が伝えられている。
      『自省録』は、その陣中で自分に向けて書かれた覚え書きである。
      ギリシア語で記され、公刊を意図していない。
      自分の力の及ぶことと及ばないことを区別し、与えられた役割を果たせという教えが繰り返される。
      最高権力者が自らを律するために書いた文章として、他に例のない記録である。

      180年、遠征の陣中で没した。
      後継に実子コンモドゥスを指名したことで、能力による後継指名の慣行は途切れる。
      この死をもってパクス・ロマーナは終わり、帝国は動揺の時代に入った。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Marcus_Aurelius_Glyptothek_Munich.jpg/500px-Marcus_Aurelius_Glyptothek_Munich.jpg
      credit: 作者不明 / Public domain
