lane: mediterranean

# ギリシア・ローマ・ビザンツ・イタリア諸国の指導者と、ローマ教皇。
leaders:
  - id: pericles
    title: ペリクレス
    start: -461
    end: -429
    category: politics
    tags: [アテネ, 民主政]
    summary: 民会中心の民主政を完成させ、パルテノン建設でアテネを「ギリシアの学校」にした。
    detail: |
      アテネの政治家で、紀元前461年ごろから429年まで指導的な地位にあった。
      民会中心の民主政を完成させ、都市を文化の中心に育てた。
      その時代はペリクレス時代と呼ばれる。

      名門の家に生まれながら、民衆の側に立つ政策を進めた。
      毎年の選挙で将軍に選ばれ続けることで、長期にわたり政治を主導する。
      民主政の徹底が最大の事業だった。
      公職に就く者に手当を支給し、貧しい市民も参加できるようにする。
      陪審員にも日当が出され、裁判は市民の手で行われた。
      重要な決定はすべて民会で議論され、多数決で定められる。

      一方で、市民権の要件は厳しくした。
      両親ともにアテネ市民である者に限るとし、特権の範囲を絞っている。
      対外的には、デロス同盟の資金をアテネの事業に流用した。
      その財源でアクロポリスの再建が進み、パルテノン神殿が完成する。
      悲劇と喜劇が上演され、哲学者や歴史家が集まった。
      アテネをギリシアの学校と呼んだ演説が伝えられている。

      スパルタとの対立は避けられず、紀元前431年にペロポネソス戦争が始まった。
      籠城の戦略をとったが、城内に人が密集したことで疫病が広がる。
      ペリクレス自身も紀元前429年にこの疫病で没した。
      以後のアテネは指導者を欠き、戦争は泥沼化していく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/Pericles_Pio-Clementino_Inv269_n2.jpg/500px-Pericles_Pio-Clementino_Inv269_n2.jpg
