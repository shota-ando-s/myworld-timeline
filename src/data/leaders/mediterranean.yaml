  - id: julius-caesar
    title: カエサル
    start: -49
    end: -44
    category: politics
    tags: [ローマ, 共和政の終わり]
    summary: ガリア征服と内戦の勝利で共和政を実質的に終わらせ、暗殺されて帝政への道を開いた。
    detail: |
      共和政ローマ末期の政治家・軍人で、紀元前100年に生まれ44年に暗殺された。
      ガリアを征服し、内戦に勝って終身独裁官となる。
      共和政を実質的に終わらせ、帝政への道を開いた。

      名門の家に生まれたが、当初は主流から外れた立場にあった。
      ポンペイウスとクラッススと私的な同盟を結び、執政官の地位を得る。
      紀元前58年からガリアへ遠征した。
      8年をかけて現在のフランスとベルギーにあたる地域を征服し、ブリタニアへも渡る。
      自ら書いた『ガリア戦記』は、簡潔な文体の模範として今も読まれる。
      遠征で得た富と、忠誠を誓う軍団が、その後の政治的な力になった。

      元老院との対立が決定的になると、紀元前49年に軍を率いてルビコン川を渡った。
      内戦でポンペイウスを破り、エジプトではクレオパトラを王位に就ける。
      各地の反対派を制圧し、終身の独裁官となった。
      改革は多方面に及んだ。
      属州の統治を整理し、市民権を広げ、暦を太陽の運行に合わせて改める。
      このユリウス暦は、修正を経て現在の暦につながっている。

      王になろうとしていると疑われ、紀元前44年3月15日に元老院で刺殺された。
      共和政は戻らず、内戦の末に養子のオクタウィアヌスが帝政を開く。
      カエサルの名は、皇帝を意味する称号として各国の言語に残った。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Julius_Caesar_Coustou_Louvre_MR1798.jpg/500px-Julius_Caesar_Coustou_Louvre_MR1798.jpg
      credit: ニコラ・クストゥー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Julius_Caesar_Coustou_Louvre_MR1798.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ガイウス・ユリウス・カエサル

  - id: augustus
    title: アウグストゥス
    start: -27
    end: 14
    category: politics
    tags: [ローマ, 帝政]
    summary: 共和政の看板を残したまま一人が実権を握る仕組みを作り、200年の平和を始めた。
    detail: |
      ローマ帝国の初代皇帝で、紀元前27年から14年まで統治した。
      カエサルの養子として権力を継ぎ、内戦を終わらせた。
      共和政の看板を残したまま一人が実権を握る仕組みを作った人物である。

      18歳でカエサルの暗殺に遭い、その遺言で養子と相続人に指定された。
      アントニウスらと手を結んで暗殺者を討ち、その後は互いに争う。
      紀元前31年のアクティウムの海戦で勝ち、唯一の支配者となった。
      紀元前27年、彼は全権を元老院と市民に返すと宣言した。
      そのうえで諸属州の統治と軍の指揮を委ねられ、尊厳者を意味するアウグストゥスの称号を受ける。
      王や独裁官ではなく、第一の市民として振る舞った。
      形式は共和政のまま、実質は一人の支配という体制が生まれる。

      統治の実績は多い。
      常備軍と近衛隊を整え、国境を定め、属州の徴税を整理した。
      消防と警察の組織を作り、道路と水道を整備する。
      ローマをれんがの都市から大理石の都市に変えたと自ら誇った。

      家族の問題には苦しんだ。
      後継者と定めた者が相次いで死に、最終的に義理の息子ティベリウスが継ぐ。
      40年以上にわたる統治のあいだに、帝政の仕組みは既成事実として定着した。
      8月を意味する語は、この皇帝の名に由来する。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Statue-Augustus.jpg/500px-Statue-Augustus.jpg
      credit: Till Niermann / Public domain
      page: https://commons.wikimedia.org/wiki/File:Statue-Augustus.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アウグストゥス

  - id: nero
    title: ネロ
    start: 54
    end: 68
    category: politics
    tags: [ローマ, 迫害]
    summary: ローマ大火の責任をキリスト教徒に負わせ、暴君像の原型として語り継がれた。
    detail: |
      ローマ帝国の第5代皇帝で、在位は54年から68年まで。
      16歳で即位し、30歳で自害した。
      暴君像の原型として語り継がれてきた人物である。

      母の策謀によって帝位に就き、当初は哲学者セネカらの補佐で穏健な統治が行われた。
      減税を進め、裁判を公正にし、剣闘士競技での殺害を制限したとされる。
      やがて自ら政治を握ると、行動は極端になった。
      母と妻を殺し、元老院議員の粛清を繰り返す。
      自身は詩と竪琴と戦車競走に熱中し、ギリシアの競技祭に出場して賞を得た。
      皇帝が公衆の前で芸を披露することは、当時の上流層には恥とされた。

      64年のローマ大火の後、その責任をキリスト教徒に負わせて処刑した。
      これがキリスト教に対する最初の組織的な迫害になる。
      焼け跡に自らの巨大な宮殿を造営したことも、放火を疑われる理由になった。
      68年、属州の反乱と近衛兵の離反により、元老院から国家の敵と宣告される。
      逃亡の途中で自害し、ユリウス・クラウディウス朝は断絶した。

      記録の多くは元老院の立場から書かれており、誇張を含むとみられる。
      属州や民衆のあいだには人気があったという指摘もある。
      それでも、権力が個人の欲望と結びついたときに何が起きるかを示す例として、この名は使われ続けてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Nero_Glyptothek_Munich_321.jpg/500px-Nero_Glyptothek_Munich_321.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Nero_Glyptothek_Munich_321.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ネロ

  - id: trajan
    title: トラヤヌス
    start: 98
    end: 117
    category: war
    tags: [ローマ, 最大版図]
    summary: ダキアとメソポタミアを加えてローマ帝国の版図を最大にした。
    detail: |
      ローマ帝国の第13代皇帝で、在位は98年から117年まで。
      属州のヒスパニア出身で、イタリア以外から出た最初の皇帝である。
      帝国の版図を最大に広げた。

      軍人として経歴を重ね、先代の養子に迎えられて帝位を継いだ。
      血縁ではなく能力で後継者を選ぶ方式が、この時期の安定を支えている。
      最大の事業は対外遠征だった。
      二度にわたるダキア戦争で、現在のルーマニアにあたる地域を征服する。
      そこから得た金の産出が、帝国の財政を潤した。
      戦いの経過は、ローマに立つ記念柱の螺旋状の浮彫に詳しく刻まれている。

      続いてパルティアへ遠征し、アルメニアとメソポタミアを属州とした。
      117年、ペルシア湾まで到達して版図は最大に達する。
      しかし占領地では反乱が相次ぎ、維持は難しかった。

      内政でも評価が高い。
      貧しい家庭の子どもを援助する制度を設け、道路・橋・水道・港を整備した。
      元老院を尊重し、密告による裁判を抑えたことも称えられる。
      小プリニウスとの往復書簡には、属州統治の細部をめぐる実務的なやり取りが残る。
      遠征からの帰路に病没し、後継のハドリアヌスは新たな属州の一部を放棄して防衛線を縮めた。
      後世の皇帝は、トラヤヌスより幸運であれ、という言葉で祝福された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Traianus_Glyptothek_Munich_72.jpg/500px-Traianus_Glyptothek_Munich_72.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Traianus_Glyptothek_Munich_72.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/トラヤヌス

  - id: hadrian
    title: ハドリアヌス
    start: 117
    end: 138
    category: politics
    tags: [ローマ, 国境]
    summary: 拡大をやめて国境を固める方針に転じ、ブリタニアに長城を築いた。
    detail: |
      ローマ帝国の第14代皇帝で、在位は117年から138年まで。
      拡大をやめて国境を固める方針に転じた。
      ブリタニアの長城で知られる。

      先代のトラヤヌスと同じくヒスパニアの出身で、その親族にあたる。
      即位するとすぐ、メソポタミアの新属州を放棄した。
      維持の負担が利益に見合わないという判断である。
      方針は、拡大から防衛と整備へ移った。
      在位の半分以上を各地の巡幸に費やし、属州の実情を自ら確認する。
      軍の訓練を厳格にし、駐屯地の規律を整えた。

      ブリタニア北部では、118キロに及ぶ石と土の壁を築いた。
      現在も遺構が残り、世界遺産になっている。
      ゲルマニアでも柵と堡塁で境界を明示した。
      国境を線として画定するという発想が、ここで明確になる。

      文化への関心も深い。
      ギリシアを愛し、アテネの建設事業を支援した。
      ローマではパンテオンを再建し、ティヴォリに広大な別荘を造営している。
      建築の趣味が高じて、専門家と衝突した逸話も伝わる。
      ユダヤでは、エルサレムをローマ風の都市に改造しようとしてバル・コクバの反乱を招いた。
      鎮圧は苛烈で、多数のユダヤ人が土地を追われている。
      後継には養子を重ねて指名し、次代のアントニヌス・ピウスへ安定を引き継いだ。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d7/Bust_Hadrian_Musei_Capitolini_MC817.jpg/500px-Bust_Hadrian_Musei_Capitolini_MC817.jpg
      credit: Marie-Lan Nguyen / Public domain
      page: https://commons.wikimedia.org/wiki/File:Bust_Hadrian_Musei_Capitolini_MC817.jpg
    links:
