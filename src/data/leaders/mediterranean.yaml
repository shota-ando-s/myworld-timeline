  - id: diocletian
    title: ディオクレティアヌス
    start: 284
    end: 305
    category: politics
    tags: [ローマ, 分割統治]
    summary: 帝国を四分して統治する仕組みを作り、混乱を収めると同時に東西分裂の下地も作った。
    detail: |
      ローマ帝国の皇帝で、在位は284年から305年まで。
      3世紀の危機を収拾し、統治の仕組みを根本から作り変えた。
      帝国を四人で分けて治める体制を作った人物である。

      低い身分の出身で、軍の階梯を上って帝位に就いた。
      広すぎる帝国を一人で守ることは不可能だと判断する。
      まず東西に正帝を置き、それぞれに副帝を付けて四人で統治する体制を作った。
      各自が担当地域の防衛と行政にあたり、緊急時に対応できるようにする。
      副帝は正帝の後継者と位置づけられ、継承の安定も図られた。

      行政では、属州の数を倍以上に増やして知事の権限を細分化した。
      軍と民政を分け、それぞれ別の系統で指揮させる。
      税制を人と土地の単位で整理し直し、物納も取り入れた。
      物価の上昇に対しては、最高価格を定める勅令を出したが効果は乏しかった。
      皇帝の位置づけも変えた。
      第一の市民ではなく、神に近い絶対の君主として振る舞い、宮廷の儀礼を東方風に整える。
      拝謁には跪拝が求められた。

      キリスト教徒への大規模な迫害を行ったことでも知られる。
      305年、自ら退位して隠退した。
      皇帝が生前に位を譲った珍しい例である。
      四分統治はその後まもなく内戦に陥ったが、行政改革の多くは帝国の終わりまで引き継がれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Diocletien_Vaux1.jpg/500px-Diocletien_Vaux1.jpg
      credit: Jebulon / Public domain
      page: https://commons.wikimedia.org/wiki/File:Diocletien_Vaux1.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ディオクレティアヌス

  - id: constantine-the-great
    title: コンスタンティヌス1世
    start: 306
    end: 337
    category: religion
    tags: [ローマ, キリスト教]
    summary: キリスト教を公認し新都を東に築いて、帝国の宗教と重心を同時に移した。
    detail: |
      ローマ帝国の皇帝で、在位は306年から337年まで。
      キリスト教を公認し、東方に新しい都を築いた。
      帝国の宗教と重心を同時に移した人物である。

      四分統治が崩れた後の内戦を勝ち抜いて権力を得た。
      312年のミルウィウス橋の戦いの前に、天に十字の印を見たと伝えられる。
      この勝利の後、キリスト教への姿勢を明確に転じた。
      313年、共同統治者とともに信教の自由を認める方針を示した。
      没収された教会の財産が返還され、聖職者は公的な負担を免除される。
      迫害を受けてきた宗教が、皇帝の保護を受ける立場に変わった。

      325年にはニケーアで公会議を招集した。
      キリストの神性をめぐる論争に決着をつけ、信仰の基準となる信条がまとめられる。
      皇帝が教義の問題に関与する形は、以後の東方の伝統になった。
      330年、ボスポラス海峡に面したビザンティウムを拡張して新しい都とした。
      コンスタンティノープルと名づけられ、1000年以上にわたって存続する。
      経済と人口の重心はすでに東にあり、防衛上もこの位置が有利だった。

      行政と軍の改革も進め、金貨を安定させて経済を立て直した。
      洗礼を受けたのは死の直前とされる。
      ローマ帝国がキリスト教国家へ向かう決定的な転換は、この治世に起きている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/Statua_di_Costantino_ai_musei_capitolini.jpg/500px-Statua_di_Costantino_ai_musei_capitolini.jpg
      credit: Merulana / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Statua_di_Costantino_ai_musei_capitolini.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/コンスタンティヌス1世

  - id: theodosius-i
    title: テオドシウス1世
    start: 379
    end: 395
    category: religion
    tags: [ローマ, 国教]
    summary: キリスト教を国教とし、死に際して帝国を東西に分けた最後の統一皇帝。
    detail: |
      ローマ帝国の皇帝で、在位は379年から395年まで。
      キリスト教を国教と定め、死に際して帝国を東西に分けた。
      全土を統治した最後の皇帝である。

      ゴート族との戦いで前任の皇帝が戦死した直後に即位した。
      軍事力で圧倒できないと判断し、ゴート人を帝国内に定住させて兵として用いる道を選ぶ。
      この決定は、後の民族移動の前例になった。
      宗教面では、決定的な措置を重ねた。
      380年にニケーア派の信仰を正統と定め、392年には異教の祭祀を全面的に禁じる。
      神殿は閉鎖され、オリンピアの祭典も終わった。
      国家が唯一の正しい信仰を定めるという体制が、ここで確立する。

      教会との関係では、有名な事件がある。
      テッサロニキでの暴動に対する報復として市民を虐殺した後、ミラノの司教アンブロシウスから破門を宣告された。
      皇帝は公の場で悔悛を示して許される。
      世俗の権力が宗教的権威の前に頭を下げた例として、後世に繰り返し引かれた。

      395年の死に際し、帝国を二人の息子に分けて委ねた。
      分割統治は以前にもあったが、この後は二度と一つに戻らない。
      西は80年で滅び、東は1000年続くことになる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/f/f7/Bust_of_Theodosius_I.jpg
      credit: www.livius.org / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Bust_of_Theodosius_I.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/テオドシウス1世

  - id: justinian-i
    title: ユスティニアヌス1世
    start: 527
    end: 565
    category: society
    tags: [ビザンツ, 法典]
    summary: ローマ法を集大成し地中海の再統一を試みた、東ローマ帝国の絶頂。
    detail: |
      東ローマ帝国の皇帝で、在位は527年から565年まで。
      ローマ法を集大成し、地中海の再統一を試みた。
      帝国の絶頂であると同時に、その限界が現れた治世でもある。

      バルカンの農民の家に生まれ、叔父の養子となって帝位を継いだ。
      妃のテオドラは芸人の出身で、政治に強い影響を及ぼしている。
      即位まもなく、都で大規模な暴動が起きた。
      逃亡を勧められた皇帝に対し、テオドラが皇帝の位は最良の死装束だと述べて踏みとどまらせたと伝えられる。
      鎮圧後、焼けた聖堂の跡にハギア・ソフィアが建てられた。

      法の編纂は最大の事業である。
      1000年にわたり積み重ねられた法と学説を整理し、体系的な法典にまとめた。
      これが後のヨーロッパ各国の法の源になる。
      軍事では、将軍ベリサリウスらを派遣して北アフリカのヴァンダル王国とイタリアの東ゴート王国を征服した。
      地中海の大部分を一時は回復する。
      しかし長い戦争でイタリアは荒廃し、財政は逼迫した。

      541年に始まった疫病が、この事業を無に帰す。
      人口が激減し、税収も兵も失われた。
      死後まもなく、イタリアの大半はランゴバルド人に奪われる。
      法典だけが、この治世の最も長く残る遺産になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/Meister_von_San_Vitale_in_Ravenna.jpg/500px-Meister_von_San_Vitale_in_Ravenna.jpg
      credit: Meister von San Vitale in Ravenna / Public domain
      page: https://commons.wikimedia.org/wiki/File:Meister_von_San_Vitale_in_Ravenna.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ユスティニアヌス1世

  - id: pope-gregory-i
    title: 教皇グレゴリウス1世
    start: 590
    end: 604
    category: religion
    tags: [教皇, 布教]
    summary: ゲルマン人への布教を組織し、ローマ司教を西欧の精神的な中心に押し上げた。
    detail: |
      ローマ教皇で、在位は590年から604年まで。
      混乱した西欧で教会の役割を広げ、ローマ司教を精神的な中心に押し上げた。
      大教皇と呼ばれる。

      元老院議員の家に生まれ、ローマの行政長官を務めた後に修道士となった。
      教皇に選ばれたのは、疫病と洪水、ランゴバルド人の侵入が重なる時期である。
      東の皇帝からの支援は期待できなかった。
      グレゴリウスは教会の所領を管理して穀物を配り、都市の防衛と食糧の供給を実務として担う。
      ランゴバルド人とは自ら交渉して和平を結んだ。
      教皇が世俗の統治にも関わる先例が、ここで作られる。

      布教にも力を注いだ。
      596年に修道士アウグスティヌスをブリタニアへ派遣し、アングロ・サクソン人への布教を始めさせた。
      現地の祭りや聖所を壊さず、キリスト教の意味を重ねて受け入れさせる方針をとる。
      この柔軟な方法が、ゲルマン世界への広がりを後押しした。

      著作も多く残した。
      聖職者の心得を説いた書は中世を通じて広く読まれ、司牧の手引きになる。
      典礼と聖歌の整備にも関わり、グレゴリオ聖歌にその名が残る。
      東の皇帝の権威が届かなくなるなか、西欧では教皇が秩序の中心になっていった。
      その転換を実務で担ったのがこの人物である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/a/a0/Pope_Gregory_I_Illustration.jpg
      credit: Artaud de Montor (1772–1849) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Pope_Gregory_I_Illustration.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/グレゴリウス1世_(ローマ教皇)

  - id: heraclius
    title: ヘラクレイオス
    start: 610
    end: 641
    category: war
    tags: [ビザンツ, ペルシア]
    summary: ペルシアに辛勝した直後にイスラム勢力の進出を受け、帝国をギリシア化して守りに入った。
    detail: |
      東ローマ帝国の皇帝で、在位は610年から641年まで。
      ペルシアとの総力戦に辛勝した直後、イスラム勢力の進出に直面した。
      帝国をギリシア化し、守りの体制へ移した人物である。

      即位したとき、帝国は崩壊寸前だった。
      ササン朝ペルシアがシリア・エジプト・アナトリアを占領し、エルサレムからは聖十字架が持ち去られている。
      バルカンではアヴァールとスラヴ人が迫っていた。
      ヘラクレイオスは教会の財宝を借りて軍を再建した。
      622年から自ら軍を率い、敵の背後を突く戦略でペルシア領深くへ進む。
      626年には都がアヴァールとペルシアに挟撃されたが、城壁と艦隊で守り抜いた。
      628年、ペルシアは内紛で崩れ、占領地と聖十字架が返還される。

      しかし両国は完全に消耗していた。
      その直後、アラビア半島から興ったイスラム勢力が北上する。
      636年のヤルムークの戦いで大敗し、シリアとエジプトを次々に失った。

      晩年の改革は、残された領域を守るためのものである。
      公用語をラテン語からギリシア語へ改め、皇帝の称号もギリシア語のバシレウスとした。
      軍管区の制度の原型も、この時期に始まったとされる。
      地中海帝国としてのローマは、この治世で終わった。
      以後の東ローマは、ギリシア語を話す中世の国家として存続することになる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/b/ba/Solidus-Heraclius-sb0764.jpg
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Solidus-Heraclius-sb0764.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヘラクレイオス

  - id: leo-iii-isaurian
    title: レオン3世
    start: 717
    end: 741
    category: religion
    tags: [ビザンツ, 聖像禁止]
    summary: コンスタンティノープルを守り抜き、聖像禁止令で東西教会の溝を深めた。
    detail: |
      東ローマ帝国の皇帝で、在位は717年から741年まで。
      コンスタンティノープルを包囲したイスラム軍を撃退し、帝国を存続させた。
      聖像禁止令によって東西の教会の溝を深めた人物でもある。

      即位した年、ウマイヤ朝の大軍が都を包囲した。
      海陸から1年にわたり攻められたが、三重の城壁と、ギリシアの火と呼ばれる焼夷兵器で持ちこたえる。
      冬の寒さと飢えで攻囲軍は壊滅した。
      この防衛は、イスラム勢力のヨーロッパへの進出を東から食い止めた出来事とされる。

      内政では、軍管区の制度を整えて防衛と徴税を結びつけた。
      法典を簡潔にまとめ直し、実務で使いやすくしている。
      726年ごろから、聖像に対する崇敬を禁じる方針を打ち出した。
      理由は諸説ある。
      偶像崇拝を禁じる旧約の戒めへの忠実さ、修道院の力を削ぐ意図、イスラムの影響などが挙げられてきた。

      この政策は激しい反発を招いた。
      民衆と修道士が抵抗し、多くの聖画像が破壊される。
      ローマ教皇はこれを非難し、東方の皇帝との関係は悪化した。
      教皇はやがて西方のフランク王国に保護を求めるようになる。
      東西の教会が別々の道を歩む流れは、この対立から加速した。
      聖像をめぐる争いは、100年以上にわたり断続的に続く。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/Solidus_of_Leo_III_sb1504.png/500px-Solidus_of_Leo_III_sb1504.png
      credit: CNG / CC BY-SA 2.5
      page: https://commons.wikimedia.org/wiki/File:Solidus_of_Leo_III_sb1504.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/レオーン3世

  - id: basil-ii
    title: バシレイオス2世
    start: 976
    end: 1025
    category: war
    tags: [ビザンツ]
    summary: ブルガリアを屈服させて中世ビザンツ帝国を最大に広げた。
    detail: |
      東ローマ帝国の皇帝で、在位は976年から1025年まで。
      50年に及ぶ治世でバルカン半島を再び支配下に置き、中世の帝国を最大に広げた。
      ブルガリア人を殺す者という異名で呼ばれる。

      幼くして即位したが、実権は有力な将軍たちが握っていた。
      二度の大規模な反乱を、キエフ公国から招いた兵の助けを借りて鎮圧する。
      このとき妹を嫁がせ、その条件としてルーシがキリスト教を受け入れた。
      東欧の正教化はここに始まる。
      反乱を抑えた後、皇帝は大貴族の抑制に力を注いだ。
      農民の土地を買い占めた有力者に対し、買収を無効とする法を出す。
      自作農を維持することが、税と兵の基盤を守ると考えたためである。

      対外戦争では、ブルガリアとの戦いに20年以上を費やした。
      1014年の戦いで捕らえた数千の捕虜の目をつぶし、百人に一人だけ片目を残して送り返したと伝えられる。
      報せを受けたブルガリアの君主は倒れ、まもなく国は併合された。
      領土はドナウからシリア北部、南イタリアにまで及ぶ。
      国庫には膨大な蓄えが残された。

      生涯独身で後継を残さず、死後の帝国は急速に衰える。
      大貴族の力が戻り、1071年にはマンジケルトでセルジューク朝に大敗した。
      絶頂とその後の落差が際立つ治世である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Basilios_II.jpg/500px-Basilios_II.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Basilios_II.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/バシレイオス2世

  - id: pope-gregory-vii
    title: 教皇グレゴリウス7世
    start: 1073
    end: 1085
    category: religion
    tags: [教皇, 叙任権闘争]
    summary: 聖職者の任命権を皇帝から取り戻そうとし、カノッサで教皇権の頂点を見せた。
    detail: |
      ローマ教皇で、在位は1073年から1085年まで。
      聖職者の任命権を皇帝から取り戻そうとし、皇帝と正面から争った。
      カノッサの出来事で、教皇権の頂点を示した人物である。

      当時の教会は、世俗の支配者に強く依存していた。
      司教や修道院長は国王や皇帝が任命し、その見返りに教会は世俗の役割を担う。
      聖職の売買や聖職者の妻帯も広く行われていた。
      グレゴリウスは、こうした状態を教会の腐敗とみて改革に乗り出した。
      聖職売買と妻帯を禁じ、世俗の権力による聖職者の任命を無効と宣言する。
      教皇は誰にも裁かれず、皇帝を廃位することもできると主張した。

      神聖ローマ皇帝ハインリヒ4世はこれに反発し、教皇の廃位を宣言する。
      教皇は皇帝を破門し、諸侯に忠誠の義務がなくなると告げた。
      諸侯が離反すると、皇帝は北イタリアのカノッサ城を訪れ、雪のなかで三日間赦しを乞うたと伝えられる。
      破門は解かれたが、争いは続いた。
      皇帝は後に軍を率いてローマを占領し、教皇は南へ逃れて亡命先で没する。

      叙任権をめぐる争いは、1122年の妥協によって一応の決着を見た。
      宗教的な権威と世俗の権力が別々の領域を持つという考え方は、この対立を通じて形を得ている。
      ヨーロッパの政教関係の枠組みは、ここから生まれた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/1/16/Ritratto_di_Papa_San_Gregorio_VII.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ritratto_di_Papa_San_Gregorio_VII.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/グレゴリウス7世_(ローマ教皇)

  - id: alexios-i
    title: アレクシオス1世
    start: 1081
    end: 1118
    category: politics
    tags: [ビザンツ, 十字軍]
    summary: 西欧に援軍を求めたことが十字軍を呼び、結果的に帝国を危うくした。
    detail: |
      東ローマ帝国の皇帝で、在位は1081年から1118年まで。
      崩壊寸前の帝国を立て直したが、西欧に援軍を求めたことが十字軍を招いた。
      コムネノス王朝の創始者である。

      即位した時点で、帝国は各方面から圧迫されていた。
      1071年のマンジケルトの敗戦で小アジアの大半を失い、バルカンではノルマン人が侵攻している。
      財政は破綻し、通貨の品位も落ちていた。
      アレクシオスは貴族の家系を婚姻で結びつけ、支配層を再編成した。
      教会の財産を戦費に充て、通貨を改鋳する。
      ヴェネツィアに交易の特権を与えて艦隊の協力を得た。
      この特権が、後にヴェネツィアの東地中海での優位を生むことになる。

      小アジアを回復するには兵が足りなかった。
      そこで教皇に傭兵の派遣を要請する。
      期待していたのは、指揮下で戦う職業兵の一団だった。
      1096年に到着したのは、諸侯が率いる大規模な十字軍だった。
      皇帝は彼らに忠誠を誓わせ、回復した土地の返還を約束させる。
      しかし約束は守られず、十字軍はシリアに独自の国家を建てた。

      一方で、小アジア西部の回復には成功している。
      娘のアンナが父の治世を記した歴史書は、この時代を知る主要な史料である。
      帝国を延命させた手腕と、十字軍を招いた結果の両方が、この治世の評価を分けている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アレクシオス1世

  - id: pope-urban-ii
    title: 教皇ウルバヌス2世
    start: 1088
    end: 1099
    category: religion
    tags: [教皇, 十字軍]
    summary: クレルモンの説教で十字軍を呼びかけ、西欧の武力を東へ向けた。
    detail: |
      ローマ教皇で、在位は1088年から1099年まで。
      1095年のクレルモン教会会議で十字軍を呼びかけた。
      西欧の武力を東方へ向けた人物である。

      フランスの貴族の家に生まれ、クリュニー修道院で改革の運動に加わった。
      教皇としても、聖職者の規律と教会の自立を重んじる路線を継いでいる。
      東ローマ皇帝からの援軍要請が、呼びかけの直接のきっかけになった。
      聖地への巡礼が妨げられているという訴えも伝えられていた。

      クレルモンでの演説では、東方の同胞を助け、聖地を取り戻すよう説いた。
      参加者には罪の償いが免除されると告げられる。
      集まった群衆は、神がそれを望んでいるという叫びで応じたと記録されている。
      呼びかけは予想を超える反響を得た。
      諸侯だけでなく、農民や貧民も列に加わる。
      土地を持たない次男以下の騎士にとって、東方は新たな所領を得る機会でもあった。

      背景には、西欧の事情もある。
      領主どうしの私闘が絶えず、その暴力を外へ向けることが秩序の回復につながると考えられた。
      教皇の権威を諸侯に対して示す機会でもある。
      1099年に十字軍がエルサレムを占領したが、その報せが届く前にウルバヌスは没した。
      以後200年にわたる遠征の連鎖が、この演説から始まっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2a/Urbano_II_%28Francisco_de_Zurbar%C3%A1n%29.jpg/500px-Urbano_II_%28Francisco_de_Zurbar%C3%A1n%29.jpg
      credit: Jl FilpoC / Public domain
      page: https://commons.wikimedia.org/wiki/File:Urbano_II_(Francisco_de_Zurbar%C3%A1n).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウルバヌス2世_(ローマ教皇)

  - id: pope-innocent-iii
    title: 教皇インノケンティウス3世
    start: 1198
    end: 1216
    category: religion
    tags: [教皇]
    summary: 各国の王を破門で従わせ、「教皇は太陽、皇帝は月」と言われる権勢の頂点に立った。
    detail: |
      ローマ教皇で、在位は1198年から1216年まで。
      各国の王を破門によって従わせ、中世の教皇権の頂点を築いた。
      教皇は太陽、皇帝は月という比喩で、その立場を説明している。

      37歳で選ばれた若い教皇で、法律に通じていた。
      教皇は神と人のあいだに立つ存在であり、世俗の君主の上にあると主張する。
      実際に、各国の王に対して権力を行使した。
      イングランド王ジョンを破門し、国全体の礼拝を停止して屈服させる。
      フランス王の離婚を認めず、同じ手段で撤回させた。
      神聖ローマ帝国の皇帝位の争いにも介入している。

      第4回十字軍を呼びかけたが、軍はコンスタンティノープルを攻撃した。
      教皇はこれを非難したものの、結果として生まれたラテン帝国は受け入れている。
      南フランスの異端に対しては討伐の十字軍を招集し、大規模な戦争になった。
      一方で、新しい修道会を認可する柔軟さも示した。
      清貧を説くフランチェスコとドミニコの運動を体制の内側に取り込み、異端に流れる可能性を防いでいる。

      1215年の第4ラテラノ公会議では、年に一度の告解の義務など、信徒の生活に関わる規定を定めた。
      この公会議の決定は、その後の教会の実務を長く規定する。
      教皇の権威がこれほど広く通用した時期は、前後にない。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/Innozenz3.jpg/500px-Innozenz3.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Innozenz3.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/インノケンティウス3世_(ローマ教皇)

  - id: frederick-ii-sicily
    title: フリードリヒ2世（シチリア）
    start: 1220
    end: 1250
    category: culture
    tags: [シチリア, 神聖ローマ]
    summary: アラビア語も解する宮廷を南イタリアに営み、「世界の驚異」と呼ばれた皇帝。
    detail: |
      神聖ローマ皇帝でシチリア王でもあった人物で、1194年に生まれ1250年に没した。
      南イタリアに独自の宮廷を営み、世界の驚異と呼ばれた。
      中世の君主としては異例の教養と関心を持っていた。

      シチリアで育った。
      この島はビザンツ、イスラム、ノルマンの文化が重なる場所で、アラビア語とギリシア語が日常的に使われていた。
      その環境が、後の統治と関心に影響している。
      南イタリアでは、中央集権的な統治を進めた。
      官僚を養成するためナポリに大学を創設し、法典を編んで裁判制度を整える。
      関税と専売で財政を固めた。
      近代国家の先取りと評されることがある。

      十字軍では、戦わずに交渉でエルサレムを回復した。
      エジプトの君主と協定を結び、聖地を共同で管理する形をとる。
      この成果は評価されず、教皇からは破門されたまま遠征したことを非難された。
      教皇とは生涯にわたり対立し、二度破門されている。
      異端の疑いをかけられ、反キリストとまで呼ばれた。

      学問への関心も深い。
      鷹狩りについての書物を自ら著し、鳥の解剖と観察にもとづく記述を残した。
      アラビア語の学者を宮廷に招き、翻訳と議論を行わせている。
      イタリア語による詩の最初期の実践も、この宮廷から生まれた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/42/Die_deutschen_Kaiser_Friedrich_II.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Die_deutschen_Kaiser_Friedrich_II.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フリードリヒ2世_(神聖ローマ皇帝)

  - id: pope-boniface-viii
    title: 教皇ボニファティウス8世
    start: 1294
    end: 1303
    category: religion
    tags: [教皇, アナーニ事件]
    summary: フランス王に捕らえられ、教皇権が王権に屈する時代の始まりを印した。
    detail: |
      ローマ教皇で、在位は1294年から1303年まで。
      王権と正面から争って敗れ、教皇権が衰える時代の始まりを印した。

      即位の経緯からして異例だった。
      前任の教皇は隠者出身で、統治に耐えられず自ら退位する。
      その退位を勧めたのがこの人物だとされ、正統性を疑う声が残った。
      主張は強硬である。
      聖職者に課税するには教皇の同意が必要だとし、王権に対する優位を繰り返し説いた。
      1302年の教書では、すべての人が救われるためには教皇に従う必要があると宣言している。

      フランス王フィリップ4世は、これを真っ向から拒んだ。
      国内の世論を議会で固め、教皇を異端と偽証の罪で告発する。
      1303年、王の使者が兵とともにアナーニの別荘を襲い、教皇を拘束した。
      数日後に解放されたが、屈辱のうちにまもなく没する。

      この事件は、教皇が世俗の王に力で屈した最初の例になった。
      2年後にはフランス出身の教皇が選ばれ、教皇庁はアヴィニョンへ移る。
      以後70年近く、教皇はフランス王の影響下に置かれた。
      背景には、各国で王権が強まり、国家の枠組みが固まってきたことがある。
      普遍的な権威としての教皇が、国家に対して優位を保てなくなった転換点である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a2/Ritratto_di_Papa_Bonifacio_VIII_per_Dell%27Altissimo%2C_Uffizi.jpg/500px-Ritratto_di_Papa_Bonifacio_VIII_per_Dell%27Altissimo%2C_Uffizi.jpg
      credit: クリストファノ・デル・アルティッシモ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ritratto_di_Papa_Bonifacio_VIII_per_Dell%27Altissimo,_Uffizi.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ボニファティウス8世_(ローマ教皇)

  - id: pope-clement-v
    title: 教皇クレメンス5世
    start: 1305
    end: 1314
    category: religion
    tags: [教皇, アヴィニョン]
    summary: 教皇庁をアヴィニョンへ移し、フランス王の影響下に入る70年の始まりになった。
    detail: |
      ローマ教皇で、在位は1305年から1314年まで。
      教皇庁を南フランスのアヴィニョンへ移した。
      教皇がフランス王の影響下に置かれる70年の始まりになる。

      フランス南西部の出身で、ボルドーの大司教から選ばれた。
      選出にはフランス王フィリップ4世の意向が強く働いている。
      ローマへは一度も赴かなかった。
      イタリアの政情が不安定だったこともあり、フランス国内を転々とした後、1309年にアヴィニョンに落ち着く。
      この地は教皇領に隣接し、フランス王の勢力圏に近い。

      王の要求には、おおむね従った。
      前任者の一人であるボニファティウス8世への告発は取り下げさせたが、その教書のうち王権に触れる部分は撤回している。
      枢機卿にはフランス人が多数任命され、以後の教皇もフランス出身者が続いた。
      最も重い決定は、テンプル騎士団の解散である。
      フランス王が財産を狙って騎士団員を逮捕し、拷問による自白をもとに異端として告発した。
      教皇はこれを追認し、1312年に騎士団を解散させる。
      多くの団員が火刑に処された。

      アヴィニョンの時代は1377年まで続く。
      イタリア側からは捕囚と呼ばれ、教皇の権威は大きく損なわれた。
      続く教会大分裂の遠因にもなっている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/9/93/Papa_Clemens_Quintus.jpg
      credit: Henri Auguste César Serrur / Public domain
      page: https://commons.wikimedia.org/wiki/File:Papa_Clemens_Quintus.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クレメンス5世_(ローマ教皇)

  - id: cosimo-de-medici
    title: コジモ・デ・メディチ
    start: 1434
    end: 1464
    category: economy
    tags: [フィレンツェ, ルネサンス]
    summary: 公職に就かないまま銀行の力で市政を動かし、芸術への出資で都市の性格を変えた。
    detail: |
      フィレンツェの銀行家で、1434年から1464年まで市政を実質的に主導した。
      公職にはほとんど就かないまま、資金と人脈で都市を動かした。
      メディチ家の支配を確立した人物である。

      父から銀行を受け継ぎ、教皇庁との取引で富を築いた。
      有力な対立家系との争いに敗れて一度は追放されるが、翌年に呼び戻される。
      以後30年にわたり、フィレンツェの事実上の指導者であり続けた。

      統治の方法は間接的である。
      自らは表に出ず、支持者を要職に就け、税の査定を通じて反対派に圧力をかける。
      共和政の形式は保たれたまま、実質は一人の意向で動いた。
      外交では、イタリア諸国の均衡を保つ方針をとった。
      ミラノと同盟して勢力の偏りを防ぎ、戦争を避けることで商業の利益を守る。

      文化への出資は大きな遺産になった。
      ブルネレスキによる大聖堂の円蓋の完成を支え、ドナテッロやフラ・アンジェリコに仕事を与える。
      サン・マルコ修道院を再建し、その図書館を公開した。
      ギリシアの写本を各地から集め、プラトンの著作を研究する学者を支援している。
      死後、市民は祖国の父という称号を贈った。
      商人の富が芸術と学問を育てるという構図が、ここで明確になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Cosimo_di_Medici_%28Bronzino%29.jpg/500px-Cosimo_di_Medici_%28Bronzino%29.jpg
      credit: Workshop of アーニョロ・ブロンズィーノ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Cosimo_di_Medici_(Bronzino).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/コジモ・デ・メディチ

  - id: constantine-xi
    title: コンスタンティノス11世
    start: 1449
    end: 1453
    category: war
    tags: [ビザンツ, 滅亡]
    summary: 城壁の上で戦死した最後のビザンツ皇帝で、1000年の帝国がここで終わった。
    detail: |
      ビザンツ帝国の最後の皇帝で、在位は1449年から1453年まで。
      都の城壁で戦死し、1000年続いた帝国はここで終わる。

      即位したとき、帝国の領域は都とその周辺、それにペロポネソス半島の一部にすぎなかった。
      人口も数万にまで減り、かつての大帝国の面影はない。
      西欧に援軍を求め、教会の合同を受け入れた。
      東西教会の統一を宣言することで支援を得ようとしたが、国内の聖職者と市民は強く反発する。
      ラテン人の帽子よりトルコ人のターバンのほうがましだ、という言葉が伝えられている。
      実際に届いた援軍は、ジェノヴァの部隊など少数にとどまった。

      1453年、メフメト2世の大軍が都を包囲した。
      守備兵は7000人ほどで、攻める側は10万に近い。
      巨大な大砲が城壁を崩し、艦隊は丘を越えて金角湾へ運び込まれた。

      降伏と引き換えに命と領地を保証するという申し出を、皇帝は拒んだ。
      5月29日、城壁が突破されると、皇帝は帝衣を脱いで戦列に加わり、そのまま消息を絶つ。
      遺体は確認されていない。
      ギリシアでは、大理石になって眠り、いつか都を取り戻すという伝説が語り継がれた。
      最後まで都を守った皇帝という像が、近代の民族意識にも受け継がれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/Konstantinos_XI_Palaiologos_fresco_%28less_edited%29.jpg/500px-Konstantinos_XI_Palaiologos_fresco_%28less_edited%29.jpg
      credit: ILoveHirasawaYui / CC0
      page: https://commons.wikimedia.org/wiki/File:Konstantinos_XI_Palaiologos_fresco_(less_edited).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/コンスタンティノス11世パレオロゴス

  - id: lorenzo-de-medici
    title: ロレンツォ・デ・メディチ
    start: 1469
    end: 1492
    category: culture
    tags: [フィレンツェ, ルネサンス]
    summary: 芸術家を手元に集めて庇護し、イタリア諸国の均衡を保つ調停役も務めた。
    detail: |
      フィレンツェの指導者で、1469年から1492年まで市政を主導した。
      祖父コジモの路線を継ぎ、芸術家を庇護してイタリア諸国の調停役も務めた。
      豪華王と呼ばれる。

      20歳で一族の当主となった。
      公的な肩書きはなく、影響力は資金と人脈による。
      1478年、対立する家系が教皇の縁者と結んで暗殺を企てた。
      大聖堂のミサの最中に襲われ、弟は殺されたが本人は逃れる。
      報復に対して教皇とナポリ王が軍を送ると、ロレンツォは単身ナポリへ赴いて交渉し、和平を結んだ。
      この行動で声望を高めている。

      以後はイタリア諸国の均衡を保つことに努めた。
      有力な都市国家が争わないよう仲介を続け、その存在が半島の平和を支えたと評される。
      文化の庇護者としてよく知られる。
      庭園に古代彫刻を集め、そこで学ぶ若者のなかに少年時代のミケランジェロがいた。
      ボッティチェリやヴェロッキオを援助し、プラトン哲学を研究する学者を集める。
      自身もイタリア語で詩を書いた。

      一方、銀行の経営は傾いていた。
      公金を流用して損失を埋めたとも指摘される。
      死の2年後にメディチ家は追放され、フランス軍の侵入とともにイタリア戦争が始まった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2b/Lorenzo_de%27_Medici-ritratto.jpg/500px-Lorenzo_de%27_Medici-ritratto.jpg
      credit: ジローラモ・マッキエッティ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Lorenzo_de%27_Medici-ritratto.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ロレンツォ・デ・メディチ

  - id: pope-julius-ii
    title: 教皇ユリウス2世
    start: 1503
    end: 1513
    category: culture
    tags: [教皇, ルネサンス]
    summary: みずから軍を率いる一方、サン・ピエトロ大聖堂とシスティーナ礼拝堂を起こさせた。
    detail: |
      ローマ教皇で、在位は1503年から1513年まで。
      自ら甲冑をつけて軍を率いる一方、大規模な芸術事業を起こした。
      戦う教皇と呼ばれる。

      即位したとき、教皇領は各地の領主と外国勢力に侵食されていた。
      ユリウスは軍を率いて北イタリアへ遠征し、失われた都市を次々に回復する。
      ヴェネツィアと戦うために諸国と同盟を結び、次にはフランスを追い出すために同盟の相手を替えた。
      芸術事業も同じ意欲で進められた。
      古いサン・ピエトロ大聖堂を取り壊し、当時最大の聖堂の建設に着手する。
      設計はブラマンテが担い、後にミケランジェロが引き継いだ。

      ミケランジェロには自らの墓碑の制作を依頼し、続いてシスティーナ礼拝堂の天井画を描かせた。
      彫刻家である本人は壁画を望まなかったが、教皇の強い要求に従っている。
      ラファエロには教皇の居室の壁画を任せ、アテネの学堂などが描かれた。

      建設の費用は莫大で、贖宥状の販売がその財源の一つになる。
      この方式が次代に引き継がれ、宗教改革の直接の引き金になった。
      教会の頭が世俗の君主として戦い、同時に空前の芸術を生み出したという二面性が、この時代の教皇の性格をよく表している。
      エラスムスはその姿を風刺する文章を残した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Pope_Julius_II.jpg/500px-Pope_Julius_II.jpg
      credit: ラファエロ・サンティ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Pope_Julius_II.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ユリウス2世_(ローマ教皇)

  - id: pope-leo-x
    title: 教皇レオ10世
    start: 1513
    end: 1521
    category: religion
    tags: [教皇, 宗教改革]
    summary: 大聖堂の造営費を贖宥状でまかなおうとして、ルターの抗議を招いた。
    detail: |
      ローマ教皇で、在位は1513年から1521年まで。
      メディチ家の出身で、ロレンツォの子にあたる。
      大聖堂の造営費を贖宥状でまかなおうとして、宗教改革を招いた。

      幼いころから聖職の地位を与えられ、37歳で教皇になった。
      芸術と学問を好み、ラファエロを重用して都を飾る。
      神が教皇の位を与えたのだから楽しもう、と述べたという逸話が伝えられる。
      支出は巨額に上った。
      サン・ピエトロ大聖堂の建設、宮廷の祝祭、縁者への恩給が財政を圧迫する。
      収入を得るため、聖職の売買と贖宥状の販売が拡大された。

      贖宥状は、罪の償いを軽減するとされる証書である。
      ドイツでの販売では、献金すれば煉獄の魂が救われるといった説明が行われた。
      販売の収益の一部は、地位を得るために借財した司教の返済にも充てられている。

      1517年、ヴィッテンベルクのルターがこれを批判する論題を発表した。
      教皇は当初、修道士どうしの争いとして軽視する。
      対応が遅れるあいだに主張は印刷物で広まり、大きな運動になった。
      1521年にルターを破門するが、事態は収まらない。
      同じ年に教皇は急死した。
      芸術の庇護者としての功績と、教会が分裂する引き金を引いた責任が、同じ治世に重なっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Raffaello%2C_ritratto_di_papa_leone_X_tra_i_cardinali_luigi_de%27_rossi_e_giulio_de%27_medici%2C_1518%2C_03.jpg/500px-Raffaello%2C_ritratto_di_papa_leone_X_tra_i_cardinali_luigi_de%27_rossi_e_giulio_de%27_medici%2C_1518%2C_03.jpg
