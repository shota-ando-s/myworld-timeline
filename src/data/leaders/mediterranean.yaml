  - id: cosimo-i
    title: コジモ1世
    start: 1537
    end: 1574
    category: politics
    tags: [フィレンツェ, トスカーナ]
    summary: 分裂した都市国家をトスカーナ大公国にまとめ、共和政の伝統を終わらせた。
    detail: |
      フィレンツェの君主で、1537年から1574年まで統治した。
      分裂していたトスカーナ地方を一つの国家にまとめ、初代の大公となった。
      共和政の伝統はこの治世で終わる。

      17歳で前任者の暗殺を受けて推された。
      有力者たちは、若く経験のない人物なら操れると考えたとされる。
      しかしコジモは短期間で実権を握り、反対派を排除した。
      統治は中央集権的である。
      官僚制を整え、税と司法を直接に管理した。
      都市ごとの自治は削られ、各地に代官が送られる。
      傭兵に頼らない軍を作り、要塞を各地に築いた。

      1555年、長年の宿敵だったシエナを征服する。
      これによってトスカーナのほぼ全域が支配下に入った。
      1569年には教皇から大公の称号を授けられる。

      文化事業も政治の一部だった。
      行政機関を収める建物としてウフィツィを建て、そこは後に美術館になる。
      画家や歴史家を雇い、メディチ家の支配を正当化する物語を整えさせた。
      ヴァザーリによる美術家列伝も、この宮廷の環境から生まれている。
      商業都市の共和国が、領域を持つ君主国家へ変わった典型例である。
      メディチ家は18世紀まで大公として続いた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/53/Cosimo_I_de_Medici_in_armour_%281545%29_Oil_on_wood_by_Angelo_Bronzino_-_Galleria_degli_Uffizi_-_Florence.jpg/500px-Cosimo_I_de_Medici_in_armour_%281545%29_Oil_on_wood_by_Angelo_Bronzino_-_Galleria_degli_Uffizi_-_Florence.jpg
