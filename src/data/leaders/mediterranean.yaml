    start: 1978
    end: 2005
    category: religion
    tags: [教皇, 東欧]
    summary: ポーランド出身の教皇として東欧の民主化を後押しし、世界を歩き回る教皇像を作った。

  - id: pope-francis
    title: 教皇フランシスコ
    start: 2013
    end: 2025
    category: religion
    tags: [教皇, 南米]
    summary: 南米出身の初の教皇として、貧困と環境を正面から語り教会の姿勢を変えた。

  - id: pope-leo-xiv
    title: 教皇レオ14世
    start: 2025
    ongoing: true
    category: religion
    tags: [教皇]
    summary: 米国出身として初めて選ばれた教皇。
