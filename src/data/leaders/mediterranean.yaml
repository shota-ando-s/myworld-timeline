  - id: pope-paul-iii
    title: 教皇パウルス3世
    start: 1534
    end: 1549
    category: religion
    tags: [教皇, 対抗宗教改革]
    summary: トリエント公会議の招集とイエズス会の公認で、カトリック側の立て直しを始めた。
    detail: |
      ローマ教皇で、在位は1534年から1549年まで。
      宗教改革に対するカトリック側の立て直しを始めた人物である。
      トリエント公会議の招集とイエズス会の公認が、その中心にある。

      ルネサンス期の教皇らしい面も持っていた。
      縁者を要職に就け、息子に領地を与えるなど、後世に批判される人事を行っている。
      ミケランジェロに最後の審判を描かせ、サン・ピエトロ大聖堂の工事を進めたのもこの教皇である。
      一方で、教会の刷新が避けられないことも理解していた。
      改革派の枢機卿を登用し、教会の問題点を調査させて報告書を作らせる。
      聖職の売買や無資格の司教が横行している実情が、そこで明らかにされた。

      1540年、イグナティウス・ロヨラらの修道会を認可した。
      イエズス会は教育と海外宣教に力を注ぎ、アジアやアメリカへ宣教師を送る。
      日本に来たザビエルもその一人である。
      1542年には異端審問の機関を再編し、統制も強めた。
      禁書の制度が整えられるのもこの流れにある。

      1545年、トリエント公会議が開かれた。
      中断を挟んで18年続き、教義を明確にし、司教の職務と聖職者の養成を定める。
      新教との和解ではなく、自らの立場を固める方向が選ばれた。
      この路線が、以後400年のカトリック教会の形を決めている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Portrait_of_Pope_Paul_III_Farnese_%28by_Titian%29_-_National_Museum_of_Capodimonte.jpg/500px-Portrait_of_Pope_Paul_III_Farnese_%28by_Titian%29_-_National_Museum_of_Capodimonte.jpg
