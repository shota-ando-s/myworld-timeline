  - id: hannibal-barca
    title: ハンニバル
    start: -221
    end: -202
    category: war
    tags: [カルタゴ, ポエニ戦争]
    summary: 象を連れてアルプスを越えローマを追い詰め、最強の敵として長く記憶された。
    detail: |
      カルタゴの将軍で、紀元前247年に生まれ183年ごろに没した。
      第二次ポエニ戦争でローマを16年にわたり苦しめた。
      ローマ人にとって最も恐るべき敵として記憶され続けた人物である。

      父はイベリア半島でカルタゴの勢力を再建した将軍だった。
      幼いころローマへの敵意を誓わされたという逸話が伝えられる。
      紀元前218年、イベリアから軍を率いて出発した。
      海を避け、ピレネーとアルプスを越えてイタリアへ侵入する。
      象を含む軍勢の山越えは、当時の常識を超える行動だった。

      イタリアでは連戦連勝した。
      トレビア、トラシメヌス湖、そして紀元前216年のカンナエで、数に勝るローマ軍を包囲殲滅する。
      カンナエの戦いは、劣勢な兵力で敵を包囲した戦術の教科書として今も研究されている。
      しかしローマを落とすことはできなかった。
      攻城の装備がなく、同盟市の多くがローマから離反しなかったためである。
      ローマは決戦を避け、イベリアと北アフリカへ戦線を移す戦略をとった。

      紀元前202年、本国を守るため帰還したハンニバルはザマの戦いでスキピオに敗れる。
      戦後は政治家として改革を行うが、ローマの圧力で亡命した。
      各地を転々とした末、引き渡されそうになって自ら命を絶っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/Hannibal_Slodtz_Louvre_MR2093.jpg/500px-Hannibal_Slodtz_Louvre_MR2093.jpg
      credit: Sébastien Slodtz (French, 1655–1726) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Hannibal_Slodtz_Louvre_MR2093.jpg
    links:
