  - id: pope-urban-viii
    title: 教皇ウルバヌス8世
    start: 1623
    end: 1644
    category: religion
    tags: [教皇, バロック]
    summary: バロックのローマを作らせる一方、ガリレオを異端審問にかけた。
    detail: |
      ローマ教皇で、在位は1623年から1644年まで。
      バロックのローマを作らせた一方、ガリレオを異端審問にかけた。
      宗教的権威と世俗の君主としての顔が、最も明確に重なった教皇の一人である。

      フィレンツェの家系に生まれ、詩を書き、学問に通じていた。
      ベルニーニを重用し、サン・ピエトロ大聖堂の天蓋と広場、各地の噴水を作らせる。
      ローマの街並みがバロックの姿になるのは、この時期の事業による。
      天蓋の青銅を得るため古代のパンテオンの部材を外したことは、当時から批判された。
      教皇領の防衛にも力を注ぎ、要塞と武器庫を整えた。
      三十年戦争では、カトリック側でありながらハプスブルク家の強大化を警戒し、フランスに融和的な姿勢をとる。
      教皇が宗教より勢力均衡を優先したと受け取られ、立場を弱めた。

      ガリレオとは以前から親交があった。
      地動説を仮説として論じることは許していたとされる。
      しかし1632年の著作で、教皇の主張が愚か者の台詞として書かれていると受け取られ、態度が変わる。
      翌年、ガリレオは異端審問で有罪となり、自説の放棄を強いられた。

      縁者を要職に就けて富ませたことも、批判の的になった。
      死去の報を聞いた市民が、その像を壊したと伝えられる。
      芸術の庇護と権力の行使が不可分だった時代を象徴する治世である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Pietro_da_Cortona_-_Portrait_of_Urban_VIII_%28ca._1624-1627%29_-_Google_Art_Project_-_edited.jpg/500px-Pietro_da_Cortona_-_Portrait_of_Urban_VIII_%28ca._1624-1627%29_-_Google_Art_Project_-_edited.jpg
