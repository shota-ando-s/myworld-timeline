  - id: alexander-the-great
    title: アレクサンドロス大王
    start: -336
    end: -323
    category: war
    tags: [マケドニア, ヘレニズム]
    summary: 13年でギリシアからインダスまで征服し、東西の文化が混じるヘレニズム世界を生んだ。
    detail: |
      マケドニア王で、在位は紀元前336年から323年まで。
      13年のあいだにギリシアからインダス川まで征服した。
      東西の文化が混じるヘレニズム世界を生み出した人物である。

      父フィリッポス2世が整えた軍を受け継ぎ、20歳で即位した。
      少年期にはアリストテレスに学んだと伝えられる。
      即位直後の反乱を鎮め、テーバイを徹底的に破壊して見せしめとした。
      紀元前334年に東方遠征を開始する。
      グラニコス、イッソス、ガウガメラで次々にペルシア軍を破り、アケメネス朝を滅ぼした。
      エジプトでは解放者として迎えられ、アレクサンドリアを建設する。

      遠征はさらに東へ進んだ。
      中央アジアを越え、インダス川の流域まで達する。
      しかし長期の遠征に疲れた兵が進軍を拒み、引き返すことになった。
      統治では、ペルシアの制度と宮廷の作法を取り入れた。
      現地の有力者を総督に任じ、兵士とペルシア人女性の集団結婚を行っている。
      この融合政策は、マケドニア人の古参の将にはしばしば反発された。

      紀元前323年、バビロンで熱病により32歳で没した。
      後継者を明確に定めなかったため、帝国は部下たちの争いで分裂する。
      それでも、各地に建てられたギリシア風の都市とギリシア語は残り、西アジアの文化を変えた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/Istanbul_-_Museo_archeol._-_Alessandro_Magno_%28firmata_Menas%29_-_sec._III_a.C._-_da_Magnesia_-_Foto_G._Dall%27Orto_28-5-2006_b-n.jpg/500px-Istanbul_-_Museo_archeol._-_Alessandro_Magno_%28firmata_Menas%29_-_sec._III_a.C._-_da_Magnesia_-_Foto_G._Dall%27Orto_28-5-2006_b-n.jpg
