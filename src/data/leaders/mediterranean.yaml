  - id: pope-benedict-xiv
    title: 教皇ベネディクトゥス14世
    start: 1740
    end: 1758
    category: religion
    tags: [教皇, 啓蒙]
    summary: 啓蒙の知識人と文通し、対決ではなく対話で時代に向き合った教皇。
    detail: |
      ローマ教皇で、在位は1740年から1758年まで。
      学識で知られ、啓蒙の時代の知識人とも交流した。
      対決ではなく対話によって時代に向き合った教皇である。

      教会法の専門家として長く実務に携わり、多くの著作を残した。
      列聖の手続きに関する研究は、後の基準になっている。
      在位中の姿勢は穏健だった。
      各国の君主との協定では譲歩を重ね、教会の権利を守りつつ衝突を避ける。
      科学に対しても寛容で、地動説を扱った書物の禁書指定を実質的に緩めた。
      博物館と学術機関を支援し、ローマ大学の講座を整備している。

      ヴォルテールと書簡を交わしたことが知られる。
      批判者であるはずの啓蒙思想家からも、賢明な人物として敬意を払われた。
      一方で、困難な決定も下している。
      中国と南アジアでの布教にあたり、現地の祖先祭祀を認めるかどうかが長く争われていた。
      この教皇は、これを認めないという結論を確定させる。
      この決定によって中国での布教は事実上断たれ、清朝との関係も悪化した。

      穏やかな態度と厳格な教義判断が同居している。
      宗教が社会の中心から少しずつ退いていく時代に、教会がどう振る舞うかを模索した治世だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/Benoit_XIV.jpg/500px-Benoit_XIV.jpg
      credit: ピエール・シュプレイラス / Public domain
      page: https://commons.wikimedia.org/wiki/File:Benoit_XIV.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ベネディクトゥス14世_(ローマ教皇)

  - id: pope-pius-ix
    title: 教皇ピウス9世
    start: 1846
    end: 1878
    category: religion
    tags: [教皇, 教皇領]
    summary: イタリア統一で教皇領を失い、代わりに教皇不可謬の教義で霊的権威を固めた。
    detail: |
      ローマ教皇で、在位は1846年から1878年までの32年に及ぶ。
      歴代で最も長い在位である。
      イタリア統一で教皇領を失い、代わりに霊的な権威を強める方向を選んだ。

      就任当初は改革派として期待された。
      政治犯を恩赦し、教皇領に憲法を与え、鉄道の敷設を認める。
      イタリア統一運動の側も、この教皇に期待を寄せた。
      1848年の革命がその方向を変える。
      首相が暗殺され、ローマ共和国が宣言されると、教皇は国外へ逃れた。
      フランス軍の助けで復帰した後は、一転して保守的な立場をとる。

      以後、近代の思想に対する批判を強めた。
      1864年の誤謬表では、自由主義や政教分離、信教の自由を否定する立場を列挙している。
      1870年の第1バチカン公会議では、信仰と道徳について教皇が公式に宣言する際には誤りえないという教義が定められた。

      同じ1870年、イタリア王国の軍がローマに入り、教皇領は消滅した。
      教皇はヴァチカンに閉じこもり、自らを囚人と称して外へ出なかった。
      この状態は1929年まで続く。
      領土を失う代わりに、教皇の宗教的な権威は制度として明確になった。
      世俗の権力から切り離された教会という近代の形が、この治世を通じて生まれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/65/Pius_IX%2C_by_Adolphe_Braun%2C_1875.jpg/500px-Pius_IX%2C_by_Adolphe_Braun%2C_1875.jpg
      credit: Adolphe Braun / Public domain
      page: https://commons.wikimedia.org/wiki/File:Pius_IX,_by_Adolphe_Braun,_1875.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ピウス9世_(ローマ教皇)

  - id: cavour
    title: カヴール
    start: 1852
    end: 1861
    category: politics
    tags: [イタリア, 統一]
    summary: 外交と同盟でオーストリアを追い出し、イタリア統一を現実の政治にした。
    detail: |
      サルデーニャ王国の首相で、1852年から1861年までイタリア統一を主導した。
      外交と同盟によって、統一を現実の政治として実現した人物である。

      貴族の家に生まれ、イギリスとフランスで経済と政治を学んだ。
      農業経営と新聞の発行を経て政界に入る。
      首相として、まず国力の強化に取り組んだ。
      鉄道を敷き、関税を下げて貿易を拡大し、金融制度を整える。
      近代的な軍を育て、国家の財政基盤を固めた。

      外交では、大国を巻き込むことを重視した。
      クリミア戦争に参戦して英仏との関係を作り、講和会議でイタリアの問題を議題に載せる。
      1858年にはナポレオン3世と密約を結び、オーストリアとの戦争で支援を得る代わりにサヴォイアとニースを譲る約束をした。
      1859年の戦争でロンバルディアを獲得し、中部イタリアの諸国も住民投票を経て併合される。
      ガリバルディが南イタリアを制圧すると、その勢いが共和主義に向かうことを警戒し、軍を南下させて合流した。
      征服地は国王に引き渡され、1861年にイタリア王国が成立する。

      王国の成立から3か月後、カヴールは急死した。
      ローマとヴェネツィアはまだ統一されておらず、その課題は後継者に残される。
      理想よりも実現可能な手順を優先した政治家として評価されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c2/Camillo_Benso_Cavour_di_Ciseri.jpg/500px-Camillo_Benso_Cavour_di_Ciseri.jpg
      credit: アントニオ・チゼリ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Camillo_Benso_Cavour_di_Ciseri.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カミッロ・カヴール

  - id: garibaldi
    title: ガリバルディ
    start: 1860
    end: 1861
    category: war
    tags: [イタリア, 統一]
    summary: 千人隊で南イタリアを制圧し、征服地を国王に差し出して統一を完成させた。
    detail: |
      イタリア統一運動の軍事的な指導者で、1807年に生まれ1882年に没した。
      1860年に千人隊を率いて南イタリアを制圧し、統一を完成させた。

      船乗りとして育ち、若くして共和主義の運動に加わった。
      死刑判決を受けて南米へ逃れ、ブラジルとウルグアイの内戦で戦って名を上げる。
      赤いシャツを着た部隊は、この経験から生まれた。
      1860年、シチリアで反乱が起きると、千人ほどの義勇兵を率いて上陸した。
      正規軍を相手に連戦連勝し、島を制圧する。
      さらに海峡を渡ってナポリに入り、両シチリア王国を崩壊させた。
      進軍に呼応して各地で蜂起が起き、規模は一気に膨らんでいる。

      共和主義者でありながら、征服した土地を国王に差し出した。
      北から南下してきたヴィットーリオ・エマヌエーレ2世と会見し、南イタリアの統治権を渡す。
      自らは報酬も地位も受けず、小島の農園へ退いた。

      その後もローマとヴェネツィアの回復をめざして義勇軍を起こすが、政府軍に阻まれたこともある。
      晩年は国際的な名声を得て、各国の自由主義者の英雄とされた。
      理想を掲げて戦う軍人と、現実の外交を担う政治家の組み合わせが、イタリア統一を可能にした。
      その一方を代表する人物である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Giuseppe_Garibaldi_portrait2.jpg/500px-Giuseppe_Garibaldi_portrait2.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Giuseppe_Garibaldi_portrait2.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジュゼッペ・ガリバルディ

  - id: victor-emmanuel-ii
    title: ヴィットーリオ・エマヌエーレ2世
    start: 1861
    end: 1878
    category: politics
    tags: [イタリア, 統一]
    summary: 分裂していた半島を一つの王国にまとめた初代イタリア国王。
    detail: |
      イタリア王国の初代国王で、在位は1861年から1878年まで。
      それ以前はサルデーニャ王国の国王だった。
      分裂していた半島を一つの王国にまとめた君主である。

      サルデーニャ王国は、オーストリアとの戦いに敗れた父から位を継いだときに苦境にあった。
      彼は憲法を維持し、立憲君主として議会と協力する道を選ぶ。
      この姿勢が、自由主義者の支持を集めた。
      首相にカヴールを起用したことが最大の決断である。
      外交と国力の強化を任せ、フランスとの同盟によってオーストリアからロンバルディアを得た。
      中部イタリアの諸国も住民投票を経て併合される。

      ガリバルディが南イタリアを制圧すると、自ら軍を率いて南下した。
      テアーノでの会見で征服地を受け取り、1861年に王国の成立を宣言する。
      国王の呼称は、サルデーニャ時代からの番号をそのまま引き継いだ。

      統一はまだ完全ではなかった。
      ヴェネツィアは1866年、ローマは1870年に併合される。
      ローマを首都としたことで、教皇との関係は断絶した。
      北の王国の制度を南へそのまま適用したことは、地域間の格差という問題を残す。
      祖国の父と呼ばれ、ローマには巨大な記念堂が建てられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/VictorEmmanuel2.jpg/500px-VictorEmmanuel2.jpg
      credit: アンドレ＝アドルフ＝ウジェーヌ・ディズデリ / Public domain
      page: https://commons.wikimedia.org/wiki/File:VictorEmmanuel2.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴィットーリオ・エマヌエーレ2世

  - id: mussolini
    title: ムッソリーニ
    start: 1922
    end: 1943
    category: politics
    tags: [イタリア, ファシズム]
    summary: ファシズムという新しい独裁の型を作り、各国の運動の手本にされた。
    detail: |
      イタリアの政治家で、1922年から1943年まで政権を握った。
      ファシズムという新しい独裁の型を作り、各国の運動に手本を与えた。

      もとは社会党の新聞記者で、急進的な言論で知られていた。
      第一次世界大戦への参戦を主張して党を除名され、独自の運動を始める。
      戦後の混乱が追い風になった。
      領土要求が満たされない不満と、労働争議への恐れが広がっていた。
      黒シャツ隊が社会主義者を襲撃し、地主と実業家の支持を得る。
      1922年、ローマへの進軍を背景に首相に任命された。

      数年をかけて独裁を固めた。
      選挙法を改正して多数を確保し、野党の指導者が暗殺された事件の後に一党支配を宣言する。
      報道は統制され、労働組合は解散させられた。
      国家が労使を調整する組合国家の体制が作られる。
      公共事業と干拓を進め、鉄道の定時運行を宣伝した。
      1929年のラテラノ条約で教皇庁と和解し、国内の支持を広げている。

      対外的には帝国の再建を掲げ、1935年にエチオピアへ侵攻した。
      スペイン内戦に介入し、ドイツと枢軸を結ぶ。
      1940年に参戦したが、軍事的な失敗が続いた。
      1943年に失脚し、ドイツの傀儡政権の長となった後、1945年に処刑される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/Mussolini_mezzobusto.jpg/500px-Mussolini_mezzobusto.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Mussolini_mezzobusto.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ベニート・ムッソリーニ

  - id: pope-pius-xii
    title: 教皇ピウス12世
    start: 1939
    end: 1958
    category: religion
    tags: [教皇, 第二次世界大戦]
    summary: 戦時下でナチスの迫害に公然と抗議しなかったことが、今も議論され続けている。
    detail: |
      ローマ教皇で、在位は1939年から1958年まで。
      第二次世界大戦を通じて教皇の座にあった。
      ナチスによる迫害に公然と抗議しなかったことが、今も議論され続けている。

      外交官として長くドイツに駐在し、国務長官を経て教皇になった。
      就任は戦争が始まる半年前である。
      戦時中、公式には中立の立場を保った。
      和平を呼びかける声明を出したが、特定の国を名指しで非難することは避けている。
      1942年のクリスマスの演説では、民族を理由に死に追いやられている人々に触れたが、ユダヤ人やナチスの名は挙げなかった。

      沈黙の理由については、複数の説明がある。
      公然と非難すれば報復が激しくなること、各国の教会が弾圧を受けること、仲介者としての立場を失うことへの懸念である。
      実際に、ローマの教会や修道院に多数のユダヤ人をかくまい、外交ルートで救出を助けた記録も残る。
      一方で、最高の道徳的権威を持つ者が沈黙したことへの批判は強い。
      1960年代の戯曲をきっかけに論争が広がり、今も続いている。

      戦後は共産主義に厳しい姿勢をとり、東欧の教会を擁護した。
      バチカンの文書が2020年に公開され、検証が進められている。
      権威が極限の状況でどう振る舞うべきかという問いを残した治世である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Pius_XII_with_tabard%2C_by_Michael_Pitcairn%2C_1951_%28retouched%29.jpg/500px-Pius_XII_with_tabard%2C_by_Michael_Pitcairn%2C_1951_%28retouched%29.jpg
      credit: Michael Pitcairn / Public domain
      page: https://commons.wikimedia.org/wiki/File:Pius_XII_with_tabard,_by_Michael_Pitcairn,_1951_(retouched).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ピウス12世_(ローマ教皇)

  - id: pope-john-xxiii
    title: 教皇ヨハネ23世
    start: 1958
    end: 1963
    category: religion
    tags: [教皇, 第2バチカン公会議]
    summary: 公会議を招集して典礼と他宗派への姿勢を改め、教会を現代社会に開いた。
    detail: |
      ローマ教皇で、在位は1958年から1963年まで。
      第2バチカン公会議を招集し、教会を現代社会に開いた。
      短い在位ながら、その影響は現在まで続いている。

      農家の出身で、76歳という高齢で選ばれた。
      短期の暫定的な教皇と見られていたが、就任からわずか3か月で公会議の開催を発表して周囲を驚かせる。
      公会議は1962年に始まった。
      世界中から2000人以上の司教が集まり、4会期にわたって議論する。
      プロテスタントや正教会の代表もオブザーバーとして招かれた。

      打ち出された方向は大きい。
      ミサはラテン語から各国の言葉で行えるようになり、信徒の参加が重視される。
      他の宗派や他の宗教との対話が肯定され、信教の自由が原則として認められた。
      ユダヤ教徒をキリストの死の責任者とする見方も明確に否定される。

      教皇自身は、第1会期を終えた翌年に病没した。
      公会議は後継者のもとで完了する。
      回勅では、核兵器の廃絶と諸国民の協調を訴えた。
      キューバ危機の際には、米ソ双方に自制を呼びかけている。
      閉じた教会を開くという方針は、400年続いたトリエント以来の姿勢を転換するものだった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0c/Ioannes_XXIII%2C_by_De_Agostini%2C_1958%E2%80%931963.jpg/500px-Ioannes_XXIII%2C_by_De_Agostini%2C_1958%E2%80%931963.jpg
      credit: デアゴスティーニ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ioannes_XXIII,_by_De_Agostini,_1958%E2%80%931963.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヨハネ23世_(ローマ教皇)

  - id: pope-john-paul-ii
    title: 教皇ヨハネ・パウロ2世
    start: 1978
    end: 2005
    category: religion
    tags: [教皇, 東欧]
    summary: ポーランド出身の教皇として東欧の民主化を後押しし、世界を歩き回る教皇像を作った。
    detail: |
      ローマ教皇で、在位は1978年から2005年まで。
      ポーランド出身で、455年ぶりにイタリア人以外から選ばれた。
      東欧の民主化を後押しし、世界を歩き回る教皇像を作った。

      若いころは演劇に打ち込み、ナチス占領下で地下の神学校に通った。
      戦後は司祭となり、共産主義体制のもとで教会を守る経験を積む。
      就任の翌年、故国ポーランドを訪問した。
      数百万の人々が集まり、恐れるなという言葉が広く記憶される。
      自主管理労組の連帯を精神的に支え、東欧の体制が崩れる一因になったと評価されている。

      1981年、サンピエトロ広場で銃撃されて重傷を負った。
      回復後、獄中の犯人を訪ねて赦しを与えている。
      在位中に100を超える国を訪問した。
      若者の集会を各地で開き、メディアを通じて姿を見せる教皇の形を作る。
      他宗教との対話にも積極的で、モスクやシナゴーグを訪れた最初の教皇でもある。
      2000年には、教会が過去に犯した過ちについて公に謝罪した。

      一方、教義の面では保守的だった。
      避妊、中絶、女性の叙階、聖職者の独身制について、従来の立場を明確に維持している。
      聖職者による性的虐待への対応が遅れたことは、後に強く批判された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/Pope_John_Paul_II_smile.jpg/500px-Pope_John_Paul_II_smile.jpg
      credit: 作者不明 / CC BY 3.0 pl
      page: https://commons.wikimedia.org/wiki/File:Pope_John_Paul_II_smile.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヨハネ・パウロ2世_(ローマ教皇)

  - id: pope-francis
    title: 教皇フランシスコ
    start: 2013
    end: 2025
    category: religion
    tags: [教皇, 南米]
    summary: 南米出身の初の教皇として、貧困と環境を正面から語り教会の姿勢を変えた。
    detail: |
      ローマ教皇で、在位は2013年から2025年まで。
      アルゼンチン出身で、南米から選ばれた初めての教皇である。
      貧困と環境を正面から語り、教会の姿勢を変えた。

      イエズス会の出身で、ブエノスアイレスの大司教を務めた。
      就任時に選んだ名は、清貧を生きたアッシジのフランチェスコにちなむ。
      宮殿ではなくゲストハウスに住み、装飾を避ける姿勢を貫いた。
      繰り返し語ったのは、周縁に置かれた人々のことである。
      移民や難民の受け入れを訴え、最初の公式訪問先には地中海の島を選んで遭難した移民を悼んだ。
      貧困を生む経済の仕組みそのものを批判する発言も行っている。

      2015年の回勅では、環境問題を正面から扱った。
      気候変動を人間の活動によるものとし、地球を共通の家として守る責任を説く。
      宗教文書としては異例の内容で、国際的な議論にも影響を与えた。

      教会の運営でも変化を進めた。
      財務の透明化に取り組み、聖職者による性的虐待への対応を強化する。
      離婚した信徒や性的少数者への姿勢を和らげ、保守派との緊張も生んだ。
      教義そのものの変更は限定的だが、語り方と優先順位は大きく変わった。
      2025年4月に88歳で没している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Pope_Francis_Korea_Haemi_Castle_19_%284x5_cropped%29.jpg/500px-Pope_Francis_Korea_Haemi_Castle_19_%284x5_cropped%29.jpg
      credit: Korea.net / Korean Culture and Information Service (Jeon Han) / CC BY-SA 2.0
      page: https://commons.wikimedia.org/wiki/File:Pope_Francis_Korea_Haemi_Castle_19_(4x5_cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フランシスコ_(ローマ教皇)

  - id: pope-leo-xiv
    title: 教皇レオ14世
    start: 2025
    ongoing: true
    category: religion
    tags: [教皇]
    summary: 米国出身として初めて選ばれた教皇。
    detail: |
      2025年5月に選出されたローマ教皇で、アメリカ合衆国出身者としては初めてである。
      前任のフランシスコの死去を受けた選挙で選ばれた。

      シカゴに生まれ、アウグスチノ会に入会した。
      宣教師として長くペルーで働き、現地の市民権も得ている。
      南米での経験が長いため、北米出身でありながら南の教会に深く関わってきた人物とされる。
      司教を経て、バチカンで世界の司教の任命に関わる部署の長を務めた。
      各地の教会の事情に通じた実務家として知られる。

      選ばれた名は、19世紀末のレオ13世にちなむとされる。
      その教皇は、産業革命後の労働者の状況について回勅を出し、カトリックの社会教説の出発点を作った。
      技術と労働の変化が進む現在に、同じ問いを重ねる意図が読み取れる。
      米国出身者が教皇になることは、長く考えにくいとされてきた。
      世界最大の経済と軍事力を持つ国の出身者は、教会の普遍性を損なうと見られていたためである。
      その前提が変わったこと自体が、この選出の意味を示している。

      教会が抱える課題は多い。
      聖職者の不足、信徒の減少、性的虐待への対応、教義をめぐる内部の対立が続いている。
      南半球に信徒の重心が移るなかで、どう舵を取るかが問われる立場にある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Pope_Leo_XIV_3_%283x4_cropped%29.png/500px-Pope_Leo_XIV_3_%283x4_cropped%29.png
      credit: Edgar Beltrán, The Pillar / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Pope_Leo_XIV_3_(3x4_cropped).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/レオ14世_(ローマ教皇)
