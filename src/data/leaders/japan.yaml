        url: https://ja.wikipedia.org/wiki/徳川慶喜

  - id: emperor-meiji
    title: 明治天皇
    start: 1867
    end: 1912
    category: politics
    tags: [日本, 明治]
    summary: 近代国家の統合の中心に置かれ、天皇が政治の正統性を担う仕組みが作られた。
    detail: |
      1867年に即位し、1912年に没した天皇で、在位は45年に及ぶ。
      明治維新から日露戦争までの、日本が近代国家に作り替えられた時期と重なる。
      国家の統合の中心に置かれ、天皇が政治の正統性を担う仕組みが整えられた。

      即位したとき15歳で、翌年に五箇条の御誓文が出された。
      都は東京に移され、天皇は洋装で軍を統率する君主として人々の前に現れる。
      全国を巡幸して姿を見せ、それまで京都の奥にいた存在が国民の前に可視化された。
      学校には御真影が配られ、天皇を中心とする国民の意識が育てられていく。

      1889年の大日本帝国憲法は、天皇が定めて国民に与える欽定憲法の形をとった。
      統治権は天皇にあるとされ、軍の統帥、条約の締結、議会の召集などの大権が規定される。
      実際の政治は、元老や内閣、議会の協議によって動いていた。
      天皇が裁可を拒むことはほとんどなく、超然とした立場が保たれる。

      在位中に日清・日露の二つの戦争があり、国際的な地位は大きく変わった。
      1890年の教育勅語は、忠と孝を国民の道徳の中心に据える。
      死去にあたっては乃木希典が殉死し、時代の終わりとして受け止められた。
      近代の天皇制がどのようなものであるかは、この治世に形づくられている。
      多くの和歌を残し、その一部は公の場でしばしば引かれた。
      天皇を中心に国民をまとめる仕組みは、この治世に整えられて次代へ渡された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Emperor_Meiji_in_1873.jpg/500px-Emperor_Meiji_in_1873.jpg
      credit: 内田九一 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emperor_Meiji_in_1873.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/明治天皇

  - id: ito-hirobumi
    title: 伊藤博文
    start: 1885
    end: 1909
    category: politics
    tags: [日本, 明治, 憲法]
    summary: 初代首相として憲法と議会を設計し、近代日本の政治の枠組みを定めた。
    detail: |
      近代日本の政治の枠組みを設計した政治家で、1841年に生まれ1909年に没した。
      初代の内閣総理大臣であり、四度にわたって首相を務めた。
      憲法と議会の制度を作った人物として知られる。

      長州の下級武士の家に生まれ、若くしてイギリスへ密航して留学した。
      攘夷が不可能だと悟り、帰国後は開国と近代化を説く立場に立つ。
      維新後は岩倉使節団の副使として欧米を回り、制度の調査に当たった。
      1882年からはヨーロッパで憲法を研究し、君主の権限が強いドイツやオーストリアの制度を範とする。

      1885年に内閣制度を創設し、自ら初代の総理大臣に就いた。
      枢密院を設けて憲法草案を審議し、1889年に大日本帝国憲法が発布される。
      議会の運営では政党との対立に苦しみ、1900年に立憲政友会を自ら組織した。
      政党を敵視するのではなく、政治の仕組みに組み込む方向へ転じている。

      対外的には、日清戦争の講和条約に調印し、日露戦争後は韓国統監として保護国化を進めた。
      1909年、ハルビン駅で安重根に射殺される。
      翌年の韓国併合は、その死の後に実行された。
      立憲政治を根づかせた功績と、朝鮮支配を進めた責任が、同じ人物の上で評価を分けている。
      憲法の起草では井上毅や金子堅太郎らが実務を担い、伊藤はその調整役でもあった。
      千円札の肖像として、長く人々に見慣れた顔でもあった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/IT%C5%8C_Hirobumi.jpg/500px-IT%C5%8C_Hirobumi.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:IT%C5%8C_Hirobumi.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/伊藤博文

  - id: emperor-taisho
    title: 大正天皇
    start: 1912
    end: 1926
    category: politics
    tags: [日本, 大正]
    summary: 病により政務から退き、結果として政党内閣と大正デモクラシーの余地が広がった。
    detail: |
      1912年に即位し、1926年に没した天皇。
      幼いころから病弱で、在位の後半は公務を果たせなかった。
      結果として政治の重心が議会と政党へ移り、大正デモクラシーの余地が広がった。

      生まれてまもなく重い病にかかり、生涯その影響が残ったとされる。
      皇太子時代には各地を巡啓し、人々と気さくに接する様子が伝えられている。
      漢詩を好み、千首を超える作品を残した。
      即位の翌年には、藩閥内閣が世論の批判で倒れる大正政変が起きている。

      1918年ごろから健康が急速に悪化し、公の場に出ることが難しくなった。
      1921年、皇太子裕仁が摂政に就き、以後の天皇の務めを代行する。
      君主が実際には政務に関われない状態が長く続いたことになる。

      その間に、原敬による本格的な政党内閣が生まれ、普通選挙を求める運動も高まった。
      天皇の権威が政治の前面に出なかったことが、議会政治の成長を助けた面がある。
      1926年12月に没し、昭和へ改元された。
      病を理由に長く語られてこなかったが、近年はその人物像を見直す研究も進んでいる。
      大正という時代の呼び名は、この天皇の在位と重なるため広く使われている。
      摂政を置いた例は、近代では唯一のものになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/Emperor_Taish%C5%8D.jpg/500px-Emperor_Taish%C5%8D.jpg
      credit: 宮内省 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emperor_Taish%C5%8D.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大正天皇

  - id: hara-takashi
    title: 原敬
    start: 1918
    end: 1921
    category: politics
    tags: [日本, 政党政治]
    summary: 爵位を持たない初の首相として、本格的な政党内閣を実現した。
    detail: |
      日本で最初の本格的な政党内閣を組織した政治家で、1918年から1921年まで首相を務めた。
      1856年に盛岡に生まれ、1921年に暗殺された。
      爵位を持たず、衆議院に議席を置いたまま首相になったため、平民宰相と呼ばれた。

      南部藩の家老の家に生まれたが、戊辰戦争で賊軍とされた地域の出身である。
      新聞記者から外交官を経て政界に入り、立憲政友会を率いた。
      藩閥と官僚が政治を握る体制のなかで、政党の力を高めることに努める。

      1918年、米騒動で寺内内閣が倒れると、元老の推薦で組閣した。
      陸海軍大臣と外務大臣を除くすべての閣僚を政友会から選び、政党内閣の形を明確にする。
      鉄道の敷設、高等教育機関の増設、産業の振興を積極的に進めた。
      地方に利益をもたらすことで政党の支持を固める手法は、その後の日本政治の型になる。

      一方で、普通選挙の導入には慎重だった。
      選挙権の納税額を引き下げるにとどめ、時期尚早として退けている。
      この姿勢は、支持者からも批判を招いた。
      1921年、東京駅で一青年に刺殺される。
      政党政治を定着させた功績と、利益誘導型の政治を生んだ責任が、ともに語られてきた。
      日記を詳細に残しており、当時の政治の内情を知る重要な史料になっている。
      出身地の東北が中央から遠ざけられてきたという意識も、その政治姿勢に影響した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Takashi_Hara_formal.jpg/500px-Takashi_Hara_formal.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Takashi_Hara_formal.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/原敬

  - id: emperor-showa
    title: 昭和天皇
    start: 1926
    end: 1989
    category: politics
    tags: [日本, 昭和]
    summary: 戦争と敗戦、そして象徴天皇への転換を一身で経験した62年の在位。
    detail: |
      1926年に即位し、1989年に没した天皇で、在位は62年に及ぶ。
      歴代でもっとも長く位にあった。
      戦争と敗戦、そして象徴天皇への転換を一身で経験している。

      皇太子時代にヨーロッパを訪問し、立憲君主のあり方を学んだ。
      1921年から摂政を務め、1926年に即位する。
      大日本帝国憲法のもとでは統治権を総攬する存在とされたが、立憲君主として政治的な決定は内閣に委ねる姿勢をとった。
      1936年の二・二六事件では反乱の鎮圧を明確に命じ、自ら意思を示している。

      日中戦争から対米開戦への過程では、政府と軍の決定を裁可した。
      1945年、ポツダム宣言の受諾をめぐって閣内が割れた際には、自ら受諾を決めた。
      玉音放送によって、国民は初めてその声を聞く。

      占領下で自らの神格を否定する詔書を出し、各地を巡幸して人々の前に立った。
      1947年施行の日本国憲法では、国民統合の象徴と位置づけられる。
      政治的な権能を持たない立場で、国事行為と外国訪問を務めた。
      戦争にどこまで責任があるかは、国内外で議論が続いている。
      生物学者としてヒドロゾアの研究を続け、多くの論文を残したことでも知られる。
      戦後は全国を巡幸し、各地で人々と接する姿が報じられた。
      退位論もあったが実現せず、そのまま象徴として在位を続けた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8e/Emperor_Showa.jpg/500px-Emperor_Showa.jpg
      credit: 宮内省(Imperial Household Agency) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emperor_Showa.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/昭和天皇

  - id: tojo-hideki
    title: 東条英機
    start: 1941
    end: 1944
    category: war
    tags: [日本, 太平洋戦争]
    summary: 首相と陸相を兼ねて対米開戦に踏み切り、戦後に戦犯として裁かれた。
    detail: |
      太平洋戦争の開戦時の首相で、1884年に生まれ1948年に処刑された。
      陸軍大将として首相・陸相・内相などを兼ね、戦時の権力を集中させた。
      在任は1941年から1944年まで。

      陸軍の統制派に属し、関東軍の参謀長などを経て陸軍大臣になった。
      対米交渉が行き詰まるなか、1941年10月に首相に就任する。
      天皇の意向を受けて交渉の継続を模索したが、期限までに合意は得られなかった。
      12月8日、御前会議の決定にもとづいて開戦に踏み切る。

      首相として陸相を兼ね、のちには参謀総長も兼任した。
      軍と政治の権限を一人に集めたことで、独裁的だと批判される。
      初期の戦果は国民の支持を集めたが、ミッドウェー以後は戦局が悪化した。
      1944年7月、サイパンの陥落の責任を問われて辞職する。

      敗戦後、逮捕に際して拳銃で自殺を図ったが未遂に終わった。
      東京裁判でA級戦犯として起訴され、1948年に絞首刑となる。
      法廷では開戦の責任を引き受け、天皇に累が及ばないよう証言したとされる。
      戦争指導の責任がどこにあったのかという問いは、この人物の評価を通じて繰り返し論じられてきた。
      軍人としては几帳面な実務家で、書類を細部まで自ら確認したと伝えられる。
      権力を集中させながら、戦局を動かすだけの構想は持てなかった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Hideki_Tojo_2.jpg/500px-Hideki_Tojo_2.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Hideki_Tojo_2.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/東條英機

  - id: yoshida-shigeru
    title: 吉田茂
    start: 1946
    end: 1954
    category: politics
    tags: [日本, 戦後]
    summary: 軽武装と経済優先という戦後日本の針路を定め、講和と日米安保を結んだ。
    detail: |
      戦後の日本の針路を定めた政治家で、1946年から1954年まで断続的に首相を務めた。
      1878年に生まれ、1967年に没している。
      外交官の出身で、講和条約と日米安全保障条約に署名した。

      戦前は親英米派の外交官として知られ、開戦には反対の立場だった。
      終戦工作に関わって憲兵に拘束された経歴が、戦後の公職追放を免れる理由にもなる。
      1946年、公職追放された鳩山一郎に代わって自由党の総裁となり、内閣を組織した。

      占領下では、GHQの指示を受けながらも独自の判断を通そうとした。
      再軍備を求める声に対しては、経済の復興を優先して軽武装にとどめる立場をとる。
      安全保障はアメリカに依存し、資源を産業に振り向けるというこの方針は、吉田ドクトリンと呼ばれた。

      1951年のサンフランシスコ講和条約で独立を回復し、同じ日に日米安保条約を結んだ。
      講和はソ連や中国を含まない片面的なもので、国内でも激しい論争になる。
      朝鮮戦争による特需が経済の復興を後押しし、警察予備隊が作られた。
      ワンマンと呼ばれる強い指導で長期政権を築いたが、1954年に退陣する。
      経済を優先し安全保障は同盟に委ねるという選択は、その後の日本の基本路線になった。
      側近から多くの政治家が育ち、吉田学校と呼ばれて後の政権を担った。
      葉巻と白足袋の風貌は、当時の風刺画の定番でもあった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/Yoshida_Shigeru_ca._1950.jpg/500px-Yoshida_Shigeru_ca._1950.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Yoshida_Shigeru_ca._1950.jpg
    links:
      - label: Wikipedia
