  - id: shotoku-taishi
    title: 聖徳太子
    start: 593
    end: 622
    category: politics
    tags: [日本, 飛鳥]
    summary: 家柄ではなく能力と理念で国を運営する形を、冠位十二階と憲法十七条で示した。
    detail: |
      推古天皇のもとで政治に関わったとされる皇族で、593年から622年まで活動した。
      用明天皇の子で、本名は厩戸王と伝えられる。
      日本の国家づくりの出発点に置かれてきた人物である。

      蘇我馬子と協力して推古天皇を支え、国政の中心にいたとされる。
      603年の冠位十二階は、家柄ではなく個人の功績と能力によって位を与える仕組みだった。
      翌604年の十七条憲法は、役人の心構えを説き、和を重んじ、詔をつつしめと教える。
      607年には小野妹子を隋へ送り、日の出る国の天子という書き出しの国書で対等を主張した。

      仏教を厚く信仰し、法隆寺や四天王寺の建立に関わったと伝えられる。
      経典の注釈である三経義疏も、その著作とされてきた。
      仏教を国家の支えとして位置づけた点が、後の時代に大きく影響している。

      近年の研究では、その事績の多くが『日本書紀』の編纂時に理想化された可能性が指摘されている。
      聖徳太子という呼び名も後世のもので、厩戸王としての実像を探る作業が続く。
      それでも、この時期に中国式の制度と仏教が導入されたこと自体は動かない。
      長く紙幣の肖像に使われるなど、日本人が理想の為政者を語るときの原型であり続けてきた。
      斑鳩に宮を構えて移り住み、その周辺に法隆寺が建てられた。
      没後まもなく一族は蘇我入鹿に攻められて滅び、その血筋は絶えている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Sh%C5%8Dtoku_Taishi_Sh%C5%8Dmanky%C5%8D_K%C5%8Dsan.jpg/500px-Sh%C5%8Dtoku_Taishi_Sh%C5%8Dmanky%C5%8D_K%C5%8Dsan.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Sh%C5%8Dtoku_Taishi_Sh%C5%8Dmanky%C5%8D_K%C5%8Dsan.jpg
