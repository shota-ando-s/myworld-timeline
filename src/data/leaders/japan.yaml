  - id: abe-shinzo
    title: 安倍晋三
    start: 2012
    end: 2020
    category: politics
    tags: [日本, 平成, 令和]
    summary: 憲政史上最長の在任で、金融緩和と安全保障法制を進めた。
    detail: |
      2012年から2020年まで首相を務めた政治家で、通算の在任は憲政史上最長になった。
      1954年に生まれ、2022年に銃撃されて死去した。
      祖父は岸信介で、政治家の家系に育っている。

      2006年に一度首相となったが、1年で健康を理由に辞任した。
      2012年に再び政権に就き、その後7年8か月にわたり内閣を率いる。
      経済政策としてアベノミクスを掲げ、大規模な金融緩和、財政出動、成長戦略の三つを柱とした。
      日本銀行が国債を大量に買い入れ、円安と株高が進む。

      安全保障では、集団的自衛権の行使を限定的に認める憲法解釈の変更を閣議決定した。
      2015年に安全保障関連法を成立させ、国会の内外で大きな論争になる。
      特定秘密保護法や共謀罪の新設も、同様に議論を呼んだ。

      外交では、アメリカとの関係を重視しつつ各国を精力的に訪問した。
      TPPの発効を主導し、インド太平洋という地域構想を打ち出している。
      一方で、森友・加計学園や桜を見る会をめぐる問題で、政権運営への批判も強かった。
      2020年、持病の悪化を理由に辞任する。
      長期政権が何を実現し、何を残したかの評価は、今も分かれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Shinz%C5%8D_Abe_20200101.jpg/500px-Shinz%C5%8D_Abe_20200101.jpg
      credit: 首相官邸 / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Shinz%C5%8D_Abe_20200101.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/安倍晋三

  - id: emperor-naruhito
    title: 徳仁天皇
    start: 2019
    ongoing: true
    category: politics
    tags: [日本, 令和]
    summary: 近代では例のない生前退位を受けて即位した、令和の天皇。
    detail: |
      2019年5月に即位した第126代の天皇で、1960年に生まれた。
      父である明仁天皇の生前退位を受けて位に就いた。
      近代の制度のもとでは例のない代替わりだった。

      皇太子時代にはイギリスのオックスフォード大学に留学し、テムズ川の水運を研究した。
      以後も水の問題に関心を持ち続け、国際会議で講演を行っている。
      国連の水と衛生に関する諮問委員会の名誉総裁も務めた。

      即位にあたり、父と同じく国民に寄り添う姿勢を受け継ぐと述べている。
      即位の礼と大嘗祭が行われ、一連の儀式は伝統に沿いながら簡素化も図られた。
      新型コロナウイルスの流行により、就任の直後から行事や訪問は大きく制約される。
      オンラインでの面会や視察が取り入れられ、象徴の務めの形も変化した。

      皇室をめぐっては、継承資格者の減少が現実の問題になっている。
      女性が皇位を継ぐことや、女性宮家の創設をめぐる議論が続く。
      皇族の数が減るなかで、公務をどう担うかという課題も残る。
      象徴天皇の務めをどう続けるかは、この代でも問われ続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Emperor_Naruhito_20250611_%2854582524056%2C_cropped%29.jpg/500px-Emperor_Naruhito_20250611_%2854582524056%2C_cropped%29.jpg
      credit: Presidencia de Guatemala / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emperor_Naruhito_20250611_(54582524056,_cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/徳仁
