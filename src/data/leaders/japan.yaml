  - id: nakasone-yasuhiro
    title: 中曽根康弘
    start: 1982
    end: 1987
    category: economy
    tags: [日本, 民営化]
    summary: 国鉄・電電公社の民営化を進め、日米関係を首脳の個人的な関係で前に出した。
    detail: |
      1982年から1987年まで首相を務めた政治家で、1918年に生まれ2019年に没した。
      行政改革と民営化を進め、日米関係を首脳どうしの個人的な結びつきで前面に出した。
      戦後政治の総決算を掲げている。

      最大の事業は三公社の民営化だった。
      日本電信電話公社と日本専売公社が1985年に、国鉄が1987年に分割民営化される。
      巨額の累積債務を抱えた国鉄の改革は、労働組合との厳しい対立を伴った。
      行政改革を通じて、国家の役割を小さくするという方向が打ち出される。

      対外的には、アメリカのレーガン大統領と互いを愛称で呼び合う関係を築いた。
      防衛費を国民総生産の1パーセント以内に抑える枠を撤廃し、防衛力の強化を進める。
      ソ連への対抗姿勢を明確にし、西側の一員としての立場を強調した。

      一方で、靖国神社への公式参拝は中国と韓国の強い反発を招き、翌年以降は取りやめている。
      在任中に貿易摩擦が激化し、1985年のプラザ合意で急激な円高が進んだ。
      その対策としての金融緩和が、後のバブル経済の背景になる。
      首相の存在感を前面に出す政治の手法は、後の世代にも受け継がれた。
      民営化されたJRとNTTは、現在の日本の交通と通信の基盤になっている。
      首相の在任は5年に及び、戦後では長期政権の一つに数えられる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/8/83/Yasuhiro_Nakasone_19821127.jpg
      credit: 内閣官房内閣広報室 / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Yasuhiro_Nakasone_19821127.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/中曽根康弘

  - id: emperor-akihito
    title: 明仁天皇
    start: 1989
    end: 2019
    category: politics
    tags: [日本, 平成]
    summary: 被災地訪問と慰霊の旅を重ねて象徴天皇の務めを自ら形にし、生前退位を実現した。
    detail: |
      1989年に即位し、2019年に退位した天皇。
      象徴としての天皇の務めを自ら考え、形にしていった。
      近代では例のない生前退位を実現している。

      戦後の民主主義のなかで育ち、皇太子時代には民間出身の女性と結婚した。
      この結婚は広く報じられ、皇室への親しみが広がる契機になる。
      即位にあたり、日本国憲法を守り、国民とともにあることを述べた。

      在位中は各地への訪問を重ねた。
      災害のたびに被災地を訪れ、床に膝をついて被災者に語りかける姿が知られる。
      沖縄・硫黄島・サイパン・パラオなど、戦地となった場所を慰霊のために訪ねた。
      歴史と向き合う姿勢を繰り返し示したことは、国内外で受け止められている。

      2016年、高齢による務めの遂行への懸念をビデオメッセージで表明した。
      これを受けて特例法が作られ、2019年4月に退位して上皇となる。
      天皇の退位は江戸時代の光格天皇以来、約200年ぶりのことだった。
      憲法が定める象徴という抽象的な役割を、実際の行いによって定義した在位だったといえる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1d/Emperor_Akihito_%282016%29.jpg/500px-Emperor_Akihito_%282016%29.jpg
      credit: Malacañang Photo Bureau / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emperor_Akihito_(2016).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/明仁

  - id: koizumi-junichiro
    title: 小泉純一郎
    start: 2001
    end: 2006
    category: politics
    tags: [日本, 構造改革]
    summary: 郵政民営化を争点に党内の抵抗を押し切り、劇場型の政治を定着させた。
    detail: |
      2001年から2006年まで首相を務めた政治家で、1942年に生まれた。
      自民党を変えると訴えて党内の慣行に挑み、構造改革を進めた。
      世論に直接訴える政治の手法を定着させた。

      派閥の推薦によらない総裁選で、地方の党員票を背景に勝利した。
      短い言葉で主張を繰り返し、テレビを通じて支持を広げる。
      聖域なき構造改革を掲げ、特殊法人の整理や道路公団の民営化に取り組んだ。
      先送りされてきた不良債権の処理を進め、金融システムの正常化を図る。

      2005年、郵政民営化法案が参議院で否決されると衆議院を解散した。
      反対した議員の選挙区に対立候補を立て、争点を一つに絞って大勝する。
      民営化は実現したが、この選挙の手法には賛否があった。

      外交では、2002年に北朝鮮を訪問して拉致被害者の帰国を実現した。
      アメリカとの関係を重視し、イラク戦争後に自衛隊を派遣している。
      靖国神社への参拝を続けたため、中国と韓国との関係は冷え込んだ。
      格差の拡大や地方の疲弊は、この時期の改革の副作用として議論が続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/Junichiro_Koizumi_20010426.jpg/500px-Junichiro_Koizumi_20010426.jpg
      credit: 内閣官房内閣広報室 / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Junichiro_Koizumi_20010426.jpg
    links:
      - label: Wikipedia
