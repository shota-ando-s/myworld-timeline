  - id: emperor-shirakawa
    title: 白河上皇
    start: 1086
    end: 1129
    category: politics
    tags: [日本, 院政]
    summary: 退位後に「治天の君」として実権を握る院政を始め、摂関家の力をそいだ。
    detail: |
      院政を始めた天皇で、1073年から1087年まで在位し、退位後は1129年まで実権を握った。
      8歳の子に位を譲り、自らは上皇として政務を執り続けた。
      この形が定着したことで、摂関家の権勢は大きく削られる。
      生まれは1053年、没したのは77歳のときである。

      即位したとき、藤原氏を外戚としない父の後三条天皇が荘園の整理を進めていた。
      白河天皇もその路線を引き継ぎ、摂関家に頼らない政治を志向する。
      退位後は、幼い堀河天皇の後見という立場で人事と財政を握った。
      さらに孫と曽孫の代まで治天の君であり続け、40年以上にわたって朝廷を動かす。

      仏教を厚く信仰し、法勝寺をはじめとする壮大な寺院を次々に造営した。
      造営の費用は受領たちに負担させ、その見返りに官職を与えている。
      熊野への参詣を繰り返し、院の権威を宗教によって高めた。
      一方で、比叡山などの僧兵が強訴のために都へ押し寄せることは抑えられなかった。

      賀茂川の水、双六の賽、山法師だけは思いどおりにならない、と嘆いたと伝えられる。
      裏を返せば、それ以外は思いのままだという自負でもあった。
      身辺を守らせるために武士を登用し、平正盛ら伊勢平氏を引き立てている。
      この起用が、のちに平氏が中央政界へ進出する足がかりになった。
      孫の鳥羽天皇の妃をめぐる逸話など、宮廷の人間関係にまつわる話も多く伝えられる。
      院政という形は、この人物が意図して作ったというより、結果として定着したものだった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0c/%E5%AF%9B%E6%B2%BB%E4%B8%83%E5%B9%B4%E6%98%A5%E6%97%A5%E7%A4%BE%E5%BE%A1%E5%B9%B8%E3%81%AE%E7%99%BD%E6%B2%B3%E9%99%A2.jpg/500px-%E5%AF%9B%E6%B2%BB%E4%B8%83%E5%B9%B4%E6%98%A5%E6%97%A5%E7%A4%BE%E5%BE%A1%E5%B9%B8%E3%81%AE%E7%99%BD%E6%B2%B3%E9%99%A2.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:%E5%AF%9B%E6%B2%BB%E4%B8%83%E5%B9%B4%E6%98%A5%E6%97%A5%E7%A4%BE%E5%BE%A1%E5%B9%B8%E3%81%AE%E7%99%BD%E6%B2%B3%E9%99%A2.jpg
    links:
