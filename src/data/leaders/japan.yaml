  - id: ikeda-hayato
    title: 池田勇人
    start: 1960
    end: 1964
    category: economy
    tags: [日本, 高度成長]
    summary: 所得倍増計画を掲げ、国民の関心を政治対立から経済成長へ移した。
    detail: |
      1960年から1964年まで首相を務めた政治家で、所得倍増計画を掲げた。
      1899年に生まれ、退任の翌年に没している。
      大蔵官僚の出身で、経済政策に通じていた。

      前任の岸信介内閣は、日米安保条約の改定をめぐる激しい反対運動のなかで退陣した。
      国論が二分された直後の就任であり、対立を鎮めることが課題になる。
      池田は寛容と忍耐を掲げ、政治的な争点を避けて経済に焦点を移した。

      所得倍増計画は、10年間で国民所得を2倍にするという目標を示したものである。
      実際には7年で達成され、計画そのものよりも国民の期待を作った効果が大きかった。
      公共投資と産業の育成が進められ、高度成長が加速する。
      貿易の自由化を進め、日本はIMFとGATTのもとで先進国としての義務を引き受けた。

      1964年には経済協力開発機構に加盟し、先進国の一員と認められる。
      同じ年の東京五輪は、戦後復興の到達点を象徴する行事になった。
      池田は五輪の閉会の翌日に病気を理由として辞任する。
      政治の対立よりも経済の成長を優先するという路線は、以後の自民党政権の基本になった。
      所得倍増という言葉は、政治が生活の向上を約束した初めての例として記憶された。
      経済成長そのものが国の目標になったのは、この時期からである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Hayato_Ikeda_19600719.jpg/500px-Hayato_Ikeda_19600719.jpg
      credit: 首相官邸 / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Hayato_Ikeda_19600719.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/池田勇人

  - id: sato-eisaku
    title: 佐藤栄作
    start: 1964
    end: 1972
    category: politics
    tags: [日本, 沖縄]
    summary: 沖縄返還を実現し、非核三原則を国の方針として掲げた。
    detail: |
      1964年から1972年まで、7年8か月にわたって首相を務めた政治家。
      1901年に生まれ、1975年に没した。
      当時としては最長の在任で、沖縄返還を実現している。

      鉄道官僚から政界に入り、兄の岸信介とともに自民党の主流を歩んだ。
      就任時の課題は、高度成長の果実をどう配分するかと、戦後処理の仕上げだった。
      1965年に日韓基本条約を結んで国交を樹立し、植民地支配に関する請求権の問題を一括して処理する。
      この条約の解釈は、その後も両国の間で議論が続いている。

      最大の事業は沖縄の返還だった。
      アメリカとの交渉を重ね、1969年の首脳会談で核抜き本土並みの返還に合意する。
      1972年5月、27年間の米国統治が終わり、沖縄は日本に復帰した。

      1967年には、核兵器を持たず、作らず、持ち込ませずという非核三原則を表明している。
      この功績により、1974年にノーベル平和賞を受けた。
      ただし返還に際して核の持ち込みを認める密約があったことが、後年に明らかになる。
      長期政権のあいだに、公害問題や大学紛争など社会の矛盾も表面化した。
      在任の長さは、のちに安倍晋三が更新するまで戦後最長だった。
      非核三原則は国会決議を経て、日本の基本方針として扱われている。
