  - id: emperor-tenmu
    title: 天武天皇
    start: 673
    end: 686
    category: politics
    tags: [日本, 律令]
    summary: 壬申の乱に勝って豪族を抑え、「天皇」の称号と律令国家の骨格を定めた。
    detail: |
      壬申の乱に勝って即位した天皇で、在位は673年から686年まで。
      天智天皇の弟で、名は大海人。
      天皇の権威を確立し、律令国家の骨格を定めた人物である。

      即位後、大臣を置かず、皇后や皇子とともに政務を執った。
      有力豪族は壬申の乱で力を失っており、天皇に対抗できる勢力はいない。
      684年には八色の姓を定めて氏族の序列を組み替え、天皇との距離で身分を決め直した。
      国家の制度を整える事業が次々に進められた。
      律令の編纂が始まり、死後に飛鳥浄御原令として施行される。
      日本で最初とされる銭貨の富本銭が作られ、都城の造営も構想された。
      国史の編纂を命じたことが、『古事記』と『日本書紀』につながっていく。

      伊勢神宮を重んじ、式年遷宮の制度を定めたとも伝えられる。
      天皇という称号や日本という国号が用いられ始めたのも、この時期と考えられている。
      仏教も国家の保護のもとで整えられ、寺院が官の管理下に置かれた。

      死後、皇后が持統天皇として即位し、事業を引き継いで藤原京を完成させた。
      天皇を中心とする国家という形が、この夫婦の治世でほぼ出来上がっている。
      皇后や皇子を要職に就けた体制は、皇親政治と呼ばれる。
      壬申の乱で味方した地方の豪族も取り立てられ、支配の裾野が広がった。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/b/b9/%E5%A4%A9%E6%AD%A6%E5%A4%A9%E7%9A%87%E5%BE%A1%E5%BD%B1%E3%80%81%E9%87%91%E5%89%9B%E5%B1%B1%E5%AF%BA%E6%89%80%E8%94%B5.jpg
