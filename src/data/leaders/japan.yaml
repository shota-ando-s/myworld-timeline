        url: https://ja.wikipedia.org/wiki/平清盛

  - id: minamoto-yoritomo
    title: 源頼朝
    start: 1185
    end: 1199
    category: politics
    tags: [日本, 鎌倉]
    summary: 京都から独立した統治機構を鎌倉に置き、武家政権の原型を作った。
    detail: |
      鎌倉幕府を開いた武将で、1147年に生まれ1199年に没した。
      平治の乱で父が敗れて伊豆に流され、20年を配流の地で過ごした。
      1180年に挙兵し、京から独立した統治機構を鎌倉に築く。

      以仁王の呼びかけに応じて兵を挙げたが、緒戦の石橋山では大敗した。
      房総へ逃れて再起し、関東の武士団を味方につけて鎌倉に入る。
      富士川の戦いで平氏軍を退けた後も西へは進まず、まず関東の支配を固めた。
      御家人の所領を保証する見返りに従わせる関係を築き、侍所・公文所・問注所を設けて統治の機構を整える。

      平氏の追討は、弟の範頼と義経に委ねられた。
      1185年に平氏が滅びると、頼朝は義経と対立し、その追討を口実として守護と地頭を置く権限を朝廷に認めさせる。
      1189年には奥州藤原氏を滅ぼし、東北まで支配を広げた。
      1192年、後白河法皇の死後に征夷大将軍に任じられる。

      政権の要は、土地の保証と軍役の交換という単純で強い関係にあった。
      京の官職に依存せず、鎌倉に独自の裁判と行政を置いた点が、平氏政権との違いである。
      1199年に急死し、その後は妻の北条政子とその一族が実権を握った。
      血統は3代で絶えたが、頼朝が作った枠組みは武家政権の原型として長く使われた。
      弟の義経や範頼を退けたことは、後世に冷酷さの例として語られてきた。
      恩賞として土地を与え、それを保証するという関係が、武士の忠誠の基盤になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/%E5%B1%B1%E6%A2%A8%E7%B8%A3%E7%94%B2%E5%BA%9C%E5%B8%82%E5%96%84%E5%85%89%E5%AF%BA%E6%BA%90%E8%B3%B4%E6%9C%9D%E6%9C%A8%E5%83%8F.jpg/500px-%E5%B1%B1%E6%A2%A8%E7%B8%A3%E7%94%B2%E5%BA%9C%E5%B8%82%E5%96%84%E5%85%89%E5%AF%BA%E6%BA%90%E8%B3%B4%E6%9C%9D%E6%9C%A8%E5%83%8F.jpg
      credit: 氏子 / CC0
      page: https://commons.wikimedia.org/wiki/File:%E5%B1%B1%E6%A2%A8%E7%B8%A3%E7%94%B2%E5%BA%9C%E5%B8%82%E5%96%84%E5%85%89%E5%AF%BA%E6%BA%90%E8%B3%B4%E6%9C%9D%E6%9C%A8%E5%83%8F.jpg
