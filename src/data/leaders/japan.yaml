        url: https://ja.wikipedia.org/wiki/天武天皇

  - id: emperor-shomu
    title: 聖武天皇
    start: 724
    end: 749
    category: religion
    tags: [日本, 奈良, 仏教]
    summary: 大仏と国分寺に国家の安泰を託し、仏教を統治の道具として全国に配置した。
    detail: |
      奈良時代の第45代天皇で、在位は724年から749年まで。
      仏教に深く帰依し、国家の安泰を仏の力に託した。
      国分寺の建立と東大寺の大仏造立を命じた人物である。
      藤原不比等の娘である光明子を皇后に立て、藤原氏との結びつきを強めた。

      治世は災いの連続だった。
      729年に長屋王が謀反の疑いで自害に追い込まれ、737年には天然痘の流行で政権の中枢にいた藤原四兄弟が相次いで死ぬ。
      740年には藤原広嗣が九州で反乱を起こし、天皇は都を離れて東国へ向かった。
      以後5年のあいだ、恭仁京・紫香楽宮・難波宮と都を移し続ける。
      地震と飢饉も重なり、人々の不安は深まっていた。

      741年、国ごとに国分寺と国分尼寺を建てる詔が出された。
      743年には盧舎那仏の造立が発願され、事業は最終的に平城京の東大寺で進められる。
      行基が民間から寄進と労働力を集め、のべ260万人が関わったと伝えられる。
      仏教によって国を守るという鎮護国家の考えが、ここで最大の形をとった。

      749年に娘の孝謙天皇へ位を譲り、自らは出家した。
      756年に没すると、遺愛の品々が東大寺に献納され、正倉院に伝えられている。
      大事業は財政を圧迫し、律令の土地制度が崩れる一因にもなった。
      信仰と政治が最も強く結びついた治世として記憶されている。
      娘の孝謙天皇は、のちに重祚して称徳天皇となり、僧の道鏡を重用して政界を揺るがした。
      国分寺の跡は今も全国各地に残り、当時の国家の広がりを示している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Emperor_Shomu.jpg/500px-Emperor_Shomu.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emperor_Shomu.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/聖武天皇

  - id: emperor-kanmu
    title: 桓武天皇
    start: 781
    end: 806
    category: politics
    tags: [日本, 平安]
    summary: 平安京への遷都と蝦夷征討で、寺社の影響を断って律令国家を立て直そうとした。
    detail: |
      奈良時代の末から平安時代の初めにかけての天皇で、在位は781年から806年まで。
      平城京を離れて平安京へ都を移し、東北への遠征を進めた。
      律令国家を立て直そうとした強い意志で知られる。
      母は渡来系の氏族の出身だった。

      784年、まず長岡京へ都を移した。
      奈良の大寺院が政治に関与する状況を断ち切る狙いがあったとされる。
      しかし造営を主導した藤原種継が暗殺され、関与を疑われた弟の早良親王が配流の途中で死ぬ。
      その後に続いた不幸が怨霊のたたりとされ、794年に改めて平安京へ移った。

      東北では、蝦夷と呼ばれた人々との戦いが続いていた。
      坂上田村麻呂を征夷大将軍として送り、802年に指導者の阿弖流為を降伏させる。
      胆沢城と志波城が築かれ、支配は北へ広がった。
      国内では、軍団を廃して健児の制に改め、国司の交代を監査する勘解由使を置くなど制度の立て直しを進める。

      805年、造都と征夷という二つの大事業について、続けるべきかが議論された。
      民の負担が限界に達しているという意見を容れ、天皇は双方の中止を決める。
      翌年に没し、平安京は以後1000年以上にわたって都であり続けた。
      最澄と空海を唐へ送ったのもこの治世で、日本仏教の新しい流れがここから始まっている。
      平安京は、唐の長安にならった条坊制の都として造営された。
      怨霊を恐れる感覚はこの時期に強まり、のちの御霊信仰へつながっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Emperor_Kammu_large.jpg/500px-Emperor_Kammu_large.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emperor_Kammu_large.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/桓武天皇

  - id: fujiwara-michinaga
    title: 藤原道長
    start: 995
    end: 1027
    category: politics
    tags: [日本, 藤原氏, 摂関]
    summary: 天皇の外祖父という立場で朝廷を動かし、摂関政治の頂点を築いた。
    detail: |
      摂関政治の全盛を築いた公卿で、966年に生まれ1028年に没した。
      兄たちの相次ぐ死によって思いがけず一族の頂点に立ち、30年余り朝廷を動かした。
      995年に内覧の地位を得てから、実質的な最高権力者であり続ける。

      権力の基盤は、天皇との姻戚関係だった。
      4人の娘を次々に天皇や皇太子に嫁がせ、3代の天皇の外祖父となる。
      1016年には孫が後一条天皇として即位し、自らは摂政に就いた。
      翌年には子の頼通に摂政を譲り、一族の地位を世代を超えて確保している。

      娘の立后を祝う宴で詠んだとされる歌が、この世を自分のものと思う、満月に欠けたところがない、という内容だった。
      日記の『御堂関白記』は自筆本が残り、当時の政務と儀式の様子を伝える一級の史料になっている。
      晩年は浄土信仰に傾き、壮大な法成寺を建てて、阿弥陀像の手と糸で結ばれながら没したと伝えられる。

      道長の時代は、宮廷文化が最も洗練された時期でもあった。
      娘の彰子に仕えた紫式部が『源氏物語』を書き、和泉式部や赤染衛門も同じ場にいる。
      一方で地方の統治は荒れ、荘園をめぐる争いが増えていた。
      子の頼通の代に天皇との姻戚関係が途切れ、摂関家の権勢は急速に翳っていく。
      望月の歌は同時代の貴族の日記に記録されており、当時から有名だった。
      権力の頂点にありながら、自らは関白の職には就いていない。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/7/72/Fujiwara_no_Michinaga_2.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Fujiwara_no_Michinaga_2.jpg
    links:
