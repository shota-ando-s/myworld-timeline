lane: japan

# 天皇・摂関・将軍・首相。同じ時期に別の主体が並ぶ（天皇と将軍など）ときは
# 段が分かれるので、「誰が実権を持っていたか」も帯の重なりから読める。
leaders:
  - id: himiko
    title: 卑弥呼
    start: 180
    startCirca: true
    end: 248
    endCirca: true
    category: politics
    tags: [日本, 邪馬台国]
    summary: 倭の諸国が共立した女王で、中国の史書に名の残る列島最初の統治者。
    detail: |
      『魏志』倭人伝などの中国の史書に記された、倭の女王。
      生年は170年ごろ、没年は248年とされる。
      倭国の諸国が争いのすえに共に立てた王で、邪馬台国を治めたと伝えられる。

      2世紀の末、倭国では長く争乱が続いていた。
      諸国は女性を王に立てることで争いを収めたと史書は記す。
      卑弥呼は鬼道と呼ばれる呪術で人々をまとめ、姿を見せることはほとんどなかった。
      政務の実際は弟が助け、1000人の女性が身の回りに仕えたという。

      239年に魏へ使いを送り、親魏倭王の称号と銅鏡100枚を与えられた。
      南の狗奴国と対立し、魏に助けを求めた記録も残る。
      没したとき、直径百余歩の塚が築かれ、100人以上が殉葬されたと伝わる。
      後を継いだ男王のもとで再び乱れ、13歳の台与が立ってようやく収まった。

      邪馬台国がどこにあったかは、九州説と畿内説が長く対立している。
      奈良の纒向遺跡や箸墓古墳との関係が論じられ、考古学の成果とどう結びつけるかが焦点になってきた。
      名前も、日の巫女や姫御子を音写したものという説がある。
      文字で名の残る列島最初の統治者として、日本史の出発点に置かれる人物である。
      『魏志』倭人伝の記述は、方角と距離が整合せず、位置の特定を難しくしてきた。
      女性が王として共立された事実は、当時の社会での女性の地位を考える手がかりにもなっている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/卑弥呼

  - id: emperor-yuryaku
    title: 雄略天皇
    start: 456
    startCirca: true
    end: 479
    endCirca: true
    category: politics
    tags: [日本, 大和政権]
    summary: 「倭王武」として中国に上表し、大和政権が列島の広い範囲に及んだことを示した。
    detail: |
      5世紀後半の大王で、中国の史書に倭王武として現れる人物にあたるとされる。
      在位は456年ごろから479年ごろまで。
      『日本書紀』では大泊瀬幼武天皇と記される。

      埼玉の稲荷山古墳から出た鉄剣には、ワカタケル大王に仕えたという金象嵌の銘文がある。
      熊本の江田船山古墳の大刀にも同じ名が読み取れる。
      関東と九州の双方で同じ大王の名が確認されたことは、その支配の広がりを示す物証になった。
      文字による記録が現れた最初期の例でもある。

      478年、宋の皇帝に上表文を送り、東と西の各地を平定したと述べて将軍の称号を求めた。
      朝鮮半島南部での立場を認めさせ、高句麗に対抗することが狙いだった。
      国内では有力な豪族を武力で抑え、大王への権力集中を進めたと伝えられる。
      『日本書紀』はその強引さを、しばしば残虐な逸話として書き留めている。

      『万葉集』の巻頭には、この天皇の作とされる歌が置かれている。
      考古資料と中国の史書と国内の伝承が重なる、数少ない古代の人物である。
      この時代にヤマト政権の支配が列島の広域に及んだことは、ほぼ確かだと考えられている。
      『宋書』の武と稲荷山鉄剣のワカタケルと日本書紀の雄略天皇が同一人物だとすれば、三つの史料が一人の上で結びつくことになる。
      初期のヤマト政権の実像を語れるのは、この時代からである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/54/Emperor_Y%C5%ABryaku.jpg/500px-Emperor_Y%C5%ABryaku.jpg
      credit: Published by 三英舎 (San'ei-sha) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emperor_Y%C5%ABryaku.jpg
    links:
