  - id: hojo-yasutoki
    title: 北条泰時
    start: 1224
    end: 1242
    category: society
    tags: [日本, 鎌倉, 法]
    summary: 御成敗式目を定め、武士の慣習を成文法として全国に通用させた。
    detail: |
      鎌倉幕府の第3代執権で、在職は1224年から1242年まで。
      承久の乱では幕府軍の総大将として京へ攻め上った。
      御成敗式目を定め、武士の慣習を成文の法にまとめた人物である。

      執権に就くと、まず政治の進め方を変えた。
      補佐役として連署を置き、有力な御家人から評定衆を選んで合議で決める体制を作る。
      執権の独断を避け、複数の目で裁く形にしたことが、その後の幕府の安定につながった。
      承久の乱の後に増えた所領争いの裁判を、公平に処理する必要も背景にあった。

      1232年、51か条からなる御成敗式目を制定した。
      公家の法や律令とは別に、武家の道理と先例にもとづく基準を示したものである。
      守護の職務、地頭の権限、土地の相続、女性の財産といった実務の問題を具体的に定めた。
      条文は平易に書かれ、武士が自分で読んで理解できることが重視されている。

      1231年の寛喜の飢饉では、米を放出し、飢えて身を売った者の身分の回復を認めた。
      公正で私欲がない人物として、後世の史書や思想家から高く評価されている。
      武家が独自の法を持ったことは、朝廷とは別の秩序が確立したことを意味した。
      式目は、室町・戦国の分国法から江戸の武家諸法度まで、武家法の手本であり続ける。
      式目の名は、朝廷の法に対して武家の裁きの基準という意味を持っている。
      泰時は式目の趣旨を説いた手紙を残しており、その考え方をうかがうことができる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/H%C5%8Dj%C5%8D_Yasutoki.jpg/500px-H%C5%8Dj%C5%8D_Yasutoki.jpg
      credit: 栗原信充(Kurihara Nobumitsu) / Public domain
      page: https://commons.wikimedia.org/wiki/File:H%C5%8Dj%C5%8D_Yasutoki.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/北条泰時

  - id: hojo-tokimune
    title: 北条時宗
    start: 1268
    end: 1284
    category: war
    tags: [日本, 鎌倉, 元寇]
    summary: 二度の元寇を退けたが、恩賞を払えず御家人の不満を残した。
    detail: |
      鎌倉幕府の第8代執権で、在職は1268年から1284年まで。
      18歳で就任し、二度にわたる元の襲来に対処した。
      34歳で没するまで、生涯のほとんどを国防に費やした人物である。

      就任の年、元の皇帝クビライからの国書が届いた。
      服属を求める内容に対し、幕府は返書を出さず、以後の使者も追い返している。
      1275年と1279年には、来日した使者を鎌倉や博多で斬った。
      交渉の余地を断つ強硬な姿勢が、二度の襲来を招いたという見方もある。

      1274年の文永の役では、元と高麗の軍が対馬と壱岐を襲い、博多湾に上陸した。
      集団戦法と火器に苦しめられたが、敵は一日で撤退する。
      幕府は博多湾沿いに石築地を築き、九州の御家人に異国警固番役を課して備えた。
      1281年の弘安の役では14万と号する大軍が押し寄せたが、上陸を阻まれたところへ暴風雨が襲い、壊滅する。

      時宗は禅に深く帰依し、宋から無学祖元を招いて円覚寺を建てた。
      戦没者を敵味方の区別なく弔ったことでも知られる。
      防衛戦であったため新たな土地は得られず、動員された御家人への恩賞は足りなかった。
      この不満が、半世紀後の幕府の滅亡につながっていく。
      二度の襲来を退けたことは、その後の日本の対外意識に長く影響を残した。
      幕府は西国の武士にも動員をかけ、支配の範囲をさらに広げている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/41/TOKIMUNE777.PNG
      credit: 丸山可澄 / Public domain
      page: https://commons.wikimedia.org/wiki/File:TOKIMUNE777.PNG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/北条時宗

  - id: emperor-godaigo
    title: 後醍醐天皇
    start: 1318
    end: 1339
    category: politics
    tags: [日本, 建武の新政]
    summary: 天皇みずからの親政を復活させようとして失敗し、南北朝の分裂を招いた。
    detail: |
      鎌倉幕府を倒し、天皇による親政を復活させようとした天皇。
      1318年に即位し、1339年に吉野で没した。
      南北朝の分裂は、この試みの失敗から生まれている。

      当時の皇位は、二つの系統が交代で継ぐ取り決めのもとにあった。
      後醍醐天皇はこれを不満とし、自らの子孫に継がせるためにも幕府の打倒をめざす。
      1324年と1331年に計画が露見し、隠岐へ流された。
      しかし楠木正成らが各地で抵抗を続け、足利高氏と新田義貞が加わって1333年に幕府は滅びる。

      京に戻った天皇は建武の新政を始めた。
      摂政や関白を置かず、すべての決定を自らの命令によって行う体制を敷く。
      所領の権利も天皇の裁可で確定するとしたため、訴訟が殺到して処理が追いつかなかった。
      恩賞は公家に厚く武士に薄いと受け取られ、幕府を倒した武士の不満が高まる。

      1336年、足利尊氏が京を制圧し、別の天皇を立てた。
      後醍醐天皇は吉野に逃れ、自らこそ正統だと主張して南朝を開く。
      以後56年にわたり二つの朝廷が並び立った。
      理想を掲げながら現実の力関係を読み誤った例として、また幕府を実際に倒した天皇として、評価は大きく分かれている。
      南朝の正統性を説いた北畠親房の『神皇正統記』は、後世の政治思想に影響を与えた。
      明治以降は南朝が正統とされ、この天皇の評価も時代によって揺れ続けた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Emperor_Godaigo_by_Monkan-b%C5%8D_K%C5%8Dshin.jpg/500px-Emperor_Godaigo_by_Monkan-b%C5%8D_K%C5%8Dshin.jpg
      credit: 文観房弘真 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emperor_Godaigo_by_Monkan-b%C5%8D_K%C5%8Dshin.jpg
