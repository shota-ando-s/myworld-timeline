  - id: taira-kiyomori
    title: 平清盛
    start: 1167
    end: 1181
    category: politics
    tags: [日本, 平氏]
    summary: 武士が中央政界の頂点に立てることを実証し、のちの武家政権の先触れになった。
    detail: |
      平安時代の末に政権を握った武将で、1118年に生まれ1181年に没した。
      伊勢平氏の棟梁として保元の乱と平治の乱を勝ち抜き、1167年に太政大臣に上った。
      武士が朝廷の頂点に立った最初の例である。

      保元の乱では後白河天皇方について信任を得た。
      1159年の平治の乱で源義朝を倒し、源氏の勢力を一掃する。
      以後、一族を高位の官職に就け、全国の多くの国の知行権と500を超える荘園を握った。
      娘の徳子を高倉天皇に嫁がせ、生まれた皇子を安徳天皇として即位させて外祖父となる。
      摂関家がとった手法を、武士の家が用いたことになる。

      経済の基盤は日宋貿易だった。
      摂津の大輪田泊を修築して宋の船を迎え入れ、宋銭・陶磁器・書籍を輸入する。
      流入した銭は日本の貨幣経済を大きく前進させた。
      1180年には福原へ遷都を強行したが、反対が強く半年で京へ戻している。

      急激な権勢の拡大は反発を招いた。
      院の近臣が倒平を企てた事件を機に、後白河法皇を幽閉して権力を独占する。
      各地で源氏が挙兵するなか、1181年に熱病で没した。
      4年後に平氏は滅びるが、武士が政権を担えることを示した意義は残る。
      次の源頼朝は、京で権力を握るのではなく鎌倉に独自の政権を置く道を選んだ。
      一族の栄華と没落は『平家物語』に語られ、無常という主題の代名詞になった。
      宋から入った銭は、年貢を銭で納める習慣を生み、経済の仕組みを変えている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Taira_no_Kiyomori%2CTenshiSekkanMiei.jpg/500px-Taira_no_Kiyomori%2CTenshiSekkanMiei.jpg
      credit: 藤原豪信 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Taira_no_Kiyomori,TenshiSekkanMiei.jpg
    links:
