  - id: tanaka-kakuei
    title: 田中角栄
    start: 1972
    end: 1974
    category: politics
    tags: [日本, 日中国交正常化]
    summary: 日中国交正常化と列島改造を進め、利益配分型の政治の典型にもなった。
    detail: |
      1972年から1974年まで首相を務めた政治家で、1918年に生まれ1993年に没した。
      新潟の農家に生まれ、高等小学校を出ただけで建設業から身を起こした。
      学歴も家柄もない立場から首相になり、今太閤と呼ばれる。

      就任してすぐ、中国との国交正常化を実現した。
      北京を訪れて共同声明に署名し、日中の戦争状態の終結を確認する。
      同時に台湾との外交関係は断たれた。

      内政では、日本列島改造論を掲げた。
      新幹線と高速道路で全国を結び、工業を地方に分散させるという構想である。
      公共事業への期待から地価が急騰し、物価も上昇した。
      そこへ1973年の石油危機が重なり、狂乱物価と呼ばれるインフレになる。

      1974年、政治資金の集め方をめぐる報道が相次ぎ、退陣した。
      1976年にはロッキード事件で逮捕され、首相在任中の収賄を問われる。
      有罪判決を受けたが、上告中に死去して裁判は終結した。
      それでも派閥を通じて長く政界に影響力を持ち続けている。
      地元へ利益を還元することで支持を固める手法は、この人物の名とともに語られてきた。
      コンピューター付きブルドーザーと呼ばれた行動力で知られた。
      中国との国交正常化は、米中の接近という国際環境の変化を受けたものでもある。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/c/cf/Kakuei_Tanaka_19720707.jpg
      credit: 内閣官房内閣広報室 / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Kakuei_Tanaka_19720707.jpg
