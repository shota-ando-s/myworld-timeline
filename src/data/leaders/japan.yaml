  - id: ashikaga-takauji
    title: 足利尊氏
    start: 1338
    end: 1358
    category: politics
    tags: [日本, 室町]
    summary: 幕府を京都に置き、朝廷と隣り合わせで武家が政治を担う形を作った。
    detail: |
      室町幕府を開いた武将で、1305年に生まれ1358年に没した。
      将軍であったのは1338年から1358年まで。
      鎌倉幕府を倒す側に回り、次いで後醍醐天皇に背いて自ら幕府を開いた。

      もとは鎌倉幕府の有力御家人で、源氏の名門の当主だった。
      1333年、幕府の命で上洛したが途中で反転し、六波羅探題を攻め落として倒幕の決め手になる。
      建武の新政では厚遇されたが、武士の不満を背負う立場になっていった。
      1335年、北条氏の残党が起こした乱の鎮圧を名目に東国へ下り、そのまま天皇と対立する。

      一度は九州へ追われたが、西国の武士を集めて再び東上した。
      1336年に京を制圧し、光明天皇を立てて建武式目を発表する。
      1338年に征夷大将軍となり、京都に幕府を開いた。
      後醍醐天皇は吉野へ移り、南北朝の並立が始まる。

      政権の運営は、弟の直義が行政を、尊氏が恩賞と軍事を担う分担で始まった。
      しかし両者は対立し、1350年からの観応の擾乱で幕府は二つに割れる。
      弟を倒した後も南朝との戦いは続き、統一を見ないまま没した。
      人柄は気前がよく人望を集めたと伝えられ、敵味方の評価が分かれる人物である。
      征夷大将軍に任じられたのは、京を制圧してから2年後のことだった。
      室町幕府は、この後およそ240年続くことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Ashikaga_Takauji_J%C5%8Ddo-ji.jpg/500px-Ashikaga_Takauji_J%C5%8Ddo-ji.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ashikaga_Takauji_J%C5%8Ddo-ji.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/足利尊氏

  - id: ashikaga-yoshimitsu
    title: 足利義満
    start: 1368
    end: 1408
    category: politics
    tags: [日本, 室町, 日明貿易]
    summary: 南北朝を合一し、明との朝貢貿易で幕府の財政と権威を同時に固めた。
    detail: |
      室町幕府の第3代将軍で、1358年に生まれ1408年に没した。
      将軍であったのは1368年から1394年までだが、退いた後も出家して実権を握り続けた。
      南北朝の合一を実現し、幕府の権威を最も高めた人物である。

      幼くして将軍となり、管領の細川頼之に補佐されて育った。
      成人すると、力を持ちすぎた守護を次々に討伐する。
      11か国を領した山名氏や、西国と海上交易を押さえた大内氏を抑え、将軍の優位を確立した。
      京都の室町に花の御所と呼ばれる壮麗な邸宅を構え、幕府の呼び名の由来になっている。

      1392年、南朝の後亀山天皇に神器を譲らせて南北朝の合一を実現した。
      56年続いた分裂が終わり、内乱の名目は消える。
      義満は武家でありながら太政大臣に就き、公家の頂点にも立った。
      出家後も政治を動かし、朝廷の儀礼と人事にまで影響を及ぼしている。

      1401年に明へ使者を送り、1404年から勘合を用いた貿易が始まった。
      明の皇帝から日本国王に封じられる形をとったことは、後世に批判されている。
      しかし輸入された銅銭と生糸は幕府の財源となり、文化にも影響を与えた。
      北山に建てた金閣は、公家・武家・禅の様式を重ねた建築として、この時代の性格を象徴している。
      金閣は1950年に放火で焼失し、現在の建物は再建されたものである。
      将軍の地位を子に譲った後も実権を握る形は、院政と似た構図をとっていた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Yoshimitsu_Ashikaga_cropped.jpg/500px-Yoshimitsu_Ashikaga_cropped.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Yoshimitsu_Ashikaga_cropped.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/足利義満

  - id: ashikaga-yoshimasa
    title: 足利義政
    start: 1449
    end: 1473
    category: culture
    tags: [日本, 室町, 東山文化]
    summary: 政務を離れて東山文化を育てる一方、後継争いが応仁の乱の引き金になった。
    detail: |
      室町幕府の第8代将軍で、1436年に生まれ1490年に没した。
      将軍であったのは1449年から1473年まで。
      政務から離れて文化に傾倒し、その一方で後継争いが応仁の乱の引き金になった。

      8歳で将軍に就き、当初は母や側近が政治を左右した。
      土一揆が頻発し、飢饉のさなかにも造営を続けたため批判を受ける。
      1467年に始まる応仁の乱では、有効な調停ができないまま京が焼けていった。
      戦乱の最中も酒宴と作庭を続けたと伝えられ、政治家としての評価は低い。

      後継問題はその発端の一つになった。
      子がないため弟の義視を後継に立てたが、直後に妻の日野富子が義尚を産む。
      家督をめぐる対立が、畠山氏と斯波氏の相続争い、細川と山名の勢力争いと結びついて大乱になった。

      乱の後、義政は東山に山荘を築いて移り住んだ。
      そこに建てた銀閣と東求堂は、床の間や違い棚を備えた書院造の代表として今に残る。
      茶の湯、生け花、能、水墨画、作庭が結びついた東山文化は、この人物の周囲で育った。
      和室の様式や茶の作法など、現在の日本の生活文化の多くがここに源を持つ。
      政治の失敗と文化の達成が、これほど明確に分かれた為政者は珍しい。
      銀閣に銀は使われておらず、その呼び名は後世につけられたものである。
      妻の日野富子は金融と米の売買で富を蓄え、政治にも関与した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e0/Ashikaga_Yoshimasa.jpg/500px-Ashikaga_Yoshimasa.jpg
      credit: 伝土佐光信 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ashikaga_Yoshimasa.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/足利義政

  - id: oda-nobunaga
    title: 織田信長
    start: 1568
    end: 1582
    category: politics
    tags: [日本, 戦国, 天下統一]
    summary: 寺社や座の特権を実力で壊し、身分や伝統によらない支配の道を開いた。
    detail: |
      戦国時代を終わらせる道筋をつけた武将で、1534年に生まれ1582年に没した。
      尾張の小さな大名の家に生まれ、天下統一の目前まで進んだ。
      旧来の権威や特権を実力で壊した点に、その特徴がある。

      1560年、桶狭間で今川義元を討って名を上げた。
      美濃を攻略して拠点を移し、1568年に足利義昭を奉じて京へ入る。
      将軍を立てて号令する形をとったが、やがて対立し、1573年に義昭を追放して室町幕府を終わらせた。
      包囲網を組んだ浅井・朝倉を滅ぼし、武田氏を長篠で破っている。

      敵対した宗教勢力には容赦しなかった。
      1571年に比叡山延暦寺を焼き討ちし、石山本願寺とは10年にわたって戦う。
      伊勢長島や越前の一向一揆では、大量の殺戮が行われた。
      中世を通じて武力と特権を持っていた寺社勢力は、ここで力を失う。

      経済では、楽市楽座で商人の自由な営業を認め、関所を撤廃して物流を促した。
      安土に壮大な城を築き、城下に人を集めている。
      家柄にとらわれず、秀吉のように身分の低い者も能力で登用した。
      1582年、統一を目前にして家臣の明智光秀に本能寺で討たれる。
      既存の秩序を壊す役割を果たし、その上に秀吉と家康が新しい体制を築いた。
      天下布武という印章を用い、武力による統一の意思を明確に示した。
      宣教師を保護したのも、仏教勢力への対抗という側面があったとされる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/5/5a/Oda_Nobunaga_Kaou_3.jpg
      credit: 織田信長 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Oda_Nobunaga_Kaou_3.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/織田信長

  - id: toyotomi-hideyoshi
    title: 豊臣秀吉
    start: 1582
    end: 1598
    category: politics
    tags: [日本, 天下統一]
    summary: 検地と刀狩で武士と農民を分け、近世の身分の枠組みを作り直した。
    detail: |
      戦国の争乱を終わらせて全国を統一した武将で、1537年に生まれ1598年に没した。
      尾張の農民の家に生まれ、織田信長に仕えて出世を重ねた。
      身分の低い出自から天下人になった、日本史でも例外的な人物である。

      1582年に信長が本能寺で討たれると、遠征先から驚くべき速さで引き返して明智光秀を破った。
      続く後継者争いにも勝ち、信長の事業を引き継ぐ立場を確立する。
      1585年に関白、翌年に太政大臣となり、豊臣の姓を与えられた。
      武家の棟梁としてではなく、朝廷の官職によって全国に命令する形をとっている。
      1590年、小田原の北条氏を降して統一を完成させた。

      統治の柱は検地と刀狩だった。
      全国の田畑を同じ基準で測り、生産力を石高で表して年貢と軍役の基準にする。
      1588年の刀狩令で農民から武器を取り上げ、身分を移ることも禁じた。
      武士と農民を分ける兵農分離が、ここで制度として固まる。

      晩年は朝鮮への出兵を二度行い、いずれも失敗した。
      膨大な戦費と兵の損失は豊臣政権を弱らせ、大名のあいだに亀裂を生む。
      1598年に没し、幼い子を残したことで、2年後の関ヶ原につながった。
      中世の身分秩序が流動的だったことを示す存在であり、その流動性を自ら封じた為政者でもある。
      関白という朝廷の官職を用いたため、この政権は武家の幕府とは形を異にする。
      伏見や大坂に築いた城と、黄金の茶室は、その権勢を象徴するものだった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Toyotomi_Hideyoshi_Kaou.svg/500px-Toyotomi_Hideyoshi_Kaou.svg.png
      credit: 百楽兎 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Toyotomi_Hideyoshi_Kaou.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/豊臣秀吉

  - id: tokugawa-ieyasu
    title: 徳川家康
    start: 1603
    end: 1616
    category: politics
    tags: [日本, 江戸, 幕府]
    summary: 260年続く幕藩体制を設計し、戦国の世に長い平和をもたらした。
    detail: |
      江戸幕府を開いた武将で、1543年に生まれ1616年に没した。
      将軍であったのは1603年から1605年までだが、大御所として死まで実権を握った。
      260年続く体制を設計した人物である。

      三河の小さな大名の子に生まれ、幼少期を今川氏の人質として過ごした。
      桶狭間の後に自立して織田信長と同盟を結び、東海に勢力を広げる。
      秀吉とは小牧・長久手で戦った後に臣従し、関東への移封を受け入れて江戸を本拠とした。
      この移封が、結果として広大な直轄地と新しい都市の基盤を与えることになる。

      1600年の関ヶ原で勝利し、1603年に征夷大将軍となった。
      わずか2年で子の秀忠に譲り、将軍職が徳川家のものであることを明示する。
      1615年の大坂の陣で豊臣氏を滅ぼし、対抗勢力を一掃した。

      同じ年に武家諸法度と禁中並公家諸法度を定め、大名と朝廷の行動を規定した。
      大名の配置を親藩・譜代・外様に分け、要所を固めている。
      貿易には積極的で、外交顧問を置き、朱印船を各地へ送った。
      家臣や側近に学問を奨励し、儒学を体制の支えとして位置づけている。
      長い戦乱のあとにどう平和を維持するかという問いに、制度で答えた為政者だった。
      死後は東照大権現として日光に祀られ、幕府の権威の源として扱われた。
      健康に気を配り、長命だったことも、体制を固める時間を与えている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/Ka%C5%8D_of_Tokugawa_Ieyasu.svg/500px-Ka%C5%8D_of_Tokugawa_Ieyasu.svg.png
      credit: 徳川家康 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ka%C5%8D_of_Tokugawa_Ieyasu.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/徳川家康

  - id: tokugawa-iemitsu
    title: 徳川家光
    start: 1623
    end: 1651
    category: politics
    tags: [日本, 江戸]
    summary: 参勤交代と貿易の制限で、幕府の支配を仕組みとして固定した。
    detail: |
      江戸幕府の第3代将軍で、在職は1623年から1651年まで。
      生まれたときすでに徳川の世であり、戦を知らない最初の将軍だった。
      幕府の支配を制度として固定した人物である。

      大名に対しては、自分は生まれながらの将軍であると宣言したと伝えられる。
      1635年の武家諸法度で参勤交代を制度化し、大名に1年おきの江戸滞在を義務づけた。
      妻子は江戸に置かれ、往復の費用と江戸の屋敷の維持が大名の財政を圧迫する。
      違反や後継の不備を理由に改易も多く行われ、幕府の力は明確に示された。

      対外政策では、キリスト教の禁止と貿易の統制を徹底した。
      日本人の海外渡航と帰国を禁じ、1637年の島原の乱の後にポルトガル船の来航を停止する。
      1641年にはオランダ商館を長崎の出島へ移し、窓口を限定した。

      統治の仕組みも整えられた。
      老中・若年寄・奉行の役職が固まり、合議によって政務が進む形になる。
      寺請制度によって、人々はいずれかの寺に所属することが求められた。
      日光東照宮を壮大に造営し、家康を神として祀って権威の源とする。
      将軍個人の力量ではなく、機構によって国が回る体制が、この代で完成した。
      参勤交代は街道と宿場の整備を促し、江戸の巨大な消費を生んだ。
      大名行列の費用が各藩の財政を圧迫したことは、幕府の狙いどおりでもあった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b7/Iemitu.jpg/500px-Iemitu.jpg
      credit: 投稿者がファイル作成 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Iemitu.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/徳川家光

  - id: tokugawa-tsunayoshi
    title: 徳川綱吉
    start: 1680
    end: 1709
    category: society
    tags: [日本, 江戸, 文治]
    summary: 生類憐みの令に象徴される文治政治で、武力から儀礼と学問へ重心を移した。
    detail: |
      江戸幕府の第5代将軍で、在職は1680年から1709年まで。
      武力ではなく学問と儀礼を重んじる文治政治へ舵を切った。
      生類憐みの令で知られ、犬公方とも呼ばれた。

      就任の当初は、有能な人材を登用して幕政を引き締めた。
      不正のあった大名や代官を処分し、財政の監査を厳しくしている。
      儒学を重んじて湯島に聖堂を建て、自ら経書を講じた。
      武士に求められる能力が、戦の腕から学識と行政へ移っていく。

      1685年以降、生き物の殺生を戒める一連の法令が出された。
      犬の保護が特に厳しく、違反者が処罰されたため悪法として語られてきた。
      一方で、捨て子や病人の遺棄を禁じる内容も含まれ、命を軽んじる戦国以来の気風を改める効果もあった。
      近年は、この側面を評価する研究も増えている。

      財政は、鉱山の産出の減少と大火の復興費用で悪化した。
      荻原重秀の建議で貨幣の金の含有量を減らして差益を得たが、物価の上昇を招く。
      治世の中ごろは経済が活気づき、上方の町人による元禄文化が花開いた。
      1702年の赤穂事件では、主君の仇を討った浪士の処遇が幕府の原則を問う問題になる。
      武断から文治への転換を、良くも悪くも体現した将軍だった。
      赤穂浪士の処分は、幕府の法と武士の名誉が衝突した事例として長く論じられた。
      学問を奨励したことは、その後の武士の教養のあり方を決めている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/Tsunyaoshi.jpg/500px-Tsunyaoshi.jpg
      credit: 土佐光起 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tsunyaoshi.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/徳川綱吉

  - id: tokugawa-yoshimune
    title: 徳川吉宗
    start: 1716
    end: 1745
    category: politics
    tags: [日本, 江戸, 享保の改革]
    summary: 倹約と新田開発で財政を立て直し、漢訳洋書の輸入を認めて実学に道を開いた。
    detail: |
      江戸幕府の第8代将軍で、在職は1716年から1745年まで。
      紀州藩主から迎えられ、幕府の中興の祖と呼ばれる。
      財政の立て直しと実用の学問の奨励で知られる。

      就任時、幕府の財政は深刻な赤字だった。
      吉宗は自ら質素な生活を示し、支出を切り詰める。
      大名に石高に応じて米を献上させる上米の制を設け、その代わりに参勤交代の負担を軽くした。
      新田開発を奨励し、年貢の取り方を豊凶によらない定免法に改めて収入を安定させる。

      人事では、役職に応じて不足分の禄を補う足高の制を導入した。
      家格の低い者でも要職に就けるようになり、大岡忠相らが登用される。
      目安箱を設けて庶民の投書を受け、小石川養生所や町火消の制度が生まれた。
      裁判の基準として公事方御定書を編み、判例にもとづく運用を整えている。

      キリスト教に関わらない漢訳の洋書の輸入を認め、実学への道を開いた。
      これが後の蘭学の発展につながる。
      サツマイモの栽培を広めさせ、飢饉への備えとした。
      一方で年貢の増徴は農民の負担を重くし、一揆が増えている。
      米の値段の調整に腐心したことから、米将軍とも呼ばれた。
      紀州藩の藩政で得た経験が、幕政の改革にそのまま生かされている。
      将軍を退いた後も、大御所として政治に関与し続けた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Tokugawa_Yoshimune.jpg/500px-Tokugawa_Yoshimune.jpg
      credit: 狩野忠信 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tokugawa_Yoshimune.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/徳川吉宗

  - id: tanuma-okitsugu
    title: 田沼意次
    start: 1772
    end: 1786
    category: economy
    tags: [日本, 江戸]
    summary: 商業の活力を財源に取り込もうとした異色の政策で、賄賂批判を受けて失脚した。
    detail: |
      江戸中期の老中で、1772年から1786年まで幕政を主導した。
      将軍の側近から出世し、側用人と老中を兼ねるという異例の立場にあった。
      商業の活力を財源に取り込もうとした点で、それまでの幕政と異なる。

      従来の幕府は、年貢米を収入の柱としていた。
      意次は、成長していた商業と流通に課税することを考える。
      株仲間を公認して営業の独占を認め、その代わりに運上金や冥加金を納めさせた。
      銅座や真鍮座を設けて専売の利益を得て、南鐐二朱銀を発行して金銀の交換を円滑にしている。

      開発と貿易にも積極的だった。
      印旛沼と手賀沼の干拓に着手し、蝦夷地の開発とロシアとの交易を調査させる。
      長崎では、俵物と呼ばれる海産物の輸出を増やして金銀の流出を抑えた。
      学問や蘭学に寛容で、平賀源内らが活動できる空気もあった。

      一方で、利権をめぐって賄賂が横行し、武士の気風が乱れたと批判される。
      1782年からの天明の飢饉と浅間山の噴火が重なり、一揆と打ちこわしが頻発した。
      後ろ盾だった将軍家治の死とともに失脚し、所領も削られる。
      政策は次の松平定信によってほとんど否定された。
      近年は、商品経済の現実に対応しようとした先駆的な試みとして再評価されている。
      失脚の背景には、譜代大名たちの反発という政治的な事情もあった。
      蝦夷地への関心は、ロシアの南下を意識した最初期の対応でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Tanuma_Okitsugu2.jpg/500px-Tanuma_Okitsugu2.jpg
      credit: 鈴木白華 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tanuma_Okitsugu2.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/田沼意次

  - id: matsudaira-sadanobu
    title: 松平定信
    start: 1787
    end: 1793
    category: politics
    tags: [日本, 江戸, 寛政の改革]
    summary: 緊縮と統制に引き戻す改革で、田沼期の商業重視を否定した。
    detail: |
      江戸後期の老中で、寛政の改革を6年にわたって主導した人物。
      白河藩主として天明の飢饉を乗り切った実績を買われて登用された。
      田沼期の商業重視を否定し、緊縮と統制へ引き戻した人物である。

      吉宗の孫にあたり、質素と勤勉を旨とする政治を志した。
      各地に米を蓄えさせる囲米を命じ、飢饉への備えを制度にする。
      江戸に流入した農民を村へ帰す旧里帰農令を出し、荒れた耕地の回復を図った。
      旗本と御家人を救うため、札差への借金を帳消しにする棄捐令も出している。

      江戸では、石川島に人足寄場を設けて無宿人に職業訓練を施した。
      町の費用を節約させ、その一部を積み立てて災害に備える仕組みも作っている。
      一方で、風俗と出版の統制を強め、洒落本や黄表紙の作者が処罰された。
      朱子学以外の学問を幕府の学問所で講じることを禁じ、思想の統一も図る。

      改革は財政を立て直したが、あまりに厳しく、庶民の不満を招いた。
      白河の清らかさより田沼の濁りが恋しい、という狂歌がそれをよく表している。
      天皇の父に尊号を贈る件で朝廷と対立し、6年で老中を辞めた。
      経済の成長に対応するのではなく、理想の農本社会へ戻そうとした改革として評価されている。
      定信は随筆や自叙伝を残しており、その政治観を直接知ることができる。
      改革の路線は辞任後もしばらく受け継がれ、幕府の基本方針であり続けた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5e/Matsudaira_Sadanobu.jpg/500px-Matsudaira_Sadanobu.jpg
      credit: 松平定信（自画像） / Public domain
      page: https://commons.wikimedia.org/wiki/File:Matsudaira_Sadanobu.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/松平定信

  - id: tokugawa-yoshinobu
    title: 徳川慶喜
    start: 1866
    end: 1867
    category: politics
    tags: [日本, 江戸, 大政奉還]
    summary: 自ら政権を朝廷に返し、内戦を最小限にとどめて幕府を畳んだ最後の将軍。
    detail: |
      江戸幕府の最後の将軍で、在職は1866年末から1867年末までのおよそ1年。
      1837年に水戸藩主の子として生まれ、一橋家を継いだ。
      自ら政権を朝廷に返上し、内戦を最小限にとどめて幕府を畳んだ。

      若いころから英明との評判が高く、将軍の後継をめぐる争いの一方の候補だった。
      将軍後見職として京都で政局に関わり、朝廷と幕府の間を調整する立場にあった。
      1866年、第二次長州征討の失敗のさなかに将軍となる。
      フランスの支援を受けて軍制と財政の改革に着手し、幕府の立て直しを図った。

      しかし薩摩と長州は武力での倒幕に傾いていた。
      1867年、土佐藩の建白を受け入れ、慶喜は政権を朝廷に返すと申し出る。
      諸藩が合議する新しい政治体制のなかで、徳川家が主導権を保つ狙いがあったとされる。
      これに対し、薩長は王政復古の大号令を発し、徳川家から官職と領地を取り上げる決定を下した。

      1868年の鳥羽伏見の戦いに敗れると、慶喜は大坂から江戸へ戻り、恭順の姿勢を示す。
      勝海舟と西郷隆盛の交渉で江戸城は戦わずに明け渡された。
      以後は政治から退き、静岡で趣味に没頭して1913年まで生きている。
      最後まで戦えば長期の内戦になった可能性を考えると、その退き方は重要な選択だった。
      写真や自転車を好み、晩年は趣味に生きた姿がよく知られている。
      最後の将軍が長く生き、近代の日本を見届けたことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7b/Tokugawa_Yoshinobu_as_Shogun.jpg/500px-Tokugawa_Yoshinobu_as_Shogun.jpg
