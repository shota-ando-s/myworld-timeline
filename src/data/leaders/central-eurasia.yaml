lane: central-eurasia

# 草原の遊牧国家の君主。定住国家と違って本拠が動くので、
# 「いつ誰が草原をまとめていたか」が周りのレーンの動きと直結する。
leaders:
  - id: modu-chanyu
    title: 冒頓単于
    start: -209
    end: -174
    category: war
    tags: [匈奴]
    summary: 草原の諸部族を初めて一つの帝国にまとめ、漢を和親策に追い込んだ。
    detail: |
      匈奴の単于・頭曼の長男。
      父が寵姫の子を後継にしようとして月氏へ人質に出されたが、脱出して戻ったと『史記』は伝える。
      帰国後、鏑矢を放った先を全員が射よと命じ、従わない者を斬る訓練を重ねて、自分の愛馬にも妻にも矢を向けさせる部隊を作りあげた。
      前209年、その部隊に父を射させて単于となる。
      東胡が名馬と妻を要求してきたときは平然と与え、相手が油断したところで攻め滅ぼした。
      次いで西の月氏を破って河西回廊から追い、北は丁零、南はオルドスまで押さえて、草原で初めて広域をひとつの権力のもとに束ねた。
      前200年、白登山で漢の高祖を七日間包囲する。
      漢は陳平の計で包囲の一角を開かせて脱出し、以後は和親を受け入れた。
      絹・酒・米を毎年贈り、皇女を単于に嫁がせる。
      中華の王朝が遊牧の君主に贈り物をして平和を買う関係がここで始まった。
      高祖の死後、冒頓が呂后に婚姻を持ちかける無礼な書簡を送りつけた一件も、漢が耐えるしかなかった当時の力関係を示している。
      統治では、単于の直轄地を中心に左右の賢王が東西を分け持ち、その下に万騎長・千長・百長を置いた。
      遊牧民を十進法の軍事単位に編成するこの仕組みは、千年後のチンギス・ハンの千戸制まで形を変えて受け継がれる。
      前174年に没し、子の老上単于が月氏へのとどめを刺した。
      冒頓の事績は、司馬遷の『史記』匈奴列伝に依拠している。
      漢の側から書かれた記録であり、父殺しや鏑矢の逸話には、残忍な異民族という像を作る意図が混じっている可能性が指摘される。
      それでも、彼が草原に統一権力を出現させたこと自体は疑われていない。
      匈奴という名は以後、中国の北方に現れる強力な遊牧勢力の代名詞となり、西洋のフンとの関係も長く論じられてきた。
      モンゴルでは近年、チンギス・ハン以前に草原を統一した人物として再評価が進んでいる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/P%C4%B1narba%C5%9F%C4%B1_1.JPG/500px-P%C4%B1narba%C5%9F%C4%B1_1.JPG
      credit: Vikiçizer / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:P%C4%B1narba%C5%9F%C4%B1_1.JPG
