  - id: mongke
    title: モンケ
    start: 1251
    end: 1259
    category: war
    tags: [モンゴル]
    summary: 西アジアと南宋への二正面作戦を進め、その死が帝国分裂の引き金になった。
    detail: |
      モンゴル帝国の第4代君主（在位・1251〜1259）。
      トルイの長男でチンギス・ハンの孫にあたり、バトゥの西方遠征に加わって実戦を積んだ。
      オゴデイ家のグユクが急死したあと、バトゥの強い後押しで即位する。
      チンギスの末子の家系が帝位を握ったこの交代は、オゴデイ家とチャガタイ家の反発を招き、即位直後に大規模な粛清が行われた。

      統治者としては引き締めの人だった。
      駅伝の濫用を禁じ、恣意的な徴発をやめさせ、華北・中央アジア・イランのそれぞれで人口調査を行って税制を整えている。
      宗教には寛容で、カラコルムの宮廷でキリスト教・イスラム・仏教の代表を集めて討論させたことが、フランス王の使節ルブルックの旅行記に記録されている。

      対外的には二正面の大遠征を進めた。
      弟フレグを西アジアへ送り、1258年にバグダードを攻略させてアッバース朝を滅ぼす。
      もう一人の弟クビライと自らは南宋へ向かった。
      1259年、四川の釣魚城を攻めている陣中で没する。

      この死が帝国の転機になった。
      後継をめぐってクビライとアリクブケが争い、四年にわたる内戦となる。
      表面上はクビライが勝ったが、以後カアンの権威は全体に及ばなくなり、各ウルスは事実上の独立国として動き出した。
      モンケは、ユーラシアの大半を一人の君主が実際に統治した最後の人物といえる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/2/2c/M%C3%B6ngke_Khan.jpg
      credit: Abdullâh Sultân (atelier). Shîrâz / CC0
      page: https://commons.wikimedia.org/wiki/File:M%C3%B6ngke_Khan.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モンケ

  - id: timur-reign
    title: ティムール
    start: 1370
    end: 1405
    category: war
    tags: [ティムール朝, サマルカンド]
    summary: 破壊と建設を同時に行い、サマルカンドを世界有数の都市に育てた。
    detail: |
      14世紀後半から15世紀初めにかけて中央アジアから西アジアを席巻した征服者（在位・1370〜1405）。
      モンゴル系バルラス部の小領主の家に生まれ、若いころの戦いで右足と右腕を傷めたため、ペルシア語で「跛者のティムール」と呼ばれた。
      ヨーロッパでのタメルランの名はこれが訛ったものである。

      チャガタイ・ウルスの分裂に乗じて頭角を現し、1370年にサマルカンドを拠点として政権を樹立した。
      以後35年にわたりほぼ絶え間なく遠征を続ける。
      東はモグーリスタン、西はイラン・イラク・シリア、北はジョチ・ウルス、南は北インドに及んだ。
      1398年にデリーを攻略し、1402年のアンカラの戦いではオスマン帝国のバヤズィト1世を捕虜としている。

      抵抗した都市への処置は極端だった。
      イスファハーンやバグダードでは頭蓋を積み上げた塔が築かれたと記録される。
      一方で降伏した町は比較的穏当に扱われ、恐怖そのものを統治の道具として使った。
      破壊と並行して建設にも熱心で、征服地から集めた職人にサマルカンドのモスクやマドラサを造らせている。

      チンギス・ハンの血を引かないため、ハンではなく「大アミール」を称した。
      チャガタイ家の人物を名目上のハンに立て、その一族の娘を妃に迎えて「ハンの婿」の称号も用いている。
      1405年、明への遠征に出た途上で病没した。
      中央アジアの破壊者と見るか文化の保護者と見るかで評価は割れ、ウズベキスタンでは独立後、国家の象徴として騎馬像が立てられた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/43/Tamerlan.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tamerlan.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール

  - id: esen-taishi
    title: エセン・ハン
    start: 1439
    end: 1454
    category: war
    tags: [オイラト, 土木の変]
    summary: 明の皇帝を捕虜にし、遊牧勢力がなお中華を脅かせることを見せつけた。
    detail: |
      15世紀半ばにモンゴル高原をまとめたオイラトの首長（在位・1439〜1454）。
      父トゴンの跡を継ぎ、東のハルハや女真、西のモグーリスタンにまで影響を広げた。
      チンギス・ハンの血を引かない家系だったため、名目上の君主としてトクトア・ブハを立て、自らは太師（タイシ）として実権を握っている。

      明との関係は交易から崩れた。
      オイラトは馬を献上して見返りの品を得る朝貢貿易を重ねていたが、使節の人数を水増しして利を得ようとし、明の宦官王振がこれを値切って拒んだことが対立を招く。
      1449年、エセンは大同方面へ侵攻した。
      王振に促された正統帝はみずから大軍を率いて出陣するが、補給も指揮も乱れ、土木堡で包囲されて壊滅し、皇帝自身が捕虜となった（土木の変）。

      明は弟を新帝に立てて交渉に応じず、北京の防衛を固めた。
      エセンは北京を囲んだものの兵部尚書于謙の守りを破れず、翌年に正統帝を無条件で送り返している。
      1453年には自らハンを称したが、チンギス裔でない者の僭称として草原の諸部から強い反発を招き、翌年に部下の反乱で殺された。

      土木の変は明にとって転換点となった。
      以後、北方への遠征をやめて長城の修築に徹する守りの姿勢が定着する。
      今日見られる磚積みの万里の長城は、この時代以降に築かれたものである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/ESENTAISH_KHAAN.jpg/500px-ESENTAISH_KHAAN.jpg
      credit: Avishay / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:ESENTAISH_KHAAN.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エセン_(オイラト)

  - id: ulugh-beg-reign
    title: ウルグ・ベク
    start: 1447
    end: 1449
    category: science
    tags: [ティムール朝, 天文学]
    summary: 自ら天文台を築いて星表を作った学者君主で、政争のなかで殺された。
    detail: |
      ティムール朝の第4代君主（在位・1447〜1449）で、天文学者としても知られる。
      本名はムハンマド・タラガイ。
      ティムールの孫にあたり、「偉大な君主」を意味する通称で呼ばれた。

      1409年、父シャー・ルフがヘラートを本拠に王朝を立て直すと、十五歳でサマルカンドとマー・ワラー・アンナフルの統治を任された。
      以後四十年、この地の実質的な支配者として過ごす。
      彼の関心は統治より学問にあり、壮麗なマドラサを建て、数学者・天文学者を招き、1420年代には巨大な六分儀を備えた天文台を築いた。
      1018個の星の位置を測り直した星表を完成させ、一年の長さを現在の値と25秒ほどしか違わない精度で求めている。

      一方、軍事と政治では失敗が続いた。
      北方のウズベクへの遠征に敗れ、部族の有力者や保守的な宗教勢力の支持を失っていく。
      学問への傾倒が、彼らには統治の怠慢と映った。
      1447年に父が没して君主の座に就いたが、王族間の争いを抑えられず、在位わずか二年で子のアブドゥッラティーフに背かれて廃位される。

      メッカ巡礼へ向かう途上で刺客に殺された。
      天文台は放棄されて破壊されたが、星表は写本で西へ伝わり、17世紀にオックスフォードで刊行されている。
      学問への貢献と統治者としての失敗が並存する生涯は、権力と知の関係を考えるときにしばしば引かれる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/1987_CPA_5876.jpg/500px-1987_CPA_5876.jpg
      credit: Scanned and processed by Mariluna / Public domain
      page: https://commons.wikimedia.org/wiki/File:1987_CPA_5876.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウルグ・ベク

  - id: dayan-khan
    title: ダヤン・ハン
    start: 1480
    startCirca: true
    end: 1517
    endCirca: true
    category: politics
    tags: [モンゴル]
    summary: 分裂していたモンゴルを一時まとめ直し、以後の部族編成の原型を作った。
    detail: |
      15世紀末から16世紀初めにかけてモンゴルを再統一したハン。
      当時の高原は、オイラトのエセンが倒れたあと、チンギス裔の諸勢力が争う分裂状態にあった。
      ハンの位は名目だけになり、各部族の実力者が実権を握っている。

      ダヤン・ハーンは幼くして父を失い、養母となったマンドハイ・ハトゥンに守られて育った。
      彼女は自ら軍を率いてオイラトを討ち、幼いこの少年をハンに立てて後見したと年代記は伝える。
      成人したダヤンはハン位を脅かす有力者を退け、1470年代から1510年代にかけて諸部族を一つずつ服属させていった。

      最大の事業は、モンゴルを左翼三万戸・右翼三万戸の六つの万戸に編成し直したことである。
      それぞれに自分の子を長として配し、ハンの直轄する万戸を中心に据えた。
      チャハル、ハルハ、オルドス、トゥメトといった名称は、この編成に由来する。
      各万戸を継いだ子孫が広く分かれたため、以後のモンゴル貴族の多くが彼の血筋を名乗るようになった。

      統一は一代で完成したわけではなく、孫のアルタン・ハーンら有力な首長が半ば独立して動いた。
      それでも、オイラトに奪われていた主導権を東モンゴルへ取り戻した意味は大きい。
      彼とマンドハイ・ハトゥンの物語はモンゴルの年代記に詳しく語られ、国民的な伝承となっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/53/BATMUNKH_DAYAN_KHAN.jpg/500px-BATMUNKH_DAYAN_KHAN.jpg
      credit: Avishay / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:BATMUNKH_DAYAN_KHAN.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ダヤン・ハーン

  - id: shaybani-khan
    title: シャイバーニー・ハン
    start: 1500
    end: 1510
    category: war
    tags: [ウズベク, 中央アジア]
    summary: ティムール朝を倒して中央アジアを制し、今日の民族分布の枠を決めた。
    detail: |
      16世紀初めにティムール朝を倒し、中央アジアにウズベクの支配を打ち立てた君主。
      ジョチの五男シバンの家系に属し、キプチャク草原のウズベク集団を率いた。
      祖父アブル＝ハイル・ハンの国が崩れたあと、各地を流浪しながら支持者を集めたという経歴を持つ。

      当時のティムール朝は、ウルグ・ベク以後の内紛で弱り、王族が都市ごとに割拠していた。
      シャイバーニーはこの隙を突いて南下する。
      1500年にサマルカンドを奪い、次いでブハラを制圧した。
      若き日のバーブルは一時サマルカンドを奪回するものの支えきれず、最終的に中央アジアを追われてカーブルへ逃れる。

      1507年にはヘラートを落とし、ティムール朝の中心地はすべてウズベクの手に渡った。
      マー・ワラー・アンナフルの支配層は、モンゴル系のティムール家からジョチ裔のウズベクへ入れ替わる。
      彼はスンナ派の擁護者を自任し、学識も備えて詩を残した。
      一方、西のイランでは同じころシーア派を国教とするサファヴィー朝が興り、両者は宗派と領土の双方で衝突する。

      1510年、メルヴ近郊の戦いでイスマーイール1世に敗れて戦死した。
      その後もウズベクの支配は続き、ブハラ・ハン国として17世紀まで存続する。
      だがイランとの宗派対立は固定し、中央アジアとイランの間に深い線が引かれた。
      今日のウズベキスタン、そしてウズベク人という民族名は、この集団の定着に由来している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Muhammad_Shaybani.jpg/500px-Muhammad_Shaybani.jpg
      credit: ビフザード / Public domain
      page: https://commons.wikimedia.org/wiki/File:Muhammad_Shaybani.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ムハンマド・シャイバーニー

  - id: altan-khan
    title: アルタン・ハン
    start: 1543
    end: 1582
    category: religion
    tags: [モンゴル, チベット仏教]
    summary: 明と和議を結んで交易を開き、ダライ・ラマの称号を贈ってモンゴルを仏教化した。
    detail: |
      16世紀にモンゴル右翼のトゥメト部を率いた実力者（在位・1543〜1582）。
      ダヤン・ハーンの孫にあたり、名は「黄金」を意味する。
      ハンの位は宗家のチャハル部にあったが、実力では彼が草原随一だった。

      1540年代から明の北辺をたびたび攻め、1550年には北京を包囲して郊外を焼いた（庚戌の変）。
      その目的は征服ではなく交易である。
      遊牧の暮らしには中国の穀物・鉄・茶・絹が欠かせないが、明は朝貢の形でしか取引を認めず、しばしばそれも断った。
      攻撃は交渉を強いるための手段だったのである。

      1571年、ようやく和議が成立した。
      アルタンは順義王に封じられ、国境の各所に馬市が開かれて公式の交易が始まる。
      以後、明とモンゴルの間では半世紀以上にわたって大きな戦いが起きなかった。
      この時期、彼が築いた城市フフホトは、現在も内モンゴル自治区の中心都市である。

      宗教面での影響はさらに大きい。
      1578年、青海でチベット仏教ゲルク派の高僧ソナム・ギャツォと会見し、「ダライ・ラマ」の称号を贈った。
      以後、ダライ・ラマは全チベット仏教界の指導者としての地位を確立していく。
      アルタン自身も仏教に帰依し、モンゴルでシャーマニズムの儀礼を禁じてチベット仏教を広めた。
      モンゴル人の大半が今日も仏教徒であるのは、この改宗に始まる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Altankhan.jpg/500px-Altankhan.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Altankhan.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アルタン・ハーン

  - id: galdan
    title: ガルダン
    start: 1671
    end: 1697
    category: war
    tags: [ジュンガル, 清]
    summary: 内陸アジア最後の遊牧帝国を率いて清と争い、康熙帝の親征に敗れた。
    detail: |
      ジュンガルの第3代ホンタイジ（在位・1671〜1697）。
      首長バートル・ホンタイジの子として生まれ、幼くして活仏の転生者と認められ、チベットのラサで仏教を学んだ。
      1670年、兄が殺されたことを受けて還俗し、故地へ戻って権力を握る。
      ダライ・ラマから称号を受け、宗教的な権威を背景に正統性を固めた。

      彼はまず東トルキスタンへ進んだ。
      1678年にカシュガルとヤルカンドを制圧し、オアシス都市を支配下に置く。
      農耕と交易からの収入が、遊牧国家の財政を厚くした。

      次に矛先を東へ向け、ハルハ・モンゴルの内紛に介入する。
      1688年の侵攻でハルハの諸部は敗れ、多くが南へ逃れて清に保護を求めた。
      この亡命が、清にハルハを組み込む機会を与える。
      1690年、ガルダンは清領へ進んでウラーン・ブトンで清軍と戦い、ラクダを並べて壁とする戦法で持ちこたえた。

      康熙帝はこの相手を放置できないと判断し、みずから三度にわたって親征する。
      1696年のジューン・モドの戦いで、火砲を備えた清軍が決定的な勝利を収めた。
      翌年、ガルダンは逃走の途上で没する。
      ハルハ・モンゴルが清に組み込まれたことで草原の勢力図は定まり、今日のモンゴル国の版図は清の統治の区分けを引き継いでいる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ガルダン

  - id: yaqub-beg
    title: ヤクブ・ベク
    start: 1865
    end: 1877
    category: politics
    tags: [新疆, カシュガル]
    summary: 新疆に独立政権を立て、英露の駆け引きのただ中で清の支配を一時断ち切った。
    detail: |
      1865年から1877年にかけて、清の支配を離れた新疆に独立政権を築いた軍人。
      コーカンド・ハン国の出身で、タシケントの防衛戦でロシアに敗れた後、混乱する東トルキスタンへ派遣された。

      当時の新疆は、清の支配に対するムスリムの大規模な反乱で各地が割拠していた。
      太平天国と捻軍に手を取られた清は、遠い西北へ兵を割けずにいる。
      ヤクブ・ベクはコーカンドの王族を擁してカシュガルに入り、まもなく自ら実権を握った。
      以後数年でヤルカンド、ホータン、クチャ、さらにウルムチまで制圧し、タリム盆地の全域を押さえる。

      彼の政権はイスラム法に基づく統治を掲げ、オスマン帝国の宗主権を認めて称号を受けた。
      インドを気にするイギリスと通商条約を結び、南下するロシアとも協定を交わして双方から事実上の承認を得る。
      英露の対立を利用して独立を保つやり方だった。
      一方、内政は重税と厳格な宗教政策で住民の支持を失っていく。

      清では左宗棠が新疆の放棄に反対し、遠征費を調達して1876年から進軍を始めた。
      翌年ヤクブ・ベクは急死し、政権は内部分裂して崩れる。
      1878年までに清が全域を回復し、1884年にこの地は新疆省として内地と同じ行政区分に組み込まれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Veselovski-1898-Yakub-Bek.jpg/500px-Veselovski-1898-Yakub-Bek.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Veselovski-1898-Yakub-Bek.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヤクブ・ベク

  - id: nazarbayev
    title: ナザルバエフ
    start: 1991
    end: 2019
    category: politics
    tags: [カザフスタン]
    summary: ソ連解体から28年国を率い、資源収入と多方位外交で体制を保った。
    detail: |
      カザフスタンの初代大統領（在任・1991〜2019）。
      1940年に遊牧民の家に生まれ、カラガンダの製鉄所で高炉の作業員として働き、そこから党の職へ進んだ。
      1989年にカザフ共産党第一書記となり、翌年に共和国の大統領に選ばれる。
      ソ連解体の過程では連邦維持を最後まで説き、独立宣言は構成国の中で最も遅かった。

      独立後、領内に残された千四百発規模の核弾頭とセミパラチンスク核実験場の処理に直面する。
      彼は核を放棄する道を選び、実験場を閉鎖した。
      四十年にわたる核実験で周辺住民に深刻な健康被害が出ていたことも背景にある。

      経済では、カスピ海の油田開発に外国資本を呼び込み、国を中所得国へ押し上げた。
      1997年には北部のアクモラへ遷都してアスタナと名づけ、新都市を建設する。
      中国とロシアのあいだで均衡を取る多方位外交も特徴だった。
      一方、政治は強く統制され、野党とメディアは抑えられ、選挙では九割を超える得票で再選を重ねる。

      2019年3月に突然辞任を表明し、後継にトカエフを据えて自らは影響力を保った。
      首都は彼の名を取ってヌルスルタンと改称される。
      ところが2022年1月、燃料価格の引き上げに端を発した抗議が全土に広がり、各地で銅像が倒された。
      首都の名は同年9月にアスタナへ戻され、長期政権の後に権力をどう引き継ぐかという問題の実例になっている。
