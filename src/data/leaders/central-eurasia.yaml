  - id: ogedei
    title: オゴデイ
    start: 1229
    end: 1241
    category: politics
    tags: [モンゴル, カラコルム]
    summary: 首都と駅伝制を整えて帝国を運営に乗せ、その急死が東欧遠征を止めた。
    detail: |
      チンギス・ハンの三男。
      父の遺志により1229年のクリルタイで第2代の君主に推され、モンゴルの君主として初めてカアン（大ハン）の号を用いた。
      兄弟のなかでは穏やかで、酒好きで気前がよく、争いの調停に向いた人柄だったと伝えられる。
      最大の功績は、征服した土地を統治する仕組みを整えたことである。
      1235年、オルホン川のほとりにカラコルムの都を築き、城壁と宮殿、外国からの職人の居住区を置いた。
      遊牧国家が定まった首都を持つのは大きな転換だった。
      駅伝（ジャムチ）の制度を帝国全体に広げたのも彼の代である。
      一定の距離ごとに駅を置き、馬と食料を用意させて、使者と官の通行を支えた。
      これが後の「モンゴルの平和」の物理的な背骨になる。
      金の遺臣・耶律楚材を用い、華北で人口を調べて銀と絹で税を取る仕組みを作った。
      草原の発想では耕地は牧地にするべきものだったが、耕させて税を取るほうが得だと説得された話はよく知られている。
      征服も続いた。
      1234年に金を滅ぼして華北を得、西アジアへはチョルマグンを送り、1235年のクリルタイでバトゥの西方遠征を決めた。
      三方向に同時に軍を出せたのは、統治の仕組みが追いついたからでもある。
      晩年は酒に溺れ、政務が乱れたと史料は伝える。
      1241年12月に急死すると、東欧にいた遠征軍はクリルタイのため引き返した。
      ヨーロッパがモンゴルの侵攻を免れたのは、この偶然によるところが大きい。
      後継をめぐっては妃ドレゲネが摂政として実権を握り、子のグユクが立つまで数年を要した。
      グユクも短命に終わり、位はやがてトルイ家のモンケへ移る。
      この交代が、オゴデイ家とトルイ家の対立を生むことになった。
      彼の死をめぐっては、飲酒による急死のほか、姉に毒殺されたという説も当時から流れた。
      いずれにせよ、その死の報せが西欧の運命を変えたことは確かである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9e/YuanEmperorAlbumOgedeiPortrait.jpg/500px-YuanEmperorAlbumOgedeiPortrait.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:YuanEmperorAlbumOgedeiPortrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/オゴデイ

  - id: mongke
    title: モンケ
    start: 1251
    end: 1259
    category: war
    tags: [モンゴル]
    summary: 西アジアと南宋への二正面作戦を進め、その死が帝国分裂の引き金になった。
    detail: |
      トルイの長男で、チンギス・ハンの孫。
      バトゥの西方遠征に加わって実戦を積み、ヨーロッパ遠征にも従軍した。
      オゴデイ家のグユクが急死したあと、バトゥの強い後押しで1251年に即位した。
      チンギスの末子の家系が帝位を握ったこの交代は、オゴデイ家とチャガタイ家の反発を招き、即位直後に大規模な粛清が行われている。
      統治者としては引き締めの人だった。
      駅伝の濫用を禁じ、恣意的な徴発をやめさせ、華北・中央アジア・イランのそれぞれで人口調査を行って税制を整えた。
      帝国の財政を安定させる地味だが重要な仕事である。
      宗教には寛容で、カラコルムの宮廷でキリスト教・イスラム・仏教の代表を集めて討論させたことが、フランス王の使節ルブルックの旅行記に記録されている。
      彼は諸宗教を指の五本にたとえ、どれも同じ手に属すると語ったと伝えられる。
      対外的には二正面の大遠征を進めた。
      弟フレグを西アジアへ送り、1258年にバグダードを攻略させてアッバース朝を滅ぼす。
      もう一人の弟クビライと自らは南宋へ向かった。
      1259年、四川の釣魚城を攻めている陣中で没する。
      死因は疫病とも戦傷とも伝えられる。
      この死が帝国の転機になった。
      後継をめぐってクビライとアリクブケが争い、四年にわたる内戦となる。
      表面上はクビライが勝ったが、以後カアンの権威は全体に及ばなくなり、各ウルスは事実上の独立国として動き出した。
      モンケは、ユーラシアの大半を一人の君主が実際に統治した最後の人物といえる。
      彼の治世に、フランス王ルイ9世の使節ルブルックがカラコルムを訪れ、宮廷の様子や各国から連れて来られた職人の暮らしを詳しく書き残した。
      パリ出身の金細工師が作った銀の樹の噴水の記述は、この都の国際性を伝えている。
      南宋攻略の途中で急死したことは、東アジアの歴史も変えた。
      もし攻略が続いていれば、南宋の滅亡は二十年早まっていたかもしれない。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/2/2c/M%C3%B6ngke_Khan.jpg
      credit: Abdullâh Sultân (atelier). Shîrâz / CC0
      page: https://commons.wikimedia.org/wiki/File:M%C3%B6ngke_Khan.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モンケ

  - id: timur-reign
    title: ティムール
    start: 1370
    end: 1405
    category: war
    tags: [ティムール朝, サマルカンド]
    summary: 破壊と建設を同時に行い、サマルカンドを世界有数の都市に育てた。
    detail: |
      1336年、サマルカンド近郊のケシュに、モンゴル系バルラス部の小領主の家に生まれた。
      若いころの戦いで右足と右腕を傷め、ペルシア語で「跛者のティムール」を意味するティムーリ・ラングと呼ばれた。
      ヨーロッパでのタメルランの名はこれが訛ったものである。
      チャガタイ・ウルスの分裂に乗じて頭角を現し、義兄弟フサインと結んでは争い、1370年に彼を倒してマー・ワラー・アンナフルの支配者となった。
      以後三十五年、ほぼ絶え間なく遠征を続ける。
      東はモグーリスタン、西はイラン・イラク・シリア、北はジョチ・ウルス、南は北インドに及んだ。
      1398年にはデリーを攻略して住民を虐殺し、1400年にダマスクス、1401年にバグダードを落としている。
      抵抗した都市への処置は極端だった。
      イスファハーンやバグダードでは数万の頭蓋を積み上げた塔が築かれたと記録される。
      一方で降伏した町は比較的穏当に扱われ、恐怖そのものを統治の道具として使った。
      破壊と並行して建設にも熱心だった。
      征服地から集めた職人をサマルカンドに住まわせ、モスク・マドラサ・庭園を次々に造らせる。
      都を世界の中心にするという意識がはっきりしていた。
      1402年のアンカラの戦いではオスマン帝国のバヤズィト1世を捕らえ、地中海世界にその名を轟かせた。
      カスティーリャやフランスの王が使節を送り、クラヴィホの旅行記が宮廷の様子を伝えている。
      1405年、明を討つために出発した直後、シル川沿いのオトラルで病没した。
      享年六十八。
      遠征は中止され、遺体はサマルカンドのグーリ・アミール廟に葬られた。
      その評価は今も割れている。
      中央アジアの破壊者と見るか、文化の保護者と見るか。
      ウズベキスタンでは独立後、国家の象徴として広場に騎馬像が立てられた。
      サマルカンドの建築群は1990年代以降に大規模な修復を受け、世界遺産に登録されている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/43/Tamerlan.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tamerlan.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティムール

  - id: esen-taishi
    title: エセン・ハン
    start: 1439
    end: 1454
    category: war
    tags: [オイラト, 土木の変]
    summary: 明の皇帝を捕虜にし、遊牧勢力がなお中華を脅かせることを見せつけた。
    detail: |
      15世紀前半、モンゴル高原では西方のオイラト（瓦剌）が力を伸ばしていた。
      エセンは父トゴンの跡を継いでその首長となり、東のハルハや女真、西のモグーリスタンにまで影響を広げる。
      彼はチンギス・ハンの血を引かない家系だったため、名目上の君主としてトクトア・ブハを立て、自らは太師（タイシ）として実権を握った。
      ティムールと同じく、血の資格を持たない実力者の統治である。
      明との関係は交易から崩れた。
      オイラトは馬を献上して見返りの品を得る朝貢貿易を重ねていたが、使節の人数を水増しして利を得ようとし、明の宦官王振がこれを値切って拒んだことが対立を招く。
      1449年、エセンは大同方面へ侵攻した。
      王振に促された正統帝はみずから大軍を率いて出陣するが、補給も指揮も乱れ、土木堡で包囲されて壊滅する。
      皇帝自身が捕虜となった（土木の変）。
      明は弟を新帝に立てて交渉に応じず、北京の防衛を固めた。
      エセンは北京を囲んだものの兵部尚書于謙の守りを破れず、翌年に正統帝を無条件で送り返している。
      皇帝を抱えていても利が出なかったのである。
      1453年、エセンはトクトア・ブハを殺して自らハンを称した。
      これはチンギス裔でない者の僭称として草原の諸部から強い反発を招く。
      翌1454年、部下の反乱によって殺された。
      オイラトの勢力は急速に衰え、モンゴル高原の主導権はチンギス裔のダヤン・ハーンへ移っていく。
      明にとって土木の変は転換点となった。
      以後、北方への遠征をやめて長城の修築に徹する守りの姿勢が定着し、今日見られる磚積みの万里の長城はこの時代以降に築かれたものである。
      土木の変の衝撃は大きく、明は対外政策を守勢に転じた。
      北辺に沿って長城を石と磚で固める工事が本格化し、今日観光地となっている八達嶺などの姿はこの後に作られたものである。
      エセンの敗死後、オイラトは西へ退き、モンゴル高原の主導権は再びチンギス裔の東モンゴルに戻った。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/ESENTAISH_KHAAN.jpg/500px-ESENTAISH_KHAAN.jpg
      credit: Avishay / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:ESENTAISH_KHAAN.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エセン_(オイラト)

  - id: ulugh-beg-reign
    title: ウルグ・ベク
    start: 1447
    end: 1449
    category: science
    tags: [ティムール朝, 天文学]
    summary: 自ら天文台を築いて星表を作った学者君主で、政争のなかで殺された。
    detail: |
      本名はムハンマド・タラガイ。
      ティムールの孫にあたり、「偉大な君主」を意味するウルグ・ベクの通称で知られる。
      少年期から祖父の遠征に同行し、征服地の文化に触れて育った。
      1409年、父シャー・ルフがヘラートを本拠に王朝を立て直すと、ウルグ・ベクは十五歳でサマルカンドとマー・ワラー・アンナフルの統治を任された。
      以後四十年、この地の実質的な支配者として過ごす。
      彼の関心は統治より学問にあった。
      サマルカンドに壮麗なマドラサを建て、数学者・天文学者を招き、1420年代には巨大な六分儀を備えた天文台を築く。
      自ら観測に加わり、1018個の星の位置を測り直した星表を完成させた。
      一年の長さを現在の値と25秒ほどしか違わない精度で求めた成果は、望遠鏡以前の観測として世界最高水準にある。
      三角関数表の精度も同様だった。
      一方、軍事と政治では失敗が続いた。
      北方のウズベクへの遠征に敗れ、部族の有力者や保守的な宗教勢力の支持を失っていく。
      学問への傾倒が、彼らには統治の怠慢と映った。
      1447年に父が没して君主の座に就いたが、王族間の争いを抑えられない。
      在位はわずか二年で、1449年、子のアブドゥッラティーフに背かれて廃位された。
      メッカ巡礼へ向かう途上で刺客に殺される。
      首謀者は実の子だったとされ、その子自身も半年ほどで殺された。
      天文台は放棄されて破壊され、場所も忘れられたが、1908年に発掘されて地下の六分儀が姿を現した。
      星表は写本で西へ伝わり、17世紀にオックスフォードで刊行されている。
      ウズベキスタンでは、破壊者ティムールと対をなす「学者の君主」として記憶されている。
      学問への貢献と統治者としての失敗が並存する生涯は、権力と知の関係を考えるときにしばしば引かれる。
      月のクレーターにも彼の名がつけられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/1987_CPA_5876.jpg/500px-1987_CPA_5876.jpg
      credit: Scanned and processed by Mariluna / Public domain
      page: https://commons.wikimedia.org/wiki/File:1987_CPA_5876.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウルグ・ベク

  - id: dayan-khan
    title: ダヤン・ハン
    start: 1480
    startCirca: true
    end: 1517
    endCirca: true
    category: politics
    tags: [モンゴル]
    summary: 分裂していたモンゴルを一時まとめ直し、以後の部族編成の原型を作った。
    detail: |
      15世紀後半のモンゴル高原は、オイラトのエセンが倒れたあと、チンギス裔の諸勢力が争う分裂状態にあった。
      ハンの位は名目だけになり、各部族の実力者が実権を握っている。
      ダヤン・ハーンは幼くして父を失い、養母となったマンドハイ・ハトゥンに守られて育った。
      彼女は自ら軍を率いてオイラトを討ち、幼いこの少年をハンに立てて後見したと年代記は伝える。
      モンゴル史でとくに名高い女性である。
      成人したダヤンは、ハン位を脅かす有力者を退け、明との関係でも強気の姿勢を取った。
      1470年代から1510年代にかけて、諸部族を一つずつ服属させていく。
      最大の事業は、モンゴルを左翼三万戸・右翼三万戸の六つの万戸に編成し直したことである。
      それぞれに自分の子を長として配し、ハンの直轄する万戸を中心に据えた。
      この区分けが、以後数百年のモンゴルの部族の並びの骨格になった。
      チャハル、ハルハ、オルドス、トゥメトといった名称は、この編成に由来する。
      各万戸を継いだ子孫が広く分かれたため、以後のモンゴル貴族の多くがダヤン・ハーンの血筋を名乗るようになった。
      チンギス裔であることの証明が、彼を経由して語られるようになったのである。
      統一は彼一代で完成したわけではなく、孫のアルタン・ハーンら有力な首長が半ば独立して動いた。
      それでも、オイラトに奪われていた主導権を東モンゴルへ取り戻した意味は大きい。
      没年は1516年とも1517年とも伝えられ、はっきりしない。
      彼の死後、モンゴルは再び緩やかな分立に戻るが、チンギス裔の権威そのものは17世紀に清へ服属するまで保たれた。
      彼とマンドハイ・ハトゥンの物語は、モンゴルの年代記『蒙古源流』などに詳しく語られ、国民的な伝承となっている。
      実在の年代や事績には史料によって食い違いがあり、統一の過程をどこまで一人の功績とみるかは議論がある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/53/BATMUNKH_DAYAN_KHAN.jpg/500px-BATMUNKH_DAYAN_KHAN.jpg
      credit: Avishay / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:BATMUNKH_DAYAN_KHAN.jpg
    links:
