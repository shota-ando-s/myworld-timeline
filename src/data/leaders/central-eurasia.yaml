  - id: huhanye
    title: 呼韓邪単于
    start: -58
    end: -31
    category: politics
    tags: [匈奴, 漢]
    summary: 漢に臣従して和平を選び、草原と中華が共存する形を初めて作った。
    detail: |
      前1世紀半ば、匈奴は天候不順による家畜の被害と単于位をめぐる争いが重なり、五人の単于が並び立つ混乱に陥った。
      呼韓邪単于は兄の郅支単于との争いに敗れて南へ逃れ、家臣の勧めに従って漢の力を借りる道を選ぶ。
      草原の君主が中華の皇帝に頭を下げることには当然強い反発があり、これをめぐる議論が『漢書』に残っている。
      前51年、みずから長安へ赴いて宣帝に臣礼を取った。
      漢は彼を諸侯王より上の席次で迎え、黄金・絹・穀物を与えて北へ送り返す。
      後ろ盾を得た呼韓邪は勢力を回復し、西へ去った郅支単于は前36年、西域都護の甘延寿と副校尉の陳湯が独断で起こした遠征によって中央アジアで討たれた。
      前33年、呼韓邪は再び長安を訪れて元帝に婚姻を願い出る。
      このとき与えられたのが後宮の女性・王昭君だった。
      彼女は呼韓邪との間に子をもうけ、夫の死後は匈奴の慣習に従ってその子の代の単于に嫁いでいる。
      異国へ送られた美女の物語は、のちに詩や戯曲で繰り返し取り上げられ、日本にも伝わった。
      これ以後、匈奴と漢のあいだには半世紀以上にわたって大きな戦いが起きていない。
      草原の君主が臣従の形を取りながら実際には独立を保ち、贈り物と交易の利を得るというやり方は、以後の北方勢力にもしばしば見られるようになる。
      この時期、漢の朝廷では匈奴をどう遇するかが論じられた。
      臣下として扱うべきか、対等の客として迎えるべきか。
      結局、諸侯王より上の席次という折衷が採られ、単于は臣と称しながらも特別な待遇を受ける。
      漢からの下賜は年を追って増えた。
      絹は数千匹、綿入れや穀物も加わり、匈奴の側はこれを部族へ分配して求心力を保つ。
      中華の富が草原の政治を支える構図である。
      王昭君の物語は、時代が下るほど脚色されていった。
      元代の戯曲『漢宮秋』では、彼女は国境の川に身を投げる。
      史実の彼女は匈奴で子をもうけ、その子孫は漢との関係を保った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/呼韓邪単于

  - id: tanshihuai
    title: 檀石槐
    start: 156
    startCirca: true
    end: 181
    endCirca: true
    category: war
    tags: [鮮卑]
    summary: 匈奴が去った草原を鮮卑でまとめ、後漢を北から圧迫した。
    detail: |
      匈奴が南北に分かれて衰えたあと、その空白に入り込んだのが東の大興安嶺方面から移ってきた鮮卑だった。
      檀石槐は、父の出征中に生まれたため実子と認められず捨てられかけたと『後漢書』は伝える。
      長じて盗みに来た者を追い返した勇名で諸部に推され、若くして大人になった。
      本拠を高柳の北に置き、東は夫余、西は烏孫、南は後漢の北辺に及ぶ広い範囲を勢力下に収める。
      版図を東部・中部・西部の三つに分け、それぞれに大人を置いて治めた。
      食料が足りないと聞けば海の魚を獲らせようとして、倭人の地から漁のできる者を捕らえてきたという逸話も残る。
      後漢は懐柔しようとして王号を贈り和親を持ちかけたが、檀石槐はこれを拒んだ。
      幽州・并州・涼州への侵入は毎年のように続き、177年には後漢が三方から討伐軍を出したものの、いずれも大敗して兵の七、八割を失ったとされる。
      一方で、彼の権力は個人の力量に支えられたもので、制度として受け継ぐ仕組みは作られなかった。
      181年ごろに没すると、子の和連は人望がなく連合はたちまち解ける。
      以後は軻比能らが部分的にまとめるものの、鮮卑は多くの部に分かれた。
      そこから慕容・拓跋・宇文といった集団が現れ、五胡十六国から北魏へと、中国北部の歴史を動かしていくことになる。
      鮮卑は匈奴のような単于を頂点とする統治機構を持たず、力のある大人のもとに人が集まる緩い集団だった。
      檀石槐の連合が一代で解けたのは、そのためである。
      彼は明確な国家を残さなかったが、鮮卑が高原の主役になる道筋をつけた。
      以後、慕容部は遼西に燕を建て、拓跋部は代から北魏を興し、宇文部からは北周が出る。
      五胡十六国から南北朝にかけて中国北部を支配した王朝の多くが鮮卑系であり、隋と唐の皇室も鮮卑系の血を引く。
      草原と中原の境目にいた集団が、やがて中華の王朝そのものになっていった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/檀石槐

  - id: attila-reign
    title: アッティラ
    start: 434
    end: 453
    category: war
    tags: [フン, ゲルマン移動]
    summary: 東西ローマを同時に脅かし、ゲルマン諸族の移動を押し出して西ローマの終わりを早めた。
    detail: |
      434年、兄ブレダとともにフン族の王位を継ぎ、445年ごろに兄を排して単独の支配者となった。
      パンノニア（現在のハンガリー）の平原を本拠に、東ゴート・ゲピド族といったゲルマン諸族を従える広い支配圏を築く。
      フン族自身は文字を持たず、記録は相手側の東ローマの使節プリスコスらが残したものに頼る。
      そのプリスコスは、木造の館で質素な木の椀から食べるアッティラの姿を書きとめている。
      主な相手は東ローマ帝国だった。
      バルカン半島の都市を繰り返し攻め落とし、貢納を年々つり上げさせて、一時は年に2100ポンドの黄金を取り立てている。
      443年と447年の遠征ではコンスタンティノープルの城壁の手前まで迫った。
      城壁に守られた首都だけは落とせず、帝国は属州の富を差し出し続ける。
      451年、今度は西へ向かってライン川を渡り、ガリアへ侵入した。
      西ローマの将軍アエティウスが西ゴートと連合して迎え撃ち、カタラウヌムの野の戦いでその進撃は止まる。
      翌452年にはイタリアへ入ってアクイレイアを破壊し北部を荒らしたが、疫病と補給難、東ローマの背後からの攻撃、そして教皇レオ1世との会見を経て引き返した。
      このときイタリアの住民が逃げ込んだ潟がヴェネツィアの起こりだと語り継がれている。
      453年、新たな妃を迎えた婚礼の夜に急死した。
      死因は鼻からの出血とも暗殺ともいわれる。
      求心力を失った帝国は翌年、従属していたゲルマン諸族の反乱で崩れ、一代で消えた。
      キリスト教徒からは「神の鞭」と呼ばれ、ドイツの叙事詩『ニーベルンゲンの歌』にはエツェルの名で登場する。
      フン族は文字を持たなかったため、彼らの側からの記録は残っていない。
      アッティラの人物像は、敵であったローマ側の史料を通してしか知ることができない。
      プリスコスの記述にある、贅沢な器を用いる臣下のなかで自分だけ木の椀を使う姿は、こうした一面的な像に厚みを与える数少ない証言である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/Brogi%2C_Carlo_%281850-1925%29_-_n._8227_-_Certosa_di_Pavia_-_Medaglione_sullo_zoccolo_della_facciata.jpg/500px-Brogi%2C_Carlo_%281850-1925%29_-_n._8227_-_Certosa_di_Pavia_-_Medaglione_sullo_zoccolo_della_facciata.jpg
      credit: Carlo Brogi / Public domain
      page: https://commons.wikimedia.org/wiki/File:Brogi,_Carlo_(1850-1925)_-_n._8227_-_Certosa_di_Pavia_-_Medaglione_sullo_zoccolo_della_facciata.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アッティラ

  - id: bilge-qaghan
    title: ビルゲ・カガン
    start: 716
    end: 734
    category: politics
    tags: [突厥, 碑文]
    summary: 突厥碑文に「唐に近づくな」と自らの言葉を刻み、遊牧民の自意識を文字で残した。
    detail: |
      突厥第二可汗国の可汗。
      父クトゥルク（イルティリシュ可汗）の子として生まれ、叔父の死後、弟のキュル・テギンが起こした政変によって716年に位に就いた。
      名将の弟と、二代にわたって国を支えた老臣トニュククの補佐を受け、離反した諸部族を討って国を立て直す。
      対外的には戦い続けるより安定を選んだ。
      唐とは和平を結んで絹馬交易を開き、城壁を築いて定住の都を作ろうとしたこともある。
      このときトニュククは、城に拠れば数で勝る唐に囲まれて終わる、移動できることこそ自分たちの強みだと説いて止めたと碑文は伝える。
      仏教寺院の建立も同じ理由で退けられた。
      734年、彼は臣下に毒を盛られて没した。
      その死を悼んで建てられた石碑が、オルホン川のほとりに残るオルホン碑文である。
      テュルク文字と漢文の両方で刻まれ、テュルク系の言語による最古級のまとまった記録になっている。
      碑文の言葉は、今日でも中央アジアの歴史を語るときに繰り返し引かれる。
      中国の絹と甘い言葉に引き寄せられて南へ移り住めば民は滅びる、という趣旨の警告は、遊牧民自身が自分たちの立場を言語化した数少ない史料として重い。
      744年、第二可汗国はウイグルに倒された。
      碑文はデンマークの言語学者トムセンが1893年に解読し、テュルク系の言語が文字で記録された最初期の資料であることが判明した。
      以後、中央ユーラシア史の研究は、中国側の史料だけに頼らずに済むようになる。
      文中では、可汗が民のために衣食を与え、痩せた民を肥えさせたと繰り返し述べられる。
      君主の正統性を天からの命と民への配慮に求める語り方は、中華の天命思想と重なりつつ、遊牧民自身の言葉で表現されている。
      トルコ共和国はこの碑文を自国の歴史の源流と位置づけ、モンゴルの現地には記念館が建てられた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/毘伽可汗

  - id: satuq-bughra-khan
    title: サトゥク・ブグラ・ハン
    start: 940
    startCirca: true
    end: 955
    endCirca: true
    category: religion
    tags: [カラハン朝, イスラム化]
    summary: テュルク系の君主として初めてイスラムに改宗し、中央アジアの宗教地図を変えた。
    detail: |
      カラハン朝は、ウイグル可汗国の崩壊後に中央アジアへ移ったテュルク系の諸集団がまとめた国で、当初は伝統的な信仰を保っていた。
      サトゥク・ブグラ・ハンはその王族に生まれ、カシュガル方面を治める立場にあった。
      改宗のきっかけは、サーマーン朝から逃れてきた王族アブー・ナスルとの出会いだったと伝えられる。
      彼を通じてイスラムの教えに触れ、ひそかに信仰を受け入れたという。
      物語には後世の潤色が多く、実際の経緯は明らかでない。
      信仰を明らかにしたサトゥクは、非ムスリムの叔父オグルチャク・カディル・ハンと争ってこれを倒し、カシュガルの支配権を握った。
      アブドゥル・カリムというムスリム名を名乗り、その治世のあいだに改宗者は着実に増えていく。
      決定的だったのは次の世代である。
      955年ごろの彼の死後、子のムーサーの代に国としてイスラムを受け入れ、集団改宗が進んだ。
      イスラムの史料は、このとき二十万帳（世帯）が改宗したと伝える。
      これは単に一つの王朝の宗旨が変わったという話にとどまらない。
      テュルク系の君主が支配者のままイスラムを奉じた最初の例であり、以後、草原からイスラム世界へ流れ込む人々は、異教徒の傭兵ではなく同じ信仰を持つ戦士として迎えられるようになる。
      カラハン朝はやがてイラン系文化の中心地マー・ワラー・アンナフルを支配し、テュルク語による最初期のイスラム文学『クタドゥグ・ビリグ』を生んだ。
      中央アジアがイスラム圏かつテュルク語圏になっていく流れは、ここを出発点としている。
      彼の墓はカシュガル近郊のアトゥシュにあり、中央アジアで最初のムスリム君主の廟として今も巡礼の対象になっている。
      改宗をめぐる伝承は聖者伝の形で語り継がれ、史実の確認は難しい。
      それでも、10世紀にテュルク系の王朝がイスラムを受け入れたという事実そのものは、さまざまな史料から裏づけられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/KaraKhanidAD1000.png/500px-KaraKhanidAD1000.png
      credit: Gabagool / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:KaraKhanidAD1000.png
    links:
