  - id: karimov
    title: カリモフ
    start: 1991
    end: 2016
    category: politics
    tags: [ウズベキスタン]
    summary: 独立後の中央アジア最大の人口国を強権で統治し、地域の安定と抑圧を両立させた。
    detail: |
      ウズベキスタンの初代大統領（在任・1991〜2016）。
      1938年にサマルカンドで生まれ、技師として航空機工場に勤めたのち、国家計画委員会などの経済畑を歩んだ。
      1989年にウズベク共産党第一書記となり、独立後もそのまま大統領として四半世紀にわたり国を統治する。

      彼が一貫して掲げたのは、急激な改革を避けて段階を踏むという方針だった。
      ロシア流の急進的な市場化を退け、綿花と金の輸出を国家が管理する体制を保つ。
      経済の崩壊は他国より小さかったが、国際的な競争力も育たなかった。

      最大の関心はイスラム勢力の封じ込めにあった。
      武装組織の脅威を理由に信仰の実践は厳しく監視され、多数の政治犯が収監される。
      2005年、東部の都市アンディジャンで起きた抗議に治安部隊が発砲し、多数の市民が死亡した。
      政府は百八十七人と発表したが、目撃者は数百人規模と証言している。
      この事件で欧米との関係は冷え込み、彼はロシアと中国に接近した。

      綿花の収穫期に公務員や学生を動員する強制労働も、長く国際的な批判を受け続けた。
      外交では、軍事同盟への加盟と脱退、米軍基地の提供と撤去を繰り返すなど、その時々の損得で立場を変えている。
      2016年9月に没した後、後継のミルジヨエフは通貨の自由化や国境の開放など、段階的な緩和を進めている。
