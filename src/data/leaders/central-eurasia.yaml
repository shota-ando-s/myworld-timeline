  - id: niyazov
    title: ニヤゾフ
    start: 1991
    end: 2006
    category: politics
    tags: [トルクメニスタン, 個人崇拝]
    summary: 自らを「トルクメン人の長」と称し、月の名まで変える個人崇拝を敷いた。
    detail: |
      トルクメニスタンの初代大統領（在任・1991〜2006）。
      1940年にアシガバート近郊で生まれ、幼くして地震と戦争で両親を失い孤児院で育ったとされる。
      1985年にトルクメン共産党第一書記となり、独立後は「トルクメンバシ（トルクメン人の長）」を名乗った。
      1999年には議会が終身大統領の地位を認めている。

      統治の特徴は徹底した個人崇拝だった。
      都市の広場には黄金の立像が置かれ、首都の中心には常に太陽の方を向いて回転する像が立つ。
      紙幣、建物、学校、そして食品にまで彼の名と肖像が使われた。
      2001年に刊行した自著『ルーフナーマ（魂の書）』は学校の必読書とされ、公務員試験や自動車免許の試験にも出題される。

      改名の範囲は常識を超えていた。
      月の名を自分や母の名に、曜日の名も改めている。
      一方で天然ガスの収入を配り、電気・ガス・水道を国民に無料で提供した。
      同時に社会の基盤は削られ、オペラとバレエが禁じられ、地方の病院が閉鎖され、教育年限が短縮される。

      外交では厳格な中立を掲げ、国際的な同盟に加わらず国を事実上閉ざした。
      報道の自由度の国際比較では、一貫して最下位付近に置かれている。
      2006年12月に急死し、後継のベルディムハメドフが一部の政策を戻したが、体制の性格は大きく変わらなかった。
      現在は息子のセルダルに引き継がれている。
