  - id: batu
    title: バトゥ
    start: 1227
    end: 1255
    category: war
    tags: [モンゴル, キプチャク・ハン国]
    summary: ロシアと東欧に遠征し、以後200年続くルーシ支配の基礎を作った。
    detail: |
      チンギス・ハンの長男ジョチの次男。
      ジョチは父より先に没しており、その遺領である帝国の最西方を、兄オルダを差し置いて受け継いだ。
      長兄が弟を立てて自らは東方の一部に退いたと伝えられる。
      1235年のクリルタイで西方遠征が決まり、バトゥが総司令となった。
      各王家から王子が加わる帝国全体の事業で、実質の作戦を担ったのは百戦錬磨の将スブタイである。
      1236年にヴォルガ・ブルガールを滅ぼし、翌年からルーシ諸公国へ入った。
      冬に凍った川を道として使う進み方で、リャザン、ウラジーミルを次々に落とす。
      1240年にはキエフを陥れ、かつてルーシの中心だった都市は壊滅した。
      1241年、軍を二手に分けてポーランドとハンガリーへ進む。
      ワールシュタットでドイツ・ポーランド連合軍を、モヒでハンガリー王軍を、ほぼ同時に破った。
      前線はウィーン近郊にまで達している。
      ところが同じ年の末、オゴデイ・カアンの死の報が届く。
      バトゥは後継を決めるクリルタイのため軍を引き返させた。
      これによって中欧は破滅を免れたが、彼自身は帰途にヴォルガ下流へとどまり、以後カラコルムへ戻らなかった。
      サライを都としてジョチ・ウルス（キプチャク・ハン国）を固め、ルーシ諸公には貢納と、位を承認される手続きを課した。
      以後二百年余り続くこの支配は、ロシア史で「タタールのくびき」と呼ばれる。
      バトゥ自身は帝位を争わなかったが、モンケの即位を後押しして帝国全体に大きな影響力を持った。
      「賢明なハン」の意でサイン・ハンとも呼ばれる。
      1255年ごろに没し、弟ベルケの代にジョチ・ウルスはイスラムを受け入れていく。
      バトゥの一族はその後もジョチ・ウルスを統治し、その血統はカザフやクリミアのハンへ受け継がれた。
      ロシアの東方進出は、この一族の国を一つずつ併合していく過程でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/Batu_Khan_on_the_Throne_by_Rashid_al-Din_%28cropped%29.jpg/500px-Batu_Khan_on_the_Throne_by_Rashid_al-Din_%28cropped%29.jpg
      credit: Rashid al-Din Hamadani / Public domain
