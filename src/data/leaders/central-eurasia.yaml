  - id: ogedei
    title: オゴデイ
    start: 1229
    end: 1241
    category: politics
    tags: [モンゴル, カラコルム]
    summary: 首都と駅伝制を整えて帝国を運営に乗せ、その急死が東欧遠征を止めた。
    detail: |
      モンゴル帝国の第2代君主（在位・1229〜1241）。
      チンギス・ハンの三男で、父の遺志によりクリルタイで推され、モンゴルの君主として初めてカアン（大ハン）の号を用いた。
      兄弟のなかでは穏やかで、争いの調停に向いた人柄だったと伝えられる。

      最大の功績は、征服した土地を統治する仕組みを整えたことである。
      1235年、オルホン川のほとりにカラコルムの都を築き、城壁と宮殿、外国からの職人の居住区を置いた。
      遊牧国家が定まった首都を持つのは大きな転換だった。
      駅伝（ジャムチ）の制度も帝国全体に広げ、一定の距離ごとに駅を置いて馬と食料を用意させている。

      金の遺臣・耶律楚材を用い、華北で人口を調べて銀と絹で税を取る仕組みを作った。
      草原の発想では耕地は牧地にするものだったが、耕させて税を取るほうが得だと説得された話はよく知られている。
      征服も続き、1234年に金を滅ぼして華北を得、西アジアと東欧へも同時に軍を送った。

      晩年は酒に溺れ、政務が乱れたと史料は伝える。
      1241年12月に急死すると、東欧にいた遠征軍はクリルタイのため引き返した。
      ヨーロッパがモンゴルの侵攻を免れたのは、この偶然によるところが大きい。
      後継は妃ドレゲネの摂政を経て子のグユクが立つが短命に終わり、位はやがてトルイ家のモンケへ移る。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9e/YuanEmperorAlbumOgedeiPortrait.jpg/500px-YuanEmperorAlbumOgedeiPortrait.jpg
      credit: 作者不明 / Public domain
