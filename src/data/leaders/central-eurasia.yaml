        url: https://ja.wikipedia.org/wiki/カラハン朝

  - id: chinggis-reign
    title: チンギス・ハン
    start: 1206
    end: 1227
    category: war
    tags: [モンゴル]
    summary: 部族の枠を解体して千戸制に組み替え、ユーラシアを貫く帝国の出発点を作った。
    detail: |
      モンゴル高原の小さな氏族に生まれたテムジンは、父を毒殺されて一族から見捨てられ、極貧の少年期を過ごした。
      ケレイトのトオリル・ハンを後ろ盾に力を蓄え、盟友から敵に転じたジャムカ、さらにタタル・ケレイト・ナイマンを次々に破っていく。
      1206年、オノン川の源で開かれたクリルタイで全モンゴルの君主に推され、チンギス・カンの称号を受けた。
      ここで行われた再編が決定的だった。
      旧来の部族を解体し、成人男子を千戸・百戸・十戸の単位に編成して、忠誠の対象を血筋から自分の任じた指揮官へ移したのである。
      身辺にはケシクと呼ばれる親衛隊を置き、各部隊の長の子弟を入れて幹部を育てた。
      ウイグル文字を採り入れてモンゴル語を書き記させ、ヤサと呼ばれる法を定めて、略奪品の分配や駅伝の義務を明文化している。
      文字も官僚組織も持たなかった集団が、短期間に統治の道具を揃えた。
      対外的には、1209年に西夏を従え、1211年から金への攻撃を始めて1215年に中都（北京）を落とした。
      1219年には通商使節の殺害を口実にホラズム・シャー朝へ侵攻し、中央アジアの大都市を次々に破壊する。
      1227年、西夏を再び攻めている最中に没した。
      死の前後の詳細も埋葬地も伏せられ、今日まで墓は見つかっていない。
      征服の規模と残虐さは同時代から記録されているが、駅伝制の整備や商人の保護、宗教への寛容といった側面も併せて評価されるようになっている。
      モンゴルではソ連の影響下で長く語ることを禁じられ、1990年代以降に国民的な英雄として復活した。
      後世の評価は、立場によって大きく分かれる。
      征服された側の記録は殺戮と破壊を強調し、モンゴルの年代記は秩序をもたらした建国者として描く。
      近年は、駅伝による情報網、宗教への寛容、商人の保護といった統治の側面から、ユーラシアを一つの交流圏にした人物として論じられることも多い。
