    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イスラム・カリモフ

  - id: niyazov
    title: ニヤゾフ
    start: 1991
    end: 2006
    category: politics
    tags: [トルクメニスタン, 個人崇拝]
    summary: 自らを「トルクメン人の長」と称し、月の名まで変える個人崇拝を敷いた。
    detail: |
      1940年、アシガバート近郊に生まれた。
      5歳のとき1948年の大地震で母を失い、父も戦死していたため孤児院で育ったとされる。
      レニングラードで技師として学び、党の職を歩んだ。
      1985年にトルクメン共産党第一書記となり、1990年に大統領に就任。
      独立後は「トルクメンバシ（トルクメン人の長）」を名乗り、1999年には議会が終身大統領の地位を認めた。
      統治の特徴は徹底した個人崇拝だった。
      都市の広場には黄金の立像が置かれ、常に太陽の方を向いて回転する像が首都の中心に立った。
      紙幣、建物、学校、ミサイル、そして食品にまで彼の名と肖像が使われる。
      2001年に刊行した自著『ルーフナーマ（魂の書）』は、歴史・道徳・自伝を混ぜた書物で、学校の必読書とされ、公務員試験や自動車免許の試験にも出題された。
      モスクの壁にコーランと並べて刻まれた例もある。
      改名の範囲は常識を超えていた。
      月の名を自分や母の名に、曜日の名も改め、パンを母の名で呼ばせた。
      一方で天然ガスの収入を配り、電気・ガス・水道・食塩を国民に無料で提供した。
      同時に、社会の基盤は削られた。
      オペラとバレエ、サーカスが禁じられ、地方の病院が閉鎖され、教育年限が短縮される。
      医師の国家試験もルーフナーマの暗唱に置き換えられた。
      外交では厳格な中立を掲げ、国際的な同盟に加わらず、国を事実上閉ざした。
      報道の自由度の国際比較では、一貫して最下位付近に置かれている。
      2006年12月に急死し、後継のベルディムハメドフが一部の政策を戻したが、体制の性格は大きく変わらなかった。
      現在は息子のセルダルに引き継がれている。
      トルクメニスタンは今も世界有数の天然ガス埋蔵量を持ち、その輸出収入が体制を支えている。
      中国へのパイプラインが最大の販路である。
