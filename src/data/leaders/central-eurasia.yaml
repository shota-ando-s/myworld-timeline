        url: https://ja.wikipedia.org/wiki/ダヤン・ハーン

  - id: shaybani-khan
    title: シャイバーニー・ハン
    start: 1500
    end: 1510
    category: war
    tags: [ウズベク, 中央アジア]
    summary: ティムール朝を倒して中央アジアを制し、今日の民族分布の枠を決めた。
    detail: |
      ジョチの五男シバンの家系に属し、キプチャク草原のウズベク集団を率いた。
      祖父アブル＝ハイル・ハンの国が崩れたあと、各地を流浪しながら支持者を集めたという経歴を持つ。
      当時のティムール朝は、ウルグ・ベク以後の内紛で弱り、王族が都市ごとに割拠していた。
      シャイバーニーはこの隙を突いて南下する。
      1500年にサマルカンドを奪い、次いでブハラを制圧した。
      若き日のバーブルは一時サマルカンドを奪回するものの支えきれず、最終的に中央アジアを追われてカーブルへ逃れる。
      のちのムガル帝国は、この敗走の結果として生まれた。
      1507年にはヘラートを落とし、ティムール朝の中心地はすべてウズベクの手に渡った。
      マー・ワラー・アンナフルの支配層は、こうしてモンゴル系のティムール家からジョチ裔のウズベクへ入れ替わる。
      シャイバーニーはスンナ派の擁護者を自任し、学識も備えて詩を残した。
      一方で、西のイランでは同じころシーア派を国教とするサファヴィー朝が興り、両者は宗派と領土の双方で衝突する。
      1510年、メルヴ近郊の戦いでイスマーイール1世に敗れて戦死した。
      伝えられるところでは、頭蓋骨は黄金で飾られて杯にされ、イスマーイールはこれで酒を飲んだという。
      その後もウズベクの支配は続き、ブハラ・ハン国として17世紀まで存続する。
      だがイランとの宗派対立は固定し、中央アジアとイランの間に深い線が引かれた。
      今日のウズベキスタン、そしてウズベク人という民族名は、この集団の定着に由来する。
      中央アジアの民族分布の大枠は、この時期の移動でほぼ定まった。
      彼は自ら詩を残し、宗教学者と議論を交わす教養人でもあった。
      遊牧の出身でありながら、征服した都市の文化を担う姿勢を見せている。
      ウズベキスタンでは長く、ティムール朝を滅ぼした人物として評価が低かったが、近年はウズベク国家の祖のひとりとして扱われるようになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Muhammad_Shaybani.jpg/500px-Muhammad_Shaybani.jpg
      credit: ビフザード / Public domain
      page: https://commons.wikimedia.org/wiki/File:Muhammad_Shaybani.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ムハンマド・シャイバーニー

  - id: altan-khan
    title: アルタン・ハン
    start: 1543
    end: 1582
    category: religion
    tags: [モンゴル, チベット仏教]
    summary: 明と和議を結んで交易を開き、ダライ・ラマの称号を贈ってモンゴルを仏教化した。
    detail: |
      ダヤン・ハーンの孫にあたり、モンゴル右翼のトゥメト部を率いた。
      名は「黄金」を意味する。
      ハンの位は宗家のチャハル部にあったが、実力では彼が草原随一だった。
      1540年代から明の北辺をたびたび攻め、1550年には北京を包囲して郊外を焼いた。
      庚戌の変と呼ばれるこの事件は、明の防衛体制の弱さを露呈させている。
      彼の目的は征服ではなく交易だった。
      遊牧の暮らしには中国の穀物・鉄・茶・絹が欠かせないが、明は朝貢の形でしか取引を認めず、しばしばそれも断った。
      攻撃は交渉を強いるための手段だったのである。
      1571年、ようやく和議が成立した。
      アルタンは順義王に封じられ、国境の各所に馬市が開かれて、公式の交易が始まる。
      以後、明とモンゴルの間では半世紀以上にわたって大きな戦いが起きなかった。
      この和議には漢人の降伏者ボアイらの仲介があり、彼らはモンゴルの支配下で農耕集落を営んでいた。
      フフホト（現在の内モンゴル自治区の区都）の起こりもこの時期にさかのぼる。
      宗教面での影響はさらに大きい。
      1578年、青海でチベット仏教ゲルク派の高僧ソナム・ギャツォと会見し、「ダライ・ラマ」の称号を贈った。
      ダライはモンゴル語で大海を意味する。
      ソナム・ギャツォは第三代とされたため、この称号はさかのぼって二代前にも与えられた。
      以後、ダライ・ラマは全チベット仏教界の指導者としての地位を確立していく。
      アルタン自身も仏教に帰依し、モンゴルでシャーマニズムの儀礼を禁じてチベット仏教を広めた。
      モンゴル人の大半が今日も仏教徒であるのは、この改宗に始まる。
      君主が宗教的権威に称号を与え、その権威に自らを正統づけさせるという相互の関係は、のちの清とチベット・モンゴルの関係にも受け継がれた。
      彼が建てた城市フフホトは「青い城」を意味し、現在も内モンゴル自治区の中心都市である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Altankhan.jpg/500px-Altankhan.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Altankhan.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アルタン・ハーン

  - id: galdan
    title: ガルダン
    start: 1671
    end: 1697
    category: war
    tags: [ジュンガル, 清]
    summary: 内陸アジア最後の遊牧帝国を率いて清と争い、康熙帝の親征に敗れた。
    detail: |
      ジュンガルの首長バートル・ホンタイジの子として生まれ、幼くして活仏の転生者と認められ、チベットのラサで仏教を学んだ。
      ダライ・ラマ5世のもとで過ごした経験が、のちの政治に影響する。
      1670年、兄が殺されたことを受けて還俗し、故地へ戻って権力を握った。
      ダライ・ラマからホンタイジの称号を受け、宗教的な権威を背景に正統性を固めている。
      彼はまず東トルキスタンへ進んだ。
      1678年にカシュガルとヤルカンドを制圧し、オアシス都市を支配下に置く。
      農耕と交易からの収入が、遊牧国家の財政を厚くした。
      次に矛先を東へ向け、ハルハ・モンゴルの内紛に介入する。
      1688年の侵攻でハルハの諸部は敗れ、多くが南へ逃れて清に保護を求めた。
      この亡命が、清にハルハを組み込む機会を与える。
      1690年、ガルダンは清領へ進み、北京の北方ウラーン・ブトンで清軍と戦った。
      ラクダを並べて壁とする戦法で持ちこたえるが、決着はつかない。
      康熙帝はこの相手を放置できないと判断し、みずから三度にわたって親征した。
      1696年のジューン・モドの戦いで、火砲を備えた清軍が決定的な勝利を収める。
      妻も戦死し、ガルダンの勢力は崩れた。
      翌1697年、逃走の途上で没した。
      病死とも服毒ともいわれる。
      彼の死でジュンガルが滅んだわけではない。
      甥のツェワンラブタンが後を継いで国を立て直し、争いはさらに半世紀続く。
      それでも、ハルハ・モンゴルが清に組み込まれたことで草原の勢力図は決まった。
      今日のモンゴル国の版図が清の統治の区分けを引き継いでいるのは、この一連の戦いの結果である。
      康熙帝がみずから三度も遠征したのは、清の皇帝としては異例である。
      それだけジュンガルを、モンゴル全体の帰趨を左右する相手とみなしていた。
      この戦いを通じてハルハ・モンゴルが清に組み込まれ、外モンゴルと内モンゴルという区分が定着していった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ガルダン

  - id: yaqub-beg
    title: ヤクブ・ベク
    start: 1865
    end: 1877
    category: politics
    tags: [新疆, カシュガル]
    summary: 新疆に独立政権を立て、英露の駆け引きのただ中で清の支配を一時断ち切った。
    detail: |
      コーカンド・ハン国の軍人として経歴を始めた。
      タシケントの防衛戦でロシアに敗れた後、混乱する東トルキスタンへ派遣される。
      当時の新疆は、清の支配に対するムスリムの大規模な反乱で各地が割拠していた。
      太平天国と捻軍に手を取られた清は、遠い西北へ兵を割けずにいた。
      1865年、ヤクブ・ベクはコーカンドの王族を擁してカシュガルに入り、まもなく自ら実権を握る。
      以後数年でヤルカンド、ホータン、クチャ、さらにウルムチまで制圧し、タリム盆地の全域を押さえた。
      彼の政権はイスラム法に基づく統治を掲げ、オスマン帝国のスルタン・アブデュルアズィズの宗主権を認めて称号を受けた。
      オスマンからは武器と軍事顧問が送られている。
      外交も巧みだった。
      インドを気にするイギリスと通商条約を結び、南下するロシアとも協定を交わして、双方から事実上の承認を得る。
      英露の対立を利用して独立を保つやり方である。
      一方、内政は重税と厳格な宗教政策で住民の支持を失っていった。
      もともと外来の軍人であり、地元に根を持たなかった。
      清では左宗棠が新疆の放棄に反対し、海防よりも塞防を重んじる立場を通して遠征費を調達した。
      1876年から進軍が始まり、翌年ヤクブ・ベクは急死する。
      毒殺とも卒中とも伝えられる。
      政権は内部分裂して崩れ、1878年までに清が全域を回復した。
      1884年、この地は新疆省として正式に内地と同じ行政区分に組み込まれる。
      この一連の出来事は、中央アジアで英露清の三つの帝国が接し、境界が確定していく過程を象徴している。
      左宗棠は遠征にあたり、兵を進めながら農地を開かせて食料を自給する方法を取った。
      西北の乾燥地帯で大軍を動かす難しさを、このやり方で乗り越えている。
      この回復によって、清は中央アジアでのロシアの南下に一応の歯止めをかけた。
      イリ地方の返還交渉も、1881年のイリ条約でひとまず決着する。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Veselovski-1898-Yakub-Bek.jpg/500px-Veselovski-1898-Yakub-Bek.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Veselovski-1898-Yakub-Bek.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヤクブ・ベク

  - id: nazarbayev
    title: ナザルバエフ
    start: 1991
    end: 2019
    category: politics
    tags: [カザフスタン]
    summary: ソ連解体から28年国を率い、資源収入と多方位外交で体制を保った。
    detail: |
      1940年、アルマトイ近郊の遊牧民の家に生まれた。
      カラガンダの製鉄所で高炉の作業員として働き、そこから党の職へ進んだ経歴を持つ。
      1989年にカザフ共産党第一書記となり、翌年には共和国の大統領に選ばれた。
      ソ連解体の過程では連邦維持を最後まで説き、独立宣言は構成国の中で最も遅かった。
      独立後、領内に残された千四百発規模の核弾頭と、セミパラチンスク核実験場の処理に直面する。
      彼は核を放棄する道を選び、実験場を閉鎖した。
      四十年にわたる核実験で周辺住民に深刻な健康被害が出ていたことも背景にあった。
      経済では、カスピ海の油田開発に外国資本を呼び込み、国を中所得国へ押し上げた。
      1997年には北部のアクモラへ遷都し、アスタナと名づけて新都市を建設する。
      中国とロシアのあいだで均衡を取る多方位外交も特徴だった。
      一方、政治は強く統制された。
      野党とメディアは抑えられ、選挙では九割を超える得票で再選を重ねる。
      「国民の指導者（エルバス）」の称号を得て、任期制限の適用外とされた。
      2019年3月、突然辞任を表明した。
      後継にトカエフを据え、自らは安全保障会議議長と与党党首として影響力を保つ。
      首都は彼の名を取ってヌルスルタンと改称された。
      2022年1月、燃料価格の引き上げに端を発した抗議が全土に広がり、各地で彼の銅像が倒された。
      トカエフはロシア主導の部隊を要請して事態を収め、同時にナザルバエフの一族を要職から外す。
      首都の名は2022年9月にアスタナへ戻された。
      長期政権の後に権力をどう引き継ぐかという問題の、ひとつの実例になっている。
      在任中、カザフスタンは上海協力機構やユーラシア経済連合の設立に関わり、地域の枠組み作りで一定の役割を果たした。
      国内では民族間の摩擦を抑えることに腐心し、ロシア語話者の多い北部を抱えながら分離の動きを封じてきた。
      この均衡の維持は、彼の統治の評価すべき点として挙げられる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/%D0%9D%D0%B0%D0%B7%D0%B0%D1%80%D0%B1%D0%B0%D0%B5%D0%B2_%D0%95%D0%90%D0%AD%D0%A1_%28cropped%29.jpg/500px-%D0%9D%D0%B0%D0%B7%D0%B0%D1%80%D0%B1%D0%B0%D0%B5%D0%B2_%D0%95%D0%90%D0%AD%D0%A1_%28cropped%29.jpg
      credit: Press service of the First President of the Republic of Kazakhstan - Elbasy / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:%D0%9D%D0%B0%D0%B7%D0%B0%D1%80%D0%B1%D0%B0%D0%B5%D0%B2_%D0%95%D0%90%D0%AD%D0%A1_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヌルスルタン・ナザルバエフ

  - id: karimov
    title: カリモフ
    start: 1991
    end: 2016
    category: politics
    tags: [ウズベキスタン]
    summary: 独立後の中央アジア最大の人口国を強権で統治し、地域の安定と抑圧を両立させた。
    detail: |
      1938年にサマルカンドで生まれ、孤児院で育ったとされる。
      技師として航空機工場に勤めたのち、国家計画委員会などの経済畑を歩んだ。
      1989年にウズベク共産党第一書記となり、1990年に共和国の大統領に就任。
      独立後もそのまま初代大統領として、2016年に没するまで四半世紀にわたり国を統治した。
      彼が一貫して掲げたのは、急激な改革を避け、段階を踏んで進めるという方針だった。
      ロシア流の急進的な市場化を退け、綿花と金の輸出を国家が管理する体制を保つ。
      経済の崩壊は他国より小さかったが、国際的な競争力も育たなかった。
      最大の関心はイスラム勢力の封じ込めにあった。
      ウズベキスタン・イスラム運動などの武装組織の脅威を理由に、信仰の実践は厳しく監視され、多数の政治犯が収監される。
      拷問の報告が国際人権団体から繰り返し出された。
      2005年、東部の都市アンディジャンで起きた抗議に治安部隊が発砲し、多数の市民が死亡した。
      政府は百八十七人と発表したが、目撃者は数百人規模と証言している。
      この事件で欧米との関係は冷え込み、彼はロシアと中国に接近した。
      綿花の収穫期に公務員や学生を動員する強制労働も、長く国際的な批判を受け続けた。
      外交では、ロシア主導の軍事同盟への加盟と脱退を繰り返し、米軍基地の提供と撤去も行うなど、その時々の損得で立場を変えた。
      2016年9月に没した後、後継のミルジヨエフは通貨の自由化、強制労働の縮小、国境の開放など、段階的な緩和を進めている。
      ウズベキスタンは中央アジアで最も人口が多く、地域の安定に直結する国である。
      その四半世紀を一人が方向づけた。
      ウズベキスタンは中央アジア唯一、五か国すべてと国境を接する国であり、その対外姿勢は地域全体の物流と水利に直接影響する。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c4/%D0%98%D1%81%D0%BB%D0%B0%D0%BC_%D0%9A%D0%B0%D1%80%D0%B8%D0%BC%D0%BE%D0%B2_%2823-06-2016%29.jpg/500px-%D0%98%D1%81%D0%BB%D0%B0%D0%BC_%D0%9A%D0%B0%D1%80%D0%B8%D0%BC%D0%BE%D0%B2_%2823-06-2016%29.jpg
      credit: 首相官邸 / GODL-インド
