lane: central-eurasia

# 草原の遊牧国家の君主。定住国家と違って本拠が動くので、
# 「いつ誰が草原をまとめていたか」が周りのレーンの動きと直結する。
leaders:
  - id: modu-chanyu
    title: 冒頓単于
    start: -209
    end: -174
    category: war
    tags: [匈奴]
    summary: 草原の諸部族を初めて一つの帝国にまとめ、漢を和親策に追い込んだ。
    detail: |
      匈奴の単于（在位・前209〜前174）。
      父の頭曼を倒して位に就き、初めてモンゴル高原一帯をひとつの権力のもとにまとめた人物である。
      父殺しや鏑矢の逸話には、残忍な異民族という像を作る意図が混じっている可能性も指摘される。
      それでも、彼が草原に統一権力を出現させたこと自体は疑われていない。
      モンゴルでは近年、チンギス・ハン以前に草原をまとめた人物として再評価が進んでいる。

      即位後、まず東の東胡を油断させて滅ぼし、次いで西の月氏を破って河西回廊から追った。
      北は丁零、南はオルドスまで勢力を広げ、草原に初めて広域の統一政権が生まれる。

      前200年、白登山で漢の高祖の軍を包囲した。
      漢は和親を受け入れ、絹・酒・米を毎年贈り、皇女を単于に嫁がせることになる。
      中華の王朝が遊牧の君主に贈り物をして平和を保つという関係は、ここから始まった。

      統治では、単于の直轄地を中心に左右の賢王が東西を分け持ち、その下に万騎長・千長・百長を置いた。
      遊牧民を十進法の軍事単位に編成するこの仕組みは、形を変えながらチンギス・ハンの千戸制にまで受け継がれる。
      事績は『史記』匈奴列伝によるもので、漢の側から書かれた記録である点には注意がいる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/P%C4%B1narba%C5%9F%C4%B1_1.JPG/500px-P%C4%B1narba%C5%9F%C4%B1_1.JPG
      credit: Vikiçizer / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:P%C4%B1narba%C5%9F%C4%B1_1.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/冒頓単于

  - id: huhanye
    title: 呼韓邪単于
    start: -58
    end: -31
    category: politics
    tags: [匈奴, 漢]
    summary: 漢に臣従して和平を選び、草原と中華が共存する形を初めて作った。
    detail: |
      匈奴の単于（在位・前58〜前31）。
      天候不順による家畜の被害と単于位をめぐる争いが重なり、五人の単于が並び立つ分裂の時代に立った人物である。
      この時期の漢の朝廷では、匈奴を臣下として扱うか対等の客として迎えるかが論じられた。
      結局、諸侯王より上の席次という折衷が採られている。
      漢からの下賜は年を追って増え、中華の富が草原の政治を支える構図ができあがった。

      兄の郅支単于との争いに敗れて南へ逃れた彼は、漢の力を借りる道を選んだ。
      前51年、みずから長安へ赴いて宣帝に臣礼を取る。
      漢は彼を諸侯王より上の席次で迎え、穀物と絹を与えて北へ送り返した。

      後ろ盾を得た呼韓邪は勢力を回復し、西へ去った郅支単于は前36年に漢の遠征軍に討たれた。
      前33年には再び長安を訪れて婚姻を願い出て、後宮の女性・王昭君を妻として与えられている。
      異国へ送られた彼女の物語は、のちの詩や戯曲で繰り返し取り上げられた。

      これ以後、匈奴と漢のあいだには半世紀以上、大きな戦いが起きていない。
      草原の君主が中華の皇帝に臣従の形を取りながら実際には独立を保ち、贈り物と交易の利を得るというやり方は、以後の北方勢力にもしばしば見られるようになる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/呼韓邪単于

  - id: tanshihuai
    title: 檀石槐
    start: 156
    startCirca: true
    end: 181
    endCirca: true
    category: war
    tags: [鮮卑]
    summary: 匈奴が去った草原を鮮卑でまとめ、後漢を北から圧迫した。
    detail: |
      2世紀後半、匈奴が衰えた後のモンゴル高原をまとめた鮮卑の指導者。
      鮮卑は東の大興安嶺方面から移ってきた集団で、匈奴が南北に分かれて去った空白に入り込んだ。
      鮮卑は匈奴のような単于を頂点とする統治機構を持たず、力のある大人のもとに人が集まる緩い集団だった。
      檀石槐の連合が一代で解けたのはそのためである。
      隋と唐の皇室も鮮卑系の血を引いており、草原と中原の境目にいた集団が、やがて中華の王朝そのものになっていった。

      檀石槐は若くして勇名を得て諸部に推され、高柳の北に本拠を置いた。
      東は夫余、西は烏孫、南は後漢の北辺に及ぶ範囲を勢力下に収め、版図を東部・中部・西部の三つに分けてそれぞれに大人を置いている。

      後漢は王号を贈って和親を持ちかけたが、彼はこれを拒んだ。
      辺境への侵入は毎年のように続き、177年には後漢が三方から討伐軍を出したものの、いずれも大敗して終わる。

      ただし、その権力は個人の力量に支えられたもので、受け継ぐ仕組みは作られなかった。
      181年ごろに没すると連合はたちまち解け、鮮卑は再び多くの部に分かれる。
      そこから慕容・拓跋・宇文といった集団が現れ、五胡十六国から北魏へと、中国北部の歴史を動かしていった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/檀石槐

  - id: attila-reign
    title: アッティラ
    start: 434
    end: 453
    category: war
    tags: [フン, ゲルマン移動]
    summary: 東西ローマを同時に脅かし、ゲルマン諸族の移動を押し出して西ローマの終わりを早めた。
    detail: |
      5世紀半ばのフン族の王（在位・434〜453）。
      兄ブレダとともに位を継ぎ、445年ごろに単独の支配者となった。
      パンノニア（現在のハンガリー）の平原を本拠に、東ゴートやゲピドなどゲルマン諸族を従える支配圏を築く。
      フン族は文字を持たず、その姿は東ローマの使節プリスコスら、相手側の記録を通してしか知られていない。

      主な相手は東ローマ帝国だった。
      バルカン半島の都市を繰り返し攻め落とし、貢納を年々つり上げさせる。
      443年と447年の遠征ではコンスタンティノープルの手前まで迫った。
      城壁に守られた首都だけは落とせず、帝国は属州の富を差し出し続けた。

      451年、西へ向かってライン川を渡りガリアへ侵入する。
      西ローマの将軍アエティウスが西ゴートと連合して迎え撃ち、カタラウヌムの野の戦いで進撃は止まった。
      翌年にはイタリアへ入って北部を荒らしたが、疫病と補給難、教皇レオ1世との会見を経て引き返す。
      453年、婚礼の夜に急死した。

      求心力を失った帝国は翌年、従属していたゲルマン諸族の反乱で崩れ、一代で消えた。
      キリスト教徒からは「神の鞭」と呼ばれ、恐怖の対象として記憶される。
      ドイツの叙事詩『ニーベルンゲンの歌』にはエツェルの名で登場する。
      遊牧勢力がヨーロッパの内側まで届いた最初の例として、たびたび振り返られてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/Brogi%2C_Carlo_%281850-1925%29_-_n._8227_-_Certosa_di_Pavia_-_Medaglione_sullo_zoccolo_della_facciata.jpg/500px-Brogi%2C_Carlo_%281850-1925%29_-_n._8227_-_Certosa_di_Pavia_-_Medaglione_sullo_zoccolo_della_facciata.jpg
      credit: Carlo Brogi / Public domain
      page: https://commons.wikimedia.org/wiki/File:Brogi,_Carlo_(1850-1925)_-_n._8227_-_Certosa_di_Pavia_-_Medaglione_sullo_zoccolo_della_facciata.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アッティラ

  - id: bilge-qaghan
    title: ビルゲ・カガン
    start: 716
    end: 734
    category: politics
    tags: [突厥, 碑文]
    summary: 突厥碑文に「唐に近づくな」と自らの言葉を刻み、遊牧民の自意識を文字で残した。
    detail: |
      突厥第二可汗国の可汗（在位・716〜734）。
      父クトゥルクの子として生まれ、弟のキュル・テギンが起こした政変によって位に就いた。
      名将の弟と、二代にわたって国を支えた老臣トニュククの補佐を受け、離反した諸部族を討って国を立て直す。

      対外的には、戦い続けるより安定を選んだ。
      唐とは和平を結んで絹馬交易を開いている。
      城壁を築いて定住の都を作ろうとしたこともあったが、城に拠れば数で勝る唐に囲まれて終わる、移動できることこそ自分たちの強みだとトニュククが説いて止めたと碑文は伝える。
      仏教寺院の建立も同じ理由で退けられた。

      734年、臣下に毒を盛られて没した。
      その死を悼んで建てられた石碑が、オルホン川のほとりに残るオルホン碑文である。
      テュルク文字と漢文の両方で刻まれ、テュルク系の言語によるまとまった記録としては最古級にあたる。
      1893年にデンマークの言語学者トムセンが解読した。

      碑文には、中国の絹と甘い言葉に引き寄せられて南へ移り住めば民は滅びる、という趣旨の警告が記されている。
      唐に服属した五十年を「貴族の子は奴隷となり、娘は婢となった」と嘆く一節も含まれる。
      遊牧民自身が自分たちの立場を言語化した史料として重い。
      744年、第二可汗国はウイグルに倒された。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/毘伽可汗

  - id: satuq-bughra-khan
    title: サトゥク・ブグラ・ハン
    start: 940
    startCirca: true
    end: 955
    endCirca: true
    category: religion
    tags: [カラハン朝, イスラム化]
    summary: テュルク系の君主として初めてイスラムに改宗し、中央アジアの宗教地図を変えた。
    detail: |
      10世紀のカラハン朝の君主で、テュルク系の支配者として初めてイスラムに改宗した人物とされる。
      カラハン朝は、ウイグル可汗国の崩壊後に中央アジアへ移ったテュルク系の諸集団がまとめた国だった。
      サトゥクはその王族に生まれ、カシュガル方面を治める立場にあった。

      改宗のきっかけは、サーマーン朝から逃れてきた王族との出会いだったと伝えられる。
      彼を通じてイスラムの教えに触れ、ひそかに信仰を受け入れたという。
      物語には後世の潤色が多く、実際の経緯は明らかでない。

      信仰を明らかにしたサトゥクは、非ムスリムの叔父と争ってこれを倒し、カシュガルの支配権を握った。
      アブドゥル・カリムというムスリム名を名乗り、その治世のあいだに改宗者は着実に増えていく。
      決定的だったのは次の世代で、955年ごろの彼の死後、子のムーサーの代に国としてイスラムを受け入れた。
      このとき二十万帳（世帯）が改宗したとイスラムの史料は伝える。

      これは一つの王朝の宗旨が変わったという話にとどまらない。
      テュルク系の君主が支配者のままイスラムを奉じた最初の例であり、以後、草原からイスラム世界へ入る人々は、異教徒の傭兵ではなく同じ信仰を持つ戦士として迎えられるようになる。
      カラハン朝はやがてイラン系文化の中心地マー・ワラー・アンナフルを支配し、テュルク語による最初期のイスラム文学を生んだ。
      中央アジアがイスラム圏かつテュルク語圏になっていく流れは、ここを出発点としている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/KaraKhanidAD1000.png/500px-KaraKhanidAD1000.png
      credit: Gabagool / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:KaraKhanidAD1000.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カラハン朝

  - id: chinggis-reign
    title: チンギス・ハン
    start: 1206
    end: 1227
    category: war
    tags: [モンゴル]
    summary: 部族の枠を解体して千戸制に組み替え、ユーラシアを貫く帝国の出発点を作った。
    detail: |
      モンゴル帝国の建国者（在位・1206〜1227）。
      モンゴル高原の小さな氏族に生まれたテムジンは、父を毒殺されて一族から見捨てられ、極貧の少年期を過ごした。
      ケレイトのトオリル・ハンを後ろ盾に力を蓄え、盟友から敵に転じたジャムカ、さらにタタル・ケレイト・ナイマンを次々に破っていく。

      1206年、オノン川の源で開かれたクリルタイで全モンゴルの君主に推され、チンギス・カンの称号を受けた。
      ここで行われた再編が決定的だった。
      旧来の部族を解体し、成人男子を千戸・百戸・十戸の単位に編成して、忠誠の対象を血筋から自分の任じた指揮官へ移したのである。
      身辺にはケシクと呼ばれる親衛隊を置き、各部隊の長の子弟を入れて幹部を育てた。

      文字を持たなかった集団にウイグル文字を採り入れてモンゴル語を記させ、ヤサと呼ばれる法を定めている。
      対外的には、1209年に西夏を従え、1211年から金への攻撃を始めて1215年に中都（北京）を落とした。
      1219年には通商使節の殺害を口実にホラズム・シャー朝へ侵攻し、中央アジアの大都市を次々に破壊する。
      1227年、西夏を再び攻めている最中に没した。

      埋葬地は伏せられ、今日まで墓は見つかっていない。
      征服の規模と残虐さは同時代から記録される一方、駅伝制の整備や商人の保護、宗教への寛容といった統治の側面も併せて論じられるようになっている。
      モンゴルではソ連の影響下で長く語ることを禁じられ、1990年代以降に国民的な英雄として復活した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/YuanEmperorAlbumGenghisPortrait.jpg/500px-YuanEmperorAlbumGenghisPortrait.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:YuanEmperorAlbumGenghisPortrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チンギス・カン

  - id: batu
    title: バトゥ
    start: 1227
    end: 1255
    category: war
    tags: [モンゴル, キプチャク・ハン国]
    summary: ロシアと東欧に遠征し、以後200年続くルーシ支配の基礎を作った。
    detail: |
      ジョチ・ウルス（キプチャク・ハン国）の創設者。
      チンギス・ハンの長男ジョチの次男で、父が先に没したためその遺領である帝国の最西方を受け継いだ。

      1235年のクリルタイで西方遠征が決まり、バトゥが総司令となる。
      各王家から王子が加わる帝国全体の事業で、実質の作戦を担ったのは老将スブタイだった。
      1236年にヴォルガ・ブルガールを滅ぼし、翌年からルーシ諸公国へ入る。
      冬に凍った川を道として使う進み方で、リャザン、ウラジーミルを次々に落とし、1240年にはキエフを陥れた。

      1241年、軍を二手に分けてポーランドとハンガリーへ進む。
      ワールシュタットでドイツ・ポーランド連合軍を、モヒでハンガリー王軍をほぼ同時に破り、前線はウィーン近郊にまで達した。
      ところが同じ年の末、オゴデイ・カアンの死の報が届き、後継を決めるクリルタイのため軍を引き返させる。
      これによって中欧は破滅を免れた。

      バトゥ自身はヴォルガ下流にとどまり、サライを都としてジョチ・ウルスを固めた。
      ルーシ諸公には貢納と、位を承認される手続きを課す。
      以後二百年余り続くこの支配は、ロシア史で「タタールのくびき」と呼ばれた。
      彼の一族の血統はカザフやクリミアのハンへ受け継がれ、ロシアの東方進出はその国を一つずつ併合していく過程でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/Batu_Khan_on_the_Throne_by_Rashid_al-Din_%28cropped%29.jpg/500px-Batu_Khan_on_the_Throne_by_Rashid_al-Din_%28cropped%29.jpg
      credit: Rashid al-Din Hamadani / Public domain
      page: https://commons.wikimedia.org/wiki/File:Batu_Khan_on_the_Throne_by_Rashid_al-Din_(cropped).jpg
    links:
