  - id: anawrahta
    title: アノーラター
    start: 1044
    end: 1077
    category: religion
    tags: [パガン, 上座部仏教]
    summary: ビルマを統一して上座部仏教を国教とし、東南アジア大陸部の宗教地図を決めた。
    detail: |
      アノーラターは、1044年にパガンの王位に就き、ビルマ史上最初の統一国家を築いた人物である。
      即位した時のパガンは、イラワジ川中流の一地方勢力にすぎなかった。
      彼は北のシャン高原から南の海岸部まで、三十年あまりの遠征で版図を広げた。

      転機になったのが、1057年の南方遠征である。
      モン人の都タトォンを攻め落とし、上座部仏教の経典と僧、そして職人たちをパガンへ連れ帰った。
      これによって、パガンは文化的にも宗教的にも一段高い水準へ引き上げられた。

      彼は上座部仏教を国の宗教として採用し、それまで有力だった密教的な教団を抑えた。
      土着の精霊信仰は根絶できなかったが、精霊を仏教の枠内に位置づける形で折り合いをつけた。
      シュエズィーゴン・パゴダの造営を始め、以後二百年続く仏塔建設の先例を作った。

      同時に、灌漑施設を整えて乾燥地帯の農業生産を高め、軍と寺院を養う基盤を作っている。
      1077年に狩りの最中に水牛に襲われて死んだと伝えられる。
      彼が定めた上座部仏教は、その後のビルマの千年を通じて変わらず国の宗教であり続けた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/e/e3/Pagan-kingdom.jpg
      credit: GE Harvey / GFDL
      page: https://commons.wikimedia.org/wiki/File:Pagan-kingdom.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/パガン王朝

  - id: suryavarman-ii
    title: スーリヤヴァルマン2世
    start: 1113
    end: 1150
    category: culture
    tags: [クメール, アンコール・ワット]
    summary: アンコール・ワットを造営し、ヒンドゥーの宇宙観を石の都に実現した。
    detail: |
      スーリヤヴァルマン2世は、12世紀前半のクメール王朝の王で、アンコール・ワットを建てた人物として知られる。
      王位は争いの末に奪い取ったもので、対立する王族を倒して1113年に即位した。
      分裂していた王国を再び一つにまとめ、内政と対外遠征の両方に力を注いだ。

      対外的には、東のチャンパーと西のモン人の地へくり返し遠征した。
      一時はチャンパーの都を占領し、大越へも軍を送っているが、いずれも長続きはしなかった。
      1116年には中国の宋へ使節を送り、公式の関係を回復している。

      最大の事業が、都の南に築いたアンコール・ワットである。
      従来の王がシヴァを祀ったのに対し、彼はヴィシュヌを主神に選んだ。
      中央の塔は宇宙の中心にある須弥山を表し、周囲の環濠は大海を意味する。
      回廊の壁には、彼自身が軍を率いる姿を刻んだレリーフも残されている。

      寺院は彼の死後も完成までに時間がかかり、のちに仏教寺院へと転用された。
      王朝が衰えて都が移されたあとも、この建物だけは僧が住み続けて放棄されなかった。
      そのためアンコール遺跡の中でも保存がよく、今はカンボジアの象徴になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/SuryavarnanII2.JPG/500px-SuryavarnanII2.JPG
      credit: ReijiYamashina / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:SuryavarnanII2.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スーリヤヴァルマン2世

  - id: jayavarman-vii
    title: ジャヤーヴァルマン7世
    start: 1181
    end: 1218
    category: politics
    tags: [クメール, 仏教]
    summary: チャンパを退けて領土を最大にし、病院と道路を整えた仏教王。
    detail: |
      ジャヤーヴァルマン7世は、12世紀末から13世紀初めにかけて、クメール王朝の領土を最大にした王である。
      即位の経緯が特異で、1177年にチャンパーの水軍が都を襲って王が殺されたあと、四年をかけて敵を追い払い、六十歳前後で位に就いた。
      国家が崩れかけた状況からの再建が、その治世の出発点になっている。

      彼は歴代の王と違い、大乗仏教を篤く信じた。
      新しい都アンコール・トムを築き、その中心に観世音菩薩の顔を四方に刻んだバイヨン寺院を置いた。
      二百を超える巨大な顔が見下ろす構造は、他に例のないものである。

      建設事業は寺院にとどまらなかった。
      碑文によれば、領内の街道沿いに百を超える宿駅と、百余りの施療院を設けたという。
      王の慈悲を民に及ぼすという仏教的な理念を、実際の施設として形にしようとした点が目を引く。

      ただし、短期間に集中した大工事は国の力を消耗させた。
      彼の死後、ヒンドゥー教徒による仏像の破壊が起こり、王朝は次第に力を失っていく。
      アンコールの繁栄は彼の時代が頂点であり、以後は衰退へ向かった。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/3/36/JayavarmanVII.JPG
      credit: 英語版ウィキペディアのPHGさん / Public domain
      page: https://commons.wikimedia.org/wiki/File:JayavarmanVII.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジャヤーヴァルマン7世

  - id: ramkhamhaeng
    title: ラームカムヘーン
    start: 1279
    end: 1298
    category: culture
    tags: [スコータイ, タイ文字]
    summary: タイ文字を定めたと伝えられ、タイ人の国家意識の出発点とされる。
    detail: |
      ラームカムヘーンは、13世紀末のスコータイ朝の王で、タイの歴史で最も敬われる君主のひとりである。
      父と兄の跡を継いで即位し、周辺の首長たちを従えて、王朝の勢力を最も広げた。
      タイでは「大王」の称号を付けて呼ばれる。

      彼の名を不朽にしたのは、1292年の年号を持つ石碑である。
      碑文には、王が民の訴えを直接聞いたこと、交易に税をかけなかったこと、そして自らタイ文字を作ったことが記されている。
      「父が子を治めるように」統治するという家父長的な王の姿が、そこに描かれている。

      ただし、この碑文については19世紀の偽作ではないかという議論が学界にある。
      文字の形や内容が後世的だという指摘があり、決着はついていない。
      碑文が語る理想の王像がタイの国民意識に深く食い込んでいるため、議論そのものが敏感な問題になっている。

      宗教面では、スリランカ系の上座部仏教をナコンシータマラートから招き、国の信仰として定着させた。
      彼の死後、従属していた諸勢力は離れ、王朝は急速に縮小する。
      それでも、タイ文字と上座部仏教という二つの遺産は、今日まで受け継がれている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/c/c7/Ramkhamhaeng_the_Great.jpg
      credit: Ananda / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ramkhamhaeng_the_Great.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ラームカムヘーン

  - id: gajah-mada
    title: ガジャ・マダ
    start: 1331
    end: 1364
    category: politics
    tags: [マジャパヒト, ジャワ]
    summary: 群島の統一を誓って遠征を重ね、のちのインドネシアが理想として振り返る版図を作った。
    detail: |
      ガジャ・マダは、14世紀のマジャパヒト王国で宰相を務め、その最盛期を作り出した人物である。
      出自は低く、宮廷の親衛隊の一員から身を起こした。
      反乱から王を救った功績で取り立てられ、やがて国政の頂点に立った。

      1336年、彼は宮廷で「パラパの誓い」を立てたと伝えられる。
      群島の島々をすべてマジャパヒトの下に置くまで、香辛料の入った食事を口にしないという誓いである。
      この言葉は後世まで語り継がれ、インドネシアの統一を象徴する一句になった。

      実際に彼は、艦隊を率いて各地へ遠征し、スマトラからマルク諸島に至る広い範囲を勢力下に入れた。
      王ハヤム・ウルクを補佐して法典の整備も進め、国の制度を固めている。
      ただし1357年、スンダ王国との婚姻交渉をめぐって相手の一行を殺させた事件は、宮廷内でも批判を受けた。

      1364年に没したあと、王は後任を置かず、その職は複数の官に分けられた。
      以後マジャパヒトは求心力を失っていく。
      20世紀の独立運動では、彼の誓いが群島統一の先例として引かれ、大学や道路に名が冠せられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Gajah-Mada.jpg/500px-Gajah-Mada.jpg
      credit: Gunawan Kartapranata (talk) / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Gajah-Mada.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ガジャ・マダ

  - id: le-loi
    title: 黎利
    start: 1428
    end: 1433
    category: war
    tags: [ベトナム, 黎朝]
    summary: 明の支配を10年の抗戦で退け、ベトナムの独立を取り戻した。
    detail: |
      黎利は、明の支配からベトナムを解放し、黎朝を開いた人物である。
      生まれは中部の地方豪族の家で、明の占領下で官職に就くことを拒み、1418年に故郷のランソンで挙兵した。
      当初の兵は数百人にすぎず、山中に潜んで敗走をくり返す苦しい出発だった。

      戦い方は正面衝突を避けるものだった。
      山岳地帯を拠点に神出鬼没の攻撃を仕掛け、敵の補給を断ち、疲弊させてから決戦に持ち込む。
      参謀の阮廌が檄文を書いて各地の支持を集め、十年をかけて明軍を追い詰めた。

      1427年、援軍として来た明の大軍を撃破し、包囲していた城の明軍には食料と船を与えて帰国させた。
      徹底的に殲滅せず退路を用意したのは、北の大国と長く争わないための判断だった。
      翌1428年に即位し、国号を大越として独立を回復する。

      伝説では、神から授かった剣で明を破り、戦い終えたあと湖の亀にそれを返したとされる。
      ハノイのホアンキエム（還剣）湖の名はここから来ている。
      在位は五年と短かったが、ベトナムでは民族の独立を取り戻した英雄として今も敬われている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Le_Loi_statue.JPG/500px-Le_Loi_statue.JPG
      credit: Nguyễn Thanh Quang / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Le_Loi_statue.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/黎利

  - id: le-thanh-tong
    title: 黎聖宗
    start: 1460
    end: 1497
    category: society
    tags: [ベトナム, 法典]
    summary: 中国式の官僚制と法典を整え、南進でベトナムの形を広げた。
    detail: |
      黎聖宗は、15世紀後半の黎朝の皇帝で、ベトナムの制度と領土の両面を作り変えた人物である。
      幼少で即位したのではなく、宮廷の政変を経て十七歳で位に就き、三十七年にわたって統治した。
      この治世は、ベトナム史で最も充実した時代のひとつとされる。

      内政では、中国の明の制度を徹底的に導入した。
      有力な軍人貴族の権限を削って六部による官僚統治へ移し、官僚は科挙で選んだ。
      合格者の名を石碑に刻んで文廟に立てる習慣を始め、その石碑は今もハノイに並んでいる。

      『洪徳法典』と呼ばれる法典を編み、土地・婚姻・相続の規定を整えた。
      この法典には、妻が夫と共同で財産を持てることや、女性が一定の条件で離婚を求められることなど、中国法には無い条文が含まれている。
      全国を測量して地図を作らせ、歴史書の編纂も進めた。

      1471年にはチャンパーへ遠征し、都のヴィジャヤを落として中部を併合した。
      これによってチャンパーは事実上滅び、ベトナムの版図は大きく南へ伸びる。
      制度と領土の両方で、現在のベトナムの骨格がこの治世に形になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/L%C3%AA_Th%C3%A1nh_T%C3%B4ng.jpg/500px-L%C3%AA_Th%C3%A1nh_T%C3%B4ng.jpg
      credit: Ngoisao.vn / Public domain
      page: https://commons.wikimedia.org/wiki/File:L%C3%AA_Th%C3%A1nh_T%C3%B4ng.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/黎聖宗

  - id: bayinnaung
    title: バインナウン
    start: 1551
    end: 1581
    category: war
    tags: [ビルマ, タウングー朝]
    summary: 大陸部の広い範囲を征服し、東南アジア史上まれな軍事帝国を作った。
    detail: |
      バインナウンは、16世紀後半のビルマのタウングー朝の王で、東南アジア大陸部の広い範囲を征服した人物である。
      王族の出ではなく、先王タビンシュエーティの側近から身を起こし、その義弟として頭角を現した。
      先王の暗殺後に起きた分裂を収め、1551年に王位に就いた。

      即位してからの三十年は、ほぼ絶え間ない遠征に費やされた。
      北のシャン諸侯国を服属させ、東のラーンナー（チエンマイ）とラーンサーン（ラオス）を攻め、南のアユタヤは二度にわたって落とした。
      1569年のアユタヤ攻略では、王族を人質として連れ帰り、傀儡の王を立てている。

      支配の方法は、征服地の王統を残して従属させるという緩やかなものだった。
      各地の王子を宮廷に置いて忠誠を保たせ、人と物資を中心へ集めた。
      首都ペグーの壮麗さは、来訪したヨーロッパ人が驚きをもって書き残している。

      ただし、この帝国は彼個人の力量に依存していた。
      1581年に没すると、征服地は次々に離反し、アユタヤはナレースワンのもとで独立を回復する。
      三十年足らずで崩れたとはいえ、その版図は東南アジア史上まれな規模であり、ミャンマーでは三大王の一人に数えられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/Bayinnaung.JPG/500px-Bayinnaung.JPG
      credit: Phyo WP / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Bayinnaung.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/バインナウン

  - id: naresuan
    title: ナレースワン
    start: 1590
    end: 1605
    category: war
    tags: [アユタヤ, タイ]
    summary: ビルマの支配を脱してアユタヤの独立を回復し、タイの英雄となった。
    detail: |
      ナレースワンは、16世紀末のアユタヤの王で、ビルマの支配から国を解放した人物である。
      少年期にビルマへ人質として送られ、バインナウンの宮廷で育った。
      敵の戦い方を内側から学んだ経験が、のちの戦争で生きることになる。

      1584年、ビルマ王が没して統制が緩んだ機を捉え、従属関係の破棄を宣言した。
      以後、押し寄せるビルマ軍を何度も撃退している。
      領内の住民を城内へ集めて田畑を焼き、敵を飢えさせてから叩くという焦土戦術を用いた。

      1593年の戦いが伝説になっている。
      ビルマの王太子と象に乗ったまま一騎打ちを行い、これを討ち取ったとされる。
      この逸話の細部には異説もあるが、タイでは国民的な物語として語り継がれ、記念碑や映画の題材になっている。

      独立を回復したあとは攻勢に転じ、カンボジアへ遠征し、マレー半島の港市も従えた。
      アユタヤの領域はこの時期に大きく広がり、交易も再び活発になる。
      1605年、ビルマへの遠征の途上で病没した。
      タイでは「大王」の称号を与えられ、国家の独立を守った象徴として扱われている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f0/Royal_statue_king_naresuan_ay.jpg/500px-Royal_statue_king_naresuan_ay.jpg
      credit: Satthavut Onla-or / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:Royal_statue_king_naresuan_ay.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ナレースワン

  - id: sultan-agung
    title: スルタン・アグン
    start: 1613
    end: 1645
    category: war
    tags: [マタラム, ジャワ]
    summary: ジャワの大半を統一してオランダのバタヴィアを攻め、抵抗の記憶として残った。
    detail: |
      スルタン・アグンは、17世紀前半の中部ジャワのマタラム王国の王で、この国を最も大きくした人物である。
      即位した時、ジャワには自立した港市が多く残っていた。
      彼は内陸の稲作地帯の力を背景に遠征をくり返し、東西の沿岸部を次々に従えた。

      最大の障害が、1619年にバタヴィアを築いたオランダ東インド会社だった。
      1628年と1629年の二度にわたって大軍を送り、この拠点を包囲する。
      しかし、海路を押さえられて補給が続かず、兵糧が尽きて撤退した。
      包囲中に飢えと疫病で失った兵は数万にのぼるとされる。

      敗北のあと、彼は内政の整備に向かった。
      イスラム暦とジャワの暦を組み合わせた独自の暦を定め、宮廷の儀礼と称号を整えて王権の権威を高めた。
      イスラムの君主でありながら、ヒンドゥー・ジャワの伝統も併せ持つ王の姿が、ここで形になる。

      1645年に没したあと、マタラムはオランダに頼る王が続き、次第に従属していった。
      彼が試みた抵抗は成功しなかったが、インドネシアの独立後は植民地支配に最初に立ち向かった英雄として語られている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スルタン・アグン

  - id: alaungpaya
    title: アラウンパヤー
    start: 1752
    end: 1760
    category: war
    tags: [ビルマ, コンバウン朝]
    summary: 分裂したビルマを再統一し、イギリスと衝突するまで続く王朝を開いた。
    detail: |
      アラウンパヤーは、18世紀半ばに分裂していたビルマを再統一し、コンバウン朝を開いた人物である。
      出身は上ビルマの村の首長で、王族とは無縁だった。
      1752年、南のモン人勢力が都アヴァを落として王朝が倒れた時、彼は降伏を拒んで抵抗を始めた。

      最初は自分の村を守るだけの小さな集団だったが、勝利を重ねるうちに周辺の首長が従った。
      彼は「アラウンパヤー（未来の仏）」と名乗り、宗教的な権威をまとって支持を集めた。
      数年で上ビルマ全域を回復し、1755年にはダゴンを占領してヤンゴン（争いの終わり）と改名する。

      1757年、モン人の都ペグーを陥落させて南部を制圧し、統一を完成させた。
      この過程で多くのモン人が殺され、あるいはシャムへ逃れ、モン人の政治勢力は事実上終わった。
      フランスやイギリスが現地勢力に武器を供給していたため、彼はヨーロッパ人の扱いにも注意を払っている。

      1760年、アユタヤを包囲中に病を得て、帰途に没した。
      在位は八年に過ぎないが、その間に築いた王朝は百三十年続く。
      ミャンマーではアノーラター、バインナウンと並ぶ三大王の一人とされている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f6/Alaungpaya.JPG/500px-Alaungpaya.JPG
      credit: Phyo WP / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Alaungpaya.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アラウンパヤー

  - id: taksin
    title: タークシン
    start: 1767
    end: 1782
    category: war
    tags: [タイ, トンブリー]
    summary: アユタヤ陥落の直後に国を建て直し、タイの国家としての連続性を保った。
    detail: |
      タークシンは、アユタヤが焼き払われた直後にタイを立て直し、十五年にわたって統治した王である。
      父は中国系の移民で、地方長官を務めていた。
      1767年の都の陥落の直前、手勢を率いて包囲を突破し、東の海岸地方へ逃れた。

      彼はそこで兵を集め、わずか数か月でビルマの守備隊を追い払い、都を回復した。
      焼け落ちたアユタヤは再建せず、河口に近いトンブリーに新しい都を置いた。
      海に近く、交易と防衛の両方に適した位置を選んだのである。

      続く十数年で、各地に割拠していた勢力を次々に平定した。
      北のチエンマイからビルマ勢力を駆逐し、東はカンボジアとラオスへ勢力を伸ばしている。
      中国との交易を積極的に進めて財政を立て直し、飢えていた国を短期間で回復させた。

      晩年、彼は自らを悟りに達した存在と称し、僧に礼拝を強いるなど常軌を逸した振る舞いを見せたと伝えられる。
      1782年に反乱が起きて廃され、処刑された。
      跡を継いだ将軍チャクリーがラーマ1世として現王朝を開く。
      彼への評価は複雑だが、国家の連続性を保った功績から「大王」と呼ばれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/KingTaksinfromItalymuseum.JPG/500px-KingTaksinfromItalymuseum.JPG
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:KingTaksinfromItalymuseum.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/タークシン

  - id: rama-i
    title: ラーマ1世
    start: 1782
    end: 1809
    category: politics
    tags: [タイ, チャクリー朝]
    summary: バンコクに新王朝を開き、現在まで続くタイ王室の祖になった。
    detail: |
      ラーマ1世は、チャクリー朝の初代の王で、現在のタイ王室の祖にあたる。
      本名はトーンドゥアンといい、アユタヤ時代の貴族の家に生まれ、タークシンのもとで将軍として各地を転戦した。
      1782年、タークシンが反乱で廃されると、遠征先から戻って王位に就いた。

      最初の仕事は、新しい都を築くことだった。
      川の西岸のトンブリーから東岸へ移り、運河を掘って中州の形に整え、その中心に王宮を置いた。
      ラタナコーシンと名づけられたこの都は、アユタヤの都市計画を意識して設計されている。

      彼が力を注いだのは、失われた文化の復元である。
      各地から僧を集めて仏典の内容を校訂し、王朝の法を整理して『三印法典』を編んだ。
      タイ語版のラーマーヤナである『ラーマキエン』も、彼の治世に文章としてまとめられた。

      対外的には、ビルマの侵攻を撃退し、ラオスとカンボジアへ影響力を広げた。
      1785年の大規模なビルマ軍の攻撃を退けたことで、以後ビルマからの脅威はほぼ消える。
      混乱からの復興と制度の再建を果たし、その王統は二百四十年を超えて続いている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/a/a7/Buddha_Yodfa_Chulaloke_portrait.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Buddha_Yodfa_Chulaloke_portrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ラーマ1世

  - id: gia-long
    title: 嘉隆帝
    start: 1802
    end: 1820
    category: politics
    tags: [ベトナム, 阮朝]
    summary: 南北のベトナムを一つにまとめ、現在の国土に近い版図を初めて実現した。
    detail: |
      嘉隆帝は、阮朝の初代皇帝で、南北に分かれていたベトナムを一つにまとめた人物である。
      南部を治めていた阮氏の一族に生まれたが、少年期に西山党の蜂起で一族の大半を殺され、逃亡生活を送った。
      シャムに亡命し、時には小島に潜んで再起の機会をうかがった。

      彼はフランス人宣教師ピニョー・ド・ベーヌの仲介で西洋の支援を求め、技術者や武器を得た。
      ヨーロッパ式の築城法や造船術を取り入れて軍を整え、南部から北上を始める。
      二十年以上の戦いの末、1802年に西山朝を倒し、全土を掌握した。

      統一後は中部のフエに都を定め、北京の紫禁城にならった王宮を築いた。
      国号を越南とし、清から冊封を受けて正統性を確保する。
      南北を結ぶ街道と駅を整え、法典を編み、中央集権的な統治の仕組みを作った。

      支援を受けたフランスに対しては、通商上の特権を与えることは拒んだ。
      後継の皇帝たちはさらに西洋を警戒し、キリスト教を弾圧する。
      それがのちにフランス介入の口実となるのだから、彼が開いた王朝の運命は皮肉なものだった。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/8/86/Emperor_Gia_Long.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emperor_Gia_Long.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/嘉隆帝

  - id: mongkut
    title: ラーマ4世（モンクット）
    start: 1851
    end: 1868
    category: politics
    tags: [タイ, 開国]
    summary: 西洋の学問を学んだ王として不平等条約を受け入れつつ、独立を保つ道を選んだ。
    detail: |
      ラーマ4世（モンクット）は、19世紀半ばのシャム（タイ）の王で、西洋との向き合い方を大きく変えた人物である。
      王子だった時期に王位継承から外れ、二十七年間を僧として過ごした。
      この間に各地を歩いて民の暮らしを知り、宣教師から英語やラテン語、天文学や数学を学んでいる。

      1851年に即位した時、周辺ではイギリスがビルマを削り取り、フランスがインドシナへ迫っていた。
      彼は武力で抗うことを選ばず、1855年にイギリスとボーリング条約を結んで開国した。
      治外法権を認め、関税を低く抑える不平等な内容だったが、他国とも同様の条約を結ぶことで一国に依存しない形を作った。

      内政では西洋の技術と知識の導入を進め、外国人を顧問に招き、道路や造船所を整えた。
      僧であった経験から仏教の改革にも取り組み、戒律を厳格に守る一派を興している。

      1868年、日食の観測のために南部へ遠征し、自らの計算通りに起きることを示した。
      しかし、その地でマラリアに感染して没する。
      彼が選んだ「譲れるところは譲り、独立だけは守る」という路線は、息子のラーマ5世に引き継がれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5f/First_King_of_Siam_MET_DP-573-001_%28cropped%29.jpg/500px-First_King_of_Siam_MET_DP-573-001_%28cropped%29.jpg
      credit: John Thomson / CC0
      page: https://commons.wikimedia.org/wiki/File:First_King_of_Siam_MET_DP-573-001_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ラーマ4世

  - id: chulalongkorn
    title: ラーマ5世（チュラロンコン）
    start: 1868
    end: 1910
    category: society
    tags: [タイ, 近代化]
    summary: 奴隷制の廃止と行政改革を進め、タイを東南アジア唯一の独立国として残した。
    detail: |
      ラーマ5世（チュラロンコン）は、四十二年にわたってシャムを統治し、国を近代国家へ作り変えた王である。
      十五歳で即位したため当初は摂政が置かれ、その間にヨーロッパ各地とアジアの植民地を視察した。
      親政を始めてからの改革は、社会の根幹に及んだ。

      最も大きいのが、奴隷制と賦役制の廃止である。
      一度に廃止すれば混乱を招くと考え、1874年から段階的に進め、三十年以上かけて完全に消滅させた。
      人を位階に縛りつけていたサクディナー体制が解かれ、労働力が自由に移動できるようになった。

      行政の仕組みも改めた。
      各地の世襲の領主に委ねていた統治をやめ、中央から知事を派遣する省庁制を敷いた。
      鉄道と電信で地方を結び、郵便制度と近代的な学校、常備軍を整えている。

      対外的には、領土の一部を手放すことで中心を守った。
      ラオスとカンボジアの一部をフランスに、マレー半島北部の州をイギリスに譲り、その代わり独立を認めさせた。
      タイでは「偉大なる敬愛王」と呼ばれ、命日の10月23日は今も国の祝日になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Chulalongkorn_LoC.jpg/500px-Chulalongkorn_LoC.jpg
      credit: Bain News Service, publisher. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Chulalongkorn_LoC.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ラーマ5世

  - id: aung-san
    title: アウンサン
    start: 1945
    end: 1947
    category: politics
    tags: [ビルマ, 独立]
    summary: 独立をまとめる直前に暗殺され、ビルマ建国の父として神話化された。
    detail: |
      アウンサンは、ビルマの独立運動を率い、建国の直前に暗殺された指導者である。
      ラングーン大学の学生運動から出発し、イギリス支配への抵抗を組織した。
      1940年に国外へ脱出し、日本の支援を受けて軍事訓練を受けた「三十人志士」の一人になる。

      1942年、日本軍とともにビルマへ戻り、ビルマ独立義勇軍を率いた。
      しかし日本が約束した独立が名ばかりのものだと分かると、方針を転換する。
      1945年3月、彼は反ファシスト人民自由連盟を組織して日本軍に反旗を翻し、連合国側へついた。

      戦後はイギリスとの交渉に臨み、1947年1月に一年以内の独立を認めさせる協定を結んだ。
      同年2月には、少数民族の指導者たちとパンロン協定を交わし、統一国家への参加を取りつけている。
      多民族国家としてのビルマをどうまとめるかという難題に、彼なりの答えを出そうとした。

      1947年7月、閣議の最中に武装集団が乱入し、彼を含む七人が射殺された。
      三十二歳だった。
      独立は翌1948年に実現したが、少数民族との関係は未解決のまま残り、内戦が今日まで続いている。
      娘のアウンサンスーチーは、この父の名を背負って民主化運動を率いた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f6/Aung_San_in_uniform.jpg/500px-Aung_San_in_uniform.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Aung_San_in_uniform.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アウンサン

  - id: sukarno
    title: スカルノ
    start: 1945
    end: 1967
    category: politics
    tags: [インドネシア, 非同盟]
    summary: 独立を宣言し、バンドン会議で「第三世界」という立場を世界に示した。
    detail: |
      スカルノは、インドネシアの独立を宣言し、初代大統領となった人物である。
      工学を学んだのち、1927年にインドネシア国民党を結成して独立を訴えた。
      オランダ当局に逮捕され、裁判での弁論と長い流刑生活を通じて、民族運動の象徴的存在になっていく。

      日本の占領期には、独立への近道と見て協力を選んだ。
      動員のための組織で演説を重ね、群島全体に自分の名と主張を届けている。
      1945年6月には、唯一神への信仰、人道主義、統一、民主主義、社会正義からなる建国五原則「パンチャシラ」を提唱した。

      日本の降伏から二日後の8月17日、彼はハッタとともに独立を宣言した。
      オランダは軍を送って抵抗し、四年に及ぶ独立戦争の末、1949年に主権の移譲に応じる。
      1955年にはバンドンでアジア・アフリカ会議を開き、米ソのどちらにもつかない第三の立場を世界に示した。

      1959年以降、彼は議会政治を退けて「指導される民主主義」を掲げ、軍と共産党の均衡の上に立つ統治を行った。
      1965年の政変で実権を失い、軍のスハルトに権力を奪われる。
      軟禁のまま1970年に没したが、今も建国の父として敬われている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/Presiden_Sukarno.jpg/500px-Presiden_Sukarno.jpg
      credit: Onbekend/Anonymous / Public domain
      page: https://commons.wikimedia.org/wiki/File:Presiden_Sukarno.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スカルノ

  - id: ho-chi-minh
    title: ホー・チ・ミン
    start: 1945
    end: 1969
    category: politics
    tags: [ベトナム, 独立]
    summary: 対仏・対米の二つの戦争を通じてベトナム統一の旗を立て続けた。
    detail: |
      ホー・チ・ミンは、ベトナムの独立運動を半世紀にわたって率いた指導者である。
      若い頃に船の調理助手として国を出て、フランス、イギリス、アメリカ、ソ連、中国を渡り歩いた。
      1919年のパリ講和会議に植民地の自決を求める請願を出したことが、政治活動の出発点になっている。

      フランス共産党の創立に加わり、コミンテルンの一員として活動したのち、1930年にインドシナ共産党の結成をまとめた。
      1941年に三十年ぶりに帰国し、山岳地帯でベトミンを組織する。
      1945年9月2日、日本の降伏後の空白を突いてハノイで独立を宣言した。
      宣言文の冒頭には、アメリカ独立宣言の一節が引かれている。

      フランスが支配の回復を図ると、九年に及ぶ第一次インドシナ戦争になった。
      1954年のディエンビエンフーの勝利で北半分の独立を確保したが、国は南北に分断される。
      以後は南の解放と統一を掲げ、アメリカの介入による戦争を指導した。

      質素な生活と柔らかな話しぶりで「ホーおじさん」と呼ばれ、国民統合の象徴となった。
      1969年、戦争の決着を見ないまま没する。
      統一は六年後に実現し、サイゴンは彼の名を冠した都市に改められた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/Ho_Chi_Minh_-_1946_Portrait.jpg/500px-Ho_Chi_Minh_-_1946_Portrait.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ho_Chi_Minh_-_1946_Portrait.jpg
    links:
