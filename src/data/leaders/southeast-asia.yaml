  - id: marcos
    title: マルコス
    start: 1965
    end: 1986
    category: politics
    tags: [フィリピン, 戒厳令]
    summary: 戒厳令で長期支配を敷き、ピープルパワー革命で国外に追われた。
    detail: |
      フェルディナンド・マルコスは、1965年から1986年までフィリピンの大統領を務めた人物である。
      弁護士出身の若く弁の立つ政治家として登場し、当初はインフラ整備で支持を得た。
      二期目の任期が切れる時、憲法で禁じられた三選を避けるために別の道を選ぶ。

      1972年、彼は共産主義者の脅威と社会の混乱を理由に戒厳令を布告した。
      議会を閉じ、野党指導者を逮捕し、報道を統制して、実質的な独裁体制を敷いた。
      縁故者に事業の独占権を与える構造が広がり、いわゆるクローニー資本主義が国を覆った。

      対外借款に依存した経済は1980年代に行き詰まり、債務危機に陥る。
      1983年、亡命先から帰国した野党指導者ベニグノ・アキノが空港で射殺された事件が、政権への怒りを一気に高めた。

      1986年の大統領選挙で不正が横行すると、市民と教会、軍の一部が立ち上がった。
      非暴力の大群衆が戦車を止めた「ピープルパワー革命」によって、マルコスはハワイへ脱出する。
      一族が蓄えた資産は数十億ドルとされ、その回収は今も続いている。
      この革命は、以後の各国の民主化運動の手本になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/Ferdinand_Marcos_%28cropped%29.jpg/500px-Ferdinand_Marcos_%28cropped%29.jpg
      credit: "derivative work: Bluemask (talk) Ferdinand_Marcos_and_George_Shultz_DA-SC-84-05877.JPEG: Spec. 4 Dino Bartomucci / CC BY-SA 3.0"
      page: https://commons.wikimedia.org/wiki/File:Ferdinand_Marcos_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フェルディナンド・マルコス

  - id: suharto
    title: スハルト
    start: 1967
    end: 1998
    category: politics
    tags: [インドネシア, 開発独裁]
    summary: 大量殺害を伴う政変で権力を握り、32年の開発独裁を通貨危機で終えた。
    detail: |
      スハルトは、1967年から1998年までインドネシアを統治した軍人・政治家である。
      ジャワの農村に生まれ、オランダ領時代の兵から日本占領期の軍事訓練を経て、独立戦争で頭角を現した。
      1965年時点では陸軍戦略予備軍の司令官だった。

      同年9月30日、軍の高官が殺害される事件が起きると、彼は素早く事態を収拾し、共産党の仕業と断定した。
      続く数か月で全国的な共産主義者狩りが行われ、少なくとも五十万人が殺害されたとされる。
      この流血の上に実権を握り、スカルノを退けて1968年に正式な大統領となった。

      彼は自らの体制を「新秩序」と呼び、開発を最優先に掲げた。
      欧米と国際機関の支援を受け入れ、石油収入も追い風になって、経済は長期にわたって成長した。
      米の自給を達成し、貧困率も下がっている。
      一方で、批判は封じられ、一族と取り巻きが経済の要所を押さえた。
      東ティモールの併合では多数の犠牲を出している。

      1997年のアジア通貨危機で通貨と銀行が崩れ、物価が急騰した。
      学生と市民の抗議が全国に広がり、1998年5月に辞任する。
      三十二年の体制が終わり、インドネシアは民主化へ向かった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/President_Suharto%2C_1993.jpg/500px-President_Suharto%2C_1993.jpg
      credit: State Secretariat of the Republic of Indonesia / Public domain
      page: https://commons.wikimedia.org/wiki/File:President_Suharto,_1993.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スハルト

  - id: pol-pot
    title: ポル・ポト
    start: 1975
    end: 1979
    category: disaster
    tags: [カンボジア, 虐殺]
    summary: 都市と知識人を否定する極端な農本主義で、人口の2割近い犠牲を出した。
    detail: |
      ポル・ポトは、クメール・ルージュを率いてカンボジアを四年足らず支配した人物である。
      本名はサロット・サルといい、比較的豊かな農家に生まれ、奨学金を得てパリに留学した。
      そこで共産主義に触れ、帰国後に地下組織で活動を始める。

      彼の構想は、極端に単純化された革命論だった。
      都市は搾取の場であり、農民こそが純粋な階級であるとして、社会を農村共同体だけに作り変えようとした。
      工業も貨幣も教育も、その妨げとして否定された。
      1975年に首都を制圧すると、この構想がそのまま実行に移される。

      政権の内部でも粛清は続いた。
      計画が進まないのは裏切り者のせいだとされ、幹部が次々に拷問と処刑にかけられた。
      トゥールスレンの尋問施設では、一万数千人が取り調べを受け、生還した者はごくわずかだった。

      1979年にベトナム軍の侵攻で政権が崩れると、彼はタイ国境の山中へ逃れ、ゲリラとして抵抗を続けた。
      冷戦の構図の中で西側と中国が反ベトナムの立場から彼らを黙認したため、組織は長く生き延びた。
      1997年に内部の抗争で失脚し、翌年、裁かれないまま病死した。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/c/c1/Pol_Pot_%28cropped%29.jpg
      credit: 作者不明 / Attribution
      page: https://commons.wikimedia.org/wiki/File:Pol_Pot_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ポル・ポト

  - id: mahathir
    title: マハティール
    start: 1981
    end: 2003
    category: economy
    tags: [マレーシア, ルックイースト]
    summary: 日本や韓国に学ぶ工業化を掲げ、マレーシアを中所得国に押し上げた。
    detail: |
      マハティールは、1981年から2003年まで二十二年にわたってマレーシアの首相を務めた人物である。
      医師から政治家に転じ、マレー人の地位向上を強く訴えて頭角を現した。
      一度は党を除名されたが復帰し、やがて政権の頂点に立った。

      経済政策の柱が「ルックイースト政策」である。
      欧米ではなく日本と韓国の労働倫理や企業のあり方に学ぶべきだとして、留学と技術提携を進めた。
      輸出向けの製造業を誘致して電子産業を育て、国産車の計画や大規模な建設事業にも取り組んだ。
      クアラルンプールのツインタワーは、その時代の象徴である。

      多民族国家の運営では、マレー人を優遇するブミプトラ政策を続けた。
      民族間の経済格差を縮める効果はあったが、中国系やインド系との緊張の火種にもなっている。
      強い指導力は同時に強権でもあり、治安法による拘束や司法への介入、副首相アンワルの投獄は国内外から批判を受けた。

      1997年の通貨危機では、IMFの処方箋を拒んで資本移動を規制し、独自の道で乗り切った。
      2003年に退任したが、2018年に九十二歳で再び首相となり、世界最高齢の首脳として注目された。
      マレーシアの工業化を主導した指導者として、評価と批判の両方が今も続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Prime_Minister_Mahathir_bin_Mohamad.jpg/500px-Prime_Minister_Mahathir_bin_Mohamad.jpg
      credit: Пресс-служба Президента РТ / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Prime_Minister_Mahathir_bin_Mohamad.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マハティール・ビン・モハマド

  - id: aung-san-suu-kyi
    title: アウンサンスーチー
    start: 2016
    end: 2021
    category: politics
    tags: [ミャンマー, 民主化]
    summary: 長い軟禁を経て民政を率いたが、国軍のクーデタで再び拘束された。
    detail: |
      アウンサンスーチーは、ミャンマーの民主化運動を率い、のちに国政を担った政治家である。
      独立の英雄アウンサンの娘として生まれ、二歳の時に父を暗殺で失った。
      イギリスで研究者と結婚して家庭を築いていたが、1988年に母の看病のため帰国し、折から起きた民主化運動の渦中に入った。

      彼女は国民民主連盟を結成し、非暴力による民主化を訴えた。
      軍政は1989年に自宅軟禁とし、1990年の総選挙で党が圧勝しても結果を認めなかった。
      合計で十五年に及ぶ軟禁の間、1991年にノーベル平和賞を受けている。
      受け取りに行けば帰国できなくなるため、授賞式には出席しなかった。

      2010年に解放され、軍政から民政への移管が進む中で政治の表舞台に戻った。
      2015年の総選挙で党が圧勝し、憲法の規定で大統領にはなれないため「国家顧問」という職を新設して実質的な指導者となった。

      しかし、その政権は西側の期待とは異なる姿を見せた。
      ロヒンギャに対する軍の掃討作戦を擁護し、国際司法裁判所でミャンマーを弁護したことで、名声は大きく損なわれた。
      2021年2月、国軍はクーデターで政権を倒し、彼女を再び拘束した。
      複数の罪で長期の刑を言い渡され、現在も自由を奪われている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/9/97/Aung_San_Suu_Kyi_at_the_Enthronement_of_Naruhito_%281%29.jpg
      credit: ​内閣官房内閣広報室 / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Aung_San_Suu_Kyi_at_the_Enthronement_of_Naruhito_(1).jpg
    links:
      - label: Wikipedia
