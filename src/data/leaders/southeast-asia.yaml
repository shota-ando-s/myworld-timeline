        url: https://ja.wikipedia.org/wiki/ホー・チ・ミン

  - id: sihanouk
    title: シハヌーク
    start: 1953
    end: 1970
    category: politics
    tags: [カンボジア, 中立]
    summary: 独立を勝ち取り中立を保とうとしたが、インドシナ戦争の渦に巻き込まれた。
    detail: |
      シハヌークは、カンボジアの独立を実現し、その後半世紀にわたって国政の中心にいた人物である。
      1941年、十八歳でフランスによって王に選ばれた。
      扱いやすい若者と見なされての人選だったが、その予想は外れることになる。

      1953年、彼は各国を回って世論に訴える「独立のための王の十字軍」を展開し、フランスから完全な独立を勝ち取った。
      1955年には王位を父に譲って政治家となり、選挙を通じて首相の座に就く。
      王という立場を離れて直接政治に関わるという、異例の選択だった。

      外交では、冷戦のどちらの陣営にもつかない中立を掲げた。
      バンドン会議に参加し、アメリカとも中国とも関係を保とうとしたが、隣国でベトナム戦争が激化すると、その舵取りは難しくなる。
      国境地帯は北ベトナム軍の通路となり、アメリカによる秘密爆撃を受けた。

      1970年、彼の外遊中にロン・ノルがクーデターを起こして政権を奪った。
      シハヌークは亡命先でクメール・ルージュと手を結び、その勝利後は名目上の元首とされたが、実際には軟禁された。
      1993年に王政復古で再び即位し、2004年に退位。
      激動の中で立場を変えながら、国家の象徴であり続けた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/Norodom_Sihanouk_Coronation_Regalia_1941_bw.jpg/500px-Norodom_Sihanouk_Coronation_Regalia_1941_bw.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Norodom_Sihanouk_Coronation_Regalia_1941_bw.jpg
    links:
