  - id: lee-kuan-yew
    title: リー・クアンユー
    start: 1959
    end: 1990
    category: economy
    tags: [シンガポール, 開発]
    summary: 資源のない都市国家を一代で先進国にし、「開発独裁」の成功例として語られた。
    detail: |
      リー・クアンユーは、シンガポールの初代首相として三十一年にわたって国を率いた人物である。
      イギリスで法律を学び、帰国後に人民行動党を結成した。
      1959年の自治政府発足とともに首相となり、以後長期にわたって政権を握った。

      出発点は厳しかった。
      1965年にマレーシアから分離した時、この島には資源も水源もなく、失業と民族間の緊張を抱えていた。
      彼は外国資本を積極的に呼び込み、工業団地を整備し、英語を共通語として教育に投資した。

      統治の手法は強権的だった。
      言論への訴訟、野党への圧力、住宅や兵役を通じた社会管理など、批判を抑える仕組みが張りめぐらされた。
      一方で汚職の摘発は徹底し、官僚に高い報酬を払って清廉さを保つという方法をとった。
      この組み合わせが「開発独裁」の成功例と呼ばれる理由である。

      一人当たりの所得は、独立時の数百ドルから先進国の水準を超えるまでになった。
      1990年に首相を退いたあとも、上級相・顧問相として影響力を保った。
      2015年に没した時、その手法への評価は分かれたままだったが、国を作り上げた功績は広く認められている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/Prime_Minister_Lee_Kuan_Yew_of_Singapore_Making_a_Toast_at_a_State_Dinner_Held_in_His_Honor%2C_1975.jpg/500px-Prime_Minister_Lee_Kuan_Yew_of_Singapore_Making_a_Toast_at_a_State_Dinner_Held_in_His_Honor%2C_1975.jpg
