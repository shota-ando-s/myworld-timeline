lane: southeast-asia

leaders:
  - id: jayavarman-ii-reign
    title: ジャヤーヴァルマン2世
    start: 802
    end: 835
    endCirca: true
    category: religion
    tags: [クメール, 神王]
    summary: 自らを神と一体の王と宣言し、アンコール王朝600年の正統性の型を作った。
    detail: |
      ジャヤーヴァルマン2世は、9世紀初めにクメールの諸勢力をまとめ、アンコール王朝の始まりとされる王である。
      出自には不明な点が多く、ジャワに滞在した経験を持つとも伝えられるが、確かなことは分かっていない。
      生前の碑文がほとんど残っておらず、その事績は二百年以上あとに書かれた記録から知られる。

      最も重要とされるのが、802年にクーレン山で行ったとされる儀式である。
      彼はここで「チャクラヴァルティン（転輪聖王）」を宣言し、ジャワへの従属を断ち切って独立した支配者となった。
      この時に、王をシヴァと一体のものとして崇める「デーヴァラージャ（神なる王）」の祭祀が定められたと伝えられる。

      この観念は、その後六百年にわたる王朝の正統性の柱になった。
      王は単なる征服者ではなく、宇宙の秩序を地上に映す存在だとされ、寺院の造営がその証明になった。
      歴代の王が競って巨大な建築を残したのは、この考え方があったからである。

      彼自身は都を何度か移し、最後はハリハラーラヤに落ち着いた。
      王朝の領域を広げたのは後代の王たちだが、その拠って立つ枠組みを作ったのが彼である。
      アンコールの六百年は、この一度の宣言から始まったとされている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Flag_of_Cambodia_%28pre-1863%29.svg/500px-Flag_of_Cambodia_%28pre-1863%29.svg.png
      credit: Blackcat / CC0
