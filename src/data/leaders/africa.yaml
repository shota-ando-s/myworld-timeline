      page: https://commons.wikimedia.org/wiki/File:Calif_al_Muizz_Misr_Cairo_969_CE.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ムイッズ

  - id: sundiata
    title: スンジャタ
    start: 1235
    startCirca: true
    end: 1255
    endCirca: true
    category: politics
    tags: [マリ帝国, 叙事詩]
    summary: マリ帝国を建て、その生涯が西アフリカの口承叙事詩として語り継がれた。
    detail: |
      マリ帝国を建てた人物で、13世紀の前半に活動した。
      その生涯は口承の叙事詩として語り継がれ、現在も演じられている。

      物語によれば、幼いころ歩くことができなかった。
      迫害を受けて亡命し、各地を巡って支持者を集める。
      当時、この地域はソッソ王国の支配下にあった。
      スンジャタは諸氏族を結集し、決戦でその王を破ったとされる。
      建国後に定めたとされる取り決めが、口承で伝えられてきた。
      各氏族の役割と権利、狩人の掟、奴隷の扱い、争いの解決の仕方が含まれる。
      近年、これを人権に関する古い憲章として評価する見方も出ている。

      統治では、農業と交易の双方を重んじた。
      金の産地を押さえ、隊商路の安全を確保する。
      彼自身が実在したことは、同時代のアラビア語の記録からも裏づけられる。
      ただし伝えられる物語の多くは、語り部によって数世紀かけて形を整えられたものである。

      語り部はグリオと呼ばれ、王家の系譜と歴史を暗誦して伝える専門職だった。
      文字ではなく口承によって歴史が保たれた例として、この叙事詩は重要な資料になっている。
      西アフリカの文化的な自己認識の中心にある物語でもある。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/8/87/Djenne_Terracotta_Archer_%2813th-15th_cent%29.jpg
      credit: Franko Khoury / Public domain
      page: https://commons.wikimedia.org/wiki/File:Djenne_Terracotta_Archer_(13th-15th_cent).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スンジャタ・ケイタ

  - id: mansa-musa
    title: マンサ・ムーサ
    start: 1312
    end: 1337
    category: economy
    tags: [マリ帝国, 金]
    summary: メッカ巡礼で配った金が相場を動かしたと伝わる、西アフリカの富の象徴。
    detail: |
      マリ帝国の王で、在位は1312年から1337年ごろまで。
      メッカ巡礼で配った金が相場を動かしたと伝えられる。
      西アフリカの富を世界に知らせた人物である。

      帝国はニジェール川の湾曲部を中心に、西は大西洋岸まで広がっていた。
      領内の金鉱は、当時の世界の産出量の相当部分を占めたとされる。
      塩、銅、馬、織物がサハラを越えて運ばれ、金と交換された。
      1324年の巡礼は、その規模で知られる。
      数千人の随行者と、多数のらくだが金を運んだ。
      カイロでは惜しみなく金が配られ、その影響で現地の金の相場が数年にわたり下がったと記録されている。

      帰路にはイスラム世界の建築家や学者を伴った。
      トンブクトゥやガオにモスクと学院が建てられ、写本の収集と教育が進む。
      トンブクトゥは、以後200年にわたって学問の中心になった。

      この巡礼の後、ヨーロッパの地図にマリの王が金塊を手にする姿で描かれるようになる。
      1375年のカタロニアの地図がその代表である。
      現在の貨幣価値に換算して史上最も富裕な人物だという議論もあるが、根拠のある計算は難しい。
      アフリカ内陸の国家が世界の経済と結びついていたことを示す例として重要である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/c/c1/Mansa_Musa.jpg
      credit: Reproduction of the Catalan Atlas of the 20th century that can not be considered facsimile of the original. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Mansa_Musa.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マンサ・ムーサ

  - id: sonni-ali
    title: ソンニ・アリ
    start: 1464
    end: 1492
    category: war
    tags: [ソンガイ帝国, トンブクトゥ]
    summary: 川を使う水軍と騎兵でニジェール川流域を制し、ソンガイを帝国に育てた。
    detail: |
      ソンガイ帝国を大国に育てた君主で、在位は1464年から1492年まで。
      川の水軍と騎兵を組み合わせてニジェール川流域を制した。

      即位したとき、ソンガイはガオを中心とする一地方の勢力にすぎなかった。
      マリ帝国は衰え、トゥアレグがトンブクトゥを支配している。
      ソンニ・アリは、ほぼ毎年のように遠征を行った。
      1468年にトンブクトゥを、1473年にジェンネを攻略する。
      ジェンネは湿地に囲まれた都市で、7年の包囲を要したと伝えられる。

      軍の特徴は、ニジェール川を使う舟の部隊である。
      川沿いの都市を機動的に攻め、物資を運ぶことができた。
      騎兵と組み合わせることで、広い流域を短期間に制圧している。

      宗教に対する態度は複雑だった。
      イスラムを受け入れつつ、在来の信仰と儀礼も保つ。
      トンブクトゥの学者を弾圧したため、イスラムの年代記では暴君として厳しく描かれた。
      一方、口承の伝統では偉大な王として語られる。
      同じ人物の評価が、記録の立場によって正反対になる例である。
      1492年、遠征からの帰路に川を渡る際に没したとされる。
      息子は短期間で倒され、将軍のアスキア・ムハンマドが政権を握った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スンニ・アリ

  - id: qaitbay
    title: カーイトバーイ
    start: 1468
    end: 1496
    category: culture
    tags: [マムルーク朝, 建築]
    summary: 交易の富で壮麗な建築を残し、マムルーク朝最後の安定期を作った。
    detail: |
      マムルーク朝のスルタンで、在位は1468年から1496年まで。
      交易の富で壮麗な建築を残し、王朝最後の安定期を作った。

      マムルークとして買われてエジプトに来た。
      軍人として昇進を重ね、50代でスルタンに推された。
      当時のマムルーク朝は、スルタンが数年で交代することが常態になっており、28年の在位は異例である。
      対外的には、東のオスマン帝国との緊張が高まっていた。
      アナトリア南部をめぐって数度衝突し、いずれも押し返している。
      経済の基盤は、インド洋から紅海を経る香辛料の交易だった。
      通行税と専売が国庫を支える。

      その富は建築に投じられた。
      カイロには、彼が建てたモスクと学院、墓廟が残る。
      石の組み方と彫刻の精緻さで、マムルーク建築の頂点とされる。
      アレクサンドリアでは、崩れた大灯台の跡に要塞を築いた。
      メッカとメディナ、エルサレムの施設も修復している。

      晩年、ポルトガル船がインド洋に現れ始めた。
      喜望峰を回る航路が開かれると、紅海経由の交易は打撃を受ける。
      死後、王朝は急速に傾いた。
      20年余り後、オスマン帝国によって滅ぼされる。
      繁栄の最後の時期を体現した統治者だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Qait_Bay_%2881651352%29.jpg/500px-Qait_Bay_%2881651352%29.jpg
      credit: Paolo Giovio / Public domain
      page: https://commons.wikimedia.org/wiki/File:Qait_Bay_(81651352).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アシュラフ・カーイトバーイ

  - id: askia-muhammad
    title: アスキア・ムハンマド
    start: 1493
    end: 1528
    category: politics
    tags: [ソンガイ帝国, トンブクトゥ]
    summary: ソンガイを最盛期に導き、トンブクトゥをイスラム学問の中心に育てた。
    detail: |
      ソンガイ帝国の君主で、在位は1493年から1528年まで。
      帝国を最盛期に導き、トンブクトゥをイスラム学問の中心に育てた。

      前任のソンニ・アリの将軍だったが、その死後に後継者を倒して政権を握った。
      アスキアは称号で、王朝の名にもなっている。
      統治の特徴は、制度の整備にある。
      領域を州に分けて知事を任命し、中央から監督した。
      財務、軍事、司法を担う官職を設け、度量衡を統一する。
      常備の軍と、川を使う水軍を維持した。

      イスラムを統治の柱に据えた。
      法学者を重用し、イスラム法にもとづく裁判を広める。
      1496年にはメッカへ巡礼し、大量の金を携えて各地で施しを行った。
      この旅で西アフリカのカリフの称号を得たとされる。

      トンブクトゥでは学問が栄えた。
      サンコーレの学院に各地から学生が集まり、法学、神学、天文学、医学が教えられる。
      写本の売買が盛んで、蔵書を持つことが富の象徴とされた。
      晩年は盲目となり、息子に退位させられて島に幽閉される。
      死後、後継争いが続いて帝国は弱体化した。
      60年余り後、モロッコの火器を備えた軍に敗れて滅ぶことになる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アスキア・ムハンマド1世

  - id: idris-alauma
    title: イドリース・アローマ
    start: 1571
    end: 1603
    category: war
    tags: [カネム・ボルヌ, 火器]
    summary: オスマンから火器を導入し、サハラ交易の要を押さえた。
    detail: |
      カネム・ボルヌの君主で、在位は16世紀後半から17世紀初めまで。
      オスマン帝国から火器を導入し、サハラ交易の要を押さえた。

      即位したとき、王国は内紛と周辺勢力の圧力で弱っていた。
      イドリースは軍の再建から着手する。
      最大の変化は火器の導入である。
      オスマン帝国と使節を交わし、鉄砲とトルコ人の教官を得た。
      騎兵とらくだ隊に加えて銃兵の部隊を編成し、周辺の勢力に対して圧倒的な優位に立つ。

      軍事行動によって、サハラ縦断の交易路の要地を確保した。
      北への道が安全になり、塩、馬、武器の輸入と、奴隷や象牙の輸出が拡大する。
      統治では、イスラム法の適用を徹底した。
      在来の慣習にもとづく裁判をイスラム法の法廷に置き換え、法学者を任命する。
      自らメッカへ巡礼し、カイロに施設を設けた。

      城壁を備えた都市を築き、交易路に沿って宿場を整備している。
      彼の事績は、宮廷の書記が記した年代記によって詳しく伝わる。
      アフリカ内陸の国家について、同時代の現地の記録が残る数少ない例である。
      死後も王国は続き、19世紀まで存続した。
      火器の導入が地域の力関係を変えた、早い時期の例でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/Kanem_flag_from_dulcerta_1339-pt.svg/500px-Kanem_flag_from_dulcerta_1339-pt.svg.png
      credit: 4shizzal (トーク · 投稿記録) / CC0
      page: https://commons.wikimedia.org/wiki/File:Kanem_flag_from_dulcerta_1339-pt.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カネム・ボルヌ帝国

  - id: nzinga
    title: ンジンガ女王
    start: 1624
    end: 1663
    category: politics
    tags: [アンゴラ, 奴隷貿易]
    summary: ポルトガルの奴隷貿易に外交と戦の両方で40年抗い続けた。
    detail: |
      現在のアンゴラにあったンドンゴとマタンバの女王で、17世紀に40年近く統治した。
      ポルトガルの奴隷貿易に、外交と戦争の両方で抗い続けた。

      王家に生まれ、兄の代に使節としてポルトガルの総督と交渉した。
      席を用意されなかったとき、従者に背を向けて四つん這いにさせ、その上に座って対等の立場を示したという逸話が伝えられる。
      この交渉では和平とポルトガル軍の撤退を約束させている。
      兄の死後、自ら統治者となった。
      ポルトガルが約束を守らずに侵攻すると、内陸へ退いて隣のマタンバを征服し、そこを拠点に抵抗を続ける。

      戦い方は柔軟だった。
      ポルトガルの敵であるオランダと同盟を結び、武器を得て反撃する。
      逃亡した奴隷や兵士を受け入れて軍に加え、周辺の集団とも連携した。
      キリスト教に改宗し、洗礼名を用いて外交上の立場を作ったこともある。

      ポルトガルは40年にわたって彼女を屈服させられなかった。
      晩年には和平が結ばれ、国は独立を保つ。
      死後、王国はまもなく衰えた。
      それでもその抵抗は口承で語り継がれ、20世紀の独立運動のなかで民族的な象徴として再評価されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/61/KingdomNdongo1711.png/500px-KingdomNdongo1711.png
      credit: KillOrDie / CC BY-SA 2.5
      page: https://commons.wikimedia.org/wiki/File:KingdomNdongo1711.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ンドンゴ王国

  - id: osei-tutu
    title: オセイ・トゥトゥ
    start: 1701
    end: 1717
    category: politics
    tags: [アシャンティ, 黄金]
    summary: 「黄金の床几」の下に諸部族をまとめ、金と奴隷の交易で栄える王国を建てた。
    detail: |
      アシャンティ王国を建てた君主で、在位は17世紀末から1717年まで。
      黄金の床几のもとに諸部族をまとめ、金と交易で栄える王国を作った。

      当時、この地域には同じ言語を話す小さな首長国が分立し、隣の強国に貢納していた。
      オセイ・トゥトゥは、祭司アノチェと協力して統合を進めた。
      伝承によれば、アノチェが呪術によって黄金の床几を天から呼び降ろし、それが国民全体の魂の宿る器だと宣言する。
      床几は王個人のものではなく、共同体そのものを表す。
      この象徴によって、対等だった首長たちが一つの枠組みに入った。

      軍事の面でも改革を行った。
      全軍を中央・左翼・右翼・前衛・後衛に編成し、各首長国に役割を割り当てる。
      連合の軍が一つの指揮のもとで動けるようになった。

      この体制で宗主国との戦いに勝ち、貢納から解放される。
      以後、周辺を次々に併合して領域を広げた。
      首都クマシが建設され、道路と行政の仕組みが整えられる。
      金の交易によって富が集まり、王国は西アフリカの有力国になった。
      1717年、遠征中に戦死した。
      黄金の床几を軸とする国家の枠組みは、その後200年にわたり保たれる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/Flag_of_Ashanti.svg/500px-Flag_of_Ashanti.svg.png
      credit: Himasaram / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Ashanti.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アシャンティ王国

  - id: usman-dan-fodio
    title: オスマン・ダン・フォディオ
    start: 1804
    end: 1817
    category: religion
    tags: [ソコト, ジハード]
    summary: 宗教改革のジハードでソコト帝国を建て、西アフリカのイスラム化を進めた。
    detail: |
      西アフリカのイスラム学者で、1804年から1817年まで宗教改革の運動を率いた。
      ジハードによってソコト帝国を建て、この地域のイスラム化を進めた。

      フラニ系の学者の家に生まれ、各地を巡って説教した。
      当時のハウサ諸王国では、イスラムと在来の信仰が混在し、支配者は重税を課していた。
      彼は、これを真の信仰から外れた状態だと批判する。

      支持者が増えると、王の一人が弾圧に動いた。
      1804年、ウスマンは移住を宣言してジハードを開始する。
      預言者の移住になぞらえた行動だった。
      農民、学者、遊牧民が加わり、数年のうちにハウサ諸王国を次々に倒した。
      1809年、ソコトを都とする帝国が成立する。

      統治は息子と弟に委ねられ、彼自身は著述と教育に専念した。
      100を超える著作を残し、イスラム法にもとづく統治のあり方を論じている。
      女性の教育を重んじ、娘の一人も著名な学者になった。
      ソコト帝国は、サハラ以南で最大級のイスラム国家になった。
      各地の首長がその下に入り、共通の法と学問の枠組みが広がる。
      1903年にイギリスに征服されたが、首長の制度は間接統治の形で残された。
      ナイジェリア北部の社会は、いまもこの運動の影響のもとにある。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウスマン・ダン・フォディオ

  - id: muhammad-ali-egypt
    title: ムハンマド・アリー
    start: 1805
    end: 1848
    category: politics
    tags: [エジプト, 近代化]
    summary: オスマンから事実上独立し、軍と綿花産業の近代化を急いだ。
    detail: |
      エジプトの総督で、在任は1805年から1848年まで。
      オスマン帝国から事実上独立し、軍と産業の近代化を急いだ。
      近代エジプトの建設者とされる。

      現在のギリシア北部の出身で、オスマン軍の一員としてエジプトへ来た。
      ナポレオンの撤退後の混乱のなかで実力を伸ばし、住民の支持を得て総督に任じられる。
      1811年、旧来の支配層であったマムルークを宴に招いて一掃した。
      これによって対抗勢力は消える。

      改革は多方面に及んだ。
      徴兵制による西洋式の軍を編成し、士官学校と造船所を設ける。
      留学生をヨーロッパへ送り、翻訳の機関も作った。
      経済では、綿花の栽培を国家が独占した。
      専売による収入で近代化の費用をまかなう仕組みである。
      工場を建て、灌漑を整備し、農業の生産を増やした。

      対外的には、オスマン帝国のために出兵した後、自ら領土を求めてシリアへ侵攻する。
      二度にわたってオスマン軍を破り、イスタンブルに迫った。
      ヨーロッパ列強の介入によって撤退したが、代わりにエジプト総督の地位の世襲を認めさせる。
      その王朝は1952年まで続いた。
      上からの急速な近代化という手法は、同時期の各国の改革と比較されてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2d/ModernEgypt%2C_Muhammad_Ali_by_Auguste_Couder%2C_BAP_17996.jpg/500px-ModernEgypt%2C_Muhammad_Ali_by_Auguste_Couder%2C_BAP_17996.jpg
      credit: オーギュスト・クーデル / Public domain
      page: https://commons.wikimedia.org/wiki/File:ModernEgypt,_Muhammad_Ali_by_Auguste_Couder,_BAP_17996.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ムハンマド・アリー

  - id: shaka
    title: シャカ・ズールー
    start: 1816
    end: 1828
    category: war
    tags: [ズールー, 軍制]
    summary: 戦術と軍制の革新で小部族を王国に変え、南部アフリカの民族分布を動かした。
    detail: |
      ズールー王国の初代の王で、在位は1816年から1828年まで。
      戦術と軍制の革新によって、小さな部族を王国に変えた。
      南部アフリカの民族の分布を大きく動かした人物である。

      有力者の庶子として生まれ、幼少期は母とともに各地を転々とした。
      隣接する集団の軍で頭角を現し、支援を得て自らの部族の長となる。
      軍事の改革が特徴的である。
      投げ槍に代わって短い刺突用の槍を採用し、接近戦で戦う方法に変えた。
      大きな盾を用い、年齢ごとに編成された連隊を作って常時訓練させる。
      牛の角に見立てた陣形で敵を包囲する戦法を用いた。
      兵は裸足で走ることを求められ、機動力が高まる。

      この軍によって周辺の集団を次々に併合し、数年のうちに大きな王国を築いた。
      服属した人々は、そのまま軍と社会の組織に組み込まれる。
      この拡大は、周囲に連鎖的な影響を及ぼした。
      追われた集団が別の集団を圧迫し、広い範囲で移動と戦乱が起きる。
      この時期の混乱はムフェカネと呼ばれ、南部アフリカ各地に新しい国家が生まれた。

      晩年は母の死後に極端な命令を出したと伝えられ、異母弟に暗殺された。
      王国はその後も存続し、1879年にイギリスと戦うことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/KingShaka.jpg/500px-KingShaka.jpg
      credit: James King / Public domain
      page: https://commons.wikimedia.org/wiki/File:KingShaka.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シャカ・ズールー

  - id: menelik-ii
    title: メネリク2世
    start: 1889
    end: 1913
    category: war
    tags: [エチオピア, アドワ]
    summary: アドワでイタリア軍を破り、アフリカで唯一独立を守り抜いた。
    detail: |
      エチオピア帝国の皇帝で、在位は1889年から1913年まで。
      アドワの戦いでイタリア軍を破り、独立を守り抜いた。
      近代化と領土の拡大も進めた人物である。

      ショアの王として力を蓄え、先帝の死後に皇帝となった。
      即位の直後、イタリアと条約を結んでいる。
      この条約には、アムハラ語とイタリア語の文面に違いがあった。
      イタリア語版では、エチオピアが外交をイタリアに委ねる、つまり保護国となる内容になっている。
      メネリクはこれを認めず、条約を破棄した。

      1896年、イタリア軍が侵攻する。
      メネリクは各地の諸侯を結集し、10万を超える軍を動員した。
      ヨーロッパから近代的な小銃と大砲を輸入していたことも大きい。
      アドワで、イタリア軍は壊滅的な敗北を喫した。
      この勝利により、独立が国際的に承認された。
      アフリカの国が侵略軍を正面から破った稀な例として、各地の運動を勇気づける。

      国内では、電信と鉄道を導入し、郵便と貨幣の制度を整えた。
      学校と病院を設け、首都アディスアベバを建設している。
      同時に南方へ遠征し、現在のエチオピアの領域をほぼ確定させた。
      この拡大は、併合された地域からは征服として記憶されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/Menelik_II_in_coronation_garb%2C_Emperor_of_Ethiopia.jpg/500px-Menelik_II_in_coronation_garb%2C_Emperor_of_Ethiopia.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Menelik_II_in_coronation_garb,_Emperor_of_Ethiopia.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/メネリク2世

  - id: haile-selassie
    title: ハイレ・セラシエ
    start: 1930
    end: 1974
    category: politics
    tags: [エチオピア]
    summary: 亡命と復位を経て近代化を進めたが、飢饉と軍のクーデタで王政ごと倒れた。
    detail: |
      エチオピア最後の皇帝で、在位は1930年から1974年まで。
      亡命と復位を経て近代化を進めたが、飢饉と軍のクーデタで王政ごと倒れた。

      摂政として実権を握った後、1930年に即位した。
      翌年に憲法を発布し、議会を設ける。
      権限は皇帝に集中していたが、近代的な国家の体裁を整える試みだった。
      1935年、イタリアが侵攻する。
      毒ガスを含む近代兵器の前に抵抗は続かず、翌年に亡命した。
      国際連盟の総会で演説し、集団安全保障が機能しなければ同じことが各国に起きると訴える。
      この警告は、数年後に現実になった。

      第二次世界大戦中にイギリス軍とともに帰国し、復位する。
      戦後は国際社会での発言力を高めた。
      アフリカ統一機構の創設を主導し、本部をアディスアベバに置く。
      教育と行政の近代化も進めた。

      一方、国内の土地制度と貧困は改善されなかった。
      1973年の飢饉で数十万が死亡し、その事実が隠蔽されたことが批判を浴びる。
      1974年、軍のクーデタで退位させられ、翌年に死亡した。
      700年続いた王朝が終わる。
      ジャマイカで生まれたラスタファリ運動では、この人物が救世主とみなされた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Haile_Selassie_in_full_dress.jpg/500px-Haile_Selassie_in_full_dress.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Haile_Selassie_in_full_dress.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ハイレ・セラシエ1世

  - id: nasser
    title: ナセル
    start: 1954
    end: 1970
    category: politics
    tags: [エジプト, アラブ民族主義]
    summary: スエズ運河の国有化で列強に勝ち、アラブ民族主義の旗手になった。
    detail: |
      エジプトの大統領で、在任は1954年から1970年まで。
      スエズ運河の国有化で列強に対抗し、アラブ民族主義の旗手になった。

      郵便局員の子として生まれ、士官学校を出て軍人になった。
      1948年の対イスラエル戦争での敗北が、体制への不信を決定的にする。
      自由将校団を組織し、1952年の革命を主導した。
      内政では、土地改革と国有化を進めた。
      大地主の土地を分配し、外国資本の企業を国有化する。
      教育と医療を無償に近づけ、工業化を国家主導で進めた。
      アスワン・ハイ・ダムの建設は、その象徴的な事業である。

      1956年、ダムの資金援助が撤回されたことへの対抗として、スエズ運河の国有化を宣言した。
      イギリス、フランス、イスラエルが軍事介入するが、アメリカとソ連の圧力で撤退する。
      軍事的には敗れながら政治的に勝利し、その名声はアラブ世界全体に広がった。
      アラブの統一を掲げ、シリアと連合国家を作ったが3年で解消する。
      非同盟運動の中心人物の一人でもあった。

      1967年の第三次中東戦争で大敗し、シナイ半島を失う。
      辞意を表明したが、民衆の支持で撤回した。
      1970年に急死する。
      独立した中東の国家がどう振る舞うかという型を、この人物が作った。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/00/Nasser_in_1969_%283x4_close_cropped%29.jpg/500px-Nasser_in_1969_%283x4_close_cropped%29.jpg
      credit: Not credited / Public domain
      page: https://commons.wikimedia.org/wiki/File:Nasser_in_1969_(3x4_close_cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ガマール・アブドゥル＝ナーセル

  - id: nkrumah
    title: ンクルマ
    start: 1957
    end: 1966
    category: politics
    tags: [ガーナ, 汎アフリカ主義]
    summary: サハラ以南で最初の独立を実現し、アフリカ統一の理念を唱えた。
    detail: |
      ガーナの初代大統領で、在任は1957年から1966年まで。
      サハラ以南で最初の独立を実現し、アフリカの統一を唱えた。

      アメリカとイギリスで学び、汎アフリカ主義の運動に関わった。
      帰国後、大衆政党を組織して独立運動を率いる。
      手法は非暴力の直接行動だった。
      ストライキとボイコットによって植民地政府に圧力をかける。
      投獄されたが、獄中で行われた選挙で勝利し、そのまま釈放されて政権を担った。

      1957年に独立を達成する。
      国名は、かつてこの地域に栄えた古代の王国から取られた。
      独立の意義を大陸全体に広げようとした。
      アフリカの独立は、大陸全体の解放と結びつかなければ意味がないと説き、各地の運動を支援する。
      1963年のアフリカ統一機構の創設を主導した。

      国内では、工業化とインフラの建設に資金を投じた。
      ヴォルタ川のダムは大規模な事業である。
      一方、カカオの価格の下落と支出の増大で財政は悪化した。
      反対派を拘束し、一党制を敷いて大統領の権限を強めたことも批判を招く。
      1966年、外遊中に軍のクーデタで失脚した。
      理念の大きさと統治の困難が、同じ人物の上に現れている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Kwame_Nkrumah_Portrait%2C_The_National_Archives_UK.jpg/500px-Kwame_Nkrumah_Portrait%2C_The_National_Archives_UK.jpg
      credit: The National Archives UK - Flickr account / OGL v1.0
      page: https://commons.wikimedia.org/wiki/File:Kwame_Nkrumah_Portrait,_The_National_Archives_UK.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クワメ・エンクルマ

  - id: kenyatta
    title: ケニヤッタ
    start: 1963
    end: 1978
    category: politics
    tags: [ケニア, 独立]
    summary: 独立運動の指導者から初代大統領となり、白人入植者との和解を選んだ。
    detail: |
      ケニアの初代大統領で、在任は1964年から1978年まで。
      独立運動の指導者から国家の指導者となり、白人入植者との和解を選んだ。

      キクユの家に生まれ、ロンドンで人類学を学んだ。
      自らの民族の社会を論じた著作を著し、汎アフリカ主義の運動にも関わる。
      帰国後、土地の返還と政治参加を求める運動を率いた。
      1950年代、マウマウと呼ばれる武装闘争が起きると、扇動者として逮捕され9年間投獄される。
      実際の関与については議論があるが、この投獄が指導者としての権威を高めた。

      釈放後に党首となり、独立の交渉を進めた。
      1963年に独立し、翌年に共和国の大統領となる。
      就任にあたり、過去を忘れて共に前へ進もうと呼びかけた。
      白人の入植者に対して報復を行わず、留まることを認める。
      土地は買い取りによって段階的に再分配された。
      経済では西側との関係を保ち、外国投資を受け入れる。

      安定と成長をもたらした一方、権力の集中と汚職も進んだ。
      野党は抑えられ、一党制に近い体制になる。
      土地の分配が特定の集団に偏ったことは、後の対立の種を残した。
      和解を選んだ指導者として国際的な評価を得たが、国内の不平等は解消されなかった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Jomo_Kenyatta_%28cropped%29_in_June_15th%2C_1966.jpg/500px-Jomo_Kenyatta_%28cropped%29_in_June_15th%2C_1966.jpg
      credit: Pridan Moshe / Public domain
      page: https://commons.wikimedia.org/wiki/File:Jomo_Kenyatta_(cropped)_in_June_15th,_1966.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジョモ・ケニヤッタ

  - id: nyerere
    title: ニエレレ
    start: 1964
    end: 1985
    category: society
    tags: [タンザニア, ウジャマー]
    summary: 村落共同体に基づくアフリカ型社会主義を試み、教育の普及に成果を残した。
    detail: |
      タンザニアの初代大統領で、在任は1964年から1985年まで。
      村落共同体にもとづくアフリカ型の社会主義を試みた。
      教育の普及では大きな成果を残している。

      教師の出身で、独立運動を率いてタンガニーカの独立を実現した。
      ザンジバルとの連合によってタンザニアが成立する。
      1967年の宣言で、自立と平等を柱とする方針を打ち出した。
      銀行と主要産業を国有化し、指導者が企業を持つことを禁じる。

      中心となったのが、村落共同体の政策である。
      散在する農家を集めて村を作り、共同で耕作し、学校と診療所と水道を整える。
      伝統的な相互扶助の延長として構想された。
      当初は自発的だったが、目標の達成を急いで強制的な移住が行われ、反発と生産の低下を招く。

      経済は伸び悩んだ。
      石油価格の高騰と、隣国との戦争の費用も重なる。
      一方、成果も明確である。
      識字率は独立時の一割台から八割を超え、初等教育がほぼ全国に行き渡った。
      スワヒリ語を共通語として広め、120を超える民族を抱えながら深刻な民族対立を避けている。
      1985年、自ら退任した。
      アフリカで在任中に平和的に権力を譲った早い例であり、その後も調停者として活動した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1a/President_Nyerere_van_Tanzania%2C_koppen%2C_Bestanddeelnr_928-2879_%28cropped%29.jpg/500px-President_Nyerere_van_Tanzania%2C_koppen%2C_Bestanddeelnr_928-2879_%28cropped%29.jpg
      credit: Rob Mieremet / Anefo / CC0
      page: https://commons.wikimedia.org/wiki/File:President_Nyerere_van_Tanzania,_koppen,_Bestanddeelnr_928-2879_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジュリウス・ニエレレ

  - id: mobutu
    title: モブツ
    start: 1965
    end: 1997
    category: politics
    tags: [コンゴ, 独裁]
    summary: 冷戦下で西側の支援を受けつつ国富を私物化した、資源国の独裁の典型。
    detail: |
      コンゴ民主共和国の大統領で、在任は1965年から1997年まで。
      冷戦下で西側の支援を受けながら、国富を私物化した。
      資源国の独裁の典型として語られる。

      独立直後の混乱のなかで、軍の参謀長として台頭した。
      初代首相ルムンバの失脚と殺害に関与したとされる。
      1965年にクーデタで全権を握った。
      国名をザイールと改め、地名と人名もアフリカ風に改めさせた。
      自らも長い称号を名乗り、個人崇拝の体制を築く。
      この真正性の政策は、文化的な自立を掲げながら、実質は権威の演出だった。

      銅、コバルト、ダイヤモンドの産出は膨大である。
      しかし収入は国庫ではなく個人と側近に流れた。
      国外の銀行と不動産に蓄えられた資産は、数十億ドルに達したとされる。
      道路と病院と学校は荒廃し、公務員の給与も滞った。
      それでも欧米は支持を続けた。
      アフリカ中央部で反共の立場をとる指導者として、戦略的な価値があったためである。

      冷戦の終結で支援は細った。
      隣国ルワンダの紛争が波及し、1997年に反政府勢力によって追われる。
      その後のコンゴは長い内戦に陥った。
      資源の豊かさが国民の生活に結びつかない構造を、最も明確に示した例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/Mobutu.jpg/500px-Mobutu.jpg
      credit: Frank Hall / Public domain
      page: https://commons.wikimedia.org/wiki/File:Mobutu.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モブツ・セセ・セコ

  - id: gaddafi
    title: カダフィ
    start: 1969
    end: 2011
    category: politics
    tags: [リビア, 独裁]
    summary: 独自の革命思想で42年統治し、「アラブの春」のなかで殺された。
    detail: |
      リビアの指導者で、1969年から2011年まで42年間統治した。
      独自の革命思想を掲げ、最後はアラブの春のなかで殺された。

      27歳の大尉だった1969年、無血のクーデタで王政を倒した。
      イギリスとアメリカの基地を撤去させ、石油産業を国有化する。
      1970年代、緑の書と呼ばれる小冊子を著した。
      議会制も資本主義も共産主義も否定し、人民が直接統治する体制を提唱する。
      国名は人民が直接権力を持つ国家を意味する語に改められた。
      公式には大統領でも首相でもなく、革命の指導者という肩書きを用いる。

      石油収入によって、教育と医療は無償になり、生活水準は上がった。
      一方、反対派は国内外で弾圧され、言論の自由はない。
      対外的には、各地の武装勢力を支援した。
      1988年の旅客機爆破事件への関与が認定され、国連の制裁を受けて孤立する。
      2003年、大量破壊兵器の開発放棄と賠償によって欧米との関係を修復した。

      2011年、チュニジアとエジプトの政変に触発された抗議が起きる。
      弾圧が内戦に発展し、NATOが介入した。
      同年10月、故郷の町で拘束されて殺害される。
      その後のリビアは、統一した政府を持てないまま分裂が続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Muammar_al-Gaddafi_at_the_AU_summit.jpg/500px-Muammar_al-Gaddafi_at_the_AU_summit.jpg
      credit: U.S. Navy photo by Mass Communication Specialist 2nd Class Jesse B. Awalt/Released / Public domain
      page: https://commons.wikimedia.org/wiki/File:Muammar_al-Gaddafi_at_the_AU_summit.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ムアンマル・アル＝カッザーフィー

  - id: sadat
    title: サダト
    start: 1970
    end: 1981
    category: politics
    tags: [エジプト, 和平]
    summary: 第四次中東戦争のあとイスラエルと和平を結び、アラブ世界から孤立して暗殺された。
    detail: |
      エジプトの大統領で、在任は1970年から1981年まで。
      第四次中東戦争の後にイスラエルと和平を結び、アラブ世界から孤立して暗殺された。

      ナセルの死後に後を継いだ。
      当初は影の薄い後継者と見られていたが、まもなく独自の路線を打ち出す。
      ソ連の軍事顧問を追放し、アメリカへ接近した。
      経済では国家統制を緩めて外国資本を呼び込む開放政策をとる。
      1973年、シリアと連携してイスラエルを奇襲した。
      スエズ運河を渡って防衛線を突破し、緒戦で成果を上げる。
      最終的には押し戻されたが、1967年の一方的な敗北の記憶を払拭した。
      この戦争が、交渉の土台を作る。

      1977年、サダトはイスラエル国会で演説するためエルサレムを訪れた。
      アラブの指導者としては前例のない行動である。
      翌年、アメリカの仲介でキャンプ・デービッド合意が成立し、1979年に平和条約が結ばれた。
      シナイ半島は返還され、両者はノーベル平和賞を受ける。

      アラブ諸国はこれを裏切りとみなし、エジプトは連盟から除名された。
      国内でもイスラム主義者の反発が強まる。
      1981年、軍事パレードの最中に将校に射殺された。
      それでも平和条約は破棄されず、現在まで維持されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Official_Portrait_-_Anwar_Sadat.jpg/500px-Official_Portrait_-_Anwar_Sadat.jpg
      credit: Press / Public domain
      page: https://commons.wikimedia.org/wiki/File:Official_Portrait_-_Anwar_Sadat.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アンワル・アッ＝サーダート

  - id: mubarak
    title: ムバラク
    start: 1981
    end: 2011
    category: politics
    tags: [エジプト]
    summary: 30年続いた強権支配が、「アラブの春」の街頭デモで終わった。
    detail: |
      エジプトの大統領で、在任は1981年から2011年まで30年に及ぶ。
      サダトの暗殺を受けて就任し、強権的な統治を続けた。
      アラブの春の街頭デモによって退陣する。

      空軍の司令官として1973年の戦争に関わり、副大統領に登用された。
      暗殺の現場に同席しており、自らも負傷している。
      就任後、非常事態法を敷いた。
      令状なしの逮捕と集会の制限が可能になり、この状態が30年続く。
      選挙は形式的に行われるが、対立候補は制限された。

      外交では、イスラエルとの和平条約を維持した。
      アメリカから多額の軍事援助を受け、中東の安定の要とみなされる。
      アラブ連盟への復帰も実現させた。
      経済は自由化が進み、成長率は上がった。
      一方、富は一部に集中し、若年層の失業と物価の上昇が深刻になる。
      汚職も広く蔓延した。

      2011年1月、チュニジアの政変に触発された抗議がカイロのタハリール広場に集まる。
      数十万の人々が18日間にわたり退陣を要求し、軍が発砲を拒んだことで体制は支えを失った。
      2月11日に辞任する。
      その後、選挙で成立した政権も2年で倒れ、軍出身の大統領が権力を握った。
      体制の交代が民主化に直結しないことを示す例になっている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/b/b6/Hosni_Mubarak_ritratto.jpg
      credit: Presidenza della Repubblica / Attribution
      page: https://commons.wikimedia.org/wiki/File:Hosni_Mubarak_ritratto.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ホスニー・ムバーラク

  - id: sankara
    title: サンカラ
    start: 1983
    end: 1987
    category: society
    tags: [ブルキナファソ, 自立]
    summary: 援助に頼らない自立と質素を掲げ、4年の改革のあと暗殺された。
    detail: |
      ブルキナファソの指導者で、1983年から1987年まで統治した。
      援助に頼らない自立と質素を掲げ、4年の改革の後に暗殺された。

      33歳でクーデタによって権力を得た。
      国名を、旧宗主国が付けたオートボルタから、高潔な人々の国を意味するブルキナファソへ改める。
      政策は急進的だった。
      外国の援助に依存しない自給を目標とし、国産の綿布を公務員の制服に定める。
      土地を国有化して農民に配分し、灌漑を整え、数年で穀物の自給をほぼ達成した。

      公衆衛生では、250万人の子どもにワクチンを接種する運動を短期間で実施した。
      識字率の向上にも取り組み、植林も大規模に行われている。
      女性の地位の改善を重視した。
      女性器切除と強制結婚、一夫多妻を禁じ、閣僚に女性を登用する。
      男性に市場での買い物と炊事を体験させる日も設けられた。

      自らは質素を貫いた。
      公用車を最も安価な車種に統一し、閣僚の給与を削り、自分の資産もほとんど持たなかった。
      対外債務の返済を拒否すべきだと各国に呼びかけたことは、支援国の反発を招く。
      国内でも急速な改革への不満が生まれた。
      1987年、側近だったコンパオレによるクーデタで殺害される。
      近年、アフリカの若者のあいだで再評価が進んでいる。
