  - id: mandela
    title: マンデラ
    start: 1994
    end: 1999
    category: society
    tags: [南アフリカ, 和解]
    summary: 27年の投獄を経て大統領となり、報復ではなく和解で新しい国を始めた。
    detail: |
      南アフリカの大統領で、在任は1994年から1999年まで。
      27年の投獄を経て指導者となり、報復ではなく和解によって新しい国を始めた。

      弁護士としてアフリカ民族会議の運動に加わった。
      非暴力の抗議が銃撃で弾圧された後、武装闘争の組織を作る。
      1962年に逮捕され、国家反逆罪で終身刑を受けた。
      獄中でも交渉を拒まず、看守にも敬意をもって接したと伝えられる。
      国際的な釈放運動が高まり、経済制裁と国内の抵抗で体制は行き詰まった。

      1990年、デクラーク大統領が彼を釈放し、組織の非合法化を解く。
      両者は4年にわたって交渉し、全人種が参加する選挙への移行を実現した。
      各地で暴力が続くなか、内戦を避けたことが最大の功績とされる。

      1994年の選挙で大統領に就任した。
      就任演説では、すべての人に等しい権利のある国を築くと述べる。
      真実和解委員会を設け、過去の人権侵害を裁くのではなく、真実を語れば恩赦を与える仕組みを作った。
      加害の事実を記録に残しつつ、報復の連鎖を断つ試みである。
      ラグビーの世界大会では、白人の象徴だった代表チームを自ら応援し、国民の統合を演出した。
      一期で退任し、権力に固執しない姿勢を示している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Nelson_Mandela_1994.jpg/500px-Nelson_Mandela_1994.jpg
      credit: Kingkongphoto & www.celebrity-photos.com from ローレル / CC BY-SA 2.0
      page: https://commons.wikimedia.org/wiki/File:Nelson_Mandela_1994.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ネルソン・マンデラ
