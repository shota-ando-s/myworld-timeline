lane: africa

# エジプトのファラオを含むアフリカ全域の君主・指導者。
leaders:
  - id: khufu
    title: クフ王
    start: -2589
    startCirca: true
    end: -2566
    endCirca: true
    category: politics
    tags: [エジプト, ピラミッド]
    summary: ギザの大ピラミッドを築かせ、初期国家が動員できた力の大きさを今に伝える。
    detail: |
      エジプト第4王朝の王で、在位は紀元前26世紀の半ば。
      ギザの大ピラミッドを築かせた人物である。
      初期の国家がどれほどの力を動員できたかを、今に伝えている。

      父スネフェルは複数のピラミッドを建設し、その技術を確立した。
      クフはそれを受け継ぎ、最大の規模で実現する。
      大ピラミッドは、230万個を超える石を積み上げたとされる。
      一辺は約230メートル、高さは約147メートルで、建設には20年前後を要したと推定される。
      方位は真北からほとんどずれておらず、測量の精度の高さを示す。

      これだけの事業には、石材の採掘、船による運搬、食糧の供給、労働者の宿舎と医療まで含めた組織が必要である。
      国家が資源と人を計画的に動かせたことの証といえる。
      一方で、クフ自身についての記録は乏しい。
      残されている像は、高さ7センチほどの小さな象牙の座像だけである。

      後世のギリシアの歴史家は、民を酷使した暴君として書き残した。
      これは伝聞にもとづく記述で、根拠は薄い。
      近年、紅海沿岸で見つかった記録文書に、石材の運搬を担った隊の日誌が含まれていた。
      巨大建造物の背後にある実務の記録として注目されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Kairo_Museum_Statuette_Cheops_03_%28cropped%29.jpg/500px-Kairo_Museum_Statuette_Cheops_03_%28cropped%29.jpg
      credit: Olaf Tausch / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:Kairo_Museum_Statuette_Cheops_03_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クフ

  - id: senusret-iii
    title: センウセレト3世
    start: -1878
    end: -1839
    category: politics
    tags: [エジプト, 中王国]
    summary: 州の長官の力を削いで中央集権を固め、ヌビアへ国境を押し上げた。
    detail: |
      エジプト第12王朝の王で、在位は紀元前19世紀。
      州の長官の力を削いで中央集権を固め、南のヌビアへ国境を押し上げた。
      中王国の最盛期を作った人物である。

      中王国では、地方の州の長官が世襲的に力を持ち、独自の墓を築くほどの勢力になっていた。
      センウセレト3世はこの職を実質的に廃し、行政を中央の三つの部局に再編する。
      地方の有力者の墓が、この時期を境に姿を消すことが、その裏づけとされる。

      南方への遠征は少なくとも四度行われた。
      第2急湍のあたりまで支配を広げ、一連の要塞を築く。
      境界を定めた石碑には、後継者がこの境を守れなければ自分の子ではない、という強い言葉が刻まれた。
      要塞は金の産地と交易路を押さえる拠点になる。

      国内では、ファイユームの灌漑事業を進めて農地を広げた。
      彫像には、垂れた瞼と深い皺を刻んだ表情が特徴的である。
      理想化された若々しい王の姿ではなく、統治の重みを表す表現とみられている。
      この写実的な作風は、中王国の美術を特徴づけた。
      死後、神として祀られ、ヌビアでは長く信仰の対象になった。
      後世のギリシア人が伝える伝説的な征服王の話も、この王の記憶を含むとされる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/ThreeStatuesOfSesotrisIII-RightProfiles-BritishMuseum-August19-08.jpg/500px-ThreeStatuesOfSesotrisIII-RightProfiles-BritishMuseum-August19-08.jpg
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:ThreeStatuesOfSesotrisIII-RightProfiles-BritishMuseum-August19-08.jpg
    links:
