  - id: ahmose-i
    title: アハメス1世
    start: -1550
    end: -1525
    category: war
    tags: [エジプト, 新王国]
    summary: 異民族ヒクソスを追い出してエジプトを再統一し、新王国を開いた。
    detail: |
      エジプト第18王朝の初代の王で、在位は紀元前16世紀。
      異民族ヒクソスを追い出してエジプトを再統一し、新王国を開いた。

      ヒクソスは、西アジアから入ってデルタ地帯を支配していた勢力である。
      馬と戦車、複合弓といった新しい軍事技術を持ち込み、100年以上その地を治めていた。
      南のテーベの王家は、これに服属しながら機会をうかがう。
      イアフメスの父と兄は、ヒクソスとの戦いで命を落としたとされる。
      若くして王位を継いだ彼は、水軍を用いてデルタを攻めた。
      首都アヴァリスを落とし、さらにパレスチナまで追撃して拠点を陥れる。
      南のヌビアにも遠征し、旧来の支配地を回復した。

      再統一後、国内の再建に取り組んだ。
      神殿を修復し、採石場の操業を再開する。
      地方の有力者を抑え、王に直属する行政を整えた。

      重要なのは、ヒクソスの技術を取り込んだことである。
      戦車と騎兵を中核とする軍が編成され、エジプトは外へ出ていく国家になる。
      王妃と王母が高い地位を持ち、政治に関与したことも、この王朝の特徴として続いた。
      以後500年にわたる帝国の時代は、この再統一から始まっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Ahmose_I_-_StatueHead_BrooklynMuseum.jpg/500px-Ahmose_I_-_StatueHead_BrooklynMuseum.jpg
      credit: "AhmoseI-or-AmunhotepI-StatueHead_BrooklynMuseum.png: Captmondo derivative work: JMCC1 (talk) / CC BY-SA 2.5"
      page: https://commons.wikimedia.org/wiki/File:Ahmose_I_-_StatueHead_BrooklynMuseum.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イアフメス1世

  - id: hatshepsut
    title: ハトシェプスト
    start: -1479
    end: -1458
    category: politics
    tags: [エジプト, 女性ファラオ]
    summary: 女性でありながらファラオを名乗り、戦争よりも交易遠征で富を築いた。
    detail: |
      エジプト第18王朝の女性の王で、在位は紀元前1479年ごろから1458年ごろまで。
      女性でありながらファラオを名乗った。
      戦争よりも交易と建設で富を築いた治世である。

      夫である王の死後、幼い義理の息子トトメス3世の摂政となった。
      数年のうちに自ら王として即位し、二人の共同統治という形をとる。
      正統性を示すため、自らの出生が神アメンによるものだとする物語を神殿の壁に刻ませた。
      像や浮彫では男性の王の装束をまとい、付け髭をつけた姿で表される。

      治世の特徴は対外遠征の少なさである。
      代わりに、紅海を南下してプントと呼ばれる地域へ大規模な交易の船団を送った。
      乳香の木、香料、黒檀、象牙、猿や豹が持ち帰られ、その様子が神殿に詳しく描かれている。
      建設事業も盛んだった。
      デル・エル・バハリの葬祭殿は、断崖を背に三段のテラスが並ぶ独特の構造で、古代建築の傑作とされる。
      カルナック神殿にも巨大なオベリスクを建てた。

      死後、その名と像は各地の記念物から削り取られた。
      後継者のトトメス3世か、その子の時代の措置とみられる。
      女性の統治という前例を残さないための行為だったという解釈がある。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/1/11/Hatshepsut.jpg
      credit: User:Postdlf / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Hatshepsut.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ハトシェプスト

  - id: thutmose-iii
    title: トトメス3世
    start: -1479
    end: -1425
    category: war
    tags: [エジプト, 新王国]
    summary: 十数回の遠征でシリアまで支配を広げ、エジプトの版図を最大にした。
    detail: |
      エジプト第18王朝の王で、在位は紀元前1479年から1425年まで。
      十数回の遠征によって、エジプトの版図を最大に広げた。
      エジプトのナポレオンと呼ばれることもある。

      幼くして即位し、20年余りは義母ハトシェプストが実権を握っていた。
      彼女の死後、単独の統治を始める。
      最初の遠征がメギドの戦いである。
      シリア・パレスチナの諸侯が連合して反旗を翻したのに対し、危険な山道を選んで進軍し、敵の不意を突いた。
      都市を包囲して降伏させ、この戦いの記録は詳細な軍事の記述として残っている。

      以後、ほぼ毎年のように遠征を行った。
      北はユーフラテス川に達し、南はヌビアの奥地まで支配を広げる。
      統治の方法も工夫された。
      服属した地域の王子をエジプトへ連れて教育し、成人後に故地の支配者として戻す。
      武力だけでなく、文化的な結びつきで支配を保つ仕組みである。
      遠征の記録はカルナック神殿の壁に刻まれ、戦利品と貢納の内訳まで記された。

      建築では多数の神殿とオベリスクを残している。
      晩年、ハトシェプストの記念物から彼女の名を削らせた。
      エジプトが地中海東岸の大国として振る舞う時代は、この治世に確立した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Thutmosis_III-2.jpg/500px-Thutmosis_III-2.jpg
      credit: "TuthmosisIII.JPG: en:User:Chipdawes derivative work: Oltau (talk) / Public domain"
      page: https://commons.wikimedia.org/wiki/File:Thutmosis_III-2.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/トトメス3世

  - id: akhenaten-reign
    title: アクエンアテン
    start: -1353
    startCirca: true
    end: -1336
    endCirca: true
    category: religion
    tags: [エジプト, アテン信仰]
    summary: 唯一神アテンの信仰へ強引に切り替え、美術様式まで変えた異例の王。
    detail: |
      エジプト第18王朝の王で、在位は紀元前14世紀の半ば。
      唯一神アテンの信仰へ強引に切り替え、美術の様式まで変えた。
      エジプト史でも例外的な治世である。

      即位した当初はアメンホテプ4世と名乗った。
      数年後、太陽の光そのものを表すアテンだけを崇めるとし、自らの名も光の霊を意味するアクエンアテンへ改める。
      他の神々の神殿を閉鎖し、供物を止め、記念物からアメンの名を削らせた。
      巨大な神官団の力を削ぐ政治的な意図もあったとみられる。

      都をテーベから何もない土地へ移し、アケトアテンという新都を築いた。
      現在のアマルナにあたる。
      美術の様式も一変する。
      細長い頭、突き出た腹、垂れた顎という誇張された人体表現が用いられ、王が家族と寛ぐ場面まで描かれた。
      従来の厳格で理想化された表現とは、まったく異なる。

      対外政策には関心が薄かったとされる。
      アマルナで見つかった外交文書には、シリアの属国が助けを求める訴えが多数残っている。
      死後、改革は一代で撤回された。
      都は放棄され、王の名は王名表から削られる。
      異端の王として記憶から消される扱いを受けた。
      一神教の先駆としてどう評価するかは、今も議論が続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/GD-EG-Caire-Mus%C3%A9e061.JPG/500px-GD-EG-Caire-Mus%C3%A9e061.JPG
      credit: 作者不明 / CC BY-SA 2.5
      page: https://commons.wikimedia.org/wiki/File:GD-EG-Caire-Mus%C3%A9e061.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アクエンアテン

  - id: tutankhamun
    title: ツタンカーメン
    start: -1332
    startCirca: true
    end: -1323
    endCirca: true
    category: politics
    tags: [エジプト]
    summary: 在位も短く事績も乏しいが、ほぼ無傷で見つかった墓が古代の豊かさを伝えた。
    detail: |
      エジプト第18王朝の王で、在位は紀元前1332年ごろから1323年ごろまで。
      9歳前後で即位し、18歳ほどで没した。
      在位も事績も短いが、ほぼ無傷で見つかった墓によって最も有名なファラオになった。

      アクエンアテンの子とされる。
      即位した当初はアテン信仰にちなむ名を持っていたが、まもなくアメン神にちなむ名に改められた。
      旧来の神々の信仰が復活し、都もテーベに戻される。
      実際の政治は、重臣たちが担っていたとみられる。

      死因は長く議論されてきた。
      頭部の損傷から暗殺説が唱えられたが、近年の画像診断では足の骨折とマラリアの感染が指摘されている。
      1922年、イギリスのハワード・カーターが王家の谷でその墓を発見した。
      盗掘をほぼ免れた唯一の王墓であり、5000点を超える副葬品が納められていた。
      黄金の仮面、幾重もの棺、戦車、家具、衣服、食料が残る。

      発見は世界的な報道となり、エジプト風の意匠が流行した。
      発掘に関わった人々の死が相次いだとして、呪いの物語も広まる。
      小さな王の墓でこの規模であることは、他の王墓の豊かさを想像させる。
      古代エジプトの物質文化を知る最大の史料になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/Tutanchamun_Maske.jpg/500px-Tutanchamun_Maske.jpg
      credit: en:User:MykReeve / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Tutanchamun_Maske.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ツタンカーメン

  - id: ramesses-ii
    title: ラメセス2世
    start: -1279
    end: -1213
    category: war
    tags: [エジプト, カデシュ]
    summary: ヒッタイトと史上最古級の和平条約を結び、巨大建築でファラオの威信を刻んだ。
    detail: |
      エジプト第19王朝の王で、在位は紀元前1279年から1213年までの66年に及ぶ。
      90歳前後まで生きたとされる。
      巨大建築でファラオの威信を刻み、ヒッタイトと史上最古級の和平条約を結んだ。

      即位して数年でシリアへ遠征し、カデシュでヒッタイト軍と戦った。
      偽の情報に乗せられて先頭の部隊だけで進み、包囲されかける。
      辛うじて持ちこたえたが、決着はつかなかった。
      それでも神殿の壁には、王が一人で敵を打ち破ったという物語が繰り返し刻まれている。

      16年後、両国は講和条約を結んだ。
      互いの領土を侵さず、敵に対しては援軍を送ると定めた内容で、双方の文書が現存する最古の国際条約である。
      ヒッタイトの王女を妃に迎え、関係を固めた。
      建築事業は歴代でも突出している。
      アブ・シンベルの岩窟神殿には自らの巨像が四体刻まれ、ルクソールやカルナックにも増築を重ねた。
      新都ペル・ラメセスを築き、各地の記念物に自分の名を刻ませている。

      100人を超える子をもうけたと伝えられる。
      長命のため、多くの後継候補が先に死んだ。
      旧約聖書の出エジプトの王として想定されることが多いが、確証はない。
      ミイラは現存し、赤みを帯びた髪が確認されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cf/Ramses_II_British_Museum.jpg/500px-Ramses_II_British_Museum.jpg
      credit: Pbuergler / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Ramses_II_British_Museum.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ラムセス2世

  - id: shoshenq-i
    title: シェションク1世
    start: -943
    startCirca: true
    end: -922
    endCirca: true
    category: war
    tags: [エジプト, リビア系]
    summary: リビア系の王としてエジプトをまとめ直し、パレスチナへ遠征した。
    detail: |
      エジプト第22王朝の初代の王で、在位は紀元前10世紀。
      リビア系の出身でありながらエジプトをまとめ直し、パレスチナへ遠征した。

      新王国の崩壊後、エジプトは分裂していた。
      北のデルタ地帯とテーベの神官勢力が別々に統治し、統一した王権はない。
      リビア系の傭兵の家系がデルタで力を蓄え、その一人が王位に就いた。

      シェションク1世は、軍事力と婚姻によって国内をまとめた。
      自分の子をテーベのアメン大司祭に任命し、神官勢力を王家の内側に取り込む。
      分裂の原因だった構造に、直接手を入れたことになる。
      国内を固めた後、パレスチナへ遠征した。
      カルナック神殿の壁には、征服した都市の名が並ぶ一覧が刻まれている。

      旧約聖書には、ユダ王国のレハブアムの時代にエジプトの王シシャクが攻め込み、神殿の宝物を持ち去ったという記述がある。
      このシシャクをシェションク1世と同一視するのが通説である。
      聖書の記述とエジプトの記録を結びつける数少ない接点であり、古代の年代を決める手がかりの一つになってきた。
      王朝は数代のうちに再び分裂した。
      それでも、外来の出自の一族がエジプトの王として振る舞い、伝統を継承した例として注目される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Sphinx_of_king_Sheshonk.jpg/500px-Sphinx_of_king_Sheshonk.jpg
      credit: Katie Chao / CC BY-SA 2.0
      page: https://commons.wikimedia.org/wiki/File:Sphinx_of_king_Sheshonk.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シェションク1世

  - id: piye
    title: ピイ（ピアンキ）
    start: -744
    end: -714
    category: war
    tags: [クシュ, ヌビア]
    summary: ヌビアからエジプトを征服し、黒人王朝と呼ばれる第25王朝を開いた。
    detail: |
      クシュ王国の王で、紀元前8世紀にエジプトを征服した。
      在位は紀元前744年ごろから714年ごろまでとされる。
      黒人王朝と呼ばれる第25王朝を開いた人物である。

      当時のエジプトは分裂し、複数の勢力が並び立っていた。
      南のクシュは、エジプトの宗教と文化を深く受け入れており、自らをアメン神の正統な擁護者と位置づける。
      デルタの勢力が南へ進出してテーベを脅かすと、ピイは軍を率いて北上した。
      各地の都市を次々に降し、メンフィスを攻略する。
      最後には、争っていた諸侯が揃って服従した。

      遠征の経過は、勝利記念の石碑に詳しく刻まれている。
      特徴的なのは、軍馬が飢えていたことを知って城主を強く叱責した記述である。
      馬を重んじる文化がうかがえ、王墓には馬が丁重に埋葬されていた。
      ピイは征服したエジプトに長くとどまらず、本拠のナパタへ戻った。
      現地の支配者を残し、宗主として君臨する形をとる。

      エジプトの神殿を修復し、ピラミッド型の墓を復活させた。
      数百年途絶えていた王墓の形式が、南の王によって再開されたことになる。
      アフリカ内陸の王国が古代の大国を統治した例として、重要な位置を占める。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Stele_Piye_submission_Mariette.jpg/500px-Stele_Piye_submission_Mariette.jpg
      credit: Auguste Mariette (1821-1881) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Stele_Piye_submission_Mariette.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ピイ_(ファラオ)

  - id: taharqa
    title: タハルカ
    start: -690
    end: -664
    category: war
    tags: [クシュ, アッシリア]
    summary: クシュ王朝のエジプト支配を頂点に導いたが、アッシリアの侵攻に追われた。
    detail: |
      エジプト第25王朝の王で、在位は紀元前690年から664年まで。
      クシュ王朝によるエジプト支配を頂点に導いたが、アッシリアの侵攻に追われた。

      即位の時期、ナイルの増水が豊かで穀物がよく実ったと記録されている。
      各地で神殿の造営と修復を行い、カルナックには巨大な列柱を建てた。
      本拠のヌビアにも多数の神殿を残している。
      統治は20年以上安定していた。
      しかし北から、新アッシリア帝国の圧力が強まる。
      エジプトはパレスチナの諸国を支援してアッシリアに対抗した。
      旧約聖書には、エルサレムを包囲するアッシリア軍に対してエジプトの王が動いたという記述があり、この王を指すとみられている。

      紀元前671年、アッシリア王エサルハドンがエジプトに侵攻した。
      メンフィスが陥落し、タハルカは南へ逃れる。
      王子と王妃が捕らえられ、ニネヴェへ送られた。
      その後も反撃を試みるが、次のアッシュールバニパルの遠征でテーベまで略奪される。

      タハルカはヌビアへ退き、その地で没した。
      墓は急傾斜のピラミッドで、ナパタ近郊に残る。
      黒人王朝によるエジプト支配は、この敗北を境に終わった。
      以後のクシュは、南のメロエを中心に独自の道を歩む。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1a/Egypt_kush.svg/500px-Egypt_kush.svg.png
      credit: Lommes / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Egypt_kush.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エジプト第25王朝

  - id: necho-ii
    title: ネコ2世
    start: -610
    end: -595
    category: economy
    tags: [エジプト, 航海]
    summary: 紅海と地中海を結ぶ運河を試み、フェニキア人にアフリカ周航を命じたと伝わる。
    detail: |
      エジプト第26王朝の王で、在位は紀元前610年から595年まで。
      紅海と地中海を結ぶ運河を試み、アフリカの周航を命じたと伝えられる。

      アッシリアが衰えた後、エジプトは独立を回復していた。
      ネコ2世は、新興の新バビロニアに対抗するため、衰えたアッシリアの残存勢力を支援して北上する。
      その途上でユダ王国の王ヨシヤと戦い、これを敗死させた。
      一時はシリアまで影響を及ぼすが、紀元前605年のカルケミシュの戦いでバビロニアに大敗し、アジアの領土を失う。

      以後は内政と経済に力を注いだ。
      ナイル川と紅海を結ぶ運河の開削に着手する。
      ヘロドトスは、工事で12万人が死んだと記し、神託によって中断したと伝えている。
      完成はペルシアのダレイオス1世の時代を待った。

      また、フェニキア人の船団にアフリカ大陸の周航を命じたと伝えられる。
      紅海から南下し、喜望峰を回って地中海へ戻る3年の航海である。
      ヘロドトスは、船乗りが南へ進むと太陽が右手に見えたと語ったことを疑わしいと書いた。
      しかし南半球ではそれが正しく、記述の信憑性を高める根拠になっている。
      ギリシア人の傭兵と商人を積極的に用い、交易の拠点も設けた。
      地中海世界とのつながりを深めた治世である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/Necho-KnellingStatue_BrooklynMuseum.png/500px-Necho-KnellingStatue_BrooklynMuseum.png
      credit: Keith Schengili-Roberts / CC BY 2.5
      page: https://commons.wikimedia.org/wiki/File:Necho-KnellingStatue_BrooklynMuseum.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ネコ2世

  - id: ptolemy-i
    title: プトレマイオス1世
    start: -305
    end: -283
    category: culture
    tags: [エジプト, アレクサンドリア]
    summary: アレクサンドロスの部将からエジプト王となり、図書館と学術の都を築いた。
    detail: |
      プトレマイオス朝の創始者で、在位は紀元前305年から283年まで。
      アレクサンドロスの部将からエジプトの王となった。
      図書館と学術の都を築いた人物である。

      若いころからアレクサンドロスの側近として遠征に従った。
      王の死後、後継者の争いのなかでエジプトの統治を得る。
      最初の重要な行動は、アレクサンドロスの遺体を手に入れたことだった。
      バビロンからマケドニアへ運ばれる途中の柩を奪い、エジプトへ移す。
      アレクサンドリアに安置された遺体は、王朝の正統性の象徴になった。

      統治では、ギリシア人の支配層とエジプトの伝統の両方に配慮した。
      エジプトの神とギリシアの神を融合させたセラピスの信仰を作り、双方の住民が受け入れられる宗教の枠組みを用意する。
      最大の遺産は、学術の拠点の整備である。
      王宮に隣接してムセイオンと呼ばれる研究機関を設け、学者を招いて生活を保障した。
      付属する図書館には、世界中の書物を集めることが目標とされる。
      エウクレイデスはこの時期のアレクサンドリアで活動した。

      自らアレクサンドロスの遠征の記録を著した。
      現存しないが、後世の歴史書の主要な材料になっている。
      将軍としてよりも、制度を作った統治者として評価される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/21/Ptolemy_I_Soter_Louvre_Ma849.jpg/500px-Ptolemy_I_Soter_Louvre_Ma849.jpg
      credit: Marie-Lan Nguyen / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ptolemy_I_Soter_Louvre_Ma849.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/プトレマイオス1世

  - id: cleopatra
    title: クレオパトラ7世
    start: -51
    end: -30
    category: politics
    tags: [エジプト, ローマ]
    summary: ローマの実力者と結んで独立を保とうとした、プトレマイオス朝最後の君主。
    detail: |
      プトレマイオス朝の最後の君主で、在位は紀元前51年から30年まで。
      ローマの実力者と結ぶことで独立を保とうとした。
      その死によって、ヘレニズムの時代が終わる。

      18歳で弟との共同統治として即位した。
      まもなく宮廷の争いで追われるが、エジプトに来たカエサルに接近して復位する。
      絨毯に隠れて面会したという逸話が伝えられる。
      カエサルとのあいだに子をもうけ、ローマにも滞在した。
      カエサルの暗殺後は、東方を治めることになったアントニウスと結ぶ。
      両者は政治的にも結婚し、エジプトはローマの内戦の一方の当事者になった。

      オクタウィアヌスは、この関係を利用して世論を動かした。
      ローマの将軍が東方の女王に支配されているという宣伝が行われ、エジプトに対する戦争として宣戦する。
      紀元前31年のアクティウムの海戦で敗れ、翌年アレクサンドリアが陥落した。
      アントニウスは自害し、クレオパトラも毒蛇に身をかませて死んだと伝えられる。

      古代の記録はローマ側の視点で書かれており、その像は誇張を含む。
      実際には複数の言語を操り、財政と外交に通じた統治者だったとされる。
      エジプトの神殿の浮彫では、伝統的なファラオの姿で描かれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/Kleopatra-VII.-Altes-Museum-Berlin1.jpg/500px-Kleopatra-VII.-Altes-Museum-Berlin1.jpg
      credit: Louis le Grand / Public domain
      page: https://commons.wikimedia.org/wiki/File:Kleopatra-VII.-Altes-Museum-Berlin1.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クレオパトラ7世

  - id: ezana
    title: エザナ王
    start: 320
    startCirca: true
    end: 360
    endCirca: true
    category: religion
    tags: [アクスム, キリスト教]
    summary: アクスム王国にキリスト教を受け入れ、今日まで続くエチオピア教会の起点になった。
    detail: |
      アクスム王国の王で、在位は4世紀の前半。
      キリスト教を受け入れ、今日まで続くエチオピアの教会の起点を作った。

      幼くして即位し、当初は摂政のもとで育った。
      その教育を担ったのが、難破してこの地に留まったシリア出身のフルメンティウスである。
      彼を通じてキリスト教に触れたとされる。
      成人後、エザナは信仰を受け入れ、王国の宗教とした。
      フルメンティウスはアレクサンドリアへ赴いて司教に叙階され、戻って布教を進める。
      この関係から、エチオピアの教会はエジプトのコプト教会と長く結びついた。

      改宗の時期を示すのが貨幣である。
      初期の貨幣には三日月と円盤の意匠があり、後期には十字が刻まれるようになる。
      ローマ帝国がキリスト教を公認したのとほぼ同じ時期にあたる。

      碑文にも変化が現れた。
      従来は戦神への感謝が記されていたが、後には天地の主への感謝に変わっている。
      対外的には、南のクシュ王国のメロエへ遠征し、これを衰退させた。
      複数の言語で記された勝利の碑文が残っている。
      エチオピア正教会は現在まで続き、独自の暦と典礼を保つ。
      アフリカで最も早くキリスト教を受け入れた国家の一つという位置づけは、この王の代に定まった。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/5/54/LocationAksumiteEmpire.png
      credit: 作者不明 / CC BY-SA 2.5
      page: https://commons.wikimedia.org/wiki/File:LocationAksumiteEmpire.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アクスム王国

  - id: kaleb
    title: カレブ王
    start: 510
    startCirca: true
    end: 540
    endCirca: true
    category: war
    tags: [アクスム, 紅海]
    summary: 紅海を渡ってイエメンに遠征し、アクスムを紅海交易の覇者にした。
    detail: |
      アクスム王国の王で、在位は6世紀の前半。
      紅海を渡ってイエメンに遠征し、アクスムを紅海交易の覇者にした。

      当時のイエメンには、ユダヤ教を受け入れた王が統治するヒムヤル王国があった。
      その王がキリスト教徒の住民を迫害し、ナジュラーンで大規模な殺害が行われたと伝えられる。
      この報せは、ビザンツ帝国とアクスムの双方に伝わった。
      ビザンツ皇帝ユスティニアヌスは、ペルシアに対抗するうえでも紅海の南端を押さえたい立場にある。

      カレブは艦隊を編成して海を渡り、ヒムヤル王を破った。
      現地に総督を置いて支配し、アクスムは紅海の両岸を握ることになる。
      この遠征は、キリスト教国どうしの連携という性格も持っていた。
      インド洋の交易路をめぐる、ビザンツとペルシアの競争の一環でもある。
      晩年、カレブは退位して修道院に入ったと伝えられる。

      支配は長続きしなかった。
      現地の総督が自立し、まもなくペルシアがイエメンを奪う。
      この時期が、アクスムの勢力の頂点だった。
      7世紀にイスラム勢力が紅海を制すると、王国は内陸へ退き、交易から切り離されて衰えていく。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/5/54/LocationAksumiteEmpire.png
      credit: 作者不明 / CC BY-SA 2.5
      page: https://commons.wikimedia.org/wiki/File:LocationAksumiteEmpire.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アクスム王国

  - id: al-muizz
    title: ムイッズ
    start: 953
    end: 975
    category: religion
    tags: [ファーティマ朝, カイロ]
    summary: シーア派の王朝をエジプトに移し、新都カイロを築いてスンナ派のバグダードに対抗した。
    detail: |
      ファーティマ朝の第4代カリフで、在位は953年から975年まで。
      シーア派の王朝の中心をエジプトへ移し、新都カイロを築いた。
      スンナ派のバグダードに対抗する体制を固めた人物である。

      即位したとき、王朝は北アフリカのチュニジア周辺を支配していた。
      東のエジプトは、アッバース朝の名目的な宗主権のもとで混乱していた。
      ムイッズは周到に準備した。
      有能な将軍ジャウハルを起用し、食糧を備蓄し、エジプトの有力者と事前に交渉する。
      飢饉に苦しむ住民に食糧を約束して支持を取りつけた。

      969年、ほとんど戦わずにエジプトを制圧した。
      新しい都の建設が始まり、勝利者を意味する名が与えられる。
      これがカイロである。
      2年後にはアズハルのモスクが完成し、学院として機能し始めた。
      973年、ムイッズ自身が新都へ移った。
      歴代のカリフの棺も運ばれ、王朝の中心が完全に東へ移る。

      支配下の住民の多くはスンナ派とキリスト教徒だったが、強制的な改宗は行わなかった。
      有能であれば宗派を問わず登用している。
      カイロはこの後1000年以上、イスラム世界の主要な都市であり続けた。
      一つの遷都が、地域の重心を長期にわたって決めた例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Calif_al_Muizz_Misr_Cairo_969_CE.png/500px-Calif_al_Muizz_Misr_Cairo_969_CE.png
