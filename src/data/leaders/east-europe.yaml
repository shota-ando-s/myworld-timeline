  - id: casimir-iii
    title: カジミェシュ3世
    start: 1333
    end: 1370
    category: politics
    tags: [ポーランド]
    summary: 「木の国を石の国に変えた」と言われる内政で、ポーランドを安定した王国にした。
    detail: |
      ポーランド王で、在位は1333年から1370年まで。
      内政の整備によって国を安定させ、木の国を石の国に変えたと言われる。

      即位したとき、国は分裂から回復したばかりだった。
      周囲にはドイツ騎士団、ボヘミア、リトアニアが迫っている。
      外交では、譲歩と交渉を選んだ。
      騎士団とは条約を結んで一部の領土を放棄し、ボヘミアの王位請求も金銭で解決する。
      戦争を避けて国内の整備に集中する方針である。
      代わりに東方へ進出し、ルーシの一部を領有した。

      内政の事業は多岐にわたる。
      数十の都市に城壁と城を築き、石造の建築が各地に建てられた。
      法を整理して地域ごとの法典を編み、裁判の制度を整える。
      貨幣を改め、塩の採掘と交易を振興した。

      1364年、クラクフに大学を創設した。
      中欧では二番目に古い大学である。
      ユダヤ人の保護でも知られる。
      各地で迫害が起きていた時期に、権利を保障する法を確認して受け入れた。
      これが、後にポーランドが東欧最大のユダヤ人の居住地になる背景になる。
      男子の後継がなく、王朝は断絶した。
      王位は姉の子に渡り、後にリトアニアとの合同へつながる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Kazimierz_III_Wielki_%2876845281%29_%28cropped%29.jpg/500px-Kazimierz_III_Wielki_%2876845281%29_%28cropped%29.jpg
      credit: ヤン・マテイコ / Public domain
