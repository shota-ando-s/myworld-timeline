  - id: yeltsin
    title: エリツィン
    start: 1991
    end: 1999
    category: politics
    tags: [ロシア, 市場化]
    summary: 急進的な市場化でロシアを作り直したが、混乱と新興財閥も同時に生んだ。
    detail: |
      ロシア連邦の初代大統領で、在任は1991年から1999年まで。
      急進的な市場化によって国を作り直したが、混乱と新興財閥も同時に生んだ。

      建設技師から党の幹部になり、モスクワの責任者として特権への批判を行って解任された。
      その経験が、改革派の象徴としての立場を作る。
      1990年、ロシア共和国の議長に選ばれた。
      翌年、初の直接選挙で大統領になる。
      1991年8月のクーデタで、戦車の上に立って抵抗を呼びかけた姿が世界に伝わった。
      クーデタは失敗し、ソ連の解体が加速する。
      12月、ウクライナとベラルーシの指導者とともに連邦の解消を宣言した。

      改革は急進的だった。
      価格の自由化と民営化が一気に進められる。
      物価は数十倍になり、貯蓄が失われ、生産は半減した。
      国有企業は証券の配布を通じて民営化されたが、その多くが少数の人物に集まる。

      1993年、議会との対立が武力衝突になった。
      戦車で議会を砲撃し、新憲法で大統領に強い権限を与える。
      チェチェンでの戦争も泥沼化した。
      1996年の選挙では、財閥の支援によって再選される。
      1999年末、突然辞任してプーチンに職を委ねた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Boris_Yeltsin_%283x4_cropped%29.jpg/500px-Boris_Yeltsin_%283x4_cropped%29.jpg
      credit: Presidential Press and Information Office / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Boris_Yeltsin_(3x4_cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ボリス・エリツィン

  - id: putin
    title: プーチン
    start: 1999
    ongoing: true
    category: politics
    tags: [ロシア]
    summary: 資源収入と中央集権で秩序を回復させ、ウクライナ侵攻で西側と決定的に対立した。
    detail: |
      ロシアの指導者で、1999年から現在まで権力の座にある。
      資源の収入と中央集権によって秩序を回復させ、ウクライナ侵攻で西側と決定的に対立した。

      情報機関の出身で、東ドイツに駐在した経歴を持つ。
      サンクトペテルブルク市の職員から連邦政府へ移り、首相に任命された。
      1999年末、エリツィンの辞任によって大統領代行になる。
      就任当初の課題は、混乱の収拾だった。
      チェチェンでの戦争を強硬に進め、地方の知事の公選を廃止し、有力な財閥を排除する。
      報道機関も国家の影響下に置かれた。

      経済は、石油と天然ガスの価格の上昇によって好転した。
      生活水準が改善し、支持は安定する。
      2008年、憲法の制限を避けるため首相に移り、4年後に大統領へ戻った。
      任期も延長され、2020年の憲法改正で続投が可能になる。

      対外的には、旧ソ連の地域を自国の影響圏とみなす姿勢を強めた。
      2008年にジョージアへ侵攻し、2014年にクリミアを併合する。
      2022年、ウクライナへの全面的な侵攻に踏み切った。
      広範な制裁を受け、ヨーロッパとの関係は断たれた。
      国内では反対派が投獄され、報道はさらに統制されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Vladimir_Putin_%282026_02_23%29.jpg/500px-Vladimir_Putin_%282026_02_23%29.jpg
      credit: Kremlin.ru / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Vladimir_Putin_(2026_02_23).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウラジーミル・プーチン

  - id: zelensky
    title: ゼレンスキー
    start: 2019
    ongoing: true
    category: politics
    tags: [ウクライナ, 戦争]
    summary: 侵攻を受けた国にとどまって抗戦を指揮し、各国の支援を引き出し続けている。
    detail: |
      ウクライナの大統領で、2019年から在任している。
      侵攻を受けた国にとどまって抗戦を指揮し、各国の支援を引き出し続けている。

      もとは俳優と喜劇の制作者である。
      教師が偶然に大統領になるというテレビドラマで主役を演じ、その人気を背景に出馬した。
      政治の経験はないまま、決選投票で7割を超える票を得て当選する。
      公約は、汚職の一掃と東部の紛争の終結だった。
      しかし交渉は進まず、改革も難航する。
      2022年2月24日、ロシアが全面的な侵攻を開始した。
      首都の陥落は数日と見られ、国外への退避も提案される。

      彼はキーウにとどまった。
      街頭で撮影した短い動画で、自分はここにいると告げる。
      この一つの映像が、抵抗の意思を国内外に示した。
      以後、各国の議会と国際会議で演説を重ねた。
      相手国の歴史や記憶に触れながら支援を求める手法をとる。
      武器と資金の提供が続き、制裁も強化された。

      戦争は長期化している。
      国土の一部が占領され、多数の市民が犠牲になり、数百万が国外へ避難した。
      戦時下で選挙は延期されている。
      国の存続そのものが問われる状況での指導が続く。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/Volodymyr_Zelensky_2022_official_portrait_%28cropped%29.jpg/500px-Volodymyr_Zelensky_2022_official_portrait_%28cropped%29.jpg
      credit: Press Service of the President of Ukraine / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Volodymyr_Zelensky_2022_official_portrait_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウォロディミル・ゼレンスキー
