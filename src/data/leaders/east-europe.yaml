  - id: nicholas-i
    title: ニコライ1世
    start: 1825
    end: 1855
    category: politics
    tags: [ロシア, 反動]
    summary: デカブリストの乱を鎮めて言論を締めつけ、クリミア戦争で後進性を露呈した。
    detail: |
      ロシアの皇帝で、在位は1825年から1855年まで。
      デカブリストの乱を鎮めて言論を締めつけ、クリミア戦争で後進性を露呈した。

      即位の日に、将校たちの蜂起に直面した。
      これを砲撃で鎮圧し、首謀者を処刑する。
      この経験が、その後の統治の方針を決めた。
      体制の原理として、正教、専制、国民性という三つが掲げられた。
      西欧の思想の流入を防ぎ、秩序を守るという考え方である。
      秘密警察が設けられ、検閲が強化された。
      大学の自治は制限され、哲学の講座が廃止される。
      作家と思想家が監視と流刑の対象になった。

      対外的には、ヨーロッパの秩序の守護者を自任した。
      1830年のポーランドの蜂起を鎮圧し、1849年にはハンガリーの革命を鎮めるためオーストリアへ軍を送る。
      ヨーロッパの憲兵と呼ばれた。
      1853年、オスマン帝国との戦争に踏み切った。
      英仏が介入し、クリミア戦争になる。

      戦争は、ロシアの後進性を明らかにした。
      鉄道が乏しく、兵と物資を前線へ送れない。
      兵器も帆船の艦隊も旧式だった。
      敗北が確定する前に病没する。
      改革の必要は、次代に引き継がれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Franz_Kr%C3%BCger_-_Portrait_of_Emperor_Nicholas_I_-_WGA12289.jpg/500px-Franz_Kr%C3%BCger_-_Portrait_of_Emperor_Nicholas_I_-_WGA12289.jpg
      credit: フランツ・クリューガー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Franz_Kr%C3%BCger_-_Portrait_of_Emperor_Nicholas_I_-_WGA12289.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ニコライ1世_(ロシア皇帝)

  - id: alexander-ii
    title: アレクサンドル2世
    start: 1855
    end: 1881
    category: society
    tags: [ロシア, 農奴解放]
    summary: 農奴解放をはじめ上からの大改革を進めたが、テロで命を落とした。
    detail: |
      ロシアの皇帝で、在位は1855年から1881年まで。
      農奴解放をはじめとする上からの大改革を進めたが、テロによって命を落とした。

      クリミア戦争の最中に即位し、敗戦の処理から始めた。
      敗北が示した後進性を、改革の必要として受け止める。
      1861年、農奴解放令を発した。
      2000万を超える農民が人格的な自由を得る。
      下からの解放が起きる前に上から行うべきだと述べたと伝えられる。

      しかし土地は無償では与えられなかった。
      農民は共同体を通じて買い戻しの代金を長期に支払う義務を負う。
      移動も共同体に縛られ、生活はかえって苦しくなった地域もある。
      他の改革も進められた。
      地方に自治の機関が設けられ、司法では陪審と公開の裁判が導入される。
      徴兵は身分を問わない義務になり、大学の自治も認められた。

      対外的には、中央アジアへ進出し、アラスカをアメリカへ売却した。
      改革は不徹底とみなされ、批判が強まる。
      急進的な運動が生まれ、皇帝への暗殺が繰り返し試みられた。
      1881年、憲法に近い制度を承認した当日に、爆弾によって殺害される。
      後継者は改革を中止し、反動の路線をとった。
      上からの改革の可能性と限界が、この治世に現れている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/Zar_Alexander_II_%28cropped%29_%28cropped%29.jpg/500px-Zar_Alexander_II_%28cropped%29_%28cropped%29.jpg
      credit: Attributed to ウィリアム・ダウニー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Zar_Alexander_II_(cropped)_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アレクサンドル2世_(ロシア皇帝)

  - id: nicholas-ii
    title: ニコライ2世
    start: 1894
    end: 1917
    category: politics
    tags: [ロシア, 革命]
    summary: 敗戦と革命に応えられず、300年のロマノフ朝を終わらせた最後の皇帝。
    detail: |
      ロシア最後の皇帝で、在位は1894年から1917年まで。
      敗戦と革命に応えられず、300年続いたロマノフ朝を終わらせた。

      26歳で即位した。
      専制の維持を信条とし、立憲制への要求を根拠のない夢想と退けている。
      極東への進出が日本との対立を生み、1904年に日露戦争が起きた。
      旅順の陥落と日本海海戦の敗北で、権威は大きく傷つく。

      1905年、労働者の請願行進に軍が発砲した。
      血の日曜日と呼ばれるこの事件によって、皇帝への信頼は失われる。
      ストライキと反乱が全国に広がり、議会の開設を約束する詔書が出された。
      しかし議会の権限は制限され、たびたび解散される。
      皇太子は血友病を患っていた。
      治療に効果があるとされた祈祷僧ラスプーチンが宮廷で影響力を持ち、腐敗の象徴とみなされる。

      第一次世界大戦では、自ら前線の総司令官を務めた。
      敗北の責任が直接に及び、首都の統治は皇后とラスプーチンに委ねられる。
      1917年2月、首都のパンを求める行進から革命が起きた。
      軍も同調し、皇帝は退位する。
      翌年、一家はエカテリンブルクで銃殺された。
      専制を守ろうとした選択が、王朝そのものを終わらせた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Mikola_II_%28cropped%29-2.jpg/500px-Mikola_II_%28cropped%29-2.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Mikola_II_(cropped)-2.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ニコライ2世_(ロシア皇帝)

  - id: lenin
    title: レーニン
    start: 1917
    end: 1924
    category: politics
    tags: [ソ連, 革命]
    summary: 世界初の社会主義政権を樹立し、前衛党が国家を率いるという型を世界に広めた。
    detail: |
      ロシア革命を指導した人物で、1917年から1924年まで政権の中心にいた。
      世界初の社会主義政権を樹立した。
      前衛党が国家を率いるという型を世界に広げる。

      兄が皇帝の暗殺計画に加わって処刑された経験が、その出発点にある。
      法律を学び、マルクス主義の運動に加わって流刑と亡命を重ねた。
      理論の特徴は、党の役割にある。
      労働者の自然な意識だけでは革命に至らず、職業的な革命家からなる規律ある党が指導すべきだと説いた。
      この主張から、1903年に党は二つに分かれる。

      1917年、2月革命の後に帰国した。
      すべての権力をソヴィエトへと訴え、臨時政府との二重権力の状態を打破する方針を示す。
      10月、武装蜂起によって政権を奪った。
      土地の私有の廃止と、大戦からの離脱を直ちに宣言する。

      内戦のなか、独裁的な統治が敷かれた。
      秘密警察が組織され、他党派が排除される。
      強制的な穀物の徴発が行われた。
      1921年、経済の破綻を受けて一定の商業を認める政策へ転換する。
      晩年、スターリンの権力の集中を警戒する文書を残した。
      しかしそれは公表されない。
      1924年に没し、遺体は保存されて公開された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/Lenin_in_1920_%28cropped%29.jpg/500px-Lenin_in_1920_%28cropped%29.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Lenin_in_1920_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウラジーミル・レーニン

  - id: pilsudski
    title: ピウスツキ
    start: 1918
    end: 1935
    category: politics
    tags: [ポーランド, 独立]
    summary: 123年ぶりに独立したポーランドを率い、ソ連の西進を食い止めた。
    detail: |
      ポーランドの指導者で、1918年から1935年まで国政の中心にいた。
      123年ぶりに独立した国を率い、ソ連の西進を食い止めた。

      ロシア領の貴族の家に生まれ、若いころ社会主義の運動に加わって流刑になった。
      独立には軍事力が必要だと考え、第一次世界大戦ではオーストリア側で軍団を編成した。
      後にドイツと対立して投獄される。
      1918年、ドイツの敗戦によって釈放され、帰国して国家元首となった。
      分割していた三国がすべて崩壊したことで、独立が実現する。

      直後から国境をめぐる戦いが続いた。
      1920年、ソ連の赤軍がワルシャワに迫る。
      革命をヨーロッパへ広げる勢いだった。
      ピウスツキは側面から反撃し、敵を分断して撃退した。
      ヴィスワ川の奇跡と呼ばれる。

      この勝利によって、ソ連の西進は止まった。
      1922年に一度引退したが、政治の混乱と経済の困難のなか、1926年にクーデタで復帰する。
      以後、公式の職には就かないまま実権を握った。
      議会は制限され、反対派は拘束される。
      外交では、ドイツとソ連の双方と不可侵条約を結び、均衡を保とうとした。
      1935年の死の4年後、ポーランドは両国によって再び分割される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/61/J%C3%B3zef_Pi%C5%82sudski_%28-1930%29.jpg/500px-J%C3%B3zef_Pi%C5%82sudski_%28-1930%29.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:J%C3%B3zef_Pi%C5%82sudski_(-1930).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ユゼフ・ピウスツキ

  - id: stalin
    title: スターリン
    start: 1924
    end: 1953
    category: politics
    tags: [ソ連, 独裁]
    summary: 計画経済で重工業を築く一方、粛清と飢饉で膨大な犠牲を出した。
    detail: |
      ソ連の指導者で、1924年から1953年まで権力の座にあった。
      計画経済によって重工業を築く一方、粛清と飢饉で膨大な犠牲を出した。

      ジョージアの靴職人の家に生まれ、神学校を中退して革命運動に加わった。
      党の書記長という地味な職から、人事を握ることで実権を掌握する。
      1928年から計画経済が始まった。
      重工業に資源を集中し、10年で工業生産を数倍にする。
      農業は強制的に集団化され、抵抗した農民は富農として弾圧された。

      穀物の強制的な徴発は、1932年からの大飢饉を招く。
      ウクライナを中心に数百万が餓死した。
      1930年代後半、大粛清が行われた。
      党の幹部、軍の将官、知識人、一般市民が逮捕され、処刑または収容所へ送られる。
      犠牲は数十万から100万を超えるとされる。

      独ソ戦では、初期に大きな損害を受けながら国を守り抜いた。
      勝利によって権威は頂点に達し、東欧に影響圏を築く。
      戦後も統制は緩まなかった。
      1953年に没する。
      3年後、フルシチョフが個人崇拝と犯罪を批判した。
      工業化の成果と、その代償をどう評価するかは今も論争が続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Joseph_Stalin_official_portrait.jpg/500px-Joseph_Stalin_official_portrait.jpg
      credit: Ivan Shagin / Public domain
      page: https://commons.wikimedia.org/wiki/File:Joseph_Stalin_official_portrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヨシフ・スターリン

  - id: tito
    title: ティトー
    start: 1945
    end: 1980
    category: politics
    tags: [ユーゴスラビア, 非同盟]
    summary: ソ連と距離を置く独自路線で、多民族のユーゴスラビアを一代でまとめた。
    detail: |
      ユーゴスラビアの指導者で、1945年から1980年まで権力の座にあった。
      ソ連と距離を置く独自路線をとり、多民族の国家を一代でまとめた。

      第二次世界大戦では、パルチザンを率いてドイツ軍と戦った。
      自力で国土の大半を解放したことが、後の立場を支える。
      1948年、ソ連と決裂した。
      スターリンの指示に従わず、自国の道を主張する。
      経済協力の機構から除名され、暗殺も企てられた。

      独自の体制が築かれた。
      企業を国家ではなく労働者の評議会が運営する自主管理の仕組みが導入される。
      市場の要素も一部取り入れられ、国民は国外へ出稼ぎに行くことができた。
      外交では非同盟を掲げた。
      インドやエジプトと協力し、米ソのいずれにも属さない諸国の運動を主導する。

      国内は、六つの共和国と二つの自治州、複数の民族と宗教からなる。
      連邦の制度と、党と軍、そしてティトー個人の権威によって統合が保たれた。
      民族の対立を表面化させないことが、統治の要である。
      1980年に没する。
      10年後、経済の悪化とともに民族主義が噴き出し、連邦は内戦を伴って解体した。
      統合が個人に依存していたことの帰結でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Josip_Broz_Tito_uniform_portrait.jpg/500px-Josip_Broz_Tito_uniform_portrait.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Josip_Broz_Tito_uniform_portrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヨシップ・ブロズ・チトー

  - id: khrushchev
    title: フルシチョフ
    start: 1953
    end: 1964
    category: politics
    tags: [ソ連, 雪どけ]
    summary: スターリン批判で共産圏を揺さぶり、キューバ危機では核戦争の瀬戸際まで行った。
    detail: |
      ソ連の指導者で、1953年から1964年まで権力の座にあった。
      スターリン批判によって共産圏を揺さぶり、キューバ危機では核戦争の瀬戸際まで行った。

      炭鉱労働者から党の幹部になり、スターリンの死後の争いを勝ち抜いた。
      1956年の党大会で、秘密の報告を行った。
      個人崇拝と大量の弾圧を名指しで批判する内容である。
      参加者に衝撃を与え、内容はまもなく世界に伝わった。
      影響は各国に及んだ。
      収容所からの釈放と名誉回復が進む一方、ポーランドとハンガリーでは動揺が起きる。
      ハンガリーの蜂起は軍事介入で鎮圧された。
      中国との関係も、この批判をめぐって悪化する。

      内政では、農業の改善を重視した。
      未開の土地を耕す事業を進め、トウモロコシの栽培を各地で奨励する。
      成果は限定的だった。
      住宅の大量建設は、生活の改善に寄与している。

      宇宙開発では、人工衛星と有人飛行を先行させた。
      1962年、キューバにミサイルを配備して危機を招く。
      交渉によって撤去したが、屈服とみなされて威信を失った。
      1964年、党の会議で解任される。
      前任者のように処刑されなかったことが、時代の変化を示している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/1956_Press_Photo_Communist_Party_Secretary_Nikita_S._Khrushchev_in_Moscow_%28cropped%29.jpg/500px-1956_Press_Photo_Communist_Party_Secretary_Nikita_S._Khrushchev_in_Moscow_%28cropped%29.jpg
      credit: TASS / Public domain
      page: https://commons.wikimedia.org/wiki/File:1956_Press_Photo_Communist_Party_Secretary_Nikita_S._Khrushchev_in_Moscow_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ニキータ・フルシチョフ

  - id: brezhnev
    title: ブレジネフ
    start: 1964
    end: 1982
    category: politics
    tags: [ソ連, 停滞]
    summary: 安定と停滞が同義になった18年で、改革の先送りがソ連の体力を奪った。
    detail: |
      ソ連の指導者で、1964年から1982年まで権力の座にあった。
      安定と停滞が同義になった18年であり、改革の先送りがソ連の体力を奪った。

      フルシチョフを解任した政変によって指導者になった。
      前任者の性急な改革への反動から、現状の維持が方針になる。
      幹部の地位が保障され、人事の異動が減った。
      党の官僚は長期にわたり同じ職にとどまり、平均年齢が上がっていく。
      腐敗と縁故が広がった。

      経済は当初、石油と天然ガスの輸出によって潤った。
      1970年代の価格の上昇が、改革の必要を覆い隠す。
      消費財の不足と技術の遅れは解決されなかった。
      軍備は拡大し続け、米国と核の均衡に達した。
      国内総生産に占める軍事費の比率は極めて高い。
      1968年、チェコスロヴァキアの改革に軍事介入した。
      社会主義共同体の利益のために介入する権利があると主張する。

      1975年のヘルシンキ宣言では、人権の尊重も約束した。
      これが反体制の運動に根拠を与える。
      1979年、アフガニスタンへ侵攻した。
      泥沼化し、国力を消耗させる。
      晩年は健康を害し、公の場でも言葉が不明瞭だった。
      体制の老化を象徴する姿として記憶されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b9/Leonid_Brezjnev%2C_leider_van_de_Sovjet-Unie%2C_Bestanddeelnr_925-6564.jpg/500px-Leonid_Brezjnev%2C_leider_van_de_Sovjet-Unie%2C_Bestanddeelnr_925-6564.jpg
      credit: Vladimir Musaelyan / CC0
      page: https://commons.wikimedia.org/wiki/File:Leonid_Brezjnev,_leider_van_de_Sovjet-Unie,_Bestanddeelnr_925-6564.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/レオニード・ブレジネフ

  - id: ceausescu
    title: チャウシェスク
    start: 1965
    end: 1989
    category: politics
    tags: [ルーマニア, 独裁]
    summary: 独自外交で西側の評価を得ながら国内を締め上げ、革命で処刑された。
    detail: |
      ルーマニアの指導者で、1965年から1989年まで権力の座にあった。
      独自の外交で西側の評価を得ながら、国内を極端に締め上げた。
      革命によって処刑される。

      就任当初は柔軟な姿勢を示した。
      1968年のチェコスロヴァキアへの軍事介入を公然と批判し、参加を拒む。
      この行動によって、西側から自立した指導者として評価された。
      借款と技術の供与を受け、各国の首脳が訪問する。

      1971年に北朝鮮と中国を訪れた後、方針が変わった。
      個人崇拝の体制が築かれ、肖像と称号が国中に掲げられる。
      妻も高い地位に就き、一族が要職を占めた。
      1980年代、対外債務の早期返済が国策とされた。
      食糧と燃料が輸出に回され、国民の生活は極度に切り詰められる。
      暖房と電気は制限され、配給が行われた。

      人口を増やすため、中絶と避妊が禁じられた。
      望まれずに生まれた子どもが施設に集められ、劣悪な環境に置かれる。
      秘密警察が国民を監視し、密告が奨励された。
      1989年12月、地方の抗議を機に反乱が全国へ広がる。
      軍が離反し、夫妻は逃亡の末に捕らえられた。
      簡略な裁判の後、銃殺される。
      東欧の体制転換のなかで、唯一の流血を伴う交代だった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チャウシェスク

  - id: gorbachev
    title: ゴルバチョフ
    start: 1985
    end: 1991
    category: politics
    tags: [ソ連, ペレストロイカ]
    summary: 体制を開こうとした改革が、結果として冷戦とソ連そのものを終わらせた。
    detail: |
      ソ連最後の指導者で、1985年から1991年まで権力の座にあった。
      体制を開こうとした改革が、結果として冷戦とソ連そのものを終わらせた。

      54歳での就任は、老齢の指導者が続いた後では異例に若い。
      掲げたのは二つの方針である。
      一つは立て直しで、経済の効率化と企業の自主性の拡大を図る。
      もう一つは情報公開で、報道と議論の自由を広げた。
      1986年のチェルノブイリの事故が転機になった。
      初期の隠蔽が国内外の不信を招き、公開の必要が痛感される。
      以後、スターリン期の弾圧や現在の問題が公然と論じられるようになった。

      外交では、思考の転換を唱えた。
      アメリカと中距離核戦力の全廃条約を結び、アフガニスタンから撤退する。
      1989年、東欧の体制が揺らいでも軍事介入しない方針を明確にした。
      これによって、各国の体制は数か月で交代する。

      国内では、改革が制御を離れた。
      経済は混乱し、物不足が深刻になる。
      共和国の独立の動きが加速した。
      1991年8月、保守派のクーデタが起きて失敗する。
      権威は失われ、12月に連邦は解体された。
      冷戦を終わらせた功績と、国家を失わせた責任が、同じ人物に重なっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1b/GorbachevMS.jpg/500px-GorbachevMS.jpg
      credit: Leo Medvedev/Лев Леонидович Медведев / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:GorbachevMS.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ミハイル・ゴルバチョフ

  - id: walesa
    title: ワレサ
    start: 1990
    end: 1995
    category: politics
    tags: [ポーランド, 連帯]
    summary: 造船所の電気工から自主管理労組を率い、東欧の体制転換の象徴になった。
    detail: |
      ポーランドの労働運動の指導者で、1990年から1995年まで大統領を務めた。
      造船所の電気工から自主管理労組を率い、東欧の体制転換の象徴になった。

      グダンスクの造船所で働き、1970年の労働者の抗議に加わった。
      解雇された後も活動を続ける。
      1980年、食料の値上げに抗議するストライキが起きた。
      ワレサは造船所の塀を乗り越えて中に入り、指導者になる。
      交渉の結果、政府は独立した労働組合の結成を認めた。
      社会主義国で初めてのことである。
      連帯と名づけられた組織には、1000万人が加わった。
      人口の四分の一にあたる。

      1981年、戒厳令が敷かれて組織は非合法化される。
      ワレサは拘束されたが、翌年ノーベル平和賞を受けた。
      地下で活動は続く。
      1989年、経済の行き詰まりから政府が円卓会議を開いた。
      部分的に自由な選挙が行われ、連帯が圧勝する。
      非共産党の首相が誕生した。

      1990年、大統領に選出される。
      市場経済への急速な移行が進められ、物価の高騰と失業が広がった。
      支持は低下し、1995年の選挙で敗れる。
      労働者の運動が体制を変えたという経験は、各国に影響を与えた。
    image:
