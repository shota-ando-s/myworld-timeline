        url: https://ja.wikipedia.org/wiki/ウラジーミル1世

  - id: yaroslav-the-wise
    title: ヤロスラフ賢公
    start: 1019
    end: 1054
    category: society
    tags: [キエフ・ルーシ, 法]
    summary: 最初の法典と婚姻外交でキエフ・ルーシの最盛期を作った。
    detail: |
      キエフ大公で、在位は1019年から1054年まで。
      最初の法典と婚姻外交によって、キエフ・ルーシの最盛期を作った。
      賢公と呼ばれる。

      父の死後、兄弟との長い争いを経て単独の統治に至った。
      内政では、法典の編纂が最大の事績である。
      私的な復讐を制限し、罰金による解決を定めた。
      身分に応じた賠償の額が示され、慣習法が文書にまとめられる。
      都のキエフでは、大規模な建設が行われた。
      ハギア・ソフィアにちなむ聖堂が建てられ、黄金の門が築かれる。
      書物の収集と翻訳が進み、学校も設けられた。

      外交では、婚姻が用いられた。
      娘の一人はフランス王に、他の娘はノルウェーとハンガリーの王に嫁ぐ。
      息子もビザンツや西欧の王家と縁を結んだ。
      ヨーロッパの王家の一角に、ルーシが位置づけられたことになる。

      軍事では、遊牧民の侵入を退け、北方にも領域を広げた。
      死に際し、領土を五人の息子に分けて与えた。
      最年長者が大公位を継ぎ、順に繰り上がる方式である。
      これが後の争いの原因になる。
      最盛期を築いた統治と、分裂の種をまいた継承の決定が、同じ人物のなかにある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Yaroslav_the_Wise.jpg/500px-Yaroslav_the_Wise.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Yaroslav_the_Wise.jpg
    links:
