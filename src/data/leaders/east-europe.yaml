        url: https://ja.wikipedia.org/wiki/エカチェリーナ2世_(ロシア皇帝)

  - id: alexander-i-russia
    title: アレクサンドル1世
    start: 1801
    end: 1825
    category: war
    tags: [ロシア, ナポレオン戦争]
    summary: ナポレオンの遠征を退けてウィーン体制の主役となり、神聖同盟を唱えた。
    detail: |
      ロシアの皇帝で、在位は1801年から1825年まで。
      ナポレオンの遠征を退け、ウィーン体制の主役の一人になった。

      父帝が暗殺された政変によって即位した。
      その計画を知っていたとされ、生涯その記憶に苦しんだと伝えられる。
      即位当初は改革に意欲を示した。
      側近と改革の構想を議論し、教育制度を整え、大学を設立する。
      農奴解放も検討されたが、実現しなかった。

      対外的には、ナポレオンとの関係が中心になる。
      何度か戦って敗れ、1807年に同盟を結んだ。
      しかし大陸封鎖の負担から離反し、1812年の侵攻を招く。
      焦土戦術と冬によって、フランスの大軍は壊滅した。
      ロシア軍は追撃してヨーロッパへ進み、パリに入城する。

      ウィーン会議では、秩序の再建を主導した。
      キリスト教の理念にもとづく神聖同盟を提唱し、各国の君主に参加を求める。
      宗教的な色彩が強く、実際の効果は限られた。
      晩年は保守的になり、言論と大学への統制を強めた。
      1825年、療養先で急死する。
      遺体をめぐる疑問から、死を装って修道者になったという伝説が生まれた。
      直後に起きたデカブリストの乱は、その改革の挫折と無関係ではない。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/69/Alexander_I_of_Russia_by_G.Dawe_%28c._1818-1825%2C_Royal_coll._of_UK%29_%28cropped%29.jpg/500px-Alexander_I_of_Russia_by_G.Dawe_%28c._1818-1825%2C_Royal_coll._of_UK%29_%28cropped%29.jpg
