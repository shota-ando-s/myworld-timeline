lane: east-europe

# ルーシ・ロシア・ポーランド・ソ連圏の統治者。
leaders:
  - id: rurik-reign
    title: リューリク
    start: 862
    startCirca: true
    end: 879
    endCirca: true
    category: politics
    tags: [ルーシ, 伝承]
    summary: 年代記が伝えるルーシ最初の君主で、以後700年続く王家の祖とされた。
    detail: |
      年代記が伝えるルーシ最初の君主で、9世紀後半に活動したとされる。
      以後700年続くリューリク朝の祖とされた。

      12世紀に編まれた年代記によれば、スラヴとフィン系の諸族が争いを収められず、海の向こうのヴァリャーグに統治を求めた。
      我らの地は広く豊かだが秩序がない、来て治めてほしい、と告げたとされる。
      招かれたリューリクが、兄弟とともに来住した。
      ラドガに拠り、後にノヴゴロドを築いたと伝えられる。

      ヴァリャーグは、北欧から東へ進出した人々を指す。
      河川を下って交易と略奪を行い、ビザンツやイスラム世界と結ばれていた。
      遺跡からは北欧様式の品とイスラムの銀貨が出土する。
      この記述をどう読むかは、長く論争になってきた。
      北欧系の人々が国家を作ったとみる立場と、在地の社会がすでに国家の形を持っていたとみる立場が対立する。
      18世紀以来、政治的な含意を伴って争われてきた。

      実在を疑う説もあるが、この時期に北方の交易の拠点で支配の体制が生まれたことは確かである。
      リューリクの後、一族がキエフへ移って国家を築いた。
      その子孫が16世紀末まで君主の座を占める。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/b/b1/Rurik_titularnik.jpg
      credit: collective / Public domain
      page: https://commons.wikimedia.org/wiki/File:Rurik_titularnik.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/リューリク

  - id: vladimir-i
    title: ウラジーミル1世
    start: 980
    end: 1015
    category: religion
    tags: [キエフ・ルーシ, 正教]
    summary: ギリシア正教を国教に選び、ロシアの文化の向きを千年先まで決めた。
    detail: |
      キエフ大公で、在位は980年から1015年まで。
      ビザンツの正教を国の宗教として選び、東スラヴ文化の方向を千年先まで決めた。

      父の死後、兄弟との争いを経て権力を握った。
      即位の当初は多神教の神々を祀り、その像を都に立てている。
      やがて、一神教の受け入れを検討したと年代記は伝える。
      イスラム、ユダヤ教、西方のキリスト教、ビザンツの正教の使者を招いて比較したという。
      使節をコンスタンティノープルへ送ると、ハギア・ソフィアの典礼に接して天上か地上か分からなかったと報告した。
      この逸話は後から整えられたものだが、選択に政治的な計算があったことは確かである。

      988年ごろ、ビザンツ皇帝の妹を妃として迎える条件で洗礼を受けた。
      帝国と姻戚になることで、国際的な地位が上がる。
      帰国後、都の多神教の像を川に流させ、住民に集団の洗礼を受けさせた。

      聖職者と書物がもたらされ、キリル文字による文献が作られる。
      石造の聖堂が建てられ、十分の一税が定められた。
      正教を選んだことで、ルーシは西欧のカトリック圏とは別の文化圏に属することになった。
      後に正教会によって聖人とされている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Ukraine-Ivano-Frankivsk-Cathedral_of_Holy_Resurrection-5.jpg/500px-Ukraine-Ivano-Frankivsk-Cathedral_of_Holy_Resurrection-5.jpg
      credit: Alex Zelenko / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Ukraine-Ivano-Frankivsk-Cathedral_of_Holy_Resurrection-5.jpg
    links:
