  - id: ivan-iii
    title: イヴァン3世
    start: 1462
    end: 1505
    category: politics
    tags: [モスクワ, 独立]
    summary: モンゴルへの貢納をやめ、ビザンツの後継を名乗ってモスクワを主権国家にした。
    detail: |
      モスクワ大公で、在位は1462年から1505年まで。
      モンゴルへの貢納をやめ、諸公国を併合してモスクワを主権国家にした。
      大帝と呼ばれる。

      即位したとき、領域はまだ限られていた。
      まずノヴゴロドを併合した。
      リトアニアと結ぼうとしたことを理由に遠征し、1478年に共和国を解体する。
      市民の集会の鐘は外され、モスクワへ運ばれた。
      トヴェリなど他の公国も次々に併合される。
      1480年、ハンへの貢納を拒否した。
      ウグラ川で両軍が対峙したが、大きな戦闘のないままハン軍が撤退する。
      240年の従属が、ここで実質的に終わった。

      1472年、ビザンツ最後の皇帝の姪と結婚した。
      双頭の鷲を紋章とし、正教世界の後継者としての位置づけを主張する。
      モスクワを第三のローマとする観念も、この時期に生まれた。
      称号にも変化が現れた。
      全ルーシの君主を名乗り、ツァーリの語も用い始める。

      内政では法典を編み、土地を軍役と引き換えに与える制度を整えた。
      クレムリンの城壁と聖堂がイタリアの建築家によって建てられる。
      辺境の公国が主権国家へ変わる過程を、この治世が担った。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Ivan_III_of_Russia.jpg/500px-Ivan_III_of_Russia.jpg
      credit: H.F. Helmolt / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ivan_III_of_Russia.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イヴァン3世

  - id: ivan-iv
    title: イヴァン4世（雷帝）
    start: 1547
    end: 1584
    category: politics
    tags: [ロシア, ツァーリ]
    summary: 初めてツァーリを称し、恐怖政治と東方への拡大でロシアの形を変えた。
    detail: |
      ロシアの君主で、在位は1547年から1584年まで。
      初めてツァーリを称し、東方への拡大と恐怖政治によってロシアの形を変えた。
      雷帝と呼ばれる。

      3歳で即位し、幼少期は有力貴族の争いのなかで過ごした。
      16歳で正式に戴冠し、ツァーリの称号を用いる。
      治世の前半は改革の時期である。
      法典を編み、地方に自治の要素を導入し、身分の代表を集める会議を開いた。
      銃兵の部隊が常備軍として編成される。

      対外的には、カザンとアストラハンのハン国を併合した。
      ヴォルガ川の全域を押さえ、シベリアへの道が開かれる。
      1558年からのリヴォニア戦争は長期化し、失敗に終わった。
      1560年、妃の死を境に人格が変わったとされる。
      貴族への不信が強まり、1565年に国土を二つに分け、一方を自らの直轄地とした。
      黒衣の部隊が組織され、反逆の疑いをかけられた者が処刑される。
      ノヴゴロドでは、数千人が虐殺された。

      激高して自らの息子を打ち殺したとも伝えられる。
      有能な人材が失われ、経済は荒廃した。
      死後まもなく王朝は断絶し、動乱時代に入る。
      拡大と破壊が同じ治世に共存している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/Ivan_grozny_frame.jpg/500px-Ivan_grozny_frame.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ivan_grozny_frame.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イヴァン4世

  - id: boris-godunov
    title: ボリス・ゴドゥノフ
    start: 1598
    end: 1605
    category: politics
    tags: [ロシア, 動乱]
    summary: 王家断絶後の空位を埋めたが、大飢饉と偽皇帝の出現で動乱時代を招いた。
    detail: |
      ロシアの君主で、在位は1598年から1605年まで。
      王家の断絶後の空位を埋めたが、大飢饉と偽の皇帝の出現によって動乱を招いた。

      イヴァン4世の側近として仕え、その子の妃の兄にあたる。
      病弱な君主に代わって事実上の統治を担っていた。
      1598年に君主が没して王朝が断絶すると、身分の代表の会議で選出された。
      血統によらず選挙で君主が立てられたことになる。
      これが正統性への疑いを残した。

      統治は有能とされる。
      都市の建設、交易の振興、教育のための留学生の派遣を行った。
      モスクワに総主教座が設けられ、教会の地位が高まる。
      1601年から3年間、大飢饉が起きた。
      夏に霜が降り、作物が実らない。
      穀物を放出して救済したが、数十万が餓死した。
      民衆のあいだでは、正統でない君主だから天罰が下ったという見方が広がる。

      1604年、イヴァン4世の末子を名乗る人物がポーランドの支援で進軍した。
      幼くして死亡していた王子であり、僭称者である。
      しかし各地で支持が広がった。
      1605年、ボリスは急死する。
      子は殺され、僭称者がモスクワへ入った。
      動乱時代が本格化する。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/54/Boris_Godunov_by_anonim_%2817th_c.%2C_GIM%29.jpg/500px-Boris_Godunov_by_anonim_%2817th_c.%2C_GIM%29.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Boris_Godunov_by_anonim_(17th_c.,_GIM).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ボリス・ゴドゥノフ

  - id: mikhail-romanov
    title: ミハイル・ロマノフ
    start: 1613
    end: 1645
    category: politics
    tags: [ロシア, ロマノフ朝]
    summary: 動乱を終わらせ、革命まで300年続くロマノフ朝を開いた。
    detail: |
      ロシアの君主で、在位は1613年から1645年まで。
      動乱時代を終わらせ、1917年まで続くロマノフ朝を開いた。

      16歳で選出された。
      全国の身分の代表が集まる会議で、複数の候補から選ばれる。
      選ばれた理由は、有力な一族の出身でありながら、動乱のなかで特定の勢力と深く結びついていなかったことにある。
      父はイヴァン4世の最初の妃の一族で、動乱の時期には修道士としてポーランドに抑留されていた。
      即位したとき、国は荒廃していた。
      ポーランドとスウェーデンが領土を占領し、各地に武装集団が残る。
      財政は破綻していた。

      まずスウェーデンと講和し、バルト海への出口を放棄する代わりにノヴゴロドを取り戻した。
      ポーランドとも休戦を結び、領土の一部を譲る。
      国内では、身分の代表の会議が頻繁に開かれた。
      新しい王朝の決定に支持を得るためである。

      1619年、父が帰国して総主教となり、実質的な統治を担った。
      軍の再建では、外国人の教官を招いて西欧式の部隊を編成する。
      農民の逃亡を捜索できる期間が延長され、農奴制が強まっていく。
      動乱の収拾という課題を果たし、王朝の基礎を作った治世である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/Michael-I-Romanov-Wedekind_%28cropped%29.jpg/500px-Michael-I-Romanov-Wedekind_%28cropped%29.jpg
      credit: ヨハン・ハインリヒ・ヴェーデキント / Public domain
      page: https://commons.wikimedia.org/wiki/File:Michael-I-Romanov-Wedekind_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ミハイル・ロマノフ

  - id: jan-sobieski
    title: ヤン3世ソビエスキ
    start: 1674
    end: 1696
    category: war
    tags: [ポーランド, オスマン]
    summary: 第二次ウィーン包囲を破り、オスマン帝国の中欧進出を終わらせた。
    detail: |
      ポーランド王で、在位は1674年から1696年まで。
      第二次ウィーン包囲を破り、オスマン帝国の中欧への進出を終わらせた。

      軍人として頭角を現し、オスマンとの戦いで勝利を重ねて王に選ばれた。
      1683年、オスマン帝国の15万を超える軍がウィーンを包囲した。
      守備隊は1万数千で、陥落は時間の問題とみられている。
      教皇の呼びかけによって、ポーランドとドイツ諸侯の軍が集まった。
      ソビエスキが連合軍の総指揮をとる。

      9月12日、丘の上に布陣した連合軍が攻撃を開始した。
      夕刻、ポーランドの重装騎兵が突撃する。
      背に羽根の飾りをつけた部隊で、その突撃によってオスマン軍は総崩れになった。
      この勝利の後、オスマンは後退へ転じる。
      数年のうちにハンガリーの大半が奪回され、1699年の条約で大きな領土を失った。
      一方、ポーランド自身の国力は回復しなかった。
      貴族の自由が強すぎて統治は機能せず、隣国の干渉を受け続ける。

      王の死後、王位をめぐる争いが起き、国はさらに弱体化した。
      100年後、三度の分割によって国家は地図から消える。
      ヨーロッパを救った国が、自らは消滅するという経過をたどった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7a/Schultz_John_III_Sobieski.jpg/500px-Schultz_John_III_Sobieski.jpg
      credit: Attributed to ダニエル・シュルツ / Possibly Andreas Stech / Public domain
      page: https://commons.wikimedia.org/wiki/File:Schultz_John_III_Sobieski.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヤン3世_(ポーランド王)

  - id: peter-the-great
    title: ピョートル1世
    start: 1682
    end: 1725
    category: politics
    tags: [ロシア, 西欧化]
    summary: 西欧の技術と官僚制を力ずくで移植し、ロシアをヨーロッパの列強に変えた。
    detail: |
      ロシアの君主で、在位は1682年から1725年まで。
      西欧の技術と制度を力ずくで移植し、ロシアを列強に変えた。
      1721年に皇帝を称する。

      若いころ、モスクワの外国人街で技術と軍事に触れた。
      1697年には使節団に身分を隠して加わり、オランダとイギリスで造船を学ぶ。
      工場、病院、議会を見て回った。
      帰国後、改革を一気に進めた。
      貴族の長い髭を自ら切り、西欧風の服装を義務づける。
      暦を改め、キリル文字を簡略化した。

      行政では、官僚の等級を定める表を作った。
      家柄でなく官職の等級によって地位が決まる仕組みで、実力による登用の道が開かれる。
      教会には総主教を置かず、政府の機関の下に組み込んだ。
      軍と海軍を西欧式に整え、大北方戦争でスウェーデンを破る。
      バルト海への出口を得て、そこに新しい都サンクトペテルブルクを建設した。
      産業では、鉄と武器の工場が作られる。
      労働力は農奴が充てられた。

      改革の負担は民衆にのしかかった。
      新都の建設では多数が命を落とし、増税と徴兵が続く。
      反対した息子を尋問の末に死なせている。
      上からの近代化の典型例として、その功罪が論じられてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Peter_der-Grosse_1838.jpg/500px-Peter_der-Grosse_1838.jpg
      credit: ポール・ドラローシュ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Peter_der-Grosse_1838.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ピョートル1世_(ロシア皇帝)

  - id: catherine-the-great
    title: エカチェリーナ2世
    start: 1762
    end: 1796
    category: politics
    tags: [ロシア, 啓蒙専制]
    summary: 啓蒙を語りながら農奴制を強め、ポーランド分割と黒海進出で版図を広げた。
    detail: |
      ロシアの女帝で、在位は1762年から1796年まで。
      啓蒙思想を語りながら農奴制を強め、領土を大きく広げた。

      ドイツの小さな公国の出身で、皇太子の妃としてロシアへ来た。
      夫が即位すると、その政策への不満が広がった。
      近衛の部隊に支持され、クーデタによって夫を退位させる。
      夫はまもなく殺害された。

      啓蒙思想に強い関心を持ち、ヴォルテールらと文通した。
      法典の編纂のため、各身分の代表を集めた委員会を招集する。
      教育と医療の制度も整えられた。
      一方、実際の政策は貴族に有利だった。
      貴族は勤務の義務を免除され、特権が確認される。
      農奴の権利はさらに狭められ、地主は農奴を流刑にすることもできた。

      1773年、プガチョフの乱が起きる。
      数万が加わる大規模な反乱であり、鎮圧の後は統制がさらに強まった。
      フランス革命の後は、批判的な著作を発禁にしている。
      対外的には、オスマン帝国との戦争でクリミアと黒海沿岸を得た。
      三度のポーランド分割に加わり、広大な領域を併合する。
      啓蒙専制君主と呼ばれる。
      理念と統治の実態の隔たりが、最も大きく現れた例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Catherine_II_after_Roslin%2C_Rokotov_%281780s%2C_Kunsthistorisches_Museum%29.jpg/500px-Catherine_II_after_Roslin%2C_Rokotov_%281780s%2C_Kunsthistorisches_Museum%29.jpg
