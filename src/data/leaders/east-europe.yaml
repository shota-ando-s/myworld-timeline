  - id: vladimir-monomakh
    title: ウラジーミル・モノマフ
    start: 1113
    end: 1125
    category: politics
    tags: [キエフ・ルーシ]
    summary: 分裂しかけた諸公をまとめ直し、キエフ・ルーシ最後の輝きを作った。
    detail: |
      キエフ大公で、在位は1113年から1125年まで。
      分裂しかけた諸公をまとめ直し、キエフ・ルーシの最後の輝きを作った。

      母はビザンツ皇帝の一族とされ、その称号にちなむ名で呼ばれる。
      大公になる前から、遊牧民ポロヴェツとの戦いで名を上げていた。
      諸公を集めた会議を主導し、内輪の争いをやめて共通の敵に当たるよう説く。
      複数回の遠征によって、草原の勢力を大きく後退させた。

      1113年、キエフで暴動が起きた。
      高利貸しへの不満が爆発し、都市の有力者が彼を大公に招く。
      就任後、利息の上限を定める法を出した。
      債務によって身分を失う仕組みも制限される。
      民衆の不満に応える措置であり、統治の安定につながった。

      諸公に対しては、婚姻と武力を組み合わせて統制した。
      在位のあいだ、ルーシは一時的に一つの秩序のもとに戻る。
      子への訓戒として書かれた文章が残っている。
      約束を守ること、客をもてなすこと、弱い者を守ること、自ら働くことが説かれた。
      中世のルーシの倫理を伝える資料である。
      死後、分裂は再び進んだ。
      各地の公が自立し、キエフの権威は失われていく。
      統一を保った最後の大公として記憶されている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/b/ba/Vladimir-II-Vsevolodovich_Monomakh.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Vladimir-II-Vsevolodovich_Monomakh.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウラジーミル2世モノマフ

  - id: andrei-bogolyubsky
    title: アンドレイ・ボゴリュブスキー
    start: 1157
    end: 1174
    category: politics
    tags: [ルーシ, ウラジーミル]
    summary: 政治の重心を南のキエフから北東のウラジーミルへ移し、のちのモスクワへの道を開いた。
    detail: |
      ウラジーミル大公で、在位は1157年から1174年まで。
      政治の重心を南のキエフから北東のウラジーミルへ移した。
      のちのモスクワへ至る道を開いた人物である。

      父はキエフ大公だったが、彼自身は南の政治に関心を持たなかった。
      父の命に背いて北東の領地へ戻り、そこを拠点とする。
      ウラジーミルを都として整備した。
      石造の聖堂を建て、黄金の門を築き、城壁を巡らせる。
      近郊に宮殿と聖堂を建て、そこに住んだ。

      1169年、キエフを攻略した。
      都市は徹底的に略奪され、聖堂も例外ではない。
      重要なのは、その後の行動である。
      彼はキエフの大公位に就かず、弟にそこを任せて自らはウラジーミルに留まった。
      キエフが政治の中心であるという前提を、自ら否定したことになる。

      統治では、旧来の有力者の力を抑え、自らに従う者を登用した。
      ビザンツから持ち込んだとされるイコンをウラジーミルへ移し、その地の権威の源とする。
      1174年、側近の一族によって暗殺された。
      専制的な統治への反発が原因とされる。
      以後、ルーシの中心は北東へ移った。
      モスクワが台頭する土台は、この時期に作られている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/%D0%9A%D0%BD%D1%8F%D0%B7%D1%8C_%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B9_%D0%91%D0%BE%D0%B3%D0%BE%D0%BB%D1%8E%D0%B1%D1%81%D0%BA%D0%B8%D0%B9.jpg/500px-%D0%9A%D0%BD%D1%8F%D0%B7%D1%8C_%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B9_%D0%91%D0%BE%D0%B3%D0%BE%D0%BB%D1%8E%D0%B1%D1%81%D0%BA%D0%B8%D0%B9.jpg
      credit: ヴィクトル・ヴァスネツォフ / Public domain
