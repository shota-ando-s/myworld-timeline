  - id: jogaila
    title: ヤギェウォ
    start: 1386
    end: 1434
    category: politics
    tags: [ポーランド, リトアニア]
    summary: リトアニアとの合同で中欧最大の国家を作り、ドイツ騎士団の北上を止めた。
    detail: |
      リトアニア大公からポーランド王となった人物で、在位は1386年から1434年まで。
      両国の合同によって中欧最大の国家を作り、ドイツ騎士団の北上を止めた。

      リトアニアは、当時ヨーロッパで最後の大規模な非キリスト教の国家だった。
      そのためドイツ騎士団の十字軍の標的になり続けている。
      ポーランドでは王が跡継ぎなく没し、幼い王女が女王となっていた。

      1385年、合意が成立する。
      ヨガイラが洗礼を受けてカトリックに改宗し、女王と結婚してポーランド王になる。
      リトアニアもキリスト教化されることが条件だった。
      これによって騎士団の遠征の名目は失われる。
      しかし騎士団は改宗の真意を疑い、攻撃を続けた。

      1410年、グルンヴァルトの戦いで両国の連合軍が騎士団を破った。
      中世ヨーロッパで最大級の会戦の一つである。
      騎士団は主力を失い、以後は衰退へ向かう。
      合同によって生まれた国家は、バルト海から黒海に迫る領域を持った。
      ヤギェウォの王朝は、ポーランド、リトアニア、ハンガリー、ボヘミアの王位を占める時期もある。
      彼自身は生涯リトアニア語を話し続け、読み書きはほとんどできなかったとされる。
      異なる宗教と民族をまたぐ統合の例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Jogaila_%28W%C5%82adys%C5%82aw_II%29.jpg/500px-Jogaila_%28W%C5%82adys%C5%82aw_II%29.jpg
      credit: 作者不明 / Public domain
