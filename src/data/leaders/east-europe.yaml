  - id: alexander-nevsky
    title: アレクサンドル・ネフスキー
    start: 1252
    end: 1263
    category: war
    tags: [ルーシ, モンゴル]
    summary: 西の騎士団は武力で退け、東のモンゴルには従うという選択で北ルーシを守った。
    detail: |
      ノヴゴロド公からウラジーミル大公となった人物で、13世紀半ばに活動した。
      西の騎士団は武力で退け、東のモンゴルには従うという選択で北ルーシを守った。

      1240年、スウェーデン軍をネヴァ川で破り、その名で呼ばれるようになる。
      1242年には氷上の戦いでドイツ騎士団を撃退した。
      一方、東のモンゴルに対しては異なる態度をとった。
      自らハンのもとへ赴き、服属して統治の承認を受ける。
      貢納のための人口調査にも協力し、反対する都市の抵抗を自ら抑えた。

      この選択は、現実的な判断とみられている。
      モンゴルの軍事力に対抗することは不可能であり、正教の信仰には干渉しない。
      対して西方は、改宗を求めてくる。
      信仰を守るには東に従うほうが得策だという計算である。

      弟が反乱を企てたときも、これを抑えた。
      モンゴルの報復による破壊を避けるためである。
      この判断への評価は分かれる。
      民族を守った英雄とみる立場と、支配に協力したとみる立場がある。
      正教会によって聖人とされ、ロシアでは長く国民的な英雄として扱われてきた。
      歴史上の人物が、時代ごとに異なる意味を与えられてきた例でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/AlexanderNevskyTitul.jpg/500px-AlexanderNevskyTitul.jpg
      credit: Collective of Kremlin Armory artists / Public domain
