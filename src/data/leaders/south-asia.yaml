    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/バーブル

  - id: akbar-reign
    title: アクバル
    start: 1556
    end: 1605
    category: politics
    tags: [ムガル帝国, 宗教共存]
    summary: 非イスラム教徒への人頭税を廃して諸宗教を取り込み、帝国を根づかせた。
    detail: |
      ムガル帝国の第3代君主で、在位は1556年から1605年まで。
      宗教の違いを越える統治によって、帝国を南アジアに根づかせた。

      13歳で即位した。
      領域は北インドの一部にすぎず、周囲は敵に囲まれている。
      数年のうちに後見役を退け、自ら統治を始めた。
      拡大は軍事によって進められたが、それ以上に重要なのが統合の方法である。
      ヒンドゥーのラージプートの諸侯と婚姻を結び、その当主を高い官職に登用した。
      征服した相手を家臣として体制に組み込む方式である。
      1564年には、非ムスリムに課されていた人頭税を廃止した。
      巡礼税も取りやめ、寺院の建設も認める。

      行政では、官僚を階層で位置づける制度を整えた。
      土地を測量して収穫を算定し、それにもとづいて税を定める仕組みも作られる。
      宗教への関心は深い。
      宮廷にヒンドゥー、ジャイナ、ゾロアスター、キリスト教の代表を招いて議論させた。
      自ら文字を読めなかったが、書物を読ませて聞いたとされる。

      晩年には、諸宗教の要素を取り入れた独自の信仰を提唱した。
      広がりはなかったが、その姿勢は統治の性格を表している。
      多様な社会を統治する方法として、後世も参照されてきた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/d/d1/Akbar1.jpg
      credit: user:Muntasir du / Public domain
      page: https://commons.wikimedia.org/wiki/File:Akbar1.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アクバル

  - id: jahangir
    title: ジャハーンギール
    start: 1605
    end: 1627
    category: culture
    tags: [ムガル帝国, 細密画]
    summary: 細密画と庭園を愛し、イギリス使節を迎えて交易の扉を開いた。
    detail: |
      ムガル帝国の第4代君主で、在位は1605年から1627年まで。
      細密画と庭園を愛し、イギリスの使節を迎えて交易の扉を開いた。

      アクバルの子で、皇太子の時代には父に反抗して争ったこともある。
      統治の方針は父を引き継いだ。
      宗教への寛容を保ち、ヒンドゥーの諸侯を登用し続ける。
      自らも回想録を残した。
      政治だけでなく、動植物の観察、絵画の評価、薬物の効果までが率直に記されている。
      阿片と酒への依存を自ら認める記述もある。

      芸術への関心は深い。
      宮廷の画家に、鳥や花、動物を写実的に描かせた。
      遠近法や陰影といったヨーロッパの技法も取り入れられる。
      宮殿の外に正義の鎖を吊るし、訴えのある者が直接鳴らせるようにしたと伝えられる。
      1615年、イギリス国王の使節トマス・ローが宮廷に滞在した。
      交易の許可を求める交渉が行われ、東インド会社が商館を設ける道が開かれる。

      治世の後半は、妃のヌール・ジャハーンが政務に強い影響力を持った。
      貨幣に名が刻まれ、勅令にも関与している。
      晩年は後継をめぐる争いが続き、その混乱のなかで没した。
      文化の面での洗練が頂点に近づいた時期にあたる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8d/Jahangircrop.jpeg/500px-Jahangircrop.jpeg
      credit: Abu al-Hasan / Public domain
      page: https://commons.wikimedia.org/wiki/File:Jahangircrop.jpeg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジャハーンギール

  - id: shah-jahan
    title: シャー・ジャハーン
    start: 1628
    end: 1658
    category: culture
    tags: [ムガル帝国, タージ・マハル]
    summary: タージ・マハルをはじめ壮麗な建築を残し、帝国の富を石に変えた。
    detail: |
      ムガル帝国の第5代君主で、在位は1628年から1658年まで。
      壮麗な建築を数多く残し、帝国の富を石に変えた。
      タージ・マハルの造営で知られる。

      即位の際、競合する兄弟を排除している。
      建築への傾倒がこの治世の特徴である。
      白大理石に貴石を象嵌する技法が完成し、左右対称の構成と細やかな装飾が組み合わされた。
      妃ムムターズ・マハルが出産で没すると、その廟としてタージ・マハルを造営した。
      22年をかけ、数万人が動員される。
      デリーには新しい都を築き、赤い砂岩の城塞と大モスクを建てた。
      孔雀の玉座と呼ばれる宝飾の玉座も作られる。

      対外的には、デカン高原への遠征を続けた。
      中央アジアの故地の回復を試みたが、失敗している。
      経済は豊かで、世界の銀が流入していた。
      しかし建築と遠征の支出は重く、農民への課税が強められる。

      1657年に病に倒れると、四人の子が争った。
      勝ったアウラングゼーブは、父を城塞に幽閉する。
      晩年の8年間、川の向こうに見えるタージ・マハルを眺めて過ごしたと伝えられる。
      死後、妃の隣に葬られた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/%27Jujhar_Singh_Bundela_Kneels_in_Submission_to_Shah_Jahan%27%2C_painted_by_Bichitr%2C_c._1630%2C_Chester_Beatty_Library_%28cropped2%29.jpg/500px-%27Jujhar_Singh_Bundela_Kneels_in_Submission_to_Shah_Jahan%27%2C_painted_by_Bichitr%2C_c._1630%2C_Chester_Beatty_Library_%28cropped2%29.jpg
      credit: Bichitr / Public domain
      page: https://commons.wikimedia.org/wiki/File:%27Jujhar_Singh_Bundela_Kneels_in_Submission_to_Shah_Jahan%27,_painted_by_Bichitr,_c._1630,_Chester_Beatty_Library_(cropped2).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シャー・ジャハーン

  - id: aurangzeb-reign
    title: アウラングゼーブ
    start: 1658
    end: 1707
    category: politics
    tags: [ムガル帝国]
    summary: 版図を最大にしたが、宗教政策の転換と長い戦争が帝国の解体を早めた。
    detail: |
      ムガル帝国の第6代君主で、在位は1658年から1707年まで。
      版図を最大に広げたが、宗教政策の転換と長い戦争が帝国の解体を早めた。

      父の病を機に兄弟と争い、兄を処刑して父を幽閉した。
      統治の方針は、それまでと大きく異なる。
      イスラム法に厳格に従うことを掲げ、宮廷から音楽と絵画を退けた。
      自らは質素に暮らし、写経で生計の一部を得たと伝えられる。
      1679年、非ムスリムへの人頭税を復活させた。
      アクバル以来100年以上廃止されていた税である。
      一部の寺院が破壊され、ヒンドゥーの有力者の一部が離反した。
      シク教の指導者を処刑したことは、その共同体を武装させる契機になる。

      デカン高原への遠征は、在位の後半の25年を費やした。
      二つの王国を併合し、版図は最大になる。
      しかしマラーターのゲリラ戦を終わらせることはできなかった。
      宮廷ごと遠征地に滞在し続け、北の統治は緩む。

      戦費で財政は逼迫し、農民への課税が強められた。
      89歳で没した直後から、各地が自立していく。
      帝国の版図が最大の時点と、解体の始まりが重なっている。
      評価は、インドの歴史をめぐる現在の政治でも激しく争われている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/3/30/Aurangazeb.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Aurangazeb.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アウラングゼーブ

  - id: shivaji
    title: シヴァージー
    start: 1674
    end: 1680
    category: war
    tags: [マラーター, ヒンドゥー]
    summary: 機動戦でムガルに抗い、後のマラーター勢力とインド民族意識の原点になった。
    detail: |
      マラーター王国の創始者で、1674年に即位した。
      機動戦によってムガル帝国に抗い、後のインドの民族意識の原点になった。

      地方の武将の子として生まれた。
      10代のうちから砦を奪って自立し、山岳地帯に勢力を築く。
      戦い方に特徴がある。
      軽装の騎兵による急襲と撤退を繰り返し、正面からの決戦を避けた。
      山城を連ねて拠点とし、補給の難しい地形に敵を誘い込む。
      海軍も編成し、沿岸の交易を押さえた。

      ムガルの将軍との会見では、隠し持った鉤爪の武器で相手を倒した逸話が伝えられる。
      アグラで軟禁されたときは、果物の籠に隠れて脱出したとされる。
      1674年、正式に即位して王を名乗った。
      バラモンを招いて伝統的な儀礼を行い、ヒンドゥーの王としての正統性を示す。

      統治では、土地の測量にもとづく税制を整え、世襲の職を制限した。
      宗教には寛容で、ムスリムの部下も登用している。
      1680年に没した後も、その体制は続いた。
      19世紀以降、民族運動のなかで英雄として掲げられる。
      現在も地域と国の政治において、その名は強い象徴性を持ち続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Shivaji_British_Museum.jpg/500px-Shivaji_British_Museum.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Shivaji_British_Museum.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シヴァージー

  - id: tipu-sultan
    title: ティプー・スルタン
    start: 1782
    end: 1799
    category: war
    tags: [マイソール, イギリス]
    summary: ロケット兵器も使ってイギリスに最後まで抵抗した南インドの君主。
    detail: |
      南インドのマイソール王国の君主で、在位は1782年から1799年まで。
      イギリスに最後まで抵抗し、ロケット兵器を実戦で用いたことで知られる。

      父の代から、マイソールはイギリスと戦っていた。
      その父の死を受けて即位する。
      軍事の近代化を進めた。
      特に知られるのが、鉄の筒を用いたロケットである。
      射程は1キロを超え、集団で発射して敵の隊列を崩す。
      イギリス軍はこれに苦しめられ、鹵獲した兵器を本国へ持ち帰って研究した。
      そこから改良されたロケットが、後のヨーロッパの戦争で用いられる。

      外交では、フランスと結んでイギリスに対抗した。
      オスマン帝国やアフガニスタンへも使節を送っている。
      内政では、農業と交易を振興し、絹の産業を導入した。
      度量衡と暦を独自に定め、貨幣も改めている。

      四度にわたる戦争の末、1799年に都が陥落した。
      城門の近くで戦って死んだとされる。
      領土は分割され、王国は従属的な藩王国として再編された。
      評価は分かれる。
      植民地支配への抵抗の象徴とされる一方、統治下での改宗の強制をめぐる批判もある。
      インドの現在の政治においても、その名は論争の対象になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/TipuSultan1790.jpg/500px-TipuSultan1790.jpg
      credit: Anonymous artist from Mysore, India. / Public domain
      page: https://commons.wikimedia.org/wiki/File:TipuSultan1790.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ティプー・スルターン

  - id: ranjit-singh
    title: ランジート・シング
    start: 1801
    end: 1839
    category: politics
    tags: [シク王国, パンジャーブ]
    summary: パンジャーブにシク教徒の王国を築き、イギリスの北上を一代のあいだ止めた。
    detail: |
      シク教徒の王国をパンジャーブに築いた君主で、在位は1801年から1839年まで。
      イギリスの北上を一代のあいだ止めた。

      地方の小さな集団の長として出発し、混乱のなかで周囲をまとめた。
      1799年にラホールを占領し、2年後に王を称する。
      軍の近代化が方針の中心である。
      ヨーロッパの将校を雇い、フランスやイタリアの退役軍人が訓練を担当した。
      歩兵の隊列と砲兵を整え、当時のアジアで最も近代的な軍の一つを作る。

      領域はカシミール、ペシャワール、ムルターンに及んだ。
      アフガニスタン方面からの侵入も阻んでいる。
      統治では宗教の区別を設けなかった。
      シク教徒の王国でありながら、ムスリムとヒンドゥーの官僚を多数登用する。
      牛の屠殺は禁じたが、他宗教の礼拝は保障した。
      死刑をほとんど執行しなかったとも記録されている。

      アムリトサルの寺院に金箔を施したのはこの王である。
      現在の黄金寺院の姿は、この時期に整えられた。
      イギリスとは条約を結び、川を境として衝突を避けた。
      1839年に没すると、後継争いで国は乱れる。
      10年のうちに二度の戦争を経て併合された。
      一人の力量が地域の均衡を保っていた例である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/a/a9/MaharajaRanjitSIngh_-_L_Massard.gif
      credit: Leopold Massard (1812–1889)[réf. nécessaire] / Public domain
      page: https://commons.wikimedia.org/wiki/File:MaharajaRanjitSIngh_-_L_Massard.gif
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ランジート・シング

  - id: gandhi
    title: ガンディー
    start: 1915
    end: 1948
    category: society
    tags: [インド, 非暴力]
    summary: 非暴力・不服従という戦い方を発明し、植民地支配への抵抗の形を世界に広めた。
    detail: |
      インドの独立運動を率いた指導者で、1915年の帰国から1948年の暗殺まで活動した。
      非暴力と不服従という戦い方を確立し、植民地支配への抵抗の形を世界に広めた。

      弁護士としてイギリスで学び、南アフリカで20年を過ごした。
      そこで人種差別を受けた経験から、非暴力による抵抗の方法を練り上げる。
      1915年に帰国し、農民と労働者の争議に関わりながら支持を広げた。
      手法は、暴力を用いず、不当な法には従わないというものである。
      逮捕を受け入れ、暴力を受けても返さないことで、支配の不当さを可視化する。

      1930年の塩の行進が代表的な行動である。
      専売とされていた塩を自ら作るため、380キロを24日かけて歩いた。
      数万人が続き、逮捕者は数万に及ぶ。
      自らは糸車で布を織り、質素な衣をまとった。
      経済的な自立と、機械に頼らない生活の象徴である。
      カーストによる差別の撤廃にも取り組み、断食によって政治的な譲歩を引き出した。

      ヒンドゥーとムスリムの融和を最後まで求めたが、分離独立は避けられなかった。
      1948年、融和の姿勢を憎んだヒンドゥーの民族主義者に射殺される。
      その手法は、公民権運動をはじめ各国の運動に受け継がれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7a/Mahatma-Gandhi%2C_studio%2C_1931.jpg/500px-Mahatma-Gandhi%2C_studio%2C_1931.jpg
      credit: Elliott & Fry / Public domain
      page: https://commons.wikimedia.org/wiki/File:Mahatma-Gandhi,_studio,_1931.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マハトマ・ガンディー

  - id: jinnah
    title: ジンナー
    start: 1947
    end: 1948
    category: politics
    tags: [パキスタン, 分離独立]
    summary: ムスリムの別国家を主張してパキスタンを建国し、分離独立の当事者になった。
    detail: |
      パキスタンの建国者で、1947年から1948年まで初代の総督を務めた。
      ムスリムのための別の国家を主張し、分離独立の当事者になった。

      もとは国民会議の有力な活動家だった。
      ロンドンで法律を学び、弁護士として名声を得る。
      ヒンドゥーとムスリムの団結を説き、両者の協力の使節と呼ばれた時期もある。
      路線が分かれたのは1920年代である。
      ガンディーの大衆運動と宗教的な表現に馴染めず、憲法上の手続きによる解決を主張した。
      ムスリムが少数派として多数決の政治のなかで埋没するという懸念が強まる。
      1940年、ムスリムが多数を占める地域を別の国家とする決議が採択された。

      二つの民族が一つの国家に共存することはできないという主張である。
      宗教を国家の基礎とするこの論理は、国民会議と真っ向から対立した。
      1946年の選挙でムスリム連盟が圧倒的な支持を得ると、分離は避けられなくなる。
      各地で宗教間の暴力が激化し、イギリスは撤退を急いだ。

      1947年8月、パキスタンが成立した。
      数百万の人々が国境を越え、多数が犠牲になる。
      ジンナーは建国の翌年に病没した。
      宗教を基礎とする国家の内部で、どのような政治を行うのかという課題は、そのまま残された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Jinnah1945c.jpg/500px-Jinnah1945c.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Jinnah1945c.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ムハンマド・アリー・ジンナー

  - id: nehru
    title: ネルー
    start: 1947
    end: 1964
    category: politics
    tags: [インド, 非同盟]
    summary: 初代首相として計画経済と非同盟を掲げ、独立国インドの性格を決めた。
    detail: |
      インドの初代首相で、在任は1947年から1964年まで。
      計画経済と非同盟を掲げ、独立国インドの性格を決めた。

      裕福な家に生まれ、イギリスで教育を受けた。
      独立運動に加わり、通算で9年を獄中で過ごしている。
      獄中で書いた世界史の手紙と自伝は、広く読まれた。
      首相として、いくつもの基本方針を定めた。

      経済では、国家が主導する工業化を進めた。
      5年ごとの計画を立て、鉄鋼、重機械、ダム、発電所に投資する。
      ダムを現代の寺院と呼んだ。
      民間の活動も認めるが、基幹産業は公共の部門が担う体制である。
      外交では非同盟を掲げた。
      米ソのいずれの陣営にも属さず、新興の独立国が独自に発言する立場をとる。
      1955年のバンドン会議を主導した。

      国内では、世俗主義を国家の原則とした。
      宗教によって国民を区別せず、多言語と多宗教のまま民主主義を続けるという選択である。
      言語によって州を再編し、選挙を定期的に実施した。
      1962年、中国との国境紛争で敗れたことは大きな打撃になった。
      計画経済は後に転換されるが、世俗主義と民主主義の枠組みは現在も国家の基礎にある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Nehru_in_the_Netherlands%2C_1957.jpg/500px-Nehru_in_the_Netherlands%2C_1957.jpg
      credit: Harry Pot / CC0
