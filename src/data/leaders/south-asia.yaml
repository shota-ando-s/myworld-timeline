  - id: firuz-shah-tughluq
    title: フィールーズ・シャー
    start: 1351
    end: 1388
    category: society
    tags: [デリー・スルタン朝, 灌漑]
    summary: 運河と施療院の整備で内政を立て直し、戦争より統治に力を注いだ。
    detail: |
      デリー・スルタン朝のトゥグルク朝の君主で、在位は1351年から1388年まで。
      戦争より内政に力を注ぎ、運河と施設の整備で国を立て直した。

      前任者の急死を受けて即位した。
      領域は各地の離反で縮んでおり、財政も荒れている。
      方針は明確だった。
      失われた地方の再征服をほとんど試みず、残った領域の統治に集中する。
      最大の事業が灌漑である。
      複数の運河を掘り、ジャムナー川とサトレジ川から水を引いた。
      最長のものは200キロに及ぶ。
      これによって乾燥地が耕地に変わり、税収も増えた。

      都市の建設も進めた。
      新しい町をいくつも作り、病院、貯水池、橋、隊商宿を整備する。
      無料の施療院を設け、失業者に職を斡旋する部署も置いた。
      税制では、イスラム法に定められた種類以外の徴収を廃止した。
      一方、宗教的には保守的だった。
      ヒンドゥー教徒への人頭税をバラモンにも拡大し、新しい寺院の建設を禁じる。

      アショーカ王の石柱をデリーへ運ばせ、自らの都に立てた。
      古代の遺物への関心を示す行動である。
      死後、後継争いによって王朝は急速に衰えた。
      10年後、ティムールの侵攻でデリーは壊滅する。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/Ashoka_Pillar_at_Firoze_Shah_Kotla%2C_Delhi.jpg/500px-Ashoka_Pillar_at_Firoze_Shah_Kotla%2C_Delhi.jpg
      credit: Samuel Bourne / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ashoka_Pillar_at_Firoze_Shah_Kotla,_Delhi.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フィールーズ・シャー・トゥグルク

  - id: krishnadevaraya
    title: クリシュナデーヴァラーヤ
    start: 1509
    end: 1529
    category: culture
    tags: [ヴィジャヤナガル]
    summary: 南インドのヒンドゥー王国を最盛期に導き、詩人としても名を残した。
    detail: |
      ヴィジャヤナガル王国の王で、在位は1509年から1529年まで。
      王国を最盛期に導き、自らも詩人として名を残した。

      即位したとき、北のイスラム諸王国と東のオリッサから圧力を受けていた。
      軍事では連戦連勝した。
      北の連合軍を破り、東海岸を制圧して領域を広げる。
      火器を導入し、ポルトガルから馬を購入して騎兵を強化した。

      統治では、水利の整備に力を注いだ。
      大規模な貯水池と水路が作られ、農業の生産が増える。
      税制を整理し、地方の有力者を統制した。
      宗教には寛容で、ヒンドゥーの各宗派を保護しながら、ジャイナ教やイスラムにも配慮している。
      都の繁栄は、訪れたポルトガル人の記録に詳しい。
      市場には宝石が山積みにされ、人口は数十万に及んだと記される。

      文学では、テルグ語の詩を自ら著した。
      宮廷には八人の詩人が集められ、この時期はテルグ文学の黄金期とされる。
      各地に寺院を建て、既存の寺院にも寄進を行った。
      死後、後継争いと北の諸王国の連合によって王国は傾く。
      1565年の敗戦で都は破壊された。
      南インドのヒンドゥー王国の最後の繁栄を体現した治世である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/d/d9/Flag_of_Vijayanagara_Empire.png
      credit: Raydong24 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Vijayanagara_Empire.png
    links:
