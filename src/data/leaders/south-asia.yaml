  - id: ambedkar
    title: アンベードカル
    start: 1947
    end: 1950
    category: society
    tags: [インド, 憲法, カースト]
    summary: 被差別カースト出身の法律家として憲法を起草し、不可触民制の廃止を書き込んだ。
    detail: |
      インド憲法の起草を主導した法律家で、1947年から1950年にかけて活動した。
      被差別カーストの出身であり、不可触民とされた人々の権利のために生涯を費やした。

      幼少期から差別を受け、学校では床に座らされ、水を自分で汲むことも許されなかった。
      奨学金を得てアメリカとイギリスで学び、経済学と法学の学位を取得する。
      帰国後、差別の撤廃を求める運動を組織した。
      貯水池の水を公然と飲む行動や、寺院への立ち入りを求める運動を行っている。

      ガンディーとは方針をめぐって対立した。
      ガンディーが差別の解消をヒンドゥー社会の内部の改革とみたのに対し、アンベードカルは制度としての保障を求める。
      別枠の選挙区をめぐる論争では、ガンディーの断食を受けて妥協が成立した。

      独立後、憲法の起草委員会の委員長に任命される。
      不可触民制の廃止を明文で定め、差別を禁じ、教育と公職における割当の制度を導入した。
      晩年、数十万の人々とともに仏教に改宗した。
      カーストの枠組みそのものから離れるという選択である。
      現在、その像はインド各地に立つ。
      憲法の起草者としてだけでなく、社会的な平等を求める運動の象徴として記憶されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Dr._Bhimrao_Ambedkar.jpg/500px-Dr._Bhimrao_Ambedkar.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Dr._Bhimrao_Ambedkar.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ビームラーオ・アンベードカル

  - id: indira-gandhi
    title: インディラ・ガンディー
    start: 1966
    end: 1984
    category: politics
    tags: [インド]
    summary: 緑の革命と核実験を進める一方、非常事態宣言で民主主義を一時停止した。
    detail: |
      インドの首相で、在任は1966年から1977年、および1980年から1984年まで。
      ネルーの娘である。
      緑の革命と核実験を進める一方、非常事態宣言によって民主主義を一時停止した。

      当初は操りやすい人物とみられていたが、まもなく党内で実権を握った。
      政策では、銀行の国有化と旧藩王への年金の廃止を進め、貧困の追放を掲げる。
      農業では、高収量の品種と肥料を導入する緑の革命が進み、食糧の自給が実現した。
      1971年、バングラデシュの独立を支援してパキスタンとの戦争に勝利する。
      1974年には最初の核実験を行った。

      1975年、選挙の不正を理由に議員の資格を失う判決が出ると、非常事態を宣言した。
      野党の指導者を拘束し、報道を検閲し、議会の選挙を延期する。
      強制的な不妊手術の実施は強い反発を招いた。
      1977年の選挙で敗北し、政権を失う。
      独立後の政治で初めての政権交代だった。
      3年後に返り咲く。

      1984年、シク教徒の分離主義者が立てこもった黄金寺院へ軍を突入させた。
      その報復として、同じ年にシク教徒の護衛に射殺される。
      民主主義の強さと脆さを、同じ人物の治世が示している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/Indira_Gandhi_official_portrait.png/500px-Indira_Gandhi_official_portrait.png
      credit: 首相官邸 / GODL-インド
      page: https://commons.wikimedia.org/wiki/File:Indira_Gandhi_official_portrait.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/インディラ・ガンディー

  - id: zia-ul-haq
    title: ジア・ウル・ハク
    start: 1977
    end: 1988
    category: religion
    tags: [パキスタン, イスラム化]
    summary: 軍政のもとで法のイスラム化を進め、アフガン戦争に深く関わった。
    detail: |
      パキスタンの軍人で、1977年から1988年まで政権を握った。
      軍政のもとで法のイスラム化を進め、アフガニスタンの戦争に深く関わった。

      陸軍参謀長だったが、選挙の不正をめぐる混乱のなかでクーデタを起こした。
      前首相のブットーは裁判にかけられ、処刑される。
      統治の柱がイスラム化である。
      刑法にイスラム法の規定が導入され、窃盗や姦通に対する厳しい刑が定められた。
      女性の証言の価値を男性の半分とする規定も設けられる。
      利子を伴わない銀行の制度が導入され、喜捨が税として徴収された。
      宗教学校が各地に増え、国家が支援する。

      1979年、ソ連がアフガニスタンに侵攻した。
      パキスタンは前線の国となり、アメリカとサウジアラビアからの巨額の支援を受ける。
      数百万の難民を受け入れ、武装勢力の訓練と補給の拠点になった。
      情報機関がこれを差配し、その影響力が国内政治でも強まる。

      同時に、武器と麻薬が国内に広がり、宗派間の暴力も増えた。
      1988年、輸送機の墜落で死亡した。
      原因は解明されていない。
      軍と宗教勢力が政治の中心に位置する構造は、この時期に固まった。
      その影響は現在まで続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/President_Mohammad_Zia_Ul_Haq.jpg/500px-President_Mohammad_Zia_Ul_Haq.jpg
      credit: "Series: Reagan White House Photographs, 1/20/1981 - 1/20/1989 Collection: White House Photographic Collection, 1/20/1981 - 1/20/1989 / Public domain"
      page: https://commons.wikimedia.org/wiki/File:President_Mohammad_Zia_Ul_Haq.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ムハンマド・ジア＝ウル＝ハク

  - id: rajiv-gandhi
    title: ラジーブ・ガンディー
    start: 1984
    end: 1989
    category: science
    tags: [インド, 情報化]
    summary: 通信と計算機の規制を緩め、後のIT産業の下地を作った。
    detail: |
      インドの首相で、在任は1984年から1989年まで。
      通信と計算機の規制を緩め、後の情報技術産業の下地を作った。

      もとは航空会社の操縦士で、政治には関心を持っていなかった。
      弟の事故死と母の暗殺によって、政界に入り首相になる。
      40歳での就任は最年少である。
      方針は、技術による近代化だった。
      計算機の輸入と生産にかかる規制と関税を引き下げ、ソフトウェアの産業を政策として支援する。
      電話網の整備を進め、村々に公衆電話を設置する計画が実行された。
      技術者を政府に登用し、通信の近代化を託している。

      経済では、許認可による統制を部分的に緩和した。
      本格的な自由化は1991年を待つが、その準備がこの時期に進む。
      外交では、スリランカの民族紛争に平和維持のための部隊を派遣した。
      しかし泥沼化し、撤退を余儀なくされる。

      武器の取引をめぐる疑惑が表面化し、1989年の選挙で敗れた。
      1991年、選挙運動の最中にスリランカの武装組織による自爆攻撃で暗殺される。
      情報技術の産業が後にインドの経済を牽引することを考えると、この時期の規制緩和の意味は大きい。
      短い在任のなかで、将来の産業の条件が整えられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Rajiv_Gandhi_%281987%29.jpg/500px-Rajiv_Gandhi_%281987%29.jpg
      credit: Bart Molendijk / Anefo / CC BY-SA 3.0 nl
      page: https://commons.wikimedia.org/wiki/File:Rajiv_Gandhi_(1987).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ラジーヴ・ガンディー

  - id: benazir-bhutto
    title: ベナジル・ブット
    start: 1988
    end: 1990
    category: politics
    tags: [パキスタン]
    summary: イスラム圏で初の女性首相となり、のちに選挙運動中に暗殺された。
    detail: |
      パキスタンの首相で、在任は1988年から1990年、および1993年から1996年まで。
      イスラム圏で初めて選挙で選ばれた女性の首相である。

      父は首相を務め、軍政下で処刑された。
      その後、自らも長く自宅軟禁と投獄を経験する。
      オックスフォードとハーヴァードで学び、帰国して父の政党を率いた。
      軍政の指導者の死後の選挙で勝利し、35歳で首相になる。

      就任時の期待は大きかった。
      民主主義の回復と、女性の地位の向上が掲げられる。
      政治犯が釈放され、報道の統制も緩められた。
      しかし実権は限られていた。
      大統領と軍が外交と安全保障を握り、国内の政策でも制約を受ける。
      前政権が導入した宗教に関わる法の改正も実現しなかった。

      汚職の疑惑を理由に、二度とも任期の途中で解任される。
      夫が関与したとされる事件は、長く論争になった。
      2007年、8年の亡命を経て帰国した。
      選挙運動の最中、集会からの帰路に爆発と銃撃を受けて死亡する。
      彼女の政党はその後の選挙で勝利した。
      軍と宗教勢力の力が強い社会で、選挙で選ばれた指導者がどこまで統治できるかという問題を、その経歴が示している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c4/Oliver_Mark_-_Benazir_Bhutto%2C_Dubai_2006_%28cropped%29.jpg/500px-Oliver_Mark_-_Benazir_Bhutto%2C_Dubai_2006_%28cropped%29.jpg
      credit: 作者不明 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Oliver_Mark_-_Benazir_Bhutto,_Dubai_2006_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ベーナズィール・ブットー

  - id: manmohan-singh
    title: マンモハン・シン
    start: 2004
    end: 2014
    category: economy
    tags: [インド, 自由化]
    summary: 1991年の経済自由化を設計した経済学者で、首相として高成長を続けた。
    detail: |
      インドの首相で、在任は2004年から2014年まで。
      1991年の経済自由化を財務相として設計した経済学者である。

      オックスフォードで経済学を学び、大学、中央銀行の総裁、政府の顧問を務めた。
      政治家としての選挙の経験はほとんどない。
      1991年、外貨危機のなかで財務相に起用された。
      産業の許可制の廃止、関税の引き下げ、外資の受け入れを実行する。
      2004年、与党の勝利の後、党首が首相の就任を辞退したため指名された。
      シク教徒として初めての首相である。
      在任中、経済は年8パーセント近い成長を続けた。
      情報技術と製造業が伸び、数千万人が貧困から抜け出す。

      社会政策では、農村での雇用を保障する制度が導入された。
      希望する世帯に年100日の労働を提供するもので、規模としては世界最大級である。
      情報公開法も制定された。
      外交では、アメリカとの民生用の原子力協定を実現した。
      核実験によって続いていた制限が緩和される。

      二期目は、汚職の疑惑が相次いで支持を失った。
      連立の枠組みのなかで、決定が滞ったという批判もある。
      物静かな学者が10年にわたり大国の首相を務めた例として、その評価は現在も論じられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Official_Portrait_of_the_Prime_Minister_Dr._Manmohan_Singh_%283x4_cropped%29.jpg/500px-Official_Portrait_of_the_Prime_Minister_Dr._Manmohan_Singh_%283x4_cropped%29.jpg
      credit: 首相官邸 / GODL-インド
      page: https://commons.wikimedia.org/wiki/File:Official_Portrait_of_the_Prime_Minister_Dr._Manmohan_Singh_(3x4_cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マンモハン・シン

  - id: modi
    title: モディ
    start: 2014
    ongoing: true
    category: politics
    tags: [インド, ヒンドゥー・ナショナリズム]
    summary: 強い指導者像とヒンドゥー色の政治で長期政権を築き、インドを世界の主要国に押し出した。
    detail: |
      インドの首相で、2014年から在任している。
      強い指導者像とヒンドゥー色の政治によって長期政権を築いた。
      インドを世界の主要国として位置づけようとしている。

      貧しい家庭に生まれ、幼いころ駅で茶を売っていたと語られる。
      ヒンドゥー民族主義の団体で活動し、グジャラート州の首相を13年務めた。
      州政権の時代、2002年に大規模な宗教暴動が起き、1000人以上が死亡した。
      対応をめぐる批判は今も続いている。
      一方、州の経済成長と行政の効率は高く評価された。

      2014年の総選挙で、単独過半数を得て首相になる。
      30年ぶりの単独政権だった。
      政策では、製造業の振興、全国民への銀行口座、衛生設備の普及、デジタル化が進められた。
      高額紙幣の廃止と全国共通の物品サービス税の導入は、大きな混乱も生んでいる。

      外交では、各国を精力的に訪問し、アメリカとの関係を深めながらロシアとの関係も維持する。
      グローバル・サウスの代表を自任し、2023年のG20を主催した。
      一方、宗教的少数派の扱い、報道の自由、司法の独立をめぐる懸念が国内外で指摘されている。
      2024年の選挙では三期目に入ったが、単独過半数は失った。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/5/5f/The_official_portrait_of_Shri_Narendra_Modi%2C_the_Prime_Minister_of_the_Republic_of_India.jpg
      credit: 首相官邸 / GODL-インド
      page: https://commons.wikimedia.org/wiki/File:The_official_portrait_of_Shri_Narendra_Modi,_the_Prime_Minister_of_the_Republic_of_India.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ナレンドラ・モディ
