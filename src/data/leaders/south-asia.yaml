lane: south-asia

leaders:
  - id: chandragupta-maurya
    title: チャンドラグプタ
    start: -321
    startCirca: true
    end: -297
    endCirca: true
    category: politics
    tags: [マウリヤ朝]
    summary: アレクサンドロス撤退後の空白を突いて北インドを統一し、最初の広域帝国を築いた。
    detail: |
      マウリヤ朝の創始者で、在位は紀元前4世紀の末。
      アレクサンドロス撤退後の空白を突いて北インドを統一した。
      最初の広域帝国を築いた人物である。

      出自についての記録は乏しく、身分の低い家の出とする伝承もある。
      若いころアレクサンドロスに会ったという逸話が伝えられる。
      遠征の後、ギリシア人の駐屯部隊を排除しながら勢力を広げた。
      バラモンの学者カウティリヤが助言者だったとされる。
      彼に帰せられる統治の書は、税制、外交、諜報、軍事を体系的に論じた文献である。
      目的のためには手段を選ばない現実主義で知られる。
      マガダ国の王朝を倒して権力を握り、北インド全域を支配下に置いた。

      紀元前305年ごろ、セレウコス1世と対峙する。
      戦闘の後に講和が結ばれ、アフガニスタン方面の領土を得た。
      代償として500頭の戦象を送り、その象が後のヘレニズム世界の戦争で活躍している。
      婚姻関係も結ばれ、使節が派遣された。

      ギリシア人の使節メガステネスは、都の壮大さと官僚制について記録を残した。
      晩年、ジャイナ教に帰依して王位を捨て、南インドで断食して没したという伝承がある。
      一代で大陸規模の帝国を築いた例として、インド史の出発点に置かれる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チャンドラグプタ

  - id: ashoka-reign
    title: アショーカ王
    start: -268
    startCirca: true
    end: -232
    endCirca: true
    category: religion
    tags: [マウリヤ朝, 仏教]
    summary: 征服の惨禍を悔いて仏教を保護し、石柱に刻んだ統治の理念をアジア中に広めた。
    detail: |
      マウリヤ朝の第3代の王で、在位は紀元前3世紀の中ごろ。
      征服の惨禍を悔いて仏教を保護し、統治の理念を石に刻んでアジア中に広めた。

      即位の経緯には、兄弟との争いの伝承がある。
      初期には残虐な王として描かれることもある。
      転機はカリンガの征服である。
      激しい戦闘で十数万が死亡し、多数が連行された。
      その惨状に深い後悔を抱いたと、自らの碑文に記している。

      以後、武力による拡大をやめ、法による統治を掲げた。
      ここでいう法とは、仏教の教義そのものではなく、生き物を害さないこと、親や年長者を敬うこと、他の宗派を尊重することを含む広い倫理である。
      磨崖と石柱に、この理念が各地の言語で刻まれた。
      ギリシア語とアラム語の碑文もある。
      王が民に直接語りかける形式であり、南アジアで最も古い解読された文字資料でもある。

      実際の政策としては、人と動物のための医療施設の設置、街道の整備と植樹、動物の犠牲の制限が記されている。
      仏教の使節がスリランカや西方へ送られ、国外への広がりの契機になった。
      碑文は長く読めなかったが、19世紀に解読される。
      石柱の獅子の柱頭は、現在のインドの国章に用いられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/Indian_relief_from_Amaravati%2C_Guntur._Preserved_in_Guimet_Museum.jpg/500px-Indian_relief_from_Amaravati%2C_Guntur._Preserved_in_Guimet_Museum.jpg
