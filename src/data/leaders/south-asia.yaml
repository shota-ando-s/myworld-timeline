  - id: rajendra-i
    title: ラージェンドラ1世
    start: 1014
    end: 1044
    category: war
    tags: [チョーラ朝, 海上遠征]
    summary: ガンジス川とシュリーヴィジャヤに遠征し、南インドの海上帝国を最大にした。
    detail: |
      チョーラ朝の王で、在位は1014年から1044年まで。
      北のガンジス川と東南アジアへ遠征し、南インドの海上帝国を最大にした。

      父の代に築かれた基盤を受け継ぎ、さらに拡張した。
      1020年代、北方への遠征を行った。
      ベンガルを破ってガンジス川に達し、その水を持ち帰って新しい都に運ばせる。
      都にはガンジスを得た者という名が付けられた。
      遠征の目的は領土ではなく、権威の獲得である。

      より重要なのは海上の遠征である。
      1025年、マラッカ海峡を押さえるシュリーヴィジャヤへ艦隊を送った。
      複数の港を攻撃し、王を捕らえたとされる。
      理由は交易路の確保だった。
      中国との交易において、シュリーヴィジャヤが中継を独占していたことへの対抗とみられる。
      インドの王朝が海を越えて大規模な軍事行動を行った、稀な例である。

      宋へも使節を送り、直接の関係を結んだ。
      国内では、寺院の建設と灌漑の整備が続けられた。
      巨大な貯水池が作られ、農業を支える。
      王朝の版図と影響力は、この治世に頂点に達した。
      以後は周辺の勢力の台頭によって縮小していく。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/f/f1/Rajendra_Chola.JPG
      credit: David George / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Rajendra_Chola.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ラージェーンドラ1世

  - id: prithviraj-iii
    title: プリトビーラージ3世
    start: 1178
    end: 1192
    category: war
    tags: [ラージプート, ターラインの戦い]
    summary: 敗北によって北インドにイスラム政権が定着する転機となった王。
    detail: |
      北インドのラージャスターンを拠点とした王で、在位は12世紀の後半。
      ゴール朝との戦いに敗れ、北インドにイスラム政権が定着する転機になった。

      チャーハマーナ朝の王として、デリーとアジメールを支配した。
      若くして即位し、周辺の王国と争って勢力を広げる。
      1191年、第一次タラーインの戦いでゴール朝の軍を破った。
      ムハンマド・ゴーリーは負傷して退却する。

      しかし追撃は行われなかった。
      インドの伝統的な戦争観では、敗走する敵を追い詰めて滅ぼすことは重視されない。
      翌年、ゴーリーは態勢を立て直して再び侵攻した。
      第二次タラーインの戦いでは、騎射を行う軽騎兵で消耗させ、疲れたところへ突撃する戦法がとられる。
      プリトビーラージは敗れて捕らえられ、処刑された。

      この敗北によって、デリーはイスラム勢力の手に渡る。
      数年のうちに北インドの主要部が制圧された。
      後世、この王を主人公とする叙事詩が作られた。
      恋愛と武勇の物語として広まり、ヒンドゥーの英雄として記憶される。
      史実と伝説の区別は難しい。
      王国どうしが連携できなかったことが、敗北の背景にある。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チャーハマーナ朝

  - id: iltutmish
    title: イルトゥトミシュ
    start: 1211
    end: 1236
    category: politics
    tags: [デリー・スルタン朝]
    summary: デリーの政権を軍閥から国家に育て、インドのイスラム支配を定着させた。
    detail: |
      デリー・スルタン朝の第3代の君主で、在位は1211年から1236年まで。
      軍閥の段階にあった政権を国家に育てた。
      インドにおけるイスラム支配を定着させた人物である。

      もとは中央アジアで買われた奴隷で、アイバクに仕えて頭角を現した。
      その娘と結婚し、地方の総督を務める。
      アイバクの死後、後継者を排して権力を握った。
      即位時、政権は不安定だった。
      各地の将軍が自立し、モンゴルが北西から迫っている。

      有力者を一つずつ制圧し、支配を確立した。
      モンゴルに追われたホラズムの王子が助けを求めてきたときは、これを受け入れずに追い返している。
      モンゴルとの直接の衝突を避けるための判断であり、結果としてインドは侵攻を免れた。
      制度の整備も進めた。
      銀貨と銅貨の体系を定め、それが以後のインドの通貨の基礎になる。
      軍人に土地の収入を与える仕組みを整え、行政の組織を作った。
      バグダードのカリフから称号を得て、統治の正統性を確保している。

      デリーには、勝利を記念する尖塔が建てられた。
      現在も残るクトゥブ・ミナールである。
      後継には娘のラズィーヤを指名した。
      女性の君主は反発を招き、短期間で倒される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/Map_of_the_Mamluk_Dynasty.png/500px-Map_of_the_Mamluk_Dynasty.png
