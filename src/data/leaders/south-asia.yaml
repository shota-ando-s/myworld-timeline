  - id: pushyamitra-shunga
    title: プシュヤミトラ
    start: -185
    end: -149
    category: religion
    tags: [シュンガ朝, バラモン教]
    summary: マウリヤ朝を倒し、仏教保護からバラモン教復興へ流れを引き戻した。
    detail: |
      シュンガ朝の創始者で、在位は紀元前2世紀の前半。
      マウリヤ朝の将軍だったが、王を殺して王朝を開いた。
      仏教の保護からバラモン教の復興へ、流れを引き戻したとされる。

      マウリヤ朝は、アショーカの死後に急速に弱体化していた。
      広大な領域を支える財政が続かず、地方が離反する。
      プシュヤミトラは、軍の閲兵の場で最後の王を殺害して政権を奪った。
      領域は北インドの中部に縮小する。
      即位後、大規模な馬の供犠を行ったと伝えられる。
      王の権威を示すヴェーダの儀礼であり、マウリヤ朝の時代には行われていなかった。
      バラモンの祭式が再び国家の中心に据えられたことを意味する。

      仏教の伝承では、僧院を破壊し僧を殺した迫害者として描かれる。
      しかし同じ時期に仏教の建造物が増築されており、実際の政策については議論がある。
      誇張を含むとみる研究者が多い。
      西北からはギリシア系の勢力が侵入し、これと戦った。

      この時代、サンスクリットの文法が体系化され、叙事詩と法典が整えられていく。
      仏教とジャイナ教に対して、バラモンの伝統が自らを組み直す時期にあたる。
      後のヒンドゥー教の枠組みは、この過程で形を得た。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c7/SungaEmpireMap.jpg/500px-SungaEmpireMap.jpg
      credit: コンピュータが読み取れる情報は提供されていませんが、World Imagingだと推定されます（著作権の主張に基づく） / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:SungaEmpireMap.jpg
