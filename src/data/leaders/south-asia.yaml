  - id: muhammad-bin-tughluq
    title: ムハンマド・ビン・トゥグルク
    start: 1325
    end: 1351
    category: politics
    tags: [デリー・スルタン朝]
    summary: 遷都と銅貨の発行という壮大な実験に失敗し、スルタン朝の衰えを早めた。
    detail: |
      デリー・スルタン朝のトゥグルク朝の君主で、在位は1325年から1351年まで。
      壮大な構想を次々に実行しては失敗し、スルタン朝の衰えを早めた。

      学識があり、数学、医学、哲学に通じていたとされる。
      最初の試みが遷都である。
      デカン高原を含む広い領域を統治するため、都を南のダウラターバードへ移した。
      位置としては合理的だが、住民ごと1000キロを移動させる方式がとられ、多数が途上で死亡する。
      数年後に都は戻され、両方の都市が打撃を受けた。

      次が通貨の政策である。
      銀の不足に対応して、銀貨と同じ価値を持つ銅貨を発行した。
      発想としては後の紙幣に近いが、偽造を防ぐ仕組みがなかった。
      各家庭で贋金が作られ、制度は崩壊する。

      中央アジアや中国への遠征も計画され、いずれも大きな損失を出した。
      税の引き上げは、飢饉の時期と重なって農民の反乱を招く。
      各地が次々に自立し、南インドとベンガルが離れていった。
      イブン・バットゥータがこの宮廷に仕え、その様子を記録している。
      寛大さと残虐さが同居する人物として描かれた。
      構想の大きさと実行の失敗が、そのまま王朝の運命に直結した治世である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/00/Painting_depicting_the_court_of_Muhammad_bin_Tughluq.jpg/500px-Painting_depicting_the_court_of_Muhammad_bin_Tughluq.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Painting_depicting_the_court_of_Muhammad_bin_Tughluq.jpg
    links:
