  - id: kanishka
    title: カニシカ王
    start: 127
    startCirca: true
    end: 150
    endCirca: true
    category: religion
    tags: [クシャーナ朝, 大乗仏教]
    summary: 東西交易の要を押さえ、大乗仏教とガンダーラ美術の広がりを後押しした。
    detail: |
      クシャーナ朝の王で、在位は2世紀の前半とされる。
      東西交易の要を押さえ、大乗仏教とガンダーラ美術の広がりを後押しした。

      即位の年代は長く議論されてきた。
      現在は127年ごろとする説が有力である。
      領域は最大に達した。
      中央アジアから北インドのガンジス流域まで支配し、四つの帝国と呼ばれる勢力のうちの一つと数えられる。

      貨幣には、ギリシアの神、イランの神、そして仏が刻まれている。
      特定の宗教を押しつけず、多様な信仰を認める姿勢がうかがえる。
      仏教への保護は厚かった。
      伝承によれば、第4回の結集を招集し、教義の解釈をまとめさせている。
      この時期に、サンスクリットで経典が記されるようになった。

      信仰の形も変化した。
      出家して自ら悟りをめざす道だけでなく、すべての人の救済を願う菩薩の理念が広がる。
      大乗仏教と呼ばれるこの流れが、東アジアへ伝わっていく。
      ガンダーラでは、写実的な技法による仏像が数多く作られた。
      王自身の像も残っており、長い外套と靴を着けた中央アジア風の姿である。
      交易路を通じて、この美術と教義が中国へ伝わった。
      東アジアの仏教は、この王朝を経由して受け取られている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/KanishkaCoin3.JPG/500px-KanishkaCoin3.JPG
      credit: コンピュータが読み取れる情報は提供されていませんが、World Imagingだと推定されます（著作権の主張に基づく） / Public domain
      page: https://commons.wikimedia.org/wiki/File:KanishkaCoin3.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カニシカ1世

  - id: chandragupta-ii
    title: チャンドラグプタ2世
    start: 375
    end: 415
    category: culture
    tags: [グプタ朝, 古典文化]
    summary: サンスクリット文学と数学が花開いた、インド古典文化の黄金期の王。
    detail: |
      グプタ朝の王で、在位は4世紀末から5世紀初めまで。
      インド古典文化の黄金期にあたる治世である。
      武勇の太陽という称号を用いた。

      西方のサカ系の勢力を滅ぼし、アラビア海に面する港を手に入れた。
      これによって西方との海上交易の利益が王朝に入る。
      婚姻によって南方の王朝とも結び、支配を安定させた。
      宮廷には、九つの宝と呼ばれる学者と詩人が集まったと伝えられる。
      そのなかにカーリダーサが数えられる。

      この時期の中国の僧法顕が、インドを訪れて記録を残した。
      道中の治安がよく、旅行の許可も不要で、刑罰が厳しくないと記されている。
      病人と貧者のための施設が都市にあったことも書き留められた。
      外部の観察者による貴重な同時代の記述である。

      学問では、数学と天文学が発展した。
      ゼロを含む記数法が整えられ、円周率や三角比の計算が進む。
      宗教ではヴィシュヌ信仰を篤くしながら、仏教とジャイナ教も保護した。
      デリーに立つ鉄柱は、この時代のものとされる。
      1500年以上ほとんど錆びておらず、当時の冶金の水準を示す。
      武力と文化の双方で頂点に達した治世として、後世に理想化されてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/ChandraguptaIIOnHorse.jpg/500px-ChandraguptaIIOnHorse.jpg
      credit: PHGCOM / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:ChandraguptaIIOnHorse.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チャンドラグプタ2世

  - id: harsha-reign
    title: ハルシャ王
    start: 606
    end: 647
    category: politics
    tags: [北インド]
    summary: グプタ朝崩壊後の北インドを再統一し、玄奘を迎えてその記録に姿を残した。
    detail: |
      ヴァルダナ朝の王で、在位は606年から647年まで。
      グプタ朝の崩壊後の北インドを再統一した。
      玄奘を迎え、その記録に姿を残している。

      兄が暗殺された後、16歳で即位した。
      復讐と統一を掲げて軍を起こし、数年のうちに北インドの大半を制圧する。
      統治の方法は独特である。
      定まった都に留まらず、宮廷を率いて領内を巡り続けた。
      服属した王をそのまま残し、直接の監督によって統制する。

      宗教には寛容だった。
      自らはヒンドゥーの神を信仰しながら、仏教を厚く保護する。
      大規模な法会を開き、各宗派の学僧を集めて論議させた。
      5年ごとの施しの会では、蓄えた財のすべてを分け与え、最後は自らの衣まで施したと伝えられる。

      文人としても知られ、戯曲が伝わっている。
      玄奘はこの宮廷に滞在した。
      その記録には、道路の治安、税の軽さ、刑罰の穏やかさ、都市の施設が記されている。
      南方への遠征は、デカンの王朝に阻まれて失敗した。
      647年、子を残さずに没する。
      王朝は直ちに崩壊し、北インドは分裂へ戻った。
      古代インドで最後の大きな統一王朝とされる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Harshavardhana_Circa_AD_606-647.jpg/500px-Harshavardhana_Circa_AD_606-647.jpg
      credit: CNG Coins / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Harshavardhana_Circa_AD_606-647.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ハルシャ・ヴァルダナ

  - id: dharmapala
    title: ダルマパーラ
    start: 770
    startCirca: true
    end: 810
    endCirca: true
    category: religion
    tags: [パーラ朝, 仏教]
    summary: ナーランダーなどの仏教僧院を支え、インド仏教最後の繁栄を作った。
    detail: |
      パーラ朝の王で、在位は8世紀の後半から9世紀の初めまで。
      仏教の僧院を支え、インド仏教の最後の繁栄を作った。

      パーラ朝は、現在のベンガルとビハールを中心に4世紀にわたって続いた王朝である。
      混乱のなかで有力者に選ばれて成立したと伝えられる。
      ダルマパーラの時代、北インドの覇権をめぐって三つの王朝が争った。
      北西と南西の勢力と戦い、一時はカナウジを押さえて影響力を広げる。

      仏教への保護が、この王朝の特徴である。
      ナーランダーの僧院を支援し、ヴィクラマシーラという新たな大僧院を創建した。
      数千人が学ぶ施設で、密教の教学が体系化される。
      この時期の仏教は、密教としての性格を強めていた。
      儀礼と呪文、曼荼羅を用いる実践が発達する。

      チベットへの影響が大きい。
      この僧院から学僧が招かれ、チベット仏教の基礎が作られた。
      後にアティーシャがチベットへ渡り、教学を整えている。
      インド本土では、ヒンドゥー教の信仰が広がり、仏教の社会的な基盤は縮んでいった。
      12世紀末の侵攻によって僧院が破壊されると、インドの仏教はほぼ途絶える。
      その最後の拠点を支えたのが、この王朝だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Indian_Kanauj_triangle_map.svg/500px-Indian_Kanauj_triangle_map.svg.png
      credit: w:user:Planemad / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Indian_Kanauj_triangle_map.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/パーラ朝

  - id: rajaraja-i
    title: ラージャラージャ1世
    start: 985
    end: 1014
    category: war
    tags: [チョーラ朝, 海上帝国]
    summary: 海軍でスリランカと東南アジアに遠征し、インド洋交易圏に南インドを刻んだ。
    detail: |
      チョーラ朝の王で、在位は985年から1014年まで。
      海軍を用いた遠征によって、南インドをインド洋の交易圏に刻んだ。

      即位したとき、王朝は周辺の勢力に押されていた。
      まず陸上の敵を破り、南インドの大半を支配下に置いた。
      続いてスリランカへ侵攻し、北部を併合する。
      モルディブも支配下に入れた。
      海軍の強化が方針の中心である。
      交易路を押さえることが富の源泉だと理解していた。

      行政の整備も進めた。
      領域を単位に分け、土地を測量して税を定める。
      村の自治の仕組みが機能し、その記録が寺院の壁に碑文として刻まれた。
      何を決め、誰が担当し、いくら支出したかまで記されている。

      最大の事業が、タンジャーヴールの寺院である。
      花崗岩を積み上げた60メートルを超える塔を持ち、当時の世界でも屈指の規模だった。
      壁面には、寄進の内容と寺院で働く人々の名が刻まれている。
      宗教ではシヴァ信仰を篤くしながら、仏教の寺院にも寄進を行った。
      王朝の最盛期は、次の代の王がガンジス川と東南アジアへ遠征することで完成する。
      その基盤を作ったのがこの治世である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/4d/Rajaraja_mural_%28cropped%29.jpg
      credit: オリジナルのアップロード者は英語版ウィキペディアのVenu62さん / Public domain
      page: https://commons.wikimedia.org/wiki/File:Rajaraja_mural_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ラージャラージャ1世

  - id: mahmud-of-ghazni
    title: マフムード
    start: 998
    end: 1030
    category: war
    tags: [ガズナ朝, 侵入]
    summary: 十数度の北インド侵入でイスラム勢力の進出路を開いた。
    detail: |
      ガズナ朝の君主で、在位は998年から1030年まで。
      十数度にわたって北インドへ侵入し、イスラム勢力の進出路を開いた。

      現在のアフガニスタンのガズニーを本拠とし、中央アジアとイランにも領域を広げた。
      インドへの遠征は17回に及んだとされる。
      目的は領土の獲得ではなく、富の獲得である。
      毎年のように乾季に軍を進め、寺院の財宝を奪って引き上げた。
      特に知られるのが、1025年のソムナートの寺院への攻撃である。
      膨大な金銀と宝石が持ち去られ、神像は破壊された。
      この出来事は、後のインドで繰り返し語られることになる。

      得た富は、本拠のガズニーの整備に充てられた。
      モスクと図書館が建てられ、学者と詩人が集められる。
      ペルシア語の大叙事詩を著したフィルドゥスィーも、一時この宮廷に仕えた。
      学者ビールーニーは遠征に同行し、インドの宗教と学問についての詳細な著作を残している。

      遠征は略奪が中心で、恒久的な支配は北西部に限られた。
      それでも、北インドの政治的な弱さが明らかになる。
      1世紀半後、ゴール朝が同じ経路をたどり、今度は支配を確立した。
      インドにおけるイスラム政権の時代は、ここから始まる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/%D0%A4%D0%B8%D1%80%D0%B4%D1%83%D1%81%D0%B8_%D1%87%D0%B8%D1%82%D0%B0%D0%B5%D1%82_%D0%BF%D0%BE%D1%8D%D0%BC%D1%83_%C2%AB%D0%A8%D0%B0%D1%85-%D0%9D%D0%B0%D0%BC%D0%B5%C2%BB_%D1%88%D0%B0%D1%85%D1%83_%D0%9C%D0%B0%D1%85%D0%BC%D1%83%D0%B4%D1%83_%D0%93%D0%B0%D0%B7%D0%BD%D0%B5%D0%B2%D0%B8_%281913%29.jpg/500px-%D0%A4%D0%B8%D1%80%D0%B4%D1%83%D1%81%D0%B8_%D1%87%D0%B8%D1%82%D0%B0%D0%B5%D1%82_%D0%BF%D0%BE%D1%8D%D0%BC%D1%83_%C2%AB%D0%A8%D0%B0%D1%85-%D0%9D%D0%B0%D0%BC%D0%B5%C2%BB_%D1%88%D0%B0%D1%85%D1%83_%D0%9C%D0%B0%D1%85%D0%BC%D1%83%D0%B4%D1%83_%D0%93%D0%B0%D0%B7%D0%BD%D0%B5%D0%B2%D0%B8_%281913%29.jpg
