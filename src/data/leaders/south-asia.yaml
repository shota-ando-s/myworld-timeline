        url: https://ja.wikipedia.org/wiki/ヴィジャヤナガル王国

  - id: babur
    title: バーブル
    start: 1526
    end: 1530
    category: war
    tags: [ムガル帝国]
    summary: 中央アジアから来て火器でデリーを制し、ムガル帝国を開いた。
    detail: |
      ムガル帝国の創始者で、在位は1526年から1530年まで。
      中央アジアから来て、火器を用いてデリーの政権を破った。

      父方はティムール、母方はチンギス・ハンの血を引くと称した。
      12歳で小国の君主となったが、中央アジアの争いのなかで本拠を失う。
      サマルカンドを三度得て三度失った。
      アフガニスタンのカブールを拠点に定め、そこから南のインドへ目を向けた。

      1526年、パーニーパットでデリーのスルタンの軍と戦った。
      兵力では大きく劣っていたが、大砲と火縄銃を運用し、荷車を並べた陣地を築く。
      火器の音に象が驚いて自軍を踏み荒らしたことも、勝敗を分けた。
      翌年にはラージプートの連合軍も破り、北インドの支配を確立する。

      自伝を残した。
      中央アジアのトルコ語で書かれたこの回想録は、率直な記述で知られる。
      戦いの経緯だけでなく、インドの気候と植物への不満、故郷への郷愁、音楽や詩の評価まで書かれている。
      近代以前の君主の自伝としては例外的な文献である。
      即位からわずか4年で没した。
      病の子のために自らの命を差し出すと祈り、その直後に病を得たという伝承がある。
      庭園を愛し、遺言によってカブールに葬られた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/Idealized_portrait_of_Babur_%281483-1530%29_in_Persian_style%2C_painted_circa_1605-1615_in_India_%28British_Museum_1921%2C1011%2C0.3%29.jpg/500px-Idealized_portrait_of_Babur_%281483-1530%29_in_Persian_style%2C_painted_circa_1605-1615_in_India_%28British_Museum_1921%2C1011%2C0.3%29.jpg
