        url: https://ja.wikipedia.org/wiki/奴隷王朝

  - id: alauddin-khalji
    title: アラーウッディーン・ハルジー
    start: 1296
    end: 1316
    category: economy
    tags: [デリー・スルタン朝, 物価統制]
    summary: 価格統制と徴税の強化で大軍を養い、モンゴルの侵入を退けた。
    detail: |
      デリー・スルタン朝のハルジー朝の君主で、在位は1296年から1316年まで。
      価格の統制と徴税の強化によって大軍を養い、モンゴルの侵入を退けた。

      叔父にあたる前任者を殺して即位した。
      最大の課題はモンゴルである。
      在位中に数度の大規模な侵入があり、デリーが包囲されたこともある。
      いずれも撃退し、その後の襲撃も防いだ。
      これを可能にしたのが、常備の大軍である。
      兵の登録と馬の焼印によって不正を防ぎ、給与を現金で支払った。

      その財源を作るため、徹底した経済政策がとられた。
      土地の収穫の半分を税として徴収し、仲介する地方の有力者の特権を廃す。
      市場では、穀物、布、馬、奴隷の価格が品目ごとに定められた。
      違反には厳しい罰が科され、監督の官が置かれる。
      給与が固定されていても兵が生活できるようにするための統制である。

      遠征では、デカン高原を越えて南インドの王国から莫大な財宝を得た。
      インドの大半に影響を及ぼした最初のデリーの政権である。
      統治は苛烈で、密告と監視が用いられた。
      酒の販売や貴族の集会も制限される。
      死後まもなく王朝は崩壊した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Portrait_of_Sultan_%27Ala-ud-Din%2C_Padshah_of_Delhi.jpg/500px-Portrait_of_Sultan_%27Ala-ud-Din%2C_Padshah_of_Delhi.jpg
