  - id: abd-al-malik
    title: アブドゥルマリク
    start: 685
    end: 705
    category: society
    tags: [ウマイヤ朝, アラビア語]
    summary: 行政の言語をアラビア語に統一し、独自の貨幣を作って帝国の一体感を作った。
    detail: |
      ウマイヤ朝の第5代カリフで、在位は685年から705年まで。
      二度目の内乱を平定し、帝国の制度を整えた。
      イスラム国家が、征服者の連合から一つの統治体へ変わる節目にあたる。

      即位したとき、帝国は分裂状態にあった。
      メッカでは対立するカリフが立ち、イラクは離反し、ビザンツとも戦っている。
      10年近くをかけて各地を平定し、統一を回復した。
      最も重要な改革は、行政の言語をアラビア語に統一したことである。
      それまで、シリアではギリシア語、イラクではペルシア語で帳簿がつけられていた。
      官僚は現地のキリスト教徒やゾロアスター教徒が担っている。
      アラビア語に切り替えたことで、帝国全体で共通の行政が動くようになった。

      貨幣も改めた。
      ビザンツやササン朝の貨幣を模したものをやめ、人物の像を用いない独自の金貨と銀貨を発行する。
      刻まれたのは信仰告白の文言だけで、イスラム国家の貨幣という性格が明確になった。
      駅伝の制度も整えられ、各地の情報が速く届くようになる。

      691年にはエルサレムに岩のドームを建てた。
      現存する最古のイスラム建築で、ユダヤ教とキリスト教の聖地にイスラムの存在を示す意味を持つ。
      言語・貨幣・建築という三つの面で、帝国の一体感を可視化した治世だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/First_Umayyad_gold_dinar%2C_Caliph_Abd_al-Malik%2C_695_CE.jpg/500px-First_Umayyad_gold_dinar%2C_Caliph_Abd_al-Malik%2C_695_CE.jpg
      credit: PHGCOM / Public domain
      page: https://commons.wikimedia.org/wiki/File:First_Umayyad_gold_dinar,_Caliph_Abd_al-Malik,_695_CE.jpg
    links:
