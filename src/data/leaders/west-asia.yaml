  - id: ismail-i
    title: イスマーイール1世
    start: 1501
    end: 1524
    category: religion
    tags: [サファヴィー朝, シーア派]
    summary: シーア派を国教と定め、今日までのイラン独自の宗教的な立ち位置を作った。
    detail: |
      サファヴィー朝の創始者で、在位は1501年から1524年まで。
      14歳でタブリーズに入り、王を意味するシャーを名乗った。
      シーア派を国教と定め、今日まで続くイランの立ち位置を作った。

      家系は、アルダビールを拠点とする神秘主義教団の指導者だった。
      教団は次第にシーア派の色を強め、信者はトルコ系の遊牧部族から集まる。
      彼らは指導者を神聖な存在として崇め、命を惜しまず戦った。

      即位すると、イラン全土の征服に乗り出した。
      10年ほどで高原の大部分を支配下に置く。
      同時に、シーア派の十二イマーム派を国教と宣言した。
      当時のイランはスンナ派が多数だったため、強い圧力をもって改宗が進められる。
      アラブ地域からシーア派の学者を招き、教義と法の体系を整えさせた。

      西のオスマン帝国は、この動きを自国内のシーア派を刺激するものとして警戒した。
      1514年、チャルディラーンで両軍が激突する。
      鉄砲と大砲を備えたオスマン軍に対し、騎兵中心のサファヴィー軍は大敗した。
      イスマーイールは神聖な指導者としての威信を失い、以後は政務から遠ざかったと伝えられる。
      敗北によって東アナトリアは失われ、両国の国境がおおむね定まった。
      宗派の違いが国家の対立と重なる構図は、以後の西アジアに長く残る。
      トルコ語の詩人としても知られ、その作品はアゼルバイジャン文学の古典になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f8/Portrait_of_Shah_Ismail_I._Inscribed_%22Ismael_Sophy_Rex_Pers%22._Painted_by_Cristofano_dell%27Altissimo%2C_dated_1552-1568.jpg/500px-Portrait_of_Shah_Ismail_I._Inscribed_%22Ismael_Sophy_Rex_Pers%22._Painted_by_Cristofano_dell%27Altissimo%2C_dated_1552-1568.jpg
