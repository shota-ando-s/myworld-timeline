  - id: ur-nammu
    title: ウル・ナンム
    start: -2112
    startCirca: true
    end: -2095
    endCirca: true
    category: society
    tags: [シュメール, 法]
    summary: 現存最古級の法典を発布し、シュメール文明の最後の輝きを作った。
    detail: |
      ウル第3王朝を開いた王で、在位は紀元前2112年ごろから2095年ごろまで。
      アッカド帝国が崩れた後のメソポタミアを再統一した。
      現存する最古級の法典を発布したことで知られる。

      アッカドの滅亡後、メソポタミアは山地から来たグティ人の影響下にあった。
      ウルクの王がこれを追い払い、その配下だったウル・ナンムがウルで自立する。
      やがてシュメールとアッカドの王を名乗り、南部全域を支配下に置いた。

      統治では、荒れていた基盤の再建が中心になった。
      運河を掘り直して灌漑を回復し、交易路の安全を確保する。
      度量衡を統一し、各都市に総督を置いて中央から管理した。
      行政の記録は膨大で、ウル第3王朝の粘土板は数万点が残っている。
      家畜1頭の出入りまで記録する徹底した官僚制が敷かれていた。

      建築でも名を残した。
      ウルに建てた巨大なジッグラトは、いまもイラク南部に姿をとどめている。
      主要な都市の神殿を修復し、王が神々の世話をする存在であることを示した。
      法典は、王が正義を確立したことを宣言する序文と、具体的な条文からなる。
      傷害に対して銀で賠償させる規定が並び、後の同害報復の原則とは異なっている。
      ウル・ナンムは戦いで没したと伝えられ、その死を嘆く哀歌が残された。
      この王朝はおよそ100年でエラムの攻撃によって滅び、シュメール人の政権は歴史から姿を消す。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/A_brick_stamped_with_the_name_of_Ur-Nammu_of_Ur.JPG/500px-A_brick_stamped_with_the_name_of_Ur-Nammu_of_Ur.JPG
