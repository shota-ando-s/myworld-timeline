  - id: khamenei
    title: ハメネイ
    start: 1989
    ongoing: true
    category: religion
    tags: [イラン, 最高指導者]
    summary: 選挙で選ばれる大統領の上に立つ最高指導者として、30年以上体制を保っている。
    detail: |
      イラン・イスラム共和国の第2代最高指導者で、1989年から現在までその地位にある。
      1939年に生まれ、革命前から活動していた宗教指導者である。
      選挙で選ばれる大統領の上に立つ立場として、長く体制を保ってきた。

      革命前はホメイニの弟子として活動し、逮捕と流刑を経験した。
      革命後は要職を歴任し、1981年から8年間は大統領を務める。
      この時期はイラクとの戦争の最中だった。
      1989年、ホメイニの死去にあたり、専門家会議によって最高指導者に選出された。
      法学者としての位階が十分ではないという指摘もあったが、政治的な調整能力が重視されたとされる。

      最高指導者の権限は広い。
      軍と革命防衛隊の最高司令官であり、司法の長と国営放送の責任者を任命する。
      大統領や議員の立候補資格を審査する機関にも、その影響が及ぶ。
      選挙は実施されるが、候補者の段階で選別される仕組みである。

      在任中、核開発をめぐって欧米との対立が続いた。
      制裁で経済は圧迫され、2009年の大統領選挙後や2022年には大規模な抗議運動が起きている。
      いずれも治安部隊によって抑え込まれた。
      地域では、レバノンやイラク、イエメンの勢力を支援して影響力を広げてきた。
      宗教的な権威と国家の権力が一人に集まる体制が、30年以上にわたり維持されている。
