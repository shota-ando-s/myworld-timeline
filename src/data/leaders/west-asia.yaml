        url: https://ja.wikipedia.org/wiki/ナーディル・シャー

  - id: mahmud-ii
    title: マフムト2世
    start: 1808
    end: 1839
    category: society
    tags: [オスマン帝国, 近代化]
    summary: 旧来の常備軍を解体し、西欧式の軍と官僚制への改革に踏み切った。
    detail: |
      オスマン帝国の第30代スルタンで、在位は1808年から1839年まで。
      旧来の常備軍を武力で解体し、西欧式の軍と官僚制への改革に踏み切った。
      近代化の出発点を作った君主である。

      即位したころ、帝国は各地で統制を失っていた。
      バルカンやアナトリアの地方有力者が半ば独立し、セルビアとギリシアでは独立運動が起きる。
      エジプトの総督ムハンマド・アリーは、独自に西欧式の軍を作って実力を蓄えていた。
      改革の最大の障害は、イェニチェリだった。
      本来は精鋭の歩兵軍団だったが、この時期には特権集団と化し、改革のたびに反乱を起こしている。
      1826年、マフムト2世は新式部隊を用意したうえで挑発し、蜂起したイェニチェリを砲撃して壊滅させた。
      この出来事は、吉事件と呼ばれる。

      以後、改革は一気に進んだ。
      西欧式の軍が編成され、士官学校と医学校が設けられる。
      省庁が置かれて官僚制が整えられ、郵便と新聞も導入された。
      服装も改められ、官吏にはターバンに代わって帽子が採用される。

      それでも外交では後退が続いた。
      ギリシアの独立を認めさせられ、エジプトのムハンマド・アリーには二度敗れている。
      死の直前、エジプト軍に大敗した報せを聞くことなく没した。
      改革の枠組みは、次の世代のタンジマートに引き継がれる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/MahmutII.jpg/500px-MahmutII.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:MahmutII.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マフムト2世

  - id: abdulhamid-ii
    title: アブデュルハミト2世
    start: 1876
    end: 1909
    category: politics
    tags: [オスマン帝国, 専制]
    summary: 憲法を停止して専制を敷く一方、鉄道と電信で帝国をつなぎ直した。
    detail: |
      オスマン帝国の第34代スルタンで、在位は1876年から1909年まで。
      憲法を停止して30年にわたる専制を敷いた。
      同時に、鉄道と電信で帝国をつなぎ直した君主でもある。

      即位は、改革派が前任者を廃した政変によるものだった。
      就任の条件として憲法を発布し、議会も開かれる。
      しかしロシアとの戦争で大敗すると、それを口実に1878年に議会を閉じ、憲法を停止した。
      以後の統治は、秘密警察と検閲に支えられた。
      新聞は厳しく統制され、密告が奨励される。
      宮殿にこもって各地の報告に目を通し、人事を自ら握った。

      一方で、実務的な近代化は進められた。
      電信網が帝国の隅々まで張り巡らされ、命令と情報が速く伝わるようになる。
      バグダードやヒジャーズへ向かう鉄道が計画され、メディナまでの路線が開通した。
      学校が各地に設けられ、官僚と軍人が育てられる。

      外交では、自らをイスラム世界の盟主と位置づけるパン・イスラム主義を掲げた。
      植民地支配下のムスリムに影響力を及ぼし、列強を牽制する狙いである。
      アルメニア人に対する大規模な殺害が起き、国際的な非難を浴びた。
      1908年の青年トルコ革命で憲法の復活を迫られ、翌年の反動的な事件の後に廃位される。
      専制と近代化が同時に進むという構図を、最も明確に示した治世だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c2/Portrait_of_Abdul_Hamid_II_of_the_Ottoman_Empire.jpg/500px-Portrait_of_Abdul_Hamid_II_of_the_Ottoman_Empire.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Portrait_of_Abdul_Hamid_II_of_the_Ottoman_Empire.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アブデュルハミト2世

  - id: ataturk
    title: ムスタファ・ケマル
    start: 1923
    end: 1938
    category: society
    tags: [トルコ, 世俗化]
    summary: カリフ制を廃して政教分離と文字改革を断行し、共和国トルコを作り替えた。
    detail: |
      トルコ共和国の初代大統領で、1923年から1938年まで在職した。
      1881年に生まれ、オスマン帝国の軍人として頭角を現す。
      共和国を建て、政教分離と文字改革を断行した。

      第一次世界大戦のガリポリの戦いで、連合軍の上陸を阻んで名を上げた。
      敗戦後、オスマン政府が過酷な講和条約を受け入れると、アナトリアで抵抗運動を組織する。
      アンカラに大国民議会を開き、ギリシア軍を撃退して1922年に独立戦争に勝利した。
      翌年のローザンヌ条約で、現在のトルコの領域が国際的に承認される。
      1923年に共和国を宣言し、初代大統領に就いた。
      翌1924年にはカリフ制を廃止する。
      イスラム世界の宗教的権威の中心が、ここで公式に消えた。

      改革は生活の細部にまで及んだ。
      宗教裁判所と宗教学校を廃し、スイスとイタリアの法典を範とする民法と刑法を導入する。
      トルコ帽の着用を禁じ、洋装を勧めた。
      1928年にはアラビア文字を廃してラテン文字を採用し、識字率の向上を図る。
      女性に選挙権が与えられ、一夫多妻が禁じられた。

      1934年には全国民に姓を名乗らせ、自らはトルコ人の父を意味するアタテュルクの姓を議会から贈られる。
      上からの徹底した世俗化は、宗教勢力の反発を残した。
      国家の枠組みを短期間で作り替えた例として、各国の指導者に参照されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/Ataturk1930s.jpg/500px-Ataturk1930s.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ataturk1930s.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ムスタファ・ケマル・アタテュルク

  - id: reza-shah
    title: レザー・シャー
    start: 1925
    end: 1941
    category: politics
    tags: [イラン, 近代化]
    summary: 軍人から王朝を起こし、上からの近代化と中央集権を進めた。
    detail: |
      パフラヴィー朝の初代の王で、在位は1925年から1941年まで。
      コサック旅団の軍人から身を起こし、王朝を開いた。
      上からの近代化と中央集権を進めた人物である。

      1921年、混乱するテヘランでクーデタを起こして実権を握った。
      陸軍大臣、次いで首相となり、各地の分離勢力と部族を武力で制圧する。
      1925年、議会の決議でガージャール朝を廃し、自ら王位に就いた。
      近代化は、トルコのアタテュルクを強く意識したものだった。
      徴兵制による国軍を整備し、部族を定住させて武装解除する。
      イラン縦貫鉄道を自国の税収で建設し、道路網も整えた。
      世俗の裁判所と学校を設け、テヘラン大学を創設する。

      宗教の影響力は抑え込まれた。
      宗教学校と宗教裁判所の権限が削られ、ヴェールの着用が禁止される。
      服装を西洋式に改める法も出された。
      こうした強制は、宗教指導者と保守的な層の強い反発を招く。

      1935年、国の呼称を対外的にもイランへ統一するよう各国に要請した。
      古代のアーリア人の伝統を強調し、イスラム以前のペルシアを国家の物語の中心に据える。
      第二次世界大戦ではドイツとの関係を疑われ、1941年に英ソ軍が進駐して退位させられた。
      南アフリカへ送られ、そこで没する。
      軍事力による統一と上からの改革という手法は、20世紀の各地で繰り返された型でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/65/Reza_shah_uniform.jpg/500px-Reza_shah_uniform.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Reza_shah_uniform.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/レザー・パフラヴィー

  - id: ibn-saud
    title: イブン・サウード
    start: 1932
    end: 1953
    category: politics
    tags: [サウジアラビア, 石油]
    summary: 半島を統一してサウジアラビアを建て、直後の油田発見が世界の力学を変えた。
    detail: |
      サウジアラビア王国を建てた君主で、在位は1932年から1953年まで。
      半島各地の部族をまとめ、現在の国家の形を作った。
      建国の直後に発見された石油が、その後の世界の力学を変える。

      一族はかつて中央アジアの内陸部を支配したが、19世紀に敗れてクウェートに亡命していた。
      1902年、わずかな手勢でリヤドを奇襲して奪回する。
      そこから30年をかけて、半島の大半を征服した。
      力の源は、宗教と部族の結合にあった。
      厳格な信仰の刷新を説くワッハーブ派の教えを掲げ、遊牧民を定住させて信仰の共同体を作る。
      そこから組織された戦士団が、征服の主力になった。
      後にこの集団が統制を外れると、国王自身がこれを鎮圧している。

      1925年にはメッカとメディナを含むヒジャーズ地方を制圧した。
      聖地の管理者となったことで、イスラム世界での地位が定まる。
      1932年、国号をサウジアラビア王国と定めた。

      建国当初の財政は、巡礼者からの収入に頼るほど乏しかった。
      1938年に東部で大規模な油田が見つかり、状況は一変する。
      採掘の権利はアメリカの企業が得て、以後の米国との関係の基礎になった。
      1945年には、帰国途上のルーズベルト大統領と艦上で会談している。
      石油の供給と安全保障を交換するこの関係は、現在まで続く枠組みになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/Official_Portrait_of_King_Abdulaziz.jpg/500px-Official_Portrait_of_King_Abdulaziz.jpg
      credit: Saudi Press Agency / Public domain
      page: https://commons.wikimedia.org/wiki/File:Official_Portrait_of_King_Abdulaziz.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アブドゥルアズィーズ・イブン・サウード

  - id: mossadegh
    title: モサデグ
    start: 1951
    end: 1953
    category: economy
    tags: [イラン, 石油国有化]
    summary: 石油を国有化して英米のクーデタで倒され、資源をめぐる南北の対立を象徴した。
    detail: |
      イランの首相で、在任は1951年から1953年まで。
      石油の国有化を実行し、英米が関与したクーデタで倒された。
      資源をめぐる南北の対立を象徴する人物になった。

      法学を学んだ名家の出身で、議会で長く活動してきた。
      外国の利権への批判で支持を集め、1951年に首相に就任する。
      当時、イランの石油はイギリス系の会社が独占していた。
      利益の配分は会社に極端に有利で、帳簿もイラン側に開示されない。
      近隣国が折半の条件を得ていたこととの差も不満を高めていた。

      議会は石油産業の国有化を決議し、モサデグはこれを実行した。
      イギリスは技術者を引き揚げ、精油所は止まり、国際的な不買と資産の凍結でイランの石油は売れなくなる。
      財政は急速に悪化し、国内の政治対立も深まった。
      1953年8月、米英の情報機関が関与した作戦によって政権は倒された。
      国王は一度国外へ逃れたが、まもなく帰国して権力を回復する。
      モサデグは裁判にかけられ、以後は自宅で軟禁されたまま生涯を終えた。

      この介入は長く公式には否定され、21世紀に入ってアメリカ政府が関与を認めた。
      イランでは、外国が民主的な政権を倒した事例として記憶されている。
      1979年の革命における反米感情の背景にも、この出来事がある。
      資源を持つ国がそれを自ら管理しようとするときに何が起きるかを示した例でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Dr_Mohammad_Mosaddeq.jpg/500px-Dr_Mohammad_Mosaddeq.jpg
      credit: International News Photos / Public domain
      page: https://commons.wikimedia.org/wiki/File:Dr_Mohammad_Mosaddeq.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モハンマド・モサッデク

  - id: khomeini
    title: ホメイニ
    start: 1979
    end: 1989
    category: religion
    tags: [イラン, イスラム革命]
    summary: 法学者が国家を統べる体制を作り、政治的イスラムの力を世界に見せつけた。
    detail: |
      イラン革命を指導し、イスラム共和国の最高指導者を務めた宗教指導者。
      1902年ごろに生まれ、1989年に没した。
      法学者が国家を統べるという体制を実際に作った人物である。

      シーア派の神学都市コムで学び、教授として教えた。
      1960年代、国王の進める改革と親米路線を公然と批判して逮捕される。
      国外追放となり、トルコ、イラク、最後はパリで亡命生活を送った。
      亡命中に、法学者の統治という理論を体系化した。
      預言者の後継者が不在の時代には、イスラム法に通じた法学者が政治を監督すべきだという考え方である。
      伝統的なシーア派の立場では、法学者は政治に直接関与しないとされてきた。
      これを覆す主張だった。

      説教を録音したカセットテープがイラン国内に持ち込まれ、広く出回る。
      1979年、革命によって国王が出国すると帰国し、熱狂的に迎えられた。
      国民投票を経てイスラム共和国が成立し、憲法に最高指導者の地位が定められる。

      革命の直後、学生が米大使館を占拠して人質事件が起きた。
      イラクとの8年の戦争を戦い抜き、反対派を厳しく弾圧している。
      1989年には、小説家への死刑を宣告する布告を出して国際的な問題になった。
      宗教が国家の制度そのものを規定するという体制は、中東の政治に大きな衝撃を与えた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Ruhollah_Khomeini_by_Jamaran_1.jpg/500px-Ruhollah_Khomeini_by_Jamaran_1.jpg
      credit: Different / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ruhollah_Khomeini_by_Jamaran_1.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ルーホッラー・ホメイニー

  - id: saddam-hussein
    title: サダム・フセイン
    start: 1979
    end: 2003
    category: war
    tags: [イラク, 独裁]
    summary: イラン・クウェートへの戦争を重ね、最後は米軍の侵攻で倒された。
    detail: |
      イラクの大統領で、1979年から2003年まで政権を握った。
      1937年に生まれ、2006年に処刑された。
      二つの大きな戦争を始め、最後は米軍の侵攻によって倒された。

      若くしてバース党に加わり、クーデタを経て実権に近づいた。
      副大統領として治安と石油政策を握り、1979年に大統領に就任する。
      就任直後から党内の粛清を行い、個人崇拝の体制を築いた。
      1980年、隣国イランへ侵攻した。
      革命の混乱に乗じて国境の係争地を奪う狙いがあったが、戦争は8年に及ぶ消耗戦になる。
      化学兵器が使用され、国内のクルド人の村にも用いられた。

      戦後、巨額の債務を抱えたまま、1990年にクウェートへ侵攻する。
      国連の決議を経て多国籍軍が編成され、翌年の湾岸戦争で敗北した。
      以後、経済制裁と飛行禁止区域のもとで統治を続ける。
      国内の蜂起は武力で鎮圧された。

      2003年、大量破壊兵器を保有しているとして米英が侵攻し、政権は崩壊した。
      本人は潜伏先で拘束され、裁判の末に処刑される。
      大量破壊兵器は発見されなかった。
      強権によって宗派と民族の対立を抑えていた体制が消えたことで、イラクは長い混乱に入った。
      地域の力関係も変わり、イランの影響力が相対的に強まっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Saddam_Hussein_in_1998.png/500px-Saddam_Hussein_in_1998.png
      credit: Iraqi News Agency / Public domain
      page: https://commons.wikimedia.org/wiki/File:Saddam_Hussein_in_1998.png
