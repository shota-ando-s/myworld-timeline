  - id: hammurabi
    title: ハンムラビ王
    start: -1792
    end: -1750
    category: society
    tags: [バビロニア, 法]
    summary: メソポタミアを再統一し、石柱に刻んだ法で統治の基準を公示した。
    detail: |
      バビロン第1王朝の第6代の王で、在位は紀元前1792年から1750年まで。
      分裂していたメソポタミアを再統一した。
      石柱に刻ませた法典によって、その名が今日まで知られている。

      即位したとき、バビロンは小国の一つにすぎなかった。
      周囲にはラルサ・マリ・エシュヌンナ・アッシリアといった同規模の王国が並んでいる。
      ハンムラビは最初の30年ほど、城壁と運河の整備に力を注ぎ、力を蓄えた。
      同盟を結んでは相手を替えるという外交で、有力な敵を一つずつ孤立させていく。

      在位の後半、征服が一気に進んだ。
      エラムを退け、南のラルサを併合し、上流のマリを滅ぼした。
      これによってペルシア湾からユーフラテス中流までが一つの王のもとに入る。
      統治の実務にも深く関わった。
      地方の役人に宛てた書簡が数多く残り、運河の掘削、税の徴収、裁判の処理を細かく指示している。
      王が国家の細部まで目を配るという統治の姿が、そこから読み取れる。

      晩年に発布した法典は、自らを正義の王として示すものだった。
      序文で神々から法を委ねられたと述べ、282の条文を並べている。
      弱い者が強い者に虐げられないようにするという理念が掲げられた。
      死後まもなく王国は衰えたが、法典の石柱は数百年後まで運ばれて保存されている。
      統治の基準を公示するという発想は、後の西アジアの王たちに受け継がれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/Milkau_Oberer_Teil_der_Stele_mit_dem_Text_von_Hammurapis_Gesetzescode_369-2.jpg/500px-Milkau_Oberer_Teil_der_Stele_mit_dem_Text_von_Hammurapis_Gesetzescode_369-2.jpg
      credit: Luestling / Public domain
      page: https://commons.wikimedia.org/wiki/File:Milkau_Oberer_Teil_der_Stele_mit_dem_Text_von_Hammurapis_Gesetzescode_369-2.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ハンムラビ

  - id: suppiluliuma-i
    title: シュッピルリウマ1世
    start: -1350
    startCirca: true
    end: -1322
    endCirca: true
    category: war
    tags: [ヒッタイト]
    summary: ヒッタイトをオリエントの大国に押し上げ、エジプトと勢力を二分した。
    detail: |
      ヒッタイトをオリエントの大国に押し上げた王で、在位は紀元前14世紀の半ば。
      内乱で弱っていた王国を立て直し、シリアの支配権を確立した。
      エジプトと並ぶ勢力として、当時の国際関係の中心にいた。

      即位の前後に、王国は周辺からの侵入で領土を大きく失っていた。
      シュッピルリウマはまず本拠のアナトリアを固め、都の城壁を築き直す。
      その上で、長年の宿敵であったミタンニへ遠征した。

      ミタンニをユーフラテスの東で破り、属国として自らの影響下に置く。
      続いてシリアの諸都市を次々に服属させ、アレッポとカルケミシュには息子を王として配した。
      エジプトの勢力圏と直接に境を接することになり、両国の緊張が高まる。
      この時期のエジプトは、宗教改革の混乱で対外的な行動が鈍っていた。
      アマルナから出土した書簡には、シリアの小国がエジプトに助けを求める訴えが数多く残る。

      エジプトの王が亡くなったとき、その王妃から驚くべき書簡が届いた。
      息子の一人を送ってほしい、その者を夫とし王にするという申し出である。
      シュッピルリウマは疑いながらも王子を送ったが、王子は途中で殺された。
      これをきっかけに両国は対立し、捕虜が持ち込んだ疫病がヒッタイトで大流行する。
      王自身もその疫病で没したと伝えられる。
      築いた領域は息子たちに受け継がれ、カデシュの戦いへとつながっていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Hattusa.rampart.jpg/500px-Hattusa.rampart.jpg
      credit: China Crisis / CC BY-SA 2.0
      page: https://commons.wikimedia.org/wiki/File:Hattusa.rampart.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シュッピルリウマ1世

  - id: nebuchadnezzar-i
    title: ネブカドネザル1世
    start: -1125
    startCirca: true
    end: -1104
    endCirca: true
    category: war
    tags: [バビロニア, エラム]
    summary: エラムからマルドゥク神像を取り戻し、バビロンの守護神を国家の中心に据えた。
    detail: |
      バビロニアのイシン第2王朝の王で、在位は紀元前12世紀の初め。
      聖書に登場する同名の王とは別人で、その450年ほど前にあたる。
      東のエラムからマルドゥク神像を取り戻したことで知られる。

      カッシート人の王朝が倒れた後、バビロニアは混乱していた。
      東のエラムが侵攻し、都市を略奪して主神マルドゥクの神像を持ち去っている。
      神像を奪われることは、神が都市を見捨てたと受け取られ、共同体の士気に関わる出来事だった。
      ネブカドネザル1世はエラムへ遠征した。
      最初の試みは疫病で失敗したが、真夏の酷暑をついて再び攻め込む。
      川の戦いでエラム軍を破り、神像を奪い返してバビロンに戻した。

      この勝利は、宗教の面で大きな意味を持った。
      マルドゥクは、それまで一都市の神にすぎなかった。
      神々の会議で王に選ばれ、混沌の怪物を倒して世界を作るという創世の物語が整えられる。
      『エヌマ・エリシュ』と呼ばれるこの叙事詩によって、マルドゥクはバビロニア全体の最高神になった。

      以後、バビロンの王位につく者は、この神から王権を受け取る儀式を毎年行う。
      新年の祭で王が神像の手を取る所作が、統治の正当性を示した。
      政治的な勝利が宗教の体系を作り替えた例として、この王の治世は重要である。
      王国自体は長続きせず、まもなくアッシリアの圧力を受けることになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/58/Nabu-Kudurri-Usur.jpg/500px-Nabu-Kudurri-Usur.jpg
      credit: L. W. King / Public domain
      page: https://commons.wikimedia.org/wiki/File:Nabu-Kudurri-Usur.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ネブカドネザル1世

  - id: tiglath-pileser-iii
    title: ティグラト・ピレセル3世
    start: -745
    end: -727
    category: war
    tags: [アッシリア, 強制移住]
    summary: 常備軍と住民の強制移住で、アッシリアを最初の「世界帝国」に変えた。
    detail: |
      新アッシリア帝国の王で、在位は紀元前745年から727年まで。
      弱まっていた王権を立て直し、帝国を根本から作り変えた。
      アッシリアが世界帝国と呼ばれるようになるのは、この王からである。

      即位の経緯には不明な点が多く、内乱によって位に就いたとみられる。
      当時のアッシリアは、有力な地方総督が半ば自立して王命に従わない状態にあった。
      改革はまず、行政の区分から始まった。
      大きな州を分割して総督の力を削ぎ、王に直属する監察官を置いて監視させる。
      中央から地方へ情報が速く届く伝令の制度も整えられた。

      軍では、遠征のたびに農民を徴発する方式を改めた。
      常備の職業軍を編成し、征服した地域の兵も組み込んで年間を通じて動かせるようにする。
      これによって遠隔地への連続した遠征が可能になった。
      もう一つの柱が、住民の強制移住である。
      反抗した地域の住民を遠く離れた土地へ移し、別の地域の人々を代わりに住まわせた。
      故郷と切り離された集団は反乱の核になりにくい。
      数十万人規模で実施され、西アジアの人口構成を大きく変えた。

      征服した国を属国のままにせず、州として直接支配する方針も定着させた。
      シリアとパレスチナを平定し、バビロンの王位も兼ねている。
      この王が作った仕組みを土台に、後継者たちはエジプトまで支配を広げた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/Tilglath_pileser_iii.jpg/500px-Tilglath_pileser_iii.jpg
      credit: 作者不明 / Public domain
