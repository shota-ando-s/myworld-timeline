  - id: erdogan
    title: エルドアン
    start: 2003
    ongoing: true
    category: politics
    tags: [トルコ]
    summary: 世俗主義の枠を緩めながら大統領制へ移行し、地域大国としての独自外交を進めている。
    detail: |
      トルコの政治家で、2003年から首相、2014年からは大統領として政権を担っている。
      1954年にイスタンブルの労働者の家庭に生まれた。
      世俗主義の枠を緩めながら、大統領制への移行と独自の地域外交を進めてきた。

      イスラム系の政党で活動し、1994年にイスタンブル市長に当選した。
      宗教的な詩を朗読したことで有罪となり、公職を追われた経験を持つ。
      2001年に公正発展党を結成し、翌年の総選挙で大勝する。
      初期の政権は、経済の安定とEU加盟の交渉で評価を得た。
      インフレを抑え、インフラを整備し、医療と教育を拡充する。
      軍が政治に介入する構図を後退させたことも、当初は民主化として歓迎された。

      2010年代に入ると方針が変わる。
      抗議運動への強硬な対応や、報道と司法への圧力が国際的な批判を招いた。
      2016年のクーデタ未遂の後、非常事態宣言のもとで大規模な粛清が行われる。
      2017年の国民投票で議院内閣制から大統領制へ移行し、権限が集中した。

      外交では、シリアへの軍事介入、リビアやコーカサスへの関与など独自の路線をとる。
      NATOの一員でありながらロシアとも関係を保ち、双方の間で立場を使い分けてきた。
      世俗主義を国是としてきた国で、宗教の位置づけを変えようとする試みが続いている。
      通貨の下落と高インフレは、近年の大きな課題になっている。
