lane: west-asia

# メソポタミア・ペルシア・アラブ・オスマンの君主と、イスラムの宗教的指導者。
leaders:
  - id: sargon-of-akkad
    title: サルゴン
    start: -2334
    startCirca: true
    end: -2279
    endCirca: true
    category: war
    tags: [アッカド, 帝国]
    summary: 複数の都市国家を一人の王の下に束ね、世界最初の「帝国」を作ったとされる。
    detail: |
      アッカド帝国を建てた王で、在位は紀元前2334年ごろから2279年ごろまで。
      メソポタミアの諸都市を一人の支配下にまとめた最初の人物とされる。
      古代オリエントの政治史で、もっとも重要な王の一人に数えられる。

      出自についての伝説が残っている。
      女司祭の子として生まれ、籠に入れて川に流され、水汲み人に拾われて育ったという。
      同じ型の物語はモーセの伝承にも現れる。
      実際には、キシュの王に仕える献酌官から身を起こしたと伝えられる。
      権力を握ると、南のシュメール諸都市へ兵を向けた。
      ウルクの王ルガルザゲシを破り、主要な都市の城壁を壊して抵抗の拠点を取り除く。
      5400人の兵が日々王の前で食事をしたという記録があり、常備軍を維持していたことを示す。
      遠征は西のレバノンの杉の森から、東のエラムにまで及んだ。

      支配の仕組みも作り変えた。
      各都市に自分の配下を総督として置き、娘を神殿の高位の司祭に任じる。
      アッカド語を行政の言語とし、度量衡を統一した。
      交易路を確保したことで、アナトリアの銀やインダスの品が都に集まる。

      在位は56年に及んだと伝えられ、晩年は各地の反乱に悩まされた。
      死後も帝国は続き、孫のナラム・シンの代に最大となる。
      後世のアッシリアやバビロニアの王は、この人物を統治の手本として引き合いに出した。
      一人の王が多民族を治めるという形は、ここから西アジアの伝統になっていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Sargon_of_Akkad.jpg/500px-Sargon_of_Akkad.jpg
      credit: 作者不明 / Public domain
