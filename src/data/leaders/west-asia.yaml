  - id: harun-al-rashid
    title: ハールーン・アッラシード
    start: 786
    end: 809
    category: culture
    tags: [アッバース朝, バグダード]
    summary: バグダードの繁栄を象徴する君主で、『千夜一夜物語』にも姿をとどめた。
    detail: |
      アッバース朝の第5代カリフで、在位は786年から809年まで。
      バグダードの繁栄が頂点に達した時期の君主である。
      『千夜一夜物語』に登場することで、伝説的な名声を得た。

      即位したとき20代前半で、政務の多くを有力な一族に委ねた。
      イラン系のバルマク家が宰相を務め、行政と財政を取り仕切る。
      後にこの一族は突然に失脚させられ、その理由は諸説ある。
      治世には、各地から膨大な税が集まった。
      宮廷は詩人・音楽家・学者を集め、贅を尽くした生活が営まれる。
      法学者や神学者を保護し、イスラム法の体系化が進んだ。
      詩と散文の水準が上がり、アラビア語の文学が成熟する。

      対外的には、ビザンツ帝国と戦って貢納を約束させた。
      一方、フランク王国のカール大帝とは使節と贈り物を交わしている。
      象を贈ったという逸話が、ヨーロッパ側の記録に残る。
      共通の敵である後ウマイヤ朝とビザンツを意識した外交でもあった。

      『千夜一夜物語』では、夜ごと変装して街を歩く理想の君主として描かれる。
      実際の統治は各地の反乱への対応に追われ、帝国の分権化はこの時期から進んでいた。
      死後、二人の息子の争いが内戦となり、バグダードは包囲される。
      最盛期と衰退の始まりが、同じ治世のなかに重なっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/Harun-Charlemagne.jpg/500px-Harun-Charlemagne.jpg
      credit: Julius Köckert / Public domain
      page: https://commons.wikimedia.org/wiki/File:Harun-Charlemagne.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ハールーン・アッ＝ラシード

  - id: al-mamun
    title: マアムーン
    start: 813
    end: 833
    category: science
    tags: [アッバース朝, 翻訳]
    summary: 「知恵の館」でギリシアの学術をアラビア語に訳させ、科学の中心を西アジアに移した。
    detail: |
      アッバース朝の第7代カリフで、在位は813年から833年まで。
      学問の保護で知られ、ギリシアの学術をアラビア語に訳す事業を組織的に進めた。
      科学の中心が西アジアへ移る転機を作った人物である。

      父ハールーンの死後、弟との後継争いに勝って即位した。
      内戦でバグダードは包囲され、大きな被害を受けている。
      イラン東部を基盤としたため、ペルシア系の官僚と学者を重んじた。
      知恵の館と呼ばれる施設を拡充し、翻訳と研究の拠点とした。
      ビザンツから写本を取り寄せ、ギリシア語やシリア語、サンスクリットの書物を訳させる。
      アリストテレス、プトレマイオス、エウクレイデス、ガレノスの著作がアラビア語になった。
      翻訳者には高額の報酬が与えられ、著書の重さと同じ金を支払ったという逸話も伝わる。

      自然科学にも力を入れた。
      バグダードとダマスカスに天文台を設け、惑星の位置を観測させる。
      平原で子午線の長さを実測させ、地球の大きさを高い精度で算出した。
      地理書と世界地図の作成も命じている。

      思想の面では、理性による解釈を重んじるムウタズィラ派を支持した。
      クルアーンは創造されたものだという教説を官僚と法学者に受け入れさせようとし、反対する者を弾圧する。
      この強制は後に撤回され、かえって反発を残した。
      学問の保護者でありながら、思想の統制も行ったという二面性を持つ治世である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/71/Coin_of_the_Abbasid_Caliph_al-Ma%27mun.jpg/500px-Coin_of_the_Abbasid_Caliph_al-Ma%27mun.jpg
      credit: Classical Numismatic Group; [1] / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Coin_of_the_Abbasid_Caliph_al-Ma%27mun.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マアムーン

  - id: tughril-beg
    title: トゥグリル・ベク
    start: 1055
    end: 1063
    category: politics
    tags: [セルジューク朝, スルタン]
    summary: バグダードに入ってスルタンの称号を得、軍事とカリフの権威を分ける形を作った。
    detail: |
      セルジューク朝の創始者で、1055年から1063年までバグダードを押さえた。
      中央アジアの遊牧部族の長から出発し、イランとイラクを支配する君主になった。
      スルタンという称号を公式に得た最初の人物とされる。

      一族はオグズ系のトルコ人で、アラル海の東方から南下してきた。
      ガズナ朝と戦ってホラーサーンを奪い、イラン各地を制圧していく。
      弟と協力して東西に勢力を広げた。
      1055年、バグダードに入城した。
      当時、カリフはシーア派のブワイフ朝に実権を握られており、スンナ派の擁護者を求めていた。
      トゥグリルはブワイフ朝を排除し、カリフから東方と西方の王という称号を授けられる。

      ここで、イスラム世界の権力の形が定まった。
      カリフは宗教的な権威の源泉として残り、実際の統治と軍事はスルタンが担う。
      宗教的正統性と世俗の権力が分業する体制は、以後のイスラム世界の標準になった。

      トゥグリル自身はスンナ派の擁護者として振る舞い、シーア派の勢力に対抗する姿勢を示した。
      ビザンツとの戦いにも着手し、アナトリア方面への道を開く。
      子がないまま没し、甥のアルプ・アルスラーンが跡を継いだ。
      遊牧の部族長が、既存の宗教的権威と結んで正統な支配者になるという道筋を作った人物である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/3/34/Tugrul_bey.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tugrul_bey.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/トゥグリル・ベグ

  - id: saladin
    title: サラディン
    start: 1174
    end: 1193
    category: war
    tags: [アイユーブ朝, 十字軍]
    summary: エルサレムを奪回し、その寛大な処置が敵味方の双方に語り継がれた。
    detail: |
      エジプトとシリアを統一し、エルサレムを奪回した君主。
      1174年から1193年まで在位し、アイユーブ朝を創始した。
      クルド系の軍人の家に生まれている。

      叔父に従ってエジプトへ遠征し、その死後に宰相の地位を継いだ。
      当時のエジプトはシーア派のファーティマ朝が支配していたが、実権を握ったサラディンは1171年にこれを廃する。
      エジプトはスンナ派に戻り、名目上はアッバース朝のカリフの下に入った。
      1174年にシリアの君主が没すると、そこへも勢力を広げた。
      10年以上をかけてダマスカス、アレッポ、モスルを従え、十字軍国家を包囲する形を作る。

      1187年、ヒッティーンの戦いでエルサレム王国の主力を壊滅させた。
      水のない丘に敵を誘い込み、消耗させたうえで打ち破る戦いだった。
      その3か月後にエルサレムを開城させる。
      88年前の十字軍の占領と違い、住民の虐殺は行われず、身代金を払えば退去できた。
      払えない者の多くも解放されている。

      これに対して第3回十字軍が派遣され、イングランドのリチャード1世と戦った。
      決着はつかず、キリスト教徒の巡礼を認める協定を結んで和平が成立する。
      1193年、ダマスカスで没した。
      私財を蓄えず、葬儀の費用にも事欠いたと伝えられる。
      敵であったヨーロッパ側でも、寛大な君主として物語に取り上げられ続けた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/Folio_from_The_book_of_knowledge_of_ingenious_mechanical_devices_%281354_copy%29._Part_of_a_water_clock_%28detail%29.jpg/500px-Folio_from_The_book_of_knowledge_of_ingenious_mechanical_devices_%281354_copy%29._Part_of_a_water_clock_%28detail%29.jpg
