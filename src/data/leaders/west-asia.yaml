  - id: bayezid-i
    title: バヤズィト1世
    start: 1389
    end: 1402
    category: war
    tags: [オスマン帝国, ティムール]
    summary: 十字軍を破って「雷帝」と呼ばれたが、ティムールに敗れて帝国を一時崩壊させた。
    detail: |
      オスマン帝国の第4代君主で、在位は1389年から1402年まで。
      電光を意味する稲妻の異名で呼ばれた。
      十字軍を破って勢いを示す一方、ティムールに敗れて帝国を一時崩壊させた。

      父が戦場で暗殺された直後に即位し、その場で兄弟を排除した。
      以後、即位した者が兄弟を殺す慣行が、この帝国に定着していく。
      アナトリアでは、諸君侯国を次々に併合して東方の領土を広げた。
      バルカン半島でも支配を固め、ブルガリアを併合する。
      1396年、ハンガリー王が率いるヨーロッパ諸国の連合軍をニコポリスで撃破した。
      この勝利で名声は頂点に達し、カイロのカリフからスルタンの称号を認められる。

      コンスタンティノープルは数年にわたり封鎖された。
      海からの補給に頼るビザンツは追い詰められ、陥落は時間の問題と見られていた。
      しかし東からティムールが迫った。
      併合された君侯たちがティムールに訴えたことが、その介入を招く。
      1402年のアンカラの戦いで、オスマン軍は敗れバヤズィトは捕虜になった。
      翌年、捕らわれたまま没する。

      帝国は息子たちの争いで10年余り分裂した。
      ビザンツは半世紀の延命を得ることになる。
      急拡大した帝国が一度の敗戦で崩れる脆さと、そこから立ち直る回復力の双方を示した治世だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Baiazeth._P._IIII.jpg/500px-Baiazeth._P._IIII.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Baiazeth._P._IIII.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/バヤズィト1世

  - id: mehmed-ii
    title: メフメト2世
    start: 1451
    end: 1481
    category: war
    tags: [オスマン帝国, コンスタンティノープル]
    summary: コンスタンティノープルを落として中世を終わらせ、帝国を東西にまたがらせた。
    detail: |
      オスマン帝国の第7代スルタンで、在位は1451年から1481年まで。
      コンスタンティノープルを攻略し、征服王と呼ばれた。
      帝国を東西にまたがる本格的な国家へ作り変えた人物である。

      21歳で即位すると、ただちに都の攻略に取りかかった。
      ボスポラス海峡に城塞を築いて海上の補給を断つ。
      ハンガリー人技術者に巨大な大砲を作らせ、城壁の破壊に用いた。
      艦隊を陸路で丘越えに金角湾へ運び込む作戦も行われる。
      1453年5月、7週間の包囲の末に城は落ちた。
      1000年続いたビザンツ帝国は滅び、都はイスタンブルと呼ばれるようになる。
      聖ソフィア聖堂はモスクに改められた。

      征服後の統治は現実的だった。
      各地から住民を移して都市を再建し、正教会の総主教を任命して信徒の自治を認める。
      ユダヤ教徒やアルメニア人の共同体も同様に扱われた。
      商業を保護し、都は再び地中海と黒海を結ぶ交易の中心になる。

      対外的には、セルビア・ボスニア・ギリシアを併合し、クリミア半島のハン国を従えた。
      イタリア半島の南端に橋頭堡を築いたところで没する。
      自らをローマ皇帝の後継と位置づけ、ギリシア語の学者を宮廷に招いてもいる。
      東西の伝統を継ぐ帝国という意識が、この君主から始まった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Bellini%2C_Gentile_-_Sultan_Mehmet_II.jpg/500px-Bellini%2C_Gentile_-_Sultan_Mehmet_II.jpg
      credit: ジェンティーレ・ベリーニ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Bellini,_Gentile_-_Sultan_Mehmet_II.jpg
    links:
      - label: Wikipedia
