  - id: ali-ibn-abi-talib
    title: アリー
    start: 656
    end: 661
    category: religion
    tags: [正統カリフ, シーア派]
    summary: その継承をめぐる対立がスンナ派とシーア派の分かれ目になった。
    detail: |
      第4代のカリフで、在位は656年から661年まで。
      ムハンマドの従弟であり、娘ファーティマの夫でもあった。
      その継承をめぐる対立が、スンナ派とシーア派の分かれ目になる。

      少年のころに最初期の信者となり、ムハンマドの各地の戦いに従った。
      勇猛さと信仰の篤さで知られ、知識にも通じていたと伝えられる。
      第3代カリフのウスマーンが反乱者に殺された後、推されてカリフになった。
      しかし前任者の縁者であるシリア総督のムアーウィヤは、犯人の処罰が不十分だとして従わない。
      同じ時期、ムハンマドの妻の一人らが起こしたラクダの戦いも鎮圧している。

      657年、スィッフィーンでムアーウィヤの軍と対峙した。
      戦いが有利に進んだところで相手は槍先にクルアーンを掲げ、神の書による裁定を求める。
      アリーが仲裁を受け入れたことで、一部の支持者が離反した。
      神のみが裁くと主張する彼らはハワーリジュ派と呼ばれ、以後アリーとムアーウィヤの双方を敵とする。

      661年、アリーはクーファの礼拝所でハワーリジュ派の一人に襲われて没した。
      ムアーウィヤがカリフの位に就き、世襲の王朝が始まる。
      シーア派は、アリーこそ預言者の後を継ぐべき唯一の人物だったとし、初代のイマームと位置づけた。
      現在の世界のムスリムの約1割がこの流れを汲んでいる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/AliSVG.svg/500px-AliSVG.svg.png
      credit: 作者不明 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:AliSVG.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アリー・イブン・アビー・ターリブ

  - id: muawiya
    title: ムアーウィヤ
    start: 661
    end: 680
    category: politics
    tags: [ウマイヤ朝]
    summary: カリフを世襲の王朝に変え、イスラム国家を帝国の形に組み替えた。
    detail: |
      ウマイヤ朝の初代カリフで、在位は661年から680年まで。
      長くシリア総督を務め、その基盤を背景にカリフの位を得た。
      イスラム国家を、選挙による共同体から世襲の帝国へと組み替えた人物である。

      メッカの有力者の家に生まれ、初めはムハンマドに敵対していた。
      降伏後に信者となり、ウマルとウスマーンの時代にシリアの統治を任される。
      20年にわたる統治で、忠実な軍と行政の組織を作り上げた。
      ウスマーンが殺されると、その一族としてアリーに復讐を求めた。
      スィッフィーンの戦いで決着はつかず、仲裁によって互いの立場が並び立つ形になる。
      アリーの暗殺後、その子が権利を放棄したためカリフとして認められた。

      統治は実務的だった。
      武力よりも交渉と懐柔を好み、敵対した相手にも役職と俸給を与えて取り込む。
      ビザンツの行政制度を引き継ぎ、キリスト教徒の官僚をそのまま用いた。
      海軍を創設してキプロスやロードスを攻め、コンスタンティノープルまで艦隊を送っている。

      最大の決断は、子のヤズィードを後継に指名したことである。
      諸部族の有力者に忠誠の誓いを取り付け、世襲を既成事実とした。
      これによって内乱の再発は避けられたが、預言者の一族を支持する人々の反発は残る。
      死の直後にフサインが蜂起し、カルバラーの悲劇につながった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Caliph_Muawiya_Calligaprhy.png/500px-Caliph_Muawiya_Calligaprhy.png
      credit: Rajkumararslan / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Caliph_Muawiya_Calligaprhy.png
    links:
