  - id: osman-i
    title: オスマン1世
    start: 1299
    startCirca: true
    end: 1326
    category: politics
    tags: [オスマン朝]
    summary: 小さな辺境の君侯から始まり、600年続く帝国の名の由来になった。
    detail: |
      オスマン帝国の初代君主で、13世紀末から14世紀初めにかけて活動した。
      アナトリア西部の小さな君侯国の長にすぎなかった。
      その名が、600年続く帝国の名の由来になる。

      セルジューク朝の分裂後、アナトリアには多数の君侯国が並んでいた。
      オスマンの一族は、ビザンツ帝国との境界地帯に拠点を持つ遊牧集団だった。
      信仰のために戦う者という意味のガーズィーを掲げ、周囲の戦士を集めている。
      位置が有利に働いた。
      背後のアナトリアではモンゴルの圧力が強く、前面のビザンツは弱っていた。
      他の君侯国が同じイスラム勢力と争うなか、オスマンは異教徒との戦いという名分で人を集められた。

      戦いだけでなく、支配の方法にも柔軟さがあった。
      征服した地域のキリスト教徒の領主を家臣として取り込み、信仰を強制しない。
      商人や農民の生活を保障し、秩序を与えることで支持を得た。

      1326年ごろ、ブルサを落とした直後に没したと伝えられる。
      生涯の記録は乏しく、後世の年代記に伝説が混じっている。
      王朝の正統性を語る物語として、夢に見た大樹が世界を覆うという逸話が伝えられた。
      子のオルハンがブルサを都と定め、ヨーロッパ側への進出を始める。
      辺境の一集団が世界帝国になる出発点が、この人物の代にある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Osman_Gazi2.jpg/500px-Osman_Gazi2.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Osman_Gazi2.jpg
    links:
