  - id: nader-shah
    title: ナーディル・シャー
    start: 1736
    end: 1747
    category: war
    tags: [イラン, 遠征]
    summary: 崩壊したイランを軍事力で立て直し、デリーまで攻め込んで孔雀の玉座を奪った。
    detail: |
      アフシャール朝を建てた君主で、在位は1736年から1747年まで。
      崩壊したイランを軍事力で立て直し、インドまで遠征した。
      最後のアジアの大征服者と呼ばれることもある。

      ホラーサーンの遊牧部族の出身で、盗賊まがいの生活から身を起こしたと伝えられる。
      サファヴィー朝がアフガン系の勢力に倒されると、王族を擁して抵抗の軍を組織した。
      アフガン勢力を追い払い、オスマンとロシアから失地を回復する。
      1736年、傀儡の王を廃して自ら即位した。
      200年続いたサファヴィー朝はここで終わる。
      シーア派を国教とする体制を緩め、スンナ派との和解を図ろうとしたが、国内の支持は得られなかった。

      1739年、ムガル帝国へ遠征してデリーを占領した。
      市内で虐殺が行われ、莫大な財宝が持ち去られる。
      孔雀の玉座と、コ・イ・ヌールと呼ばれる巨大なダイヤモンドもこのとき奪われた。
      戦利品の多さから、イラン国内の税を数年免除したと伝えられる。

      晩年は猜疑心を強め、自らの子を盲目にするなど残虐さが目立つようになった。
      重税と粛清が反発を招き、1747年に配下の将校に暗殺される。
      死後、王朝はすぐに分裂した。
      強力な個人の軍事力だけで築かれた支配が、その人物とともに崩れる典型的な例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Contemporary_portrait_of_Nader_Shah._Artist_unknown%2C_created_in_ca._1740_in_Iran_%28cropped%29.jpg/500px-Contemporary_portrait_of_Nader_Shah._Artist_unknown%2C_created_in_ca._1740_in_Iran_%28cropped%29.jpg
      credit: 作者不明 / Public domain
