  - id: ashurbanipal
    title: アッシュールバニパル
    start: -668
    end: -627
    category: culture
    tags: [アッシリア, 図書館]
    summary: 各地の粘土板を集めた大図書館を作り、ギルガメシュ叙事詩を今日まで残した。
    detail: |
      新アッシリア帝国の最盛期の最後の王で、在位は紀元前668年から627年ごろまで。
      軍事遠征を積極的に行う一方、学問への関心が高かった。
      首都ニネヴェに築いた図書館で知られる。

      王子のうちで学問の教育を受け、自ら楔形文字を読み書きできると誇っている。
      王がそれを公言するのは異例で、当時は書記の専門技能だった。
      治世の前半には、エジプトへ遠征してテーベを略奪した。
      しかし広大な版図の維持は難しく、エジプトはまもなく離反する。
      バビロンを任せていた兄が反乱を起こし、4年に及ぶ内戦となった。
      東のエラムには徹底した報復を行い、その王国を滅ぼしている。

      図書館には、帝国中から集めた粘土板が納められた。
      書記を各地に派遣し、神殿や個人の所蔵する文書を写させたり接収させたりしている。
      集められたのは、神話・祈祷・占い・医学・天文・語彙表・書簡など多岐にわたる。
      現在までに3万点を超える断片が発見された。

      この図書館のおかげで、『ギルガメシュ叙事詩』が現代に伝わった。
      19世紀に解読されたとき、そこに聖書の洪水物語とよく似た話が含まれていたことは大きな衝撃を与える。
      メソポタミアの文学と科学の大半は、この収集がなければ失われていた。
      王の死から20年足らずでニネヴェは落ち、図書館は火に包まれた。
      粘土板は焼けたことでかえって固く焼き締まり、2500年後まで残ることになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2d/Sculpted_reliefs_depicting_Ashurbanipal%2C_the_last_great_Assyrian_king%2C_hunting_lions%2C_gypsum_hall_relief_from_the_North_Palace_of_Nineveh_%28Irak%29%2C_c._645-635_BC%2C_British_Museum_%2816722368932%29.jpg/500px-thumbnail.jpg
      credit: Carole Raddato from FRANKFURT, Germany / CC BY-SA 2.0
      page: https://commons.wikimedia.org/wiki/File:Sculpted_reliefs_depicting_Ashurbanipal,_the_last_great_Assyrian_king,_hunting_lions,_gypsum_hall_relief_from_the_North_Palace_of_Nineveh_(Irak),_c._645-635_BC,_British_Museum_(16722368932).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アッシュルバニパル

  - id: nebuchadnezzar-ii
    title: ネブカドネザル2世
    start: -605
    end: -562
    category: war
    tags: [新バビロニア, ユダヤ]
    summary: ユダ王国を滅ぼしてバビロン捕囚を行い、一神教の形成に大きな影を落とした。
    detail: |
      新バビロニアの第2代の王で、在位は紀元前605年から562年まで。
      父の代に始まった王国を最大にし、バビロンを壮麗な都に作り変えた。
      ユダ王国を滅ぼし、住民を連行したことで聖書にも繰り返し登場する。

      王子の時代、カルケミシュでエジプト軍を破って名を上げた。
      この勝利によってシリアとパレスチナの支配権を確保する。
      即位後もたびたび西方へ遠征し、従わない都市を攻めた。
      ユダ王国は、エジプトとバビロニアのあいだで揺れ動いた。
      紀元前597年、反抗したユダの王と貴族、職人がバビロンへ連れ去られる。
      立てられた新しい王も再び反乱を起こしたため、586年にエルサレムは陥落した。
      神殿は焼かれ、城壁は壊され、多数の住民が捕囚として移される。

      フェニキアのティルスは13年にわたって包囲され、エジプトへの遠征も行われた。
      一方で、都バビロンの建設には膨大な資源が注がれている。
      イシュタル門と行列道路が青い煉瓦で飾られ、ジッグラトが修復された。
      空中庭園を作ったと伝えられるのもこの王である。

      聖書では、傲慢の果てに正気を失った王として描かれる。
      一方、バビロニアの碑文では神々を敬う建設者として現れる。
      連行されたユダヤ人は、異国で自らの信仰を保つ方法を見いだした。
      土地と神殿に依らない宗教のあり方は、この王の行為が生んだ結果でもある。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/5/5f/Nebukadnessar_II.jpg
      credit: User Hedning on sv.wikipedia / Public domain
      page: https://commons.wikimedia.org/wiki/File:Nebukadnessar_II.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ネブカドネザル2世

  - id: cyrus-the-great
    title: キュロス2世
    start: -559
    end: -530
    category: politics
    tags: [アケメネス朝, 寛容]
    summary: 征服地の宗教と慣習を認める統治で、多民族を束ねる帝国の手本になった。
    detail: |
      アケメネス朝ペルシアを建てた王で、在位は紀元前559年から530年まで。
      わずか20年ほどで、エジプトを除く古代オリエントのほぼ全域を支配下に置いた。
      征服地の宗教と慣習を認める統治で知られる。

      もとはイラン南西部のアンシャンの王で、メディアに従属する小国の君主だった。
      紀元前550年ごろ、宗主であるメディアを破って立場を逆転させる。
      ついで小アジアのリディアを滅ぼし、エーゲ海沿岸のギリシア人都市まで支配を広げた。
      紀元前539年にはバビロンを占領し、新バビロニアを滅ぼした。
      都の神官層の不満を利用し、大きな戦闘を経ずに入城したと伝えられる。
      自らをマルドゥク神に選ばれた者として振る舞い、伝統的な祭祀を保護した。

      統治の特徴は寛容である。
      征服した民族の神殿を修復し、持ち去られていた神像を元の都市へ返した。
      バビロンに連れて来られていたユダヤ人にも帰還と神殿の再建を許している。
      このため聖書では、異教の王でありながら神の道具として肯定的に描かれた。

      円筒形の粘土に刻まれた碑文には、こうした政策が記されている。
      近代には人権宣言の先駆と呼ばれたこともあるが、これは誇張だという指摘が強い。
      多民族を力だけでなく合意によって束ねる方法は、その後の帝国の手本になった。
      紀元前530年、中央アジアの遊牧民との戦いで没したと伝えられる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/Illustrerad_Verldshistoria_band_I_Ill_058.jpg/500px-Illustrerad_Verldshistoria_band_I_Ill_058.jpg
      credit: Ernst Wallis et al / Public domain
      page: https://commons.wikimedia.org/wiki/File:Illustrerad_Verldshistoria_band_I_Ill_058.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/キュロス2世

  - id: darius-i
    title: ダレイオス1世
    start: -522
    end: -486
    category: society
    tags: [アケメネス朝, 街道]
    summary: 州制と「王の道」で広大な帝国を運営し、統治の技術を後世に残した。
    detail: |
      アケメネス朝ペルシアの王で、在位は紀元前522年から486年まで。
      帝国の制度を整え、広大な領域を運営する仕組みを作った。
      統治の技術という点で、古代でもっとも重要な王の一人である。

      即位の経緯は複雑だった。
      カンビュセス2世の死後、王位を僭称する者が現れ、ダレイオスはこれを倒して即位する。
      各地で起きた反乱を1年余りで鎮め、その経緯をベヒストゥンの断崖に三つの言語で刻ませた。
      この碑文が、19世紀に楔形文字を解読する鍵になる。
      統治では、州の制度を完成させた。
      全土を20以上の州に分け、総督・軍司令官・書記を別々に任命して互いに牽制させる。
      監察官を巡回させ、中央の統制を保った。
      各州に納める税の額を定め、銀で納入させる方式を確立している。

      交通と通商も整備された。
      スサとサルディスを結ぶ王の道を敷き、宿駅と早馬の制度を置く。
      金貨ダレイコスを発行し、ナイル川と紅海を結ぶ運河を完成させた。
      インドからエーゲ海までが一つの経済圏として動き始める。

      対外的には、北のスキタイへの遠征が失敗に終わった。
      イオニアのギリシア人都市が反乱を起こすと、これを鎮めたうえでギリシア本土へ兵を送る。
      紀元前490年のマラトンの戦いで敗れ、再遠征を準備するうちに没した。
      新都ペルセポリスの造営を始めたのもこの王である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/Darius_I_%28The_Great%29.jpg/500px-Darius_I_%28The_Great%29.jpg
      credit: Surenae / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Darius_I_(The_Great).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ダレイオス1世

  - id: xerxes-i
    title: クセルクセス1世
    start: -486
    end: -465
    category: war
    tags: [アケメネス朝, ペルシア戦争]
    summary: ギリシア遠征に失敗し、東地中海の主導権がギリシア側に傾く転機になった。
    detail: |
      アケメネス朝ペルシアの王で、在位は紀元前486年から465年まで。
      ダレイオス1世の子で、父が準備していたギリシア遠征を実行した。
      その失敗が、東地中海の主導権をギリシア側に傾ける転機になる。

      即位の直後、エジプトとバビロニアの反乱を鎮圧した。
      バビロンでは伝統的な王の称号を用いるのをやめ、神像を持ち去ったとも伝えられる。
      寛容を基調としてきた統治に、変化が見えた時期でもある。
      紀元前480年、大軍を率いてギリシアへ向かった。
      ヘロドトスは数百万と記すが、現代の推定では十数万から30万程度とされる。
      ヘレスポントスに船を並べた橋を架けて渡り、陸と海から進んだ。

      テルモピュライの峠でスパルタ王レオニダスの部隊を破り、アテネを占領して焼く。
      しかしサラミスの海戦で艦隊が壊滅し、王は本国へ引き上げた。
      残した軍も翌年プラタイアで敗れ、遠征は完全に失敗する。

      以後、ペルシアはギリシアへの本格的な侵攻を行わなくなった。
      代わりに、資金を送ってギリシアの都市を互いに争わせる外交に転じる。
      国内ではペルセポリスの造営を進め、壮大な謁見の間などを完成させた。
      晩年は宮廷内の陰謀が続き、紀元前465年に側近に暗殺される。
      ギリシア側の記録に残る傲慢な専制君主という像は、勝者による描写であることに注意が必要である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/National_Museum_of_Iran_Darafsh_%28785%29.JPG/500px-National_Museum_of_Iran_Darafsh_%28785%29.JPG
      credit: Darafsh / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:National_Museum_of_Iran_Darafsh_(785).JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クセルクセス1世

  - id: seleucus-i
    title: セレウコス1世
    start: -305
    end: -281
    category: politics
    tags: [セレウコス朝, ヘレニズム]
    summary: アレクサンドロスの後継者として西アジアを継ぎ、ギリシア風の都市を各地に置いた。
    detail: |
      セレウコス朝の創始者で、紀元前358年に生まれ281年に没した。
      アレクサンドロスの部将の一人で、その死後の争いを勝ち抜いて西アジアを手に入れた。
      勝利者を意味するニカトールの名で呼ばれる。

      アレクサンドロスの死後、バビロニアの総督に任じられた。
      他の後継者との争いで一度は追われるが、紀元前312年にバビロンを回復する。
      この年が王朝の起点とされた。
      東方へ遠征し、インダス方面ではマウリヤ朝のチャンドラグプタと対峙した。
      戦って決着をつけるのではなく、インダス以東の領土を譲る代わりに戦象500頭を得る講和を結ぶ。
      この象が、のちの戦いで大きな力を発揮した。

      紀元前301年のイプソスの戦いでは、同盟軍とともに最大の敵を破った。
      これによりシリアと小アジアの一部を得て、帝国の形が定まる。
      晩年にはマケドニア本国まで支配下に置こうとしたが、その途上で暗殺された。

      統治では、都市の建設に力を注いだ。
      セレウキア、アンティオキア、ラオディケイアなど、数十の都市が新たに築かれる。
      ギリシア人とマケドニア人を入植させ、支配の拠点とした。
      現地の女性と結婚し、その子を後継者としたことも、東西の融合を象徴している。
      アレクサンドロスが夢見た東西の統合を、実際の制度として運営したのはこの人物だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/11/Seleuco_I_Nicatore.JPG/500px-Seleuco_I_Nicatore.JPG
      credit: 作者不明 / CC BY-SA 2.0 it
      page: https://commons.wikimedia.org/wiki/File:Seleuco_I_Nicatore.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/セレウコス1世

  - id: mithridates-i
    title: ミトラダテス1世
    start: -171
    end: -138
    category: war
    tags: [パルティア]
    summary: メソポタミアを奪ってパルティアをイランの主役にし、ローマの東の壁になった。
    detail: |
      パルティアの王で、在位は紀元前171年から138年まで。
      小さな地方国家だったパルティアを、イラン高原とメソポタミアを支配する大国に変えた。
      ローマの東方進出を止める壁の基礎を作った人物である。

      即位したころのパルティアは、カスピ海南東の一地方を領するにすぎなかった。
      西のセレウコス朝は、ローマとの戦いと内紛で弱まっている。
      ミトラダテスはその隙を突き、まず東のバクトリアから領土を奪った。
      続いて西へ向かい、メディアを併合する。
      紀元前141年にはバビロニアに入り、セレウキアを占領した。
      これによってメソポタミアの富と交易路を手に入れる。
      東西の主要な隊商路がパルティアの領内を通ることになった。

      統治では、征服地の伝統を尊重した。
      自らをギリシア文化を愛する者と刻んだ貨幣を発行し、ギリシア人の都市の自治を認める。
      バビロニアの神殿の祭祀も保護した。
      多様な住民を、緩やかな支配で束ねる方針である。

      王の称号も改めた。
      諸王の王を名乗り、アケメネス朝以来のイランの王権を継ぐ立場を主張する。
      これによってパルティアは、単なる遊牧勢力ではなくイランの正統な帝国として位置づけられた。
      領土は東はインダス方面、西はユーフラテスにまで達する。
      ローマが東地中海を制したとき、その向かい側に立っていたのがこの王の築いた国家だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/MithridatesIParthiaCoinHistoryofIran.jpg/500px-MithridatesIParthiaCoinHistoryofIran.jpg
      credit: Classical Numismatic Group; [1] / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:MithridatesIParthiaCoinHistoryofIran.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ミトラダテス1世

  - id: ardashir-i
    title: アルダシール1世
    start: 224
    end: 241
    category: politics
    tags: [ササン朝, ゾロアスター教]
    summary: パルティアを倒してササン朝を開き、ゾロアスター教を国教として帝国を再建した。
    detail: |
      ササン朝を開いた王で、在位は224年から241年ごろまで。
      イラン南西部のペルシス地方の一豪族から身を起こした。
      パルティアを倒し、アケメネス朝以来のイランの帝国を再建すると掲げた。

      もとはゾロアスター教の神殿を管理する家系で、地方の軍事指導者でもあった。
      周辺の都市を次々に従え、パルティアの宗主権を否定する。
      224年、ホルミズガーンの戦いでパルティア王アルタバヌス4世を破り殺した。
      翌々年にはクテシフォンで戴冠し、諸王の王を称する。
      統治の方針は、パルティアとは対照的だった。
      各地の王や有力者の自治を削り、中央から任命した官が治める仕組みへ移す。
      王家の権威を高めるため、貨幣と磨崖の浮彫に自らの姿を刻ませた。

      宗教を国家の柱に据えたことも大きい。
      ゾロアスター教を国教とし、神官団を組織して聖典の編纂を進めさせた。
      王権は神から授けられたものとされ、宗教と政治が一体になる。
      この構造は、後のイスラム王朝の統治観にも影響を与えた。

      対外的には、ローマとの戦いを開始した。
      メソポタミアの支配をめぐる争いは、以後400年にわたって両帝国の宿命になる。
      生前に子のシャープールへ位を譲り、継承を安定させた。
      アケメネス朝の後継を名乗ることで、イラン人としての自意識を再び政治の言葉にした点が重要である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/a/a6/Ardaschiri_coin_3.jpg
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Ardaschiri_coin_3.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アルダシール1世

  - id: shapur-i
    title: シャープール1世
    start: 240
    end: 270
    category: war
    tags: [ササン朝, ローマ]
    summary: ローマ皇帝を捕虜にし、ペルシアがローマと並ぶ大国であることを示した。
    detail: |
      ササン朝の第2代の王で、在位は240年から270年ごろまで。
      三人のローマ皇帝と戦い、そのうち一人を捕虜にした。
      ペルシアがローマと並ぶ大国であることを、目に見える形で示した人物である。

      父アルダシールの遠征に若くから加わり、共同統治を経て即位した。
      東ではクシャーナ朝を攻めて中央アジアまで支配を広げる。
      西方ではローマとの戦いが続いた。
      ゴルディアヌス3世を敗死させ、次のフィリップスからは多額の賠償金を得る。
      253年にはシリアの大都市アンティオキアを占領した。
      260年のエデッサの戦いでは、皇帝ウァレリアヌスを軍ごと捕らえている。
      ローマ皇帝が敵に生け捕られたのは、これが唯一の例である。

      この勝利は、磨崖の浮彫として各地に刻まれた。
      馬上の王の前に、ローマ皇帝がひざまずく構図である。
      捕虜となった兵士や技術者は、イラン各地の都市建設や水利事業に使われた。

      宗教には寛容な姿勢をとった。
      国教はゾロアスター教だが、新たに現れたマニの教えを保護している。
      マニ教は、ゾロアスター教・キリスト教・仏教の要素を取り込んだ普遍的な宗教をめざした。
      王の後ろ盾を得て東西に広がり、一時は中央アジアから地中海まで信者を持つ。
      シャープールの死後、神官団の反発によってマニは処刑された。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/43/ShapurICoinHistoryofIran.jpg
      credit: Classical Numismatic Group; [1] / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:ShapurICoinHistoryofIran.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シャープール1世

  - id: khosrow-i
    title: ホスロー1世
    start: 531
    end: 579
    category: politics
    tags: [ササン朝]
    summary: 税制と軍制の改革でササン朝の最盛期を作り、学問の保護でも知られた。
    detail: |
      ササン朝の王で、在位は531年から579年まで。
      税制と軍制の改革によって帝国の最盛期を作った。
      不滅の魂を意味する称号で呼ばれ、後世に理想の君主として語られる。

      即位の前、国内はマズダク教の運動で混乱していた。
      財産と土地の平等を説くこの運動は、貴族層の力を削ぐ一方で社会を不安定にしていた。
      ホスローはこれを鎮圧したうえで、改革に着手する。
      税制では、土地を測量して収穫の見込みに応じた定額の税を課す方式に改めた。
      それまでの収穫ごとの査定に比べ、収入が安定し、徴収も公平になる。
      軍制では、中小の地主層を騎兵として組織し、国家が装備を支給した。
      大貴族の私兵に頼らない軍が生まれ、王権は強まる。

      対外的には、ビザンツ帝国のユスティニアヌスと戦い、和平を結んでは再び戦った。
      シリアに侵入してアンティオキアを占領し、住民を移して新しい都市を建てている。
      東では突厥と結んでエフタルを滅ぼし、中央アジアへ影響を広げた。

      学問と文化の保護でも知られる。
      アテネの学院が閉鎖されたとき、逃れてきた哲学者たちを受け入れた。
      インドから説話集やチェスの原型が伝えられ、ペルシア語に訳される。
      ギリシアの医学と哲学の書も翻訳され、後のイスラムの学問に引き継がれた。
      この治世の後、ササン朝は急速に衰えていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5b/Plate_of_the_Sasanian_king_Khosrow_I_Anushirvan.jpg/500px-Plate_of_the_Sasanian_king_Khosrow_I_Anushirvan.jpg
      credit: 作者不明 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Plate_of_the_Sasanian_king_Khosrow_I_Anushirvan.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ホスロー1世

  - id: muhammad
    title: ムハンマド
    start: 610
    end: 632
    category: religion
    tags: [イスラム, 預言者]
    summary: 啓示を受けて説いた信仰が、そのまま国家と法をもつ共同体になった。
    detail: |
      イスラム教の預言者で、570年ごろに生まれ632年に没した。
      610年ごろから啓示を受けたとされ、その活動は22年に及ぶ。
      説いた信仰が、そのまま国家と法を持つ共同体になった点に特徴がある。

      メッカでの布教は、少数の支持者を得たにとどまった。
      唯一の神への帰依は、多神教の神殿を収入源とする有力者の利害と衝突する。
      信者は迫害を受け、一部はエチオピアへ避難した。
      622年、北のヤスリブへ移住する。
      この町はメディナと呼ばれるようになり、ムハンマドは宗教の指導者であると同時に政治と軍事の長になった。
      部族を超えて信仰で結ばれる共同体という考え方が、ここで形になる。

      メッカ側との戦いが続いた。
      バドルで勝ち、ウフドで敗れ、メディナの籠城戦を凌ぐ。
      交渉と同盟を重ねながら勢力を広げ、630年にほとんど戦わずにメッカへ入城した。
      カーバ神殿の偶像は取り除かれ、唯一神の聖所として定め直される。

      没するまでに、アラビア半島の大半の部族が従った。
      啓示は後にまとめられてクルアーンとなり、その言行はハディースとして伝えられる。
      信仰の実践、家族や相続の規定、商取引の倫理、共同体の運営が一体として示された。
      宗教が政治と法を含む生活の全体を形づくるという構造は、ここから生まれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/MuhammadSVG.svg/500px-MuhammadSVG.svg.png
      credit: Юкатан / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:MuhammadSVG.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ムハンマド・イブン＝アブドゥッラーフ

  - id: umar-ibn-al-khattab
    title: ウマル1世
    start: 634
    end: 644
    category: war
    tags: [正統カリフ, 征服]
    summary: シリア・エジプト・ペルシアを一気に征服し、イスラム世界の骨格を作った。
    detail: |
      第2代のカリフで、在位は634年から644年まで。
      わずか10年のあいだに、シリア・エジプト・イラク・イランを征服した。
      イスラム世界の骨格を作った人物とされる。

      もとはムハンマドに敵対していたが、改宗してからは最も強力な支持者になった。
      初代カリフの死に際して後継に指名され、信徒の長という称号を用いる。
      征服の速さは驚くべきものだった。
      636年のヤルムークの戦いでビザンツ軍を破ってシリアを奪い、エルサレムは降伏する。
      同じころカーディシーヤでササン朝軍を破り、642年のニハーヴァンドで決定的な勝利を得た。
      エジプトもアムルの軍が制圧している。

      征服地の統治では、いくつもの原則が定められた。
      住民の改宗を強制せず、ユダヤ教徒やキリスト教徒には人頭税を課して信仰と自治を認める。
      アラブの兵は現地の住民と混ざらず、軍営都市に住まわせた。
      バスラ、クーファ、フスタートといった都市がこうして生まれる。

      行政では、戦利品と収入を登録簿にもとづいて配分する制度を設けた。
      ヒジュラの年を起点とする暦を定めたのもこの人物である。
      エルサレムに入城した際、質素な姿で現れたという伝承がよく知られる。
      644年、ペルシア人の奴隷に礼拝中を襲われて没した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/Rashidun_Caliphs_Umar_ibn_Al-Khatt%C4%81b_-_%D8%B9%D9%8F%D9%85%D8%B1_%D8%A8%D9%86_%D8%A7%D9%84%D8%AE%D8%B7%D9%91%D8%A7%D8%A8_%D8%AB%D8%A7%D9%86%D9%8A_%D8%A7%D9%84%D8%AE%D9%84%D9%81%D8%A7%D8%A1_%D8%A7%D9%84%D8%B1%D8%A7%D8%B4%D8%AF%D9%8A%D9%86.svg/500px-Rashidun_Caliphs_Umar_ibn_Al-Khatt%C4%81b_-_%D8%B9%D9%8F%D9%85%D8%B1_%D8%A8%D9%86_%D8%A7%D9%84%D8%AE%D8%B7%D9%91%D8%A7%D8%A8_%D8%AB%D8%A7%D9%86%D9%8A_%D8%A7%D9%84%D8%AE%D9%84%D9%81%D8%A7%D8%A1_%D8%A7%D9%84%D8%B1%D8%A7%D8%B4%D8%AF%D9%8A%D9%86.svg.png
