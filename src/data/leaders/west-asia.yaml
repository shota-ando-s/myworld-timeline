      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/サラーフッディーン

  - id: baybars
    title: バイバルス
    start: 1260
    end: 1277
    category: war
    tags: [マムルーク朝, モンゴル]
    summary: モンゴル軍を破って西進を止め、マムルーク朝をイスラム世界の守り手にした。
    detail: |
      マムルーク朝のスルタンで、在位は1260年から1277年まで。
      モンゴル軍を破って西進を止め、十字軍国家を追い詰めた。
      マムルーク朝をイスラム世界の守り手として確立した人物である。

      キプチャク草原の出身で、奴隷として売られてエジプトへ来た。
      マムルークとは、軍事訓練を施された奴隷身分の兵士を指す。
      実力で昇進し、フランス王ルイ9世の十字軍を撃退する戦いで名を上げた。
      1260年のアイン・ジャールートの戦いでは、先鋒として偽りの退却によってモンゴル軍を誘い込んだ。
      この勝利の直後、当時のスルタンを倒して自らその位に就く。
      実力者が前任者を排して位に就くのは、この王朝では珍しくなかった。

      統治では、軍と交通の整備に力を注いだ。
      カイロからダマスカスまで4日で連絡できる駅伝を敷き、鳩による通信も用いる。
      城塞を修復し、艦隊を建造した。
      バグダード陥落で行き場を失ったアッバース家の人物をカイロに迎え、カリフとして擁立する。
      これによって、自らの支配に宗教的な正統性を与えた。

      十字軍国家に対しては、拠点を一つずつ攻略していった。
      アンティオキアを落とし、残る領域を海岸沿いに追い詰める。
      モンゴルとも繰り返し戦い、その侵攻を阻み続けた。
      エジプトがイスラム世界の政治的中心になる流れは、この治世で決定的になる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/%D8%AA%D9%85%D8%AB%D8%A7%D9%84_%D9%84%D9%84%D8%B3%D9%84%D8%B7%D8%A7%D9%86_%D8%A7%D9%84%D8%B8%D8%A7%D9%87%D8%B1_%D8%A8%D9%8A%D8%A8%D8%B1%D8%B3.JPG/500px-%D8%AA%D9%85%D8%AB%D8%A7%D9%84_%D9%84%D9%84%D8%B3%D9%84%D8%B7%D8%A7%D9%86_%D8%A7%D9%84%D8%B8%D8%A7%D9%87%D8%B1_%D8%A8%D9%8A%D8%A8%D8%B1%D8%B3.JPG
