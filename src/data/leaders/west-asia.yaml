    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イスマーイール1世

  - id: selim-i
    title: セリム1世
    start: 1512
    end: 1520
    category: war
    tags: [オスマン帝国, カリフ]
    summary: エジプトを征服して聖地の守護者となり、スルタンにカリフの権威を重ねた。
    detail: |
      オスマン帝国の第9代スルタンで、在位は1512年から1520年まで。
      わずか8年の在位で、帝国の領土をほぼ倍に広げた。
      聖地の保護者となり、スルタンにイスラム世界の盟主の地位を重ねた。

      父を退位させて即位し、兄弟とその子らを排除した。
      冷酷を意味する異名で呼ばれるが、詩人としての側面も持つ。
      最初に向かったのは東である。
      シーア派を掲げるサファヴィー朝は、アナトリア内部の同調者を通じて帝国を脅かしていた。
      1514年のチャルディラーンの戦いで、鉄砲隊と大砲を有効に使ってサファヴィー軍を破る。
      タブリーズを一時占領し、東アナトリアを確保した。

      次いで南へ向かい、マムルーク朝と戦った。
      1516年から翌年にかけてシリアとエジプトを征服し、300年近く続いたマムルーク朝を滅ぼす。
      これによってメッカとメディナの保護権を得た。
      聖地を守る立場は、スンナ派世界での指導的地位を意味する。
      後世には、最後のアッバース家のカリフから称号を譲られたという話が語られた。
      これは18世紀以降に作られた物語とみられているが、スルタンがカリフを称する根拠として使われる。

      征服によって、帝国の人口構成はムスリムが多数を占めるようになった。
      紅海とインド洋の交易路にも関与し、香辛料の利益を得る。
      次のスレイマン1世が最大の版図を築く土台は、この短い治世に作られた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Yavuz_Selim.jpg/500px-Yavuz_Selim.jpg
      credit: Bilinmiyor / Public domain
      page: https://commons.wikimedia.org/wiki/File:Yavuz_Selim.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/セリム1世

  - id: suleiman-the-magnificent
    title: スレイマン1世
    start: 1520
    end: 1566
    category: politics
    tags: [オスマン帝国, 最盛期]
    summary: 法整備と遠征で帝国を最大に広げ、ウィーンまで迫ってヨーロッパを震え上がらせた。
    detail: |
      オスマン帝国の第10代スルタンで、在位は1520年から1566年まで。
      46年の治世で帝国は最大の版図に達した。
      ヨーロッパでは壮麗者、国内では立法者と呼ばれる。

      即位の翌年にベオグラードを落とし、ハンガリーへの道を開いた。
      1522年にはロードス島の騎士団を降伏させ、東地中海の制海権を固める。
      1526年のモハーチの戦いでハンガリー王国軍を壊滅させ、王を戦死させた。
      1529年にはウィーンを包囲したが、季節と補給の問題で撤退している。
      海上では、バルバロス・ハイレッディンを提督として起用した。
      1538年のプレヴェザの海戦でスペインとヴェネツィアの連合艦隊を破り、地中海の主導権を握る。
      東ではサファヴィー朝と戦い、バグダードを併合した。

      内政では、法の整備が最大の事業になった。
      イスラム法と慣習法を調整し、土地・税・刑罰についての法令を体系化する。
      これが立法者の名の由来である。
      宮廷では詩と細密画が栄え、建築家のミマール・スィナンが壮麗なモスクを設計した。

      外交では、ハプスブルク家に対抗するためフランスと協力関係を結んだ。
      キリスト教国との同盟は当時としては異例で、ヨーロッパの勢力均衡に組み込まれたことを意味する。
      領内のキリスト教徒とユダヤ教徒には共同体ごとの自治を認め、多様な住民を抱えたまま統治した。
      1566年、ハンガリーでの遠征中に陣中で没している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/EmperorSuleiman.jpg/500px-EmperorSuleiman.jpg
      credit: Circle of ティツィアーノ・ヴェチェッリオ / Public domain
      page: https://commons.wikimedia.org/wiki/File:EmperorSuleiman.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/スレイマン1世

  - id: abbas-i
    title: アッバース1世
    start: 1588
    end: 1629
    category: politics
    tags: [サファヴィー朝, イスファハーン]
    summary: 「世界の半分」と讃えられた新都を築き、ヨーロッパとの通商で国を富ませた。
    detail: |
      サファヴィー朝の第5代シャーで、在位は1588年から1629年まで。
      弱っていた王朝を立て直し、最盛期を作った。
      新都イスファハーンは、世界の半分と讃えられるほど繁栄する。

      即位したとき、国土は東西から侵食されていた。
      西のオスマン帝国に領土を奪われ、東ではウズベクが侵入している。
      国内では、王朝を支えてきたトルコ系のキジルバシュ諸部族が力を持ちすぎていた。
      アッバースはまず、オスマンと屈辱的な講和を結んで時間を稼いだ。
      その間に軍を作り替える。
      コーカサス出身の奴隷身分の兵を訓練して常備軍とし、部族の軍に頼らない体制を築いた。
      火砲と鉄砲を導入し、ヨーロッパの技術者も招いている。

      態勢が整うと反攻に出た。
      ウズベクを撃退し、オスマンからタブリーズとバグダードを奪い返す。
      1622年にはイギリス東インド会社と組み、ポルトガルからホルムズ島を奪った。

      1598年に都をイスファハーンへ移し、大規模な造営を行った。
      巨大な広場を中心に、モスク・宮殿・バザールが配置される。
      絹の生産と輸出を国の専売とし、ヨーロッパの商人と直接取引した。
      アルメニア商人を都の一角に住まわせ、交易を担わせている。
      一方で後継者を疑って排除したため、死後の王朝は弱体化していった。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/4a/Shah_Abbas_I_engraving_by_Dominicus_Custos.jpg
      credit: Dominicus Custos / Public domain
      page: https://commons.wikimedia.org/wiki/File:Shah_Abbas_I_engraving_by_Dominicus_Custos.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アッバース1世

  - id: ahmed-iii
    title: アフメト3世
    start: 1703
    end: 1730
    category: culture
    tags: [オスマン帝国, チューリップ時代]
    summary: 西欧の様式を取り入れた華やかな宮廷文化「チューリップ時代」を現出させた。
    detail: |
      オスマン帝国の第23代スルタンで、在位は1703年から1730年まで。
      対外戦争が一段落した時期に、西欧の文物を取り入れた華やかな宮廷文化を現出させた。
      その時期はチューリップ時代と呼ばれる。

      即位は、前任者を退けた軍の反乱によるものだった。
      当初はロシアとの戦いで成果を上げ、ピョートル1世の軍を包囲して有利な講和を結んでいる。
      しかしオーストリアとの戦いには敗れ、1718年の条約でバルカンの領土を失った。
      ここから方針が転換する。
      領土の拡大をあきらめ、内政と文化に力を注ぐようになった。
      宰相を務めた娘婿が、この路線を主導する。

      パリやウィーンへ使節が送られ、宮殿や庭園の様式が報告された。
      ボスポラス海峡沿いに離宮が建てられ、チューリップの栽培が流行する。
      球根の価格が高騰し、投機の対象にもなった。
      1727年には、イスラム世界で初めてアラビア文字の活版印刷所が設けられる。

      一方で、宮廷の奢侈と増税は都市の民衆の反感を買った。
      1730年、イェニチェリと市民の反乱が起こり、アフメト3世は退位させられる。
      離宮は破壊され、改革も中断した。
      西欧に学ぶという方向は、この後も繰り返し試みられては抵抗に遭うことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Tughra_of_Ahmed_III.JPG/500px-Tughra_of_Ahmed_III.JPG
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tughra_of_Ahmed_III.JPG
    links:
