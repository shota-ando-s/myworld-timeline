lane: americas

# 先住民の王、征服者、そして独立後の南北アメリカの指導者。
leaders:
  - id: pakal
    title: パカル王
    start: 615
    end: 683
    category: politics
    tags: [マヤ, パレンケ]
    summary: 碑文と地下墓を残し、マヤ古典期の都市国家の政治と信仰を今に伝える。
    detail: |
      マヤの都市パレンケの王で、在位は615年から683年まで。
      68年に及ぶ長い治世で都市を大国に育てた。
      碑文と地下の墓が、マヤ古典期の政治と信仰を今に伝えている。

      12歳で即位した。
      当時のパレンケは、隣接する強国の攻撃を受けて弱っていた。
      即位の正統性には問題があった。
      母から王位を継いでおり、父は王族ではない。
      このため、碑文では母系の継承を神話と結びつけて正当化する記述が多く残された。

      治世のあいだに、多数の建築が行われた。
      宮殿には塔が設けられ、碑文の神殿をはじめとする建物が並ぶ。
      建築の壁面には、王の事績と系譜を記した長大な碑文が刻まれた。
      マヤの歴史を復元する主要な材料になっている。

      1952年、碑文の神殿の内部の階段の下から石棺が発見された。
      ピラミッドの下に王墓があることが確認された最初の例である。
      遺体はヒスイの仮面と装身具をまとっていた。
      石棺の蓋には、王が世界樹とともに死の世界へ下る場面が彫られている。
      この図像が宇宙船に乗る人物に見えるという主張が20世紀に広まったが、マヤの図像の文法に沿って解釈すれば別の意味になる。
      学問的な解読が進むにつれて、その意味は明らかになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/K%27inich_Janaab_Pakal_I_v2.jpg/500px-K%27inich_Janaab_Pakal_I_v2.jpg
      credit: "K'inich_Janaab_Pakal_I.jpg: Jami Dwyer derivative work: Simon Burchell (talk) / CC BY-SA 2.0"
      page: https://commons.wikimedia.org/wiki/File:K%27inich_Janaab_Pakal_I_v2.jpg
    links:
