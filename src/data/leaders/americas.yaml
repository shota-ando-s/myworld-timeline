        url: https://ja.wikipedia.org/wiki/キニチ・ハナーブ・パカル1世

  - id: itzcoatl
    title: イツコアトル
    start: 1427
    end: 1440
    category: politics
    tags: [アステカ, 三国同盟]
    summary: 三都市の同盟を組んでアステカを支配者側に変え、歴史書を焼いて神話を書き直させた。
    detail: |
      アステカの支配者で、在位は1427年から1440年まで。
      三つの都市の同盟を組んで従属の立場を脱し、アステカを支配者側に変えた。
      歴史書を焼いて神話を書き直させたことでも知られる。

      即位したとき、テノチティトランは周辺の有力都市に貢納する立場だった。
      その宗主国で内紛が起きると、イツコアトルは反旗を翻す。
      近隣の二都市と同盟を結び、共同で宗主を倒した。
      この三都市同盟が、以後アステカの支配の枠組みになる。
      征服した土地からの貢納は、三者で分配された。

      勝利の後、大規模な再編が行われた。
      軍功によって昇進できる仕組みが整えられ、貴族と平民の区別が明確になる。
      神殿が拡張され、戦争の神が国家の中心に据えられた。

      もう一つの措置が、記録の焼却である。
      以前の絵文書を集めて焼き、新たに歴史を編み直させた。
      自分たちが神に選ばれた民であり、太陽を動かすために犠牲を捧げる使命を負うという物語が作られる。
      この世界観が、その後の征服と人身供犠を正当化した。
      支配の正統性を作るために過去を書き換えるという行為は、各地の歴史に現れる。
      アステカの場合、それが記録として残っている点で明確な例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/Codex_Osuna_Triple_Alliance.JPG/500px-Codex_Osuna_Triple_Alliance.JPG
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Codex_Osuna_Triple_Alliance.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イツコアトル

  - id: pachacuti
    title: パチャクティ
    start: 1438
    end: 1471
    category: politics
    tags: [インカ, アンデス]
    summary: クスコの一都市をアンデス全域の帝国に広げ、マチュピチュを造らせた。
    detail: |
      インカの支配者で、在位は1438年から1471年まで。
      クスコの一都市国家を、アンデス全域に及ぶ帝国へ広げた。
      マチュピチュを造らせた人物とされる。

      即位の経緯は、外敵の侵攻に始まる。
      敵軍が迫ったとき、父と兄は都を捨てて逃げたが、彼は残って防衛を指揮し、これを撃退した。
      その功績によって支配者となる。
      名は、世界を揺るがす者、あるいは世界を作り変える者を意味する。

      征服は組織的に進められた。
      降伏した地域には支配者の地位を残し、その子弟をクスコで教育する。
      抵抗した集団は各地へ分散して移住させ、反乱の基盤を壊した。
      共通の言語としてケチュア語が広められる。

      国家の制度もこの代に整えられた。
      労働力の徴発、倉庫の設置、道路の整備、太陽信仰を中心とする国家の宗教がその内容である。
      クスコは、ピューマの形をかたどって作り変えられたとされる。
      精密に加工した石を組む建築の技術が、この時期に完成した。
      マチュピチュは、彼の離宮として建てられたという説が有力である。
      標高2400メートルの尾根に築かれ、スペイン人に発見されないまま残った。
      1911年に外部に知られ、インカの建築を伝える遺跡になっている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/1/11/Hp_inka9.jpg
      credit: ワマン・ポマ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Hp_inka9.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/パチャクテク

  - id: moctezuma-ii
    title: モクテスマ2世
    start: 1502
    end: 1520
    category: politics
    tags: [アステカ]
    summary: 最盛期のアステカを率いながら、スペイン人の到来で帝国を失った。
    detail: |
      アステカの第9代の支配者で、在位は1502年から1520年まで。
      最盛期の帝国を率いながら、スペイン人の到来によってそれを失った。

      即位したとき、アステカの支配は最大に達していた。
      貢納を課す地域は広がり、都市は繁栄する。
      一方で、貴族層を重んじ平民出身の官僚を退けたため、内部に不満も生まれていた。

      1519年、コルテスの一行が海岸に上陸する。
      モクテスマは使者を送り、豪華な贈り物を届けた。
      退去を促す意図だったとされるが、逆に富の存在を示す結果になる。
      スペイン人は内陸へ進んだ。
      途中、アステカの貢納に苦しむ集団が味方につき、数千の兵が加わる。

      都に入った一行を、モクテスマは受け入れた。
      まもなく彼は事実上の人質となり、スペイン人が実権を握る。
      祭礼の最中に行われた虐殺をきっかけに市民が蜂起し、その混乱のなかでモクテスマは死んだ。
      市民の投石によるとも、スペイン人に殺されたとも伝えられる。
      スペイン人は一度都を追われたが、翌年に包囲して陥落させた。
      到来を神の帰還と誤解したという物語は、後から作られた説明の色が濃い。
      実際には、周辺の集団の離反と天然痘の流行が、崩壊の決定的な要因だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e7/Moctezuma_Xocoyotzin.png/500px-Moctezuma_Xocoyotzin.png
      credit: attributed to Antonio Rodriguez (1636-1691) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Moctezuma_Xocoyotzin.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/モクテスマ2世

  - id: cortes
    title: コルテス
    start: 1519
    end: 1521
    category: war
    tags: [スペイン, 征服]
    summary: 現地の反アステカ勢力と疫病を味方につけ、わずかな兵力で帝国を倒した。
    detail: |
      スペインの征服者で、1519年から1521年にかけてアステカを倒した。
      数百人の兵で帝国を制圧したが、実際には現地の反アステカ勢力と疫病が決定的な役割を果たした。

      キューバから遠征隊を率いて出発した。
      総督の命令に背く形での出発であり、退路を断つために船を沈めたと伝えられる。
      沿岸で通訳を得たことが大きい。
      マヤ語を話す難破者と、ナワトル語とマヤ語を話す女性を得て、意思疎通が可能になった。

      内陸へ進む過程で、アステカの貢納に苦しむ都市が次々に味方についた。
      特にトラスカラは長年の敵対国であり、数千の兵を提供する。
      最終的に、スペイン側の軍勢の大半は現地の兵だった。
      1519年に都へ入り、支配者を事実上の人質とした。
      翌年、虐殺をきっかけに市民が蜂起し、一行は都から追われて多数の死者を出す。

      態勢を立て直し、1521年に都を包囲した。
      水路を断ち、船を建造して湖上を封鎖する。
      同時期に天然痘が流行し、守る側は大きく弱っていた。
      3か月の戦闘の末、都は陥落した。
      征服後は副王領の建設に関わるが、王室から警戒されて権限を削られる。
      少数の兵が帝国を倒したという物語は、その背景を見落とさせやすい。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Retrato_de_Hern%C3%A1n_Cort%C3%A9s.jpg/500px-Retrato_de_Hern%C3%A1n_Cort%C3%A9s.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Retrato_de_Hern%C3%A1n_Cort%C3%A9s.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エルナン・コルテス

  - id: pizarro
    title: ピサロ
    start: 1531
    end: 1533
    category: war
    tags: [スペイン, 征服]
    summary: 内戦で割れたインカを少数の兵で制し、銀山の富をスペインにもたらした。
    detail: |
      スペインの征服者で、1531年から1533年にかけてインカ帝国を倒した。
      内戦で割れた帝国を少数の兵で制し、銀山の富をスペインにもたらした。

      読み書きができなかったとされる貧しい出身で、中米での遠征に参加して経験を積んだ。
      南に豊かな帝国があるという噂を聞き、二度の失敗を経て三度目の遠征に出る。
      タイミングが決定的だった。
      到着した時点で、インカは皇位をめぐる内戦を終えたばかりだった。
      天然痘が先に伝わり、皇帝と後継者が病死していたことが、その内戦の原因である。

      1532年、カハマルカで皇帝アタワルパと会見した。
      数万の兵に囲まれた広場で、200人足らずのスペイン人が奇襲をかける。
      馬と火器の衝撃で混乱が起き、皇帝は捕らえられた。
      釈放の条件として、部屋を埋める金と銀が集められた。
      約束は果たされたが、アタワルパは処刑される。
      ピサロは傀儡の皇帝を立て、クスコを占領した。
      リマを新しい都として建設する。

      征服後、分け前をめぐって仲間と争い、1541年に暗殺された。
      帝国の崩壊は、火器の優位だけでは説明できない。
      疫病、内戦、そして支配に不満を持つ集団の協力が重なった結果である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/Portrait_of_Francisco_Pizarro.jpg/500px-Portrait_of_Francisco_Pizarro.jpg
      credit: Amable-Paul Coutan / Public domain
      page: https://commons.wikimedia.org/wiki/File:Portrait_of_Francisco_Pizarro.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フランシスコ・ピサロ

  - id: atahualpa
    title: アタワルパ
    start: 1532
    end: 1533
    category: politics
    tags: [インカ]
    summary: 内戦に勝った直後に捕らえられ、身代金の金を払ってなお処刑された最後の皇帝。
    detail: |
      インカ帝国の最後の実質的な皇帝で、1532年から1533年まで位にあった。
      内戦に勝った直後に捕らえられ、巨額の身代金を払ってなお処刑された。

      父の皇帝が天然痘で急死し、後継者も同時に失われた。
      この病はスペイン人の到達前に南下しており、その混乱が内戦を招いている。
      アタワルパは北部を拠点に、クスコの異母兄と5年にわたり争った。
      1532年に勝利し、帝国の支配権を握る。

      その直後、カハマルカでスペイン人と会見した。
      数万の兵を従えており、200人足らずの一行を脅威とみなしていなかったとされる。
      広場で司祭が聖書を差し出し、それを投げ捨てたことが攻撃の合図になる。
      騎兵と火器の突撃で随行者が殺され、皇帝は捕虜になった。

      釈放の条件として、部屋一つを金で、二つを銀で満たすことが約束された。
      各地の神殿から金の装飾が集められ、溶かされてスペインへ送られる。
      約束が果たされた後も、彼は解放されなかった。
      反乱を企てたとして裁判にかけられ、1533年に処刑される。
      火刑を免れる代わりに洗礼を受けたと伝えられる。
      皇帝の身柄が支配の要であった国家にとって、この処刑の打撃は大きかった。
      各地の抵抗は40年続いたが、帝国は回復しなかった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Ataw_Wallpa_portrait.jpg/500px-Ataw_Wallpa_portrait.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ataw_Wallpa_portrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アタワルパ

  - id: tupac-amaru-ii
    title: トゥパク・アマル2世
    start: 1780
    end: 1781
    category: war
    tags: [ペルー, 反乱]
    summary: インカの末裔を名乗って先住民の大反乱を起こし、植民地支配を揺るがした。
    detail: |
      ペルーで先住民の大反乱を起こした指導者で、1780年から1781年にかけて活動した。
      インカの末裔を名乗り、植民地支配を揺るがした。

      本名をホセ・ガブリエル・コンドルカンキという。
      地方の首長の家に生まれ、スペイン式の教育を受け、ラバの隊商を営む裕福な人物だった。
      不満の原因は、強制的な商品の買い取りと、鉱山への労働の徴発である。
      改善を求めて法廷で訴えたが、認められなかった。

      1780年、地方の行政官を捕らえて処刑し、蜂起した。
      最後のインカ皇帝の名を継いで、トゥパク・アマル2世を名乗る。
      当初の主張は、王への忠誠を保ちながら悪政を正すというものだった。
      運動が広がるにつれて、植民地支配そのものの打倒へ傾いていく。
      数万が加わり、ペルーからボリビアにかけて広がった。

      1781年、内部の裏切りによって捕らえられる。
      家族とともに広場で処刑され、遺体は四つに分けて各地に送られた。
      反乱は鎮圧されたが、支配の側は大きく動揺した。
      先住民の首長の制度は廃され、インカに関わる衣装や言語、劇の上演まで禁じられる。
      その名は20世紀の運動で繰り返し用いられた。
      先住民の抵抗の象徴として、現在も各地で記憶されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/00/T%C3%BApac_Amaru.jpg/500px-T%C3%BApac_Amaru.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:T%C3%BApac_Amaru.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ホセ・ガブリエル・コンドルカンキ

  - id: washington
    title: ワシントン
    start: 1789
    end: 1797
    category: politics
    tags: [アメリカ, 建国]
    summary: 二期で自ら退いたことが、権力を譲る共和国の慣習を作った。
    detail: |
      アメリカ合衆国の初代大統領で、在任は1789年から1797年まで。
      独立戦争では大陸軍の総司令官を務めた。
      二期で自ら退いたことが、権力を譲る慣習を作った。

      ヴァージニアの農園主で、植民地軍の将校として戦争の経験があった。
      大陸会議で総司令官に選ばれる。
      戦いでは劣勢が続いた。
      正規軍を相手に決戦を避け、軍を維持し続けることを優先する。
      フランスの参戦を得て、1781年のヨークタウンで決着した。

      戦後、軍を解散して私生活に戻った。
      権力を握ることもできた立場で自ら退いたことは、国内外で驚きをもって受け止められる。
      憲法制定会議の議長を務め、全会一致で初代大統領に選ばれた。
      前例のない職であり、その振る舞いのすべてが先例になる。
      閣僚の制度を整え、陛下という呼称を退けて大統領と呼ばせた。

      在任中、財政と外交をめぐって閣内が対立する。
      ヨーロッパの戦争には中立を保つ方針をとった。
      三期目を求める声を退けて退任した。
      以後、二期で退くことが慣習となり、20世紀に憲法の条文になる。
      離任の際の演説では、党派の対立と外国との恒久的な同盟への警戒を説いた。
      自らも奴隷を所有しており、遺言で解放を定めている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/Gilbert_Stuart_Williamstown_Portrait_of_George_Washington_%28cropped%29%282%29.jpg/500px-Gilbert_Stuart_Williamstown_Portrait_of_George_Washington_%28cropped%29%282%29.jpg
      credit: ギルバート・ステュアート / Public domain
      page: https://commons.wikimedia.org/wiki/File:Gilbert_Stuart_Williamstown_Portrait_of_George_Washington_(cropped)(2).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジョージ・ワシントン

  - id: jefferson
    title: ジェファソン
    start: 1801
    end: 1809
    category: politics
    tags: [アメリカ, 領土拡大]
    summary: 独立宣言を起草し、ルイジアナ買収で国土を一気に倍にした。
    detail: |
      アメリカ合衆国の第3代大統領で、在任は1801年から1809年まで。
      独立宣言を起草し、ルイジアナ買収によって国土を倍にした。

      ヴァージニアの農園主で、法律と古典に通じた知識人だった。
      33歳で独立宣言の起草を任され、すべての人は平等に造られたという一節を書く。
      建国後は国務長官と副大統領を務めた。
      強い連邦政府を求める立場と対立し、州の権限と農業を重んじる勢力を率いる。

      大統領としての最大の業績がルイジアナ買収である。
      1803年、フランスから広大な領域を1500万ドルで取得し、国土は一気に倍増した。
      憲法に明文の根拠がないことを自ら気にしながら、機会を逃さない判断を下している。
      続いて探検隊を派遣し、西部の地理と資源を調査させた。

      建国の理想を語る言葉と、その生活のあいだには大きな落差がある。
      生涯に600人以上の奴隷を所有し、解放したのはごく一部だった。
      奴隷であった女性とのあいだに子をもうけたことも、遺伝子の分析によって裏づけられている。
      晩年はヴァージニア大学を創設した。
      自分の墓碑には、大統領であったことを記さず、独立宣言の起草、信教の自由の法、大学の創設だけを刻ませている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/Official_Presidential_portrait_of_Thomas_Jefferson_%28by_Rembrandt_Peale%2C_1800%29.jpg/500px-Official_Presidential_portrait_of_Thomas_Jefferson_%28by_Rembrandt_Peale%2C_1800%29.jpg
      credit: レンブラント・ピール / Public domain
