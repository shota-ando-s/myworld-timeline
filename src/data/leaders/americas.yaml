        url: https://ja.wikipedia.org/wiki/ジェトゥリオ・ドルネレス・ヴァルガス

  - id: fdr
    title: F・ローズヴェルト
    start: 1933
    end: 1945
    category: economy
    tags: [アメリカ, ニューディール]
    summary: 恐慌への大規模な介入と戦争指導で、政府の役割そのものを作り替えた。
    detail: |
      アメリカ合衆国の第32代大統領で、在任は1933年から1945年まで。
      四期にわたって選ばれた唯一の大統領である。
      恐慌への大規模な介入と戦争の指導によって、政府の役割そのものを作り替えた。

      39歳でポリオにかかり、以後は車椅子を用いた。
      その事実は、報道の協力によってほとんど公にされていない。
      就任時、失業率は25パーセントに達し、銀行は次々に破綻していた。
      就任演説で、恐れるべきは恐れそのものだと述べる。

      最初の100日で、次々に法が成立した。
      銀行の休業と検査、農業の生産調整、公共事業による雇用の創出が進められる。
      証券取引の規制、預金保険、社会保障法、労働組合の権利の保障が続いた。
      これらをニューディールと呼ぶ。

      経済の完全な回復は戦争を待つことになるが、政府が雇用と福祉に責任を持つという考え方が定着した。
      炉辺談話と呼ばれるラジオの放送で、政策を平易な言葉で説明した。
      大統領が国民に直接語りかける手法の先駆である。
      第二次世界大戦では、参戦前から連合国への支援を進め、参戦後は生産力を総動員した。
      戦後の国際機構の構想も主導する。
      1945年、戦争の終結を見ずに没した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/42/FDR_1944_Color_Portrait.jpg/500px-FDR_1944_Color_Portrait.jpg
      credit: レオン・パースキー / CC BY 2.0
      page: https://commons.wikimedia.org/wiki/File:FDR_1944_Color_Portrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フランクリン・ルーズベルト

  - id: truman
    title: トルーマン
    start: 1945
    end: 1953
    category: politics
    tags: [アメリカ, 冷戦]
    summary: 原爆投下を決め、封じ込め政策で冷戦の枠組みを敷いた。
    detail: |
      アメリカ合衆国の第33代大統領で、在任は1945年から1953年まで。
      原爆の投下を決め、封じ込め政策によって冷戦の枠組みを敷いた。

      副大統領に就任してわずか数か月で、ローズヴェルトの死によって大統領になった。
      原爆の開発計画についても、就任まで知らされていない。
      1945年8月、広島と長崎への投下を決定した。
      本土への上陸作戦を避けるためという説明がなされたが、その判断をめぐる議論は今も続いている。

      戦後、ソ連との協調は崩れた。
      1947年、共産主義の圧力を受ける国を支援すると表明する。
      続いてマーシャル・プランで西欧の復興を支え、NATOを創設した。
      封じ込めと呼ばれる方針が、以後40年の基本になる。

      1948年のベルリン封鎖には空輸で対抗した。
      1950年に朝鮮戦争が起きると、国連軍として参戦する。
      指揮官のマッカーサーが中国への攻撃を主張すると、これを解任した。
      軍に対する文民の統制を示した例とされる。
      国内では、軍隊における人種の分離を廃止する命令を出している。
      就任時の評価は低かったが、冷戦初期の枠組みを作った大統領として、後に評価が高まった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/TRUMAN_58-766-06_%28cropped%29.jpg/500px-TRUMAN_58-766-06_%28cropped%29.jpg
      credit: National Archives and Records Administration. Office of Presidential Libraries. Harry S. Truman Library. / Public domain
      page: https://commons.wikimedia.org/wiki/File:TRUMAN_58-766-06_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ハリー・S・トルーマン

  - id: peron
    title: ペロン
    start: 1946
    end: 1955
    category: politics
    tags: [アルゼンチン, ポピュリズム]
    summary: 労働者への分配と個人的人気で、今日まで続くアルゼンチン政治の対立軸を作った。
    detail: |
      アルゼンチンの大統領で、1946年から1955年まで、さらに1973年から74年まで在任した。
      労働者への分配と個人的な人気によって、今日まで続く政治の対立軸を作った。

      軍人として労働担当の役職に就き、労働者の待遇を改善する政策を進めた。
      その人気を警戒した軍に逮捕されるが、大規模なデモによって釈放され、そのまま大統領選に勝利する。
      政策は、労働者への分配を軸とした。
      賃金の引き上げ、有給休暇、年金、医療の拡充が進められる。
      鉄道と電話と外国企業を国有化し、工業化を推進した。
      女性に参政権を与えたのもこの時期である。

      妻のエバは、貧困層への支援と女性の組織化を担い、絶大な人気を得た。
      33歳での死は、国全体の喪失として受け止められる。
      一方で、報道は統制され、反対派は排除された。
      経済は輸出の不振と支出の増大で悪化する。
      教会との対立も深まり、1955年に軍のクーデタで追われた。

      18年の亡命の後、1973年に帰国して再び大統領になるが、翌年に没する。
      ペロン主義と呼ばれる潮流は、労働組合を基盤としながら左右両方の要素を含み、現在もアルゼンチン政治の主要な軸であり続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/RETRATO_FOTOGR%C3%81FICO_DE_PER%C3%93N.jpg/500px-RETRATO_FOTOGR%C3%81FICO_DE_PER%C3%93N.jpg
      credit: 作者不明 / CC0
      page: https://commons.wikimedia.org/wiki/File:RETRATO_FOTOGR%C3%81FICO_DE_PER%C3%93N.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フアン・ペロン

  - id: eisenhower
    title: アイゼンハワー
    start: 1953
    end: 1961
    category: politics
    tags: [アメリカ]
    summary: 州間高速道路網を整え、退任演説で軍産複合体の危険を警告した。
    detail: |
      アメリカ合衆国の第34代大統領で、在任は1953年から1961年まで。
      第二次世界大戦ではヨーロッパの連合軍を指揮した。
      退任の演説で、軍産複合体の危険を警告したことで知られる。

      ノルマンディー上陸作戦を統括し、国民的な名声を得て大統領に選ばれた。
      就任の年に朝鮮戦争の休戦を実現した。
      外交では、核兵器による抑止を前面に出しつつ、大規模な地上戦を避ける方針をとる。
      一方、中央情報局を用いてイランとグアテマラの政権を転覆させた。

      国内では、州間高速道路網の建設を進めた。
      軍事上の輸送を名目としながら、結果として国土の構造と生活を変える事業になる。
      公民権については慎重だったが、州が最高裁の判決に従わない事態には軍を派遣した。
      アーカンソーで、黒人生徒の登校を守るために連邦軍が出動している。
      ソ連が人工衛星を打ち上げると、航空宇宙局を設立し、科学教育への支援を拡大した。

      1961年の退任演説で、巨大な軍需産業と軍部の結びつきが政策を歪める危険を指摘する。
      軍人出身の大統領がこの警告を発したことの意味は大きい。
      この言葉は、以後の軍事と政治の関係を論じる際の出発点になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/63/Dwight_D._Eisenhower%2C_official_photo_portrait%2C_May_29%2C_1959.jpg/500px-Dwight_D._Eisenhower%2C_official_photo_portrait%2C_May_29%2C_1959.jpg
      credit: White House / Public domain
      page: https://commons.wikimedia.org/wiki/File:Dwight_D._Eisenhower,_official_photo_portrait,_May_29,_1959.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ドワイト・D・アイゼンハワー

  - id: castro
    title: カストロ
    start: 1959
    end: 2008
    category: politics
    tags: [キューバ, 革命]
    summary: 米国の目の前に社会主義国を作り、半世紀の経済封鎖にも体制を保った。
    detail: |
      キューバの指導者で、1959年から2008年まで権力の座にあった。
      アメリカの目の前に社会主義国を作り、半世紀の経済封鎖のなかで体制を保った。

      法律を学んだ後、独裁政権への反乱を試みて投獄される。
      釈放後にメキシコへ渡り、ゲバラらとともに武装組織を作った。
      1956年、小型船で上陸したが、ほとんどが殺されるか捕らえられる。
      生き残った十数人が山中でゲリラ戦を続け、農民の支持を得て勢力を拡大した。
      1959年、政権は崩壊して革命が成立する。

      当初は社会主義を掲げていなかった。
      農地改革とアメリカ系企業の国有化を進めるなかで関係が悪化し、ソ連に接近していく。
      1961年の上陸作戦を撃退し、社会主義を宣言した。
      翌年、ソ連のミサイル配備をめぐってキューバ危機が起きる。
      国内では、識字運動と医療の無償化が進められた。
      識字率と乳児死亡率は先進国並みになる。
      一方、言論の自由はなく、多数が国外へ脱出した。

      ソ連の崩壊で経済的な支援を失い、深刻な物不足に陥る。
      それでも体制は続いた。
      2008年に弟へ職を譲り、2016年に没する。
      評価は、教育と医療の成果と、自由の抑圧のあいだで大きく分かれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Fidel_Castro%2C_Prime_Minister_of_Cuba._Castro_at_the_United_Nations%2C_New_York_%283x4_cropped%29.jpg/500px-Fidel_Castro%2C_Prime_Minister_of_Cuba._Castro_at_the_United_Nations%2C_New_York_%283x4_cropped%29.jpg
      credit: Bernard Gotfryd / Public domain
      page: https://commons.wikimedia.org/wiki/File:Fidel_Castro,_Prime_Minister_of_Cuba._Castro_at_the_United_Nations,_New_York_(3x4_cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フィデル・カストロ

  - id: jfk
    title: ケネディ
    start: 1961
    end: 1963
    category: politics
    tags: [アメリカ, 冷戦]
    summary: キューバ危機を交渉で回避し、月着陸計画と公民権に道を開いた。
    detail: |
      アメリカ合衆国の第35代大統領で、在任は1961年から1963年まで。
      43歳での就任は、選挙で選ばれた大統領として最年少である。
      キューバ危機を交渉で回避し、月着陸計画と公民権に道を開いた。

      テレビ討論での印象が勝敗を分けたとされ、映像の時代の政治を象徴する存在になった。
      就任の演説では、国が何をしてくれるかではなく、自分が国に何をできるかを問えと述べている。
      最初の年、キューバへの上陸作戦が失敗した。
      前政権から引き継いだ計画だったが、責任を自ら認める。

      1962年、ソ連がキューバにミサイルを配備したことが判明した。
      軍は空爆と侵攻を主張したが、ケネディは海上封鎖を選び、交渉の余地を残す。
      13日間の緊張の末、ミサイルの撤去とトルコからの米国のミサイルの撤去を交換する形で決着した。
      翌年、部分的核実験禁止条約が結ばれる。

      国内では、公民権法の制定を議会に求めた。
      成立は死後になる。
      1960年代のうちに月へ人を送ると宣言し、宇宙計画が本格化した。
      1963年11月、ダラスで銃撃されて死亡する。
      短い在任と劇的な死によって、実際の成果を超える象徴的な存在になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/John_F._Kennedy%2C_White_House_color_photo_portrait.jpg/500px-John_F._Kennedy%2C_White_House_color_photo_portrait.jpg
      credit: セシル・W・ストウトン / Public domain
      page: https://commons.wikimedia.org/wiki/File:John_F._Kennedy,_White_House_color_photo_portrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジョン・F・ケネディ

  - id: lyndon-johnson
    title: ジョンソン
    start: 1963
    end: 1969
    category: society
    tags: [アメリカ, 公民権]
    summary: 公民権法と「偉大な社会」を実現する一方、ベトナム戦争の泥沼に踏み込んだ。
    detail: |
      アメリカ合衆国の第36代大統領で、在任は1963年から1969年まで。
      公民権法と福祉政策を実現する一方、ベトナム戦争の泥沼に踏み込んだ。

      ケネディの暗殺を受けて就任した。
      上院の院内総務として議会を動かす技術に長けており、その手腕を立法に用いる。
      1964年、公民権法を成立させた。
      公共施設と雇用における人種による差別を禁じる内容である。
      翌年には投票権法が成立し、南部で投票を妨げてきた仕組みが取り除かれた。
      南部出身の大統領がこれを実現したことは、政治的な意味が大きい。

      偉大な社会という構想のもと、貧困との戦いを掲げた。
      高齢者と低所得者への医療保険、教育への連邦の支援、住宅と都市の政策が進められる。
      一方、ベトナムへの関与を段階的に拡大した。
      1964年の事件を口実に議会から広い権限を得て、地上軍を投入し、兵力は50万を超える。
      戦況は改善せず、国内では反戦運動が広がった。

      戦費が福祉の予算を圧迫し、支持は急落する。
      1968年、再選をめざさないと表明した。
      国内改革の規模と、戦争の判断の誤りが、同じ大統領のなかで並んでいる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/37_Lyndon_Johnson_3x4.jpg/500px-37_Lyndon_Johnson_3x4.jpg
      credit: アーノルド・ニューマン / Public domain
      page: https://commons.wikimedia.org/wiki/File:37_Lyndon_Johnson_3x4.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/リンドン・ジョンソン

  - id: nixon
    title: ニクソン
    start: 1969
    end: 1974
    category: politics
    tags: [アメリカ, 米中接近]
    summary: 訪中とドル金交換停止で冷戦と経済の枠組みを変え、盗聴事件で辞任した。
    detail: |
      アメリカ合衆国の第37代大統領で、在任は1969年から1974年まで。
      訪中とドルの金交換停止で冷戦と経済の枠組みを変え、盗聴事件で辞任した。

      反共の政治家として知られていたが、外交では現実的な転換を行った。
      1972年に中国を訪問し、20年以上敵対していた両国の関係を変える。
      ソ連とは戦略兵器の制限交渉を進め、緊張の緩和を図った。
      ベトナムからは段階的に撤退した。
      同時にカンボジアへの爆撃を拡大し、国内の反発を招いている。
      1973年に和平協定が結ばれた。

      経済では、1971年にドルと金の交換を停止した。
      戦後の国際通貨体制が崩れ、変動相場制へ移行する。
      物価と賃金の統制も一時的に行われた。
      国内では環境保護庁の設立など、現在に残る制度も作られている。
      1972年、選挙運動の関係者が民主党の本部に侵入して盗聴を試みた事件が起きた。
      大統領自身が隠蔽に関与していたことが、録音テープによって明らかになる。

      弾劾が確実になったため、1974年に辞任した。
      大統領が任期中に辞任した唯一の例である。
      外交での成果と、権力の濫用が、同じ人物の評価に並んでいる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/Richard_Nixon_presidential_portrait_%281%29.jpg/500px-Richard_Nixon_presidential_portrait_%281%29.jpg
      credit: Department of Defense. Department of the Army. Office of the Deputy Chief of Staff for Operations. U.S. Army Audiovisual Center. (ca. 1974 - 05/15/1984) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Richard_Nixon_presidential_portrait_(1).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/リチャード・ニクソン

  - id: pinochet
    title: ピノチェト
    start: 1973
    end: 1990
    category: politics
    tags: [チリ, 軍政]
    summary: クーデタで社会主義政権を倒し、弾圧と市場改革を同時に進めた。
    detail: |
      チリの軍人で、1973年から1990年まで権力を握った。
      クーデタで社会主義政権を倒し、弾圧と市場改革を同時に進めた。

      1970年、選挙でアジェンデが大統領に選ばれた。
      選挙によって社会主義政権が成立した初期の例である。
      銅山の国有化と農地改革を進めたが、経済の混乱とアメリカによる圧力が重なった。
      1973年9月11日、軍がクーデタを起こす。
      大統領府が空爆され、アジェンデは死亡した。
      アメリカの関与は、後に公開された文書で確認されている。

      ピノチェトは軍事評議会の議長から大統領になった。
      議会を閉鎖し、政党を禁止し、反対派を大規模に弾圧する。
      数千人が殺害または行方不明となり、数万人が拷問を受けた。
      近隣の独裁政権と連携して亡命者を追跡する作戦も行われる。

      経済では、シカゴで学んだ経済学者たちを登用した。
      国営企業の民営化、貿易の自由化、年金の私営化が進められる。
      成長率は回復したが、格差は拡大した。
      1988年の国民投票で続投が否決され、1990年に民政へ移行する。
      晩年はロンドンで逮捕され、国際的な裁判が試みられた。
      健康を理由に免れたが、独裁者が国外で訴追されうるという先例になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Augusto_Pinochet_foto_oficial.jpg/500px-Augusto_Pinochet_foto_oficial.jpg
      credit: Ministerio de Relaciones Exteriores de Chile. / CC BY 2.0 cl
      page: https://commons.wikimedia.org/wiki/File:Augusto_Pinochet_foto_oficial.jpg
    links:
