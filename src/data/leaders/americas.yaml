        url: https://ja.wikipedia.org/wiki/アウグスト・ピノチェト

  - id: reagan
    title: レーガン
    start: 1981
    end: 1989
    category: economy
    tags: [アメリカ, 新自由主義]
    summary: 減税と規制緩和、軍拡を同時に進め、冷戦終結の局面をソ連と作った。
    detail: |
      アメリカ合衆国の第40代大統領で、在任は1981年から1989年まで。
      減税と規制緩和、軍拡を同時に進め、冷戦の終結の局面をソ連と作った。

      俳優から州知事を経て大統領になった。
      演説の巧みさから、偉大な伝達者と呼ばれる。
      経済政策は、大幅な減税と規制の緩和、歳出の抑制を柱とした。
      供給側を重視する考え方にもとづき、投資と生産を促せば全体が潤うとされる。
      インフレは金融の引き締めによって収まり、成長も回復した。
      一方、財政赤字と貿易赤字は大幅に拡大し、格差も広がる。

      労働組合には強い姿勢で臨んだ。
      航空管制官のストライキに対し、1万人以上を解雇している。
      外交では、当初ソ連を悪の帝国と呼び、軍備を大幅に拡張した。
      宇宙空間での迎撃構想も打ち出す。

      ゴルバチョフが登場すると、態度を変えた。
      複数回の首脳会談を重ね、1987年に中距離核戦力の全廃条約を結ぶ。
      特定の種類の核兵器を全廃する初めての条約である。
      中米への介入をめぐる事件では、議会に諮らない資金の流れが問題になった。
      小さな政府と強い軍という組み合わせは、以後の保守政治の基本になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Ronald_Reagan_1985_presidential_portrait_%281%29.jpg/500px-Ronald_Reagan_1985_presidential_portrait_%281%29.jpg
      credit: ピート・ソウザ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ronald_Reagan_1985_presidential_portrait_(1).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ロナルド・レーガン

  - id: bill-clinton
    title: クリントン
    start: 1993
    end: 2001
    category: economy
    tags: [アメリカ, グローバル化]
    summary: 冷戦後の好況とNAFTA・WTOで、グローバル化を政策として推し進めた。
    detail: |
      アメリカ合衆国の第42代大統領で、在任は1993年から2001年まで。
      冷戦後の好況を背景に、グローバル化を政策として推し進めた。

      46歳での就任で、戦後生まれの最初の大統領である。
      経済では、財政赤字の削減を優先した。
      増税と歳出の抑制によって、在任の末期には財政が黒字になる。
      情報技術への投資が伸び、長期の好況が続いた。

      通商では、北米自由貿易協定を発効させ、世界貿易機関の設立を主導した。
      中国の加盟にも道を開く。
      国境を越えた生産と投資が拡大した。
      医療保険の改革は議会の反対で挫折する。
      福祉の制度は、就労を条件とする方向へ改められた。

      外交では、バルカン半島の紛争に介入し、和平を仲介した。
      中東和平の交渉も進めたが、最終的な合意には至らない。
      ルワンダでの虐殺に対応しなかったことは、後に自ら誤りとして認めている。
      私的な関係をめぐる問題から、下院で弾劾訴追を受けた。
      上院で無罪となり、任期を全うする。
      冷戦の終結後、市場の拡大と民主主義の広がりが続くという楽観が共有された時期にあたる。
      その前提は、その後の20年で問い直されることになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/Bill_Clinton.jpg/500px-Bill_Clinton.jpg
      credit: Bob McNeely, The White House[1] / Public domain
      page: https://commons.wikimedia.org/wiki/File:Bill_Clinton.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ビル・クリントン

  - id: george-w-bush
    title: ブッシュ（子）
    start: 2001
    end: 2009
    category: war
    tags: [アメリカ, 対テロ戦争]
    summary: 同時多発テロ後にアフガン・イラクへ派兵し、対テロ戦争の時代を始めた。
    detail: |
      アメリカ合衆国の第43代大統領で、在任は2001年から2009年まで。
      同時多発テロの後にアフガニスタンとイラクへ派兵し、対テロ戦争の時代を始めた。

      2000年の選挙は、フロリダ州の集計をめぐって争われた。
      最高裁の判断によって当選が確定する。
      就任の8か月後、2001年9月11日に同時多発テロが起きた。
      旅客機が世界貿易センターと国防総省に突入し、約3000人が死亡する。

      対応は速かった。
      首謀者を匿うとしてアフガニスタンを攻撃し、タリバン政権を倒す。
      国内では愛国者法が成立し、監視の権限が大幅に拡大した。
      2003年、大量破壊兵器を保有しているとしてイラクに侵攻する。
      国連の決議は得られなかった。
      政権はすぐに崩壊したが、大量破壊兵器は発見されず、その後の占領は長期の混乱に陥る。

      捕虜の扱いをめぐっても批判を受けた。
      グアンタナモの収容施設と、尋問での拷問に近い手法が問題になる。
      国内では減税と教育の改革を進めた。
      2005年のハリケーンへの対応の遅れは、強い批判を浴びる。
      任期の末期に金融危機が発生し、大規模な救済策がとられた。
      対テロという枠組みが、その後の20年の国際政治を規定することになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/George-W-Bush.jpeg/500px-George-W-Bush.jpeg
      credit: エリック・ドレイパー / Public domain
      page: https://commons.wikimedia.org/wiki/File:George-W-Bush.jpeg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジョージ・W・ブッシュ

  - id: lula
    title: ルラ
    start: 2003
    end: 2010
    category: society
    tags: [ブラジル, 貧困対策]
    summary: 労働組合出身の大統領として現金給付で貧困を減らし、南南外交を進めた。
    detail: |
      ブラジルの大統領で、在任は2003年から2010年まで、さらに2023年から再び務めている。
      労働組合の指導者から大統領になった。
      現金給付によって貧困を減らし、南南外交を進めた。

      貧しい家庭に生まれ、小学校を出た後に旋盤工として働いた。
      労働運動の指導者として軍政下でストライキを組織し、労働者党を結成する。
      大統領選に三度落選した後、四度目で当選した。
      就任時、市場は急進的な政策を警戒した。
      しかし財政の規律を守り、インフレを抑えることを優先する。

      特徴的な政策が、条件付きの現金給付である。
      子どもを学校に通わせ、健康診断を受けさせることを条件に、貧困世帯へ現金を支給する。
      対象は数千万人に及び、貧困率は大きく下がった。
      同様の仕組みが各国で採用されている。

      資源の輸出によって経済は成長し、中間層が拡大した。
      外交では、新興国との関係を重視し、南の国々の連携を訴える。
      退任後、汚職の容疑で収監された。
      有罪判決は後に手続きの問題から無効とされ、2022年の選挙で再び当選する。
      労働者出身の指導者が経済の安定と再分配を両立させた例として、また司法と政治の関係をめぐる事例として、議論が続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Foto_oficial_de_Luiz_In%C3%A1cio_Lula_da_Silva_%28estreita%29.jpg/500px-Foto_oficial_de_Luiz_In%C3%A1cio_Lula_da_Silva_%28estreita%29.jpg
      credit: Palácio do Planalto from Brasilia, Brasil / CC BY 2.0
      page: https://commons.wikimedia.org/wiki/File:Foto_oficial_de_Luiz_In%C3%A1cio_Lula_da_Silva_(estreita).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ルイス・イナシオ・ルーラ・ダ・シルヴァ

  - id: obama
    title: オバマ
    start: 2009
    end: 2017
    category: politics
    tags: [アメリカ]
    summary: 初の黒人大統領として金融危機に対処し、医療保険改革を実現した。
    detail: |
      アメリカ合衆国の第44代大統領で、在任は2009年から2017年まで。
      初の黒人大統領である。
      金融危機に対処し、医療保険の改革を実現した。

      ケニア出身の父とアメリカ人の母のもとに生まれ、ハワイとインドネシアで育った。
      弁護士と地域の組織活動を経て上院議員になり、無名に近い状態から大統領選に勝利する。
      就任時、経済は金融危機の直後にあった。
      大規模な景気対策と自動車産業の救済を実行し、金融規制を強化する法も成立させた。

      最大の国内政策が医療保険の改革である。
      保険に加入していない数千万人を減らすことを目的とし、加入の義務と補助、既往症による加入拒否の禁止が定められた。
      激しい論争を経て成立し、以後も政治の争点であり続ける。
      外交では、イラクから撤退し、イランとの核合意とキューバとの国交回復を実現した。
      地球温暖化のパリ協定にも参加する。
      一方、無人機による攻撃を多用し、シリアへの対応は批判を受けた。

      就任の年にノーベル平和賞を受けたが、実績に先立つ受賞として議論を呼ぶ。
      人種の問題が解決したわけではないことも、任期中の事件を通じて明らかになった。
      象徴としての意味と、具体的な成果の双方が評価の対象になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8d/President_Barack_Obama.jpg/500px-President_Barack_Obama.jpg
      credit: Official White House Photo by Pete Souza / Public domain
      page: https://commons.wikimedia.org/wiki/File:President_Barack_Obama.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/バラク・オバマ

  - id: trump
    title: トランプ（第1期）
    start: 2017
    end: 2021
    category: politics
    tags: [アメリカ, 自国第一]
    summary: 既存の同盟と自由貿易の前提を揺さぶり、支持者の分断そのものを力に変えた。
    detail: |
      アメリカ合衆国の第45代大統領で、在任は2017年から2021年まで。
      不動産業とテレビ番組から政界に入り、既存の政治の前提を揺さぶった。

      公職の経験がないまま共和党の候補になり、2016年の選挙で勝利した。
      総得票では下回りながら、選挙人の数で上回る結果である。
      政策では、大型の減税と規制の緩和を進めた。
      国境の壁の建設と移民の制限を掲げ、入国を制限する大統領令を出す。
      パリ協定とイランの核合意から離脱した。

      通商では、中国への関税を段階的に引き上げ、貿易戦争と呼ばれる状態になった。
      北米の貿易協定も再交渉している。
      同盟国に対しても負担の増額を求め、従来の前提を問い直した。
      北朝鮮の指導者と三度会談したが、合意には至っていない。
      報道機関を敵と呼び、ソーシャルメディアで直接発信する手法をとった。
      情報の扱いをめぐる対立が深まる。

      2019年に弾劾訴追を受け、上院で無罪となった。
      2020年の選挙で敗れた後も結果を認めず、支持者が議事堂を襲撃する事件が起きる。
      これを受けて二度目の弾劾訴追を受けた。
      支持と反発が同時に強く、社会の分断を可視化した政権だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Official_Presidential_Portrait_of_President_Donald_J._Trump_%282025%29.jpg/500px-Official_Presidential_Portrait_of_President_Donald_J._Trump_%282025%29.jpg
      credit: ダニエル・トロック / Public domain
      page: https://commons.wikimedia.org/wiki/File:Official_Presidential_Portrait_of_President_Donald_J._Trump_(2025).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ドナルド・トランプ

  - id: biden
    title: バイデン
    start: 2021
    end: 2025
    category: politics
    tags: [アメリカ]
    summary: 同盟の立て直しと大型の産業政策を進め、ウクライナ支援を主導した。
    detail: |
      アメリカ合衆国の第46代大統領で、在任は2021年から2025年まで。
      同盟の立て直しと大型の産業政策を進め、ウクライナ支援を主導した。

      上院議員を36年務め、オバマ政権では副大統領だった。
      78歳での就任は、歴代で最高齢である。
      就任時、新型コロナウイルスの流行が続いていた。
      ワクチンの接種を急速に進め、大規模な給付を含む経済対策を実行する。

      続いて、インフラの更新、半導体の国内生産、気候変動への投資を定める法を成立させた。
      産業政策によって国内の製造業を再建するという方向である。
      外交では、前政権が距離を置いた同盟と国際的な枠組みへ復帰した。
      パリ協定に戻り、NATOとの関係を修復する。

      2021年のアフガニスタンからの撤退は、混乱のなかで行われて批判を受けた。
      翌年、ロシアがウクライナに侵攻すると、西側の支援をまとめる役割を担う。
      軍事と財政の支援を続け、制裁の枠組みを主導した。
      国内では物価の上昇が続き、支持率は低迷する。
      2024年、高齢をめぐる懸念から再選の出馬を取りやめた。
      同盟を基盤とする外交と、国家が産業に関与する経済政策という二つの方針が、この政権の特徴である。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/バイデン

  - id: trump-second
    title: トランプ（第2期）
    start: 2025
    ongoing: true
    category: politics
    tags: [アメリカ, 関税]
    summary: 4年をおいて返り咲き、関税と対外関与の見直しを一段と強めている。
    detail: |
      ドナルド・トランプが4年をおいて大統領に復帰した任期で、2025年1月に始まった。
      一度退いた大統領が返り咲いた例は、19世紀以来である。

      2024年の選挙では、物価の上昇と移民の問題が主要な争点になった。
      選挙運動の期間中に銃撃を受ける事件もあり、対立候補は途中で交代している。
      結果は、総得票でも上回る勝利だった。
      就任の直後から、大統領令による政策の転換が相次いだ。
      移民の取り締まりを強化し、パリ協定と一部の国際的な枠組みから再び離脱する。
      連邦政府の人員と支出の削減も進められた。

      通商では関税を主要な手段として用いている。
      幅広い品目と多くの国を対象に関税を課し、各国との個別の交渉を進める方針である。
      世界の貿易と市場に大きな影響が及んだ。

      対外関与については、同盟国に一層の負担を求める姿勢が強い。
      ウクライナと中東をめぐる交渉にも、直接に関与している。
      司法との関係も論点になってきた。
      大統領令の一部が裁判所で差し止められ、権限の範囲をめぐる争いが続く。
      任期はまだ途中であり、評価は定まっていない。
      国際秩序のなかでアメリカがどう振る舞うかという前提が、この時期に大きく動いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Official_Presidential_Portrait_of_President_Donald_J._Trump_%282025%29.jpg/500px-Official_Presidential_Portrait_of_President_Donald_J._Trump_%282025%29.jpg
      credit: ダニエル・トロック / Public domain
      page: https://commons.wikimedia.org/wiki/File:Official_Presidential_Portrait_of_President_Donald_J._Trump_(2025).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ドナルド・トランプ
