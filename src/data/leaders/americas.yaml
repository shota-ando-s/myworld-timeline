        url: https://ja.wikipedia.org/wiki/トーマス・ジェファーソン

  - id: san-martin
    title: サン・マルティン
    start: 1817
    end: 1822
    category: war
    tags: [南米, 独立]
    summary: アンデスを越えてチリ・ペルーを解放し、南から独立戦争を進めた。
    detail: |
      南米の独立戦争を南から進めた軍人で、1817年から1822年にかけて活動した。
      アンデスを越えてチリとペルーを解放した。

      アルゼンチンに生まれ、スペインで軍人として育った。
      南米の独立運動が始まると、母国へ戻って参加する。
      構想は明確だった。
      ブエノスアイレスからペルーへ北上するのではなく、チリを解放して海路でペルーを攻めるという計画である。

      数年をかけて軍を組織し、装備を整えた。
      1817年、5000人余りの軍でアンデス山脈を越える。
      標高4000メートルを超える峠を、複数の経路に分かれて進んだ。
      多数の兵と家畜を失いながら、チリ側に降りて敵を奇襲する。
      チリの解放を果たした後、海軍を組織してペルーへ向かった。
      1821年にリマを占領し、独立を宣言する。

      1822年、グアヤキルでボリバルと会談した。
      内容は記録に残っていない。
      会談の後、サン・マルティンはすべての地位を退き、ヨーロッパへ去る。
      主導権を譲ることで対立を避けたとみられる。
      残りの生涯をフランスで過ごし、南米へ戻ることはなかった。
      権力に執着しなかった軍人として、アルゼンチンとチリ、ペルーで国民的な英雄とされている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/Jos%C3%A9_de_San_Mart%C3%ADn_%28retrato%2C_c.1828%29.jpg/500px-Jos%C3%A9_de_San_Mart%C3%ADn_%28retrato%2C_c.1828%29.jpg
      credit: The exact author is disputed. Some sources attribute it to Jean Baptiste Madou, others to the art teacher of San Martin's daughter, and others suspect it to be the work of many different people. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Jos%C3%A9_de_San_Mart%C3%ADn_(retrato,_c.1828).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ホセ・デ・サン＝マルティン

  - id: bolivar
    title: ボリバル
    start: 1819
    end: 1830
    category: politics
    tags: [南米, 独立]
    summary: 北から南米の独立を導き、統一国家の夢は果たせず「解放者」と呼ばれた。
    detail: |
      南米北部の独立を導いた指導者で、1819年から1830年まで活動した。
      解放者と呼ばれる。
      統一国家の構想は実現しなかった。

      ベネズエラの富裕な家に生まれ、ヨーロッパで啓蒙思想に触れた。
      独立運動に加わり、何度も敗れては亡命し、そのつど戻って戦い続ける。
      転機は1819年である。
      雨季の平原と標高4000メートルの峠を越えるという無謀な行軍で、防備の薄いボゴタを突いた。
      この勝利によって現在のコロンビアが解放される。

      続いてベネズエラ、エクアドルを解放し、大コロンビアという統一国家を作った。
      さらに南へ進み、ペルーとボリビアの解放にも関わる。
      ボリビアの国名は、彼の名に由来する。
      構想は、独立した諸国が連合してヨーロッパの大国に対抗することだった。
      1826年に会議を招集したが、参加は限られ、成果は上がらない。

      各地では、地域ごとの利害と有力者の対立が強まった。
      大コロンビアは分裂へ向かい、ボリバルは独裁的な権限で統合を保とうとして反発を招く。
      暗殺未遂にも遭った。
      1830年、失意のうちに没する。
      南米を統治することは海を耕すようなものだ、という言葉が伝えられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Sim%C3%B3n_Bol%C3%ADvar._Toro_Moreno%2C_Luis._1922%2C_Legislative_Palace%2C_La_Paz.png/500px-Sim%C3%B3n_Bol%C3%ADvar._Toro_Moreno%2C_Luis._1922%2C_Legislative_Palace%2C_La_Paz.png
      credit: Luis Enrique Toro Moreno (1897-1933) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Sim%C3%B3n_Bol%C3%ADvar._Toro_Moreno,_Luis._1922,_Legislative_Palace,_La_Paz.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シモン・ボリバル

  - id: andrew-jackson
    title: ジャクソン
    start: 1829
    end: 1837
    category: politics
    tags: [アメリカ, 民主化]
    summary: 庶民の支持で当選した一方、先住民強制移住という汚点も残した。
    detail: |
      アメリカ合衆国の第7代大統領で、在任は1829年から1837年まで。
      庶民の支持を背景に当選し、大統領の権限を大きく用いた。
      先住民の強制移住という汚点も残している。

      開拓地の貧しい家に生まれ、独立戦争を少年時代に経験した。
      弁護士から軍人となり、1815年のニューオーリンズの戦いで名を上げる。
      当時、選挙権は各州で拡大しつつあった。
      地主層でない出自の人物が、大衆の支持で大統領になったことは新しい現象である。
      支持者に官職を与える手法も、この時期に広がった。

      連邦の銀行を廃止し、州の権限を主張する動きには強く対抗した。
      拒否権を積極的に用い、大統領の職の性格を変える。
      最大の汚点が、先住民の強制移住である。
      1830年に法を成立させ、東部の諸部族を西へ移住させた。
      チェロキーは最高裁で有利な判決を得たが、それは無視される。
      移動の途上で多数が死亡し、涙の道と呼ばれた。

      自らも奴隷を所有していた。
      民主主義の拡大を体現した人物として長く評価されてきたが、その拡大が白人男性に限られていたこと、先住民と黒人を排除したことへの批判が近年強まっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Andrew_jackson_head.jpg/500px-Andrew_jackson_head.jpg
      credit: ラルフ・エリエザー・ホワイトサイド / Public domain
      page: https://commons.wikimedia.org/wiki/File:Andrew_jackson_head.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アンドリュー・ジャクソン

  - id: juarez
    title: フアレス
    start: 1858
    end: 1872
    category: politics
    tags: [メキシコ, 改革]
    summary: 先住民出身の大統領としてフランスの介入を退け、教会の特権を削った。
    detail: |
      メキシコの大統領で、1858年から1872年まで断続的にその職にあった。
      先住民の出身で、フランスの介入を退け、教会の特権を削った。

      サポテカの村に生まれ、12歳まではスペイン語を話さなかったとされる。
      奉公先の支援で学校に通い、法律を学んで弁護士になった。
      自由主義の立場から改革を進めた。
      教会と軍が持つ特別な裁判権を廃し、教会の所有する土地を売却させる。
      1857年の憲法で、政教の分離と個人の権利が定められた。

      保守派はこれに反発し、内戦になる。
      3年の戦いの末に自由派が勝った。
      しかし戦費で財政は破綻し、対外債務の支払いを停止した。
      これを口実にフランスが侵攻し、ハプスブルク家のマクシミリアンを皇帝として擁立する。

      フアレスは首都を離れ、馬車に政府を載せて各地を移動しながら抵抗した。
      アメリカが南北戦争を終えてフランスに圧力をかけると、軍は撤退する。
      1867年、マクシミリアンは捕らえられて処刑された。
      共和国を回復した後も、教育の普及と近代化を進める。
      諸国民のあいだの尊重が平和である、という言葉が残されている。
      先住民出身者が国家の頂点に立った事実は、ラテンアメリカでも例外的である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Presidente_Benito_Pablo_Ju%C3%A1rez_Garc%C3%ADa.jpg/500px-Presidente_Benito_Pablo_Ju%C3%A1rez_Garc%C3%ADa.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Presidente_Benito_Pablo_Ju%C3%A1rez_Garc%C3%ADa.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ベニート・フアレス

  - id: lincoln
    title: リンカン
    start: 1861
    end: 1865
    category: society
    tags: [アメリカ, 南北戦争]
    summary: 分裂の危機に連邦を保ち、奴隷解放を戦争目的として掲げた。
    detail: |
      アメリカ合衆国の第16代大統領で、在任は1861年から1865年まで。
      分裂の危機に連邦を保ち、奴隷解放を戦争の目的として掲げた。

      開拓地の丸太小屋に生まれ、ほとんど独学で法律を学んだ。
      奴隷制の新しい州への拡大に反対する立場で、共和党の候補として当選する。
      当選と同時に、南部の州が次々に連邦を離脱した。
      就任の翌月、南北戦争が始まる。

      当初、彼は奴隷制の即時廃止を掲げていなかった。
      連邦を保つことが最優先だと述べ、そのために奴隷制を残すことも辞さないと書いている。
      戦局と世論の変化のなかで、方針を転換した。
      1863年の奴隷解放宣言で、反乱州の奴隷の解放を宣言する。
      軍事的な措置という形をとったが、戦争の意味を変えた。

      同じ年のゲティスバーグでの演説は、わずか2分の短いものだった。
      人民の、人民による、人民のための政治という言葉で、この戦争が民主主義そのものの試練であると述べる。
      1865年、奴隷制を廃止する憲法修正が議会を通過した。
      戦争の終結から数日後、劇場で銃撃されて死亡する。
      再建をどう進めるかという最も難しい課題は、後継者に残された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ab/Abraham_Lincoln_O-77_matte_collodion_print.jpg/500px-Abraham_Lincoln_O-77_matte_collodion_print.jpg
      credit: アレクサンダー・ガードナー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Abraham_Lincoln_O-77_matte_collodion_print.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エイブラハム・リンカーン

  - id: porfirio-diaz
    title: ディアス
    start: 1876
    end: 1911
    category: economy
    tags: [メキシコ, 開発独裁]
    summary: 外資による近代化と長期独裁が、メキシコ革命の火種になった。
    detail: |
      メキシコの大統領で、1876年から1911年まで30年以上統治した。
      外国資本による近代化と長期の独裁を並行させた。
      その矛盾がメキシコ革命の火種になる。

      軍人としてフランスの介入との戦いで功績を上げ、クーデタによって政権を得た。
      再選の禁止を掲げて権力を握りながら、自らは再選を重ねる。
      統治の方針は、秩序と進歩だった。
      鉄道が2万キロ以上敷かれ、鉱山と油田が開発され、電信と港湾が整備される。
      外国資本を優遇し、アメリカとイギリスの企業が主要な産業を握った。

      治安の維持には、騎馬警察が用いられた。
      反対派は投獄されるか殺され、報道は統制される。
      選挙は形式的に行われた。
      農村では、共同体の土地が測量によって取り上げられ、大農園に集められた。
      人口の大半が土地を持たない労働者になり、負債によって縛られる。
      1910年、大統領はメキシコが選挙の準備ができたと外国の記者に語った。
      対立候補が現れると投獄し、自らの当選を宣言する。

      これが蜂起を招いた。
      翌年、各地の反乱によって辞任し、フランスへ亡命する。
      経済成長が政治の正統性を保証しないことを示す事例として語られてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/Porfirio_diaz.jpg/500px-Porfirio_diaz.jpg
      credit: Aurelio Escobar Castellanos, Archive / Public domain
      page: https://commons.wikimedia.org/wiki/File:Porfirio_diaz.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ポルフィリオ・ディアス

  - id: theodore-roosevelt
    title: セオドア・ローズヴェルト
    start: 1901
    end: 1909
    category: politics
    tags: [アメリカ, 帝国主義]
    summary: パナマ運河を進め、アメリカを世界の大国として振る舞わせ始めた。
    detail: |
      アメリカ合衆国の第26代大統領で、在任は1901年から1909年まで。
      パナマ運河を進め、アメリカを世界の大国として振る舞わせ始めた。

      前任者の暗殺によって42歳で就任した。
      最年少の大統領である。
      国内では、巨大企業への規制を進めた。
      独占的な企業の分割を求めて訴訟を起こし、労働争議では労使の調停に乗り出す。
      食品と医薬品の検査を定める法を作り、国立公園と保護区を大幅に広げた。

      外交では、こん棒を携えて穏やかに話すという言葉で知られる方針をとった。
      海軍を増強し、艦隊を世界一周させて力を示す。
      パナマ運河の建設が最大の事業である。
      コロンビアが条約を拒むと、パナマの独立運動を支援して独立を承認し、新政府と条約を結んだ。
      運河地帯の権利を得て、工事が進められる。

      モンロー宣言を拡張し、カリブ海と中米で秩序が乱れた場合にアメリカが介入すると宣言した。
      以後の介入の根拠になる。
      日露戦争の講和を仲介し、ノーベル平和賞を受けた。
      自然保護と企業規制を進めた進歩的な面と、他国への介入を当然とした面が同居している。
      大統領の職を積極的に用いるという現代的な型を作った人物でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/Theodore_Roosevelt_by_the_Pach_Bros_%284x5_cropped%29.jpg/500px-Theodore_Roosevelt_by_the_Pach_Bros_%284x5_cropped%29.jpg
      credit: Adam Cuerden / Public domain
      page: https://commons.wikimedia.org/wiki/File:Theodore_Roosevelt_by_the_Pach_Bros_(4x5_cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/セオドア・ルーズベルト

  - id: woodrow-wilson
    title: ウィルソン
    start: 1913
    end: 1921
    category: politics
    tags: [アメリカ, 国際連盟]
    summary: 民族自決と国際連盟を掲げ、自国は加盟できないまま戦後秩序の理念を残した。
    detail: |
      アメリカ合衆国の第28代大統領で、在任は1913年から1921年まで。
      民族自決と国際連盟を掲げたが、自国は連盟に加われなかった。

      大学の教授と学長から政界に入った、異色の経歴を持つ。
      国内では、関税の引き下げ、連邦準備制度の創設、独占の規制を進めた。
      所得税の導入もこの時期である。
      一方、連邦政府の職場で人種の分離を進めたことは、大きな汚点とされる。

      第一次世界大戦では、当初は中立を保った。
      再選の選挙では、参戦を避けたことを掲げている。
      ドイツの無制限潜水艦作戦を受けて、1917年に参戦した。
      1918年、14か条の原則を示した。
      秘密外交の廃止、海洋の自由、軍備の縮小、民族自決、そして国際的な平和機構の設立である。

      講和会議では、これらの実現をめざした。
      しかし英仏は賠償と安全保障を優先し、条約は妥協の産物になる。
      民族自決もヨーロッパに限定して適用された。
      国際連盟の規約は条約に組み込まれたが、アメリカの上院が批准を拒否した。
      各国の紛争に自動的に巻き込まれることへの警戒からである。
      提唱国が加わらないまま、連盟は出発することになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/President_Woodrow_Wilson_Harris_%26_Ewing_%283x4_cropped_b%29.jpg/500px-President_Woodrow_Wilson_Harris_%26_Ewing_%283x4_cropped_b%29.jpg
      credit: Harris & Ewing, photographer / Public domain
      page: https://commons.wikimedia.org/wiki/File:President_Woodrow_Wilson_Harris_%26_Ewing_(3x4_cropped_b).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウッドロウ・ウィルソン

  - id: vargas
    title: ヴァルガス
    start: 1930
    end: 1945
    category: politics
    tags: [ブラジル, ポピュリズム]
    summary: 労働者を味方につける統治でブラジルの工業化と大衆政治の型を作った。
    detail: |
      ブラジルの指導者で、1930年から1945年まで、さらに1951年から54年まで政権にあった。
      労働者を味方につける統治で、工業化と大衆政治の型を作った。

      南部の州の知事から、1930年の革命によって政権を得た。
      コーヒーの輸出に依存する寡頭支配が、恐慌で行き詰まっていた時期である。
      1937年、クーデタによって議会を停止し、新国家と呼ばれる体制を敷いた。
      憲法を停止し、政党を解散させ、報道を統制する。

      一方で、労働者への政策は手厚かった。
      最低賃金、8時間労働、有給休暇、年金の制度を整える。
      労働組合は政府の管理下に置かれ、指導者は政府が承認した。
      権利を与えつつ統制するという方式である。

      経済では、国家が主導する工業化を進めた。
      製鉄所と石油の公社が設立され、輸入に頼らない生産をめざす。
      第二次世界大戦では、当初は枢軸国にも近い姿勢を見せたが、最終的に連合国側で参戦した。
      民主主義のために戦いながら国内では独裁という矛盾が問われ、1945年に軍によって退任させられる。
      1950年、選挙で大統領に復帰した。
      汚職の疑惑と軍の圧力のなか、1954年に自殺する。
      労働者の支持を基盤とする政治の形は、その後のラテンアメリカに広く現れた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Getulio_Vargas_%281930%29.jpg/500px-Getulio_Vargas_%281930%29.jpg
      credit: Governo do Brasil / Public domain
      page: https://commons.wikimedia.org/wiki/File:Getulio_Vargas_(1930).jpg
    links:
