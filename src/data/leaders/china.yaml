    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/武則天

  - id: tang-xuanzong
    title: 玄宗
    start: 712
    end: 756
    category: politics
    tags: [中国, 唐]
    summary: 唐の絶頂と安史の乱による転落を1代で味わい、盛衰の教材になった治世。
    detail: |
      唐の第6代皇帝で、在位は712年から756年まで。
      前半の開元の治は唐の絶頂とされ、後半は安史の乱で唐が傾いた時期にあたる。
      一代のうちに盛と衰の両方を経験した治世である。

      則天武后の退位後に続いた宮廷の混乱を、自ら兵を動かして収めて即位した。
      姚崇・宋璟といった有能な宰相を用い、冗官を整理して財政を立て直す。
      戸籍から漏れた人々を登録し直し、税収を回復させた。
      長安の人口は100万に達し、詩人や画家が集まって文化は最も華やかになる。

      しかし、均田制の崩れとともに府兵制が成り立たなくなった。
      職業兵を雇う募兵制に切り替え、辺境の軍権を節度使に集中させる。
      晩年は楊貴妃を寵愛して政治への関心を失い、その一族の楊国忠が実権を握った。
      755年、三つの節度使を兼ねていた安禄山が挙兵する。

      長安を追われて蜀へ逃れる途中、兵の要求で楊貴妃は殺された。
      玄宗は皇太子に位を譲って上皇となり、762年に没する。
      この転落は、白居易の『長恨歌』をはじめ数多くの文学の題材になった。
      有能な君主が長い治世のうちに緩んでいく過程として、繰り返し教訓に引かれる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/玄宗

  - id: abaoji
    title: 耶律阿保機
    start: 916
    end: 926
    category: politics
    tags: [契丹, 遼]
    summary: 遊牧民と農耕民を別々の制度で治める二重統治を考え出し、征服王朝の型を作った。
    detail: |
      契丹を統一して遼を建てた人物で、在位は916年から926年まで。
      生年は872年で、契丹八部のうち有力な一族に生まれた。
      中国の北辺に長く続く征服王朝の型を作った点で、遊牧史でも重要な位置にある。

      契丹は本来、部族の長が集まって君主を選び直す仕組みを持っていた。
      阿保機は周辺の部族や北中国への遠征で戦果を重ね、選び直しの慣行を退けて地位を世襲に変える。
      916年に皇帝を称し、年号を立てて中国風の王朝の形を整えた。

      支配下には、草原の遊牧民と、農耕を営む漢人や渤海の人々の双方が入っていた。
      阿保機は両者を同じ制度で治めることをせず、それぞれの慣習に合わせた別々の組織を置く。
      遊牧民は部族ごとの編成で、漢人は州や県を設けて中国式に治めた。
      この二重統治は、のちの金・元・清まで受け継がれる征服王朝の基本になる。
      漢字を参考にした契丹文字を作らせ、独自の記録も残した。

      926年、東方の渤海を滅ぼして東丹国を置いた直後に病没する。
      死後は皇后の述律氏が実権を握り、後継をめぐる争いが起きた。
      燕雲十六州を得るのは次の世代だが、南へ関心を向ける方向はこの代に定まっている。
      中央アジアからロシアにかけて中国がキタイの名で呼ばれたのは、この国に由来する。
      草原の君長が、遊牧の伝統を捨てずに帝国を運営する道を示した人物である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/%E5%A4%AA%E9%98%B3%E6%B9%96%E5%85%AC%E5%9B%AD_-_%E8%80%B6%E5%BE%8B%E9%98%BF%E4%BF%9D%E6%9C%BA%E5%83%8F_-_2024-05-30_03.jpg/500px-%E5%A4%AA%E9%98%B3%E6%B9%96%E5%85%AC%E5%9B%AD_-_%E8%80%B6%E5%BE%8B%E9%98%BF%E4%BF%9D%E6%9C%BA%E5%83%8F_-_2024-05-30_03.jpg
      credit: 瑞丽江的河水 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:%E5%A4%AA%E9%98%B3%E6%B9%96%E5%85%AC%E5%9B%AD_-_%E8%80%B6%E5%BE%8B%E9%98%BF%E4%BF%9D%E6%9C%BA%E5%83%8F_-_2024-05-30_03.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/耶律阿保機

  - id: song-taizu
    title: 太祖 趙匡胤
    start: 960
    end: 976
    category: politics
    tags: [中国, 宋, 文治]
    summary: 武将の兵権を平和裏に取り上げ、文官が軍を統べる文治主義を定着させた。
    detail: |
      北宋の初代皇帝で、在位は960年から976年まで。
      後周の親衛軍の長だったところを部下に擁立され、皇帝になった。
      武人の時代を終わらせ、文官が政治を担う体制へ切り替えた人物である。

      960年、北方への出陣の途中、陳橋駅で部下たちに黄色い衣を着せられて擁立された。
      都へ引き返して後周の幼い皇帝から位を譲られ、宋を建てる。
      自身が兵の力で立った経験から、同じことが繰り返されないよう手を打った。
      有力な武将たちを酒宴に招き、兵権を返せば富貴を保証すると説いて、平和裏に退かせたと伝わる。
      禁軍を再編して指揮官をたびたび入れ替え、軍を動かす権限と統率する権限を分けた。
      地方の節度使から財政と司法の権限を取り上げ、文官を送って州を治めさせる。
      科挙の枠を広げ、殿試を設けて合格者が皇帝の門下となる形を作った。

      対外では、先に南を平定してから北へ向かうという方針をとった。
      荊南・後蜀・南漢・南唐を順に併せ、統一の大半を生前に進めている。
      976年に急死し、弟の太宗が跡を継いだが、その経緯には古くから疑いがささやかれてきた。

      武力で立った者が、武力の芽を制度で摘むという選択がこの治世の核心である。
      以後の中国では、軍人が政権を奪う事態が目に見えて減った。
      代わりに軍は弱くなり、北方の王朝に対する劣勢が宋の宿命になる。
      文治主義という言葉で語られる統治の型は、ここから東アジアに広がった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Song_Taizu.jpg/500px-Song_Taizu.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Song_Taizu.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/趙匡胤

  - id: song-shenzong
    title: 神宗
    start: 1067
    end: 1085
    category: politics
    tags: [中国, 宋, 改革]
    summary: 王安石を起用して財政と軍制の大改革に踏み切り、以後の党争の火種にもなった。
    detail: |
      北宋の第6代皇帝で、在位は1067年から1085年まで。
      20歳で即位し、王安石を登用して大規模な改革に踏み切った。
      宋の政治を二分する党争の起点になった治世である。

      当時の宋は、官僚と軍人の数が膨れ上がって財政が慢性的に赤字だった。
      遼と西夏へ毎年贈る歳幣も重く、軍は数のわりに弱い。
      神宗はこの状態を変えようとし、地方で実績のあった王安石を宰相格に引き上げた。
      1069年から新法と呼ばれる政策が次々に打ち出される。
      農民に低利で資金を貸す青苗法、労役を金納に替える募役法、民兵を組織する保甲法などが並んだ。
      国家が経済に積極的に関与し、税収を増やして軍を強くするという方向である。
      司馬光ら多くの官僚が、民の負担が増え、国が商売に手を出すものだと反発した。

      対外では西夏へ攻勢をかけたが、1081年からの遠征は大敗に終わる。
      この失敗は神宗に大きな打撃を与え、改革の勢いも鈍った。
      1085年に38歳で没すると、幼い皇帝の後見となった太皇太后が司馬光を呼び戻し、新法はほとんど廃止される。

      以後、皇帝が代わるたびに新法党と旧法党が入れ替わり、政策が揺れ続けた。
      人材は敵味方で選ばれ、有能な官僚が地方へ追われる事態が繰り返される。
      改革の是非以上に、党争が宋の政治を弱らせたという見方は根強い。
      国家が経済に介入して財政を立て直す試みとしては、中国史で最も大規模なものだった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/84/Shenzong.jpg/500px-Shenzong.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Shenzong.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/神宗_(宋)

  - id: song-huizong
    title: 徽宗
    start: 1100
    end: 1126
    category: culture
    tags: [中国, 宋, 芸術]
    summary: 一流の画家・書家でありながら国を守れず、金の捕虜となって北宋を終わらせた。
    detail: |
      北宋の第8代皇帝で、在位は1100年から1126年まで。
      書画に優れ、中国史でも屈指の芸術家として知られる。
      その一方で政治には無関心で、北宋の滅亡を招いた皇帝でもある。

      兄の急死で思いがけず帝位に就いた。
      痩金体と呼ばれる独特の書体を生み、花鳥画を描き、宮廷に画院を整えて画家を育てる。
      古美術の収集と分類も進め、その目録は美術史の基本文献になった。
      政治は蔡京らに委ね、新法の名を借りた党争と増税が続く。
      庭園を造るため各地から珍しい石や木を運ばせた花石綱は、沿道の人々を苦しめた。
      道教に深く傾倒し、自らを道君皇帝と称して巨額を注ぎ込む。
      重い負担に耐えかねて、江南では方臘の乱が起きた。

      外交では、新興の金と結んで遼を挟み撃ちにする海上の盟を選ぶ。
      遼は滅んだが、宋軍の弱さが金に見透かされ、矛先はそのまま宋へ向かった。
      1125年に金が南下すると、徽宗は責任を負わずに子の欽宗へ位を譲る。
      1127年、都の開封が落ち、徽宗と欽宗は北へ連れ去られた。

      これを靖康の変と呼び、北宋はここで滅ぶ。
      徽宗は北の地で8年を過ごして没した。
      芸術の庇護者としての功績と、国を失った君主としての責任が、同じ一人に重なっている。
      才能と地位が噛み合わなかった例として、東アジアで繰り返し語られてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/Huizong.jpg/500px-Huizong.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Huizong.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/徽宗

  - id: aguda
    title: 完顔阿骨打
    start: 1115
    end: 1123
    category: war
    tags: [女真, 金]
    summary: 遼の支配を脱して金を建て、わずか十数年で華北を奪う勢いの出発点になった。
    detail: |
      金の初代皇帝で、在位は1115年から1123年まで。
      女真の完顔部の族長で、日本では完顔阿骨打の名で知られる。
      生年は1068年、遼の支配に抗して挙兵し、十数年で華北を奪う勢いの起点を作った。

      女真は遼に服属し、鷹や真珠、毛皮を貢納させられていた。
      遼の使者の横暴が積み重なり、1114年に阿骨打が兵を挙げる。
      最初の戦いでわずかな兵で遼の大軍を破り、周辺の部族が次々に加わった。
      1115年には皇帝を称し、国号を金と定める。

      金という国号は、川から採れる砂金にちなむとも、鉄は錆びるが金は変わらないという言葉によるとも伝えられる。
      阿骨打は部族の組織を猛安謀克という単位に編み直し、兵の動員と統治を一つにまとめた。
      女真語を書き表すための文字も、この時期に作らせている。
      遼の都を次々に落とし、宋とは同盟を結んで挟撃する約束を交わした。
      宋の軍が期待外れの働きしかできなかったことが、のちの南下の判断につながる。
      1123年、遼の滅亡を見届ける前に病没した。

      跡を継いだ弟の代に遼は滅び、続いて北宋も倒れる。
      短期間で辺境の部族が二つの大国を倒したこの流れは、モンゴルの台頭とよく比較される。
      遊牧・狩猟民の軍事的な機動力と、中国の制度を採り入れる速さが、その要因だった。
      阿骨打はその両方に道を開いた人物である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/3/31/Wanggiyan_Aguda.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Wanggiyan_Aguda.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/阿骨打

  - id: yue-fei
    title: 岳飛
    start: 1134
    end: 1141
    category: war
    tags: [中国, 南宋]
    summary: 金への反攻を主導しながら和平派に殺され、後世に忠義の象徴として祀られた。
    detail: |
      南宋の武将で、金への反攻を指揮した人物。
      1103年に生まれ、1142年の初めに獄中で殺された。
      中国では忠義の象徴として、長く神格化されてきた。

      華北の農民の家に生まれ、靖康の変の前後に兵として頭角を現す。
      率いた軍は岳家軍と呼ばれ、規律の厳しさで知られた。
      民家から物を取らず、凍えても家を壊して薪にしないという逸話が伝えられている。
      各地の反乱を鎮め、金に奪われた土地を次々に取り戻した。

      1140年、郾城で金の精鋭部隊を破り、開封に迫るところまで進む。
      しかし朝廷は金との和平を選んでおり、宰相の秦檜が撤退を命じた。
      一日に十二度の召還の命令が届いたと伝えられ、岳飛は引き返すほかなかった。
      翌年に兵権を取り上げられ、謀反の疑いで投獄される。

      罪状は、あったかもしれない、という曖昧な言葉で片づけられた。
      39歳で獄死し、その死は南宋の主戦論の終わりを意味した。
      名誉は20年後に回復され、杭州の岳王廟には秦檜夫妻がひざまずく像が置かれている。
      忠臣が奸臣に滅ぼされるという物語は、芝居や小説で繰り返し演じられてきた。
      近代以降は、民族の英雄として政治的に語られることも多い人物である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/%E5%B2%B3%E9%A3%9B.jpg/500px-%E5%B2%B3%E9%A3%9B.jpg
      credit: 劉松年繪 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:%E5%B2%B3%E9%A3%9B.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/岳飛

  - id: kublai-khan
    title: クビライ
    start: 1260
    end: 1294
    category: politics
    tags: [中国, モンゴル, 元]
    summary: 国号を元と定めて中国式の統治を敷き、遊牧帝国と中華王朝をひとつに重ねた。
    detail: |
      モンゴル帝国の第5代君主で、元の初代皇帝。
      1215年に生まれ、1260年に即位して1294年に没した。
      チンギス・ハンの孫にあたり、兄のモンケの死後に権力を握った。

      即位は、弟のアリクブケとの4年にわたる内戦を経て確定した。
      この争いを境に、モンゴル帝国は統一された一つの帝国ではなくなり、各地の政権が並び立つ形になる。
      クビライは重心を中国に置き、1271年に国号を大元と定めた。
      遊牧の君主でありながら、中国の王朝の作法にのっとって国を名づけたことが画期だった。

      1276年に南宋の都の臨安を接収し、1279年に南宋を滅ぼして中国全土を手にする。
      現在の北京に大都を築き、大運河を改修して南の米を運ばせた。
      駅伝の制度を整えてユーラシア各地を結び、紙幣の交鈔を全土で流通させる。
      チベット仏教の僧パスパに命じて、モンゴル語を書くための文字も作らせた。

      一方で、日本への二度の遠征は失敗し、ベトナムやジャワへの遠征も成果を得られなかった。
      国内では、モンゴル人・色目人・漢人・南人という序列で人を扱い、旧南宋の人々を下に置く。
      大都にはヨーロッパや西アジアの商人が訪れ、マルコ・ポーロの記述を通じてその富がヨーロッパに伝えられた。
      遊牧帝国の君主と中華王朝の皇帝という二つの顔を一人で担った点に、この人物の特徴がある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1b/YuanEmperorAlbumKhubilaiPortrait.jpg/500px-YuanEmperorAlbumKhubilaiPortrait.jpg
      credit: アラニコ / Public domain
      page: https://commons.wikimedia.org/wiki/File:YuanEmperorAlbumKhubilaiPortrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クビライ

  - id: hongwu
    title: 洪武帝 朱元璋
    start: 1368
    end: 1398
    category: politics
    tags: [中国, 明]
    summary: 貧農から皇帝になり、宰相を廃して皇帝ひとりに権力を集める形を作った。
    detail: |
      明の初代皇帝で、在位は1368年から1398年まで。
      1328年に貧しい農民の家に生まれ、飢饉で家族を失って寺に入り、托鉢で各地を歩いた。
      庶民から皇帝になった人物は、漢の劉邦とこの人だけである。

      紅巾の乱に加わって頭角を現し、長江下流の要地を押さえて勢力を広げた。
      ライバルの群雄を破って江南を統一し、1368年に南京で即位して元号を洪武と定める。
      同じ年、北伐の軍が大都を落とし、元の朝廷はモンゴル高原へ退いた。

      即位後は、権力を皇帝ひとりに集めることに徹した。
      1380年に宰相の胡惟庸を謀反の罪で処刑すると、中書省と丞相の職そのものを廃止する。
      以後、六部は皇帝に直属し、政務のすべてが皇帝の机に集まった。
      建国を助けた功臣も、疑いをかけて大量に処刑している。
      監察と密偵の組織を置き、官僚を厳しく監視した。

      農村では土地台帳と戸籍を整備し、里甲制で徴税と治安を村に担わせた。
      荒れた耕地の開墾を進め、戦乱で落ち込んだ人口と生産を回復させる。
      海禁を敷いて民間の海外渡航を禁じ、対外関係は朝貢に一本化した。
      皇帝への集権と、社会を細かく固定する仕組みが、明の性格を決めた。
      一方で宰相を欠いた体制は、後代に宦官や内閣大学士が実権を握る原因にもなる。
      猜疑心の強さと苛烈な粛清は、この皇帝の評価を分けてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/%E6%98%8E%E5%A4%AA%E7%A5%96%E7%94%BB%E5%83%8F.jpg/500px-%E6%98%8E%E5%A4%AA%E7%A5%96%E7%94%BB%E5%83%8F.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:%E6%98%8E%E5%A4%AA%E7%A5%96%E7%94%BB%E5%83%8F.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/朱元璋

  - id: yongle
    title: 永楽帝
    start: 1402
    end: 1424
    category: politics
    tags: [中国, 明]
    summary: 北京遷都と鄭和の大航海で、明の威信を内陸と海の双方に広げた。
    detail: |
      明の第3代皇帝で、在位は1402年から1424年まで。
      洪武帝の四男で、北平（のちの北京）を守る燕王だった。
      甥から帝位を奪って即位し、明の勢いを内外に広げた人物である。

      洪武帝の死後、跡を継いだ建文帝は、力を持つ叔父たちの削減に着手した。
      燕王は1399年に挙兵し、3年の内戦の末に南京を落とす。
      この争いを靖難の役と呼び、建文帝は宮中の火の中で行方を絶った。
      即位後は、建文帝に仕えた官僚を大量に処刑し、正統性を武力で押し通している。

      1421年、都を南京から北京へ移した。
      紫禁城を築き、大運河を改修して南の物資を北へ運ぶ体制を整える。
      モンゴルへは自ら五度にわたり親征し、北辺の防衛を皇帝が直接担う形を作った。
      南ではベトナムに侵攻して一時併合し、鄭和の艦隊をインド洋へ送っている。

      学問では、古今の書物を集めた『永楽大典』を編ませた。
      2万巻を超えるこの叢書は、当時の世界最大の百科事典だった。
      1424年、五度目のモンゴル遠征からの帰途に陣中で没する。
      対外的に最も積極的だった明の時代は、この治世に重なる。
      一方で、度重なる遠征と大事業は財政を圧迫し、死後は縮小へ向かった。
      都を北に置いた決定は、以後500年にわたり中国の政治の中心を決めている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/%E5%A4%AA%E5%AE%97%E6%96%87%E7%9A%87%E5%B8%9D.jpg/500px-%E5%A4%AA%E5%AE%97%E6%96%87%E7%9A%87%E5%B8%9D.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:%E5%A4%AA%E5%AE%97%E6%96%87%E7%9A%87%E5%B8%9D.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/永楽帝

  - id: emperor-yingzong-ming
    title: 英宗（正統帝）
    start: 1435
    end: 1449
    category: war
    tags: [中国, 明, 土木の変]
    summary: 親征でモンゴルの捕虜となり、明が守勢に転じる分かれ目になった。
    detail: |
      明の第6代皇帝で、在位は1435年から1449年まで。
      9歳で即位し、のちに一度廃されてから再び位に就いた珍しい経歴を持つ。
      二つの元号を使ったため、日本では廟号の英宗で呼ばれることが多い。

      幼くして即位したため、政治は宦官の王振が取り仕切った。
      洪武帝が宦官の政治関与を厳しく禁じていたにもかかわらず、その決まりは崩れていく。
      王振は反対する官僚を退け、皇帝の信任を背景に権勢をふるった。
      1449年、オイラトのエセンが交易の拡大を求めて明領に侵入する。
      王振は皇帝自らの出陣を勧め、準備の乏しいまま50万と号する軍が北へ向かった。
      土木堡で包囲されて軍は壊滅し、皇帝は捕虜になる。
      王振は乱戦のなかで殺された。

      朝廷は弟を新しい皇帝に立て、于謙の指揮で北京を守り抜いた。
      人質としての価値を失った英宗は翌年に返され、そのまま幽閉される。
      1457年、弟が病に倒れた隙に宮門を破って復位した。
      復位後は、北京を守った于謙を処刑している。

      皇帝が捕らえられても国が滅びなかったことは、明の制度の強さを示した。
      同時に、この敗北を境に明は攻勢をやめ、長城の修築による守りへ転じる。
      宦官が政治を動かす流れも、この治世から明の末まで続くことになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/%E8%8B%B1%E5%AE%97%E7%9D%BF%E7%9A%87%E5%B8%9D.jpg/500px-%E8%8B%B1%E5%AE%97%E7%9D%BF%E7%9A%87%E5%B8%9D.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:%E8%8B%B1%E5%AE%97%E7%9D%BF%E7%9A%87%E5%B8%9D.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/英宗_(明)

  - id: jiajing
    title: 嘉靖帝
    start: 1521
    end: 1567
    category: politics
    tags: [中国, 明]
    summary: 道教の修行に没頭して政務を離れ、北虜南倭に悩まされた45年。
    detail: |
      明の第12代皇帝で、在位は1521年から1567年までの45年に及ぶ。
      従兄の皇帝が跡継ぎなく没したため、地方の藩王の子から迎えられて即位した。
      道教の修行に没頭し、長く政務を執らなかったことで知られる。

      即位の直後から、実父をどう祀るかをめぐって朝臣と激しく争った。
      大礼の議と呼ばれるこの論争で、反対した官僚は大量に処罰される。
      自分の正統性に関わる問題では譲らない一方、日常の政務への関心は薄れていった。
      不老長寿を求めて道士を重用し、宮中で丹薬の調合に没頭する。
      20年以上にわたり朝議に姿を見せず、上奏は側近を通じてしか届かなかった。
      その隙に厳嵩が20年近く権力を握り、汚職が広がる。
      1542年には、過酷な扱いに耐えかねた宮女たちが皇帝を絞め殺そうとする事件まで起きた。

      対外では、北のモンゴルと南の倭寇に苦しめられた。
      1550年にはアルタン・ハンの軍が北京を包囲し、周辺を略奪して引き上げる。
      沿海では密貿易と結びついた倭寇が横行し、戚継光らの鎮圧に長い年月を要した。
      この二つを合わせて北虜南倭と呼び、明の衰えを示す言葉になった。

      45年の長い治世は、王朝の体力を削った期間として評価されている。
      皇帝が働かなくても国家が回るほど官僚制は成熟していたが、その分だけ腐敗も進んだ。
      丹薬の水銀が死因とも言われ、その最期もまた道教への傾倒を象徴している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/%E6%98%8E%E4%B8%96%E5%AE%97%E5%83%8F.jpg/500px-%E6%98%8E%E4%B8%96%E5%AE%97%E5%83%8F.jpg
