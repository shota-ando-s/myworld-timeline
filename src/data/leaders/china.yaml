  - id: kangxi
    title: 康熙帝
    start: 1661
    end: 1722
    category: politics
    tags: [中国, 清]
    summary: 61年の在位で三藩の乱・台湾・ロシア国境を片付け、清の最盛期を開いた。
    detail: |
      清の第4代皇帝で、在位は1661年から1722年までの61年に及ぶ。
      中国史で最も長く位にあった皇帝である。
      三藩の乱・台湾・ロシアとの国境という難題を片づけ、清の最盛期を開いた。

      8歳で即位し、初めは重臣のオボイが実権を握っていた。
      15歳のときに側近と謀ってこれを捕らえ、自ら政治を執り始める。
      1673年、雲南などに置かれていた漢人の藩王が反乱を起こすと、8年かけて鎮圧した。
      この三藩の乱の平定で、清の中国支配はようやく確かなものになる。

      1683年には台湾に拠る鄭氏を降し、版図に組み入れた。
      1689年にロシアとネルチンスク条約を結び、黒竜江流域の国境を画定する。
      ジュンガルのガルダンには自ら三度の親征を行い、モンゴル高原への支配を広げた。
      チベットにも兵を送り、周辺の秩序を清の主導で作り直している。

      内政では、1712年に人頭税の基準となる人口を固定し、以後の増加分に課税しないと宣言した。
      これが後の地丁銀につながり、人口の増加を後押しする。
      イエズス会の宣教師を暦の改定や地図の作成に用い、自ら西洋の数学や天文学を学んだ。
      『康熙字典』の編纂など、大規模な学術事業も進めている。
      晩年は後継者争いに悩まされ、皇太子を二度廃した。
      満洲人の皇帝でありながら、儒学を修めた君主としての作法を徹底した点が特徴である。
      唐の太宗と並べて、中国史上の名君に数えられてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/62/%E6%B8%85_%E4%BD%9A%E5%90%8D_%E3%80%8A%E6%B8%85%E5%9C%A3%E7%A5%96%E5%BA%B7%E7%86%99%E7%9A%87%E5%B8%9D%E6%9C%9D%E6%9C%8D%E5%83%8F%E3%80%8B.jpg/500px-%E6%B8%85_%E4%BD%9A%E5%90%8D_%E3%80%8A%E6%B8%85%E5%9C%A3%E7%A5%96%E5%BA%B7%E7%86%99%E7%9A%87%E5%B8%9D%E6%9C%9D%E6%9C%8D%E5%83%8F%E3%80%8B.jpg
