  - id: sun-yat-sen
    title: 孫文
    start: 1912
    end: 1925
    category: politics
    tags: [中国, 革命, 三民主義]
    summary: 三民主義を掲げて共和国を構想し、国民党・共産党の双方から「国父」とされた。
    detail: |
      中華民国の建国に関わった革命家で、初代の臨時大総統。
      1866年に広東の農村に生まれ、1925年に北京で没した。
      ハワイと香港で教育を受け、医師として出発している。

      1894年にハワイで興中会を組織し、清を倒す運動を始めた。
      広州での蜂起に失敗して以後16年を海外で過ごし、日本・欧米の華僑から資金と支持を集める。
      ロンドンで清の公使館に監禁された事件は、その名を国際的に知らせた。
      1905年には東京で諸派をまとめた中国同盟会を結成する。

      掲げたのは三民主義だった。
      民族は異民族支配と帝国主義からの独立、民権は国民が政治に参加する共和制、民生は土地と富の偏りを正すことを指す。
      辛亥革命のときは海外にいたが、帰国して1912年1月に臨時大総統に就いた。
      しかし統一を優先して、まもなく袁世凱に職を譲る。

      その後は袁世凱と対立し、日本へ亡命して党を作り直した。
      広東を拠点に政権を立て、1924年にはソ連の支援を受けて国民党を再編し、共産党員の入党を認める。
      黄埔軍官学校を設け、北伐に向けた軍を育てた。
      北方の勢力と統一を協議するため北京へ赴き、そこで病没する。
      革命はまだ成功していない、という言葉を遺した。
      国民党と共産党の双方が建国の父として掲げる、数少ない人物である。
      統一された権力を作れなかった一方、共和国という目標を最後まで手放さなかった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/%E5%AD%99%E4%B8%AD%E5%B1%B1%E8%82%96%E5%83%8F.jpg/500px-%E5%AD%99%E4%B8%AD%E5%B1%B1%E8%82%96%E5%83%8F.jpg
      credit: 上海波尔照相馆 / Public domain
      page: https://commons.wikimedia.org/wiki/File:%E5%AD%99%E4%B8%AD%E5%B1%B1%E8%82%96%E5%83%8F.jpg
    links:
