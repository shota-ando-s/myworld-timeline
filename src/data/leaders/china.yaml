lane: china

# 中原王朝と征服王朝の君主。王朝の帯の下に並ぶので、
# 「この王朝の、いつごろの人か」が縦に見比べられる。
leaders:
  - id: qin-shi-huang
    title: 始皇帝
    start: -221
    end: -210
    category: politics
    tags: [中国, 秦, 皇帝]
    summary: 「皇帝」という称号と中央集権の型を作り、以後2000年の統治の手本になった。
    detail: |
      中国で初めて皇帝を名乗った人物。
      前247年に秦王政として即位し、前221年に統一を果たして皇帝となり、前210年に没した。
      伝説上の三皇五帝から二字を取って皇帝という称号を作り、自らをその始まりとして始皇帝と号した。

      幼少期は人質だった父とともに趙で過ごし、13歳で即位した当初は呂不韋が実権を握っていた。
      親政を始めると、韓・趙・魏・楚・燕・斉を10年ほどで次々に滅ぼす。
      李斯らを用い、諸侯を封じる案を退けて全土を郡県に分け、諸国の武器を集めて溶かし、有力な一族を咸陽に移住させた。
      文字・度量衡・貨幣を揃え、全国に直道と呼ばれる幹線を通している。

      北では蒙恬に匈奴を退けさせて長城を築き、南は現在の広東まで支配を広げた。
      晩年は不老不死の薬を求めて方士を各地に送り、批判を封じるために書物を焼き学者を罰したと伝わる。
      五度目の巡行の途中、前210年に病没した。

      死の翌年から反乱が広がり、秦はまもなく崩れる。
      それでも皇帝という地位と中央集権の型は残り、陵墓のそばから出た8000体に及ぶ兵馬俑は、その動員の規模を今に伝えている。
      後世は暴君として語る一方で、中国を一つにまとめた人物としての評価も残り、見方は分かれ続けている。
      兵馬俑と陵墓は1974年に井戸を掘っていて見つかり、いまも発掘が続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/QinShiHuang19century.jpg/500px-QinShiHuang19century.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:QinShiHuang19century.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/始皇帝

  - id: liu-bang
    title: 高祖 劉邦
    start: -202
    end: -195
    category: politics
    tags: [中国, 漢]
    summary: 庶民から皇帝になった最初の人物で、実力で天下を取る道があることを示した。
    detail: |
      前漢の初代皇帝で、在位は前202年から前195年まで。
      農民の家に生まれ、秦では亭長という下級の役人を務めていた。
      庶民から皇帝にのぼった最初の人物である。

      徴用の人夫を護送する途中で逃亡者を出し、自ら山沢に隠れたところへ陳勝の乱が起きて挙兵した。
      項羽と並ぶ反秦の勢力となり、先に関中へ入って秦王の降伏を受ける。
      法は人を殺した者・傷つけた者・盗んだ者を罰する三条だけにすると約束し、人心を得た。
      鴻門の会で項羽に討たれかけたが逃れ、辺境の漢王に封じられる。

      ここから4年に及ぶ楚漢戦争が始まった。
      蕭何が兵と食糧を送り続け、張良が策を立て、韓信が戦場で勝つという分業が、個人の武勇に頼る項羽を上回る。
      前202年、垓下で項羽を破って皇帝となり、長安を都とした。
      晩年は匈奴に白登山で囲まれて和親に転じ、韓信ら功臣を次々に退けている。

      血筋ではなく実力で天下を取れることを示し、以後の反乱者の手本になった。
      秦の制度を受け継ぎながら法の厳しさを緩めるという選び方も、漢の長さにつながっている。
      人を使うのがうまかったという自己評価は、『史記』を通じて政治の教訓として読み継がれた。
      一方で功臣を次々に退けた点は、創業の君主に共通する難しさとして論じられる。
      漢の初期は秦の反省から負担を軽くし、国力の回復に努めた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/Liu_Bang_%28Emperor_Gaozu_of_Han%29.png/500px-Liu_Bang_%28Emperor_Gaozu_of_Han%29.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Liu_Bang_(Emperor_Gaozu_of_Han).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/劉邦

  - id: emperor-wen-han
    title: 文帝（前漢）
    start: -180
    end: -157
    category: politics
    tags: [中国, 漢]
    summary: 減税と倹約で国力を蓄えた「文景の治」の前半で、後の武帝の遠征を支えた。
    detail: |
      前漢の第5代皇帝で、在位は前180年から前157年まで。
      劉邦の四男で、代王として辺境にいたところを大臣たちに迎えられて即位した。
      呂后の一族が倒された直後で、争いを収められる人物として選ばれている。

      即位後は徹底して倹約に努め、宮殿の増築を取りやめたと伝わる。
      田租を三十分の一に軽くし、ときには免除もして、農民の負担を減らした。
      体を傷つける肉刑を廃し、政治を批判した者を罰する法も取り除いている。

      力を増していた諸侯王には慎重に対し、正面からの削減は避けた。
      匈奴に対しても和親を続け、絹や食糧を贈って大きな戦を起こさない道を選ぶ。
      次の景帝の代と合わせて文景の治と呼ばれ、倉には穀物が満ち、銭を通した紐が朽ちるほどだったと『史記』は記す。

      こうして蓄えられた国力が、続く武帝の大規模な遠征を支えることになった。
      儒者が理想とする、控えめで民を思う君主像の代表として語られ続ける。
      派手な事績はないが、何をしなかったかで評価される珍しい皇帝である。
      文景の治という呼び名は、以後の王朝で平和と蓄積の時代を指す言葉になった。
      税を軽くして民を休ませるという方針は、戦乱のあとの統治の定石として繰り返される。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Liu_Heng_%28Emperor_Wen_of_Han%29.png/500px-Liu_Heng_%28Emperor_Wen_of_Han%29.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Liu_Heng_(Emperor_Wen_of_Han).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/文帝_(漢)

  - id: emperor-wu-han
    title: 武帝（前漢）
    start: -141
    end: -87
    category: politics
    tags: [中国, 漢]
    summary: 匈奴への反攻と西域経営で版図を最大にし、儒学を官学として国家の背骨にした。
    detail: |
      前漢の第7代皇帝で、在位は前141年から前87年までの54年に及ぶ。
      前漢の版図がもっとも広がったのはこの時代である。
      漢の統治の形が、内外ともにここで決まった。

      即位当初は祖母の実家が実権を握っていたが、その死後に親政を始める。
      匈奴への和親をやめて反攻に転じ、衛青と霍去病を繰り返し草原へ送った。
      河西回廊を押さえて四つの郡を置き、西域への道を開く。
      南は南越を滅ぼして広東・ベトナム北部に、東は衛氏朝鮮を滅ぼして楽浪郡などを置いた。

      内政では董仲舒の献策を容れて儒学を官の学問とし、五経博士と太学を設けた。
      地方から人材を推薦させる郷挙里選を始め、官僚を集める道筋を作る。
      戦費をまかなうため塩・鉄・酒を専売にし、物資の輸送と価格を国が調整する均輸・平準も導入した。
      年号を定め、太初暦に改めたのもこの時代である。

      晩年は、呪詛の疑いから皇太子が死に追いやられる巫蠱の獄が起き、遠征の負担で財政も傾いた。
      死の前年には、これ以上の外征をやめるという詔を出している。
      広げた版図と整えた制度は、その後の中国が「漢の時代のように」と参照する基準になった。
      儒学と官僚制の結びつきは、この治世に始まって清の末まで続いた。
      漢の皇帝で最もよく知られるのは、その事績の幅の広さによる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/Liu_Che_%28Emperor_Wu_of_Han%29.png/500px-Liu_Che_%28Emperor_Wu_of_Han%29.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Liu_Che_(Emperor_Wu_of_Han).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/武帝_(漢)

  - id: wang-mang
    title: 王莽
    start: 9
    end: 23
    category: politics
    tags: [中国, 新]
    summary: 古代の理想を丸写しにした復古改革が現実と噛み合わず、15年で王朝ごと倒れた。
    detail: |
      前漢の皇后を出した王氏の一族に生まれ、新王朝の皇帝となった人物。
      生年は前45年、没年は23年で、在位は15年ほど。
      臣下が禅譲という形をとって帝位に就いた最初の例である。

      一族が権勢を誇るなかで、王莽だけは質素に暮らし儒学を学ぶ人物として評判を集めた。
      前1年に大司馬となり、幼い平帝を立てて実権を握り、娘を皇后に入れる。
      平帝が早世すると2歳の孺子嬰を立て、自らは周公旦になぞらえて摂政の皇帝を名乗った。
      各地から吉兆の報告を集めさせたうえで、8年の末に譲位を受けて国号を新と改める。

      政治の理想は、儒学の古典が描く周の制度に戻すことだった。
      土地を国有として売買を禁じ、奴婢の売買も止め、塩や鉄を国の扱いとする。
      貨幣を何度も作り替え、官名や地名も古い呼び方に改めた。
      匈奴の単于の称号を格下げするなど、周辺への対応も古典の建前で押し通している。

      改革は実務を伴わず、貨幣の混乱と黄河の大氾濫が重なって各地で反乱が起きた。
      23年、緑林の軍に長安を落とされ、王莽は混乱のなかで殺された。
      禅譲という形式だけは残り、魏以降の王朝交代の作法として使われ続ける。
      位を奪った者とする評価と、時代を先取りした改革者とする評価が、今も並んでいる。
      即位の正当化に吉兆を使った手口は、以後の禅譲でも形を変えて繰り返された。
      新は中国史でただ一人の皇帝しか持たない王朝である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/WUL-he21_01467_%E6%96%B0%E9%90%AB%E7%B9%AA%E5%83%8F%E6%9D%B1%E8%A5%BF%E6%BC%A2%E5%85%A8%E5%82%B3_01_%28%E7%8E%8B%E8%8E%BD%29.jpg/500px-WUL-he21_01467_%E6%96%B0%E9%90%AB%E7%B9%AA%E5%83%8F%E6%9D%B1%E8%A5%BF%E6%BC%A2%E5%85%A8%E5%82%B3_01_%28%E7%8E%8B%E8%8E%BD%29.jpg
      credit: 鍾 惺, 1574-1624 / Public domain
      page: https://commons.wikimedia.org/wiki/File:WUL-he21_01467_%E6%96%B0%E9%90%AB%E7%B9%AA%E5%83%8F%E6%9D%B1%E8%A5%BF%E6%BC%A2%E5%85%A8%E5%82%B3_01_(%E7%8E%8B%E8%8E%BD).jpg
    links:
