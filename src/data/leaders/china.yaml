  - id: emperor-xiaowen-wei
    title: 孝文帝（北魏）
    start: 471
    end: 499
    category: politics
    tags: [中国, 北魏, 漢化]
    summary: 遊牧民の王朝が自ら中国式に衣食・姓・言葉を改め、南北融合の下地を作った。
    detail: |
      北魏の第6代皇帝で、在位は471年から499年まで。
      4歳で即位し、長く祖母の馮太后が政治を執った。
      親政を始めるのは490年のことである。

      馮太后の時代に、官僚に俸禄を支給する制度、均田制、村を組織する三長制が定められた。
      それまで役人は収入を自分で調達しており、収奪の温床になっていた。
      土地と戸口を国が把握する仕組みは、ここで形になる。

      親政後の孝文帝は、493年に南伐を口実として都を平城から洛陽へ移した。
      北方の草原に近い旧都を離れ、中国の中心で統治することを選んだのである。
      鮮卑の服装と言葉を朝廷で禁じ、拓跋という皇室の姓を元と改めた。
      貴族の姓も漢風に変えさせ、漢人の名族との通婚を奨励している。

      この改革には強い反発があり、北辺に残された兵たちの不満は後に六鎮の乱となった。
      北魏が534年に東西へ分裂する遠因は、ここにあるという見方が強い。
      それでも、遊牧民の王朝が自ら進んで中国式に変わったことの意味は大きかった。
      北の軍事力と南の制度文化が混ざり合い、隋唐の支配層を生む下地になっている。
      洛陽に都を移したのち、龍門石窟の造営が始まっている。
      支配者が自ら民族の慣習を捨てる決断は、征服王朝のなかでも際立っている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/b/b9/Emperor_Xiaowen_of_Northern_Wei.jpg
      credit: Original uploader was Jason22 at zh.wikipedia / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emperor_Xiaowen_of_Northern_Wei.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/孝文帝

  - id: emperor-wen-sui
    title: 文帝 楊堅
    start: 581
    end: 604
    category: politics
    tags: [中国, 隋]
    summary: 300年の分裂を終わらせ、科挙と均田制など唐へ引き継がれる制度を整えた。
    detail: |
      隋の初代皇帝で、在位は581年から604年まで。
      北周の将軍の家に生まれ、娘を皇后に入れて外戚として実権を握った。
      幼い皇帝から譲位を受けて隋を開き、589年に南北を統一する。

      統一後に取り組んだのは、分裂の時代に膨らんだ仕組みを整理することだった。
      中央に三省六部を置いて役割を分け、地方は州と県の二段階にして郡を廃す。
      地方長官の任命権を中央に集め、任地を出身地から離す決まりも作った。
      家柄で官職が決まる九品官人法を廃し、試験で人を採る科挙の端緒を開いている。

      経済では均田制を継いで農民に土地を配り、租庸調で穀物・布・労役を納めさせた。
      兵は農民が交代で務める府兵制でまかない、常備軍の費用を抑える。
      法は開皇律令としてまとめられ、刑罰を軽くする方向で整理された。
      自らは質素を通し、倉には数十年分の蓄えがあったと伝わる。

      一方で猜疑心が強く、建国を助けた功臣を次々に退けた。
      後継も長子の楊勇から次子の楊広に変え、それが煬帝となる。
      604年の死については、楊広が関わったとする説が古くからある。
      整えた制度は唐がそのまま用い、東アジアの律令国家の原型になった。
      倉に積まれた蓄えは、唐の初めまで使われたと伝えられる。
      短命な王朝の初代でありながら、制度の面では最も影響の大きい皇帝の一人である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Sui_Wendi_Tang.jpg/500px-Sui_Wendi_Tang.jpg
      credit: Yan Li-pen / Public domain
      page: https://commons.wikimedia.org/wiki/File:Sui_Wendi_Tang.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/楊堅

  - id: emperor-yang-sui
    title: 煬帝
    start: 604
    end: 618
    category: politics
    tags: [中国, 隋]
    summary: 大運河と高句麗遠征を急ぎすぎて民を疲れさせ、短命王朝の代名詞になった。
    detail: |
      隋の第2代皇帝で、在位は604年から618年まで。
      569年に生まれ、江都で殺された。
      煬という諡は唐が贈ったもので、礼を欠き民を苦しめた君主という意味を含む。

      陳を滅ぼした遠征の総大将を務め、若いころから実績があった。
      質素で行儀正しく振る舞って父母の信を得、兄を廃させて皇太子の座を得たと伝わる。
      即位後は事業を次々に起こした。
      大運河を掘り、東都洛陽を造営し、長城を修築し、西域や南海へも使者を送る。

      最も大きな失敗は高句麗への遠征だった。
      612年には113万と号する大軍を動かしながら惨敗し、翌年・翌々年も成果を得られない。
      遠征のたびに農民が兵と人夫に取られ、田は荒れた。
      国内では楊玄感が挙兵し、各地に反乱が広がっていく。

      煬帝は江都に移って長江の南にとどまり、北へ戻ろうとしなかった。
      618年、帰郷を望む近衛の兵に宮中で殺され、隋は滅びる。
      運河も洛陽も科挙も、その後の中国を支える事業ではあった。
      必要な事業を一代で片づけようとして民を使い果たした例として、繰り返し引き合いに出される。
      煬帝の名は、事業の是非とは別に、暴君の代名詞として定着した。
      近年は、唐の史書が悪く描いた分を割り引いて評価し直す研究も進んでいる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Sui_Yangdi_Tang.jpg/500px-Sui_Yangdi_Tang.jpg
      credit: 閻立本 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Sui_Yangdi_Tang.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/煬帝

  - id: tang-taizong
    title: 太宗 李世民
    start: 626
    end: 649
    category: politics
    tags: [中国, 唐]
    summary: 臣下の諫言を容れた「貞観の治」が、東アジア中で理想の君主像として読まれた。
    detail: |
      唐の第2代皇帝で、名は李世民。
      在位は626年から649年まで。
      父の李淵とともに挙兵し、各地の群雄を平定した実質的な創業者でもある。
      その治世は年号をとって貞観の治と呼ばれる。

      隋末の戦いで功を重ねたが、皇太子である兄との対立が深まった。
      626年、玄武門で兄と弟を討ち、父に迫って位を譲らせる。
      即位後は、自分に反対していた魏徴をあえて側近に用いた。
      耳の痛い諫言を受け入れる姿勢が、この治世の評価を決めている。

      内政では律令を整え、三省六部の運用を固め、科挙を通じて人材を集めた。
      税を軽くし、刑罰の適用を慎重にして、戦乱で減った人口の回復を図る。
      対外では東突厥を破って草原の君長たちから天可汗と呼ばれ、西域のオアシス諸国を服属させた。
      チベットの吐蕃には皇族の娘を嫁がせ、力と外交を使い分けている。

      晩年の高句麗遠征は成果を得られず、隋の失敗を繰り返しかけた。
      それでも、皇帝と臣下の問答を集めた『貞観政要』は、理想の君主の記録として読み継がれる。
      日本でも鎌倉以来の為政者が学び、朝鮮やベトナムでも規範とされた。
      権力の奪い方は血なまぐさいのに、統治の手本とされ続けるという二面性を持つ人物である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/TangTaizong.jpg/500px-TangTaizong.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:TangTaizong.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/太宗_(唐)

  - id: wu-zetian
    title: 則天武后
    start: 690
    end: 705
    category: politics
    tags: [中国, 唐, 女帝]
    summary: 中国史でただ一人の女帝として、科挙出身者の登用で門閥貴族の力をそいだ。
    detail: |
      中国史でただ一人、自ら皇帝の位に就いた女性。
      唐の高宗の皇后となり、690年に国号を周と改めて即位し、705年に退いた。
      生年は624年ごろ、没年は705年である。

      もともとは太宗の後宮に入り、その死後に高宗の后となった。
      病弱な高宗に代わって政務を裁き、二人は二聖と並び称される。
      高宗の死後は二人の子を次々に立てては廃し、自ら帝位に就いた。
      反対する皇族や貴族は、密告を奨励し酷吏を用いて容赦なく排除している。

      一方で、人材の登用には家柄を問わなかった。
      科挙を重んじて合格者を高位に就け、皇帝自ら試験を行う殿試の原型も作られる。
      関中の門閥貴族の力は削がれ、試験で上がってきた官僚が政治の中核に入った。
      仏教を保護し、自らを弥勒の生まれ変わりと称して、その権威で即位を正当化している。

      705年、病に伏したところを重臣に迫られて退位し、唐が復された。
      儒学の立場からは、女が帝位を奪った例として長く非難されてきた。
      しかし、その治世に国力は保たれ、官僚制の性格を変えた功績は今日では評価されている。
      自らの墓の前には文字のない碑が立ち、評価を後世に委ねたとも語られる。
      門閥から実力へという唐の変化は、この時代に大きく進んだ。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/25/%E5%94%90%E5%90%8E%E8%A1%8C%E5%BE%9E%E5%9C%96_%28%E5%B1%80%E9%83%A8%29_-_%E6%AD%A6%E5%89%87%E5%A4%A9.png/500px-%E5%94%90%E5%90%8E%E8%A1%8C%E5%BE%9E%E5%9C%96_%28%E5%B1%80%E9%83%A8%29_-_%E6%AD%A6%E5%89%87%E5%A4%A9.png
