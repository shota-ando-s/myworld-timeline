    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/蔣介石

  - id: mao-zedong
    title: 毛沢東
    start: 1949
    end: 1976
    category: politics
    tags: [中国, 共産党]
    summary: 農村から革命を組み立てて中華人民共和国を建てたが、大躍進と文革で甚大な犠牲も出した。
    detail: |
      中華人民共和国を建国した指導者で、1949年から1976年まで最高指導者の地位にあった。
      1893年に湖南の農家に生まれ、1976年に北京で没した。
      中国共産党の創立に参加した一人である。

      都市の労働者ではなく農民を革命の主力と位置づけた点が、その独自性だった。
      井崗山に根拠地を築き、農村で軍と政権を作って都市を包囲する戦略をとる。
      長征の途上の遵義会議で指導権を握り、延安で党の理論的な支柱となった。
      日中戦争では持久戦を説き、農村での組織づくりを通じて党を巨大化させる。

      1949年の建国後は、土地改革と国有化を進め、朝鮮戦争に参戦した。
      1958年に始めた大躍進では、人民公社と鉄鋼の増産を号令したが、無理な目標と虚偽の報告が重なる。
      結果として数千万人が餓死したとされ、毛沢東は一時、実務の第一線から退いた。
      1966年、劉少奇ら実務派を打倒するために文化大革命を発動する。
      紅衛兵が動員され、党と政府の機構、教育と文化財が10年にわたって破壊された。
      晩年には米国との和解に踏み切り、ニクソンの訪中を受け入れている。

      死後、党は功績が第一で誤りは第二という評価を公式に定めた。
      革命を勝利に導いた指導者としての面と、大きな犠牲を招いた政策の責任が、同じ一人に重なる。
      20世紀の中国を最も強く方向づけた人物であることは、評価の立場を問わず共通している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Wv-1-6b_%28page_1_crop%29_%28full_crop%29.jpg/500px-Wv-1-6b_%28page_1_crop%29_%28full_crop%29.jpg
      credit: 侯波（1924-2017）、孟庆彪（1925-1985） / Public domain
