  - id: sima-yan
    title: 武帝 司馬炎
    start: 265
    end: 290
    category: politics
    tags: [中国, 晋]
    summary: 三国を統一したが、一族に兵権を分け与えた結果が八王の乱と分裂を招いた。
    detail: |
      西晋の初代皇帝で、在位は265年から290年まで。
      祖父の司馬懿以来、三代にわたって魏の実権を握った家に生まれた。
      魏から譲位を受けて晋を建て、三国の分裂を終わらせた人物である。

      265年に父の司馬昭が没すると跡を継ぎ、その年のうちに魏の皇帝から位を譲られた。
      280年、長江を下る水軍を含む大軍で呉を降し、約100年ぶりの統一を果たす。
      土地の保有と税を定める占田・課田の制を敷き、州や郡の兵を解いて軍備を縮めた。
      戦乱が収まったことで戸籍に載る人口も回復している。

      統一後は政治への関心を失い、後宮に数千人を集めたと伝えられる。
      魏が一族を抑えつけて孤立し滅んだ反省から、司馬氏の諸王に領地と兵を与えた。
      後継には判断力に乏しいとされた恵帝を選び、外戚と皇后の一族が対立する火種を残す。
      死の翌年から、諸王が兵を率いて争う八王の乱が始まった。

      統一を成し遂げながら、その体制は36年しか保たなかった。
      一族に兵を分けた判断が内戦を招き、周辺の諸民族が華北へ入る道を開いている。
      何を決めたかよりも、統一の後をどう設計するかが問われた例として論じられてきた。
      次に中国がまとまるのは、300年余りのちの隋である。
      呉を滅ぼすにあたり、水軍を長年かけて建造させた準備の周到さは評価が高い。
      治世の前半と後半で評価が大きく分かれる皇帝である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0d/Jin_Wu_Di.jpg/500px-Jin_Wu_Di.jpg
      credit: Yan Li-pen / Public domain
      page: https://commons.wikimedia.org/wiki/File:Jin_Wu_Di.jpg
