  - id: hong-taiji
    title: ホンタイジ
    start: 1626
    end: 1643
    category: politics
    tags: [中国, 満洲, 清]
    summary: 国号を清と改め、モンゴル・漢人も取り込む多民族帝国の形を先に用意した。
    detail: |
      後金の第2代の君主で、清の初代皇帝とされる人物。
      1592年に生まれ、1626年に父ヌルハチの跡を継ぎ、1643年に没した。
      国号を清と改め、多民族を治める帝国の形を用意した。

      即位したとき、後金は満洲の一勢力にすぎなかった。
      ホンタイジは他の有力者と権力を分け合う体制を改め、君主に権限を集めていく。
      明にならって六部を置き、文書で政務を処理する仕組みを整えた。
      漢人の官僚や降った将軍を積極的に登用し、火器の部隊も編成する。

      満洲の八旗に加えて、モンゴル八旗と漢軍八旗を設けた。
      出自の異なる集団を同じ枠組みに取り込むことで、征服した人々を体制の内側に入れる。
      1635年にはモンゴルのチャハル部を服属させ、元の玉璽を手に入れたとされる。
      翌1636年、国号を大清と改めて皇帝を称し、民族の名も満洲と定めた。

      同じ年から翌年にかけて朝鮮に侵攻し、明との関係を断たせて臣従させる。
      明に対しては長城を越える襲撃を繰り返し、包囲の輪を狭めていった。
      1643年、明の滅亡を見ないまま急死する。
      翌年、幼い順治帝を擁した叔父のドルゴンが山海関を越え、北京に入った。
      満洲・モンゴル・漢という複数の集団を一つの帝国にまとめる設計は、この代でほぼ完成していた。
      清が中国全土を長く治められたのは、その準備があったからだとされる。
