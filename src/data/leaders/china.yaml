        url: https://ja.wikipedia.org/wiki/孫文

  - id: yuan-shikai
    title: 袁世凱
    start: 1912
    end: 1916
    category: politics
    tags: [中国, 中華民国]
    summary: 清の軍を握ったまま大総統となり、帝政復活に失敗して軍閥割拠を招いた。
    detail: |
      清末から民国初期の軍人・政治家で、中華民国の初代大総統。
      1859年に生まれ、1916年に没した。
      清の近代的な陸軍を育て、その力を背景に権力を握った人物である。

      若いころ朝鮮に駐在し、清の権益を代表して現地の政治に深く関与した。
      日清戦争の後、西洋式の新建陸軍の編成を任され、これが北洋軍閥の母体になる。
      戊戌の変法では改革派と保守派のあいだで立場を選び、その判断が政変の帰趨を左右したとされる。
      義和団事件では山東で外国人を保護し、列強からの信用を得た。

      清が辛亥革命で追い詰められると、朝廷は袁世凱に事態の収拾を委ねた。
      袁世凱は革命側と交渉し、皇帝の退位と引き換えに自らが大総統となる合意をまとめる。
      1912年に就任すると、議会の第一党を率いた宋教仁が暗殺され、反対派は排除された。
      翌年に国民党を解散させ、憲法を停止して独裁を固める。

      1915年、日本の二十一か条要求の大半を受け入れたことで、国内の批判が高まった。
      それでも同じ年に帝政の復活を宣言し、皇帝に即位する。
      各省が反対を表明し、部下の軍人まで離反したため、83日で取り消した。
      失意のうちに1916年に病没する。
      その死後、北洋軍は分裂して軍閥の抗争が始まった。
      強い軍を握った者が政権を左右するという構図は、以後20年以上続く。
      清の改革を担った有能な官僚でもあり、共和国の破壊者でもあるという評価の二面性が残っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/YuanShikaiPresidente1915.jpg/500px-YuanShikaiPresidente1915.jpg
      credit: Photo by Rio V. De Sieux [1] / Public domain
      page: https://commons.wikimedia.org/wiki/File:YuanShikaiPresidente1915.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/袁世凱

  - id: chiang-kai-shek
    title: 蒋介石
    start: 1928
    end: 1949
    category: politics
    tags: [中国, 国民党]
    summary: 北伐で中国を名目上統一し、日本との戦争と国共内戦を戦って台湾へ退いた。
    detail: |
      中華民国の軍人・政治家で、1928年から1949年まで中国の最高指導者だった。
      1887年に浙江に生まれ、1975年に台湾で没した。
      日本に留学して軍事を学び、孫文のもとで頭角を現している。

      1924年に設立された黄埔軍官学校の校長となり、自らの軍の基盤を作った。
      孫文の死後、1926年に北伐を開始して各地の軍閥を破る。
      1927年、上海で共産党員を一斉に弾圧して国共合作を断ち切り、南京に国民政府を樹立した。
      翌年に北京へ入り、東北の張学良が従ったことで名目上の全国統一が成る。

      統一後は、共産党の根拠地への攻撃を繰り返した。
      日本の侵攻については、まず国内を固めてから当たるという方針をとる。
      1936年、西安で張学良に監禁され、抗日のための共産党との協力を受け入れた。
      翌年から日中戦争が始まり、政府を重慶へ移して8年にわたり抗戦する。

      戦後、連合国の一員として国際的な地位を得たが、国内では内戦が再開した。
      インフレと汚職で支持を失い、軍事的にも共産党に押される。
      1949年、政府を台湾へ移し、以後は大陸反攻を掲げながら島を統治した。
      台湾では戒厳令のもとで反対派を抑え、一方で土地改革と工業化を進めている。
      中国を一つの権力のもとにまとめようとし続け、二度とも完全には達しなかった。
      評価は、抗日を指導した指導者としてのものと、独裁者としてのものが並んでいる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/27/%E8%94%A3%E4%B8%AD%E6%AD%A3%E7%B8%BD%E7%B5%B1%E7%8E%89%E7%85%A7.png/500px-%E8%94%A3%E4%B8%AD%E6%AD%A3%E7%B8%BD%E7%B5%B1%E7%8E%89%E7%85%A7.png
