  - id: deng-xiaoping
    title: 鄧小平
    start: 1978
    end: 1992
    endCirca: true
    category: politics
    tags: [中国, 改革開放]
    summary: 市場経済を「社会主義」の枠内に持ち込み、今日の中国の経済路線を決めた。
    detail: |
      改革開放を主導した中国の指導者で、1978年末から1990年代初めまで実質的な最高権力者だった。
      1904年に四川に生まれ、1997年に没した。
      国家主席にも党の総書記にもならないまま、政治の方向を決めた点が特徴である。

      若いころフランスで働きながら学び、そこで共産主義運動に加わった。
      長征に参加し、建国後は要職を歴任するが、文化大革命で二度失脚している。
      毛沢東の死と四人組の逮捕の後に復帰し、1978年12月の党の会議で路線の転換を決めた。
      農村では集団農業をやめ、世帯ごとに生産を請け負わせる方式を広げた。
      深圳など沿海の四か所に経済特区を設け、外国の資本と技術を受け入れる。
      白い猫でも黒い猫でも、ねずみを捕るのが良い猫だという言葉が、この実務重視の姿勢を表している。
      香港とマカオの返還にあたっては、一国二制度という枠組みを提案した。

      一方で、政治の自由化は認めなかった。
      1989年の天安門での運動に対しては、軍を投入する決定を支持している。
      事件後に改革が停滞すると、1992年に南方の都市を巡って市場化の加速を訴えた。
      この南巡講話が、以後20年の高成長の起点になる。

      経済の自由化と政治の統制を組み合わせる路線は、この人物の設計による。
      毛沢東の時代からの転換を、体制そのものを壊さずに進めた手腕が評価されてきた。
      同時に、天安門での決定は今も重い論点として残っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Deng_Xiaoping_and_Jimmy_Carter_at_the_arrival_ceremony_for_the_Vice_Premier_of_China._-_NARA_-_183157-restored%28cropped%29.jpg/500px-Deng_Xiaoping_and_Jimmy_Carter_at_the_arrival_ceremony_for_the_Vice_Premier_of_China._-_NARA_-_183157-restored%28cropped%29.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Deng_Xiaoping_and_Jimmy_Carter_at_the_arrival_ceremony_for_the_Vice_Premier_of_China._-_NARA_-_183157-restored(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/鄧小平

  - id: jiang-zemin
    title: 江沢民
    start: 1989
    end: 2002
    category: politics
    tags: [中国, 共産党]
    summary: 天安門事件後の孤立を切り抜け、WTO加盟で世界経済への参加を確定させた。
    detail: |
      中国共産党の総書記を1989年から2002年まで務めた指導者。
      1926年に生まれ、2022年に没した。
      天安門事件の直後に上海市の党書記から抜擢され、後継者に指名された。

      就任時、中国は事件への国際的な制裁で孤立し、東欧では社会主義体制が次々に崩れていた。
      江沢民は当初、鄧小平の後見のもとで慎重に舵を取る。
      1992年の南巡講話を受けて市場化に舵を切り、翌年に社会主義市場経済を公式の方針とした。
      1990年代後半には、国有企業の大規模な整理に踏み切った。
      数千万人が職を失う一方、企業の統廃合と株式化が進み、経済の効率は上がる。
      住宅の商品化と大学の拡大も、この時期に始まった。
      1997年に香港、1999年にマカオの返還を受け入れ、一国二制度の運用が始まる。

      外交では、制裁の解除と各国との関係修復を進めた。
      2001年のWTO加盟は15年に及ぶ交渉の結果で、その後の輸出主導の成長を決定づける。
      同じ年に北京五輪の開催も決まった。

      理論の面では、共産党が労働者だけでなく企業家も代表するという三つの代表を打ち出した。
      市場経済のもとで生まれた新しい層を、党の内側に取り込む狙いである。
      2002年に総書記を退いたが、軍の職はしばらく保ち、その後も影響力を残した。
      経済の自由化と政治の一党支配を両立させる型は、この時期に固まっている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/1/11/Jiang_Zemin_2002.jpg
      credit: Kremlin.ru / Roman Kubanskiy / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Jiang_Zemin_2002.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/江沢民

  - id: hu-jintao
    title: 胡錦濤
    start: 2002
    end: 2012
    category: politics
    tags: [中国, 共産党]
    summary: 二桁成長と北京五輪の時代を統べ、中国を世界第2の経済大国に押し上げた。
    detail: |
      中国共産党の総書記を2002年から2012年まで務めた指導者。
      1942年に生まれ、技術者の出身で、チベット自治区などでの勤務を経て中央に入った。
      江沢民の後を継ぎ、中国が世界第2の経済大国になる時期を統べた。

      掲げたのは、成長の質と均衡を重んじる科学的発展観と、和諧社会という言葉だった。
      沿海部に偏った発展を内陸へ広げ、農村の負担を軽くする方向を打ち出す。
      2006年には農業税が全廃され、農村の医療保険と義務教育の無償化が進んだ。
      経済は二桁に近い成長を続け、2010年には日本を抜いて世界第2の規模になった。
      2008年の北京五輪と2010年の上海万博は、その勢いを世界に示す行事になる。
      同じ2008年のリーマン・ショックに対しては4兆元の景気対策を打ち、世界経済の落ち込みを支えた。
      その一方で、地方政府の債務と不動産への依存が積み上がっていく。

      課題も残った。
      所得と地域の格差は縮まらず、大気と水の汚染は深刻化する。
      官僚の腐敗は広がり、土地の収用などをめぐる抗議が各地で頻発した。
      2008年のチベット、2009年の新疆では大規模な騒乱が起きている。

      2012年に習近平へ職を譲り、軍の職も同時に手放した。
      指導部の交代が制度に沿って行われた例として、この移行は注目された。
      経済規模では成功し、構造の問題は次の世代へ残した10年と総括されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/Chinese_President_Hu_Jintao_in_2011.jpg/500px-Chinese_President_Hu_Jintao_in_2011.jpg
      credit: Dilma Rousseff from Brasil / CC BY-SA 2.0
      page: https://commons.wikimedia.org/wiki/File:Chinese_President_Hu_Jintao_in_2011.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/胡錦濤

  - id: xi-jinping
    title: 習近平
    start: 2012
    ongoing: true
    category: politics
    tags: [中国, 共産党]
    summary: 任期制限を外して権力を集中させ、対外的にも強い姿勢を前面に出している。
    detail: |
      2012年から中国共産党の総書記を務める最高指導者。
      1953年に生まれ、父は革命の第一世代の政治家である。
      文化大革命の時期に農村へ送られ、地方の勤務を重ねて中央に上がった。

      就任後すぐに大規模な反腐敗運動を始めた。
      地位の高低を問わず摘発すると掲げ、軍の高官や元の政治局常務委員までが処分される。
      これによって党内の規律は引き締まり、権力の集中も進んだ。
      2018年には憲法が改正され、国家主席の任期を二期までとする制限が撤廃された。
      2022年には慣例を超えて三期目の総書記に就いている。
      党があらゆる分野を指導するという原則が強調され、国有企業や民間の大手企業への統制も強まった。

      対外的には、一帯一路として沿線諸国への投資とインフラ建設を進めた。
      南シナ海での施設建設や、台湾への軍事的な圧力も強められている。
      米国との関係は、貿易と技術をめぐって対立が続く。
      香港では2020年に国家安全維持法が施行され、一国二制度の運用が大きく変わった。

      国内では、住宅価格の抑制や格差の是正を掲げる共同富裕が打ち出された。
      新型コロナウイルスへの厳しい封じ込め策は、2022年末に転換されている。
      人口の減少と経済の減速に直面しながら、技術の自立と安全保障を優先する方針が取られてきた。
      改革開放以来続いた集団指導の形が変わったという点で、その評価は今後に委ねられている。
