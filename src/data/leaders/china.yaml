  - id: cixi
    title: 西太后
    start: 1861
    end: 1908
    category: politics
    tags: [中国, 清, 摂政]
    summary: 半世紀近く垂簾聴政で実権を握り、改革と保守のあいだで清の最後を左右した。
    detail: |
      清の末期に半世紀近く実権を握った人物。
      1835年に生まれ、咸豊帝の側妃となり、同治帝を産んだ。
      皇帝の生母や伯母として、簾の陰から政治を動かす垂簾聴政を続けた。

      1861年、咸豊帝が避難先で没すると、政変を起こして顧命の大臣を排除した。
      幼い同治帝を立て、もう一人の皇太后とともに政務を執る。
      地方の漢人官僚を用いて太平天国を鎮め、洋務運動を容認して一時の安定を作った。
      同治帝が若くして没すると、妹の子である光緒帝を立てて聴政を続けた。
      光緒帝が成年に達した後も実権を手放さず、海軍の費用を庭園の造営に流用したとも伝えられる。
      1898年に光緒帝が変法の改革に踏み切ると、政変を起こして皇帝を幽閉し、改革を潰した。

      1900年、義和団の排外運動に同調して列強に宣戦するという極端な判断を下す。
      八か国連合軍に北京を占領され、西安へ逃れた。
      巨額の賠償を課された後は一転して改革に転じ、科挙の廃止や新しい学校制度、憲法の準備を進めている。

      1908年、光緒帝の翌日に没した。
      死の直前に2歳の溥儀を後継に指名し、その3年後に清は倒れる。
      国を私したという批判と、列強と内乱のあいだで王朝を延命させたという評価が、今も並んでいる。
      伝えられる逸話には後世の脚色も多く、実像の見直しが進んでいる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/The_Ci-Xi_Imperial_Dowager_Empress_%285%29.JPG/500px-The_Ci-Xi_Imperial_Dowager_Empress_%285%29.JPG
