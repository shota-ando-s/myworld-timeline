  - id: wanli
    title: 万暦帝
    start: 1572
    end: 1620
    category: politics
    tags: [中国, 明]
    summary: 治世後半に政務を放棄し、朝廷の空転が明の滅亡を準備したとされる。
    detail: |
      明の第14代皇帝で、在位は1572年から1620年まで。
      10歳で即位し、48年という明で最も長い治世を送った。
      前半の改革と後半の政務放棄の落差が、この皇帝の特徴である。

      即位当初は張居正が政治を主導した。
      官僚の勤務を数値で評価する考成法で行政を引き締め、全国の土地を測量し直す。
      税と労役を銀による一本の納入にまとめる一条鞭法を広げ、財政は黒字に転じた。
      1582年に張居正が没すると、万暦帝はその一族を没落させ、改革の多くも巻き戻す。
      寵愛する妃の子を皇太子にしようとして官僚と長く対立し、やがて朝議に出なくなった。
      30年近く臣下と顔を合わせず、上奏は放置され、空いた官職も埋められない。
      各地に宦官を派遣して鉱山や商業から税を取り立てさせ、民の反発を招いた。

      対外では三つの大きな戦役を抱えた。
      寧夏と播州の反乱鎮圧に加え、豊臣秀吉の朝鮮出兵に対して大軍を送る。
      この援軍は朝鮮を救ったが、明の財政に大きな穴を開けた。
      北東では女真のヌルハチが力を伸ばし、1619年のサルフの戦いで明軍は大敗する。

      官僚のあいだでは東林党とそれに対する派閥の争いが激化した。
      国家の仕組みが皇帝の不在に耐えたことは、官僚制の成熟を示してもいる。
      一方で、意思決定が止まったまま危機が積み上がり、明の滅亡はこの治世に準備されたと評されてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Ming_Shenzong.jpg/500px-Ming_Shenzong.jpg
      credit: 明朝画师 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ming_Shenzong.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/万暦帝

  - id: nurhaci
    title: ヌルハチ
    start: 1616
    end: 1626
    category: politics
    tags: [中国, 満洲, 清]
    summary: 女真の諸部を八旗という軍事社会組織にまとめ、清の土台を築いた。
    detail: |
      清の基礎を築いた人物で、後金の初代のハン。
      1559年に生まれ、1616年に即位して1626年に没した。
      満洲の建州女真の出身で、明の辺境の一首長から身を起こした。

      祖父と父が明軍の巻き添えで殺されたことを機に、1583年にわずかな兵で挙兵する。
      30年をかけて建州の諸部をまとめ、さらに海西女真の各部を併合した。
      明からは官職と交易の権利を与えられ、朝貢の形を保ちながら力を蓄えている。
      最大の創案は八旗制である。
      狩猟のときの集団編成をもとに、全住民を旗という単位に分けて所属させた。
      旗は軍隊であると同時に行政と生産の単位でもあり、平時は農耕と牧畜、戦時は兵となる。
      モンゴル文字を借りて満洲語を書き表す文字も作らせ、記録を残せるようにした。

      1616年に後金を建て、1618年には明への恨みを七つ数え上げて公然と敵対する。
      1619年のサルフの戦いでは、四方から来る明の大軍を各個に破って決定的な勝利を得た。
      遼東の主要都市を次々に落とし、都を瀋陽へ移している。
      1626年、寧遠城で明の大砲に阻まれて敗れ、その傷がもとで没したと伝えられる。

      一代で辺境の一族を国家に育て、後継者に明を倒せる体制を残した。
      八旗は清の支配の骨格として、19世紀まで維持される。
      満洲の名を掲げて多民族の帝国を築く道筋は、この人物の代で引かれた。
