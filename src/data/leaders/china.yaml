  - id: yongzheng
    title: 雍正帝
    start: 1722
    end: 1735
    category: politics
    tags: [中国, 清]
    summary: 軍機処の設置と徹底した実務で財政を立て直し、父と子の繁栄をつないだ。
    detail: |
      清の第5代皇帝で、在位は1722年から1735年までの13年。
      康熙帝の第4子で、激しい後継争いを制して即位した。
      父と子の長い治世のあいだにあって、実務で国家の土台を固め直した皇帝である。

      即位の経緯には遺詔を書き換えたという噂がつきまとい、兄弟を幽閉するなど厳しく臨んだ。
      同じ争いを繰り返させないため、後継者の名を書いて密かに保管し、死後に開封する方式を定める。
      皇帝への権力集中はこの代でさらに進んだ。
      1729年ごろ、軍事の機密を扱う機関として軍機処が置かれた。
      やがてこれが事実上の最高機関となり、少数の側近が皇帝と直結して政務を処理する。
      地方官に密封の上奏を直接送らせる仕組みを広げ、皇帝は自ら朱筆で返事を書いた。
      その量は膨大で、睡眠を削って裁可を続けたと伝えられる。

      財政では、人頭税を土地税に繰り込む地丁銀を全国に広げた。
      税の基準が土地に一本化され、戸籍を隠す必要が薄れて人口の把握が進む。
      地方官の収入を公式の手当てとして認め、汚職の温床を減らす改革も行った。
      南西部では、在地の首長による支配を官僚の直接統治に改める改土帰流を進めている。

      キリスト教の布教は、祖先祭祀をめぐる対立から禁じられた。
      短い在位ながら、康熙帝が広げた版図を運営できる財政と行政をこの代で整えている。
      華やかさはないが、清の最盛期を実際に支えた皇帝として評価されてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e3/Emperor_Yongzheng.PNG/500px-Emperor_Yongzheng.PNG
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emperor_Yongzheng.PNG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/雍正帝

  - id: qianlong
    title: 乾隆帝
    start: 1735
    end: 1796
    category: politics
    tags: [中国, 清]
    summary: 版図を最大に広げた一方、晩年の腐敗と対外的な硬直が衰退の始まりになった。
    detail: |
      清の第6代皇帝で、在位は1735年から1796年まで。
      祖父の康熙帝の在位年数を超えないよう、60年で自ら退いて太上皇となった。
      清の版図が最大になった時代であり、衰退の兆しが現れた時代でもある。

      即位時の国庫には、父の雍正帝が残した潤沢な蓄えがあった。
      それを背景に、十全武功と自称する十回の遠征を行う。
      1750年代にジュンガルを滅ぼして新疆を版図に加え、清の領域は現在の中国の輪郭を超える広さになった。
      チベット・モンゴル・新疆は理藩院が管轄し、皇帝はチベット仏教の保護者としても振る舞う。

      国内では人口が3億を超え、アメリカ大陸原産の作物が山地の開墾を可能にした。
      『四庫全書』の編纂では全国から書物を集めたが、同時に清に都合の悪い書物を大量に処分している。
      文字の獄と呼ばれる言論弾圧はこの時代に最も激しく、知識人は考証学へ向かった。
      晩年は寵臣の和珅が政治を壟断し、汚職が全土に広がる。
      遠征の費用と宮廷の浪費で財政は傾き、退位の年には白蓮教徒の大反乱が起きた。
      1793年にはイギリスのマカートニー使節が通商の拡大を求めたが、朝貢の枠を出ないとして退けている。

      最盛期の絶頂と下り坂の始まりが、同じ治世のなかに収まっている。
      広げた版図は現在の中国の領域の原型になった。
      一方で、外の世界の変化に向き合う機会を逃したという評価も定着している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/%E6%B8%85_%E9%83%8E%E4%B8%96%E5%AE%81%E7%BB%98%E3%80%8A%E6%B8%85%E9%AB%98%E5%AE%97%E4%B9%BE%E9%9A%86%E5%B8%9D%E6%9C%9D%E6%9C%8D%E5%83%8F%E3%80%8B.jpg/500px-%E6%B8%85_%E9%83%8E%E4%B8%96%E5%AE%81%E7%BB%98%E3%80%8A%E6%B8%85%E9%AB%98%E5%AE%97%E4%B9%BE%E9%9A%86%E5%B8%9D%E6%9C%9D%E6%9C%8D%E5%83%8F%E3%80%8B.jpg
      credit: ジュゼッペ・カスティリオーネ / Public domain
      page: https://commons.wikimedia.org/wiki/File:%E6%B8%85_%E9%83%8E%E4%B8%96%E5%AE%81%E7%BB%98%E3%80%8A%E6%B8%85%E9%AB%98%E5%AE%97%E4%B9%BE%E9%9A%86%E5%B8%9D%E6%9C%9D%E6%9C%8D%E5%83%8F%E3%80%8B.jpg
    links:
