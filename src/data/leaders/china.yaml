  - id: guangwu
    title: 光武帝
    start: 25
    end: 57
    category: politics
    tags: [中国, 後漢]
    summary: 一度滅んだ漢を建て直し、王朝が「再興」しうることを歴史に刻んだ。
    detail: |
      後漢の初代皇帝で、名は劉秀。
      前6年に生まれ、25年に即位して57年に没した。
      前漢の皇室につながる家柄ではあったが、地方で農業に携わる豪族の暮らしだった。

      新の末の混乱のなかで兄とともに挙兵し、反乱軍の一つに加わる。
      23年の昆陽の戦いでは、わずかな兵で王莽の大軍を破って名を上げた。
      直後に兄が味方の手で殺されるが、恨みを表に出さずに耐え、河北へ派遣された機会に独自の基盤を築く。
      25年に皇帝を称し、洛陽を都として漢の再興を宣言した。

      各地の群雄を平定するにはさらに12年を要した。
      一つを得ればさらに先を望むという「隴を得て蜀を望む」の言葉は、この過程で生まれている。
      統一後は奴婢を解放する詔を繰り返し出し、土地と戸口を調べ直して税の基礎を整えた。
      官庁と役人を減らし、田租を三十分の一に戻して負担を軽くしている。

      一度滅んだ王朝が建て直されたことは、中国史で中興の手本として扱われた。
      儒学を重んじ、学問を修めた人物を官に用いる方針も定着する。
      一方で、建国を支えた豪族の力は削がれず、後漢の政治は地方の有力者に依存し続けた。
      皇帝の外戚と宦官が争う後漢後期の混乱は、その構造から生まれている。
      厳光ら旧友を無理に仕官させなかった逸話も、寛容な君主像として語られてきた。
      後漢という呼び名は後世のもので、当時は前漢と同じく漢を名乗っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Liu_Xiu_%28Emperor_Guangwu_of_Han%29.png/500px-Liu_Xiu_%28Emperor_Guangwu_of_Han%29.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Liu_Xiu_(Emperor_Guangwu_of_Han).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/光武帝

  - id: cao-cao
    title: 曹操
    start: 196
    end: 220
    category: war
    tags: [中国, 三国]
    summary: 皇帝を擁して号令する形を取り、実力者が帝位を経ずに国を動かす手本になった。
    detail: |
      後漢末の武将・政治家で、魏の実質的な創業者。
      155年に生まれ、220年に没した。
      皇帝の位には就かず、献帝を立てたまま国政を握り続けた。

      宦官の養子の孫という家柄で、黄巾の乱の討伐で頭角を現す。
      196年、流浪していた献帝を自らの本拠の許に迎えたことが転機になった。
      天子を奉じて諸侯に命じるという名分を得て、以後の命令に朝廷の権威が伴う。
      荒れた土地に兵や流民を入植させる屯田制で、兵糧の問題も解いた。

      200年の官渡の戦いで、兵力に勝る袁紹を破って華北を手にする。
      しかし208年の赤壁の戦いで孫権と劉備の連合に敗れ、南北の統一は果たせなかった。
      家柄よりも才能で人を採ると宣言し、法を厳しく運用して軍と行政を動かしている。
      詩人としても知られ、建安文学と呼ばれる詩の流れの中心にいた。

      死の年に子の曹丕が禅譲を受けて魏を建て、曹操は武帝と追尊された。
      実力者が皇帝を擁したまま政治を動かす形は、以後も繰り返し現れる統治の型になる。
      『三国志演義』では劉備の敵役として描かれ、悪人の代表として語られてきた。
      近代以降は、制度を整えた現実的な統治者としての評価も並んでいる。
      屯田と人材登用の仕組みは、魏が三国で最も安定した国であり続けた理由になった。
      後世の権臣は、皇帝を立てたまま実権を握る先例としてこの名を引いている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/5/57/Cao_Cao_scth.jpg
      credit: 王圻 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Cao_Cao_scth.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/曹操

  - id: zhuge-liang
    title: 諸葛亮
    start: 223
    end: 234
    category: war
    tags: [中国, 三国, 蜀]
    summary: 小国の蜀を統治と外交で支え続け、忠臣の理想像として後世に語り継がれた。
    detail: |
      蜀漢の丞相で、字は孔明。
      181年に生まれ、234年に陣中で没した。
      劉備の死後、幼い皇帝を補佐して国政のすべてを預かった。

      荊州で晴耕雨読の暮らしをしていたところへ、劉備が三度訪ねて仕官を請うたと伝わる。
      そのとき示したのが、天下を三つに分けて荊州と益州を取るという構想だった。
      赤壁の前には呉へ渡って同盟をまとめ、劉備が益州を得たのちに丞相となる。
      223年、劉備が呉との戦いに敗れたのち白帝城で没し、後事を託された。

      まず呉との関係を立て直して同盟を回復し、南方の反乱を平定して後背を固めた。
      法を厳しく定めながら身分によらず公平に適用し、小国の統治を保つ。
      228年から五度にわたって北伐を行うが、国力の差と補給の難しさに阻まれた。
      234年、五丈原で司馬懿と対峙したまま病に倒れる。

      出陣にあたって皇帝に奉った出師表は、忠誠を尽くす臣の文章として読み継がれた。
      身をかがめて力を尽くし、死ぬまでやめないという言葉が、その生き方を表している。
      『三国志演義』では計略に長けた軍師として描かれ、東アジアで知恵者の代名詞になった。
      史実では、軍才よりも行政と法の運用に優れた人物として評価されている。
      北伐に用いたとされる木牛流馬など、補給の工夫も後世の関心を集めてきた。
      没後も蜀は30年続いたが、彼ほどの統治者は現れなかった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/%E6%98%8E%E4%BA%BA%E7%BB%98_%E3%80%8A%E8%AF%B8%E8%91%9B%E4%BA%AE%E5%83%8F%E3%80%8B%EF%BC%88%E5%8D%97%E8%96%B0%E6%AE%BF%E6%9C%AC%EF%BC%89.jpg/500px-%E6%98%8E%E4%BA%BA%E7%BB%98_%E3%80%8A%E8%AF%B8%E8%91%9B%E4%BA%AE%E5%83%8F%E3%80%8B%EF%BC%88%E5%8D%97%E8%96%B0%E6%AE%BF%E6%9C%AC%EF%BC%89.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:%E6%98%8E%E4%BA%BA%E7%BB%98_%E3%80%8A%E8%AF%B8%E8%91%9B%E4%BA%AE%E5%83%8F%E3%80%8B%EF%BC%88%E5%8D%97%E8%96%B0%E6%AE%BF%E6%9C%AC%EF%BC%89.jpg
