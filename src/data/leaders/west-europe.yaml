  - id: merkel
    title: メルケル
    start: 2005
    end: 2021
    category: politics
    tags: [ドイツ, EU]
    summary: 金融危機・難民・コロナで16年間EUの重心となり、慎重な調整型の指導を貫いた。
    detail: |
      ドイツの首相で、在任は2005年から2021年までの16年に及ぶ。
      女性として、また旧東ドイツの出身者として初めての首相である。
      金融危機、難民、コロナに対応し、EUの重心であり続けた。

      物理学者として旧東ドイツで研究していた。
      壁の崩壊を機に政治へ入り、コール政権で閣僚を務める。
      政党の資金疑惑で先輩世代が退いたのち、党首となった。

      手法は一貫して慎重である。
      大胆な演説よりも、粘り強い交渉と妥協で合意を作る。
      批判者はこれを優柔不断と呼び、支持者は安定と呼んだ。
      ユーロ危機では、財政支援の条件として厳しい緊縮を求めた。
      この方針は南欧諸国の強い反発を招き、ドイツの影響力が突出したという批判も生む。

      2011年の福島の事故を受け、原子力発電の段階的な廃止を決めた。
      2015年には、シリアなどからの難民を大量に受け入れる決断を下す。
      人道的な判断として評価される一方、国内では右派政党の台頭を招いた。
      新型コロナウイルスへの対応では、科学的な説明を自ら行う姿勢が評価された。
      退任時、ドイツ経済は好調を保っていた。
      ロシアの天然ガスへの依存など、残された判断への評価は後の情勢によって変わり続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/Besuch_Bundeskanzlerin_Angela_Merkel_im_Rathaus_K%C3%B6ln-09916_%28cropped%29.jpg/500px-Besuch_Bundeskanzlerin_Angela_Merkel_im_Rathaus_K%C3%B6ln-09916_%28cropped%29.jpg
      credit: ライモント・シュペッキング / CC BY-SA 4.0
