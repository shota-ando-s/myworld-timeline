        url: https://ja.wikipedia.org/wiki/ジョージ3世_(イギリス王)

  - id: robespierre
    title: ロベスピエール
    start: 1793
    end: 1794
    category: politics
    tags: [フランス革命, 恐怖政治]
    summary: 徳による共和国を掲げて恐怖政治に行き着き、革命が食い尽くす姿を残した。
    detail: |
      フランス革命期の政治家で、1793年から1794年にかけて権力の中心にいた。
      徳にもとづく共和国を掲げ、恐怖政治に行き着いた。

      地方の弁護士から議員になった。
      清廉な生活と原則を曲げない態度から、腐敗しない人と呼ばれる。
      死刑の廃止や普通選挙を主張した時期もあった。
      革命が進むなかで、ジャコバン派の指導者となる。
      国王の処刑を主張し、対外戦争と内乱の危機のなかで公安委員会に入った。

      1793年から翌年にかけて、革命政府は非常措置をとる。
      物価の統制と徴兵で戦争を乗り切る一方、革命裁判所が反対者を次々に処刑した。
      1万数千人が処刑され、さらに多くが獄死している。
      粛清は、最初は王党派に、次に穏健派に、そして仲間の急進派にも及んだ。

      ロベスピエールは、徳のない民主政は無力であり、恐怖なき徳は無力だと論じた。
      キリスト教に代わる最高存在の祭典を主催し、自ら司祭のように振る舞う。
      1794年7月、議会で次の粛清の対象を示唆したことが恐怖を呼んだ。
      翌日に逮捕され、裁判なしにギロチンで処刑される。
      理想を掲げた革命が、その論理によって仲間を食い尽くす過程を体現した人物として語られてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Robespierre.jpg/500px-Robespierre.jpg
      credit: 作者不明 / CC0
      page: https://commons.wikimedia.org/wiki/File:Robespierre.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マクシミリアン・ロベスピエール

  - id: napoleon-bonaparte
    title: ナポレオン・ボナパルト
    start: 1799
    end: 1815
    category: war
    tags: [フランス, 帝政]
    summary: 革命の成果を法典として各地に残し、同時に国民軍という新しい戦争の形を広めた。
    detail: |
      フランスの軍人・政治家で、1799年から1815年まで権力の座にあった。
      革命の成果を法典として各地に残し、国民軍という新しい戦争の形を広めた。

      コルシカ島に生まれ、砲兵将校として頭角を現した。
      イタリア遠征とエジプト遠征で名声を得て、1799年のクーデタで実権を握る。
      1804年には国民投票を経て皇帝となった。
      国内では、革命の混乱を収拾する制度を整えた。
      民法典を編纂し、法の下の平等、所有権の保障、契約の自由を定める。
      中央銀行を設立し、県知事を通じて全国を統治し、能力による登用の仕組みを作った。
      カトリック教会とも和解し、社会の安定を図っている。

      対外的には、ヨーロッパの大半を支配下に置いた。
      徴兵による大軍を機動的に運用し、決戦で敵の主力を叩く戦い方で連勝する。
      各国に兄弟や配下を王として置き、法典と改革を移植した。

      1812年のロシア遠征が転機になった。
      大軍が寒さと補給の途絶で壊滅し、各国が反攻に転じる。
      1814年に退位し、翌年復帰したがワーテルローで敗れ、南大西洋の島に流された。
      征服は失敗したが、法典と行政の仕組みは各国に残る。
      民族の自覚を刺激したことも、その後のヨーロッパを変えた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Fran%C3%A7ois_G%C3%A9rard_-_Napoleon_I_001.JPG/500px-Fran%C3%A7ois_G%C3%A9rard_-_Napoleon_I_001.JPG
      credit: Workshop of フランソワ・ジェラール / Public domain
      page: https://commons.wikimedia.org/wiki/File:Fran%C3%A7ois_G%C3%A9rard_-_Napoleon_I_001.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ナポレオン・ボナパルト

  - id: metternich
    title: メッテルニヒ
    start: 1815
    end: 1848
    category: politics
    tags: [オーストリア, ウィーン体制]
    summary: 勢力均衡と自由主義の抑圧でヨーロッパの秩序を30年保った保守外交の象徴。
    detail: |
      オーストリアの外交官・政治家で、1815年から1848年までヨーロッパの秩序を主導した。
      勢力均衡と自由主義の抑圧によって、30年以上の安定を保った。
      保守外交の象徴とされる。

      ナポレオン戦争の末期に外相となり、対仏同盟をまとめた。
      1814年から翌年のウィーン会議を主催し、戦後の秩序を設計する。
      原則は二つあった。
      一つは正統主義で、革命前の王朝と体制を回復すること。
      もう一つは勢力均衡で、どの国も突出しないように領土を配分することである。
      フランスを過度に罰せず、大国の一員として復帰させた点も、均衡の維持を重んじた結果だった。

      会議の後も、各国が協議して秩序を維持する体制が作られた。
      革命や独立の動きが起きれば、共同で介入する。
      イタリアやスペインの自由主義運動は、こうして抑え込まれた。

      国内では、検閲と秘密警察によって言論を統制した。
      大学の学生団体を解散させ、自由主義と民族主義を危険視する。
      オーストリアは多民族の帝国であり、民族主義は国家の解体に直結する。
      この事情が、抑圧的な政策の背景にあった。
      1848年の革命でウィーンに暴動が起き、メッテルニヒは亡命した。
      体制は崩れたが、大国間の大規模な戦争を長く防いだ点は評価されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/Prince_Metternich_by_Lawrence.jpeg/500px-Prince_Metternich_by_Lawrence.jpeg
      credit: トーマス・ローレンス / Public domain
      page: https://commons.wikimedia.org/wiki/File:Prince_Metternich_by_Lawrence.jpeg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クレメンス・フォン・メッテルニヒ

  - id: queen-victoria
    title: ヴィクトリア女王
    start: 1837
    end: 1901
    category: politics
    tags: [イギリス, 帝国]
    summary: 君臨すれども統治せずの形を定着させ、その名が大英帝国の絶頂期の代名詞になった。
    detail: |
      イギリス女王で、在位は1837年から1901年までの63年に及ぶ。
      君臨すれども統治せずという立憲君主の形を定着させた。
      その名が、大英帝国の絶頂期の代名詞になっている。

      18歳で即位した。
      即位の時点で、国王が政治を主導する時代はすでに終わりかけていた。
      議会と内閣が実務を担い、君主は助言し、励まし、警告する立場にとどまる。
      この役割を、長い在位を通じて形として固めた。
      夫アルバートの影響は大きい。
      産業と科学の振興に熱心で、1851年のロンドン万国博覧会を主導した。
      1861年に夫が没すると、女王は長く公の場から退き、批判も受ける。

      治世のあいだに、イギリスは世界の四分の一を支配する帝国になった。
      1877年にはインド皇帝の称号を得ている。
      選挙権は二度の改革で拡大し、労働者層にも及んだ。
      鉄道、電信、蒸気船が生活と経済を変えている。

      九人の子はヨーロッパ各国の王室に嫁ぎ、ヨーロッパの祖母と呼ばれた。
      第一次世界大戦で敵味方に分かれた君主たちの多くが、その血縁にある。
      道徳と家庭を重んじる価値観は、ヴィクトリア朝という言葉で今も参照される。
      一方、帝国の繁栄の裏には植民地の負担があった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/Queen_Victoria_-Golden_Jubilee_-3a_cropped.JPG/500px-Queen_Victoria_-Golden_Jubilee_-3a_cropped.JPG
      credit: アレッサンドロ・バッサーノ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Queen_Victoria_-Golden_Jubilee_-3a_cropped.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴィクトリア_(イギリス女王)

  - id: bismarck
    title: ビスマルク
    start: 1862
    end: 1890
    category: politics
    tags: [ドイツ, 統一]
    summary: 三つの戦争でドイツを統一し、社会保険という飴も使って国民を国家に結びつけた。
    detail: |
      プロイセンの首相からドイツ帝国の宰相となった政治家で、1862年から1890年まで政治を主導した。
      三つの戦争でドイツを統一し、その後は勢力均衡の維持に努めた。

      地主貴族の出身で、保守的な立場から政界に入った。
      首相就任の直後、軍備拡張をめぐって議会と対立する。
      時代の問題は演説や多数決ではなく鉄と血によって決せられる、と述べた演説が知られる。
      統一は三つの戦争によって進んだ。
      デンマークとの戦争で領土問題を作り、オーストリアとの戦争で7週間の勝利を収めてドイツから排除する。
      スペインの王位継承を口実にフランスを挑発し、普仏戦争で決定的な勝利を得た。
      1871年、ヴェルサイユ宮殿でドイツ帝国の成立が宣言される。

      統一後の外交は一転して慎重になった。
      ドイツはこれ以上領土を求めないと宣言し、フランスを孤立させる同盟網を張り巡らせる。
      この体制は20年近く大国間の戦争を防いだ。

      内政では、カトリックと社会主義者を抑圧する一方、世界初の社会保険制度を導入した。
      疾病・労災・老齢の保険は、労働者を体制に取り込む狙いである。
      1890年、新しい皇帝と対立して辞任した。
      彼の去った後、同盟網は崩れ、対立は第一次世界大戦へ向かう。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/10/Bundesarchiv_Bild_146-2005-0057%2C_Otto_von_Bismarck.jpg/500px-Bundesarchiv_Bild_146-2005-0057%2C_Otto_von_Bismarck.jpg
      credit: ジャック・ピラーツ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Bundesarchiv_Bild_146-2005-0057,_Otto_von_Bismarck.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/オットー・フォン・ビスマルク

  - id: wilhelm-ii
    title: ヴィルヘルム2世
    start: 1888
    end: 1918
    category: politics
    tags: [ドイツ, 帝国主義]
    summary: ビスマルクを退けて世界政策に走り、列強の対立を第一次世界大戦へ導いた。
    detail: |
      ドイツ皇帝で、在位は1888年から1918年まで。
      ビスマルクを退けて世界政策を掲げ、列強の対立を深めた。
      帝政の最後の皇帝である。

      29歳で即位し、すぐに老宰相ビスマルクと対立した。
      1890年に辞任させ、以後は自ら外交を主導する。
      方針は大きく変わった。
      ビスマルクが築いたロシアとの条約を更新せず、ロシアはフランスと同盟を結ぶ。
      ドイツを囲む形の包囲網が、こうして生まれた。
      世界政策を掲げ、海軍の大増強に着手する。
      イギリスとの建艦競争が始まり、両国の関係は悪化した。
      モロッコをめぐってフランスと二度衝突し、かえって英仏の結束を強めている。

      言動は不用意だった。
      外国の新聞に自国の外交を語り、周囲を慌てさせることが繰り返される。
      軍服を好み、強硬な演説を行う姿勢が、周辺国の警戒を招いた。
      1914年、オーストリアに無条件の支持を与えたことが、危機の拡大を招く。
      開戦後は軍の指導部に実権が移り、皇帝の役割は象徴的なものになった。

      1918年、革命によって退位しオランダへ亡命する。
      500年続いたホーエンツォレルン家の支配は終わった。
      個人の資質が国際関係を左右した例として論じられることが多い。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Kaiser_Wilhelm_II_of_Germany_-_1902.jpg/500px-Kaiser_Wilhelm_II_of_Germany_-_1902.jpg
      credit: Studio of トーマス・ハインリヒ・フォークト / Public domain
      page: https://commons.wikimedia.org/wiki/File:Kaiser_Wilhelm_II_of_Germany_-_1902.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴィルヘルム2世_(ドイツ皇帝)

  - id: hitler
    title: ヒトラー
    start: 1933
    end: 1945
    category: politics
    tags: [ドイツ, ナチス]
    summary: 合法的に権力を得てから民主主義を壊し、戦争とホロコーストを引き起こした。
    detail: |
      ドイツの独裁者で、1933年から1945年まで政権を握った。
      合法的に権力を得てから民主主義を解体し、戦争とホロコーストを引き起こした。

      オーストリアに生まれ、画家を志して失敗した。
      第一次世界大戦にドイツ軍の兵士として従軍し、敗戦に強い衝撃を受ける。
      戦後、小さな政党に加わって演説の才能で頭角を現した。
      1923年のクーデタの失敗で投獄され、獄中で自らの世界観を著書にまとめる。
      人種の優劣と生存圏の獲得という主張は、後の政策の骨格になった。
      世界恐慌が転機になる。
      失業と不安のなかで、国家の再建と敵の名指しを語る演説が支持を集めた。
      1932年に第一党となり、翌年首相に任命される。

      権力の掌握は速かった。
      非常事態の宣言と全権委任法で議会を無力化し、党内の対立者も粛清する。
      大統領の死後は国家元首と首相を兼ねた。
      再軍備と領土の拡大を進め、1939年に大戦を引き起こす。
      占領地では組織的な殺戮が行われた。

      軍事の指揮にも介入し、撤退を許さない命令が損害を拡大させる。
      1945年4月、ベルリンの地下壕で自殺した。
      一人の人物と大衆運動がどのように結びついたかは、今も研究の対象であり続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e1/Hitler_portrait_crop.jpg/500px-Hitler_portrait_crop.jpg
      credit: ハインリヒ・ホフマン / CC BY-SA 3.0 de
      page: https://commons.wikimedia.org/wiki/File:Hitler_portrait_crop.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アドルフ・ヒトラー

  - id: churchill
    title: チャーチル
    start: 1940
    end: 1945
    category: war
    tags: [イギリス, 第二次世界大戦]
    summary: 単独でドイツに立ち向かう時期のイギリスを言葉で支え、米ソとの連合を作った。
    detail: |
      イギリスの首相で、1940年から1945年まで戦時内閣を率いた。
      単独でドイツに立ち向かう時期の国民を言葉で支え、米ソとの連合を作った。

      貴族の家に生まれ、軍人と記者を経て政界に入った。
      第一次世界大戦での作戦の失敗や、政策をめぐる対立で、長く不遇の時期を過ごす。
      1930年代にはドイツの再軍備への警戒を訴え続けたが、少数派だった。
      1940年5月、宥和政策が破綻した局面で首相に就任した。
      フランスが降伏し、イギリスが単独で戦う状況になる。
      血と労苦と涙と汗のほかに提供できるものはないと演説し、降伏の選択を退けた。

      航空戦を耐え抜き、ラジオ演説で国民の士気を保つ。
      アメリカのローズヴェルトとの関係を築き、参戦前から物資の支援を取りつけた。
      ドイツがソ連に侵攻すると、共産主義への批判を一時棚上げして同盟を結ぶ。
      戦後の構想でも主要な役割を果たした。
      ヤルタとポツダムの会談に臨み、戦後の枠組みを議論する。

      1945年の総選挙では敗れ、首相を退いた。
      1946年には、ヨーロッパを分ける鉄のカーテンについて演説し、冷戦の構図を言い当てる。
      1951年に再び首相となり、著述でも評価されてノーベル文学賞を受けた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bc/Sir_Winston_Churchill_-_19086236948.jpg/500px-Sir_Winston_Churchill_-_19086236948.jpg
      credit: ユーサフ・カーシュ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Sir_Winston_Churchill_-_19086236948.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウィンストン・チャーチル

  - id: franco
    title: フランコ
    start: 1939
    end: 1975
    category: politics
    tags: [スペイン, 独裁]
    summary: 内戦に勝って36年続く独裁を敷き、その死が西欧に残った独裁の終わりになった。
    detail: |
      スペインの軍人・独裁者で、1939年から1975年まで国家元首の地位にあった。
      内戦に勝って36年続く体制を敷いた。
      その死が、西欧に残っていた独裁の終わりになる。

      職業軍人として北アフリカで実績を積み、若くして将軍になった。
      1936年、左派の人民戦線政府に対する軍の反乱に加わり、やがてその指導者となる。
      内戦は3年に及んだ。
      ドイツとイタリアが反乱側を支援し、ソ連が政府側を助け、各国から義勇兵が集まる。
      ゲルニカへの空襲は、都市への無差別爆撃の初期の例として知られる。
      1939年、マドリードの陥落で内戦は終わった。

      勝利後、数万人が処刑または投獄された。
      言論と政党は禁じられ、地域の言語も抑圧される。
      第二次世界大戦では中立を保ち、枢軸国に接近しながら参戦は避けた。
      この判断が、戦後の存続を可能にする。
      冷戦下では反共の立場からアメリカと協定を結び、国際社会に復帰した。

      1950年代末から経済は自由化され、観光と工業で急成長する。
      一方、政治の統制は最後まで緩まなかった。
      1975年の死後、後継に指名された国王が民主化を主導する。
      数年で複数政党制と憲法が実現し、スペインは民主主義国家へ移行した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cf/RETRATO_DEL_GRAL._FRANCISCO_FRANCO_BAHAMONDE_%28adjusted_levels%29.jpg/500px-RETRATO_DEL_GRAL._FRANCISCO_FRANCO_BAHAMONDE_%28adjusted_levels%29.jpg
      credit: 作者不明 / CC0
      page: https://commons.wikimedia.org/wiki/File:RETRATO_DEL_GRAL._FRANCISCO_FRANCO_BAHAMONDE_(adjusted_levels).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フランシスコ・フランコ

  - id: adenauer
    title: アデナウアー
    start: 1949
    end: 1963
    category: politics
    tags: [西ドイツ, 西側統合]
    summary: 西ドイツを西側とヨーロッパ統合に組み込み、戦後の再出発の形を決めた。
    detail: |
      西ドイツの初代首相で、在任は1949年から1963年まで。
      戦後の西ドイツを西側とヨーロッパ統合に組み込んだ。
      再出発の形を決めた人物である。

      ケルン市長を長く務め、ナチス期には解任されて投獄も経験した。
      73歳で首相となり、87歳まで務める。
      方針は明確だった。
      中立や東西の架け橋ではなく、西側の一員として復帰する道を選ぶ。
      1955年に主権を回復し、NATOに加盟した。

      フランスとの和解を最優先した。
      石炭鉄鋼共同体に参加し、ローマ条約でヨーロッパ経済共同体の創設に加わる。
      長年の敵対関係を、経済の統合によって解消しようとする発想である。
      1963年にはド・ゴールと友好条約を結んだ。

      経済では、エアハルトが進めた社会的市場経済が高度成長を生んだ。
      奇跡と呼ばれる復興によって、国民の支持は安定する。
      イスラエルとの補償協定を結び、ホロコーストへの責任を国家として認めた。
      一方、行政と司法には旧体制に関わった人物も多く残り、過去の清算は不十分だったという批判もある。
      東ドイツを国家として認めず、統一は将来の課題として残された。
      現在のドイツの立ち位置は、この時期の選択の上にある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Bundesarchiv_B_145_Bild-F078072-0004%2C_Konrad_Adenauer.jpg/500px-Bundesarchiv_B_145_Bild-F078072-0004%2C_Konrad_Adenauer.jpg
      credit: Katherine Young (1906–1993) / CC BY-SA 3.0 de
      page: https://commons.wikimedia.org/wiki/File:Bundesarchiv_B_145_Bild-F078072-0004,_Konrad_Adenauer.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/コンラート・アデナウアー

  - id: de-gaulle
    title: ド・ゴール
    start: 1958
    end: 1969
    category: politics
    tags: [フランス, 第五共和政]
    summary: 強い大統領制を作り、米ソのどちらにも寄りかからない独自路線を取った。
    detail: |
      フランスの軍人・政治家で、1958年から1969年まで大統領を務めた。
      強い権限を持つ大統領制を作り、米ソのどちらにも寄りかからない路線をとった。

      第二次世界大戦の初期、政府が降伏するとロンドンへ渡って抗戦を呼びかけた。
      自由フランスを組織し、レジスタンスをまとめる。
      戦後は臨時政府を率いたが、政党政治との対立から退いた。
      1958年、アルジェリア戦争で国家が分裂しかけたときに復帰する。
      新しい憲法を作り、大統領に強い権限を与える第五共和政を発足させた。

      アルジェリアについては、独立を認める決断を下した。
      入植者と軍の一部が反発し、クーデタ未遂と暗殺の企てが繰り返される。
      1962年に独立が成立した。
      外交では独自路線を貫いた。
      核兵器を自力で開発し、NATOの軍事機構から脱退する。
      イギリスのEEC加盟を二度拒否し、中国を早期に承認した。
      アメリカの覇権に対して、ヨーロッパの自立を主張し続ける。

      1968年の五月危機では、学生と労働者の大規模な運動に直面した。
      翌年の国民投票に敗れて辞任する。
      強い行政府と国際的な自立という枠組みは、現在のフランスにも引き継がれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/27/De_Gaulle-OWI.jpg/500px-De_Gaulle-OWI.jpg
      credit: Office of War Information, Overseas Picture Division. [1] The image prefix (LC-USW3) at the Library of Congress image page matches that of pictures from the OWI collection (see prefix list here. / Public domain
      page: https://commons.wikimedia.org/wiki/File:De_Gaulle-OWI.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シャルル・ド・ゴール

  - id: willy-brandt
    title: ブラント
    start: 1969
    end: 1974
    category: politics
    tags: [西ドイツ, 東方外交]
    summary: 東側との和解を進め、ワルシャワでの跪きが戦後和解の象徴になった。
    detail: |
      西ドイツの首相で、在任は1969年から1974年まで。
      東側との和解を進める東方政策を主導した。
      ワルシャワでの跪きが、戦後の和解の象徴になっている。

      ナチス期にノルウェーとスウェーデンへ亡命し、抵抗運動に関わった。
      戦後は西ベルリン市長を務め、壁の建設を目の当たりにする。
      首相就任後、東欧との関係の正常化に着手した。
      ソ連、ポーランドと条約を結び、戦後の国境を事実上承認する。
      東ドイツとは基本条約を結び、互いの存在を認め合った。
      両ドイツは国連に同時加盟する。

      それまでの西ドイツは、東ドイツを承認する国と国交を持たない方針をとっていた。
      この転換は国内で激しい論争を呼び、退陣を求める動議も出される。
      1970年、ワルシャワのゲットー蜂起の記念碑の前で、ブラントは突然ひざまずいた。
      言葉によらないこの行為は、ドイツの謝罪の姿勢を世界に示すものとして受け取られる。
      翌年、ノーベル平和賞を受けた。

      1974年、側近が東ドイツのスパイだったことが発覚して辞任する。
      東方政策は、緊張を和らげ人の往来を可能にした。
      20年後の統一の下地になったという評価も定着している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/Bundesarchiv_B_145_Bild-F057884-0009%2C_Willy_Brandt.jpg/500px-Bundesarchiv_B_145_Bild-F057884-0009%2C_Willy_Brandt.jpg
      credit: Engelbert Reineke / CC BY-SA 3.0 de
      page: https://commons.wikimedia.org/wiki/File:Bundesarchiv_B_145_Bild-F057884-0009,_Willy_Brandt.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヴィリー・ブラント

  - id: thatcher
    title: サッチャー
    start: 1979
    end: 1990
    category: economy
    tags: [イギリス, 新自由主義]
    summary: 民営化と規制緩和で戦後の福祉国家路線を転換し、各国の政策に影響を与えた。
    detail: |
      イギリスの首相で、在任は1979年から1990年まで。
      民営化と規制緩和によって、戦後の福祉国家路線を転換した。
      イギリス初の女性首相である。

      就任時、イギリスは高いインフレと失業、労働争議に苦しんでいた。
      英国病という言葉が使われるほど、経済の停滞が続いている。
      政策の柱は市場の重視だった。
      国営だった電話、ガス、水道、航空、鉄鋼を次々に民営化する。
      公営住宅を居住者に売却し、金融の規制を大幅に緩めた。
      減税と通貨供給の抑制でインフレを抑える一方、失業は300万を超える。

      労働組合とは正面から対立した。
      1984年からの炭鉱労働者のストライキに1年間耐え、屈服させる。
      これによって組合の政治的な力は大きく後退した。
      外交では、フォークランド紛争での勝利が支持を高めた。
      アメリカのレーガンと協調し、ソ連のゴルバチョフとも対話の窓口を作る。
      ヨーロッパ統合の深化には強く反対した。

      人頭税の導入への反発と党内の対立から、1990年に辞任する。
      小さな政府と市場の重視という路線は、各国の政策に影響を与えた。
      同時に、格差の拡大と地域の疲弊をめぐる評価は、今も分かれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/47/Margaret_Thatcher_stock_portrait_%282%29_%28cropped%29.jpg/500px-Margaret_Thatcher_stock_portrait_%282%29_%28cropped%29.jpg
      credit: 二次著作物 次のものによる： Begoon / Copyrighted free use
      page: https://commons.wikimedia.org/wiki/File:Margaret_Thatcher_stock_portrait_(2)_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マーガレット・サッチャー

  - id: mitterrand
    title: ミッテラン
    start: 1981
    end: 1995
    category: politics
    tags: [フランス, EU]
    summary: 左派として初の大統領となり、ドイツと組んで通貨統合への道を敷いた。
    detail: |
      フランスの大統領で、在任は1981年から1995年までの14年に及ぶ。
      第五共和政で初めての左派の大統領である。
      ドイツと組んで通貨統合への道を敷いた。

      社会党を立て直し、共産党との連合によって政権を得た。
      就任当初は、公約に沿った政策をとった。
      銀行と主要産業の国有化、最低賃金の引き上げ、週39時間労働、死刑の廃止が実行される。
      しかし資本の流出とインフレで経済は悪化し、2年後には緊縮へ転換した。
      理念より現実を優先した判断として評価が分かれる。

      1986年からは、議会で多数を得た右派の首相と同居する体制になった。
      大統領と首相が別の陣営から出るこの形は、保革共存と呼ばれる。
      二度経験し、制度として定着させた。
      ヨーロッパ統合では積極的だった。
      ドイツのコールと組んで単一市場と通貨統合を進め、マーストリヒト条約の成立を主導する。
      ドイツ統一を当初は警戒したが、最終的にはヨーロッパ統合の深化と引き換えに受け入れた。

      文化事業にも力を入れ、ルーヴルのピラミッドや国立図書館を建てている。
      晩年は在任中の病を隠していたことや、戦時中の経歴をめぐる議論が表面化した。
      長期政権のなかで、フランス左派の現実路線が形になった時期でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/President_Fran%C3%A7ois_Mitterrand_in_1983.jpg/500px-President_Fran%C3%A7ois_Mitterrand_in_1983.jpg
      credit: Comet Photo AG (Zürich) / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:President_Fran%C3%A7ois_Mitterrand_in_1983.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フランソワ・ミッテラン

  - id: helmut-kohl
    title: コール
    start: 1982
    end: 1998
    category: politics
    tags: [ドイツ, 統一]
    summary: 東西ドイツの統一を短期間でまとめ、ユーロ導入を政治的に押し切った。
    detail: |
      ドイツの首相で、在任は1982年から1998年まで。
      東西ドイツの統一を短期間でまとめ、ユーロの導入を政治的に押し切った。

      就任当初は、地味で野心の乏しい政治家と見られていた。
      1989年に東ドイツの体制が揺らぐと、その評価は一変する。
      壁が開かれた直後、統一へ向けた10項目の計画を発表した。
      当初は段階的な接近を想定していたが、東ドイツの人口流出と経済の崩壊を受けて加速させる。

      外交では、四つの戦勝国の同意を得る必要があった。
      ソ連のゴルバチョフに経済支援を約束して統一とNATO加盟を認めさせ、イギリスとフランスの懸念には統合の深化で応える。
      1990年10月、壁が開かれてから1年足らずで統一が実現した。

      東ドイツの通貨を1対1で交換する決定は、経済的には批判されたが政治的には不可欠だった。
      旧東ドイツの再建には長い時間と巨額の費用がかかり、失業と不満が残る。
      ユーロの導入では、マルクを手放すことへの国内の抵抗が強かった。
      ドイツの統一がヨーロッパの統合と結びついていることを説き、これを押し切る。
      退任後、政党の資金をめぐる疑惑で信用を落とした。
      それでも統一とユーロという二つの事業は、現在のヨーロッパの枠組みを形づくっている。
