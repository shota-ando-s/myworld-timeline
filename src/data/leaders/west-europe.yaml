lane: west-europe

# フランク・神聖ローマ・英仏独、そしてスペインを含む近代以降の西欧の統治者。
leaders:
  - id: clovis
    title: クローヴィス
    start: 481
    end: 511
    category: politics
    tags: [フランク, カトリック]
    summary: フランク族を統一しカトリックに改宗したことで、ローマ教会と結ぶ王権の型ができた。
    detail: |
      フランク王国メロヴィング朝の創始者で、在位は481年から511年まで。
      分裂していたフランク族を統一し、ガリアの大半を支配下に置いた。
      カトリックへの改宗によって、後のヨーロッパの王権の型を作った。

      15歳で小部族の長を継いだ。
      486年、ガリアに残っていたローマの勢力を破り、パリを含む地域を得る。
      その後、アラマンニ人、ブルグント、西ゴートと戦い、領域を広げた。
      最大の決断は宗教である。
      当時、ゲルマン諸族の多くはアリウス派のキリスト教を受け入れていた。
      これはローマ教会が異端とする立場であり、現地の住民との溝になる。

      クローヴィスは、カトリックの信仰を持つ妻の影響を受け、戦いの勝利を機に洗礼を受けたと伝えられる。
      3000人の兵がともに洗礼を受けたともいう。
      これによってローマ系の住民と司教たちの支持を得た。
      異端の王を討つという名分で西ゴートを攻め、教会の後押しも受けている。
      フランク王国が他のゲルマン諸国より長く続いた理由の一つは、この選択にあった。

      晩年、慣習法を文書にまとめさせた。
      王位は息子たちに分割されて相続され、分裂と再統合が繰り返される。
      王と教会が互いを支え合う関係は、以後の西ヨーロッパの政治の基本になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Fran%C3%A7ois-Louis_Dejuinne_%281786-1844%29_-_Clovis_roi_des_Francs_%28465-511%29.jpg/500px-Fran%C3%A7ois-Louis_Dejuinne_%281786-1844%29_-_Clovis_roi_des_Francs_%28465-511%29.jpg
      credit: フランソワ＝ルイ・ドゥジュワンヌ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Fran%C3%A7ois-Louis_Dejuinne_(1786-1844)_-_Clovis_roi_des_Francs_(465-511).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/クローヴィス1世_(フランク王)

  - id: charlemagne
    title: カール大帝
    start: 768
    end: 814
    category: politics
    tags: [フランク, 帝国]
    summary: 西ヨーロッパの大半を一つにまとめ、ラテン教会・古典・ゲルマンが混じる文明の核を作った。
    detail: |
      フランク王国の王で、在位は768年から814年まで。
      西ヨーロッパの大半を一つにまとめ、800年にローマ皇帝の冠を受けた。
      ラテン教会・古典・ゲルマンが混じる文明の核を作った人物である。

      即位後、ほぼ毎年のように遠征を行った。
      イタリアのランゴバルド王国を滅ぼし、東方ではザクセン人を30年かけて征服する。
      ザクセンでは改宗を強制し、抵抗する者を大量に処刑した。
      アヴァール人を破り、スペイン北部にも拠点を築いている。
      統治では、各地に伯を置き、巡察使を派遣して監督させた。
      首都をアーヘンに定め、宮廷に学者を集める。

      文化の面での事業が大きい。
      各地の修道院で古典と聖書の写本が作られ、読みやすい書体が整えられた。
      現在のアルファベットの小文字は、この時期の書体に由来する。
      学校が設けられ、聖職者の教育が体系化された。

      800年のクリスマス、ローマで教皇から皇帝の冠を授けられた。
      西ヨーロッパが東ローマとは別の帝国を持ったことを意味する。
      教皇が冠を授けるという形式は、後の政教関係の前提になった。
      死後、帝国は孫の代で三つに分かれる。
      それでも、ヨーロッパという単位を初めて実体として示した支配者として記憶されてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/D%C3%BCrer_karl_der_grosse.jpg/500px-D%C3%BCrer_karl_der_grosse.jpg
      credit: アルブレヒト・デューラー / Public domain
      page: https://commons.wikimedia.org/wiki/File:D%C3%BCrer_karl_der_grosse.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カール大帝

  - id: otto-the-great
    title: オットー1世
    start: 936
    end: 973
    category: politics
    tags: [ドイツ, 神聖ローマ]
    summary: マジャール人を破り帝冠を受けて、ドイツ王が皇帝を兼ねる千年の枠組みを始めた。
    detail: |
      東フランク王でのちに神聖ローマ皇帝となった人物で、在位は936年から973年まで。
      マジャール人を破り、教皇から帝冠を受けた。
      ドイツ王が皇帝を兼ねる枠組みが、ここから1000年近く続く。

      即位したとき、王権は弱かった。
      各地の部族公が自立し、弟や息子までが反乱を起こしている。
      オットーはこれらを武力で制し、有力な地位に自らの親族と司教を配した。
      聖職者を統治に使う仕組みが特徴である。
      司教や修道院長に広い領地と行政の権限を与え、その任命権を王が握る。
      聖職者は世襲しないため、領地が世襲貴族の手に渡らない利点があった。
      この帝国教会政策が、後の叙任権闘争の火種にもなる。

      955年、レヒフェルトの戦いでマジャール人を撃破した。
      数十年にわたり西ヨーロッパを荒らしてきた騎馬勢力の侵入は、これで終わる。
      マジャール人は定住してハンガリー王国を作った。
      962年、イタリアに遠征して教皇から皇帝の冠を受けた。
      カール大帝以来の帝位の復活であり、神聖ローマ帝国の実質的な起点とされる。

      皇帝位とイタリアへの関与は、その後の歴代のドイツ王を縛ることになる。
      イタリア遠征に力を注ぐあいだに、ドイツ国内では諸侯の自立が進んだ。
      栄光と負担の両方を、この時期に引き受けたことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8e/Otto_I_%28HRE%29.jpg/500px-Otto_I_%28HRE%29.jpg
      credit: Axel Mauruszat / Public domain
      page: https://commons.wikimedia.org/wiki/File:Otto_I_(HRE).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/オットー1世_(神聖ローマ皇帝)

  - id: hugh-capet
    title: ユーグ・カペー
    start: 987
    end: 996
    category: politics
    tags: [フランス, カペー朝]
    summary: 弱小の王として選ばれながら、800年続くフランス王家の祖になった。
    detail: |
      フランスのカペー朝を開いた王で、在位は987年から996年まで。
      有力諸侯に選ばれて即位した。
      その血統は形を変えながら800年以上フランスの王位を占める。

      ロベール家の当主で、パリ周辺に所領を持つ有力者だった。
      カロリング朝の血筋が途絶えかけたとき、諸侯と聖職者の会議で王に選ばれる。
      選出には、ランスの大司教の働きかけが大きかったとされる。
      王としての実力は限られていた。
      直轄領はパリとオルレアンの周辺だけで、諸侯のほうが広い領地を持つ。
      王の命令は、自分の領地の外ではほとんど通らなかった。

      それでも王位には象徴的な意味があった。
      聖別の儀式を受けた王は、他の諸侯とは異なる存在とされる。
      教会との結びつきが、この権威を支えた。
      ユーグは即位の年のうちに、息子を共同の王として戴冠させた。
      この慣行が代々繰り返され、選挙で選ばれる王位は事実上の世襲に変わる。
      王朝が途切れずに続いた理由の一つである。

      在位中の事績は乏しく、領土も広がらなかった。
      しかし王家を確立したことの意味は大きい。
      後継者たちが少しずつ権力を積み上げ、フランスという国家を作り上げていくことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/King_Hugh_Capet.jpg/500px-King_Hugh_Capet.jpg
      credit: シャルル・ド・スチューベン / Public domain
      page: https://commons.wikimedia.org/wiki/File:King_Hugh_Capet.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ユーグ・カペー

  - id: william-the-conqueror
    title: ウィリアム1世
    start: 1066
    end: 1087
    category: politics
    tags: [イングランド, ノルマン]
    summary: イングランドを征服して大陸の制度と言語を持ち込み、英仏の長い因縁を作った。
    detail: |
      ノルマンディー公でイングランド王となった人物で、在位は1066年から1087年まで。
      征服によって大陸の制度と言語をイングランドに持ち込んだ。
      英仏の長い因縁は、ここから始まる。

      ノルマンディー公の庶子として生まれ、幼くして公位を継いだ。
      暗殺の危険のなかで育ち、反抗する諸侯を抑えて公国を固める。
      イングランド王エドワードが子を残さずに没すると、王位を主張した。
      約束されていたという根拠を掲げ、教皇の支持も得る。
      1066年、艦隊で海峡を渡りヘイスティングズでハロルド王を破った。

      征服後の統治は徹底していた。
      イングランドの土地をすべて王のものとし、従軍した家臣に封として分け与える。
      旧来の貴族はほぼ入れ替わり、各地に石造りの城が築かれた。
      北部の反乱に対しては、村を焼き払って荒廃させる報復を行っている。

      1086年、全国の土地と財産の徹底的な調査を命じた。
      その記録はドゥームズデイ・ブックと呼ばれ、中世ヨーロッパで比類のない行政文書である。
      王がノルマンディーの支配者でもあったことが、その後の複雑な関係を生んだ。
      宮廷ではフランス語が使われ、英語に大量の語彙が流入する。
      イングランドの王が大陸に領地を持つ構造は、百年戦争まで続いた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウィリアム1世

  - id: frederick-barbarossa
    title: フリードリヒ1世
    start: 1152
    end: 1190
    category: war
    tags: [神聖ローマ, イタリア政策]
    summary: 皇帝の威信をイタリアで示そうと遠征を重ね、ドイツ国内の分立を進めてしまった。
    detail: |
      神聖ローマ皇帝で、在位は1152年から1190年まで。
      赤ひげを意味する異名で呼ばれた。
      皇帝の威信をイタリアで示そうと遠征を重ねたが、結果としてドイツ国内の分立を進めた。

      即位したとき、帝国は諸侯の争いで分裂していた。
      フリードリヒは有力者の利害を調整し、対立する家系の双方に配慮して国内を安定させる。
      イタリアへは六度にわたって遠征した。
      北イタリアの都市が自治を強め、皇帝の権利を無視していたためである。
      古代ローマ法の研究者を集め、皇帝の権利を法的に根拠づけようとした。
      ミラノを徹底的に破壊するなど、強硬な手段もとっている。

      都市側はロンバルディア同盟を結び、教皇と組んで抵抗した。
      1176年のレニャーノの戦いで皇帝は敗れ、都市の自治を認めざるをえなくなる。
      ドイツ国内では、有力諸侯との対立も抱えた。
      最大の実力者であったハインリヒ獅子公を裁判にかけて領地を没収したが、その領地は他の諸侯に分配されて分権がさらに進む。

      1190年、第3回十字軍の途上で小アジアの川を渡る際に溺死した。
      軍は瓦解し、遠征の成果は上がらなかった。
      後世、山中で眠り、国家の危機に目覚めるという伝説が語られた。
      19世紀のドイツ統一運動で、この伝説は国民的な象徴として用いられている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/1/1d/Die_deutschen_Kaiser_Friedrich_I.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Die_deutschen_Kaiser_Friedrich_I.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フリードリヒ1世_(神聖ローマ皇帝)

  - id: philip-augustus
    title: フィリップ2世
    start: 1180
    end: 1223
    category: politics
    tags: [フランス]
    summary: イングランド王から大陸の領地を奪い、フランス王権が実力を持つ転機を作った。
    detail: |
      フランス王で、在位は1180年から1223年まで。
      イングランド王から大陸の領地の大半を奪い、王権が実力を持つ転機を作った。
      尊厳王とも呼ばれる。

      即位したとき、フランス王の直轄領はパリ周辺に限られていた。
      一方、イングランド王はノルマンディーからアキテーヌまで、フランスの西半分を領している。
      フィリップは、その内部の対立を突いた。
      ヘンリー2世の息子たちを離反させ、リチャード1世とは十字軍に同行しながら後に敵対する。
      決定的だったのはジョン王との戦いである。
      家臣としての義務に背いたとして所領の没収を宣言し、ノルマンディーやアンジューを次々に占領した。
      1214年のブーヴィーヌの戦いで、ジョンと神聖ローマ皇帝の連合軍を破って支配を確定させる。

      統治の整備も進めた。
      王が任命する役人を各地に置き、給与を払って定期的に交代させる。
      地方の有力者に依存しない行政が生まれた。
      パリでは城壁を築き、街路を舗装し、ルーヴルの城塞を建てている。

      王領は即位時の数倍に広がった。
      財政の記録が整えられ、国家としての体裁が形になる。
      フランスがヨーロッパの強国になる土台は、この治世に築かれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9d/Louis-F%C3%A9lix_Amiel-Philippe_II_dit_Philippe-Auguste_Roi_de_France_%281165-1223%29.jpg/500px-Louis-F%C3%A9lix_Amiel-Philippe_II_dit_Philippe-Auguste_Roi_de_France_%281165-1223%29.jpg
      credit: Louis-Félix Amiel / Public domain
      page: https://commons.wikimedia.org/wiki/File:Louis-F%C3%A9lix_Amiel-Philippe_II_dit_Philippe-Auguste_Roi_de_France_(1165-1223).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フィリップ2世_(フランス王)

  - id: king-john
    title: ジョン王
    start: 1199
    end: 1216
    category: society
    tags: [イングランド, マグナ・カルタ]
    summary: 敗戦と重税で貴族に迫られマグナ・カルタを認め、王も法に従う先例を残した。
    detail: |
      イングランド王で、在位は1199年から1216年まで。
      大陸の領地を失い、重税に対する貴族の反発からマグナ・カルタを認めた。
      王も法に従うという先例を残すことになった人物である。

      兄リチャード1世の死後に即位した。
      甥との王位争いがあり、正統性への疑いがつきまとう。
      フランス王フィリップ2世との戦いで、ノルマンディーをはじめ大陸の領地の大半を失った。
      失地王という異名はここから来ている。
      回復のための戦費を集めるため、重い課税と封建的な負担の取り立てを繰り返した。

      教皇とも対立した。
      カンタベリー大司教の任命をめぐって争い、破門され、国全体の礼拝が停止される。
      最終的に屈服し、イングランドを教皇の封土として差し出した。
      1214年、大陸奪回の遠征が完全な失敗に終わる。
      翌年、諸侯が武装して王に迫り、ロンドンを占拠した。
      交渉の結果、ラニミードで文書に同意させられる。

      マグナ・カルタである。
      不当な課税の禁止、法によらない逮捕の禁止などが定められた。
      王はすぐに教皇に無効を訴え、内戦が再開する。
      その最中に赤痢で没した。
      統治者としては失敗と評されるが、その失敗が生んだ文書が立憲政治の原点になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジョン王

  - id: louis-ix
    title: ルイ9世
    start: 1226
    end: 1270
    category: religion
    tags: [フランス, 十字軍]
    summary: 十字軍と公正な裁判で「聖王」と呼ばれ、王権に宗教的な後光をまとわせた。
    detail: |
      フランス王で、在位は1226年から1270年まで。
      公正な裁判と深い信仰で知られ、死後に列聖されて聖王と呼ばれた。
      王権に宗教的な後光をまとわせた人物である。

      12歳で即位し、母の摂政のもとで育った。
      親政を始めると、統治の公正さを前面に出す。
      役人の不正を調べる監察官を各地に送り、訴えを受け付けた。
      城の庭の樫の木の下に座り、身分を問わず直接に訴えを聞いたという逸話が伝えられる。
      決闘による裁判を制限し、証拠にもとづく手続きを広めた。

      貨幣を統一し、王の裁判所への上訴を認めることで、王権の及ぶ範囲を広げている。
      その公正さゆえに、他国の君主のあいだの紛争の調停も依頼された。
      信仰は生活のすみずみに及んだ。
      キリストの荊冠を購入し、それを納めるためにパリにサント・シャペルを建てる。
      病院を建て、貧者に食事を与え、自ら看護にあたったとも伝えられる。
      一方で、異端とユダヤ教徒には厳しく、タルムードの焚書を命じている。

      二度の十字軍を率いた。
      最初はエジプトで捕虜となり、身代金を払って釈放される。
      二度目の遠征では北アフリカで疫病にかかり没した。
      死後27年で列聖され、フランス王家の権威を支える存在になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Louis_IX.jpg/500px-Louis_IX.jpg
      credit: エル・グレコ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Louis_IX.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ルイ9世_(フランス王)

  - id: edward-iii
    title: エドワード3世
    start: 1327
    end: 1377
    category: war
    tags: [イングランド, 百年戦争]
    summary: フランス王位を主張して百年戦争を始め、長弓隊で騎士の時代を揺るがした。
    detail: |
      イングランド王で、在位は1327年から1377年まで。
      フランスの王位を主張して百年戦争を始めた。
      長弓を用いた戦術で、騎士が主役の戦場を変えた人物でもある。

      父が廃位された政変のあと、14歳で即位した。
      数年は母とその愛人が実権を握っていたが、これを排除して親政を始める。
      フランス王位の主張は、母がフランス王の娘であることを根拠とした。
      フランス側は女系の継承を認めず、これが開戦の名分になる。
      実際には、毛織物産業で結びつくフランドルの支配や、ワインを産するギュイエンヌの領有が争点だった。

      1346年のクレシー、1356年のポワティエで大勝した。
      決め手は、長弓を持つ歩兵の運用である。
      訓練に年月を要するが、重装の騎士の突撃を遠距離から崩せた。
      騎士の個人的な武勇が、組織された歩兵に通用しなくなっていく。

      戦費を集めるため、議会をたびたび招集した。
      課税の同意を得る必要から、議会の役割が強まる。
      この時期に上院と下院の区別も明確になった。
      晩年は黒死病の打撃と戦局の悪化に直面し、獲得した領土の多くを失う。
      宮廷でフランス語に代わって英語が使われ始めたのも、この治世である。
      戦争を通じて、イングランドという国の意識が育っていった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/74/King_Edward_III_from_NPG.jpg/500px-King_Edward_III_from_NPG.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:King_Edward_III_from_NPG.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エドワード3世_(イングランド王)

  - id: joan-of-arc-campaigns
    title: ジャンヌ・ダルク
    start: 1429
    end: 1431
    category: war
    tags: [フランス, 百年戦争]
    summary: 農村の少女が戦局を変え、フランスという「国」の意識を人々に持たせた。
    detail: |
      百年戦争の末期に現れた農村出身の少女で、1429年から1431年まで戦場に立った。
      劣勢だったフランスの戦局を変え、王太子の戴冠を実現させた。
      捕らえられて異端として処刑される。

      ロレーヌ地方の村に生まれ、13歳ごろから声を聞いたと語った。
      大天使や聖女が、フランスを救えと命じたという。
      17歳で王太子シャルルのもとへ赴き、軍を率いることを願い出た。
      神学者の審査を経て許され、白い甲冑を着て前線に立つ。

      1429年、包囲されていたオルレアンへ向かった。
      到着から9日で包囲は解かれ、劣勢が一気に覆る。
      続く戦いでも勝利を重ね、同年7月にランスでシャルル7世の戴冠を実現させた。
      歴代の王が聖別されてきた場所での戴冠は、正統性を決定づける。

      翌年、コンピエーニュで捕らえられブルゴーニュ派からイングランド側に引き渡された。
      宗教裁判にかけられ、男装と啓示の主張が異端とされる。
      1431年、19歳で火刑に処された。
      25年後、再審で判決は取り消された。
      1920年に列聖され、フランスの守護聖人となる。
      国王でも貴族でもない者が国の運命を動かした例として、また国民という意識が生まれる契機として語られてきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Joan_of_Arc_miniature_graded.jpg/500px-Joan_of_Arc_miniature_graded.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Joan_of_Arc_miniature_graded.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジャンヌ・ダルク

  - id: louis-xi
    title: ルイ11世
    start: 1461
    end: 1483
    category: politics
    tags: [フランス]
    summary: 戦わずに敵を切り崩す外交で大諸侯を抑え、中央集権の土台を作った。
    detail: |
      フランス王で、在位は1461年から1483年まで。
      戦争よりも外交と謀略で敵を切り崩し、大諸侯を抑えた。
      中央集権の土台を作った君主である。

      王太子の時代から父に反抗し、ブルゴーニュ公の宮廷に身を寄せていた。
      即位後、最大の敵となったのがそのブルゴーニュ公である。
      ブルゴーニュ公国は、フランス東部からネーデルラントに及ぶ豊かな領域を持ち、事実上の独立国だった。
      突進公と呼ばれたシャルルは、王国を挟む形で領土をつなげようとする。

      ルイは正面からの戦いを避けた。
      金銭で諸侯を買収し、ブルゴーニュの敵であるスイスやロレーヌを支援して包囲する。
      1477年、シャルルがナンシーで戦死すると、公国の領土の一部を併合した。
      蜘蛛の王という異名は、この張り巡らせた策略による。
      各地に情報網を築き、郵便の制度を整えた。
      商工業を保護し、リヨンに市を置いて絹の産業を育てている。

      常備軍を維持し、大砲を備えた砲兵を整えた。
      有力諸侯の領地は相続や没収で王領に加わっていく。
      人望はなかったが、王国の統一という点での成果は大きい。
      この基盤の上に、次の世紀の絶対王政が築かれることになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d7/Louis_XI_of_France.jpg/500px-Louis_XI_of_France.jpg
      credit: After ジャン・フーケ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Louis_XI_of_France.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ルイ11世_(フランス王)

  - id: isabella-i
    title: イサベル1世
    start: 1474
    end: 1504
    category: politics
    tags: [スペイン, レコンキスタ]
    summary: アラゴンとの結婚でスペインを統合し、グラナダ征服とコロンブス支援を同じ年に行った。
    detail: |
      カスティーリャ女王で、在位は1474年から1504年まで。
      アラゴン王と結婚してスペインの統合を進めた。
      グラナダの征服とコロンブスの支援を、同じ1492年に行っている。

      王位継承をめぐる争いのなか、アラゴンの王子フェルナンドと結婚した。
      二人の王国は制度としては別のまま、共同の統治によって事実上一つの国家として動く。
      国内では、王権の強化に努めた。
      都市の同盟を組織して治安を回復し、貴族の城を壊し、司法を整理する。
      1478年、異端審問所を設置した。
      対象となったのは主に、強制的に改宗させられたユダヤ教徒とイスラム教徒である。
      信仰の統一によって国家をまとめる方針だった。

      1492年は三つの出来事が重なった。
      1月にグラナダを陥落させてレコンキスタを完成させる。
      3月にはユダヤ教徒に改宗か国外退去かを迫る勅令を出した。
      8月、コロンブスの航海を支援し、その船団が大西洋へ出る。

      新大陸からの富は、スペインを一時ヨーロッパ最強の国にした。
      一方、宗教の統一政策は多くの技術者と商人を国外へ追い、経済の基盤を損なう。
      国家の統合と排除が同時に進んだ治世である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/63/Isabeldecastilla.jpg/500px-Isabeldecastilla.jpg
      credit: ルイス・デ・マドラーソ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Isabeldecastilla.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イサベル1世_(カスティーリャ女王)

  - id: henry-viii
    title: ヘンリ8世
    start: 1509
    end: 1547
    category: religion
    tags: [イングランド, 宗教改革]
    summary: 離婚問題からローマと断絶し、国王が教会の頭を兼ねる国教会を作った。
    detail: |
      イングランド王で、在位は1509年から1547年まで。
      離婚問題からローマ教会と断絶し、国王が教会の頭を兼ねる体制を作った。
      六度の結婚でも知られる。

      即位当初は、ルターを批判する書を著して教皇から信仰の擁護者の称号を得ている。
      決裂の原因は、神学ではなく王朝の問題だった。
      王妃キャサリンとのあいだに男子が生まれず、結婚の無効を教皇に求める。
      しかし王妃は神聖ローマ皇帝カール5世の叔母であり、教皇はその影響下にあって認めなかった。

      王は議会を通じて一連の法を成立させた。
      1534年の首長法で、国王がイングランド教会の唯一最高の頭であると定める。
      ローマとの関係は断たれ、反対した大法官のトマス・モアらは処刑された。
      続いて修道院が解散させられ、その広大な土地が売却された。
      買い取った地主層が新体制の支持者になり、宗教改革は後戻りしなくなる。
      王室の財政も一時的に潤った。

      教義そのものは、しばらくカトリックに近いまま保たれた。
      本格的な改革は、次の世代に進められる。
      六人の妃のうち二人は処刑され、待望の男子は幼くして即位し早世した。
      娘のエリザベス1世の時代に、国教会の形が安定する。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Henry-VIII-kingofengland_1491-1547.jpg/500px-Henry-VIII-kingofengland_1491-1547.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Henry-VIII-kingofengland_1491-1547.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヘンリー8世_(イングランド王)

  - id: charles-v
    title: カール5世
    start: 1519
    end: 1556
    category: politics
    tags: [神聖ローマ, スペイン]
    summary: スペインと新大陸とドイツを一人で抱え、宗教改革と対仏戦に追われ続けた。
    detail: |
      神聖ローマ皇帝でスペイン国王でもあった人物で、在位は1519年から1556年まで。
      スペインと新大陸、ネーデルラント、オーストリア、ドイツを一人で抱えた。
      宗教改革と対フランス戦に追われ続けた生涯である。

      相続によって広大な領域を得た。
      父方からネーデルラントとオーストリア、母方からスペインと新大陸を継ぎ、選挙で皇帝に選ばれる。
      自らの領土に日の沈むことがないと言われた。
      課題は三つあった。
      まずフランスとの対立で、イタリアをめぐって生涯戦い続ける。
      次にオスマン帝国の脅威で、ウィーンが包囲され、地中海でも戦った。
      そして宗教改革である。

      ルターを帝国議会に召喚して撤回を求めたが、応じられなかった。
      諸侯が新しい信仰を選び、それが政治的な自立と結びつく。
      武力で抑えようとして戦争になり、最終的に1555年のアウクスブルクの和議で、領邦ごとに宗派を選ぶ原則を認めた。
      新大陸からは大量の銀が流入したが、戦費で使い果たされた。
      財政は何度も破綻し、南ドイツの銀行家に依存する。

      1556年、退位して修道院に隠退した。
      領土はスペインと新大陸を子に、オーストリアと皇帝位を弟に分ける。
      ここからハプスブルク家は二つの系統に分かれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/61/Emperor_charles_v.png/500px-Emperor_charles_v.png
      credit: フアン・パントーハ・デ・ラ・クルス / After ティツィアーノ・ヴェチェッリオ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emperor_charles_v.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カール5世_(神聖ローマ皇帝)

  - id: philip-ii-spain
    title: フェリペ2世
    start: 1556
    end: 1598
    category: politics
    tags: [スペイン, 太陽の沈まぬ国]
    summary: 新大陸の銀で世界帝国を築いたが、オランダの独立と無敵艦隊の敗北で退潮に入った。
    detail: |
      スペイン王で、在位は1556年から1598年まで。
      新大陸の銀を背景に世界規模の帝国を築いた。
      オランダの独立と無敵艦隊の敗北によって、退潮が始まる。

      父カール5世からスペイン、ネーデルラント、イタリア南部、新大陸を受け継いだ。
      1580年にはポルトガルの王位も継ぎ、アジアとブラジルの拠点も加わる。
      統治はマドリード近郊の宮殿で行われた。
      各地から届く膨大な報告に自ら目を通し、書面で指示を出す。
      書類王と呼ばれるほど、文書による統治に徹した。

      カトリックの守護者を自任した。
      レパントの海戦でオスマン艦隊を破り、国内では異端審問を強化する。
      ネーデルラントでは、重税と宗教の弾圧が反乱を招いた。
      80年に及ぶ戦争となり、北部7州は事実上独立する。

      イングランドがこの反乱を支援したため、1588年に艦隊を派遣した。
      アルマダと呼ばれるこの艦隊は、海戦と嵐で大きな損害を受けて引き返す。
      新大陸の銀は、戦費と輸入品の支払いに消えた。
      国内の産業は育たず、財政は四度も破綻する。
      世界帝国の絶頂と、その持続不可能性が同時に現れた治世だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2d/Portrait_of_Philip_II_of_Spain_by_Sofonisba_Anguissola_-_002b.jpg/500px-Portrait_of_Philip_II_of_Spain_by_Sofonisba_Anguissola_-_002b.jpg
      credit: ソフォニスバ・アングイッソラ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Portrait_of_Philip_II_of_Spain_by_Sofonisba_Anguissola_-_002b.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フェリペ2世_(スペイン王)

  - id: elizabeth-i
    title: エリザベス1世
    start: 1558
    end: 1603
    category: politics
    tags: [イングランド]
    summary: 宗教対立を折衷で収め、海上進出と文芸の開花でイングランドの自信を育てた。
    detail: |
      イングランド女王で、在位は1558年から1603年まで。
      宗教対立を折衷によって収め、海上進出と文芸の開花を導いた。
      生涯独身を通し、処女王と呼ばれた。

      ヘンリ8世と二番目の妃の娘で、母は処刑されている。
      姉のメアリ1世の治世にはカトリックへの復帰が進み、自身も投獄された時期があった。
      即位後、宗教政策では中庸を選んだ。
      国王を教会の統治者とし、礼拝の形式はカトリック的な要素を残す。
      個人の内面の信仰には踏み込まず、外形的な服従だけを求めた。
      この折衷によって、大陸のような宗教戦争を避けている。

      スコットランド女王メアリは、カトリック側が担ぐ存在となり、20年近い幽閉の末に処刑された。
      これを口実にスペインが艦隊を送ったが、1588年に撃退する。
      海外への進出も進んだ。
      ドレークらの私掠船がスペイン船を襲い、その利益を王室も分け合う。
      東インド会社が設立され、北アメリカへの植民も試みられた。

      文化では、シェイクスピアとマーロウが活動し、劇場が都市の娯楽になる。
      国民的な自信が育った時代とされる。
      後継者を指名しないまま没し、スコットランド王が王位を継いだ。
      両王国が同じ君主を戴く体制が、ここから始まる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Darnley_stage_3.jpg/500px-Darnley_stage_3.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Darnley_stage_3.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エリザベス1世_(イングランド女王)

  - id: louis-xiv
    title: ルイ14世
    start: 1643
    end: 1715
    category: politics
    tags: [フランス, 絶対王政]
    summary: ヴェルサイユに貴族を集めて絶対王政の完成形を見せ、各国の宮廷の手本になった。
    detail: |
      フランス王で、在位は1643年から1715年までの72年に及ぶ。
      ヨーロッパの君主で最も長い在位である。
      ヴェルサイユに貴族を集める統治で、絶対王政の完成形を示した。

      4歳で即位し、幼少期にフロンドの乱と呼ばれる貴族の反乱を経験した。
      宮廷を追われて逃亡した記憶が、後の政策を方向づけたとされる。
      親政を始めると、宰相を置かず自ら政務を執った。
      貴族を政治から遠ざけ、法服貴族や市民出身の官僚を重用する。
      財務総監コルベールは、産業を保護し、植民地を広げ、関税で国内産業を育てた。

      1682年、ヴェルサイユに宮廷を移した。
      壮麗な宮殿に貴族を住まわせ、王の起床や食事に立ち会う栄誉を競わせる。
      儀礼に縛られた貴族は、領地での自立した力を失った。
      太陽王と呼ばれる演出も、統治の一部である。

      対外戦争は絶え間なく続いた。
      領土は広がったが、四度の大きな戦争で財政は破綻に近づく。
      スペイン継承戦争では、ヨーロッパの大半を敵に回した。
      1685年にナントの勅令を廃止し、プロテスタントを国外へ追った。
      数十万の技術者と商人が去り、経済に痛手を残す。
      王権の集中という理想形を示すと同時に、その限界も示した治世だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5f/Louis_XIV_of_France.jpg/500px-Louis_XIV_of_France.jpg
      credit: イアサント・リゴー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Louis_XIV_of_France.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ルイ14世_(フランス王)

  - id: oliver-cromwell
    title: クロムウェル
    start: 1653
    end: 1658
    category: politics
    tags: [イングランド, 共和政]
    summary: 国王を処刑して共和政を敷き、王のいない統治が可能だと示した（そして難しさも示した）。
    detail: |
      イングランドの軍人・政治家で、1653年から1658年まで護国卿として統治した。
      国王を処刑して共和政を敷いた。
      王のいない統治が可能であること、そしてその難しさの両方を示した人物である。

      地方の地主の出身で、議会の議員だった。
      王と議会の対立が内戦になると、騎兵隊を組織して頭角を現す。
      信仰と規律を重んじる軍は、鉄騎隊と呼ばれた。
      議会側の勝利後、王チャールズ1世の処遇が問題になった。
      クロムウェルは処刑を主張し、1649年に裁判を経て王は斬首される。
      国王を法によって裁いて処刑したのは、ヨーロッパで初めてだった。

      共和国が成立したが、議会との対立は続く。
      1653年、議会を武力で解散させて護国卿となり、憲法にあたる文書のもとで統治した。
      王位を勧められたが辞退している。
      政策は厳格な清教主義にもとづく。
      劇場は閉鎖され、祝祭は制限された。
      アイルランドでは反乱の鎮圧に際して大規模な殺戮が行われ、その記憶は今も残る。

      航海法を定めてオランダと戦い、海軍を強化した。
      死後、体制は保たず、2年で王政が復活する。
      王の権力に限界を設けるという課題は、40年後の名誉革命で決着をみた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Oliver_Cromwell_by_Samuel_Cooper.jpg/500px-Oliver_Cromwell_by_Samuel_Cooper.jpg
      credit: After サミュエル・クーパー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Oliver_Cromwell_by_Samuel_Cooper.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/オリバー・クロムウェル

  - id: frederick-the-great
    title: フリードリヒ2世
    start: 1740
    end: 1786
    category: politics
    tags: [プロイセン, 啓蒙専制]
    summary: 「国家第一の僕」を称して軍と官僚を鍛え、プロイセンを列強に押し上げた。
    detail: |
      プロイセン王で、在位は1740年から1786年まで。
      軍と官僚を鍛え上げ、プロイセンを列強に押し上げた。
      自らを国家第一の僕と称した啓蒙専制君主である。

      若いころは文学と音楽を好み、軍人気質の父と激しく対立した。
      脱走を企てて捕らえられ、友人が目の前で処刑される経験もしている。
      即位直後、オーストリアの豊かな工業地帯シュレージエンに侵攻した。
      マリア・テレジアの継承に異議を唱える形で戦い、これを奪う。
      オーストリアは奪回をめざし、七年戦争では大半の大国がプロイセンの敵に回った。
      国土を蹂躙されながらも、機動的な用兵とロシアの政変によって持ちこたえる。

      内政では実務を重んじた。
      官僚制を整え、司法を改革して拷問を廃止する。
      荒地を開墾し、ジャガイモの栽培を奨励して食糧を確保した。
      信仰については寛容で、各人が自分の流儀で救われればよいと述べている。

      ヴォルテールと文通し、自らフランス語で著作を残した。
      フルートを吹き、作曲もしている。
      一方で、農奴制と貴族の特権は温存された。
      軍を優先する国家の体質は、後のドイツにも受け継がれる。
      啓蒙の理念と軍事国家の実態が同居していた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Friedrich_ii_campenhausen.jpg/500px-Friedrich_ii_campenhausen.jpg
      credit: ヴィルヘルム・カンプハウゼン / Public domain
      page: https://commons.wikimedia.org/wiki/File:Friedrich_ii_campenhausen.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フリードリヒ2世_(プロイセン王)

  - id: maria-theresa
    title: マリア・テレジア
    start: 1740
    end: 1780
    category: politics
    tags: [オーストリア, ハプスブルク]
    summary: 女性の継承に反対する諸国と戦いながら、税と軍の改革で帝国を立て直した。
    detail: |
      ハプスブルク家の君主で、1740年から1780年まで統治した。
      オーストリア大公、ハンガリー女王、ボヘミア女王を兼ねる。
      女性の継承に反対する諸国と戦いながら、帝国を立て直した。

      父の死により23歳で継承した。
      男子がいなかったため、事前に各国の承認を取りつけていたが、即位すると反故にされる。
      プロイセンがシュレージエンに侵攻し、フランスやバイエルンも加わってオーストリア継承戦争になった。
      危機に際し、ハンガリーの貴族の前に幼い息子を抱いて現れ、支持を訴えた逸話が伝えられる。
      援助を得て戦い抜き、王位は守ったがシュレージエンは失う。

      敗戦の教訓から、国家の改革に着手した。
      中央に行政機関を置き、貴族にも課税し、常備軍を大幅に増やす。
      初等教育を義務化し、司法を行政から分離した。
      拷問の廃止も進められている。

      外交では、長年の敵だったフランスと同盟を結んだ。
      外交革命と呼ばれるこの転換は、シュレージエン奪回を狙うものだったが、七年戦争でも果たせなかった。
      16人の子を産み、各国の王室と結婚させている。
      末娘がフランス王妃マリー・アントワネットである。
      母としての顔と、国家を再建した統治者の顔が並び立つ治世だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/Kaiserin_Maria_Theresia_%28HRR%29.jpg/500px-Kaiserin_Maria_Theresia_%28HRR%29.jpg
      credit: マルティン・ファン・マイテンス / Public domain
      page: https://commons.wikimedia.org/wiki/File:Kaiserin_Maria_Theresia_(HRR).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マリア・テレジア

  - id: george-iii
    title: ジョージ3世
    start: 1760
    end: 1820
    category: politics
    tags: [イギリス]
    summary: アメリカ13植民地を失い、ナポレオン戦争を戦い抜いた60年の在位。
    detail: |
      イギリス王で、在位は1760年から1820年までの60年に及ぶ。
      アメリカの13植民地を失い、ナポレオン戦争を戦い抜いた。
      晩年は病のため統治できなくなった。

      ハノーヴァー家の王として初めてイギリスで生まれ育ち、英語を母語とした。
      国王が政治に積極的に関与しようとしたことが、議会との摩擦を生む。
      アメリカとの対立では強硬な姿勢をとった。
      植民地への課税に反対する声を抑えようとし、独立戦争を招く。
      1783年に独立を承認せざるをえなくなり、王としての威信は傷ついた。

      フランス革命とナポレオンの台頭に際しては、対仏戦争を支持し続けた。
      長期の戦争をイギリスが戦い抜いた時期にあたる。
      1801年にはアイルランドとの合同が成立した。
      農業に関心を持ち、自ら模範農場を営んだことから農夫王とも呼ばれる。

      1788年から精神の錯乱が現れ、たびたび政務が執れなくなった。
      1810年以降は完全に統治不能となり、息子が摂政を務める。
      原因については、遺伝性の代謝疾患とする説などが唱えられてきた。
      王が政治の主導権を握ろうとした最後の試みが、この治世にあたる。
      以後、国王は君臨すれども統治せずという立場へ移っていった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Allan_Ramsay_-_King_George_III_in_coronation_robes_-_Google_Art_Project.jpg/500px-Allan_Ramsay_-_King_George_III_in_coronation_robes_-_Google_Art_Project.jpg
