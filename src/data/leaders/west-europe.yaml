  - id: macron
    title: マクロン
    start: 2017
    ongoing: true
    category: politics
    tags: [フランス, EU]
    summary: 既存政党によらず当選し、EU改革と国内の抗議運動のあいだで舵を取っている。
    detail: |
      フランスの大統領で、2017年から在任している。
      既存の政党によらず、新しい政治運動を組織して当選した。
      EUの改革と国内の抗議運動のあいだで舵を取っている。

      投資銀行の出身で、経済相を務めた後に自ら運動を立ち上げた。
      39歳での当選は、フランス史上最年少である。
      既成政党が予備選や不祥事で弱っていた事情も追い風になった。
      国内では、労働市場の規制緩和、国鉄の改革、税制の見直しを進めた。
      企業の投資を促す方向だが、富裕層に有利だという批判を受ける。

      2018年、燃料税の引き上げをきっかけに黄色いベスト運動が起きた。
      地方の生活の苦しさを背景に抗議が全国に広がり、政策の一部撤回に追い込まれる。
      年金の受給開始年齢の引き上げでも、大規模なストライキと抗議が繰り返された。
      外交では、ヨーロッパの戦略的な自立を繰り返し訴えている。
      防衛の面でアメリカに依存しない能力を持つべきだという主張である。
      ロシアのウクライナ侵攻の前後には、対話の窓口を保とうと試みた。

      2022年に再選されたが、議会では過半数を失っている。
      極右と左派の双方が勢力を伸ばし、中道の立場は難しくなった。
      既成政党の外から現れた政治家が直面する課題を示す例でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/Emmanuel_Macron_2025_%28cropped%29.jpg/500px-Emmanuel_Macron_2025_%28cropped%29.jpg
      credit: Nebojša Tejić / Public domain
      page: https://commons.wikimedia.org/wiki/File:Emmanuel_Macron_2025_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/エマニュエル・マクロン
