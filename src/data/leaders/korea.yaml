lane: korea

leaders:
  - id: gwanggaeto
    title: 広開土王
    start: 391
    end: 412
    category: war
    tags: [高句麗]
    summary: 満洲と半島北部へ版図を広げ、碑文が当時の東アジアの勢力図を今に伝える。

  - id: jangsu
    title: 長寿王
    start: 413
    end: 491
    category: politics
    tags: [高句麗]
    summary: 平壌へ遷都して南下を進め、79年の在位で高句麗の最盛期を保った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/長寿王

  - id: king-seong-baekje
    title: 聖王（百済）
    start: 523
    end: 554
    category: religion
    tags: [百済, 仏教]
    summary: 仏教を倭に伝えた王として知られ、南朝との交流で百済文化を高めた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/聖王_(百済)

  - id: jinheung
    title: 真興王
    start: 540
    end: 576
    category: war
    tags: [新羅]
    summary: 漢江流域を奪って新羅を半島の主役に押し上げ、花郎の制度を整えた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/真興王

  - id: munmu
    title: 文武王
    start: 661
    end: 681
    category: politics
    tags: [新羅, 統一]
    summary: 唐軍を半島から退け、朝鮮半島で初めての統一国家を完成させた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/文武王

  - id: dae-joyeong
    title: 大祚栄
    start: 698
    end: 719
    category: politics
    tags: [渤海]
    summary: 高句麗の遺民を率いて渤海を建て、「海東の盛国」の礎を作った。

  - id: wang-geon
    title: 王建
    start: 918
    end: 943
    category: politics
    tags: [高麗]
    summary: 豪族との婚姻を重ねて後三国を統一し、高麗500年の出発点を作った。

  - id: gwangjong
    title: 光宗
    start: 949
    end: 975
    category: society
    tags: [高麗, 科挙]
    summary: 奴婢の身分を洗い直し科挙を導入して、豪族から国王へ権力を移した。

  - id: choe-chungheon
    title: 崔忠献
    start: 1196
    end: 1219
    category: war
    tags: [高麗, 武臣政権]
    summary: 王を立て退けする武臣政権の実権を握り、崔氏4代60年の支配を始めた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/崔忠献

  - id: chungnyeol
    title: 忠烈王
    start: 1274
    end: 1308
    category: politics
    tags: [高麗, 元]
    summary: 元の皇女を妃に迎え、高麗が元の姻戚として生き延びる形を作った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/忠烈王

  - id: gongmin
    title: 恭愍王
    start: 1351
    end: 1374
    category: politics
    tags: [高麗, 自立]
    summary: 元の衰えに乗じて自立と改革を進めたが、反発のなかで殺された。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/恭愍王

  - id: yi-seonggye-reign
    title: 太祖 李成桂
    start: 1392
    end: 1398
    category: politics
    tags: [朝鮮王朝]
    summary: 高麗を倒して朝鮮王朝を開き、明への事大と儒教国家という方向を定めた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/李成桂

  - id: sejong-the-great
    title: 世宗
    start: 1418
    end: 1450
    category: culture
    tags: [朝鮮王朝, ハングル]
    summary: 訓民正音の創製と科学技術の振興で、朝鮮の文化的な頂点を作った。

  - id: sejo-joseon
    title: 世祖
    start: 1455
    end: 1468
    category: society
    tags: [朝鮮王朝, 法典]
    summary: 甥から王位を奪ったが、『経国大典』の編纂で統治を法典として固めた。

  - id: seonjo
    title: 宣祖
    start: 1567
    end: 1608
