  - id: yi-seonggye-reign
    title: 太祖 李成桂
    start: 1392
    end: 1398
    category: politics
    tags: [朝鮮王朝]
    summary: 高麗を倒して朝鮮王朝を開き、明への事大と儒教国家という方向を定めた。
    detail: |
      朝鮮王朝の初代の王で、在位は1392年から1398年まで。
      高麗を倒して新しい王朝を開いた。
      明への事大と儒教国家という方向を定めた人物である。

      北東部の出身で、倭寇と紅巾賊の討伐で名を上げた武将である。
      転機は1388年の遼東への遠征命令だった。
      明の領土へ攻め込むよう命じられたが、無謀だと判断し、鴨緑江の中州から軍を返す。
      そのまま都を制圧し、実権を握った。
      4年後、王位を譲り受ける形で新王朝を開く。
      国号は明の承認を得て朝鮮と定められた。
      都は漢陽、現在のソウルに移される。

      政策の柱は三つある。
      明への事大によって外交の安定を得ること。
      仏教を抑えて儒教を国家の原理とすること。
      土地制度を改めて、権門が持っていた大土地を官僚への給与の原資に組み替えることである。
      新しい支配層は、儒学を学んだ士大夫であった。
      彼らが王朝の性格を決めていく。

      晩年、後継をめぐって息子たちが争った。
      王子の乱と呼ばれるこの争いで、寵愛していた子が殺される。
      失意のうちに退位し、後に五男が第3代の王となった。
      王朝はその後500年続くことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/King_Taejo_Yi_01.jpg/500px-King_Taejo_Yi_01.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:King_Taejo_Yi_01.jpg
    links:
