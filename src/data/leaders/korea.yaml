    start: 1592
    end: 1598
    category: war
    tags: [朝鮮王朝, 水軍]
    summary: 制海権を握って日本軍の補給を断ち、半島の防衛を支えた名将。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/李舜臣

  - id: gwanghaegun
