  - id: chun-doo-hwan
    title: 全斗煥
    start: 1980
    end: 1988
    category: politics
    tags: [韓国, 軍政]
    summary: 光州の弾圧の上に成立した軍出身政権で、民主化運動に押されて退いた。
    detail: |
      韓国の大統領で、在任は1980年から1988年まで。
      光州の弾圧の上に成立した軍出身の政権であり、民主化運動に押されて退いた。

      朴正煕の暗殺の後、軍内部の私的な組織を率いて実権を握った。
      1979年末、上官を逮捕して軍を掌握する。
      1980年5月、非常戒厳令を全土に拡大し、政治活動を禁じた。
      光州で抗議が起きると、空挺部隊を投入して鎮圧する。
      多数の市民が死亡した。

      同年、間接選挙によって大統領に就任する。
      報道機関を統廃合し、言論を統制した。
      批判的な人物は職を追われ、多数が浄化教育の名目で収容される。
      経済は好調だった。
      石油価格の下落、低金利、ウォン安という条件が重なり、高い成長と物価の安定が実現する。

      1987年、警察の取り調べで大学生が死亡した事件が発覚した。
      隠蔽が明らかになり、抗議が全国に広がる。
      大統領は直接選挙の要求を拒んだが、運動の規模とソウル五輪を控えた状況から、後継候補が受け入れを表明した。
      退任後、光州の責任と不正蓄財を問われて死刑判決を受ける。
      後に減刑され、特赦で釈放された。
      最後まで光州について謝罪しなかった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Chun_Doo-hwan_%28%EC%A0%84%EB%91%90%ED%99%98%29_Presidential_Portrait.jpg/500px-Chun_Doo-hwan_%28%EC%A0%84%EB%91%90%ED%99%98%29_Presidential_Portrait.jpg
