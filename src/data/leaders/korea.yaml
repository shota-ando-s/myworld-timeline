        url: https://ja.wikipedia.org/wiki/盧武鉉

  - id: kim-jong-un
    title: 金正恩
    start: 2011
    ongoing: true
    category: politics
    tags: [北朝鮮, 核開発]
    summary: 核・ミサイル開発を加速させる一方、米韓首脳との会談にも臨んだ。
    detail: |
      朝鮮民主主義人民共和国の第3代の指導者で、2011年から権力の座にある。
      核とミサイルの開発を加速させる一方、米韓の首脳との会談にも臨んだ。

      金正日の三男である。
      スイスで学んだ時期があるとされる。
      後継者として公に現れたのは2010年で、その翌年に父が死去して継承した。
      20代後半であり、経験の乏しさが指摘された。

      権力の掌握は速かった。
      叔父にあたる後見役を処刑し、軍の幹部も頻繁に交代させる。
      異母兄が国外で殺害される事件も起きた。
      核開発を国家の路線として明記した。
      2013年から複数回の核実験を行い、大陸間弾道ミサイルの発射も繰り返す。
      国連の制裁は強化された。

      2018年、方針が転換される。
      平昌の冬季五輪を機に韓国との対話が始まり、南北の首脳会談が三度行われた。
      同じ年にシンガポールで、翌年にハノイでアメリカの大統領と会談する。
      初の米朝首脳会談だったが、非核化の定義をめぐって決裂した。
      以後は対話が途絶え、開発が続いている。
      経済では、市場の活動を一定の範囲で容認した。
      制裁と国境の封鎖のもとで、国民生活の困難は続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Kim_Jong-un_and_Vladimir_Putin_%282023-09-13%29_12_%28cropped%29.jpg/500px-Kim_Jong-un_and_Vladimir_Putin_%282023-09-13%29_12_%28cropped%29.jpg
      credit: Владимир Смирнов / ТАСС / CC BY 4.0
      page: https://commons.wikimedia.org/wiki/File:Kim_Jong-un_and_Vladimir_Putin_(2023-09-13)_12_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/金正恩

  - id: park-geun-hye
    title: 朴槿恵
    start: 2013
    end: 2017
    category: politics
    tags: [韓国]
    summary: 初の女性大統領だったが、国政介入事件で弾劾・罷免された。
    detail: |
      韓国の大統領で、在任は2013年から2017年まで。
      初の女性の大統領だったが、国政への介入事件によって弾劾され罷免された。

      朴正煕の長女である。
      母が銃撃で死亡した後、10代の終わりから公式の場で母の役割を代行した。
      父も暗殺され、その後は表舞台から離れる。
      1998年に政界へ入り、保守政党の立て直しに関わった。
      2012年の選挙で当選する。
      公約は経済の民主化と福祉の拡充だったが、実現は限定的だった。
      2014年のセウォル号の沈没では、初動の対応と大統領の所在をめぐって強い批判を受ける。

      2015年、日本との間で慰安婦問題の合意が結ばれた。
      最終的かつ不可逆的な解決とされたが、当事者と世論の反発を招く。
      2016年、私的な知人が国政に関与していたことが報じられた。
      演説の原稿や人事に関わり、財団を通じて企業から資金を集めていたとされる。

      毎週末、100万人規模の集会がろうそくを持って行われた。
      国会が弾劾を可決し、2017年3月に憲法裁判所が罷免を決定する。
      逮捕され、有罪判決を受けた後に特赦された。
      大規模な市民の運動が、制度の手続きによって大統領を退けた事例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/62/Park_Geun-hye_presidential_portrait_2.png/500px-Park_Geun-hye_presidential_portrait_2.png
