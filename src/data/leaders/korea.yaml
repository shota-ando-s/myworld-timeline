        url: https://ja.wikipedia.org/wiki/金大中

  - id: roh-moo-hyun
    title: 盧武鉉
    start: 2003
    end: 2008
    category: politics
    tags: [韓国]
    summary: 地方分権と対米自主を掲げ、既存のエリート層と対立し続けた。
    detail: |
      韓国の大統領で、在任は2003年から2008年まで。
      地方分権と対米自主を掲げ、既存のエリート層と対立し続けた。

      高校を出た後に独学で司法試験に合格した。
      労働事件を扱う人権弁護士として活動し、政界に入る。
      落選を繰り返しながら地域主義に反対し続けたことで支持を集めた。
      選挙では、インターネットを通じた支持者の自発的な運動が大きな役割を果たした。
      就任後、検察と報道機関との緊張が続いた。
      2004年には国会で弾劾訴追を受けるが、憲法裁判所が退けて職務に復帰する。

      政策では、首都機能の移転を進めた。
      憲法裁判所が違憲と判断したため、行政の一部を移す形に変更される。
      地方への権限と財源の移譲も進められた。
      外交では、アメリカとの関係で自主性を主張しながら、自由貿易協定の交渉を始めた。
      イラクへの派兵も決定している。
      北朝鮮とは2007年に首脳会談を行った。

      不動産価格の高騰を抑えられず、支持率は低迷する。
      退任後、親族をめぐる金銭の疑惑で捜査を受け、2009年に自ら命を絶った。
      既存の権威に挑む姿勢は、その後の政治に強い影響を残している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/Roh_Moo-hyun_presidential_portrait.jpg/500px-Roh_Moo-hyun_presidential_portrait.jpg
      credit: 대한민국 국가기록원 / KOGL Type 1
      page: https://commons.wikimedia.org/wiki/File:Roh_Moo-hyun_presidential_portrait.jpg
    links:
