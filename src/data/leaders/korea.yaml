  - id: yi-sun-sin
    title: 李舜臣
    start: 1592
    end: 1598
    category: war
    tags: [朝鮮王朝, 水軍]
    summary: 制海権を握って日本軍の補給を断ち、半島の防衛を支えた名将。
    detail: |
      朝鮮王朝の水軍の指揮官で、1592年から1598年の戦争で活躍した。
      制海権を握って日本軍の補給を断ち、半島の防衛を支えた。

      武科に合格して地方の職を歴任し、開戦の1年余り前に南部の水軍の司令官になった。
      着任後、船を修理し、兵を訓練し、亀甲船を建造したと伝えられる。
      屋根を覆って矢と火を防ぐ構造の船である。
      1592年の開戦後、玉浦から始まる一連の海戦で連勝した。
      7月の閑山島の海戦では、鶴翼の陣で敵を包囲して大勝する。
      これによって、日本軍の補給路が断たれた。
      陸で進んだ部隊は、海からの補給を受けられずに動きが鈍る。

      1597年、讒言によって罷免され、拷問を受けて一兵卒に落とされた。
      後任の指揮官は大敗し、水軍はほぼ壊滅する。
      復帰したとき、残る船は12隻だった。
      鳴梁の海峡で、潮流の変化を利用して300隻を超える敵に立ち向かい、これを退ける。

      1598年、撤退する日本軍を追撃する露梁の海戦で、流れ弾に当たって戦死した。
      自らの死を告げるなと命じたと伝えられる。
      記した日記が現存し、当時の状況を伝える史料になっている。
      韓国では最も尊敬される人物の一人である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f0/Bust_of_Yi_Sun-sin_01.jpg/500px-Bust_of_Yi_Sun-sin_01.jpg
      credit: 作者不明 / KOGL Type 1
      page: https://commons.wikimedia.org/wiki/File:Bust_of_Yi_Sun-sin_01.jpg
    links:
      - label: Wikipedia
