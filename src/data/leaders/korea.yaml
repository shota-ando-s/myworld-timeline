  - id: gwanghaegun
    title: 光海君
    start: 1608
    end: 1623
    category: politics
    tags: [朝鮮王朝, 外交]
    summary: 明と後金のあいだで均衡を取る現実外交を試みたが、反正で追放された。
    detail: |
      朝鮮王朝の第15代の王で、在位は1608年から1623年まで。
      明と後金のあいだで均衡を取る外交を試みたが、政変で追放された。

      日本の侵攻のさなか、王が避難するなかで世子に立てられた。
      各地を回って義兵を組織し、戦時の実務を担っている。
      即位後、戦後の復興に取り組んだ。
      土地の台帳を作り直し、税を米に一本化する制度を広げる。
      医学書の編纂も支援した。

      外交が最大の課題になった。
      明は日本の侵攻に際して援軍を送った恩義のある国である。
      一方、北で台頭した後金は無視できない実力を持っていた。
      明が後金討伐の援軍を求めると、軍を送りながら、指揮官に情勢を見て判断するよう命じた。
      実際、朝鮮軍は戦況を見て後金に降伏している。
      現実を優先するこの姿勢は、朱子学の義理を重んじる官僚から強く批判された。
      王位を争った兄弟を殺し、継母を幽閉したことも非難の材料になる。

      1623年、西人の一派がクーデタを起こして王を廃した。
      配流先で18年を過ごして没する。
      新政権は明への義理を掲げ、後金と対立した。
      その結果、二度の侵攻を受けて服属を強いられることになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/58/%EA%B4%91%ED%95%B4%EA%B5%B0%EB%AC%98.jpeg/500px-%EA%B4%91%ED%95%B4%EA%B5%B0%EB%AC%98.jpeg
