        url: https://ja.wikipedia.org/wiki/世祖_(朝鮮王)

  - id: seonjo
    title: 宣祖
    start: 1567
    end: 1608
    category: politics
    tags: [朝鮮王朝, 壬辰倭乱]
    summary: 党争の激化と日本の侵攻が重なり、国土が荒廃した治世。
    detail: |
      朝鮮王朝の第14代の王で、在位は1567年から1608年まで。
      党争が激化し、日本の侵攻によって国土が荒廃した治世である。

      即位したとき、朝廷では士林と呼ばれる儒学者の層が主導権を握っていた。
      やがて人事をめぐって東人と西人に分かれ、対立が続く。
      1590年、日本の動向を探るため使節が派遣された。
      帰国した二人の報告は正反対だった。
      一方は侵攻の意図があると述べ、他方は杞憂だと述べる。
      所属する党派の違いが、その判断に影響したとされる。
      朝廷は後者を採り、備えは進まなかった。

      1592年、日本軍が侵攻する。
      首都は20日で陥落し、王は北の義州まで逃れた。
      明に救援を求め、援軍が到着する。
      海では李舜臣が制海権を握り、補給を断った。
      各地で義兵が蜂起し、日本軍の支配を妨げる。
      1597年に再び侵攻があり、翌年の秀吉の死によって撤退した。

      7年の戦争で国土は荒れ、人口と耕地は大きく減った。
      文化財の焼失と技術者の連行も打撃になる。
      戦後、王は功績のあった者への評価をめぐって批判を受けた。
      党争は戦後も続き、王朝の政治を長く規定することになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/%E6%9C%9D%E9%AE%AE%E5%AE%A3%E7%A5%96.jpg/500px-%E6%9C%9D%E9%AE%AE%E5%AE%A3%E7%A5%96.jpg
