  - id: gojong
    title: 高宗
    start: 1863
    end: 1907
    category: politics
    tags: [朝鮮王朝, 大韓帝国]
    summary: 大韓帝国を称して自立を図ったが、日本の保護国化を止められなかった。
    detail: |
      朝鮮王朝の第26代の王で、後に大韓帝国の初代皇帝となった。
      在位は1863年から1907年まで。
      自立を図ったが、日本の保護国化を止められなかった。

      12歳で即位し、初めは父が実権を握った。
      1873年から親政を始める。
      1876年、日本との条約によって開国した。
      以後、清、日本、ロシアの勢力のあいだで揺れ動く。

      国内では、改革の方向をめぐって対立が続いた。
      近代化を急ぐ勢力による政変が起き、3日で失敗する。
      1894年の農民戦争は、日清両軍の出兵を招き、日清戦争の引き金になった。
      1895年、王妃が日本の関係者によって王宮で殺害される。
      身の危険を感じた王は、ロシアの公使館に1年滞在した。

      1897年、大韓帝国を宣言して皇帝を称する。
      清との従属関係を断ち、独立国であることを示す措置である。
      近代化の事業も進められた。
      しかし日露戦争の後、日本が保護条約を強いた。
      皇帝は署名を拒んだが、大臣の同意で成立したとされる。
      1907年、ハーグの国際会議に密使を送って無効を訴えた。
      これが露見し、退位させられる。
      1919年の死は、三・一運動の直接のきっかけになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Gojong_of_the_Korean_Empire_02.jpg/500px-Gojong_of_the_Korean_Empire_02.jpg
      credit: This photo was taken in 1907. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Gojong_of_the_Korean_Empire_02.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/高宗_(朝鮮)

  - id: syngman-rhee
    title: 李承晩
    start: 1948
    end: 1960
    category: politics
    tags: [韓国]
    summary: 初代大統領として反共を掲げたが、不正選挙が四月革命を招いて亡命した。
    detail: |
      大韓民国の初代大統領で、在任は1948年から1960年まで。
      反共を掲げて長期政権を築いたが、不正選挙が四月革命を招いて亡命した。

      若いころ改革運動に加わって投獄され、釈放後にアメリカへ渡った。
      プリンストンで博士号を取得している。
      独立運動の指導者として、上海の臨時政府の初代大統領にも選ばれた。
      解放後に帰国し、アメリカの支持を背景に政権を握る。
      信託統治と南北の交渉に反対し、南だけの単独選挙を進めた。

      1950年、朝鮮戦争が起きた。
      首都を放棄して南へ逃れる際、橋を爆破して多数の避難民が取り残される。
      戦争中には、共産主義者とみなされた住民が大量に処刑された。
      休戦には反対し、捕虜を独断で釈放して交渉を混乱させている。
      政権の維持のため、憲法が繰り返し改正された。
      再選の制限を外し、直接選挙に改め、自らに有利な仕組みを作る。

      1960年の選挙で大規模な不正が行われた。
      抗議する高校生の遺体が港で見つかったことから、運動は全国に広がる。
      警察の発砲で多数が死亡し、軍も鎮圧を拒んだ。
      大統領は辞任してハワイへ亡命し、そこで没した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/Rhee_Syng-Man_in_1948.jpg/500px-Rhee_Syng-Man_in_1948.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Rhee_Syng-Man_in_1948.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/李承晩

  - id: kim-il-sung
    title: 金日成
    start: 1948
    end: 1994
    category: politics
    tags: [北朝鮮, 主体思想]
    summary: 主体思想を掲げ、個人崇拝と世襲を組み込んだ体制を築いた。
    detail: |
      朝鮮民主主義人民共和国の初代の指導者で、1948年から1994年まで権力の座にあった。
      主体思想を掲げ、個人崇拝と世襲を組み込んだ体制を築いた。

      満洲で抗日の武装闘争に加わった経歴を持つ。
      その後ソ連領内へ移り、赤軍の部隊に所属した。
      解放後、ソ連の支援を受けて北の指導者になる。
      土地改革と産業の国有化を実行し、支持を広げた。

      1950年、南への侵攻によって戦争を起こす。
      一時は半島の大半を占領したが、国連軍の反撃と中国の参戦を経て休戦に至った。
      戦後、国内の対立する勢力を次々に粛清した。
      ソ連派、中国派、国内派が排除され、自らの系統だけが残る。
      1960年代に主体思想が体系化された。
      自主、自立、自衛を掲げ、ソ連と中国のいずれにも従属しない立場を示す。
      やがて、指導者への絶対的な忠誠を求める論理へ発展した。

      生誕地は聖地とされ、銅像と肖像が全国に置かれる。
      生誕の年を起点とする暦も定められた。
      1970年代から息子の金正日への継承が準備された。
      1994年に死去し、永遠の主席と位置づけられている。
      死後も国家主席の地位は空位とされた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Kim_Il_Sung_Portrait-3.jpg/500px-Kim_Il_Sung_Portrait-3.jpg
      credit: Jesse Charlie / CC0
      page: https://commons.wikimedia.org/wiki/File:Kim_Il_Sung_Portrait-3.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/金日成

  - id: park-chung-hee
    title: 朴正煕
    start: 1961
    end: 1979
    category: economy
    tags: [韓国, 開発独裁]
    summary: 強権のもとで輸出主導の工業化を進め、「漢江の奇跡」と呼ばれる成長を実現した。
    detail: |
      韓国の大統領で、在任は1961年から1979年まで。
      強権のもとで輸出主導の工業化を進め、漢江の奇跡と呼ばれる成長を実現した。

      日本統治期に教員を経て軍の学校に学び、解放後は韓国軍の将校になった。
      1961年、クーデタによって政権を握る。
      2年後に軍を退いて大統領選に当選した。
      経済政策は、国家が主導する輸出の振興である。
      5年ごとの計画を立て、資金と人材を特定の産業に集中させた。
      繊維から始まり、鉄鋼、造船、化学、自動車へと重点が移る。
      企業集団に資金を優先的に配分し、輸出の目標を課した。

      1965年に日本と国交を結び、その資金を工業化に充てた。
      ベトナムへの派兵による外貨も、成長を支えている。
      農村では、生活の改善を進める運動が展開された。

      一方、政治的な自由は抑えられた。
      1972年の憲法改正で、大統領の任期の制限がなくなり、議員の三分の一を指名する権限も得る。
      反対派は投獄され、日本に亡命していた野党の指導者が拉致される事件も起きた。
      1979年、側近の情報機関の長に射殺される。
      経済の成果と権威主義の代償をめぐる評価は、現在も分かれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Park_Chung_Hee_%28%EB%B0%95%EC%A0%95%ED%9D%AC%29_Presidential_Portrait.jpg/500px-Park_Chung_Hee_%28%EB%B0%95%EC%A0%95%ED%9D%AC%29_Presidential_Portrait.jpg
