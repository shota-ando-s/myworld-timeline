lane: korea

leaders:
  - id: gwanggaeto
    title: 広開土王
    start: 391
    end: 412
    category: war
    tags: [高句麗]
    summary: 満洲と半島北部へ版図を広げ、碑文が当時の東アジアの勢力図を今に伝える。
    detail: |
      高句麗の第19代の王で、在位は391年から412年まで。
      満洲と半島北部へ版図を大きく広げた。
      現存する巨大な碑文が、当時の東アジアの勢力図を伝えている。

      18歳で即位し、39歳で没した。
      短い在位のうちに、周辺の勢力を次々に破っている。
      北では契丹と後燕を攻め、遼東の地を確保した。
      東では沿海州方面へ進出し、南では百済の城を多数落とす。

      新羅が倭の攻撃を受けて救援を求めると、5万の兵を送ってこれを撃退した。
      以後、新羅は高句麗の影響下に入る。
      死後、子の長寿王が巨大な石碑を建てた。
      高さ6メートルを超え、1800字ほどの漢文が刻まれている。
      現在の中国吉林省に現存する。

      この碑文は、4世紀末から5世紀初めの東アジアを知る第一級の史料である。
      倭に関する記述をどう読むかをめぐって、日本と韓国の研究者のあいだで長い論争が続いてきた。
      一部が意図的に改変されたという説も出され、検証が重ねられている。
      王の号は、広く土地を開いた王を意味する。
      高句麗の最大版図は、この王と次の代に築かれた。
      現在の韓国と北朝鮮の双方で、民族の英雄として扱われている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/3/36/Goguryeo-monarchs%2815-20%29.PNG
      credit: ja:user:田英 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Goguryeo-monarchs(15-20).PNG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/好太王

  - id: jangsu
    title: 長寿王
    start: 413
    end: 491
    category: politics
    tags: [高句麗]
    summary: 平壌へ遷都して南下を進め、79年の在位で高句麗の最盛期を保った。
    detail: |
      高句麗の第20代の王で、在位は413年から491年までの79年に及ぶ。
      長寿を意味する諡が示すように、98歳まで生きたとされる。
      平壌への遷都と南下によって最盛期を保った。

      父の広開土王が広げた領域を受け継いだ。
      外交では、南北に分かれていた中国の王朝の双方と通交した。
      北魏と南朝の両方に使節を送り、いずれか一方に依存しない立場を保つ。
      中国が分裂している状況を利用した巧みな外交である。

      427年、都を国内城から平壌へ移した。
      満洲の山城から、大同江に面した平野へ中心を移したことになる。
      南下を進める意思の表れであり、農業の基盤も強化された。
      475年、百済の都を攻め落とし、王を殺した。
      百済は南へ退いて都を移す。
      新羅も圧迫され、両国は同盟を結んで対抗した。

      領域は、満洲の広い範囲から漢江の流域までに及ぶ。
      高句麗の版図はこの代に最大になった。
      父の事績を刻んだ巨大な石碑を建てたのもこの王である。
      長い在位によって、王権と官僚の体制が安定した。
      その後の高句麗は、隋と唐の大軍を退けるだけの力を保ち続ける。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/5/55/Goguryeo-monarchs%2819-24%29.PNG
      credit: ja:user:田英 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Goguryeo-monarchs(19-24).PNG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/長寿王

  - id: king-seong-baekje
    title: 聖王（百済）
    start: 523
    end: 554
    category: religion
    tags: [百済, 仏教]
    summary: 仏教を倭に伝えた王として知られ、南朝との交流で百済文化を高めた。
    detail: |
      百済の第26代の王で、在位は523年から554年まで。
      仏教を倭に伝えた王として知られる。
      中国の南朝との交流によって百済の文化を高めた。

      即位したとき、百済は高句麗に都を奪われた後の再建の途上にあった。
      都を南のサビへ移し、国号を一時南扶余と改める。
      王権の強化と、国家としての立て直しを図った。
      中国の梁と密接に通交し、学者や技術者を招いた。
      仏教の経典と教義の研究が進み、百済は東アジアの仏教の中心の一つになる。

      倭との関係も深めた。
      538年ごろ、仏像と経典を欽明天皇に贈ったとされる。
      日本への仏教の公式な伝来である。
      暦、医、易の専門家も交代で派遣され、技術と知識が体系的に伝えられた。

      軍事では、新羅と同盟して高句麗に対抗した。
      551年、失っていた漢江の流域を回復する。
      しかし新羅が同盟を破り、その地域を奪った。
      聖王は報復の遠征に出るが、554年の管山城の戦いで敗れて戦死する。
      この敗戦によって、百済は衰退へ向かった。
      以後は倭との関係を一層深め、660年の滅亡まで存続する。
      日本の飛鳥文化は、この王の時代に始まる交流の上に築かれた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/聖王_(百済)

  - id: jinheung
    title: 真興王
    start: 540
    end: 576
    category: war
    tags: [新羅]
    summary: 漢江流域を奪って新羅を半島の主役に押し上げ、花郎の制度を整えた。
    detail: |
      新羅の第24代の王で、在位は540年から576年まで。
      漢江の流域を奪って新羅を半島の主役に押し上げた。
      花郎の制度を整えたことでも知られる。

      7歳で即位し、初めは母が摂政を務めた。
      最大の事績は領土の拡大である。
      当初は百済と同盟して高句麗から漢江の上流を奪った。
      その直後、同盟を破って百済が得た下流の地域も占領する。

      漢江の流域は、農業の生産力が高く、黄海を通じて中国と直接に通交できる要地である。
      これを得たことで、新羅は中国の王朝と独自に外交を行えるようになった。
      報復に来た百済の聖王を戦いで討ち取り、南方の伽耶の諸国も併合する。
      北は咸鏡道まで進出した。

      征服した地には、巡狩の碑が建てられた。
      現在も数基が残り、当時の領域と統治の理念を伝えている。
      花郎は、貴族の青年を集めて武芸と学問と儀礼を学ばせる組織である。
      王が制度として整え、人材の登用の場とした。
      ここから多くの将軍と官僚が出て、後の統一を担う。
      仏教を厚く保護し、大規模な寺院を建てた。
      新羅が半島の統一へ向かう基盤は、この治世に作られている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/3/3a/Silla-monarch%2822-30%29.png
      credit: ja:user:田英 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Silla-monarch(22-30).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/真興王

  - id: munmu
    title: 文武王
    start: 661
    end: 681
    category: politics
    tags: [新羅, 統一]
    summary: 唐軍を半島から退け、朝鮮半島で初めての統一国家を完成させた。
    detail: |
      新羅の第30代の王で、在位は661年から681年まで。
      唐の軍を半島から退け、朝鮮半島で最初の統一国家を完成させた。

      父の武烈王の代に百済が滅び、その直後に即位した。
      668年、唐と連合して高句麗を滅ぼす。
      これで半島の三国は一つになったが、問題はその後だった。
      唐は、百済と高句麗の旧領に都護府を置き、新羅にも支配を及ぼそうとした。
      新羅の地にまで行政の機関を設けようとする。

      文武王は、同盟国であった唐との戦いに踏み切った。
      旧百済の地の勢力を取り込み、高句麗の遺民を支援して唐軍と戦う。
      7年に及ぶ戦いの末、676年に唐の軍を半島から追い出した。
      唐が西方で吐蕃との戦いを抱えていたことも、この成功を助けている。
      統一後は、制度の整備を進めた。
      旧三国の人々を官僚として登用し、地方を九つの州に分けて統治する。

      死に際し、海に葬るよう遺言したと伝えられる。
      龍となって国を守るという理由である。
      慶州の沖にある岩が、その墓とされている。
      大国と同盟してから、その大国を排除するという過程は、小国の外交の難しさと可能性を示している。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/00/Portraits_of_kings_at_Tongiljeon.jpg/500px-Portraits_of_kings_at_Tongiljeon.jpg
      credit: Christophe95 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Portraits_of_kings_at_Tongiljeon.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/文武王

  - id: dae-joyeong
    title: 大祚栄
    start: 698
    end: 719
    category: politics
    tags: [渤海]
    summary: 高句麗の遺民を率いて渤海を建て、「海東の盛国」の礎を作った。
    detail: |
      渤海の建国者で、在位は698年から719年まで。
      高句麗の遺民と靺鞨の人々をまとめ、満洲に国家を築いた。

      高句麗の滅亡後、唐は遺民を各地へ強制的に移住させていた。
      大祚栄の一族も、遼西の営州に移されている。
      696年、契丹が唐に反乱を起こした。
      この混乱に乗じて、大祚栄は父とともに集団を率いて東へ脱出する。

      唐は追討の軍を送った。
      大祚栄は天門嶺で待ち伏せ、これを撃破する。
      追撃を振り切って東牟山に拠り、698年に国を建てた。
      当初の国号は震であり、後に渤海と改められる。
      建国の後、唐との関係を修復した。
      冊封を受け、朝貢の形をとることで外交上の承認を得る。
      一方で内政の自立は保った。

      突厥や新羅とも交渉し、周囲の勢力のあいだで均衡を保つ外交を行っている。
      高句麗の後継を名乗り、その正統性を主張した。
      後の代の王が日本へ送った国書には、高句麗の旧領を回復したという表現が現れる。
      滅亡した国家の遺民が、30年を経て新しい国家を築いた例である。
      渤海は228年続き、東アジアの一角を占める勢力になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大祚栄

  - id: wang-geon
    title: 王建
    start: 918
    end: 943
    category: politics
    tags: [高麗]
    summary: 豪族との婚姻を重ねて後三国を統一し、高麗500年の出発点を作った。
    detail: |
      高麗の建国者で、在位は918年から943年まで。
      後三国の争いを収め、500年続く王朝の出発点を作った。

      開城の海上交易で富を得た豪族の家に生まれた。
      後高句麗の君主に仕え、水軍を率いて功績を上げる。
      その君主が暴政を行い、人心を失うと、家臣に推されて王位に就いた。
      国号を高麗とし、高句麗の後継を名乗る。

      統一の方法には特徴がある。
      武力だけでなく、懐柔と婚姻を重視した。
      各地の豪族の娘を妃として迎え、その数は29人に及ぶ。
      血縁によって有力者を体制に取り込む方式である。
      新羅に対しては友好的な態度をとり続けた。
      935年、新羅の王が自ら国を譲る形で併合される。
      翌年、後百済を滅ぼして統一が完成した。

      滅ぼした国の王族と官僚を厚遇し、旧来の身分と土地を保障した。
      渤海の遺民も受け入れている。
      死に際し、後継者への訓戒を残した。
      仏教を敬うこと、風水を重んじること、民の負担を軽くすること、北方の勢力を警戒することなどが含まれる。
      多数の妃を迎えたことは、後の王位継承の争いの原因にもなった。
      統合の手段が、そのまま次の世代の課題になった例である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/48/%EC%99%95%EA%B1%B4_%EC%A2%8C%EC%83%81_2.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:%EC%99%95%EA%B1%B4_%EC%A2%8C%EC%83%81_2.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/太祖_(高麗王)

  - id: gwangjong
    title: 光宗
    start: 949
    end: 975
    category: society
    tags: [高麗, 科挙]
    summary: 奴婢の身分を洗い直し科挙を導入して、豪族から国王へ権力を移した。
    detail: |
      高麗の第4代の王で、在位は949年から975年まで。
      奴婢の身分を洗い直し、科挙を導入した。
      豪族から国王へ権力を移した人物である。

      建国の過程で、王建は各地の豪族と婚姻を結び、その協力を得ていた。
      その結果、豪族は多数の私兵と奴婢を抱え、王権を脅かす存在になっている。
      光宗はまず、奴婢の身分を調査する法を出した。
      戦乱のなかで不当に奴婢とされた者を、もとの良民の身分に戻すというものである。
      豪族は労働力と私兵を失い、逆に国家は税と兵を確保した。

      次に、中国から来た人物の建議を受けて科挙を導入した。
      試験によって官僚を選ぶ仕組みであり、家柄に依存しない人材の登用が可能になる。
      これによって、王に直属する官僚の層が育った。
      官僚の服の色を位階によって定め、序列を可視化する措置もとられている。
      反発は強く、多くの豪族が粛清された。
      王族にも処罰が及んだと記録されている。

      自らを皇帝と称し、独自の年号を用いた時期もある。
      これらの改革によって、高麗は豪族の連合から中央集権的な国家へ移った。
      科挙は以後、王朝の終わりまで官僚登用の基本的な仕組みであり続ける。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/%EA%B2%BD%EA%B8%B0%EA%B0%9C%EC%84%B1_%EA%B3%A0%EB%A0%A4_%EA%B4%91%EC%A2%85_%ED%97%8C%EB%A6%89_02.jpg/500px-%EA%B2%BD%EA%B8%B0%EA%B0%9C%EC%84%B1_%EA%B3%A0%EB%A0%A4_%EA%B4%91%EC%A2%85_%ED%97%8C%EB%A6%89_02.jpg
      credit: National Museum of Korea / KOGL Type 1
      page: https://commons.wikimedia.org/wiki/File:%EA%B2%BD%EA%B8%B0%EA%B0%9C%EC%84%B1_%EA%B3%A0%EB%A0%A4_%EA%B4%91%EC%A2%85_%ED%97%8C%EB%A6%89_02.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/光宗_(高麗王)

  - id: choe-chungheon
    title: 崔忠献
    start: 1196
    end: 1219
    category: war
    tags: [高麗, 武臣政権]
    summary: 王を立て退けする武臣政権の実権を握り、崔氏4代60年の支配を始めた。
    detail: |
      高麗の武臣政権の実権を握った人物で、1196年から1219年まで権力の座にあった。
      崔氏による4代60年の支配を始めた。

      武臣政権は1170年に始まったが、実力者が次々に殺される不安定な状態が続いていた。
      崔忠献は当時の実力者を討ち、政権を掌握する。
      統治の方法に特徴がある。
      王を廃立する権限を握り、在位中に四人の王を立てた。
      しかし王朝そのものは存続させ、自らが王位に就くことはしない。
      形式上の秩序を保ちながら、実質を握る方式である。

      私的な政庁を設け、そこで人事と政務を決めた。
      私兵の組織を整え、数千人規模の武力を維持する。
      一方で、文官を登用して行政を担わせた。
      武力だけでは統治できないことを理解していたとみられる。

      仏教にも介入した。
      寺院の僧兵が反乱を起こすと、これを鎮圧している。
      農民と奴婢の反乱が各地で起きたが、いずれも武力で抑えた。
      権力は子と孫へ受け継がれた。
      モンゴルの侵攻に際して都を江華島へ移し、抵抗を続ける方針をとったのも崔氏である。
      王朝の形式を残したまま実権を握る構造は、同時期の日本の幕府と比較されることがある。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/崔忠献

  - id: chungnyeol
    title: 忠烈王
    start: 1274
    end: 1308
    category: politics
    tags: [高麗, 元]
    summary: 元の皇女を妃に迎え、高麗が元の姻戚として生き延びる形を作った。
    detail: |
      高麗の第25代の王で、在位は1274年から1308年まで。
      元の皇女を妃に迎え、高麗が元の姻戚として存続する形を作った。

      モンゴルへの服属が決まった後に即位した。
      クビライの娘を妃とし、王は元の皇室の一員という立場になる。
      この関係は二面性を持っていた。
      一方で、王朝の存続が保証される。
      元は高麗を直轄の領域とせず、王を通じた間接的な統治を選んだ。
      他方、内政への干渉を受け、王の廃立も元の意向に左右された。

      王の諡には忠の字が冠せられるようになる。
      元への忠誠を示す形式である。
      服装と髪型はモンゴル風に改められた。
      王族と官僚は辮髪を結い、モンゴル語が宮廷で用いられる。
      両国のあいだで人と物の往来が増え、生活の様式にも影響が及んだ。

      二度の日本遠征では、船の建造と兵糧、兵の提供を担わされた。
      木材の伐採と造船の負担は重く、国力を消耗させる。
      一方、元を通じて朱子学がもたらされた。
      この学問が後に朝鮮王朝の国家の原理になる。
      大国の支配下で王朝を保つという選択の是非は、その後も議論されてきた。
      直接の統治を免れたことが、独自の制度と文化の存続につながった面もある。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/忠烈王

  - id: gongmin
    title: 恭愍王
    start: 1351
    end: 1374
    category: politics
    tags: [高麗, 自立]
    summary: 元の衰えに乗じて自立と改革を進めたが、反発のなかで殺された。
    detail: |
      高麗の第31代の王で、在位は1351年から1374年まで。
      元の衰えに乗じて自立と改革を進めたが、反発のなかで殺された。

      王子の時代を元の都で過ごし、モンゴルの皇女を妃としていた。
      元の内情を知る立場にあったことが、後の判断を支えている。
      即位後、紅巾の乱によって元が動揺すると、自立へ動いた。
      モンゴル風の服装と髪型を廃し、元の年号の使用をやめる。
      内政を監督していた機関を廃止し、元に仕えて権勢を得ていた一族を排除した。
      北の領土を回復する遠征も行っている。

      国内の改革では、僧の辛旽を登用した。
      権門が不法に奪った土地を本来の持ち主に返し、奴婢とされた者を良民に戻す。
      貴族層の反発は激しく、辛旽は後に処刑された。

      妃の死後、王は政務への意欲を失ったと伝えられる。
      宮廷の内部で対立が深まり、1374年に側近に殺害された。
      王朝の再建は果たされなかった。
      北からは紅巾賊が、南からは倭寇が侵入し、国土は荒れる。
      倭寇の討伐で名を上げた武将の李成桂が、やがて王朝を倒す。
      改革が挫折したことで、王朝の交代が現実になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/%ED%99%94%EC%9E%A5%EC%82%AC_%EB%B4%89%EC%95%88_%EA%B3%B5%EB%AF%BC%EC%99%95_%EC%96%B4%EC%A7%84_%EC%9C%A0%EB%A6%AC%EA%B1%B4%ED%8C%90_%EC%B4%AC%EC%98%81.jpg/500px-%ED%99%94%EC%9E%A5%EC%82%AC_%EB%B4%89%EC%95%88_%EA%B3%B5%EB%AF%BC%EC%99%95_%EC%96%B4%EC%A7%84_%EC%9C%A0%EB%A6%AC%EA%B1%B4%ED%8C%90_%EC%B4%AC%EC%98%81.jpg
