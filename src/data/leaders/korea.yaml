        url: https://ja.wikipedia.org/wiki/李成桂

  - id: sejong-the-great
    title: 世宗
    start: 1418
    end: 1450
    category: culture
    tags: [朝鮮王朝, ハングル]
    summary: 訓民正音の創製と科学技術の振興で、朝鮮の文化的な頂点を作った。
    detail: |
      朝鮮王朝の第4代の王で、在位は1418年から1450年まで。
      訓民正音の創製と科学技術の振興によって、文化の頂点を作った。

      三男だったが、兄が自ら身を引いて王位に就いたとされる。
      最大の事績が文字の創製である。
      漢字は習得が難しく、庶民は自分の意思を文字で伝えられない。
      これを憐れんで、誰もが容易に学べる文字を作ったと序文に記されている。
      学問の機関を整え、若い学者を集めて研究させた。
      農業書、医学書、法典、音楽の理論書が編まれる。

      科学の分野でも成果が多い。
      雨量計が世界で最も早い時期に作られ、各地で観測が行われた。
      日時計と水時計、天体の観測機器が製作される。
      暦は、中国のものをそのまま使うのではなく、漢陽の緯度に合わせて計算し直された。

      技術者の蔣英実は奴婢の身分から登用され、多くの器具を作った。
      軍事では、北の国境に城を築いて領域を広げ、対馬へ遠征して倭寇を抑えた。
      音楽の整備にも関わり、自ら作曲したと伝えられる。
      現在、韓国の紙幣に肖像が用いられている。
      その治世は、朝鮮の歴史のなかで最も高く評価される時期である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/Korea_Yeouido_Summer_20140805_11_%2814862134703%29.jpg/500px-Korea_Yeouido_Summer_20140805_11_%2814862134703%29.jpg
