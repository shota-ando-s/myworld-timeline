        url: https://ja.wikipedia.org/wiki/盧泰愚

  - id: kim-young-sam
    title: 金泳三
    start: 1993
    end: 1998
    category: politics
    tags: [韓国, 民主化]
    summary: 32年ぶりの文民大統領として、軍の政治介入を断ち切った。
    detail: |
      韓国の大統領で、在任は1993年から1998年まで。
      32年ぶりの文民の大統領として、軍の政治介入を断ち切った。

      長く野党の指導者として民主化運動を率いた。
      断食や軟禁を経験している。
      1990年、与党との合流を選び、その枠組みのなかで大統領候補になった。
      この判断は、支持者から批判も受けた。

      就任後の改革は速かった。
      軍内部の私的な組織を解体し、関係する将官を一斉に退役させる。
      軍が政治に介入する構造を取り除いた。
      金融では、実名による取引を義務づける制度を導入した。
      不正な資金の流れを追跡できるようにする措置である。
      地方自治体の長の選挙も復活させた。

      1995年、前任の二人の大統領を逮捕した。
      光州事件と不正資金の責任が問われ、有罪判決が下される。
      過去の清算に踏み込んだ。
      植民地期に建てられた総督府の庁舎を撤去したことも、象徴的な措置だった。
      1997年、アジア通貨危機が直撃する。
      外貨が尽き、IMFの支援を受け入れた。
      多数の企業が倒産し、失業が急増する。
      民主化の完成という功績と、経済危機への対応の失敗が、同じ任期のなかにある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8d/Kim_Young-sam_presidential_portrait.jpg/500px-Kim_Young-sam_presidential_portrait.jpg
      credit: 대한민국 국가기록원 / KOGL Type 1
      page: https://commons.wikimedia.org/wiki/File:Kim_Young-sam_presidential_portrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/金泳三

  - id: kim-jong-il
    title: 金正日
    start: 1994
    end: 2011
    category: politics
    tags: [北朝鮮]
    summary: 先軍政治と核開発を進め、大飢饉のなかで体制を保った。
    detail: |
      朝鮮民主主義人民共和国の第2代の指導者で、1994年から2011年まで権力の座にあった。
      先軍政治と核開発を進め、大飢饉のなかで体制を保った。

      金日成の子であり、1970年代から後継者としての地位を固めていた。
      映画と芸術の分野を担当し、宣伝の手法に関与したとされる。
      1994年に父が死去した後、3年の喪に服してから正式に権力を継承した。
      国家主席の地位は空位とされ、自らは国防委員長を名乗る。

      同じ時期、深刻な飢饉が起きた。
      ソ連の崩壊による支援の喪失、洪水と干ばつ、配給制度の破綻が重なる。
      数十万から100万が死亡したとされる。
      この危機のなかで、軍を最優先とする先軍政治が掲げられた。
      資源を軍に集中させ、体制の維持を図る。

      核開発が国際的な問題になった。
      1994年の枠組み合意、2003年からの六者協議が行われたが、いずれも持続しない。
      2006年に最初の核実験を行った。
      2000年と2007年には、韓国の大統領との首脳会談が実現している。
      市場が非公式に広がり、配給に頼らない経済活動が生まれたのもこの時期である。
      2011年に死去し、三男の金正恩が継承した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Kim_Jong_il_Portrait-2.jpg/500px-Kim_Jong_il_Portrait-2.jpg
      credit: Jesse Charlie / CC0
      page: https://commons.wikimedia.org/wiki/File:Kim_Jong_il_Portrait-2.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/金正日

  - id: kim-dae-jung
    title: 金大中
    start: 1998
    end: 2003
    category: politics
    tags: [韓国, 太陽政策]
    summary: 通貨危機からの立て直しと同時に、初の南北首脳会談を実現した。
    detail: |
      韓国の大統領で、在任は1998年から2003年まで。
      通貨危機からの立て直しと同時に、初の南北首脳会談を実現した。

      長く野党の指導者として弾圧を受けた。
      1973年には東京で拉致され、海上で殺害されかけた事件が起きている。
      1980年には死刑判決を受け、国際的な圧力で減刑された。
      1997年、四度目の挑戦で大統領に当選する。
      韓国で初めての、与野党間の政権交代だった。

      就任時、国はIMFの管理下にあった。
      金融機関と財閥の整理を進め、外国資本の受け入れを開放する。
      情報技術への投資を重点とし、高速の通信網を全国に整備した。
      2年ほどで経済は回復する。
      福祉の制度も拡充された。
      国民基礎生活保障の仕組みが作られ、医療保険が統合される。

      対北朝鮮では、太陽政策を掲げた。
      圧力ではなく交流と支援によって変化を促すという方針である。
      2000年、平壌で初の南北首脳会談が実現した。
      離散家族の再会、開城の工業団地、金剛山の観光が始まる。
      同じ年、ノーベル平和賞を受けた。
      会談の前に巨額の送金が行われていたことが後に判明し、評価は分かれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d2/Kim_Dae-jung_presidential_portrait.jpg/500px-Kim_Dae-jung_presidential_portrait.jpg
      credit: 대한민국 국가기록원 / KOGL Type 1
      page: https://commons.wikimedia.org/wiki/File:Kim_Dae-jung_presidential_portrait.jpg
    links:
