  - id: heungseon-daewongun
    title: 興宣大院君
    start: 1863
    end: 1873
    category: politics
    tags: [朝鮮王朝, 鎖国]
    summary: 王権の立て直しと鎖国を進め、開国をめぐる国内対立の軸になった。
    detail: |
      朝鮮王朝の国王高宗の父で、1863年から1873年まで摂政として実権を握った。
      王権の立て直しと鎖国を進め、開国をめぐる対立の軸になった。

      王族でありながら不遇の生活を送っていた。
      王が跡継ぎなく没したとき、12歳の息子が王位に就き、自らが政務を執る。
      改革の方向は二つある。
      第一に、外戚が権力を握る勢道政治を終わらせ、王権を回復することである。
      有力な一族を退け、党派にとらわれない人材を登用した。
      各地の書院を大幅に整理し、税を免れていた特権を取り上げる。
      両班にも軍布を課した。

      第二に、景福宮の再建である。
      焼失していた王宮を建て直し、王朝の権威を示そうとした。
      費用の調達のため、強制的な寄付と悪貨の発行が行われ、物価の混乱を招く。
      対外的には、鎖国を貫いた。
      カトリックを弾圧し、フランスとアメリカの艦隊の侵入を撃退する。
      交渉を拒む姿勢を石碑に刻ませ、各地に立てた。

      1873年、息子が成人して親政を始めると退いた。
      以後も政治への関与を試み、王妃の一族と対立し続ける。
      改革の意欲と、国際情勢への認識の欠如が、同じ人物のなかに並んでいる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Heungseon_Daewongun_Portrait.jpg/500px-Heungseon_Daewongun_Portrait.jpg
