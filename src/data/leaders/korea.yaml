  - id: roh-tae-woo
    title: 盧泰愚
    start: 1988
    end: 1993
    category: politics
    tags: [韓国, 北方外交]
    summary: 直接選挙で選ばれ、ソ連・中国との国交を開く北方外交を進めた。
    detail: |
      韓国の大統領で、在任は1988年から1993年まで。
      直接選挙で選ばれ、ソ連と中国との国交を開く北方外交を進めた。

      全斗煥とともに軍の実権を握った人物である。
      1987年、与党の大統領候補として直接選挙の受け入れを宣言した。
      野党の候補が分裂したため、得票率36パーセントで当選する。
      就任後、過去の清算と民主化の要求に直面した。
      国会で光州事件の聴聞会が開かれ、前大統領が証言を求められる。
      地方自治が復活し、報道の自由も拡大した。

      外交では、北方外交を掲げた。
      社会主義国との関係の樹立を進め、1990年にソ連、1992年に中国と国交を結ぶ。
      冷戦の終結という国際環境を利用した政策である。
      1991年には、南北が同時に国連へ加盟した。
      南北基本合意書も交わされ、互いの体制を認める枠組みが作られる。
      1988年のソウル五輪は、東西の陣営がともに参加する大会になった。

      退任後、不正資金の蓄積が明らかになり、光州の責任も問われて実刑判決を受けた。
      後に特赦される。
      軍出身でありながら民主化への移行を担い、冷戦後の外交の枠組みを作った治世である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Roh_Tae-woo_%28%EB%85%B8%ED%83%9C%EC%9A%B0_%29_Presidential_Potraits.jpg/500px-Roh_Tae-woo_%28%EB%85%B8%ED%83%9C%EC%9A%B0_%29_Presidential_Potraits.jpg
