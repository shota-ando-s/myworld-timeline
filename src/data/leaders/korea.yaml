      page: https://commons.wikimedia.org/wiki/File:Park_Geun-hye_presidential_portrait_2.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/朴槿恵

  - id: moon-jae-in
    title: 文在寅
    start: 2017
    end: 2022
    category: politics
    tags: [韓国, 南北対話]
    summary: 南北・米朝の首脳会談を仲介し、対話による非核化を模索した。
    detail: |
      韓国の大統領で、在任は2017年から2022年まで。
      南北と米朝の首脳会談を仲介し、対話による非核化を模索した。

      人権弁護士として活動し、盧武鉉政権では秘書室長を務めた。
      前任者の罷免を受けた選挙で当選する。
      就任時、北朝鮮は核実験とミサイルの発射を繰り返していた。
      2018年の平昌冬季五輪が転機になった。
      北朝鮮の選手団と代表が参加し、対話の糸口が開かれる。
      同じ年、板門店と平壌で三度の南北首脳会談が行われた。
      軍事的な緊張を緩和する合意も結ばれる。

      アメリカとの仲介も進め、シンガポールとハノイで米朝の首脳会談が実現した。
      しかし合意には至らず、以後の対話は途絶える。
      国内では、最低賃金の引き上げと労働時間の短縮を進めた。
      雇用への影響をめぐって議論が起きる。
      不動産価格の高騰を抑えられなかったことは、支持の低下につながった。

      検察の権限を分ける改革を進め、強い反発を受けた。
      日本との関係は悪化した。
      徴用をめぐる判決と輸出管理の措置が重なり、戦後で最も冷え込んだ時期とされる。
      新型コロナウイルスへの初期の対応は、国際的に評価された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0d/President_Moon_Jae_In.jpg/500px-President_Moon_Jae_In.jpg
      credit: Government of the Republic of Korea / KOGL Type 1
      page: https://commons.wikimedia.org/wiki/File:President_Moon_Jae_In.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/文在寅

  - id: yoon-suk-yeol
    title: 尹錫悦
    start: 2022
    end: 2025
    category: politics
    tags: [韓国]
    summary: 非常戒厳の宣布が国会に覆され、弾劾されて罷免された。
    detail: |
      韓国の大統領で、在任は2022年から2025年まで。
      非常戒厳の宣布が国会に覆され、弾劾されて罷免された。

      検事として長く勤め、前政権の事件の捜査を担当した後、検事総長になった。
      政権との対立から辞任し、翌年の大統領選に出馬して当選する。
      得票差は1パーセントに満たなかった。
      外交では、日本との関係の改善に踏み込んだ。
      徴用をめぐる問題で韓国側の財団が支払う解決策を示し、首脳の往来が再開する。
      日米韓の協力の枠組みも強化された。

      国内では、国会の多数を野党が占める状態が続いた。
      法案は通らず、拒否権の行使が繰り返される。
      報道機関や医療制度をめぐる対立も深まった。
      2024年12月、突然の非常戒厳を宣布した。
      国会と政党の活動を禁じる内容である。
      議員が国会に集まって解除の決議を可決し、数時間で撤回された。

      国会は弾劾訴追を可決し、2025年4月に憲法裁判所が罷免を決定する。
      内乱の容疑で訴追も行われた。
      民主化から40年近くを経て戒厳が試みられたことは、大きな衝撃を与えた。
      同時に、それが制度によって短時間で止められたことも示されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/South_Korea_President_Yoon_Suk_Yeol_portrait.jpg/500px-South_Korea_President_Yoon_Suk_Yeol_portrait.jpg
      credit: 龍山大統領室 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:South_Korea_President_Yoon_Suk_Yeol_portrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/尹錫悦

  - id: lee-jae-myung
    title: 李在明
    start: 2025
    ongoing: true
    category: politics
    tags: [韓国]
    summary: 前大統領の罷免を受けた繰り上げ選挙で当選した。
    detail: |
      韓国の大統領で、2025年6月から在任している。
      前大統領の罷免を受けた繰り上げの選挙で当選した。

      貧しい家庭に生まれ、少年工として働いた。
      工場での事故で腕に障害が残っている。
      検定試験を経て大学に進み、人権弁護士になった。
      城南市長と京畿道知事を務め、青年への手当や公共の事業で知られる。
      2022年の大統領選では僅差で敗れ、その後は最大野党の代表として国会の多数を率いた。
      複数の事件で起訴され、裁判が続いている。
      2024年には遊説中に首を刺される事件も起きた。

      戒厳が宣布された夜、国会へ駆けつける様子を自ら配信し、解除の決議に加わっている。
      2025年4月の罷免を受けて実施された選挙で当選した。
      掲げているのは、経済の立て直しと社会の分断の修復である。
      所得の支援と成長の政策を組み合わせる方針を示してきた。
      外交では、実利を重んじる立場を表明している。

      国会の多数を与党が占める状態での政権であり、政策の実行は進めやすい。
      一方、権力の集中への懸念も指摘される。
      戒厳の事態を経た後の政治の立て直しが、最大の課題になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/President_Lee_Jae_Myung_20260306.jpg/500px-President_Lee_Jae_Myung_20260306.jpg
      credit: Republic of Korea/플리커 / 대한민국 청와대 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:President_Lee_Jae_Myung_20260306.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/李在明
