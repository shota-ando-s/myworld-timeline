  - id: sejo-joseon
    title: 世祖
    start: 1455
    end: 1468
    category: society
    tags: [朝鮮王朝, 法典]
    summary: 甥から王位を奪ったが、『経国大典』の編纂で統治を法典として固めた。
    detail: |
      朝鮮王朝の第7代の王で、在位は1455年から1468年まで。
      甥から王位を奪ったが、法典の編纂によって統治の基礎を固めた。

      世宗の次男である。
      兄の死後、12歳の甥が即位すると、その補佐にあたっていた重臣を殺害して実権を握った。
      2年後、甥から譲位を受ける形で即位する。
      復位を図る動きが起き、関わった6人の官僚が処刑された。
      彼らは死六臣と呼ばれ、忠節の象徴として後世に語られる。
      退位した甥も、まもなく殺された。
      王位の正統性に問題を抱えたまま、統治を固める必要があった。

      最大の事業が『経国大典』の編纂である。
      行政、人事、税制、刑罰、儀礼を体系的に定めた法典で、完成は次の代になる。
      以後400年にわたり、王朝の統治の基本になった。
      官制を整理し、王に権限を集める仕組みも作った。
      議政府の権限を削り、六つの部局が王に直属する形に改める。

      仏教を保護した点は、儒教を国是とする王朝のなかでは例外的である。
      経典の刊行の機関を設け、寺院を建てた。
      王位を奪った罪の意識によるという説明もある。
      手段の非道さと、統治の実績が並び立つ治世である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/%EC%84%B8%EC%A1%B0_%EC%96%B4%EC%A7%84_%EC%B4%88%EB%B3%B8.jpg/500px-%EC%84%B8%EC%A1%B0_%EC%96%B4%EC%A7%84_%EC%B4%88%EB%B3%B8.jpg
