  - id: yeongjo
    title: 英祖
    start: 1724
    end: 1776
    category: politics
    tags: [朝鮮王朝, 蕩平策]
    summary: 党派を均等に登用する蕩平策で対立を抑え、52年の在位で民政を立て直した。
    detail: |
      朝鮮王朝の第21代の王で、在位は1724年から1776年までの52年に及ぶ。
      王朝で最も長い在位である。
      党派を均等に登用する蕩平策によって対立を抑えた。

      即位の前後、党争は激しさを増していた。
      王位の継承をめぐる争いが、そのまま党派の争いになる。
      英祖自身も、即位の正統性を疑う声にさらされた。
      蕩平策は、特定の党派に偏らず人材を登用する方針である。
      要職に異なる党派の者を配置し、均衡を保った。
      対立をあおる言動は処罰される。

      民政では負担の軽減を進めた。
      兵役の代わりに納める布を半分に減らし、その不足分を他の税源で補う。
      拷問の方法を制限し、苛酷な刑罰を廃した。
      自らは質素を貫き、粗末な食事と衣で通したと記録されている。

      治世で最も知られるのは、思悼世子の事件である。
      王は世子の行状を問題視し、米びつに閉じ込めて餓死させた。
      党派の対立が背景にあったとされる。
      後にその孫が即位し、父の名誉の回復に努めた。
      長い在位と均衡の政策によって、王朝は安定を取り戻した。
      次の正祖の治世と合わせて、後期の盛りの時期とされる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Portrait_of_King_Yeongjo_-_Chae_Yong_Shin_%28%E8%94%A1%E9%BE%8D%E8%87%A3_1850-1941%29_Cho_Seok-jin_%28%E8%B6%99%E9%8C%AB%E6%99%89_1853-1920%29_et_%28cropped%29.jpg/500px-Portrait_of_King_Yeongjo_-_Chae_Yong_Shin_%28%E8%94%A1%E9%BE%8D%E8%87%A3_1850-1941%29_Cho_Seok-jin_%28%E8%B6%99%E9%8C%AB%E6%99%89_1853-1920%29_et_%28cropped%29.jpg
      credit: 蔡龍臣 / Jo Seokjin / Public domain
      page: https://commons.wikimedia.org/wiki/File:Portrait_of_King_Yeongjo_-_Chae_Yong_Shin_(%E8%94%A1%E9%BE%8D%E8%87%A3_1850-1941)_Cho_Seok-jin_(%E8%B6%99%E9%8C%AB%E6%99%89_1853-1920)_et_(cropped).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/英祖_(朝鮮王)

  - id: jeongjo
    title: 正祖
    start: 1776
    end: 1800
    category: culture
    tags: [朝鮮王朝, 実学]
    summary: 実学者を登用し、朝鮮後期の学問と文化の盛りを作った。
    detail: |
      朝鮮王朝の第22代の王で、在位は1776年から1800年まで。
      実学者を登用し、後期の学問と文化の盛りを作った。

      父は祖父の命によって餓死させられており、その死を目の当たりにしている。
      即位後、父の名誉の回復に努めた。
      祖父の蕩平策を継ぎ、党派に偏らない人材の登用を進めた。
      さらに、身分によって登用が制限されていた庶子の出身者も起用する。
      王立の図書館を設け、若い官僚を選んで研究に専念させた。
      書物の収集と刊行が進み、活字が新たに鋳造される。
      実学の学者が多く集められた。

      水原に城を築いたことも大きな事業である。
      父の墓を移し、計画的な都市を作る構想だった。
      設計には丁若鏞が関わり、滑車を用いた装置で石を運んだ。
      工事の記録が詳細に残されており、当時の技術を知る資料になっている。

      商業では、特権商人の独占を制限し、小規模な商人の営業を認めた。
      奴婢の制度の緩和にも着手している。
      急死によって改革は中断した。
      以後、外戚が権力を握る勢道政治の時代に入る。
      19世紀の混乱のなかで、この治世は後期の最後の盛りとして振り返られてきた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/1/1b/King_JeongJo_of_Joseon.jpg
