lane: china

periods:
  - id: xia
    title: 夏
    start: -2070
    startCirca: true
    end: -1600
    endCirca: true
    category: politics
    tags: [中国, 王朝, 伝承]
    summary: 文献が伝える最初の王朝。実在をめぐっては二里頭遺跡との関係が議論されている。
    detail: |
      『史記』は禹に始まる王朝として記すが、同時代の文字資料がなく、
      考古学的には河南省の二里頭文化との対応が論じられている段階。
      年代も推定値で、諸説がある。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/夏_(三代)

  - id: shang
    title: 殷（商）
    start: -1600
    startCirca: true
    end: -1046
    category: politics
    tags: [中国, 王朝]
    summary: 実在が確認できる最古の王朝。甲骨文字と青銅器で知られる。
    detail: |
      占いの記録を亀甲や獣骨に刻んだ甲骨文字は、現在の漢字の直接の祖先にあたる。
      王は祭祀を通じて神と交わる存在であり、政治と宗教が分かれていなかった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/殷

  - id: zhou
    title: 周
    start: -1046
    end: -256
    category: politics
    tags: [中国, 王朝]
    summary: 封建制と天命思想を打ち立てた長命な王朝。後半は諸侯が自立していく。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/周

  - id: spring-autumn-warring
    title: 春秋戦国時代
    start: -770
    end: -221
    category: war
    tags: [中国, 分裂]
    summary: 諸侯が覇を競った分裂期。同時に諸子百家が生まれた思想の黄金期でもある。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/春秋戦国時代

  - id: qin
    title: 秦
    start: -221
    end: -206
    category: politics
    tags: [中国, 王朝, 統一]
    summary: 初の統一王朝。郡県制・文字と度量衡の統一を短期間で断行した。
    links:
      - label: Wikipedia（秦）
        url: https://ja.wikipedia.org/wiki/秦

  - id: han
    title: 漢
    start: -202
    end: 220
    category: politics
    tags: [中国, 王朝]
    summary: 400年続いた大帝国。儒学の官学化とシルクロード交易が本格化した。
    detail: |
      「漢字」「漢民族」という呼び方はこの王朝に由来する。
      前半（前漢）は長安、後半（後漢）は洛陽を都とし、間に王莽の新をはさむ。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/漢

  - id: xin
    title: 新
    start: 9
    end: 23
    category: politics
    tags: [中国, 簒奪]
    summary: 王莽が漢を奪って立てた短命の王朝。復古的な改革が混乱を招き15年で倒れた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/新

  - id: three-kingdoms
    title: 三国時代
    start: 220
    end: 280
    category: war
    tags: [中国, 分裂]
    summary: 魏・呉・蜀が並び立った分裂期。以後およそ370年の混乱が続く。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/三国時代_(中国)

  - id: western-eastern-jin
    title: 晋（西晋・東晋）
    start: 265
    end: 420
    category: politics
    tags: [中国, 王朝]
    summary: 一時は中国を統一したが北方民族に華北を奪われ、江南へ逃れて命脈を保った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/晋_(王朝)

  - id: sixteen-kingdoms
    title: 五胡十六国
    start: 304
    end: 439
    category: war
    tags: [中国, 分裂, 遊牧]
    summary: 北方の諸民族が華北に次々と国を建てた130年余り。漢人の南遷が進んだ。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/五胡十六国時代

  - id: northern-southern-dynasties
    title: 南北朝
    start: 439
    end: 589
    category: politics
    tags: [中国, 分裂]
    summary: 北の遊牧系王朝と南の漢人王朝が並立。仏教が社会の隅々まで広がった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/南北朝時代_(中国)

  - id: sui
    title: 隋
    start: 581
    end: 618
    category: politics
    tags: [中国, 王朝]
    summary: 南北を再統一し、大運河と科挙という後世の土台を作って短命に終わった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/隋

  - id: tang
    title: 唐
    start: 618
    end: 907
    category: politics
    tags: [中国, 王朝]
    summary: 長安を中心とする国際帝国。日本を含む東アジア全体の手本となった。
    detail: |
      律令・均田制・科挙という統治の仕組みと、詩と仏教を中心とする文化が、
      朝鮮・日本・ベトナムに輸出された。首都長安には各地の商人や留学生が集まった。
    links:
      - label: Wikipedia（唐）
        url: https://ja.wikipedia.org/wiki/唐

  - id: five-dynasties
    title: 五代十国
    start: 907
    end: 960
    category: war
    tags: [中国, 分裂]
    summary: 唐の滅亡から宋の統一までの半世紀。武人が次々と政権を奪い合った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/五代十国時代

  - id: liao
    title: 遼（契丹）
    start: 916
    end: 1125
    category: politics
    tags: [中国, 征服王朝, 遊牧]
    summary: 契丹が華北の一部を含めて支配した王朝。宋から毎年の贈り物を受け取った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/遼

  - id: song
    title: 宋
    start: 960
    end: 1279
    category: politics
    tags: [中国, 王朝]
    summary: 軍事では劣勢ながら、経済・技術・都市文化が飛躍的に発展した。
    detail: |
      火薬・羅針盤・印刷術が実用化され、紙幣が流通し、開封や杭州には
      100万人規模の都市生活が生まれた。科挙で選ばれた官僚が政治を担う体制が固まる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/宋_(王朝)

  - id: western-xia
    title: 西夏
    start: 1038
    end: 1227
    category: politics
    tags: [中国, 西域]
    summary: タングートが河西回廊に建てた国。独自の文字を作り、交易路を押さえた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/西夏

  - id: jurchen-jin
    title: 金
    start: 1115
    end: 1234
    category: politics
    tags: [中国, 征服王朝]
    summary: 女真が遼と北宋を倒して華北を支配。モンゴルに滅ぼされた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/金_(王朝)

  - id: yuan
    title: 元
    start: 1271
    end: 1368
    category: politics
    tags: [中国, モンゴル, 征服王朝]
    summary: モンゴルが立てた王朝。ユーラシア規模の人と物の往来が中国を通った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/元_(王朝)

  - id: ming
    title: 明
    start: 1368
    end: 1644
    category: politics
    tags: [中国, 王朝]
    summary: 漢人王朝の復活。海禁と朝貢体制のもとで東アジアの秩序を作った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/明

  - id: qing
    title: 清
    start: 1636
    end: 1912
    category: politics
    tags: [中国, 征服王朝]
    summary: 満洲人の王朝。最大版図を実現したのち、19世紀に列強の圧力で揺らいだ。
    detail: |
      康熙・雍正・乾隆の約130年は人口が3倍近くに増えた繁栄期。
      その後、財政難と人口圧力に加えてアヘン戦争以降の外圧が重なり、統治が崩れていく。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/清

  - id: taiping
    title: 太平天国
    start: 1851
    end: 1864
    category: war
    tags: [中国, 内乱, 宗教]
    summary: キリスト教の影響を受けた宗教反乱が南京を14年間支配。死者は数千万に達した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/太平天国の乱

  - id: self-strengthening
    title: 洋務運動
    start: 1861
    end: 1894
    category: science
    tags: [中国, 近代化]
    summary: 西洋の技術だけを取り入れて国を建て直そうとした試み。日清戦争の敗北で限界が露呈した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/洋務運動

  - id: roc-mainland
    title: 中華民国（大陸期）
    start: 1912
    end: 1949
    category: politics
    tags: [中国, 共和制]
    summary: アジア初の共和国。しかし実権は軍閥・国民党・共産党の間で揺れ続けた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/中華民国

  - id: warlord-era
    title: 軍閥割拠
    start: 1916
    end: 1928
    category: war
    tags: [中国, 内戦]
    summary: 袁世凱の死後、各地の軍事勢力が割拠した時期。北伐でひとまず収束した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/北京政府

  - id: second-sino-japanese-war
    title: 日中戦争
    start: 1937
    end: 1945
    category: war
    tags: [中国, 日本]
    summary: 8年に及ぶ全面戦争。共産党が農村で力を伸ばし、戦後の内戦の帰趨を決めた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日中戦争

  - id: prc
    title: 中華人民共和国
    start: 1949
    ongoing: true
    category: politics
    tags: [中国, 現代]
    summary: 内戦に勝利した共産党が建国。1978年以降の改革開放で経済大国へ。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/中華人民共和国

  - id: great-leap-forward
    title: 大躍進
    start: 1958
    end: 1962
    category: economy
    tags: [中国, 現代]
    summary: 急激な工業化・集団化が大飢饉を招き、数千万人が犠牲になったとされる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大躍進政策

  - id: cultural-revolution
    title: 文化大革命
    start: 1966
    end: 1976
    category: society
    tags: [中国, 現代]
    summary: 権力闘争が全国的な動乱に発展し、教育と文化財が10年にわたって破壊された。
    links:
      - label: Wikipedia（文化大革命）
        url: https://ja.wikipedia.org/wiki/文化大革命

events:
  - id: battle-of-muye
    year: -1046
    title: 牧野の戦い
    category: war
    tags: [中国, 王朝交代]
    summary: 周が殷を倒し、「天命が革まる」という王朝交代の理屈がここから語られるようになった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/牧野の戦い
    related: [shang, zhou]

  - id: zhou-move-east
    year: -770
    title: 周の東遷
    category: politics
    tags: [中国]
    summary: 都を洛邑へ移して王室が弱体化し、諸侯が実力で競う春秋時代に入った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/春秋時代

  - id: confucius-born
    year: -551
    circa: true
    title: 孔子の生誕
    category: religion
    tags: [中国, 儒学]
    summary: 秩序をどう回復するかという問いへの答えが、2000年以上にわたり東アジアの規範になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/孔子

  - id: shang-yang-reform
    year: -356
    title: 商鞅の変法
    category: society
    tags: [中国, 法家]
    summary: 血筋でなく功績で人を遇する制度を秦に敷き、のちの統一の土台を作った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/商鞅

  - id: qin-unification
    year: -221
    title: 秦の始皇帝が中国を統一
    category: politics
    tags: [中国, 統一]
    summary: 戦国の争いを終わらせ、皇帝という称号と中央集権の型を作った。
    detail: |
      郡県制によって地方を直接支配し、文字・度量衡・車軌を統一した。
      統一の枠組みはその後2000年にわたり中国の標準であり続けた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/始皇帝
    related: [qin, shang-yang-reform]

  - id: burning-of-books
    year: -213
    title: 焚書坑儒
    category: society
    tags: [中国, 思想統制]
    summary: 思想の統一をはかって書物を焼き学者を弾圧。秦が短命に終わる一因ともされる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/焚書坑儒

  - id: chen-sheng-rebellion
    year: -209
    title: 陳勝・呉広の乱
    category: war
    tags: [中国, 反乱]
    summary: 農民が起こした中国史上初の大規模反乱。秦の崩壊を早めた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/陳勝・呉広の乱

  - id: battle-of-gaixia
    year: -202
    title: 垓下の戦い
    category: war
    tags: [中国]
    summary: 劉邦が項羽を破り、漢の400年が始まった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/垓下の戦い

  - id: emperor-wu
    year: -141
    title: 武帝の即位
    category: politics
    tags: [中国, 漢]
    summary: 匈奴への反攻と西域経営で版図を広げ、内には中央集権を強めた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/武帝_(漢)

  - id: confucianism-official
    year: -136
    title: 儒学が国の学問になる
    category: religion
    tags: [中国, 儒学]
    summary: 五経博士が置かれ、儒学が官僚を育てる正統の学問として定着した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/儒教

  - id: silk-road-zhang-qian
    year: -139
    title: 張騫の西域派遣
    category: economy
    tags: [中国, シルクロード]
    summary: 匈奴に対抗する同盟を探す旅が、結果的に東西交易路の情報をもたらした。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/張騫

  - id: cai-lun-paper
    year: 105
    title: 蔡倫が製紙法を改良
    category: science
    tags: [中国, 技術]
    summary: 安く大量に作れる紙が生まれ、記録と学問のあり方が変わった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/蔡倫

  - id: yellow-turban
    year: 184
    title: 黄巾の乱
    category: war
    tags: [中国, 宗教, 反乱]
    summary: 宗教結社による大反乱。鎮圧に動いた群雄が割拠し、後漢は有名無実になった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/黄巾の乱

  - id: han-end
    year: 220
    title: 後漢の滅亡と魏の成立
    category: politics
    tags: [中国, 王朝交代]
    summary: 400年の漢が終わり、統一が回復するまで約60年を要した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/魏_(三国)

  - id: jin-unifies
    year: 280
    title: 西晋が中国を統一
    category: politics
    tags: [中国, 統一]
    summary: 三国の分裂を終わらせたが、内紛と北方民族の進出で36年しか保たなかった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/西晋

  - id: northern-wei-unifies-north
    year: 439
    title: 北魏が華北を統一
    category: politics
    tags: [中国, 遊牧]
    summary: 鮮卑の王朝が華北をまとめ、漢化政策で南北の文化を橋渡しした。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/北魏

  - id: equal-field-system
    year: 485
    title: 均田制の施行
    category: society
    tags: [中国, 土地制度]
    summary: 国家が農民に土地を配る仕組み。隋唐へ受け継がれ、日本の班田収授にも影響した。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/均田制

  - id: sui-reunification
    year: 589
    title: 隋が中国を再統一
    category: politics
    tags: [中国, 統一]
    summary: 370年ぶりに南北がひとつになり、唐へ続く繁栄の前提ができた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/隋

  - id: grand-canal
    year: 605
    title: 大運河の建設開始
    category: economy
    tags: [中国, 土木]
    summary: 南の米を北の都へ運ぶ大動脈。国家を支えた一方、重い労役が隋を倒す原因にもなった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/京杭大運河

  - id: imperial-exam-start
    year: 587
    circa: true
    title: 科挙のはじまり
    category: society
    tags: [中国, 官僚制]
    summary: 試験で官僚を選ぶ制度。以後1300年、社会の上昇の道筋を決めた。
    detail: |
      隋の文帝が始めたとされるが、587年・598年など開始年には諸説あり、
      制度として整うのは唐代に入ってから。
    links:
      - label: Wikipedia（科挙）
        url: https://ja.wikipedia.org/wiki/科挙

  - id: xuanwu-gate
    year: 626
    title: 玄武門の変
    category: politics
    tags: [中国, 唐]
    summary: 兄弟を倒して即位した太宗のもとで、唐は「貞観の治」と呼ばれる安定期に入る。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/玄武門の変

  - id: xuanzang
    year: 629
    title: 玄奘のインド旅行
    category: religion
    tags: [中国, 仏教]
    summary: 17年かけて経典を持ち帰り、東アジアの仏教研究の水準を一段押し上げた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/玄奘

  - id: an-lushan
    year: 755
    title: 安史の乱
    category: war
    tags: [中国, 唐]
    summary: 8年に及ぶ大反乱で唐は衰退に向かい、律令的な支配が崩れた。
    links:
      - label: Wikipedia（安史の乱）
        url: https://ja.wikipedia.org/wiki/安史の乱

  - id: huang-chao
    year: 875
    title: 黄巣の乱
    category: war
    tags: [中国, 反乱]
    summary: 全土を巻き込む反乱で唐の支配は事実上終わり、貴族社会も崩れた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/黄巣の乱

  - id: tang-falls
    year: 907
    title: 唐の滅亡
    category: politics
    tags: [中国, 王朝交代]
    summary: 節度使が帝位を奪い、五代十国の分裂期に入った。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/唐

  - id: song-founded
    year: 960
