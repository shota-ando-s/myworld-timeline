        url: https://ja.wikipedia.org/wiki/唐

  - id: five-dynasties
    title: 五代十国
    start: 907
    end: 960
    category: war
    tags: [中国, 分裂]
    summary: 唐の滅亡から宋の統一までの半世紀。武人が次々と政権を奪い合った。
    detail: |
      唐の滅亡から宋の統一までの、およそ半世紀を指す時代区分。
      華北では後梁・後唐・後晋・後漢・後周の五つの王朝が次々に交代した。
      華中と華南、および華北の一部には十ほどの地方政権が並び立つ。
      907年から960年までを数えるのが普通だが、最後の政権が倒れる979年までとする見方もある。

      五代の皇帝は、いずれも節度使や親衛軍の長から出た武人だった。
      軍が皇帝を担ぎ、気に入らなければ次を立てるという交代が繰り返される。
      最も短い王朝は4年しか続かず、皇帝の権威は極端に軽くなった。
      936年には、後晋の建国者が契丹の助けを得る代償に燕雲十六州を譲っている。

      一方、南の諸国は戦乱が比較的少なく、経済が伸びた。
      呉越は水利を整え、南唐は文化を保護し、蜀では印刷が盛んになる。
      江南の開発が進み、経済の重心が南へ移る流れはこの時期に決定的になった。

      後周の世宗が軍と財政を立て直し、統一への道筋をつける。
      その死後、部下だった趙匡胤が擁立されて宋を建て、南の諸国を順に併せた。
      武人が権力を握り続けた反省から、宋は文官が軍を統制する体制をとる。
      燕雲十六州を失ったまま統一されたことが、宋が北方に対して弱い立場に置かれる原因になった。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/b/b9/History_of_China.png
      credit: 作者不明 / Copyrighted free use
      page: https://commons.wikimedia.org/wiki/File:History_of_China.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/五代十国時代

  - id: liao
    title: 遼（契丹）
    start: 916
    end: 1125
    category: politics
    tags: [中国, 征服王朝, 遊牧]
    summary: 契丹が華北の一部を含めて支配した王朝。宋から毎年の贈り物を受け取った。
    detail: |
      契丹の耶律氏が建てた王朝で、916年から1125年まで続いた。
      内モンゴルを中心に、現在の北京を含む華北の一部までを支配した。
      国号は契丹と遼のあいだで何度か入れ替わっている。
      中国の北辺を長く支配した最初の征服王朝である。

      耶律阿保機が諸部族をまとめて916年に皇帝を称し、渤海を滅ぼして東へ広がった。
      936年、後晋の建国を助けた見返りに燕雲十六州を手に入れ、農耕地帯と漢人の住民を抱える。
      ここから、遊牧民と農耕民を別の制度で治める二重統治が始まった。
      北面官が部族を、南面官が州県と漢人を担当し、皇帝は季節ごとに移動して双方を治める。

      1004年、南下した遼は宋と澶淵の盟を結んだ。
      宋が毎年、絹20万匹と銀10万両を贈る代わりに国境を現状のまま保つという内容である。
      以後120年にわたり大きな戦は起きず、交易と使節の往来が続いた。
      契丹文字が作られ、仏教が厚く保護されて多くの塔や寺が建てられている。

      12世紀に入ると、支配下にあった女真が反旗を翻した。
      1125年、金に攻められて滅び、一族の一部は中央アジアへ逃れて西遼を建てる。
      中央アジアからロシアにかけて、中国を指す呼び名としてキタイの語が残ったのは、この王朝の名に由来する。
      遊牧と農耕をひとつの政権が別々の仕組みで治めるやり方は、金・元・清へと受け継がれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/54/KhitanAD1000.png/500px-KhitanAD1000.png
      credit: Gabagool / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:KhitanAD1000.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/遼

  - id: song
    title: 宋
    start: 960
    end: 1279
    category: politics
    tags: [中国, 王朝]
    summary: 軍事では劣勢ながら、経済・技術・都市文化が飛躍的に発展した。
    detail: |
      960年から1279年まで続いた王朝で、趙匡胤が五代最後の後周から位を譲られて建てた。
      1127年に華北を金に奪われ、都を南の臨安（杭州）へ移す。
      それ以前を北宋、以後を南宋と呼び分ける。
      軍事では終始劣勢だったが、経済と文化では中国史の頂点に数えられる。

      五代の反省から、宋は武人の力を抑えて文官が軍を統べる体制をとった。
      科挙の合格者を大幅に増やし、皇帝自ら行う殿試を加えて、官僚を皇帝に直結させる。
      家柄ではなく試験で上がった士大夫が、政治と文化の担い手になった。
      一方で軍の指揮権は細かく分割され、対外戦争には弱い体質になる。

      農業では、早く実る占城稲の導入で江南の二期作が広がり、人口は1億に達した。
      石炭と鉄の生産が伸び、都市には夜まで開く市が立ち、紙幣の交子が流通する。
      火薬・羅針盤・活字印刷が実用化されたのもこの時代で、いずれも後の世界を変えた。
      開封や臨安は100万人規模の都市になり、商人と職人の生活が絵巻に描かれている。

      北では遼、西では西夏、のちには金と対峙し、贈り物で和平を買う外交を続けた。
      1127年の靖康の変で皇帝が連れ去られ、華北を失う。
      南宋は淮河を境に金と向かい合いながら、海上交易でさらに富を蓄えた。
      1279年、崖山の海戦でモンゴルに敗れて滅ぶ。
      朱熹が儒学を体系化した朱子学は、以後の東アジアの思想の標準になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/%E5%8C%97%E5%AE%8B%E7%96%86%E5%9F%9F%E5%9B%BE%EF%BC%88%E7%B9%81%EF%BC%89.png/500px-%E5%8C%97%E5%AE%8B%E7%96%86%E5%9F%9F%E5%9B%BE%EF%BC%88%E7%B9%81%EF%BC%89.png
      credit: 玖巧仔 / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:%E5%8C%97%E5%AE%8B%E7%96%86%E5%9F%9F%E5%9B%BE%EF%BC%88%E7%B9%81%EF%BC%89.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/宋_(王朝)

  - id: western-xia
    title: 西夏
    start: 1038
    end: 1227
    category: politics
    tags: [中国, 西域]
    summary: タングートが河西回廊に建てた国。独自の文字を作り、交易路を押さえた。
    detail: |
      タングートの李元昊が1038年に建てた王朝で、1227年まで続いた。
      現在の寧夏や甘粛にあたる、黄河の上流から河西回廊にかけてを支配した。
      国号は夏だが、中国の歴代の夏と区別して西夏と呼ばれる。

      タングートはチベット系の民族で、唐の時代からこの地域に住み、節度使の地位を得ていた。
      元昊は皇帝を名乗り、独自の年号と官制を定めて宋から自立する。
      漢字を参考にしながら、はるかに複雑な形の西夏文字を作らせた。
      仏典の翻訳が盛んに行われ、多くの経典が西夏文字で刊行されている。

      宋とは数年にわたり戦い、1044年に和議を結んだ。
      西夏が形の上で臣下の礼をとる代わりに、宋が毎年の贈り物を送るという内容である。
      東西交易の通り道である河西回廊を押さえたことが、この小国の財源になった。
      遼と宋という二つの大国のあいだで、双方と結びながら独立を保つ外交を続ける。

      1227年、モンゴルの攻撃を受けて滅んだ。
      チンギス・ハンはこの遠征の途上で没しており、抵抗の激しさから徹底した破壊が加えられたと伝えられる。
      王朝の記録も大半が失われ、正史も編まれなかった。
      西夏文字は長く読めない文字として残り、20世紀に黒水城で大量の文献が見つかって解読が進んだ。
      中国の王朝と遊牧勢力のあいだで、独自の文字と仏教文化を築いた国として再評価されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bc/China_rel96.jpg/500px-China_rel96.jpg
      credit: User:Wengier / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:China_rel96.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/西夏

  - id: jurchen-jin
    title: 金
    start: 1115
    end: 1234
    category: politics
    tags: [中国, 征服王朝]
    summary: 女真が遼と北宋を倒して華北を支配。モンゴルに滅ぼされた。
    detail: |
      女真の完顔氏が建てた王朝で、1115年から1234年まで続いた。
      満洲から出て遼と北宋を倒し、華北を支配した征服王朝である。
      都は初め東北の地に置かれ、のちに現在の北京にあたる中都へ移された。

      女真は遼の支配下にあり、毛皮や真珠の貢納を課されていた。
      完顔阿骨打が諸部族をまとめて1115年に皇帝を称し、遼への反乱を起こす。
      宋と結んで遼を挟み撃ちにし、1125年に遼を滅ぼした。
      その過程で宋軍の弱さを知り、そのまま南下する。
      1127年に開封を落として皇帝と上皇を北へ連れ去り、北宋を滅ぼした。
      南へ逃れた宋の残存勢力と戦い続けたが、1142年に淮河を境とする和議を結ぶ。
      南宋が臣下の礼をとり、毎年の銀と絹を贈るという内容だった。

      統治では、女真を猛安謀克という軍事と行政を兼ねた組織に編み、漢人は州県で治めた。
      女真文字を作り、科挙も実施して漢人の官僚を採用している。
      華北へ移住した女真の多くは次第に農耕と中国の生活様式に馴染んでいった。

      13世紀に入るとモンゴルの攻撃を受け、中都を捨てて開封へ都を移す。
      1234年、モンゴルと南宋の挟撃を受けて滅んだ。
      女真は17世紀に満洲と名を改め、清を建てて再び中国を支配する。
      二つの王朝が同じ民族から出ていることは、東アジア史の大きな筋の一つである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3b/%E5%8D%97%E5%AE%8B%E7%96%86%E5%9F%9F%E5%9B%BE%EF%BC%88%E7%B9%81%EF%BC%89.png/500px-%E5%8D%97%E5%AE%8B%E7%96%86%E5%9F%9F%E5%9B%BE%EF%BC%88%E7%B9%81%EF%BC%89.png
