  - id: zheng-he
    year: 1405
    title: 鄭和の南海遠征がはじまる
    category: economy
    tags: [中国, 航海]
    summary: 大艦隊が東南アジア・インド・アフリカ東岸まで到達。7回続いたのち中止された。
    detail: |
      永楽帝の命を受けた宦官の鄭和が、大艦隊を率いて南海へ出発した年。
      遠征は1433年まで7回にわたり、東南アジアからインド、アラビア、アフリカ東岸に達した。
      鄭和はイスラム教徒の家に生まれた雲南出身の人物である。

      第1回は62隻、2万7千人を超える規模だったと記録される。
      最大の宝船は全長100メートルを超えたと伝えられ、同時代のヨーロッパの船をはるかに上回る。
      羅針盤と海図、季節風の知識を用い、すでに確立していたアジアの海の道をたどった。

      目的は交易そのものよりも、明の威信を示して朝貢の関係を広げることにあった。
      各地の王に贈り物を与え、使節を明へ連れ帰り、従わない勢力には武力も用いている。
      セイロンやスマトラでは現地の争いに介入した。
      アフリカから連れ帰ったキリンは、めでたい獣として宮廷を沸かせている。

      永楽帝の死後、遠征は費用の重さと北方への備えを理由に中止された。
      航海の記録の多くは廃棄されたと伝えられ、詳細は失われている。
      国家の事業として始まり、国家の判断で終わったため、民間の海外進出にはつながらなかった。
      規模でも技術でも、ヨーロッパの大航海時代に半世紀以上先んじていた。
      それでも植民地も恒常的な航路も残さなかったことが、両者の違いとして論じられてきた。
      20世紀以降、この航海は海洋国家としての歴史を語る題材として、しばしば持ち出されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Zheng_He_statue_%28cropped%29.jpg/500px-Zheng_He_statue_%28cropped%29.jpg
      credit: 22Kartika / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Zheng_He_statue_(cropped).jpg
    links:
      - label: Wikipedia（鄭和）
        url: https://ja.wikipedia.org/wiki/鄭和

  - id: beijing-capital
    year: 1421
    title: 北京への遷都
    category: politics
    tags: [中国, 都]
    summary: 北方の防衛を優先して都を移し、紫禁城が政治の中心になった。
    detail: |
      明の永楽帝が、都を南京から北京へ移した年。
      新しい宮殿である紫禁城は1406年から15年をかけて築かれた。
      以後、北京は清と現代を通じて中国の政治の中心であり続ける。

      永楽帝は即位する前、燕王として北平を守っていた。
      自らの基盤がある土地であることに加え、北方の防衛を重く見たことが遷都の理由である。
      モンゴルの勢力はなお強く、南京から北辺を統制するのは難しかった。
      皇帝が国境の近くに座って自ら守るという形を選んだことになる。

      難点は食糧だった。
      北京周辺の生産では100万に迫る都の人口と軍を養えず、江南から運ぶ必要がある。
      そのために大運河が改修され、会通河が通じて南北の水運が回復した。
      毎年数百万石の米が、この水路を通って北へ運ばれることになる。

      紫禁城は、南北の軸線に沿って門と殿舎を並べる整然とした構成をとった。
      皇帝の日常と儀礼のすべてがこの空間に収まり、政治は外から見えにくくなる。
      南京は副都として残され、行政機構も二重に置かれた。
      都を北に置いた決定は、その後の中国の重心を決めている。
      経済の中心は江南のままで、政治の中心は北という分業がここで固定された。
      両者を結ぶ運河の維持は、以後の王朝にとって常に最重要の課題であり続ける。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bc/Beijing_montage_2019.png/500px-Beijing_montage_2019.png
      credit: Montage by ASDFGH (talk) and Foxy1219(talk), source image authors stated above / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Beijing_montage_2019.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/北京市

  - id: tumu-crisis
    year: 1449
    title: 土木の変
    category: war
    tags: [中国, モンゴル]
    summary: 皇帝がモンゴルの捕虜になる大敗。明は守勢に転じ、長城の増築を進めた。
    detail: |
      明の正統帝がオイラトの軍に大敗し、皇帝自身が捕虜になった事件。
      1449年9月1日、北京の北西にあたる土木堡で起きた。
      明が攻勢から守勢へ転じる分かれ目になった。

      オイラトのエセンは、朝貢という形をとった交易の拡大を求めていた。
      明が使節の人数と取引を制限したことで不満が募り、大軍で辺境へ侵入する。
      宦官の王振は皇帝に親征を勧め、わずか数日の準備で軍を発した。
      行軍は場当たり的で、補給も指揮も整わないまま進退を繰り返した。
      王振が自分の故郷への被害を避けようと進路を変えたとも伝えられる。
      水のない土木堡で野営したところを包囲され、明軍は総崩れになった。
      多数の高官が戦死し、皇帝は敵の陣に連れて行かれる。

      報せを受けた北京では遷都論が出たが、于謙が退けて防衛を主張した。
      皇帝の弟を新たに立てて交渉の材料を失わせ、城壁を固めて攻撃を凌ぐ。
      エセンは北京を落とせず、翌年に皇帝を無条件で送り返した。

      この敗北の後、明は北への遠征をやめ、長城を石とれんがで築き直す方針に切り替えた。
      現在観光地として知られる長城の多くは、この後に造られたものである。
      巨大な軍を持ちながら一日で崩れた経緯は、指揮と補給の重要さを示す例として語られてきた。
      宦官が軍事に関与することへの警戒も、この事件から繰り返し論じられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f1/Tumu_Crisis.jpg/500px-Tumu_Crisis.jpg
      credit: SY / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Tumu_Crisis.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/土木の変

  - id: macao-portugal
    year: 1557
    title: ポルトガル人のマカオ居住
    category: economy
    tags: [中国, 交易]
    summary: ヨーロッパがアジア交易に常駐する拠点を得て、銀が大量に中国へ流入し始めた。
    detail: |
      ポルトガル人が明の官憲の黙認を得て、マカオに居住を始めた年。
      ヨーロッパの勢力が中国の沿岸に常駐する拠点を持った最初の例である。
      以後400年以上、マカオはポルトガルの管理下に置かれた。

      ポルトガルは16世紀初めからインド洋と東南アジアに拠点を築き、中国との交易を求めていた。
      当初は海賊まがいの行動で明に拒まれたが、倭寇の討伐に協力するなどして関係を改める。
      1557年ごろから居住が認められ、地代を納める形で定着した。
      明は主権を手放したわけではなく、あくまで居住を許した扱いだった。

      マカオは、中国の生糸と絹を日本の銀と交換する中継地として繁栄する。
      当時の日本は世界有数の銀の産地で、明は民間貿易を禁じていたため、直接の取引ができなかった。
      ポルトガル船がそのあいだに入り、莫大な利益を上げる。
      アメリカ大陸の銀も、マニラを経由して中国へ流れ込んだ。

      大量の銀が入ったことで、明の経済は銀を基準に動くようになる。
      税を銀で一本化する一条鞭法は、この流入があって成立した。
      世界の銀が中国へ吸い込まれる構造は、16世紀から18世紀の世界経済の特徴になる。
      マカオはイエズス会の拠点にもなり、宣教師はここから中国内地へ入った。
      東アジアで最初の西洋式の大学もこの地に置かれている。
      1999年に中国へ返還され、ヨーロッパのアジア進出の最も長い一章が閉じた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/63/Flag_of_Macau.svg/500px-Flag_of_Macau.svg.png
      credit: see File history / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Macau.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マカオ

  - id: matteo-ricci
    year: 1582
    title: マテオ・リッチの来華
    category: religion
    tags: [中国, イエズス会]
    summary: 世界地図や暦法を伝え、中国とヨーロッパの学問が本格的に出会った。
    detail: |
      イエズス会の宣教師マテオ・リッチが、マカオに着いて中国での活動を始めた年。
      1552年にイタリアで生まれ、1610年に北京で没した。
      中国名を利瑪竇といい、ヨーロッパと中国の学問が本格的に出会う入り口を作った。

      リッチは、布教のためにはまず相手の文化を理解する必要があると考えた。
      中国語と古典を学び、初めは僧の姿をとったが、のちに士大夫の服を着て学者として振る舞う。
      儒学の教えとキリスト教は両立すると説き、祖先を祀る習慣も容認した。
      この方針は適応主義と呼ばれ、後世に大きな論争を呼ぶ。

      中国の知識人の関心を引いたのは、彼が持ち込んだ学問だった。
      世界地図の坤輿万国全図は、中国が世界の一部であることを目に見える形で示す。
      自鳴鐘やプリズム、天球儀が贈られ、日食の予測は暦の改定につながった。
      官僚の徐光啓と協力して『幾何原本』を訳し、ユークリッドの数学を漢文に移している。

      1601年に北京での居住を許され、宮廷にも出入りするようになった。
      『天主実義』を著して、キリスト教の教えを儒学の言葉で説明している。
      死後、皇帝から墓地を与えられたことは異例の扱いだった。
      ここから清の初めにかけて、宣教師が暦と天文を担う関係が続く。
      中国からはヨーロッパへ、科挙の制度や儒学の思想が伝えられ、啓蒙思想にも影響を与えた。
      祖先祭祀の是非をめぐる典礼論争がのちに決裂を招き、この交流は18世紀に細っていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/%E5%88%A9%E7%8E%9B%E7%AA%A6%E5%83%8F%EF%BC%8C%E6%B8%B8%E6%96%87%E8%BE%89%E7%BB%98.jpg/500px-%E5%88%A9%E7%8E%9B%E7%AA%A6%E5%83%8F%EF%BC%8C%E6%B8%B8%E6%96%87%E8%BE%89%E7%BB%98.jpg
      credit: Chinese brother Emmanuel Pereira (born Yu Wen-hui 游文辉) / Public domain
      page: https://commons.wikimedia.org/wiki/File:%E5%88%A9%E7%8E%9B%E7%AA%A6%E5%83%8F%EF%BC%8C%E6%B8%B8%E6%96%87%E8%BE%89%E7%BB%98.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/マテオ・リッチ

  - id: later-jin-founded
    year: 1616
    title: ヌルハチが後金を建てる
    category: politics
    tags: [中国, 満洲]
    summary: 女真の諸部族を統合し、20年余りのちに清と改称して明を圧迫した。
    detail: |
      ヌルハチが女真の諸部をまとめ、後金を建てた年。
      かつて華北を支配した金の後継を名乗ることで、明と対等の立場を主張した。
      20年後に国号を清と改め、やがて中国全土を支配することになる。

      女真は明の支配のもとで諸部に分かれ、交易の権利をめぐって争っていた。
      ヌルハチは1583年の挙兵から30年余りをかけて、建州と海西の諸部を統合する。
      人参や毛皮の交易で富を蓄え、それを兵と武具に変えた。

      1616年、ヌルハチはハンの位に就き、国号を金、年号を天命と定めた。
      支配の骨格となったのが、全住民を八つの旗に編成する八旗制である。
      旗は軍事・行政・生産を兼ねた単位で、戦えば軍団、平時は共同体として機能した。
      満洲語を書く文字も整えられ、命令と記録が文書で回るようになる。

      1618年、ヌルハチは明への七つの恨みを公にして挙兵した。
      翌年のサルフの戦いで明の大軍を各個撃破し、遼東の支配権を奪う。
      明は北東の防衛に巨費を投じることになり、財政と兵力を削られていった。
      女真が金の名を選んだことには、12世紀に華北を支配した記憶を呼び起こす意図があった。
      のちに漢人の反感を避けるため、国号は清に、民族の呼称は満洲に改められる。
      辺境の一集団が、わずか30年で明を倒す勢力に育った出発点がこの年である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/63/%E6%B8%85_%E4%BD%9A%E5%90%8D_%E3%80%8A%E6%B8%85%E5%A4%AA%E7%A5%96%E5%A4%A9%E5%91%BD%E7%9A%87%E5%B8%9D%E6%9C%9D%E6%9C%8D%E5%83%8F%E3%80%8B.jpg/500px-%E6%B8%85_%E4%BD%9A%E5%90%8D_%E3%80%8A%E6%B8%85%E5%A4%AA%E7%A5%96%E5%A4%A9%E5%91%BD%E7%9A%87%E5%B8%9D%E6%9C%9D%E6%9C%8D%E5%83%8F%E3%80%8B.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:%E6%B8%85_%E4%BD%9A%E5%90%8D_%E3%80%8A%E6%B8%85%E5%A4%AA%E7%A5%96%E5%A4%A9%E5%91%BD%E7%9A%87%E5%B8%9D%E6%9C%9D%E6%9C%8D%E5%83%8F%E3%80%8B.jpg
    links:
