lane: china

periods:
  - id: xia
    title: 夏
    start: -2070
    startCirca: true
    end: -1600
    endCirca: true
    category: politics
    tags: [中国, 王朝, 伝承]
    summary: 文献が伝える最初の王朝。実在をめぐっては二里頭遺跡との関係が議論されている。
    detail: |
      史書が伝える中国最初の王朝で、禹を始祖とし、殷・周と合わせて三代と呼ばれる。
      『史記』や『竹書紀年』は、禹から末代の桀まで17代がおよそ470年続いたと記す。
      ただし同時代の文字資料は見つかっておらず、年代も推定にとどまる。

      伝承では、黄河の氾濫を治めた功績で禹が舜から位を譲られ、その子の啓が後を継いだ。
      ここで、有徳の者に位を譲る禅譲から、血筋による世襲へ移ったとされる。
      末代の桀は酒池肉林におぼれる暴君として描かれ、殷の湯王に討たれる。
      この筋書きは、徳を失った王朝から天命が去るという後世の理屈に合わせて整えられている。

      考古学では、河南省の二里頭遺跡が夏の時代と重なる大規模な都市の跡として注目されてきた。
      宮殿の基壇や青銅の礼器、計画的な道路が出るが、王朝の名を記した文字は見つかっていない。
      中国の夏商周断代工程は前2070年ごろの成立という年代を示したが、その方法には国内外から批判がある。

      実在をどう考えるかは、今も決着していない。
      一方で、最初の王朝を語るこの枠組み自体が、以後の中国で王朝交代を説明する型になった。
      夏は、確かめられた事実としてよりも、歴史を書く出発点として効いている。
      漢字文化圏では「夏」は中国そのものを指す語にもなった。
      二里頭を夏と呼べるかどうかは、遺跡の年代と文献の年代をどうつなぐかにかかっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Xia_dynasty.svg/500px-Xia_dynasty.svg.png
      credit: w:en:User:Gurdjieff (Lamassu Design) / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Xia_dynasty.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/夏_(三代)

  - id: shang
    title: 殷（商）
    start: -1600
    startCirca: true
    end: -1046
    category: politics
    tags: [中国, 王朝]
    summary: 実在が確認できる最古の王朝。甲骨文字と青銅器で知られる。
    detail: |
      考古学的に実在が確かめられている最古の王朝で、前16世紀ごろから前1046年まで続いた。
      後期の都の跡が河南省安陽の殷墟で、大量の甲骨と王墓が見つかっている。
      自らは商と称し、殷は周の側からの呼び名だったとされる。

      王は占いによって物事を決めた。
      亀の甲や牛の肩甲骨に穴をあけて焼き、入った割れ目の形で吉凶を読み、その問いと結果を刻んだのが甲骨文字である。
      祭祀・戦争・狩り・収穫・天候から王の歯の痛みまでが占いの対象で、王は祖先の霊と交渉する祭司でもあった。
      政治と宗教は分かれておらず、王の権威は祖先祭祀を独占することから生まれていた。

      青銅器の鋳造は当時の世界でも群を抜く水準にあり、鼎や尊といった礼器が祖先の祭祀に使われた。
      大きな王墓には、殉葬された人や車馬が伴う。
      都は何度か移り、盤庚のときに殷（現在の安陽）へ落ち着いたと伝わる。
      周辺の部族とは交易と戦争を繰り返し、捕虜は労働力にも犠牲にも充てられた。

      前11世紀、帝辛（紂王）のときに周に敗れて滅びた。
      甲骨文字は現在の漢字に直接つながっており、漢字が3000年以上使われ続けていることの起点になっている。
      文献の伝承と遺跡・文字資料が一致した最初の例として、中国史の年代の土台にもなった。
      殷墟は20世紀初めに甲骨の出所をたどって見つかり、中国の近代考古学の出発点にもなった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Shang_dynasty.svg/500px-Shang_dynasty.svg.png
      credit: Lamassu Design Gurdjieff (talk) / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Shang_dynasty.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/殷

  - id: zhou
    title: 周
    start: -1046
    end: -256
    category: politics
    tags: [中国, 王朝]
    summary: 封建制と天命思想を打ち立てた長命な王朝。後半は諸侯が自立していく。
    detail: |
      殷を倒して立った王朝で、前1046年ごろから前256年まで名目上は続いた。
      前771年に都を東の洛邑へ移したことを境に、前半を西周、後半を東周と呼ぶ。
      東周の時期は春秋戦国時代と重なり、王室に実力はほとんど残っていない。

      周は一族や功臣に土地と人を与えて諸侯とし、王を頂点に親族の序列で結ぶ封建制を敷いた。
      身分と祭祀の決まりである礼と、本家と分家の序列を定める宗法が、この仕組みを支えた。
      殷を倒した正当性は、徳を失った王から天が命を革めたという天命の思想で説明された。
      王は天の子、すなわち天子と呼ばれるようになる。

      西周は異民族の犬戎に都の鎬京を落とされ、前770年に洛邑へ移る。
      以後の王は儀礼の中心として残るだけで、実力のある諸侯が覇者として号令した。
      前256年に秦に滅ぼされるまで、王室は小さな領地を保つにすぎなかった。

      天命の思想は、その後の王朝交代をすべて説明する理屈になった。
      孔子は周初を理想の秩序として仰ぎ、儒学の古典の多くが周の制度を題材にしている。
      実際の周そのものよりも、後世が整えた周の像が長く働き続けた。
      封建・礼・天命という三つの言葉は、いずれもこの王朝から出ている。
      王を頂点とする序列を血縁と儀礼で保つという発想は、のちの東アジアの国家にも形を変えて残った。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/d/dc/China_2a.jpg
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:China_2a.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/周

  - id: spring-autumn-warring
    title: 春秋戦国時代
    start: -770
    end: -221
    category: war
    tags: [中国, 分裂]
    summary: 諸侯が覇を競った分裂期。同時に諸子百家が生まれた思想の黄金期でもある。
    detail: |
      周が洛邑へ移ってから秦の統一までの約550年を指す時代区分。
      前半を春秋、後半を戦国と呼び、晋が韓・魏・趙に分かれた前453年、またはその三国が正式に諸侯と認められた前403年を境とすることが多い。
      名は歴史書『春秋』と、戦国の遊説を集めた『戦国策』に由来する。

      春秋には、弱った王に代わって諸侯を束ねる覇者が現れた。
      斉の桓公や晋の文公は、周王を立てて異民族を退けるという名分を掲げ、諸侯を集める会盟を主催した。
      当初200近くあった国は、戦いと併合を重ねて減っていく。
      戦いはまだ貴族の戦車戦が中心で、儀礼的な約束事も残っていた。

      戦国には秦・楚・斉・燕・趙・魏・韓の七雄が残り、それぞれ王を名乗って領域国家を築いた。
      鉄製の農具と牛耕で収穫が増え、城壁に囲まれた都市が交易で栄え、数万規模の歩兵と騎兵が動くようになる。
      各国は世襲の貴族を抑え、官僚と法によって人と土地を直接つかむ改革を競った。

      人材を求める君主と、仕官を望む知識人が出会い、儒家・道家・法家・墨家など諸子百家が生まれた。
      ここで交わされた統治・戦争・人間をめぐる議論は、東アジアの基本文献になっている。
      分裂と戦乱の時代が思想の最盛期でもあったことが、この時代を特別なものにしている。
      後世の中国は、分裂に陥るたびにこの時代を引き合いに出して統一の必要を語っている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/b/b9/History_of_China.png
      credit: 作者不明 / Copyrighted free use
      page: https://commons.wikimedia.org/wiki/File:History_of_China.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/春秋戦国時代

  - id: qin
    title: 秦
    start: -221
    end: -206
    category: politics
    tags: [中国, 王朝, 統一]
    summary: 初の統一王朝。郡県制・文字と度量衡の統一を短期間で断行した。
    detail: |
      中国を初めて統一した王朝。
      国そのものは周の時代から西方の辺境に続いていたが、統一から滅亡までは15年しかなかった。
      都は咸陽で、前221年に六国を滅ぼした王政が皇帝を名乗った。

      全国を郡と県に分け、中央が任命した官を置いて直接治めた。
      文字を小篆に統一し、度量衡・貨幣・車軸の幅まで揃えている。
      北では遊牧勢力に備えて各国の長城をつなぎ、南は嶺南まで兵を送って郡を置いた。
      商鞅以来の法家の方針をそのまま全土に広げたかたちである。

      一方で、宮殿・陵墓・長城・道路の工事に大量の民を動員し、法は細かく罰は重かった。
      思想を統一しようと、実用書以外の書物を焼き学者を罰する焚書坑儒も行われた。
      始皇帝が死んだ翌年の前209年に陳勝・呉広の乱が起き、各地の反乱が一気に広がる。
      宦官の趙高が政治を牛耳ったことも、崩壊を早めた。

      前206年、秦は劉邦に降って滅びた。
      短命に終わったものの、郡県制・法と文書による行政・統一された文字と度量衡は漢に引き継がれ、以後2000年の標準になった。
      中国を一つの単位として考える枠組みは、この15年のあいだに形になっている。
      後世の評価は厳しいが、漢はその制度のほとんどを受け継いでいる。
      秦の法や行政文書の実態は、近年出土した竹簡によって具体的に分かってきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ce/China_Qin_Dynasty.jpg/500px-China_Qin_Dynasty.jpg
      credit: Original uploader was Kallgan at zh.wikipedia / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:China_Qin_Dynasty.jpg
    links:
      - label: Wikipedia（秦）
        url: https://ja.wikipedia.org/wiki/秦

  - id: han
    title: 漢
    start: -202
    end: 220
    category: politics
    tags: [中国, 王朝]
    summary: 400年続いた大帝国。儒学の官学化とシルクロード交易が本格化した。
    detail: |
      秦に代わって400年余り続いた王朝で、前202年から後220年まで。
      前半の前漢は長安、後半の後漢は洛陽を都とし、あいだに王莽の新をはさむ。
      中国の王朝としては最初の長期政権であり、統治の型がここで固まった。

      劉邦は秦の郡県制を引き継ぎつつ、功臣や一族を諸侯王に封じる郡国制をとった。
      諸侯王の力が強すぎて呉楚七国の乱が起きると、以後は中央集権へ舵を切る。
      武帝の時代に匈奴へ反攻し、西域に手を伸ばし、朝鮮や南越にも郡を置いて版図を広げた。
      儒学を官学とし、塩と鉄を専売にして財源を押さえたのもこの時期である。

      外戚の王莽に奪われた後、劉氏の一族である光武帝が漢を再興した。
      後漢は西域経営と製紙の広まりで知られるが、幼い皇帝が続いて外戚と宦官が争い、政治が乱れる。
      184年の黄巾の乱をきっかけに各地の軍閥が自立し、220年に魏へ譲位して滅んだ。

      漢字・漢民族・漢文という語は、いずれもこの王朝の名に由来する。
      儒学を身につけた官僚が皇帝を助けて統治するという形は、以後2000年の標準になった。
      周辺の朝鮮・日本・ベトナムも、この時代の中国と接することで文字と制度を受け取っている。
      後漢の時代に紙が広まり、記録と学問の量そのものが変わったことも大きい。
      分裂の時代が来ても、人々は漢を統一の基準として思い出した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Han_Dynasty_206_BC_%E2%80%93_220.PNG/500px-Han_Dynasty_206_BC_%E2%80%93_220.PNG
      credit: 英語版ウィキペディアのArab Hafezさん. Later version(s) were uploaded by Beao, 英語版ウィキペディアのHistoriographerさん. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Han_Dynasty_206_BC_%E2%80%93_220.PNG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/漢

  - id: xin
    title: 新
    start: 9
    end: 23
    category: politics
    tags: [中国, 簒奪]
    summary: 王莽が漢を奪って立てた短命の王朝。復古的な改革が混乱を招き15年で倒れた。
    detail: |
      前漢の外戚だった王莽が、漢の皇帝から位を譲られて立てた王朝。
      西暦8年の末に幼い孺子嬰から禅譲を受け、23年まで15年続いた。
      国号は、王莽がかつて新都侯に封じられたことにちなむ。

      王莽は太后の甥として権力を握り、周公になぞらえられる名声を集めて位に就いた。
      目指したのは、儒学の古典が描く周の制度に戻すことだった。
      土地を国のものとして売買を禁じる王田制を敷き、奴婢の売買も止めさせる。
      塩・鉄・酒などを国が扱う五均六筦を定め、貨幣も何度も作り替えた。

      しかし制度は現実と噛み合わず、貨幣の改鋳は経済を混乱させ、土地の政策は数年で撤回された。
      匈奴や高句麗の君長の称号を格下げする高圧的な外交は、辺境での戦争を招く。
      そこへ黄河が流路を変える大氾濫が重なり、赤眉・緑林と呼ばれる集団が各地で蜂起した。
      23年、昆陽の戦いで大敗したのち長安が落ち、王莽は殺される。

      漢は劉氏の一族である光武帝によって再興され、後漢が始まった。
      禅譲という形式そのものは残り、魏以降の王朝交代の作法になっている。
      理想を掲げた改革が現実の手当てを欠いて崩れた例として、繰り返し引き合いに出される王朝である。
      王莽への評価は、位を奪った者とする見方と、時代に先んじた改革者とする見方に分かれている。
      後漢の史書が敵として描いたことが、その像を固めた面もある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/%E6%96%B0%E8%8E%BD%E6%97%B6%E6%9C%9F%E7%96%86%E5%9F%9F%E5%9B%BE%EF%BC%88%E7%B9%81%EF%BC%89.png/500px-%E6%96%B0%E8%8E%BD%E6%97%B6%E6%9C%9F%E7%96%86%E5%9F%9F%E5%9B%BE%EF%BC%88%E7%B9%81%EF%BC%89.png
      credit: 玖巧仔 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:%E6%96%B0%E8%8E%BD%E6%97%B6%E6%9C%9F%E7%96%86%E5%9F%9F%E5%9B%BE%EF%BC%88%E7%B9%81%EF%BC%89.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/新

  - id: three-kingdoms
    title: 三国時代
    start: 220
    end: 280
    category: war
    tags: [中国, 分裂]
    summary: 魏・呉・蜀が並び立った分裂期。以後およそ370年の混乱が続く。
    detail: |
      魏・蜀漢・呉の三つの国が並び立った時代。
      狭くは220年の後漢滅亡から、広くは184年の黄巾の乱から、280年の再統一までを指す。
      中国が長い分裂期に入る入り口にあたる。

      220年に曹丕が後漢から譲位を受けて魏を建てると、翌年に劉備が蜀漢を、229年に孫権が呉を称した。
      魏は華北を押さえて人口と生産力で他を圧し、蜀は四川の盆地、呉は長江の下流を本拠とする。
      蜀と呉は魏に対抗するため同盟を組んだが、荊州をめぐって争った時期もあった。

      蜀は諸葛亮が五度にわたり北伐を試みたものの、国力の差を埋められなかった。
      263年に魏に滅ぼされ、その魏も265年に司馬炎の晋に取って代わられる。
      280年、晋が呉を降して三国は終わった。

      長い戦乱で人口は激減し、戸籍に載る数は後漢の最盛期の一割ほどまで落ちている。
      官僚を家柄の評価で登用する九品官人法が始まり、門閥貴族が力を持つ下地になった。
      このあと中国は、隋の統一まで300年近く分裂が続く。
      一方で、この60年の物語は『三国志』と『三国志演義』を通じて東アジア中で読まれ、史実以上に大きな存在になった。
      戦乱で荒れた華北から人が南へ動き、長江流域の開発が進んだのもこの時期である。
      分裂が常態になったことで、統一を回復することが次の時代の課題になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Topographical_3K_gif.gif/500px-Topographical_3K_gif.gif
      credit: Qiushufang / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Topographical_3K_gif.gif
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/三国時代_(中国)

  - id: western-eastern-jin
    title: 晋（西晋・東晋）
    start: 265
    end: 420
    category: politics
    tags: [中国, 王朝]
    summary: 一時は中国を統一したが北方民族に華北を奪われ、江南へ逃れて命脈を保った。
    detail: |
      司馬炎が魏から譲位を受けて建てた王朝で、265年から420年まで続いた。
      280年に呉を滅ぼして中国を統一するが、316年に華北を失う。
      南へ逃れて建康を都とした317年以降を東晋と呼ぶ。

      司馬氏は魏の重臣として三代にわたり実権を握り、その延長で帝位を得た。
      統一後の朝廷は緊張を失い、貴族の贅沢と門閥の争いが目立つようになる。
      司馬炎が一族に兵権を与えて各地に封じたことが、やがて仇になった。
      291年から16年続く八王の乱で、諸王が互いに兵を動かして国力を使い果たす。

      内戦に周辺の諸民族が傭兵として引き込まれ、そのまま自立していった。
      311年に洛陽、316年に長安が匈奴系の勢力に落とされ、皇帝が捕らえられて西晋は滅ぶ。
      一族の司馬睿が建康で東晋を立て、王氏や謝氏といった貴族との共同統治で命脈を保った。
      383年の淝水の戦いでは、華北を統一した前秦の大軍を退けている。

      北伐は何度も試みられたが華北の回復には至らず、420年に武将の劉裕に位を譲って終わった。
      この間、華北の人々が大量に南へ移り、長江流域の開発が一気に進む。
      王羲之の書や陶淵明の詩など、貴族の文化が花開いたのもこの時代である。
      中国の重心が南へ移り始めた分かれ目として重要な王朝になった。
      門閥貴族が皇帝と並ぶ力を持つ体制は、南朝を通じて続いていく。
      晋の失敗は、統一のあとに何を備えるかという問いを後世に残した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9e/Western_Jeun_Dynasty_280_CE.png/500px-Western_Jeun_Dynasty_280_CE.png
      credit: Ian Kiu / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Western_Jeun_Dynasty_280_CE.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/晋_(王朝)

  - id: sixteen-kingdoms
    title: 五胡十六国
    start: 304
    end: 439
    category: war
    tags: [中国, 分裂, 遊牧]
    summary: 北方の諸民族が華北に次々と国を建てた130年余り。漢人の南遷が進んだ。
    detail: |
      西晋が崩れたあと、華北に諸民族の国が興亡した130年余りを指す時代区分。
      304年の匈奴系の漢（前趙）の建国から、439年の北魏による華北統一までを数える。
      五胡とは匈奴・鮮卑・羯・氐・羌の五つの民族を指す。
      十六国は北魏末の史官が数えた国の数で、実際にはそれ以上の政権が生まれては消えた。

      後漢のころから、北方の諸民族は辺境に移り住んで農耕や傭兵に従事していた。
      八王の乱で晋の諸王が彼らを兵として用いたことが、自立の機会を与える。
      304年に匈奴の劉淵が漢を称し、311年に洛陽、316年に長安を落として西晋を滅ぼした。

      以後、羯の石勒が建てた後趙、鮮卑の諸国、氐の苻堅の前秦などが交代で華北を支配する。
      前秦は376年にいったん華北を統一したが、383年の淝水の戦いで東晋に大敗して崩れた。
      386年に興った鮮卑拓跋氏の北魏が勢力を伸ばし、439年に華北をまとめる。
      国の寿命は短く、君主の死とともに分裂することが多かった。

      戦乱を避けて華北の人々が大量に長江の南へ移り、江南の開発が進んだ。
      北では諸民族と漢人が混じって暮らし、支配の仕組みも双方を組み合わせたものになる。
      仏図澄や鳩摩羅什が活動し、仏教が国家の保護のもとで広まったのもこの時代である。
      ここで進んだ民族と文化の混ざり合いが、隋と唐を担う人々を生んだ。
      十六国という数え方は後世の整理であり、実際に生まれた政権はそれより多い。
      この時代に華北へ入った人々の子孫が、のちの隋唐の皇室や有力者につながっていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/%E4%BA%94%E8%83%A1%E4%B8%80%E5%85%AD%E5%9B%BD.gif/500px-%E4%BA%94%E8%83%A1%E4%B8%80%E5%85%AD%E5%9B%BD.gif
      credit: Siucluster / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:%E4%BA%94%E8%83%A1%E4%B8%80%E5%85%AD%E5%9B%BD.gif
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/五胡十六国時代

  - id: northern-southern-dynasties
    title: 南北朝
    start: 439
    end: 589
    category: politics
    tags: [中国, 分裂]
    summary: 北の遊牧系王朝と南の漢人王朝が並立。仏教が社会の隅々まで広がった。
    detail: |
      北魏が華北を統一した439年から、隋が中国を再統一する589年までの150年。
      北に遊牧民の系譜を引く王朝、南に漢人の王朝が並び立った。
      南は宋・斉・梁・陳と交代し、いずれも建康を都とする。
      北は北魏が東西に割れ、北斉と北周へ移っていった。

      北朝では、北魏の孝文帝が都を洛陽へ移し、鮮卑の風習を改めて中国式の制度を採った。
      均田制と三長制で土地と戸口を把握し、税の基礎を整える。
      しかし北辺の守備にあたる六鎮の兵が不満を募らせ、その反乱から北魏は東西に分裂した。
      最後は北周が北斉を併せ、その外戚が隋を開く。

      南朝では、東晋に代わった劉裕の宋から四つの王朝が交代した。
      貴族が政治と文化を担い、詩文や書画が洗練される一方、皇帝の一族は争いを繰り返す。
      梁の武帝は仏教に深く帰依したが、侯景の乱で都は荒廃し、南の国力は大きく落ちた。
      北が軍事力を蓄えるあいだに、南は消耗していった。

      仏教は南北ともに社会の隅々まで広がった。
      北では雲崗や龍門に巨大な石窟が開かれ、南では都に数百の寺が建ったと詩に詠まれる。
      道教も教団としての形を整え、儒仏道が並び立つ構図がこの時代にできた。
      南北それぞれで育った制度と文化は、隋唐でひとつに合流することになる。
      南北の対立は、正統がどちらにあるのかという議論も生んだ。
      互いを蔑む呼び名を交わしながらも、使節の往来と交易は絶えていない。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Map_of_Northern_Wei_and_Liu_Song_Dynasty_ja.png/500px-Map_of_Northern_Wei_and_Liu_Song_Dynasty_ja.png
      credit: 日本語版ウィキペディアの俊武さん / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Map_of_Northern_Wei_and_Liu_Song_Dynasty_ja.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/南北朝時代_(中国)

  - id: sui
    title: 隋
    start: 581
    end: 618
    category: politics
    tags: [中国, 王朝]
    summary: 南北を再統一し、大運河と科挙という後世の土台を作って短命に終わった。
    detail: |
      300年近い分裂を終わらせた王朝で、581年から618年まで続いた。
      北周の外戚だった楊堅が譲位を受けて建て、589年に南朝の陳を滅ぼして統一した。
      都は大興城で、のちの長安にあたる。

      初代の文帝は、中央に三省六部を置き、地方は州と県の二段階に簡素化した。
      家柄で官位を決める九品官人法をやめ、試験によって人材を選ぶ道を開く。
      均田制と租庸調で土地と税を、府兵制で兵を確保し、開皇律令で法を整えた。
      戸籍を洗い直したことで人口は倍増し、倉には穀物が積み上がったと伝えられる。

      第2代の煬帝は、南北を結ぶ大運河を掘り、東都洛陽を造営し、長城を修築した。
      三度にわたる高句麗遠征は、いずれも大軍を投じて失敗する。
      工事と兵役が重なって民は疲れ果て、各地で反乱が起きた。
      618年、煬帝は江都で近衛の兵に殺され、隋は37年で滅んだ。

      短命だったが、作った制度はほとんどそのまま唐に引き継がれた。
      運河は以後1000年の経済の背骨になり、科挙は1300年続く。
      統一の枠組みを作って自らは倒れたという点で、秦としばしば並べて語られる。
      唐の繁栄は、隋が整えた土台の上に乗っている。
      大興城は当時の世界で最大級の計画都市で、そのまま唐の長安になった。
      日本の平城京や平安京の設計も、この都の形を参考にしている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Sui_Dynasty.png/500px-Sui_Dynasty.png
      credit: SY / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Sui_Dynasty.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/隋

  - id: tang
    title: 唐
    start: 618
    end: 907
    category: politics
    tags: [中国, 王朝]
    summary: 長安を中心とする国際帝国。日本を含む東アジア全体の手本となった。
    detail: |
      隋に代わって618年から907年まで続いた王朝で、都は長安。
      李淵が隋末の混乱のなかで挙兵して建て、第2代の太宗の代に国内を平定した。
      最盛期には中央アジアの草原やオアシス都市まで支配下に入れ、当時の世界で有数の大帝国になった。
      東アジアの国々が制度と文化の手本としたのもこの王朝である。

      統治の骨組みは隋から受け継いだ。
      中央に三省六部を置き、地方を州と県で治め、律令によって法と行政を定める。
      農民に土地を配る均田制、穀物と布と労役を納める租庸調、農民が交代で兵役に就く府兵制が組み合わされた。
      官僚は科挙で選ばれ、詩文の能力が出世の条件になる。

      長安は100万人を数える国際都市で、ソグド人やペルシア人の商人、各国の使節と留学生が集まった。
      景教・マニ教・ゾロアスター教の寺も建ち、仏教は玄奘の翻訳によって教学の水準を大きく上げる。
      李白と杜甫を生んだ詩は、中国文学の頂点とされてきた。
      日本からは遣唐使が送られ、律令・都の形・文字・仏教を持ち帰っている。

      755年の安史の乱を境に、唐の性格は変わった。
      均田制と府兵制が崩れ、土地の保有に応じて課税する両税法へ移り、地方は節度使が握る。
      875年に始まる黄巣の乱で全土が荒れ、907年に節度使の朱全忠に帝位を奪われた。
      前半の国際的な開かれた帝国と、後半の分権化した国家という二つの顔をあわせ持つ王朝である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/%E5%94%90%E7%96%86%E5%8F%98%E8%BF%81.gif/500px-%E5%94%90%E7%96%86%E5%8F%98%E8%BF%81.gif
      credit: 玖巧仔 / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:%E5%94%90%E7%96%86%E5%8F%98%E8%BF%81.gif
    links:
