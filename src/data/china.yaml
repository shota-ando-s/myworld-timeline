        url: https://ja.wikipedia.org/wiki/ニクソン大統領の中国訪問

  - id: reform-opening
    year: 1978
    title: 改革開放
    category: economy
    tags: [中国, 現代]
    summary: 鄧小平のもとで市場経済を導入し、世界の工場へと変わっていった。
    detail: |
      1978年12月の党の会議を起点に始まった、経済の自由化と対外開放の政策。
      鄧小平の主導で、計画経済から市場を活用する体制への転換が進められた。
      以後40年余りの中国の姿を決めた転換点である。

      最初に変わったのは農村だった。
      人民公社を解体し、世帯ごとに土地の使用と生産を請け負わせる方式に改める。
      割り当てを超えた分を自由に処分できるようにしたところ、生産量は数年で大きく伸びた。
      農村の余剰労働力は郷鎮企業に吸収され、軽工業の担い手になる。

      対外的には、1980年に深圳・珠海・汕頭・厦門が経済特区に指定された。
      税の優遇と簡素な手続きで外国資本を呼び込み、輸出向けの生産を集める。
      香港と台湾の企業がまず進出し、技術と経営の手法を持ち込んだ。
      価格も、計画価格と市場価格を併存させながら段階的に自由化されていく。

      1989年の天安門事件で改革は一時停滞するが、1992年の南巡講話で加速した。
      翌年には社会主義市場経済という表現が公式に採用される。
      国有企業の整理と株式市場の整備が進み、2001年のWTO加盟で世界の生産網に組み込まれた。
      40年でGDPは数十倍になり、数億人が貧困から抜け出した。
      同時に、都市と農村の格差、環境汚染、地方政府の債務という問題も蓄積している。
      共産党の指導を保ったまま市場経済を導入するという設計は、他国にも参照されてきた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/改革開放

  - id: tiananmen
    year: 1989
    title: 天安門事件
    category: society
    tags: [中国, 現代]
    summary: 民主化を求める運動が武力で鎮圧され、経済の自由化と政治の統制が並ぶ路線が固まった。
    detail: |
      民主化を求める学生と市民の運動が、軍によって鎮圧された事件。
      1989年6月4日未明、北京の天安門広場とその周辺で武力行使が行われた。
      中国の現代史で最も論争の多い出来事の一つである。

      発端は、改革に理解を示していた胡耀邦が4月に急死したことだった。
      追悼から始まった集会は、腐敗の批判と政治改革の要求へ広がる。
      5月には学生がハンガーストライキに入り、広場には百万人規模の人が集まった。
      訪中していたソ連のゴルバチョフを迎える行事が変更され、世界の報道陣がその様子を伝える。

      党の指導部は割れた。
      対話を求めた総書記の趙紫陽は退けられ、5月20日に戒厳令が敷かれる。
      6月3日の夜から軍が市内に進入し、装甲車と実弾で広場への道を開いた。
      死者の数は公表されておらず、数百から数千まで推計に幅がある。

      事件後、趙紫陽は失脚して軟禁のまま生涯を終えた。
      西側諸国は制裁を課し、中国は一時的に国際的な孤立に陥る。
      江沢民が新たな総書記となり、政治の統制は強められた。
      一方で、経済の自由化は1992年から再び加速する。
      経済は開き、政治は締めるという組み合わせが、この事件を経て固まった。
      中国国内では公の議論が厳しく制限されており、記憶の扱い自体が論点であり続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Tiananmen_Square%2C_Beijing%2C_China_1988_%281%29.jpg/500px-Tiananmen_Square%2C_Beijing%2C_China_1988_%281%29.jpg
      credit: Derzsi Elekes Andor / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Tiananmen_Square,_Beijing,_China_1988_(1).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/六四天安門事件

  - id: wto-accession
    year: 2001
    title: WTO加盟
    category: economy
    tags: [中国, 世界経済]
    summary: 世界の生産と貿易の中心に組み込まれ、以後20年の高成長につながった。
    detail: |
      中国が世界貿易機関に加盟した出来事で、2001年12月に正式なメンバーとなった。
      交渉は前身のガットの時代から15年に及んだ。
      中国が世界の貿易体制に完全に組み込まれる節目になった。

      加盟には、関税の大幅な引き下げと市場の開放が条件として課された。
      農産物や自動車の保護は減り、金融や流通の分野にも外国企業が入る。
      国内では、国有企業や農業が打撃を受けるという懸念が強かった。

      実際に起きたのは、輸出の爆発的な増加だった。
      加盟から10年で輸出額は5倍を超え、中国は世界最大の輸出国になる。
      海外からの直接投資が沿海部に集中し、電子機器から衣料まで、あらゆる工業製品の生産拠点が築かれた。
      世界の工場という呼び名が定着したのもこの時期である。

      世界の側も大きく変わった。
      安価な製品が各国の物価を押し下げる一方、先進国の製造業では雇用が失われた。
      この変化は、2010年代の保護主義と米中の対立の背景になっていく。
      中国国内では、数億人が農村から沿海の工場へ移り、都市化が一気に進んだ。
      所得は上がったが、地域の格差と環境の悪化も同時に深刻になる。
      世界経済への参加を選んだこの決定が、その後20年の高成長を支えた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/WTO_Logo.svg/500px-WTO_Logo.svg.png
      credit: World Trade Organization / Public domain
      page: https://commons.wikimedia.org/wiki/File:WTO_Logo.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/世界貿易機関
