        url: https://ja.wikipedia.org/wiki/西晋

  - id: northern-wei-unifies-north
    year: 439
    title: 北魏が華北を統一
    category: politics
    tags: [中国, 遊牧]
    summary: 鮮卑の王朝が華北をまとめ、漢化政策で南北の文化を橋渡しした。
    detail: |
      鮮卑の拓跋氏が建てた北魏が、北涼を滅ぼして華北をまとめた年。
      これにより五胡十六国の分裂が終わり、南北朝の時代に入る。
      治めていたのは第3代の太武帝である。

      北魏は386年に拓跋珪が建国し、398年に平城（現在の大同）を都とした。
      北の柔然を討って背後を固めつつ、夏・北燕・北涼を次々に併合していく。
      騎兵の機動力に加え、漢人の官僚を用いて税と行政を整えたことが力になった。

      統一後は、崔浩ら漢人の名族を登用して国家の仕組みを作り替えた。
      一方で太武帝は道教を国の教えとし、446年には寺を壊し僧を殺す廃仏を行っている。
      この弾圧は数年で終わり、次の代には雲崗石窟の造営という形で仏教が復活した。
      485年からは均田制と三長制が始まり、農民に土地を配って戸口を把握する仕組みが整う。

      華北が一つの政権のもとに戻ったことで、南朝と向かい合う南北朝の構図ができた。
      遊牧民の王朝が中国式の統治を採り入れる過程は、この後の孝文帝の改革で頂点に達する。
      均田制と府兵の仕組みは、そのまま隋と唐へ受け継がれた。
      北方民族が中国を治めるという経験は、遼・金・元・清へ続く長い系譜の始まりでもある。
      華北の統一は、南朝との長い対峙の始まりでもあった。
      都の平城に開かれた雲崗石窟は、国家と仏教が結びついたこの時代を今に伝えている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Map_of_Northern_Wei_and_Liu_Song_Dynasty_ja.png/500px-Map_of_Northern_Wei_and_Liu_Song_Dynasty_ja.png
      credit: 日本語版ウィキペディアの俊武さん / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Map_of_Northern_Wei_and_Liu_Song_Dynasty_ja.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/北魏

  - id: equal-field-system
    year: 485
    title: 均田制の施行
    category: society
    tags: [中国, 土地制度]
    summary: 国家が農民に土地を配る仕組み。隋唐へ受け継がれ、日本の班田収授にも影響した。
    detail: |
      国家が農民に土地を割り当て、一定の年齢で返させる制度。
      北魏が485年に始め、隋と唐に受け継がれた。
      戦乱で荒れ地と流民が増え、豪族が人と土地を抱え込んでいた状況への対策である。

      成年男子には穀物を作る露田と麻や桑を植える田が、女子にもそれより少ない面積が与えられた。
      露田は死亡や老齢で国に返すが、桑田のように世襲できる区分もある。
      奴婢や耕牛の数に応じて追加の支給もあり、豪族に配慮した部分も残った。
      翌486年の三長制で村の組織を整え、隠れていた戸口を洗い出している。

      土地の支給と引き換えに、穀物と布を納め労役に就く義務が課された。
      この組み合わせが隋唐の租庸調となり、兵を出す府兵制とも結びつく。
      日本の班田収授の法や、朝鮮半島の田制も、この考え方を受けて作られた。
      国家が人と土地を直接つかむという発想が、東アジアに広く共有された。

      人口が増えて配る土地が足りなくなり、貴族や寺院の大土地所有も進んで、制度は崩れていく。
      唐では780年の両税法によって、土地の支給を前提としない課税へ移った。
      それでも、土地を均しく配るという理念は後世も繰り返し持ち出されている。
      宋代の議論から近代の土地改革まで、この言葉は理想として生き続けた。
      実際にどこまで均等に配られたかは、地域によって差が大きかった。
      敦煌やトルファンで見つかった文書から、唐代の運用の細かな実態が分かってきている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/均田制

  - id: sui-reunification
    year: 589
    title: 隋が中国を再統一
    category: politics
    tags: [中国, 統一]
    summary: 370年ぶりに南北がひとつになり、唐へ続く繁栄の前提ができた。
    detail: |
      隋が南朝の陳を滅ぼし、中国が再び一つになった年。
      西晋が華北を失って以来、およそ270年ぶり、三国の分裂から数えれば370年ぶりの統一だった。
      実行したのは初代の文帝である。

      準備は入念だった。
      北の突厥を外交で分断して背後を固め、長江の上流で軍船を建造する。
      陳では後主が詩と宴にふけり、政治が乱れて人心が離れていた。
      588年末、晋王楊広を総大将として50万を超える兵が八方面から長江へ向かう。

      翌589年、隋軍は長江を渡って建康を落とした。
      後主は井戸に隠れているところを引き出されて捕らえられ、陳は滅んだ。
      江南では翌年に反乱が起きたが、楊素らが鎮めている。
      隋は南の貴族を都に移し、制度を全土で揃えていった。

      これ以後、中国は唐を通じて300年以上の統一期に入る。
      南北で別々に育った制度・文化・信仰が一つに合わさり、唐の国際的な性格の下地になった。
      北の軍事力と南の経済力を一つの政権が握ったことの意味も大きい。
      南北を結ぶ大運河は、この統一を物理的に支えるために掘られた。
      陳の宮廷で流行した詩は、後世に亡国の音として引き合いに出された。
      統一の直後に大運河が掘られたのは、南北を実際につなぎ直す必要があったからである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Sui_Dynasty.png/500px-Sui_Dynasty.png
      credit: SY / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Sui_Dynasty.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/隋

  - id: grand-canal
    year: 605
    title: 大運河の建設開始
    category: economy
    tags: [中国, 土木]
    summary: 南の米を北の都へ運ぶ大動脈。国家を支えた一方、重い労役が隋を倒す原因にもなった。
    detail: |
      隋の煬帝が605年に着工した、南北を結ぶ運河網。
      通済渠・永済渠・江南河などを順に掘り、610年ごろにつながった。
      総延長は2000キロを超え、黄河と長江を横切る。
      戦国時代から各地にあった水路をつなぎ直したものでもある。

      目的は、江南の米を北へ運ぶことだった。
      長い戦乱で華北の生産力は落ち、人口と軍は北、食糧の余剰は南という不均衡が生じていた。
      陸路で大量の穀物を運ぶのは費用がかかりすぎる。
      水運であれば、同じ人手で何十倍もの荷を動かせた。

      工事にはのべ数百万が動員され、一度に100万人規模で徴発された区間もある。
      運河沿いには離宮が建てられ、煬帝は豪華な船団で江都へ下った。
      重い労役は各地の反乱を招き、隋が倒れる原因の一つになる。

      それでも運河は残り、唐と宋の経済を支える背骨になった。
      都の食糧も、塩や絹の税も、この水路を通って運ばれる。
      元代には北京へまっすぐ向かう形に改修され、京杭大運河として現在まで使われている。
      南の生産力と北の政治的中心を結びつける構造は、以後の中国の基本形になった。
      運河の結節点にあたる揚州や開封は、交易の拠点として大きく栄えた。
      一本の水路が、王朝の食糧・税・軍の動きを同時に左右するようになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cb/Modern_Course_of_Grand_Canal_of_China.png/500px-Modern_Course_of_Grand_Canal_of_China.png
      credit: Ian Kiu / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:Modern_Course_of_Grand_Canal_of_China.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/京杭大運河

  - id: imperial-exam-start
    year: 587
    circa: true
    title: 科挙のはじまり
    category: society
    tags: [中国, 官僚制]
    summary: 試験で官僚を選ぶ制度。以後1300年、社会の上昇の道筋を決めた。
    detail: |
      試験の成績によって官僚を選ぶ制度の始まり。
      隋の文帝が587年に各州から人材を推挙させ、試験を課したのが起点とされる。
      598年に科目を定めたときを始まりとする見方もあり、開始年には諸説ある。
      制度として整うのは唐に入ってからである。

      それまでは九品官人法が用いられ、地方の評価を通じて家柄が官位をほぼ決めていた。
      上級の官職は門閥貴族が世襲的に占め、皇帝が自由に人を選べない状態が続く。
      試験による選抜は、その門閥を抑えて皇帝直属の官僚を確保するための手段だった。

      唐では詩文を課す進士科が重んじられ、合格は大変な名誉とされた。
      宋代に皇帝自ら行う殿試が加わり、受験者の名を隠す糊名や、筆跡を写し替える謄録で公正さを高める。
      明清には八股文という決まった形式の答案が求められ、内容は朱子学の解釈に縛られた。
      試験は地方から中央まで何段階もあり、合格までに数十年かかることも珍しくない。

      科挙は1300年続き、1905年に廃止された。
      朝鮮やベトナムもこれを採り入れたが、日本では定着しなかった。
      家柄ではなく学力で身を立てられるという道は、社会の流動性と人々の価値観を長く規定した。
      勉強して試験に受かることを重んじる東アジアの気風は、この制度に由来している。
      合格者の名簿に名が載ることは、一族全体の地位を変える出来事だった。
      一方で、受からなかった膨大な人々の不満が、王朝末期には反乱の力になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/Civilserviceexam1.jpg/500px-Civilserviceexam1.jpg
      credit: 仇英 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Civilserviceexam1.jpg
    links:
      - label: Wikipedia（科挙）
        url: https://ja.wikipedia.org/wiki/科挙

  - id: xuanwu-gate
    year: 626
    title: 玄武門の変
    category: politics
    tags: [中国, 唐]
    summary: 兄弟を倒して即位した太宗のもとで、唐は「貞観の治」と呼ばれる安定期に入る。
    detail: |
      唐の李世民が、長安の宮城の北門である玄武門で兄弟を討ったクーデター。
      626年7月2日の出来事で、犠牲になったのは皇太子の李建成と弟の李元吉だった。
      直後に父の高祖李淵は李世民を皇太子に立て、その年のうちに位を譲る。

      建国の戦いで軍功を重ねたのは次男の世民だったが、皇太子の座は長男の建成にあった。
      功績と序列が食い違ったまま、両者は宮廷で味方を集めて対立を深める。
      世民は先手を取って、兄が謀反を企てていると父に訴え、翌朝の参内を待ち伏せた。
      門に伏せていた部隊が二人を射殺し、続いて東宮の兵を鎮圧する。

      この直後に李淵は実権を失い、太上皇として退いた。
      即位した太宗は、兄弟の一族を殺す一方で、建成に仕えていた魏徴らを許して登用している。
      有能であれば敵方の人物でも用いるという姿勢が、以後の政治の色になった。

      中国の皇位継承では、長子が継ぐ建前と実力のある者が取る現実が繰り返しぶつかった。
      玄武門の変は、その典型として後世に引かれる事件である。
      唐ではこの後も、皇太子の廃立や宮廷での武力行使が繰り返された。
      史書が太宗の側から書かれているため、事件の経緯には潤色があるとも指摘されている。
      結果として生まれた治世が名高いだけに、手段の評価は今も割れている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/%E3%80%8A%E9%9A%8B%E5%94%90%E6%BC%94%E4%B9%89%E3%80%8B%E5%B0%8F%E8%AF%B4%E4%B8%AD%E6%89%80%E7%94%BB%E7%9A%84%E7%8E%84%E6%AD%A6%E9%97%A8%E4%B9%8B%E5%8F%98.jpg/500px-%E3%80%8A%E9%9A%8B%E5%94%90%E6%BC%94%E4%B9%89%E3%80%8B%E5%B0%8F%E8%AF%B4%E4%B8%AD%E6%89%80%E7%94%BB%E7%9A%84%E7%8E%84%E6%AD%A6%E9%97%A8%E4%B9%8B%E5%8F%98.jpg
      credit: （清）褚人獲彙（編）；《古本小說集成》編委員 / Public domain
