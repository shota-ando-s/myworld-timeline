  - id: taiwan-annexed
    year: 1683
    title: 清が台湾を版図に入れる
    category: war
    tags: [中国, 台湾]
    summary: 明の遺臣が拠っていた台湾を平定し、清の支配が海にも及んだ。
    detail: |
      清が台湾に拠っていた鄭氏の政権を降し、版図に組み入れた年。
      これによって明の残存勢力は完全に消え、清の支配が海にまで及んだ。
      台湾が中国の王朝の行政区画に入った最初の例でもある。

      台湾には17世紀前半からオランダが拠点を築いていた。
      明の遺臣である鄭成功が1662年にオランダを追い出し、大陸反攻の基地とする。
      鄭氏は三代にわたって明の年号を用い、清に服さなかった。
      清は沿岸の住民を内陸へ移す遷界令で兵糧を断とうとしたが、決着はつかない。

      1683年、降将の施琅が水軍を率いて澎湖諸島で鄭氏の艦隊を破った。
      海上の防衛線を失った鄭克塽は降伏し、22年続いた政権は終わる。
      清の朝廷では、台湾を放棄すべきだという意見も強かった。
      施琅が海防上の重要性を説いて存続が決まり、福建省の下に台湾府が置かれた。

      以後、福建や広東から多くの漢人が海を渡って移住し、開拓が進む。
      先住民との摩擦や移民どうしの争いが絶えず、反乱も繰り返された。
      1885年には独立した省に昇格するが、10年後の日清戦争で日本に割譲される。
      清にとってこの平定は、内戦の終結を意味した。
      海上勢力を版図に取り込んだことで、沿岸の交易統制も現実的になる。
      台湾の帰属をめぐる議論は、この年の決定を出発点として現在まで続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/Flag_of_China_%281889%E2%80%931912%29.svg/500px-Flag_of_China_%281889%E2%80%931912%29.svg.png
