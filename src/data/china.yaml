        url: https://ja.wikipedia.org/wiki/安史の乱

  - id: huang-chao
    year: 875
    title: 黄巣の乱
    category: war
    tags: [中国, 反乱]
    summary: 全土を巻き込む反乱で唐の支配は事実上終わり、貴族社会も崩れた。
    detail: |
      唐の末に全土へ広がった大反乱。
      874年に王仙芝が挙兵し、翌875年に塩の密売人だった黄巣が加わって一大勢力になった。
      884年に黄巣が死ぬまで、およそ10年続く。

      背景には、塩の専売による重税と、たび重なる凶作があった。
      黄巣は科挙に何度も落ちた人物と伝えられ、不満を抱えた層の代弁者となる。
      反乱軍は一か所に拠らず、華北から江南、さらに広州まで移動しながら戦った。
      広州では外国人商人が多数殺されたとアラビア語の記録が伝えている。

      880年、黄巣は洛陽に続いて長安を落とし、大斉を称して皇帝の位に就いた。
      唐の皇帝は蜀へ逃れ、各地の節度使と沙陀族の援軍に頼って反撃する。
      883年に長安を追われた黄巣は、翌年に敗れて死んだ。

      反乱は鎮まったが、唐の支配はすでに回復できない状態になっていた。
      各地の節度使は自立し、中央の命令は届かない。
      長安と洛陽が荒廃したことで、代々の名門貴族が拠って立つ基盤も失われた。
      家柄の力が消え、以後の中国では科挙で選ばれた官僚が社会の上層を占めるようになる。
      黄巣の部下から唐に降った朱全忠が、907年に唐を滅ぼすことになる。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/黄巣の乱

  - id: tang-falls
    year: 907
    title: 唐の滅亡
    category: politics
    tags: [中国, 王朝交代]
    summary: 節度使が帝位を奪い、五代十国の分裂期に入った。
    detail: |
      節度使の朱全忠が唐の哀帝から位を譲られ、290年続いた唐が滅んだ年。
      新しい王朝は後梁と呼ばれ、都は開封に置かれた。
      ここから五代十国の分裂期に入る。

      朱全忠はもともと黄巣の乱で反乱側にいたが、唐に降って節度使となった人物である。
      乱の鎮圧で力をつけ、各地の節度使を破って華北を手中にした。
      904年には皇帝を長安から自らの本拠に近い洛陽へ移し、宦官と旧臣を大量に殺している。
      名門の高官を黄河に投げ込んだと伝えられ、唐を支えた貴族層はここで途絶えた。

      907年、哀帝から禅譲の形で位を受け取り、唐は正式に終わる。
      哀帝はまもなく毒殺された。
      各地の節度使はこれを認めず、それぞれの地で王を称して自立する。

      唐の滅亡は、単なる王朝の交代にとどまらなかった。
      貴族が政治と文化を担う体制が終わり、科挙官僚と地方の地主が社会の中心になる。
      東アジアでも、唐を手本にしてきた国々が独自の道を探り始めた。
      日本が遣唐使を止めたのは894年で、その終わりは唐の衰えと重なっている。
      中国史を古代と近世に分ける境目として、この前後を重く見る立場は根強い。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/%E5%94%90%E7%96%86%E5%8F%98%E8%BF%81.gif/500px-%E5%94%90%E7%96%86%E5%8F%98%E8%BF%81.gif
      credit: 玖巧仔 / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:%E5%94%90%E7%96%86%E5%8F%98%E8%BF%81.gif
