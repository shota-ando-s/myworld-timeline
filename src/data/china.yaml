  - id: song-founded
    year: 960
    title: 趙匡胤が宋を建てる
    category: politics
    tags: [中国, 王朝]
    summary: 武人の力を抑えて文官が政治を担う体制へ切り替え、以後の中国の型になった。
    detail: |
      後周の武将だった趙匡胤が、部下に擁立されて宋を建てた出来事。
      出先の陳橋駅で起きたため、陳橋の変とも呼ばれる。
      五代十国の武人政権が続いた半世紀に、ここで区切りがついた。

      後周では、英主とされた世宗が統一の足がかりを作った直後に没していた。
      跡を継いだのは7歳の幼帝で、軍の実力者が動けば政権は保たない状態だった。
      960年の正月、契丹が攻めてくるという報せを受けて北へ向かった軍が、途中で趙匡胤を推戴する。
      目を覚ました趙匡胤に部下が黄色い衣を着せた、という筋立てで史書は伝える。

      軍は都へ戻り、幼帝から譲位を受ける形で新しい王朝が始まった。
      都の略奪を禁じ、前王朝の皇族と旧臣を殺さなかったことが、支持を広げている。
      それまで数年おきに王朝が代わっていた華北で、この交代は流血の少ないものだった。
      新しい政権が最初に取り組んだのは、自らと同じことを起こさせない仕組み作りである。
      将軍から兵権を取り上げ、文官が軍と地方を管理する体制に切り替えた。
      科挙の合格者を増やして、皇帝に直結する官僚の層を厚くする。

      この選択によって、中国では軍人の政権奪取が例外的な出来事になった。
      一方で、軍事力の低下は遼・西夏・金との関係で高い代償を払うことになる。
      文と武のどちらに重心を置くかという問いは、以後の東アジアで繰り返し論じられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Song_Taizu.jpg/500px-Song_Taizu.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Song_Taizu.jpg
    links:
