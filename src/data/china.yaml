    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/金_(王朝)

  - id: battle-of-yamen
    year: 1279
    title: 崖山の戦い
    category: war
    tags: [中国, モンゴル]
    summary: 南宋が滅び、中国全土が初めて異民族の支配下に入った。
    detail: |
      南宋の残存勢力とモンゴルの艦隊が、珠江の河口で戦った海戦。
      1279年3月19日に行われ、南宋はここで完全に滅びた。
      中国の全土が、初めて非漢人の王朝の支配下に入る。

      1276年に都の臨安が明け渡されたのち、忠臣たちは幼い皇族を擁して南へ逃れた。
      福建から広東へと移りながら抵抗を続け、最後は崖山の海上に千隻を超える船を並べて陣を構える。
      船を鎖でつないで動かぬ陣としたことが、かえって機動力を奪ったとされる。
      元の水軍に包囲されて水と食糧が尽き、戦いは一日で決した。
      宰相の陸秀夫は8歳の皇帝を背負って海に身を投げ、多くの官僚と兵が後を追ったと伝えられる。
      捕らえられていた文天祥は降伏を拒み、のちに大都で処刑された。

      320年続いた宋の歴史は、この海上で終わった。
      士大夫が国とともに死ぬという姿は、以後の中国で忠節の規範として語り継がれる。
      文天祥が獄中で書いた詩は、その代表として読まれてきた。

      漢人の王朝が完全に倒れたことの衝撃は大きく、崖山の後に中華なしという言葉も生まれた。
      ただし元のもとでも社会と経済は動き続け、江南の生産力は保たれている。
      中国が異民族の支配をどう受け止めるかという問いは、このあと明や清の時代にも繰り返し現れた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d0/Jingmen002.jpg/500px-Jingmen002.jpg
      credit: (Long night without wind) 长夜无风 / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:Jingmen002.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/崖山の戦い

  - id: ming-founded
    year: 1368
    title: 朱元璋が明を建てる
    category: politics
    tags: [中国, 王朝]
    summary: 貧農から皇帝になった人物が、元を北へ追って漢人の王朝を回復した。
    detail: |
      朱元璋が南京で即位し、明を建てた年。
      同じ年に北伐軍が元の都である大都を落とし、モンゴルの朝廷は草原へ退いた。
      およそ90年ぶりに、漢人の王朝が中国を治めることになる。

      元の末期は、紙幣の乱発による物価高と黄河の氾濫で社会が荒れていた。
      治水に動員された人々の不満から1351年に紅巾の乱が起き、各地に群雄が割拠する。
      朱元璋はその一つから出発し、江南の穀倉地帯を押さえて経済力を確保した。
      学者を招いて統治の準備を進め、急いで帝位を称さなかったことが有利に働く。

      1363年に鄱陽湖の水上戦で最大の敵を破り、江南を統一した。
      1368年の正月に皇帝の位に就き、国号を大明、元号を洪武と定める。
      徐達らの北伐軍はその秋に大都へ入り、元の順帝は北へ逃れた。
      新しい王朝は、元の制度を引き継ぎつつ、漢人の伝統を回復すると掲げた。
      服装や儀礼を唐宋の形に戻し、科挙を再開して儒学の官僚を育てる。
      一方で行政区画や駅伝など、元から受け継いだ仕組みも少なくない。

      モンゴル支配を打ち倒した王朝という自己規定は、その後の政策を強く方向づけた。
      北方への警戒は長城の修築と北京遷都につながり、海禁は対外関係を朝貢に限った。
      貧農から身を起こした皇帝が生まれたことは、身分の固定していない社会の可能性を示してもいる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/%E6%98%8E%E5%A4%AA%E7%A5%96%E7%94%BB%E5%83%8F.jpg/500px-%E6%98%8E%E5%A4%AA%E7%A5%96%E7%94%BB%E5%83%8F.jpg
      credit: 作者不明 / Public domain
