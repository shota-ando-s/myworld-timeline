  - id: xuanzang
    year: 629
    title: 玄奘のインド旅行
    category: religion
    tags: [中国, 仏教]
    summary: 17年かけて経典を持ち帰り、東アジアの仏教研究の水準を一段押し上げた。
    detail: |
      唐の僧である玄奘が、仏典を求めてインドへ向かった旅。
      629年に長安を発ち、645年に戻るまで17年を費やした。
      当時は国外へ出ることが禁じられており、許可を得ないままの出発だった。

      動機は、中国に伝わる経典の訳文が食い違い、教えの理解が定まらないことへの疑問だった。
      原典に当たるほかないと考え、河西回廊から西域を抜け、天山を越えて中央アジアに入る。
      ガンダーラを経て、当時インド仏教の中心だったナーランダー僧院で数年学んだ。
      インド各地を巡り、論争の場で名を知られるようになる。

      帰国の際には、657部という大量の経典と仏像を携えていた。
      太宗は罪を問わず迎え、長安の寺に訳場を設けて国家の事業として翻訳を支援する。
      玄奘は没するまでの19年で1300巻を超える漢訳を残した。
      旅の記録は『大唐西域記』としてまとめられ、途中の国々の地理と風俗を伝えている。

      その訳は正確さで知られ、以後の東アジアの仏教研究の基礎になった。
      唯識の教学は法相宗として伝えられ、日本にも入っている。
      『大唐西域記』は、文献の乏しい7世紀の中央アジアとインドを知る一級の史料であり、近代の遺跡発掘にも使われた。
      後世には、この旅を下敷きにした物語『西遊記』が生まれ、三蔵法師の名で広く知られるようになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Xuanzang_w.jpg/500px-Xuanzang_w.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Xuanzang_w.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/玄奘

  - id: an-lushan
    year: 755
    title: 安史の乱
    category: war
    tags: [中国, 唐]
    summary: 8年に及ぶ大反乱で唐は衰退に向かい、律令的な支配が崩れた。
    detail: |
      755年から763年まで続いた、唐を揺るがした大反乱。
      節度使の安禄山と、その部下の史思明、そしてその子たちが指導したため、両者の姓をとって安史の乱と呼ばれる。
      8年にわたり華北を戦場にした。

      背景には、辺境の軍権が節度使に集まりすぎていたことがある。
      安禄山はソグド系の武将で、三つの節度使を兼ねて十数万の兵を握っていた。
      宰相の楊国忠との対立が決定的になり、755年に范陽で挙兵する。
      府兵制が崩れて中央の守りは手薄で、洛陽と長安は相次いで落ちた。

      玄宗は蜀へ逃れ、皇太子が霊武で即位して抗戦を続けた。
      唐はウイグルに援軍を求め、その代価として絹と交易上の特権を与えている。
      反乱軍の側でも安禄山が子に殺され、史思明もまた子に殺されるという内紛が続いた。
      763年、史朝義の死でようやく収まる。

      乱の後、唐は降った反乱側の将をそのまま節度使に任じるほかなかった。
      華北には事実上独立した藩鎮が並び、税も兵も中央に届かなくなる。
      780年には均田制を前提とした租庸調をやめ、土地と資産に応じて課す両税法へ切り替えた。
      人口は戸籍上で大きく減り、西域の支配も失われて、唐の国際的な地位は低下する。
      中国史を前半と後半に分ける画期として扱われることも多い出来事である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/%E5%AE%89%E5%8F%B2%E3%81%AE%E4%B9%B1.PNG/500px-%E5%AE%89%E5%8F%B2%E3%81%AE%E4%B9%B1.PNG
      credit: 俊武 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:%E5%AE%89%E5%8F%B2%E3%81%AE%E4%B9%B1.PNG
    links:
