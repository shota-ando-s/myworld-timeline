        url: https://ja.wikipedia.org/wiki/趙匡胤

  - id: chanyuan-treaty
    year: 1004
    title: 澶淵の盟
    category: politics
    tags: [中国, 外交]
    summary: 宋が遼に毎年の贈り物を送る形で和平を買い、120年の平和が続いた。
    detail: |
      北宋と遼が結んだ和平の盟約で、澶州の淵にちなんで澶淵の盟と呼ばれる。
      1004年、遼の大軍が黄河の北まで南下したのを機に結ばれた。
      以後120年近く、両国のあいだに大きな戦は起きていない。

      遼の聖宗と母の承天太后は、20万といわれる兵を率いて宋領深くへ攻め込んだ。
      宋の朝廷では南へ避難すべきだという声が強かったが、宰相の寇準が真宗自ら前線に出るよう促す。
      皇帝が澶州に現れて士気が上がり、遼側も補給線の伸びきりと将の戦死で決戦を避けた。
      両軍がにらみ合うまま、交渉がまとまる。

      内容は、国境を現状のまま保つこと、互いに攻めないこと、宋を兄、遼を弟とすることだった。
      そして宋は毎年、絹20万匹と銀10万両を歳幣として遼へ贈る。
      額は宋の歳入からすれば大きくはなく、戦費に比べればはるかに安かった。
      国境には交易場が置かれ、贈った銀の多くは交易を通じて宋へ戻ったとも言われる。

      屈辱とみるか、費用対効果の高い現実的な選択とみるかで、評価は分かれてきた。
      対等に近い形式で条約を結んだことは、中国の王朝の外交としては異例である。
      宋はこの後、西夏とも同じように歳賜で和を買い、金にも同様の方式をとった。
      平和が長く続いたことで、両国の交易と人の往来は盛んになっている。
      金が興ると宋はこの盟を破って遼を攻め、その判断が靖康の変を招くことになった。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/澶淵の盟
    related: [liao, song]

  - id: wang-anshi-reform
    year: 1069
    title: 王安石の新法
    category: economy
    tags: [中国, 改革]
    summary: 財政と軍事を立て直す大改革。激しい党争を招き、宋の政治を二分した。
    detail: |
      北宋の神宗のもとで王安石が始めた一連の改革で、新法と呼ばれる。
      1069年から本格的に実施された。
      財政の立て直しと軍の強化を、国家の積極的な介入によって行おうとしたものである。

      宋は官僚と兵を抱えすぎて支出が膨らみ、歳入では追いつかなくなっていた。
      王安石は、富が一部の大地主や大商人に偏っていることが原因だと考える。
      国が資金と物資の流れに関与すれば、民を助けながら税収も増やせるという構想だった。

      青苗法は、種まきの時期に農民へ低利で穀物や銭を貸し、収穫後に返させる制度である。
      募役法は、順番で課されていた労役を金納に改め、その金で人を雇う仕組みにした。
      市易法と均輸法で物資の売買と輸送に国が関与し、価格の乱高下を抑えようとする。
      保甲法は農村を組に編んで民兵を訓練させ、保馬法は軍馬を民に飼わせた。
      方田均税法では土地を測り直し、隠された耕地に課税している。

      反対は激しかった。
      司馬光や蘇軾らは、貸付が事実上の強制になり、末端の役人が数字を作ると批判する。
      実際、地方では割当が押しつけられ、恩恵より負担が目立つ例も多かった。
      神宗の死後に新法は廃され、以後は政権が代わるたびに復活と廃止が繰り返された。
      新法党と旧法党の争いは人事の報復にまで及び、宋の政治を長く消耗させる。
      国家が経済をどこまで動かすべきかという問いは、後世にも繰り返し引かれてきた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/新法・旧法の争い

  - id: jingkang-incident
    year: 1127
    title: 靖康の変
    category: war
    tags: [中国, 金]
    summary: 金が開封を落として皇帝を連れ去り、宋は江南へ逃れて南宋となった。
    detail: |
      金が宋の都の開封を落とし、上皇の徽宗と皇帝の欽宗を北へ連れ去った事件。
      靖康は当時の年号で、陥落は1126年末、連行は1127年のことである。
      これによって北宋は滅び、宋は江南へ移って南宋となった。

      宋は新興の金と結んで遼を挟み撃ちにしたが、その戦いで自軍の弱さを露呈していた。
      遼が滅ぶと金は矛先を宋へ向け、1125年から南下を始める。
      徽宗は責任を負わずに子の欽宗へ位を譲り、朝廷は主戦と和平のあいだで揺れ続けた。
      金は一度は賠償の約束と引き換えに引いたが、宋が支払いを渋ったため再び攻め寄せる。

      1126年の冬、開封は包囲されて落ちた。
      金は莫大な金銀と絹を要求し、宮廷の女性や職人を含む数千人を北へ連行する。
      皇帝と上皇は庶人に落とされ、二度と南へ戻ることはなかった。
      徽宗は8年後に北の地で没している。

      難を逃れた徽宗の子の趙構が南で即位し、高宗として宋を継いだ。
      都は臨安に置かれ、以後は淮河を境に金と向かい合う。
      1142年の和議で南宋は臣下の礼をとり、毎年の銀と絹を贈ることになった。
      華北を失った屈辱は長く記憶され、失地回復は南宋の政治を貫く論点であり続ける。
      多くの人々が南へ移ったことで、江南の人口と経済はさらに厚みを増した。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/6/6b/ChinaHenanKaifeng.png
      credit: コンピュータが読み取れる情報は提供されていませんが、Plastictv~commonswikiだと推定されます（著作権の主張に基づく） / Public domain
      page: https://commons.wikimedia.org/wiki/File:ChinaHenanKaifeng.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/靖康の変

  - id: jin-falls
    year: 1234
    title: モンゴルが金を滅ぼす
    category: war
    tags: [中国, モンゴル]
    summary: 華北がモンゴルの手に落ち、南宋との対決が残された。
    detail: |
      モンゴルが南宋と挟み撃ちにして、女真の金を滅ぼした年。
      最後の拠点である蔡州が落ち、皇帝の哀宗は自ら命を絶った。
      華北全域がモンゴルの支配下に入る。

      モンゴルの攻撃は1211年から始まっていた。
      1215年に中都（現在の北京）を落とされた金は、都を南の開封へ移して抵抗を続ける。
      チンギス・ハンの死後も攻勢は緩まず、1232年に開封が包囲された。
      このとき南宋は、金を倒す好機と見てモンゴルに協力した。
      100年前に華北を奪われた恨みが、判断を後押ししている。
      食糧と兵を出し、1234年に蔡州を落として金を滅ぼした。

      しかし直後に、南宋は旧領の回復を狙って洛陽と開封へ兵を進める。
      この動きがモンゴルとの戦端を開き、以後45年に及ぶ戦争が始まった。
      盟約を結んで隣の大国を倒し、その後に自らが標的になるという経緯は、宋が金と遼に対して犯した失敗の繰り返しでもある。

      金の滅亡で、華北の支配は遊牧勢力の手に移った。
      戦乱と虐殺で人口は大きく減り、都市も荒れる。
      モンゴルは華北の統治に漢人の官僚や契丹人を用い、中国式の行政を部分的に採り入れた。
      残るは長江以南だけとなり、中国全土がひとつの遊牧帝国に入る日が近づいた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3b/%E5%8D%97%E5%AE%8B%E7%96%86%E5%9F%9F%E5%9B%BE%EF%BC%88%E7%B9%81%EF%BC%89.png/500px-%E5%8D%97%E5%AE%8B%E7%96%86%E5%9F%9F%E5%9B%BE%EF%BC%88%E7%B9%81%EF%BC%89.png
