    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/魏_(三国)

  - id: jin-unifies
    year: 280
    title: 西晋が中国を統一
    category: politics
    tags: [中国, 統一]
    summary: 三国の分裂を終わらせたが、内紛と北方民族の進出で36年しか保たなかった。
    detail: |
      晋が呉を滅ぼし、三国の分裂に終止符を打った年。
      黄巾の乱から数えておよそ100年ぶりの統一だった。
      実現したのは司馬炎の治世の中ごろである。

      蜀漢は263年にすでに魏に滅ぼされ、その魏も265年に晋へ代わっていた。
      残る呉では孫皓の苛政で人心が離れ、防備も弱っていた。
      279年末、晋は20万を超える兵を六つの方面から差し向ける。
      王濬の水軍は長江を下り、川をふさぐ鉄の鎖と杭を焼き切って進んだ。

      翌280年、建業を囲まれた孫皓が降伏して呉は滅んだ。
      晋は戸籍を整え直し、土地の保有と税を定める制度を全土に及ぼす。
      州や郡の兵を解いて武装を解き、平和の配当を人口の回復として受け取った。

      しかし統一は36年しか続かなかった。
      諸王の内戦と周辺民族の進出によって、316年に華北を失う。
      次に中国全土がまとまるのは589年の隋で、300年以上の分裂があいだに挟まる。
      この長い分裂のあいだに、北方民族による華北支配と、江南の開発という二つの流れが生まれた。
      三国の英雄が去ったあと、統一はあっけなく訪れたという印象で語られることが多い。
      実際には水軍の建造に10年以上を費やした、長い準備の結果だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9e/Western_Jeun_Dynasty_280_CE.png/500px-Western_Jeun_Dynasty_280_CE.png
      credit: Ian Kiu / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Western_Jeun_Dynasty_280_CE.png
    links:
