  - id: nerchinsk
    year: 1689
    title: ネルチンスク条約
    category: politics
    tags: [中国, ロシア, 外交]
    summary: ロシアと対等な形で結んだ最初の国境条約。朝貢とは別の外交の型を経験した。
    detail: |
      清とロシアが結んだ国境条約で、両国が対等な立場で署名した最初の条約。
      1689年、アルグン川の近くのネルチンスクで締結された。
      中国の王朝にとって、朝貢とは異なる外交の作法を経験する機会になった。

      17世紀に入り、シベリアを東へ進んだロシアが黒竜江の流域に砦を築いていた。
      清は発祥の地である満洲への接近を警戒し、アルバジンをめぐって数度の攻防を繰り返す。
      双方とも遠隔地での長期戦を望まず、交渉が選ばれた。
      会議では、ラテン語が共通語として用いられた。
      清側の通訳を務めたのは、宮廷に仕えていたイエズス会の宣教師である。
      条約はラテン語・満洲語・ロシア語で作られ、漢文は正文に含まれなかった。

      内容は、アルグン川と外興安嶺を国境とし、ロシアは黒竜江流域から退くというものである。
      代わりにロシアには、北京への定期的な隊商による交易が認められた。
      アルバジンの砦は取り壊された。

      この条約によって、両国の国境は170年近く安定した。
      清が自らを中心に置く朝貢の枠組みの外で、対等な取り決めを結んだ点が特異である。
      ただし清はこれを例外扱いし、外交の原則を改めたわけではなかった。
      19世紀にアイグン条約と北京条約で境界は書き換えられ、ロシアは沿海州を得る。
      対等な条約から不平等な条約へという流れは、清の国力の変化をそのまま映している。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/b/b3/Treaty_of_Nerchinsk_%281689%29.jpg
      credit: Governments of Russia and China / Public domain
      page: https://commons.wikimedia.org/wiki/File:Treaty_of_Nerchinsk_(1689).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ネルチンスク条約

  - id: macartney
    year: 1793
    title: マカートニー使節の訪中
    category: economy
    tags: [中国, イギリス]
    summary: 自由貿易を求めた使節が拒まれ、両者の世界観の隔たりが露わになった。
    detail: |
      イギリスが通商の拡大を求めて派遣した使節団が、乾隆帝に謁見した出来事。
      1793年、避暑地の熱河で会見が行われた。
      要求はすべて退けられ、両者の世界観の違いが浮き彫りになった。

      当時、イギリスは中国の茶を大量に買い、その代金として銀が流出していた。
      交易は広州一港に限られ、公行と呼ばれる特定の商人を通すことが義務づけられている。
      マカートニーは、開港地の追加、公使の北京常駐、関税の明文化などを求めた。
      最初に問題になったのは儀礼だった。
      清は皇帝への三跪九叩頭を求め、イギリス側は自国の君主に対するのと同じ礼にとどめようとする。
      折衝の末、片膝をつく形で決着したと伝えられるが、記録は一致していない。
      使節が持参した天体観測儀や大砲は、珍しい貢ぎ物として扱われた。

      乾隆帝がイギリス国王に与えた勅諭は、中国には無いものがなく、外国の品を必要としない、という内容だった。
      常駐の使節は前例がないとして認められず、交易の条件も変わらなかった。
      使節は成果なく帰国する。

      この拒絶は、清が外の変化を過小評価していた例として引かれてきた。
      ただし当時の清は実際に強大で、要求を受け入れる理由もなかったという見方もある。
      銀の流出を埋めるため、イギリスはやがてインド産のアヘンを持ち込むようになる。
      交渉で開かなかった扉は、半世紀後に戦争によって開かれた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ジョージ・マカートニー

  - id: opium-war
    year: 1840
    title: アヘン戦争
    category: war
    tags: [中国, 列強]
    summary: イギリスに敗れて香港を割譲。東アジアの国際秩序が根底から変わった。
    detail: |
      アヘンの取り締まりをきっかけに、清とイギリスが戦った戦争。
      1840年から1842年まで続き、清が敗れて南京条約を結んだ。
      東アジアの国際秩序が根底から変わる出発点になった。

      イギリスは茶の代金として流出する銀を取り戻すため、インドで作ったアヘンを清へ運んでいた。
      中毒者が増え、銀が逆に流出し始めたことで、清は取り締まりを強める。
      1839年、欽差大臣の林則徐が広州で外国商人からアヘンを没収し、海水と石灰で処分した。
      イギリス議会は、自由な交易が侵害されたとして出兵を可決する。
      賛否は9票差の僅差だった。
      派遣された艦隊は沿岸の都市を次々に砲撃し、鉄製の蒸気船が河をさかのぼって内陸を突いた。
      清の水軍と沿岸砲台は、射程でも機動力でも歯が立たない。

      1842年、艦隊が長江をさかのぼって大運河との結節点を押さえると、清は降伏した。
      南京で結ばれた条約により、香港が割譲され、五つの港が開かれる。
      賠償金は当時の清の歳入の数分の一に相当した。

      敗北の衝撃は、すぐには全土に及ばなかった。
      朝廷は沿海の局地的な失敗と受け止め、体制の見直しには向かわない。
      しかし条約に基づく外交と居留地が作られ、朝貢を中心とする秩序は崩れ始めた。
      この戦争を中国の近代の始まりとする見方は、現在も広く共有されている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/Destroying_Chinese_war_junks%2C_by_E._Duncan_%281843%29.jpg/500px-Destroying_Chinese_war_junks%2C_by_E._Duncan_%281843%29.jpg
      credit: エドワード・ダンカン / Public domain
      page: https://commons.wikimedia.org/wiki/File:Destroying_Chinese_war_junks,_by_E._Duncan_(1843).jpg
    links:
      - label: Wikipedia（アヘン戦争）
        url: https://ja.wikipedia.org/wiki/アヘン戦争

  - id: treaty-of-nanjing
    year: 1842
    title: 南京条約
    category: politics
    tags: [中国, 不平等条約]
    summary: 五港の開港と香港割譲。以後1世紀続く不平等条約体制の出発点になった。
    detail: |
      アヘン戦争を終わらせるために、清とイギリスが結んだ講和条約。
      1842年8月、南京に停泊するイギリス軍艦の上で調印された。
      中国が外国と結んだ最初の近代的な条約であり、不平等条約の起点になった。

      主な内容は五つある。
      香港島をイギリスに割譲すること。
      広州・厦門・福州・寧波・上海の五港を開き、領事の駐在を認めること。
      没収されたアヘンの代価と戦費を含む2100万ドルの賠償を支払うこと。
      特定の商人組合に交易を独占させる公行の制度を廃すること。
      関税率を両国で協定して定めること。

      翌年の追加条約では、領事裁判権と最恵国待遇が認められた。
      外国人の犯罪は自国の領事が裁き、他国に与えた特権は自動的にイギリスにも及ぶ。
      以後、アメリカやフランスも同様の条約を結び、同じ権利を得た。
      清の側は、当初この条約の重みを理解していなかった。
      関税自主権の喪失や領事裁判権が何を意味するかが分かるのは、時間が経ってからである。
      開かれた港では租界が作られ、外国の行政が及ぶ区域が生まれた。
      上海は小さな県城から、東アジア有数の交易都市へ変わっていく。

      この条約の体系は、1943年まで100年にわたって中国を縛った。
      日本や朝鮮も同じ型の条約を押しつけられ、東アジア全体が同じ構造に置かれる。
      不平等条約の改正は、以後の中国の政治を貫く目標であり続けた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f8/The_Signing_of_the_Treaty_of_Nanking.jpg/500px-The_Signing_of_the_Treaty_of_Nanking.jpg
      credit: Painted by Captain John Platt, Bengal Volunteers. Engraved by John Burnet. / Public domain
      page: https://commons.wikimedia.org/wiki/File:The_Signing_of_the_Treaty_of_Nanking.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/南京条約

  - id: arrow-war
    year: 1856
    title: アロー戦争（第二次アヘン戦争）
    category: war
    tags: [中国, 列強]
    summary: 英仏軍が北京まで攻め込み、清は内陸と外交にまで干渉を受けるようになった。
    detail: |
      清とイギリス・フランス連合軍が戦った戦争で、第二次アヘン戦争とも呼ばれる。
      1856年から1860年まで続き、清は北京を占領されて条約の改定を受け入れた。
      名称は、発端となったアロー号事件に由来する。

      イギリスは南京条約で得た権利では不十分だと考え、条約の改定を求めていた。
      清がこれに応じないなか、香港籍を名乗る船アロー号の乗員が清の官憲に捕らえられる。
      イギリスは国旗が侮辱されたとして出兵し、宣教師の殺害を理由にフランスも加わった。
      連合軍は広州を占領し、北上して天津に迫る。
      1858年に天津条約が結ばれ、開港場の追加、公使の北京駐在、内地旅行と布教の自由、アヘン貿易の公認が取り決められた。
      しかし批准書の交換に向かった使節が大沽の砲台で撃退され、戦闘が再開される。

      1860年、連合軍は北京に入った。
      皇帝は熱河へ逃れ、離宮の円明園は略奪されたうえで焼き払われる。
      捕らえた使節が殺害されたことへの報復とされたが、破壊の規模は大きく、後世まで語られる事件になった。

      北京条約で天津条約が確認され、九竜半島の一部がイギリスに割譲された。
      仲介に立ったロシアは、その代償として沿海州を得ている。
      公使が北京に常駐することになり、清は外国と日常的に交渉する体制を作らざるをえなくなった。
      翌年に総理衙門が設けられ、朝貢を前提とした対外関係は事実上終わる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/8/80/Opium_Wars%2C_storming_of_the_Taku_Forts_by_British_troops%2C_1860.JPG
      credit: William Heysham Overend / Public domain
      page: https://commons.wikimedia.org/wiki/File:Opium_Wars,_storming_of_the_Taku_Forts_by_British_troops,_1860.JPG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アロー戦争

  - id: treaty-of-beijing
    year: 1860
    title: 北京条約
    category: politics
    tags: [中国, 不平等条約]
    summary: 公使の北京常駐が認められ、清の対外関係が朝貢から条約へ切り替わった。
    detail: |
      アロー戦争の講和として、清がイギリス・フランス・ロシアと結んだ条約。
      1860年10月から11月にかけて、占領下の北京で調印された。
      中国の対外関係が、朝貢から条約に基づくものへ完全に切り替わる画期になった。

      英仏軍は北京に入り、離宮の円明園を焼き払ったうえで交渉を迫った。
      二年前に結ばれていた天津条約の内容が、あらためて確認される。
      公使が北京に常駐すること、天津を含む港をさらに開くこと、外国人が内地を旅行し布教できることが認められた。
      イギリスには九竜半島の南部が割譲され、賠償金も増額される。

      中国人労働者が海外へ渡ることも公認された。
      以後、東南アジアやアメリカ大陸へ大量の労働者が送り出され、各地に華僑の社会が形成される。
      アヘンの取引も合法とされ、取り締まりの根拠は失われた。
      ロシアは戦闘に加わらず、調停者として振る舞った見返りを受け取った。
      ウスリー川以東の沿海州が譲渡され、そこにウラジオストクが建設される。
      ネルチンスク条約以来の国境は、この一連の交渉で大きく書き換えられた。

      翌1861年、清は外交を専門に扱う総理各国事務衙門を設けた。
      周辺国が朝貢に来るのを待つ体制から、常駐の公使と日常的に交渉する体制へ移る。
      同じ時期に始まる洋務運動は、この新しい現実に対応しようとする試みだった。
      条約で定められた枠組みは、以後80年にわたって中国を縛り続ける。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Convention_of_Peking.jpg/500px-Convention_of_Peking.jpg
      credit: Qing Government, China in conjunction with the Europeans (French, British, Russian) in 1860 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Convention_of_Peking.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/北京条約

  - id: first-sino-japanese-war
    year: 1894
    title: 日清戦争
    category: war
    tags: [中国, 日本]
    summary: 洋務運動の成果を信じていた清が日本に敗れ、東アジアの序列が逆転した。
    detail: |
      朝鮮をめぐって清と日本が戦い、清が敗れた戦争。
      1894年7月に戦闘が始まり、翌年4月の下関条約で終わった。
      東アジアの力関係が逆転した出来事である。

      朝鮮で起きた農民の蜂起に対し、両国が出兵したことが発端になった。
      乱が収まった後も日本が撤兵せず、朝鮮の内政改革を求めて対立が深まる。
      豊島沖の海戦から戦端が開かれ、平壌の戦いと黄海海戦で日本が主導権を握った。
      清の主力である北洋艦隊は、装甲の厚い大型艦を持ちながら運用で劣っていた。
      砲弾の不足や訓練の不十分さが指摘され、速射砲を備えた日本艦隊に押される。
      遼東半島の旅順が落ち、翌年には山東の威海衛で艦隊が降伏した。
      洋務運動の成果として誇られた海軍は、ここで失われる。

      下関条約で、清は朝鮮が独立国であることを認めた。
      遼東半島・台湾・澎湖諸島を割譲し、2億両という巨額の賠償を負う。
      遼東半島はロシア・ドイツ・フランスの干渉で返還されたが、まもなくロシアが租借した。

      敗北の衝撃は、アヘン戦争のときとは比べものにならなかった。
      手本にしていた側が、格下と見ていた隣国に負けたという事実が受け止められない。
      ここから列強による勢力範囲の分割が進み、国内では変法と革命の運動が一気に高まる。
      朝鮮と台湾の帰属が変わり、東アジアの秩序は組み替えられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Sino_Japanese_war_1894.jpg/500px-Sino_Japanese_war_1894.jpg
      credit: Oomoto (1894) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Sino_Japanese_war_1894.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日清戦争

  - id: hundred-days-reform
    year: 1898
    title: 戊戌の変法
    category: society
    tags: [中国, 改革]
    summary: 立憲制をめざした改革が100日で潰され、清の自己改革の道が細った。
    detail: |
      日清戦争の敗北を受けて、光緒帝が断行した政治改革。
      1898年6月から9月まで、およそ100日で終わったため百日維新とも呼ばれる。
      明治維新にならい、立憲君主制のもとで近代化を進めようとした試みだった。

      中心にいたのは、康有為と梁啓超である。
      康有為は、孔子自身が制度を改めた人物だと論じて、変革を儒学の内側から正当化した。
      日清戦争の講和に反対する上書を機に名を知られ、光緒帝に登用される。
      発せられた詔勅は100を超えた。
      科挙から八股文を廃し、実務を問う内容に改める。
      各地に近代的な学校を設け、京師大学堂を創設する。
      官庁の整理、陸海軍の改編、商工業の振興、新聞の発行の奨励も打ち出された。

      しかし改革を実行する権力の裏づけがなかった。
      職を失う官僚と、満洲人の特権を脅かされる保守派が一斉に反発する。
      西太后が政変を起こして光緒帝を幽閉し、詔勅のほとんどを取り消した。
      譚嗣同ら六人が処刑され、康有為と梁啓超は日本へ亡命する。
      袁世凱が保守派に通じたため失敗したとも伝えられるが、経緯には異説もある。

      この失敗によって、体制の内側から変える道は細くなった。
      改革を志した知識人の多くが、王朝を倒す革命へ傾いていく。
      皮肉にも、義和団事件の後に清自身が同じ内容の改革を始めることになる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/9/94/Liang_qichao.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Liang_qichao.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/戊戌の変法

  - id: boxer-rebellion
    year: 1900
    title: 義和団事件
    category: war
    tags: [中国, 列強]
    summary: 排外運動に清が同調して八か国連合軍に敗れ、巨額の賠償金を負った。
    detail: |
      山東で起きた排外運動に清が同調し、列強との戦争に発展した事件。
      義和団は清を助けて外国を滅ぼすという標語を掲げ、1900年に北京へ入った。
      八か国連合軍に敗れ、清は巨額の賠償と軍の駐留を受け入れる。

      背景には、キリスト教の布教をめぐる各地の紛争と、鉄道や鉱山の利権による生活の圧迫があった。
      武術と呪術を結びつけた集団が、刀や弾丸が効かないと信じて教会や信徒を襲う。
      1899年から勢いを増し、鉄道や電信線を破壊しながら北上した。
      清の朝廷は、鎮圧するか利用するかで割れた。
      西太后は義和団の力で列強を追い出せると判断し、1900年6月に各国へ宣戦を布告する。
      北京の公使館区域は55日にわたって包囲され、ドイツ公使が殺害された。
      南方の総督たちはこの宣戦を認めず、列強と独自に協定を結んで戦闘に加わらなかった。

      日本とロシアを主力とする八か国の連合軍が天津から北京へ進み、8月に城内へ入る。
      西太后は光緒帝を連れて西安へ逃れた。
      連合軍と各国の部隊による略奪が広く行われている。

      1901年の北京議定書で、清は4億5千万両を39年賦で支払うことになった。
      公使館区域の防衛と北京から海までの要地に外国軍の駐屯が認められ、主権はさらに削られる。
      この駐兵権が、のちの日中の衝突の舞台を用意した。
      打撃を受けた清は、ここでようやく本格的な制度改革に踏み切る。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/Battle_of_Tientsin_Japanese_soldiers.jpg/500px-Battle_of_Tientsin_Japanese_soldiers.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Battle_of_Tientsin_Japanese_soldiers.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/義和団の乱

  - id: exam-abolished
    year: 1905
    title: 科挙の廃止
    category: society
    tags: [中国, 教育]
    summary: 1300年続いた登用制度が終わり、知識人は新しい学校と革命に向かった。
    detail: |
      1300年余り続いた官僚登用試験が、清によって廃止された年。
      隋にさかのぼる制度が、近代的な学校制度に置き換えられた。
      中国社会の上昇の道筋が、根本から変わる出来事である。

      日清戦争と義和団事件の後、清は本格的な改革に着手していた。
      近代の知識を持つ人材が必要になった一方、科挙が続くかぎり若者は経書の暗記に時間を費やす。
      新しい学校を作っても、出世の道が科挙にあれば学生は集まらなかった。
      1905年、袁世凱と張之洞らが廃止を上奏し、朝廷は翌年の試験から取りやめることを決めた。
      代わりに各地に学堂が設けられ、卒業者に官職への道を開く仕組みが作られる。
      数万の学生が日本へ留学し、法律・軍事・教育を学んだ。

      影響は制度の変更にとどまらなかった。
      地方の名望家は、科挙の合格という国家との結びつきを失う。
      読書人が王朝に忠誠を尽くす理由が薄れ、新しい知識を得た層は改革ではなく革命へ向かった。
      日本に留学した学生の多くが革命運動に加わり、6年後の辛亥革命の担い手になる。

      家柄ではなく試験で身を立てるという仕組みは、東アジアの社会に深く根づいていた。
      その廃止は、清が自らを支えてきた層との関係を断つ結果にもなった。
      一方で、学校と留学を通じた新しい知識の流入は、20世紀の中国を作る土台になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/Civilserviceexam1.jpg/500px-Civilserviceexam1.jpg
      credit: 仇英 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Civilserviceexam1.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/科挙
    related: [imperial-exam-start]

  - id: xinhai-revolution
    year: 1911
    title: 辛亥革命
    category: society
    tags: [中国, 革命]
    summary: 2000年以上続いた皇帝の支配が終わり、翌年に中華民国が成立した。
    detail: |
      清を倒して共和国を樹立した革命。
      1911年10月10日の武昌での蜂起から始まり、翌年の皇帝退位で決着した。
      2000年以上続いた皇帝による支配が、ここで終わる。

      引き金は鉄道の国有化だった。
      清が民間資本で進めていた鉄道を国有化し、外国からの借款の担保にしようとする。
      四川では株主と住民が激しく抗議し、鎮圧のため湖北の軍が動かされた。
      手薄になった武昌で、革命派の影響を受けた新軍が蜂起する。
      蜂起は偶発的な要素が強かったが、各省が次々に清からの独立を宣言した。
      2か月のうちに14省が離反し、清の支配は南半分で失われる。
      海外にいた孫文が帰国し、1912年1月1日に南京で中華民国の臨時大総統に就いた。

      清は、北洋軍を握る袁世凱に頼るほかなかった。
      袁世凱は革命側と交渉し、皇帝を退位させる代わりに自分が大総統となる取引をまとめる。
      1912年2月12日、6歳の宣統帝が退位し、清は滅んだ。
      孫文は約束どおり職を譲り、権力は袁世凱に移る。

      アジアで最初の共和国が生まれた一方、革命の実質は不十分だった。
      各省の独立は在地の軍人と有力者によるもので、統一した権力は生まれない。
      袁世凱の死後は軍閥が割拠し、混乱は30年以上続いた。
      それでも、皇帝という制度が二度と戻らなかったという点で、この革命の断絶は決定的だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/1912Jimingxiaoling.jpg/500px-1912Jimingxiaoling.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:1912Jimingxiaoling.jpg
    related: [qing, roc-mainland]
    links:
      - label: Wikipedia（辛亥革命）
        url: https://ja.wikipedia.org/wiki/辛亥革命

  - id: may-fourth
    year: 1919
    title: 五・四運動
    category: society
    tags: [中国, 思想]
    summary: 学生の抗議から始まり、旧来の価値観を問い直す文化運動へ広がった。
    detail: |
      1919年5月4日、北京の学生が起こした抗議から始まった運動。
      パリ講和会議で、ドイツが持っていた山東の権益が日本に引き継がれると決まったことが直接の引き金だった。
      抗議は全国に広がり、政治運動にとどまらない文化の転換につながる。

      中国は第一次世界大戦に連合国側として参戦し、労働者を欧州へ送っていた。
      戦勝国として権益の回復を期待していたが、会議はそれを認めなかった。
      5月4日、北京の学生3000人が天安門前に集まり、親日的とされた高官の邸宅を焼き討ちする。
      逮捕者が出ると抗議はさらに広がった。
      上海では商店が店を閉じ、労働者がストライキに入る。
      世論に押されて政府は講和条約への調印を拒み、逮捕された学生も釈放された。
      中国の民衆運動が、初めて外交の決定を動かした例になる。

      運動は、すでに始まっていた新文化運動と結びついた。
      雑誌『新青年』は、儒教的な家族制度を批判し、科学と民主を掲げていた。
      話し言葉に近い白話で書くことが広がり、魯迅の小説が新しい文学を切り開く。
      知識人はこの時期にマルクス主義を含む多様な思想を受け入れた。

      2年後に中国共産党が結成され、国民党も組織を立て直す。
      中国の現代史では、この運動を新しい時代の出発点とする見方が定着した。
      外圧への抵抗と、自らの伝統への問い直しが同時に起きた点に、その特徴がある。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/6/6a/Beijing_students_protesting_the_Treaty_of_Versailles_%28May_4%2C_1919%29.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Beijing_students_protesting_the_Treaty_of_Versailles_(May_4,_1919).jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/五四運動

  - id: ccp-founded
    year: 1921
    title: 中国共産党の結成
    category: politics
    tags: [中国]
    summary: 数十人で始まった組織が、28年後には大陸を統治することになる。
    detail: |
      中国共産党が上海で創立大会を開いた年。
      参加者は各地の代表13人で、全国の党員は数十人にすぎなかった。
      28年後、この組織が中国大陸を統治することになる。

      背景には、五四運動で高まった思想の模索がある。
      ロシア革命の成功が伝えられ、知識人はマルクス主義を現実の選択肢として読み始めた。
      北京大学の陳独秀と李大釗が中心となり、各地に研究会が作られる。
      コミンテルンの代表が訪れ、組織づくりを助けた。

      1921年7月、上海のフランス租界で第1回大会が開かれた。
      警察の踏み込みを受けて会場を移し、最後は浙江の湖に浮かべた船の上で議題を終えたと伝えられる。
      初代の書記には陳独秀が選ばれた。
      毛沢東も湖南の代表として出席している。

      当初は、都市の労働者による革命を目標としていた。
      コミンテルンの指示で国民党に個人の資格で加わり、北伐に協力する。
      1927年に蒋介石が共産党員を弾圧すると、生き残った者は農村へ逃れた。
      そこで農民を基盤とする根拠地と軍を作る路線が生まれる。
      長征と日中戦争を経て、党員は百万を超える規模に育った。
      1949年に内戦に勝利し、中華人民共和国を建国する。
      13人で始まった組織が、世界最大の政党になるまでの出発点がこの年である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/78/Danghui_golden.svg/500px-Danghui_golden.svg.png
      credit: Converted from File:Danghui.svg / Public domain
      page: https://commons.wikimedia.org/wiki/File:Danghui_golden.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/中国共産党

  - id: long-march
    year: 1934
    title: 長征
    category: war
    tags: [中国, 内戦]
    summary: 1万キロを超える撤退のなかで毛沢東が指導権を握り、共産党の神話になった。
    detail: |
      国民党軍の包囲を逃れた共産党の紅軍が、江西から陝西北部まで移動した大撤退。
      1934年10月に瑞金を放棄して始まり、1936年に完了した。
      移動距離は主力の部隊で1万2000キロを超える。

      共産党は江西の山間部に根拠地を築いていたが、国民党の五度目の包囲作戦で追い詰められた。
      ドイツ人顧問の助言による陣地戦が失敗し、拠点を捨てて脱出するほかなくなる。
      出発時の主力は8万余、そこに文書と印刷機まで運ぶ大移動だった。
      行軍は絶えず攻撃と空爆にさらされた。
      1935年1月の遵義会議で従来の軍事指導が批判され、毛沢東が事実上の指導権を握る。
      以後は敵の手薄なところを突く機動的な戦い方に切り替えられた。
      金沙江を渡り、大渡河の吊り橋を奪い、4000メートルを超える雪山と湿原の草地を越える。

      陝西に到達したとき、部隊は1万人を割っていたとされる。
      犠牲は甚大だったが、党の中枢と軍の骨格は残った。
      延安を新たな拠点とし、日本と戦う姿勢を掲げて支持を広げる。

      この移動は、共産党の歴史で建国の神話として語られてきた。
      困難に耐えて生き延びたという物語が、党の正統性と毛沢東の権威を支える。
      実務の面では、通過した各地に党の存在を知らせ、農村での宣伝の機会にもなった。
      軍事的には敗走だったものが、政治的には出発点に転じた例である。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/長征

  - id: marco-polo-bridge
    year: 1937
    title: 盧溝橋事件
    category: war
    tags: [中国, 日本]
    summary: 小さな衝突から全面戦争に発展し、8年の日中戦争が始まった。
    detail: |
      北京郊外の盧溝橋で起きた日中両軍の衝突。
      1937年7月7日の夜、演習中の日本軍で兵士1名が行方不明になったことを発端とする。
      小規模な事件が、8年に及ぶ全面戦争の始まりになった。

      当時、北京周辺には条約に基づいて日本軍が駐屯していた。
      義和団事件の後の北京議定書で認められた駐兵権が、その根拠である。
      中国側の第29軍と日本の支那駐屯軍が至近距離で向かい合い、緊張が続いていた。
      最初の銃声が誰によるものかは、今も特定されていない。
      現地では数日のうちに停戦の交渉がまとまりかけた。
      しかし日本国内で強硬論が優勢になり、内地からの増派が決まる。
      中国側も、これ以上の譲歩は国を失うとして全面抗戦の方針を固めた。

      7月末には北京と天津が日本軍の手に落ちる。
      8月には戦火が上海に及び、戦争は華北から華中へ広がった。
      宣戦布告はどちらからも行われず、日本では当初これを事変と呼んでいる。

      事件そのものは偶発的でも、積み重なった対立がそれを戦争に変えた。
      満洲事変以来の関係の悪化が、小さな衝突を収められない状態を作っていたといえる。
      中国ではこの日付をとって七七事変と呼び、抗日戦争の起点としている。
      国共の再合作も、この事件の後に実現した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/%E7%9B%A7%E6%BA%9D%E6%A9%8B%E4%BB%98%E8%BF%91.jpg/500px-%E7%9B%A7%E6%BA%9D%E6%A9%8B%E4%BB%98%E8%BF%91.jpg
      credit: みや東亜 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:%E7%9B%A7%E6%BA%9D%E6%A9%8B%E4%BB%98%E8%BF%91.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/盧溝橋事件
    related: [second-sino-japanese-war]

  - id: prc-founded
    year: 1949
    title: 中華人民共和国の成立
    category: politics
    tags: [中国, 現代]
    summary: 内戦に敗れた国民党は台湾へ移り、ここから今日に続く両岸の分断が始まった。
    detail: |
      毛沢東が天安門の上で中華人民共和国の成立を宣言した出来事。
      1949年10月1日のことである。
      同じ年の末に国民党の政府は台湾へ移り、両岸の分断が始まった。

      日本の降伏後、国民党と共産党は一度は交渉の席についた。
      しかし1946年に内戦が再開し、当初は兵力と装備で優る国民党が優位に立つ。
      情勢が変わるのは1947年以降で、共産党は農村での土地改革によって兵と食糧を確保した。
      国民党の支配地域では、極度のインフレと汚職が支持を失わせていく。

      1948年から翌年にかけての三つの大規模な戦役で、国民党の主力は壊滅した。
      1949年4月に南京が落ち、共産党は南へ進む。
      10月1日の宣言の時点で、なお一部の地域では戦闘が続いていた。
      新政府は、まず土地改革と通貨の安定に取り組んだ。
      翌1950年には朝鮮戦争に参戦し、米国との対立が固定される。
      台湾に移った中華民国政府は大陸反攻を掲げ、米国の支援を受けて存続した。

      どちらも自らを中国を代表する政府だと主張し、国際的な承認をめぐって争う。
      1971年に国連の代表権が交代し、外交上の優劣は決した。
      それでも台湾海峡をはさむ分断は解消されておらず、この年に生まれた構図が現在まで続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Flag_of_the_People%27s_Republic_of_China.svg/500px-Flag_of_the_People%27s_Republic_of_China.svg.png
      credit: Zeng Liansong / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_People%27s_Republic_of_China.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/中華人民共和国

  - id: un-seat
    year: 1971
    title: 国連代表権の交代
    category: politics
    tags: [中国, 外交]
    summary: 中国を代表する政府が中華民国から中華人民共和国に変わった。
    detail: |
      国連における中国の代表権が、中華民国から中華人民共和国へ移った出来事。
      1971年10月25日、国連総会でアルバニアなどが提出した決議が採択された。
      中華人民共和国は加盟と同時に、安全保障理事会の常任理事国の席も得た。

      1949年以降、二つの政府がそれぞれ中国を代表すると主張してきた。
      米国の支持を背景に、台北の中華民国政府が20年以上にわたり議席を保っていた。
      しかし新たに独立したアジアとアフリカの国々が加盟し、票の構成は変わっていく。

      米国は、中華人民共和国の加盟を認めつつ中華民国の議席も残す二重代表制を模索した。
      しかし双方が一つの中国を譲らず、この案は支持を得られない。
      採決では賛成76、反対35で決議が可決された。
      中華民国の代表は、採決の前に議場を去って脱退を表明する。

      同じ年の夏には、キッシンジャーが秘密裏に北京を訪れていた。
      米中の接近が明らかになったことが、各国の判断に影響したとされる。
      翌年にはニクソンが訪中し、日本も中華人民共和国と国交を結んだ。
      この交代によって、外交上の承認は大きく一方へ傾いた。
      台湾は多くの国際機関から外れ、以後は非公式の関係を軸に対外関係を維持する。
      国際社会で中国を代表するのはどちらかという問題に、この決議が事実上の答えを与えた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ce/Voting_res_2758.png/500px-Voting_res_2758.png
      credit: Continentalis / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Voting_res_2758.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アルバニア決議

  - id: nixon-visit
    year: 1972
    title: ニクソン訪中
    category: politics
    tags: [中国, 冷戦]
    summary: 米中が接近し、冷戦の構図とアジアの力関係が組み替わった。
    detail: |
      アメリカ大統領のニクソンが中華人民共和国を訪れ、毛沢東と会談した出来事。
      1972年2月21日から28日までの訪問で、冷戦の構図を組み替えた。
      両国は朝鮮戦争以来、20年以上にわたり敵対していた。

      背景には、中ソの対立があった。
      1960年代に両国の関係は悪化し、1969年には国境で武力衝突まで起きている。
      中国はソ連の脅威に備える必要があり、米国はベトナムからの撤退とソ連との交渉で有利な立場を求めていた。
      利害が一致した両者を、パキスタンなどの仲介が結びつける。

      1971年7月、キッシンジャーが秘密裏に北京を訪れて道筋をつけた。
      その前後に、卓球の選手団の交流が雪解けの象徴として報じられている。
      訪問は世界に生中継され、万里の長城に立つ大統領の姿が放送された。
      発表された上海コミュニケは、双方の立場の違いを併記する異例の形をとった。
      米国は、台湾海峡の両側の中国人がいずれも一つの中国であると主張していることを認識すると述べ、台湾からの撤兵を段階的に進めるとした。
      国交の正常化は1979年まで待たれる。

      この接近は、ソ連にとって大きな圧力になった。
      日本も同じ年に中国と国交を結び、アジアの外交は一斉に動く。
      中国は国際的な孤立から抜け出し、後の改革開放を受け入れる環境が整った。
      敵対していた二国が利害で結びついた例として、外交史で繰り返し取り上げられる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7b/President_Richard_Nixon_and_Premier_Chou_En-Lai_Shake_Hands_at_the_Nixons%27_Arrival_in_Peking%2C_China_-_DPLA_-_315dbcc0e8b46e1bc678fde12bef9eb8.jpg/500px-President_Richard_Nixon_and_Premier_Chou_En-Lai_Shake_Hands_at_the_Nixons%27_Arrival_in_Peking%2C_China_-_DPLA_-_315dbcc0e8b46e1bc678fde12bef9eb8.jpg
      credit: "President (1969-1974 : Nixon). White House Photo Office. 1969-1974, General Services Administration. National Archives and Records Service. Office of Presidential Libraries. Office of Presidential Papers. 1/20/1969-ca. 12/1974 / Public domain"
      page: https://commons.wikimedia.org/wiki/File:President_Richard_Nixon_and_Premier_Chou_En-Lai_Shake_Hands_at_the_Nixons%27_Arrival_in_Peking,_China_-_DPLA_-_315dbcc0e8b46e1bc678fde12bef9eb8.jpg
    links:
