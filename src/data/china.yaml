  - id: ming-fall
    year: 1644
    title: 明の滅亡と清の北京入城
    category: war
    tags: [中国, 王朝交代]
    summary: 李自成の反乱で明が倒れ、その混乱に乗じて清が中国支配を始めた。
    detail: |
      農民反乱軍の李自成が北京を占領して明が滅び、その直後に清が北京へ入った年。
      崇禎帝は宮城の裏山で自ら命を絶った。
      一年のうちに三つの勢力が都の主になった、中国史でも異例の年である。

      明の末期は、寒冷化による凶作と重税で農村が疲弊していた。
      遼東での対清戦争の費用が上乗せされ、駅伝の廃止で職を失った人々も反乱に加わる。
      李自成は陝西から勢力を広げ、1644年の春に北京へ迫った。
      守る兵に給与も士気もなく、城門は内から開かれる。

      明の主力は、山海関で清軍と対峙していた呉三桂の軍だった。
      呉三桂は李自成に降るか清と結ぶかの選択を迫られ、関門を開いて清軍を招き入れる。
      山海関の戦いで李自成は敗れ、北京を捨てて西へ逃れた。
      摂政のドルゴンに率いられた清軍が入城し、幼い順治帝を迎えて中国の支配を宣言する。

      清は崇禎帝の葬儀を丁重に行い、明の復讐者として振る舞った。
      一方で、漢人男性に満洲風の辮髪を強制し、従わない都市は激しく攻められている。
      南では明の皇族を立てた政権が各地で抵抗を続け、最後の拠点が消えるのは1662年だった。
      この年の交代は、王朝の交代であると同時に異民族による征服でもあった。
      それでも清は明の官僚制と科挙をそのまま用い、統治の断絶は小さかった。
      中国の歴史では珍しく、滅亡と征服と再建が数か月のうちに連続した年になっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/%E6%B0%B8%E4%B9%90%E5%B9%B4%E9%97%B4%E7%9A%84%E6%98%8E%E6%9C%9D%EF%BC%88%E7%B9%81%EF%BC%89.png/500px-%E6%B0%B8%E4%B9%90%E5%B9%B4%E9%97%B4%E7%9A%84%E6%98%8E%E6%9C%9D%EF%BC%88%E7%B9%81%EF%BC%89.png
      credit: 玖巧仔 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:%E6%B0%B8%E4%B9%90%E5%B9%B4%E9%97%B4%E7%9A%84%E6%98%8E%E6%9C%9D%EF%BC%88%E7%B9%81%EF%BC%89.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/明
