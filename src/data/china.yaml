        url: https://ja.wikipedia.org/wiki/金_(王朝)

  - id: yuan
    title: 元
    start: 1271
    end: 1368
    category: politics
    tags: [中国, モンゴル, 征服王朝]
    summary: モンゴルが立てた王朝。ユーラシア規模の人と物の往来が中国を通った。
    detail: |
      モンゴル帝国の君主クビライが建てた中国の王朝で、1271年から1368年まで続いた。
      正式には大元大モンゴル国と称し、モンゴル帝国の宗主としての地位も兼ねていた。
      都は大都、現在の北京である。
      中国の全土を非漢人の政権が支配した最初の例になる。

      統治では、モンゴル人が要職を占め、中央アジアや西アジア出身の色目人が財務を担った。
      旧金の支配下にいた人々を漢人、旧南宋の人々を南人と呼び、その順で扱いに差をつける。
      科挙は長く停止され、1313年に復活してからも合格者は少なかった。
      一方で、地方の実務は在地の有力者に委ねられ、宗教には寛容で、仏教・道教・イスラム教・キリスト教が共存した。

      ユーラシアを覆う駅伝の網が中国とつながり、人と物の往来はかつてない規模になった。
      景徳鎮の磁器が西アジアへ運ばれ、イスラム圏の天文学と医学が中国へ入る。
      マルコ・ポーロやイブン・バットゥータが訪れ、その記録が外の世界に中国の富を伝えた。
      口語に近い言葉で書かれた戯曲が栄え、元曲として中国文学の一分野になっている。

      財政は紙幣の乱発でしだいに行き詰まり、物価が高騰した。
      黄河の氾濫と疫病が重なり、治水工事に駆り出された人々の不満が爆発する。
      1351年に始まる紅巾の乱が全土に広がり、1368年に明の軍が大都に迫ると、朝廷は草原へ退いた。
      北へ戻った政権は北元として続き、モンゴル高原での勢力を保っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Yuen_Dynasty_1294_-_Goryeo_as_vassal.png/500px-Yuen_Dynasty_1294_-_Goryeo_as_vassal.png
      credit: "Yuen_Dynasty_1294.png: Ian Kiu derivative work: Idh0854 (talk) / CC BY 3.0"
      page: https://commons.wikimedia.org/wiki/File:Yuen_Dynasty_1294_-_Goryeo_as_vassal.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/元_(王朝)

  - id: ming
    title: 明
    start: 1368
    end: 1644
    category: politics
    tags: [中国, 王朝]
    summary: 漢人王朝の復活。海禁と朝貢体制のもとで東アジアの秩序を作った。
    detail: |
      元を北へ追った朱元璋が建てた王朝で、1368年から1644年まで続いた。
      漢人による最後の統一王朝である。
      都は初め南京に置かれ、1421年に北京へ移された。

      初代の洪武帝は、宰相の職を廃して政務を皇帝が直接握る体制を作った。
      軍は衛所制で土地と結びつけ、農村は里甲制で組織して租税と労役を割り当てる。
      儒学の教えを六つの言葉にまとめて村々で唱えさせるなど、社会の隅々まで国家が関与しようとした。
      対外では、民間の海外渡航を禁じる海禁を敷き、国と国の貿易は朝貢の形に限った。
      周辺の国々が使節を送り、返礼として恩賜を受け取る秩序が東アジアに広がる。
      永楽帝の時代には鄭和の艦隊がインド洋を巡り、明の威信を示した。
      北ではモンゴルへの親征を重ね、長城を現在の姿に近い形で築き直している。

      16世紀に入ると、海禁は密貿易と倭寇によって実質的に破られた。
      日本とアメリカ大陸の銀が大量に流入し、税を銀で一本化する一条鞭法が導入される。
      商業が栄えて都市文化が花開く一方、朝廷では宦官と官僚の派閥争いが続いた。
      豊臣秀吉の朝鮮出兵への援軍は、財政を大きく傷つけている。

      17世紀の寒冷化による凶作と重税が農民を追い詰め、各地で反乱が起きた。
      1644年、李自成の軍が北京に入り、崇禎帝は自ら命を絶つ。
      その混乱に乗じて清が山海関を越え、中国の支配者が交代した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/%E6%B0%B8%E4%B9%90%E5%B9%B4%E9%97%B4%E7%9A%84%E6%98%8E%E6%9C%9D%EF%BC%88%E7%B9%81%EF%BC%89.png/500px-%E6%B0%B8%E4%B9%90%E5%B9%B4%E9%97%B4%E7%9A%84%E6%98%8E%E6%9C%9D%EF%BC%88%E7%B9%81%EF%BC%89.png
      credit: 玖巧仔 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:%E6%B0%B8%E4%B9%90%E5%B9%B4%E9%97%B4%E7%9A%84%E6%98%8E%E6%9C%9D%EF%BC%88%E7%B9%81%EF%BC%89.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/明

  - id: qing
    title: 清
    start: 1636
    end: 1912
    category: politics
    tags: [中国, 征服王朝]
    summary: 満洲人の王朝。最大版図を実現したのち、19世紀に列強の圧力で揺らいだ。
    detail: |
      満洲人の愛新覚羅氏が建てた王朝で、1636年から1912年まで続いた。
      版図は中国本土にとどまらず、北の満洲、モンゴル高原、チベット、西の新疆、そして台湾にまで及んだ。
      1644年に北京へ入り、明に代わって中国を治めた。

      支配の要は、満洲人の軍事組織である八旗と、明から受け継いだ官僚制の併用だった。
      中央の要職は満洲人と漢人を同数置き、科挙も続けて漢人の士大夫を体制に取り込む。
      一方で漢人男性に辮髪を強制し、清を批判する文章は文字の獄で厳しく取り締まった。
      モンゴルやチベットは理藩院が管轄し、チベット仏教の保護者として振る舞っている。

      康熙・雍正・乾隆の三代、およそ130年が最盛期にあたる。
      ロシアとネルチンスク条約を結んで北の国境を定め、ジュンガルを滅ぼして新疆を版図に加えた。
      アメリカ大陸原産の作物が広まって食糧生産が増え、人口は1億から3億を超えるまでに伸びる。
      『四庫全書』の編纂に見られるように、学術の整理も国家事業として進められた。

      19世紀に入ると、人口圧力と財政難に外からの圧力が重なる。
      アヘン戦争に敗れて不平等条約を結び、太平天国の乱で国内は荒廃した。
      洋務運動で軍備の近代化を図るが、日清戦争の敗北でその限界が露呈する。
      義和団事件の後に憲法の準備や科挙の廃止など改革が進められたが、遅すぎた。
      1911年の辛亥革命を受けて翌年に皇帝が退位し、2000年続いた帝政が終わった。
      現在の中国の領域の輪郭は、この王朝が作ったものを引き継いでいる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/Flag_of_China_%281889%E2%80%931912%29.svg/500px-Flag_of_China_%281889%E2%80%931912%29.svg.png
      credit: "原作: zh:清朝政府 ベクタ: Sodacan / Public domain"
      page: https://commons.wikimedia.org/wiki/File:Flag_of_China_(1889%E2%80%931912).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/清

  - id: taiping
    title: 太平天国
    start: 1851
    end: 1864
    category: war
    tags: [中国, 内乱, 宗教]
    summary: キリスト教の影響を受けた宗教反乱が南京を14年間支配。死者は数千万に達した。
    detail: |
      洪秀全を指導者とする宗教的な結社が、清に対して起こした大規模な反乱。
      1851年に広西で蜂起し、1864年に南京が陥落するまで14年続いた。
      死者は数千万とされ、19世紀の世界で最も犠牲の多い内戦だった。

      洪秀全は科挙に落ち続けた客家の知識人で、キリスト教の小冊子を読んで幻視を得た。
      自らを神の子でありイエスの弟だと称し、拝上帝会という結社を組織する。
      偶像を壊し、儒教の礼を否定したため在地の秩序と激しく衝突した。
      貧困と人口圧力に苦しむ人々が集まり、宗教は反乱の組織原理になる。

      1853年に南京を落として天京と改称し、独自の国家を築いた。
      土地を均分する天朝田畝制度を掲げ、男女別の組織を作り、纏足やアヘンを禁じる。
      理念は急進的だったが、実際の統治は戦時動員に追われた。
      北伐は失敗し、1856年には指導部内の殺し合いで勢いを失う。

      清の正規軍は役に立たず、鎮圧を担ったのは曽国藩の湘軍や李鴻章の淮軍という地方の義勇軍だった。
      西洋の武器を備えた常勝軍も加わり、列強は条約の利益を守るため清の側についた。
      1864年に天京が落ち、洪秀全はその前に病没している。
      江南の生産地帯は荒廃し、清の財政と人口構成は大きく傷ついた。
      鎮圧を通じて漢人官僚と地方の軍が力を持ち、中央の統制はさらに弱まる。
      この経験が洋務運動へつながり、同時に軍閥が生まれる素地にもなった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Taiping2.PNG/500px-Taiping2.PNG
      credit: Zolo / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Taiping2.PNG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/太平天国の乱

  - id: self-strengthening
    title: 洋務運動
    start: 1861
    end: 1894
    category: science
    tags: [中国, 近代化]
    summary: 西洋の技術だけを取り入れて国を建て直そうとした試み。日清戦争の敗北で限界が露呈した。
    detail: |
      アロー戦争と太平天国の後、清が西洋の技術を取り入れて国力を高めようとした運動。
      1860年代から1890年代前半まで続き、自強運動とも呼ばれる。
      推進したのは、曽国藩・李鴻章・左宗棠・張之洞ら、反乱の鎮圧で実力をつけた地方の高官だった。

      出発点は軍事である。
      上海と南京に兵器工場が作られ、福州には造船所と海軍学校が置かれた。
      ドイツやイギリスから軍艦を買い入れ、北洋艦隊は東アジア有数の規模になる。
      留学生が欧米へ送られ、技術者と外交官が育てられた。
      やがて関連する分野へも広がった。
      汽船会社、炭鉱、電信、紡績、製鉄所が官の主導、あるいは官と商人の共同で設立される。
      翻訳局が置かれ、西洋の科学書が漢文に移された。

      運動の合言葉は、中国の伝統を本体とし、西洋の学問を実用に使うという考え方だった。
      政治の仕組みや教育の中身は変えず、技術だけを導入するという発想である。
      科挙は続き、官僚の価値観も変わらなかった。
      事業は個々の高官の私的な結びつきで運営され、全国的な計画にはならない。

      1894年の日清戦争で北洋艦隊が壊滅し、30年の努力の限界が露わになった。
      同じ時期に始まった日本の改革との差は、制度を変えたかどうかにあったと総括される。
      以後、議論は技術ではなく政治制度の変革へ移り、変法運動と革命へつながっていく。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/洋務運動

  - id: roc-mainland
    title: 中華民国（大陸期）
    start: 1912
    end: 1949
    category: politics
    tags: [中国, 共和制]
    summary: アジア初の共和国。しかし実権は軍閥・国民党・共産党の間で揺れ続けた。
    detail: |
      辛亥革命によって1912年に成立し、1949年まで中国大陸を統治した共和国。
      アジアで最初の共和国だが、実権は軍閥・国民党・共産党のあいだで揺れ続けた。
      首都は北京、のちに南京に置かれた。

      初期は、清の軍を引き継いだ袁世凱が大総統として独裁を敷いた。
      議会を無力化し、1915年には皇帝を称するが、内外の反発で83日で取り消す。
      その死後、北洋軍閥が分裂して各地で抗争し、中央政府は名目だけの存在になった。

      1919年の五四運動は、第一次世界大戦の講和で山東の権益が日本に渡ったことへの抗議から始まった。
      学生と都市の市民が動き、そこから新しい思想と政治運動が広がる。
      孫文の国民党とソ連の支援を受けた共産党が協力し、1926年から北伐が始まった。
      蒋介石は途中で共産党を弾圧し、1928年に南京を首都とする国民政府が全国を名目上統一する。

      1931年の満洲事変から日本の侵攻が続き、1937年に全面戦争になった。
      政府は重慶へ退き、国民党と共産党は再び手を結んで抗戦する。
      1945年の勝利の後、両者の対立は内戦に戻った。
      1949年、共産党が大陸を制し、中華民国政府は台湾へ移る。
      大陸での37年は、統一と分裂、戦争と改革が重なり続けた期間だった。
      近代的な法典・教育制度・産業の基礎はこの時期に築かれ、その多くが以後に引き継がれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Flag_of_the_Republic_of_China.svg/500px-Flag_of_the_Republic_of_China.svg.png
      credit: Sun Yat-sen / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_Republic_of_China.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/中華民国

  - id: warlord-era
    title: 軍閥割拠
    start: 1916
    end: 1928
    category: war
    tags: [中国, 内戦]
    summary: 袁世凱の死後、各地の軍事勢力が割拠した時期。北伐でひとまず収束した。
    detail: |
      袁世凱の死後、各地の軍事勢力が割拠して抗争した時期。
      1916年から、北伐が終わる1928年までを指す。
      北京には中華民国の政府が置かれていたが、実態は北京を押さえた軍閥の政権だった。

      袁世凱が育てた北洋軍は、その死とともに派閥に分かれた。
      段祺瑞の安徽派、呉佩孚らの直隷派、東北の張作霖の奉天派が中央の主導権を争う。
      地方にも、雲南や広西、山西などにそれぞれの軍人が根を張った。
      全国の軍人の数は百万を超え、戦費は現地での徴税とアヘンの取引でまかなわれる。
      政権が変わるたびに内閣と大総統が入れ替わり、憲法も議会も安定しなかった。
      列強はそれぞれ別の軍閥を支援し、国内の抗争が国際的な対立と結びつく。
      農村では重税と徴発が続き、生活は悪化した。

      この状況への反発が、新しい政治運動を育てた。
      五四運動で国民の側から声が上がり、国民党と共産党が組織を整える。
      1926年、広東から北伐が始まり、各地の軍閥を破りながら北上した。
      1928年、張作霖が爆殺された後にその子の張学良が国民政府に従い、名目上の統一が成る。

      ただし軍閥そのものが消えたわけではなかった。
      多くは国民革命軍に編入されただけで、地盤と軍を保ち続ける。
      統一の弱さは、その後の内戦と日本の侵攻への対応を難しくした。
      軍事力が政治を決めるという構図は、この時期に深く刻まれている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/Twelve_Symbols_national_emblem_of_China.svg/500px-Twelve_Symbols_national_emblem_of_China.svg.png
      credit: Sodacan / Public domain
      page: https://commons.wikimedia.org/wiki/File:Twelve_Symbols_national_emblem_of_China.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/北京政府

  - id: second-sino-japanese-war
    title: 日中戦争
    start: 1937
    end: 1945
    category: war
    tags: [中国, 日本]
    summary: 8年に及ぶ全面戦争。共産党が農村で力を伸ばし、戦後の内戦の帰趨を決めた。
    detail: |
      1937年の盧溝橋事件から1945年の日本の降伏まで、8年続いた全面戦争。
      中国では抗日戦争と呼ばれる。
      死者は軍民合わせて1000万を超えるとされ、国土の主要部が戦場になった。

      開戦後、日本軍は北京・天津を制圧し、上海でも激戦の末に優勢に立った。
      同年末に首都の南京が陥落し、多数の捕虜と住民が殺害される。
      国民政府は武漢を経て重慶へ移り、奥地から抗戦を続けた。
      日本は占領地に傀儡の政権を立てたが、広大な農村を押さえきれない。

      戦線は1938年末にほぼ膠着した。
      重慶は繰り返し空襲を受け、支援物資はビルマ経由の陸路と空路で細々と運ばれる。
      国民党軍が正面の戦線を担う一方、共産党は華北の農村で遊撃戦を展開した。
      減税と土地の調整で農民の支持を集め、党員と軍は大きく増える。

      1941年に太平洋戦争が始まると、中国は連合国の一員となった。
      米国の援助が入り、日本は中国戦線に大兵力を拘束され続ける。
      1945年8月、日本の降伏によって戦争は終わった。
      中国は戦勝国となり、不平等条約は撤廃され、台湾が返還された。
      国内では、戦争を通じて共産党が農村に根を張り、国民党は消耗と腐敗で信望を落とす。
      戦後すぐに再開した内戦の帰趨は、この8年のあいだにかなりの部分が決まっていた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/8/85/Second_Sino-Japanese_War_collection.png
      credit: Ai6z83xl3g / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Second_Sino-Japanese_War_collection.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/日中戦争

  - id: prc
    title: 中華人民共和国
    start: 1949
    ongoing: true
    category: politics
    tags: [中国, 現代]
    summary: 内戦に勝利した共産党が建国。1978年以降の改革開放で経済大国へ。
    detail: |
      国共内戦に勝利した共産党が、1949年10月1日に建国した国家。
      首都は北京で、中国大陸とその周辺を統治している。
      建国から現在まで、共産党の一党指導体制が続く。

      最初の10年は、土地改革と国有化、ソ連式の計画経済で進んだ。
      朝鮮戦争への参戦で国際的には西側と対立し、経済はソ連の援助に依存する。
      1958年からの大躍進は、急激な集団化と増産の号令によって大規模な飢饉を招いた。
      1966年からの文化大革命では、権力闘争が全国的な動乱となり、教育と文化財が10年にわたり破壊される。

      1971年に国連での代表権を得て、翌年にはニクソン訪中で米国と和解した。
      1976年に毛沢東が没すると、路線は大きく転換する。
      1978年から鄧小平のもとで改革開放が始まり、農村では生産責任制、沿海部では経済特区が導入された。
      計画経済から市場経済への移行が、共産党の指導を保ったまま進められる。

      1989年の天安門事件で政治的な自由化は退けられ、経済の自由化と政治の統制を組み合わせる路線が固まった。
      2001年のWTO加盟で世界の生産網に組み込まれ、二桁成長が続く。
      2010年には日本を抜いて世界第2の経済規模になった。
      現在は、技術と軍事の面でも米国と並ぶ存在として扱われている。
      一方で、人口の高齢化、地域と所得の格差、台湾をめぐる緊張という課題を抱える。
      70年余りのあいだに、農業国から世界最大の工業国へ移った変化の速さが、この国家の特徴である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Flag_of_the_People%27s_Republic_of_China.svg/500px-Flag_of_the_People%27s_Republic_of_China.svg.png
      credit: Zeng Liansong / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_People%27s_Republic_of_China.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/中華人民共和国

  - id: great-leap-forward
    title: 大躍進
    start: 1958
    end: 1962
    category: economy
    tags: [中国, 現代]
    summary: 急激な工業化・集団化が大飢饉を招き、数千万人が犠牲になったとされる。
    detail: |
      1958年から始まった、農業と工業の急激な増産をめざす運動。
      毛沢東の主導で人民公社が全国に作られ、短期間で先進国に追いつくと号令された。
      結果は大規模な飢饉で、1962年までに数千万人が犠牲になったとされる。

      農村では、村を単位とする協同組合が統合されて人民公社になった。
      数千戸が一つの単位となり、土地も農具も家畜も共有され、共同の食堂で食事をとる。
      労働の成果と報酬の結びつきは薄れ、生産の意欲は下がった。
      工業では、鉄鋼の生産量でイギリスを追い越すという目標が掲げられた。
      各地に土法高炉と呼ばれる簡易な炉が作られ、農民が鍋や農具を溶かして鉄を作る。
      できたのは使い物にならない粗悪な鉄で、その作業のために収穫期の人手が奪われた。
      農業でも、密植や深耕といった根拠の乏しい方法が強制される。

      各地の幹部は達成の実績を競い、収穫量を大きく水増しして報告した。
      中央はその数字を信じて供出量を決め、農村からは食糧が取り上げられる。
      1959年の廬山会議で政策を批判した彭徳懐が失脚すると、誤りを指摘する声は消えた。

      飢饉の規模は、20世紀で最大級のものになった。
      1962年に政策は事実上放棄され、劉少奇や鄧小平が実務の調整に当たる。
      この失敗が路線対立を生み、4年後の文化大革命の伏線になった。
      数字を競わせる統治が現実を見えなくする例として、繰り返し検証されている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/大躍進政策

  - id: cultural-revolution
    title: 文化大革命
    start: 1966
    end: 1976
    category: society
    tags: [中国, 現代]
    summary: 権力闘争が全国的な動乱に発展し、教育と文化財が10年にわたって破壊された。
    detail: |
      1966年から1976年まで、中国全土を巻き込んだ政治運動。
      正式には無産階級文化大革命といい、毛沢東が発動した。
      文化の刷新を掲げながら、実質は党内の実務派から権力を奪い返す闘争だった。

      大躍進の失敗の後、経済の立て直しは劉少奇や鄧小平が主導していた。
      毛沢東は、この路線が資本主義への逆戻りだと批判する。
      1966年、党中央の通知を機に運動が始まり、学生を中心とする紅衛兵が組織された。
      古い思想・文化・風俗・習慣を打破するという名目で、寺院や文物が大量に破壊される。

      教師や知識人、党の幹部が集会で吊るし上げられ、暴行を受けた。
      劉少奇は失脚して獄中で死に、鄧小平も職を追われる。
      各地で紅衛兵の派閥どうしが武力衝突し、収拾のため軍が投入された。
      大学の入学試験は停止され、都市の若者数千万人が農村へ送られる。

      1971年、後継者とされた林彪が失脚して墜死し、運動の正当性は大きく揺らいだ。
      その後は毛沢東夫人の江青ら四人組と、周恩来や鄧小平ら実務派の対立が続く。
      1976年に毛沢東が没すると四人組は逮捕され、翌年に運動の終結が宣言された。
      犠牲者の数は百万単位とされるが、正確な統計はない。
      10年にわたり教育と研究が止まり、世代ごと学ぶ機会を失った。
      党はこれを全面的な誤りと総括し、その反省が改革開放への転換を後押しした。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cb/Mao_Zedong_19661001.jpg/500px-Mao_Zedong_19661001.jpg
      credit: 孟昭瑞 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Mao_Zedong_19661001.jpg
    links:
      - label: Wikipedia（文化大革命）
        url: https://ja.wikipedia.org/wiki/文化大革命

events:
  - id: battle-of-muye
    year: -1046
    title: 牧野の戦い
    category: war
    tags: [中国, 王朝交代]
    summary: 周が殷を倒し、「天命が革まる」という王朝交代の理屈がここから語られるようになった。
    detail: |
      周の武王が殷の帝辛（紂王）を破った戦いで、殷から周への交代を決めた一戦。
      場所は殷の都の郊外、現在の河南省新郷のあたりとされる。
      年代には諸説があり、前1046年は中国の夏商周断代工程が示した値である。

      殷は末期に東方への遠征を重ねて力を消耗し、諸侯の離反を招いていた。
      『史記』などによれば、武王は不満を抱く諸侯を集めて東へ進み、帝辛の軍と牧野で向かい合う。
      殷の側は数で勝ったが、急いで動員された人々が戦わずに退いたため、戦いは一日で決したと伝わる。
      帝辛は都に戻って自ら火に入り、600年近く続いた殷は倒れた。

      武王は殷の王族に祭祀を継がせつつ、弟たちを周囲に置いて監視させた。
      武王の死後に起きた反乱を周公旦が鎮め、東方の拠点として洛邑を築いて支配を固める。
      この過程で、一族に土地を分けて統治させる封建の形が定まっていった。

      周はこの勝利を、暴政によって天命を失った王から、徳のある者へ命が移ったのだと説明した。
      王朝の交代を天命の移動として語る型はここから始まり、易姓革命の考え方として後代まで使われる。
      新しい支配者が前の王朝の最後の王を暴君として描く書き方も、同時に始まっている。
      紂王の悪行の多くは後世の脚色とみる研究者が多い。
      周が自らの正当性をどう語ったかは、『書経』に収められた文章を通して長く読み継がれた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/f/f0/China_1.jpg
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:China_1.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/牧野の戦い
    related: [shang, zhou]

  - id: zhou-move-east
    year: -770
    title: 周の東遷
    category: politics
    tags: [中国]
    summary: 都を洛邑へ移して王室が弱体化し、諸侯が実力で競う春秋時代に入った。
    detail: |
      周が都を西の鎬京から東の洛邑へ移した出来事で、春秋時代の始まりとされる。
      これ以降の周を東周と呼ぶ。
      前771年に都が落ち、翌年に平王が即位して移った、という順で語られる。

      『史記』は、幽王が寵愛する褒姒のために太子を廃したことから王后の実家が反発し、異民族の犬戎を招いて鎬京を攻めさせたと伝える。
      幽王は殺され、周の本拠だった関中は失われた。
      諸侯に守られて平王は洛邑に入るが、王はもはや諸侯の力に頼る立場になっていた。

      洛邑の周王は直轄地も軍も小さく、諸侯を動かす力を持たなかった。
      残ったのは祭祀と称号の権威だけで、有力な諸侯はそれを借りて覇者を名乗る。
      王を尊ぶという建前と、実力で序列が決まる現実という二重構造が、この時代の政治を形づくった。
      諸侯は王に代わって外交と戦争を取り仕切り、会盟で秩序を決めるようになる。

      以後550年にわたり、中国は分裂と競争の時代に入る。
      その競争が各国の制度改革と思想の展開を促し、最後は秦の統一に行き着いた。
      周王室は前256年まで存続するが、政治の中心に戻ることはなかった。
      後世の儒者は、この東遷を秩序が崩れ始めた分かれ目として繰り返し論じている。
      王が権威だけを持ち、実務は有力者が握るという構図は、のちの東アジアでも繰り返し現れる。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/3/36/Chunqiu_map-zh-classical.png
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Chunqiu_map-zh-classical.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/春秋時代

  - id: confucius-born
    year: -551
    circa: true
    title: 孔子の生誕
    category: religion
    tags: [中国, 儒学]
    summary: 秩序をどう回復するかという問いへの答えが、2000年以上にわたり東アジアの規範になった。
    detail: |
      春秋時代の魯に生まれた思想家で、儒家の祖とされる。
      生年は前552年とも前551年ともいわれ、没年は前479年。
      名は丘、字は仲尼で、孔子の「子」は先生を意味する尊称である。

      下級貴族の家に生まれ、早くに父を失い、倉庫や牧場の管理といった実務から身を起こしたと伝わる。
      魯で官職に就くが政争に敗れ、その後14年ほど諸国を巡って自分の考えを用いてくれる君主を探した。
      各地で冷遇され、受け入れられないまま帰国する。
      晩年は弟子の教育と古典の整理に力を注いだ。

      説いたのは、力や刑罰ではなく、人への思いやりである仁と、振る舞いの形である礼によって秩序を保つことだった。
      血筋ではなく学びと修養によって君子になれるとし、身分の低い弟子も受け入れている。
      弟子は3000人、優れた者が72人いたと伝えられる。
      言行は死後に弟子たちがまとめ、『論語』になった。

      生前は成功した政治家ではなかったが、漢代に儒学が官学とされてから評価が定まる。
      科挙の科目として1300年以上、官僚が学ぶべき教えであり続け、朝鮮・日本・ベトナムにも広がった。
      家族や上下の関係をどう扱うかという問いに、東アジアの標準的な答えを与えた人物である。
      生まれた魯の曲阜には孔子廟が建てられ、子孫は近代まで衍聖公として特別な家柄であり続けた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/孔子

  - id: shang-yang-reform
    year: -356
    title: 商鞅の変法
    category: society
    tags: [中国, 法家]
    summary: 血筋でなく功績で人を遇する制度を秦に敷き、のちの統一の土台を作った。
    detail: |
      戦国時代の秦で、法家の商鞅が孝公のもとに行った国政改革。
      前356年と前350年の二度にわたるとされる。
      血筋ではなく働きで人を測る仕組みを、国ぐるみで作ったところに特徴がある。

      商鞅は衛の公族の出身で、魏で用いられなかったのち、人材を求める孝公の布告に応じて秦に入った。
      戸籍を整えて人々を五戸・十戸の組に編み、罪を互いに告発させる連坐を敷く。
      農耕と織物で多く納めた者は労役を免じ、商業や定職を持たない者は重く扱う、農業と戦争を優先する方針をとった。
      軍功に応じて爵位を与える等級制（のちの二十等爵）を定め、功のない王族の特権を削っている。

      第二次の改革では都を咸陽に移し、全国を県に分けて中央から役人を送った。
      土地の区画を改めて売買を認め、度量衡も統一する。
      法は身分を問わず適用され、太子の罪でその教育係が代わりに罰せられたという話が、その厳しさを伝えている。

      孝公の死後、商鞅は恨みを買って追われ、挙兵して敗れ、遺体は車裂きにされたと伝わる。
      それでも作った制度は残り、秦は人と物を数えて動かせる国家になった。
      郡県・戸籍・軍功による昇進という組み合わせは、統一後の中国の統治の基本形になっていく。
      法によって国を動かすという考え方は、儒学が表の看板になったあとも実務の裏側で生き続けた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Statue_of_Shang_Yang.jpg/500px-Statue_of_Shang_Yang.jpg
      credit: Taken by Fanghong / CC BY 2.5
      page: https://commons.wikimedia.org/wiki/File:Statue_of_Shang_Yang.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/商鞅

  - id: qin-unification
    year: -221
    title: 秦の始皇帝が中国を統一
    category: politics
    tags: [中国, 統一]
    summary: 戦国の争いを終わらせ、皇帝という称号と中央集権の型を作った。
    detail: |
      秦王政が最後に残った斉を降し、戦国七雄の争いを終わらせた年。
      前230年の韓を皮切りに、趙・魏・楚・燕・斉の順で10年のうちに片づけた。
      勝った政は、王という称号では足りないとして、新たに皇帝を名乗る。

      統一を支えたのは、商鞅以来の制度だった。
      戸籍で人をつかみ、軍功で爵位を与え、法と文書で動かす仕組みが、長い戦争に耐える動員力を生んでいる。
      関中という守りやすい地の利と、鄭国渠などの灌漑による食糧の余裕も大きかった。
      他国から来た范雎や李斯のような人材を登用できたことも効いている。

      統一後は李斯の案を採って封建を退け、全土を36の郡に分けて中央から官を置いた。
      文字は小篆に揃えられ、度量衡・貨幣・車軸の幅も統一される。
      旧六国の武器は集めて鋳つぶされ、有力者は都に集められた。

      秦そのものは15年で滅ぶが、この年に決まった枠組みは漢以降も使われ続けた。
      中国は一つであるべきだという考え方の出発点であり、分裂のたびに再統一が目指される理由にもなっている。
      皇帝という称号は、1912年の清朝の終わりまで2100年余り続いた。
      一方で、統一の速さに制度の定着が追いつかず、旧六国の人々の不満は残った。
      その不満は、始皇帝の死とともに各地の反乱として噴き出すことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/QinShiHuang19century.jpg/500px-QinShiHuang19century.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:QinShiHuang19century.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/始皇帝
    related: [qin, shang-yang-reform]

  - id: burning-of-books
    year: -213
    title: 焚書坑儒
    category: society
    tags: [中国, 思想統制]
    summary: 思想の統一をはかって書物を焼き学者を弾圧。秦が短命に終わる一因ともされる。
    detail: |
      秦の始皇帝が行った思想統制で、前213年の焚書と、翌年の学者の処刑を合わせた呼び名。
      焚書は書物を焼くこと、坑儒は学者を穴に埋めることを指す。
      いずれも丞相の李斯の献策によるとされる。

      きっかけは、封建制に戻すべきだと説いた儒者の発言だった。
      李斯は、昔を引き合いに出して今の政治を批判する風潮こそ危ういと述べ、医薬・占い・農業の書と秦の記録を除いて、民間が持つ書物を焼かせた。
      詩書を論じ合った者は死刑、昔を持ち出して今を非難した者は一族まで罰すると定められている。

      翌年、不老不死の薬を探させていた方士が始皇帝を謗って逃げたため、咸陽の学者460人余りが穴に埋められたと『史記』は伝える。
      ただし処刑されたのは方士が中心で、儒者への弾圧として語られるのは後代の色づけだという見方も強い。
      諫めた長男の扶蘇は、北辺の長城の守りへ送られた。

      これによって多くの古典が失われ、漢代には記憶や壁の中から復元する作業が必要になった。
      その過程で、復元の経路の違いから今文・古文という学派の分かれ目も生まれている。
      焚書坑儒は、思想を力で揃えようとして人心を失った例として語り継がれ、言論弾圧の代名詞になった。
      実際にどれだけの書が失われたかは分かっておらず、宮廷には写しが残されていたとも言われる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Killing_the_Scholars%2C_Burning_the_Books.jpg/500px-Killing_the_Scholars%2C_Burning_the_Books.jpg
      credit: Anonymous 18th century Chinese painted album leaf; Bibliothèque nationale Paris Accedssion No Oe-5-RFol.-Oe-5a-fol. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Killing_the_Scholars,_Burning_the_Books.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/焚書坑儒

  - id: chen-sheng-rebellion
    year: -209
    title: 陳勝・呉広の乱
    category: war
    tags: [中国, 反乱]
    summary: 農民が起こした中国史上初の大規模反乱。秦の崩壊を早めた。
    detail: |
      秦の末に起きた、中国史上初とされる大規模な農民反乱。
      北辺の守備に徴発された900人ほどの農民が、大沢郷で蜂起した。
      指導者の陳勝と呉広は、いずれも雇われ農民の出身である。

      大雨で道が水没して行軍が遅れ、期日に遅れれば斬という秦の法に追い込まれた。
      どうせ死ぬなら大きな事を、と陳勝は引率の役人を殺して立ち上がる。
      王侯や将軍・宰相の家柄に生まれつきなどあるものか、という言葉が『史記』に記されている。
      一行は陳を落として国号を張楚と称し、陳勝は王を名乗った。

      反乱は各地に飛び火し、旧六国の遺臣や地方の有力者も次々に挙兵した。
      しかし寄せ集めの軍は、章邯が率いる秦軍に各地で破られる。
      呉広は仲間に殺され、陳勝も半年ほどで御者に殺されて、張楚は消えた。

      乱そのものは短命だったが、秦の崩壊は決定的になり、項羽や劉邦の挙兵につながった。
      身分によらず誰でも天下を取りうるという主張は、その後の反乱の合言葉になる。
      重い負担に追い詰められた農民の蜂起が王朝を倒すという型は、黄巾・紅巾・太平天国へと繰り返された。
      司馬遷は『史記』で陳勝を諸侯に準じる扱いで記し、その意義を認めている。
      一人の農民の蜂起が帝国を揺るがした例として、後世の反乱者はこの名を繰り返し引いた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Qin_Uprisings.png/500px-Qin_Uprisings.png
      credit: SY / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Qin_Uprisings.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/陳勝・呉広の乱

  - id: battle-of-gaixia
    year: -202
    title: 垓下の戦い
    category: war
    tags: [中国]
    summary: 劉邦が項羽を破り、漢の400年が始まった。
    detail: |
      楚漢戦争の決着をつけた戦いで、現在の安徽省霊璧県のあたりで行われた。
      劉邦の漢軍が項羽の楚軍を包囲し、項羽はここで敗れて自ら命を絶つ。
      4年続いた争いが終わり、漢の400年が始まった。

      両者はいったん鴻溝を境に天下を分ける約束を結び、項羽は東へ引き上げた。
      劉邦は張良らの進言でこれを破って追撃するが、単独では勝てず、韓信と彭越に領土を約束して合流させる。
      数十万の兵が垓下に集まり、消耗していた楚軍を幾重にも囲んだ。

      夜、囲みの中に楚の歌が響き、項羽は楚の人々まで漢に降ったと悟ったと伝わる。
      これが四面楚歌の故事で、項羽は虞美人を前に別れの詩を詠んだとされる。
      わずかな手勢で囲みを破って逃れたが、烏江のほとりで追いつかれ、渡河を勧められても応じずに自刎した。

      この勝敗は、個人の武勇と人を用いる力の対比として語られてきた。
      項羽は戦に強かったが論功を惜しんで人を離し、劉邦は諸将に領土を与えて味方につけた。
      『史記』の項羽本紀は敗者を英雄として描き、中国文学でもっとも読まれる場面の一つになっている。
      四面楚歌は、味方がすべて離れた状況を指す言葉として今も使われている。
      劉邦はこの勝利ののち皇帝の位に就き、長安を都に定めた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/垓下の戦い

  - id: emperor-wu
    year: -141
    title: 武帝の即位
    category: politics
    tags: [中国, 漢]
    summary: 匈奴への反攻と西域経営で版図を広げ、内には中央集権を強めた。
    detail: |
      16歳の劉徹が前漢の第7代皇帝として即位した年。
      ここから54年の治世が始まり、漢は守りから攻めへ転じる。
      前漢の性格を決めた分かれ目として扱われる。

      即位した当初は、道家の教えを好む祖母の竇太后が実権を握っていた。
      若い皇帝が登用した儒者たちはいったん退けられ、改革は止まる。
      前135年に竇太后が没すると、武帝は自ら政治を動かし始めた。

      最初に変えたのは匈奴への向き合い方だった。
      劉邦以来60年続いた、絹と皇女を贈って戦を避ける和親をやめ、大軍を草原へ送る方針に切り替える。
      同時に、諸侯王の領地を子弟に分割させて力を削ぎ、地方の豪族を都の近くに移して中央の統制を強めた。

      外への拡大と内への集権が同時に進んだ結果、版図は最大になり、統治の制度も整った。
      一方で遠征と土木の費用は重く、専売や増税として民に跳ね返っている。
      積み上げた蓄えを使い切って版図を得たこの治世は、拡大の利と害をともに示す例として論じられてきた。
      即位の年に建元という年号が定められ、以後の東アジアは元号で年を数えるようになった。
      若い皇帝が祖母の死を待って方針を変えたという経緯は、宮廷の力関係が政策を左右した例でもある。
      この年を境に、漢は北と西へ出ていく国になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/Liu_Che_%28Emperor_Wu_of_Han%29.png/500px-Liu_Che_%28Emperor_Wu_of_Han%29.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Liu_Che_(Emperor_Wu_of_Han).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/武帝_(漢)

  - id: confucianism-official
    year: -136
    title: 儒学が国の学問になる
    category: religion
    tags: [中国, 儒学]
    summary: 五経博士が置かれ、儒学が官僚を育てる正統の学問として定着した。
    detail: |
      前漢の武帝のもとで、儒学が国家公認の学問として定まった出来事。
      前136年に五経を教える博士の職が置かれたことが、その画期とされる。
      諸子百家のうち儒家だけが官の後ろ盾を得た。

      中心にいたのは董仲舒で、天と人は互いに感応すると説いた。
      君主が政治を誤れば天が災害や異変で警告するという枠組みは、皇帝の権威を天によって支えると同時に、それを諫める根拠にもなる。
      彼は、儒学以外の学説を官の場から退けるよう献策したと伝えられる。

      前124年には太学が置かれ、博士のもとで経書を学ぶ学生が育てられた。
      地方から人物を推薦させる郷挙里選と結びついたことで、経書を学ぶことが官職への道になる。
      学問の内容と官僚の選抜が一つにつながった点が、この決定の要である。

      これ以降、儒学は2000年にわたり中国の正統の学問であり続けた。
      隋唐の科挙に引き継がれ、朝鮮・日本・ベトナムの官制にも及んでいる。
      国家が特定の思想を採用して官僚を育てるという仕組みは、東アジアの政治文化の土台になった。
      儒学が国家に採用された代償として、学問が体制を支える役割を負ったという批判もある。
      実際の政治は法家的な手法で動かされ、儒学は建前として働く場面も多かった。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/4/4a/Konfuzius.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Konfuzius.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/儒教

  - id: silk-road-zhang-qian
    year: -139
    title: 張騫の西域派遣
    category: economy
    tags: [中国, シルクロード]
    summary: 匈奴に対抗する同盟を探す旅が、結果的に東西交易路の情報をもたらした。
    detail: |
      武帝が匈奴を挟み撃ちにする同盟を求めて、張騫を西方の大月氏へ送った出来事。
      出発は前139年ごろで、100人余りの一行だった。
      結果として同盟は成らなかったが、漢は初めて西域のまとまった情報を得る。

      一行は出てまもなく匈奴に捕らえられ、10年余り抑留された。
      妻を与えられ子もできたが、使者の証である節を手放さず、隙を見て脱出する。
      大宛・康居を経て、すでにアム川の流域へ移っていた大月氏にたどり着いた。

      大月氏は新しい土地で安定しており、匈奴への復讐に関心を示さなかった。
      帰路でふたたび匈奴に捕まり、内紛に乗じて逃れて前126年に長安へ戻る。
      生きて帰ったのは張騫ともう1人だけだった。
      前119年には烏孫へ二度目の使者として赴き、副使を各国に分け送っている。

      持ち帰られたのは、西域の国々の位置・兵力・産物と、そこから先にインドがあるという知識だった。
      汗血馬と呼ばれる大宛の馬を求めて遠征が行われ、ブドウやウマゴヤシが中国に入る。
      司馬遷はこの旅を、道を切り開いたという意味で鑿空と評した。
      以後、河西四郡と西域都護が置かれ、シルクロードが定期的な交易路として動き始める。
      使者が持ち帰った地理の知識は、『史記』の大宛列伝としてまとめられた。
      シルクロードという呼び名は19世紀の造語だが、その原型はここから動き始める。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Zhangqian_Statue.jpg/500px-Zhangqian_Statue.jpg
      credit: 千里走单骑 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Zhangqian_Statue.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/張騫

  - id: cai-lun-paper
    year: 105
    title: 蔡倫が製紙法を改良
    category: science
    tags: [中国, 技術]
    summary: 安く大量に作れる紙が生まれ、記録と学問のあり方が変わった。
    detail: |
      後漢の宦官である蔡倫が、改良した紙の製法を和帝に献じたと『後漢書』が記す年。
      紙そのものは前漢の遺跡からも出ており、蔡倫は発明者というより実用化した人物と見るのが今の理解である。
      安く大量に作れるようになったことが画期だった。

      それまで記録は竹や木の札か絹に書かれていた。
      札は重くかさばり、書物一つで車に積むほどの量になる。
      絹は軽いが高価で、日常の記録には使えなかった。
      蔡倫は宮中の工房を監督する立場にあり、材料と工程の改良を進める立場にいた。

      樹皮・麻くず・使い古した布・漁網を砕いて煮て、繊維をほぐしてから簀で漉く方法が整えられた。
      どこにでもある材料で作れるため、値段は大きく下がる。
      この紙は蔡侯紙と呼ばれ、3世紀から4世紀にかけて木や竹の札を置き換えていった。

      記録と学問にかかる費用が変わり、書物の写しが広く出回るようになった。
      文書で動く官僚制も、紙があって初めて大きくなれる。
      製法は8世紀に西へ伝わってイスラム世界に広まり、12世紀にはヨーロッパにも達した。
      木版印刷や活字と結びついて、知識の広がり方そのものを変えた技術である。
      蔡倫自身は宮廷の政争に巻き込まれ、121年に毒をあおって死んでいる。
      発明の年として105年が記憶されるのは、献上の記事が史書に残っているためである。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/b/be/Cai-lun.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Cai-lun.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/蔡倫

  - id: yellow-turban
    year: 184
    title: 黄巾の乱
    category: war
    tags: [中国, 宗教, 反乱]
    summary: 宗教結社による大反乱。鎮圧に動いた群雄が割拠し、後漢は有名無実になった。
    detail: |
      後漢の末に、太平道という宗教結社が起こした大規模な反乱。
      目印として黄色い頭巾を巻いたことから黄巾と呼ばれる。
      指導者は教祖の張角で、184年に一斉蜂起した。

      背景には、外戚と宦官が争う宮廷の乱れと、飢饉や疫病に苦しむ農村があった。
      張角は札を浸した水と呪文で病を治すと説いて、10年ほどで数十万の信者を集める。
      信者は36の集団に分けられ、それぞれに指導者が置かれていた。
      蒼い天はすでに死に、黄色い天が立つ、という文句を掲げて漢の終わりを唱えた。

      計画は密告で漏れ、予定を早めて各地で同時に立ち上がる。
      反乱は8つの州に広がったが、張角が病死し、皇甫嵩らの官軍に主力は9か月ほどで破られた。
      このとき朝廷は、鎮圧のため地方の長官や豪族に兵を持つことを認めている。

      乱そのものは鎮まったが、兵を握った者たちがそのまま軍閥になった。
      曹操・劉備・孫堅らが世に出るのもこの戦いで、やがて董卓の専横と群雄割拠が続く。
      後漢の皇帝は名だけの存在となり、三国時代へ向かっていく。
      宗教結社が農民の不満を組織して王朝を揺るがす型は、白蓮教や太平天国へと繰り返された。
      反乱の鎮圧に功のあった者が地方に根を張り、中央の統制はここで切れた。
      三国の物語が始まる年として、東アジアでよく知られた出来事でもある。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Yellow_Turban_Rebellion.jpg/500px-Yellow_Turban_Rebellion.jpg
      credit: SY / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Yellow_Turban_Rebellion.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/黄巾の乱

  - id: han-end
    year: 220
    title: 後漢の滅亡と魏の成立
    category: politics
    tags: [中国, 王朝交代]
    summary: 400年の漢が終わり、統一が回復するまで約60年を要した。
    detail: |
      曹丕が後漢の献帝から位を譲られ、魏を建てた出来事。
      前漢から数えて400年余り続いた漢が、ここで終わる。
      中国が再び統一されるのは60年後である。

      献帝は190年に董卓によって立てられた皇帝で、196年から曹操の手元にあった。
      朝廷の儀礼は保たれていたが、実務も軍も曹氏が握っている。
      220年に曹操が死ぬと、子の曹丕が魏王と丞相を継ぎ、その年のうちに譲位の手続きが進められた。
      献帝は山陽公として領地を与えられ、命を奪われることなく余生を送っている。

      譲位は、三たび辞退してから受けるという形式を踏んで行われた。
      この作法はのちの王朝交代でそのまま使われ、実力での奪取を儀礼で覆う定型になる。
      翌221年、劉備は漢の正統を継ぐとして蜀漢を立て、229年には孫権も皇帝を称した。

      漢という名は、滅んだあとも強い意味を持ち続けた。
      以後も、正統を主張する勢力が繰り返し漢を国号に選んでいる。
      王朝は倒れたが、儒学を修めた官僚が皇帝を支えるという漢の統治の形は残った。
      人々が自らを漢人と呼ぶ習慣も、この王朝の名から離れなかった。
      献帝が命を保ったことも、以後の譲位のふるまいの手本とされた。
      400年続いた王朝の終わりは、それ自体が長い分裂の始まりでもあった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/%E4%B8%89%E5%9B%BD%E8%A1%8C%E6%94%BF%E5%8C%BA%E5%88%92%28%E7%B9%81%29.png/500px-%E4%B8%89%E5%9B%BD%E8%A1%8C%E6%94%BF%E5%8C%BA%E5%88%92%28%E7%B9%81%29.png
