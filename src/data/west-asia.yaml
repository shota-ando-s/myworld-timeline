        url: https://ja.wikipedia.org/wiki/新アッシリア帝国

  - id: neo-babylon
    title: 新バビロニア
    start: -626
    end: -539
    category: politics
    tags: [メソポタミア]
    summary: アッシリアを倒して栄えた短い王国。空中庭園と天文学で知られる。
    detail: |
      アッシリアを倒してメソポタミアを支配した王国で、紀元前626年から539年まで続いた。
      カルデア人のナボポラッサルが建て、その子ネブカドネザル2世の代に最盛期を迎える。
      87年という短い期間ながら、強い印象を歴史に残した。

      ナボポラッサルはバビロンでアッシリアに反旗を翻し、東のメディアと同盟を結んだ。
      紀元前612年、連合軍はアッシリアの都ニネヴェを落とす。
      残存勢力も609年に滅び、旧アッシリア領は両国で分け合われた。
      ネブカドネザル2世は、エジプトと争ってシリア・パレスチナを確保した。
      ユダ王国を滅ぼしてエルサレムの神殿を破壊し、住民をバビロンへ連行する。
      この出来事が、後の一神教の歴史に大きな影を落とした。

      都のバビロンは、当時の世界で最大級の都市になった。
      二重の城壁に囲まれ、青い釉薬の煉瓦で飾られたイシュタル門が参道に立つ。
      王が妃のために作ったと伝えられる空中庭園は、世界の七不思議に数えられた。
      ただしその実在には疑問も出されており、別の都市の庭園との混同という説もある。

      学問では天文学が発達した。
      長期にわたる観測記録が蓄積され、月食の周期や惑星の運行が計算できるようになる。
      この知識はギリシアへ伝わり、占星術の体系にもつながった。
      最後の王ナボニドゥスは伝統的な神官層と対立し、紀元前539年にペルシアのキュロス2世に都を明け渡すことになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cb/Neo-Babylonian_Empire_%28greatest_extent%29.svg/500px-Neo-Babylonian_Empire_%28greatest_extent%29.svg.png
      credit: Ali Zifan / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Neo-Babylonian_Empire_(greatest_extent).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/新バビロニア

  - id: achaemenid
    title: アケメネス朝ペルシア
    start: -550
    end: -330
    category: politics
    tags: [ペルシア]
    summary: エジプトからインダスまでを結んだ大帝国。寛容な統治と王の道で知られる。
    detail: |
      紀元前550年から330年まで、オリエント全域を支配したイラン系の帝国。
      エジプトからインダス川まで、東西5000キロに及ぶ領域を一つの行政のもとに置いた。
      古代で最大規模の帝国であり、統治の技術で後世に大きな影響を残した。

      キュロス2世が建て、カンビュセス2世がエジプトを征服して版図を完成させた。
      ダレイオス1世の代に制度が整えられる。
      領内は20以上の州に分けられ、それぞれに総督が置かれた。
      総督は徴税と治安を担うが、軍の指揮権と会計は別の官が持ち、権力が集中しないようにされている。
      王の目・王の耳と呼ばれる監察官が各地を巡回し、総督を見張った。

      交通網も整備された。
      スサからサルディスまで約2500キロの王の道が通り、宿駅が置かれる。
      駅伝の使者は1週間ほどでこの距離を走破したと伝えられる。
      金貨と銀貨が発行され、税は銀で納められた。

      寛容な統治も特徴である。
      征服地の宗教と言語と慣習を認め、現地の有力者を行政に用いた。
      公用語には、西アジアで広く通じていたアラム語が使われている。
      王たちはゾロアスター教のアフラ・マズダーを奉じたが、他の信仰を強制しなかった。
      ギリシアへの遠征は失敗し、以後は西方での拡大が止まる。
      紀元前330年、アレクサンドロスに滅ぼされた。
      しかし州制・駅伝・寛容な支配という仕組みは、その後の帝国に受け継がれていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Standard_of_Cyrus_the_Great.svg/500px-Standard_of_Cyrus_the_Great.svg.png
      credit: Sodacan / Public domain
      page: https://commons.wikimedia.org/wiki/File:Standard_of_Cyrus_the_Great.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アケメネス朝

  - id: seleucid
    title: セレウコス朝
    start: -312
    end: -63
    category: culture
    tags: [ヘレニズム, ペルシア]
    summary: アレクサンドロスの後継国家。ギリシア語と都市が西アジアに根づいた。
    detail: |
      アレクサンドロスの死後、その部将セレウコスが建てた王国。
      紀元前312年から63年まで続き、最大時にはシリアからイラン高原、中央アジアまでを領した。
      ヘレニズム諸国のなかで最も広い版図を持つ。

      都は当初ティグリス河畔のセレウキアに置かれ、後にシリアのアンティオキアへ移った。
      支配層はギリシア人とマケドニア人で、行政の言語はギリシア語である。
      各地にギリシア風の都市が建設され、市民がギリシア本土から入植した。
      都市には劇場・体育場・神殿が備えられ、ギリシアの生活様式が持ち込まれた。
      同時に、現地の宗教や慣習との混交も進む。
      ギリシア語が東西の共通語となり、学問と商業の言語として広がった。

      しかし版図の維持は難しかった。
      紀元前3世紀半ばには、東のバクトリアとパルティアが相次いで独立する。
      西ではプトレマイオス朝エジプトとシリアの領有を争い、繰り返し戦った。
      ローマとの戦いに敗れて小アジアを失い、多額の賠償を負う。

      ユダヤでは、王が神殿にギリシアの神を祀ろうとしたことから反乱が起きた。
      マカバイの戦いを経て、ユダヤは自立する。
      領土は次第にシリア一帯にまで縮み、紀元前63年にローマのポンペイウスによって併合された。
      ギリシア語と都市文化が西アジアに根づいたことは、後のキリスト教の広がりの条件にもなる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1d/Vergina_Sun_WIPO.svg/500px-Vergina_Sun_WIPO.svg.png
      credit: ‍Philly boy92 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Vergina_Sun_WIPO.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/セレウコス朝

  - id: parthia
    title: パルティア
    start: -247
    end: 224
    category: politics
    tags: [ペルシア]
    summary: ローマと数百年にわたり対峙し、東西交易の中継で富んだ。
    detail: |
      イラン系の遊牧民が建てた王国で、紀元前247年ごろから後224年まで続いた。
      セレウコス朝から自立し、イラン高原とメソポタミアを支配した。
      ローマと数百年にわたって対峙し、東西交易の中継で富んだ。

      建国者の名からアルサケス朝とも呼ばれる。
      カスピ海南東の地方から興り、セレウコス朝の弱体化に乗じて領土を広げた。
      紀元前2世紀半ばには、バビロニアまでを支配下に置く。
      統治は緩やかだった。
      各地の王や有力者に自治を認め、中央は名目的な宗主にとどまる。
      ギリシア語も使われ続け、貨幣にはギリシア文字が刻まれた。
      この分権的な性格は、大きな戦争では弱点にもなる。

      軍の主力は騎兵である。
      重装の騎兵と、馬上から矢を射る軽騎兵を組み合わせた。
      退きながら後ろへ射るパルティアンショットは、ローマ人に強い印象を残している。
      紀元前53年のカルラエの戦いでは、クラッスス率いるローマ軍を壊滅させた。

      以後、ローマとは数世紀にわたり抗争と和平を繰り返した。
      メソポタミアが戦場になり、双方が決定的な勝利を得られない状態が続く。
      中国からローマへ絹を運ぶ交易路の中間に位置し、その利益が国を支えた。
      ローマと漢の双方の記録にその名が現れる。
      度重なる戦争で消耗し、224年に配下のササン家に取って代わられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cb/Parthian_Empire%2C_1st_century.png/500px-Parthian_Empire%2C_1st_century.png
      credit: Kaiser&Augstus&Imperator / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Parthian_Empire,_1st_century.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/パルティア

  - id: sasanian
    title: ササン朝ペルシア
    start: 224
    end: 651
    category: politics
    tags: [ペルシア, ゾロアスター教]
    summary: ペルシア文化の復興を掲げた帝国。イスラム勢力に滅ぼされた。
    detail: |
      イラン高原とメソポタミアを支配した帝国で、224年から651年まで続いた。
      パルティアを倒したアルダシール1世が建て、ペルシア文化の復興を掲げた。
      君主は諸王の王を意味するシャーハーンシャーを称する。

      都はティグリス河畔のクテシフォンに置かれた。
      パルティアの緩やかな支配と異なり、中央集権的な統治をめざしている。
      ゾロアスター教が国教とされ、神官団が国家の制度に組み込まれた。
      王権は宗教によって正当化され、異端や他の宗教への統制も強まる。
      西ではローマ、のちにビザンツ帝国と400年にわたって戦い続けた。
      メソポタミアとアルメニアが主な係争地となり、どちらも決定的な勝利を得られない。
      3世紀にはローマ皇帝を捕虜にし、6世紀には和平と戦争を繰り返した。
      東では中央アジアの遊牧勢力と対峙し、エフタルに苦しめられた時期もある。

      文化の面では、東西の中継地としての性格が濃い。
      中国の絹とインドの香辛料が領内を通り、絹織物と銀器の技法が各地へ伝わった。
      インド由来の説話やチェスの原型も受け入れられ、ペルシア語に訳されている。
      ホスロー1世の時代には、ギリシアから逃れた哲学者を受け入れた。

      7世紀初め、ビザンツとの総力戦で双方が疲弊した。
      そこへアラビア半島から興ったイスラム勢力が進出する。
      642年のニハーヴァンドの戦いで大敗し、651年に最後の王が殺されて滅んだ。
      行政の仕組みと宮廷文化は、イスラム王朝に大きな影響を残した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Derafsh_kaviani.svg/500px-Derafsh_kaviani.svg.png
      credit: "原作: Azarmidoxt ベクタ: ReneeWrites / CC BY-SA 4.0"
      page: https://commons.wikimedia.org/wiki/File:Derafsh_kaviani.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/サーサーン朝

  - id: rashidun
    title: 正統カリフ時代
    start: 632
    end: 661
    category: religion
    tags: [イスラム]
    summary: ムハンマドの死後30年で、シリア・エジプト・ペルシアを制した急拡大の時期。
    detail: |
      ムハンマドの死後、共同体を率いた4人の指導者の時代。
      632年から661年までの約30年にあたる。
      カリフとは後継者・代理人を意味し、預言者の役割のうち共同体の統率を引き継ぐ。

      最初のアブー・バクルは、離反した部族との戦いをまとめ、アラビア半島の統一を回復した。
      続くウマルの時代に、征服は爆発的に進む。
      シリア、エジプト、イラクを奪い、ササン朝を事実上崩壊させた。
      短期間で拡大できた理由は複数ある。
      ビザンツとササン朝が長年の戦争で消耗していたこと。
      征服地の住民が重税と宗教的な圧迫に不満を抱いていたこと。
      改宗を強制せず、人頭税を払えば信仰を保てる仕組みをとったことである。

      第3代のウスマーンの時代に、クルアーンの公式な本文がまとめられた。
      一方で、一族の重用が反発を招き、彼は殺害される。
      第4代のアリーの時期には内戦が起き、共同体は分裂した。

      アリーが暗殺されると、シリア総督のムアーウィヤがカリフとなりウマイヤ朝が始まる。
      後の時代のスンナ派は、この4人を正しく導かれた指導者として特別に扱った。
      シーア派は、預言者の血筋を継ぐアリーこそ最初の正統な指導者だとする。
      誰が共同体を率いるべきかという問いが、この30年のうちに宗派の分岐を生んだ。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/41/Rashidun_Caliphate%2C_Ali_ibn_Abi_Talib_period%28656%29.png/500px-Rashidun_Caliphate%2C_Ali_ibn_Abi_Talib_period%28656%29.png
      credit: Kaiser&Augstus&Imperator / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Rashidun_Caliphate,_Ali_ibn_Abi_Talib_period(656).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/正統カリフ

  - id: umayyad
    title: ウマイヤ朝
    start: 661
    end: 750
    category: politics
    tags: [イスラム]
    summary: 大西洋から中央アジアまで拡大した最初のイスラム世襲王朝。
    detail: |
      イスラム史上最初の世襲王朝で、661年から750年まで続いた。
      都はシリアのダマスカスに置かれた。
      西は大西洋から東は中央アジアまで、史上有数の版図を築いた。

      ムアーウィヤがカリフの位を子に継がせたことで、選挙で指導者を選ぶ形は終わった。
      共同体の合意ではなく、王朝としての支配へ移ったことになる。
      この転換は当初から批判され、内乱を招いている。
      拡大は急速だった。
      北アフリカを西へ進み、711年にはイベリア半島へ渡って西ゴート王国を滅ぼす。
      732年にはフランク王国の軍とトゥール・ポワティエ間で衝突し、そこで西への進出は止まった。
      東では中央アジアのサマルカンドやインダス川流域まで支配が及ぶ。

      統治の骨格はアブドゥルマリクの代に整えられた。
      行政の言語がアラビア語に統一され、独自の金貨と銀貨が発行される。
      エルサレムには岩のドームが建てられた。

      一方で、アラブ人を優位に置く体制が不満を生んだ。
      非アラブの改宗者は、同じ信者でありながら税や待遇で差をつけられる。
      イランやイラクではこの不満が広がり、預言者の一族を担ぐ運動と結びついた。
      750年、アッバース家が率いる反乱で王朝は倒される。
      一族の一人がイベリアへ逃れ、後ウマイヤ朝を建てた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/Umayyad_Caliphate%2C_Abd_al-Malik_ibn_Marwan_period%28705%29.png/500px-Umayyad_Caliphate%2C_Abd_al-Malik_ibn_Marwan_period%28705%29.png
      credit: Kaiser&Augstus&Imperator / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Umayyad_Caliphate,_Abd_al-Malik_ibn_Marwan_period(705).png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウマイヤ朝

  - id: abbasid
    title: アッバース朝
    start: 750
    end: 1258
    category: culture
    tags: [イスラム, バグダード]
    summary: バグダードを中心に、ギリシア・インドの学問を継承発展させた黄金期。
    detail: |
      750年から1258年まで続いたイスラム王朝で、ウマイヤ朝に代わって成立した。
      都はバグダードで、イスラム文明の黄金期を築いた。
      アラブ人だけでなく、改宗した各民族を同じ信者として扱う体制へ転換した点が大きい。

      革命はイラン東部のホラーサーンから起きた。
      アラブ人優位の体制に不満を持つ改宗者と、預言者の一族を支持する人々が結びつく。
      預言者の叔父の子孫であるアッバース家が指導し、ウマイヤ朝を倒した。
      統治は、ササン朝以来のペルシア的な官僚制を取り入れた形になる。
      宰相が行政を統括し、書記と裁判官が文書と法で国を動かす。
      イスラム法の学派がこの時期に整い、社会の規範として定着した。

      学問の発展が、この王朝の最大の遺産である。
      バグダードでは、ギリシア語の哲学・医学・数学がアラビア語に翻訳された。
      インドから数字と天文学が入り、中国から製紙法が伝わって書物が普及する。
      代数学、光学、医学、天文学で独自の成果が積み上げられた。
      その蓄積が12世紀以降にラテン語へ訳し戻され、ヨーロッパの学問を立ち上げ直す。

      9世紀後半から、各地の総督が自立して版図は縮んだ。
      946年にはブワイフ朝、1055年にはセルジューク朝に都を押さえられ、カリフは宗教的な権威だけの存在になる。
      1258年、モンゴル軍がバグダードを陥落させて王朝は滅んだ。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/Abbasid_banner.svg/500px-Abbasid_banner.svg.png
      credit: Ec.Domnowall / Public domain
      page: https://commons.wikimedia.org/wiki/File:Abbasid_banner.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アッバース朝

  - id: seljuk
    title: セルジューク朝
    start: 1037
    end: 1194
    category: politics
    tags: [トルコ系, イスラム]
    summary: トルコ系が西アジアの支配層になり、十字軍を招く直接の原因にもなった。
    detail: |
      トルコ系の遊牧民が建てた王朝で、11世紀から12世紀にかけて西アジアを支配した。
      中央アジアから移動してきたオグズ系の部族が母体である。
      トルコ系の勢力が西アジアの支配層になる転換点になった。

      一族の長セルジュークの子孫が、イラン東部で自立して勢力を広げた。
      1055年にはバグダードへ入り、カリフからスルタンの称号を得る。
      宗教的な権威をカリフが、実際の統治と軍事をスルタンが担う形がここで定まった。

      統治にはイラン系の官僚が重用された。
      宰相ニザーム・アルムルクは、統治論を著すとともに各地にマドラサと呼ばれる学院を設立する。
      スンナ派の法学と神学が体系的に教えられ、官僚と法学者が育てられた。
      軍人には土地の徴税権を与えて軍役に充てる仕組みが整えられる。

      1071年、マンジケルトの戦いでビザンツ軍を破り、皇帝を捕虜にした。
      これによってアナトリアへのトルコ系の移住が始まり、その地は次第にトルコ化していく。
      ビザンツが西欧に救援を求めたことが、十字軍を招く直接の原因になった。
      帝国は広大だったが、一族で領土を分ける慣行のため分裂しやすかった。
      12世紀には各地の政権に分かれ、1194年に本流は滅びる。
      アナトリアのルーム・セルジューク朝は13世紀まで続き、後のオスマン帝国が生まれる土壌になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/Flag_of_the_Seljuk.png/500px-Flag_of_the_Seljuk.png
      credit: Koocheki / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_Seljuk.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/セルジューク朝

  - id: ilkhanate
    title: イルハン朝
    start: 1256
    end: 1353
    category: politics
    tags: [モンゴル, ペルシア]
    summary: モンゴルがイランに築いた国。やがて支配層自身がイスラムを受け入れた。
    detail: |
      モンゴル帝国がイランを中心に築いた政権で、1256年から1353年まで続いた。
      チンギス・ハンの孫フレグが西方遠征の末に建てた。
      名は、大ハーンに従う地方の君主という意味を持つ。

      フレグはアサシンと呼ばれた山城の教団を滅ぼし、1258年にバグダードを陥落させた。
      シリアへも進んだが、1260年のアイン・ジャールートでマムルーク朝に敗れ、西への拡大は止まる。
      都はタブリーズに置かれ、アムダリヤ川からアナトリア東部までを支配した。
      当初の支配者は、仏教やキリスト教に好意的で、ムスリムの住民との距離があった。
      マムルーク朝との対立から、ヨーロッパの君主に同盟を持ちかける使節も送っている。

      転機は1295年のガザン・ハンの改宗である。
      支配層がイスラムを受け入れ、モンゴルの政権がイスラム王朝として振る舞うようになった。
      税制を整理し、農民の負担を定め、荒れた農地の回復を図る改革も行われる。

      文化の面では、東西の交流が著しく進んだ。
      中国の絵画の技法が細密画に取り入れられ、天文学や医学の知識が行き交う。
      宰相ラシードゥッディーンは、モンゴル・中国・インド・ヨーロッパを含む世界史を編んだ。
      これは世界を一つの視野で叙述した最初期の試みとされる。
      1330年代から後継争いで分裂し、地方政権に取って代わられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/10/Flag_of_the_Ilkhanate.svg/500px-Flag_of_the_Ilkhanate.svg.png
      credit: Martin23230 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_Ilkhanate.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イルハン朝

  - id: ottoman
    title: オスマン帝国
    start: 1299
    end: 1922
    category: politics
    tags: [イスラム, トルコ]
    summary: 三大陸にまたがり600年続いた帝国。ヨーロッパ史とも深く絡み合う。
    detail: |
      アナトリアの小さな君侯国から始まり、600年以上続いた帝国。
      1299年ごろの成立から1922年の廃止まで、三大陸にまたがる領域を支配した。
      ヨーロッパ・西アジア・北アフリカの歴史に深く関わり続けた。

      初期は、ビザンツとの境界で戦う辺境の集団だった。
      14世紀にバルカン半島へ渡り、1453年にコンスタンティノープルを落として都とする。
      16世紀のセリム1世とスレイマン1世の代に、シリア・エジプト・ハンガリーまでを領した。

      統治の特徴は、多民族と多宗教を抱える仕組みにある。
      キリスト教徒とユダヤ教徒は宗派ごとの共同体として自治を認められ、人頭税を納めた。
      バルカンの少年を徴用して官僚や兵士に育てるデヴシルメの制度があり、そこから歩兵軍団のイェニチェリが編成される。
      出自によらず能力で高位に就けるため、宰相の多くは改宗した非トルコ系の出身だった。

      1683年の二度目のウィーン包囲の失敗を境に、領土は縮み始める。
      ロシアとオーストリアに押され、19世紀にはバルカンの諸民族が独立していった。
      西洋式の軍と法を導入する改革が進められ、1876年には憲法も制定される。
      第一次世界大戦でドイツ側に立って敗れ、領土の大半を失った。
      この過程でアルメニア人に対する大規模な殺害が行われている。
      独立戦争を経て1922年にスルタン制が廃され、翌年トルコ共和国が成立した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8e/Flag_of_the_Ottoman_Empire_%281844%E2%80%931922%29.svg/500px-Flag_of_the_Ottoman_Empire_%281844%E2%80%931922%29.svg.png
      credit: User:Orwellianist / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_Ottoman_Empire_(1844%E2%80%931922).svg
    links:
