        url: https://ja.wikipedia.org/wiki/ヤルムークの戦い

  - id: nahavand
    year: 642
    title: ニハーヴァンドの戦い
    category: war
    tags: [イスラム, ペルシア]
    summary: ササン朝が事実上崩壊し、イランがイスラム世界に組み込まれていく。
    detail: |
      イスラム勢力とササン朝が戦った決戦で、642年にイラン西部のニハーヴァンドで行われた。
      ササン朝はこの敗北で組織的な抵抗力を失い、事実上崩壊した。
      アラブ側はこれを勝利のなかの勝利と呼んでいる。

      639年にカーディシーヤで敗れ、都のクテシフォンを失った後も、ササン朝は各地で軍を集めていた。
      王ヤズデギルド3世はイラン高原の奥へ退き、反攻の機会をうかがう。
      642年、各州から集めた大軍がニハーヴァンドに布陣した。
      アラブ軍は数で劣っていた。
      山がちな地形に構えた敵陣を攻めあぐね、偽りの退却で誘い出す戦術をとる。
      陣を離れたササン朝軍は隊形を崩し、反転した攻撃で壊滅した。

      この後、イラン各地の都市は個別に降伏していく。
      ヤズデギルド3世は東へ逃れ続け、651年にメルヴ近郊で殺された。
      400年続いた帝国はここで終わる。

      イランのイスラム化は、征服の直後に一気に進んだわけではない。
      数世紀をかけて改宗が広がり、ゾロアスター教徒は少数派になっていった。
      一方で、ササン朝の行政制度と宮廷文化はイスラム王朝に受け継がれる。
      税の仕組み、官僚の組織、庭園や建築の様式がそれにあたる。
      ペルシア語はアラビア文字で書かれる形で生き残り、後に豊かな文学を生んだ。
      征服された側の文化が、征服した側の帝国を形づくった例でもある。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ニハーヴァンドの戦い

  - id: karbala
    year: 680
    title: カルバラーの悲劇
    category: religion
    tags: [イスラム, シーア派]
    summary: ムハンマドの孫が殺され、スンナ派とシーア派の分裂が決定的になった。
    detail: |
      ムハンマドの孫フサインが、ウマイヤ朝の軍に囲まれて殺された事件。
      680年、現在のイラクのカルバラーで起きた。
      スンナ派とシーア派の分裂を決定的にした出来事である。

      ムアーウィヤが没し、子のヤズィードがカリフを継いだ。
      アリーの子であるフサインは、この世襲を認めず忠誠を拒む。
      クーファの人々から支援の申し出を受け、家族と従者を連れてメッカを発った。

      しかしクーファの支持は総督の弾圧で崩れ、援軍は来なかった。
      一行はカルバラーで数千のウマイヤ朝軍に包囲される。
      従う者は70数人にすぎなかった。
      川からの水を断たれたまま数日を過ごし、降伏を拒んだ末に全滅した。
      フサインの首はダマスカスへ送られている。

      軍事的には小さな戦闘だが、その意味は大きい。
      預言者の血を引く孫が、イスラム国家の軍に殺されたという事実が残った。
      シーア派にとって、これは不正な権力に対して信仰を貫いた殉教として記憶される。
      毎年のアーシューラーの日には、この受難を追悼する行事が各地で行われる。
      胸を打ち、嘆きの詩を唱え、受難劇を演じる儀礼が伝わってきた。
      カルバラーは聖地となり、巡礼の対象になっている。
      正しい指導者が不正な権力に倒されるという物語は、後の時代の政治運動でも繰り返し引かれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Brooklyn_Museum_-_Battle_of_Karbala_-_Abbas_Al-Musavi_-_overall.jpg/500px-Brooklyn_Museum_-_Battle_of_Karbala_-_Abbas_Al-Musavi_-_overall.jpg
      credit: Abbas Al-Musavi / Public domain
      page: https://commons.wikimedia.org/wiki/File:Brooklyn_Museum_-_Battle_of_Karbala_-_Abbas_Al-Musavi_-_overall.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カルバラーの戦い

  - id: baghdad-founded
    year: 762
    title: バグダードの建設
    category: society
    tags: [イスラム, 都市]
    summary: 円形の計画都市として築かれ、100万人規模の世界最大級の都市になった。
    detail: |
      アッバース朝の第2代カリフ、マンスールが新しい都を築いた出来事。
      762年、ティグリス川の西岸に建設が始まった。
      平安の都を意味する名が与えられ、やがて世界最大級の都市になる。

      場所の選定には、はっきりした理由があった。
      ティグリスとユーフラテスが近づき、運河で結ばれる交通の要地である。
      ペルシア湾からインド洋へ、また陸路で中央アジアと地中海へ通じる。
      支持基盤であるイラン方面にも近い。
      最初に築かれたのは、直径2キロを超える円形の城市だった。
      二重の城壁に囲まれ、四方に門が開き、中心にカリフの宮殿と礼拝所が置かれる。
      幾何学的な設計は、支配の中心を目に見える形で示すものだった。

      都市は城壁の外へ急速に広がった。
      9世紀には人口が100万に達したと推定され、当時の世界で最大級の都市になる。
      各地から商人・学者・職人が集まり、市場には中国の陶磁器、インドの香辛料、アフリカの象牙が並んだ。
      中国から伝わった製紙の技術で紙が普及し、書物の生産と流通が一気に増える。

      知恵の館と呼ばれる施設では、翻訳と研究が組織的に進められた。
      天文台が置かれ、観測と計算が積み重ねられる。
      9世紀のバグダードは、同時代の世界で学問の中心と呼べる場所だった。
      1258年のモンゴルによる破壊で、その地位は失われる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/5628442718_b10fc2c47f_o.jpg/500px-5628442718_b10fc2c47f_o.jpg
      credit: USACE HQ , JIM GORDAN, CIV, USACE / Public domain
      page: https://commons.wikimedia.org/wiki/File:5628442718_b10fc2c47f_o.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/バグダード

  - id: house-of-wisdom
    year: 830
    circa: true
    title: 知恵の館
    category: science
    tags: [イスラム, 翻訳]
    summary: ギリシア・インドの学問をアラビア語に訳し、代数学や天文学を発展させた。
    detail: |
      バグダードに置かれた学術の施設で、830年ごろにカリフのマアムーンが整備した。
      ギリシア語やサンスクリットの書物をアラビア語に訳し、研究を行う拠点になった。
      翻訳運動と呼ばれる大事業の中心である。

      前提となる条件がいくつも重なっていた。
      中国から伝わった製紙の技術で紙が安く手に入るようになり、書物の生産が容易になる。
      ビザンツやインドとの交渉で写本が集まり、カリフが財政的に支援した。
      シリア語を介してギリシアの学問に通じたキリスト教徒の学者が、翻訳の担い手になる。
      訳されたのは、アリストテレスの哲学、プトレマイオスの天文学、エウクレイデスの幾何学、ガレノスの医学などである。
      翻訳は逐語訳から始まり、やがて内容を理解したうえでの意訳へ進んだ。
      フナイン・イブン・イスハークら専門の翻訳者が育ち、訳語も整えられていく。

      施設は単なる図書館ではなかった。
      天文台が併設され、観測と計算が行われる。
      数学者や技術者が集まり、機械の設計や地図の作成にも取り組んだ。
      訳された知識をもとに、代数学・光学・医学で新しい成果が生まれる。

      この蓄積は、12世紀以降にスペインやシチリアでラテン語へ訳し戻された。
      ギリシアの古典の多くは、アラビア語訳を経由してヨーロッパに戻っている。
      知識が一つの文明にとどまらず、翻訳を通じて受け渡されることを示した例である。
      1258年のモンゴルによるバグダード破壊で、この拠点は失われた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/Maqamat_hariri.jpg/500px-Maqamat_hariri.jpg
      credit: Zereshk / Public domain
      page: https://commons.wikimedia.org/wiki/File:Maqamat_hariri.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/知恵の館

  - id: al-khwarizmi
    year: 820
    circa: true
    title: フワーリズミーの代数学
    category: science
    tags: [数学]
    summary: 「アルゴリズム」の語源になった学者。方程式を体系的に解く方法を示した。
    detail: |
      9世紀のバグダードで活動した数学者・天文学者による、代数学の体系化。
      主著は820年ごろに書かれた、移項と同類項の整理についての書である。
      方程式を解く手順を、一般的な方法として示した。

      それまでの数学は、個々の問題に対する解法の集まりという性格が強かった。
      フワーリズミーは、二次方程式を六つの型に分類し、それぞれについて解く手順を記述した。
      記号ではなく言葉で書かれているが、考え方は現在の代数と同じである。
      図形による証明も添えられている。

      書名に含まれるアル・ジャブルという語が、ラテン語を経て代数を意味するアルジェブラになった。
      著者の名のラテン語形は、計算の手順を意味するアルゴリズムという語の語源である。
      現代の情報技術の語彙が、この時代の学者に由来していることになる。
      インドから伝わった十進法の数字と、ゼロを用いた位取りの記法を紹介したことも大きい。
      この記法はアラビア数字としてヨーロッパへ伝わり、ローマ数字に取って代わった。
      筆算による計算が誰にでもできるようになり、商業と会計が大きく変わる。

      ほかに、天文表の作成や、プトレマイオスの地理書を改訂した著作も残した。
      知恵の館で翻訳と研究に携わり、ギリシアとインドの成果を統合している。
      12世紀にこれらの書がラテン語へ訳され、ヨーロッパの数学の出発点になった。
      知識が地域を超えて受け渡される過程の、典型的な例である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/d/dd/Al-Khwarizmi_portrait.jpg
      credit: Michel Bakni / Public domain
      page: https://commons.wikimedia.org/wiki/File:Al-Khwarizmi_portrait.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フワーリズミー

  - id: seljuk-baghdad
    year: 1055
    title: セルジューク朝のバグダード入城
    category: politics
    tags: [トルコ系, カリフ]
    summary: カリフは宗教的権威に退き、実権はスルタンが握る形が定着した。
    detail: |
      セルジューク朝のトゥグリル・ベクがバグダードに入城した出来事で、1055年のこと。
      カリフからスルタンの称号を受け、イスラム世界の権力の形が定まった。
      宗教の権威と世俗の権力が分かれる体制が、ここから標準になる。

      当時のアッバース朝のカリフは、政治的な実権をほとんど失っていた。
      946年以来、イラン系でシーア派のブワイフ朝が都を押さえ、カリフを事実上の傀儡としている。
      スンナ派のカリフにとって、シーア派の保護下にあることは受け入れがたい状況だった。
      そこへ、スンナ派を奉じるトゥグリルが軍を率いて到着する。
      カリフはこれを歓迎し、ブワイフ朝は排除された。
      トゥグリルは礼をもってカリフに接し、その権威を認める姿勢を示す。

      与えられたのは、東方と西方の王という称号だった。
      カリフが宗教的な正統性を授け、スルタンが軍事と行政を担うという分業が公認される。
      カリフは統治の実務から退き、信仰共同体の象徴として存続することになった。

      この形は、その後のイスラム世界で繰り返し用いられる。
      実力で権力を握った軍人が、カリフの承認によって支配の正当性を得るという手続きである。
      オスマン帝国のスルタンも、この系譜の上に位置づけられた。
      宗教と政治の関係をどう整理するかという問いに、一つの実践的な答えが与えられた出来事だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/Flag_of_the_Seljuk.png/500px-Flag_of_the_Seljuk.png
      credit: Koocheki / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_Seljuk.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/セルジューク朝

  - id: jerusalem-crusade
    year: 1099
    title: 十字軍のエルサレム占領
    category: war
    tags: [十字軍]
    summary: 住民の大量殺害を伴い、以後の対立の記憶として長く残った。
    detail: |
      第1回十字軍がエルサレムを占領した出来事で、1099年7月のこと。
      5週間の包囲の末に城壁を破り、市内に入った。
      住民の大量殺害を伴い、その記憶が長く残ることになる。

      1095年、ビザンツ皇帝の要請を受けたローマ教皇が聖地の回復を呼びかけた。
      数万の兵と民衆が東へ向かい、アナトリアを越えてシリアへ進む。
      内部の対立で数を減らしながらも、アンティオキアを落として南下した。
      エルサレムを守っていたのはファーティマ朝の守備隊だった。
      十字軍は木材を集めて攻城塔を組み、水の乏しいなかで包囲を続ける。
      7月15日に城壁を突破し、市内へなだれ込んだ。

      その後の殺戮は、キリスト教側の記録にも生々しく残されている。
      ムスリムとユダヤ教徒が無差別に殺され、避難していた人々も助からなかった。
      死者の数には諸説あるが、都市の人口の相当部分が失われたとみられる。

      占領後、エルサレム王国が建てられ、周辺に十字軍国家が並んだ。
      しかし支配は不安定で、1187年にサラディンによって奪回される。
      この出来事は、イスラム世界では長く語られなかったが、近代以降は西洋の侵略の象徴として引かれるようになった。
      宗教の名のもとに行われた暴力の記憶が、現在の政治の言葉にまで影を落としている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Peter_the_Hermit.jpg/500px-Peter_the_Hermit.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Peter_the_Hermit.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第1回十字軍

  - id: saladin-jerusalem
    year: 1187
    title: サラディンのエルサレム奪回
    category: war
    tags: [イスラム, 十字軍]
    summary: 寛大な処置が敵味方の双方に語り継がれ、騎士道の理想像にもなった。
    detail: |
      サラディンがエルサレムを十字軍から奪い返した出来事で、1187年10月のこと。
      88年間続いたキリスト教勢力による支配が終わった。
      開城にあたっての寛大な処置が、敵味方の双方に語り継がれている。

      同年7月のヒッティーンの戦いが前提にある。
      エルサレム王国は総力を挙げて出陣したが、水のない台地で包囲され壊滅した。
      国王も捕らえられ、防衛の兵はほとんど残っていない。
      諸都市が次々に降伏するなか、エルサレムは短期間の抵抗の後に交渉に入った。
      守備側は、抵抗すれば聖所を破壊すると警告したとも伝えられる。
      合意は、身代金を払えば住民は財産を持って退去できるというものだった。

      金額を払えない貧しい人々も、多くが解放された。
      サラディン自身と弟が身代金を肩代わりした例も記録されている。
      1099年に十字軍が行った殺戮とは対照的な処置として、ヨーロッパの年代記にも記された。

      キリスト教徒の巡礼は認められ、聖墳墓教会も保たれた。
      岩のドームからは十字架が外され、モスクとしての機能が回復される。
      この報せはヨーロッパに衝撃を与え、第3回十字軍が組織された。
      リチャード1世とサラディンの戦いと交渉は、後の騎士道物語の題材になっていく。
      敵に対する寛大さが政治的にも有効でありうることを示した例である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Battle_of_Cresson.jpg/500px-Battle_of_Cresson.jpg
      credit: ジャン・コロンブ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Battle_of_Cresson.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヒッティーンの戦い

  - id: ibn-sina
    year: 1025
    circa: true
    title: イブン・シーナー『医学典範』
    category: science
    tags: [医学, イスラム]
    summary: ヨーロッパの大学でも600年にわたり使われた医学の教科書。
    detail: |
      イラン出身の学者イブン・シーナーが著した医学書で、1025年ごろに完成した。
      5巻からなる大部の書で、当時の医学の知識を体系的にまとめている。
      ヨーロッパの大学でも600年にわたり教科書として使われた。

      著者は980年ごろに中央アジアで生まれ、若くして医学で名を知られた。
      各地の君主に仕えながら執筆を続け、哲学の分野でも大きな著作を残している。
      アリストテレスの哲学とイスラムの神学を統合する試みは、後のヨーロッパのスコラ学にも影響を与えた。

      医学典範は、ギリシアのガレノスの医学を基礎に、インドやペルシアの知識を統合したものである。
      第1巻で医学の原理と人体の仕組みを説き、第2巻で単独の薬を扱う。
      第3巻は頭から足へ器官ごとの病気を、第4巻は熱病など全身の病を、第5巻は調合薬を論じる。
      必要な項目をすぐ引ける構成が、教科書として使いやすかった。

      内容には、現在にも通じる観察が含まれる。
      結核が人から人へうつること、水が病気を運ぶこと、心が体に及ぼす影響などが記された。
      薬の効果を確かめるための条件も論じられている。
      12世紀にラテン語へ訳され、パリやモンペリエの大学で長く用いられた。
      印刷術が普及した後も版を重ね、17世紀まで参照され続けている。
      イスラム世界の学問がヨーロッパの医学を支えた、最も分かりやすい例である。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/b/b2/Avicenna.jpg
