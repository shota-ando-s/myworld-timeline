  - id: safavid
    title: サファヴィー朝
    start: 1501
    end: 1736
    category: religion
    tags: [イラン, シーア派]
    summary: シーア派を国教とし、現在のイランの宗教的な輪郭を作った。
    detail: |
      16世紀から18世紀前半にかけてイランを支配した王朝で、1501年から1736年まで続いた。
      シーア派の十二イマーム派を国教と定めた。
      現在のイランの宗教的な輪郭は、この王朝が作ったものである。

      起源はアゼルバイジャン地方の神秘主義教団にある。
      教団の指導者が信者を武装させ、トルコ系の遊牧部族を率いて政権を打ち立てた。
      赤い帽子をかぶった彼らはキジルバシュと呼ばれ、初期の軍事力の中核になる。
      イスマーイール1世は、それまでスンナ派が多数だった地域でシーア派を強制した。
      周囲のオスマン帝国とウズベクはいずれもスンナ派であり、宗派の違いが国家の境界と重なる。
      これがイランの独自性を支える枠組みになった。

      最盛期はアッバース1世の治世である。
      軍を再編して常備軍を整え、オスマンとウズベクから失地を回復した。
      都をイスファハーンに移し、壮麗な広場とモスクを造営する。
      ヨーロッパの商人と使節を受け入れ、絹の輸出で富を得た。
      この世界の半分と称えられるほど、都は繁栄する。

      18世紀に入ると、アフガン系の勢力の侵入で急速に衰えた。
      1736年に王朝は終わるが、シーア派を国教とする体制はその後のイランに引き継がれる。
      宗教が国家の枠組みを規定するという点で、その影響は現在まで続いている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Safavid_Flag.svg/500px-Safavid_Flag.svg.png
      credit: "Safavid_Flag.png: Orange Tuesday (talk) オリジナルのアップロード者は英語版ウィキペディアのOrange Tuesdayさん derivative work: Himasaram (talk) / Public domain"
      page: https://commons.wikimedia.org/wiki/File:Safavid_Flag.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/サファヴィー朝

  - id: qajar
    title: ガージャール朝
    start: 1789
    end: 1925
    category: politics
    tags: [イラン]
    summary: 英露に挟まれて利権を切り売りし、立憲革命と石油利権の時代を迎えた。
    detail: |
      18世紀末から20世紀初めまでイランを支配した王朝で、1789年ごろから1925年まで続いた。
      トルコ系の部族出身の一族が建て、テヘランを都とした。
      イギリスとロシアに挟まれ、利権を切り売りしながら独立を保った。

      成立は、ナーディル・シャーの死後の混乱を収める形で進んだ。
      初期には領土を回復したが、19世紀に入るとロシアとの戦いに連敗する。
      1813年と1828年の条約で、コーカサスの領土と治外法権を認めさせられた。
      以後、ロシアとイギリスがイランの南北で影響圏を争う。

      財政難に対して、政府は外国への利権の売却で対応した。
      たばこの専売権をイギリス人に与えたときは、宗教指導者の呼びかけで全国的な不買運動が起き、撤回に追い込まれる。
      この出来事は、宗教勢力が政治を動かす力を持つことを示した。
      1906年、立憲革命が起きる。
      商人と宗教指導者と知識人が連帯し、議会の開設と憲法の制定を実現した。
      しかし翌年の英露協商でイランは南北に勢力圏を分けられ、議会はロシアの介入で閉鎖される。

      1908年に南西部で石油が発見され、利権はイギリスの会社が握った。
      第一次世界大戦では中立を宣言しながら、各国の軍が国土を通過する。
      1921年のクーデタで実権を握ったレザー・ハーンが、1925年に王朝を廃した。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/Tricolour_Flag_of_Iran_%281886%29.svg/500px-Tricolour_Flag_of_Iran_%281886%29.svg.png
      credit: Orange Tuesday / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Tricolour_Flag_of_Iran_(1886).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ガージャール朝

  - id: pahlavi
    title: パフラヴィー朝
    start: 1925
    end: 1979
    category: politics
    tags: [イラン, 近代化]
    summary: 上からの急速な西欧化が社会の反発を生み、イスラム革命で倒れた。
    detail: |
      イラン最後の王朝で、1925年から1979年まで続いた。
      軍人のレザー・ハーンが建て、子のモハンマド・レザーが継いだ。
      上からの急速な西欧化が社会の反発を生み、イスラム革命で倒れる。

      初代のレザー・シャーは、中央集権と近代化を強力に進めた。
      徴兵制による国軍を整え、部族を武装解除し、鉄道を敷いた。
      世俗の学校と裁判所を設け、宗教指導者の影響力を抑える。
      女性のヴェールを禁じるなど、生活の様式にも介入した。

      第二次世界大戦中、ドイツへの接近を警戒した英ソが進駐し、レザー・シャーは退位させられる。
      若い子のモハンマド・レザーが即位した。
      1951年には首相モサデグが石油を国有化するが、2年後に英米が関与したクーデタで失脚する。
      この事件以後、国王は米国の支援を背景に権力を集中させた。

      1963年から白色革命と呼ばれる改革が始まる。
      農地改革、女性参政権、識字運動などが上から進められた。
      石油収入で経済は成長したが、富の偏りと腐敗が広がる。
      秘密警察が反対派を弾圧し、宗教指導者も国外へ追われた。
      1970年代後半、抗議運動が全国に広がった。
      1979年、国王は出国し、亡命していたホメイニが帰国してイスラム共和国が成立する。
      急速な西欧化が伝統的な社会の支持を失ったことが、王朝の終わりを決めた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/State_flag_of_Iran_%281964%E2%80%931980%29.svg/500px-State_flag_of_Iran_%281964%E2%80%931980%29.svg.png
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:State_flag_of_Iran_(1964%E2%80%931980).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/パフラヴィー朝

  - id: iran-iraq-war
    title: イラン・イラク戦争
    start: 1980
    end: 1988
    category: war
    tags: [中東, 現代]
    summary: 8年で100万人規模の死者を出した消耗戦。中東の力関係を大きく変えた。
    detail: |
      イランとイラクが1980年から1988年まで戦った戦争。
      死者は両国で100万人規模とされ、20世紀後半で最も長い通常戦争の一つである。
      決定的な勝敗はつかなかった。

      発端は、イラクによる侵攻である。
      国境を流れる水路の帰属をめぐる対立に加え、革命直後のイランの混乱に乗じる狙いがあった。
      イラン国内のシーア派の革命が自国に波及することへの警戒も強い。
      緒戦でイラクは領内へ攻め込んだが、イランは動員した志願兵で押し返した。
      1982年以降は戦線が膠着し、第一次世界大戦を思わせる塹壕戦になる。
      イラクは化学兵器を使用し、イランは少年を含む大量の兵を投入した。

      戦争は周辺にも広がった。
      互いの都市にミサイルを撃ち込み、ペルシア湾ではタンカーが攻撃される。
      各国は航路の安全のために艦隊を派遣した。
      イラクには湾岸諸国と欧米が支援を与え、イランは孤立したまま戦う。

      1988年、国連の決議を受け入れる形で停戦した。
      国境は開戦前とほとんど変わらず、両国は莫大な債務と破壊だけを残す。
      イラクは債務を抱えたまま2年後にクウェートへ侵攻し、湾岸戦争につながった。
      イランでは戦争の経験が体制の結束を強め、革命防衛隊の政治的な力が高まる。
      化学兵器が大規模に使われながら国際的な制裁が伴わなかったことも、後に問題として残った。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/2/24/Iran-Iraq_War_Montage.png
      credit: Uploader was gIre_3piCH2005 at fa.wikipedia / Public domain
      page: https://commons.wikimedia.org/wiki/File:Iran-Iraq_War_Montage.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イラン・イラク戦争

events:
  - id: cuneiform
    year: -3300
    circa: true
    title: 楔形文字の発明
    category: science
    tags: [文字, メソポタミア]
    summary: 倉庫の記録から始まった文字が、歴史を記録できる社会を作った。
    detail: |
      メソポタミアで生まれた、人類最古級の文字体系。
      紀元前3300年ごろ、南部のウルクなどの都市で使われ始めた。
      葦を削ったペンを湿った粘土板に押しつけるため、線の端が楔の形になる。
      これが名前の由来である。

      始まりは、神殿や倉庫の記録だった。
      穀物や家畜を何頭受け取ったかを絵と数で示す、会計のための符号である。
      やがて絵の形は簡略化され、物ではなく音を表すようになった。
      音を表せるようになると、人名や抽象的な語も書ける。
      記録の道具だった符号が、言葉そのものを写す文字になった。

      シュメール語のために作られたが、言語の系統が異なるアッカド語にも転用された。
      さらにヒッタイト語、エラム語、古代ペルシア語まで、広い範囲で使われる。
      書記は専門職で、学校で長い訓練を受けて育てられた。
      法典、神話、書簡、天文の観測、数学の問題集が粘土板に残されている。
      『ギルガメシュ叙事詩』もこの文字で書かれた。

      紀元後1世紀ごろまで使われ、その後は完全に忘れられた。
      19世紀、ベヒストゥンの三言語併記の碑文を手がかりに解読が進む。
      これによって、聖書以前の西アジアの歴史が初めて一次資料から語れるようになった。
      粘土板は焼けても残るため、パピルスよりはるかに多く現存している。
      文字を持つ社会と持たない社会では、残せる記憶の量がまるで違う。
      歴史時代の始まりを、この文字の発明に置くのはそのためである。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Cuneiform_script.jpg/500px-Cuneiform_script.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Cuneiform_script.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/楔形文字

  - id: ur-nammu-code
    year: -2100
    circa: true
    title: ウル・ナンム法典
    category: society
    tags: [法, メソポタミア]
    summary: 現存する最古級の法典。刑罰を賠償で定める考え方がすでに見える。
    detail: |
      ウル第3王朝の初代王が発布したとされる法典で、紀元前2100年ごろのもの。
      現存する法典としては世界最古級にあたる。
      ハンムラビ法典よりおよそ350年古い。

      粘土板の写しとして断片的に伝わっており、全体は復元されていない。
      発見された条文は40ほどで、本来はもっと多かったとみられる。
      言語はシュメール語で書かれている。
      序文では、王が神々から権威を授けられたことが述べられる。
      度量衡を正し、孤児が富者の餌食にならないようにし、寡婦が権力者に虐げられないようにしたと記された。
      弱者を守ることが王の正義だという主張は、以後の西アジアの法に共通して現れる。

      条文の多くは、損害を銀で賠償させる形をとる。
      他人の目を傷つけた者は銀を支払う、というように、身体刑ではなく賠償で処理される。
      350年後のハンムラビ法典が目には目をという同害報復を掲げるのとは対照的である。
      殺人・強盗・姦通といった重い罪には死刑も定められていた。
      奴隷や結婚、農地の管理に関する規定も含まれる。

      この法典は、国家が刑罰の基準をあらかじめ公にするという発想を示している。
      罰が支配者の気分で決まるのではなく、決められた基準で科されるという考え方である。
      条文が実際にどこまで適用されたかは分かっていない。
      王の正義を示す宣伝の文書という側面も強い。
      それでも、法を文字にして残すという実践がここから始まった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/71/Ur_Nammu_code_Istanbul.jpg/500px-Ur_Nammu_code_Istanbul.jpg
      credit: イスタンブル考古学博物館 / CC0
      page: https://commons.wikimedia.org/wiki/File:Ur_Nammu_code_Istanbul.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ウル・ナンム法典

  - id: hammurabi-code
    year: -1750
    circa: true
    title: ハンムラビ法典
    category: society
    tags: [法, メソポタミア]
    summary: 石柱に刻まれた282条。国家が刑罰の基準を公示した初期の例。
    detail: |
      バビロンの王ハンムラビが晩年に発布した法典で、紀元前1750年ごろのもの。
      高さ2メートルを超える玄武岩の石柱に、アッカド語の楔形文字で刻まれている。
      282の条文からなり、国家が刑罰の基準を公示した初期の例として知られる。

      石柱の上部には、王が太陽神から王権の象徴を受け取る場面が彫られている。
      法が神に由来することを示す構図である。
      序文と結びでは、弱者が強者に虐げられないよう正義を国に打ち立てたと述べられる。

      条文は、具体的な事例と判決の形をとる。
      他人の目を潰した者は自らの目を潰される、という同害報復の原則がよく知られる。
      ただし適用は身分によって異なり、被害者が平民や奴隷の場合は銀の賠償で済んだ。
      医師の手術の失敗、建築家が建てた家の倒壊、農地の管理の怠り、商取引の紛争など、扱う範囲は広い。
      結婚・離婚・相続・養子についての規定も多い。

      法典は各地に立てられ、人々が見て知ることができるようにされた。
      実際の裁判でこれが引用された例はほとんど見つかっていない。
      王の正義を示す記念碑としての性格が強かったとみられる。
      現在ルーヴル美術館にある石柱は、1901年にイランのスーサで発見された。
      後の時代にエラム人が戦利品として持ち去ったものである。
      記された内容は、当時の社会の構造や経済のあり方を知る一級の史料になっている。
      法を文字にして公にするという実践は、ここから途切れることなく続いた。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/9/9b/Detalle_del_C%C3%B3digo_de_Hammurabi.jpg
      credit: 作者不明 / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Detalle_del_C%C3%B3digo_de_Hammurabi.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ハンムラビ法典

  - id: alphabet-invented
    year: -1050
    circa: true
    title: アルファベットの成立
    category: science
    tags: [文字, フェニキア]
    summary: 20数文字で言葉を書ける仕組み。書く技術が専門家のものでなくなった。
    detail: |
      少数の文字で言葉を書き表す仕組みが、地中海東岸で確立した出来事。
      紀元前1050年ごろ、フェニキアの諸都市で使われた22の子音字がその完成形とされる。
      書く技術が専門家のものでなくなる転機になった。

      それ以前の文字は、数百から数千の記号を覚える必要があった。
      楔形文字もヒエログリフも、一つの記号が語や音節を表し、習得に長い訓練を要する。
      そのため書記は特権的な専門職であり、文字は国家と神殿のものだった。
      原型は、紀元前2千年紀の前半にシナイ半島やカナンで生まれたとみられる。
      エジプトの文字の形を借りながら、その語の頭の音だけを表す方式である。
      牛を意味する語の頭音が、牛の頭を図案化した文字になった。
      この考え方によって、必要な記号は20数個で済むようになる。

      フェニキア人は、これを交易の実務に用いて各地へ広めた。
      ギリシア人はこれを受け取り、自分たちの言語に不要な子音字を母音字に転用する。
      子音と母音を書き分ける仕組みは、ここで初めて成立した。
      そこからラテン文字とキリル文字が生まれている。
      東へはアラム文字として広がり、ヘブライ・アラビア・インド系の文字の源になった。

      影響は、単に便利になったことにとどまらない。
      数週間で学べる文字は、商人や職人にも書く力をもたらした。
      法を読み、契約を交わし、意見を記す人の層が広がる。
      現在世界で使われる文字の大半が、この系譜につながっている。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アルファベット

  - id: kadesh
    year: -1274
    title: カデシュの戦い
    category: war
    tags: [エジプト, ヒッタイト]
    summary: エジプトとヒッタイトが激突し、現存最古級の講和条約が結ばれた。
    detail: |
      エジプトとヒッタイトが、シリアの支配権をめぐって激突した戦い。
      紀元前1274年ごろ、オロンテス川のほとりのカデシュで行われた。
      双方の記録が残る、古代で最も詳しく経過の分かる戦闘である。

      エジプトのラムセス2世は、シリア北部を回復するために自ら軍を率いた。
      対するヒッタイトのムワタリ2世は、属国の兵を含む大軍を集める。
      両軍を合わせて数千両の戦車が投入されたとされ、当時としては最大規模だった。

      ラムセスは、敵が遠くにいるという偽の情報をつかまされて進軍した。
      先頭の部隊だけで城の近くまで進んだところを、待ち伏せていた戦車隊に襲われる。
      一時は本陣が崩れかけたが、後続の部隊が到着して立て直した。
      決着はつかず、双方が自軍の勝利を主張している。
      エジプトの神殿の壁には、王が一人で敵を打ち破ったという物語が大きく刻まれた。

      実際には、エジプトはカデシュを取り戻せなかった。
      両国はその後も小競り合いを続けたが、東からアッシリアが台頭してくる。
      共通の脅威を前に、紀元前1259年ごろ講和条約が結ばれた。
      条約は、互いの領土を侵さず、敵に対しては援軍を送り、亡命者を引き渡すことを定めている。
      エジプト側は神殿の壁に、ヒッタイト側は粘土板に同じ内容を残した。
      両方の当事者の文書が現存する最古の国際条約であり、その複製が国連本部に飾られている。
      大国が戦って決着せず、外交で均衡を作るという構図が、すでにここに現れている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/c/cc/Ramses_II_at_Kadesh.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Ramses_II_at_Kadesh.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/カデシュの戦い

  - id: israel-falls
    year: -722
    title: アッシリアがイスラエル王国を滅ぼす
    category: war
    tags: [アッシリア, ユダヤ教]
    summary: 住民が各地へ移され、「失われた十支族」の伝承が生まれた。
    detail: |
      アッシリアが北のイスラエル王国を滅ぼし、都のサマリアを陥落させた出来事。
      紀元前722年のことで、包囲は数年に及んだ。
      住民が各地へ移されたことから、失われた十支族の伝承が生まれた。

      イスラエル王国は、アッシリアに貢納しながら独立を保っていた。
      しかし王がエジプトと結んで貢納を止めたため、討伐を受ける。
      サマリアは3年の籠城の末に落ちた。
      アッシリアの碑文によれば、2万7000人余りが連れ去られたとされる。
      彼らはメディアやメソポタミアの各地へ分散して住まわされた。
      代わりに他の地域から人々が移され、現地の住民と混ざり合う。
      この混住から生まれた集団が、後にサマリア人と呼ばれるようになった。

      連れ去られた10の支族のその後は分かっていない。
      移住先で現地の社会に吸収されたと考えるのが自然だが、どこかで生き延びているという伝承が繰り返し語られた。
      中世から近代にかけて、世界各地の民族をその子孫とする説が唱えられている。
      日本にもそうした説が持ち込まれたことがある。

      南のユダ王国は、貢納を続けることで滅亡を免れた。
      紀元前701年にはアッシリア軍に包囲されたが、都は落ちていない。
      北王国の滅亡は、南の人々に強い教訓として受け止められた。
      神への背きが滅びを招くという解釈が、聖書の歴史叙述の骨格になっていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/Map_of_Assyria.png/500px-Map_of_Assyria.png
      credit: Ningyou / Public domain
      page: https://commons.wikimedia.org/wiki/File:Map_of_Assyria.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アッシリア

  - id: babylonian-captivity
    year: -586
    title: バビロン捕囚
    category: religion
    tags: [ユダヤ教]
    summary: 神殿を失った経験が、土地に依らない一神教の信仰を鍛え上げた。
    detail: |
      新バビロニアがユダ王国を滅ぼし、住民をバビロニアへ連行した出来事。
      紀元前597年・586年・582年の三度にわたって行われた。
      最大の連行は586年で、エルサレムの神殿が破壊されたときである。

      ユダ王国はエジプトとバビロニアのあいだで態度を変え、最後は反乱に踏み切った。
      包囲の末に都は落ち、神殿と城壁は破壊される。
      連れ去られたのは王族・祭司・書記・職人といった指導層で、総数は数千から1万数千と推定される。
      農民の多くは土地に残された。
      バビロニアでは、比較的自由な生活が許された。
      集団で居住し、土地を持ち、商売を営むこともできる。
      それでも、神殿での犠牲を捧げられない状況は信仰の危機だった。

      この経験が、信仰の形を作り替える。
      神殿がなくても、律法を学び、安息日を守り、集まって祈ることで神との関係を保てるという考えが育った。
      後のシナゴーグと律法中心の宗教生活は、ここに源を持つ。
      預言者たちは滅亡を神の罰と説明し、悔い改めと回復を語った。
      他の民族の神は偶像にすぎず、唯一の神だけが真実だという主張も、この時期に鮮明になる。

      紀元前539年にペルシアのキュロス2世がバビロンを占領し、帰還が許された。
      多くの人がエルサレムに戻り、神殿が再建される。
      一方でバビロニアに残った人々もおり、各地にユダヤ人の共同体が広がる起点にもなった。
      聖書の主要な部分は、この前後に編纂されたと考えられている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Tissot_The_Flight_of_the_Prisoners.jpg/500px-Tissot_The_Flight_of_the_Prisoners.jpg
      credit: ジェームズ・ティソ / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tissot_The_Flight_of_the_Prisoners.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/バビロン捕囚

  - id: cyrus-babylon
    year: -539
    title: キュロス2世がバビロンを征服
    category: war
    tags: [ペルシア]
    summary: 捕囚のユダヤ人を解放し、寛容な支配の伝説を残した。
    detail: |
      ペルシアのキュロス2世がバビロンを占領し、新バビロニアを滅ぼした出来事。
      紀元前539年のことである。
      捕囚のユダヤ人を解放したことで、寛容な支配者としての伝説が生まれた。

      当時のバビロニアは、内部に不満を抱えていた。
      王ナボニドゥスが伝統の主神マルドゥクよりも月神を重んじ、長期間都を離れていた。
      神官層と商人はこれに反発しており、外からの征服者を受け入れる素地があった。
      キュロスの軍は、ティグリス河畔の戦いでバビロニア軍を破った。
      その後、大きな抵抗を受けずに都に入ったと記録されている。
      後の伝承では、川の流れを変えて水位を下げ、川床から侵入したとも語られる。

      入城したキュロスは、自らをマルドゥクに選ばれた解放者として示した。
      神殿の祭祀を保護し、略奪や破壊を禁じている。
      各地から連れて来られていた神像を元の都市へ返し、住民の帰還も許した。
      ユダヤ人についても、エルサレムへ戻って神殿を再建することが認められた。
      聖書はこの王を、神に油を注がれた者と呼んで称えている。
      異民族の王が聖書でこれほど肯定的に扱われるのは例外的である。

      この征服により、メソポタミア文明の政治的な中心としての役割は終わった。
      バビロンは帝国の一都市として栄え続けるが、独立した王国が現れることはない。
      寛容によって支配を安定させるという方法は、以後の帝国の統治に受け継がれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/Illustrerad_Verldshistoria_band_I_Ill_058.jpg/500px-Illustrerad_Verldshistoria_band_I_Ill_058.jpg
      credit: Ernst Wallis et al / Public domain
      page: https://commons.wikimedia.org/wiki/File:Illustrerad_Verldshistoria_band_I_Ill_058.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/キュロス2世

  - id: zoroaster
    year: -600
    circa: true
    title: ゾロアスター教の成立
    category: religion
    tags: [ペルシア]
    summary: 善と悪の対立や最後の審判という枠組みが、のちの一神教にも影響したとされる。
    detail: |
      イラン高原で生まれた宗教で、開祖はザラスシュトラ（ゾロアスター）。
      成立の年代には幅があり、紀元前1200年ごろから600年ごろまで諸説ある。
      善と悪の対立という枠組みを明確にした点で、後の宗教に大きな影響を残した。

      中心にいるのは、最高神アフラ・マズダーである。
      この神は光と真理と秩序を体現し、暗黒と虚偽を司るアンラ・マンユと対立する。
      世界はこの二つの力が争う戦場であり、人間はどちらにつくかを選ぶ存在とされた。
      求められるのは、善い思い・善い言葉・善い行いの三つである。
      火は清浄の象徴として祭儀の中心に置かれ、神殿では火が絶やされない。
      遺体は土や火を汚すとされ、鳥に委ねる鳥葬が行われた。

      教義には、後の一神教と重なる要素が多い。
      死後の審判、天国と地獄、終末における救世主の出現、最後の審判と死者の復活といった観念である。
      バビロン捕囚の後にユダヤ教がこれらを取り入れたとする説が、古くから唱えられてきた。
      キリスト教やイスラム教の終末観との関係も論じられている。

      アケメネス朝の王たちはアフラ・マズダーを奉じ、ササン朝では国教とされた。
      7世紀のイスラムの征服によって信者は激減する。
      一部はインドへ移り、パールシーと呼ばれる共同体を作って今日まで信仰を保っている。
      現在の信者は世界で十数万人と推定される。
      規模は小さいが、その世界観の影響範囲は比べものにならないほど広い。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ゾロアスター教

  - id: achaemenid-falls
    year: -330
    title: アケメネス朝の滅亡
    category: war
    tags: [ペルシア, マケドニア]
    summary: アレクサンドロスに敗れ、オリエントがギリシア文化圏に組み込まれた。
    detail: |
      アレクサンドロス大王の遠征によって、アケメネス朝ペルシアが滅んだ出来事。
      決定的な戦いは紀元前331年のガウガメラで、王の死は翌330年である。
      これによりオリエントはギリシア文化圏に組み込まれた。

      アレクサンドロスは紀元前334年に小アジアへ渡り、グラニコス川とイッソスでペルシア軍を破った。
      エジプトを無血で手に入れ、東へ進む。
      ガウガメラの会戦では、兵数で勝るダレイオス3世の軍を戦術で崩した。
      敗れた王は東へ逃れたが、翌年に部下のベッソスに殺される。
      アレクサンドロスは王の遺体を丁重に葬り、自らが正統な後継者であることを示した。
      バビロン、スサ、ペルセポリスは次々に明け渡される。

      ペルセポリスの宮殿は炎上した。
      アテネを焼かれた報復とも、酒宴の末の偶発とも伝えられ、経緯は定かでない。
      膨大な財宝が押収され、その一部は貨幣として流通に回された。

      帝国の支配機構は、そのまま新しい支配者に引き継がれた。
      アレクサンドロスは各地の総督を留任させ、ペルシアの宮廷儀礼を採り入れている。
      死後、部下たちの争いを経てセレウコス朝がこの地域を継いだ。
      ギリシア語が行政と文化の言語として広がり、各地にギリシア風の都市が建設される。
      一方で、イラン高原の伝統はパルティアとササン朝として復活することになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Standard_of_Cyrus_the_Great.svg/500px-Standard_of_Cyrus_the_Great.svg.png
      credit: Sodacan / Public domain
      page: https://commons.wikimedia.org/wiki/File:Standard_of_Cyrus_the_Great.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アケメネス朝

  - id: muhammad-born
    year: 570
    circa: true
    title: ムハンマドの生誕
    category: religion
    tags: [イスラム]
    summary: 交易都市メッカの商人として育ち、40歳頃から預言者として活動を始めた。
    detail: |
      イスラム教の預言者ムハンマドが生まれたとされる年。
      570年ごろ、アラビア半島西部の交易都市メッカでのことである。
      有力な部族であるクライシュ族の、力を失いつつあった家系に属していた。

      生まれる前に父を亡くし、6歳で母も失った。
      祖父、次いで叔父に育てられ、幼いころから商隊に加わったと伝えられる。
      読み書きはできなかったとされるが、この点には議論もある。
      当時のメッカは、交易の中継地として栄えていた。
      カーバ神殿には各部族の神々が祀られ、巡礼者が集まることも都市の収入になっていた。
      一方で、部族の結束に頼る社会では、孤児や寡婦は保護を受けにくい。
      富の偏りが広がり、従来の部族の倫理が揺らいでいた。

      25歳ごろ、年上の商人ハディージャと結婚する。
      彼女の隊商を任されて各地を回り、誠実さで信頼を得たと伝えられる。
      経済的に安定したことで、瞑想に時間を割く余裕が生まれた。

      40歳ごろ、メッカ郊外の洞窟で最初の啓示を受けたとされる。
      唯一の神に帰依し、貧しい者を助け、終末の審判に備えよという内容だった。
      この教えは、多神教の神殿を収入源とする有力者と正面から対立する。
      一人の商人の宗教的な体験が、やがて国家と法を持つ共同体に育っていった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/MuhammadSVG.svg/500px-MuhammadSVG.svg.png
      credit: Юкатан / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:MuhammadSVG.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ムハンマド・イブン＝アブドゥッラーフ

  - id: hijra
    year: 622
    title: ヒジュラ（聖遷）
    category: religion
    tags: [イスラム]
    summary: ムハンマドのメディナ移住。イスラム暦の元年にあたる。
    detail: |
      ムハンマドと信者たちが、迫害を逃れてメッカから北のヤスリブへ移住した出来事。
      622年のことで、聖遷と訳される。
      この年がイスラム暦の元年とされた。

      メッカでは、有力者からの圧力が強まっていた。
      支持してくれた妻と叔父が相次いで没し、保護を失ったことも背景にある。
      一方のヤスリブでは、部族間の争いを調停できる人物を求めていた。
      代表者がムハンマドと会い、受け入れを約束する。
      信者は少人数ずつ移動し、最後にムハンマド自身が追手を逃れて到着した。
      ヤスリブは預言者の町を意味するメディナと呼ばれるようになる。

      移住が画期とされるのは、単に場所を移したからではない。
      ここで初めて、信仰によって結ばれた共同体が政治的な実体を持ったからである。
      先住のユダヤ教徒の部族も含めた取り決めが結ばれ、成員の権利と義務、紛争の処理が定められた。
      血縁による部族の結束に代わって、信仰による結束が社会の基礎になる。

      ムハンマドは礼拝の方向をエルサレムからメッカへ改め、断食や喜捨の規定も整えた。
      共同体は軍事的にも動き、メッカとの戦いを戦い抜く。
      第2代カリフのウマルは、この移住の年を暦の起点と定めた。
      イスラム暦は太陰暦で、1年は約354日である。
      信仰が国家の形をとった瞬間として、この年が選ばれたことの意味は大きい。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/Allah_logo.svg/500px-Allah_logo.svg.png
      credit: Originally uploaded by Ibrahim ebi of the png picture. / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Allah_logo.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヒジュラ

  - id: yarmouk
    year: 636
    title: ヤルムークの戦い
    category: war
    tags: [イスラム, ビザンツ]
    summary: ビザンツからシリアを奪い、イスラム勢力の大拡張が始まった。
    detail: |
      イスラム勢力とビザンツ帝国が、シリアの帰属をめぐって戦った決戦。
      636年、ヨルダン川の支流ヤルムーク川のほとりで行われた。
      ビザンツはこの敗北によってシリアを永久に失った。

      ビザンツ皇帝ヘラクレイオスは、ササン朝との長い戦争に勝ったばかりだった。
      奪い返したばかりのシリアが新たな勢力に脅かされ、大軍を編成して迎え撃つ。
      兵力はビザンツ側が大きく上回っていたとされる。
      アラブ側の指揮をとったのは、名将と評されるハーリド・イブン・ワリードだった。
      軽装の騎兵を機動的に使い、退却しながら敵を引き込む戦い方をとる。
      数日にわたる戦闘の末、砂嵐の吹く日に総攻撃をかけてビザンツ軍を崩した。
      退路を断たれた部隊は渓谷に追い詰められて壊滅する。

      敗因としては、寄せ集めの傭兵と現地の同盟部族の離反、指揮系統の混乱が挙げられる。
      長年の戦争で財政が尽き、住民の支持も得られていなかった。
      宗派の違いから中央の政府に不満を持つシリアのキリスト教徒は、新しい支配者をむしろ歓迎したとされる。

      この勝利により、ダマスカスをはじめシリアの諸都市が次々に降伏した。
      翌年にはエルサレムも明け渡される。
      ビザンツは小アジアに後退し、地中海東岸の支配を失った。
      数万規模の軍が一度の会戦で地域の帰属を決めた、歴史の転換点の一つである。
    image:
