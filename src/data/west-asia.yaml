lane: west-asia

periods:
  - id: sumer
    title: シュメール都市国家群
    start: -3000
    startCirca: true
    end: -2334
    category: politics
    tags: [メソポタミア, 都市]
    summary: ウルクやウルなど、世界最古級の都市文明。文字と法と灌漑が生まれた。
    detail: |
      メソポタミア南部で栄えた、世界最古級の都市文明。
      紀元前3000年ごろから、ウルク・ウル・ラガシュ・キシュなどの都市国家が並び立った。
      シュメール人の言語は周囲のどの言語とも系統がつながらない。
      どこから来たのかも分かっていない。

      都市の中心には、ジッグラトと呼ばれる高い基壇の神殿が立った。
      都市は守護神のものとされ、神殿が土地と労働力を管理する。
      やがて戦争の指揮者が王として常設の権力を持つようになった。
      王は神の代理として統治し、神殿と王宮が並んで都市を支える。
      この社会の基盤は灌漑だった。
      ティグリスとユーフラテスから水路を引き、大麦や棗椰子を育てる。
      水路の維持には大勢の共同作業が必要で、それが強い組織を生んだ。
      余剰の穀物が専門職を養い、職人・商人・書記・神官が分かれていく。

      生み出されたものは多い。
      楔形文字、車輪、60進法、ろくろ、そして法と契約の観念がここで形になった。
      1時間を60分、円を360度とする数え方は、今もこの伝統を引き継いでいる。
      『ギルガメシュ叙事詩』は、洪水の物語を含む最古の文学として知られる。

      都市どうしは水と土地をめぐって争い、統一は長く続かなかった。
      紀元前2334年ごろ、アッカドのサルゴンに征服される。
      シュメール語はやがて日常語としては消え、学問と祭祀の言語として残った。
      都市・文字・法・官僚制という文明の部品は、ここでほぼ出そろっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Tableta_con_trillo.png/500px-Tableta_con_trillo.png
      credit: José-Manuel Benito / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tableta_con_trillo.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/シュメール

  - id: akkad
    title: アッカド帝国
    start: -2334
    end: -2154
    category: politics
    tags: [メソポタミア]
    summary: サルゴンがメソポタミアを統一した、史上初の「帝国」とされる国家。
    detail: |
      メソポタミア最初の統一国家で、紀元前2334年ごろから約180年続いた。
      サルゴンがシュメールの諸都市を征服して打ち立てた。
      複数の民族と都市を一人の王が治めたことから、史上初の帝国とも呼ばれる。

      都のアッカドの正確な位置は、今も特定されていない。
      支配下にはシュメール語を話す南部と、セム系のアッカド語を話す北部があった。
      行政にはアッカド語が使われ、楔形文字がそれに合わせて改良される。
      統治の方法にも新しさがあった。
      征服した都市の支配者を排除し、王が任命した総督を置く。
      度量衡を揃え、王の年を基準に年代を数えさせた。
      王の娘を主要な神殿の女司祭に任じて、宗教の面からも支配を固めている。
      その一人であるエンヘドゥアンナは、名の分かる世界最古の著作者とされる。

      最盛期は、孫にあたるナラム・シンの時代だった。
      自らを四方世界の王と称し、さらに神として扱うことを求める。
      王が神格化された初期の例として重要である。
      遠征はアナトリアやイランにまで及び、ペルシア湾から地中海までの交易路を押さえた。

      紀元前2154年ごろ、東の山地から来たグティ人の侵入で帝国は崩れた。
      干ばつによる農業の破綻が背景にあったとする研究もある。
      短命に終わったが、広い領域を一つの行政で治めるという発想は残った。
      のちのバビロニアやアッシリアは、いずれもこの帝国を手本として語っている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/37/Empire_akkad.svg/500px-Empire_akkad.svg.png
      credit: "Middle_East_topographic_map-blank.svg: Sémhur (talk) derivative work: Zunkir (talk) / CC BY-SA 3.0"
      page: https://commons.wikimedia.org/wiki/File:Empire_akkad.svg
    links:
