  - id: gulf-war
    year: 1991
    title: 湾岸戦争
    category: war
    tags: [中東, 冷戦後]
    summary: 冷戦後初の大規模な多国籍軍の行動。中東への米軍の常駐が深まった。
    detail: |
      イラクのクウェート侵攻を受けて、多国籍軍がこれを撃退した戦争。
      侵攻は1990年8月、戦闘は1991年1月から2月にかけて行われた。
      冷戦の終結後、初めての大規模な多国籍の軍事行動になった。

      イラクは、イランとの戦争で巨額の債務を抱えていた。
      クウェートに対して石油の増産と債務の帳消しを求め、応じられないと侵攻して併合を宣言する。
      国連安保理は撤退を求める決議を重ね、最終的に武力行使を容認した。
      米国を中心に30か国以上が参加する多国籍軍が編成された。
      サウジアラビアに大規模な部隊が展開し、5か月かけて態勢を整える。
      1991年1月、空爆が始まった。

      1か月以上の空爆で通信と補給が破壊され、2月の地上戦は100時間で終わる。
      クウェートは解放されたが、多国籍軍はバグダードへは進まなかった。
      退却するイラク軍が油田に火を放ち、環境への被害が広がる。
      この戦争は、精密誘導兵器の映像が生中継で流れた最初の戦争でもあった。
      軍事技術の差が戦闘の結果を決めることが、視覚的に示される。

      戦後もフセイン政権は存続し、経済制裁と飛行禁止区域が続いた。
      一方、聖地を抱えるサウジアラビアに米軍が駐留を続けたことは、イスラム主義の過激派が反米を掲げる理由になる。
      中東への米国の軍事的な関与は、この戦争以降さらに深まった。
