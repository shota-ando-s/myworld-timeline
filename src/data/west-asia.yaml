        url: https://ja.wikipedia.org/wiki/湾岸戦争

  - id: iraq-war
    year: 2003
    title: イラク戦争
    category: war
    tags: [中東, アメリカ]
    summary: 大量破壊兵器を理由に始まったが見つからず、地域の秩序が不安定化した。
    detail: |
      アメリカとイギリスを中心とする有志連合がイラクに侵攻した戦争で、2003年3月に始まった。
      大量破壊兵器の保有が理由とされたが、発見されなかった。
      地域の秩序が不安定になる出発点になった。

      2001年の同時多発テロの後、米国は先制的な行動を正当化する方針を打ち出した。
      イラクが大量破壊兵器を隠し持ち、テロ組織と関係があるという主張がなされる。
      国連の査察団は証拠を確認できず、安保理でも武力行使の新たな決議は得られなかった。
      それでも侵攻は実行される。
      軍事行動は短期間で終わった。
      3週間でバグダードが陥落し、フセイン政権は崩壊する。
      5月には主要な戦闘の終結が宣言された。

      困難はその後に始まる。
      占領当局は旧政権の政党を解体し、軍と警察を解散させた。
      職を失った数十万の兵が武装勢力に流れ、治安は急速に悪化する。
      スンナ派とシーア派の対立が激化し、内戦に近い状態になった。

      開戦の根拠だった大量破壊兵器は、最後まで見つかっていない。
      イラク人の死者は十数万から数十万と推定される。
      米軍が撤退した後の混乱のなかから、過激派組織が勢力を伸ばした。
      介入によって独裁を倒すことの難しさを示した例として、その後の政策判断に影響を与え続けている。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/2/2e/Iraq_War_montage.png
      credit: Futuretrillionaire / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Iraq_War_montage.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イラク戦争

  - id: arab-spring
    year: 2011
    title: アラブの春
    category: society
    tags: [中東, 民主化]
    summary: 各国で長期政権が倒れたが、多くは内戦や強権の復活に至った。
    detail: |
      2010年末から2012年にかけて、アラブ諸国で相次いだ大規模な抗議運動。
      長期政権がいくつも倒れたが、多くの国は内戦や強権の復活に至った。

      発端はチュニジアである。
      2010年12月、露天商の青年が当局の扱いに抗議して焼身自殺した。
      これをきっかけに抗議が全国に広がり、翌月に23年続いた政権が崩壊する。

      運動はエジプトへ波及した。
      カイロの広場に数十万が集まり、18日間の抗議の末に30年続いたムバラク政権が倒れる。
      リビアでは内戦となり、NATOの介入を経てカダフィ政権が崩壊した。
      イエメンでも大統領が退陣し、バーレーンでは近隣国の介入で抗議が抑え込まれる。
      共通の背景として、若年層の高い失業率、物価の上昇、腐敗、長期政権への不満が挙げられる。
      携帯電話とソーシャルメディアが、組織を持たない人々の動員を可能にした。

      しかし政権の崩壊後、安定した民主的な体制が築かれた例は少ない。
      エジプトでは選挙で成立した政権が2年後にクーデタで倒れ、軍出身の大統領が権力を握った。
      リビアとイエメンは長い内戦に入り、外国の介入も重なる。
      シリアでは抗議への弾圧から内戦となり、数十万が死亡し、数百万が難民となった。
      民主化を実現したのはチュニジアだけで、その後も不安定な状態が続いている。
      独裁が倒れた後に何を作るかという問題の難しさが、共通の教訓として残った。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Arab_Spring_map.svg/500px-Arab_Spring_map.svg.png
      credit: User:Brightgalrs / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:Arab_Spring_map.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アラブの春
