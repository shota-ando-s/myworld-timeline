  - id: sykes-picot
    year: 1916
    title: サイクス・ピコ協定
    category: politics
    tags: [中東, 列強]
    summary: 英仏がオスマン領の分割を密約。現在の国境線の多くがここに由来する。
    detail: |
      第一次世界大戦中に、イギリスとフランスがオスマン帝国領の分割を取り決めた秘密協定。
      1916年に成立し、ロシアも承認していた。
      現在の中東の国境線の多くが、この構想に由来する。

      協定の名は、交渉にあたった両国の外交官の名前による。
      地中海東岸からメソポタミアにかけての地域が、直接統治の区域と勢力圏に分けられた。
      シリアとレバノンはフランス、イラクとヨルダンはイギリスの取り分とされる。
      パレスチナは国際管理の地域と定められた。

      問題は、同じ時期にイギリスが別の約束もしていたことである。
      アラブの指導者フサインに対しては、オスマンへの反乱の見返りとしてアラブ人の独立国家を認めると伝えていた。
      さらに翌年には、パレスチナにユダヤ人の郷土を作ることを支持する宣言を出す。
      互いに整合しない三つの約束が並ぶことになった。
      協定は1917年、ロシア革命後の新政権によって暴露された。
      帝政ロシアの外交文書が公開され、密約の内容が世界に知られる。
      独立を期待していたアラブ側の失望は大きかった。

      戦後、この構想をおおむね踏襲する形で委任統治の区域が定められた。
      民族や宗派の分布と無関係に引かれた直線的な国境は、その後の紛争の背景になる。
      2010年代の過激派組織が、この協定の終わりを宣言したのも、その象徴性のためである。
      外部の大国が地図の上で地域の枠組みを決めた例として、繰り返し引かれてきた。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/サイクス・ピコ協定

  - id: balfour-declaration
    year: 1917
    title: バルフォア宣言
    category: politics
    tags: [中東, ユダヤ人]
    summary: 相反する約束を各方面に与えた結果、パレスチナ問題の原型ができた。
    detail: |
      イギリス外相バルフォアが、パレスチナにユダヤ人の民族的郷土を建設することへの支持を表明した文書。
      1917年11月、ユダヤ系の有力者に宛てた書簡の形をとった。
      パレスチナ問題の原型がここにある。

      文面は短い。
      パレスチナにユダヤ民族の郷土を設立することに賛意を示し、その実現に最善の努力を払うと述べる。
      同時に、現地の非ユダヤ人の市民的・宗教的権利を害してはならないという条件も付された。
      民族的郷土という語は曖昧で、国家を意味するかどうかは明示されていない。

      イギリスの動機は複数あった。
      戦争を有利に進めるため、アメリカとロシアのユダヤ人社会の支持を得たかったこと。
      スエズ運河に近い地域を影響下に置きたかったことである。
      この宣言は、同時期の他の約束と矛盾していた。
      アラブ側には独立国家を約束し、フランスとは分割の密約を結んでいる。
      のちに三枚舌外交と呼ばれる所以である。

      当時のパレスチナの住民の9割以上はアラブ人だった。
      宣言は委任統治の条文に取り込まれ、ユダヤ人の移民が増えていく。
      1930年代にはヨーロッパでの迫害を逃れた人々が流入し、住民との衝突が激化した。
      イギリスは双方の要求を調停できないまま、1947年に問題を国連へ委ねる。
      一枚の書簡が、100年に及ぶ対立の出発点になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8e/Balfour_declaration_unmarked.jpg/500px-Balfour_declaration_unmarked.jpg
      credit: United Kingdom Government signed by Arthur Balfour / Public domain
      page: https://commons.wikimedia.org/wiki/File:Balfour_declaration_unmarked.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/バルフォア宣言

  - id: turkish-republic
    year: 1923
    title: トルコ共和国の成立
    category: politics
    tags: [トルコ, 世俗化]
    summary: カリフ制を廃止し、政教分離と文字改革を断行した。
    detail: |
      オスマン帝国に代わってトルコ共和国が成立した出来事で、1923年10月のこと。
      首都はイスタンブルからアンカラへ移された。
      600年続いた帝国と、イスラム世界の宗教的権威が同時に終わることになる。

      第一次世界大戦の敗戦後、オスマン政府は領土の大半を失う条約を受け入れた。
      これに反対する軍人と有志がアナトリアで抵抗運動を組織し、アンカラに議会を開く。
      ギリシア軍との戦いに勝ち、1922年にスルタン制を廃止した。
      翌年のローザンヌ条約で、新しい国家の領域と主権が認められる。
      共和国の宣言に続き、1924年にはカリフ制が廃された。
      預言者の後継者という地位は消え、王族は国外へ追放される。
      イスラム世界の各地から抗議が寄せられたが、決定は覆らなかった。

      国家の原則として世俗主義が掲げられた。
      宗教は個人の信仰の領域に置かれ、国家の制度から切り離される。
      法典はヨーロッパから導入され、暦も西暦に改められた。
      1928年の文字改革でラテン文字が採用され、過去の文書は専門家以外に読めなくなる。

      ギリシアとのあいだでは、宗教を基準とする大規模な住民交換が行われた。
      数百万の人々が生まれた土地を離れ、国家が民族で区切られていく。
      イスラム世界で最初に共和制と世俗主義を採った国家として、その実験は各国に注目された。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/Flag_of_Turkey.svg/500px-Flag_of_Turkey.svg.png
      credit: David Benbennick (original author) / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Turkey.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/トルコ

  - id: saudi-arabia
    year: 1932
    title: サウジアラビア王国の成立
    category: politics
    tags: [中東]
    summary: 建国直後に発見された石油が、王国と世界経済を結びつけた。
    detail: |
      アラビア半島の大半を領土とする王国が成立した出来事で、1932年のこと。
      アブドゥルアズィーズが30年をかけて征服した地域を、一つの国号のもとにまとめた。
      建国の直後に発見された石油が、この国を世界経済と結びつける。

      半島は長く、部族ごとの支配と都市の自治が並ぶ地域だった。
      オスマン帝国の宗主権は名目にとどまり、第一次世界大戦後にそれも消える。
      1902年にリヤドを奪回した一族は、内陸部から順に勢力を広げた。
      1925年には聖地を含むヒジャーズ地方を制圧している。
      国家の統合の軸になったのは、厳格な信仰を説くワッハーブ派の教えだった。
      王家と宗教指導者の同盟という形は、18世紀にさかのぼる。
      王が政治を、宗教指導者が信仰と法を担う分業が、建国後も続いている。

      1932年に国号が定められた時点では、国庫は空に近かった。
      主な収入は巡礼者からの手数料である。
      1938年、東部で大規模な油田が発見され、事情が根本から変わった。
      採掘を担ったアメリカの企業連合は、後のサウジ・アラムコになる。

      石油収入は国家の財政を支え、王族が富と権力を握る体制を固めた。
      聖地の管理者という立場は、イスラム世界での発言力の源になっている。
      米国との安全保障上の関係と、国内の宗教的な正統性という二つの柱の上に、この国は成り立ってきた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0d/Flag_of_Saudi_Arabia.svg/500px-Flag_of_Saudi_Arabia.svg.png
      credit: The Shura Council / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_Saudi_Arabia.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/サウジアラビア

  - id: israel-founded
    year: 1948
    title: イスラエル建国
    category: politics
    tags: [中東, 現代]
    summary: 直後に第一次中東戦争が起き、今日まで続く対立の起点となった。
    detail: |
      イスラエルが独立を宣言した出来事で、1948年5月14日のこと。
      イギリスの委任統治の終了に合わせて行われた。
      翌日から周辺のアラブ諸国との戦争が始まり、今日まで続く対立の起点になった。

      19世紀末以来、ユダヤ人の国家建設をめざすシオニズム運動が続いていた。
      バルフォア宣言と委任統治のもとで移民が増え、ナチスの迫害を逃れた人々が加わる。
      現地のアラブ住民との衝突が激化し、イギリスは統治を維持できなくなった。
      1947年、国連はパレスチナをユダヤ国家とアラブ国家に分け、エルサレムを国際管理とする決議を採択した。
      ユダヤ側は受け入れ、アラブ側は人口比と土地の配分が不公平だとして拒否する。
      双方の武装勢力の衝突は、すでに内戦の様相になっていた。

      独立宣言の翌日、エジプト・ヨルダン・シリア・レバノン・イラクが軍を進めた。
      第一次中東戦争と呼ばれるこの戦いで、イスラエルは分割案を上回る地域を確保する。
      70万人を超えるアラブ系住民が家を追われ、周辺国の難民となった。
      この出来事は、パレスチナ側では大災厄を意味する語で呼ばれる。

      同じ時期、アラブ諸国からも多数のユダヤ人がイスラエルへ移住した。
      以後、四度の大きな戦争と数多くの紛争が繰り返される。
      国境、難民の帰還、エルサレムの帰属という問題は、いまも解決していない。
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イスラエル独立宣言

  - id: opec-founded
    year: 1960
    title: OPECの結成
    category: economy
    tags: [石油, 中東]
    summary: 産油国が価格決定の主導権を握り、資源が外交の武器になった。
    detail: |
      産油国が石油の価格と生産量について協調するために作った組織で、1960年に結成された。
      設立の会議はバグダードで開かれ、中東の4か国に南米のベネズエラを加えた5か国が参加している。
      資源が外交の手段になる転換点にあたる。

      それまで、石油の価格は国際石油資本と呼ばれる欧米の大企業が決めていた。
      七つの大企業が採掘から輸送、精製、販売までを握り、産油国は決められた利権料を受け取るだけである。
      1959年と60年に企業側が一方的に公示価格を引き下げたことが、直接の引き金になった。
      産油国の収入はそのまま減り、対抗する必要が明確になる。
      設立後しばらくは、大きな影響力を持てなかった。
      加盟国は増えたが、価格の主導権は依然として企業側にある。
      1970年代に入り、各国が採掘の権益を国有化したことで力関係が変わった。

      決定的だったのは1973年である。
      第四次中東戦争に際し、アラブの産油国がイスラエルを支援する国への輸出を制限した。
      原油価格は数か月で4倍になり、世界経済は大きな打撃を受ける。
      石油危機と呼ばれるこの出来事で、資源が政治的な武器になりうることが示された。

      以後、加盟国は生産量の調整によって価格を左右してきた。
      一方で加盟国どうしの利害は一致せず、決定が守られないことも多い。
      アメリカのシェールオイルの増産やロシアとの協調など、影響力の条件は時代とともに変わり続けている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/Flag_of_OPEC.svg/500px-Flag_of_OPEC.svg.png
      credit: Zscout370 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_OPEC.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/石油輸出国機構

  - id: six-day-war
    year: 1967
    title: 第三次中東戦争（六日戦争）
    category: war
    tags: [中東]
    summary: イスラエルが領土を大きく広げ、占領地問題が中東の中心課題になった。
    detail: |
      イスラエルとエジプト・シリア・ヨルダンが戦った戦争で、1967年6月の6日間で決着した。
      イスラエルは領土を大きく広げ、占領地の問題が中東の中心課題になる。

      前年から国境での衝突が続き、緊張が高まっていた。
      エジプトはシナイ半島の国連軍を撤退させ、イスラエルの海上の出口であるチラン海峡を封鎖する。
      アラブ諸国が相互の防衛協定を結び、戦争は避けられない情勢になった。
      6月5日、イスラエルは先制攻撃に出た。
      空軍が地上にあるエジプト機の大半を数時間で破壊し、制空権を完全に握る。
      シリアとヨルダンの空軍も同様に無力化された。
      以後の地上戦は一方的に進む。

      6日間で、イスラエルはシナイ半島とガザ地区をエジプトから、ヨルダン川西岸と東エルサレムをヨルダンから、ゴラン高原をシリアから奪った。
      支配地域は戦前の数倍になる。
      東エルサレムの占領によって、ユダヤ教の聖地である嘆きの壁が20年ぶりにイスラエルの管理下に入った。
      この戦争で、数十万のパレスチナ人が再び難民となった。
      国連は決議242を採択し、占領地からの撤退と各国の生存権の相互承認を求める。
      しかし解釈が分かれ、実行されないまま現在に至る。

      占領地への入植が始まり、パレスチナ人の抵抗運動も本格化した。
      アラブ諸国の側では、世俗的な民族主義への信頼が揺らぎ、宗教的な運動が力を得ていく。
      中東の政治の構図が、この6日間で大きく書き換えられた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e3/Six_Day_War._Egyptian_air_force_base_attacked._Egyptian_planes_destroyed_on_the_ground._June_1967._D326-011.jpg/500px-Six_Day_War._Egyptian_air_force_base_attacked._Egyptian_planes_destroyed_on_the_ground._June_1967._D326-011.jpg
      credit: 作者不明 / CC BY-SA 4.0
      page: https://commons.wikimedia.org/wiki/File:Six_Day_War._Egyptian_air_force_base_attacked._Egyptian_planes_destroyed_on_the_ground._June_1967._D326-011.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第三次中東戦争

  - id: oil-crisis
    year: 1973
    title: 第四次中東戦争と石油危機
    category: economy
    tags: [石油, 世界経済]
    summary: 原油価格が4倍になり、先進国の高度成長が終わった。
    detail: |
      1973年10月に始まった第四次中東戦争と、それに伴う原油価格の急騰。
      アラブ産油国が石油を政治的な手段として用いた最初の大規模な例である。
      先進国の高度成長は、これを境に終わった。

      戦争は、エジプトとシリアがユダヤ教の祭日に奇襲をかける形で始まった。
      緒戦はアラブ側が優勢で、スエズ運河を渡ってシナイ半島へ進む。
      イスラエルは態勢を立て直して反攻し、2週間余りで停戦に至った。
      同時に、アラブの産油国は石油を武器として使った。
      生産を段階的に削減し、イスラエルを支援する国への輸出を停止する。
      原油の公示価格は数か月で4倍近くに上がった。

      影響は世界に及んだ。
      各国でエネルギーの節約が呼びかけられ、日本では物価が急騰して日用品の買い占めが起きる。
      翌年、日本は戦後初のマイナス成長を記録した。
      高い成長を前提としていた経済の構図が、根本から見直される。

      長期的には、省エネルギー技術と燃費の良い自動車が競争力を持つようになった。
      原子力や北海油田など、中東以外の供給源の開発も進む。
      産油国には膨大な資金が流れ込み、それが国際金融の市場に回った。
      資源を持つ国が価格の決定に関与できることが示され、南北の関係にも影響を与えた出来事である。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/Bridge_Crossing.jpg/500px-Bridge_Crossing.jpg
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Bridge_Crossing.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第四次中東戦争

  - id: iranian-revolution
    year: 1979
    title: イラン革命
    category: religion
    tags: [イラン, 現代]
    summary: 王政が倒れイスラム共和国が成立。中東の力関係が大きく変わった。
    detail: |
      イランで王政が倒れ、イスラム共和国が成立した革命で、1979年のこと。
      宗教が主導した革命という点で、20世紀では例外的である。
      中東の力関係が大きく変わった。

      背景には、国王が進めた上からの近代化への反発がある。
      石油収入で経済は成長したが、富の偏りと腐敗が広がっていた。
      秘密警察が反対派を弾圧し、政治的な自由はない。
      世俗化の政策は宗教指導者の権威を脅かし、急激な都市化は伝統的な生活を壊した。

      1978年、抗議のデモが全国に広がった。
      弾圧で犠牲者が出るたび、その追悼が次のデモになるという連鎖が続く。
      ストライキで石油の生産も止まり、経済は麻痺した。
      1979年1月、国王は出国する。
      2月、亡命していたホメイニが帰国して数百万の群衆に迎えられた。
      軍は中立を宣言し、旧体制は崩壊する。
      4月の国民投票を経てイスラム共和国が宣言された。

      革命には、世俗の左派や自由主義者も加わっていた。
      しかし政権が固まる過程で彼らは排除され、宗教勢力が主導権を握る。
      11月には学生が米大使館を占拠し、444日に及ぶ人質事件になった。
      米国との関係は断絶し、イランは地域で孤立する一方、シーア派の勢力を通じて影響力を広げた。
      イスラムを掲げる政治運動が各地で力を得るきっかけにもなっている。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Imam_Khomeini_in_Mehrabad.jpg/500px-Imam_Khomeini_in_Mehrabad.jpg
      credit: Also uploaded by en:User:Sa.vakilian in en.wiki and by fa:User:Mrostam in fa.Wiki / GFDL
