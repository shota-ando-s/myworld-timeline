  - id: baghdad-sack
    year: 1258
    title: モンゴル軍によるバグダード占領
    category: war
    tags: [イスラム, モンゴル]
    summary: アッバース朝が滅び、イスラム世界の学術の中心が失われた。
    detail: |
      モンゴル軍がアッバース朝の都バグダードを占領し、破壊した出来事。
      1258年のことで、指揮したのはチンギス・ハンの孫フレグである。
      500年続いたアッバース朝はここで滅んだ。

      モンゴルは、服属と貢納を求める使者をカリフに送っていた。
      カリフのムスタスィムはこれを拒み、しかし十分な防衛の準備もしなかった。
      諸勢力との連携も取れておらず、都は孤立していた。

      1258年1月、モンゴル軍は投石機で城壁を破り、2月に市内へ入った。
      住民の虐殺は数日続き、犠牲者は数十万とも伝えられる。
      数字には誇張が含まれるが、都市の人口が激減したことは確かである。
      カリフは絨毯に包まれて馬に踏み殺されたという伝承が残る。
      王族の血を流さないというモンゴルの慣習によるとされる。

      図書館と学院が焼かれ、蔵書はティグリス川に投げ込まれた。
      川の水がインクで黒く染まったという記述が、複数の史料に見える。
      数世紀にわたって蓄積された写本の多くが、このとき失われた。
      灌漑の水路が壊れたことで、メソポタミアの農業は長く回復しなかった。
      政治的にも、スンナ派イスラム世界の象徴的な中心が消える。
      その役割はカイロのマムルーク朝が引き継ぎ、カリフの一族を迎えて擁立した。
      イスラム世界の中心は、イラクからエジプトとアナトリアへ移っていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/Bagdad1258.jpg/500px-Bagdad1258.jpg
      credit: Sayf al-vâhidî et al. / Public domain
      page: https://commons.wikimedia.org/wiki/File:Bagdad1258.jpg
    links:
