  - id: old-babylon
    title: 古バビロニア王国
    start: -1894
    end: -1595
    category: politics
    tags: [メソポタミア]
    summary: ハンムラビのもとで統一され、法と天文の伝統を残した。
    detail: |
      バビロンを都としてメソポタミアを支配した王朝で、紀元前19世紀から16世紀まで続いた。
      アムル人が建てた王朝で、バビロン第1王朝とも呼ばれる。
      第6代のハンムラビの時代に全メソポタミアを統一した。

      バビロンはもともと小さな都市にすぎなかった。
      ウル第3王朝の崩壊後、各地に乱立した小王国の一つとして始まる。
      周囲の強国と同盟と裏切りを繰り返しながら勢力を広げ、ハンムラビの代に頂点に達した。
      統一後は、法と行政の整備が進められた。
      282条からなる法典が石柱に刻まれ、各地に立てられる。
      王が地方の役人に宛てた書簡が多数残り、運河の管理から訴訟の指示まで細かく指図していたことが分かる。

      学問の面でも大きな遺産を残した。
      天体の観測記録が積み重ねられ、月の運行から暦が整えられる。
      数学では二次方程式に相当する問題が解かれ、平方根の近似値も計算されていた。
      バビロニアの天文学は、のちにギリシアやインドへ受け継がれる。

      ハンムラビの死後、王国は急速に衰えた。
      南部が離反し、東からカッシート人が入り込む。
      紀元前1595年、アナトリアから遠征してきたヒッタイトによってバビロンは略奪された。
      以後はカッシート人の王朝が長く続く。
      バビロンという都市の名は、この王朝以降、メソポタミア文明そのものを指す言葉になった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Tableta_con_trillo.png/500px-Tableta_con_trillo.png
      credit: José-Manuel Benito / Public domain
      page: https://commons.wikimedia.org/wiki/File:Tableta_con_trillo.png
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/バビロン第1王朝

  - id: hittite
    title: ヒッタイト
    start: -1650
    end: -1180
    endCirca: true
    category: war
    tags: [アナトリア, 鉄]
    summary: 鉄器と戦車で勢力を広げ、エジプトと世界最古級の講和条約を結んだ。
    detail: |
      アナトリア中部を本拠とした王国で、紀元前17世紀から12世紀ごろまで続いた。
      都はハットゥシャで、現在のトルコのボアズカレにあたる。
      エジプトやアッシリアと並ぶ、オリエントの大国の一つだった。

      話していたのはインド・ヨーロッパ語族の言語で、記録は楔形文字で残された。
      1906年からの発掘で大量の粘土板が見つかり、それまで聖書にしか名の残らなかった民族の実像が明らかになる。
      解読によって、インド・ヨーロッパ語族で最も古い記録を持つ言語であることも分かった。
      軍事では、軽量で速い二頭立ての戦車を効果的に用いた。
      鉄の利用でも先行していたとされるが、その独占という見方は近年見直されている。
      紀元前1595年にはバビロンまで遠征し、古バビロニア王国を滅ぼした。
      最盛期にはシリア北部までを支配し、ミタンニを服属させている。

      紀元前1274年、シリアの支配をめぐってエジプトとカデシュで激突した。
      決着はつかず、16年後に両国は講和の条約を結ぶ。
      粘土板と神殿の壁の双方に残るこの条約は、現存する最古級の国際条約である。

      王国は、近隣の小国と条約を結んで従属させる仕組みで広い地域を治めた。
      法典は身体刑より賠償を重んじ、同時代のなかでは穏健とされる。
      紀元前1200年ごろ、いわゆる海の民の移動と飢饉のなかで都は焼かれ、王国は崩壊した。
      地方には後継の小王国が残り、アッシリアに吸収されていく。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Map_Hittite_rule_en.svg/500px-Map_Hittite_rule_en.svg.png
      credit: "Near_East_topographic_map-blank.svg: Sémhur derivative work: Ikonact / CC BY-SA 3.0"
      page: https://commons.wikimedia.org/wiki/File:Map_Hittite_rule_en.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ヒッタイト

  - id: phoenicia
    title: フェニキア諸都市
    start: -1200
    startCirca: true
    end: -539
    category: economy
    tags: [地中海, 交易]
    summary: 地中海一帯に交易網と植民市を広げ、アルファベットを各地に伝えた。
    detail: |
      地中海の東岸、現在のレバノンを中心に栄えた都市の連合。
      ティルス・シドン・ビブロスなどが、それぞれ独立した都市国家として並んだ。
      統一国家を作らず、交易と航海で地中海全体に影響を広げた。

      背景には土地の条件がある。
      背後にレバノン山脈が迫り、耕地が狭いため農業では生きられない。
      代わりに山のレバノン杉を伐り出し、船を造り、遠くへ売りに出た。
      主要な商品は、木材と染料と工芸品だった。
      貝から取る紫の染料は極めて高価で、王侯の衣の色として珍重される。
      フェニキアという名も、ギリシア語の紫に由来するとされる。
      ガラス・象牙細工・金属器も各地へ運ばれた。

      航海は地中海の全域に及んだ。
      北アフリカ、シチリア、サルデーニャ、イベリア半島に寄港地と植民市を築く。
      紀元前814年ごろに建てられたカルタゴは、後に西地中海の大国になった。
      アフリカ大陸を周航したという記録も残っている。

      最大の遺産は文字である。
      22の子音字だけで言葉を書ける仕組みを整え、商取引に用いた。
      これがギリシアに伝わって母音字が加えられ、ヨーロッパの文字の祖になる。
      東へはアラム文字として広がり、ヘブライ文字やアラビア文字の源にもなった。
      都市はアッシリアと新バビロニアに次々と服属し、紀元前539年にペルシアの支配下に入った。
      国家としての独立は失われたが、交易の網と文字は各地に残り続ける。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Phoenicia_map-en.svg/500px-Phoenicia_map-en.svg.png
      credit: Kordas, based on Alvaro's work / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:Phoenicia_map-en.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/フェニキア

  - id: israel-kingdom
    title: イスラエル・ユダ王国
    start: -1020
    startCirca: true
    end: -586
    category: religion
    tags: [ユダヤ教]
    summary: ダビデ・ソロモンの王国と分裂後の王国。一神教の伝統がここで形を得た。
    detail: |
      地中海東岸に存在した古代イスラエルの王国で、紀元前11世紀から6世紀まで続いた。
      サウル・ダビデ・ソロモンの統一王国の後、北のイスラエル王国と南のユダ王国に分かれる。
      一神教の伝統が、この王国の歴史のなかで形を得た。

      伝承によれば、周辺のペリシテ人との戦いのなかでサウルが最初の王に立てられた。
      次のダビデがエルサレムを都とし、子のソロモンが神殿を建てたとされる。
      栄華をきわめたと語られるが、同時代の考古資料は乏しく、規模については議論がある。
      ソロモンの死後、王国は南北に分裂した。
      北のイスラエル王国は肥沃で人口も多く、周辺の国と交流が深い。
      南のユダ王国は山がちで小さいが、エルサレムの神殿を擁していた。

      紀元前722年、北王国はアッシリアに滅ぼされ、住民は各地へ移住させられる。
      南のユダ王国は貢納によって存続したが、紀元前586年に新バビロニアに滅ぼされた。
      神殿は破壊され、指導層はバビロンへ連れ去られる。

      国土と神殿を失った経験が、信仰の形を変えた。
      特定の土地や建物に依存せず、律法と共同体によって神との関係を保つという考えが育つ。
      預言者たちは、敗北を神の罰として説明し、唯一の神への信仰を鮮明にした。
      この過程で聖書の主要な部分が編まれ、ユダヤ教の基礎ができる。
      そこから後に、キリスト教とイスラム教が生まれることになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Kingdoms_of_Israel_and_Judah_map_830.svg/500px-Kingdoms_of_Israel_and_Judah_map_830.svg.png
      credit: "Oldtidens_Israel_&_Judea.svg: FinnWikiNo derivative work: Richardprins (talk) / CC BY-SA 3.0"
      page: https://commons.wikimedia.org/wiki/File:Kingdoms_of_Israel_and_Judah_map_830.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/ユダ王国

  - id: neo-assyria
    title: 新アッシリア帝国
    start: -911
    end: -609
    category: war
    tags: [メソポタミア, 軍事]
    summary: 鉄製武器と騎兵でオリエントを初めて統一した軍事帝国。
    detail: |
      上メソポタミアを本拠に、オリエントの広い範囲を初めて一つにまとめた帝国。
      紀元前911年から609年まで続いた。
      鉄製の武器と組織された軍で知られる、徹底した軍事国家だった。

      アッシリアはもともと、ティグリス川上流の交易都市から始まった。
      紀元前10世紀以降、周囲の混乱に乗じて再び勢力を伸ばす。
      毎年のように遠征を行い、服属した国から貢納を取り立てた。
      軍事の面での革新が多い。
      鉄製の武具を大量に装備し、騎兵と戦車と歩兵を組み合わせて運用した。
      攻城用の櫓や破城槌を備えた工兵部隊を持ち、城壁のある都市を落とせる。
      街道と伝令の制度を整え、遠方の情報を速く集めた。

      支配の方法は苛烈だった。
      抵抗した都市は住民を虐殺し、その様子を碑文と浮彫で誇示する。
      征服地の住民を遠くへ強制的に移住させ、反乱の基盤を壊した。
      恐怖によって従わせる統治は、広い領域を少ない兵で押さえるための手段でもある。

      紀元前671年にはエジプトを征服し、支配は最大に達した。
      しかし広がりすぎた版図は各地の反乱を招き、財政と兵力を消耗させる。
      紀元前612年、新バビロニアとメディアの連合軍に都のニネヴェを落とされた。
      609年に残存勢力も滅び、帝国は跡形もなく消える。
      行政の区分や駅伝の仕組みは、ペルシア帝国に受け継がれた。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/%E3%82%A2%E3%83%83%E3%82%B7%E3%83%AA%E3%82%A2%E5%B8%9D%E5%9B%BD%E3%81%AE%E7%89%88%E5%9B%B3%EF%BC%88%E5%89%8D%EF%BC%99%EF%BD%9E%EF%BC%97%E4%B8%96%E7%B4%80%EF%BC%89.png/500px-%E3%82%A2%E3%83%83%E3%82%B7%E3%83%AA%E3%82%A2%E5%B8%9D%E5%9B%BD%E3%81%AE%E7%89%88%E5%9B%B3%EF%BC%88%E5%89%8D%EF%BC%99%EF%BD%9E%EF%BC%97%E4%B8%96%E7%B4%80%EF%BC%89.png
      credit: Ningyou / CC0
      page: https://commons.wikimedia.org/wiki/File:%E3%82%A2%E3%83%83%E3%82%B7%E3%83%AA%E3%82%A2%E5%B8%9D%E5%9B%BD%E3%81%AE%E7%89%88%E5%9B%B3%EF%BC%88%E5%89%8D%EF%BC%99%EF%BD%9E%EF%BC%97%E4%B8%96%E7%B4%80%EF%BC%89.png
    links:
