        url: https://ja.wikipedia.org/wiki/バグダードの戦い

  - id: ain-jalut
    year: 1260
    title: アイン・ジャールートの戦い
    category: war
    tags: [マムルーク, モンゴル]
    summary: モンゴルの西進を初めて止め、エジプトがイスラム世界の中心になった。
    detail: |
      マムルーク朝の軍がモンゴル軍を破った戦いで、1260年にパレスチナのアイン・ジャールートで行われた。
      モンゴルが野戦で決定的な敗北を喫した最初の例とされる。
      これによってモンゴルの西進は止まった。

      フレグ率いるモンゴル軍は、1258年にバグダードを落とし、シリアへ進んでいた。
      アレッポとダマスカスを占領し、エジプトにも降伏を求める使者を送る。
      そこへ大ハーンの死の報せが届き、フレグは主力を率いて東へ引き返した。
      シリアに残されたのは、キトブカ率いる一部の軍だけだった。

      エジプトのマムルーク朝は、使者を殺して戦う道を選んだ。
      スルタンのクトゥズとバイバルスが軍を率いて北上する。
      十字軍国家は中立を保ち、マムルーク軍の通過を黙認した。
      戦いでは、バイバルスの部隊が先に接触して偽りの退却を行った。
      追撃したモンゴル軍は伏兵に囲まれ、キトブカは戦死する。
      マムルーク側もモンゴルと同じ草原の出身で、騎射の戦法を熟知していたことが大きい。

      この勝利によって、シリアはマムルーク朝の支配下に入った。
      モンゴルは無敵ではないという認識が広がり、各地の抵抗を勇気づける。
      エジプトはイスラム世界の政治的な中心としての地位を確立した。
      戦いの後、バイバルスはクトゥズを倒して自らスルタンとなる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Campaign_of_the_Battle_of_Ain_Jalut_1260.svg/500px-Campaign_of_the_Battle_of_Ain_Jalut_1260.svg.png
      credit: MapMaster / CC BY 3.0
      page: https://commons.wikimedia.org/wiki/File:Campaign_of_the_Battle_of_Ain_Jalut_1260.svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/アイン・ジャールートの戦い

  - id: ibn-khaldun
    year: 1377
    title: イブン・ハルドゥーン『歴史序説』
    category: religion
    tags: [歴史学, 思想]
    summary: 王朝の盛衰を社会の仕組みから説明し、歴史学と社会学の先駆けとなった。
    detail: |
      北アフリカ出身の学者が1377年に書き上げた、歴史書の序論にあたる大著。
      王朝の盛衰を、社会の仕組みから説明しようとした。
      歴史学と社会学の先駆けとして評価されている。

      著者は1332年にチュニスに生まれ、各地の宮廷に仕えた政治家でもあった。
      政変と亡命を繰り返す経験が、権力の性質への冷徹な観察につながっている。
      隠棲した城で数か月のうちに本編を書き上げたと伝えられる。
      中心となる概念は、集団の連帯意識である。
      厳しい環境で暮らす遊牧民は、血縁と苦労を共有するため結束が強い。
      その力で都市の王朝を倒し、支配者になる。

      しかし都市の豊かさに慣れると、連帯意識は薄れていく。
      二代、三代と進むうちに、贅沢と分業が進んで結束は失われる。
      王朝は傭兵と税に頼るようになり、やがて新しい集団に倒される。
      この周期をおよそ三世代、120年ほどと見積もった。

      議論は経済にも及ぶ。
      税率を上げすぎると生産が減って税収がかえって減ること、分業と都市の規模が豊かさを生むことが論じられた。
      当時の歴史書は、出来事を年代順に並べて教訓を引き出すものが多かった。
      イブン・ハルドゥーンは、記述が事実かどうかを社会の条件から検証すべきだと説く。
      19世紀にヨーロッパで再発見され、近代の社会科学の先駆と評価されるようになった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Ibn_Khaldoun-Kassus.jpg/500px-Ibn_Khaldoun-Kassus.jpg
      credit: Kassus / CC BY 2.5
      page: https://commons.wikimedia.org/wiki/File:Ibn_Khaldoun-Kassus.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/イブン・ハルドゥーン

  - id: ottoman-egypt
    year: 1517
    title: オスマン帝国のエジプト征服
    category: politics
    tags: [オスマン, カリフ]
    summary: 聖地の保護者となり、スンナ派イスラム世界の盟主の地位を得た。
    detail: |
      オスマン帝国がマムルーク朝を滅ぼし、エジプトを支配下に置いた出来事。
      1517年のことで、前年からのシリア侵攻に続くものである。
      これによってオスマンはスンナ派イスラム世界の盟主の地位を得た。

      マムルーク朝は、13世紀以来エジプトとシリアを支配してきた。
      モンゴルを撃退し、十字軍国家を一掃した実績を持つ。
      しかし騎兵と個人の武勇を重んじる軍制のまま、火器の導入が遅れていた。
      1516年、シリア北部での戦いでマムルーク軍は大砲と鉄砲を備えたオスマン軍に敗れた。
      スルタンは戦死し、ダマスカスが降伏する。
      翌1517年、カイロ近郊の戦いでも敗れ、最後のスルタンは処刑された。

      征服の意味は領土の拡大にとどまらない。
      メッカとメディナを保護する権利が、オスマンのスルタンに移った。
      聖地の守護者という称号は、イスラム世界で特別な重みを持つ。
      エジプトの豊かな穀物とナイルの税収も帝国の財源になった。

      カイロに保護されていたアッバース家の末裔も、イスタンブルへ移されたとされる。
      カリフの称号がこのとき譲られたという説話は後世のものだが、スルタンの権威を語る根拠として使われ続けた。
      エジプトは総督が治める州となり、19世紀までオスマンの宗主権のもとに置かれる。
      イスラム世界の政治的な中心が、アナトリアへ移ったことを示す出来事だった。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8e/Flag_of_the_Ottoman_Empire_%281844%E2%80%931922%29.svg/500px-Flag_of_the_Ottoman_Empire_%281844%E2%80%931922%29.svg.png
      credit: User:Orwellianist / Public domain
      page: https://commons.wikimedia.org/wiki/File:Flag_of_the_Ottoman_Empire_(1844%E2%80%931922).svg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/オスマン帝国

  - id: vienna-siege-1
    year: 1529
    title: 第一次ウィーン包囲
    category: war
    tags: [オスマン, ヨーロッパ]
    summary: オスマンが中欧に迫った衝撃は、ヨーロッパの対外意識を長く規定した。
    detail: |
      オスマン帝国のスレイマン1世が、ハプスブルク家の都ウィーンを包囲した出来事。
      1529年の秋、2か月近くにわたって行われた。
      オスマンが中欧にまで迫ったことは、ヨーロッパの対外意識を長く規定した。

      前提には、1526年のモハーチの戦いがある。
      ハンガリー王国軍が壊滅し、王が戦死したことで、王位の継承をめぐる争いが起きた。
      オスマンは一方を支持し、ハプスブルク家がもう一方を主張する。
      ハンガリーの帰属をめぐる対立が、そのままウィーンへの進軍につながった。
      スレイマンは10万を超える軍を率いて北上した。
      しかし長雨で道がぬかるみ、重い攻城砲を運べなかった。
      到着は9月末で、冬の到来が迫っている。

      守るウィーンの兵は2万ほどだったが、城壁を補強して耐えた。
      坑道を掘って城壁の下を爆破する試みも、防御側の反撃で失敗する。
      10月中旬、オスマン軍は包囲を解いて引き上げた。
      撤退の途中で多くの兵と捕虜を失っている。

      軍事的には決着がつかなかったが、心理的な影響は大きかった。
      ヨーロッパでは、トルコの脅威という語が長く政治の言葉になる。
      プロテスタントとカトリックの対立にも影響し、皇帝が国内の妥協を迫られる要因になった。
      ハンガリーは分割され、以後150年にわたって両勢力の係争地であり続ける。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f6/Siegeofvienna1529.jpg/500px-Siegeofvienna1529.jpg
      credit: Bartel Beham / Public domain
      page: https://commons.wikimedia.org/wiki/File:Siegeofvienna1529.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第一次ウィーン包囲

  - id: vienna-siege-2
    year: 1683
    title: 第二次ウィーン包囲
    category: war
    tags: [オスマン, ヨーロッパ]
    summary: 敗北を境にオスマンは後退に転じ、力関係が逆転していく。
    detail: |
      オスマン帝国が行った最後の大規模なヨーロッパ侵攻で、1683年にウィーンを包囲した。
      2か月の包囲の末、救援に来たポーランド軍などに敗れた。
      この敗北を境に、オスマンは後退に転じる。

      宰相カラ・ムスタファは、ハンガリーの反ハプスブルク勢力の要請を受けて北上した。
      兵力は15万に及ぶとされる。
      ウィーンの守備隊は1万数千で、皇帝は都を脱出していた。
      包囲は7月から始まった。
      坑道を掘って城壁を爆破する作戦が進み、市街は食糧も尽きかけていた。
      一方でオスマン側も、陣地の拡張に手を広げて背後の備えを怠る。

      教皇の呼びかけで、ドイツ諸侯とポーランド王ヤン3世ソビエスキの軍が集まった。
      9月12日、丘の上から重装騎兵が突撃し、オスマン軍は総崩れになる。
      宰相は退却後に処刑された。
      以後、ハプスブルク側が攻勢に転じた。
      ハンガリー全域が奪回され、1699年のカルロヴィッツ条約でオスマンは初めて大きな領土を割譲する。
      条約の交渉でも、対等ではなく譲歩する側に立った。

      軍事技術と財政で西欧に後れを取ったことが、この時期に明確になる。
      オスマンの脅威という前提が消え、ヨーロッパの勢力均衡の構図が変わった。
      以後の帝国は、失地の回復ではなく維持と改革を課題とすることになる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/Battle_of_Vienna_1683_11.PNG/500px-Battle_of_Vienna_1683_11.PNG
      credit: 作者不明 / Public domain
      page: https://commons.wikimedia.org/wiki/File:Battle_of_Vienna_1683_11.PNG
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/第二次ウィーン包囲

  - id: tulip-period
    year: 1718
    title: チューリップ時代
    category: culture
    tags: [オスマン, 西欧化]
    summary: ヨーロッパの文物を積極的に取り入れた時期。印刷所も初めて置かれた。
    detail: |
      18世紀前半のオスマン帝国で、西欧の文物を積極的に取り入れた時期。
      1718年の講和から1730年の反乱までのおよそ12年を指す。
      宮廷で流行したチューリップにちなんで名づけられた。

      前提は、対外政策の転換である。
      1718年のパッサロヴィッツ条約で領土を失い、軍事的な拡大の限界が明らかになった。
      代わりに、内政の整備と文化の振興に重点が置かれる。
      パリへ送られた使節は、宮殿・庭園・工場・病院を見て詳細な報告を残した。
      その影響で、ボスポラス海峡沿いに離宮や庭園が造られる。
      建築や装飾に西欧の意匠が取り入れられ、絵画では遠近法が試された。

      チューリップはもともとアナトリア原産で、16世紀にヨーロッパへ渡って改良された品種が逆輸入された。
      宮廷では珍しい品種を競って集め、夜の庭園で鑑賞する催しが開かれる。
      球根の価格が高騰し、投機的な取引も生まれた。
      最も持続的な成果は印刷所である。
      1727年、ハンガリー出身の改宗者がアラビア文字の活版印刷所を開いた。
      宗教書は対象外とされたが、地理・歴史・辞書などが印刷される。

      宮廷の浪費と戦費のための増税は、都市の民衆の不満を高めた。
      1730年の反乱で宰相は殺され、スルタンは退位し、離宮は破壊される。
      西欧に学ぶ試みと、それに対する反発という構図が、この時期に始まった。
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/5/55/Levni_signature.jpg
      credit: レヴニー / Public domain
      page: https://commons.wikimedia.org/wiki/File:Levni_signature.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/チューリップ時代

  - id: tanzimat
    year: 1839
    title: タンジマート（オスマンの改革）
    category: society
    tags: [オスマン, 近代化]
    summary: 法と軍と教育を西欧式に作り替えたが、帝国の解体は止められなかった。
    detail: |
      オスマン帝国が1839年から進めた、法と行政の西欧式への改革。
      再編成を意味する語で、ギュルハネ勅令の発布から始まる。
      帝国の解体を防ぐことが目的だった。

      勅令は、宗教や民族によらずすべての臣民の生命・名誉・財産を保障すると宣言した。
      公正な裁判なしに処罰されないこと、税を公平に課すこと、徴兵を規則に従って行うことが約束される。
      イスラム国家において、ムスリムと非ムスリムの法的な平等を掲げた点が画期的だった。
      背景には、内外の事情がある。
      各地の分離独立の動きを抑えるには、非ムスリムの臣民をつなぎとめる必要があった。
      同時に、ヨーロッパ列強の干渉の口実を減らす狙いもある。

      具体的には、フランスを手本とする法典が編まれた。
      商法と刑法が制定され、世俗の裁判所が設けられる。
      州の行政が整理され、近代的な学校と師範学校が作られた。
      1856年の改革勅令でさらに平等が強調され、1876年には憲法と議会が生まれる。

      しかし、改革は多くの反発を招いた。
      ムスリムの側からは伝統の否定と受け取られ、非ムスリムの側からは不十分と見られる。
      官僚機構は肥大し、外債に依存した財政は1875年に破綻した。
      憲法は2年で停止され、帝国の解体も止まらなかった。
      それでも、この時期に育った官僚と軍人が、後の青年トルコ人と共和国の担い手になる。
    image:
      url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Edict_of_G%C3%BClhane.jpg/500px-Edict_of_G%C3%BClhane.jpg
      credit: Maldek™ / CC BY-SA 3.0
      page: https://commons.wikimedia.org/wiki/File:Edict_of_G%C3%BClhane.jpg
    links:
      - label: Wikipedia
        url: https://ja.wikipedia.org/wiki/タンジマート

  - id: persian-oil
    year: 1908
    title: ペルシアで石油が発見される
    category: economy
    tags: [中東, 石油]
    summary: 中東が世界のエネルギーの中心になり、列強の介入を招く原因になった。
    detail: |
      イラン南西部のマスジェデ・ソレイマーンで石油が噴出した出来事で、1908年のこと。
      中東で最初の商業的な油田の発見である。
      この地域が世界のエネルギーの中心になる出発点になった。

      イギリス人のダーシーは、1901年にガージャール朝から広大な地域の探査と採掘の利権を得ていた。
      7年にわたって資金を注ぎ込んだが成果が出ず、撤退の直前だったとされる。
      1908年5月、ついに石油が噴き出した。
      翌年、アングロ・ペルシアン石油会社が設立される。
      後のブリティッシュ・ペトロリアムであり、現在のBPにつながる。
      アーバーダーンに大規模な製油所が建設された。

      発見の時期は、海軍の動力が石炭から石油へ切り替わる時期と重なっていた。
      1914年、イギリス政府はこの会社の株式の過半を取得する。
      海軍の燃料を確保することが、国家の安全保障に直結すると判断されたためである。
      イラン側が得た利益はわずかだった。
      契約は会社に極端に有利で、この不公平が長く不満の種になる。
      1951年の石油国有化と、それに続く政変の背景には、この利権の記憶がある。

      以後、イラク・サウジアラビア・クウェートでも大規模な油田が見つかった。
      中東の政治は、列強の資源をめぐる関与と切り離せなくなる。
      国境線の引き方から現在の紛争まで、その影響は続いている。
    image:
